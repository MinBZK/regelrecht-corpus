preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om een deel van het speciaal onderwijs tezamen met het
    basisonderwijs te regelen in een Wet op het primair onderwijs, om een deel van het voortgezet speciaal onderwijs
    tezamen met het voortgezet onderwijs te regelen in de Wet op het voortgezet onderwijs, om het overige speciaal en
    voortgezet speciaal onderwijs te regelen in een Wet op de expertisecentra en om enige technische wijzigingen aan te
    brengen in enkele andere wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009525/2004-02-13#ArtikelAanhef
articles:
  - number: V
    text: |-
      1 De Overgangswet WBO wordt ingetrokken.

      2 De Overgangswet WBO zoals deze luidde op 31 juli 1998 blijft van toepassing op

      a. aanvragen die binnen de daarvoor geldende termijn zijn ingediend,

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend, en

      c. aanspraken die op die datum op grond van artikel E 17 of E 18 van die wet bestaan.

      3 Met ingang van het jaar 1986 ontvangt het bevoegd gezag van een bijzondere basisschool gevestigd in gebouwen en
      lokalen bedoeld in de artikelen 62, 126 en 127 van de Kleuteronderwijswet en de artikelen 84, 205 en 205bis van de
      Lager-onderwijswet 1920 jaarlijks van de gemeente een vergoeding.

      4 Burgemeester en wethouders kunnen de jaarlijkse vergoeding bedoeld in het derde lid, vervangen door een uitkering
      ineens, indien het bevoegd gezag dat eigenaar is van de voor vergoeding in aanmerking komende gebouwen, dit
      verzoekt.

      5 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitvoering van het derde lid.
      Deze algemene maatregel van bestuur bepaalt tevens de verplichtingen van het bevoegd gezag ten opzichte van de
      gemeente, indien de gebouwen en lokalen bedoeld in artikel 126 van de Kleuteronderwijswet en artikel 205 van de
      Lager-onderwijswet 1920, niet meer voor het basisonderwijs worden gebruikt.

      6 De algemene maatregel van bestuur bedoeld in het vijfde lid, wordt aan de Tweede Kamer der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 30 dagen na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens de Kamer de wens te kennen wordt gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsontwerp zo spoedig mogelijk ingediend.

      7 De algemene maatregel van bestuur die op grond van artikel E 35, vierde lid, van de Overgangswet WBO tot stand is
      gekomen, geldt met ingang van 1 augustus 1998 als algemene maatregel van bestuur, gebaseerd op het vijfde lid.

      8 De op 31 juli 1998 uit de openbare kassen bekostigde scholen, uitgaande van de Stichting Muziekinstituut van de
      Kathedraal St. Bavo te Haarlem, onderscheidenlijk van de Stichting Nederlands Instituut voor Katholieke Kerkmuziek
      te Utrecht, ten behoeve waarvan op grond van artikel 3, tweede lid, van de Lager-onderwijswet 1920 vergunning is
      verleend dat deze scholen minder dan 6 achtereenvolgende leerjaren omvatten, worden bekostigd als basisscholen,
      waarbij:

      a. op deze scholen de bepalingen van de [Wet op het primair onderwijs][ref1] voorzover mogelijk van overeenkomstige
      toepassing zijn, met dien verstande dat het onderwijs is bestemd voor kinderen vanaf de leeftijd van omstreeks 8
      jaar, en

      b. voor deze scholen voor de toepassing van [artikel 153, eerste lid, van de Wet op het primair onderwijs][ref2]
      als opheffingsnorm het getal 45 geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel153
