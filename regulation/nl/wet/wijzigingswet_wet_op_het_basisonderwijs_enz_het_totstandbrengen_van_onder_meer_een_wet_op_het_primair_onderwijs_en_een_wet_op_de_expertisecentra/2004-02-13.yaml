  - number: XLVIII
    text: |-
      1 Voor de periode vanaf 1 augustus 1998 tot en met 31 december 1998 wordt de vergoeding voor de materiële
      instandhouding voor basisscholen in afwijking van [artikel 92 van de Wet op het primair onderwijs][ref1] bepaald
      met toepassing van de [Wet op het basisonderwijs][ref2] en de daarop gebaseerde algemeen verbindende voorschriften
      en terzake vastgestelde beleidsregels, zoals deze luidden op 31 juli 1998.

      2 Het eerste lid is onverminderd [artikel 92, vijfde lid, van de Wet op het basisonderwijs][ref3] zoals
      deze luidde op 31 juli 1998 van overeenkomstige toepassing op de periode vanaf 1 januari 1999 tot en met
      31 december 1999, met dien verstande dat de teldatum 1 oktober 1998 onderscheidenlijk, bij toepassing
      van [artikel 100, zevende lid, van de Wet op het primair onderwijs][ref4] 1 maart 1999 wordt gehanteerd
      en de bedragen in de programma's van eisen met ingang van 1 januari 1999 worden aangepast overeenkomstig
      [artikel 92, zesde lid, van de Wet op het basisonderwijs][ref5], zoals deze luidde op 31 juli 1998.

      3 Basisscholen die deel uitmaken van een samenwerkingsverband dat de instemming, bedoeld in artikel 13a, zevende
      lid, heeft verkregen, hebben in de periode van 1 januari 1999 tot en met 31 december 1999 aanspraak op een bij
      ministeriële regeling te bepalen bedrag vermenigvuldigd met 2% van het aantal leerlingen van de school op de voor
      de desbetreffende periode geldende teldatum.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0003420
