  - number: XLVI
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap kan, voor de eerste maal met ingang van 1 augustus 1999,
      op aanvraag van de bevoegde gezagsorganen van de gezamenlijke basisscholen in een samenwerkingsverband besluiten
      extra formatierekeneenheden toe te kennen aan het bevoegd gezag van alle scholen in een samenwerkingsverband,
      dan wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur van de centrale
      dienst van het verband, voor zover de zorgformatie voor de basisscholen, vermeerderd met de overgangsformatie als
      bedoeld in [artikel XLV, tweede lid][ref1], ontoereikend is om te voldoen aan de overdrachtsverplichting ingevolge
      [artikel XLIV][ref2].

      2 Een aanvraag als bedoeld in het eerste lid wordt slechts ingewilligd indien

      a. het betrokken bevoegd gezag of het bestuur van de betrokken centrale dienst aanspraak maakt op overgangsformatie
      als bedoeld in [artikel XLV, tweede lid][ref3], en

      b. het betrokken bevoegd gezag of de betrokken bevoegde gezagsorganen aantonen zich voldoende te hebben ingespannen
      om personeelsleden met een werkgelegenheidsgarantie te herplaatsen in functies als bedoeld in [artikel XLII][ref4]
      aan basisscholen in het desbetreffende samenwerkingsverband.

      3 Een aanvraag als bedoeld in het eerste lid wordt niet ingewilligd voor zover dit verzoek betrekking heeft op de
      meerdere overgedragen formatie als bedoeld in [artikel XLIV, derde lid][ref5], tweede volzin.

      4 De [artikelen 13b, tweede lid, onder b][ref6], en [114b, zesde lid, van de Wet op het primair onderwijs][ref7]
      zijn van overeenkomstige toepassing.


