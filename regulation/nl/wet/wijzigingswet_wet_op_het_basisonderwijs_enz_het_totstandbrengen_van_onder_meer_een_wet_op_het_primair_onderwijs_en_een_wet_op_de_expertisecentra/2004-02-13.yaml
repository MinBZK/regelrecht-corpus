  - number: XXXVI
    text: |-
      1 Met ingang van 1 augustus 1998 komt behoudens het gestelde in het tweede lid voor bekostiging op grond van deel
      II van de [Wet op het voortgezet onderwijs][ref1] in aanmerking een school voor voortgezet speciaal onderwijs aan
      kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen.

      2 [Artikel XXXIII, derde lid][ref2], is van overeenkomstige toepassing.

      3 Het dienstverband met het personeel wordt voortgezet voor zover het gezien de op 31 juli 1998 geldende rechten en
      verplichtingen op 1 augustus 1998 zou zijn gehandhaafd.


