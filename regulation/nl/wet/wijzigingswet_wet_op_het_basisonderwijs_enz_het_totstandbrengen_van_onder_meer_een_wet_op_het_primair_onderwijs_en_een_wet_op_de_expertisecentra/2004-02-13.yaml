  - number: XXXIV
    text: |-
      1 Met ingang van 1 augustus 1998 kan aan een speciale school voor basisonderwijs een nevenvestiging verbonden zijn
      indien

      a. de nevenvestiging op 31 juli 1998 bekostigd werd als

      1°. een zelfstandige school voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk
      lerende kinderen,

      2°. een scholengemeenschap voor speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden en moeilijk
      lerende kinderen,

      3°. het speciaal onderwijs van een zelfstandige school voor speciaal en voortgezet speciaal onderwijs aan kinderen
      met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen,

      4°. het speciaal onderwijs van een scholengemeenschap voor speciaal en voortgezet speciaal onderwijs aan kinderen
      met leer- en opvoedingsmoeilijkheden en moeilijk lerende kinderen,

      b. ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en

      c. van de omvorming tot nevenvestiging voor 1 mei 1998 of, indien het Staatsblad waarin deze wet wordt geplaatst
      na 2 april 1998 wordt uitgegeven, binnen 4 weken na de datum van uitgifte van dat Staatsblad, mededeling is gedaan
      aan Onze Minister van Onderwijs, Cultuur en Wetenschappen en, indien het betreft een situatie als bedoeld onder b,
      onder overlegging van de opgave waaruit blijkt dat aan het vereiste onder b is voldaan.

      2 Bij de akte, bedoeld in het eerste lid onder b, worden tevens overgedragen de rechten die het bevoegd gezag van
      een school toekomen ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte
      wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder
      dezelfde voorwaarden als vermeld in de akte van aanstelling, aan de school aanstelt met ingang van de datum van
      overdracht.

      3 Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.

      4 Onze Minister van Onderwijs, Cultuur en Wetenschappen deelt voor 1 augustus 1998 of, indien het Staatsblad waarin
      deze wet wordt geplaatst na 2 april 1998 wordt uitgegeven, binnen 3 maanden volgend op de mededeling, bedoeld in
      het eerste lid onder c, aan het bevoegd gezag van de beoogde nevenvestiging schriftelijk mede of de nevenvestiging
      zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0009525/2004-02-13#ArtikelXXXIV
  - number: XXXV
    text: |-
      1 Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste juncto derde lid][ref1], en een personeelslid dat op 31 juli 1998 in dienst is bij dat
      bevoegd gezag wordt met ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor
      basisonderwijs die uit eerstgenoemde school of scholengemeenschap is ontstaan, ten behoeve van het verrichten van
      werkzaamheden voor de speciale school voor basisonderwijs voor zover

      a. het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en

      b. het personeelslid op 31 juli 1998 werkzaam was

      1°. binnen het speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen
      van eerstgenoemde school of scholengemeenschap of de daaraan verbonden afdeling voor in hun ontwikkeling bedreigde
      kleuters,

      2°. binnen het voortgezet speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende
      kinderen van eerstgenoemde school of scholengemeenschap en met toepassing van de afvloeiingsregeling, bedoeld in
      [hoofdstuk I-G van het Rechtspositiebesluit onderwijspersoneel][ref2], met ingang van 1 augustus 1998 werkzaam zal
      zijn voor de speciale school voor basisonderwijs, of

      3°. binnen een afdeling voor speciaal onderwijs aan zeer moeilijk lerende kinderen van
      eerstgenoemde school of scholengemeenschap en met toepassing van de afvloeiingsregeling, bedoeld in
      [hoofdstuk I-G van het Rechtspositiebesluit onderwijspersoneel][ref3] met ingang van 1 augustus 1998 werkzaam zal
      zijn voor de speciale school voor basisonderwijs.

      2 Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste lid, onderdeel c of d, juncto derde lid][ref4], en een personeelslid dat op 31 juli 1998
      in dienst is bij dat bevoegd gezag, wordt met ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de
      speciale school voor basisonderwijs die uit eerstgenoemde school of scholengemeenschap is ontstaan, ten behoeve van
      het verrichten van werkzaamheden aan de afdeling als bedoeld in [artikel XXXVII, eerste lid][ref5], voor zover

      a. het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en

      b. het personeelslid op 31 juli 1998 werkzaam was binnen het voortgezet speciaal onderwijs van eerstgenoemde school
      of scholengemeenschap.

      3 Het dienstverband tussen het bevoegd gezag van een school of scholengemeenschap als bedoeld in
      [artikel XXXIII, eerste juncto derde lid][ref6], waaraan een afdeling voor zeer moeilijk lerende kinderen is
      verbonden, en een personeelslid dat op 31 juli 1998 in dienst is bij dat bevoegd gezag, wordt met ingang van 1
      augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor basisonderwijs die uit die school of
      scholengemeenschap is ontstaan, ten behoeve van het verrichten van werkzaamheden aan de afdeling als bedoeld in
      [artikel XXXIII, tweede lid][ref7], voor zover

      a. het dienstverband gezien de op 31 juli 1998 geldende rechten en verplichtingen op 1 augustus 1998 zou zijn
      gehandhaafd, en

      b. het personeelslid op 31 juli 1998 werkzaam was binnen eerstgenoemde afdeling.

      4 De voortzetting per 1 augustus 1998 van een dienstverband als bedoeld in de voorgaande leden
      geschiedt zoveel mogelijk met inachtneming van de rechten en verplichtingen die onder de werking van de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref8] per die datum in dat
      dienstverband zouden hebben gegolden en, voor wat betreft personeelsleden als bedoeld in het eerste lid,
      onverminderd de [artikelen XLI tot en met XLIII][ref9] en [artikel XLVII][ref10].

      5 In afwijking van het eerste tot en met het derde lid wordt het dienstverband tussen het bevoegd gezag van een
      school of scholengemeenschap als bedoeld in die leden en de directeur van die school of scholengemeenschap met
      ingang van 1 augustus 1998 voortgezet door het bevoegd gezag van de speciale school voor basisonderwijs, ten
      behoeve van het verrichten van werkzaamheden aan zowel de speciale school voor basisonderwijs als de daaraan
      verbonden afdeling, voor zover het dienstverband, gezien de op 31 juli 1998 geldende rechten en verplichtingen, op
      1 augustus 1998 zou zijn gehandhaafd.


