  - number: XXX
    text: |-
      1 Bij ministeriële regeling worden regels vastgesteld of kunnen regels worden vastgesteld ten aanzien
      van onderwerpen waarvan deze wet bepaalt dat zij bij of krachtens algemene maatregel van bestuur worden
      onderscheidenlijk kunnen worden geregeld. De in de eerste volzin bedoelde regels vervallen met ingang van het
      tijdstip waarop de desbetreffende algemene maatregel van bestuur in werking treedt, doch uiterlijk twaalf maanden
      na het tijdstip waarop de bepaling waarop de algemene maatregel van bestuur berust, in werking is getreden.

      2 Voor zover deze wet daarin niet voorziet, alsmede indien nodig in afwijking van het bij en krachtens deze wet
      bepaalde, kunnen bij ministeriële regeling tijdelijke regels worden vastgesteld ten behoeve van een goede invoering
      van deze wet.

      3 Het ontwerp van een ministeriële regeling als bedoeld in het tweede lid wordt ten minste vier weken voordat de
      regeling wordt vastgesteld, toegezonden aan de beide kamers der StatenGeneraal.
    url: https://wetten.overheid.nl/BWBR0009525/2004-02-13#ArtikelXXX
  - number: XXXI
    text: |-
      1 Onze Minister van Onderwijs, Cultuur en Wetenschap kan bepalen dat de vergoedingen geheel of gedeeltelijk
      worden ingehouden, indien het bevoegd gezag van een openbare school, onderscheidenlijk het bevoegd gezag
      van een bijzondere school, de bij of krachtens de [artikelen XXX tot en met LV][ref1] gegeven voorschriften,
      onderscheidenlijk gestelde bekostigingsvoorwaarden, niet nakomt.

      2 Onze Minister van Onderwijs, Cultuur en Wetenschap kent de vergoedingen wederom toe, indien blijkt dat de reden
      voor toepassing van het eerste lid is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0009525#ArtikelXXX
