  - number: LII
    text: |-
      1 Voor het speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden, moeilijk
      lerende kinderen of in hun ontwikkeling bedreigde kleuters van scholen onderscheidenlijk
      afdelingen die op 31 juli 1998 voor bekostiging in aanmerking kwamen, vindt de toepassing
      van de overschrijdingsregeling voor de periode tot en met die datum plaats op basis van de
      __REF000___________________________________________________________________________________________________________
      ____ zoals die luidden op die datum. De termijnen waarop de laatste vaststellingen, bedoeld in
      [artikel 102d, zesde en zevende lid][ref2], en [artikel 102e, eerste lid, van die wet][ref3] betrekking hebben,
      eindigen op die datum en worden dienovereenkomstig ingekort.

      2 Voor speciale scholen voor basisonderwijs vindt de toepassing van de overschrijdingsregeling voor de periode vanaf
      1 augustus 1998 plaats op basis van de [artikelen 105b tot en met 105g van de Wet op het primair onderwijs][ref4].
      De termijnen waarop de eerste vaststellingen, bedoeld in [artikel 105d, eerste, zesde en zevende lid][ref5], en
      [artikel 105e, eerste lid, van die wet][ref6] betrekking hebben, beginnen op die datum en worden dienovereenkomstig
      ingekort. De termijn waarop de eerste vaststelling, bedoeld in [artikel 105c, van die wet][ref7] betrekking heeft,
      begint op 1 januari 1999.


