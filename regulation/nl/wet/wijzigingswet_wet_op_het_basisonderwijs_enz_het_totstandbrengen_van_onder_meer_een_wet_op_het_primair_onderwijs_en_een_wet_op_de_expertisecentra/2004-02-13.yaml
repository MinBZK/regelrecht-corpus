  - number: VI
    text: |-
      1 De Overgangswet ISOVSO wordt ingetrokken.

      2 De Overgangswet ISOVSO zoals deze luidde op 31 juli 1998 blijft van toepassing op

      a. aanvragen die binnen de daarvoor geldende termijn zijn ingediend,

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend, en

      c. aanspraken die op die datum op grond van artikel E 16, E 17 of E 18 van die wet bestaan, met dien verstande dat
      in artikel E 18 van die wet onder« een school voor speciaal onderwijs» tevens wordt begrepen: een speciale school
      voor basisonderwijs..

      3 Met ingang van het jaar 1989 ontvangt het bevoegd gezag van een bijzondere school voor speciaal onderwijs, voor
      voortgezet speciaal onderwijs dan wel voor speciaal en voortgezet speciaal onderwijs of een bijzondere speciale
      school voor basisonderwijs, gevestigd in gebouwen bedoeld in artikel 205 van de Lager-onderwijswet 1920 en in
      artikel 184 van het Besluit buitengewoon onderwijs 1967 (Stb. 1978, 582), jaarlijks van de gemeente een vergoeding
      per lokaal.

      4 Burgemeester en wethouders kunnen de jaarlijkse vergoeding bedoeld in het derde lid, vervangen door een uitkering
      ineens, indien het bevoegd gezag dat eigenaar is van de voor vergoeding in aanmerking komende gebouwen, dit
      verzoekt.

      5 Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de uitvoering van het derde lid.
      Deze algemene maatregel van bestuur bepaalt tevens de verplichtingen van het bevoegd gezag ten opzichte van de
      gemeente, indien de gebouwen bedoeld in het derde lid, niet meer voor het geven van speciaal onderwijs, voortgezet
      speciaal onderwijs of basisonderwijs worden gebruikt.

      6 Geschillen tussen de gemeente en het bevoegd gezag over de toepassing van het bij of krachtens dit artikel
      bepaalde, worden onderworpen aan de beslissing van gedeputeerde staten, tenzij het geschillen betreft ter zake
      van gebouwen als bedoeld in artikel 184 van het Besluit buitengewoon onderwijs 1967, welke geschillen worden
      onderworpen aan de beslissing van de Minister van Onderwijs, Cultuur en Wetenschap.

      7 De algemene maatregel van bestuur die op grond van [artikel E24, vierde lid, van de Overgangswet ISOVSO]
      (onbekend) tot stand is gekomen, geldt met ingang van 1 augustus 1998 als algemene maatregel van bestuur, gebaseerd
      op het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009525/2004-02-13#ArtikelVI
