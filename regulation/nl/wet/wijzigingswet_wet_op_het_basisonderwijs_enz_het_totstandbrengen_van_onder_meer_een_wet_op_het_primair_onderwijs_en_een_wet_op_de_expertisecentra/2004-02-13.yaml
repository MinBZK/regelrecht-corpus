  - number: XLII
    text: |-
      1 Herplaatsing van een personeelslid met een werkgelegenheidsgarantie geschiedt zo mogelijk in een functie of
      functies met dezelfde omvang, dezelfde inhoud, dezelfde maximumschaal en hetzelfde carrièrepatroon als de functie
      waaruit ontslag wordt verleend, met dien verstande dat

      a. leraren en directieleden ten minste in aanmerking komen voor de functie van groepsleraar basisonderwijs, dan
      wel een andere onderwijsgevende functie waarvan de maximumschaal niet lager is dan de maximumschaal behorende bij
      eerstgenoemde functie;

      b. voor een voormalig directeur de maximumschaal behorende bij de nieuwe functie niet meer dan twee schalen lager
      mag zijn dan de maximumschaal behorende bij de oude functie;

      c. voor een lid van het onderwijsondersteunend personeel de maximumschaal behorende bij de nieuwe functie niet meer
      dan één schaal lager mag zijn dan de maximumschaal behorende bij de oude functie.

      2 Een herplaatsing als bedoeld in het eerste lid geschiedt

      a. in een functie bij het bevoegd gezag van een school, instelling of centrale dienst als bedoeld in

      1°. de [Wet op het primair onderwijs][ref1],

      2°. de [Wet op de expertisecentra][ref2],

      3°. [deel II van de Wet op het voortgezet onderwijs](onbekend),

      b. in vaste dienst, en

      c. in een functie die is opgenomen in de formatie, bedoeld in
      [artikel I-P76, tweede lid, onder a, van het Rechtspositiebesluit onderwijspersoneel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0003771#ArtikelI-P76
