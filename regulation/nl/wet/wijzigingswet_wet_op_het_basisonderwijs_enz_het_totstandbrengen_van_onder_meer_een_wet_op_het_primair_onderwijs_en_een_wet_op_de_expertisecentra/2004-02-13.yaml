  - number: XLV
    text: |-
      1 Voor het schooljaar 1998–1999 wordt de formatie voor speciale scholen voor basisonderwijs in
      afwijking van [artikel 96b1 van de Wet op het primair onderwijs][ref1] bepaald met toepassing van het
      [Formatiebesluit ISOVSO 1992][ref2], zoals dat besluit luidde op 31 juli 1998, met dien verstande dat die formatie
      ten minste wordt bepaald op de formatie die de desbetreffende school op grond van genoemd besluit, respectievelijk
      de voor het schooljaar 1997–1998 geldende beleidsregels, op 31 juli 1998 van het Rijk ontving. Gedurende het
      schooljaar 1998–1999 vindt geen verhoging van de formatie plaats op grond van de artikelen 8 en 9 van genoemd
      besluit.

      2 Indien, in geval van toepasselijkheid van de [artikelen 96b1][ref3] en
      [96h van de Wet op het primair onderwijs][ref4], in een samenwerkingsverband de som van de zorgformatie voor de
      gezamenlijke scholen en de formatie krachtens [artikel 96b1, eerste lid, onder a en b, van genoemde wet][ref5] in
      het schooljaar 1998–1999 minder zou zijn geweest dan de formatie, bedoeld in het eerste lid, eerste volzin, die de
      speciale scholen voor basisonderwijs op 31 juli 1998 ontvingen, dan heeft het bevoegd gezag van alle scholen in een
      samenwerkingsverband, dan wel, indien verschillende bevoegde gezagsorganen samenwerken in het verband, het bestuur
      van de centrale dienst van het verband in de schooljaren 1999–2000 tot en met 2002–2003 aanspraak op het volgende
      percentage van het verschil:

      a. voor het schooljaar 1999–2000: 80%,

      b. voor het schooljaar 2000–2001: 60%,

      c. voor het schooljaar 2001–2002: 40%,

      d. voor het schooljaar 2002–2003: 20%.

      3 Indien de in het tweede lid bedoelde som in enig van de in dat lid genoemde schooljaren toeneemt, dan wordt het
      voor het desbetreffende schooljaar geldende percentage toegepast op het verschil tussen die toegenomen som en de
      formatie, bedoeld in het eerste lid, eerste volzin, die de speciale scholen voor basisonderwijs op 31 juli 1998
      ontvingen.

      4 Indien een speciale school voor basisonderwijs deelneemt in meer dan een samenwerkingsverband, dan wordt voor
      de toepassing van het tweede en derde lid de formatie welke die school op 31 juli 1998 ontving, toegerekend aan de
      samenwerkingsverbanden naar rato van het aantal basisschoolleerlingen van elk samenwerkingsverband.

      5 Voor de toepassing van de voorgaande leden worden de speciale scholen voor basisonderwijs in het
      schooljaar 1997–1998 aangemerkt als de scholen of scholengemeenschappen of delen daarvan, bedoeld in
      [artikel XXXIII, eerste lid][ref6], waaruit zij zijn ontstaan.

      6 De [artikelen 13b, tweede lid onder b][ref7], en [114b, zesde lid, van de Wet op het primair onderwijs][ref8]
      zijn van overeenkomstige toepassing.

      7 Bij of krachtens algemene maatregel van bestuur kunnen, zonodig in afwijking van dit artikel, nadere regels
      worden gesteld voor de berekening van de formatieve aanspraken ingevolge dit artikel.


