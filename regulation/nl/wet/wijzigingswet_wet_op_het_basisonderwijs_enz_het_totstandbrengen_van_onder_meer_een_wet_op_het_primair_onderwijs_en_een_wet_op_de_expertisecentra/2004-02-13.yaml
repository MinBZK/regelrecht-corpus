  - number: XL
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. personeelslid met een werkgelegenheidsgarantie: een personeelslid als bedoeld in
      [artikel XXXV, eerste lid][ref1], van wie de functie op 31 juli 1998 was opgenomen in de formatie als bedoeld in
      [artikel I-P76, tweede lid, onder a van het Rechtspositiebesluit onderwijspersoneel][ref2], voorzolang en voorzover
      dat personeelslid zonder onderbreking in dienst is bij

      1°. het bevoegd gezag van een speciale school voor basisonderwijs als bedoeld in [artikel XXXV, eerste lid][ref3],
      ten behoeve van het verrichten van werkzaamheden aan die school, of

      2°. het bevoegd gezag van een andere speciale school voor basisonderwijs waarbij dat personeelslid in aansluiting
      op het onder 1° bedoelde dienstverband wordt herplaatst in een functie als bedoeld in [artikel XLII][ref4] ten
      behoeve van het verrichten van werkzaamheden aan die school;

      b. samenwerkingsverband: een samenwerkingsverband als bedoeld in [artikel XXXII, eerste lid][ref5], dat is
      goedgekeurd door Onze Minister van Onderwijs, Cultuur en Wetenschappen;

      c. zorgformatie voor de basisscholen: de formatie die aan het bevoegd gezag van alle scholen in een
      samenwerkingsverband dan wel, indien verschillende bevoegde gezagsorganen samenwerken in een samenwerkingsverband,
      de centrale dienst op grond van [artikel 96h, eerste of tweede lid, van de Wet op het primair onderwijs][ref6] is
      toegekend, verminderd met de WSNS-faciliteiten ad f 28,– per basisschoolleerling die in het schooljaar 1998–1999
      ten behoeve van de basisscholen in het samenwerkingsverband zijn toegekend;

      d. zorgformatie voor de speciale scholen voor basisonderwijs: de formatie waarover de bevoegde gezagsorganen
      van de gezamenlijke scholen voor speciaal onderwijs in een samenwerkingsverband beschikken op grond van
      [artikel 96b1, eerste lid, onder c, van de Wet op het primair onderwijs][ref7];

      e. zorgformatie voor de gezamenlijke scholen: de som van de zorgformatie, bedoeld onder c en d.


