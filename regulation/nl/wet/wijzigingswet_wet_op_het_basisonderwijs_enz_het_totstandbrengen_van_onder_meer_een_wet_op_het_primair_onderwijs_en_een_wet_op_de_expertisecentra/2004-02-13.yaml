  - number: LI-1
    text: |-
      1 In afwijking van [artikel 92, eerste lid, van de Wet op het primair onderwijs][ref1]:

      a. gelden de bij ministeriële regeling van 29 september 1999 (Uitleg OCenW-regelingen 1999, nr. 24) vastgestelde
      programma's van eisen voor de basisscholen en de speciale scholen voor het basisonderwijs uitsluitend voor de jaren
      2000 en 2001; en

      b. begint op 1 januari 2002 een nieuwe periode van vijf jaar als bedoeld in dat lid.

      2 Met ingang van 1 januari 2002 gelden voor de periode, bedoeld in het eerste lid, onder b, de bij ministeriële
      regeling van 27 september 2001 (Uitleg OCenW-regelingen 2001, nr. 25) vastgestelde programma's van eisen
      basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel92
