  - number: LV-3
    text: |-
      1 Waar in overgangsbepalingen, bepalingen die toekomstige wijzigingen bevatten of
      inwerkingtredingsbepalingen van wetten wordt verwezen naar artikelen, hoofdstukken,
      titels, afdelingen en paragrafen van de [Wet op het basisonderwijs][ref1], de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref2],
      de [Wet op het primair onderwijs][ref3], de [Wet op de expertisecentra][ref4] of de
      [Wet op het voortgezet onderwijs][ref5] zoals luidend voor de plaatsing in het Staatsblad en de
      vernummering van artikelen, hoofdstukken, titels, afdelingen en paragrafen van de drie laatstgenoemde
      wetten, wordt geacht te zijn verwezen of mede te zijn verwezen naar de daarmee overeenstemmende
      artikelen, hoofdstukken, titels, afdelingen en paragrafen van de [Wet op het primair onderwijs][ref6],
      de [Wet op de expertisecentra][ref7] en de [Wet op het voortgezet onderwijs][ref8] zoals luidend na
      die plaatsing in het Staatsblad en vernummering. Daarbij worden verwijzingen naar onderdelen van de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref9] voor zover het betreft het
      voortgezet speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk lerende kinderen geacht
      te zijn gedaan naar de overeenkomstige onderdelen van [deel II van de Wet op het voortgezet onderwijs](onbekend).

      2 Waar in overgangsbepalingen, bepalingen die toekomstige wijzigingen bevatten of
      inwerkingtredingsbepalingen van wetten wordt verwezen naar de [Wet op het basisonderwijs][ref10] of de
      [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref11], wordt geacht te zijn verwezen
      naar de [Wet op het primair onderwijs][ref12] onderscheidenlijk de [Wet op de expertisecentra][ref13] of, voor
      zover het betreft het voortgezet speciaal onderwijs aan kinderen met leer- en opvoedingsmoeilijkheden of moeilijk
      lerende kinderen, naar [deel II van de Wet op het voortgezet onderwijs](onbekend).


