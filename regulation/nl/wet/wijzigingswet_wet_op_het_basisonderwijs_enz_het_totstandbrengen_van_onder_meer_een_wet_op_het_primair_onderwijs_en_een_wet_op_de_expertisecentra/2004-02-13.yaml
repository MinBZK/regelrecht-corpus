  - number: XLVII
    text: |-
      1 Een personeelslid met een werkgelegenheidsgarantie, wiens dienstbetrekking uitsluitend in stand kan worden
      gehouden met behulp van formatierekeneenheden als bedoeld in [artikel XLIV, eerste lid][ref1], is verplicht andere
      hem door het bevoegd gezag opgedragen werkzaamheden te verrichten aan de eigen of een andere instelling in het
      samenwerkingsverband, die in het kader van de door hem vervulde functie passend zijn te achten, dan wel een functie
      te aanvaarden als bedoeld in [artikel XLII][ref2] .

      2 In het schooljaar 1998–1999 is het eerste lid van toepassing ten aanzien van een personeelslid met een
      werkgelegenheidsgarantie wiens dienstbetrekking uitsluitend in stand kan worden gehouden met formatierekeneenheden
      als bedoeld in [artikel LI, onder b][ref3].

      3 Het bevoegd gezag kan een personeelslid als bedoeld in het eerste lid, wiens dienstbetrekking
      uitsluitend in stand kan worden gehouden met behulp van extra formatierekeneenheden als bedoeld
      in [artikel XLVI, eerste lid][ref4], tevens een scholingsplicht of een sollicitatieplicht
      opleggen. Op deze plichten zijn [artikel I-P84, derde lid][ref5], respectievelijk
      [ artikel I-P86 van het Rechtspositiebesluit onderwijspersoneel][ref6] van overeenkomstige toepassing, met
      dien verstande dat die plichten maximaal kunnen strekken tot scholing voor of sollicitatie naar een functie als
      bedoeld in [artikel XLII, eerste lid][ref7], bij het bevoegd gezag van een instelling in de sector Onderwijs en
      Wetenschappen.


