  - number: L
    text: |-
      1 In het schooljaar 1998–1999 wordt ten behoeve van besteding aan personele uitgaven aan de basisscholen naast de
      formatie, bedoeld in [artikel 96a, eerste lid onder a en b, van de Wet op het primair onderwijs][ref1] verstrekt:

      a. een bedrag van f 28,- per leerling op basis van 103% van het feitelijke aantal leerlingen op 1 oktober 1997, en

      b. in voorkomende gevallen het bedrag, bedoeld in het tweede lid.

      2 Indien in het schooljaar 1998–1999 in een samenwerkingsverband de som van de formatierekeneenheden op grond van
      de [artikelen 96b1][ref2] en [96h van de Wet op primair onderwijs][ref3] hoger zou zijn geweest dan de som van
      de op grond van [artikel XLV, eerste lid][ref4], toegekende formatierekeneenheden en de in formatierekeneenheden
      uitgedrukte middelen bedoeld in het eerste lid, onder a, wordt aan de gezamenlijke basisscholen in dat verband een
      bedrag toegekend dat overeen komt met de geldswaarde van het verschil tussen beide sommen. Het Rijk verdeelt dit
      bedrag naar rato van het aantal leerlingen van elk van die basisscholen op 1 oktober 1997.

      3 Indien een speciale school voor basisonderwijs deelneemt aan meer dan een samenwerkingsverband, dan wordt voor
      de toepassing van het tweede lid de formatie van die school toegerekend aan de samenwerkingsverbanden naar rato van
      het aantal basisschoolleerlingen van elk van die verbanden op 1 oktober 1997.

      4 In afwijking van [artikel 105i van de Wet op het primair onderwijs][ref5] en het eerste lid mag 10% van de
      vergoeding op grond van het eerste tot en met derde lid worden besteed aan materiële instandhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel96a
