      1 De tekst van de [Wet op het primair onderwijs][ref1] wordt in het Staatsblad geplaatst. Voor de plaatsing in het
      Staatsblad stelt Onze Minister van Onderwijs, Cultuur en Wetenschappen de nummering van de artikelen, hoofdstukken,
      titels, afdelingen en paragrafen van de [Wet op het primair onderwijs][ref2] opnieuw vast en brengt hij de in die
      en deze wet voorkomende aanhalingen en de inhoudsopgave met de nieuwe nummering op grond van dit artikel en de
      [artikelen VIII][ref3] en [IX][ref4] in overeenstemming.

      2 De koninklijke besluiten en ministeriële regelingen die op grond van de [Wet op het basisonderwijs][ref5] tot
      stand zijn gekomen, gelden met ingang van 1 augustus 1998 als koninklijke besluiten onderscheidenlijk ministeriële
      regelingen, gebaseerd op de [Wet op het primair onderwijs][ref6].


