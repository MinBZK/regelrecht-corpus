  - number: LV
    text: |-
      1 De [Wet op het basisonderwijs][ref1] en de daarop gebaseerde algemeen verbindende voorschriften en terzake
      vastgestelde beleidsregels zoals deze luidden op 31 juli 1998 blijven van toepassing op

      a. aanvragen die binnen de daarvoor gestelde termijn zijn ingediend op grond van

      1°. die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1 augustus 1998,

      2°. [artikel L][ref2] juncto die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1
      augustus 1999, en

      3°. [artikel XLVIII][ref3] juncto die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1
      januari 2000,

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend met betrekking tot

      1°. die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1 augustus 1998,

      2°. [artikel L][ref4] juncto die wet, voorschriften of beleidsregels, voor zover deze betrekking hebben op de
      periode voor 1 augustus 1999, en

      3°. [artikel XLVIII][ref5] juncto die wet, voorschriften of beleidsregels, voor zover deze betrekking hebben op de
      periode voor 1 januari 2000,

      c. de afrekening van de vergoedingen op grond van

      1°. die wet, voorschriften of beleidsregels voor de periode voor 1 augustus 1998,

      2°. [artikel L][ref6] juncto die wet, voorschriften of beleidsregels voor de periode voor 1 augustus 1999, en

      3°. [artikel XLVIII][ref7] juncto die wet, voorschriften of beleidsregels voor de periode voor 1 januari 2000.

      2 De [Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs][ref8] en de daarop gebaseerde
      algemeen verbindende voorschriften en terzake vastgestelde beleidsregels zoals deze luidden op 31 juli 1998 blijven
      van toepassing op

      a. aanvragen die binnen de daarvoor gestelde termijn zijn ingediend op grond van

      1°. die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1 augustus 1998,

      2°. [artikel XLV][ref9] juncto die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1
      augustus 1999, en

      3°. [artikel IL][ref10] juncto die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1
      januari 2000,

      b. bezwaarschriften en beroepschriften die binnen de daarvoor geldende termijn zijn ingediend met betrekking tot

      1°. die wet, voorschriften of beleidsregels en betrekking hebben op de periode voor 1 augustus 1998,

      2°. [artikel XLV][ref11] juncto die wet, voorschriften of beleidsregels, voor zover deze betrekking hebben op de
      periode voor 1 augustus 1999, en

      3°. [artikel IL][ref12] juncto die wet, voorschriften of beleidsregels, voor zover deze betrekking hebben op de
      periode voor 1 januari 2000,

      c. de afrekening van de vergoedingen op grond van

      1°. die wet, voorschriften of beleidsregels voor de periode voor 1 augustus 1998,

      2°. [artikel XLV][ref13] juncto die wet, voorschriften of beleidsregels voor de periode voor 1 augustus 1999, en

      3°. [artikel IL][ref14] juncto die wet, voorschriften of beleidsregels voor de periode voor 1 januari 2000.


