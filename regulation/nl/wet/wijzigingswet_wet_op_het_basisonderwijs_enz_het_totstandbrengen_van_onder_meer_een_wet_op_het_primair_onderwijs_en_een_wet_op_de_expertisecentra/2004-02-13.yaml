  - number: LI
    text: |-
      In het schooljaar 1998–1999 vindt [artikel 13b, tweede lid, onder b, van de Wet op het primair onderwijs][ref1]
      toepassing ten aanzien van

      a. de bedragen die aan de basisscholen in een samenwerkingsverband op grond van [artikel L][ref2] worden toegekend
      en

      b. indien de formatie, bedoeld in [artikel XLV, eerste lid][ref3], die voor het schooljaar 1998–1999 wordt
      toegekend gelijk is aan de formatie die de desbetreffende speciale school voor basisonderwijs op 31 juli 1998
      ontving, het in formatierekeneenheden uitgedrukte verschil met de formatie waarop die school in genoemd schooljaar
      op grond van het [Formatiebesluit ISOVSO 1992][ref4] recht zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel13b
