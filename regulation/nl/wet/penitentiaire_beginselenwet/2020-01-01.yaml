        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: 5.4.d
    text: |-
      de beperking en de intrekking van verlof, bedoeld in [artikel 26, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel26
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
  - number: 5.4.e
    text: |-
      het onderzoek in het lichaam, bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel31
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '31'
        hoofdstuk: VI
  - number: 5.4.f
    text: |-
      het gedogen van een geneeskundige handeling, bedoeld in [artikel 32][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel32
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '32'
        hoofdstuk: VI
  - number: 5.4.g
    text: |-
      het verrichten van geneeskundige behandeling als bedoeld in [artikel 46d, onder a of b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 5.4.h
    text: |-
      de bevestiging door mechanische middelen en de verlenging daarvan, bedoeld in
      [artikel 33, eerste onderscheidenlijk derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel33
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '33'
        hoofdstuk: VI
  - number: 5.4.i
    text: |-
      de oplegging van een disciplinaire straf, bedoeld in [artikel 51][ref1], en de toepassing van de
      [artikelen 52, eerste en tweede lid][ref2], en [53, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel53
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '51'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '52'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '53'
        hoofdstuk: IX
  - number: 5a.1
    text: De directeur meldt ongeoorloofde afwezigheid en andere bijzondere voorvallen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5a
  - number: 5a.2
    text: |-
      De directeur verstrekt Onze Minister te allen tijde alle verlangde inlichtingen. Onze Minister kan nadere regels
      stellen omtrent de inhoud en de wijze van melding.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5a
  - number: 5b.1
    text: |-
      De directeur stelt voor ambtenaren en medewerkers een meldcode vast waarin stapsgewijs wordt aangegeven hoe met
      signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo
      snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5b
  - number: 5b.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 5b.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 5b.4
    text: De directeur bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5b
  - number: 5b.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5b
  - number: '6'
    text: |-
      De Raad behandelt beroepschriften ingevolge de [hoofdstukken XII](onbekend), [XIII](onbekend) en [XV](onbekend),
      en[ hoofdstuk 7 van de Penitentiaire maatregel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009398#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009398
        hoofdstuk: '7'
  - number: '7.1'
    text: Bij elke inrichting dan wel afdeling wordt door Onze Minister een commissie van toezicht ingesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: '7.2'
    text: 'De commissie van toezicht heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: 7.2.a
    text: toezicht te houden op de wijze van tenuitvoerlegging van de vrijheidsbeneming in de inrichting of afdeling;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: 7.2.b
    text: kennis te nemen van door de gedetineerden naar voren gebrachte grieven;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: 7.2.c
    text: |-
      zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [hoofdstuk Xl][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XI
  - number: 7.2.d
    text: aan Onze Minister, de Raad en de directeur advies en inlichtingen te geven omtrent het onder a gestelde.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      De commissie van toezicht stelt zich door persoonlijk contact met de gedetineerden regelmatig op de hoogte van
      onder hen levende wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze van
      de commissie, de benoeming en het ontslag van haar leden alsmede over de werkzaamheden van de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister bepaalt de bestemming van elke inrichting of afdeling ingevolge de [artikelen 9 tot en met 14][ref1]
      en stelt regels voor de plaatsing en overplaatsing van de gedetineerden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel9
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '9'
        hoofdstuk: III
  - number: '8.2'
    text: Onze Minister kan delen van een inrichting als afdeling met een aparte bestemming aanwijzen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Inrichtingen zijn te onderscheiden in huizen van bewaring, gevangenissen en inrichtingen voor stelselmatige
      daders. Onze Minister kan een inrichting aanwijzen tot zowel huis van bewaring of gevangenis als inrichting voor
      stelselmatige daders. In bijzondere gevallen kan Onze Minister een inrichting aanwijzen tot zowel huis van bewaring
      als gevangenis.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: '9.2'
    text: 'Huizen van bewaring zijn bestemd voor de opneming van:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.a
    text: |-
      personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven en die in afwachting zijn van berechting
      in eerste aanleg;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.b
    text: |-
      personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven en aan wie de maatregel van
      terbeschikkingstelling met bevel tot verpleging is opgelegd, maar die niet tevens tot een vrijheidsstraf zijn
      veroordeeld, dan wel aan wie de maatregel tot plaatsing in een inrichting voor stelselmatige daders is opgelegd,
      voor zolang het opleggen van die maatregel niet onherroepelijk is;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.c
    text: |-
      personen ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf plaatsvindt en die in afwachting zijn van
      plaatsing in een gevangenis of deelname aan een penitentiair programma;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.d
    text: personen in vreemdelingenbewaring;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.e
    text: gegijzelden;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: 9.2.f
    text: |-
      ter beschikking gestelden ten aanzien van wie een bevel tot verpleging van
      overheidswege als bedoeld in [artikel 37b van het Wetboek van Strafrecht][ref1] of
      [artikel 6:6:10, eerste lid, onder e, van het Wetboek van Strafvordering][ref2] is gegeven voor zolang opname in
      de voor hen bestemde plaats niet mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 37b
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: 9.2.g
    text: |-
      personen aan wie de maatregel is opgelegd tot plaatsing in een inrichting voor stelselmatige daders als bedoeld in
      [artikel 38m van het Wetboek van Strafrecht][ref1] indien opname in de voor hen bestemde plaats niet mogelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38m
  - number: 9.2.h
    text: |-
      alle anderen aan wie krachtens rechterlijke uitspraak of beschikking of door het openbaar gezag rechtens hun
      vrijheid is ontnomen, voor zover geen andere plaats voor hen is bestemd of voor zolang opname in de voor hen
      bestemde plaats niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: '9.3'
    text: Onze Minister wijst in elk arrondissement ten minste één inrichting of afdeling aan als huis van bewaring.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      Gevangenissen zijn bestemd voor de opneming van personen die, al dan niet onherroepelijk, tot vrijheidsstraf zijn
      veroordeeld. Tot gevangenisstraf veroordeelden aan wie tevens de maatregel van terbeschikkingstelling met bevel tot
      verpleging van overheidswege is opgelegd, kunnen na het einde van de vrijheidsstraf in een gevangenis verblijven,
      zolang opname in de voor hen bestemde plaats niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      In bijzondere gevallen kan gijzeling als bedoeld in de [artikelen 6:4:20][ref1]
      en [6:6:25 van het Wetboek van Strafvordering][ref2] en
      [artikel 28 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] in een gevangenis ten
      uitvoer worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004581#Artikel28
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004581
        artikel: '28'
  - number: '10.3'
    text: |-
      Gevangenissen kunnen volgens regels te stellen bij of krachtens algemene maatregel van bestuur worden onderscheiden
      naar de lengte van de straf of het strafrestant van de daarin op te nemen tot vrijheidsstraf veroordeelden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel10
  - number: 10a
    text: |-
      Inrichtingen voor stelselmatige daders zijn bestemd voor de opneming van personen aan wie een maatregel als bedoeld
      in [artikel 38m van het Wetboek van Strafrecht][ref1] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38m
  - number: '11.1'
    text: Mannelijke en vrouwelijke gedetineerden worden gescheiden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      Onze Minister wijst inrichtingen of afdelingen aan die uitsluitend zijn bestemd voor de onderbrenging van
      vrouwelijke gedetineerden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister kan inrichtingen of afdelingen aanwijzen waarin van het eerste lid wordt afgeweken vanwege hun
      bestemming als inrichting of afdeling voor bijzondere opvang als bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
        hoofdstuk: III
  - number: '11.4'
    text: |-
      De directeur kan gedetineerden van verschillend geslacht die in dezelfde inrichting verblijven in de gelegenheid
      stellen gezamenlijk aan activiteiten deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister wijst de inrichtingen of de afdelingen aan waarin kinderen tot een in de aanwijzing aangegeven
      leeftijd kunnen worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.2'
    text: |-
      Indien een gedetineerde een kind in de inrichting of afdeling, bedoeld in het eerste lid, wil onderbrengen teneinde
      het aldaar te verzorgen en op te voeden, behoeft hij de toestemming van de directeur. De directeur kan deze
      toestemming geven, voor zover dit verblijf zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: 12.2.a
    text: de bescherming van de persoonlijke veiligheid of de geestelijke of lichamelijke ontwikkeling van het kind;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: 12.2.b
    text: de handhaving van de orde of de veiligheid in de inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.3'
    text: De directeur kan aan de toestemming voorwaarden verbinden met het oog op een belang als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.4'
    text: |-
      De directeur kan over een door hem voorgenomen onderbrenging van een kind in de inrichting of afdeling het advies
      inwinnen van de Raad voor de Kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.5'
    text: |-
      De directeur kan de toestemming intrekken, indien dit noodzakelijk is met het oog op een belang als bedoeld in het
      tweede lid of indien de gedetineerde een bepaalde voorwaarde niet nakomt. Indien de directeur een nader onderzoek
      nodig oordeelt, kan hij de medewerking van de Raad voor de Kinderbescherming inroepen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.6'
    text: |-
      De directeur is verplicht de toestemming in te trekken, indien de onderbrenging van het kind in de inrichting in
      strijd komt met enige op het gezag over het kind betrekking hebbende beslissing.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.7'
    text: In de huisregels worden nadere regels gesteld omtrent het verblijf van kinderen in de inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '12.8'
    text: |-
      De kosten van de verzorging van het kind komen voor rekening van het Rijk, voor zover de gedetineerde niet zelf in
      die kosten kan voorzien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel12
  - number: '13.1'
    text: 'Inrichtingen of afdelingen daarvan zijn naar de mate van beveiliging als volgt te onderscheiden en aan te duiden:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: 13.1.a
    text: zeer beperkt beveiligd;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: 13.1.b
    text: beperkt beveiligd;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: 13.1.c
    text: normaal beveiligd;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: 13.1.d
    text: uitgebreid beveiligd;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: 13.1.e
    text: extra beveiligd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: '13.2'
    text: |-
      Onze Minister bepaalt ten aanzien van elke inrichting of afdeling de mate van beveiliging, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in een inrichting of een
      afdeling als bedoeld in het eerste lid in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      Inrichtingen of afdelingen daarvan kunnen door Onze Minister worden bestemd voor de onderbrenging van gedetineerden
      die een bijzondere opvang behoeven.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      De bijzondere opvang, bedoeld in het eerste lid, kan verband houden met de leeftijd, de persoonlijkheid, de
      lichamelijke of de geestelijke gezondheidstoestand van de gedetineerden, de geneeskundige behandeling van de
      geestelijke gezondheidstoestand als bedoeld in [artikel 46d, onder a][ref1] alsmede met het delict waarvoor zij
      zijn gedetineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: '14.3'
    text: |-
      Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in een inrichting of een
      afdeling als bedoeld in het eerste lid in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel14
  - number: '14.4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanwezigheid van de benodigde
      voorzieningen in een inrichting of afdeling voor de geneeskundige behandeling van de geestelijke
      gezondheidstoestand als bedoeld in [artikel 46d, onder a][ref1]. In elk geval worden nadere regels gesteld omtrent
      de beschikbaarheid van een psychiater en een verpleegkundige ten dienste van deze inrichting of afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: '15.1'
    text: |-
      De personen ten aanzien van wie de tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen
      is gelast worden geplaatst in een inrichting of afdeling dan wel overgeplaatst naar een inrichting of
      afdeling overeenkomstig de bestemming daarvan ingevolge [hoofdstuk III][ref1]. Van het bepaalde omtrent de
      bestemming kan worden afgeweken op gronden gelegen in de persoon van de betrokkene. Indien een persoon voor
      plaatsing in meer dan één inrichting of afdeling in aanmerking komt, geschiedt deze met inachtneming van
      [artikel 2, tweede, derde en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel2
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '2'
        hoofdstuk: II
  - number: '15.2'
    text: |-
      Gedetineerden die hiervoor ingevolge [artikel 4, vijfde lid][ref1], in aanmerking komen, kunnen in de gelegenheid
      worden gesteld tot deelname aan een penitentiair programma en daarbij voor de duur van het programma of een
      gedeelte daarvan onder elektronisch toezicht worden gesteld. Bij het niet voldoen aan de voorwaarden voor deelname,
      bedoeld in [artikel 4, derde lid][ref2], kan de deelname worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel4
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '4'
        hoofdstuk: II
  - number: '15.3'
    text: |-
      Onze Minister is bevoegd tot plaatsing en overplaatsing als bedoeld in het eerste lid en tot het nemen van de
      beslissingen, bedoeld in het tweede lid. Onze Minister is tevens bevoegd de overbrenging te bevelen naar de voor
      hen bestemde inrichting of afdeling, dan wel ten behoeve van deelname aan het voor hen bestemde penitentiair
      programma dan wel de beëindiging hiervan. Onze Minister is bovendien bevoegd tot de beslissing of ten aanzien
      van de individuele gedetineerde is gebleken van goed gedrag dat aanleiding geeft tot deelname van de gedetineerde
      aan een penitentiair programma, zodra aan de voorwaarden, bedoeld in artikel 4, tweede lid, onderdelen b en c, is
      voldaan. De inrichting is verplicht te betrokkene op te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
  - number: '15.4'
    text: |-
      Onze Minister neemt bij de beslissingen, bedoeld in het eerste en tweede lid, de aanwijzingen van het openbaar
      ministerie en van de autoriteiten die de straf of maatregel hebben opgelegd in aanmerking.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
  - number: '15.5'
    text: |-
      In geval van een psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap
      van een gedetineerde kan Onze Minister bepalen dat de gedetineerde naar een accommodatie als
      bedoeld in [artikel 1:1, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref1] of
      [artikel 1, onderdeel b, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref2]
      zal worden overgebracht om daar zolang dat noodzakelijk is te worden verpleegd. Indien de gedetineerde
      wordt overgebracht ten behoeve van de verlening van forensische zorg, bedoeld bij of krachtens de
      [Wet forensische zorg][ref3], geschiedt de overbrenging overeenkomstig die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040635#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0040632#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0040635
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0040632
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0040634
  - number: '15.6'
    text: |-
      Onze Minister stelt nadere regels vast omtrent de procedure van plaatsing en overplaatsing en overbrenging,
      bedoeld in het eerste onderscheidenlijk het vijfde lid, en omtrent de wijze waarop het vervoer van de gedetineerde
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15
  - number: 15a
    text: |-
      In afwijking van [artikel 15, eerste lid, eerste volzin][ref1], kan Onze Minister bepalen dat een persoon ten
      aanzien van wie de tenuitvoerlegging van een vrijheidsstraf of een vrijheidsbenemende maatregel is gelast en
      die in een politiecel verblijft, daar voor een periode van maximaal tien dagen zal verblijven, nadat hij heeft
      vastgesteld dat er voor deze persoon geen plaats is in een inrichting. De politiecel voldoet aan de regels die voor
      politiecellencomplexen zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel15
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '16.1'
    text: |-
      De directeur bepaalt de wijze van onderbrenging van de gedetineerden die overeenkomstig [artikel 15][ref1] zijn
      geplaatst in de inrichting of afdeling met het beheer waarvan hij is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel15
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '16.2'
    text: |-
      De directeur wijst iedere gedetineerde een verblijfsruimte toe met inachtneming van de
      [artikelen 20, tweede lid][ref1], [21][ref2] en [22, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel22
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '20'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '21'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '22'
        hoofdstuk: V
        paragraaf: '1'
  - number: '16.3'
    text: |-
      De directeur kan onderdelen van de inrichting of afdeling aanwijzen voor de onderbrenging van gedetineerden die een
      bijzondere opvang in de zin van [artikel 14][ref1] behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
        hoofdstuk: III
  - number: '16.4'
    text: |-
      De directeur bepaalt de criteria waaraan de gedetineerde moet voldoen om voor onderbrenging als bedoeld in het
      derde lid in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel16
  - number: '16.5'
    text: Onze Minister stelt regels omtrent de eisen waaraan een verblijfsruimte als bedoeld in het tweede lid moet voldoen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel16
  - number: '17.1'
    text: 'De betrokkene heeft het recht een met redenen omkleed bezwaarschrift in te dienen tegen de beslissing:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
  - number: 17.1.a
    text: |-
      tot plaatsing of overplaatsing als bedoeld in [artikel 15, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel15
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 17.1.b
    text: tot beëindiging van zijn deelname aan een penitentiair programma.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
  - number: '17.2'
    text: |-
      Op de wijze van indiening is [artikel 61, tweede, vierde en vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '61'
        hoofdstuk: XI
  - number: '17.3'
    text: |-
      Onze Minister stelt de betrokkene in de gelegenheid schriftelijk of mondeling diens bezwaarschrift toe te lichten,
      tenzij hij het aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
  - number: '17.4'
    text: |-
      Onze Minister stelt de indiener van het bezwaarschrift binnen zes weken van zijn met redenen omklede beslissing
      schriftelijk en zoveel mogelijk in een voor deze begrijpelijke taal op de hoogte. Hierbij wijst hij hem op de
      mogelijkheid van het instellen van beroep, bedoeld in [hoofdstuk XIII][ref1], alsmede de termijnen waarbinnen en de
      wijze waarop dit gedaan moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XIII
  - number: '17.5'
    text: |-
      Het indienen van een bezwaarschrift blijft achterwege, indien de betrokkene in de gelegenheid is gesteld zijn
      bezwaren tegen een door Onze Minister voorgenomen en hem betreffende beslissing als bedoeld in het eerste lid
      kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel17
  - number: '18.1'
    text: 'De betrokkene heeft het recht bij Onze Minister een met redenen omkleed verzoekschrift in te dienen strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
  - number: 18.1.a
    text: plaatsing in dan wel overplaatsing naar een bepaalde inrichting of afdeling;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
  - number: 18.1.b
    text: deelname aan een penitentiair programma.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
  - number: '18.2'
    text: |-
      Met een verzoekschrift wordt gelijkgesteld een akkoordverklaring van de gedetineerde met het selectieadvies van de
      directeur van de inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
  - number: '18.3'
    text: |-
      De [artikelen 61, tweede en vierde lid][ref1], en [17, derde en vierde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel17
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '61'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '18.4'
    text: |-
      Indien het verzoekschrift, bedoeld in het eerste lid, is afgewezen, kan zes maanden na deze afwijzing opnieuw een
      dergelijk verzoekschrift worden ingediend.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18
  - number: 18a.1
    text: |-
      De directeur draagt zorg dat zo spoedig mogelijk en in ieder geval binnen een maand na binnenkomst van de
      gedetineerde in een inrichting voor stelselmatige daders, zo veel mogelijk in overleg met hem, een verblijfsplan
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18a
  - number: 18a.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een verblijfsplan ten minste moet
      voldoen en de voorschriften die bij de vaststelling of een wijziging van het plan in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18a
  - number: 18b
    text: De directeur draagt zorg dat de tenuitvoerlegging overeenkomstig het verblijfsplan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18b
  - number: 18c.1
    text: |-
      De gedetineerde heeft recht op een periodieke evaluatie door de directeur van het verloop van de tenuitvoerlegging.
      Deze evaluatie vindt ten minste eens per zes maanden plaats.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18c
  - number: 18c.2
    text: |-
      Indien de rechter bij het opleggen van de maatregel heeft bepaald dat het openbaar ministerie hem binnen een
      door hem vastgestelde termijn bericht over de wenselijkheid of de noodzakelijkheid van de voortzetting van de
      tenuitvoerlegging daarvan, vindt de eerste evaluatie in ieder geval plaats voor het verstrijken van die termijn.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18c
  - number: 18c.3
    text: |-
      De directeur draagt zorg dat van iedere evaluatie een verslag wordt gemaakt en dat dit verslag zo spoedig mogelijk
      met de gedetineerde wordt besproken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18c
  - number: 18c.4
    text: |-
      Indien de gedetineerde van oordeel is dat het evaluatieverslag feitelijk onjuist of onvolledig is, heeft hij
      het recht op dit verslag schriftelijk commentaar te geven. Indien het evaluatieverslag niet overeenkomstig het
      commentaar wordt verbeterd of aangevuld, draagt de directeur zorg dat het commentaar aan het verslag wordt gehecht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18c
  - number: 18c.5
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de procedure die met betrekking tot de evaluatie
      dient te worden gevolgd en de eisen die aan het verslag daarvan ten minste dienen te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel18c
  - number: '19.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel in een inrichting vindt plaats in
      algehele dan wel beperkte gemeenschap, tenzij plaatsing in een individueel regime noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel19
  - number: '19.2'
    text: Onze Minister bepaalt ten aanzien van elke inrichting of afdeling de mate van gemeenschap.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel19
  - number: '19.3'
    text: |-
      Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in de regimes, bedoeld in
      het eerste lid, alsmede voor plaatsing in een voor hen persoonlijk dan wel voor de gemeenschappelijke onderbrenging
      van gedetineerden bestemde verblijfsruimte, in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel19
  - number: '20.1'
    text: |-
      In een regime van algehele gemeenschap verblijven gedetineerden tezamen in woon- en werkruimten of nemen
      gemeenschappelijk deel aan activiteiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel20
  - number: '20.2'
    text: |-
      In een regime van algehele gemeenschap kunnen gedetineerden worden verplicht zich tijdens de maaltijden, gedurende
      bezoektijden voor zover zij geen bezoek ontvangen, alsmede gedurende activiteiten waaraan zij niet deelnemen,
      in hun verblijfsruimte op te houden. Deze ruimte is voor hen persoonlijk dan wel voor de gemeenschappelijke
      onderbrenging van gedetineerden bestemd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel20
  - number: '20.3'
    text: |-
      In een regime van algehele gemeenschap houden gedetineerden zich gedurende de voor de nachtrust bestemde uren
      en op in de huisregels bepaalde overige uren gedurende het weekeinde en de algemeen erkende feestdagen in hun
      verblijfsruimte op.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel20
  - number: '21'
    text: |-
      In een regime van beperkte gemeenschap worden gedetineerden in de gelegenheid gesteld gemeenschappelijk aan
      activiteiten deel te nemen. Overigens houden zij zich in de voor hen persoonlijk dan wel voor de gemeenschappelijke
      onderbrenging van gedetineerden bestemde verblijfsruimte op.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel21
  - number: '22.1'
    text: |-
      In een individueel regime worden gedetineerden in de gelegenheid gesteld aan activiteiten deel te nemen. Overigens
      houden zij zich in de voor hen persoonlijk bestemde verblijfsruimte op.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      In een individueel regime bepaalt de directeur de mate waarin de gedetineerde in staat wordt gesteld individueel
      dan wel gemeenschappelijk aan activiteiten deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel22
  - number: '23.1'
    text: 'De directeur kan een gedetineerde uitsluiten van deelname aan een of meer activiteiten:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: 23.1.a
    text: |-
      indien dit in het belang van de handhaving van de orde of de veiligheid in de inrichting dan wel van een
      ongestoorde tenuitvoerlegging van de vrijheidsbeneming noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: 23.1.b
    text: indien dit ter bescherming van de betrokken gedetineerde noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: 23.1.c
    text: in geval van ziekmelding of ziekte van de betrokken gedetineerde;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: 23.1.d
    text: indien de gedetineerde hierom verzoekt en de directeur dit verzoek redelijk en uitvoerbaar oordeelt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: '23.2'
    text: |-
      De uitsluiting ingevolge het eerste lid, onder a of b, duurt ten hoogste twee weken. De directeur kan deze
      uitsluiting telkens voor ten hoogste twee weken verlengen, indien hij tot het oordeel is gekomen dat de noodzaak
      tot uitsluiting nog bestaat.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de uitsluiting, bedoeld in het eerste lid, onder a of b, geboden is, kan
      een ambtenaar of medewerker de maatregel, bedoeld in het eerste lid, voor een periode van ten hoogste vijftien
      uren treffen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel23
  - number: '24.1'
    text: |-
      De directeur is bevoegd een gedetineerde in afzondering te plaatsen op de gronden genoemd in
      [artikel 23, eerste lid][ref1]. De afzondering ingevolge [artikel 23, eerste lid, onder a of b][ref2], duurt ten
      hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.2'
    text: |-
      De afzondering wordt ten uitvoer gelegd in een afzonderingscel of in een andere verblijfsruimte. Gedurende het
      verblijf in afzondering neemt de gedetineerde niet deel aan activiteiten, voor zover de directeur niet anders
      bepaalt en behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 49, derde lid][ref1]. De
      directeur kan het contact met de buitenwereld gedurende het verblijf in de afzonderingscel beperken of uitsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel49
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '49'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '24.3'
    text: |-
      De directeur kan de afzondering, bedoeld in het eerste lid, op de grond van
      [artikel 23, eerste lid, onder a of b][ref1], telkens voor ten hoogste twee weken verlengen, indien hij tot het
      oordeel is gekomen dat de noodzaak tot afzondering nog bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.4'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de afzondering op de grond van
      [artikel 23, eerste lid, onder a of b][ref1], geboden is, kan een ambtenaar of medewerker een gedetineerde voor een
      periode van ten hoogste vijftien uren in afzondering plaatsen. De directeur wordt van deze plaatsing onverwijld op
      de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.5'
    text: |-
      De directeur draagt zorg dat in geval van afzondering het nodige contact tussen ambtenaren en medewerkers van de
      inrichting en de gedetineerde wordt gewaarborgd en naar aard en frequentie op de situatie van de gedetineerde wordt
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
  - number: '24.6'
    text: |-
      De directeur draagt zorg dat, ingeval de afzondering langer dan vierentwintig uren duurt en ten uitvoer wordt
      gelegd in een afzonderingscel, de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger
      terstond hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
  - number: '24.7'
    text: |-
      Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de afzonderingscel. Deze betreffen
      in elk geval de rechten die tijdens het verblijf in de afzonderingscel aan de gedetineerde toekomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24
  - number: 24a.1
    text: |-
      De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de gedetineerde
      noodzakelijk is, bepalen dat de gedetineerde die in een afzonderingscel verblijft, dag en nacht door middel van een
      camera wordt geobserveerd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24a
  - number: 24a.2
    text: |-
      Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel24a
  - number: '25.1'
    text: |-
      Indien de tenuitvoerlegging van de afzondering in de inrichting of afdeling waarin zij is opgelegd op ernstige
      bezwaren stuit, kan zij in een andere inrichting of afdeling worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de directeur van oordeel is dat van de in het eerste lid bedoelde omstandigheid sprake is, plaatst hij in
      overeenstemming met Onze Minister de gedetineerde over.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel25
  - number: '25.3'
    text: |-
      Over de verlenging van de afzondering, waarvan de tenuitvoerlegging plaatsvindt in een andere inrichting of
      afdeling, beslist de directeur van de inrichting of afdeling waarin de afzondering was opgelegd, in overeenstemming
      met Onze Minister en gehoord de directeur van de inrichting of afdeling waar de tenuitvoerlegging van de
      afzondering plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel25
  - number: '25.4'
    text: |-
      Onze Minister stelt nadere regels omtrent de procedure van overplaatsing en van verlenging van de afzondering
      ingevolge het tweede onderscheidenlijk het derde lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel25
  - number: '26.1'
    text: Een gedetineerde kan, ingevolge het derde en het vierde lid, worden toegestaan de inrichting te verlaten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '26.2'
    text: |-
      Het verlaten van de inrichting, bedoeld in het eerste lid, schort de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel niet op.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '26.3'
    text: |-
      Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van verlof. Deze betreffen
      in elk geval de criteria waaraan een gedetineerde moet voldoen om voor het verlof in aanmerking te komen, de
      bevoegdheid tot en de wijze van verlening, weigering, beperking en intrekking alsmede de duur en frequentie van het
      verlof en de voorwaarden die aan het verlof kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '26.4'
    text: |-
      De directeur stelt een gedetineerde in de gelegenheid onder door hem te stellen voorwaarden de inrichting te
      verlaten teneinde een gerechtelijke procedure bij te wonen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: 26.4.a
    text: |-
      indien de gedetineerde krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: 26.4.b
    text: indien de gedetineerde ter zake van een misdrijf moet terechtstaan;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: 26.4.c
    text: |-
      indien de gedetineerde bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van de
      inrichting hiertoe geen overwegend bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '26.5'
    text: |-
      Met het oog op het verlaten van de inrichting, bedoeld in het vierde lid, kan de directeur aan daartoe door
      hem aangewezen ambtenaren of medewerkers bevelen dat de betrokken persoon naar de daartoe bestemde plaats wordt
      overgebracht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '26.6'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze waarop het vervoer van de gedetineerde ten behoeve het
      bijwonen van een gerechtelijke procedure, bedoeld in het vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel26
  - number: '27'
    text: |-
      Het recht van de gedetineerde op onaantastbaarheid van zijn lichaam, zijn kleding en de van zijn lichaam
      afgescheiden stoffen en zijn verblijfsruimte kan overeenkomstig de bepalingen van dit hoofdstuk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel27
  - number: '28.1'
    text: |-
      De directeur stelt bij binnenkomst in en bij het verlaten van de inrichting, bij de tenuitvoerlegging van een bevel
      als bedoeld in [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] en voor zover dit
      anderszins noodzakelijk is, de identiteit van de gedetineerde vast.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
  - number: '28.2'
    text: |-
      De directeur stelt tevens voorafgaand aan en na afloop van bezoek de identiteit van de gedetineerde vast, tenzij
      een ambtenaar of medewerker op de gedetineerde voortdurend en persoonlijk toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
  - number: '28.3'
    text: |-
      Het vaststellen van de identiteit van de gedetineerde omvat bij de eerste opname in de inrichting
      het vragen naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in
      de basisregistratie personen is ingeschreven en het adres van zijn feitelijke verblijfplaats
      buiten de inrichting. Het omvat tevens het nemen van een of meer vingerafdrukken. In de gevallen
      waarin van de gedetineerde eerder overeenkomstig het [Wetboek van Strafvordering][ref1] of de
      [Vreemdelingenwet 2000][ref2] vingerafdrukken zijn genomen en verwerkt, omvat het vaststellen van zijn
      identiteit bij binnenkomst in de inrichting tevens een vergelijking van zijn vingerafdrukken met de
      van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit een
      onderzoek van zijn identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3].
      [Artikel 29c, tweede lid, van het Wetboek van Strafvordering][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel29c
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: 29c
  - number: '28.4'
    text: |-
      Het vaststellen van de identiteit van de gedetineerde omvat in de andere gevallen dan de eerste opname
      in de inrichting het nemen van een of meer vingerafdrukken en het vergelijken van die vingerafdrukken met
      de van hem bij binnenkomst genomen vingerafdrukken. Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] worden van de gedetineerde tevens
      een of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref2] genomen en verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001903
  - number: '28.5'
    text: |-
      De directeur is bevoegd van de gedetineerde een of meer foto’s te nemen. De foto’s kunnen worden gebruikt voor
      het vervaardigen van een legitimatiebewijs en voor het voorkomen, opsporen, vervolgen en berechten van strafbare
      feiten. De gedetineerde is verplicht het legitimatiebewijs bij zich te dragen en op verzoek van een ambtenaar of
      medewerker te tonen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
  - number: '28.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegevens,
      bedoeld in het derde tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel28
  - number: '29.1'
    text: |-
      De directeur is bevoegd een gedetineerde bij binnenkomst of bij het verlaten van de inrichting, voorafgaand aan of
      na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of
      de veiligheid in de inrichting, aan zijn lichaam of aan zijn kleding te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel29
  - number: '29.2'
    text: |-
      Het onderzoek aan het lichaam van de gedetineerde omvat mede het uitwendig schouwen van de openingen en holten van
      het lichaam van de gedetineerde. Het onderzoek aan de kleding van de gedetineerde omvat mede het onderzoek van de
      voorwerpen die de gedetineerde bij zich draagt of met zich meevoert.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het onderzoek aan het lichaam van de gedetineerde wordt op een besloten plaats en, voor zover mogelijk, door
      personen van hetzelfde geslacht als de gedetineerde verricht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel29
  - number: '29.4'
    text: |-
      Indien bij een onderzoek aan het lichaam of de kleding voorwerpen worden aangetroffen die niet in het bezit van de
      gedetineerde mogen zijn, en, voor zover het onderzoek betrekking heeft op de openingen of holten van het lichaam
      van de gedetineerde, deze voorwerpen zonder het gebruik van hulpmiddelen daaruit kunnen worden verwijderd, is
      de directeur bevoegd deze in beslag te nemen. Hij draagt zorg dat deze voorwerpen, hetzij onder afgifte van een
      bewijs van ontvangst ten behoeve van de gedetineerde op diens kosten worden bewaard, hetzij met toestemming van
      de gedetineerde worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de
      voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel29
  - number: '30.1'
    text: |-
      De directeur kan, indien dit noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in
      de inrichting dan wel in verband met de beslissing tot plaatsing of overplaatsing dan wel in verband met de
      verlening van verlof, een gedetineerde verplichten urine af te staan ten behoeve van een onderzoek van die urine op
      aanwezigheid van gedragsbeïnvloedende middelen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister stelt nadere regels omtrent de wijze van uitvoering van het urineonderzoek. Deze regels betreffen in
      elk geval het recht van de gedetineerde om de uitslag te vernemen en om voor eigen rekening een hernieuwd onderzoek
      van de afgestane urine te laten plaatsvinden.[ Artikel 29, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel29
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '29'
        hoofdstuk: VI
  - number: '31.1'
    text: |-
      De directeur kan bepalen dat een gedetineerde in het lichaam wordt onderzocht, indien dit noodzakelijk is ter
      afwending van ernstig gevaar voor de handhaving van de orde of de veiligheid in de inrichting dan wel voor de
      gezondheid van de gedetineerde. Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht,
      door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel31
  - number: '31.2'
    text: |-
      Een ambtenaar of medewerker van de inrichting waar de gedetineerde verblijft kan indien onverwijlde
      tenuitvoerlegging geboden is, een beslissing als bedoeld in het eerste lid nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel31
  - number: '31.3'
    text: |-
      Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de gedetineerde
      mogen zijn, en deze voorwerpen door de arts of verpleegkundige uit het lichaam kunnen worden verwijderd, is de
      directeur bevoegd deze in beslag te nemen.[ Artikel 29, vierde lid, laatste volzin][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel29
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '29'
        hoofdstuk: VI
  - number: '32.1'
    text: |-
      De directeur kan een gedetineerde verplichten te gedogen dat ten aanzien van hem een bepaalde geneeskundige
      handeling wordt verricht, indien die handeling naar het oordeel van een arts volstrekt noodzakelijk is ter
      afwending van gevaar voor de gezondheid of veiligheid van de gedetineerde of van anderen. De handeling wordt
      verricht door een arts of, in diens opdracht, door een verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel32
  - number: '32.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid. Deze
      regels betreffen in ieder geval de melding en registratie van de geneeskundige handeling, alsmede de taak van
      de verantwoordelijke arts indien de geneeskundige handeling volstrekt noodzakelijk is ter afwending van gevaar,
      voortvloeiend uit de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap van de
      gedetineerde. De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum van
      uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de
      beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel32
  - number: '33.1'
    text: |-
      De directeur kan bepalen dat een gedetineerde tijdens de afzondering door bevestiging van mechanische middelen
      aan zijn lichaam voor een periode van ten hoogste vierentwintig uren in zijn bewegingsvrijheid wordt beperkt,
      indien die beperking noodzakelijk is ter afwending van een van de gedetineerde uitgaand ernstig gevaar voor diens
      gezondheid of de veiligheid van anderen dan de gedetineerde. De directeur stelt de arts of diens vervanger en de
      commissie van toezicht van de bevestiging onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien onverwijlde tenuitvoerlegging van de maatregel, bedoeld in het eerste lid, geboden is, kan een ambtenaar of
      medewerker hiertoe beslissen en deze voor een periode van ten hoogste vier uren ten uitvoer leggen. De directeur,
      de arts of diens vervanger en de commissie van toezicht worden hiervan onverwijld in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel33
  - number: '33.3'
    text: |-
      De directeur kan de beslissing tot bevestiging van mechanische middelen aan het lichaam van de gedetineerde telkens
      met ten hoogste vierentwintig uren verlengen. De beslissing tot verlenging wordt genomen na overleg met de aan de
      inrichting verbonden arts of diens vervanger.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel33
  - number: '33.4'
    text: Onze Minister stelt nadere regels omtrent de bevestiging van mechanische middelen aan het lichaam.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel33
  - number: '34.1'
    text: |-
      De directeur is bevoegd de verblijfsruimte van een gedetineerde op de aanwezigheid van voorwerpen die niet in zijn
      bezit mogen zijn te onderzoeken:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34
  - number: 34.1.a
    text: |-
      indien dit onderzoek plaatsvindt in het kader van het algemeen toezicht op de aanwezigheid van verboden voorwerpen
      in de verblijfsruimten van gedetineerden;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34
  - number: 34.1.b
    text: |-
      indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de
      inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      [Artikel 29, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel29
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '29'
        hoofdstuk: VI
  - number: '34.3'
    text: |-
      De directeur is bevoegd de verblijfsruimte van een gedetineerde te onderzoeken op de aanwezigheid van voorwerpen
      waarop vermoedelijk celmateriaal van de gedetineerde aanwezig is en deze voorwerpen in beslag te nemen, indien de
      officier van justitie hem op grond van [artikel 6, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref1]
      een opdracht tot het in beslag nemen van deze voorwerpen heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel6
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0017212
        artikel: '6'
  - number: 34a.1
    text: |-
      De directeur kan bepalen dat de gedetineerde die in een individueel regime als bedoeld in [artikel 22][ref1] of in
      een extra beveiligde inrichting als bedoeld in [artikel 13, eerste lid, onder e][ref2], is geplaatst, dag en nacht
      door middel van een camera wordt geobserveerd:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel13
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '22'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '13'
        hoofdstuk: III
  - number: 34a.1.a
    text: indien dit noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.1.b
    text: indien dit noodzakelijk is voor een ongestoorde tenuitvoerlegging van de vrijheidsbeneming;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.1.c
    text: indien dit ter bescherming van de geestelijke of lichamelijke toestand van de gedetineerde noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.1.d
    text: |-
      indien bij ontvluchting of schade aan de gezondheid van de gedetineerde grote maatschappelijke onrust zou kunnen
      ontstaan of ernstige schade zou kunnen worden toegebracht aan de betrekkingen van Nederland met andere staten of
      internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.2
    text: |-
      Indien cameraobservatie wordt toegepast op de grond van het eerste lid, onder c, wordt, alvorens de directeur
      hiertoe beslist, het advies ingewonnen van een gedragsdeskundige onderscheidenlijk de inrichtingsarts, tenzij dit
      advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig mogelijk na zijn beslissing
      in.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.3
    text: |-
      De cameraobservatie, bedoeld in het eerste lid, duurt ten hoogste twee weken. De directeur kan de cameraobservatie
      telkens voor ten hoogste twee weken verlengen, indien hij tot het oordeel is gekomen dat de noodzaak daartoe nog
      bestaat. De beslissing tot verlenging wordt genomen na overleg met de aan de inrichting verbonden arts of diens
      vervanger, of, in het geval, bedoeld in het eerste lid, onder c, een gedragsdeskundige.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: 34a.4
    text: |-
      De directeur draagt zorg dat, ingeval de cameraobservatie langer dan vierentwintig uren duurt, de commissie van
      toezicht en de aan de inrichting verbonden arts of diens vervanger terstond hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel34a
  - number: '35.1'
    text: |-
      De directeur is bevoegd jegens een gedetineerde geweld te gebruiken dan wel vrijheidsbeperkende middelen aan te
      wenden, voor zover dit noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.1.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.1.b
    text: de uitvoering van een door de directeur genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.1.c
    text: de voorkoming van het zich onttrekken door de gedetineerde aan het op hem uitgeoefende toezicht;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.1.d
    text: |-
      de uitvoering van een ingevolge het [Wetboek van Strafvordering][ref1] of de
      [Wet DNA-onderzoek bij veroordeelden][ref2] door de officier van justitie of de rechter-commissaris genomen
      beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0017212
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0017212
  - number: '35.2'
    text: |-
      Onze Minister of een daartoe door hem aangewezen ambtenaar of medewerker is bevoegd jegens een gedetineerde geweld
      te gebruiken of vrijheidsbeperkende middelen aan te wenden met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.2.a
    text: de uitvoering van een door hem genomen beslissing;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: 35.2.b
    text: de voorkoming van het zich onttrekken van de gedetineerde aan het op hem uitgeoefende toezicht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: '35.3'
    text: |-
      Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt maakt hiervan
      onverwijld een schriftelijk verslag en doet dit verslag onverwijld aan de directeur dan wel Onze Minister toekomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: '35.4'
    text: Onze Minister stelt nadere regels omtrent het gebruik van geweld en de aanwending van vrijheidsbeperkende middelen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel35
  - number: '36.1'
    text: |-
      De gedetineerde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen,
      het recht brieven en stukken per post te verzenden en te ontvangen. De hieraan verbonden kosten komen, tenzij de
      directeur anders bepaalt, voor rekening van de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: '36.2'
    text: |-
      De directeur is bevoegd enveloppen of andere poststukken, afkomstig van of bestemd voor gedetineerden, op de
      aanwezigheid van bijgesloten voorwerpen te onderzoeken en deze hiertoe te openen. Indien de enveloppen of andere
      poststukken afkomstig zijn van of bestemd zijn voor de in [artikel 37, eerste of tweede lid][ref1], genoemde
      personen of instanties, geschiedt dit onderzoek in aanwezigheid van de betrokken gedetineerde.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '37'
        hoofdstuk: VII
  - number: '36.3'
    text: |-
      De directeur is bevoegd op de inhoud van brieven of andere poststukken afkomstig van of bestemd voor gedetineerden
      toezicht uit te oefenen. Dit toezicht kan omvatten het kopiëren van brieven of andere poststukken. Van de wijze van
      uitoefenen van toezicht wordt aan de gedetineerden tevoren mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: '36.4'
    text: |-
      De directeur kan de verzending of uitreiking van bepaalde brieven of andere poststukken alsmede bijgesloten
      voorwerpen weigeren, indien dit noodzakelijk is met het oog op een van de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: 36.4.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: 36.4.b
    text: de bescherming van de openbare orde of nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: 36.4.c
    text: de voorkoming of opsporing van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: 36.4.d
    text: de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: '36.5'
    text: |-
      De directeur draagt zorg dat de niet uitgereikte brieven of andere poststukken dan wel bijgesloten voorwerpen,
      hetzij worden teruggegeven aan de gedetineerde of voor diens rekening worden gezonden aan de verzender of
      een door de gedetineerde op te geven adres, hetzij onder afgifte van een bewijs van ontvangst ten behoeve van
      de gedetineerde worden bewaard, hetzij met toestemming van de gedetineerde worden vernietigd, hetzij aan een
      opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel36
  - number: '37.1'
    text: |-
      [Artikel 36, derde en vierde lid][ref1], is niet van toepassing op brieven, door de gedetineerde gericht aan of
      afkomstig van:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: 37.1.a
    text: leden van het Koninklijk Huis;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.b
    text: |-
      de Eerste of Tweede Kamer der Staten-Generaal, leden daarvan, de Nederlandse leden van het Europese Parlement of
      een commissie uit een van beide parlementen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.c
    text: Onze Minister;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.d
    text: justitiële autoriteiten;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.e
    text: de Nationale ombudsman;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.f
    text: de inspecteurs van de Inspectie gezondheidszorg en jeugd;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.g
    text: de Raad, een commissie daaruit of leden of buitengewone leden daarvan;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.h
    text: de commissie van toezicht of een beklagcommissie, of leden daarvan;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.i
    text: diens rechtsbijstandverlener;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.j
    text: diens reclasseringswerker;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: 37.1.k
    text: andere door Onze Minister of de directeur aan te wijzen personen of instanties.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: '37.2'
    text: |-
      Voor de toepassing van het eerste lid, onder d, wordt onder justitiële autoriteiten mede begrepen: organen die
      krachtens een wettelijk voorschrift of een in Nederland geldend verdrag bevoegd zijn tot kennisneming van klachten
      of behandeling van met een klacht aangevangen zaken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: '37.3'
    text: |-
      Onze Minister kan nadere regels stellen omtrent de wijze van verzending van brieven aan en door de in het eerste
      lid genoemde personen en instanties.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel37
  - number: '38.1'
    text: |-
      De gedetineerde heeft het recht gedurende ten minste één uur per week op in de huisregels vastgestelde tijden en
      plaatsen bezoek te ontvangen. Onze Minister kan nadere regels stellen omtrent de toelating en weigering van bezoek.
      In de huisregels worden regels gesteld omtrent het aanvragen van bezoek.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
  - number: '38.2'
    text: |-
      De directeur kan het aantal tegelijkertijd tot de gedetineerde toe te laten personen beperken, indien dit
      noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
  - number: '38.3'
    text: |-
      De directeur kan de toelating tot de gedetineerde van een bepaald persoon of van bepaalde personen weigeren, indien
      dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref1]. Deze weigering geldt
      voor ten hoogste twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: '38.4'
    text: |-
      De directeur kan bepalen dat tijdens het bezoek toezicht wordt uitgeoefend, indien dit noodzakelijk is met het oog
      op een belang als bedoeld in [artikel 36, vierde lid][ref1]. Dit toezicht kan omvatten het beluisteren of opnemen
      van het gesprek tussen de bezoeker en de gedetineerde. Tevoren wordt aan betrokkenen mededeling gedaan van de aard
      en de reden van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: '38.5'
    text: |-
      Iedere bezoeker dient zich bij binnenkomst op deugdelijke wijze te legitimeren. De directeur kan bepalen dat
      een bezoeker aan zijn kleding wordt onderzocht op de aanwezigheid van voorwerpen die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de inrichting. Dit onderzoek kan ook betrekking hebben op door hem meegebrachte
      voorwerpen. De directeur is bevoegd dergelijke voorwerpen gedurende de duur van het bezoek onder zich te nemen
      tegen afgifte van een bewijs van ontvangst dan wel aan een opsporingsambtenaar ter hand te stellen met het oog op
      de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
  - number: '38.6'
    text: |-
      De directeur kan het bezoek binnen de daarvoor bestemde tijd beëindigen en de bezoeker uit de inrichting doen
      verwijderen, indien dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: '38.7'
    text: |-
      De in [artikel 37, eerste lid, onder g en h][ref1], genoemde personen en instanties hebben te allen tijde toegang
      tot de gedetineerde. De overige in dat lid genoemde personen en instanties hebben toegang tot de gedetineerde op
      in de huisregels vastgestelde tijden en plaatsen. Tijdens dit bezoek kunnen zij zich vrijelijk met de gedetineerde
      onderhouden, behoudens ingeval de directeur, na overleg met de desbetreffende bezoeker, van mening is dat van de
      gedetineerde een ernstig gevaar uitgaat voor de veiligheid van de bezoeker. In dat geval laat de directeur voor
      het bezoek weten welke toezichthoudende maatregelen genomen worden om het onderhoud zo ongestoord mogelijk te laten
      verlopen. De toezichthoudende maatregelen mogen er niet toe leiden dat vertrouwelijke mededelingen in het onderhoud
      tussen de gedetineerde en diens rechtsbijstandverlener bij derden bekend kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '37'
        hoofdstuk: VII
  - number: '39.1'
    text: |-
      De gedetineerde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen,
      het recht ten minste eenmaal per week op in de huisregels vastgestelde tijden en plaatsen en met behulp van een
      daartoe aangewezen toestel gedurende tien minuten een of meer telefoongesprekken te voeren met personen buiten
      de inrichting. De hieraan verbonden kosten komen, tenzij de directeur anders bepaalt, voor rekening van de
      gedetineerde. In verband met het uitoefenen van toezicht als bedoeld in het tweede lid, kunnen telefoongesprekken
      worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      De directeur kan bepalen dat op de door of met de gedetineerde gevoerde telefoongesprekken toezicht wordt
      uitgeoefend, indien dit noodzakelijk is om de identiteit van de persoon met wie de gedetineerde een gesprek voert
      vast te stellen dan wel met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref1]. Dit toezicht kan
      omvatten het beluisteren van een telefoongesprek of het uitluisteren van een opgenomen telefoongesprek. Aan de
      betrokkene wordt mededeling gedaan van de aard en de reden van het toezicht. Bij algemene maatregel van bestuur
      worden nadere regels gesteld over het opnemen van telefoongesprekken en het bewaren en verstrekken van opgenomen
      telefoongesprekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: '39.3'
    text: |-
      De directeur kan de gelegenheid tot het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken
      weigeren of een telefoongesprek binnen de daarvoor bestemde tijd beëindigen, indien dit noodzakelijk is met het
      oog op een belang als bedoeld in [artikel 36, vierde lid][ref1]. De beslissing tot het weigeren van een bepaald
      telefoongesprek of bepaalde telefoongesprekken geldt voor ten hoogste twaalf maanden. Onze Minister kan nadere
      regels stellen omtrent het weigeren van een bepaald telefoongesprek of bepaalde telefoongesprekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: '39.4'
    text: |-
      De gedetineerde wordt in staat gesteld met de in [artikel 37, eerste lid][ref1], genoemde personen en instanties
      telefonisch contact te hebben, indien hiervoor de noodzaak en de gelegenheid bestaat. Op deze gesprekken wordt
      geen ander toezicht uitgeoefend dan noodzakelijk is om de identiteit van de personen of instantie met wie de
      gedetineerde een telefoongesprek voert of wenst te voeren vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '37'
        hoofdstuk: VII
  - number: '40.1'
    text: |-
      De directeur kan toestemming geven voor het voeren van een gesprek tussen de gedetineerde en een vertegenwoordiger
      van de media, voor zover dit zich verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: 40.1.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: 40.1.b
    text: de bescherming van de openbare orde en de goede zeden;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: 40.1.c
    text: de bescherming van de rechten en vrijheden van anderen dan de gedetineerde;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: 40.1.d
    text: de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: '40.2'
    text: |-
      De directeur kan met het oog op de bescherming van de in het eerste lid genoemde belangen aan de toegang
      van een vertegenwoordiger van de media tot de inrichting voorwaarden verbinden. De directeur is bevoegd een
      vertegenwoordiger van de media uit de inrichting te doen verwijderen, indien hij de hem opgelegde voorwaarden niet
      nakomt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: '40.3'
    text: |-
      De directeur kan op het contact met een vertegenwoordiger van de media toezicht uitoefenen, indien dit noodzakelijk
      is met het oog op een belang als bedoeld in het eerste lid. Artikel 38, vierde lid, tweede en derde volzin, en
      vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel40
  - number: '41.1'
    text: |-
      De gedetineerde heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen,
      vrij te belijden en te beleven.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
  - number: '41.2'
    text: |-
      De directeur draagt zorg dat in de inrichting voldoende geestelijke verzorging, die zoveel mogelijk aansluit bij de
      godsdienst of levensovertuiging van de gedetineerden, beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
  - number: '41.3'
    text: 'De directeur stelt de gedetineerde in de gelegenheid op in de huisregels vastgestelde tijden en plaatsen:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
  - number: 41.3.a
    text: |-
      persoonlijk contact te onderhouden met de geestelijke verzorger van de godsdienst of levensovertuiging van zijn
      keuze, die aan de inrichting is verbonden;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
  - number: 41.3.b
    text: |-
      contact te onderhouden met andere dan de onder a genoemde geestelijke verzorgers volgens [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel38
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '38'
        hoofdstuk: VII
  - number: 41.3.c
    text: |-
      in de inrichting te houden godsdienstige of levensbeschouwelijke bijeenkomsten van zijn keuze bij te wonen.
      [Artikel 23][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: '41.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de beschikbaarheid
      van de geestelijke verzorging. Deze regels hebben betrekking op de verlening van geestelijke verzorging door of
      vanwege verschillende richtingen van godsdienst of levensovertuiging, op de organisatie en de bekostiging van de
      geestelijke verzorging en op de indienstneming van geestelijke verzorgers bij een inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel41
  - number: '42.1'
    text: De gedetineerde heeft recht op verzorging door een aan de inrichting verbonden arts of diens vervanger.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: '42.2'
    text: |-
      De gedetineerde heeft recht op raadpleging, voor eigen rekening, van een arts van zijn keuze. De directeur stelt in
      overleg met de gekozen arts de plaats en het tijdstip van de raadpleging vast.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: '42.3'
    text: 'De directeur draagt zorg dat de aan de inrichting verbonden arts of diens vervanger:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.3.a
    text: regelmatig beschikbaar is voor het houden van een spreekuur;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.3.b
    text: |-
      op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de gedetineerde noodzakelijk
      is;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.3.c
    text: |-
      de gedetineerden die hiervoor in aanmerking komen onderzoekt op hun geschiktheid voor deelname aan arbeid, sport of
      een andere activiteit.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: '42.4'
    text: 'De directeur draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.4.a
    text: |-
      de verstrekking van de door de aan de inrichting verbonden arts of diens vervanger voorgeschreven medicijnen en
      diëten;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.4.b
    text: de behandeling van de gedetineerde op aanwijzing van de aan de inrichting verbonden arts of diens vervanger;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: 42.4.c
    text: |-
      de overbrenging van de gedetineerde naar een ziekenhuis dan wel andere instelling, indien de onder b bedoelde
      behandeling aldaar plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: '42.5'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld inzake het klagen over beslissingen die ten aanzien van
      gedetineerden zijn genomen door de aan de inrichting verbonden arts of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel42
  - number: '43.1'
    text: De gedetineerde heeft recht op sociale verzorging en hulpverlening.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel43
  - number: '43.2'
    text: |-
      De directeur draagt zorg dat reclasseringswerkers en daarvoor in aanmerking komende gedragsdeskundigen de in het
      eerste lid omschreven zorg en hulp in de inrichting kunnen verlenen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel43
  - number: '43.3'
    text: |-
      De directeur draagt zorg voor overbrenging van de gedetineerde naar de daartoe bestemde plaats, indien de in het
      eerste lid omschreven zorg en hulp dit noodzakelijk maken en een dergelijke overbrenging zich verdraagt met de
      ongestoorde tenuitvoerlegging van de vrijheidsbeneming. Indien de gedetineerde wordt overgebracht ten behoeve
      van de verlening van forensische zorg bedoeld in de [Wet forensische zorg][ref1], geschiedt de overbrenging
      overeenkomstig de bepalingen van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040634
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0040634
  - number: '44.1'
    text: |-
      De directeur draagt zorg dat aan de gedetineerde voeding, noodzakelijke kleding en schoeisel worden verstrekt dan
      wel dat hem voldoende geldmiddelen ter beschikking worden gesteld om hierin naar behoren te voorzien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel44
  - number: '44.2'
    text: |-
      De gedetineerde heeft recht op het dragen van eigen kleding en schoeisel, tenzij die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de inrichting. Hij kan worden verplicht tijdens de arbeid of sport aangepaste
      kleding of schoeisel te dragen. In de huisregels kunnen regels worden gesteld omtrent de wijze van gebruik en
      onderhoud van kleding en schoeisel.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel44
  - number: '44.3'
    text: |-
      De directeur draagt zorg dat bij de verstrekking van voeding zoveel mogelijk rekening wordt gehouden met de
      godsdienst of levensovertuiging van de gedetineerden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel44
  - number: '44.4'
    text: |-
      De directeur draagt zorg dat de gedetineerde in staat gesteld wordt zijn uiterlijk en lichamelijke hygiëne naar
      behoren te verzorgen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel44
  - number: '44.5'
    text: |-
      In de huisregels worden regels gesteld omtrent de aankoop door gedetineerden van andere gebruiksartikelen dan die
      welke door de directeur ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel44
  - number: '45.1'
    text: |-
      In de huisregels kan worden bepaald dat het bezit van bepaalde soorten voorwerpen binnen de inrichting of een
      bepaalde afdeling daarvan verboden is, indien dit noodzakelijk is in het belang van de handhaving van de orde of de
      veiligheid in de inrichting, dan wel de beperking van de aansprakelijkheid van de directeur voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: '45.2'
    text: |-
      De directeur kan een gedetineerde toestemming geven hem toebehorende voorwerpen, waarvan het bezit niet is verboden
      ingevolge het eerste lid, in zijn verblijfsruimte te plaatsen dan wel bij zich te hebben voor zover dit zich
      verdraagt met de volgende belangen:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: 45.2.a
    text: de handhaving van de orde of de veiligheid in de inrichting;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: 45.2.b
    text: de aansprakelijkheid van de directeur voor de voorwerpen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: '45.3'
    text: |-
      De directeur kan aan de toestemming, bedoeld in het tweede lid, voorwaarden verbinden die kunnen betreffen het
      gebruik van en de aansprakelijkheid voor deze voorwerpen. Bij of krachtens algemene maatregel van bestuur kunnen
      regels worden gesteld krachtens welke de aansprakelijkheid van de directeur voor voorwerpen die een gedetineerde
      ingevolge het tweede lid onder zich heeft wordt beperkt tot een bepaald bedrag.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: '45.4'
    text: |-
      De directeur is bevoegd aan de gedetineerde toebehorende voorwerpen voor diens rekening te laten onderzoeken,
      teneinde vast te stellen of de toelating of het bezit daarvan kan worden toegestaan dan wel is verboden, ingevolge
      het eerste onderscheidenlijk het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: '45.5'
    text: |-
      De directeur is bevoegd voorwerpen ten aanzien waarvan geen toestemming is verleend dan wel die zijn verboden,
      ingevolge het eerste onderscheidenlijk het tweede lid, in beslag te nemen. Hij draagt zorg dat deze voorwerpen
      hetzij onder afgifte van een bewijs van ontvangst ten behoeve van de gedetineerde op diens kosten worden bewaard,
      hetzij voor diens rekening worden gezonden aan de verzender of een door de gedetineerde op te geven adres, hetzij
      met toestemming van de gedetineerde worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld
      met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel45
  - number: '46.1'
    text: |-
      Het bezit van contant geld door de gedetineerden in de inrichting of een afdeling is verboden, tenzij in de
      huisregels anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46
  - number: '46.2'
    text: |-
      In inrichtingen of afdelingen waar het bezit van contant geld door de gedetineerden verboden is, heeft de
      gedetineerde de beschikking over een rekening-courant bij de inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46
  - number: '46.3'
    text: |-
      In de huisregels kunnen nadere regels worden gesteld omtrent het bezit van contant geld en het gebruik van de
      rekening-courant. Deze regels kunnen een beperking betreffen van het bedrag waarover de gedetineerde ten hoogste in
      contanten of door middel van zijn rekeningcourant mag beschikken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46
  - number: 46a
    text: 'Voor de toepassing van deze paragraaf wordt onder gevaar verstaan: *Gevaar:*'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.1
    text: 'gevaar voor de gedetineerde, die het veroorzaakt, hetgeen onder meer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.1.a
    text: |-
      het gevaar dat de gedetineerde zich van het leven zal beroven of zichzelf ernstig lichamelijk letsel zal
      toebrengen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.1.b
    text: het gevaar dat de gedetineerde maatschappelijk te gronde gaat;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.1.c
    text: het gevaar dat de gedetineerde zichzelf in ernstige mate zal verwaarlozen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.1.d
    text: het gevaar dat de gedetineerde met hinderlijk gedrag agressie van anderen zal oproepen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.2
    text: 'gevaar voor een of meer anderen, hetgeen onder meer bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.2.a
    text: |-
      het gevaar dat de gedetineerde een ander van het leven zal beroven of hem ernstig lichamelijk letsel zal
      toebrengen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.2.b
    text: het gevaar voor de psychische gezondheid van een ander;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.2.c
    text: het gevaar dat de gedetineerde een ander, die aan zijn zorg is toevertrouwd, zal verwaarlozen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46a.3
    text: gevaar voor de algemene veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46a
  - number: 46b.1
    text: |-
      De directeur draagt zorg dat in overleg met de gedetineerde die in verband met zijn geestelijke gezondheidstoestand
      verblijft in een daartoe op grond van [artikel 14][ref1] aangewezen afdeling of inrichting een geneeskundig
      behandelingsplan wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
        hoofdstuk: III
  - number: 46b.2
    text: |-
      Het geneeskundig behandelingsplan is gericht op het zodanig wegnemen van het gevaar dat de psychische stoornis,
      psychogeriatrische aandoening of verstandelijke handicap de gedetineerde doet veroorzaken dat de gedetineerde niet
      langer in verband met zijn geestelijke gezondheidstoestand in een daartoe krachtens [artikel 14][ref1] aangewezen
      afdeling of inrichting behoeft te verblijven. Zo mogelijk geschiedt dit door het behandelen van de stoornis. Indien
      dit niet mogelijk is, geschiedt dit door het anderszins wegnemen van het gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '14'
        hoofdstuk: III
  - number: 46b.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een geneeskundig behandelingsplan
      tenminste moet voldoen en de voorschriften die bij een wijziging daarvan in acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
  - number: 46b.4
    text: Alvorens het geneeskundig behandelingsplan wordt vastgesteld, wordt overleg gepleegd met
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
  - number: 46b.4.a
    text: de curator indien de gedetineerde onder curatele is gesteld
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
  - number: 46b.4.b
    text: de mentor, indien ten behoeve van de gedetineerde een mentorschap is ingesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46b
  - number: 46c
    text: 'Geneeskundige behandeling van de geestelijke gezondheidstoestand van de gedetineerde vindt slechts plaats:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46c
  - number: 46c.a
    text: |-
      voor zover deze is voorzien in het geneeskundig behandelingsplan als bedoeld in [artikel 46b, eerste lid][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46b
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46c.b
    text: |-
      indien het overleg over het geneeskundig behandelingsplan, bedoeld in
      [artikel 46b, eerste lid of vierde lid][ref1], tot overeenstemming heeft geleid, en


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46b
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46c.c
    text: |-
      indien de gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref1], zich niet tegen de behandeling
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46c
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46b
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46d
    text: |-
      Indien niet voldaan wordt aan de voorwaarden van [artikel 46c, onderdelen b en c][ref1], kan als uiterste redmiddel
      niettemin geneeskundige behandeling plaatsvinden:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46c
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46d
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46c
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46d.a
    text: |-
      voor zover aannemelijk is dat zonder die geneeskundige behandeling het gevaar dat de psychische stoornis,
      psychogeriatrische aandoening of verstandelijke handicap de gedetineerde doet veroorzaken niet binnen een redelijke
      termijn kan worden weggenomen, of
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46d
  - number: 46d.b
    text: |-
      indien de directeur daartoe een besluit heeft genomen en dit naar het oordeel van een arts volstrekt noodzakelijk
      is om het gevaar dat de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap de
      gedetineerde binnen de inrichting doet veroorzaken, af te wenden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46d
  - number: 46e.1
    text: |-
      Geneeskundige behandeling overeenkomstig [artikel 46d, onder a][ref1], vindt plaats na een schriftelijke beslissing
      van de directeur waarin wordt vermeld voor welke termijn zij geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46e.2
    text: |-
      Ten behoeve van deze beslissing dient te worden overgelegd een verklaring van de behandelend psychiater alsmede een
      verklaring van een psychiater die de gedetineerde met het oog daarop kort tevoren heeft onderzocht maar niet bij
      diens behandeling betrokken was. Uit deze verklaringen dient te blijken dat de gedetineerde op wie de verklaring
      betrekking heeft, een psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap heeft en dat
      een geval als bedoeld in [artikel 46d, onder a][ref1], zich voordoet. De verklaringen moeten met redenen zijn
      omkleed en ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46e.3
    text: |-
      De beslissing als bedoeld in het eerste lid wordt gemeld aan de voorzitter van de Commissie van Toezicht. De
      voorzitter van de Commissie van Toezicht doet onverwijld een melding aan de maandcommissaris.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
  - number: 46e.4
    text: |-
      De termijn als bedoeld in het eerste lid is zo kort mogelijk, maar niet langer dan drie maanden, gerekend vanaf de
      dag waarop de beslissing tot stand komt. De directeur doet onverwijld een afschrift van de beslissing toekomen aan
      de gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46b
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46e.5
    text: |-
      Indien na afloop van de termijn als bedoeld in het eerste lid, voortzetting van de geneeskundige behandeling
      overeenkomstig [artikel 46d, onder a][ref1], nodig is, geschiedt dit slechts krachtens een schriftelijke beslissing
      van de directeur. Het bepaalde in de voorgaande volzin is eveneens van toepassing indien binnen zes maanden na
      afloop van de termijn als bedoeld in het vierde lid opnieuw behandeling overeenkomstig artikel 46d, onder a, nodig
      is. De gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref2], ontvangt onverwijld een afschrift
      van deze beslissing. De directeur geeft in zijn beslissing aan waarom van een behandeling alsnog het beoogde effect
      wordt verwacht. Op zodanige beslissingen is het vierde lid, eerste volzin van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel46b
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0009709
        artikel: 46b
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46e.6
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste, tweede,
      vierde en vijfde lid alsmede omtrent de toepassing van [artikel 46d onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 46e.7
    text: |-
      Deze in het zesde lid bedoelde regels betreffen in ieder geval de melding en de registratie van de behandeling
      alsmede de taak van de behandelend arts. Tevens kunnen categorieën van behandelingsmiddelen of -maatregelen worden
      aangewezen die niet mogen worden toegepast bij een geneeskundige behandeling als bedoeld in [artikel 46d][ref1].
      Bij algemene maatregel van bestuur kunnen voorts ten aanzien van daarbij aangegeven categorieën van
      behandelingsmiddelen of -maatregelen regels worden gegeven met betrekking tot de wijze waarop tot toepassing
      daarvan moet worden besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel46e
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: '47.1'
    text: De gedetineerde heeft recht op deelname aan de in de inrichting beschikbare arbeid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel47
  - number: '47.2'
    text: |-
      De directeur draagt zorg voor de beschikbaarheid van arbeid voor de gedetineerden, voor zover de aard van de
      detentie zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel47
  - number: '47.3'
    text: |-
      Gedetineerden die, al dan niet onherroepelijk, tot een vrijheidsstraf zijn veroordeeld zijn verplicht de aan hen
      door de directeur opgedragen arbeid, zowel binnen als buiten de inrichting of afdeling, te verrichten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel47
  - number: '47.4'
    text: |-
      De arbeidstijd wordt in de huisregels vastgesteld binnen de grenzen van hetgeen buiten de inrichting gebruikelijk
      is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel47
  - number: '47.5'
    text: |-
      Onze Minister stelt regels omtrent de samenstelling en de hoogte van het arbeidsloon. De directeur is belast met de
      vaststelling en uitbetaling van het arbeidsloon.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel47
  - number: '48.1'
    text: |-
      De gedetineerde heeft recht op het kennis nemen van het nieuws, voor eigen rekening, en het wekelijks gebruik maken
      van een bibliotheekvoorziening. De gedetineerde heeft het recht op het volgen van onderwijs en het deelnemen aan
      andere educatieve activiteiten voor zover deze zich verdragen met de aard en de duur van de detentie en de persoon
      van de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel48
  - number: '48.2'
    text: |-
      De gedetineerde heeft recht op lichamelijke oefening en het beoefenen van sport gedurende ten minste tweemaal drie
      kwartier per week, voor zover zijn gezondheid zich daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel48
  - number: '48.3'
    text: |-
      De directeur draagt zorg dat daarvoor in aanmerking komende functionarissen in de in het eerste lid, tweede volzin,
      en tweede lid bedoelde activiteiten kunnen voorzien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel48
  - number: '48.4'
    text: |-
      Onze Minister stelt regels omtrent de voorwaarden waaronder een tegemoetkoming kan worden verleend in de kosten die
      voor de gedetineerde aan het volgen van onderwijs en het deelnemen aan andere educatieve activiteiten voor zover
      hierin niet in de inrichting wordt voorzien, kunnen zijn verbonden. Deze voorwaarden kunnen betreffen de aard, de
      duur en de kosten van deze activiteiten alsmede de vooropleiding van de gedetineerde en diens vorderingen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel48
  - number: '49.1'
    text: |-
      De gedetineerde heeft recht op recreatie en dagelijks verblijf in de buitenlucht, voor zover zijn gezondheid zich
      daar niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel49
  - number: '49.2'
    text: |-
      De directeur draagt zorg dat de gedetineerde in de gelegenheid wordt gesteld tot deelname aan recreatieve
      activiteiten, gedurende ten minste zes uren per week.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel49
  - number: '49.3'
    text: |-
      De directeur draagt zorg dat de gedetineerde in de gelegenheid wordt gesteld dagelijks ten minste een uur in de
      buitenlucht te verblijven.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel49
  - number: '50.1'
    text: |-
      Indien een ambtenaar of medewerker constateert dat een gedetineerde betrokken is bij feiten die onverenigbaar zijn
      met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van de vrijheidsbeneming
      en hij voornemens is daarover aan de directeur schriftelijk verslag te doen, deelt hij dit de gedetineerde mede.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel50
  - number: '50.2'
    text: |-
      De directeur beslist over het opleggen van een disciplinaire straf zo spoedig mogelijk nadat hem dit verslag is
      gedaan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel50
  - number: '50.3'
    text: |-
      Indien de directeur of zijn plaatsvervanger feiten als bedoeld in het eerste lid constateert, blijft het eerste lid
      buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel50
  - number: '50.4'
    text: |-
      Een straf kan worden opgelegd dan wel ten uitvoer gelegd in een andere inrichting of afdeling dan waarin het
      verslag, bedoeld in het eerste lid, is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel50
  - number: '51.1'
    text: |-
      De directeur kan wegens het begaan van feiten als bedoeld in [artikel 50, eerste lid][ref1], de navolgende
      disciplinaire straffen opleggen:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel50
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '50'
        hoofdstuk: IX
  - number: 51.1.a
    text: opsluiting in een strafcel dan wel een andere verblijfsruimte voor ten hoogste twee weken;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: 51.1.b
    text: |-
      ontzegging van bezoek voor ten hoogste vier weken, indien het feit plaatsvond in verband met bezoek van die persoon
      of personen;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: 51.1.c
    text: uitsluiting van deelname aan een of meer bepaalde activiteiten voor ten hoogste twee weken;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: 51.1.d
    text: weigering, intrekking of beperking van het eerstvolgende verlof;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: 51.1.e
    text: geldboete tot een bedrag van ten hoogste tweemaal het in de inrichting of afdeling geldende weekloon.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: '51.2'
    text: |-
      De directeur bepaalt bij de oplegging van een geldboete tevens door welke andere straf deze zal worden vervangen,
      ingeval de boete niet binnen de daartoe door hem gestelde termijn is betaald.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: '51.3'
    text: |-
      De directeur kan voor feiten als bedoeld in [artikel 50, eerste lid][ref1], meer dan één straf opleggen, met dien
      verstande dat de in het eerste lid onder a en c genoemde straffen slechts kunnen worden opgelegd voor zover zij
      tezamen niet langer duren dan twee weken;


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel50
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '50'
        hoofdstuk: IX
  - number: '51.4'
    text: |-
      De oplegging van een straf laat onverlet de mogelijkheid voor de directeur om terzake van de door de gedetineerde
      toegebrachte schade met hem een regeling te treffen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: '51.5'
    text: |-
      Geen straf kan worden opgelegd, indien de gedetineerde voor het begaan van een feit als bedoeld in
      [artikel 50, eerste lid][ref1], niet verantwoordelijk kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel50
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '50'
        hoofdstuk: IX
  - number: '51.6'
    text: |-
      Indien een straf is opgelegd wordt deze onverwijld ten uitvoer gelegd. De directeur kan bepalen dat een straf niet
      of slechts ten dele ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51
  - number: 51a.1
    text: |-
      De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de gedetineerde
      noodzakelijk is, bepalen dat de gedetineerde die in een strafcel verblijft, dag en nacht door middel van een camera
      wordt geobserveerd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51a
  - number: 51a.2
    text: |-
      Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel51a
  - number: '52.1'
    text: |-
      Indien de tenuitvoerlegging van de opsluiting in een strafcel in de inrichting of afdeling waarin zij is opgelegd
      niet mogelijk is of op ernstige bezwaren stuit, kan zij in een andere inrichting of afdeling worden ondergaan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel52
  - number: '52.2'
    text: |-
      Indien de directeur van oordeel is dat de in het eerste lid bedoelde omstandigheid zich voordoet, plaatst hij in
      overeenstemming met Onze Minister de gedetineerde hiertoe over.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel52
  - number: '52.3'
    text: Onze Minister stelt nadere regels omtrent de procedure van overplaatsing ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel52
  - number: '53.1'
    text: Een straf kan geheel of ten dele voorwaardelijk worden opgelegd. De proeftijd bedraagt ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel53
  - number: '53.2'
    text: |-
      De directeur stelt in elk geval als voorwaarde dat de gedetineerde zich onthoudt van het plegen van feiten die
      onverenigbaar zijn met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van
      de vrijheidsbeneming. De directeur kan andere voorwaarden aan het gedrag van de gedetineerde stellen. De opgelegde
      voorwaarden worden vermeld in de mededeling, bedoeld in [artikel 58, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel58
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '58'
        hoofdstuk: X
  - number: '53.3'
    text: |-
      Bij het overtreden van een voorwaarde binnen de proeftijd kan de directeur bepalen dat de opgelegde voorwaardelijke
      straf geheel of ten dele ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel53
  - number: '53.4'
    text: De directeur kan een onvoorwaardelijke straf geheel of ten dele omzetten in een voorwaardelijke straf.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel53
  - number: '54.1'
    text: Van elke strafoplegging dan wel wijziging daarvan houdt de directeur aantekening.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel54
  - number: '54.2'
    text: |-
      Indien een straf ingevolge de [hoofdstukken XI][ref1] of [XII][ref2] geheel of ten dele wordt herzien, houdt de
      directeur hiervan aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
      [ref2]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXII
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        hoofdstuk: XII
  - number: '55.1'
    text: |-
      De gedetineerde aan wie de disciplinaire straf van opsluiting, bedoeld in [artikel 51, eerste lid, onder a][ref1],
      is opgelegd is uitgesloten van het deelnemen aan activiteiten, voor zover de directeur niet anders bepaalt en
      behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 49, derde lid][ref2]. De directeur kan het
      contact met de buitenwereld gedurende het verblijf in de strafcel beperken of uitsluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel49
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '51'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '49'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '55.2'
    text: |-
      De directeur draagt zorg dat, ingeval de opsluiting in een strafcel ten uitvoer wordt gelegd en langer dan
      vierentwintig uren duurt, de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger
      terstond hiervan in kennis worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel55
  - number: '55.3'
    text: |-
      Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de strafcel. Deze betreffen in elk
      geval de rechten die tijdens het verblijf in de strafcel aan de gedetineerde toekomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel55
  - number: '56.1'
    text: |-
      De directeur draagt zorg dat de gedetineerde bij binnenkomst in de inrichting, schriftelijk en zoveel mogelijk in
      een voor hem begrijpelijke taal, op de hoogte wordt gesteld van zijn bij of krachtens deze wet gestelde rechten
      en plichten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
  - number: '56.2'
    text: 'De gedetineerde wordt hierbij in het bijzonder gewezen op diens bevoegdheid:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
  - number: 56.2.a
    text: |-
      een bezwaar- of verzoekschrift in te dienen overeenkomstig [hoofdstuk IV][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: IV
  - number: 56.2.b
    text: zich te wenden tot de maandcommissaris van de commissie van toezicht;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
  - number: 56.2.c
    text: |-
      een klaag- of beroepschrift in te dienen overeenkomstig de [hoofdstukken XI][ref1], [XII][ref2] en [XIII][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
      [ref2]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXII
      [ref3]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXIII
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        hoofdstuk: XII
      - id: ref3
        bwb_id: BWBR0009709
        hoofdstuk: XIII
  - number: '56.3'
    text: |-
      Een gedetineerde vreemdeling wordt bij binnenkomst in de inrichting geïnformeerd over zijn recht de consulaire
      vertegenwoordiger van zijn land van zijn detentie op de hoogte te laten stellen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel56
  - number: '57.1'
    text: |-
      De directeur stelt de gedetineerde in de gelegenheid te worden gehoord, zoveel mogelijk in een voor hem
      begrijpelijke taal, alvorens hij beslist omtrent:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
  - number: 57.1.a
    text: |-
      de weigering of intrekking van de toestemming om een kind in de inrichting onder te brengen, bedoeld in
      [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel12
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '12'
        hoofdstuk: III
  - number: 57.1.b
    text: |-
      de uitsluiting van deelname aan activiteiten en de verlenging daarvan, bedoeld in
      [artikel 23, eerste lid, onder a of b, onderscheidenlijk tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: 57.1.c
    text: |-
      de plaatsing in afzondering en de verlenging hiervan, bedoeld in [artikel 24, eerste lid][ref1], op grond van
      [artikel 23, eerste lid, onder a of b][ref2], onderscheidenlijk [artikel 24, derde lid][ref3], en de toepassing
      van [artikel 25][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel25
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: 57.1.d
    text: |-
      de beperking en de intrekking van verlof, bedoeld in [artikel 26, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel26
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '26'
        hoofdstuk: V
        paragraaf: '3'
  - number: 57.1.e
    text: |-
      het onderzoek in het lichaam, bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel31
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '31'
        hoofdstuk: VI
  - number: 57.1.f
    text: |-
      het gedogen van een geneeskundige handeling, bedoeld in [artikel 32][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel32
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '32'
        hoofdstuk: VI
  - number: 57.1.g
    text: |-
      het verrichten van een geneeskundige behandeling bedoeld in [artikel 46d, onder a of b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46d
        hoofdstuk: VIII
        paragraaf: 1a
  - number: 57.1.h
    text: |-
      de bevestiging door mechanische middelen en de verlenging daarvan, bedoeld in
      [artikel 33, eerste onderscheidenlijk derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel33
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '33'
        hoofdstuk: VI
  - number: 57.1.i
    text: |-
      de observatie door middel van een camera en de verlenging daarvan, bedoeld in
      [artikel 34a, eerste onderscheidenlijk derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel34a
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 34a
        hoofdstuk: VI
  - number: 57.1.j
    text: |-
      de observatie door middel van een camera, bedoeld in de [artikelen 24a, eerste lid][ref1], en
      [51a, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel51a
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 24a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: 51a
        hoofdstuk: IX
  - number: 57.1.k
    text: |-
      de oplegging van een disciplinaire straf, bedoeld in [artikel 51][ref1], en toepassing van de [artikelen 52][ref2]
      en [53, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel53
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '51'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '52'
        hoofdstuk: IX
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '53'
        hoofdstuk: IX
  - number: '57.2'
    text: |-
      Zo nodig geschiedt het horen van de gedetineerde met bijstand van een tolk. Van het horen van de gedetineerde wordt
      aantekening gehouden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
  - number: '57.3'
    text: 'Toepassing van het eerste lid, onder b, c, d, e, f en h, kan achterwege blijven indien:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
  - number: 57.3.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
  - number: 57.3.b
    text: de gemoedstoestand van de gedetineerde daaraan in de weg staat.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel57
  - number: '58.1'
    text: |-
      De directeur geeft de gedetineerde van elke beslissing als bedoeld in [artikel 57, eerste lid][ref1], onverwijld
      schriftelijk en zoveel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en
      ondertekende mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel57
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '57'
        hoofdstuk: X
  - number: '58.2'
    text: 'De directeur geeft de gedetineerde op de in het eerste lid omschreven wijze een mededeling omtrent:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
  - number: 58.2.a
    text: |-
      de weigering van verzending of uitreiking van een brief of ander poststuk dan wel van bijgesloten voorwerpen,
      bedoeld in [artikel 36, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '36'
        hoofdstuk: VII
  - number: 58.2.b
    text: |-
      de weigering van de toelating tot de gedetineerde van een bepaald persoon of bepaalde personen, bedoeld in
      [artikel 38, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel38
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '38'
        hoofdstuk: VII
  - number: 58.2.c
    text: |-
      het verbod van het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken, bedoeld in
      [artikel 39, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel39
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '39'
        hoofdstuk: VII
  - number: 58.2.d
    text: |-
      de weigering van een contact met een vertegenwoordiger van de media, bedoeld in [artikel 40, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel40
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '40'
        hoofdstuk: VII
  - number: '58.3'
    text: |-
      In de gevallen, genoemd in het tweede lid, kan de mededeling achterwege blijven, indien de beslissing
      van de directeur strekt ter uitvoering van een beperking die aan de gedetineerde is opgelegd ingevolge de
      [artikelen 62][ref1], [62a][ref2] en [76 van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel62a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel76
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 62a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '76'
  - number: '58.4'
    text: |-
      De gedetineerde wordt in de mededeling, bedoeld in het eerste en tweede lid, gewezen op de mogelijkheid van het
      instellen van beklag, bedoeld in [hoofdstuk Xl][ref1], de wijze waarop en de termijn waarbinnen zulks dient te
      geschieden, alsmede op de mogelijkheid tot het doen van een verzoek aan de voorzitter van de beroepscommissie
      om hangende de uitspraak op het klaagschrift de tenuitvoerlegging van de beslissing geheel of gedeeltelijk te
      schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0009709
        hoofdstuk: XI
  - number: '59'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de aanleg van dossiers. In elk
      geval betreffen deze de omschrijving van gedetineerden over wie een dossier moet worden aangelegd, de aard van de
      daarin vervatte informatie, het recht op inzage of afschrift van het dossier door de betrokken gedetineerde en de
      beperkingen daarop en de termijn gedurende welke alsmede de wijze waarop het dossier bewaard blijft.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel59
  - number: '60.1'
    text: |-
      Een gedetineerde kan bij de beklagcommissie beklag doen over een hem betreffende door of namens de directeur
      genomen beslissing.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel60
  - number: '60.2'
    text: |-
      Met een beslissing als bedoeld in het eerste lid wordt gelijkgesteld een verzuim of weigering om te beslissen. Het
      nemen van een beslissing wordt geacht te zijn verzuimd of geweigerd, indien niet binnen de wettelijke of, bij het
      ontbreken daarvan, binnen een redelijke termijn een beslissing is genomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel60
  - number: '60.3'
    text: |-
      De directeur draagt zorg dat een gedetineerde die beklag wenst te doen daartoe zo spoedig mogelijk in de
      gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel60
  - number: '61.1'
    text: |-
      De gedetineerde doet beklag door de indiening van een klaagschrift bij de beklagcommissie bij de inrichting waar de
      beslissing waarover hij klaagt is genomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel61
  - number: '61.2'
    text: |-
      De indiening van het klaagschrift kan door tussenkomst van de directeur van de inrichting waar de gedetineerde
      verblijft geschieden. De directeur draagt in dat geval zorg dat het klaagschrift of, indien het klaagschrift zich
      in een envelop bevindt, de envelop van een dagtekening wordt voorzien, welke geldt als dag van indiening.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel61
  - number: '61.3'
    text: |-
      Het klaagschrift vermeldt zo nauwkeurig mogelijk de beslissing waarover wordt geklaagd en de redenen van het
      beklag.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel61
  - number: '61.4'
    text: |-
      Indien de gedetineerde de Nederlandse taal niet voldoende beheerst kan hij het klaagschrift in een andere taal
      indienen. De voorzitter van de beklagcommissie kan bepalen dat het klaagschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt volgens regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel61
  - number: '61.5'
    text: |-
      Het klaagschrift wordt uiterlijk op de zevende dag na die waarop de gedetineerde kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen ingediend. Een na afloop van deze termijn ingediend klaagschrift is
      niettemin ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de gedetineerde in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel61
  - number: '62.1'
    text: |-
      Het klaagschrift wordt behandeld door een door de commissie van toezicht benoemde beklagcommissie, bestaande uit
      drie leden, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel62
  - number: '62.2'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beklagcommissie kan, indien hij het beklag van eenvoudige
      aard, dan wel kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, het klaagschrift
      enkelvoudig afdoen, met dien verstande dat hij tevens de bevoegdheden bezit die aan de voorzitter van de voltallige
      beklagcommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel62
  - number: '62.3'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het tweede lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel62
  - number: '62.4'
    text: |-
      De behandeling van het klaagschrift vindt niet in het openbaar plaats, behoudens ingeval de beklagcommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel62
  - number: '63.1'
    text: De secretaris van de beklagcommissie zendt de directeur een afschrift van het klaagschrift toe.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel63
  - number: '63.2'
    text: |-
      De directeur geeft dienaangaande zo spoedig mogelijk schriftelijk de nodige inlichtingen aan de beklagcommissie,
      tenzij hij van oordeel is dat het klaagschrift kennelijk niet-ontvankelijk of kennelijk ongegrond is of tenzij
      het vierde lid toepassing vindt. Hij voegt daaraan de opmerkingen toe, waartoe het klaagschrift hem overigens
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel63
  - number: '63.3'
    text: |-
      Aan de klager geeft de secretaris van de beklagcommissie schriftelijk kennis van de inhoud van deze inlichtingen
      en opmerkingen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel63
  - number: '63.4'
    text: |-
      De beklagcommissie kan het klaagschrift in handen stellen van het lid van de commissie van toezicht, bedoeld in
      [artikel 7, derde lid][ref1], teneinde deze in de gelegenheid te stellen terzake te bemiddelen. De secretaris doet
      hiervan mededeling aan de directeur.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel7
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '7'
        hoofdstuk: II
  - number: '64.1'
    text: |-
      De beklagcommissie stelt de klager en de directeur in de gelegenheid omtrent het klaagschrift mondeling opmerkingen
      te maken, tenzij zij het beklag aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond
      acht.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel64
  - number: '64.2'
    text: |-
      De klager en de directeur kunnen de voorzitter van de beklagcommissie de vragen opgeven die zij aan elkaar gesteld
      wensen te zien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel64
  - number: '64.3'
    text: |-
      De beklagcommissie kan de directeur en de klager buiten elkaars aanwezigheid horen. In dat geval worden zij in de
      gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de zakelijke inhoud van de
      aldus afgelegde verklaring door de voorzitter van de beklagcommissie aan de klager onderscheidenlijk de directeur
      mondeling medegedeeld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel64
  - number: '64.4'
    text: |-
      De beklagcommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen, zijn het tweede en derde lid, tweede volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel64
  - number: '65.1'
    text: |-
      De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon,
      die daartoe van de beklagcommissie toestemming heeft gekregen. Indien aan de klager een advocaat is toegevoegd,
      geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens regelen te stellen bij algemene
      maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel65
  - number: '65.2'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden volgens regelen te
      stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel65
  - number: '65.3'
    text: |-
      Tijdens de beklagprocedure staat de beklagcommissie aan de klager op diens verzoek toe van de gedingstukken kennis
      te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel65
  - number: '65.4'
    text: |-
      Indien de klager elders verblijft kunnen de opmerkingen, bedoeld in [artikel 64, eerste lid][ref1], op verzoek van
      de beklagcommissie ten overstaan van een lid van een andere beklagcommissie worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel64
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '64'
        hoofdstuk: XI
  - number: '65.5'
    text: |-
      Van het horen van de betrokkenen maakt de secretaris een schriftelijk verslag, dat door de voorzitter en de
      secretaris wordt ondertekend. Bij verhindering van een van hen wordt de reden daarvan in het verslag vermeld.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel65
  - number: '66.1'
    text: |-
      Hangende de uitspraak op het klaagschrift kan de voorzitter van de beroepscommissie op verzoek van de klager, na de
      directeur te hebben gehoord, de tenuitvoerlegging van de beslissing waarop het klaagschrift betrekking heeft geheel
      of gedeeltelijk schorsen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel66
  - number: '66.2'
    text: De voorzitter doet hiervan onverwijld mededeling aan de directeur en de klager.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel66
  - number: '67.1'
    text: |-
      De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van vier weken te rekenen vanaf
      de datum waarop het klaagschrift is ontvangen, uitspraak. In bijzondere omstandigheden kan de beklagcommissie deze
      termijn met ten hoogste vier weken verlengen. Van deze verlenging wordt aan de directeur en de klager mededeling
      gedaan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
  - number: '67.2'
    text: |-
      De uitspraak is met redenen omkleed en gedagtekend. Zij bevat een verslag van het horen van personen door de
      beklagcommissie. Zij wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering van één
      van hen wordt de reden daarvan in de uitspraak vermeld. Aan de klager en de directeur wordt onverwijld en kosteloos
      een afschrift van de beslissing van de beklagcommissie toegezonden of uitgereikt. De datum van die toezending of
      uitreiking wordt op dit afschrift aangetekend.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
  - number: '67.3'
    text: |-
      De uitspraak vermeldt de mogelijkheid van het instellen van beroep bij de beroepscommissie, de wijze waarop en de
      termijn waarbinnen dit moet worden gedaan alsmede de mogelijkheid tot schorsing van de tenuitvoerlegging van de
      uitspraak, bedoeld in [artikel 70, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel70
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '70'
        hoofdstuk: XII
  - number: '67.4'
    text: |-
      Indien de klager de Nederlandse taal niet voldoende beheerst en in de inrichting niet op andere wijze in een
      vertaling kan worden voorzien, draagt de voorzitter van de beklagcommissie zorg voor een vertaling van de uitspraak
      en de mededeling, bedoeld in het tweede, onderscheidenlijk derde lid. De vergoeding van de voor de vertaling
      gemaakte kosten geschiedt volgens regelen te stellen bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
  - number: '67.5'
    text: |-
      De voorzitter van de beklagcommissie kan de uitspraak ook mondeling mededelen aan de klager en de directeur. Zij
      worden daarbij gewezen op de mogelijkheid tot het instellen van beroep bij de beroepscommissie, de wijze waarop
      en de termijn waarbinnen dit moet worden gedaan, alsmede op de mogelijkheid tot schorsing van de tenuitvoerlegging
      van de uitspraak, bedoeld in [artikel 70, tweede lid][ref1]. Als dag van de uitspraak geldt de dag van het doen van
      deze mededeling. Indien mondeling uitspraak wordt gedaan, wordt deze uitspraak op het klaagschrift aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel70
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '70'
        hoofdstuk: XII
  - number: '67.6'
    text: |-
      Indien het vijfde lid toepassing heeft gevonden en beroep wordt ingesteld als voorzien in
      [artikel 69, eerste lid][ref1], vindt uitwerking van de beslissing van de beklagcommissie plaats op de wijze,
      bedoeld in het tweede lid. De secretaris van de beklagcommissie zendt een afschrift van deze uitspraak toe aan de
      directeur, de klager en de beroepscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel69
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '69'
        hoofdstuk: XII
  - number: '67.7'
    text: |-
      De secretaris zendt van alle uitspraken van de beklagcommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg
      dat dit afschrift geen gegevens bevat waaruit de identiteit van de gedetineerde kan worden afgeleid. Met betrekking
      tot de kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref1]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '68.1'
    text: 'De uitspraak van de beklagcommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.1.a
    text: niet-ontvankelijkverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.1.b
    text: ongegrondverklaring van het beklag;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.1.c
    text: gegrondverklaring van het beklag.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.2'
    text: 'Indien de beklagcommissie van oordeel is dat de beslissing waarover is geklaagd:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.2.a
    text: |-
      in strijd is met een in de inrichting geldend wettelijk voorschrift of een een ieder verbindende bepaling van een
      in Nederland geldend verdrag, dan wel
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.2.b
    text: |-
      bij afweging van alle in aanmerking komende belangen, waaronder de veiligheid van de samenleving en de belangen
      van slachtoffers en nabestaanden, onredelijk of onbillijk moet worden geacht, verklaart zij het beklag gegrond en
      vernietigt zij de beslissing geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.3'
    text: 'Bij toepassing van het tweede lid kan de beklagcommissie:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.3.a
    text: de directeur opdragen een nieuwe beslissing te nemen met inachtneming van haar uitspraak;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.3.b
    text: bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: 68.3.c
    text: volstaan met de gehele of gedeeltelijke vernietiging.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.4'
    text: Bij toepassing van het derde lid, onder a, kan de beklagcommissie in haar uitspraak een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.5'
    text: De beklagcommissie kan bepalen dat de uitspraak buiten werking blijft totdat deze onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.6'
    text: |-
      Indien het tweede lid toepassing vindt, worden de rechtsgevolgen van de vernietigde beslissing, voor zover
      mogelijk, door de directeur ongedaan gemaakt, dan wel in overeenstemming gebracht met de uitspraak van de
      beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '68.7'
    text: |-
      Voor zover de in het zesde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie dan
      wel de voorzitter, na de directeur te hebben gehoord, of enige tegemoetkoming aan de klager geboden is. Zij stelt
      de tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel68
  - number: '69.1'
    text: |-
      Tegen de uitspraak van de beklagcommissie kunnen de directeur en de klager beroep instellen door het indienen van
      een beroepschrift. Het met redenen omklede beroepschrift moet uiterlijk op de zevende dag na die van de ontvangst
      van het afschrift van de uitspraak onderscheidenlijk na die van de mondelinge mededeling van de uitspraak worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: '69.2'
    text: |-
      Het beroepschrift wordt ingediend bij en behandeld door een door de Raad benoemde beroepscommissie van drie leden
      of buitengewone leden, die wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: '69.3'
    text: |-
      De voorzitter dan wel een door hem aangewezen lid van de beroepscommissie die een met rechtspraak belast lid van de
      rechterlijke macht is, kan het beroepschrift enkelvoudig afdoen indien hij het beroep kennelijk niet-ontvankelijk,
      kennelijk ongegrond of kennelijk gegrond acht, met dien verstande dat hij tevens de bevoegdheden bezit die aan de
      voorzitter van de voltallige beroepscommissie toekomen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: '69.4'
    text: |-
      De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het derde lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beroepscommissie.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: '69.5'
    text: |-
      Ten aanzien van de behandeling van het beroepschrift zijn de [artikelen 60, derde lid][ref1],
      [61, vierde lid][ref2], [62, vierde lid][ref3], [63, eerste, tweede en derde lid][ref4], [64][ref5], en
      [65, eerste, tweede en derde lid][ref6], van overeenkomstige toepassing, met dien verstande dat de beroepscommissie
      kan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0009709#Artikel64
      [ref6]: https://wetten.overheid.nl/BWBR0009709#Artikel65
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '60'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '61'
        hoofdstuk: XI
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '62'
        hoofdstuk: XI
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '63'
        hoofdstuk: XI
      - id: ref5
        bwb_id: BWBR0009709
        artikel: '64'
        hoofdstuk: XI
      - id: ref6
        bwb_id: BWBR0009709
        artikel: '65'
        hoofdstuk: XI
  - number: 69.5.a
    text: |-
      de directeur en de klager uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te
      lichten;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: 69.5.b
    text: de mondelinge opmerkingen ten overstaan van een lid van de beroepscommissie kunnen worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: 69.5.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de directeur en de klager uitsluitend in de
      gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel69
  - number: '70.1'
    text: |-
      Het indienen van een beroepschrift schorst de tenuitvoerlegging van de uitspraak van de beklagcommissie niet,
      behalve voor zover deze de toekenning van een tegemoetkoming als bedoeld in [artikel 68, zevende lid][ref1],
      inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel68
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '68'
        hoofdstuk: XI
  - number: '70.2'
    text: |-
      Hangende de uitspraak op het beroepschrift kan de voorzitter van de beroepscommissie op verzoek van degene die
      het beroep heeft ingesteld en gehoord de andere betrokkene in de procedure de tenuitvoerlegging van de uitspraak
      van de beklagcommissie geheel of gedeeltelijk schorsen. Hij doet hiervan onverwijld mededeling aan de directeur en
      de klager.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel70
  - number: '71.1'
    text: De beroepscommissie doet zo spoedig mogelijk uitspraak.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: '71.2'
    text: 'De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: 71.2.a
    text: niet-ontvankelijkverklaring van het beroep;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: 71.2.b
    text: bevestiging van de uitspraak van de beklagcommissie, hetzij met overneming, hetzij met verbetering van de gronden;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: 71.2.c
    text: vernietiging van de uitspraak van de beklagcommissie.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: '71.3'
    text: |-
      Indien het tweede lid, onder c, toepassing vindt, doet de beroepscommissie hetgeen de beklagcommissie had behoren
      te doen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
  - number: '71.4'
    text: |-
      Ten aanzien van de uitspraak van de beroepscommissie zijn de [artikelen 66][ref1] en
      [67, tweede lid, eerste en derde tot en met vijfde volzin, vierde en zevende lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel67
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '66'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '67'
        hoofdstuk: XI
  - number: '72.1'
    text: |-
      De betrokkene heeft het recht tegen de beslissing van Onze Minister op het bezwaar- of verzoekschrift voor
      zover dit betreft een gehele of gedeeltelijke ongegrondverklaring, onderscheidenlijk afwijzing als bedoeld in de
      [artikelen 17][ref1] en [18][ref2] een met redenen omkleed beroepschrift in te dienen bij de commissie, bedoeld
      in [artikel 73, eerste lid][ref3]. De betrokkene heeft ook het recht een beroepschrift in te dienen in het geval
      dat het indienen van een bezwaarschrift op de grond als vermeld in [artikel 17, vijfde lid][ref4], achterwege is
      gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel17
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009709
        artikel: '73'
        hoofdstuk: XIII
      - id: ref4
        bwb_id: BWBR0009709
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '72.2'
    text: |-
      De gedetineerde heeft het recht tegen een hem betreffende beslissing aangaande verlof, voor zover hiertegen geen
      beklag ingevolge [artikel 60, eerste en tweede lid][ref1], openstaat, een met redenen omkleed beroepschrift in te
      dienen bij de commissie, bedoeld in [artikel 73, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel73
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '60'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '73'
        hoofdstuk: XIII
  - number: '72.3'
    text: |-
      Tegen de beslissing als bedoeld in het eerste lid van [artikel 46e][ref1] kan rechtstreeks beroep worden ingesteld
      bij de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46e
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 46e
        hoofdstuk: VIII
        paragraaf: 1a
  - number: '73.1'
    text: |-
      Het beroepschrift wordt behandeld door een door de Raad benoemde commissie van drie leden of buitengewone
      leden, die wordt bijgestaan door een secretaris. Ten aanzien van het beroepschrift, bedoeld in
      [artikel 72, eerste lid][ref1], is [artikel 69, derde en vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel69
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '72'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '69'
        hoofdstuk: XII
  - number: '73.2'
    text: |-
      Het beroepschrift wordt ingediend uiterlijk op de zevende dag na die waarop de betrokkene kennis heeft gekregen
      van de beslissing waartegen hij beroep instelt. Een na afloop van deze termijn ingediend beroepschrift is niettemin
      ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de gedetineerde in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
  - number: '73.3'
    text: |-
      Indien de betrokkene gedetineerd is, kan de indiening van het beroepschrift geschieden door tussenkomst van
      de directeur van de inrichting of afdeling waar hij verblijft. De directeur draagt zorg dat het beroepschrift
      onverwijld van een dagtekening wordt voorzien. Als dag waarop het beroepschrift is ingediend geldt die van de
      dagtekening.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
  - number: '73.4'
    text: |-
      De [artikelen 60, derde lid][ref1], [61, vierde lid][ref2], [63][ref3], [64][ref4], [65][ref5], [66][ref6],
      __REF006___________________________________________________________________________________________________________
      ___________, [68, eerste, tweede, derde, vierde, zesde en zevende lid][ref8], zijn van overeenkomstige toepassing,
      met dien verstande dat de commissie, bedoeld in het eerste lid, kan bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel64
      [ref5]: https://wetten.overheid.nl/BWBR0009709#Artikel65
      [ref6]: https://wetten.overheid.nl/BWBR0009709#Artikel66
      [ref7]: https://wetten.overheid.nl/BWBR0009709#Artikel67
      [ref8]: https://wetten.overheid.nl/BWBR0009709#Artikel68
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
