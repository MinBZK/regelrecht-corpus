preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de penitentiaire regelgeving te herzien, in het
    bijzonder aangaande het differentiatie- en selectiestelsel, en in verband daarmee de Beginselenwet gevangeniswezen
    te vervangen door de Penitentiaire beginselenwet alsmede enige bepalingen van het Wetboek van Strafrecht, het
    Wetboek van Strafvordering en enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#ArtikelAanhef
