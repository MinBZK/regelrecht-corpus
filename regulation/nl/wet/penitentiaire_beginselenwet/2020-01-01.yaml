        hoofdstuk: VIII
  - number: 1.s
    text: 'vrijheidsstraf: gevangenisstraf, (vervangende) hechtenis, militaire detentie en (vervangende) jeugddetentie;'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel1
  - number: 1.t
    text: |-
      vrijheidsbenemende maatregel: voorlopige hechtenis, vreemdelingenbewaring, gijzeling, lijfsdwang,
      terbeschikkingstelling met bevel tot verpleging, plaatsing in een inrichting voor stelselmatige daders en
      vrijheidsbeneming die op andere dan de in [artikel 1, onder s][ref1], genoemde gronden plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel1
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '1'
        hoofdstuk: I
  - number: 1.u
    text: |-
      strafrestant: het gedeelte van een opgelegde vrijheidsstraf dan wel van het samenstel van dergelijke straffen dat
      nog moet worden ondergaan, waarbij wordt uitgegaan van de toepassing van de voorwaardelijke invrijheidstelling
      volgens de daarvoor geldende wettelijke regeling;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel1
  - number: 1.v
    text: |-
      goed gedrag: een zodanige opstelling van een gedetineerde dat hij, met name door de wijze waarop hij het recht op
      deelname aan de in de inrichting beschikbare arbeid heeft aangewend of door andere, vergelijkbare, activiteiten
      binnen de inrichting, heeft doen blijken van een bijzondere geschiktheid tot terugkeer in de samenleving;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel1
  - number: 1.w
    text: |-
      elektronisch toezicht: een technische voorziening waarbij, gebruik makend van signalen, met regelmatige tussenpozen
      de aanwezigheid van een bepaalde persoon op een bepaalde tijd en plaats gecontroleerd wordt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel1
  - number: '2.1'
    text: |-
      De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel vindt, voor zover niet bij of krachtens
      de wet anders is bepaald, plaats door onderbrenging van de persoon aan wie deze is opgelegd in een penitentiaire
      inrichting dan wel door diens deelname aan een penitentiair programma.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel2
  - number: '2.2'
    text: |-
      Met handhaving van het karakter van de vrijheidsstraf of de vrijheidsbenemende maatregel wordt de tenuitvoerlegging
      hiervan zoveel mogelijk en afhankelijk van het gedrag van de betrokkene dienstbaar gemaakt aan de voorbereiding van
      de terugkeer in de maatschappij. Bij het verlenen van vrijheden aan gedetineerden wordt rekening gehouden met de
      veiligheid van de samenleving en de belangen van slachtoffers en nabestaanden.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel2
  - number: '2.3'
    text: |-
      Personen ten aanzien van wie de tenuitvoerlegging plaatsvindt van een vrijheidsstraf of vrijheidsbenemende
      maatregel worden aan geen andere beperkingen onderworpen dan die welke voor het doel van de vrijheidsbeneming of in
      het belang van de handhaving van de orde of de veiligheid in de inrichting noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel2
  - number: '3.1'
    text: Onze Minister wijst penitentiaire inrichtingen aan.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het opperbeheer van de inrichtingen berust bij Onze Minister. Onze Minister kan mandaat verlenen betreffende de hem
      bij of krachtens deze wet toegekende bevoegdheden tot het vaststellen van algemeen verbindende voorschriften aan
      het hoofd van de Dienst Justitiële Inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het beheer van een inrichting of afdeling berust bij de directeur, die als zodanig door Onze Minister wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel3
  - number: '3.4'
    text: Onze Minister wijst een of meer personen aan als plaatsvervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende het beheer van en het
      regime in een inrichting.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel3
  - number: '4.1'
    text: |-
      Een penitentiair programma is een samenstel van activiteiten waaraan wordt deelgenomen door personen ter verdere
      tenuitvoerlegging van de aan hen opgelegde vrijheidsstraf of voorlopige hechtenis in aansluiting op hun verblijf
      in een inrichting en dat als zodanig door Onze Minister is erkend. De deelnemer aan een penitentiair programma kan
      onder elektronisch toezicht worden gesteld. Bij het uitoefenen van toezicht op de deelname aan een penitentiair
      programma wordt de identiteit van de deelnemer aan het penitentiair programma vastgesteld op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27a
  - number: '4.2'
    text: |-
      Aan een penitentiair programma kan worden deelgenomen gedurende ten hoogste een zesde deel van de opgelegde
      vrijheidsstraf direct voorafgaand aan de datum van invrijheidstelling, mits:
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.2.a
    text: de gedetineerde is veroordeeld tot een onvoorwaardelijke vrijheidsstraf van ten minste zes maanden,
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.2.b
    text: |-
      het strafrestant bij aanvang van de deelname aan het penitentiair programma ten minste vier weken en ten hoogste
      een jaar bedraagt, en
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.2.c
    text: er geen andere omstandigheden zijn die zich tegen zijn deelname verzetten.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: '4.3'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld die in elk geval betreffen:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.3.a
    text: de inhoud van het penitentiair programma,
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.3.b
    text: de nadere voorwaarden voor deelname aan het penitentiair programma,
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.3.c
    text: het toezicht, waaronder het elektronisch toezicht, tijdens de deelname,
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.3.d
    text: de gevolgen van verzuim van deelname aan het programma of niet-nakoming van de daaraan verbonden voorwaarden, en
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: 4.3.e
    text: de rechtspositie van de deelnemers aan een penitentiair programma.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: '4.5'
    text: |-
      Met inachtneming van het tweede lid en de regels krachtens het derde lid kan Onze Minister een penitentiair
      programma erkennen en bepalen welke gedetineerden voor deelname hieraan in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
  - number: '4.6'
    text: |-
      Het tweede lid is niet van toepassing op de maatregel tot plaatsing in een inrichting voor stelselmatige daders als
      bedoeld in [artikel 38m van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 38m
  - number: '5.1'
    text: |-
      De directeur stelt, in aanvulling op de bij of krachtens deze wet gegeven regels en met inachtneming van het
      dienaangaande door Onze Minister vast te stellen model en door deze te geven aanwijzingen, huisregels voor de
      inrichting of afdeling vast.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
  - number: '5.2'
    text: |-
      De directeur kan ambtenaren en medewerkers machtigen tot de uitoefening van hem bij of krachtens deze wet gegeven
      bevoegdheden en de naleving van zijn zorgplichten, met uitzondering van de bevoegdheden, genoemd in het eerste en
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
  - number: '5.3'
    text: |-
      De directeur is, voor zover zulks noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in
      de inrichting of een ongestoorde tenuitvoerlegging van de vrijheidsbeneming, bevoegd aan de gedetineerden bevelen
      te geven. De gedetineerden zijn verplicht deze bevelen op te volgen.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
  - number: '5.4'
    text: 'Aan de directeur is voorbehouden de beslissing omtrent:'
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
  - number: 5.4.a
    text: |-
      de onderbrenging van een kind in de inrichting, bedoeld in [artikel 12, tweede en vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel12
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '12'
        hoofdstuk: III
  - number: 5.4.b
    text: |-
      de uitsluiting van deelname aan activiteiten en de verlenging daarvan, bedoeld in
      [artikel 23, eerste lid, onder a en b][ref1], onderscheidenlijk [artikel 23, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel23
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '23'
        hoofdstuk: V
        paragraaf: '2'
  - number: 5.4.c
    text: |-
      de plaatsing in afzondering en de verlenging hiervan, bedoeld in [artikel 24, eerste lid][ref1], op de gronden van
      [artikel 23, eerste lid, onder a en b][ref2], onderscheidenlijk [artikel 24, derde lid][ref3], en de toepassing
      van [artikel 25][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009709#Artikel25
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009709
