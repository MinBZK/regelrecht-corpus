  - number: 73.4.a
    text: de betrokkenen uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te lichten;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
  - number: 73.4.b
    text: |-
      de mondelinge opmerkingen ten overstaan van een lid van de commissie, bedoeld in het eerste lid, kunnen worden
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
  - number: 73.4.c
    text: |-
      ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de betrokkenen uitsluitend in de
      gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel73
  - number: '74'
    text: |-
      De directeur draagt zorg voor een regelmatig overleg met gedetineerden over zaken die rechtstreeks de detentie
      raken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel74
  - number: '75.1'
    text: |-
      De in de [artikelen 17][ref1] en [18][ref2], alsmede in de [hoofdstukken XI tot en met XIII][ref3] aan de
      gedetineerde toegekende rechten kunnen, behoudens ingeval Onze Minister of beklag- of beroepscommissie van oordeel
      is dat zwaarwegende belangen van de gedetineerde zich daartegen verzetten, mede worden uitgeoefend door:


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '18'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009709
        hoofdstuk: XI
  - number: 75.1.a
    text: de curator, indien de gedetineerde onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel75
  - number: 75.1.b
    text: de mentor, indien ten behoeve van de gedetineerde een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel75
  - number: 75.1.c
    text: de ouders of voogd, indien de gedetineerde minderjarig is.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel75
  - number: '75.2'
    text: De directeur draagt zorg dat de in het eerste lid genoemde personen op deze rechten opmerkzaam worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel75
  - number: '76.1'
    text: |-
      De plaatsing van een tot vrijheidsstraf veroordeelde in een instelling voor verpleging van
      ter beschikking gestelden geschiedt voordat zes maanden sedert de beslissing, bedoeld in
      [artikel 6:2:8, eerste lid, van het Wetboek van Strafvordering][ref1] is genomen, in een gevangenis of huis van
      bewaring zijn doorgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '76.2'
    text: |-
      Indien Onze Minister, rekening houdende met de in [artikel 6.2, tweede lid, van de Wet forensische zorg][ref1]
      genoemde eisen, van oordeel is dat de plaatsing niet binnen de in het eerste lid gestelde termijn mogelijk is, kan
      hij deze termijn telkens met drie maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel6
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '6'
  - number: '76.3'
    text: |-
      Tegen de beslissing tot verlenging, bedoeld in het tweede lid, kan de tot
      vrijheidsstraf veroordeelde beroep instellen bij de Raad. Het bepaalde in
      [Hoofdstuk XVI van de Beginselenwet verpleging ter beschikking gestelden][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008765#HoofdstukXVI
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0008765
        hoofdstuk: XVI
  - number: '77.1'
    text: |-
      Een onveroordeelde die met toepassing van [artikel 196][ref1], [317][ref2] of
      [509g van het Wetboek van Strafvordering][ref3] in een instelling tot klinische observatie bestemd is opgenomen,
      wordt voor wat betreft zijn rechtspositie gelijkgesteld met een onveroordeelde die in een huis van bewaring
      verblijft, indien de instelling tot klinische observatie bestemd tevens een huis van bewaring is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel196
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel317
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel509g
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '196'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '317'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 509g
  - number: '77.2'
    text: |-
      Een ter beschikking gestelde die met toepassing van [artikel 509g][ref1] of
      [6:6:12, vierde lid, van het Wetboek van Strafvordering][ref2] in een instelling tot klinische observatie bestemd
      is opgenomen, wordt voor wat betreft zijn rechtspositie gelijkgesteld met een ter beschikking gestelde die in een
      huis van bewaring verblijft, indien de instelling tot klinische observatie bestemd tevens huis van bewaring is.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel509g
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 509g
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '78'
    text: |-
      Voor zover de regels van de krijgsmacht daartoe aanleiding geven kan bij militaire gedetineerden van de bepalingen
      in deze wet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel78
  - number: '91'
    text: |-
      De Beginselenwet gevangeniswezen wordt ingetrokken, met uitzondering van [de artikelen 2][ref1] tot en met
      [5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel5
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '5'
        hoofdstuk: II
  - number: '92'
    text: |-
      De regels en de bestemmingen van gevangenissen en huizen van bewaring vastgesteld krachtens
      [artikel 22 van het Wetboek van Strafrecht][ref1], zoals dit artikel gold vóór de inwerkingtreding van deze wet,
      worden geacht te zijn vastgesteld krachtens de toepasselijke bepalingen van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel22
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '22'
  - number: '93'
    text: |-
      Deze wet heeft geen gevolgen voor klaagschriften of beroepschriften die zijn ingediend voor de inwerkingtreding van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0009709/2020-01-01#Artikel93
  - number: '94'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een ander
      tijdstip worden vastgesteld waarop [artikel 76][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel76
