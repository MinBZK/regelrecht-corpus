  - number: '38'
    text: |-
      1 De gedetineerde heeft het recht gedurende ten minste één uur per week op in de huisregels vastgestelde tijden en
      plaatsen bezoek te ontvangen. Onze Minister kan nadere regels stellen omtrent de toelating en weigering van bezoek.
      In de huisregels worden regels gesteld omtrent het aanvragen van bezoek.

      2 De directeur kan het aantal tegelijkertijd tot de gedetineerde toe te laten personen beperken, indien dit
      noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de inrichting.

      3 De directeur kan de toelating tot de gedetineerde van een bepaald persoon of van bepaalde personen weigeren,
      indien dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref1]. Deze weigering
      geldt voor ten hoogste twaalf maanden.

      4 De directeur kan bepalen dat tijdens het bezoek toezicht wordt uitgeoefend, indien dit noodzakelijk is met het
      oog op een belang als bedoeld in [artikel 36, vierde lid][ref2]. Dit toezicht kan omvatten het beluisteren of
      opnemen van het gesprek tussen de bezoeker en de gedetineerde. Tevoren wordt aan betrokkenen mededeling gedaan van
      de aard en de reden van het toezicht.

      5 Iedere bezoeker dient zich bij binnenkomst op deugdelijke wijze te legitimeren. De directeur kan bepalen dat
      een bezoeker aan zijn kleding wordt onderzocht op de aanwezigheid van voorwerpen die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de inrichting. Dit onderzoek kan ook betrekking hebben op door hem meegebrachte
      voorwerpen. De directeur is bevoegd dergelijke voorwerpen gedurende de duur van het bezoek onder zich te nemen
      tegen afgifte van een bewijs van ontvangst dan wel aan een opsporingsambtenaar ter hand te stellen met het oog op
      de voorkoming of opsporing van strafbare feiten.

      6 De directeur kan het bezoek binnen de daarvoor bestemde tijd beëindigen en de bezoeker uit de inrichting doen
      verwijderen, indien dit noodzakelijk is met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref3].

      7 De in [artikel 37, eerste lid, onder g, h, i, onder 2°, en j][ref4] genoemde personen en instanties hebben te
      allen tijde toegang tot de gedetineerde. De overige in dat lid genoemde personen en instanties hebben toegang tot
      de gedetineerde op in de huisregels vastgestelde tijden en plaatsen. Tijdens dit bezoek kunnen zij zich vrijelijk
      met de gedetineerde onderhouden, behoudens ingeval de directeur, na overleg met de desbetreffende bezoeker, van
      mening is dat van de gedetineerde een ernstig gevaar uitgaat voor de veiligheid van de bezoeker. In dat geval
      laat de directeur voor het bezoek weten welke toezichthoudende maatregelen genomen worden om het onderhoud zo
      ongestoord mogelijk te laten verlopen. De toezichthoudende maatregelen mogen er niet toe leiden dat vertrouwelijke
      mededelingen in het onderhoud tussen de gedetineerde en diens rechtsbijstandverlener bij derden bekend kunnen
      worden.

      8 Op een bezoek van de in [artikel 37, eerste lid, onder j][ref5], genoemde personen aan de gedetineerde die
      is geplaatst in een afdeling voor intensief toezicht of in een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d][ref6], wordt visueel toezicht gehouden. Dit toezicht mag niet ertoe leiden
      dat vertrouwelijke mededelingen in het onderhoud bij derden bekend kunnen worden.

      9 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het toezicht, bedoeld in het achtste
      lid. De voordracht voor een krachtens de eerste zin vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


