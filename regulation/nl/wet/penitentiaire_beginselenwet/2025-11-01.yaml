  - number: '58'
    text: |-
      1 De directeur geeft de gedetineerde van elke beslissing als bedoeld in [artikel 57, eerste lid][ref1], onverwijld
      schriftelijk en zoveel mogelijk in een voor hem begrijpelijke taal een met redenen omklede, gedagtekende en
      ondertekende mededeling.

      2 De directeur geeft de gedetineerde op de in het eerste lid omschreven wijze een mededeling omtrent:

      a. de weigering van verzending of uitreiking van een brief of ander poststuk dan wel van bijgesloten voorwerpen,
      bedoeld in [artikel 36, vierde lid][ref2];

      b. de weigering van de toelating tot de gedetineerde van een bepaald persoon of bepaalde personen, bedoeld in
      [artikel 38, derde lid][ref3];

      c. het verbod van het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken, bedoeld in
      [artikel 39, derde lid][ref4];

      d. de weigering van een contact met een vertegenwoordiger van de media, bedoeld in [artikel 40, eerste lid][ref5].

      3 In de gevallen, genoemd in het tweede lid, kan de mededeling achterwege blijven, indien de beslissing
      van de directeur strekt ter uitvoering van een beperking die aan de gedetineerde is opgelegd ingevolge de
      [artikelen 62][ref6], [62a][ref7] en [76 van het Wetboek van Strafvordering][ref8].

      4 De gedetineerde wordt in de mededeling, bedoeld in het eerste en tweede lid, gewezen op de mogelijkheid van
      het instellen van beklag, bedoeld in [hoofdstuk Xl][ref9], de wijze waarop en de termijn waarbinnen zulks dient
      te geschieden, alsmede op de mogelijkheid tot het doen van een verzoek aan de voorzitter van de beroepscommissie
      om hangende de uitspraak op het klaagschrift de tenuitvoerlegging van de beslissing geheel of gedeeltelijk te
      schorsen.


