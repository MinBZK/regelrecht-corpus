  - number: '39'
    text: |-
      1 De gedetineerde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen,
      het recht ten minste eenmaal per week op in de huisregels vastgestelde tijden en plaatsen en met behulp van een
      daartoe aangewezen toestel gedurende tien minuten een of meer telefoongesprekken te voeren met personen buiten
      de inrichting. De hieraan verbonden kosten komen, tenzij de directeur anders bepaalt, voor rekening van de
      gedetineerde. In verband met het uitoefenen van toezicht als bedoeld in het tweede lid, kunnen telefoongesprekken
      worden opgenomen.

      2 De directeur kan bepalen dat op de door of met de gedetineerde gevoerde telefoongesprekken toezicht wordt
      uitgeoefend, indien dit noodzakelijk is om de identiteit van de persoon met wie de gedetineerde een gesprek voert
      vast te stellen dan wel met het oog op een belang als bedoeld in [artikel 36, vierde lid][ref1]. Dit toezicht kan
      omvatten het beluisteren van een telefoongesprek of het uitluisteren van een opgenomen telefoongesprek. Aan de
      betrokkene wordt mededeling gedaan van de aard en de reden van het toezicht. Bij algemene maatregel van bestuur
      worden nadere regels gesteld over het opnemen van telefoongesprekken en het bewaren en verstrekken van opgenomen
      telefoongesprekken.

      3 De directeur kan de gelegenheid tot het voeren van een bepaald telefoongesprek of bepaalde telefoongesprekken
      weigeren of een telefoongesprek binnen de daarvoor bestemde tijd beëindigen, indien dit noodzakelijk is met het
      oog op een belang als bedoeld in [artikel 36, vierde lid][ref2]. De beslissing tot het weigeren van een bepaald
      telefoongesprek of bepaalde telefoongesprekken geldt voor ten hoogste twaalf maanden. Onze Minister kan nadere
      regels stellen omtrent het weigeren van een bepaald telefoongesprek of bepaalde telefoongesprekken.

      4 De gedetineerde wordt in staat gesteld met de in [artikel 37, eerste lid][ref3], genoemde personen en instanties
      telefonisch contact te hebben, indien hiervoor de noodzaak en de gelegenheid bestaat. Op deze gesprekken wordt
      geen ander toezicht uitgeoefend dan noodzakelijk is om de identiteit van de personen of instantie met wie de
      gedetineerde een telefoongesprek voert of wenst te voeren vast te stellen.

      5 Een telefoongesprek met een gedetineerde die is geplaatst in een afdeling voor intensief toezicht of een
      extra beveiligde inrichting als bedoeld in [artikel 13, eerste lid, onderdeel d][ref4], kan binnen Nederland
      uitsluitend worden gevoerd vanuit door Onze Minister aangewezen plaatsen met een aangewezen toestel. De persoon
      met wie de gedetineerde telefoneert dient zich voorafgaand aan het telefoongesprek deugdelijk te legitimeren.
      Telefoongesprekken vanuit het buitenland kunnen enkel met toestemming van Onze Minister en onder door hem gestelde
      voorwaarden worden gevoerd. Onderdeel van de voorwaarden is dat wordt bepaald in welke taal het gesprek gevoerd
      mag worden.

      6 Onze Minister wijst de plaatsen aan van waaruit kan worden getelefoneerd met een gedetineerde die
      is geplaatst in een afdeling voor intensief toezicht of een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d][ref5].

      7 Het vijfde en zesde lid zijn niet van toepassing op een telefoongesprek met een rechtsbijstandverlener, tenzij
      een bevel als bedoeld in [artikel 40d][ref6] is gegeven dat mede een beperking of uitsluiting van telefoonverkeer
      inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel36
