  - number: 46d
    text: |-
      Indien niet voldaan wordt aan de voorwaarden van [artikel 46c, onderdelen b en c][ref1], kan als uiterste redmiddel
      niettemin geneeskundige behandeling plaatsvinden:

      a. voor zover aannemelijk is dat zonder die geneeskundige behandeling het gevaar dat de psychische stoornis,
      psychogeriatrische aandoening of verstandelijke handicap de gedetineerde doet veroorzaken niet binnen een redelijke
      termijn kan worden weggenomen, of

      b. indien de directeur daartoe een besluit heeft genomen en dit naar het oordeel van een arts volstrekt
      noodzakelijk is om het gevaar dat de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap
      de gedetineerde binnen de inrichting doet veroorzaken, af te wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46c
