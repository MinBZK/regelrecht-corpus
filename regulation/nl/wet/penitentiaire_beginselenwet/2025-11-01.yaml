  - number: '40'
    text: |-
      1 De directeur kan toestemming geven voor het voeren van een gesprek tussen de gedetineerde en een
      vertegenwoordiger van de media, voor zover dit zich verdraagt met de volgende belangen:

      a. de handhaving van de orde of de veiligheid in de inrichting;

      b. de bescherming van de openbare orde en de goede zeden;

      c. de bescherming van de rechten en vrijheden van anderen dan de gedetineerde;

      d. de voorkoming of opsporing van strafbare feiten.

      2 De directeur kan met het oog op de bescherming van de in het eerste lid genoemde belangen aan de toegang
      van een vertegenwoordiger van de media tot de inrichting voorwaarden verbinden. De directeur is bevoegd een
      vertegenwoordiger van de media uit de inrichting te doen verwijderen, indien hij de hem opgelegde voorwaarden niet
      nakomt.

      3 De directeur kan op het contact met een vertegenwoordiger van de media toezicht uitoefenen, indien dit
      noodzakelijk is met het oog op een belang als bedoeld in het eerste lid. Artikel 38, vierde lid, tweede en derde
      volzin, en vijfde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel40
  - number: 40a
    text: |-
      1 De gedetineerde die verblijft in een afdeling voor intensief toezicht of in een extra beveiligde inrichting
      als bedoeld in [artikel 13, eerste lid, onderdeel d][ref1], doet opgave aan de directeur van ten hoogste twee
      rechtsbijstandverleners die toegang hebben tot de gedetineerde.

      2 In afwijking van [artikel 37, eerste lid][ref2], draagt de directeur zorg dat brieven of andere poststukken,
      gericht aan of afkomstig van andere rechtsbijstandverleners dan de aangewezen rechtsbijstandverleners bedoeld in
      het eerste lid, niet worden uitgereikt aan de gedetineerde.

      3 Vrije toegang van de rechtsbijstandverlener als bedoeld in [artikel 38, zevende lid][ref3], tot een gedetineerde
      die verblijft in een afdeling voor intensief toezicht of in een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d][ref4], is beperkt tot de aangewezen rechtsbijstandverleners bedoeld in het
      eerste lid.

      4 Het recht op het voeren van telefoongesprekken met een rechtsbijstandverlener op de wijze als voorzien in
      [artikel 39, vierde en vijfde lid][ref5], is voor de gedetineerde die verblijft in een afdeling voor intensief
      toezicht of in een extra beveiligde inrichting als bedoeld in [artikel 13, eerste lid, onderdeel d][ref6],
      beperkt tot de aangewezen rechtsbijstandverleners, bedoeld in het eerste lid.

      5 De aangewezen rechtsbijstandverlener, bedoeld in het eerste lid, kan – met toestemming van de gedetineerde – Onze
      Minister verzoeken zich vanwege bijzondere omstandigheden te laten vervangen door een rechtsbijstandverlener van
      hetzelfde kantoor. Indien de aangewezen rechtsbijstandverlener niet werkzaam is binnen een kantoor, kan hij zich
      laten vervangen door diens vaste vervanger. Het tweede tot en met vierde lid zijn van overeenkomstige toepassing op
      de vervangende rechtsbijstandverlener. Onze Minister beslist tijdig.

      6 De gedetineerde heeft het recht om bij Onze Minister een met redenen omkleed verzoekschrift in te dienen,
      strekkende tot het toestaan dat de gedetineerde een of meer andere rechtsbijstandverleners aanwijst die toegang
      hebben tot de gedetineerde indien bijzondere omstandigheden hiertoe aanleiding geven. Onze Minister beslist tijdig.

      7 Het eerste tot en met vijfde lid zijn van overeenkomstige toepassing op een op grond van het zesde lid aangewezen
      rechtsbijstandverlener.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de uitvoering van dit artikel.
      De voordracht voor een krachtens de eerste zin vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


