        bwb_id: BWBR0009709
        artikel: '61'
        hoofdstuk: XI
  - number: 71e
    text: |-
      1 De beroepscommissie en de secretaris zijn ten behoeve van de behandeling van het beroepschrift bevoegd het
      medisch dossier van de gedetineerde in te zien.

      2 De behandeling van het beroepschrift vindt niet in het openbaar plaats, behoudens ingeval de beroepscommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.

      3 De secretaris van de beroepscommissie zendt de inrichtingsarts een afschrift van het beroepschrift toe en vraagt
      het verslag van de bemiddeling op bij de Medisch Adviseur.

      4 De beroepscommissie stelt de gedetineerde en de inrichtingsarts in de gelegenheid omtrent het beroepschrift
      mondeling of schriftelijk opmerkingen te maken, tenzij zij het beroep aanstonds kennelijk niet-ontvankelijk,
      kennelijk ongegrond of kennelijk gegrond acht. De beroepscommissie kan bepalen dat de mondelinge opmerkingen ten
      overstaan van een lid van de commissie, bedoeld in [artikel 71d, eerste lid][ref1], kunnen worden gemaakt.

      5 [Artikel 64, tweede en derde lid][ref2], is van overeenkomstige toepassing.

      6 [Artikel 64, vierde lid][ref3], is van overeenkomstige toepassing. De beroepscommissie kan bepalen dat ingeval
      bij een andere persoon mondeling inlichtingen worden ingewonnen, de betrokkenen uitsluitend in de gelegenheid
      worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.

      7 [Artikel 65, eerste tot en met derde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel71d
