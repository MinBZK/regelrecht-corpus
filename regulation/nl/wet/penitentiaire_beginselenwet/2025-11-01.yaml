  - number: '42'
    text: |-
      1 De gedetineerde heeft recht op verzorging door een aan de inrichting verbonden arts of diens vervanger.

      2 De gedetineerde heeft recht op raadpleging, voor eigen rekening, van een arts van zijn keuze. De directeur stelt
      in overleg met de gekozen arts de plaats en het tijdstip van de raadpleging vast.

      3 De directeur draagt zorg dat de aan de inrichting verbonden arts of diens vervanger:

      a. regelmatig beschikbaar is voor het houden van een spreekuur;

      b. op andere tijdstippen beschikbaar is, indien dit in het belang van de gezondheid van de gedetineerde
      noodzakelijk is;

      c. de gedetineerden die hiervoor in aanmerking komen onderzoekt op hun geschiktheid voor deelname aan arbeid, sport
      of een andere activiteit.

      4 De directeur draagt zorg voor:

      a. de verstrekking van de door de aan de inrichting verbonden arts of diens vervanger voorgeschreven medicijnen
      en diëten;

      b. de behandeling van de gedetineerde op aanwijzing van de aan de inrichting verbonden arts of diens vervanger;

      c. de overbrenging van de gedetineerde naar een ziekenhuis dan wel andere instelling, indien de onder b bedoelde
      behandeling aldaar plaatsvindt.

      5 Over de uitvoering van het eerste en tweede lid worden bij algemene maatregel van bestuur nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel42
  - number: '43'
    text: |-
      1 De gedetineerde heeft recht op sociale verzorging en hulpverlening.

      2 De directeur draagt zorg dat reclasseringswerkers en daarvoor in aanmerking komende gedragsdeskundigen de in het
      eerste lid omschreven zorg en hulp in de inrichting kunnen verlenen.

      3 De directeur kan aan andere personen toegang tot de inrichting verlenen ten behoeve van hulpverlening aan
      gedetineerden met betrekking tot de essentiële voorwaarden voor deelname aan het maatschappelijk leven.

      4 De directeur draagt zorg voor overbrenging van de gedetineerde naar de daartoe bestemde plaats, indien de in
      het eerste lid omschreven zorg en hulp dit noodzakelijk maken en een dergelijke overbrenging zich verdraagt met
      de ongestoorde tenuitvoerlegging van de vrijheidsbeneming. Indien de gedetineerde wordt overgebracht ten behoeve
      van de verlening van forensische zorg bedoeld in de [Wet forensische zorg][ref1], geschiedt de overbrenging
      overeenkomstig de bepalingen van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040634
