  - number: '56'
    text: |-
      1 De directeur draagt zorg dat de gedetineerde bij binnenkomst in de inrichting, schriftelijk en zoveel mogelijk
      in een voor hem begrijpelijke taal, op de hoogte wordt gesteld van zijn bij of krachtens deze wet gestelde rechten
      en plichten.

      2 De gedetineerde wordt hierbij in het bijzonder gewezen op diens bevoegdheid:

      a. een bezwaar- of verzoekschrift in te dienen overeenkomstig [hoofdstuk IV][ref1];

      b. zich te wenden tot de maandcommissaris van de commissie van toezicht;

      c. een klaag- of beroepschrift in te dienen overeenkomstig de [hoofdstukken XI][ref2], [XII][ref3] en [XIII][ref4].

      3 Een gedetineerde vreemdeling wordt bij binnenkomst in de inrichting geïnformeerd over zijn recht de consulaire
      vertegenwoordiger van zijn land van zijn detentie op de hoogte te laten stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukIV
