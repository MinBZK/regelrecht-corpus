  - number: '59'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de aanleg van dossiers. In elk
      geval betreffen deze de omschrijving van gedetineerden over wie een dossier moet worden aangelegd, de aard van de
      daarin vervatte informatie, het recht op inzage of afschrift van het dossier door de betrokken gedetineerde en de
      beperkingen daarop en de termijn gedurende welke alsmede de wijze waarop het dossier bewaard blijft.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel59
  - number: 59a
    text: |-
      1 De gedetineerde heeft het recht zich, mondeling of schriftelijk, tot de commissie van toezicht te wenden
      met het verzoek te bemiddelen ter zake van een grief omtrent de wijze waarop de directeur zich in een bepaalde
      aangelegenheid jegens hem heeft gedragen of een bij of krachtens deze wet gestelde zorgplicht heeft betracht.
      Een gedraging van een ambtenaar of medewerker jegens de gedetineerde wordt met het oog op de toepassing van deze
      bepaling als een gedraging van de directeur aangemerkt.

      2 Indien de grief een beslissing betreft waartegen beklag openstaat, dient dit verzoek uiterlijk op de zevende dag
      na die waarop de gedetineerde kennis heeft gekregen van die beslissing te worden ingediend.

      3 De commissie van toezicht streeft ernaar binnen vier weken een voor beide partijen aanvaardbare oplossing te
      bereiken. Zij kan de bemiddeling geheel of ten dele aan de maandcommissaris of een ander uit haar midden aangewezen
      lid opdragen.

      4 De commissie van toezicht stelt de gedetineerde en de directeur in de gelegenheid, al dan niet in elkaars
      tegenwoordigheid, hun standpunt mondeling toe te lichten. Indien de gedetineerde de Nederlandse taal niet voldoende
      beheerst, draagt de commissie van toezicht zorg voor de bijstand van een tolk.

      5 De commissie van toezicht legt de resultaten van de bemiddeling neer in een schriftelijke mededeling en zendt dan
      wel reikt uit een gedagtekend afschrift daarvan aan de directeur en de gedetineerde. De datum van die toezending
      of uitreiking wordt op dit afschrift aangetekend. Indien de gedetineerde de Nederlandse taal niet voldoende
      begrijpt, draagt de commissie van toezicht zorg voor een vertaling van de mededeling. In de gevallen, bedoeld in
      [artikel 60][ref1], wordt de gedetineerde gewezen op de mogelijkheid van beklag en de wijze waarop en de termijn
      waarbinnen dit moet worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel59a
