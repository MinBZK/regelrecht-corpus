  - number: '36'
    text: |-
      1 De gedetineerde heeft, behoudens de overeenkomstig het tweede tot en met het vierde lid te stellen beperkingen,
      het recht brieven en stukken per post te verzenden en te ontvangen. De hieraan verbonden kosten komen, tenzij de
      directeur anders bepaalt, voor rekening van de gedetineerde.

      2 De directeur is bevoegd enveloppen of andere poststukken, afkomstig van of bestemd voor gedetineerden, op de
      aanwezigheid van bijgesloten voorwerpen te onderzoeken en deze hiertoe te openen. Indien de enveloppen of andere
      poststukken afkomstig zijn van of bestemd zijn voor de in [artikel 37, eerste lid][ref1], genoemde personen of
      instanties, geschiedt dit onderzoek in aanwezigheid van de betrokken gedetineerde.

      3 De directeur is bevoegd op de inhoud van brieven of andere poststukken afkomstig van of bestemd voor
      gedetineerden toezicht uit te oefenen. Dit toezicht kan omvatten het kopiëren van brieven of andere poststukken.
      Van de wijze van uitoefenen van toezicht wordt aan de gedetineerden tevoren mededeling gedaan.

      4 De directeur kan de verzending of uitreiking van bepaalde brieven of andere poststukken alsmede bijgesloten
      voorwerpen weigeren, indien dit noodzakelijk is met het oog op een van de volgende belangen:

      a. de handhaving van de orde of de veiligheid in de inrichting;

      b. de bescherming van de openbare orde of nationale veiligheid;

      c. de voorkoming of opsporing van strafbare feiten;

      d. de bescherming van slachtoffers van of anderszins betrokkenen bij misdrijven.

      5 De directeur draagt zorg dat de niet uitgereikte brieven of andere poststukken dan wel bijgesloten voorwerpen,
      hetzij worden teruggegeven aan de gedetineerde of voor diens rekening worden gezonden aan de verzender of
      een door de gedetineerde op te geven adres, hetzij onder afgifte van een bewijs van ontvangst ten behoeve van
      de gedetineerde worden bewaard, hetzij met toestemming van de gedetineerde worden vernietigd, hetzij aan een
      opsporingsambtenaar ter hand worden gesteld met het oog op de voorkoming of opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel37
