  - number: '11'
    text: |-
      1 Mannelijke en vrouwelijke gedetineerden worden gescheiden ondergebracht.

      2 Onze Minister wijst inrichtingen of afdelingen aan die uitsluitend zijn bestemd voor de onderbrenging van
      vrouwelijke gedetineerden.

      3 Onze Minister kan inrichtingen of afdelingen aanwijzen waarin van het eerste lid wordt afgeweken vanwege hun
      bestemming als inrichting of afdeling voor bijzondere opvang als bedoeld in [artikel 14][ref1].

      4 De directeur kan gedetineerden van verschillend geslacht die in dezelfde inrichting verblijven in de gelegenheid
      stellen gezamenlijk aan activiteiten deel te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel11
