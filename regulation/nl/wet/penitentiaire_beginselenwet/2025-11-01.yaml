  - number: '10'
    text: |-
      1 Gevangenissen zijn bestemd voor de opneming van personen die, al dan niet onherroepelijk, tot vrijheidsstraf zijn
      veroordeeld. Tot gevangenisstraf veroordeelden aan wie tevens de maatregel van terbeschikkingstelling met bevel tot
      verpleging van overheidswege is opgelegd, kunnen na het einde van de vrijheidsstraf in een gevangenis verblijven,
      zolang opname in de voor hen bestemde plaats niet mogelijk is.

      2 In bijzondere gevallen kan gijzeling als bedoeld in de
      [artikelen 6:4:20][ref1] en [6:6:25 van het Wetboek van Strafvordering][ref2] en
      [artikel 28 van de Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref3] in een gevangenis ten
      uitvoer worden gelegd.

      3 Gevangenissen kunnen volgens regels te stellen bij of krachtens algemene maatregel van bestuur worden
      onderscheiden naar de lengte van de straf of het strafrestant van de daarin op te nemen tot vrijheidsstraf
      veroordeelden.


