  - number: '54'
    text: |-
      1 Van elke strafoplegging dan wel wijziging daarvan houdt de directeur aantekening.

      2 Indien een straf ingevolge de [hoofdstukken XI][ref1] of [XII][ref2] geheel of ten dele wordt herzien, houdt de
      directeur hiervan aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
