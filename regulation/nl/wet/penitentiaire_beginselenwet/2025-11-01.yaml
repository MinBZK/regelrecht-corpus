  - number: '44'
    text: |-
      1 De directeur draagt zorg dat aan de gedetineerde voeding, noodzakelijke kleding en schoeisel worden verstrekt dan
      wel dat hem voldoende geldmiddelen ter beschikking worden gesteld om hierin naar behoren te voorzien.

      2 De gedetineerde heeft recht op het dragen van eigen kleding en schoeisel, tenzij die een gevaar kunnen opleveren
      voor de orde of de veiligheid in de inrichting. Hij kan worden verplicht tijdens de arbeid of sport aangepaste
      kleding of schoeisel te dragen. In de huisregels kunnen regels worden gesteld omtrent de wijze van gebruik en
      onderhoud van kleding en schoeisel.

      3 De directeur draagt zorg dat bij de verstrekking van voeding zoveel mogelijk rekening wordt gehouden met de
      godsdienst of levensovertuiging van de gedetineerden.

      4 De directeur draagt zorg dat de gedetineerde in staat gesteld wordt zijn uiterlijk en lichamelijke hygiëne naar
      behoren te verzorgen.

      5 In de huisregels worden regels gesteld omtrent de aankoop door gedetineerden van andere gebruiksartikelen dan die
      welke door de directeur ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel44
  - number: '45'
    text: |-
      1 In de huisregels kan worden bepaald dat het bezit van bepaalde soorten voorwerpen binnen de inrichting of een
      bepaalde afdeling daarvan verboden is, indien dit noodzakelijk is in het belang van de handhaving van de orde of de
      veiligheid in de inrichting, dan wel de beperking van de aansprakelijkheid van de directeur voor de voorwerpen.

      2 De directeur kan een gedetineerde toestemming geven hem toebehorende voorwerpen, waarvan het bezit niet is
      verboden ingevolge het eerste lid, in zijn verblijfsruimte te plaatsen dan wel bij zich te hebben voor zover dit
      zich verdraagt met de volgende belangen:

      a. de handhaving van de orde of de veiligheid in de inrichting;

      b. de aansprakelijkheid van de directeur voor de voorwerpen.

      3 De directeur kan aan de toestemming, bedoeld in het tweede lid, voorwaarden verbinden die kunnen betreffen het
      gebruik van en de aansprakelijkheid voor deze voorwerpen. Bij of krachtens algemene maatregel van bestuur kunnen
      regels worden gesteld krachtens welke de aansprakelijkheid van de directeur voor voorwerpen die een gedetineerde
      ingevolge het tweede lid onder zich heeft wordt beperkt tot een bepaald bedrag.

      4 De directeur is bevoegd aan de gedetineerde toebehorende voorwerpen voor diens rekening te laten onderzoeken,
      teneinde vast te stellen of de toelating of het bezit daarvan kan worden toegestaan dan wel is verboden, ingevolge
      het eerste onderscheidenlijk het tweede lid.

      5 De directeur is bevoegd voorwerpen ten aanzien waarvan geen toestemming is verleend dan wel die zijn verboden,
      ingevolge het eerste onderscheidenlijk het tweede lid, in beslag te nemen. Hij draagt zorg dat deze voorwerpen
      hetzij onder afgifte van een bewijs van ontvangst ten behoeve van de gedetineerde op diens kosten worden bewaard,
      hetzij voor diens rekening worden gezonden aan de verzender of een door de gedetineerde op te geven adres, hetzij
      met toestemming van de gedetineerde worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld
      met het oog op de voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel45
  - number: '46'
    text: |-
      1 Het bezit van contant geld door de gedetineerden in de inrichting of een afdeling is verboden, tenzij in de
      huisregels anders is bepaald.

      2 In inrichtingen of afdelingen waar het bezit van contant geld door de gedetineerden verboden is, heeft de
      gedetineerde de beschikking over een rekening-courant bij de inrichting.

      3 In de huisregels kunnen nadere regels worden gesteld omtrent het bezit van contant geld en het gebruik van de
      rekening-courant. Deze regels kunnen een beperking betreffen van het bedrag waarover de gedetineerde ten hoogste in
      contanten of door middel van zijn rekeningcourant mag beschikken.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel46
  - number: 46a
    text: |-
      Voor de toepassing van deze paragraaf wordt onder gevaar verstaan:

      *Gevaar:*

      1. gevaar voor de gedetineerde, die het veroorzaakt, hetgeen onder meer bestaat uit:

      a. het gevaar dat de gedetineerde zich van het leven zal beroven of zichzelf ernstig lichamelijk letsel zal
      toebrengen;

      b. het gevaar dat de gedetineerde maatschappelijk te gronde gaat;

      c. het gevaar dat de gedetineerde zichzelf in ernstige mate zal verwaarlozen;

      d. het gevaar dat de gedetineerde met hinderlijk gedrag agressie van anderen zal oproepen.

      2. gevaar voor een of meer anderen, hetgeen onder meer bestaat uit:

      a. het gevaar dat de gedetineerde een ander van het leven zal beroven of hem ernstig lichamelijk letsel zal
      toebrengen;

      b. het gevaar voor de psychische gezondheid van een ander;

      c. het gevaar dat de gedetineerde een ander, die aan zijn zorg is toevertrouwd, zal verwaarlozen;

      3. gevaar voor de algemene veiligheid van personen of goederen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel46a
  - number: 46b
    text: |-
      1 De directeur draagt zorg dat in overleg met de gedetineerde die in verband met zijn geestelijke
      gezondheidstoestand verblijft in een daartoe op grond van [artikel 14][ref1] aangewezen afdeling of inrichting een
      geneeskundig behandelingsplan wordt vastgesteld.

      2 Het geneeskundig behandelingsplan is gericht op het zodanig wegnemen van het gevaar dat de psychische stoornis,
      psychogeriatrische aandoening of verstandelijke handicap de gedetineerde doet veroorzaken dat de gedetineerde niet
      langer in verband met zijn geestelijke gezondheidstoestand in een daartoe krachtens [artikel 14][ref2] aangewezen
      afdeling of inrichting behoeft te verblijven. Zo mogelijk geschiedt dit door het behandelen van de stoornis. Indien
      dit niet mogelijk is, geschiedt dit door het anderszins wegnemen van het gevaar.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een geneeskundig
      behandelingsplan tenminste moet voldoen en de voorschriften die bij een wijziging daarvan in acht genomen moeten
      worden.

      4 Alvorens het geneeskundig behandelingsplan wordt vastgesteld, wordt overleg gepleegd met

      a. de curator indien de gedetineerde onder curatele is gesteld

      b. de mentor, indien ten behoeve van de gedetineerde een mentorschap is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel14
