  - number: 18a
    text: |-
      1 De directeur draagt zorg dat uiterlijk binnen vier weken na binnenkomst van de gedetineerde in een inrichting,
      zo veel mogelijk in overleg met hem, een detentie- en re-integratieplan wordt vastgesteld. Het detentie- en re-
      integratieplan kan gedurende de detentie, zo veel mogelijk in overleg met de gedetineerde, worden aangepast.

      2 Het detentie- en re-integratieplan vermeldt in ieder geval:

      a. het individuele begeleidingsplan, inclusief eventuele zorg die de gedetineerde nodig heeft,

      b. de gedrags- en re-integratiedoelen die de gedetineerde tracht te behalen,

      c. de activiteiten waaraan de gedetineerde deelneemt en de activiteiten en het verlof waarvoor de gedetineerde bij
      goed gedrag in aanmerking komt,

      d. de essentiële voorwaarden voor deelname aan het maatschappelijk leven van de gedetineerde, voor zover deze
      ontbreken.

      3 De directeur betrekt bij het opstellen van het detentie- en re-integratieplan eventuele adviezen van de rechter,
      het openbaar ministerie of de reclassering omtrent de tenuitvoerlegging.

      4 De directeur kan ten behoeve van het vaststellen of het aanpassen van het detentie- en re-integratieplan
      overleggen:

      a. met de reclassering;

      b. met het college van burgemeester en wethouders van de gemeente waar de gedetineerde ingezetene was of overwegend
      verbleef voorafgaand aan de detentie dan wel de gemeente waarin de gedetineerde zich na afloop van zijn detentie
      wil vestigen, over de essentiële voorwaarden voor deelname aan het maatschappelijk leven, bedoeld in het tweede
      lid, onderdeel d.

      5 De directeur draagt zorg dat de tenuitvoerlegging overeenkomstig het detentie- en re-integratieplan plaatsvindt.

      6 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de nadere eisen waaraan
      een detentie- en re-integratieplan ten minste moet voldoen en de voorschriften die bij de vaststelling of een
      aanpassing van het plan in acht moeten worden genomen. Bij algemene maatregel van bestuur worden nadere regels
      gesteld over welke gegevens, in welke gevallen en onder welke voorwaarden, kunnen worden uitgewisseld tussen de
      directeur, het college van burgemeester en wethouders en de reclassering ten behoeve van de toepassing van het
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18a
  - number: 18b
    text: |-
      1 Wanneer het risico aanwezig wordt geacht dat een gedetineerde een ernstig gewelds- of zedenmisdrijf zal
      begaan, verstrekken de directeur van de inrichting, Onze Minister, Onze Minister van Justitie en Veiligheid, de
      burgemeester, de reclassering, het openbaar ministerie en de politie elkaar de daarop betrekking hebbende gegevens.
      De gegevens worden verstrekt indien dit ter bescherming van de veiligheid van anderen noodzakelijk is en dit hoort
      bij de uitoefening van ieders taak.

      2 Onze Minister, Onze Minister van Justitie en Veiligheid, de burgemeester, de reclassering, het openbaar
      ministerie en de politie stellen de directeur van de inrichting op de hoogte indien zij op grond van het eerste lid
      gegevens over een gedetineerde uitwisselen ten behoeve van de vastlegging hiervan in het penitentiair dossier van
      de gedetineerde.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18b
  - number: 18c
    text: |-
      1 De directeur draagt zorg dat zo spoedig mogelijk en in ieder geval binnen een maand na binnenkomst van de
      gedetineerde in een inrichting voor stelselmatige daders, zo veel mogelijk in overleg met hem, een verblijfsplan
      wordt vastgesteld.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent de eisen waaraan een verblijfsplan ten minste
      moet voldoen en de voorschriften die bij de vaststelling of een wijziging van het plan in acht genomen moeten
      worden.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18c
  - number: 18d
    text: De directeur draagt zorg dat de tenuitvoerlegging overeenkomstig het verblijfsplan plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18d
  - number: 18e
    text: |-
      1 De gedetineerde heeft recht op een periodieke evaluatie door de directeur van het verloop van de
      tenuitvoerlegging. Deze evaluatie vindt ten minste eens per zes maanden plaats.

      2 Indien de rechter bij het opleggen van de maatregel heeft bepaald dat het openbaar ministerie hem binnen een
      door hem vastgestelde termijn bericht over de wenselijkheid of de noodzakelijkheid van de voortzetting van de
      tenuitvoerlegging daarvan, vindt de eerste evaluatie in ieder geval plaats voor het verstrijken van die termijn.

      3 De directeur draagt zorg dat van iedere evaluatie een verslag wordt gemaakt en dat dit verslag zo spoedig
      mogelijk met de gedetineerde wordt besproken.

      4 Indien de gedetineerde van oordeel is dat het evaluatieverslag feitelijk onjuist of onvolledig is, heeft hij
      het recht op dit verslag schriftelijk commentaar te geven. Indien het evaluatieverslag niet overeenkomstig het
      commentaar wordt verbeterd of aangevuld, draagt de directeur zorg dat het commentaar aan het verslag wordt gehecht.

      5 Bij algemene maatregel van bestuur worden regels gesteld omtrent de procedure die met betrekking tot de evaluatie
      dient te worden gevolgd en de eisen die aan het verslag daarvan ten minste dienen te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18e
  - number: 18f
    text: Onze Minister kan nadere regels stellen omtrent de wijze waarop het vervoer van de gedetineerde plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18f
  - number: 18g
    text: |-
      1 Er is een commissie van toezicht voor het vervoer, die door Onze Minister is ingesteld.

      2 De commissie van toezicht voor het vervoer heeft tot taak:

      a. toezicht te houden op de uitvoering van het vervoer van gedetineerden uitgevoerd door Onze Minister;

      b. kennis te nemen van door de gedetineerde naar voren gebrachte grieven betreffende het vervoer, bedoeld onder a;

      c. zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [hoofdstuk XIA][ref1];

      d. aan Onze Minister en de Raad advies en inlichtingen te geven omtrent het onder a gestelde.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze
      van de commissie en de benoeming en het ontslag van haar leden.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXIa
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel18g
    references:
