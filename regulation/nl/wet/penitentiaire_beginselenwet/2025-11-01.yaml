  - number: '66'
    text: |-
      1 Hangende de uitspraak op het klaagschrift kan de voorzitter van de beroepscommissie op verzoek van de klager,
      na de directeur te hebben gehoord, de tenuitvoerlegging van de beslissing waarop het klaagschrift betrekking heeft
      geheel of gedeeltelijk schorsen.

      2 De voorzitter doet hiervan onverwijld mededeling aan de directeur en de klager.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel66
  - number: '67'
    text: |-
      1 De beklagcommissie doet zo spoedig mogelijk, doch in ieder geval binnen een termijn van vier weken te rekenen
      vanaf de datum waarop het klaagschrift is ontvangen, uitspraak. In bijzondere omstandigheden kan de beklagcommissie
      deze termijn met ten hoogste vier weken verlengen. Van deze verlenging wordt aan de directeur en de klager
      mededeling gedaan.

      2 De uitspraak is met redenen omkleed en gedagtekend. Zij bevat een verslag van het horen van personen door de
      beklagcommissie. Zij wordt door de voorzitter, alsmede door de secretaris ondertekend. Bij verhindering van één
      van hen wordt de reden daarvan in de uitspraak vermeld. Aan de klager en de directeur wordt onverwijld en kosteloos
      een afschrift van de beslissing van de beklagcommissie toegezonden of uitgereikt. De datum van die toezending of
      uitreiking wordt op dit afschrift aangetekend.

      3 De uitspraak vermeldt de mogelijkheid van het instellen van beroep bij de beroepscommissie, de wijze waarop en
      de termijn waarbinnen dit moet worden gedaan alsmede de mogelijkheid tot schorsing van de tenuitvoerlegging van de
      uitspraak, bedoeld in [artikel 70, tweede lid][ref1].

      4 Indien de klager de Nederlandse taal niet voldoende beheerst en in de inrichting niet op andere wijze in een
      vertaling kan worden voorzien, draagt de voorzitter van de beklagcommissie zorg voor een vertaling van de uitspraak
      en de mededeling, bedoeld in het tweede, onderscheidenlijk derde lid. De vergoeding van de voor de vertaling
      gemaakte kosten geschiedt volgens regelen te stellen bij algemene maatregel van bestuur.

      5 De voorzitter van de beklagcommissie kan de uitspraak ook mondeling mededelen aan de klager en de directeur. Zij
      worden daarbij gewezen op de mogelijkheid tot het instellen van beroep bij de beroepscommissie, de wijze waarop
      en de termijn waarbinnen dit moet worden gedaan, alsmede op de mogelijkheid tot schorsing van de tenuitvoerlegging
      van de uitspraak, bedoeld in [artikel 70, tweede lid][ref2]. Als dag van de uitspraak geldt de dag van het doen van
      deze mededeling. Indien mondeling uitspraak wordt gedaan, wordt deze uitspraak op het klaagschrift aangetekend.

      6 Indien het vijfde lid toepassing heeft gevonden en beroep wordt ingesteld als voorzien in
      [artikel 69, eerste lid][ref3], vindt uitwerking van de beslissing van de beklagcommissie plaats op de wijze,
      bedoeld in het tweede lid. De secretaris van de beklagcommissie zendt een afschrift van deze uitspraak toe aan de
      directeur, de klager en de beroepscommissie.

      7 De secretaris zendt van alle uitspraken van de beklagcommissie een afschrift naar Onze Minister. Een ieder heeft
      recht op kennisneming van deze uitspraken en het ontvangen van een afschrift daarvan. Onze Minister draagt zorg
      dat dit afschrift geen gegevens bevat waaruit de identiteit van de gedetineerde kan worden afgeleid. Met betrekking
      tot de kosten van het ontvangen van een afschrift is het bij of krachtens de [Wet tarieven in strafzaken][ref4]
      bepaalde van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0002406
