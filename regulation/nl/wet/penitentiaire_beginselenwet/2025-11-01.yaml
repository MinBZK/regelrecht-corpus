  - number: '2'
    text: |-
      1 De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel vindt, voor zover niet bij of
      krachtens de wet anders is bepaald, plaats door onderbrenging van de persoon aan wie deze is opgelegd in een
      penitentiaire inrichting dan wel door diens deelname aan een penitentiair programma.

      2 Met handhaving van het karakter van de vrijheidsstraf of de vrijheidsbenemende maatregel wordt de
      tenuitvoerlegging hiervan zoveel mogelijk en afhankelijk van het gedrag van de betrokkene dienstbaar gemaakt aan de
      voorbereiding van de terugkeer in de maatschappij. Bij het verlenen van vrijheden aan gedetineerden wordt rekening
      gehouden met de veiligheid van de samenleving en de belangen van slachtoffers en nabestaanden.

      3 Personen ten aanzien van wie de tenuitvoerlegging plaatsvindt van een vrijheidsstraf of vrijheidsbenemende
      maatregel worden aan geen andere beperkingen onderworpen dan die welke voor het doel van de vrijheidsbeneming, het
      belang van de handhaving van de orde of veiligheid noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister wijst penitentiaire inrichtingen aan. Een inrichting kan zijn gevestigd op verschillende locaties
      binnen hetzelfde arrondissement.

      2 Het opperbeheer van de inrichtingen berust bij Onze Minister. Onze Minister kan mandaat verlenen betreffende de
      hem bij of krachtens deze wet toegekende bevoegdheden tot het vaststellen van algemeen verbindende voorschriften
      aan het hoofd van de Dienst Justitiële Inrichtingen.

      3 Het beheer van een inrichting of afdeling berust bij de directeur, die als zodanig door Onze Minister wordt
      aangewezen.

      4 Onze Minister wijst een of meer personen aan als plaatsvervanger van de directeur. De aanwijzing als
      plaatsvervanger kan worden beperkt tot het nemen van een in de aanwijzing bepaalde beslissing als bedoeld in
      [artikel 5, vierde lid, onder b, c en i][ref1].

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld betreffende het beheer van en het
      regime in een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel5
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel3
    references:
