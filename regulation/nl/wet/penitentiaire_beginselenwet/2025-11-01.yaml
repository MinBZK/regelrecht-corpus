  - number: '69'
    text: |-
      1 Tegen de uitspraak van de beklagcommissie kunnen de directeur en de klager beroep instellen door het indienen van
      een beroepschrift. Het met redenen omklede beroepschrift moet uiterlijk op de zevende dag na die van de ontvangst
      van het afschrift van de uitspraak onderscheidenlijk na die van de mondelinge mededeling van de uitspraak worden
      ingediend.

      2 Het beroepschrift wordt ingediend bij en behandeld door een door de Raad benoemde beroepscommissie van drie leden
      of buitengewone leden, die wordt bijgestaan door een secretaris.

      3 De voorzitter dan wel een door hem aangewezen lid van de beroepscommissie die een met rechtspraak belast lid
      van de rechterlijke macht is, kan het beroepschrift enkelvoudig afdoen indien hij het beroep kennelijk niet-
      ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, met dien verstande dat hij tevens de bevoegdheden
      bezit die aan de voorzitter van de voltallige beroepscommissie toekomen.

      4 De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het derde lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beroepscommissie.

      5 Ten aanzien van de behandeling van het beroepschrift zijn de [artikelen 60, derde lid][ref1],
      [61, vierde lid][ref2], [62, vierde lid][ref3], [63, eerste, tweede en derde lid][ref4], [64][ref5], en
      [65, eerste, tweede en derde lid][ref6], van overeenkomstige toepassing, met dien verstande dat de beroepscommissie
      kan bepalen dat:

      a. de directeur en de klager uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te
      lichten;

      b. de mondelinge opmerkingen ten overstaan van een lid van de beroepscommissie kunnen worden gemaakt;

      c. ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de directeur en de klager uitsluitend in
      de gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel60
