  - number: '7'
    text: |-
      1 Bij elke inrichting dan wel afdeling wordt door Onze Minister een commissie van toezicht ingesteld.

      2 De commissie van toezicht heeft tot taak:

      a. toezicht te houden op de wijze van tenuitvoerlegging van de vrijheidsbeneming in de inrichting of afdeling en
      het vervoer uitgevoerd door de inrichting;

      b. kennis te nemen van door de gedetineerden naar voren gebrachte grieven;

      c. zorg te dragen voor de behandeling van klaagschriften ingevolge het bepaalde in [hoofdstuk Xl][ref1];

      d. aan Onze Minister, de Raad en de directeur advies en inlichtingen te geven omtrent het onder a gestelde.

      3 De commissie van toezicht stelt zich door persoonlijk contact met de gedetineerden regelmatig op de hoogte van
      onder hen levende wensen en gevoelens. Bij toerbeurt treedt één van haar leden hiertoe op als maandcommissaris.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de bevoegdheden, de samenstelling en de werkwijze
      van de commissie, de benoeming en het ontslag van haar leden alsmede over de werkzaamheden van de maandcommissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukXI
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel7
