  - number: 77a
    text: |-
      1 Bij algemene maatregel van bestuur kunnen bij wijze van experiment regels worden gesteld waarmee tijdelijk wordt
      afgeweken van de in [artikel 77b][ref1] te noemen bepalingen, zulks met inachtneming van de aldaar genoemde doelen
      met het oog waarop afwijking van de betreffende bepaling gedurende de werkingsduur van de maatregel plaats kan
      hebben.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 Onze Minister kan nadere regels stellen ter uitvoering van het experiment.

      4 Onze Minister zendt ten minste drie maanden voor het einde van de werkingsduur van een algemene maatregel van
      bestuur als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk.

      5 De algemene maatregel van bestuur, bedoeld in het eerste lid, geldt voor een periode van ten hoogste twee jaar na
      inwerkingtreding daarvan.

      6 Het vijfde lid is niet van toepassing, indien binnen de twee jaar, bedoeld in het vijfde lid, voordracht
      plaatsvindt van een voorstel van wet, waarmee in het onderwerp van de maatregel wordt voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel77b
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel77a
