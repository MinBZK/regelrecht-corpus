  - number: '31'
    text: |-
      1 De directeur kan bepalen dat een gedetineerde in het lichaam wordt onderzocht, indien dit noodzakelijk is ter
      afwending van ernstig gevaar voor de handhaving van de orde of de veiligheid in de inrichting dan wel voor de
      gezondheid van de gedetineerde. Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht,
      door een verpleegkundige.

      2 Een ambtenaar of medewerker van de inrichting waar de gedetineerde verblijft kan indien onverwijlde
      tenuitvoerlegging geboden is, een beslissing als bedoeld in het eerste lid nemen.

      3 Indien bij het onderzoek in het lichaam voorwerpen worden aangetroffen die niet in het bezit van de gedetineerde
      mogen zijn, en deze voorwerpen door de arts of verpleegkundige uit het lichaam kunnen worden verwijderd, is de
      directeur bevoegd deze in beslag te nemen. [Artikel 29, vijfde lid, laatste volzin][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel29
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel31
    references:
      - id: ref1
