  - number: '29'
    text: |-
      1 De directeur is bevoegd een gedetineerde bij binnenkomst of bij het verlaten van de inrichting, voorafgaand aan
      of na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde
      of de veiligheid in de inrichting, aan zijn lichaam of aan zijn kleding te onderzoeken.

      2 Onze Minister is bevoegd ten behoeve van het vervoer een gedetineerde aan zijn lichaam of aan zijn kleding te
      onderzoeken.

      3 Het onderzoek aan het lichaam van de gedetineerde omvat mede het uitwendig schouwen van de openingen en holten
      van het lichaam van de gedetineerde. Het onderzoek aan de kleding van de gedetineerde omvat mede het onderzoek van
      de voorwerpen die de gedetineerde bij zich draagt of met zich meevoert.

      4 Het onderzoek aan het lichaam van de gedetineerde wordt op een besloten plaats en, voor zover mogelijk, door
      personen van hetzelfde geslacht als de gedetineerde verricht.

      5 Indien bij een onderzoek aan het lichaam of de kleding voorwerpen worden aangetroffen die niet in het bezit
      van de gedetineerde mogen zijn, en, voor zover het onderzoek betrekking heeft op de openingen of holten van het
      lichaam van de gedetineerde, deze voorwerpen zonder het gebruik van hulpmiddelen daaruit kunnen worden verwijderd,
      is de directeur bevoegd deze in beslag te nemen. Hij draagt zorg dat deze voorwerpen, hetzij onder afgifte van een
      bewijs van ontvangst ten behoeve van de gedetineerde op diens kosten worden bewaard, hetzij met toestemming van
      de gedetineerde worden vernietigd, hetzij aan een opsporingsambtenaar ter hand worden gesteld met het oog op de
      voorkoming of opsporing van strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel29
  - number: '30'
    text: |-
      1 De directeur kan, indien dit noodzakelijk is in het belang van de handhaving van de orde of de veiligheid
      in de inrichting dan wel in verband met de beslissing tot plaatsing of overplaatsing dan wel in verband met de
      verlening van verlof, een gedetineerde verplichten urine af te staan ten behoeve van een onderzoek van die urine op
      aanwezigheid van gedragsbeïnvloedende middelen.

      2 Onze Minister stelt nadere regels omtrent de wijze van uitvoering van het urineonderzoek. Deze regels betreffen
      in elk geval het recht van de gedetineerde om de uitslag te vernemen en om voor eigen rekening een hernieuwd
      onderzoek van de afgestane urine te laten plaatsvinden. [Artikel 29, vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel29
