  - number: '68'
    text: |-
      1 De uitspraak van de beklagcommissie strekt tot gehele of gedeeltelijke:

      a. niet-ontvankelijkverklaring van het beklag;

      b. ongegrondverklaring van het beklag;

      c. gegrondverklaring van het beklag.

      2 Indien de beklagcommissie van oordeel is dat de beslissing waarover is geklaagd:

      a. in strijd is met een in de inrichting geldend wettelijk voorschrift of een een ieder verbindende bepaling van
      een in Nederland geldend verdrag, dan wel

      b. bij afweging van alle in aanmerking komende belangen, waaronder de veiligheid van de samenleving en de belangen
      van slachtoffers en nabestaanden, onredelijk of onbillijk moet worden geacht, verklaart zij het beklag gegrond en
      vernietigt zij de beslissing geheel of gedeeltelijk.

      3 Bij toepassing van het tweede lid kan de beklagcommissie:

      a. de directeur opdragen een nieuwe beslissing te nemen met inachtneming van haar uitspraak;

      b. bepalen dat haar uitspraak in de plaats treedt van de vernietigde beslissing;

      c. volstaan met de gehele of gedeeltelijke vernietiging.

      4 Bij toepassing van het derde lid, onder a, kan de beklagcommissie in haar uitspraak een termijn stellen.

      5 De beklagcommissie kan bepalen dat de uitspraak buiten werking blijft totdat deze onherroepelijk is geworden.

      6 Indien het tweede lid toepassing vindt, worden de rechtsgevolgen van de vernietigde beslissing, voor zover
      mogelijk, door de directeur ongedaan gemaakt, dan wel in overeenstemming gebracht met de uitspraak van de
      beklagcommissie.

      7 Voor zover de in het zesde lid bedoelde gevolgen niet meer ongedaan te maken zijn, bepaalt de beklagcommissie dan
      wel de voorzitter, na de directeur te hebben gehoord, of enige tegemoetkoming aan de klager geboden is. Zij stelt
      de tegemoetkoming, die geldelijk van aard kan zijn, vast.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel68
  - number: 68a
    text: |-
      1 Een gedetineerde kan bij de beklagcommissie van de commissie van toezicht voor het vervoer, bedoeld
      in [artikel 18e][ref1], beklag doen over de beslissingen, bedoeld in [artikel 29, tweede lid][ref2] en
      [artikel 35, tweede lid][ref3], voor zover de beslissing is genomen ten behoeve van het vervoer van de
      gedetineerde.

      2 De directeur van de inrichting waar de gedetineerde verblijft, draagt zorg dat een gedetineerde die beklag wenst
      te doen daartoe zo spoedig mogelijk in de gelegenheid wordt gesteld.

      3 De [artikelen 61][ref4], [62][ref5], [63, eerste tot en met derde lid][ref6], [64][ref7], [65][ref8] en
      [67][ref9] zijn van overeenkomstige toepassing, met dien verstande dat onder de directeur in de artikelen 63, 64 en
      67 steeds wordt verstaan Onze Minister.


