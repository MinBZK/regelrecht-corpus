  - number: '41'
    text: |-
      1 De gedetineerde heeft het recht zijn godsdienst of levensovertuiging, individueel of in gemeenschap met anderen,
      vrij te belijden en te beleven.

      2 De directeur draagt zorg dat in de inrichting voldoende geestelijke verzorging, die zoveel mogelijk aansluit bij
      de godsdienst of levensovertuiging van de gedetineerden, beschikbaar is.

      3 De directeur stelt de gedetineerde in de gelegenheid op in de huisregels vastgestelde tijden en plaatsen:

      a. persoonlijk contact te onderhouden met de geestelijke verzorger van de godsdienst of levensovertuiging van zijn
      keuze, die aan de inrichting is verbonden;

      b. contact te onderhouden met andere dan de onder a genoemde geestelijke verzorgers volgens [artikel 38][ref1];

      c. in de inrichting te houden godsdienstige of levensbeschouwelijke bijeenkomsten van zijn keuze bij te wonen.
      [Artikel 23][ref2] is van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld ten aanzien van de beschikbaarheid
      van de geestelijke verzorging. Deze regels hebben betrekking op de verlening van geestelijke verzorging door of
      vanwege verschillende richtingen van godsdienst of levensovertuiging, op de organisatie en de bekostiging van de
      geestelijke verzorging en op de indienstneming van geestelijke verzorgers bij een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel23
