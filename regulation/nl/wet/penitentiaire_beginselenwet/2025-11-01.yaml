        bwb_id: BWBR0009709
        artikel: '14'
        hoofdstuk: III
  - number: '12'
    text: |-
      1 Onze Minister wijst de inrichtingen of de afdelingen aan waarin kinderen tot een in de aanwijzing aangegeven
      leeftijd kunnen worden ondergebracht.

      2 Indien een gedetineerde een kind in de inrichting of afdeling, bedoeld in het eerste lid, wil onderbrengen
      teneinde het aldaar te verzorgen en op te voeden, behoeft hij de toestemming van de directeur. De directeur kan
      deze toestemming geven, voor zover dit verblijf zich verdraagt met de volgende belangen:

      a. de bescherming van de persoonlijke veiligheid of de geestelijke of lichamelijke ontwikkeling van het kind;

      b. de handhaving van de orde of de veiligheid in de inrichting.

      3 De directeur kan aan de toestemming voorwaarden verbinden met het oog op een belang als bedoeld in het tweede
      lid.

      4 De directeur kan over een door hem voorgenomen onderbrenging van een kind in de inrichting of afdeling het advies
      inwinnen van de Raad voor de Kinderbescherming.

      5 De directeur kan de toestemming intrekken, indien dit noodzakelijk is met het oog op een belang als bedoeld
      in het tweede lid of indien de gedetineerde een bepaalde voorwaarde niet nakomt. Indien de directeur een nader
      onderzoek nodig oordeelt, kan hij de medewerking van de Raad voor de Kinderbescherming inroepen.

      6 De directeur is verplicht de toestemming in te trekken, indien de onderbrenging van het kind in de inrichting in
      strijd komt met enige op het gezag over het kind betrekking hebbende beslissing.

      7 In de huisregels worden nadere regels gesteld omtrent het verblijf van kinderen in de inrichting.

      8 De kosten van de verzorging van het kind komen voor rekening van het Rijk, voor zover de gedetineerde niet zelf
      in die kosten kan voorzien.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel12
  - number: '13'
    text: |-
      1 Inrichtingen of afdelingen daarvan zijn naar de mate van beveiliging als volgt te onderscheiden en aan te duiden:

      a. beperkt beveiligd;

      b. normaal beveiligd;

      c. uitgebreid beveiligd;

      d. extra beveiligd.

      2 Onze Minister bepaalt ten aanzien van elke inrichting of afdeling de mate van beveiliging, bedoeld in het eerste
      lid.

      3 Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in een inrichting of een
      afdeling als bedoeld in het eerste lid in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel13
  - number: '14'
    text: |-
      1 Inrichtingen of afdelingen daarvan kunnen door Onze Minister worden bestemd voor de onderbrenging van
      gedetineerden die een bijzondere opvang behoeven.

      2 De bijzondere opvang, bedoeld in het eerste lid, kan verband houden met de leeftijd, de persoonlijkheid,
      de lichamelijke of de geestelijke gezondheidstoestand van de gedetineerden, de geneeskundige behandeling van
      de geestelijke gezondheidstoestand als bedoeld in [artikel 46d, onder a][ref1], het delict waarvoor zij zijn
      gedetineerd alsmede met de intensiteit van het toezicht dat op de gedetineerde noodzakelijk is.

      3 Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in een inrichting of een
      afdeling als bedoeld in het eerste lid in aanmerking te komen.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanwezigheid van de
      benodigde voorzieningen in een inrichting of afdeling voor de geneeskundige behandeling van de geestelijke
      gezondheidstoestand als bedoeld in [artikel 46d, onder a][ref2]. In elk geval worden nadere regels gesteld omtrent
      de beschikbaarheid van een psychiater en een verpleegkundige ten dienste van deze inrichting of afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
