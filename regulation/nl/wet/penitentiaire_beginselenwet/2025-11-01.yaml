  - number: '16'
    text: |-
      1 De directeur bepaalt de wijze van onderbrenging van de gedetineerden die overeenkomstig [artikel 15][ref1] zijn
      geplaatst in de inrichting of afdeling met het beheer waarvan hij is belast.

      2 De directeur wijst iedere gedetineerde een verblijfsruimte toe.

      3 De directeur kan onderdelen van de inrichting of afdeling aanwijzen voor de onderbrenging van gedetineerden die
      een bijzondere opvang in de zin van [artikel 14][ref2] behoeven.

      4 De directeur bepaalt de criteria waaraan de gedetineerde moet voldoen om voor onderbrenging als bedoeld in het
      derde lid in aanmerking te komen.

      5 Onze Minister stelt regels omtrent de eisen waaraan een verblijfsruimte als bedoeld in het tweede lid moet
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel14
