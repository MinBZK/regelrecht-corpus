preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de penitentiaire regelgeving te herzien, in het
    bijzonder aangaande het differentiatie- en selectiestelsel, en in verband daarmee de Beginselenwet gevangeniswezen
    te vervangen door de Penitentiaire beginselenwet alsmede enige bepalingen van het Wetboek van Strafrecht, het
    Wetboek van Strafvordering en enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop rustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister voor Rechtsbescherming;

      b. inrichting: een penitentiaire inrichting als bedoeld in [artikel 3, eerste lid][ref1];

      c. afdeling: een afdeling van een inrichting als bedoeld in [artikel 8, tweede lid][ref2];

      d. directeur: de persoon, bedoeld in [artikel 3, derde lid][ref3], alsmede diens vervanger of vervangers, bedoeld
      in [artikel 3, vierde lid][ref4];

      e. gedetineerde: een persoon ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel in een inrichting plaatsvindt;

      f. ambtenaar of medewerker: een persoon die een taak uitoefent in het kader van de tenuitvoerlegging van een
      vrijheidsstraf of vrijheidsbenemende maatregel;

      g. afdeling voor intensief toezicht: afdeling waar gedetineerden op grond van [artikel 14, tweede lid][ref5],
      worden ondergebracht in verband met de noodzaak van intensief toezicht;

      h. reclasseringswerker: een reclasseringswerker als bedoeld in
      [artikel 6, eerste lid, van de Reclasseringsregeling 1995][ref6];

      i. rechtsbijstandverlener: de advocaat of de medewerker van de voorziening, bedoeld in
      [artikel 8, tweede lid, van de Wet op de rechtsbijstand][ref7], voor zover belast met de verlening van
      rechtsbijstand anders dan rechtshulp;

      j. Raad: de Raad voor strafrechtstoepassing en jeugdbescherming;

      k. commissie van toezicht: een commissie als bedoeld in [artikel 7, eerste lid][ref8];

      l. beklagcommissie: een commissie als bedoeld in [artikel 62, eerste lid][ref9];

      m. beroepscommissie: een commissie als bedoeld in [artikel 69, tweede lid][ref10];

      n. verblijfsruimte: de aan een gedetineerde door de directeur ingevolge [artikel 16, tweede lid][ref11], toegewezen
      ruimte;

      o. penitentiair programma: een programma als bedoeld in [artikel 4][ref12];

      p. huisregels: regels als bedoeld in [artikel 5, eerste lid][ref13];

      q. activiteiten: activiteiten als bedoeld in [hoofdstuk VIII][ref14];

      r. vrijheidsstraf: gevangenisstraf, (vervangende) hechtenis, militaire detentie en (vervangende) jeugddetentie;

      s. vrijheidsbenemende maatregel: voorlopige hechtenis, vreemdelingenbewaring, gijzeling, lijfsdwang,
      terbeschikkingstelling met bevel tot verpleging, plaatsing in een inrichting voor stelselmatige daders en
      vrijheidsbeneming die op andere dan de in [artikel 1, onder s][ref15], genoemde gronden plaatsvindt;

      t. goed gedrag: een zodanige opstelling van een gedetineerde dat hij heeft doen blijken van een bijzondere
      geschiktheid tot terugkeer in de samenleving;

      u. elektronisch toezicht: een technische voorziening waarbij, gebruik makend van signalen, met regelmatige
      tussenpozen de aanwezigheid van een bepaalde persoon op een bepaalde tijd en plaats gecontroleerd wordt.


