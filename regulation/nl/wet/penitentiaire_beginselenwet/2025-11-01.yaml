  - number: 40e
    text: |-
      1 Indien Onze Minister dat aanvaardbaar acht, kan hij op verzoek van de gedetineerde beperkingen die volgen uit het
      bevel opheffen. Onze Minister kan aan de opheffing voorwaarden verbinden.

      2 [Artikel 18][ref1] is van overeenkomstige toepassing met dien verstande dat in plaats van de in artikel 18,
      vierde lid, genoemde termijn van zes maanden, een termijn van vier weken geldt bij een bevel dat alle contacten van
      de gedetineerde met de buitenwereld beperkt, en een termijn van drie maanden voor overige bevelen.

      3 Onze Minister wijzigt een opgelegde beperking ten gunste van de gedetineerde of trekt hem in, indien nieuwe
      feiten of omstandigheden daartoe aanleiding geven. Onze Minister kan op grond van nieuwe feiten of omstandigheden
      een bevel wijzigen ten nadele van de gedetineerde.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel18
