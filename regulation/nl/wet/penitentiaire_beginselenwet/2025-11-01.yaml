        bwb_id: BWBR0009709
        hoofdstuk: XIa
  - number: '19'
    text: |-
      1 De tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel in een inrichting vindt plaats in een
      gemeenschapsregime, tenzij plaatsing in een individueel regime noodzakelijk is.

      2 Onze Minister bepaalt de criteria waaraan gedetineerden moeten voldoen om voor plaatsing in een
      gemeenschapsregime, alsmede voor plaatsing in een voor hen persoonlijk dan wel voor de gemeenschappelijke
      onderbrenging van gedetineerden bestemde verblijfsruimte, in aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel19
  - number: '20'
    text: |-
      Gedetineerden die in een gemeenschapsregime zijn geplaatst, worden zo veel mogelijk in de gelegenheid gesteld met
      andere gedetineerden aan activiteiten deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel20
  - number: '21'
    text: |-
      Gedetineerden die in een individueel regime zijn geplaatst, worden in de gelegenheid gesteld aan activiteiten deel
      te nemen. De directeur bepaalt de mate waarin de gedetineerde in staat wordt gesteld individueel dan wel met andere
      gedetineerden aan activiteiten deel te nemen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel21
  - number: '22'
    text: |-
      De mate waarin een gedetineerde in de gelegenheid wordt gesteld aan activiteiten deel te nemen is mede afhankelijk
      van de mate waarin ten aanzien van de gedetineerde is gebleken van goed gedrag.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel22
  - number: '23'
    text: |-
      1 De directeur kan een gedetineerde uitsluiten van deelname aan een of meer activiteiten:

      a. indien dit in het belang van de handhaving van de orde of de veiligheid in de inrichting dan wel van een
      ongestoorde tenuitvoerlegging van de vrijheidsbeneming noodzakelijk is;

      b. indien dit ter bescherming van de betrokken gedetineerde noodzakelijk is;

      c. in geval van ziekmelding of ziekte van de betrokken gedetineerde;

      d. indien de gedetineerde hierom verzoekt en de directeur dit verzoek redelijk en uitvoerbaar oordeelt.

      2 De uitsluiting ingevolge het eerste lid, onder a of b, duurt ten hoogste twee weken. De directeur kan deze
      uitsluiting telkens voor ten hoogste twee weken verlengen, indien hij tot het oordeel is gekomen dat de noodzaak
      tot uitsluiting nog bestaat.

      3 Indien onverwijlde tenuitvoerlegging van de uitsluiting, bedoeld in het eerste lid, onder a of b, geboden is,
      kan een ambtenaar of medewerker de maatregel, bedoeld in het eerste lid, voor een periode van ten hoogste vijftien
      uren treffen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel23
  - number: '24'
    text: |-
      1 De directeur is bevoegd een gedetineerde in afzondering te plaatsen op de gronden genoemd in
      [artikel 23, eerste lid][ref1]. De afzondering ingevolge [artikel 23, eerste lid, onder a of b][ref2], duurt ten
      hoogste twee weken.

      2 De afzondering wordt ten uitvoer gelegd in een afzonderingscel of in een andere verblijfsruimte. Gedurende het
      verblijf in afzondering neemt de gedetineerde niet deel aan activiteiten, voor zover de directeur niet anders
      bepaalt en behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 49, derde lid][ref3]. De
      directeur kan het contact met de buitenwereld gedurende het verblijf in de afzonderingscel beperken of uitsluiten.

      3 De directeur kan de afzondering, bedoeld in het eerste lid, op de grond van
      [artikel 23, eerste lid, onder a of b][ref4], telkens voor ten hoogste twee weken verlengen, indien hij tot het
      oordeel is gekomen dat de noodzaak tot afzondering nog bestaat.

      4 Indien onverwijlde tenuitvoerlegging van de afzondering op de grond van
      [artikel 23, eerste lid, onder a of b][ref5], geboden is, kan een ambtenaar of medewerker een gedetineerde voor een
      periode van ten hoogste vijftien uren in afzondering plaatsen. De directeur wordt van deze plaatsing onverwijld op
      de hoogte gesteld.

      5 De directeur draagt zorg dat in geval van afzondering het nodige contact tussen ambtenaren en medewerkers van
      de inrichting en de gedetineerde wordt gewaarborgd en naar aard en frequentie op de situatie van de gedetineerde
      wordt afgestemd.

      6 De directeur draagt zorg dat, ingeval de afzondering langer dan vierentwintig uren duurt en ten uitvoer wordt
      gelegd in een afzonderingscel, de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger
      terstond hiervan in kennis worden gesteld.

      7 Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de afzonderingscel. Deze betreffen
      in elk geval de rechten die tijdens het verblijf in de afzonderingscel aan de gedetineerde toekomen.


