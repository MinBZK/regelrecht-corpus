  - number: 51a
    text: |-
      1 De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de gedetineerde
      noodzakelijk is, bepalen dat de gedetineerde die in een strafcel verblijft, dag en nacht door middel van een camera
      wordt geobserveerd.

      2 Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel51a
  - number: '52'
    text: |-
      1 Indien de tenuitvoerlegging van de opsluiting in een strafcel in de inrichting of afdeling waarin zij is opgelegd
      niet mogelijk is of op ernstige bezwaren stuit, kan zij in een andere inrichting of afdeling worden ondergaan.

      2 Indien de directeur van oordeel is dat de in het eerste lid bedoelde omstandigheid zich voordoet, plaatst hij in
      overeenstemming met Onze Minister de gedetineerde hiertoe over.

      3 Onze Minister stelt nadere regels omtrent de procedure van overplaatsing ingevolge het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel52
  - number: '53'
    text: |-
      1 Een straf kan geheel of ten dele voorwaardelijk worden opgelegd. De proeftijd bedraagt ten hoogste drie maanden.

      2 De directeur stelt in elk geval als voorwaarde dat de gedetineerde zich onthoudt van het plegen van feiten die
      onverenigbaar zijn met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van
      de vrijheidsbeneming. De directeur kan andere voorwaarden aan het gedrag van de gedetineerde stellen. De opgelegde
      voorwaarden worden vermeld in de mededeling, bedoeld in [artikel 58, eerste lid][ref1].

      3 Bij het overtreden van een voorwaarde binnen de proeftijd kan de directeur bepalen dat de opgelegde
      voorwaardelijke straf geheel of ten dele ten uitvoer wordt gelegd.

      4 De directeur kan een onvoorwaardelijke straf geheel of ten dele omzetten in een voorwaardelijke straf.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel58
