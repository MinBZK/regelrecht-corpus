    text: |-
      1 Het beroepschrift wordt behandeld door een door de Raad benoemde commissie van drie leden of
      buitengewone leden, die wordt bijgestaan door een secretaris. Ten aanzien van het beroepschrift, bedoeld in
      [artikel 72, eerste lid][ref1], is [artikel 69, derde en vierde lid][ref2], van overeenkomstige toepassing.

      2 Het beroepschrift wordt ingediend uiterlijk op de zevende dag na die waarop de betrokkene kennis heeft gekregen
      van de beslissing waartegen hij beroep instelt. Een na afloop van deze termijn ingediend beroepschrift is niettemin
      ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de gedetineerde in verzuim is geweest.

      3 Indien de betrokkene gedetineerd is, kan de indiening van het beroepschrift geschieden door tussenkomst van
      de directeur van de inrichting of afdeling waar hij verblijft. De directeur draagt zorg dat het beroepschrift
      onverwijld van een dagtekening wordt voorzien. Als dag waarop het beroepschrift is ingediend geldt die van de
      dagtekening.

      4 De [artikelen 60, derde lid][ref3], [61, vierde lid][ref4], [63][ref5], [64][ref6], [65][ref7], [66][ref8],
      __REF006___________________________________________________________________________________________________________
      ___________, [68, eerste, tweede, derde, vierde, zesde en zevende lid][ref10], zijn van overeenkomstige toepassing,
      met dien verstande dat de commissie, bedoeld in het eerste lid, kan bepalen dat:

      a. de betrokkenen uitsluitend in de gelegenheid worden gesteld het beroepschrift schriftelijk toe te lichten;

      b. de mondelinge opmerkingen ten overstaan van een lid van de commissie, bedoeld in het eerste lid, kunnen worden
      gemaakt;

      c. ingeval bij een ander persoon mondeling inlichtingen worden ingewonnen, de betrokkenen uitsluitend in de
      gelegenheid worden gesteld schriftelijk de vragen op te geven die zij aan die persoon gesteld wensen te zien.

      5 Bij de behandeling van het beroepschrift op een bevel als bedoeld in [artikel 40d][ref11], kunnen, in afwijking
      van het bepaalde in [artikel 65, derde lid][ref12], partijen die verplicht zijn inlichtingen te geven dan wel
      stukken over te leggen, indien daarvoor gewichtige redenen zijn, het geven van inlichtingen dan wel het overleggen
      van stukken weigeren of de commissie mededelen dat uitsluitend zij kennis zal mogen nemen van de inlichtingen
      onderscheidenlijk de stukken.

      6 De commissie beslist of de in het vijfde lid bedoelde weigering onderscheidenlijk de beperking van de
      kennisneming gerechtvaardigd is. Indien de commissie heeft beslist dat de weigering gerechtvaardigd is, vervalt
      de verplichting.

      7 Indien de commissie heeft beslist dat de beperking van de kennisneming gerechtvaardigd is, kan zij slechts met
      toestemming van de andere partij mede op de grondslag van die inlichtingen onderscheidenlijk die stukken uitspraak
      doen.

      8 Indien de toestemming wordt geweigerd, wordt de zaak verwezen naar een andere commissie die op het beroep
      beslist.

      9 De Raad doet zo snel mogelijk uitspraak.


