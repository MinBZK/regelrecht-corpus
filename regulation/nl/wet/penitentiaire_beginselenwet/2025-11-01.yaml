  - number: '15'
    text: |-
      1 De personen ten aanzien van wie de tenuitvoerlegging van vrijheidsstraffen of vrijheidsbenemende maatregelen
      is gelast worden geplaatst in een inrichting of afdeling dan wel overgeplaatst naar een inrichting of
      afdeling overeenkomstig de bestemming daarvan ingevolge [hoofdstuk III][ref1]. Van het bepaalde omtrent de
      bestemming kan worden afgeweken op gronden gelegen in de persoon van de betrokkene. Indien een persoon voor
      plaatsing in meer dan één inrichting of afdeling in aanmerking komt, geschiedt deze met inachtneming van
      [artikel 2, tweede, derde en vierde lid][ref2].

      2 Onze Minister is bevoegd tot plaatsing en overplaatsing als bedoeld in het eerste lid en tot het nemen van
      de beslissing tot deelname aan het penitentiaire programma, bedoeld in [artikel 4, tweede lid][ref3], en de
      beslissingen, bedoeld in artikel 4, vijfde en zevende lid. Onze Minister is tevens bevoegd de overbrenging
      te bevelen naar de voor hen bestemde inrichting of afdeling, dan wel ten behoeve van deelname aan het voor
      hen bestemde penitentiair programma dan wel de beëindiging hiervan. Onze Minister is bovendien bevoegd tot de
      beslissing of ten aanzien van de individuele gedetineerde is gebleken van goed gedrag dat aanleiding geeft tot
      deelname van de gedetineerde aan een penitentiair programma, zodra aan de voorwaarden, bedoeld in artikel 4, tweede
      lid, onderdelen b en c, is voldaan.

      3 Onze Minister neemt bij de beslissingen, bedoeld in het eerste en tweede lid, de aanwijzingen van het openbaar
      ministerie en van de autoriteiten die de straf of maatregel hebben opgelegd in aanmerking.

      4 In geval van een psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap
      van een gedetineerde kan Onze Minister bepalen dat de gedetineerde naar een accommodatie als
      bedoeld in [artikel 1:1, onderdeel b, van de Wet verplichte geestelijke gezondheidszorg][ref4] of
      [artikel 1, onderdeel b, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref5]
      zal worden overgebracht om daar zolang dat noodzakelijk is te worden verpleegd. Indien de gedetineerde
      wordt overgebracht ten behoeve van de verlening van forensische zorg, bedoeld bij of krachtens de
      [Wet forensische zorg][ref6], geschiedt de overbrenging overeenkomstig die wet.

      5 Onze Minister stelt nadere regels vast omtrent de procedure van plaatsing en overplaatsing en overbrenging,
      bedoeld in het eerste onderscheidenlijk het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#HoofdstukIII
