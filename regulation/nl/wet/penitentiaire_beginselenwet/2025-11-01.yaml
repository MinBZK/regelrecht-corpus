  - number: '76'
    text: |-
      1 De plaatsing van een tot vrijheidsstraf veroordeelde in een instelling voor verpleging
      van ter beschikking gestelden geschiedt voordat zes maanden sedert de beslissing, bedoeld in
      [artikel 6:2:8, eerste lid, van het Wetboek van Strafvordering][ref1] is genomen, in een gevangenis of huis van
      bewaring zijn doorgebracht.

      2 Indien Onze Minister, rekening houdende met de in [artikel 6.2, tweede lid, van de Wet forensische zorg][ref2]
      genoemde eisen, van oordeel is dat de plaatsing niet binnen de in het eerste lid gestelde termijn mogelijk is, kan
      hij deze termijn telkens met drie maanden verlengen.

      3 Tegen de beslissing tot verlenging, bedoeld in het tweede lid, kan de tot
      vrijheidsstraf veroordeelde beroep instellen bij de Raad. Het bepaalde in
      [Hoofdstuk XVI van de Beginselenwet verpleging ter beschikking gestelden][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel628
