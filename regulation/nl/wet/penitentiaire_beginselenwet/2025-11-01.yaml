  - number: '34'
    text: |-
      1 De directeur is bevoegd de verblijfsruimte van een gedetineerde op de aanwezigheid van voorwerpen die niet in
      zijn bezit mogen zijn te onderzoeken:

      a. indien dit onderzoek plaatsvindt in het kader van het algemeen toezicht op de aanwezigheid van verboden
      voorwerpen in de verblijfsruimten van gedetineerden;

      b. indien dit anderszins noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in de
      inrichting.

      2 [Artikel 29, vijfde lid][ref1], is van overeenkomstige toepassing.

      3 De directeur is bevoegd de verblijfsruimte van een gedetineerde te onderzoeken op de aanwezigheid van voorwerpen
      waarop vermoedelijk celmateriaal van de gedetineerde aanwezig is en deze voorwerpen in beslag te nemen, indien de
      officier van justitie hem op grond van [artikel 6, eerste lid, van de Wet DNA-onderzoek bij veroordeelden][ref2]
      een opdracht tot het in beslag nemen van deze voorwerpen heeft gegeven.


