    text: |-
      Inrichtingen voor stelselmatige daders zijn bestemd voor de opneming van personen aan wie een maatregel als bedoeld
      in [artikel 38m van het Wetboek van Strafrecht][ref1] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
