  - number: 40d
    text: |-
      1 Onze Minister kan bevelen dat de gedetineerde die verblijft in een afdeling voor intensief toezicht of in een
      extra beveiligde inrichting als bedoeld in [artikel 13, eerste lid, onderdeel d][ref1], aan beperkingen wordt
      onderworpen die in het belang van de openbare orde of veiligheid buiten de inrichting noodzakelijk zijn:

      a. bij aanwijzingen dat de gedetineerde zijn contacten gebruikt voor ernstig intimiderende of levensbedreigende
      activiteiten in de buitenwereld, of

      b. indien gelet op de aard van de verdenking, de aard van het misdrijf of de misdrijven waarvoor de gedetineerde is
      veroordeeld, de omstandigheden waaronder dat misdrijf of die misdrijven zouden zijn begaan of zijn begaan, of gelet
      op de persoonlijkheid van de gedetineerde, een gevaar voor de openbare orde of veiligheid moet worden aangenomen.

      2 Een gevaar bedoeld in het eerste lid, onderdeel b, kan in ieder geval worden aangenomen indien de gedetineerde
      wordt verdacht van of is veroordeeld wegens deelneming aan een organisatie die tot oogmerk heeft het plegen
      van misdrijven waarop een gevangenisstraf van twaalf jaren of meer is gesteld, terwijl de gedetineerde
      volgens de verdenking of veroordeling van die organisatie als oprichter, leider of bestuurder, bedoeld in
      [artikel 140, derde en vierde lid, van het Wetboek van Strafrecht][ref2], kan worden aangemerkt.

      3 Het bevel kan inhouden:

      a. een beperking of uitsluiting van de mate waarin de gedetineerde in staat wordt gesteld individueel dan wel met
      andere gedetineerden aan activiteiten deel te nemen, in afwijking van [artikel 21][ref3];

      b. een beperking of uitsluiting van deelname aan gemeenschappelijke activiteiten, in afwijking van
      [artikel 23][ref4];

      c. een beperking of uitsluiting van het ontvangen en verzenden van brieven en het intensiveren van toezicht daarop,
      in afwijking van [artikel 36][ref5];

      d. een beperking of uitsluiting van het ontvangen van bezoek en het intensiveren van toezicht daarop, in afwijking
      van de [artikelen 38][ref6], [40b][ref7] en [40c][ref8];

      e. een beperking of uitsluiting van telefoonverkeer en het intensiveren van toezicht daarop, in afwijking van de
      [artikelen 39][ref9], [40b][ref10] en [40c][ref11];

      f. een beperking of uitsluiting van het onderhouden van contacten met de media en het toezicht daarop, in afwijking
      van [artikel 40][ref12];

      g. een beperking van het recht op het kennis nemen van het nieuws, in afwijking van
      [artikel 48, eerste lid][ref13];

      h. een uitsluiting van deelname aan overleg, bedoeld in [artikel 74][ref14].

      4 Het bevel kan de rechten van derden buiten de inrichting beperken.

      5 Het bevel is schriftelijk. De maatregelen zijn gemotiveerd. Voor zover het bevel alle contacten van de
      gedetineerde met de buitenwereld beperkt, is het bevel ten hoogste drie maanden van kracht. In de overige gevallen
      is het bevel ten hoogste twaalf maanden van kracht. Het bevel duurt niet langer dan strikt noodzakelijk. Onze
      Minister kan het bevel telkens verlengen met een periode van ten hoogste dezelfde periode. Het bevel vermeldt
      telkens de duur van de daarin opgenomen maatregelen.

      6 Onze Minister kan het openbaar ministerie, de politie of het gerecht dat de zaak in laatste instantie feitelijk
      heeft behandeld om advies vragen over de inhoud van het bevel. Onze Minister kan de directeur inlichtingen vragen
      over de omstandigheden van de gedetineerde.

      7 Indien het bevel uitsluitend berust op de persoonlijkheid van de gedetineerde, bedoeld in het eerste lid,
      onderdeel b, dient de Minister in zijn bevel een advies van een gedragsdeskundige te betrekken.

      8 Het bevel beperkt de vrijheid van verkeer tussen de rechtsbijstandverlener en de gedetineerde niet.

      9 De directeur draagt zorg voor de uitvoering van het bevel.

      10 Het bevel laat de bevoegdheden van de directeur op grond van het bepaalde bij en krachtens deze wet onverlet.


