  - number: '9'
    text: |-
      1 Inrichtingen zijn te onderscheiden in huizen van bewaring, gevangenissen en inrichtingen voor stelselmatige
      daders. Onze Minister kan een inrichting aanwijzen tot zowel huis van bewaring of gevangenis als inrichting voor
      stelselmatige daders. In bijzondere gevallen kan Onze Minister een inrichting aanwijzen tot zowel huis van bewaring
      als gevangenis.

      2 Huizen van bewaring zijn bestemd voor de opneming van:

      a. personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven en die in afwachting zijn van
      berechting in eerste aanleg;

      b. personen ten aanzien van wie een bevel tot voorlopige hechtenis is gegeven en aan wie de maatregel van
      terbeschikkingstelling met bevel tot verpleging is opgelegd, maar die niet tevens tot een vrijheidsstraf zijn
      veroordeeld, dan wel aan wie de maatregel tot plaatsing in een inrichting voor stelselmatige daders is opgelegd,
      voor zolang het opleggen van die maatregel niet onherroepelijk is;

      c. personen ten aanzien van wie de tenuitvoerlegging van een vrijheidsstraf plaatsvindt en die in afwachting zijn
      van plaatsing in een gevangenis of deelname aan een penitentiair programma;

      d. personen in vreemdelingenbewaring;

      e. gegijzelden;

      f. ter beschikking gestelden ten aanzien van wie een bevel tot verpleging van
      overheidswege als bedoeld in [artikel 37b van het Wetboek van Strafrecht][ref1] of
      [artikel 6:6:10, eerste lid, onder e, van het Wetboek van Strafvordering][ref2] is gegeven voor zolang opname in
      de voor hen bestemde plaats niet mogelijk is;

      g. personen aan wie de maatregel is opgelegd tot plaatsing in een inrichting voor stelselmatige daders als bedoeld
      in [artikel 38m van het Wetboek van Strafrecht][ref3] indien opname in de voor hen bestemde plaats niet mogelijk
      is;

      h. alle anderen aan wie krachtens rechterlijke uitspraak of beschikking of door het openbaar gezag rechtens hun
      vrijheid is ontnomen, voor zover geen andere plaats voor hen is bestemd of voor zolang opname in de voor hen
      bestemde plaats niet mogelijk is.

      3 Onze Minister wijst in elk arrondissement ten minste één inrichting of afdeling aan als huis van bewaring.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel6610
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel38m
