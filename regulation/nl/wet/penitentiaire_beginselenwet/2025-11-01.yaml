  - number: '71'
    text: |-
      1 De beroepscommissie doet zo spoedig mogelijk uitspraak.

      2 De uitspraak van de beroepscommissie strekt tot gehele of gedeeltelijke:

      a. niet-ontvankelijkverklaring van het beroep;

      b. bevestiging van de uitspraak van de beklagcommissie, hetzij met overneming, hetzij met verbetering van de
      gronden;

      c. vernietiging van de uitspraak van de beklagcommissie.

      3 Indien het tweede lid, onder c, toepassing vindt, doet de beroepscommissie hetgeen de beklagcommissie had behoren
      te doen.

      4 Ten aanzien van de uitspraak van de beroepscommissie zijn de [artikelen 66][ref1] en
      [67, tweede lid, eerste en derde tot en met vijfde volzin, vierde en zevende lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel67
