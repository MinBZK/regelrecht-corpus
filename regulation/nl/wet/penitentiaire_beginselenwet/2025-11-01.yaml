  - number: '57'
    text: |-
      1 De directeur stelt de gedetineerde in de gelegenheid te worden gehoord, zoveel mogelijk in een voor hem
      begrijpelijke taal, alvorens hij beslist omtrent:

      a. de weigering of intrekking van de toestemming om een kind in de inrichting onder te brengen, bedoeld in
      [artikel 12][ref1];

      b. de uitsluiting van deelname aan activiteiten en de verlenging daarvan, bedoeld in
      [artikel 23, eerste lid, onder a of b, onderscheidenlijk tweede lid][ref2];

      c. de plaatsing in afzondering en de verlenging hiervan, bedoeld in [artikel 24, eerste lid][ref3], op grond van
      [artikel 23, eerste lid, onder a of b][ref4], onderscheidenlijk [artikel 24, derde lid][ref5], en de toepassing
      van [artikel 25][ref6];

      d. de beperking en de intrekking van verlof, bedoeld in [artikel 26, derde lid][ref7];

      e. het onderzoek in het lichaam, bedoeld in [artikel 31][ref8];

      f. het gedogen van een geneeskundige handeling, bedoeld in [artikel 32][ref9];

      g. het verrichten van een geneeskundige behandeling bedoeld in [artikel 46d, onder a of b][ref10];

      h. de bevestiging door mechanische middelen en de verlenging daarvan, bedoeld in
      [artikel 33, eerste onderscheidenlijk derde lid][ref11];

      i. de observatie door middel van een camera en de verlenging daarvan, bedoeld in
      [artikel 34a, eerste onderscheidenlijk derde lid][ref12];

      j. de observatie door middel van een camera, bedoeld in de [artikelen 24a, eerste lid][ref13], en
      [51a, eerste lid][ref14];

      k. de oplegging van een disciplinaire straf, bedoeld in [artikel 51][ref15], en toepassing van de
      [artikelen 52][ref16] en [53, derde lid][ref17];

      l. de overplaatsing van een gedetineerde naar een andere locatie binnen dezelfde penitentiaire inrichting.

      2 Zo nodig geschiedt het horen van de gedetineerde met bijstand van een tolk. Van het horen van de gedetineerde
      wordt aantekening gehouden.

      3 Toepassing van het eerste lid, onder b, c, d, e, f, h en l, kan achterwege blijven indien:

      a. de vereiste spoed zich daartegen verzet;

      b. de gemoedstoestand van de gedetineerde daaraan in de weg staat.


