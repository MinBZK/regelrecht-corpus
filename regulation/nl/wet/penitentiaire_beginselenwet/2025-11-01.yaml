  - number: 40b
    text: |-
      1 De gedetineerde die verblijft in een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d][ref1], wordt in de gelegenheid gesteld om:

      a. één uur per week bezoek te ontvangen;

      b. éénmaal per week tien minuten één telefoongesprek te voeren.

      2 De gedetineerde ontvangt per bezoekmoment slechts één meerderjarige bezoeker dan wel één minderjarige bezoeker
      vergezeld door één meerderjarige bezoeker.

      3 Op het bezoek en het telefoongesprek wordt toezicht uitgeoefend als bedoeld in [artikel 38, vierde lid][ref2],
      respectievelijk [artikel 39, tweede lid][ref3].

      4 Onze Minister kan een tijdelijke verruiming van het bepaalde in het eerste en tweede lid toestaan indien sprake
      is van bijzondere omstandigheden die een tijdelijke verruiming rechtvaardigen.

      5 [Artikel 18, eerste en derde lid][ref4], is van overeenkomstige toepassing. Onze Minister kan het verzoek
      rauwelijks afwijzen indien de gedetineerde bij herhaling kennelijk ongegronde verzoeken doet.

      6 Onze Minister kan te allen tijde de toepassing van het vierde lid beëindigen, indien nieuwe feiten of
      omstandigheden daartoe aanleiding geven.

      7 Bij regeling van Onze Minister worden nadere regels gesteld over de toepassing van het vierde en zesde lid.


