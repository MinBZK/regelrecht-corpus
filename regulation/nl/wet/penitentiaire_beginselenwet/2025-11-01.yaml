  - number: '74'
    text: |-
      De directeur draagt zorg voor een regelmatig overleg met gedetineerden over zaken die rechtstreeks de detentie
      raken.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel74
  - number: '75'
    text: |-
      1 De in de [artikelen 17][ref1] en [18][ref2], alsmede in de [hoofdstukken XI tot en met XIII][ref3] aan de
      gedetineerde toegekende rechten kunnen, behoudens ingeval Onze Minister, de Medisch Adviseur, Onze Minister of
      beklag- of beroepscommissie, de beklagcommissie, bedoeld in [hoofdstuk XIIA][ref4], of de beroepscommissie, bedoeld
      in hoofdstuk XIIA of [XIIB][ref5], van oordeel is dat zwaarwegende belangen van de gedetineerde zich daartegen
      verzetten, mede worden uitgeoefend door:

      a. de curator, indien de gedetineerde onder curatele is gesteld;

      b. de mentor, indien ten behoeve van de gedetineerde een mentorschap is ingesteld;

      c. de ouders of voogd, indien de gedetineerde minderjarig is.

      2 De directeur draagt zorg dat de in het eerste lid genoemde personen op deze rechten opmerkzaam worden gemaakt.


