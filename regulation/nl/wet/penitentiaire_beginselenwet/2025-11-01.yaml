  - number: 46c
    text: |-
      Geneeskundige behandeling van de geestelijke gezondheidstoestand van de gedetineerde vindt slechts plaats:

      a. voor zover deze is voorzien in het geneeskundig behandelingsplan als bedoeld in [artikel 46b, eerste lid][ref1]

      b. indien het overleg over het geneeskundig behandelingsplan, bedoeld in
      [artikel 46b, eerste lid of vierde lid][ref2], tot overeenstemming heeft geleid, en

      c. indien de gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref3], zich niet tegen de
      behandeling verzet.


