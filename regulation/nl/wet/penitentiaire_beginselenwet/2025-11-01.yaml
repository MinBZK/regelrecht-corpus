  - number: 24a
    text: |-
      1 De directeur kan, indien dit ter bescherming van de geestelijke of lichamelijke toestand van de gedetineerde
      noodzakelijk is, bepalen dat de gedetineerde die in een afzonderingscel verblijft, dag en nacht door middel van een
      camera wordt geobserveerd.

      2 Alvorens hij hiertoe beslist, wint hij het advies in van een gedragsdeskundige onderscheidenlijk de
      inrichtingsarts, tenzij dit advies niet kan worden afgewacht. In dat geval wint de directeur het advies zo spoedig
      mogelijk na zijn beslissing in.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel24a
  - number: '25'
    text: |-
      1 Indien de tenuitvoerlegging van de afzondering in de inrichting of afdeling waarin zij is opgelegd op ernstige
      bezwaren stuit, kan zij in een andere inrichting of afdeling worden ondergaan.

      2 Indien de directeur van oordeel is dat van de in het eerste lid bedoelde omstandigheid sprake is, plaatst hij in
      overeenstemming met Onze Minister de gedetineerde over.

      3 Over de verlenging van de afzondering, waarvan de tenuitvoerlegging plaatsvindt in een andere inrichting of
      afdeling, beslist de directeur van de inrichting of afdeling waarin de afzondering was opgelegd, in overeenstemming
      met Onze Minister en gehoord de directeur van de inrichting of afdeling waar de tenuitvoerlegging van de
      afzondering plaatsvindt.

      4 Onze Minister stelt nadere regels omtrent de procedure van overplaatsing en van verlenging van de afzondering
      ingevolge het tweede onderscheidenlijk het derde lid.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel25
  - number: '26'
    text: |-
      1 Een gedetineerde kan, ingevolge het derde en het vierde lid, worden toegestaan de inrichting te verlaten.

      2 Het verlaten van de inrichting, bedoeld in het eerste lid, schort de tenuitvoerlegging van de vrijheidsstraf of
      vrijheidsbenemende maatregel niet op.

      3 Onze Minister stelt nadere regels aangaande het verlaten van de inrichting bij wijze van verlof. Deze betreffen
      in elk geval de criteria waaraan een gedetineerde moet voldoen om voor het verlof in aanmerking te komen, de
      bevoegdheid tot en de wijze van verlening, weigering, beperking en intrekking alsmede de duur en frequentie van het
      verlof en de voorwaarden die aan het verlof kunnen worden verbonden.

      4 De directeur stelt een gedetineerde in de gelegenheid onder door hem te stellen voorwaarden de inrichting te
      verlaten teneinde een gerechtelijke procedure bij te wonen:

      a. indien de gedetineerde krachtens wettelijk voorschrift verplicht is voor een rechter of bestuursorgaan te
      verschijnen;

      b. indien de gedetineerde ter zake van een misdrijf moet terechtstaan;

      c. indien de gedetineerde bij het bijwonen van de procedure een aanmerkelijk belang heeft en tegen het verlaten van
      de inrichting hiertoe geen overwegend bezwaar bestaat.

      5 Met het oog op het verlaten van de inrichting, bedoeld in het vierde lid, kan de directeur aan daartoe door
      hem aangewezen ambtenaren of medewerkers bevelen dat de betrokken persoon naar de daartoe bestemde plaats wordt
      overgebracht.

      6 Onze Minister kan nadere regels stellen omtrent de wijze waarop het vervoer van de gedetineerde ten behoeve het
      bijwonen van een gerechtelijke procedure, bedoeld in het vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel26
  - number: '27'
    text: |-
      Het recht van de gedetineerde op onaantastbaarheid van zijn lichaam, zijn kleding en de van zijn lichaam
      afgescheiden stoffen en zijn verblijfsruimte kan overeenkomstig de bepalingen van dit hoofdstuk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel27
  - number: '28'
    text: |-
      1 De directeur stelt bij binnenkomst in en bij het verlaten van de inrichting, bij de tenuitvoerlegging van een
      bevel als bedoeld in [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref1] en voor
      zover dit anderszins noodzakelijk is, de identiteit van de gedetineerde vast.

      2 De directeur stelt tevens voorafgaand aan en na afloop van bezoek de identiteit van de gedetineerde vast, tenzij
      een ambtenaar of medewerker op de gedetineerde voortdurend en persoonlijk toezicht houdt.

      3 Het vaststellen van de identiteit van de gedetineerde omvat bij de eerste opname in de inrichting
      het vragen naar zijn naam, voornamen, geboorteplaats en geboortedatum, het adres waarop hij in
      de basisregistratie personen is ingeschreven en het adres van zijn feitelijke verblijfplaats
      buiten de inrichting. Het omvat tevens het nemen van een of meer vingerafdrukken. In de gevallen
      waarin van de gedetineerde eerder overeenkomstig het [Wetboek van Strafvordering][ref2] of de
      [Vreemdelingenwet 2000][ref3] vingerafdrukken zijn genomen en verwerkt, omvat het vaststellen van zijn
      identiteit bij binnenkomst in de inrichting tevens een vergelijking van zijn vingerafdrukken met de
      van hem verwerkte vingerafdrukken. In de andere gevallen omvat het vaststellen van zijn identiteit een
      onderzoek van zijn identiteitsbewijs, bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref4].
      [Artikel 29c, tweede lid, van het Wetboek van Strafvordering][ref5] is van overeenkomstige toepassing.

      4 Het vaststellen van de identiteit van de gedetineerde omvat in de andere gevallen dan de eerste opname
      in de inrichting het nemen van een of meer vingerafdrukken en het vergelijken van die vingerafdrukken met
      de van hem bij binnenkomst genomen vingerafdrukken. Bij de tenuitvoerlegging van een bevel als bedoeld in
      [artikel 2, eerste lid, aanhef, van de Wet DNA-onderzoek bij veroordeelden][ref6] worden van de gedetineerde tevens
      een of meer vingerafdrukken overeenkomstig het [Wetboek van Strafvordering][ref7] genomen en verwerkt.

      5 De directeur is bevoegd van de gedetineerde een of meer foto’s te nemen. De foto’s kunnen worden gebruikt voor
      het vervaardigen van een legitimatiebewijs en voor het voorkomen, opsporen, vervolgen en berechten van strafbare
      feiten. De gedetineerde is verplicht het legitimatiebewijs bij zich te dragen en op verzoek van een ambtenaar of
      medewerker te tonen.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor het verwerken van de persoonsgegevens,
      bedoeld in het derde tot en met vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017212#Artikel2
