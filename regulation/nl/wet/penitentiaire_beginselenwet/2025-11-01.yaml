        artikel: '42'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 71c
    text: |-
      1 Alvorens een beroepschrift in te dienen doet de gedetineerde een schriftelijk verzoek aan de Medisch Adviseur bij
      het Ministerie van Veiligheid en Justitie om te bemiddelen terzake van de klacht. Dit verzoek dient uiterlijk op
      de veertiende dag na die waarop het medisch handelen waartegen de klacht zich richt heeft plaatsgevonden te worden
      ingediend.

      2 De indiening van het schriftelijk verzoek kan door tussenkomst van een door de directeur daartoe aangewezen
      ambtenaar of medewerker geschieden, die bevoegd is van het verzoekschrift kennis te nemen. Deze ambtenaar of
      medewerker draagt in dat geval zorg dat het verzoekschrift van een dagtekening wordt voorzien, welke dag geldt als
      dag van indiening.

      3 De ambtenaar of medewerker, bedoeld in het tweede lid, voert een of meerdere gesprekken met de betrokkenen en
      zendt een verslag daarvan naar de Medisch Adviseur.

      4 De Medisch Adviseur stelt de gedetineerde in de gelegenheid de klacht schriftelijk of mondeling toe te lichten,
      tenzij hij het aanstonds duidelijk acht dat de klacht zich niet voor bemiddeling leent. Hij kan ook bij andere
      personen mondeling of schriftelijk inlichtingen inwinnen.

      5 De Medisch Adviseur is ten behoeve van de bemiddeling bevoegd het medisch dossier van de gedetineerde in te zien.

      6 De Medisch Adviseur streeft ernaar binnen vier weken nadat hij het verslag, bedoeld in het derde lid, heeft
      ontvangen een voor beide partijen aanvaardbare oplossing te bereiken.

      7 De Medisch Adviseur sluit de bemiddeling af met een mededeling van zijn bevindingen aan de gedetineerde en de
      arts. De gedetineerde wordt gewezen op de mogelijkheden van het indienen van een beroepschrift alsmede de termijn
      waarbinnen en de wijze waarop dit gedaan moet worden.

      8 De Medisch Adviseur zendt een afschrift van de mededeling aan de ambtenaar of medewerker, bedoeld in het tweede
      lid, en de directeur van de inrichting waaraan de arts tegen wiens medisch handelen de klacht zich richt, is
      verbonden.

      9 De ambtenaar of medewerker, bedoeld in het tweede lid, en de Medisch Adviseur zijn bevoegd een klacht die geen
      medisch handelen betreft, door te verwijzen naar de beklagcommissie. Hij zendt van de doorverwijzing een bericht
      aan de gedetineerde en, indien het de Medisch Adviseur is die doorverwijst, naar de ambtenaar of medewerker,
      bedoeld in het tweede lid. Indien reeds een verslag als bedoeld in het derde lid is opgesteld, wordt dit naar de
      commissie van toezicht gezonden.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel71c
  - number: 71d
    text: |-
      1 Een met redenen omkleed beroepschrift wordt ingediend bij en behandeld door een door de Raad benoemde
      beroepscommissie van drie leden of buitengewone leden, bestaande uit één jurist en twee artsen, die wordt
      bijgestaan door een secretaris.

      2 Het beroepschrift wordt ingediend uiterlijk op de zevende dag na die van de ontvangst van het afschrift van de
      mededeling van de Medisch Adviseur. De directeur draagt zorg dat een gedetineerde die beroep wenst in te stellen
      daartoe zo spoedig mogelijk in de gelegenheid wordt gesteld.

      3 [Artikel 61, tweede en vierde lid][ref1], is van overeenkomstige toepassing.

      4 Het beroepschrift vermeldt zo nauwkeurig mogelijk het medisch handelen waarover wordt geklaagd en de redenen van
      het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel71d
