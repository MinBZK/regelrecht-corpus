  - number: 71f
    text: |-
      1 De beroepscommissie doet zo spoedig mogelijk uitspraak.

      2 De [artikelen 67, tweede, vierde en zevende lid][ref1], en [68, eerste lid][ref2], zijn van overeenkomstige
      toepassing.

      3 De uitspraak strekt tot gegrondverklaring van het beroep indien sprake is van:

      a. enig handelen in het kader van of nalaten in strijd met de zorg die de in [artikel 71b][ref3] bedoelde
      personen in die hoedanigheid behoren te betrachten ten opzichte van de gedetineerde, met betrekking tot wiens
      gezondheidstoestand zij bijstand verlenen of hun bijstand is ingeroepen;

      b. enig ander onder a bedoeld handelen of nalaten in die hoedanigheid in strijd met het belang van een goede
      uitoefening van de individuele gezondheidszorg.

      4 Indien de klacht door de beroepscommissie geheel of gedeeltelijk gegrond wordt geacht bepaalt de beroepscommissie
      of enige tegemoetkoming aan de gedetineerde geboden is. Zij stelt de tegemoetkoming, die geldelijk van aard kan
      zijn, vast.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel67
