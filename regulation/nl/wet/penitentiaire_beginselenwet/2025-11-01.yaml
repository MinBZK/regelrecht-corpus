  - number: '72'
    text: |-
      1 De betrokkene heeft het recht tegen de beslissing van Onze Minister op het bezwaar- of verzoekschrift voor
      zover dit betreft een gehele of gedeeltelijke ongegrondverklaring, onderscheidenlijk afwijzing als bedoeld in
      de [artikelen 17][ref1], [18][ref2] en [40a, vijfde en zesde lid][ref3] een met redenen omkleed beroepschrift
      in te dienen bij de commissie, bedoeld in [artikel 73, eerste lid][ref4]. De betrokkene heeft ook het recht
      een beroepschrift in te dienen in het geval dat het indienen van een bezwaarschrift op de grond als vermeld in
      [artikel 17, vijfde lid][ref5], achterwege is gebleven.

      2 De gedetineerde heeft het recht tegen een hem betreffende beslissing aangaande verlof, voor zover hiertegen geen
      beklag ingevolge [artikel 60, eerste en tweede lid][ref6], openstaat, een met redenen omkleed beroepschrift in te
      dienen bij de commissie, bedoeld in [artikel 73, eerste lid][ref7].

      3 Tegen de beslissing als bedoeld in het eerste lid van [artikel 46e][ref8] kan rechtstreeks beroep worden
      ingesteld bij de Raad.


