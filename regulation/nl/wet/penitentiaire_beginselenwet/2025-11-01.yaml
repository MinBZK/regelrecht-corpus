        artikel: '29'
        hoofdstuk: VI
  - number: '32'
    text: |-
      1 De directeur kan een gedetineerde verplichten te gedogen dat ten aanzien van hem een bepaalde geneeskundige
      handeling wordt verricht, indien die handeling naar het oordeel van een arts volstrekt noodzakelijk is ter
      afwending van gevaar voor de gezondheid of veiligheid van de gedetineerde of van anderen. De handeling wordt
      verricht door een arts of, in diens opdracht, door een verpleegkundige.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid.
      Deze regels betreffen in ieder geval de melding en registratie van de geneeskundige handeling, alsmede de taak
      van de verantwoordelijke arts indien de geneeskundige handeling volstrekt noodzakelijk is ter afwending van
      gevaar, voortvloeiend uit de psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap van
      de gedetineerde. De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum van
      uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de
      beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel32
  - number: '33'
    text: |-
      1 De directeur kan bepalen dat een gedetineerde tijdens de afzondering door bevestiging van mechanische middelen
      aan zijn lichaam voor een periode van ten hoogste vierentwintig uren in zijn bewegingsvrijheid wordt beperkt,
      indien die beperking noodzakelijk is ter afwending van een van de gedetineerde uitgaand ernstig gevaar voor diens
      gezondheid of de veiligheid van anderen dan de gedetineerde. De directeur stelt de arts of diens vervanger en de
      commissie van toezicht van de bevestiging onverwijld in kennis.

      2 Indien onverwijlde tenuitvoerlegging van de maatregel, bedoeld in het eerste lid, geboden is, kan een ambtenaar
      of medewerker hiertoe beslissen en deze voor een periode van ten hoogste vier uren ten uitvoer leggen. De
      directeur, de arts of diens vervanger en de commissie van toezicht worden hiervan onverwijld in kennis gesteld.

      3 De directeur kan de beslissing tot bevestiging van mechanische middelen aan het lichaam van de gedetineerde
      telkens met ten hoogste vierentwintig uren verlengen. De beslissing tot verlenging wordt genomen na overleg met de
      aan de inrichting verbonden arts of diens vervanger.

      4 Onze Minister stelt nadere regels omtrent de bevestiging van mechanische middelen aan het lichaam.
