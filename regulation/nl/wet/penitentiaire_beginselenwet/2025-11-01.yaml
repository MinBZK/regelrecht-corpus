  - number: 77b
    text: |-
      Op de wijze als voorzien in [artikel 77a][ref1] kan worden afgeweken van:

      a. de [artikelen 8 tot en met 10][ref2], met als doel om verschillende doelgroepen gezamenlijk op een afdeling te
      laten verblijven dan wel aan gezamenlijke activiteiten te laten deelnemen;

      b. [artikel 13][ref3], met als doel de vaststelling van andersoortige mate van beveiliging voor zover
      dit noodzakelijk is voor de bereiking van het doel, genoemd in onderdeel a, dan wel voor zover bijzondere
      technologische ontwikkelingen daartoe aanleiding geven;

      c. [artikel 44, tweede lid][ref4], met als doel het voorkomen van ordeverstorend gedrag dan wel het structureel
      bevorderen van de orde of veiligheid binnen de inrichting;

      d. [artikel 47][ref5], met als doel de tenuitvoerlegging zo veel mogelijk dienstbaar te maken aan de voorbereiding
      van de terugkeer van de betrokkene in de maatschappij;

      e. de [artikelen 59a][ref6] en [71c][ref7], met als doel het bevorderen van het gebruik van de
      bemiddelingsprocedure als wijze van geschillenbeslechting.


