  - number: '60'
    text: |-
      1 Een gedetineerde kan bij de beklagcommissie beklag doen over een hem betreffende door of namens de directeur
      genomen beslissing.

      2 Met een beslissing als bedoeld in het eerste lid wordt gelijkgesteld een verzuim of weigering om te beslissen.
      Het nemen van een beslissing wordt geacht te zijn verzuimd of geweigerd, indien niet binnen de wettelijke of, bij
      het ontbreken daarvan, binnen een redelijke termijn een beslissing is genomen.

      3 De directeur draagt zorg dat een gedetineerde die beklag wenst te doen daartoe zo spoedig mogelijk in de
      gelegenheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel60
  - number: '61'
    text: |-
      1 De gedetineerde doet beklag door de indiening van een klaagschrift bij de beklagcommissie bij de inrichting waar
      de beslissing waarover hij klaagt is genomen.

      2 De indiening van het klaagschrift kan door tussenkomst van de directeur van de inrichting waar de gedetineerde
      verblijft geschieden. De directeur draagt in dat geval zorg dat het klaagschrift of, indien het klaagschrift zich
      in een envelop bevindt, de envelop van een dagtekening wordt voorzien, welke geldt als dag van indiening.

      3 Het klaagschrift vermeldt zo nauwkeurig mogelijk de beslissing waarover wordt geklaagd en de redenen van het
      beklag. Indien de gedetineerde omtrent de beslissing waarover hij klaagt geen verzoek tot bemiddeling heeft gedaan,
      vermeldt hij de redenen hiervoor in het klaagschrift.

      4 Indien de gedetineerde de Nederlandse taal niet voldoende beheerst kan hij het klaagschrift in een andere taal
      indienen. De voorzitter van de beklagcommissie kan bepalen dat het klaagschrift in de Nederlandse taal wordt
      vertaald. De vergoeding van de voor de vertaling gemaakte kosten geschiedt volgens regelen te stellen bij algemene
      maatregel van bestuur.

      5 Het klaagschrift wordt uiterlijk op de zevende dag na die waarop de gedetineerde kennis heeft gekregen van de
      beslissing waarover hij zich wenst te beklagen ingediend. Een na afloop van deze termijn ingediend klaagschrift is
      niettemin ontvankelijk, indien redelijkerwijs niet kan worden geoordeeld dat de gedetineerde in verzuim is geweest.

      6 Indien een gedetineerde een verzoek tot bemiddeling als bedoeld in [artikel 59a][ref1] heeft gedaan, wordt, in
      afwijking van het vijfde lid, het klaagschrift ingediend uiterlijk op de zevende dag na die waarop de gedetineerde
      de schriftelijke mededeling van de bevindingen van de commissie van toezicht heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel59a
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 59a
        hoofdstuk: Xa
  - number: '62'
    text: |-
      1 Het klaagschrift wordt behandeld door een door de commissie van toezicht benoemde beklagcommissie, bestaande uit
      drie leden, die wordt bijgestaan door een secretaris. Een lid van de commissie van toezicht neemt geen deel aan
      de behandeling van het klaagschrift, indien hij heeft bemiddeld ter zake van de beslissing waarop het klaagschrift
      betrekking heeft of daarmee op enige andere wijze bemoeienis heeft gehad.

      2 De voorzitter dan wel een door hem aangewezen lid van de beklagcommissie kan, indien hij het beklag van
      eenvoudige aard, dan wel kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht, het
      klaagschrift enkelvoudig afdoen, met dien verstande dat hij tevens de bevoegdheden bezit die aan de voorzitter van
      de voltallige beklagcommissie toekomen.

      3 De voorzitter, dan wel het door hem aangewezen lid, bedoeld in het tweede lid, kan de behandeling te allen tijde
      verwijzen naar de voltallige beklagcommissie.

      4 De behandeling van het klaagschrift vindt niet in het openbaar plaats, behoudens ingeval de beklagcommissie van
      oordeel is dat de niet openbare behandeling niet verenigbaar is met enige een ieder verbindende bepaling van een in
      Nederland geldend verdrag.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel62
  - number: '63'
    text: |-
      1 De secretaris van de beklagcommissie zendt de directeur een afschrift van het klaagschrift toe.

      2 De directeur geeft dienaangaande zo spoedig mogelijk schriftelijk de nodige inlichtingen aan de beklagcommissie,
      tenzij hij van oordeel is dat het klaagschrift kennelijk niet-ontvankelijk of kennelijk ongegrond is of tenzij
      het vierde lid toepassing vindt. Hij voegt daaraan de opmerkingen toe, waartoe het klaagschrift hem overigens
      aanleiding geeft.

      3 Aan de klager geeft de secretaris van de beklagcommissie schriftelijk kennis van de inhoud van deze inlichtingen
      en opmerkingen.

      4 De voorzitter van de beklagcommissie kan de behandeling van het klaagschrift voor onbepaalde tijd uitstellen,
      indien hij van oordeel is dat het klaagschrift zich leent voor bemiddeling of indien de bemiddelingsprocedure
      nog niet is afgesloten. In het eerste geval stelt de voorzitter een afschrift van het klaagschrift ter hand
      aan de maandcommissaris of een ander lid van de commissie van toezicht met het verzoek om te bemiddelen.
      [Artikel 59a][ref1] is van overeenkomstige toepassing.

      5 Indien de commissie van toezicht omtrent de beslissing waarover wordt geklaagd heeft bemiddeld en zij haar
      bevindingen schriftelijk aan de gedetineerde en de directeur heeft medegedeeld, voegt de secretaris van de
      beklagcommissie de bevindingen bij de processtukken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel59a
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: 59a
        hoofdstuk: Xa
  - number: '64'
    text: |-
      1 De beklagcommissie stelt de klager en de directeur in de gelegenheid omtrent het klaagschrift mondeling
      opmerkingen te maken, tenzij zij het beklag aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk
      gegrond acht.

      2 De klager en de directeur kunnen de voorzitter van de beklagcommissie de vragen opgeven die zij aan elkaar
      gesteld wensen te zien.

      3 De beklagcommissie kan de directeur en de klager buiten elkaars aanwezigheid horen. In dat geval worden zij in de
      gelegenheid gesteld vooraf de vragen op te geven die zij gesteld wensen te zien en wordt de zakelijke inhoud van de
      aldus afgelegde verklaring door de voorzitter van de beklagcommissie aan de klager onderscheidenlijk de directeur
      mondeling medegedeeld.

      4 De beklagcommissie kan ook bij andere personen mondeling of schriftelijk inlichtingen inwinnen. Indien mondeling
      inlichtingen worden ingewonnen, zijn het tweede en derde lid, tweede volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel64
  - number: '65'
    text: |-
      1 De klager heeft het recht zich te doen bijstaan door een rechtsbijstandverlener of een andere vertrouwenspersoon,
      die daartoe van de beklagcommissie toestemming heeft gekregen. Indien aan de klager een advocaat is toegevoegd,
      geschieden diens beloning en de vergoeding van de door hem gemaakte kosten volgens regelen te stellen bij algemene
      maatregel van bestuur.

      2 Indien de klager de Nederlandse taal niet voldoende beheerst, draagt de voorzitter zorg voor de bijstand van een
      tolk. De beloning van de tolk en de vergoeding van de door de tolk gemaakte kosten geschieden volgens regelen te
      stellen bij algemene maatregel van bestuur.

      3 Tijdens de beklagprocedure staat de beklagcommissie aan de klager op diens verzoek toe van de gedingstukken
      kennis te nemen.

      4 Indien de klager elders verblijft kunnen de opmerkingen, bedoeld in [artikel 64, eerste lid][ref1], op verzoek
      van de beklagcommissie ten overstaan van een lid van een andere beklagcommissie worden gemaakt.

      5 Van het horen van de betrokkenen maakt de secretaris een schriftelijk verslag, dat door de voorzitter en de
      secretaris wordt ondertekend. Bij verhindering van een van hen wordt de reden daarvan in het verslag vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel64
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel65
