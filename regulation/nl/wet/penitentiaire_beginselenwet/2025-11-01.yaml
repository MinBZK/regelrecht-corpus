  - number: '5'
    text: |-
      1 De directeur stelt, in aanvulling op de bij of krachtens deze wet gegeven regels en met inachtneming van het
      dienaangaande door Onze Minister vast te stellen model en door deze te geven aanwijzingen, huisregels voor de
      inrichting of afdeling vast.

      2 De directeur kan ambtenaren en medewerkers machtigen tot de uitoefening van hem bij of krachtens deze wet gegeven
      bevoegdheden en de naleving van zijn zorgplichten, met uitzondering van de bevoegdheden, genoemd in het eerste en
      vierde lid.

      3 De directeur is, voor zover zulks noodzakelijk is in het belang van de handhaving van de orde of de veiligheid in
      de inrichting of een ongestoorde tenuitvoerlegging van de vrijheidsbeneming, bevoegd aan de gedetineerden bevelen
      te geven. De gedetineerden zijn verplicht deze bevelen op te volgen.

      4 Aan de directeur is voorbehouden de beslissing omtrent:

      a. de onderbrenging van een kind in de inrichting, bedoeld in [artikel 12, tweede en vijfde lid][ref1];

      b. de uitsluiting van deelname aan activiteiten en de verlenging daarvan, bedoeld in
      [artikel 23, eerste lid, onder a en b][ref2], onderscheidenlijk [artikel 23, tweede lid][ref3];

      c. de plaatsing in afzondering en de verlenging hiervan, bedoeld in [artikel 24, eerste lid][ref4], op de gronden
      van [artikel 23, eerste lid, onder a en b][ref5], onderscheidenlijk [artikel 24, derde lid][ref6], en de toepassing
      van [artikel 25][ref7];

      d. de beperking en de intrekking van verlof, bedoeld in [artikel 26, derde lid][ref8];

      e. het onderzoek in het lichaam, bedoeld in [artikel 31][ref9];

      f. het gedogen van een geneeskundige handeling, bedoeld in [artikel 32][ref10];

      g. het verrichten van geneeskundige behandeling als bedoeld in [artikel 46d, onder a of b][ref11];

      h. de bevestiging door mechanische middelen en de verlenging daarvan, bedoeld in
      [artikel 33, eerste onderscheidenlijk derde lid][ref12];

      i. de oplegging van een disciplinaire straf, bedoeld in [artikel 51][ref13], en de toepassing van de
      [artikelen 52, eerste en tweede lid][ref14], en [53, derde en vierde lid][ref15].


