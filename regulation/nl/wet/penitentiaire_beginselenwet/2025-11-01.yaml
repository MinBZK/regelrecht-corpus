  - number: '35'
    text: |-
      1 De directeur is bevoegd jegens een gedetineerde geweld te gebruiken dan wel vrijheidsbeperkende middelen aan te
      wenden, voor zover dit noodzakelijk is met het oog op een van de volgende belangen:

      a. de handhaving van de orde of de veiligheid in de inrichting;

      b. de uitvoering van een door de directeur genomen beslissing;

      c. de voorkoming van het zich onttrekken door de gedetineerde aan het op hem uitgeoefende toezicht;

      d. de uitvoering van een ingevolge het [Wetboek van Strafvordering][ref1] of de
      [Wet DNA-onderzoek bij veroordeelden][ref2] door de officier van justitie of de rechter-commissaris genomen
      beslissing.

      2 Onze Minister is bevoegd jegens een gedetineerde geweld te gebruiken of vrijheidsbeperkende middelen aan te
      wenden met het oog op een van de volgende belangen:

      a. de uitvoering van een door hem genomen beslissing;

      b. de voorkoming van het zich onttrekken van de gedetineerde aan het op hem uitgeoefende toezicht.

      3 Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf. Degene die geweld heeft gebruikt maakt
      hiervan onverwijld een schriftelijk verslag en doet dit verslag onverwijld aan de directeur dan wel Onze Minister
      toekomen.

      4 Onze Minister stelt nadere regels omtrent het gebruik van geweld en de aanwending van vrijheidsbeperkende
      middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
