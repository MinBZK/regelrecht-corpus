  - number: '70'
    text: |-
      1 Het indienen van een beroepschrift schorst de tenuitvoerlegging van de uitspraak van de beklagcommissie niet,
      behalve voor zover deze de toekenning van een tegemoetkoming als bedoeld in [artikel 68, zevende lid][ref1],
      inhoudt.

      2 Hangende de uitspraak op het beroepschrift kan de voorzitter van de beroepscommissie op verzoek van degene die
      het beroep heeft ingesteld en gehoord de andere betrokkene in de procedure de tenuitvoerlegging van de uitspraak
      van de beklagcommissie geheel of gedeeltelijk schorsen. Hij doet hiervan onverwijld mededeling aan de directeur en
      de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel68
