  - number: '18'
    text: |-
      1 De betrokkene heeft het recht bij Onze Minister een met redenen omkleed verzoekschrift in te dienen strekkende
      tot:

      a. plaatsing in dan wel overplaatsing naar een bepaalde inrichting of afdeling;

      b. deelname aan een penitentiair programma.

      2 Met een verzoekschrift wordt gelijkgesteld een akkoordverklaring van de gedetineerde met het selectieadvies van
      de directeur van de inrichting.

      3 De [artikelen 61, tweede en vierde lid][ref1], en [17, derde en vierde lid][ref2], zijn van overeenkomstige
      toepassing.

      4 Indien het verzoekschrift, bedoeld in het eerste lid, is afgewezen, kan zes maanden na deze afwijzing opnieuw een
      dergelijk verzoekschrift worden ingediend.

      5 In afwijking van het vierde lid geldt een termijn van twaalf maanden voor verzoekschriften van een betrokkene
      die is geplaatst in een afdeling intensief toezicht of een extra beveiligde inrichting als bedoeld in
      [artikel 13, eerste lid, onderdeel d][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel13
