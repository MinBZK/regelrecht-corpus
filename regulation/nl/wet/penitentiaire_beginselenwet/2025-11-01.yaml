  - number: 46e
    text: |-
      1 Geneeskundige behandeling overeenkomstig [artikel 46d, onder a][ref1], vindt plaats na een schriftelijke
      beslissing van de directeur waarin wordt vermeld voor welke termijn zij geldt.

      2 Ten behoeve van deze beslissing dient te worden overgelegd een verklaring van de behandelend psychiater alsmede
      een verklaring van een psychiater die de gedetineerde met het oog daarop kort tevoren heeft onderzocht maar
      niet bij diens behandeling betrokken was. Uit deze verklaringen dient te blijken dat de gedetineerde op wie de
      verklaring betrekking heeft, een psychische stoornis, psychogeriatrische aandoening of verstandelijke handicap
      heeft en dat een geval als bedoeld in [artikel 46d, onder a][ref2], zich voordoet. De verklaringen moeten met
      redenen zijn omkleed en ondertekend.

      3 De beslissing als bedoeld in het eerste lid wordt gemeld aan de voorzitter van de Commissie van Toezicht. De
      voorzitter van de Commissie van Toezicht doet onverwijld een melding aan de maandcommissaris.

      4 De termijn als bedoeld in het eerste lid is zo kort mogelijk, maar niet langer dan drie maanden, gerekend vanaf
      de dag waarop de beslissing tot stand komt. De directeur doet onverwijld een afschrift van de beslissing toekomen
      aan de gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref3].

      5 Indien na afloop van de termijn als bedoeld in het eerste lid, voortzetting van de geneeskundige behandeling
      overeenkomstig [artikel 46d, onder a][ref4], nodig is, geschiedt dit slechts krachtens een schriftelijke beslissing
      van de directeur. Het bepaalde in de voorgaande volzin is eveneens van toepassing indien binnen zes maanden na
      afloop van de termijn als bedoeld in het vierde lid opnieuw behandeling overeenkomstig artikel 46d, onder a, nodig
      is. De gedetineerde of de persoon als bedoeld in [artikel 46b, vierde lid][ref5], ontvangt onverwijld een afschrift
      van deze beslissing. De directeur geeft in zijn beslissing aan waarom van een behandeling alsnog het beoogde effect
      wordt verwacht. Op zodanige beslissingen is het vierde lid, eerste volzin van toepassing.

      6 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste, tweede,
      vierde en vijfde lid alsmede omtrent de toepassing van [artikel 46d onder b][ref6].

      7 Deze in het zesde lid bedoelde regels betreffen in ieder geval de melding en de registratie van de behandeling
      alsmede de taak van de behandelend arts. Tevens kunnen categorieën van behandelingsmiddelen of -maatregelen worden
      aangewezen die niet mogen worden toegepast bij een geneeskundige behandeling als bedoeld in [artikel 46d][ref7].
      Bij algemene maatregel van bestuur kunnen voorts ten aanzien van daarbij aangegeven categorieën van
      behandelingsmiddelen of -maatregelen regels worden gegeven met betrekking tot de wijze waarop tot toepassing
      daarvan moet worden besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel46d
