  - number: '47'
    text: |-
      1 De gedetineerde kan in de gelegenheid worden gesteld deel te nemen aan de in de inrichting beschikbare arbeid.

      2 De directeur draagt zorg voor de beschikbaarheid van arbeid voor de gedetineerden, voor zover de aard of de duur
      van de detentie zich daar niet tegen verzet.

      3 De arbeidstijd wordt in de huisregels vastgesteld binnen de grenzen van hetgeen buiten de inrichting gebruikelijk
      is.

      4 Onze Minister stelt regels omtrent de toepassing van het tweede lid en omtrent de samenstelling en de hoogte van
      het arbeidsloon. De directeur is belast met de vaststelling en uitbetaling van het arbeidsloon.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel47
  - number: '48'
    text: |-
      1 De gedetineerde heeft recht op het kennis nemen van het nieuws, voor eigen rekening, en het wekelijks gebruik
      maken van een bibliotheekvoorziening. De gedetineerde heeft het recht op het volgen van onderwijs en het deelnemen
      aan andere educatieve activiteiten voor zover deze zich verdragen met de aard en de duur van de detentie en de
      persoon van de gedetineerde.

      2 De gedetineerde heeft recht op lichamelijke oefening en het beoefenen van sport gedurende ten minste tweemaal
      drie kwartier per week, voor zover zijn gezondheid zich daar niet tegen verzet.

      3 De directeur draagt zorg dat daarvoor in aanmerking komende functionarissen in de in het eerste lid, tweede
      volzin, en tweede lid bedoelde activiteiten kunnen voorzien.

      4 Onze Minister stelt regels omtrent de voorwaarden waaronder een tegemoetkoming kan worden verleend in de kosten
      die voor de gedetineerde aan het volgen van onderwijs en het deelnemen aan andere educatieve activiteiten voor
      zover hierin niet in de inrichting wordt voorzien, kunnen zijn verbonden. Deze voorwaarden kunnen betreffen de
      aard, de duur en de kosten van deze activiteiten alsmede de vooropleiding van de gedetineerde en diens vorderingen.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel48
  - number: '49'
    text: |-
      1 De gedetineerde heeft recht op recreatie en dagelijks verblijf in de buitenlucht, voor zover zijn gezondheid zich
      daar niet tegen verzet.

      2 De directeur draagt zorg dat de gedetineerde in de gelegenheid wordt gesteld tot deelname aan recreatieve
      activiteiten, gedurende ten minste zes uren per week.

      3 De directeur draagt zorg dat de gedetineerde in de gelegenheid wordt gesteld dagelijks ten minste een uur in de
      buitenlucht te verblijven.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel49
  - number: '50'
    text: |-
      1 Indien een ambtenaar of medewerker constateert dat een gedetineerde betrokken is bij feiten die onverenigbaar
      zijn met de orde of de veiligheid in de inrichting dan wel met de ongestoorde tenuitvoerlegging van de
      vrijheidsbeneming en hij voornemens is daarover aan de directeur schriftelijk verslag te doen, deelt hij dit de
      gedetineerde mede.

      2 De directeur beslist over het opleggen van een disciplinaire straf zo spoedig mogelijk nadat hem dit verslag
      is gedaan.

      3 Indien de directeur of zijn plaatsvervanger feiten als bedoeld in het eerste lid constateert, blijft het eerste
      lid buiten toepassing.

      4 Een straf kan worden opgelegd dan wel ten uitvoer gelegd in een andere inrichting of afdeling dan waarin het
      verslag, bedoeld in het eerste lid, is opgemaakt.
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel50
  - number: '51'
    text: |-
      1 De directeur kan wegens het begaan van feiten als bedoeld in [artikel 50, eerste lid][ref1], de navolgende
      disciplinaire straffen opleggen:

      a. opsluiting in een strafcel dan wel een andere verblijfsruimte voor ten hoogste twee weken;

      b. ontzegging van bezoek voor ten hoogste vier weken, indien het feit plaatsvond in verband met bezoek van die
      persoon of personen;

      c. uitsluiting van deelname aan een of meer bepaalde activiteiten voor ten hoogste twee weken;

      d. weigering, intrekking of beperking van het eerstvolgende verlof;

      e. geldboete tot een bedrag van ten hoogste tweemaal het in de inrichting of afdeling geldende weekloon.

      2 De directeur bepaalt bij de oplegging van een geldboete tevens door welke andere straf deze zal worden vervangen,
      ingeval de boete niet binnen de daartoe door hem gestelde termijn is betaald.

      3 De directeur kan voor feiten als bedoeld in [artikel 50, eerste lid][ref2], meer dan één straf opleggen, met dien
      verstande dat de in het eerste lid onder a en c genoemde straffen slechts kunnen worden opgelegd voor zover zij
      tezamen niet langer duren dan twee weken;

      4 De oplegging van een straf laat onverlet de mogelijkheid voor de directeur om terzake van de door de gedetineerde
      toegebrachte schade met hem een regeling te treffen.

      5 Geen straf kan worden opgelegd, indien de gedetineerde voor het begaan van een feit als bedoeld in
      [artikel 50, eerste lid][ref3], niet verantwoordelijk kan worden gesteld.

      6 Indien een straf is opgelegd wordt deze onverwijld ten uitvoer gelegd. De directeur kan bepalen dat een straf
      niet of slechts ten dele ten uitvoer wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0009709#Artikel50
