  - number: '8'
    text: |-
      1 Onze Minister bepaalt de bestemming van elke inrichting of afdeling ingevolge de
      [artikelen 9 tot en met 14][ref1] en stelt regels voor de plaatsing en overplaatsing van de gedetineerden.

      2 Onze Minister kan delen van een inrichting als afdeling met een aparte bestemming aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel9
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel8
