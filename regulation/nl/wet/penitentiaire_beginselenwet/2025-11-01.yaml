  - number: '55'
    text: |-
      1 De gedetineerde aan wie de disciplinaire straf van opsluiting, bedoeld in [artikel 51, eerste lid, onder a][ref1],
      is opgelegd is uitgesloten van het deelnemen aan activiteiten, voor zover de directeur niet anders bepaalt en
      behoudens het dagelijks verblijf in de buitenlucht, bedoeld in [artikel 49, derde lid][ref2]. De directeur kan het
      contact met de buitenwereld gedurende het verblijf in de strafcel beperken of uitsluiten.

      2 De directeur draagt zorg dat, ingeval de opsluiting in een strafcel ten uitvoer wordt gelegd en langer dan
      vierentwintig uren duurt, de commissie van toezicht en de aan de inrichting verbonden arts of diens vervanger
      terstond hiervan in kennis worden gesteld.

      3 Onze Minister stelt nadere regels omtrent het verblijf in en de inrichting van de strafcel. Deze betreffen in elk
      geval de rechten die tijdens het verblijf in de strafcel aan de gedetineerde toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel49
