  - number: '17'
    text: |-
      1 De betrokkene heeft het recht een met redenen omkleed bezwaarschrift in te dienen tegen de beslissing:

      a. tot plaatsing of overplaatsing als bedoeld in [artikel 15, eerste lid][ref1];

      b. tot beëindiging van zijn deelname aan een penitentiair programma;

      c. tot het weigeren van de aanwijzing van een rechtsbijstandverlener als bedoeld in
      [artikel 40a, vijfde en zesde lid][ref2];

      d. tot het geven van het bevel, bedoeld in [artikel 40d][ref3];

      e. tot het verlengen of wijzigen van het bevel, bedoeld in [artikel 40e][ref4].

      2 Op de wijze van indiening is [artikel 61, tweede, vierde en vijfde lid][ref5], van overeenkomstige toepassing.
      Op de behandeling van een bezwaarschrift op de beslissingen bedoeld in het eerste lid, onderdelen c en d, is
      [artikel 73, vijfde tot en met negende lid][ref6], van overeenkomstige toepassing.

      3 Onze Minister stelt de betrokkene in de gelegenheid schriftelijk of mondeling diens bezwaarschrift toe te
      lichten, tenzij hij het aanstonds kennelijk niet-ontvankelijk, kennelijk ongegrond of kennelijk gegrond acht.

      4 Onze Minister stelt de indiener van het bezwaarschrift binnen zes weken van zijn met redenen omklede beslissing
      schriftelijk en zoveel mogelijk in een voor deze begrijpelijke taal op de hoogte. Hierbij wijst hij hem op de
      mogelijkheid van het instellen van beroep, bedoeld in [hoofdstuk XIII][ref7], alsmede de termijnen waarbinnen en de
      wijze waarop dit gedaan moet worden.

      5 Het indienen van een bezwaarschrift blijft achterwege, indien de betrokkene in de gelegenheid is gesteld zijn
      bezwaren tegen een door Onze Minister voorgenomen en hem betreffende beslissing als bedoeld in het eerste lid
      kenbaar te maken.


