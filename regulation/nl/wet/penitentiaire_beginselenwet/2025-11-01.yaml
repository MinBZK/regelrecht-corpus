  - number: 40c
    text: |-
      1 De gedetineerde die verblijft in een afdeling voor intensief toezicht wordt in de gelegenheid gesteld om:

      a. één uur per week bezoek te ontvangen;

      b. driemaal per week tien minuten één telefoongesprek te voeren.

      2 De gedetineerde ontvangt per bezoekmoment slechts twee meerderjarige bezoekers, maar niet gelijktijdig, dan wel
      één minderjarige bezoeker vergezeld door één meerderjarige bezoeker.

      3 Op het bezoek en het telefoongesprek wordt toezicht uitgeoefend als bedoeld in [artikel 38, vierde lid][ref1],
      respectievelijk [artikel 39, tweede lid][ref2].

      4 [Artikel 40b, vierde tot en met zevende lid][ref3], is van overeenkomstige toepassing.


