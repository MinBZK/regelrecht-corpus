  - number: 71b
    text: |-
      Een gedetineerde kan een beroepschrift indienen tegen het medisch handelen van de aan de inrichting verbonden arts
      of diens vervanger, bedoeld in [artikel 42][ref1]. Met de inrichtingsarts wordt in dit hoofdstuk gelijkgesteld
      de verpleegkundige dan wel andere hulpverleners die door de inrichtingsarts bij de zorg aan gedetineerden zijn
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel42
    url: https://wetten.overheid.nl/BWBR0009709/2025-11-01#Artikel71b
