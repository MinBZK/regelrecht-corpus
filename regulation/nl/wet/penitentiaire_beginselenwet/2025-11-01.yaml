        artikel: '5'
        hoofdstuk: II
  - number: '4'
    text: |-
      1 Een penitentiair programma is een samenstel van activiteiten waaraan wordt deelgenomen door personen ter verdere
      tenuitvoerlegging van de aan hen opgelegde vrijheidsstraf of voorlopige hechtenis in aansluiting op hun verblijf in
      een inrichting en dat als zodanig door Onze Minister is erkend.

      2 Gedetineerden kunnen in de gelegenheid worden gesteld tot deelname aan een penitentiair programma direct
      voorafgaand aan de datum van invrijheidstelling, mits:

      a. de gedetineerde een of meer onvoorwaardelijke vrijheidsstraffen ondergaat waarvan de duur onderscheidenlijk de
      gezamenlijke duur ten minste zes maanden en ten hoogste een jaar bedraagt;

      b. bij aanvang van de deelname aan het penitentiair programma nog ten minste vier weken van de vrijheidsstraf of
      vrijheidsstraffen moeten worden ondergaan; en

      c. er geen andere omstandigheden zijn die zich tegen zijn deelname verzetten.

      De deelname aan het penitentiair programma duurt niet langer dan een zesde deel van de vrijheidsstraf of
      vrijheidsstraffen die de gedetineerde nog moet ondergaan. Indien de veroordeling tot een vrijheidsstraf nog niet
      onherroepelijk is, wordt de datum van invrijheidstelling voor de toepassing van dit lid berekend op grond van de
      veroordeling waartegen het rechtsmiddel is aangewend.

      3 Bij de beslissing om een gedetineerde in de gelegenheid te stellen deel te nemen aan een penitentiair programma
      worden in ieder geval de volgende aspecten betrokken:

      a. de mate waarin en de wijze waarop is gebleken van goed gedrag;

      b. de mogelijkheden om eventuele aan de grotere vrijheden verbonden risico’s te beperken en beheersen, en

      c. de belangen van slachtoffers, nabestaanden en andere relevante personen, waaronder de door de veroordeelde
      geleverde inspanningen om de door het strafbare feit veroorzaakte schade te vergoeden.

      4 Aan deelname aan het penitentiaire programma kunnen voorwaarden betreffende het gedrag van de
      gedetineerde worden gesteld. De deelnemer aan een penitentiair programma kan onder elektronisch toezicht
      worden gesteld. Bij het uitoefenen van toezicht op de deelname aan een penitentiair programma wordt
      de identiteit van de deelnemer aan het penitentiair programma vastgesteld op de wijze, bedoeld in
      [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref1].

      5 Indien een gedetineerde niet langer aan de voorwaarden voor deelname aan het penitentiaire programma voldoet of
      zich niet aan de voorwaarden betreffende het gedrag houdt, kan het penitentiaire programma worden beëindigd.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld die in elk geval betreffen:

      a. de inhoud van het penitentiair programma,

      b. de nadere voorwaarden voor deelname aan het penitentiair programma en de voorwaarden betreffende het gedrag,
      bedoeld in het derde lid,

      c. het toezicht, waaronder het elektronisch toezicht, tijdens de deelname,

      d. de gevolgen van verzuim van deelname aan het programma of niet-nakoming van de daaraan verbonden voorwaarden, en

      e. de rechtspositie van de deelnemers aan een penitentiair programma.

      7 Met inachtneming van het tweede lid en de regels krachtens het zesde lid kan Onze Minister een penitentiair
      programma erkennen en bepalen welke gedetineerden voor deelname hieraan in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
