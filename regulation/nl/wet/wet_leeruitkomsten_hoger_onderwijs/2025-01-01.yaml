publication_date: '2024-10-14'
valid_from: '2025-01-01'
bwb_id: BWBR0050294
url: https://wetten.overheid.nl/BWBR0050294/2025-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het experiment leeruitkomsten heeft aangetoond dat het inrichten
    van opleidingen en het afstemmen van de leerroutes op de uitgangspositie, werksituatie, kenmerken en behoeften
    van individuele studenten of groepen studenten een positief effect kan hebben op in ieder geval de deelname van
    studenten aan opleidingen in het hoger onderwijs;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050294/2025-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet en vervolgens binnen vijf jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0050294/2025-01-01#ArtikelII
  - number: III
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050294/2025-01-01#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet leeruitkomsten hoger onderwijs.'
    url: https://wetten.overheid.nl/BWBR0050294/2025-01-01#ArtikelIV
