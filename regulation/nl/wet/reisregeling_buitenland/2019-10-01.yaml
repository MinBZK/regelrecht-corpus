      1 In deze regeling wordt verstaan onder:

      a. *besluit:* [Reisbesluit buitenland][ref1];

      b. *scholingsreis:* de reis, bedoeld in [artikel 59, negende lid, van het Algemeen Rijksambtenarenreglement][ref2].

      2 De begripsomschrijvingen in [artikel 2 van het besluit][ref3] zijn voor de toepassing van deze regeling van
      overeenkomstig toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006842
