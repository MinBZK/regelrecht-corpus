  - number: '4'
    text: |-
      1 Indien de betrokkene een dienstreis maakt van langer dan zestig dagen vanwege het tijdelijk verrichten van
      werkzaamheden in of vanuit één bepaalde plaats buiten het Europees deel van Nederland bestaat de vergoeding
      voor verblijfkosten die verband houden met de tijdelijke vestiging in of in de omgeving van die plaats in ieder
      geval met ingang van de eenenzestigste dag, of zoveel eerder als daartoe naar het oordeel van het bevoegd gezag
      aanleiding is, uit:

      a. de helft van de in [artikel 3, tweede lid, onder a, c, d en e][ref1] bedoelde vergoedingen voor gemaakte kosten
      voor respectievelijk kleine uitgaven, ontbijt, lunch en diner;

      b. een vergoeding van de werkelijk gemaakte huisvestingskosten tot ten hoogste het in
      [artikel 3, tweede lid, onder b][ref2] bedoelde logiescomponent.

      2 Een bezoekreis als bedoeld in [artikel 9 van het besluit][ref3] onderbreekt de dienstreis niet.


      [ref1]: https://wetten.overheid.nl/BWBR0006914#Artikel3
