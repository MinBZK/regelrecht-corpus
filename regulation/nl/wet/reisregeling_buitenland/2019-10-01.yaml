  - number: 1d
    text: |-
      Schadevergoedingen van een reismaatschappij waarop als gevolg van vertragingen tijdens de dienstreis aanspraak
      kan worden gemaakt, komen ten goede aan het Rijk. De betrokkene verleent het bevoegd gezag de medewerking die
      redelijkerwijs van hem mag worden verwacht bij het te gelde maken van die aanspraken.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel1d
  - number: 1e
    text: |-
      Voordelen, verkregen uit loyaliteitsprogramma’s, die rechtstreeks voortvloeien uit het maken van dienstreizen komen
      ten goede aan het Rijk, tenzij de betrokkene met inachtneming van door het bevoegd gezag gegeven aanwijzingen deze
      inzet ten behoeve van volgende dienstreizen.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel1e
  - number: '2'
    text: |-
      1 De vergoeding voor het gebruik van een eigen motorvoertuig als bedoeld in
      [artikel 7, onderdeel a, van het besluit][ref1] bedraagt € 0,37 per afgelegde kilometer.

      2 De vergoeding voor het gebruik van een eigen motorvoertuig als bedoeld in
      [artikel 7, onderdeel b, van het besluit][ref2] bedraagt € 0,09 per afgelegde kilometer. Deze vergoeding wordt
      verhoogd met € 0,09 per afgelegde kilometer voor iedere in het kader van de dienstreis meereizende betrokkene, tot
      een maximum van € 0,37 per afgelegde kilometer.


