      1 Voor de berekening van de vergoeding voor verblijfkosten als bedoeld in
      [artikel 10, tweede lid, van het besluit][ref1] wordt uitgegaan van de in de [bijlage I][ref2] bij deze regeling
      opgenomen tarieflijst voor de verschillende gebieden waarin wordt gereisd, met dien verstande dat:

      a. voor een binnen het Europees deel van Nederland verlopend gedeelte van een dienstreis van vier uur of langer
      dat aansluit op een reis of reisgedeelte per vliegtuig of boot, [artikel 5 van de Reisregeling binnenland][ref3]
      overeenkomstig wordt toegepast;

      b. indien bij reizen, anders dan bij reizen per vliegtuig of boot, tijdens één of meer reisgedeelten geen uitgaven
      voor logies behoeven te worden gemaakt, deze gedeelten kunnen worden gevoegd bij een volgend of voorafgaand
      reisgedeelte in welk geval het daarvoor alsdan geldende tarief kan worden toegepast.

      2 De vergoeding voor verblijfkosten bestaat uit:

      a. een vergoeding voor kleine uitgaven (urencomponent) ter grootte van 1,5 procent van het bedrag voor overige
      kosten opgenomen in de in het eerste lid bedoelde tarieflijst, voor ieder uur dat de dienstreis duurt;

      b. een vergoeding van de werkelijk gemaakte logieskosten (logiescomponent) tot maximaal per overnachting het
      daarvoor opgenomen bedrag in de in het eerste lid bedoelde tarieflijst, met dien verstande dat indien niet een
      bewijsstuk kan worden overgelegd waaruit blijkt dat logieskosten zijn gemaakt in een daarvoor bestemde gelegenheid
      een bedrag wordt vergoed van € 11,34 per overnachting tot een maximum van vier overnachtingen per dienstreis;

      c. een ontbijtvergoeding ter grootte van 12 procent van het bedrag voor overige kosten, opgenomen in de in het
      eerste lid bedoelde tarieflijst voor iedere periode van 6.00 uur tot 8.00 uur die binnen de dienstreis valt;

      d. een lunchvergoeding (lunchcomponent) ter grootte van 20 procent van het bedrag voor overige kosten, opgenomen in
      de in het eerste lid bedoelde tarieflijst, voor iedere periode van 12.00 uur tot 14.00 uur die binnen de dienstreis
      valt;

      e. een dinervergoeding (dinercomponent) ter grootte van 32 procent van het bedrag voor overige kosten, opgenomen
      in de in het eerste lid, bedoelde tarieflijst voor iedere periode van 18.00 tot 21.00 uur die binnen de dienstreis
      valt.

      3 De aanspraak op de in het tweede lid onder c, d en e bedoelde vergoedingen bestaat slechts voor zover voor het
      verkrijgen van een ontbijt, lunch respectievelijk diner kosten zijn gemaakt in een daarvoor bestemde gelegenheid.

      4 Indien een bewijsstuk van kosten voor logies en ontbijt wordt overgelegd waaruit niet blijkt welk deel van de
      kosten voor logies en welk deel van de kosten voor ontbijt zijn gemaakt, worden de op het bewijsstuk vermelde
      kosten vergoed, voor zover deze niet meer bedragen dan de som van de vergoedingen genoemd in het tweede lid, onder
      b en c.

      5 Dit artikel geldt niet ten aanzien van verblijfkosten waarvoor onder toepassing van [artikel 4][ref4] in
      vergoeding wordt voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006842#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006914
      [ref3]: https://wetten.overheid.nl/BWBR0005912#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006914#Artikel4
