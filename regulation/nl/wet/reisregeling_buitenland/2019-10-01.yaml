  - number: 4a
    text: |-
      1 De vervoersbewijzen en boekingen voor overnachtingen voor dienstreizen worden door de betrokkene zo vroeg
      mogelijk aangevraagd dan wel met voorafgaande schriftelijke toestemming van het bevoegd gezag door hem zelf
      aangeschaft respectievelijk gedaan, maar uiterlijk 21 kalenderdagen voor vertrek. Indien dit niet mogelijk is,
      verklaart de betrokkene schriftelijk en gemotiveerd aan het bevoegd gezag welke redenen daaraan ten grondslag
      liggen.

      2 Vervoersbewijzen worden voor reizen op een tevoren vastgelegde reisdatum verstrekt of vergoed. Indien bijzondere
      omstandigheden daartoe aanleiding geven, kan het bevoegd gezag uit eigen beweging of indien betrokkene daar
      tijdig schriftelijk en gemotiveerd om verzoekt, toestaan dat een vervoersbewijs zonder vastgelegde reisdatum wordt
      verstrekt of vergoed.

      3 Het bevoegd gezag kan aan de betrokkene een aanwijzing geven met betrekking tot de keuze voor de faciliteit of
      faciliteiten waarvan voor overnachtingen gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel4a
  - number: '5'
    text: |-
      De tegemoetkoming als bedoeld in [artikel 12 van het besluit][ref1] bedraagt de helft van de naar het oordeel van
      het bevoegd gezag noodzakelijk gemaakte kosten van aanschaf van kleding en uitrusting. Per kalenderjaar kan de
      tegemoetkoming voor aangeschafte kleding en uitrusting maximaal € 453,78 bedragen, waarvan € 226,89 voor gebieden
      met tropische warmte en € 226,89 voor gebieden met polaire koude.

      Een aantal van deze gebieden wordt in de bij deze regeling gevoegde [bijlage II][ref2] genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006842#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006914
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel5
