  - number: 6a
    text: |-
      1 Het verlengen van dienstreizen voor privédoeleinden is toegestaan, op voorwaarde dat:

      a. de betrokkene dit voor vertrek schriftelijk aanvraagt en het bevoegd gezag daaraan voor vertrek goedkeuring
      verleent;

      b. de verlenging ten hoogste 72 uur bedraagt;

      c. de verlenging aan het begin dan wel aan het einde van de dienstreis plaatsvindt, en

      d. de meerkosten voor de reis en het verblijf voor rekening van betrokkene komen en besparingen ten goede komen aan
      het Rijk.

      2 Het verlengen van dienstreizen voor privédoeleinden aan het begin van de dienstreis is niet toegestaan wanneer
      de betrokkene met toestemming van het bevoegd gezag eerder dan noodzakelijk vertrekt gelet op de aanvang van de te
      verrichten werkzaamheden om te recupereren van de reis of om te acclimatiseren aan de lokale omstandigheden.

      3 Het verlengen van dienstreizen voor privédoeleinden is niet toegestaan wanneer het een dienstreis betreft waarvan
      Onze Minister voor een door hem aan te wijzen groep van functionarissen heeft vastgesteld dat deze daarvoor niet in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel6a
