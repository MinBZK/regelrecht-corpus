    text: |-
      [Artikel 1b, tweede tot en met vijfde lid][ref1], en [artikel 4a, eerste lid][ref2], zijn niet van toepassing op
      vervoersbewijzen die voor 1 januari 2017 door het bevoegd gezag aan betrokkene zijn verstrekt of door hem zijn
      geboekt.


