  - number: 1a
    text: |-
      1 Een dienstreis waarvan de afstand niet meer dan 500 kilometer bedraagt, gemeten van station van vertrek naar
      station van aankomst, wordt per trein afgelegd.

      2 Het bevoegd gezag verstrekt aan betrokkene een vervoersbewijs. Met voorafgaande schriftelijke toestemming van
      het bevoegd gezag mag betrokkene zelf een vervoersbewijs aanschaffen en worden de werkelijk gemaakte kosten, ten
      hoogste tot het bedrag voor een vervoersbewijs in de klasse, waartoe betrokkene gerechtigd is te reizen, aan hem
      vergoed.

      3 De betrokkene is gerechtigd om voor rijksrekening in de eerste klasse te reizen indien voor de dienstreis een
      vervoersbewijs in die klasse beschikbaar is.

      In afwijking van het tweede lid is de betrokkene bij scholingsreizen gerechtigd om voor rijksrekening in de tweede
      klasse te reizen.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel1a
  - number: 1b
    text: |-
      1 Een dienstreis waarvan, gemeten van station van vertrek naar station van aankomst, de afstand meer dan 500
      kilometer bedraagt of de reistijd per trein meer dan zes uur bedraagt wordt per vliegtuig afgelegd. Een dienstreis
      met een kleinere afstand of kortere reistijd waarbij het reizen per trein zo ondoelmatig is dat het bevoegd gezag
      dit onredelijk bezwarend acht, wordt per vliegtuig afgelegd indien dat wel doelmatig is.

      2 Het bevoegd gezag verstrekt aan betrokkene een vervoersbewijs. Met voorafgaande schriftelijke toestemming van
      het bevoegd gezag mag betrokkene zelf een vervoersbewijs aanschaffen en worden de werkelijk gemaakte kosten, ten
      hoogste tot het bedrag voor een vervoersbewijs in de klasse, waartoe betrokkene gerechtigd is te reizen, aan hem
      vergoed.

      3 Indien de totale vliegtijd van een vlucht minder dan 6 uur bedraagt of indien het een scholingsreis betreft, is
      de betrokkene gerechtigd om voor rijksrekening in de economy klasse of een vergelijkbare klasse te reizen.

      4 Indien de totale vliegtijd van een vlucht 6 uur of meer bedraagt, is de betrokkene gerechtigd om voor
      rijksrekening in de business klasse of een vergelijkbare klasse te reizen indien voor de dienstreis een
      vervoersbewijs in die klasse beschikbaar is.

      5 Indien de dienstreis meer dan één vlucht omvat, en de totale vliegtijd van de langste vlucht 6 uur of meer
      bedraagt, is betrokkene gerechtigd om alle vluchten van de dienstreis voor rijksrekening in de business klasse of
      vergelijkbare klasse te reizen, voor zover vervoersbewijzen in die klasse beschikbaar zijn.

      6 Aan de betrokkene wordt, onverminderd het derde en vierde lid, een vervoersbewijs verstrekt of vergoed voor een
      rechtstreekse vlucht indien dat voor de dienstreis beschikbaar is. Indien de vliegtijd van een rechtstreekse vlucht
      meer dan zes uur bedraagt, kan het bevoegd gezag, onverminderd het derde tot en met vijfde lid, hiervan afwijken
      indien de kosten van de niet-rechtstreekse vlucht minimaal € 350,– lager zijn dan die van de rechtstreekse vlucht
      en de reistijd ten opzichte van de rechtstreekse vlucht met ten hoogste vier uur toeneemt.

      7 Het bevoegd gezag kan de betrokkene die in de economy klasse of een vergelijkbare klasse vliegt uit eigen
      beweging of indien de betrokkene daar gemotiveerd om verzoekt, toestaan kosten te declareren voor het gebruik van
      een business lounge op een vliegveld indien bijzondere redenen daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006914/2019-10-01#Artikel1b
  - number: 1c
    text: |-
      1 In afwijking van [artikel 1b, derde lid][ref1], wordt aan de betrokkene uitsluitend een vervoersbewijs in de
      economy klasse of een vergelijkbare klasse verstrekt of vergoed indien de dienstreis tot doel heeft:

      a. het begeleiden van een justitiabele van of naar een plaats buiten het Europees deel van Nederland en de
      betrokkene op grond van [artikel 1, onderdeel k, van de Regeling vervoer justitiabelen][ref2] belast is met de
      begeleiding van het transport van de justitiabele, of

      b. het begeleiden van een vreemdeling naar een plaats buiten Nederland en de betrokkene op grond van de
      [Vreemdelingenwet 2000][ref3] belast is met de begeleiding van de vreemdeling, of het uit hoofde van de functie
      vergezellen van een vreemdeling.

      2 Ten aanzien van de betrokkene die een minister, staatssecretaris of leden van de Staten-Generaal vergezelt op
      een dienstreis die deze uit hoofde van zijn ambt maakt, kan het bevoegd gezag afwijken van de [artikelen 1a][ref4]
      en [1b][ref5].


