  - number: 10.13.2.a
    text: |-
      voor zover opzettelijk begaan, een misdrijf en wordt gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.2.b
    text: |-
      voor zover geen misdrijf, een overtreding en wordt gestraft met hechtenis van ten hoogste zes maanden of geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.3
    text: |-
      Handelen in strijd met [artikel 5.39, eerste lid][ref1], is een overtreding en wordt gestraft met hechtenis van ten
      hoogste twee maanden of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 10.13.4
    text: |-
      Handelen in strijd met de voorschriften of overtreding van de verboden gegeven in de
      [artikelen 5.39, tweede lid][ref1], en [5.40][ref2], is een overtreding en wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 10.13.5
    text: |-
      Overtreding van het verbod gegeven in [artikel 3.5, eerste lid][ref1], is een overtreding en wordt gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.13.6
    text: |-
      Overtreding van het verbod gegeven in [artikel 3.5, tweede lid][ref1], is een overtreding en wordt gestraft met
      hechtenis van ten hoogste vier maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 10.13.7
    text: 'Als bijkomende straf kan worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.7.a
    text: |-
      gehele of gedeeltelijke stillegging van de inrichting van de veroordeelde, waarin het delict is begaan, voor een
      tijd van ten hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.7.b
    text: |-
      verbeurdverklaring van de voorwerpen, genoemd in [artikel 35 van het Wetboek van Strafrecht BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '35'
  - number: 10.13.7.c
    text: |-
      verbeurdverklaring van voorwerpen, behorende tot de onderneming van een veroordeelde, waarin het delict is
      begaan, voor zover zij soortgelijk zijn aan en met betrekking tot het delict verband houden met die, genoemd in
      [artikel 35 van het Wetboek van Strafrecht BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028570#Artikel35
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0028570
        artikel: '35'
  - number: 10.13.7.d
    text: |-
      gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de veroordeelde in verband met zijn inrichting van overheidswege zijn of
      zouden kunnen worden toegekend, voor een tijd van ten hoogste twee jaren, en
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.7.e
    text: openbaarmaking van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.8
    text: 'Tezamen met straffen kunnen de volgende maatregelen worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.8.a
    text: |-
      onderbewindstelling van de onderneming van de veroordeelde, waarin het delict is begaan, in geval van misdrijf voor
      een tijd van ten hoogste drie jaren en in geval van overtreding voor een tijd van ten hoogste twee jaren, en
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: 10.13.8.b
    text: |-
      het opleggen van de verplichting tot verrichting van hetgeen wederrechtelijk is nagelaten, tenietdoening van
      hetgeen wederrechtelijk is verricht en verrichting van prestaties tot het goedmaken van een en ander, alles op
      kosten van de veroordeelde, voor zover de rechter niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.13
  - number: '11.1'
    text: |-
      Deze paragraaf is van toepassing op het geven van beschikkingen bij of krachtens deze wet en op het aanvragen van
      dergelijke beschikkingen, tenzij in deze wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.1
  - number: 11.2.1
    text: |-
      De aanvraag van een beschikking wordt schriftelijk ingediend bij het bestuursorgaan dat bevoegd is op de aanvraag
      te beslissen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.2
  - number: 11.2.2
    text: |-
      Het bestuursorgaan zendt de aanvraag waarvan kennelijk een ander bestuursorgaan bevoegd is, onverwijld door naar
      dat orgaan, onder gelijktijdige mededeling daarvan aan de afzender.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.2
  - number: 11.2.3
    text: |-
      Het bestuursorgaan zendt geschriften die niet voor hem bestemd zijn en die ook niet worden doorgezonden, zo spoedig
      mogelijk terug aan de afzender.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.2
  - number: 11.3.1
    text: 'De aanvraag wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.3
  - number: 11.3.1.a
    text: de naam en het adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.3
  - number: 11.3.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.3
  - number: 11.3.1.c
    text: een aanduiding van de beschikking die wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.3
  - number: 11.3.2
    text: |-
      De aanvrager verschaft voorts de gegevens en bescheiden die voor de beslissing op de aanvraag nodig zijn en
      waarover hij redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.3
  - number: 11.4.1
    text: 'Het bestuursorgaan kan besluiten de aanvraag niet te behandelen, indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.4.1.a
    text: de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag, of
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.4.1.b
    text: |-
      de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of voor de voorbereiding
      van de beschikking, mits de aanvrager de gelegenheid heeft gehad de aanvraag binnen een door het bestuursorgaan
      gestelde termijn aan te vullen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.4.2
    text: |-
      Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden in een vreemde taal is gesteld en een
      vertaling daarvan voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk
      is, kan het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad
      binnen een door het bestuursorgaan gestelde termijn de aanvraag met een vertaling aan te vullen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.4.3
    text: |-
      Indien de aanvraag of een van de daarbij behorende gegevens of bescheiden omvangrijk of ingewikkeld is en een
      samenvatting voor de beoordeling van de aanvraag of voor de voorbereiding van de beschikking noodzakelijk is, kan
      het bestuursorgaan besluiten de aanvraag niet te behandelen, mits de aanvrager de gelegenheid heeft gehad binnen
      een door het bestuursorgaan gestelde termijn de aanvraag met een samenvatting aan te vullen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.4.4
    text: |-
      Een besluit om de aanvraag niet te behandelen wordt aan de aanvrager bekendgemaakt binnen vier weken nadat de
      aanvraag is aangevuld of nadat de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.4
  - number: 11.5.1
    text: |-
      Indien na een geheel of gedeeltelijk afwijzende beschikking een nieuwe aanvraag wordt gedaan, is de aanvrager
      gehouden nieuw gebleken feiten of veranderde omstandigheden te vermelden.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.5
  - number: 11.5.2
    text: |-
      Wanneer geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, kan het bestuursorgaan, zonder
      toepassing te geven aan [artikel 11.4][ref1], de aanvraag afwijzen onder verwijzing naar zijn eerdere afwijzende
      beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel11
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.6.1
    text: |-
      Voordat een bestuursorgaan een aanvraag tot het geven van een beschikking geheel of gedeeltelijk afwijst, stelt het
      de aanvrager in de gelegenheid zijn zienswijze naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.6
  - number: 11.6.1.a
    text: de afwijzing zou steunen op gegevens over feiten en belangen die de aanvrager betreffen, en
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.6
  - number: 11.6.1.b
    text: die gegevens afwijken van gegevens die de aanvrager ter zake zelf heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.6
  - number: 11.6.2
    text: |-
      Het eerste lid geldt niet indien sprake is van een afwijking van de aanvraag die slechts van geringe betekenis voor
      de aanvrager kan zijn.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.6
  - number: 11.7.1
    text: |-
      Voordat een bestuursorgaan een beschikking geeft waartegen een belanghebbende die de beschikking niet heeft
      aangevraagd naar verwachting bedenkingen zal hebben, stelt het die belanghebbende in de gelegenheid zijn zienswijze
      naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.7
  - number: 11.7.1.a
    text: de beschikking zou steunen op gegevens over feiten en belangen die de belanghebbende betreffen, en
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.7
  - number: 11.7.1.b
    text: die gegevens niet door de belanghebbende zelf ter zake zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.7
  - number: 11.7.2
    text: |-
      Het eerste lid geldt niet indien de belanghebbende niet heeft voldaan aan een wettelijke verplichting gegevens
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.7
  - number: '11.8'
    text: |-
      Bij toepassing van de [artikelen 11.6][ref1] en [11.7][ref2] kan de belanghebbende naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel11
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: '11.9'
    text: |-
      Het bestuursorgaan kan toepassing van de [artikelen 11.6][ref1] en [11.7][ref2] achterwege laten voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel11
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.9
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.9.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.9
  - number: 11.9.b
    text: |-
      de belanghebbende reeds eerder in de gelegenheid is gesteld zijn zienswijze naar voren te brengen en zich sindsdien
      geen nieuwe feiten of omstandigheden hebben voorgedaan, of
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.9
  - number: 11.9.c
    text: |-
      het met de beschikking beoogde doel slechts kan worden bereikt indien de belanghebbende daarvan niet reeds tevoren
      in kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.9
  - number: 11.10.1
    text: |-
      Een beschikking wordt gegeven binnen de bij wettelijk voorschrift bepaalde termijn of, bij het ontbreken van zulk
      een termijn, binnen een redelijke termijn na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.10
  - number: 11.10.2
    text: |-
      De in het eerste lid bedoelde redelijke termijn is in ieder geval verstreken wanneer het bestuursorgaan binnen
      zestien weken na ontvangst van de aanvraag geen beschikking heeft gegeven, noch een kennisgeving als bedoeld in
      [artikel 11.11, derde lid][ref1], heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel11
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.1'
  - number: 11.11.1
    text: |-
      Indien een beschikking niet binnen de bij wettelijk voorschrift bepaalde termijn kan worden gegeven, deelt
      het bestuursorgaan dit aan de aanvrager mede en noemt het daarbij een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.11
  - number: 11.11.2
    text: |-
      Het eerste lid is niet van toepassing indien het bestuursorgaan na het verstrijken van de bij wettelijk voorschrift
      bepaalde termijn niet langer bevoegd is.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.11
  - number: 11.11.3
    text: |-
      Indien, bij het ontbreken van een bij wettelijk voorschrift bepaalde termijn, een beschikking niet binnen zestien
      weken kan worden gegeven, stelt het bestuursorgaan de aanvrager daarvan in kennis en noemt daarbij een redelijke
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.11
  - number: 11.12.1
    text: |-
      De termijn voor het geven van een beschikking wordt opgeschort met ingang van de dag na die waarop het
      bestuursorgaan:
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.1.a
    text: |-
      de aanvrager krachtens [artikel 11.4, eerste lid, onderdeel b][ref1], uitnodigt de aanvraag aan te vullen, tot de
      dag waarop de aanvraag is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken, of


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel11
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: '11.3'
  - number: 11.12.1.b
    text: |-
      de aanvrager mededeelt dat voor de beschikking op de aanvraag redelijkerwijs noodzakelijke informatie aan een
      buitenlandse instantie is gevraagd, tot de dag waarop deze informatie is ontvangen of verder uitstel niet meer
      redelijk is.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.2
    text: 'De termijn voor het geven van een beschikking wordt voorts opgeschort:'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.2.a
    text: gedurende de termijn waarvoor de aanvrager schriftelijk met het uitstel heeft ingestemd;
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.2.b
    text: zolang de vertraging aan de aanvrager kan worden toegerekend, of
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.2.c
    text: zolang het bestuursorgaan door overmacht niet in staat is een beschikking te geven.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.3
    text: |-
      In geval van overmacht deelt het bestuursorgaan zo spoedig mogelijk aan de aanvrager mede dat de beslistermijn is
      opgeschort, alsmede binnen welke termijn de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: 11.12.4
    text: |-
      Indien de opschorting eindigt, doet het bestuursorgaan daarvan in de gevallen, bedoeld in het eerste lid, onderdeel
      b, of het tweede lid, onderdelen b en c, zo spoedig mogelijk mededeling aan de aanvrager, onder vermelding van de
      termijn binnen welke de beschikking alsnog moet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.12
  - number: '11.13'
    text: |-
      Eenieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.13
  - number: 11.18.1
    text: |-
      [Hoofdstuk 4][ref1] is niet van toepassing op gedragingen, voor zover daaromtrent voorschriften gelden, die zijn
      gesteld bij of krachtens:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '4'
  - number: 11.18.1.a
    text: |-
      de [Wet voorschriften bestrijdingsmiddelen BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028176
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0028176
  - number: 11.18.1.b
    text: |-
      de [Wet voorkoming verontreiniging door schepen BES][ref1] en de
      [Wet voorkoming verontreiniging door schepen][ref2], behoudens voor zover uit de bepalingen van die wetten of van
      deze wet anders blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028453
      [ref2]: https://wetten.overheid.nl/BWBR0003642
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0028453
      - id: ref2
        bwb_id: BWBR0003642
  - number: 11.18.2
    text: |-
      [Hoofdstuk 6][ref1] is niet van toepassing op de bodem en de oevers van een oppervlaktewaterlichaam en, voor zover
      het oppervlaktewaterlichaam behoort tot de zee, de ondergrond van de zeebodem.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '6'
  - number: 11.18.3
    text: |-
      [Hoofdstuk 9][ref1] is niet van toepassing op het vervoeren, het ten vervoer aanbieden en het ten vervoer
      aannemen, het laden en het lossen en het neerleggen tijdens het vervoer van stoffen, preparaten of micro-
      organismen, alsmede op het laten staan en het laten liggen van een vervoermiddel waarin of waarop zich zodanige
      stoffen, preparaten of micro-organismen of resten daarvan bevinden, voor zover daaromtrent regels zijn gesteld
      bij of krachtens de [Wet luchtvaart][ref2] of de [Luchtvaartwet BES][ref3], dan wel op de handelingen, genoemd
      in [artikel 2, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref4] ten aanzien van stoffen, preparaten
      of micro-organismen, voor zover daaromtrent regels zijn gesteld bij of krachtens die wet. In afwijking van
      de eerste volzin is hoofdstuk 9 van toepassing met betrekking tot de verpakking van micro-organismen, zijnde
      genetisch gemodificeerde organismen, indien die organismen zich bij de handelingen, bedoeld in de eerste
      volzin, niet bevinden in een verpakking die voldoet aan de regels die ter zake zijn gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref5], de Wet luchtvaart of de Luchtvaartwet BES.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005555
      [ref3]: https://wetten.overheid.nl/BWBR0028549
      [ref4]: https://wetten.overheid.nl/BWBR0007606#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007606
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005555
      - id: ref3
        bwb_id: BWBR0028549
      - id: ref4
        bwb_id: BWBR0007606
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0007606
  - number: 11.18.4
    text: |-
      [Hoofdstuk 9][ref1] is niet van toepassing op gedragingen, voor zover daaromtrent regels
      zijn gesteld bij of krachtens de [Wet op de geneesmiddelenvoorziening BES][ref2] of de
      [Wet voorschriften bestrijdingsmiddelen BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0028486
      [ref3]: https://wetten.overheid.nl/BWBR0028176
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0028486
      - id: ref3
        bwb_id: BWBR0028176
  - number: 11.18.5
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 5.1, eerste lid][ref1], wordt gedaan door
      Onze Minister en, voor zover het onderdelen van het milieubeleid betreft die tot zijn verantwoordelijkheid behoren,
      Onze Minister van Economische Zaken, Landbouw en Innovatie.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 11.18.6
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 9.4][ref1] wordt gedaan door Onze Minister
      van Volksgezondheid, Welzijn en Sport, mede namens Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel9
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '9'
        hoofdstuk: '9'
  - number: 11.19.1
    text: |-
      De [artikelen 5.13, tweede lid, onderdeel a][ref1], [5.14, derde lid, tweede volzin][ref2], en
      [5.31, tweede lid, onderdeel a][ref3], zijn tot een bij koninklijk besluit te bepalen tijdstip niet van toepassing
      op vergunningen voor inrichtingen die voor dat tijdstip in werking zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.19
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 11.19.2
    text: |-
      [Artikel 5.36][ref1] is van toepassing op stortplaatsen waar na het tijdstip van inwerkingtreding van deze wet
      afvalstoffen worden gestort.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.19
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '11.20'
    text: |-
      Uiterlijk twaalf maanden na het tijdstip van inwerkingtreding van deze wet, geeft de eilandsraad uitvoering aan de
      [artikelen 2.4][ref1], [2.5][ref2], [4.7][ref3] en [4.25, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.20
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '11.21'
    text: |-
      Onze Minister zendt binnen zes jaar na de inwerkingtreding van deze wet aan de beide Kamers der Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.21
  - number: 11.22.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een vergunning ten aanzien van een onderwerp waarin door deze wet is
      voorzien, die vóór het tijdstip van inwerkingtreding van deze wet is verstrekt, uiterlijk binnen een jaar na dat
      tijdstip met deze wet in overeenstemming is.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.22
  - number: 11.22.2
    text: |-
      Het bestuurscollege kan een bouwvergunning die vóór het tijdstip van inwerkingtreding van deze wet is
      verstrekt, geheel of gedeeltelijk intrekken indien niet binnen een half jaar na dat tijdstip is begonnen met de
      bouwwerkzaamheden of indien de bouwwerkzaamheden na aanvang meer dan een half jaar stilliggen.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.22
  - number: '11.23'
    text: |-
      Indien een algemene maatregel van bestuur krachtens deze wet later in werking treedt dan deze wet blijven in
      afwijking van de [artikelen 215][ref1] en [216 van de Wet openbare lichamen Bonaire, Sint-Eustatius en Saba][ref2]
      de in de openbare lichamen onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze wet geldende
      eilandsverordeningen ten aanzien van onderwerpen waarin door die algemene maatregel van bestuur wordt voorzien, van
      toepassing totdat die algemene maatregel van bestuur in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel215
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel216
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.23
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '215'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '216'
  - number: '11.24'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.24
  - number: '11.25'
    text: 'Deze wet wordt aangehaald als: Wet volkshuisvesting, ruimtelijke ordening en milieubeheer BES.'
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel11.25
