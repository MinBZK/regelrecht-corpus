  - number: '10.3'
    text: |-
      De [titels 5.1 tot en met 5.3 van de Algemene wet bestuursrecht][ref1] zijn van toepassing op bestuursorganen die
      tot taak hebben zorg te dragen voor het toezicht op en de bestuursrechtelijke handhaving van het bepaalde bij of
      krachtens deze wet, met dien verstande dat in [artikel 5.16a van eerstgenoemde wet][ref2] voor «identiteitsbewijs
      als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref3]» wordt gelezen: identiteitsdocument als
      bedoeld in [artikel 2 van de Wet identificatieplicht BES][ref4].


