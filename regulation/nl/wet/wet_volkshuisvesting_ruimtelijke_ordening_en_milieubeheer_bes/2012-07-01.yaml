  - number: 10.7.1
    text: |-
      Het ten aanzien van een vergunning of ontheffing bevoegde gezag kan de vergunning of ontheffing geheel of
      gedeeltelijk intrekken, indien niet overeenkomstig die vergunning of ontheffing is of wordt gehandeld, dan wel
      indien aan de vergunning of ontheffing verbonden voorschriften of voor de houder van de vergunning of ontheffing
      als zodanig geldende algemene regels niet worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.7
  - number: 10.7.2
    text: |-
      Een vergunning of ontheffing, die betrekking heeft op het beheer van gevaarlijke afvalstoffen, dan wel van andere
      afvalstoffen die van elders afkomstig zijn, kan, voor zover zij het beheer van afvalstoffen betreft, tevens worden
      ingetrokken, indien op grond van [hoofdstuk 4][ref1] voor de houder geldende voorschriften niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '4'
  - number: 10.7.3
    text: |-
      Het bevoegd gezag gaat niet tot intrekking als bedoeld in het eerste en tweede lid over dan nadat het de betrokkene
      de gelegenheid heeft geboden om binnen een daartoe te bepalen termijn zijn handelen alsnog in overeenstemming te
      brengen met de vergunning of ontheffing, onderscheidenlijk de voorschriften of de algemene regels, bedoeld in het
      eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.7
  - number: 10.8.1
    text: |-
      Een overheidslichaam kan, behoudens matiging door de rechter, de te zijnen laste komende kosten van het beheer van
      afvalstoffen ten aanzien waarvan in strijd is gehandeld met het bij of krachtens deze wet bepaalde, verhalen op
      degene door wiens onrechtmatige daad die kosten zijn veroorzaakt, of op degene die anderszins krachtens burgerlijk
      recht buiten overeenkomst aansprakelijk is voor de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.8
  - number: 10.8.2
    text: |-
      Een overheidslichaam kan in een geval als bedoeld in het eerste lid, overeenkomstig de regels betreffende
      ongerechtvaardigde verrijking, de daar bedoelde kosten verhalen op degene die door het beheer van de betrokken
      afvalstoffen ongerechtvaardigd wordt verrijkt.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.8
  - number: 10.8.3
    text: |-
      Voor de toepassing van dit artikel is niet vereist dat op het tijdstip waarop de in het eerste lid bedoelde
      handeling met de in dat lid bedoelde afvalstoffen zich heeft voorgedaan, reeds jegens de overheid onrechtmatig
      werd gehandeld.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.8
  - number: 10.9.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van een doelmatige handhaving regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.9
  - number: 10.9.2
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen in ieder geval regels
      worden gesteld met betrekking tot een strategische, programmatische en onderling afgestemde uitoefening van de
      handhavingsbevoegdheden door de bestuursorganen die belast zijn met de bestuursrechtelijke handhaving van het
      bepaalde bij of krachtens de betrokken wetten en van het toezicht op de naleving door de onder hun gezag werkzame
      toezichthouders.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.9
  - number: 10.9.3
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen regels worden gesteld met
      betrekking tot de afstemming van de werkzaamheden van de bestuursorganen en toezichthouders, bedoeld in het tweede
      lid, op die van andere organen en ambtenaren, die belast zijn met de handhaving van het bepaalde bij of krachtens
      de betrokken wetten.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.9
  - number: 10.9.4
    text: |-
      Bij ministeriële regeling van Onze Minister kunnen, in overeenstemming met Onze Minister wie het mede aangaat,
      nadere regels worden gesteld met betrekking tot het bepaalde bij de maatregel.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.9
  - number: 10.10.1
    text: |-
      Onze Minister is belast met de coördinatie van de uitvoering van het bepaalde krachtens [artikel 10.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 10.10.2
    text: |-
      Er wordt regelmatig overleg gevoerd tussen de bestuursorganen die belast zijn met de handhaving en het toezicht
      over de afstemming van de werkzaamheden. In dat overleg worden in ieder geval afspraken gemaakt over de wijze
      waarop uitvoering wordt gegeven aan het bepaalde krachtens [artikel 10.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 10.11.1
    text: |-
      Onze Minister kan, indien dat in het belang van een doelmatige handhaving geboden is, in overeenstemming met
      Onze betrokken Minister, aan het bestuurscollege een aanwijzing geven ter zake van de uitvoering van het bepaalde
      krachtens [artikel 10.9][ref1]. 2.Bij het geven van een aanwijzing houdt Onze Minister rekening met het geldende
      milieubeleidsplan, bedoeld in [artikel 1.4][ref2], en stelt hij een termijn binnen welke gevolg moet zijn gegeven
      aan de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.11.3
    text: Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met het betrokken bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.11
  - number: 10.11.4
    text: |-
      Onze Minister doet van het besluit, houdende de aanwijzing, mededeling door overlegging van het besluit aan de
      Staten-Generaal en door plaatsing ervan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.11
  - number: 10.11.5
    text: |-
      Het bestuurscollege doet schriftelijk mededeling aan Onze betrokken Minister van de wijze waarop hij gevolg heeft
      gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.11
  - number: 10.11.6
    text: |-
      Indien het bestuurscollege geen gevolg geeft aan een aanwijzing, kan Onze Minister gevolg geven aan de aanwijzing
      voor rekening van het betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.11
  - number: '10.12'
    text: |-
      Een gedraging in strijd met een voorschrift dat is verbonden aan een krachtens deze wet verleende vergunning of
      ontheffing, is verboden.
    url: https://wetten.overheid.nl/BWBR0031218/2012-07-01#Artikel10.12
