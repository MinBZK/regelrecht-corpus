      [ref6]: https://wetten.overheid.nl/BWBR0031218#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.2
    references:
