  - number: 10.2.2
    text: 'Het bestuurscollege heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.2
  - number: 10.2.2.a
    text: |-
      de voorschriften, gesteld bij of krachtens [hoofdstuk 2][ref1], [3][ref2] en [6][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031218
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0031218
        hoofdstuk: '6'
  - number: 10.2.2.b
    text: |-
      de verplichtingen, gesteld krachtens de afvalstoffenverordening, bedoeld in [artikel 4.7][ref1] en de
