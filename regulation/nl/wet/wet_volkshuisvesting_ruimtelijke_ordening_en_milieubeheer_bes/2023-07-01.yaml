        artikel: '5'
  - number: 10.2.1
    text: Onze Minister heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.2
  - number: 10.2.1.a
    text: |-
      de verplichtingen, gesteld bij of krachtens de [artikelen 1.3][ref1], [1.4][ref2], [9.1][ref3], [9.2][ref4],
      [9.3][ref5] en [9.4][ref6] en [paragraaf 4.3][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel9
