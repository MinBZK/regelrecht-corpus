  - number: 1.2.2
    text: 'In deze wet en de daarop berustende bepalingen worden:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.2.a
    text: |-
      onder gevolgen voor het milieu in ieder geval verstaan: gevolgen voor het fysieke milieu, gezien vanuit het belang
      van de bescherming van mensen, dieren, planten en goederen, van water, bodem en lucht en van landschappelijke,
      natuurwetenschappelijke en cultuurhistorische waarden en van de beheersing van het klimaat, alsmede van de relaties
      daartussen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.2.b
    text: |-
      onder gevolgen voor het milieu mede verstaan: gevolgen die verband houden met een doelmatig beheer van afvalstoffen
      of een doelmatig beheer van afvalwater, gevolgen die verband houden met het verbruik van energie en grondstoffen,
      alsmede gevolgen die verband houden met het verkeer van personen of goederen van en naar de inrichting;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.2.c
    text: |-
      onder bescherming van het milieu mede verstaan: de verbetering van het milieu, de zorg voor een doelmatig
      beheer van afvalstoffen of een doelmatig beheer van afvalwater, de zorg voor een zuinig gebruik van energie en
      grondstoffen, alsmede de zorg voor de beperking van de nadelige gevolgen voor het milieu van het verkeer van
      personen of goederen van en naar de inrichting.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.3
    text: |-
      Bij algemene maatregel van bestuur worden categorieën van inrichtingen aangewezen, die nadelige gevolgen voor het
      milieu kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.4
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder inrichting verstaan een inrichting, behorende tot een
      categorie die krachtens het derde lid is aangewezen. Daarbij worden als één inrichting beschouwd de tot eenzelfde
      onderneming of instelling behorende installaties die onderling technische, organisatorische of functionele
      bindingen hebben en in elkaars onmiddellijke nabijheid zijn gelegen. Onze Minister kan nadere regels stellen met
      betrekking tot hetgeen in deze wet en de daarop berustende bepalingen onder inrichting wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.5
    text: 'In deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.5.a
    text: |-
      onder het zich ontdoen van afvalstoffen mede verstaan: het nuttig toepassen of verwijderen van afvalstoffen binnen
      de inrichting waarin deze zijn ontstaan;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.5.b
    text: 'onder het zich door afgifte ontdoen van afvalstoffen mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.5.b.1°
    text: |-
      het voor nuttige toepassing of verwijdering brengen van afvalstoffen vanuit een inrichting naar een elders gelegen
      inrichting die aan dezelfde natuurlijke of rechtspersoon behoort;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.5.b.2°
    text: het tijdelijk voor nuttige toepassing afgeven van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
  - number: 1.2.6
    text: |-
      In [hoofdstuk 7][ref1] en de daarop berustende bepalingen wordt onder bevoegd gezag mede verstaan het
      bestuursorgaan dat bevoegd is een plan vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '7'
  - number: 1.4.1
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie en Onze
      Minister van Onderwijs, Cultuur en Wetenschap eenmaal in de vijf jaar een milieubeleidsplan voor de openbare
      lichamen vast dat de hoofdlijnen bevat van het gedurende de planperiode in de openbare lichamen te voeren
      milieubeleid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.2
    text: 'Tot de hoofdlijnen van het beleid behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.2.a
    text: de uitgangspunten;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.2.b
    text: de doelen en de beoogde resultaten, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.2.c
    text: de prioriteiten van het te voeren milieubeleid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.3
    text: |-
      Het milieubeleidsplan omvat in ieder geval de hoofdlijnen van het beleid ter uitvoering van deze wet met betrekking
      tot:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.3.a
    text: het voorkomen of beperken van het ontstaan van afvalstoffen en het beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.3.b
    text: afvalwater;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4
    text: |-
      Bij de vaststelling van het beleid met betrekking tot afvalstoffen als bedoeld in het derde lid, onderdeel a, houdt
      Onze Minister:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a
    text: 'er rekening mee dat het belang van de bescherming van het milieu vereist dat in de navolgende voorkeursvolgorde:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.1°
    text: het ontstaan van afvalstoffen wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.2°
    text: |-
      bij het vervaardigen van stoffen, preparaten of producten gebruik wordt gemaakt van stoffen en materialen die na
      gebruik van het product geen of zo min mogelijk nadelige gevolgen voor het milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.3°
    text: stoffen, preparaten of producten na gebruik als zodanig opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.4°
    text: stoffen en materialen waaruit een product bestaat, na gebruik van het product opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.5°
    text: afvalstoffen worden toegepast met een hoofdgebruik als brandstof of voor een andere wijze van energieopwekking;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.6°
    text: afvalstoffen worden verwijderd door deze te verbranden op land;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.a.7°
    text: afvalstoffen worden gestort.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.4.b
    text: |-
      er rekening mee dat het belang van een doelmatig beheer van afvalstoffen vereist dat het beheer van afvalstoffen
      op effectieve en efficiënte wijze geschiedt en effectief toezicht dan wel douanecontrole op het beheer van
      afvalstoffen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.5
    text: |-
      Onze Minister betrekt bij de voorbereiding van het milieubeleidsplan in ieder geval de bestuurscolleges van de
      openbare lichamen en de naar zijn oordeel bij de te behandelen onderwerpen meest belanghebbende instellingen en
      organisaties.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.6
    text: |-
      In het milieubeleidsplan wordt rekening gehouden met het natuurbeleidsplan en
      de natuurplannen, bedoeld in onderscheidenlijk [artikel 2, eerste lid][ref1], en
      [9, eerste lid, van de Wet grondslagen natuurbeheer en –bescherming BES][ref2] alsmede met de
      ontwikkelingsplannen, bedoeld in [artikel 7 van de Wet grondslagen ruimtelijke ontwikkelingsplanning BES][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028434#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028434#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0028218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0028434
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0028434
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0028218
        artikel: '7'
  - number: 1.4.7
    text: |-
      Zodra het milieubeleidsplan is vastgesteld, doet Onze Minister hiervan mededeling door overlegging van het plan aan
      de beide kamers der Staten-Generaal en door toezending ervan aan de bestuurscolleges.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.8
    text: |-
      Onze Minister maakt de vaststelling bekend in de Staatscourant. Hij geeft hierbij aan op welke wijze kennis kan
      worden verkregen van de inhoud van het plan.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.9
    text: Het milieubeleidsplan geldt met ingang van een bij besluit van Onze Minister vast te stellen tijdstip.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.10
    text: Het milieubeleidsplan kan worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.4.11
    text: |-
      Ieder bestuursorgaan houdt rekening met het geldende milieubeleidsplan bij het uitoefenen van een bevoegdheid
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.4
  - number: 1.5.1
    text: |-
      De eilandsraad stelt jaarlijks een milieuprogramma vast. Het programma bevat ten minste de door de eilandsraad en
      het bestuurscollege in de eerstvolgende vijf jaar te verrichten activiteiten met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.1.a
    text: de bescherming van het milieu;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.1.b
    text: het voorkomen of beperken van het ontstaan van afvalstoffen en het beheer van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.1.c
    text: het beheer van afvalwater;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.1.d
    text: |-
      een overzicht van onderzoeksgevallen en gevallen van ernstige verontreiniging als bedoeld in [artikel 6.10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel6
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '6'
        hoofdstuk: '6'
  - number: 1.5.1.e
    text: bodembeschermende maatregelen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.1.f
    text: een overzicht van de financiële gevolgen van de in de onderdelen a tot en met e genoemde activiteiten.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.2
    text: |-
      Bij de vaststelling van het milieuprogramma neemt de eilandsraad het milieubeleidsplan, bedoeld in
      [artikel 1.4][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.5.3
    text: |-
      Bij de vaststelling van het milieuprogramma met betrekking tot afvalstoffen als bedoeld in het eerste lid,
      onderdeel b, houdt de eilandsraad:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a
    text: 'er rekening mee dat het belang van de bescherming van het milieu vereist dat in de navolgende voorkeursvolgorde:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.1°
    text: het ontstaan van afvalstoffen wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.2°
    text: |-
      bij het vervaardigen van stoffen, preparaten of producten gebruik wordt gemaakt van stoffen en materialen die na
      gebruik van het product geen of zo min mogelijk nadelige gevolgen voor het milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.3°
    text: stoffen, preparaten of producten na gebruik als zodanig opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.4°
    text: stoffen en materialen waaruit een product bestaat, na gebruik van het product opnieuw worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.5°
    text: afvalstoffen worden toegepast met een hoofdgebruik als brandstof of voor een andere wijze van energieopwekking;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.6°
    text: afvalstoffen worden verwijderd door deze te verbranden op land;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.a.7°
    text: afvalstoffen worden gestort.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.3.b
    text: |-
      er rekening mee dat het belang van een doelmatig beheer van afvalstoffen vereist dat het beheer van afvalstoffen
      op effectieve en efficiënte wijze geschiedt en effectief toezicht dan wel douanecontrole op het beheer van
      afvalstoffen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.4
    text: |-
      Het milieuprogramma wordt voorbereid door het bestuurscollege. Het bestuurscollege legt het ontwerp van het
      programma voor aan de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.5
    text: |-
      Zodra het milieuprogramma is vastgesteld door de eilandsraad zendt het bestuurscollege het milieuprogramma aan Onze
      Minister en aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 1.5.6
    text: |-
      Het bestuurscollege maakt de vaststelling bekend in één of meer plaatselijke dagbladen en voorts op de voor
      publicatie van officiële mededelingen gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.5
  - number: 2.1.1
    text: |-
      De eigenaar van een bouwwerk, open erf of terrein of degene die uit andere hoofde bevoegd is tot het daaraan
      treffen van voorzieningen draagt er zorg voor dat als gevolg van de staat van dat bouwwerk, dat open erf of terrein
      geen gevaar voor de gezondheid of veiligheid ontstaat, dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Een ieder die een bouwwerk bouwt, gebruikt, laat gebruiken of sloopt, dan wel een open erf of terrein gebruikt of
      laat gebruiken, draagt er, voor zover dat in diens vermogen ligt, zorg voor dat als gevolg van dat bouwen, gebruik
      of slopen geen gevaar voor de gezondheid of veiligheid ontstaat dan wel voortduurt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.1
  - number: 2.2.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.1.a
    text: te bouwen zonder of in afwijking van een door het bestuurscollege verleende bouwvergunning;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      een bouwwerk of een deel daarvan gebouwd zonder of in afwijking van een door het bestuurscollege verleende
      bouwvergunning, in stand te laten, tenzij voor dat bouwen op grond van het tweede lid geen bouwvergunning is of
      was vereist.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.2
    text: 'Geen bouwvergunning is vereist voor het bouwen:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.2.a
    text: dat tot het gewone onderhoud behoort, of
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      dat bij algemene maatregel van bestuur is aangemerkt als van beperkte betekenis, waarbij tevens voorschriften
      kunnen worden gegeven omtrent het gebruik van het bouwwerk.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.3
    text: 'Het tweede lid, onderdeel b, is niet van toepassing op het bouwen in, op, aan of bij:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
  - number: 2.2.3.a
    text: |-
      een beschermd monument of beschermd stads- en dorpsgezicht als bedoeld in de [Monumentenwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028429
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0028429
  - number: 2.2.3.b
    text: |-
      een monument waarop [artikel 5, vierde lid, eerste volzin, van de Monumentenwet BES][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0028429#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0028429
        artikel: '5'
  - number: 2.3.1
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen technische voorschriften worden gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.1.a
    text: het bouwen van een bouwwerk;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.1.b
    text: de staat van een bestaand bouwwerk;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.1.c
    text: het in gebruik nemen of gebruiken van een bouwwerk of een open erf of terrein.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen andere dan technische voorschriften worden gegeven omtrent
      het onderwerp, bedoeld in het eerste lid, onderdeel c. Tot die voorschriften kunnen in ieder geval behoren:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.2.a
    text: een verbod tot ingebruikneming of gebruik zonder het doen van een gebruiksmelding aan het bestuurscollege;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.2.b
    text: een verbod tot ingebruikneming of gebruik zonder vergunning verleend door het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      De voorschriften, bedoeld in het eerste lid, onderdelen a en b, kunnen uitsluitend worden gegeven vanuit het
      oogpunt van veiligheid, gezondheid, bruikbaarheid, energiezuinigheid of milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      De voorschriften, bedoeld in het eerste lid, onderdeel c, en het tweede lid, kunnen uitsluitend worden gegeven
      vanuit het oogpunt van brandveiligheid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.3
  - number: 2.4.1
    text: 'De eilandsraad stelt een bouwverordening vast die uitsluitend voorschriften bevat omtrent:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.a
    text: |-
      het gebruik van woningen, woonketen, andere gebouwen en bouwwerken die geen gebouw zijn. Deze voorschriften hebben
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.a.1°
    text: de beschikbaarheid van drinkwater en energie,
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.a.2°
    text: de reinheid, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.a.3°
    text: het bestrijden van schadelijk of hinderlijk gedierte;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.b
    text: het gebruik van open erven en terreinen en de staat, waarin deze zich moeten bevinden;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.c
    text: het tegengaan van bouwen op verontreinigde grond;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.d
    text: het slopen, waaronder begrepen voorschriften omtrent selectief slopen, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.1.e
    text: het uitvoeren van bouw- en sloopwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de inhoud van de
      voorschriften, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.4.3
    text: |-
      De eilandsraad brengt binnen een jaar na het in werking treden van de krachtens het tweede lid gegeven
      voorschriften de bouwverordening met die voorschriften in overeenstemming. Zolang de bouwverordening niet met die
      voorschriften in overeenstemming is gebracht, gelden die voorschriften rechtstreeks.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.4
  - number: 2.5.1
    text: Een bouwwerk is niet in strijd met redelijke eisen van welstand.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.5
  - number: 2.5.2
    text: |-
      De eilandsraad stelt een welstandsnota vast. Deze nota bevat de criteria op basis waarvan het bestuurscollege
      beoordeelt of een bouwwerk voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.5
  - number: 2.6.1
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: 2.6.1.a
    text: te bouwen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: 2.6.1.b
    text: een bestaand bouwwerk dan wel een open erf of terrein in een staat te brengen, te laten komen of te houden;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: 2.6.1.c
    text: een bouwwerk, open erf of terrein in gebruik te nemen, te gebruiken of te laten gebruiken; en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: 2.6.1.d
    text: te slopen,
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Het is verboden een bouwwerk dan wel een deel daarvan, in stand te laten voor zover bij het bouwen
      daarvan niet is voldaan aan de op dat bouwen van toepassing zijnde voorschriften, bedoeld in de
      [artikelen 2.3, eerste lid, onderdeel a][ref1], en [2.4, eerste lid, onderdelen c en e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.3
    text: |-
      De verboden, bedoeld in het eerste en tweede lid, hebben mede betrekking op het niet voldoen aan de voorschriften,
      bedoeld in [artikel 2.4, tweede lid][ref1], voor zover deze voorschriften ingevolge artikel 2.4, derde lid,
      rechtstreeks gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.4
    text: |-
      De verboden, bedoeld in het eerste en tweede lid, zijn niet van toepassing voor zover een bouwvergunning afwijking
      van de desbetreffende voorschriften met betrekking tot bouwen uitdrukkelijk toestaat.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de wijze van inrichting en
      indiening van een aanvraag om een bouwvergunning, alsmede omtrent de daarbij over te leggen gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.7
  - number: 2.8.1
    text: |-
      Het bestuurscollege tekent de datum van ontvangst aan op het geschrift waarbij de aanvraag om een bouwvergunning
      is ingediend.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Het bestuurscollege zendt de aanvrager een ontvangstbevestiging, waarin de datum, bedoeld in het eerste lid, is
      vermeld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.3
    text: |-
      Het bestuurscollege doet een openbare kennisgeving van de aanvraag om een bouwvergunning in één of meer
      plaatselijke dagbladen en voorts op de voor publicatie van officiële mededelingen gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.4
    text: |-
      Het bestuurscollege beslist omtrent de aanvraag om een bouwvergunning binnen zestien weken na ontvangst van de
      aanvraag. Het bestuurscollege kan de beslissing eenmaal met ten hoogste acht weken verdagen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.5
    text: 'Het bestuurscollege stelt een openbaar register in, waarin aantekening wordt gehouden van:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.5.a
    text: aanvragen om een bouwvergunning;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.5.b
    text: verleende bouwvergunningen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat het bestuurscollege ook andere gegevens dan
      de gegevens, bedoeld in het vijfde lid, aantekent in het register.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.8.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald binnen welke termijn de gegevens, bedoeld in
      het vijfde en zesde lid, worden aangetekend. Die termijn kan voor de verschillende gegevens verschillend worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Het bestuurscollege houdt de beslissing omtrent de aanvraag om een bouwvergunning aan, indien er geen grond is om
      de vergunning te weigeren en het bouwen tevens aan te merken is als het oprichten of veranderen van een inrichting
      waarvoor een vergunning op grond van [artikel 5.1][ref1] is vereist, tenzij die vergunning verleend is en deze
      beslissing onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 2.9.2
    text: |-
      Nadat de vergunning op grond van [artikel 5.1][ref1] onherroepelijk is geworden, verleent het bestuurscollege de
      bouwvergunning binnen vier weken na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '2.10'
    text: 'De bouwvergunning wordt geweigerd, indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
  - number: 2.10.a
    text: |-
      de aanvraag en de daarbij overgelegde gegevens naar het oordeel van het bestuurscollege niet aannemelijk maken
      dat het bouwen waarop de aanvraag betrekking heeft, voldoet aan de voorschriften die zijn gegeven bij of krachtens
      algemene maatregel van bestuur als bedoeld in [artikel 2.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.10.b
    text: |-
      het bouwen in strijd is met een ontwikkelingsplan als bedoeld in
      [artikel 7 van de Wet grondslagen ruimtelijke ontwikkelingsplanning BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0028218
        artikel: '7'
  - number: 2.10.c
    text: |-
      voor het bouwen een vergunning ingevolge de [Monumentenwet BES][ref1] is vereist en deze niet is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0028429
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0028429
  - number: 2.10.d
    text: |-
      het bouwen in strijd is met redelijke eisen van welstand, beoordeeld naar de criteria, bedoeld in
      [artikel 2.5, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.10.e
    text: |-
      de aanvraag en de daarbij overgelegde gegevens naar het oordeel van het bestuurscollege niet aannemelijk maken dat
      het bouwen voldoet aan de voorschriften die zijn gegeven bij de bouwverordening of, zolang de bouwverordening nog
      niet in overeenstemming is gebracht met de voorschriften die zijn gegeven bij of krachtens de algemene maatregel
      van bestuur, bedoeld in [artikel 2.4, tweede lid][ref1], aan laatstbedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.11.1
    text: In een bouwvergunning kan worden bepaald dat zij geldt voor een daarin opgenomen termijn.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Aan een bouwvergunning kunnen voorschriften worden verbonden ter bescherming van de belangen ten behoeve waarvan de
      voorschriften strekken krachtens welke de vergunning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.11
  - number: '2.12'
    text: |-
      Onverminderd [artikel 10.7][ref1] kan het bestuurscollege de bouwvergunning geheel of gedeeltelijk intrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 2.12.a
    text: indien blijkt dat het bestuurscollege de vergunning op basis van een onjuiste of onvolledige opgave heeft verleend;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
  - number: 2.12.b
    text: indien niet binnen een jaar nadat de vergunning onherroepelijk is geworden, is begonnen met de bouwwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
  - number: 2.12.c
    text: indien de bouwwerkzaamheden na aanvang meer dan een half jaar stilliggen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
  - number: 2.12.d
    text: indien het bouwwerk niet binnen drie jaar nadat de vergunning onherroepelijk is geworden, is voltooid;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
  - number: 2.12.e
    text: op verzoek van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.12
  - number: '2.13'
    text: |-
      De voordracht voor een krachtens [artikel 2.3][ref1] vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1
    text: |-
      De eilandsraad kan in het belang van een evenwichtige en rechtvaardige verdeling van woonruimte een
      huisvestingsverordening vaststellen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.1.2
    text: 'Indien toepassing wordt gegeven aan het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.1.2.a
    text: |-
      wijst de eilandsraad in de huisvestingsverordening de categorieën woonruimte aan die niet voor bewoning in
      gebruik mogen worden genomen of gegeven of voor verkoop zijn bestemd indien daarvoor geen huisvestingsvergunning
      is verleend;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.1.2.b
    text: |-
      wijst de eilandsraad in de huisvestingsverordening de categorieën woningzoekenden aan die voor het verkrijgen van
      een huisvestingsvergunning in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.1.2.c
    text: legt de eilandsraad in de huisvestingsverordening regels vast over de uitgifte van bouwkavels;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.1.2.d
    text: legt de eilandsraad in de huisvestingverordening de criteria vast voor de verlening van huisvestingsvergunningen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.1
  - number: 3.2.1
    text: |-
      In de huisvestingsverordening kan de eilandsraad bepalen dat voor een of meer daarbij aangewezen
      categorieën woonruimte in verband met de aard, grootte of prijs van die woonruimte bij het verlenen van
      huisvestingsvergunningen voorrang wordt gegeven aan een daarbij aangewezen gedeelte van de overeenkomstig
      [artikel 3.1, tweede lid, onderdeel b][ref1], aangewezen categorieën woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.2
    text: |-
      In de huisvestingsverordening kan de eilandsraad bepalen dat voor een of meer daarbij aangewezen categorieën
      woonruimte bij het verlenen van huisvestingsvergunningen voorrang wordt gegeven aan woningzoekenden waarvoor de
      voorziening in de behoefte aan woonruimte dringend noodzakelijk is. Hierbij kunnen de criteria voor indeling in
      urgentiecategorieën worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.3
    text: |-
      In de huisvestingsverordening kan de eilandsraad bepalen dat voor een of meer daarbij aangewezen categorieën
      woonruimte bij de verlening van huisvestingsvergunningen en bij de uitgifte van bouwkavels voorrang kan worden
      gegeven aan woningzoekenden die economisch of maatschappelijk aan het eiland gebonden zijn.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.4
    text: 'Voor de toepassing van het derde lid is een woningzoekende:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.4.a
    text: |-
      economisch gebonden aan het eiland indien hij met het oog op de voorziening in het bestaan een redelijk belang
      heeft zich op het eiland te vestigen, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.4.b
    text: 'maatschappelijk gebonden aan het eiland indien hij:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.4.b.1°
    text: een redelijk, met de plaatselijke samenleving verband houdend belang heeft zich op het eiland te vestigen, of
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.2.4.b.2°
    text: |-
      ten minste vijf jaar onafgebroken ingezetene is dan wel gedurende de voorafgaande tien jaar ten minste vijf jaar
      onafgebroken ingezetene is geweest van het eiland.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.2
  - number: 3.3.1
    text: 'De eilandsraad stelt in de huisvestingsverordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.3.1.a
    text: de wijze waarop een huisvestingsvergunning kan worden aangevraagd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.3.1.b
    text: de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beoordeling van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.3.1.c
    text: de termijn waarbinnen door het bestuurscollege op de aanvraag moet worden beslist;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.3.1.d
    text: de gegevens die ten minste in de beschikking op de aanvraag moeten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.3.2
    text: |-
      De eilandsraad kan in de huisvestingsverordening bepalen dat een aanvraag slechts in behandeling wordt genomen,
      indien de aanvrager aannemelijk kan maken dat hij, indien hij een huisvestingsvergunning voor de in de aanvraag
      aangegeven woonruimte krijgt, die woonruimte ook daadwerkelijk in gebruik zal kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Een huisvestingsvergunning wordt verleend indien de aanvrager behoort tot een krachtens
      [artikel 3.1, tweede lid, onderdeel b][ref1], aangewezen categorie woningzoekenden.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: |-
      Indien de woonruimte is aangewezen op grond van [artikel 3.2, eerste, tweede of derde lid][ref1], kan de
      huisvestingsvergunning worden geweigerd indien een of meer andere woningzoekenden aan wie op grond van dat artikel
      voorrang kan worden gegeven in aanmerking wensen te komen voor die woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.1
    text: |-
      Het is verboden om woonruimte die is aangewezen krachtens [artikel 3.1, tweede lid, onderdeel a][ref1], voor
      bewoning in gebruik te nemen zonder vergunning van het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2
    text: |-
      Het is verboden om woonruimte die is aangewezen krachtens [artikel 3.1, tweede lid, onderdeel a][ref1], voor
      bewoning in gebruik te geven aan een persoon die niet beschikt over een huisvestingsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel3
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.6'
    text: 'Het bestuurscollege kan een huisvestingsvergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.6
  - number: 3.6.a
    text: |-
      de vergunninghouder de erin vermelde woonruimte niet binnen de door het bestuurscollege bij de verlening van de
      vergunning gestelde termijn in gebruik heeft genomen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.6
  - number: 3.6.b
    text: |-
      de vergunning is verleend op grond van door de vergunninghouder verstrekte gegevens waarvan deze wist of
      redelijkerwijs moest vermoeden dat zij onjuist of onvolledig waren.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel3.6
  - number: '4.6'
    text: 'Het bestuurscollege draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.6
  - number: 4.6.a
    text: |-
      ten minste eenmaal per week de afvalstoffen met uitzondering van grove huishoudelijke afvalstoffen worden
      ingezameld bij elk op het grondgebied van het betrokken openbaar lichaam gelegen perceel waar zodanige afvalstoffen
      geregeld kunnen ontstaan,
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.6
  - number: 4.6.b
    text: |-
      op ten minste een daartoe ter beschikking gestelde plaats binnen het openbaar lichaam in voldoende mate gelegenheid
      wordt geboden om grove huishoudelijke afvalstoffen achter te laten, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.6
  - number: 4.6.c
    text: |-
      in de gevallen, bedoeld in [artikel 4.7, vijfde lid, onderdeel c][ref1], en voor de afvalstoffen, bedoeld in
      artikel 4.7, vierde lid, onderdeel b en c, en [artikel 9.1, tweede lid][ref2], op ten minste een daartoe ter
      beschikking gestelde plaats binnen het openbaar lichaam in voldoende mate gelegenheid wordt geboden om de
      afvalstoffen achter te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel9
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '9'
        hoofdstuk: '9'
  - number: 4.7.1
    text: De eilandsraad stelt in het belang van de bescherming van het milieu een afvalstoffenverordening vast.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Bij het vaststellen van de afvalstoffenverordening houdt de eilandsraad rekening met de voorkeursvolgorde, bedoeld
      in [artikel 1.5, derde lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.7.3
    text: 'De afvalstoffenverordening bevat ten minste regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.3.a
    text: |-
      het overdragen of het ter inzameling aanbieden van afvalstoffen aan een inzameldienst die beschikt over een
      vergunning als bedoeld in [artikel 4.3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.7.3.b
    text: het overdragen van zodanige afvalstoffen aan een ander;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.3.c
    text: het achterlaten van zodanige afvalstoffen op een daartoe ter beschikking gestelde plaats;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.3.d
    text: |-
      het voorkomen dat afvalstoffen als zwerfafval in het milieu terecht komen dan wel teneinde te bereiken dat zulks zo
      min mogelijk gebeurt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.3.e
    text: het opruimen van afvalstoffen die als zwerfafval in het milieu terecht zijn gekomen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.3.f
    text: het op een voor het publiek zichtbare plaats aanwezig hebben van afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.4
    text: |-
      In afwijking van [artikel 4.6, onderdeel a][ref1], wijst de eilandsraad in de afvalstoffenverordening categorieën
      van afvalstoffen aan die:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.7.4.a
    text: afzonderlijk moeten worden aangeboden aan de inzameldienst;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.4.b
    text: niet mogen worden aangeboden aan de inzameldienst;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.4.c
    text: afzonderlijk moeten worden aangeboden bij daartoe aangewezen inzamelpunten.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.5
    text: |-
      In afwijking van [artikel 4.6, onderdeel a][ref1], kan de eilandsraad in het belang van een doelmatig beheer van
      afvalstoffen in de afvalstoffenverordening voorts bepalen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.7.5.a
    text: afvalstoffen worden ingezameld nabij elk perceel;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.5.b
    text: afvalstoffen worden ingezameld met een bij verordening aangegeven regelmaat;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.5.c
    text: in een gedeelte van het grondgebied geen afvalstoffen worden ingezameld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.7.6
    text: |-
      De eilandsraad stelt nadere regels betreffende het beheer van afvalstoffen als bedoeld in het vierde lid, onderdeel
      a, b en c.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Onze Minister kan, voor zover dat in het belang van een doelmatig beheer van afvalstoffen noodzakelijk is, aan de
      eilandsraad een bindende aanwijzing geven met betrekking tot het opnemen in de afvalstoffenverordening van regels
      als bedoeld in [artikel 4.7, vierde lid, onderdelen a, b en c, en zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.8.2
    text: Onze Minister pleegt over een voornemen tot het geven van een aanwijzing overleg met de eilandsraad.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Onze Minister deelt het voornemen, onder vermelding van de redenen daarvoor, mede aan de beide Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.8
  - number: 4.8.4
    text: Onze Minister doet van de aanwijzing mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.8
  - number: 4.25.1
    text: Het bestuurscollege draagt zorg voor het beheer van afvalwater in gebieden waarin dat doelmatig is.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.25
  - number: 4.25.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet voor afvalwater vanuit een inrichting dat niet, dan wel
      uitsluitend na voorafgaande zuivering door of vanwege de exploitant van die inrichting, kan worden verwerkt door
      een rioolwaterzuiveringsinstallatie of andere zuiveringsinstallatie in beheer bij het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.25
  - number: 4.25.3
    text: |-
      De eilandsraad stelt in het belang van de bescherming van het milieu een afvalwaterverordening vast, waarbij de
      gebieden, bedoeld in het eerste lid, worden aangewezen en waarbij regels worden gesteld omtrent het aanbieden van
      afvalwater in verband met het beheer.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.25
  - number: 4.26.1
    text: |-
      Met betrekking tot het lozen van afvalwater voorziet de afvalwaterverordening, bedoeld in
      [artikel 4.25, derde lid][ref1], ten minste in:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.26.1.a
    text: maatregelen om het ontstaan van afvalwater te voorkomen of te beperken;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.1.b
    text: maatregelen waardoor de verontreiniging van afvalwater wordt voorkomen of beperkt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.1.c
    text: maatregelen om de afvalwaterstromen zoveel mogelijk gescheiden te houden;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.1.d
    text: voorschriften betreffende het lozen van afvalwater in de bodem of in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.1.e
    text: voorschriften betreffende het lozen van afvalwater in de riolering of een andere daartoe bestemde voorziening, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.1.f
    text: voorschriften ter bescherming van die riolering of een andere voor het lozen van afvalwater bestemde voorziening.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 4.26.2
    text: |-
      De afvalwaterverordening kan voorts voorzien in voorwaarden waaronder afvalwater afkomstig van inrichtingen ter
      inzameling of ter verwerking door een rioolwaterzuiveringsinstallatie of andere zuiveringsinstallatie in beheer bij
      het openbaar lichaam kan worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel4.26
  - number: 5.1.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld, die nodig zijn ter bescherming van het
      milieu tegen de nadelige gevolgen die inrichtingen daarvoor kunnen veroorzaken. Daarbij kan worden bepaald dat
      daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.2
    text: |-
      In afwijking van het eerste lid kunnen bij of krachtens algemene maatregel van bestuur categorieën van inrichtingen
      worden aangewezen, waarvoor het is verboden zonder een daartoe verleende vergunning een inrichting:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.2.a
    text: op te richten;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.2.b
    text: te veranderen of de werking daarvan te veranderen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.2.c
    text: in werking te hebben.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Het verbod, bedoeld in het tweede lid, onderdeel b, geldt niet voor het veranderen van een inrichting of de werking
      daarvan:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.3.a
    text: |-
      dat in overeenstemming is met de voor die inrichting verleende vergunning en de daaraan verbonden beperkingen en
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.1.3.b
    text: |-
      voor zover daarop regels, gesteld bij of krachtens een algemene maatregel van bestuur als bedoeld in het eerste
      lid, van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.1
  - number: 5.6.1
    text: |-
      Het bestuurscollege van het openbaar lichaam waar de inrichting zal zijn of is gelegen, is bevoegd te beslissen op
      de aanvraag om een vergunning als bedoeld in [artikel 5.1, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.6.2
    text: |-
      In afwijking van het eerste lid kan bij of krachtens algemene maatregel van bestuur worden bepaald dat Onze
      Minister bevoegd is te beslissen op de aanvraag om een vergunning ten aanzien van daarbij aangewezen categorieën
      van inrichtingen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.6
  - number: 5.6.3
    text: |-
      In afwijking van het eerste en tweede lid kan Onze Minister, indien dat geboden is in het belang van de veiligheid
      van de Staat, in overeenstemming met Onze betrokken Minister, bepalen dat Onze Minister ten aanzien van een bij of
      krachtens zijn besluit aangewezen inrichting bevoegd is te beslissen op de aanvraag om een vergunning.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Indien bij of krachtens wettelijk voorschrift dan wel door een verandering van de inrichting of de werking daarvan
      de bevoegdheid te beslissen op aanvragen om een vergunning overgaat naar een ander bestuursorgaan, worden reeds
      voor die inrichting verleende vergunningen gelijkgesteld met vergunningen, verleend door dat andere bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.7
  - number: 5.7.2
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de overgang, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.7
  - number: 5.8.1
    text: |-
      Indien een vergunning wordt aangevraagd als bedoeld in [artikel 5.1, tweede lid, onderdeel a en b][ref1], en
      voor die inrichting al een of meer vergunningen krachtens deze wet zijn verleend, kan het bevoegd gezag, uit
      eigen beweging of op verzoek, bepalen dat een vergunning moet worden aangevraagd voor die verandering en voor
      het in werking hebben na die verandering van de gehele inrichting of onderdelen daarvan, waarmee die verandering
      samenhangt.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.8.2
    text: |-
      Indien het bevoegd gezag heeft bepaald dat een zodanige vergunning moet worden aangevraagd, besluit het tot het
      buiten behandeling laten van aanvragen om een vergunning voor de betrokken verandering van de inrichting of van de
      werking daarvan, die geen betrekking hebben op een zodanige vergunning.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.8
  - number: 5.8.3
    text: |-
      Het bevoegd gezag kan de rechten die de vergunninghouder aan de al eerder verleende vergunningen ontleende, niet
      wijzigen anders dan mogelijk zou zijn met toepassing van de [artikelen 5.28 tot en met 5.32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.8.4
    text: |-
      Een met toepassing van dit artikel verleende vergunning vervangt met ingang van het tijdstip waarop zij in werking
      treedt, de eerder voor de inrichting of met betrekking tot de in het eerste lid bedoelde onderdelen daarvan
      verleende vergunningen. Deze vergunningen vervallen op het tijdstip waarop de met toepassing van dit artikel
      verleende vergunning onherroepelijk wordt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.8
  - number: 5.9.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de aanvraag moet
      geschieden en de gegevens die door de aanvrager moeten worden verstrekt met het oog op de beslissing op de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.9
  - number: 5.10.2
    text: |-
      Indien Onze Minister bevoegd is te beslissen op de aanvraag om een vergunning, stelt Onze Minister het
      bestuurscollege in de gelegenheid advies uit te brengen over het ontwerp van de beschikking op de aanvraag om een
      vergunning.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.10
  - number: 5.11.1
    text: 'Het bevoegd gezag betrekt bij de beslissing op de aanvraag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
  - number: 5.11.1.a
    text: |-
      de onderwerpen, genoemd in [artikel 5.2, eerste lid, onderdeel a tot en met d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.11.1.b
    text: |-
      het systeem van met elkaar samenhangende technische, administratieve en organisatorische maatregelen om de gevolgen
      die de inrichting voor het milieu veroorzaakt, te monitoren, te beheersen en, voor zover het nadelige gevolgen
      betreft, te verminderen, dat degene die de inrichting drijft met betrekking tot die inrichting toepast, alsmede het
      milieubeleid dat hij met betrekking tot de activiteit voert.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
  - number: 5.11.2
    text: |-
      Het bevoegd gezag houdt bij de beslissing op de aanvraag in ieder geval rekening met het voor hem geldende
      milieubeleidsplan, bedoeld in [artikel 1.4][ref1], en het voor hem geldende milieuprogramma, bedoeld in
      [artikel 1.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel1
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '1'
        hoofdstuk: '1'
  - number: 5.11.3
    text: 'Het bevoegd gezag neemt bij de beslissing op de aanvraag in ieder geval in acht:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
  - number: 5.11.3.a
    text: |-
      de voor hem geldende, krachtens [artikel 5.19][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.11.3.b
    text: |-
      aanwijzingen die met betrekking tot de beslissing op de aanvraag krachtens [artikel 5.33][ref1] door Onze Minister
      zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.11.4
    text: |-
      Het bevoegd gezag geeft in de motivering van de beslissing op de aanvraag aan, op welke wijze de in het eerste lid
      genoemde aspecten de inhoud van het besluit hebben beïnvloed.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.11
  - number: '5.12'
    text: |-
      Het bevoegd gezag draagt er bij de beslissing op de aanvraag zorg voor dat er geen strijd ontstaat met regels
      die met betrekking tot de inrichting gelden, gesteld bij of krachtens deze wet dan wel bij of krachtens de
      [Wet grondslagen ruimtelijke ontwikkelingsplanning BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028218
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0028218
  - number: 5.13.1
    text: De vergunning kan slechts in het belang van de bescherming van het milieu worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
  - number: 5.13.2
    text: 'De vergunning wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
  - number: 5.13.2.a
    text: |-
      door verlening daarvan niet kan worden bereikt dat in de inrichting ten minste de voor de inrichting in aanmerking
      komende beste beschikbare technieken worden toegepast;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
  - number: 5.13.2.b
    text: |-
      verlening daarvan niet in overeenstemming zou zijn met hetgeen overeenkomstig [artikel 5.11, derde lid][ref1], door
      het bevoegd gezag in acht moet worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.13.2.c
    text: |-
      door verlening daarvan strijd zou ontstaan met regels als bedoeld in [artikel 5.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.13.3
    text: |-
      In afwijking van het eerste lid kan de vergunning tevens worden geweigerd ingeval door verlening daarvan strijd zou
      ontstaan met een ontwikkelingsplan als bedoeld in de [Wet grondslagen ruimtelijke ontwikkelingsplanning BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028218
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0028218
  - number: 5.14.1
    text: In de vergunning wordt duidelijk aangegeven waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.14
  - number: 5.14.2
    text: De vergunning kan in het belang van de bescherming van het milieu onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.14
  - number: 5.14.3
    text: |-
      In het belang van het bereiken van een hoog niveau van bescherming van het milieu worden aan de vergunning de
      voorschriften verbonden, die nodig zijn om de nadelige gevolgen die de inrichting voor het milieu kan veroorzaken,
      te voorkomen of, indien dat niet mogelijk is, zoveel mogelijk – bij voorkeur bij de bron – te beperken en ongedaan
      te maken. Daarbij wordt ervan uitgegaan dat in de inrichting ten minste de voor de inrichting in aanmerking komende
      beste beschikbare technieken worden toegepast.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.14
  - number: 5.14.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop de voor
      een inrichting in aanmerking komende beste beschikbare technieken worden bepaald. Daarbij kan worden bepaald dat de
      gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.14
  - number: 5.14.5
    text: |-
      Voor zover met betrekking tot de inrichting regels gelden, gesteld bij of krachtens deze wet, kunnen de beperkingen
      en voorschriften daarvan alleen afwijken voor zover dat bij wettelijk voorschrift is toegestaan.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.14
  - number: 5.15.1
    text: |-
      De aan een vergunning te verbinden voorschriften geven de doeleinden aan, die de vergunninghouder in het belang van
      de bescherming van het milieu op een door hem te bepalen wijze dient te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.15.2
    text: |-
      Bij de voorschriften worden emissiegrenswaarden gesteld voor stoffen of voor daarbij aan te wijzen groepen,
      families of categorieën van stoffen, die in aanmerkelijke hoeveelheden uit de inrichting kunnen vrijkomen en die
      direct of door overdracht tussen water, lucht en bodem nadelige gevolgen voor het milieu kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.15.3
    text: |-
      Bij het vaststellen van de emissiegrenswaarden wordt uitgegaan van de emissies op het punt waar zij de bron, in
      voorkomend geval na reiniging, verlaten, tenzij dat redelijkerwijs niet mogelijk is. De emissiegrenswaarden worden
      vastgesteld zonder rekening te houden met een mogelijke verdunning.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.15.4
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het eerste en tweede lid, kunnen
      daaraan in ieder geval ook voorschriften worden verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.15.4.a
    text: |-
      wordt bepaald of aan de eerstbedoelde voorschriften wordt voldaan, waarbij de wijze van bepaling wordt aangegeven,
      die ten minste betrekking heeft op de methode en de frequentie van de bepaling en de procedure voor de beoordeling
      van de bij die bepaling verkregen gegevens en die tevens betrekking kan hebben op de organisatie van die bepalingen
      en beoordelingen en op de registratie van die gegevens en de resultaten van die beoordelingen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.15.4.b
    text: |-
      de bij die bepaling verkregen gegevens aan het bevoegd gezag worden gemeld of ter inzage gegeven of anderszins ter
      beschikking moeten worden gesteld van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.15
  - number: 5.16.1
    text: |-
      Voor zover dit naar het oordeel van het bevoegd gezag noodzakelijk is, kunnen aan de vergunning voorschriften
      worden verbonden, inhoudende de verplichting tot het treffen van technische maatregelen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
  - number: 5.16.2
    text: |-
      Indien voorschriften als bedoeld in het eerste lid aan de vergunning worden verbonden in plaats van voorschriften
      als bedoeld in [artikel 5.15, eerste en tweede lid][ref1], leiden de technische maatregelen tot een gelijkwaardige
      bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.16.3
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het eerste lid, kunnen daaraan in ieder
      geval ook voorschriften worden verbonden, inhoudende dat:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
  - number: 5.16.3.a
    text: |-
      over de uitvoering van technische maatregelen waartoe die voorschriften verplichten, verslag wordt gedaan aan het
      bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
  - number: 5.16.3.b
    text: |-
      daarbij aangegeven metingen, berekeningen of tellingen moeten worden verricht ter bepaling van de mate waarin de
      inrichting de nadelige gevolgen voor het milieu veroorzaakt, ter voorkoming of beperking waarvan die voorschriften
      zijn bedoeld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
  - number: 5.16.4
    text: |-
      Voor zover aan een vergunning voorschriften worden verbonden als bedoeld in het derde lid, is
      [artikel 5.15, vierde lid, onderdeel b][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.17'
    text: |-
      Aan de vergunning worden in ieder geval de voor de betrokken inrichting in aanmerking komende voorschriften
      verbonden met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.a
    text: een doelmatig gebruik van energie en grondstoffen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.b
    text: de bescherming van bodem, oppervlaktewaterlichamen en grondwater;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.c
    text: |-
      het voorkomen van het ontstaan van afvalstoffen en afvalwater en, voor zover dat niet mogelijk is, het doelmatig
      beheer van afvalstoffen en van afvalwater;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.d
    text: |-
      het beperken van de nadelige gevolgen voor het milieu van het verkeer van personen of goederen van en naar de
      inrichting;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.e
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van door de inrichting veroorzaakte verontreinigingen over lange
      afstand of grensoverschrijdende verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.f
    text: |-
      het voorkomen dan wel zo veel mogelijk beperken van de nadelige gevolgen voor het milieu, die kunnen worden
      veroorzaakt door opstarten, lekken, storingen, korte stilleggingen, definitieve bedrijfsbeëindiging of andere
      bijzondere bedrijfsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.g
    text: het voorkomen van ongevallen en het beperken van de gevolgen van ongevallen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.17.h
    text: |-
      het treffen van maatregelen om bij definitieve bedrijfsbeëindiging de nadelige gevolgen die de inrichting heeft
      veroorzaakt voor het terrein waarop zij was gevestigd, ongedaan te maken of te beperken voor zover dat nodig is om
      dat terrein weer geschikt te maken voor een volgende functie.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.17
  - number: 5.18.1
    text: |-
      Aan de vergunning kunnen in het belang van de bescherming van het milieu andere voorschriften worden verbonden. Die
      voorschriften kunnen in ieder geval inhouden:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.a
    text: |-
      dat daarbij aangegeven andere metingen, berekeningen of tellingen dan bedoeld in de [artikelen 5.15][ref1] en
      [5.16][ref2] moeten worden verricht ter bepaling van de mate waarin de inrichting nadelige gevolgen voor het milieu
      veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.18.1.b
    text: |-
      dat in een mate als bij het voorschrift aangegeven, onderzoek wordt verricht naar mogelijkheden tot verdergaande
      bescherming van het milieu dan waarin de andere aan de vergunning verbonden voorschriften voorzien;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.c
    text: |-
      dat de uitkomsten van daarbij aangegeven metingen, berekeningen, tellingen of onderzoeken worden geregistreerd en
      bewaard dan wel worden gemeld of ter beschikking gesteld van bij het voorschrift aangewezen bestuursorganen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.d
    text: |-
      dat wordt voldaan aan daarbij aangegeven eisen ten aanzien van de vakbekwaamheid van in de inrichting werkzame
      personen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.e
    text: |-
      dat aan de in de inrichting werkzame personen schriftelijk instructies worden gegeven om handelen in strijd met de
      vergunning, de daaraan verbonden voorschriften of bij of krachtens [artikel 5.1, eerste lid][ref1], gestelde regels
      tegen te gaan, en dat toezicht wordt gehouden op het naleven van die instructies;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.18.1.f
    text: |-
      dat met betrekking tot in het voorschrift geregelde, daarbij aangegeven onderwerpen wordt voldaan aan nadere eisen
      die door een bij het voorschrift aangewezen bestuursorgaan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.g
    text: |-
      dat van daarbij aangegeven veranderingen als bedoeld in [artikel 5.1, derde lid][ref1], binnen een in het
      voorschrift te bepalen termijn schriftelijk mededeling wordt gedaan aan het bevoegd gezag of een door hem
      aangewezen instantie;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.18.1.h
    text: |-
      dat met het oog op het kunnen voldoen aan de andere aan de vergunning verbonden voorschriften daarbij aangegeven
      organisatorische en administratieve maatregelen worden getroffen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.1.i
    text: |-
      dat met betrekking tot een bij het voorschrift aangegeven onderwerp waarover geen andere voorschriften aan de
      vergunning zijn verbonden, voldoende zorg in acht wordt genomen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.18.2
    text: |-
      Bij een voorschrift inzake nadere eisen als bedoeld in het eerste lid, onderdeel f, kan worden aangegeven hoe van
      die eisen door het aangewezen bestuursorgaan openbaar wordt kennisgegeven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.18
  - number: 5.19.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld, inhoudende de verplichting voor het bevoegd gezag
      beperkingen of voorschriften, die nodig zijn ter bescherming van het milieu en waarvan de inhoud in die maatregel
      is aangegeven, aan te brengen onderscheidenlijk te verbinden aan de vergunningen voor inrichtingen die behoren tot
      een bij de maatregel aangewezen categorie. Bij de algemene maatregel van bestuur kan worden bepaald dat de daarbij
      gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.19
  - number: 5.19.2
    text: |-
      [Artikel 5.2, eerste lid][ref1], is van overeenkomstige toepassing op de beslissing tot het vaststellen van een
      algemene maatregel van bestuur als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.19.3
    text: |-
      Ten aanzien van bij het eerste lid aan te wijzen beperkingen en voorschriften zijn
      de [artikelen 5.14, derde lid, eerste volzin][ref1], [5.15 tot en met 5.18][ref2] en
      [5.28, eerste en tweede lid][ref3], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.19.4
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, wordt bepaald in hoeverre het bevoegd gezag met
      betrekking tot daarbij aangegeven onderwerpen van bij de maatregel gestelde regels kan afwijken of nadere eisen
      kan stellen. Daarbij kan worden bepaald dat de bevoegdheid tot afwijken of tot het stellen van nadere eisen slechts
      geldt in bij de maatregel aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.19
  - number: 5.19.5
    text: |-
      Bij de maatregel wordt voor de daarbij opgelegde verplichtingen het tijdstip aangegeven, waarop zij met betrekking
      tot de reeds verleende vergunningen moeten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.19
  - number: 5.20.1
    text: |-
      Indien de vergunning betrekking heeft op een inrichting waarin afvalstoffen nuttig worden toegepast of worden
      verwijderd, bevat de vergunning ten minste de verplichtingen:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a
    text: 'tot het registreren van:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a.1°
    text: |-
      daarbij aangewezen afvalstoffen die in de inrichting nuttig worden toegepast of worden verwijderd: naar
      hoeveelheid, aard en oorsprong;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a.2°
    text: |-
      stoffen die bij de nuttige toepassing of verwijdering van die afvalstoffen worden gebruikt of verbruikt: naar aard
      en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a.3°
    text: |-
      stoffen, preparaten en producten, hieronder mede begrepen afvalstoffen, die bij de nuttige toepassing of
      verwijdering ontstaan: naar aard en hoeveelheid;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a.4°
    text: de wijze waarop de onder 3° bedoelde afvalstoffen nuttig worden toegepast of worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.a.5°
    text: |-
      stoffen, preparaten en producten die de inrichting verlaten, voor zover deze bij de nuttige toepassing of
      verwijdering zijn ontstaan: naar aard en hoeveelheid, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.1.b
    text: tot het bewaren van de geregistreerde gegevens gedurende ten minste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.20.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent de wijze waarop de registratie plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.20
  - number: 5.21.1
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat in daarbij aangegeven categorieën van gevallen waarin
      inrichtingen ernstige nadelige gevolgen voor het milieu kunnen veroorzaken, aan de vergunning tevens voorschriften
      kunnen worden verbonden, die de verplichting inhouden dat degene die de inrichting drijft:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: 5.21.1.a
    text: financiële zekerheid stelt voor het nakomen van krachtens de vergunning voor hem geldende verplichtingen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: 5.21.1.b
    text: |-
      financiële zekerheid stelt ter dekking van zijn aansprakelijkheid voor schade die voortvloeit uit door de
      inrichting veroorzaakte nadelige gevolgen voor het milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: 5.21.2
    text: |-
      Bij een maatregel krachtens het eerste lid worden nadere regels gesteld met betrekking tot de op te leggen
      voorschriften. Daarbij worden in ieder geval aangegeven het bedrag waarvoor en de termijn gedurende welke de
      zekerheid ten hoogste in stand moet worden gehouden, alsmede de voorwaarden waaraan moet worden voldaan alvorens de
      verplichting kan komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: 5.21.3
    text: |-
      Bij de maatregel kunnen regels worden gesteld voor gevallen waarin aan de verplichting uitvoering wordt gegeven
      door het sluiten en in stand houden van een verzekering. Daarbij wordt rekening gehouden met hetgeen redelijkerwijs
      door verzekering kan worden gedekt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Indien overeenkomstig het eerste lid een voorschrift als bedoeld in dat lid, onderdeel a, aan een vergunning
      is verbonden, kan het bevoegd gezag bij het niet nakomen door de houder van de vergunning van een krachtens de
      vergunning voor hem geldende verplichting waarvoor financiële zekerheid is gesteld, bepalen tot welk bedrag het
      verhaal zal nemen op de gestelde zekerheid. Het bevoegd gezag kan het te verhalen bedrag invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.21
  - number: '5.22'
    text: 'In een vergunning kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.22
  - number: 5.22.a
    text: |-
      dat daarbij aangewezen voorschriften eerst in werking treden op een daarbij aangegeven tijdstip, dan wel wanneer
      een daarbij aangegeven omstandigheid zich voordoet;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.22
  - number: 5.22.b
    text: dat daarbij aangewezen voorschriften slechts gelden tot een daarbij aangegeven tijdstip, dan wel omstandigheid;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.22
  - number: 5.22.c
    text: |-
      dat daarbij aangewezen voorschriften nadat de vergunning haar gelding heeft verloren, gedurende een daarbij
      aangegeven termijn van kracht blijven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.22
  - number: 5.23.1
    text: |-
      In een vergunning kan worden bepaald dat zij slechts geldt voor een daarbij vast te stellen termijn van ten hoogste
      vijf jaar, indien:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.1.a
    text: de inrichting waarop de vergunning betrekking heeft, naar haar aard tijdelijk is;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.1.b
    text: uit de aanvraag blijkt dat de vergunning slechts voor een daarbij aangegeven termijn wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.1.c
    text: |-
      dat nodig is in het belang van het ontwikkelen van werkwijzen in de inrichting, die minder nadelige gevolgen voor
      het milieu veroorzaken;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.1.d
    text: dat nodig is in verband met het ontwikkelen van een beter inzicht in de gevolgen van de inrichting voor het milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.2
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van inrichtingen waarin afvalstoffen nuttig worden toegepast
      of worden verwijderd, worden aangewezen, ten aanzien waarvan de vergunning, voor zover zij deze handelingen
      betreft, slechts geldt voor een bij de vergunning te stellen termijn van ten hoogste tien jaar. Bij de algemene
      maatregel van bestuur, bedoeld in de eerste volzin, kan worden bepaald dat de aanwijzing slechts betrekking heeft
      op daarbij aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.23.3
    text: |-
      In een vergunning wordt bepaald dat zij slechts geldt voor een daarbij aangegeven termijn, voor zover dat is
      bepaald bij een algemene maatregel van bestuur, die is vastgesteld ter uitvoering van een voor de openbare lichamen
      verbindend verdrag of een voor de openbare lichamen verbindend besluit van een volkenrechtelijke organisatie. De
      bij de algemene maatregel van bestuur, bedoeld in de eerste volzin, aangegeven termijn kan zo nodig afwijken van de
      in het eerste en tweede lid genoemde termijnen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.23
  - number: 5.24.1
    text: 'De vergunning voor een inrichting vervalt:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.24
  - number: 5.24.1.a
    text: |-
      indien de inrichting niet binnen drie jaar nadat de vergunning onherroepelijk is geworden, is voltooid en in
      werking gebracht;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.24
  - number: 5.24.1.b
    text: |-
      indien de inrichting een stortplaats is en deze krachtens [artikel 5.35][ref1] voor gesloten in verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.24.2
    text: |-
      Indien kan worden verwacht dat de inrichting niet binnen de in het eerste lid, onderdeel a, bedoelde termijn kan
      worden voltooid en in werking gebracht, kan in de vergunning een andere termijn worden vastgesteld, die daarvoor in
      de plaats treedt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.24
  - number: 5.25.1
    text: |-
      Een voor een inrichting verleende vergunning geldt tevens voor veranderingen van de inrichting of van de werking
      daarvan die niet in overeenstemming zijn met de voor de inrichting verleende vergunning of de daaraan verbonden
      beperkingen en voorschriften, maar die niet leiden tot andere of grotere nadelige gevolgen voor het milieu dan die
      de inrichting ingevolge de vergunning en de daaraan verbonden beperkingen en voorschriften mag veroorzaken, onder
      voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.1.a
    text: deze veranderingen niet leiden tot een andere inrichting dan waarvoor vergunning is verleend;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.1.b
    text: |-
      het voornemen tot het uitvoeren van de verandering door de vergunninghouder schriftelijk overeenkomstig de
      krachtens het zesde lid, onderdeel a, gestelde regels aan het bevoegd gezag is gemeld, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.1.c
    text: |-
      het bevoegd gezag aan de vergunninghouder schriftelijk heeft verklaard dat de voorgenomen verandering voldoet
      aan de aanhef en onderdeel a en de verandering naar zijn oordeel geen aanleiding geeft tot toepassing van de
      [artikelen 5.28][ref1], [5.29][ref2] of [5.31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.25.2
    text: |-
      Het eerste lid is niet van toepassing op veranderingen ten aanzien waarvan, indien zij vergunningplichtig
      zouden zijn geweest, bij de voorbereiding van de besluiten ter zake, een milieueffectrapport als bedoeld in
      [hoofdstuk 7][ref1] had moeten worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '7'
  - number: 5.25.3
    text: |-
      Een besluit inzake een verklaring als bedoeld in het eerste lid, onderdeel c, wordt zo spoedig mogelijk, doch
      uiterlijk zes weken na ontvangst van de melding, bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.4
    text: |-
      Zo spoedig mogelijk, doch uiterlijk twee weken na de bekendmaking van de verklaring, bedoeld in het eerste
      lid, onderdeel c, geeft het bevoegd gezag openbaar kennis daarvan. Indien de verklaring betrekking heeft op een
      inrichting die behoort tot een krachtens [artikel 5.10, eerste lid][ref1], aangewezen categorie, zendt het bevoegd
      gezag bovendien een afschrift van de melding en de verklaring aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.25.5
    text: |-
      Het bevoegd gezag geeft een ieder desgevraagd kosteloos inzage in de melding en de daarbij behorende stukken en
      verstrekt daarvan desgevraagd tegen betaling van de kosten een afschrift.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.6
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.6.a
    text: de gegevens die bij de melding moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.25.6.b
    text: de openbare kennisgeving van de verklaring.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.25
  - number: 5.26.1
    text: |-
      Een voor een inrichting verleende vergunning geldt voor een ieder die de inrichting drijft. Degene die de
      inrichting drijft, draagt er zorg voor dat de aan de vergunning verbonden voorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.26
  - number: 5.26.2
    text: |-
      Indien een vergunning zal gaan gelden voor een ander dan de vergunninghouder, meldt de vergunninghouder dat
      ten minste een maand voordien aan het bevoegd gezag, onder vermelding van de bij algemene maatregel van bestuur
      aangegeven gegevens.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.26
  - number: 5.26.3
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van gevallen worden aangegeven, waarin de vergunning slechts
      geldt voor degene aan wie zij is verleend. Daarbij kan tevens worden bepaald dat in daarbij aangegeven categorieën
      van gevallen:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.26
  - number: 5.26.3.a
    text: |-
      de vergunning nog gedurende een daarbij aangegeven termijn blijft gelden voor rechtsopvolgers van degene aan wie
      zij is verleend;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.26
  - number: 5.26.3.b
    text: |-
      de vergunning ook geldt voor een rechtspersoon, aan wie zij is overgedragen door een andere rechtspersoon, indien
      daarvoor door het bevoegd gezag toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.26
  - number: 5.27.1
    text: |-
      Indien met betrekking tot een inrichting waarvoor de bij of krachtens [artikel 5.1, tweede lid][ref1], gestelde
      verboden niet gelden, die verboden op enig tijdstip gaan gelden, kan die inrichting in afwijking van die bepaling
      zonder vergunning in werking worden gehouden tot twaalf weken na dat tijdstip en, indien binnen deze termijn een
      aanvraag om de krachtens die bepaling vereiste vergunning is ingediend, vervolgens tot acht weken na het tijdstip
      waarop de beschikking op die aanvraag in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.27.2
    text: |-
      Indien zodanige verboden gaan gelden ten gevolge van een verandering van de inrichting of van de werking daarvan,
      is het eerste lid niet van toepassing, voor zover het die verandering betreft.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.27
  - number: 5.27.3
    text: |-
      Indien de bij of krachtens [artikel 5.1, tweede lid][ref1], gestelde verboden met betrekking tot de inrichting
      niet golden, blijven de voorschriften die krachtens een algemene maatregel van bestuur krachtens artikel 5.1,
      eerste lid, voor de inrichting golden onmiddellijk voor het gaan gelden van die verboden, voor de inrichting van
      toepassing gedurende de periode waarin de inrichting ingevolge het eerste lid zonder vergunning in werking mag
      worden gehouden, behoudens voor zover het veranderingen als bedoeld in het tweede lid betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.27
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.28.1
    text: |-
      Het bevoegd gezag beziet regelmatig of de beperkingen waaronder een vergunning is verleend, en de voorschriften
      die aan een vergunning zijn verbonden, nog toereikend zijn gezien de ontwikkelingen op het gebied van de technische
      mogelijkheden tot bescherming van het milieu en de ontwikkelingen met betrekking tot de kwaliteit van het milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.28
  - number: 5.28.2
    text: |-
      Het bevoegd gezag wijzigt de beperkingen waaronder de vergunning is verleend en de voorschriften die daaraan zijn
      verbonden, vult deze aan of trekt ze in, dan wel brengt alsnog beperkingen aan, of verbindt alsnog voorschriften
      aan de vergunning, voor zover blijkt dat de nadelige gevolgen die de inrichting voor het milieu veroorzaakt,
      gezien de ontwikkeling van de technische mogelijkheden tot bescherming van het milieu verder kunnen, of, gezien de
      ontwikkeling van de kwaliteit van het milieu, verder moeten worden beperkt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.28
  - number: 5.28.3
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van de beperkingen en voorschriften zijn de
      [artikelen 5.10 tot en met 5.23][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.28
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.29.1
    text: |-
      Het bevoegd gezag kan beperkingen waaronder een vergunning is verleend, en voorschriften die daaraan zijn
      verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen of voorschriften aan een
      vergunning verbinden in het belang van de bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.29
  - number: 5.29.2
    text: |-
      Een belanghebbende, met uitzondering van de vergunninghouder, kan het bevoegd gezag verzoeken een vergunning in het
      belang van de bescherming van het milieu met toepassing van het eerste lid te wijzigen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.29
  - number: 5.29.3
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van de beperkingen en voorschriften zijn de
      [artikelen 5.10 tot en met 5.23][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.30.1
    text: |-
      Op aanvraag van de vergunninghouder kan het bevoegd gezag beperkingen waaronder een vergunning is verleend, en
      voorschriften die daaraan zijn verbonden, wijzigen, aanvullen of intrekken, dan wel alsnog beperkingen aanbrengen
      of voorschriften aan een vergunning verbinden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.30
  - number: 5.30.2
    text: |-
      Met betrekking tot de beslissing ter zake en de inhoud van die beperkingen en voorschriften zijn de
      [artikelen 5.10 tot en met 5.23][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.30
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.1
    text: |-
      Het bevoegd gezag kan, onverminderd het in de [artikelen 5.33][ref1] en [10.7][ref2] bepaalde, een vergunning voor
      een inrichting geheel of gedeeltelijk intrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 5.31.1.a
    text: |-
      indien de inrichting ontoelaatbaar nadelige gevolgen voor het milieu veroorzaakt en toepassing van
      [artikel 5.29][ref1] redelijkerwijs daarvoor geen oplossing biedt;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.1.b
    text: indien dit in het belang van een doelmatig beheer van afvalstoffen noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.1.c
    text: indien gedurende drie jaar geen handelingen zijn verricht met gebruikmaking van de vergunning;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.1.d
    text: indien de inrichting geheel of gedeeltelijk is verwoest;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.1.e
    text: |-
      indien, in gevallen als aangegeven krachtens [artikel 5.26, derde lid][ref1], de vergunninghouder niet meer degene
      is, die de inrichting drijft;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.2
    text: 'Het bevoegd gezag trekt de vergunning in:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.2.a
    text: |-
      indien door toepassing van [artikel 5.28, tweede lid][ref1], redelijkerwijs niet kan worden bereikt dat in de
      inrichting ten minste de voor de inrichting in aanmerking komende beste beschikbare technieken worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.2.b
    text: |-
      voor zover regels vastgesteld bij algemene maatregel van bestuur ter uitvoering van een voor de openbare lichamen
      verbindend verdrag of een voor de openbare lichamen verbindend besluit van een volkenrechtelijke organisatie,
      hiertoe verplichten.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.3
    text: |-
      Een belanghebbende, met uitzondering van de vergunninghouder, kan het bevoegd gezag verzoeken een vergunning met
      toepassing van het eerste lid in te trekken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.4
    text: |-
      Met betrekking tot een beslissing als bedoeld in het eerste lid zijn de [artikelen 5.10 tot en met 5.12][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.5
    text: |-
      In een geval als aangegeven bij of krachtens [artikel 5.21][ref1] kan een voorschrift overeenkomstig de betrokken
      algemene maatregel van bestuur aan de beschikking tot intrekking worden verbonden. Artikel 5.21, vierde lid, is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.31.6
    text: |-
      In de beschikking tot intrekking kan worden bepaald dat een voorschrift als bedoeld in het vijfde lid, dan wel
      daarbij aangewezen aan de vergunning verbonden voorschriften gedurende een daarbij aan te geven termijn blijven
      gelden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
  - number: 5.31.7
    text: |-
      Het bevoegd gezag gaat tot intrekking van een vergunning op grond van het eerste lid, onderdeel c, d of e, of het
      tweede lid niet over zonder de vergunninghouder in de gelegenheid te hebben gesteld binnen een termijn van zes
      weken schriftelijk of mondeling zienswijzen over de intrekking naar voren te brengen. Van de beschikking wordt
      mededeling gedaan door toezending daarvan aan de adviseurs, bedoeld in [artikel 5.10, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.32.1
    text: |-
      Het bevoegd gezag kan de vergunning geheel of gedeeltelijk intrekken op verzoek van de vergunninghouder, indien het
      belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.32
  - number: 5.32.2
    text: |-
      Met betrekking tot de beslissing ter zake zijn de [artikelen 5.11][ref1] en [5.12][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: 5.32.3
    text: |-
      [Artikel 5.31, vijfde en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.41'
    text: |-
      De voordracht voor een krachtens [artikel 5.1][ref1] vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 7.1.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden activiteiten aangewezen die:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.1.a
    text: belangrijke nadelige gevolgen kunnen hebben voor het milieu;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.1.b
    text: |-
      ten aanzien waarvan het bevoegd gezag moet beoordelen of zij vanwege de bijzondere omstandigheden waaronder zij
      worden verricht belangrijke nadelige gevolgen voor het milieu kunnen hebben.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden categorieën van besluiten omtrent de activiteiten, bedoeld
      in het eerste lid, onderdeel a, aangewezen, waarvoor een milieueffectrapport wordt gemaakt alvorens het bevoegd
      gezag het besluit neemt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden categorieën van besluiten omtrent de activiteiten, bedoeld
      in het eerste lid, onderdeel b, aangewezen, waarvan het bevoegd gezag moet beoordelen of deze activiteiten vanwege
      de bijzondere omstandigheden waaronder ze verricht worden belangrijke nadelige gevolgen voor het milieu kunnen
      hebben, en indien dat het geval is, waarvoor een milieueffectrapport wordt gemaakt alvorens het bevoegd gezag het
      besluit neemt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden plannen met betrekking tot de activiteiten, bedoeld in het
      eerste lid, onderdeel a, aangewezen, waarvoor bij de voorbereiding ervan een milieueffectrapport wordt gemaakt
      indien het plan het kader vormt voor een besluit als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.5
    text: 'Geen milieueffectrapport hoeft te worden overgelegd indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.5.a
    text: |-
      voor de voorgenomen activiteit of een activiteit waarvan de voorgenomen activiteit een herhaling of voortzetting
      is, of voor het plan, reeds eerder een milieueffectrapport is gemaakt, en een nieuw milieueffectrapport
      redelijkerwijs geen relevante nieuwe gegevens kan bevatten, of
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.5.b
    text: |-
      de activiteit waarvoor het milieueffectrapport moet worden gemaakt, naar het oordeel van Onze Minister in het
      algemeen belang onverwijld moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.6
    text: 'Een besluit als bedoeld in het vijfde lid, onderdeel b, bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.6.a
    text: een beschrijving van de voorgenomen activiteit;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.6.b
    text: een beschrijving van de omstandigheden waaronder de activiteit zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.6.c
    text: de redenen voor het besluit, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.6.d
    text: een aanduiding van de mogelijke belangrijke nadelige gevolgen voor het milieu.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.1.7
    text: |-
      Ingeval ter zake van een activiteit tegelijkertijd een besluit en een plan worden voorbereid en dat plan
      uitsluitend wordt voorbereid met het oog op de inpassing van die activiteit in dat plan, wordt ter voorbereiding
      van dat besluit en dat plan één milieueffectrapport gemaakt. Het milieueffectrapport wordt voorbereid met
      toepassing van [paragraaf 7.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.1.8
    text: |-
      Uiterlijk twee weken na het nemen van het besluit, bedoeld in het vijfde lid, onderdeel b, doet het bevoegd
      gezag gelijktijdig mededeling van dat besluit door kennisgeving in een of meer plaatselijke dagbladen, in de
      Staatscourant en op de voor publicatie van officiële mededelingen gebruikelijke wijze, en wordt een exemplaar van
      dat besluit ter inzage gelegd, ten aanzien waarvan in de kennisgeving de plaats, het tijdstip en de uren worden
      vermeld.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.1
  - number: 7.2.1
    text: |-
      In gevallen waarin een besluit wordt genomen op verzoek van degene die de betrokken activiteit onderneemt, maakt
      deze het milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.2
  - number: 7.2.2
    text: In andere dan de in het eerste lid bedoelde gevallen maakt het bevoegd gezag het milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.2
  - number: 7.3.1
    text: 'Een milieueffectrapport dat betrekking heeft op een besluit bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.a
    text: een beschrijving van hetgeen met de voorgenomen activiteit wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.b
    text: |-
      een beschrijving van de voorgenomen activiteit en van de wijze waarop zij zal worden uitgevoerd, alsmede van de
      alternatieven daarvoor, die redelijkerwijs in beschouwing dienen te worden genomen, en de motivering van de keuze
      voor de in beschouwing genomen alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.c
    text: |-
      een aanduiding van het besluit of de besluiten bij de voorbereiding waarvan het milieueffectrapport wordt gemaakt,
      en een overzicht van de eerder genomen beslissingen van bestuursorganen, die betrekking hebben op de voorgenomen
      activiteit en de beschreven alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.d
    text: |-
      een beschrijving van de bestaande toestand van het milieu, voor zover de voorgenomen activiteit of de beschreven
      alternatieven daarvoor gevolgen kunnen hebben, alsmede van de te verwachten ontwikkeling van dat milieu, indien die
      activiteit noch de alternatieven worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.e
    text: |-
      een beschrijving van de gevolgen voor het milieu, die de voorgenomen activiteit, onderscheidenlijk de beschreven
      alternatieven kunnen hebben, alsmede een motivering van de wijze waarop deze gevolgen zijn bepaald en beschreven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.f
    text: |-
      een vergelijking van de ingevolge onderdeel d beschreven te verwachten ontwikkeling van het milieu met de
      beschreven mogelijke gevolgen voor het milieu van de voorgenomen activiteit, alsmede met de beschreven mogelijke
      gevolgen voor het milieu van elk der in beschouwing genomen alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.g
    text: |-
      een beschrijving van de maatregelen om belangrijke nadelige milieueffecten van de activiteit te voorkomen, te
      beperken of zoveel mogelijk teniet te doen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.h
    text: |-
      een overzicht van de leemten in de beschrijvingen, bedoeld in de onderdelen d en e, ten gevolge van het ontbreken
      van de benodigde gegevens;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.1.i
    text: |-
      een samenvatting die aan een algemeen publiek voldoende inzicht geeft voor de beoordeling van het
      milieueffectrapport en van de daarin beschreven mogelijke gevolgen voor het milieu van de voorgenomen activiteit en
      van de beschreven alternatieven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot de wijze waarop de
      gegevens, bedoeld in het eerste lid, worden bepaald en beschreven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Degene die een aangewezen activiteit als bedoeld in [artikel 7.1, eerste lid, onderdeel a][ref1], wil ondernemen en
      voornemens is een aanvraag in te dienen tot het nemen van een besluit als bedoeld in artikel 7.1, tweede lid, deelt
      dat voornemen schriftelijk mee aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.4.2
    text: |-
      Op verzoek van de aanvrager kan het bevoegd gezag advies uitbrengen inzake de reikwijdte en het detailniveau van de
      informatie ten behoeve van een milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.4
  - number: 7.4.3
    text: Bij afwezigheid van een verzoek als bedoeld in het tweede lid, kan het bevoegd gezag ambtshalve advies uitbrengen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.4
  - number: 7.4.4
    text: |-
      Het bevoegd gezag geeft uiterlijk acht weken na ontvangst van het verzoek dan wel bij ontstentenis daarvan
      uiterlijk acht weken na de mededeling van het voornemen, een advies inzake de reikwijdte en het detailniveau van de
      informatie ten behoeve van een milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.4
  - number: 7.5.1
    text: |-
      Degene die een aangewezen activiteit als bedoeld in [artikel 7.1, eerste lid, onderdeel b][ref1], wil ondernemen en
      voornemens is een aanvraag in te dienen tot het nemen van een besluit als bedoeld in artikel 7.1, derde lid, deelt
      dat schriftelijk mee aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.5.2
    text: |-
      Het bevoegd gezag neemt uiterlijk acht weken na de datum van ontvangst een beslissing omtrent de vraag of bij de
      voorbereiding van het besluit, vanwege de belangrijke nadelige gevolgen die de voorgenomen activiteit voor het
      milieu kan hebben, een milieueffectrapport moet worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.5
  - number: 7.5.3
    text: |-
      Indien het bevoegd gezag oordeelt dat een milieueffectrapport moet worden gemaakt, brengt het bevoegd gezag
      samen met de beslissing advies uit inzake de reikwijdte en het detailniveau van de informatie ten behoeve van een
      milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.5
  - number: 7.6.1
    text: |-
      Een milieueffectrapport dat betrekking heeft op een besluit, wordt samen met de aanvraag aan het bevoegd gezag
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.2
    text: |-
      Het bevoegd gezag geeft kennis van de aanvraag en het milieueffectrapport in één of meer plaatselijke dagbladen en
      voorts op de voor publicatie van officiële mededelingen gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.3
    text: 'In de kennisgeving wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.3.a
    text: |-
      dat de stukken betreffende de aanvraag en het milieueffectrapport openbaar zullen worden gemaakt, en waar en
      wanneer,
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.3.b
    text: |-
      dat er gelegenheid wordt geboden zienswijzen over de aanvraag en het erbij behorende milieueffectrapport naar voren
      te brengen, aan wie, op welke wijze en binnen welke termijn, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.3.c
    text: |-
      of en welke onafhankelijke instantie in de gelegenheid wordt gesteld advies uit te brengen over de aanvraag en het
      erbij behorende milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: 7.6.4
    text: |-
      Indien er een onafhankelijke instantie advies zal uitbrengen, zendt het bevoegd gezag een exemplaar van de aanvraag
      en het erbij behorende milieueffectrapport onverwijld aan de onafhankelijke instantie, bedoeld in het derde lid,
      onderdeel c. Deze onafhankelijke instantie brengt binnen acht weken na de kennisgeving, bedoeld in het tweede lid,
      haar advies uit.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.6
  - number: '7.7'
    text: |-
      Het bevoegd gezag laat een verzoek tot het nemen van een besluit waarvoor een milieueffectrapport moet worden
      opgesteld buiten behandeling indien:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.7
  - number: 7.7.a
    text: bij het indienen van de aanvraag geen milieueffectrapport is overlegd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.7
  - number: 7.7.b
    text: |-
      het overgelegde milieueffectrapport niet voldoet aan [artikel 7.3][ref1], dan wel onjuistheden bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '7.8'
    text: 'In het besluit wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.8
  - number: 7.8.a
    text: |-
      de wijze waarop rekening is gehouden met de in het milieueffectrapport beschreven mogelijke gevolgen voor het
      milieu van de activiteit waarop het besluit betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.8
  - number: 7.8.b
    text: hetgeen is overwogen omtrent de in het milieueffectrapport beschreven alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.8
  - number: 7.8.c
    text: |-
      hetgeen is overwogen omtrent de overeenkomstig [artikel 7.6, derde lid, onderdeel b][ref1], naar voren gebrachte
      zienswijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.8.d
    text: |-
      indien er een advies, als bedoeld in [artikel 7.6, vierde lid][ref1], is uitgebracht, hetgeen is overwogen omtrent
      dit advies.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.9.1
    text: |-
      Het milieueffectrapport dat betrekking heeft op een plan als bedoeld in [artikel 7.1, vierde lid][ref1], wordt
      opgesteld door het bevoegd gezag en bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.9.1.a
    text: een beschrijving van hetgeen met de voorgenomen activiteit wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.b
    text: |-
      een beschrijving van de voorgenomen activiteit, alsmede van de alternatieven daarvoor, die redelijkerwijs in
      beschouwing dienen te worden genomen, en de motivering van de keuze voor de in beschouwing genomen alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.c
    text: |-
      een overzicht van eerder vastgestelde plannen die betrekking hebben op de voorgenomen activiteit en de beschreven
      alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.d
    text: |-
      een beschrijving van de bestaande toestand van het milieu, voor zover de voorgenomen activiteit of de beschreven
      alternatieven daarvoor gevolgen kunnen hebben, alsmede van de te verwachten ontwikkeling van dat milieu, indien die
      activiteit noch de alternatieven worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.e
    text: |-
      een beschrijving van de gevolgen voor het milieu, die de voorgenomen activiteit, onderscheidenlijk de beschreven
      alternatieven kunnen hebben, alsmede een motivering van de wijze waarop deze gevolgen zijn bepaald en beschreven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.f
    text: |-
      een vergelijking van de ingevolge onderdeel d beschreven te verwachten ontwikkeling van het milieu met de
      beschreven mogelijke gevolgen voor het milieu van de voorgenomen activiteit, alsmede met de beschreven mogelijke
      gevolgen voor het milieu van elk der in beschouwing genomen alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.g
    text: |-
      een beschrijving van de maatregelen om belangrijke nadelige gevolgen voor het milieu van de activiteit te
      voorkomen, te beperken of zoveel mogelijk teniet te doen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.h
    text: |-
      een overzicht van de leemten in de beschrijvingen, bedoeld in de onderdelen d en e, ten gevolge van het ontbreken
      van de benodigde gegevens;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.1.i
    text: |-
      een samenvatting die aan een algemeen publiek voldoende inzicht geeft voor de beoordeling van het
      milieueffectrapport en van de daarin beschreven mogelijke gevolgen voor het milieu van de voorgenomen activiteit en
      van de beschreven alternatieven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: 7.9.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot de wijze waarop de
      in het eerste lid bedoelde gegevens worden bepaald en beschreven.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.9
  - number: '7.10'
    text: |-
      Alvorens het milieueffectrapport op te stellen, raadpleegt het bevoegd gezag de adviseurs en de bestuursorganen die
      ingevolge het wettelijk voorschrift waarop het plan berust bij de voorbereiding van het plan worden betrokken over
      de reikwijdte en het detailniveau van de informatie die gericht is op wat relevant is voor het plan en die op grond
      van [artikel 7.9][ref1] in het milieueffectrapport moet worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.11.1
    text: |-
      Het bevoegd gezag geeft kennis van het plan en het milieueffectrapport in één of meer plaatselijke dagbladen en
      voorts op de voor publicatie van officiële mededelingen gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: 7.11.2
    text: 'In de kennisgeving wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: 7.11.2.a
    text: |-
      dat de stukken betreffende het ontwerp van het plan en het milieueffectrapport openbaar zullen worden gemaakt, en
      waar en wanneer,
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: 7.11.2.b
    text: |-
      dat er gelegenheid wordt geboden zienswijzen naar voren te brengen, aan wie, op welke wijze en binnen welke
      termijn, en
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: 7.11.2.c
    text: |-
      of en welke onafhankelijke instantie in de gelegenheid wordt gesteld advies uit te brengen over het ontwerp van het
      plan en het daarbij behorende milieueffectrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: 7.11.3
    text: |-
      Indien er een onafhankelijke instantie advies zal uitbrengen, zendt het bevoegd gezag een exemplaar van het ontwerp
      van het plan en het erbij behorende milieueffectrapport onverwijld aan de onafhankelijke instantie, bedoeld in het
      tweede lid, onderdeel c. Deze onafhankelijke instantie brengt binnen acht weken na de kennisgeving, bedoeld in het
      eerste lid, haar advies uit.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.11
  - number: '7.12'
    text: |-
      Het bevoegd gezag stelt een plan als bedoeld in [artikel 7.1, vierde lid][ref1], niet vast:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.12
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.12.a
    text: dan nadat een milieueffectrapport is gemaakt;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.12
  - number: 7.12.b
    text: |-
      indien het plan ten opzichte van het ontwerp van dat plan zodanig is gewijzigd dat de gegevens die in het
      milieueffectrapport zijn opgenomen redelijkerwijs niet meer aan het plan ten grondslag kunnen worden gelegd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.12
  - number: '7.13'
    text: 'Bij de vaststelling van het plan wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.13
  - number: 7.13.a
    text: |-
      de wijze waarop rekening is gehouden met de in het milieueffectrapport beschreven gevolgen voor het milieu van de
      activiteit waarop het plan betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.13
  - number: 7.13.b
    text: hetgeen is overwogen omtrent de in het milieueffectrapport beschreven alternatieven;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.13
  - number: 7.13.c
    text: |-
      hetgeen is overwogen omtrent de overeenkomstig [artikel 7.11, tweede lid, onderdeel b][ref1], naar voren gebrachte
      zienswijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.13.d
    text: |-
      indien er een advies als bedoeld in [artikel 7.11, derde lid][ref1], is uitgebracht, hetgeen overwogen is omtrent
      dit advies.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel7
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 8.1.1
    text: |-
      Degene die een inrichting drijft, treft alle maatregelen die nodig zijn om een ongewoon voorval te voorkomen en de
      gevolgen daarvan voor mens en milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Indien zich in een inrichting een ongewoon voorval voordoet of heeft voorgedaan, treft degene die de inrichting
      drijft, onmiddellijk de maatregelen die redelijkerwijs van hem kunnen worden verlangd, om de gevolgen van die
      gebeurtenis te voorkomen of, voor zover die gevolgen niet kunnen worden voorkomen, zoveel mogelijk te beperken en
      ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.1
  - number: 8.2.1
    text: |-
      Degene die een inrichting drijft, waarin zich een ongewoon voorval voordoet of heeft voorgedaan, meldt dit
      voorval zo spoedig mogelijk aan het bestuursorgaan dat bevoegd is tot het verlenen van de vergunning krachtens
      [artikel 5.1, tweede lid][ref1], indien het een inrichting betreft die bij of krachtens algemene maatregel
      van bestuur als bedoeld in artikel 5.1, eerste lid, is aangewezen, dan wel, in andere gevallen, aan het
      bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 8.2.2
    text: |-
      Het bevoegd gezag kan in een vergunning voor een inrichting of bij een maatwerkvoorschrift als bedoeld in
      [artikel 5.4][ref1] voor een ongewoon voorval, waarvan de nadelige gevolgen voor het milieu niet significant zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 8.2.2.a
    text: bepalen dat in afwijking van het eerste lid het voorval wordt geregistreerd;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.2.b
    text: |-
      voorschrijven binnen welke termijn het voorval wordt gemeld. Deze termijn kan afwijken van de verplichting, bedoeld
      in het eerste lid, om het voorval zo spoedig mogelijk te melden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.3
    text: Indien toepassing wordt gegeven aan het tweede lid, zijn het vierde en vijfde lid, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4
    text: |-
      In aanvulling op een melding als bedoeld in het eerste lid, verstrekt degene die een inrichting drijft, het bevoegd
      gezag tevens, zodra zij bekend zijn, de gegevens met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4.a
    text: de oorzaken van het ongewone voorval en de omstandigheden waaronder dit zich heeft voorgedaan;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4.b
    text: de ten gevolge van het ongewone voorval vrijgekomen stoffen, alsmede hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4.c
    text: |-
      andere gegevens die van belang zijn om de aard en de ernst van de gevolgen voor het milieu van het ongewone voorval
      te kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4.d
    text: |-
      de maatregelen die zijn genomen of worden overwogen om de gevolgen van het ongewone voorval te voorkomen, te
      beperken of ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.4.e
    text: de maatregelen die worden overwogen om te voorkomen dat een zodanig ongewoon voorval zich nogmaals kan voordoen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.5
    text: |-
      Het bevoegd gezag dat de melding, bedoeld in het eerste of vierde lid, ontvangt, geeft van die melding en de
      daarbij verstrekte gegevens onverwijld kennis aan de gezaghebber, de inspecteur en andere bestuursorganen of
      overheidsdiensten die direct belang hebben bij een onverwijlde mededeling.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.2.6
    text: Het bevoegd gezag kan nadere eisen stellen ter zake de melding, bedoeld in het eerste of vierde lid.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Indien door een activiteit een onmiddellijke dreiging van milieuschade ontstaat, treft degene die de activiteit
      verricht onmiddellijk de nodige preventieve maatregelen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.3
  - number: 8.3.2
    text: |-
      Indien door een activiteit milieuschade ontstaat, treft degene die de activiteit verricht elke haalbare maatregel
      om de betrokken verontreinigende stoffen of andere schadefactoren onmiddellijk onder controle te houden, in te
      perken, te verwijderen of anderszins te beheersen, teneinde verdere milieuschade en negatieve effecten op de
      menselijke gezondheid of verdere aantasting van functies te voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.3
  - number: 8.3.3
    text: |-
      Indien milieuschade of een onmiddellijke dreiging daarvan ontstaat, meldt degene die de activiteit onderneemt
      dit voorval zo spoedig mogelijk aan het bestuursorgaan dat bevoegd is tot het verlenen van de vergunning
      indien het een inrichting betreft die bij of krachtens algemene maatregel van bestuur als bedoeld in
      [artikel 5.1, tweede lid][ref1], is aangewezen, dan wel, in andere gevallen, aan het bestuurscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 8.3.4
    text: |-
      Het bevoegd gezag dat de melding ontvangt, geeft van die melding en de daarbij verstrekte gegevens onverwijld
      kennis aan de gezaghebber, de inspecteur en andere bestuursorganen of overheidsdiensten die direct belang hebben
      bij een onverwijlde mededeling.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Degene die een activiteit verricht waardoor milieuschade of een onmiddellijke dreiging daarvan wordt veroorzaakt,
      draagt de kosten voor de getroffen preventieve of herstelmaatregelen, tenzij hij bewijst dat de milieuschade of de
      onmiddellijke dreiging daarvan:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.1.a
    text: ondanks door hem getroffen passende veiligheidsmaatregelen door een derde is veroorzaakt, of
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.1.b
    text: |-
      het gevolg is van de opvolging van een dwingende opdracht of instructie van een bestuursorgaan, niet zijnde een
      opdracht of instructie naar aanleiding van een emissie of gebeurtenis die door hemzelf is veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.2
    text: |-
      In het geval een bestuursorgaan zelf maatregelen treft of de uitvoering daarvan opdraagt aan derden, verhaalt het
      de kosten op degene die de milieuschade of de dreiging daarvan heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.3
    text: 'Het bestuursorgaan, bedoeld in het tweede lid, kan afzien van kostenverhaal indien:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.3.a
    text: de verhaalkosten groter zijn dan het terug te vorderen bedrag, of
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.3.b
    text: niet kan worden vastgesteld wie de activiteit verricht.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: 8.4.4
    text: |-
      Voor de toepassing van dit artikel wordt onder kosten verstaan: kosten verbonden aan de toepassing van preventieve
      maatregelen of herstelmaatregelen, met inbegrip van ramingskosten van milieuschade, onmiddellijke dreiging van
      zulke schade en alternatieve maatregelen, alsook de administratieve, juridische en handhavingskosten, de kosten
      voor het vergaren van gegevens en andere algemene kosten, en de kosten in verband met monitoring en toezicht.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.4
  - number: '8.5'
    text: |-
      Degene die een inrichting drijft, treft alle maatregelen die redelijkerwijze mogelijk zijn om zware ongevallen te
      voorkomen en de gevolgen daarvan voor mens en milieu te beperken.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.5
  - number: 8.6.1
    text: |-
      Degene die een inrichting drijft die behoort tot één van de bij algemene maatregel van bestuur aangewezen
      categorieën, stelt een veiligheidsrapport op waarin het gevoerde beleid ter voorkoming van zware ongevallen,
      rekening houdend met de aanwezigheid en de omvang van de risico's, is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.6
  - number: 8.6.2
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.6
  - number: 8.6.2.a
    text: nadere regels worden gesteld omtrent de inhoud van het veiligheidsrapport, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.6
  - number: 8.6.2.b
    text: instanties worden aangewezen die het bevoegd gezag adviseren bij de beoordeling van het veiligheidsrapport.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.6
  - number: 8.6.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel8.6
  - number: 10.1.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde, zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren. Ambtenaren, ressorterende onder een ander dan zijn ministerie, wijst hij niet aan
      dan in overeenstemming met Onze Minister wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
  - number: 10.1.2
    text: |-
      Voor de krachtens het eerste lid aangewezen ambtenaren, ressorterende onder een ander ministerie dan dat van Onze
      Minister, worden regels betreffende de vervulling van hun in het eerste lid bedoelde taak niet gesteld dan in
      overeenstemming met Onze Minister wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de betrokken wet bepaalde binnen hun ambtsgebied zijn
      eveneens belast de bij besluit van het bestuurscollege aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
  - number: 10.1.4
    text: |-
      Bij een besluit als bedoeld in het eerste lid kan Onze Minister gevallen of categorieën van gevallen aanwijzen met
      betrekking waartoe, in afwijking van het derde lid, bij zijn besluit aangewezen ambtenaren uitsluitend belast zijn
      met het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
  - number: 10.1.5
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
  - number: 10.1.6
    text: |-
      Onze Minister kan ambtenaren aanwijzen ten behoeve van het toezicht op de uitvoering van de aan
      het bestuurscollege bij of krachtens deze wet opgedragen taken. Deze ambtenaren beschikken over
      de bevoegdheden van de [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref1],
      met dien verstande dat in [artikel 5.16a van die wet][ref2] voor «identiteitsbewijs als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref3]» wordt gelezen: identiteitsdocument als bedoeld
      in [artikel 2 van de Wet identificatieplicht BES][ref4]. De [artikelen 5:12][ref5], [5:13][ref6] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028575#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
