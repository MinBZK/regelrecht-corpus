  - number: 10.5a.1
    text: |-
      Onze Minister en het Bestuurscollege kunnen van de overtreder bij dwangbevel de verschuldigde kosten van
      bestuursdwang of de verschuldigde dwangsom, verhoogd met de op de invordering vallende kosten, invorderen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5a
  - number: 10.5a.2
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5a
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 10.5a.3
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      openbaar lichaam Bonaire, Sint Eustatius of Saba respectievelijk de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5a
  - number: 10.5a.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het openbaar lichaam Bonaire, Sint Eustatius of Saba
      respectievelijk de Staat der Nederlanden, kan de rechter de schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5a
  - number: 10.6.1
    text: |-
      De krachtens [artikel 10.1][ref1] aangewezen ambtenaren zijn voor de vervulling van hun taak bevoegd, met
      medeneming van de benodigde apparatuur, een woning of een tot woning bestemd gedeelte van een vaartuig binnen te
      treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0031218
        artikel: '10'
        hoofdstuk: '10'
        afdeling: '10.1'
  - number: 10.6.2
    text: |-
      Op het binnentreden, bedoeld in het eerste lid, is
      [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van overeenkomstige toepassing, met
      uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3], [157, tweede en derde lid][ref4],
      [158, eerste lid][ref5], met dien verstande dat de zinsnede «en zoveel mogelijk de grond van de verdenking»
      vervalt, en [160, eerste lid][ref6], en met dien verstande dat de machtiging wordt verleend door de gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
