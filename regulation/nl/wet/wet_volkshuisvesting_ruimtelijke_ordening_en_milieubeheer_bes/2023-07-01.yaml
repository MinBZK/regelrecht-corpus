  - number: 10.3.2
    text: |-
      De in het eerste lid, onderdelen b en c, bedoelde bedragen kunnen bij regeling van Onze Minister van Justitie en
      Veiligheid worden gewijzigd voor zover de consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.3
  - number: 10.4.1
    text: |-
      Onze Minister en het bestuurscollege zijn bevoegd tot het opleggen van een last onder bestuursdwang of een last
      onder dwangsom in gevallen waarin hen de zorg voor de bestuursrechtelijke handhaving van de betrokken bepalingen
      is opgedragen.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.4
  - number: 10.4.2
    text: |-
      Een besluit tot oplegging van een last onder bestuursdwang of oplegging van een last onder dwangsom gericht op de
      naleving van het bepaalde bij of krachtens [hoofdstuk 2][ref1], kan mede inhouden dat het bouwen, gebruik of slopen
      wordt gestaakt dan wel dat voorzieningen worden getroffen, met inbegrip van het slopen van een bouwwerk, gericht op
      het tegengaan van gevaar voor de gezondheid of veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0031218
        hoofdstuk: '2'
  - number: '10.5'
    text: |-
      Het bestuursorgaan zendt onverwijld een afschrift van de beschikking tot oplegging van een last onder
      bestuursdwang, tot oplegging van een last onder dwangsom of tot intrekking van zodanige beschikkingen dan wel van
      de beschikking tot intrekking van een vergunning of ontheffing aan:
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5
  - number: 10.5.a
    text: |-
      de inspecteur, voor beschikkingen als bedoeld in de [artikelen 4.3, eerste lid][ref1], [4.10, eerste lid][ref2],
      [5.6, eerste lid][ref3], en [6.12, eerste lid][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031218#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0031218#Artikel6
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel10.5
