  - number: 10.2.1.b
    text: |-
      de voorschriften die voor degene die een inrichting drijft, gelden op grond van [hoofdstuk 5][ref1] en
      [hoofdstuk 8][ref2] voor zover Onze Minister bevoegd is een vergunning krachtens [artikel 5.1, tweede lid][ref3],
      te verlenen dan wel Onze Minister het bestuursorgaan is waaraan de melding, bedoeld in [artikel 5.3][ref4] wordt
      gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Hoofdstuk8
