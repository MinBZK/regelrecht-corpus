preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de volkshuisvesting, de ruimtelijke
    ordening en de bescherming van het milieu in de openbare lichamen Bonaire, Sint-Eustatius en Saba regels te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Deze wet is van toepassing in de openbare lichamen Bonaire, Sint-Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.1
  - number: 1.2.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *activiteit:* beroepshalve of bedrijfsmatig
      verrichte activiteit, ongeacht het openbare of particuliere, winstgevende of niet-winstgevende karakter daarvan;
        - *afvalstoffen:* alle stoffen of voorwerpen waarvan de houder zich ontdoet, voornemens is zich te ontdoen of zich
      moet ontdoen met het oog op de verwijdering of de nuttige toepassing daarvan;
        - *afvalwater:* alle water waarvan de houder zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen;
        - *badinrichting:* een voor het publiek of voor personen, behorende tot bij algemene maatregel van bestuur
      aangewezen categorieën, toegankelijke plaats, welke is ingericht om te worden gebruikt voor het zwemmen of baden,
      tezamen met de daarbij behorende terreinen, gebouwen, getimmerten en uitrustingen;
        - *bedrijfsterrein:* een perceel waarop bedrijfsactiviteiten worden verricht door een inrichting, niet behorend tot
      de landbouwsector;
        - *beheer van afvalstoffen:* inzameling, vervoer, nuttige toepassing of verwijdering van afvalstoffen;
        - *beheer van afvalwater:* inzameling, transport, zuivering en verwijdering van afvalwater;
        - *belang van de bescherming van de bodem:* het belang van het voorkomen, beperken of ongedaan maken van
      veranderingen van hoedanigheden van de bodem, die een vermindering of bedreiging betekenen van de functionele
      eigenschappen die de bodem voor mens, plant of dier heeft;
        - *beschermde soorten:* de in de natuur levende dieren en planten beschermd bij of krachtens de
      [Wet grondslagen natuurbeheer en -bescherming BES][ref1];
        - *beste beschikbare technieken:* voor het bereiken van een hoog niveau van bescherming van het milieu meest
      doeltreffende technieken om de emissies en andere nadelige gevolgen voor het milieu, die een inrichting kan
      veroorzaken, te voorkomen of, indien dat niet mogelijk is, zoveel mogelijk te beperken, die – kosten en baten
      in aanmerking genomen – economisch en technisch haalbaar in de bedrijfstak waartoe de inrichting behoort, kunnen
      worden toegepast, en die voor degene die de inrichting drijft, redelijkerwijs te verkrijgen zijn, waarbij onder
      technieken mede wordt begrepen het ontwerp van de inrichting, de wijze waarop zij wordt gebouwd en onderhouden,
      alsmede de wijze van bedrijfsvoering en de wijze waarop de inrichting buiten gebruik wordt gesteld;
        - *bevoegd gezag:* bestuursorgaan dat bevoegd is tot het geven van een beschikking of het nemen van een ander
      besluit;
        - *bodem:* het vaste deel van de aarde met de zich daarin bevindende vloeibare en gasvormige bestanddelen en
      organismen;
        - *bouwen:* het plaatsen, het geheel of gedeeltelijk oprichten, vernieuwen of veranderen en het vergroten van een
      bouwwerk;
        - *degene die de activiteit verricht:* de natuurlijke persoon of de privaatrechtelijke of publiekrechtelijke
      rechtspersoon die de activiteit verricht of heeft verricht, regelt of heeft geregeld, of aan wie een
      doorslaggevende economische zeggenschap over het technisch functioneren van de activiteit is overgedragen, met
      inbegrip van de houder van een vergunning of toelating voor het verrichten van de activiteit en de persoon die de
      activiteit laat of heeft laten registreren of er kennisgeving van doet of heeft gedaan;
        - *ecosysteemfuncties:* functies die natuurlijke rijkdommen vervullen ten behoeve van andere natuurlijke rijkdommen
      of het publiek;
        - *emissie:* stoffen, trillingen, warmte, die of geluid dat direct of indirect vanuit een bron in de lucht, het
      water of de bodem worden, onderscheidenlijk wordt gebracht;
        - *emissiegrenswaarde:* massa gerelateerd aan bepaalde parameters, dan wel concentratie of niveau van een emissie
      uit een of meer bronnen, die gedurende een bepaalde periode niet mag worden overschreden;
        - *gebouw:* elk bouwwerk, dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten
      ruimte vormt;
        - *gevaarlijke afvalstoffen:* afvalstoffen als bedoeld in bijlage VIII bij het Verdrag van Bazel, die de
      eigenschappen bezitten, bedoeld in bijlage III bij dat verdrag;
        - *geval van verontreiniging:* geval van verontreiniging of dreigende verontreiniging van de bodem dat betrekking
      heeft op grondgebieden die vanwege die verontreiniging, de oorzaak of de gevolgen daarvan in technische,
      organisatorische en ruimtelijke zin met elkaar samenhangen;
        - *geval van ernstige verontreiniging:* geval van verontreiniging waarbij de bodem zodanig is of dreigt te worden
      verontreinigd, dat de functionele eigenschappen die de bodem voor mens, plant of dier heeft, ernstig zijn of
      dreigen te worden verminderd;
        - *herstelmaatregelen:* maatregelen of combinatie van maatregelen, met inbegrip van inperkende of tussentijdse
      maatregelen, gericht op herstel, rehabilitatie of vervanging van de aangetaste natuurlijke rijkdommen of
      ecosysteemfuncties;
        - *huishoudelijk afvalwater:* afvalwater dat overwegend afkomstig is van menselijke stofwisseling en huishoudelijke
      werkzaamheden;
        - *huisvestingsvergunning:* vergunning als bedoeld in [artikel 3.5, eerste lid][ref2];
        - *inrichting:* elke door de mens bedrijfsmatig of in een omvang alsof zij bedrijfsmatig was, ondernomen
      bedrijvigheid die binnen een zekere begrenzing pleegt te worden verricht;
        - *inspecteur:* als zodanig bij besluit van Onze Minister aangewezen ambtenaar;
        - *last onder bestuursdwang:* de herstelsanctie, inhoudende: a. een last tot geheel of gedeeltelijk herstel van de
      overtreding, en b. de bevoegdheid van het bestuursorgaan om de last door feitelijk handelen ten uitvoer te leggen,
      indien de last niet of niet tijdig wordt uitgevoerd;
        - *last onder dwangsom:* de herstelsanctie, inhoudende: a. een last tot geheel of gedeeltelijk herstel van
      de overtreding, en b. de verplichting tot betaling van een geldsom indien de last niet of niet tijdig wordt
      uitgevoerd;
        - a. elke vorm van schade, zijnde een direct of indirect optredende meetbare negatieve verandering, aan beschermde
      soorten of natuurlijke habitats die aanmerkelijke negatieve effecten heeft op het bereiken of handhaven van
      de gunstige staat van instandhouding van deze soorten of habitats; b. elke vorm van schade aan wateren die een
      aanmerkelijke negatieve invloed heeft op de ecologische, chemische of kwantitatieve toestand; c. elke vorm van
      bodemverontreiniging die een aanmerkelijk risico inhoudt voor negatieve effecten op de menselijke gezondheid,
      waarbij direct of indirect op, in of onder de bodem, stoffen, preparaten, organismen of micro-organismen gebracht
      zijn;
        - *natuurlijke habitats:* de gebieden beschermd bij of krachtens de
      [Wet grondslagen natuurbeheer en -bescherming BES][ref3];
        - *natuurlijke rijkdommen:* beschermde soorten, natuurlijke habitats, wateren of bodem;
        - *nuttige toepassing:* de bij ministeriële regeling als zodanig aangewezen activiteit;
        - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
        - *openbare lichamen:* openbare lichamen Bonaire, Sint-Eustatius en Saba;
        - *oppervlaktewaterlichaam:* samenhangend geheel van vrij aan het aardoppervlak voorkomend water, met daarin
      aanwezige stoffen, alsmede de bijbehorende bodem, oevers alsmede flora en fauna;
        - *overheidslichaam:* lichaam behorend tot de overheid waaraan rechtspersoonlijkheid is toegekend;
        - *preparaten:* mengsels of oplossingen van twee of meer stoffen;
        - *preventieve maatregelen:* maatregelen naar aanleiding van een gebeurtenis, handeling of nalatigheid waardoor
      een onmiddellijke dreiging van milieuschade is ontstaan, teneinde die schade te voorkomen of tot een minimum te
      beperken;
        - *saneren:* beperken en zoveel mogelijk ongedaan maken van verontreiniging en de directe gevolgen daarvan of van
      dreigende verontreiniging van de bodem;
        - *slopen:* afbreken van een bouwwerk of een gedeelte ervan;
        - *staat van bestemming:* staat waarnaar een overbrenging of een voorgenomen overbrenging van afvalstoffen
      plaatsvindt of zal plaatsvinden;
        - *staat van doorvoer:* staat, anders dan de staat van herkomst en de staat van bestemming, over het grondgebied
      waarvan een overbrenging of een voorgenomen overbrenging van afvalstoffen plaatsvindt of zal plaatsvinden;
        - *staat van herkomst:* staat van waaruit een overbrenging of een voorgenomen overbrenging van afvalstoffen
      plaatsvindt of zal plaatsvinden;
        - *stoffen:* chemische elementen en de verbindingen ervan, zoals deze voorkomen in natuurlijke toestand of bij de
      vervaardiging ontstaan, met inbegrip van alle additieven die nodig zijn voor het behoud van de stabiliteit ervan en
      alle onzuiverheden ten gevolge van het toegepaste procedé, doch met uitzondering van elk oplosmiddel dat kan worden
      afgescheiden zonder dat de stabiliteit van de stof wordt aangetast of de samenstelling ervan wordt gewijzigd;
        - *storten:* op of in de bodem brengen van afvalstoffen om deze daar te laten;
        - *stortplaats:* inrichting waar afvalstoffen worden gestort, dan wel het gedeelte van een inrichting, waar
      afvalstoffen worden gestort;
        - *toezichthouder:* een persoon, die op grond van [artikel 10.1][ref4], is belast met het houden van toezicht op de
      naleving van het bepaalde bij of krachtens deze wet;
        - *Verdrag van Bazel:* het op 22 maart 1989 te Bazel tot stand gekomen Verdrag inzake de beheersing van de
      grensoverschrijdende overbrenging van gevaarlijke afvalstoffen en de verwijdering ervan (Trb. 1990, 12), zoals
      gewijzigd op 29 oktober 2004 (Trb. 2006, 12);
        - *verwijdering:* bij ministeriële regeling als zodanig aangewezen handelingen;
        - *woonruimte:* besloten ruimte die, al dan niet tezamen met een of meer andere ruimten, bestemd of geschikt is
      voor bewoning door een huishouden;
        - *zwaar ongeval:* gebeurtenis als gevolg van onbeheersbare ontwikkelingen tijdens de bedrijfsuitoefening in een
      inrichting, waardoor hetzij onmiddellijk, hetzij na verloop van tijd ernstig gevaar voor de gezondheid van de
      mens binnen of buiten de inrichting of voor het milieu ontstaat en waarbij een of meer gevaarlijke stoffen zijn
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0028434
      [ref2]: https://wetten.overheid.nl/BWBR0031218#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028434
      [ref4]: https://wetten.overheid.nl/BWBR0031218#Artikel10
    url: https://wetten.overheid.nl/BWBR0031218/2023-07-01#Artikel1.2
