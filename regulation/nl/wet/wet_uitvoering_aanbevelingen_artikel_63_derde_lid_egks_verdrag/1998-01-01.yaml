preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een wettelijke grondslag te scheppen voor de
    uitvoering in Nederland van aanbevelingen als bedoeld in artikel 63, derde lid, van het Verdrag tot oprichting van
    de Europese Gemeenschap voor Kolen en Staal (Trb. 1951, 82);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder Onze Minister verstaan Onze Minister van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#Artikel1
  - number: '2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ter uitvoering van aanbevelingen, vastgesteld krachtens
      artikel 63, derde lid, of de artikelen 63, derde lid, en 95, eerste lid, te zamen, van het Verdrag tot oprichting
      van de Europese Gemeenschap voor Kolen en Staal (*Trb.* 1951, 82).
    url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Met het toezicht op de naleving van deze wet zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#Artikel3
    references:
      - id: ref1
