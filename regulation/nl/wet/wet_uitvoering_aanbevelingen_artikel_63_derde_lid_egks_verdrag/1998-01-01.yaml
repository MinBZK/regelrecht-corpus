        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '8'
    text: 'Deze wet kan worden aangehaald als: Wet uitvoering aanbevelingen artikel 63, derde lid, EGKS-verdrag.'
    url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003555/1998-01-01#Artikel9
