  - number: '2.4'
    text: |-
      De verplichting tot verzekering is geschorst, zolang een door een ander gesloten verzekering overeenkomstig
      de bepalingen van deze wet met betrekking tot het motorrijtuig van kracht is. De verplichting tot verzekering
      is echter niet geschorst gedurende de in [artikel 13, vierde lid][ref1], en de in [artikel 13][ref2], bedoelde
      periode. Hetzelfde geldt voor de periode die voortvloeit uit [artikel 13][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
    references:
      - id: ref1
