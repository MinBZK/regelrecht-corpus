        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: 13a
        hoofdstuk: '1'
  - number: '2.5'
    text: |-
      De verzekering moet zijn gesloten bij een verzekeraar die in het bezit is van een vergunning of heeft voldaan aan
      de ingevolge de [artikelen 37][ref1] of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2] vereiste procedure
      met betrekking tot een bijkantoor in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting
      naar Nederland betreft, heeft voldaan aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref3],
      [113, eerste, tweede of vierde lid][ref4], [116, eerste of derde lid][ref5], of
      [118, tweede, derde of vijfde lid, van die wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel111
