        artikel: '52'
  - number: '2.1'
    text: |-
      De bezitter van een motorrijtuig en degene aan wie het kenteken voor een motorrijtuig is opgegeven, zijn verplicht
      voor het motorrijtuig een verzekering te sluiten en in stand te houden welke aan de bij en krachtens deze wet
      gestelde bepalingen voldoet, indien dat motorrijtuig op een weg wordt geplaatst of daarmee op een weg wordt
      gereden, indien buiten een weg met dat motorrijtuig op een terrein aan het verkeer wordt deelgenomen of indien voor
      dat motorrijtuig een kentekenbewijs is afgegeven.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: '2.2'
    text: 'In afwijking van het vorige lid rust de verplichting tot verzekering niet op de bezitter, maar op de houder die:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: 2.2.a
    text: het motorrijtuig op grond van een overeenkomst van huurkoop onder zich heeft, of
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: 2.2.b
    text: het motorrijtuig in vruchtgebruik heeft, of
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: 2.2.c
    text: anderszins het motorrijtuig, anders dan als bezitter, tot duurzaam gebruik onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: '2.3'
    text: |-
      De verplichting tot verzekering met betrekking tot een motorrijtuig waarvoor een kentekenbewijs is afgegeven,
      wordt opgeheven, indien het motorrijtuig buiten gebruik wordt gesteld en gehouden door plaatsing daarvan buiten
      een weg, gevolgd door een door de verzekeraar overeenkomstig [artikel 13][ref1] aan de Dienst Wegverkeer, bedoeld
      in [artikel 4a van de Wegenverkeerswet 1994][ref2], gedane kennisgeving van schorsing van de verzekering wegens
      buitengebruikstelling van het motorrijtuig. De in de vorige zin bedoelde opheffing van de verzekeringsplicht
      eindigt, zodra de verzekeraar overeenkomstig [artikel 13][ref3] aan de Dienst Wegverkeer kennis heeft gegeven van
      de beëindiging van de schorsing, zodra het motorrijtuig zich op een weg bevindt of zodra het deelneemt aan het
      verkeer op een terrein. Bij of krachtens algemene maatregel van bestuur kunnen omtrent het in dit lid bepaalde
      nadere regels en voorwaarden worden gesteld. De in dit lid bedoelde opheffing van de verzekeringsplicht vindt
      slechts plaats, indien de geldigheid van het voor het desbetreffende motorrijtuig afgegeven kentekenbewijs is
      geschorst overeenkomstig [artikel 67 van de Wegenverkeerswet 1994][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
