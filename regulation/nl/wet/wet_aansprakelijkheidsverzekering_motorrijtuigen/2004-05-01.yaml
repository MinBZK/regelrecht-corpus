  - number: '2.6'
    text: |-
      Het eerste lid is niet van toepassing op motorrijtuigen die gewoonlijk in het buitenland zijn gestald, mits een
      voor dat doel door Onze Minister van Financiën erkend bureau, dat rechtspersoon met volledige rechtsbevoegdheid
      is, of groep van verzekeraars, dan wel een, bij algemene maatregel van bestuur daartoe erkende, in Nederland
      gevestigde buitenlandse instantie tegenover de benadeelden de verplichting op zich heeft genomen de schade, door
      die motorrijtuigen veroorzaakt, overeenkomstig de bepalingen van deze wet te vergoeden.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: '2.7'
    text: |-
      Voor de toepassing van deze wet wordt een motorrijtuig dat is voorzien van een kenteken geacht gewoonlijk
      in Nederland te zijn gestald. Als gewoonlijk in het buitenland te zijn gestald worden beschouwd de
      motorrijtuigen waarvoor een bijzonder kenteken met beperkte geldigheidsduur overeenkomstig een door
      Onze Minister van Verkeer en Waterstaat vastgesteld model is opgegeven, of die van de toepassing van
      [artikel 36, eerste lid, van de We genverkeerswet 1994][ref1] zijn uitgezonderd en waarvoor een militair
      registratienummer is opgegeven. De motorrijtuigen die in een ander land krachtens de aldaar geldende wettelijke
      regeling zijn geregistreerd of van een verzekeringsplaat of ander onderscheidingsteken zijn voorzien, worden
      eveneens geacht gewoonlijk in het buitenland te zijn gestald.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel36
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '36'
  - number: '2.8'
    text: |-
      Tot de motorrijtuigen met betrekking waartoe het bureau de in het zesde lid bedoelde verplichting op zich neemt,
      behoren in ieder geval de motorrijtuigen, welke gewoonlijk zijn gestald in een land dat ter uitvoering van deze
      bepaling bij algemene maatregel van bestuur is aangewezen, voor zover bij die maatregel daarvoor geen uitzondering
      is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel2
  - number: '2.9'
    text: |-
      De verzekeraars die in het bezit zijn van een vergunning of hebben voldaan aan de ingevolge de [artikelen 37][ref1]
      of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2] vereiste procedure met betrekking tot een bijkantoor
      in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting naar Nederland betreft, hebben voldaan
      aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref3], [113, eerste, tweede of vierde lid][ref4],
      [116, eerste of derde lid][ref5], of [118, tweede, derde of vijfde lid, van die wet][ref6], betalen jaarlijks
      aan het bureau, bedoeld in het zesde lid, de door het bureau te bepalen bijdragen, berekend op basis van
      de in Nederland geboekte premie of het aantal en de aard van de door ieder van hen in Nederland verzekerde
      motorrijtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
