preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met het op 7 januari 1955 te Brussel tussen Nederland,
    België en Luxemburg gesloten verdrag betreffende de verplichte aansprakelijkheidsverzekering in zake motorrijtuigen
    (Trb. 1955, nr. 16), en de aanvullende overeenkomst hierop van 3 juli 1956 (Trb. 1956, nr. 75) noodzakelijk, en
    ook overigens wenselijk is, een regeling te treffen omtrent de verplichte verzekering tegen burgerrechtelijke
    aansprakelijkheid waartoe motorrijtuigen aanleiding kunnen geven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden verstaan onder motorrijtuigen: alle rij- of voertuigen, bestemd
      om anders dan langs spoorstaven over de grond te worden voortbewogen uitsluitend of mede door een
      mechanische kracht, op of aan het rij- of voertuig zelf aanwezig dan wel door electrische tractie met
      stroomtoevoer van elders; als een deel daarvan wordt aangemerkt al hetgeen aan het rij- of voertuig is
      gekoppeld of na koppeling daarvan is losgemaakt of losgeraakt, zolang het nog niet buiten het verkeer
      tot stilstand is gekomen; verzekerden: zij wier aansprakelijkheid overeenkomstig de bepalingen van
      deze wet is gedekt; benadeelden: zij die schade hebben geleden welke grond oplevert voor toepassing van
      deze wet, alsmede hun rechtverkrijgenden; vergunning: een vergunning, die een verzekeringsonderneming
      ingevolge [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] behoeft voor de
      uitoefening van de branche Aansprakelijkheid motorrijtuigen; verzekeraar: de verzekeringsonderneming,
      die in het bezit is van een vergunning of heeft voldaan aan de ingevolge de [artikelen 37][ref2] of
      [38 van de Wet toezicht verzekeringsbedrijf 1993][ref3] vereiste procedure met betrekking tot een bijkantoor
      in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting naar Nederland betreft heeft voldaan
      aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref4], [113, eerste, tweede of vierde lid][ref5],
      [116, eerste of derde lid][ref6], of [118, tweede, derde of vijfde lid, van die wet][ref7], en het bureau, bedoeld
      in [artikel 2 zesde lid][ref8], dat is belast met de afwikkeling van de schade, welke in Nederland is veroorzaakt
      door motorrijtuigen die gewoonlijk in het buitenland zijn gestald, en van de schade, welke in een van de krachtens
      [artikel 3, derde lid][ref9], aangewezen landen is veroorzaakt door motorrijtuigen die gewoonlijk in Nederland zijn
      gestald; weg: een weg waarop de omschrijving van het begrip "wegen" in [artikel 1, eerste lid, onderdeel ][ref10]
      van toepassing is; onder "weg" wordt mede verstaan een vaartuig dat wordt gebruikt bij de uitoefening van een
      veerdienst; terrein: een terrein dat toegankelijk is voor het publiek of voor een zeker aantal personen die het
      recht hebben daar te komen; kenteken: een kenteken als bedoeld in [artikel 36 van de Wegenverkeerswet 1994][ref11];
      kentekenbewijs: een kentekenbewijs als bedoeld in [artikel 36 van de Wegenverkeerswet 1994][ref12].
      Waarborgfonds Motorverkeer en fonds: de krachtens [artikel 23, eerste lid][ref13], aangewezen
      rechtspersoon; gevaarlijke stof: een stof als bedoeld in [artikel 1210, onderdeel ][ref14]; gebeurtenis:
      een gebeurtenis als bedoeld in [artikel 1210, onderdeel ][ref15]; exploitant: een exploitant als bedoeld
      in [artikel 1210, onderdeel ][ref16]; lidstaat: een lidstaat van de Europese Unie; Informatiecentrum: de
      krachtens [artikel 27b][ref17], eerste lid, aangewezen rechtspersoon; Schadevergoedingsorgaan: de krachtens
      [artikel 27k, eerste lid][ref18], aangewezen rechtspersoon; schaderegelaar: de schaderegelaar, bedoeld in
      [artikel 52, eerste lid, onderdeel e, van de Wet toezicht verzekeringsbedrijf 1993][ref19].


