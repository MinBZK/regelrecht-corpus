  - number: '3.1'
    text: |-
      De verzekering moet dekken de burgerrechtelijke aansprakelijkheid, waartoe het motorrijtuig in het verkeer
      aanleiding kan geven, van iedere bezitter, houder en bestuurder van het verzekerde motorrijtuig, alsmede van
      degenen die daarmede worden vervoerd, zulks met uitzondering van de burgerrechtelijke aansprakelijkheid van hen
      die zich na het sluiten van de verzekering door diefstal of geweldpleging de macht over het motorrijtuig hebben
      verschaft en van hen die, dit wetende, dat motorrijtuig zonder geldige reden gebruiken.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3
  - number: '3.2'
    text: |-
      De verzekering moet de schade omvatten, welke aan personen en aan zaken wordt toegebracht door feiten die zijn
      voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing
      is. Hierin is begrepen de schade, toegebracht aan personen die onder welke titel ook, worden vervoerd door het
      motorrijtuig, dat de schade veroorzaakt; de zaken, door dat motorrijtuig vervoerd, kunnen van de verzekering worden
      uitgesloten, behoudens wanneer het betreft zaken, toebehorende aan personen, vervoerd krachtens een ingevolge de
      [Wet personenvervoer 2000][ref1] geldige vergunning. (*Stb*. 1987, 175)


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '3.3'
    text: |-
      De verzekering moet voorts de schade omvatten welke aan personen en zaken wordt toegebracht door feiten,
      voorgevallen in bij algemene maatregel van bestuur aangewezen landen. De hoogte van de dekking van de schade,
      die bedoeld in het tweede lid daaronder begrepen, wordt bepaald door de wetgeving van het land waar het feit
      is voorgevallen dan wel door de wetgeving van het land waar het motorrijtuig gewoonlijk is gestald, indien in
      laatstbedoeld land de dekking hoger is. Indien het bureau, bedoeld in [artikel 2 zesde lid][ref1], een zodanige
      schade heeft verrekend, heeft het voor het betaalde bedrag verhaal op degene op wie de verplichting tot verzekering
      rust, voor zover deze verplichting niet overeenkomstig het bepaalde in dit lid is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '3.4'
    text: |-
      In afwijking van het bepaalde in het derde lid moet ten aanzien van motorrijtuigen, als bedoeld in artikel 6 van
      de Richtlijn van de Raad van de Europese Gemeenschappen van 24 april 1972 inzake de onderlinge aanpassing van de
      wetgevingen der Lid-Staten betreffende de verzekering tegen de wettelijke aansprakelijkheid waartoe deelneming aan
      het verkeer van motorrijtuigen aanleiding kan geven en de controle op de verzekering tegen deze aansprakelijkheid
      (*Pb. EG*, 2 mei 1972, L 103), gewijzigd bij de Richtlijn van de Raad van 19 december 1972 (*Pb. EG*, 28 december
      1972, L 291, rectificatie *Pb. EG*, 23 maart 1973, L75), de verzekering de schade omvatten welke aan personen en
      zaken wordt toegebracht door feiten, voorgevallen op het grondgebied waar de Overeenkomst betreffende de Europese
      Economische Ruimte van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3
  - number: '3.5'
    text: |-
      De verzekering moet de burgerrechtelijke aansprakelijkheid voor de door het motorrijtuig veroorzaakte schade dekken
      zoals die aansprakelijkheid voortvloeit uit de toepasselijke wet.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3
  - number: 3a.1
    text: |-
      Indien het een motorrijtuig betreft waarvan het maximaal toelaatbare gewicht hoger is dan 3500
      kilogram, dient de verzekering voorts te dekken de aansprakelijkheid van de exploitant waartoe een
      gevaarlijke stof, aan boord van dat motorrijtuig, aanleiding kan geven en die is gebaseerd op de
      [eerste afdeling van de veertiende titel van Boek 8 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Afdeling1
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        afdeling: '1'
  - number: 3a.2
    text: |-
      De in het eerste lid bedoelde dekking moet zich uitstrekken tot de aansprakelijkheid voor de schade, bedoeld in
      [artikel 1210, onderdeel ][ref1], welke wordt toegebracht door gebeurtenissen die hebben plaatsgevonden op het
      grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is. Hierin is begrepen
      de schade, toegebracht aan personen die onder welke titel ook, worden vervoerd door het motorrijtuig dat de schade
      veroorzaakt; de zaken, door dat motorrijtuig vervoerd, kunnen van de verzekering worden uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1210
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1210'
  - number: 3a.3
    text: |-
      Dekking moet zich voorts uitstrekken tot de aansprakelijkheid voor de schade welke wordt toegebracht door
      gebeurtenissen die hebben plaatsgevonden in bij algemene maatregel van bestuur aangewezen landen. De hoogte van
      de dekking van de schade, die bedoeld in het tweede lid daaronder begrepen, wordt bepaald door de wetgeving van
      het land waar de gebeurtenis heeft plaatsgevonden dan wel door de wetgeving van het land waar het motorrijtuig
      gewoonlijk is gestald, indien in laatstbedoeld land de dekking hoger is. Indien het bureau, bedoeld in
      [artikel 2, zesde lid][ref1], een zodanige schade heeft verrekend, heeft het voor het betaalde bedrag verhaal op
      degene op wie de verplichting tot verzekering rust, voor zover deze verplichting niet overeenkomstig het bepaalde
      in dit lid is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 3a.4
    text: |-
      In afwijking van het bepaalde in het derde lid moet ten aanzien van motorrijtuigen, als bedoeld in het eerste
      lid en als bedoeld in artikel 6 van de [Richtlijn nr. 72/166/EEG](31972L0166) van de Raad van de Europese
      Gemeenschappen van 24 april 1972 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende de
      verzekering tegen de wettelijke aansprakelijkheid waartoe deelneming aan het verkeer van motorrijtuigen aanleiding
      kan geven en de controle op de verzekering tegen deze aansprakelijkheid (*PbEG* L 103), gewijzigd bij Richtlijn,
      nr. 72/430/EEG van de Raad van de Europese Gemeenschappen van 19 december 1972 (*PbEG* L 291, rectificatie *PbEG*
      1973, L 75), nadien gewijzigd bij Richtlijn, nr. 84/5/EEG van de Raad van de Europese Gemeenschappen van 30
      december 1983, (*PbEG* 1984, L 8), de verzekering de schade omvatten welke wordt toegebracht door gebeurtenissen
      die hebben plaatsgevonden op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3a
  - number: 3a.5
    text: |-
      De dekking moet zich uitstrekken tot de aansprakelijkheid voor de schade, bedoeld in
      [artikel 1210, onderdeel ][ref1], veroorzaakt door de gevaarlijke stof aan boord van het in het eerste lid bedoelde
      motorrijtuig, zoals die aansprakelijkheid voortvloeit uit de toepasselijke wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1210
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1210'
  - number: '4.1'
    text: |-
      De verzekering behoeft niet te dekken de aansprakelijkheid voor schade toegebracht aan de bestuurder van het
      motorrijtuig dat het ongeval veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel4
  - number: '4.2'
    text: |-
      Indien het een verzekering als bedoeld in [artikel 3][ref1] betreft,
      dient de verzekering tevens te dekken de aansprakelijkheid, bedoeld in de
      [eerste afdeling van de veertiende titel van Boek 8 van het Burgerlijk Wetboek][ref2], voor schade, toegebracht
      aan de bestuurder van het motorrijtuig aan boord waarvan zich de gevaarlijke stof bevindt die de gebeurtenis
      heeft veroorzaakt, indien die bestuurder uit hoofde van een arbeidsverhouding met de verzekeringsplichtige het
      motorrijtuig bestuurde, tenzij de verzekeringsplichtige een vennootschap onder firma, een besloten vennootschap of
      een naamloze vennootschap is waaraan de bestuurder van het motorrijtuig zelf leiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Afdeling1
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 3a
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005034
        afdeling: '1'
  - number: '4.3'
    text: |-
      Van de verzekering kan worden uitgesloten de schade die voortvloeit uit het deelnemen van het
      motorrijtuig aan snelheids-, regelmatigheids- of behendigheidsritten en -wedstrijden, waarvoor de in
      [artikel 148 van de Wegenverkeerswet 1994][ref1] bedoelde ontheffing is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel148
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '148'
  - number: '5'
    text: |-
      Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel5
  - number: '6.1'
    text: |-
      De benadeelde heeft jegens de verzekeraar door wie de aansprakelijkheid volgens deze wet is gedekt, een eigen recht
      op schadevergoeding. Dit eigen recht kan evenwel niet worden uitgeoefend indien een fonds of fondsen zijn gevormd
      overeenkomstig [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref1]. Het tenietgaan van zijn schuld aan de
      verzekerde bevrijdt de verzekeraar niet jegens de benadeelde, tenzij deze is schadeloos gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1220'
  - number: '6.2'
    text: |-
      Indien er bij een ongeval of een gebeurtenis meer dan een benadeelde is en het totaalbedrag van de verschuldigde
      schadeloosstellingen de verzekerde som overschrijdt, worden de rechten van de benadeelden tegen de verzekeraar
      naar evenredigheid teruggebracht tot het beloop van die som. Niettemin blijft de verzekeraar die, onbekend met
      het bestaan van vorderingen van andere benadeelden, te goeder trouw aan een benadeelde een groter bedrag dan
      het aan deze toekomende deel heeft uitgekeerd, jegens die anderen of, indien een fonds of fondsen zijn gevormd
      overeenkomstig [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref1], jegens degene die dat fonds of die
      fondsen heeft gevormd slechts gehouden tot het beloop van het overblijvende gedeelte van de verzekerde som.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1220'
  - number: '7.1'
    text: |-
      Voor de uitvoering van de bepalingen van deze wet kan de verzekeraar door de benadeelde worden gedagvaard, hetzij
      voor de rechter van de plaats van het feit, waaruit de schade is ontstaan, hetzij voor de rechter van de woonplaats
      van de benadeelde, hetzij voor de rechter van de zetel van de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel7
  - number: '7.2'
    text: |-
      De aansprakelijke persoon kan door de benadeelde worden gedagvaard, hetzij voor de rechter van de plaats van het
      feit, waaruit de schade is ontstaan, hetzij voor de rechter van de woonplaats van de benadeelde, hetzij voor de
      rechter van de woonplaats van de aansprakelijke persoon.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel7
  - number: '8'
    text: |-
      De verzekerden moeten van ieder ongeval en iedere gebeurtenis waarvan zij kennis dragen, mededeling doen aan
      de verzekeraar, indien bij dat ongeval of die gebeurtenis het verzekerde motorrijtuig is betrokken en schade is
      ontstaan tot welker dekking door verzekering deze wet verplicht. De verzekeringnemer moet aan de verzekeraar alle
      door de verzekeringsovereenkomst voorgeschreven inlichtingen en bescheiden verschaffen. De overige verzekerden
      moeten aan de verzekeraar op zijn verzoek alle nodige inlichtingen en bescheiden verschaffen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel8
  - number: '9.1'
    text: |-
      Aan een vonnis gewezen in een geschil ter zake van door een motorrijtuig veroorzaakte schade, komt tegenover de
      verzekeraar, de verzekerde of de benadeelde gezag van gewijsde toe, indien zij in het geding de positie van een
      procespartij hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel9
  - number: '9.2'
    text: |-
      Voorts kan het vonnis dat is gewezen in een geschil tussen de benadeelde en de verzekerde, worden tegengeworpen
      aan de verzekeraar, indien is komen vast te staan dat de laatste in feite de leiding van het geding op zich heeft
      genomen; aan de verzekeraar staat alsdan geen tegenbewijs open tegen de bij gewijsde als bewezen aangenomen feiten.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel9
  - number: '9.3'
    text: |-
      De verzekeraar kan de verzekerde in het geding roepen, dat door de benadeelde tegenover hem wordt ingesteld. De
      oproeping dient te geschieden door middel van dagvaarding voor het nemen van de conclusie van antwoord. De in het
      geding geroepene heeft de positie van een procespartij.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel9
  - number: '10.1'
    text: |-
      Een uit deze wet voortvloeiende rechtsvordering van de benadeelde tegen de verzekeraar verjaart door verloop van
      drie jaar te rekenen van het feit waaruit de schade is ontstaan.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel10
  - number: '10.2'
    text: |-
      In afwijking van het eerste lid verjaart een rechtsvordering tot vergoeding van schade als bedoeld in
      [artikel 1210, onderdeel ][ref1], van de benadeelde tegen de verzekeraar door verloop van drie jaren na de aanvang
      van de dag, volgende op die waarop de benadeelde bekend was of redelijkerwijze bekend had behoren te zijn met
      de schade en de daarvoor aansprakelijke persoon, en in ieder geval door verloop van tien jaren na de gebeurtenis
      waardoor de schade is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1210
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1210'
  - number: '10.3'
    text: |-
      Indien de gebeurtenis bestond uit een opeenvolging van feiten met dezelfde oorzaak, loopt de termijn van tien
      jaren, bedoeld in het tweede lid, vanaf de dag waarop het laatste van die feiten plaatsvond.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel10
  - number: '10.4'
    text: |-
      Handelingen die de verjaring van de rechtsvordering van een benadeelde tegen een verzekerde stuiten, stuiten tevens
      de verjaring van de rechtsvordering van die benadeelde tegen de verzekeraar. Handelingen die de verjaring van de
      rechtsvordering van een benadeelde tegen de verzekeraar stuiten, stuiten tevens de verjaring van de rechtsvordering
      van de benadeelde tegen de verzekerden.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel10
  - number: '10.5'
    text: |-
      De verjaring wordt ten opzichte van een verzekeraar gestuit door iedere onderhandeling tussen de verzekeraar en de
      benadeelde. Een nieuwe termijn van drie jaar begint te lopen te rekenen van het ogenblik waarop een van de partijen
      bij deurwaardersexploot of aangetekende brief aan de andere partij heeft kennisgegeven dat zij de onderhandelingen
      afbreekt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel10
  - number: '11.1'
    text: |-
      Geen uit de wettelijke bepalingen omtrent de verzekeringsovereenkomst of uit deze overeenkomst zelf voortvloeiende
      nietigheid, verweer of verval kan door een verzekeraar aan een benadeelde worden tegengeworpen. Het bepaalde in
      de vorige zin geldt niet met betrekking tot het bedrag, waarmede het van de verzekeraar gevorderde de krachtens
      [artikel 22][ref1] vastgestelde som of sommen overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel22
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '22'
        hoofdstuk: '3'
  - number: '11.2'
    text: |-
      Het eerste lid is jegens de aansprakelijke persoon van overeenkomstige toepassing wanneer de verzekeraar
      wordt verzocht om een bedrag te voldoen in verband met de vorming van een fonds of fondsen overeenkomstig
      [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '1220'
  - number: '12.1'
    text: |-
      De verzekering met betrekking tot een motorrijtuig dat een kenteken behoeft, eindigt, wanneer de verplichting tot
      verzekering op een ander overgaat. De verzekeringnemer moet binnen acht dagen na de overgang daarvan mededeling
      doen aan de verzekeraar. Indien de overgang het gevolg is van het overlijden van de verzekeringnemer, rust de
      verplichting tot mededeling op diens erfgenamen en is de termijn, binnen welke de mededeling moet zijn verricht,
      dertig dagen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel12
  - number: '12.2'
    text: |-
      De verzekering met betrekking tot een motorrijtuig dat geen kenteken behoeft, eindigt niet, wanneer de verplichting
      tot verzekering op een ander overgaat.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel12
  - number: '12.3'
    text: Van het bepaalde in dit artikel kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel12
  - number: '13.1'
    text: |-
      De verzekeraar is verplicht ten aanzien van de verzekering waartoe deze wet verplicht met betrekking tot een
      motorrijtuig dat een kenteken behoeft aan de Dienst Wegverkeer, bedoeld in [artikel 4][ref1], kennis te geven van:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
  - number: 13.1.a
    text: het sluiten van de verzekering;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
  - number: 13.1.b
    text: de beëindiging, de vernietiging en de ontbinding van de verzekering;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
  - number: 13.1.c
    text: |-
      de in [artikel 2, derde lid][ref1], bedoelde schorsing van de verzekering en de beëindiging van die schorsing;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 13.1.d
    text: iedere andere schorsing van de verzekering of van de dekking,
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
  - number: '13.2'
    text: |-
      De Dienst Wegverkeer houdt een register aan waarin de in het eerste lid genoemde kennisgevingen worden aangetekend,
      alsmede de door de verzekeraars gedane kennisgevingen, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 13a
        hoofdstuk: '1'
  - number: '13.3'
    text: |-
      Geen kennisgeving behoeft echter te geschieden, indien ten gevolge van het sluiten van een nieuwe verzekering
      tussen dezelfde partijen en ten aanzien van hetzelfde motorrijtuig het in [artikel 3][ref1] bedoelde risico zonder
      onderbreking blijft gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '3'
        hoofdstuk: '1'
  - number: '13.4'
    text: |-
      De verplichtingen van de verzekeraar jegens de benadeelde blijven bestaan voor ongevallen en gebeurtenissen
      welke plaats vinden binnen 16 dagen na de aanvang van de dag, volgende op die waarop volgens de kennisgeving
      van de verzekeraar de verzekering is beëindigd, vernietigd, ontbonden of geschorst of de dekking is geschorst,
      mits de kennisgeving binnen 30 dagen na de aanvang van die dag bij de Dienst Wegverkeer is gedaan. Indien de
      verzekeraar de kennisgeving niet binnen de in de vorige zin bedoelde termijn van 30 dagen heeft gedaan, blijven
      zijn verplichtingen jegens de benadeelde bestaan voor ongevallen en gebeurtenissen welke plaats vinden binnen 16
      dagen na de aanvang van de dag, volgende op die waarop de kennisgeving bij de Dienst Wegverkeer is ingediend. De
      [Algemene termijnenwet][ref1] is op de in dit lid genoemde termijnen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '13.5'
    text: |-
      Deze verplichtingen eindigen echter van rechtswege door het van kracht worden van een nieuwe verzekering welke ten
      aanzien van hetzelfde motorrijtuig het in [artikel 3][ref1] bedoelde risico dekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '3'
        hoofdstuk: '1'
  - number: '13.6'
    text: |-
      Een kennisgeving overeenkomstig het eerste lid wordt mede gedaan ten aanzien van verzekeringen waartoe
      deze wet verplicht met betrekking tot motorrijtuigen die voor herstel of bewerking ter beschikking
      zijn gesteld van een natuurlijke persoon of een rechtspersoon en die zijn voorzien van een kenteken
      dat niet voor een bepaald voertuig is opgegeven, overeenkomstig het bepaalde bij of krachtens
      [artikel 37, derde lid van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel37
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '37'
  - number: '13.7'
    text: |-
      De verzekeraar die als zodanig in het register wordt aangewezen, kan de benadeelde niet tegenwerpen dat hij niet
      de in de [eerste zin van het eerste lid van artikel 6][ref1] bedoelde verzekeraar is, tenzij hij aantoont dat de
      registratie ten onrechte is geschied of dat zijn verplichtingen op grond van een kennisgeving overeenkomstig het
      eerste lid, onder *b, c* of *d*, niettemin jegens de benadeelde zijn geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel6
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '6'
        hoofdstuk: '1'
  - number: '13.8'
    text: |-
      Voor de uitvoering van dit artikel en van [artikel 13][ref1] worden bij of krachtens algemene maatregel van bestuur
      nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
        hoofdstuk: '1'
  - number: 13a.1
    text: |-
      Een kennisgeving als bedoeld in [artikel 13, eerste lid][ref1], wordt mede gedaan ten aanzien van
      verzekeringen tot het dekken van de burgerrechtelijke aansprakelijkheid waartoe in het verkeer
      aanleiding wordt gegeven door motorrijtuigen die behoren tot de bedrijfsvoorraad van een overeenkomstig
      [artikel 62 van de Wegenverkeerswet 1994][ref2] erkende natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 13a.2
    text: |-
      De verzekeraar is verplicht aan de Dienst Wegverkeer kennis te geven van het sluiten van een verzekering
      als bedoeld in het eerste lid door een natuurlijke persoon of een rechtspersoon als bedoeld in
      [artikel 62 van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 13a.3
    text: |-
      De natuurlijke persoon of rechtspersoon, bedoeld in [artikel 62 van de Wegenverkeerswet 1994][ref1], is verplicht
      aan de Dienst Wegverkeer kennis te geven van het opnemen van het motorrijtuig in de bedrijfsvoorraad. De Dienst
      Wegverkeer bevestigt deze kennisgeving voor ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel62
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '62'
  - number: 13a.4
    text: |-
      De kennisgeving, bedoeld in het tweede lid, geldt tezamen met de voor ontvangst bevestigde kennisgeving, bedoeld in
      het derde lid, als de kennisgeving, bedoeld in [artikel 13, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
        hoofdstuk: '1'
  - number: 13a.5
    text: |-
      De voor ontvangst door de Dienst Wegverkeer bevestigde mededeling waaruit blijkt dat het motorrijtuig de
      bedrijfsvoorraad verlaat, geldt als de kennisgeving door de verzekeraar van het einde van de dekking met betrekking
      tot het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
  - number: 13a.6
    text: |-
      De verzekeraar is verplicht aan de Dienst Wegverkeer kennis te geven van de beëindiging, de vernietiging, de
      ontbinding en de schorsing van de verzekering. [Artikel 13, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '13'
        hoofdstuk: '1'
  - number: 13a.7
    text: |-
      De dekking met betrekking tot het motorrijtuig eindigt van rechtswege doordat de mededeling aan de Dienst
      Wegverkeer waaruit blijkt dat het motorrijtuig de bedrijfsvoorraad verlaat door de Dienst Wegverkeer voor ontvangst
      wordt bevestigd. De verplichtingen van de verzekeraar jegens de benadeelde blijven echter bestaan voor ongevallen
      welke plaatsvinden binnen 16 dagen na de aanvang van de dag, volgende op die waarop de mededeling aan de Dienst
      Wegverkeer waaruit blijkt dat het motorrijtuig de bedrijfsvoorraad verlaat, door de Dienst Wegverkeer voor
      ontvangst is bevestigd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel13a
  - number: '14.1'
    text: |-
      De bestuurder van een motorrijtuig dat geen kenteken behoeft, alsmede de bestuurder van een motorrijtuig als
      bedoeld in [artikel 2, zevende lid, tweede zin][ref1], moet, tenzij bij of krachtens algemene maatregel van bestuur
      anders is bepaald, bij zich hebben een bij of krachtens die maatregel voorgeschreven bewijs van verzekering. De
      bestuurder van een motorrijtuig die bij een ongeval of een gebeurtenis is betrokken, is verplicht, wanneer hij
      ingevolge het bepaalde in dit lid een document bij zich moet hebben, dit behoorlijk ter inzage te verstrekken aan
      degenen die eveneens bij dat ongeval of die gebeurtenis zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '14.2'
    text: |-
      De verplichtingen van de verzekeraar die een bewijs van verzekering heeft uitgereikt, eindigen slechts
      door het verloop van een termijn van 16 dagen na afloop van de periode waarvoor het bewijs is afgegeven. De
      [Algemene termijnenwet][ref1] is op deze termijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '14.3'
    text: |-
      Deze verplichtingen eindigen echter van rechtswege na het van kracht worden van een nieuwe verzekering welke ten
      aanzien van hetzelfde motorrijtuig het in [artikel 3][ref1] bedoelde risico dekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '3'
        hoofdstuk: '1'
  - number: '14.4'
    text: |-
      In afwijking van het tweede lid eindigen de verplichtingen van het bureau bedoeld in [artikel 2, zesde lid][ref1],
      door verloop van de geldigheidsduur van het, voor het motorrijtuig afgegeven, internationale verzekeringsbewijs,
      indien die verplichtingen uit de afgifte van dat bewijs voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      De verzekeraar die ingevolge deze wet de schade van een benadeelde geheel of ten dele vergoedt, ofschoon de
      aansprakelijkheid voor die schade niet door een met hem gesloten verzekering was gedekt, heeft voor het bedrag der
      schadevergoeding verhaal op de aansprakelijke persoon. Het bepaalde in de vorige zin geldt niet ten aanzien van de
      aansprakelijke persoon, die niet is de verzekeringnemer, tenzij hij niet te goeder trouw mocht aannemen dat zijn
      aansprakelijkheid door een verzekering was gedekt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel15
  - number: '15.2'
    text: |-
      De verzekeraar kan zich bovendien voor de gevallen waarin hij volgens de wet of de verzekeringsovereenkomst
      gerechtigd mocht zijn de uitkering te weigeren of te verminderen, een recht van verhaal voorbehouden tegen de
      verzekeringnemer, en indien daartoe grond bestaat, tegen de verzekerde die niet is de verzekeringnemer.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel15
  - number: '16'
    text: |-
      Van een bepaling van deze wet kan slechts worden afgeweken, indien de bevoegdheid daartoe uit de bepaling zelve
      blijkt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel16
  - number: '17.1'
    text: |-
      De Staat is vrijgesteld van de verplichting tot het sluiten van een verzekering. Indien een motorrijtuig waarvoor
      de vrijstelling geldt, aanleiding geeft tot burgerrechtelijke aansprakelijkheid, heeft de benadeelde jegens de
      Staat de rechten welke hij overeenkomstig deze wet anders tegenover de verzekeraar zou hebben, terwijl de bepaling
      van [artikel 7][ref1] van overeenkomstige toepassing is. In de gevallen genoemd in [artikel 4, eerste lid][ref2],
      komt de benadeelde echter niet op grond van het bepaalde in de vorige zin voor een uitkering in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel4
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '4'
        hoofdstuk: '1'
  - number: '17.2'
    text: |-
      De bestuurder van een motorrijtuig, waarvan de Staat de bezitter of de houder, als bedoeld in
      [artikel 2, tweede lid][ref1], is, moet een bewijs bij zich hebben, waaruit van de vrijstelling blijkt. Het model
      van dit bewijs wordt vastgesteld door Onze Minister van Financiën, na overleg met Onze Minister van Verkeer en
      Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '17.3'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van bestuur vrijstelling van de verplichting tot het sluiten van een
      verzekering te verlenen met betrekking tot bepaalde soorten van motorrijtuigen welke nauwelijks gevaar opleveren.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel17
  - number: '18.1'
    text: |-
      Van de verplichting tot het sluiten van een verzekering kunnen, op een daartoe aan Onze Minister van Financiën
      gedaan verzoek, worden vrijgesteld de in [artikel 2, eerste en tweede lid][ref1], bedoelde personen die
      gemoedsbezwaren hebben tegen het sluiten van een verzekering. Rechtspersonen kunnen van de in de vorige zin
      bedoelde verplichting worden vrijgesteld, indien natuurlijke personen die bij die rechtspersonen betrokken zijn
      gemoedsbezwaren hebben tegen het sluiten van een verzekering. Bij algemene maatregel van bestuur kunnen omtrent het
      in de vorige zin bepaalde nadere regels worden gesteld. Het bepaalde in de tweede en derde zin van het eerste lid
      van het vorige artikel is, ingeval een vrijstelling is verleend, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '18.2'
    text: |-
      Het verzoek geschiedt door indiening bij Onze Minister van Financiën van een door de verzoeker ondertekende
      verklaring, waarvan het model door Onze genoemde Minister wordt vastgesteld. Uit de verklaring moet blijken dat de
      verzoeker overwegende gemoedsbezwaren heeft tegen elke verzekering, welke ook, en dat hij mitsdien noch zichzelf
      noch iemand anders noch hem toebehorende goederen heeft verzekerd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel18
  - number: '19.1'
    text: |-
      Indien de in [artikel 18 tweede lid][ref1] bedoelde verklaring naar het oordeel van Onze Minister van Financiën
      overeenkomstig de waarheid is, verleent hij de verzoeker de gevraagde vrijstelling. Ten bewijze van de vrijstelling
      reikt hij voor elk van de motorrijtuigen waarvan de vrijgestelde de bezitter, degene, aan wie het kenteken voor
      het motorrijtuig is opgegeven, dan wel de in [artikel 2, tweede lid][ref2], bedoelde houder is, tegen betaling een
      bewijs uit, dat ten hoogste een jaar geldig is. De bestuurders van deze motorrijtuigen moeten een geldig bewijs van
      vrijstelling bij zich hebben. Zolang de vrijstelling geldt, wordt het bewijs op verzoek van de vrijgestelde tegen
      betaling van jaar tot jaar vernieuwd. Het model van dit bewijs wordt vastgesteld door Onze voornoemde Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '18'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '19.2'
    text: 'Onze Minister van Financiën kan de verleende vrijstelling intrekken:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: 19.2.a
    text: op verzoek van de vrijgestelde;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: 19.2.b
    text: |-
      indien de gemoedsbezwaren, op grond waarvan vrijstelling is verleend, naar zijn oordeel niet langer geacht kunnen
      worden te bestaan;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: 19.2.c
    text: indien gedurende een termijn van tenminste één jaar geen bewijs van vrijstelling is uitgereikt;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: 19.2.d
    text: |-
      indien de vrijgestelde in gebreke blijft binnen twee maanden het bedrag, verschuldigd voor het verkrijgen van een
      in het eerste lid bedoeld bewijs, te betalen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: '19.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen omtrent het in de vorige leden bepaalde
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel19
  - number: '20'
    text: |-
      Onze Minister van Financiën stelt jaarlijks het bedrag vast dat de verzoekers zijn verschuldigd voor het verkrijgen
      van het in het vorig artikel bedoelde bewijs.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel20
  - number: '21'
    text: |-
      Onze Minister van Financiën betaalt jaarlijks de uit hoofde van het vorige artikel ontvangen bedragen aan het
      fonds.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel21
  - number: '22'
    text: |-
      De som of sommen, waarvoor de in deze wet bedoelde verzekering ten minste moet zijn gesloten, worden door Ons bij
      algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige rechtsbevoegdheid
      aan, die onder de naam Waarborgfonds Motorverkeer tot taak heeft in de gevallen, in [artikel 25][ref1] genoemd, aan
      de benadeelden hun schade te vergoeden overeenkomstig het bepaalde in [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel26
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '25'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '26'
        hoofdstuk: '4'
  - number: '23.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid vindt slechts plaats, indien de rechtspersoon aan de volgende eisen
      voldoet:
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: 23.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: 23.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing als bedoeld in het eerste lid
      intrekken indien de rechtspersoon naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan
      wel indien de rechtspersoon anderszins zijn taak niet meer onafhankelijk vervult.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: '23.4'
    text: |-
      Intrekking van een in het eerste lid bedoelde aanwijzing geschiedt onder gelijktijdige voorziening door Onze
      Minister van Justitie en Onze Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij
      nadere regels kunnen stellen. De intrekking heeft de ontbinding van de rechtspersoon ten gevolge en doet de
      vermogensbestanddelen daarvan onder algemene titel op de Staat overgaan.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: '23.5'
    text: |-
      Een aanwijzing en een intrekking van een aanwijzing als bedoeld in dit artikel worden in de *Staatscourant* bekend
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23
  - number: 23a
    text: |-
      Het fonds kan zijn statuten niet wijzigen, tenzij de wijziging de instemming heeft van Onze Minister van Justitie
      en Onze Minister van Financiën. De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 23b.1
    text: |-
      Het fonds verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle gevraagde inlichtingen
      omtrent de uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23b
  - number: 23b.2
    text: |-
      Het fonds zendt jaarlijks binnen zes maanden na afloop van het boekjaar aan Onze Minister van Justitie
      en Onze Minister van Financiën de balans en de staat van baten en lasten alsmede het jaarverslag over het
      betrokken boekjaar. Deze stukken worden met inachtneming van [artikel 24, derde en vierde lid][ref1], opgesteld
      en gaan vergezeld van een verklaring omtrent de getrouwheid, afgelegd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '24.1'
    text: |-
      De verzekeraars die in het bezit zijn van een vergunning of hebben voldaan aan de ingevolge de [artikelen 37][ref1]
      of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2] vereiste procedure met betrekking tot een bijkantoor
      in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting naar Nederland betreft, hebben voldaan
      aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref3], [113, eerste, tweede of vierde lid][ref4],
      [116, eerste of derde lid][ref5], of [118, tweede, derde of vijfde lid, van die wet][ref6] betalen jaarlijks aan
      het fonds een door het fonds te bepalen bedrag, berekend op basis van het aantal en de aard van de door ieder van
      hen in Nederland verzekerde motorrijtuigen. Het fonds bepaalt op overeenkomstige wijze jaarlijks tevens het door
      de Staat aan het fonds te betalen bedrag. De bepaling bedoeld in de vorige volzinnen geschiedt uiterlijk op 30
      juni van ieder jaar. De storting moet geschieden binnen een maand na het besluit tot bepaling van het verschuldigde
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref6]: https://wetten.overheid.nl/BWBR0006509#Artikel118
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref5
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref6
        bwb_id: BWBR0006509
        artikel: '118'
  - number: '24.2'
    text: |-
      Bij de bepaling van dit bedrag worden in aanmerking genomen de over het verleden door het fonds verkregen
      overschotten of geleden tekorten. Tevens wordt rekening gehouden met de in het komende jaar te verwachten
      schadelast.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24
  - number: '24.3'
    text: |-
      De bedragen bedoeld in [artikel 21][ref1] worden door het fonds afzonderlijk geadministreerd en worden uitsluitend
      aangewend tot betaling van schade en kosten, waartoe aanleiding wordt gegeven door motorrijtuigen met betrekking
      waartoe krachtens [artikel 19, eerste lid][ref2], een geldig bewijs van vrijstelling is uitgereikt, en ter
      dekking van de kosten verbonden aan de behandeling van de verzoeken om vrijstelling en aan de uitreiking van de in
      [artikel 19, eerste lid][ref3], bedoelde bewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel19
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '21'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '19'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: '19'
        hoofdstuk: '2'
  - number: '24.4'
    text: |-
      Echter brengt het fonds van de krachtens [artikel 21][ref1] ontvangen bedragen jaarlijks een bedrag over naar zijn
      algemene middelen; voor de vaststelling hiervan gelden dezelfde maatstaven als die welke krachtens het eerste lid
      worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel21
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '21'
        hoofdstuk: '2'
  - number: 24a.1
    text: |-
      De verzekeraars die in het bezit zijn van een vergunning of hebben voldaan aan de ingevolge de [artikelen 37][ref1]
      of [38 van de Wet toezicht verzekeringsbedrijf 1993][ref2] vereiste procedure met betrekking tot een bijkantoor
      in Nederland dan wel, indien het de in die wet bedoelde dienstverrichting naar Nederland betreft, hebben voldaan
      aan het bepaalde in de [artikelen 111, eerste of tweede lid][ref3], [113, eerste, tweede of vierde lid][ref4],
      [116, eerste of derde lid][ref5], of [118, tweede, derde of vijfde lid, van die wet][ref6], alsmede de Staat
      waarborgen, ieder overeenkomstig het aantal en de aard van de door hen in Nederland verzekerde motorrijtuigen,
      onderscheidenlijk overeenkomstig het aantal en de aard van de motorrijtuigen waarvan de Staat de bezitter of de
      houder als bedoeld in [artikel 2, tweede lid][ref7], is, de verplichtingen van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel111
      [ref4]: https://wetten.overheid.nl/BWBR0006509#Artikel113
      [ref5]: https://wetten.overheid.nl/BWBR0006509#Artikel116
      [ref6]: https://wetten.overheid.nl/BWBR0006509#Artikel118
      [ref7]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '111'
      - id: ref4
        bwb_id: BWBR0006509
        artikel: '113'
      - id: ref5
        bwb_id: BWBR0006509
        artikel: '116'
      - id: ref6
        bwb_id: BWBR0006509
        artikel: '118'
      - id: ref7
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 24a.2
    text: |-
      De Staat waarborgt voorts de verplichtingen van het fonds, voor zover de bedragen in het
      [derde lid van artikel 24][ref1] bedoeld, niet toereikend zijn tot vergoeding van schade, waartoe door de in
      genoemd artikellid bedoelde motorrijtuigen aanleiding is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '24'
        hoofdstuk: '4'
  - number: '25.1'
    text: |-
      Een benadeelde kan, wanneer er een burgerrechtelijke aansprakelijkheid voor de door een motorrijtuig veroorzaakte
      schade of een zodanige aansprakelijkheid als bedoeld in [artikel 3][ref1] bestaat, een recht op schadevergoeding
      tegen het fonds geldend maken:


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 3a
        hoofdstuk: '1'
  - number: 25.1.a
    text: |-
      wanneer niet kan worden vastgesteld wie de aansprakelijke persoon is, tenzij aannemelijk is, dat de benadeelde niet
      tot die vaststelling heeft gedaan, wat redelijkerwijs van hem kon worden verwacht;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
  - number: 25.1.b
    text: wanneer de verplichting tot verzekering niet is nagekomen;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
  - number: 25.1.c
    text: |-
      wanneer de schade voortvloeit uit een handelen of nalaten van degene die zich door diefstal of geweldpleging
      de macht over het motorrijtuig heeft verschaft of van hem die, dit wetende, dat motorrijtuig zonder geldige
      reden gebruikt, en de verzekeraar, de Staat, of degene, die krachtens [artikel 18][ref1] is vrijgesteld van de
      verzekeringsplicht deswege niet aansprakelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel18
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '18'
        hoofdstuk: '2'
  - number: 25.1.d
    text: in geval van onvermogen van de verzekeraar;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
  - number: 25.1.e
    text: |-
      wanneer op grond van een vrijstelling krachtens [artikel 18][ref1] een verzekering niet is afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel18
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '18'
        hoofdstuk: '2'
  - number: '25.2'
    text: |-
      Het fonds is jegens het bureau, bedoeld in [artikel 2 zesde lid][ref1], voorts aansprakelijk voor hetgeen dit
      bureau heeft betaald ter zake van de schade, in een van de krachtens [artikel 3, derde lid][ref2], aangewezen
      landen veroorzaakt door een motorrijtuig dat gewoonlijk in Nederland is gestald en met betrekking waartoe krachtens
      [artikel 19, eerste lid][ref3], een geldig bewijs van vrijstelling is uitgereikt. Op de aansprakelijkheid van het
      fonds ingevolge de vorige zin is het bepaalde in de [eerste vijf leden van artikel 26][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel26
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '3'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: '19'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0002415
        artikel: '26'
        hoofdstuk: '4'
  - number: '25.3'
    text: |-
      Het fonds geeft in de gevallen bedoeld in het eerste lid aan degenen die zich tot hem wenden voor vergoeding van
      de rechtstreeks door hen geleden schade, aan de hand van de inlichtingen die het op zijn verzoek van hen heeft
      verkregen, een met redenen omkleed antwoord met betrekking tot zijn tussenkomst.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
  - number: '25.4'
    text: |-
      Indien het fonds en een verzekeraar het niet eens zijn over de vraag wie van hen de schade moet vergoeden, dient
      degene die als eerste werd aangesproken, tot vergoeding van de schade over te gaan. Indien mocht blijken dat de
      ander geheel of gedeeltelijk tot vergoeding van de schade gehouden is, zal deze tot verrekening overgaan.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel25
  - number: '26.1'
    text: |-
      Het fonds is niet aansprakelijk voor schade, voor zover deze de som of sommen, vastgesteld krachtens
      [artikel 22][ref1], overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel22
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '22'
        hoofdstuk: '3'
  - number: '26.2'
    text: |-
      Het fonds is niet aansprakelijk tegenover de benadeelde die ingevolge artikel 4, eerste en tweede lid, van het
      recht op een uitkering kan worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
  - number: '26.3'
    text: |-
      Het fonds is niet aansprakelijk voor de schade, bedoeld in [artikel 4, derde lid][ref1], noch voor schade aan
      zaken, door het motorrijtuig vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel4
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '4'
        hoofdstuk: '1'
  - number: '26.4'
    text: |-
      Het fonds is jegens een benadeelde voor de schade aan diens zaken slechts aansprakelijk voor zover deze schade
      meer bedraagt dan een bedrag dat bij algemene maatregel van bestuur wordt vastgesteld; met betrekking tot het deel
      van de schade dat geringer is dan dit bedrag, ontstaat voor het fonds geen aansprakelijkheid doordat een andere
      benadeelde de vordering tot vergoeding daarvan verkrijgt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
  - number: '26.5'
    text: |-
      Het fonds is slechts aansprakelijk, indien de benadeelde aantoont dat hij alle bekende als zodanig aansprakelijke
      personen en, voor zover de aansprakelijkheid van deze personen volgens deze wet verzekerd behoort te zijn, hun
      verzekeraars tot betaling heeft aangemaand.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
  - number: '26.6'
    text: |-
      In afwijking van het vijfde lid kan ingeval van onvermogen van de verzekeraar de aanmaning achterwege blijven
      jegens de verzekerde aansprakelijke persoon; in dat geval is het fonds evenwel slechts aansprakelijk, voor zover
      de verplichting tot schadevergoeding van de verzekeraar door erkenning of bij gewijsde is komen vast te staan.
      Voor zover het fonds de vordering van de benadeelde jegens de verzekeraar heeft voldaan, treedt het fonds in alle
      rechten, welke de benadeelde terzake van de vordering heeft.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
  - number: '26.7'
    text: |-
      De [artikelen 6, tweede lid][ref1], [7][ref2] en [9][ref3] zijn van overeenkomstige toepassing ten opzichte van
      het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel9
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '7'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: '9'
        hoofdstuk: '1'
  - number: '26.8'
    text: |-
      [Artikel 10][ref1] is van overeenkomstige toepassing op de rechtsvordering van de benadeelde tegenover het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel10
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '10'
        hoofdstuk: '1'
  - number: '27.1'
    text: |-
      Het fonds heeft een recht van verhaal tegen alle aansprakelijke personen, alsmede tegen degene die zijn
      verplichting tot verzekering met betrekking tot het motorrijtuig, waarmede de schade is veroorzaakt of met
      betrekking tot het motorrijtuig aan boord waarvan de gevaarlijke stof zich bevond waarmede de schade is veroorzaakt
      niet is nagekomen. Het bepaalde in de vorige zin geldt in het geval van [artikel 25, eerste lid onder ][ref1],
      slechts voor zover aan de verzekeraar een recht van verhaal zou zijn toegekomen. Het fonds heeft voorts tegenover
      de verzekeraars van de aansprakelijke personen de rechten van een benadeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel25
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '25'
        hoofdstuk: '4'
  - number: '27.2'
    text: |-
      Het fonds heeft overigens tegenover de aansprakelijke personen dezelfde rechten als een verzekeraar tegenover de
      verzekerden.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27
  - number: 27a
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27a
  - number: 27a.a
    text: |-
      benadeelden: zij die schade hebben geleden, veroorzaakt door motorrijtuigen die gewoonlijk zijn gestald en
      verzekerd in een lidstaat, alsmede hun rechtverkrijgenden;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27a
  - number: 27a.b
    text: |-
      verzekeraar: de verzekeraar die in een lidstaat in het bezit is van een vergunning als bedoeld in artikel 6 of
      artikel 23 van [richtlijn nr. 73/239/EEG](31973L0239) van de Raad van de Europese Gemeenschappen van 24 juli
      1973 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de toegang tot het directe
      verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en de uitoefening daarvan (PbEG L 228);
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27a
  - number: 27a.c
    text: |-
      [richtlijn nr. 72/166/EEG](31972L0166): [richtlijn nr. 72/166/EEG](31972L0166) van de Raad van de Europese
      Gemeenschappen van 24 april 1972 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende de
      verzekering van de wettelijke aansprakelijkheid waartoe de deelneming aan het verkeer van motorrijtuigen aanleiding
      kan geven en de controle op de verzekering tegen deze aansprakelijkheid (PbEG L 103).
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27a
  - number: 27b.1
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige rechtsbevoegdheid
      aan als Informatiecentrum dat tot taak heeft informatie te verstrekken aan benadeelden teneinde hen in staat te
      stellen een vordering tot schadevergoeding in te dienen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.2
    text: 'Een aanwijzing vindt slechts plaats, indien de rechtspersoon aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.3
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing intrekken indien de rechtspersoon
      naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan wel indien de rechtspersoon
      anderszins zijn taak niet meer onafhankelijk vervult.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.4
    text: |-
      Intrekking van een aanwijzing geschiedt onder gelijktijdige voorziening door Onze Minister van Justitie en Onze
      Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij nadere regels kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27b.5
    text: Een aanwijzing en een intrekking van een aanwijzing worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27b
  - number: 27c
    text: |-
      Het Informatiecentrum kan zijn statuten niet wijzigen, tenzij de wijziging door Onze Minister van Justitie en Onze
      Minister van Financiën is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27c
  - number: 27d
    text: |-
      Het Informatiecentrum verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle gevraagde
      inlichtingen omtrent de uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27d
  - number: 27e
    text: |-
      Bij de aanwijzing, bedoeld in [artikel 27b, eerste lid][ref1], wordt bepaald op welke wijze de werkzaamheden van
      het Informatiecentrum ter uitvoering van zijn taak, worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27b
        hoofdstuk: 4a
  - number: 27f.1
    text: |-
      Het Informatiecentrum coördineert ter uitvoering van de hem op grond van [artikel 27b, eerste lid][ref1], opgelegde
      taak de verzameling en verstrekking van de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27b
        hoofdstuk: 4a
  - number: 27f.1.a
    text: de kentekens van de motorrijtuigen die gewoonlijk in Nederland zijn gestald;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.1.1°
    text: |-
      de polisnummers van de verzekeringen, bedoeld in de [artikelen 3][ref1] en [3a][ref2] en, indien de verzekering is
      beëindigd, vernietigd of ontbonden, de datum waarop de dekking is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel3a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '3'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 3a
        hoofdstuk: '1'
  - number: 27f.1.2°
    text: |-
      het nummer van het internationale verzekeringsbewijs of van de grensverzekeringspolis dat, onderscheidenlijk die
      is afgegeven voor motorrijtuigen waarvoor de in artikel 4, onder b, van [richtlijn 72/166/EEG](31972L0166) bepaalde
      afwijking geldt;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.1.c
    text: |-
      de verzekeraars en de schaderegelaars, van wie de verzekeraars de naam overeenkomstig
      [artikel 52, vierde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] aan het Informatiecentrum hebben
      medegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel52
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '52'
  - number: 27f.1.d
    text: |-
      de lijst van motorrijtuigen waarvoor in een of meer lidstaten overeenkomstig artikel 4, onder a en b, van
      [richtlijn nr. 72/166/EEG](31972L0166) wordt afgeweken van de verplichte verzekering tegen burgerrechtelijke
      aansprakelijkheid, waartoe deze in het verkeer aanleiding kunnen geven;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.1.e
    text: 'met betrekking tot motorrijtuigen als bedoeld onder d:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.1.e.1°
    text: |-
      de naam van de autoriteit of de instantie die overeenkomstig de tweede alinea van artikel 4, onder a, van
      [richtlijn nr. 72/166/EEG](31972L0166), is belast met de schadevergoeding aan de benadeelden, indien de procedure
      van artikel 2, tweede lid, eerste streepje van die richtlijn niet van toepassing is en indien voor het motorrijtuig
      de afwijking geldt van artikel 4, onder a, van die richtlijn;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.1.e.2°
    text: |-
      de naam van de instantie waaronder het motorrijtuig ressorteert in de lidstaat waar het gewoonlijk is gestald,
      indien voor het motorrijtuig de afwijking geldt van artikel 4, onder b, van [richtlijn nr. 72/166/EEG](31972L0166).
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
  - number: 27f.2
    text: |-
      De in het eerste lid, onder a, b en c, genoemde gegevens worden bewaard gedurende zeven jaar
      na de doorhaling van de inschrijving van het motorrijtuig in het kentekenregister, bedoeld in
      [artikel 42, eerste lid, van de Wegenverkeerswet 1994][ref1] of van de beëindiging van de dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '42'
  - number: 27g
    text: |-
      Indien een benadeelde binnen zeven jaar te rekenen van het feit waaruit de schade is ontstaan, daartoe een verzoek
      indient, verstrekt het Informatiecentrum onverwijld de volgende informatie:
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27g
  - number: 27g.a
    text: de naam en het adres van de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27g
  - number: 27g.b
    text: het polisnummer; en
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27g
  - number: 27g.c
    text: de naam en het adres van de schaderegelaar van de verzekeraar, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27g
  - number: 27h.1
    text: |-
      Indien een benadeelde er rechtmatig belang bij heeft, deelt het Informatiecentrum hem naam en adres van de
      bezitter, van degene aan wie het kenteken voor het motorrijtuig is opgegeven of van de houder van het motorrijtuig
      mee. Het Informatiecentrum informeert daartoe in het bijzonder bij:
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27h
  - number: 27h.1.a
    text: de verzekeraar; of
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27h
  - number: 27h.1.b
    text: de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27h
  - number: 27h.2
    text: |-
      Indien voor het motorrijtuig de afwijking geldt van artikel 4, onder a, van [richtlijn nr. 72/166/EEG](31972L0166)
      deelt het Informatiecentrum de benadeelde de naam mee van de autoriteit of de instantie die overeenkomstig de
      tweede alinea van artikel 4, onder a, van die richtlijn is belast met de schadevergoeding aan de benadeelden,
      indien de procedure van artikel 2, tweede lid, eerste streepje, van die richtlijn niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27h
  - number: 27h.3
    text: |-
      Indien voor het motorrijtuig de afwijking geldt van artikel 4, onder b, van [richtlijn nr. 72/166/EEG](31972L0166)
      deelt het Informatiecentrum de benadeelde de naam mee van de instantie waaronder het motorrijtuig ressorteert in de
      lidstaat waar het gewoonlijk is gestald.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27h
  - number: 27i
    text: Het Informatiecentrum werkt samen met de informatiecentra die in de andere lidstaten zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27i
  - number: 27j
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27j
  - number: 27j.a
    text: |-
      schade: schade ten gevolge van feiten, veroorzaakt door deelneming aan het verkeer van motorrijtuigen die
      gewoonlijk zijn gestald en verzekerd in een andere lidstaat dan Nederland en die zich ofwel hebben voorgedaan in
      een andere lidstaat dan die van de woonplaats van de benadeelde, ofwel in een staat buiten de Europese Unie waar
      een bureau, groep van verzekeraars of instantie werkzaam is dat onderscheidenlijk die overeenkomt met het bureau,
      bedoeld in [artikel 2, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 27j.b
    text: |-
      benadeelden: personen met woonplaats in Nederland die schade als bedoeld in onderdeel a hebben geleden, alsmede hun
      rechtverkrijgenden, evenwel met uitsluiting van verzekeraars, uitvoeringsinstellingen als bedoeld in artikel 41,
      derde lid, van de Organisatiewet sociale verzekeringen 1997, en andere instanties die door vergoeding van de schade
      in de rechten van deze personen zijn getreden;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27j
  - number: 27j.c
    text: |-
      verzekeraar: de verzekeraar die in een lidstaat in het bezit is van een vergunning als bedoeld in artikel 6 of
      artikel 23 van [richtlijn 73/239/EEG](31973L0239) van de Raad van de Europese Gemeenschappen van 24 juli 1973
      tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende de toegang tot het directe
      verzekeringsbedrijf, met uitzondering van de levensverzekeringsbranche, en de uitoefening daarvan (PbEG L 228).
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27j
  - number: 27k.1
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige rechtsbevoegdheid
      aan als Schadevergoedingsorgaan dat tot taak heeft in de gevallen, genoemd in artikel 27o, eerste lid, schade te
      vergoeden aan benadeelden.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.2
    text: 'Een aanwijzing vindt slechts plaats, indien de rechtspersoon aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.3
    text: |-
      Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing intrekken, indien de rechtspersoon
      naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan wel indien de rechtspersoon
      anderszins zijn taak niet meer onafhankelijk vervult.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.4
    text: |-
      Intrekking van een aanwijzing geschiedt onder gelijktijdige voorziening door Onze Minister van Justitie en Onze
      Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij nadere regels kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27k.5
    text: Een aanwijzing en een intrekking van een aanwijzing worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27k
  - number: 27l
    text: |-
      Het Schadevergoedingsorgaan kan zijn statuten niet wijzigen, tenzij de wijziging door Onze Minister van Justitie en
      Onze Minister van Financiën is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27l
  - number: 27m.1
    text: |-
      Het Schadevergoedingsorgaan verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle gevraagde
      inlichtingen omtrent de uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27m
  - number: 27m.2
    text: |-
      Het Schadevergoedingsorgaan zendt jaarlijks binnen zes maanden na afloop van het boekjaar aan Onze Minister van
      Justitie en Onze Minister van Financiën de balans en de staat van baten en lasten alsmede het jaarverslag over
      het betrokken boekjaar. Deze stukken gaan vergezeld van een verklaring omtrent de getrouwheid, afgelegd door een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27m
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 27n
    text: |-
      Bij de aanwijzing, bedoeld in [artikel 27k, eerste lid][ref1], wordt bepaald op welke wijze de vergoeding door het
      Schadevergoedingsorgaan van schade als bedoeld in [artikel 27r][ref2], wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27k
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel27r
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27n
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27k
        hoofdstuk: 4b
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 27r
        hoofdstuk: 4b
  - number: 27o.1
    text: |-
      Een benadeelde kan, wanneer er een burgerrechtelijke aansprakelijkheid voor schade bestaat, een verzoek
      schadevergoeding indienen bij het Schadevergoedingsorgaan, indien:
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.1.a
    text: |-
      binnen drie maanden na de datum waarop hij zijn verzoek tot schadevergoeding heeft ingediend bij de verzekeraar van
      het motorrijtuig waarmee de schade is veroorzaakt, of bij diens schaderegelaar in Nederland, die verzekeraar of die
      schaderegelaar hem geen met redenen omkleed antwoord op het verzoek heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.1.b
    text: de verzekeraar heeft nagelaten om in Nederland een schaderegelaar aan te stellen;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.1.c
    text: |-
      de verzekeraar niet kan worden geïdentificeerd binnen twee maanden na het voorvallen van het feit waaruit de schade
      is ontstaan; of
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.1.d
    text: het motorrijtuig niet kan worden geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.2
    text: 'Een benadeelde kan geen verzoek tot schadevergoeding indienen bij het Schadevergoedingsorgaan:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.2.a
    text: |-
      in het geval, bedoeld in het eerste lid, onderdeel b, indien hij zijn verzoek tot schadevergoeding rechtstreeks
      heeft ingediend bij de verzekeraar en hij binnen drie maanden na de indiening van het verzoek een met redenen
      omkleed antwoord heeft ontvangen; of
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27o.2.b
    text: indien hij rechtstreeks tegen de verzekeraar een rechtsvordering heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27o
  - number: 27p.1
    text: |-
      Het Schadevergoedingsorgaan neemt het verzoek tot schadevergoeding in behandeling binnen twee maanden nadat de
      benadeelde het verzoek heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27p
  - number: 27p.2
    text: |-
      Het Schadevergoedingsorgaan beëindigt de behandeling van het verzoek zodra de verzekeraar of diens schaderegelaar
      in Nederland binnen de in het eerste lid genoemde periode van twee maanden alsnog een met redenen omkleed antwoord
      op het verzoek heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27p
  - number: 27q
    text: |-
      Het Schadevergoedingsorgaan stelt de navolgende partijen onmiddellijk in kennis van het bij hem ingediende verzoek
      tot schadevergoeding met de mededeling dat het verzoek binnen twee maanden na de indiening ervan in behandeling
      wordt genomen:
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27q
  - number: 27q.a
    text: de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt, of diens schaderegelaar;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27q
  - number: 27q.b
    text: het schadevergoedingsorgaan in de lidstaat van vestiging van de verzekeraar, bedoeld in onderdeel a; en
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27q
  - number: 27q.c
    text: indien deze bekend is, de persoon die de schade heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27q
  - number: 27r
    text: |-
      Het Schadevergoedingsorgaan gaat slechts over tot vergoeding van schade, indien de benadeelde aantoont dat hij
      alle bekende als zodanig aansprakelijke personen en, voor zover de aansprakelijkheid van deze personen behoort
      te zijn verzekerd volgens de desbetreffende wetgeving van de lidstaat waar het motorrijtuig waarmee de schade
      is veroorzaakt, gewoonlijk is gestald, hun verzekeraars of hun schaderegelaars in Nederland tot betaling heeft
      aangemaand.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27r
  - number: 27s
    text: |-
      Het Schadevergoedingsorgaan vergoedt geen schade, hoger dan de wettelijk vastgelegde bedragen in de lidstaat
      waar het feit heeft plaatsgevonden waaruit de schade is ontstaan, dan wel in de lidstaat waar het motorrijtuig
      gewoonlijk is gestald, indien in laatstbedoelde lidstaat de dekking hoger is.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27s
  - number: 27t.1
    text: 'Na vergoeding van schade aan een benadeelde heeft het Schadevergoedingsorgaan recht van verhaal:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
  - number: 27t.1.a
    text: |-
      in de in [artikel 27o, eerste lid, onderdelen a en b][ref1] genoemde gevallen op het schadevergoedingsorgaan in de
      lidstaat van vestiging van de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27o
        hoofdstuk: 4b
  - number: 27t.1.b
    text: |-
      in het in [artikel 27o, eerste lid, onderdeel c][ref1] genoemde geval op het nationale waarborgfonds in de lidstaat
      waar het motorrijtuig waarmee de schade is veroorzaakt gewoonlijk is gestald, dat overeenkomt met het Waarborgfonds
      Motorverkeer;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27o
        hoofdstuk: 4b
  - number: 27t.1.c
    text: |-
      in het in [artikel 27o, eerste lid, onderdeel d][ref1] genoemde geval op het nationale waarborgfonds in de
      lidstaat waar het feit heeft plaatsgevonden waaruit de schade is ontstaan, dat overeenkomt met het Waarborgfonds
      Motorverkeer;


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27o
        hoofdstuk: 4b
  - number: 27t.1.d
    text: |-
      indien het ongeval is veroorzaakt door een motorrijtuig uit een staat buiten de Europese Unie, waar een bureau,
      groep van verzekeraars of instantie werkzaam is dat, onderscheidenlijk die overeenkomt met het bureau, bedoeld
      in [artikel 2, zesde lid][ref1], en waarvan de verzekeraar binnen twee maanden na het ongeval niet kan worden
      geïdentificeerd, op het nationale waarborgfonds in de lidstaat waar het feit heeft plaatsgevonden waaruit de schade
      is ontstaan, dat overeenkomt met het Waarborgfonds Motorverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 27t.2
    text: |-
      Indien een schadevergoedingsorgaan uit een andere lidstaat een persoon in diens lidstaat schade heeft vergoed op
      basis van wetgeving die overeenkomt met [artikel 27o][ref1] en daarna verhaal zoekt op het Schadevergoedingsorgaan,
      restitueert het Schadevergoedingsorgaan de door het schadevergoedingsorgaan uit die andere lidstaat
      betaalde bedrag. Het Schadevergoedingsorgaan meldt de naam van de betrokken verzekeraar aan de Pensioen- &
      Verzekeringskamer.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27o
        hoofdstuk: 4b
  - number: 27t.3
    text: |-
      Indien op het Schadevergoedingsorgaan verhaal is genomen door een schadevergoedingsorgaan uit een andere lidstaat,
      heeft het voor het betaalde bedrag verhaal op degene die burgerrechtelijk aansprakelijk is of op diens verzekeraar.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel27t
  - number: '28.1'
    text: |-
      De [artikelen 5-15][ref1] blijven van toepassing op een verzekeringsonderneming met betrekking tot de schade
      tengevolge van een ongeval of een gebeurtenis dat heeft plaatsgehad voor of binnen 30 dagen na de intrekking van
      de vergunning dan wel de intrekking van een overeenkomstige vergunning indien het een verzekeringsonderneming
      met zetel in een andere lid-staat betreft, of het opleggen van een verbod ter zake van acquisitie als bedoeld in
      [artikel 115][ref2], tweede lid, of [artikel 120, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref3].
      De [Algemene Termijnenwet][ref4] is op deze termijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel120
      [ref4]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '5'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '115'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '120'
      - id: ref4
        bwb_id: BWBR0002448
  - number: '28.2'
    text: |-
      Degene die met een verzekeringsonderneming die niet of niet meer in het bezit is van een vergunning dan wel een
      overeenkomstige vergunning indien het een verzekeringsonderneming met zetel in een andere lid-staat betreft,
      of aan wie een verbod is opgelegd ter zake van acquisitie als bedoeld in [artikel 115, tweede lid][ref1], of
      [artikel 120, tweede lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2], een verzekering heeft gesloten
      waartoe deze wet verplicht, is bevoegd deze verzekering door opzegging te beëindigen; de verzekeringsonderneming
      geeft alsdan de vooruitbetaalde premie terug voor het gedeelte dat evenredig is aan het op de datum van de
      ontvangst der opzegging nog niet verstreken gedeelte van de termijn, waarvoor de premie werd betaald, onder aftrek
      van een door de Pensioen- & Verzekeringskamer te bepalen percentage van het terug te betalen bedrag aan onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel120
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '115'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '120'
  - number: '30.1'
    text: |-
      Hij, die als bezitter, dan wel als degene aan wie het kenteken is opgegeven, dan wel als houder in de zin van
      [artikel 2, tweede lid][ref1], een motorrijtuig op een weg doet rijden of laat staan of toelaat dat daarmede op
      een weg wordt gereden of gestaan, of buiten een weg met een motorrijtuig deelneemt of toelaat dat daarmede wordt
      deelgenomen aan het verkeer op een terrein zonder dat hij voor dat motorrijtuig een verzekering overeenkomstig deze
      wet heeft gesloten en in stand gehouden, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van
      de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '30.2'
    text: |-
      De in het vorige lid genoemde personen worden met gelijke straf gestraft, indien zij voor een motorrijtuig waarvoor
      een kentekenbewijs is afgegeven niet een verzekering overeenkomstig deze wet hebben gesloten en in stand gehouden.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
  - number: '30.3'
    text: |-
      De in het eerste lid genoemde personen zijn niet strafbaar, indien op hen de verplichting tot verzekering niet
      rust.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
  - number: '30.4'
    text: |-
      De bestuurder van een motorrijtuig die daarmede op een weg rijdt of staat of buiten een weg met een motorrijtuig
      deelneemt aan het verkeer op een terrein zonder dat er voor dat motorrijtuig een verzekering overeenkomstig deze
      wet is gesloten en in stand gehouden, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de
      tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
  - number: '30.5'
    text: 'De in het vorige lid bedoelde bestuurder is niet strafbaar indien:'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
  - number: 30.5.a
    text: |-
      met betrekking tot het motorrijtuig vrijstelling van de verplichting tot verzekering is verleend en een geldig
      bewijs van die vrijstelling is uitgereikt;
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
  - number: 30.5.b
    text: |-
      een in [artikel 2, zesde lid][ref1], bedoeld bureau, groep van verzekeraars of buitenlandse instantie de
      verplichting op zich heeft genomen de door het motorrijtuig veroorzaakte schade overeenkomstig de bepalingen van
      deze wet te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '30.6'
    text: |-
      Bij veroordeling wegens een strafbaar feit, omschreven in het eerste, tweede of vierde lid, kan de rechter tevens
      de schuldige de bevoegdheid ontzeggen motorrijtuigen te besturen voor de tijd van ten hoogste één jaar en ingeval
      tijdens het plegen van het strafbare feit nog geen vijf jaar zijn verlopen na het einde van de tijdsduur, waarvoor
      bij een vroegere onherroepelijke veroordeling de schuldige de bevoegdheid motorrijtuigen te besturen is ontzegd,
      voor de tijd van ten hoogste vijf jaren. Overigens zijn de bepalingen van de [Wegenverkeerswet 1994][ref1],
      betreffende de bijkomende straf van ontzegging van de rijbevoegdheid motorrijtuigen te besturen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '30.7'
    text: |-
      Bij veroordeling wegens een strafbaar feit, omschreven in het eerste, tweede of vierde lid, kan de rechter
      tevens de schuldige de bijkomende straf van betaling van een bedrag van ten hoogste € 2723 aan het Waarborgfonds
      Motorverkeer opleggen. De [artikelen 24][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 24a
  - number: '30.8'
    text: |-
      De in het vorige lid bedoelde bijkomende straf wordt ten uitvoer gelegd met overeenkomstige toepassing
      van de [artikelen 561, eerste, tweede en derde lid][ref1], [572][ref2], [573][ref3], [575][ref4] en
      [576 van het Wetboek van Strafvordering][ref5]. Het openbaar ministerie draagt er zorg voor, dat de geïnde bedragen
      tegen kwijting aan het Waarborgfonds Motorverkeer worden uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel561
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel572
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel573
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel575
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel576
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '561'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '572'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '573'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '575'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '576'
  - number: '31'
    text: |-
      Op de eerste vordering van de personen, belast met de opsporing van de in deze wet strafbaar gestelde feiten
      is de bestuurder van een motorrijtuig verplicht het rijtuig te doen stilhouden en indien hij ingevolge
      [artikel 14 eerste lid][ref1], [artikel 17 tweede lid][ref2] of [artikel 19 eerste lid][ref3] een document bij zich
      moet hebben, dit behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel19
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '14'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '17'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0002415
        artikel: '19'
        hoofdstuk: '2'
  - number: '32'
    text: |-
      De houder van een bewijs als bedoeld in [artikel 19 eerste lid][ref1] is verplicht dit, wanneer het ongeldig is
      geworden, op eerste aanmaning bij het bevoegde gezag in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel19
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '19'
        hoofdstuk: '2'
  - number: '33'
    text: |-
      Handelen in strijd met de [artikelen 31][ref1] en [32][ref2] wordt gestraft met hechtenis van ten hoogste dertig
      dagen of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel32
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '31'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002415
        artikel: '32'
        hoofdstuk: '6'
  - number: '34.1'
    text: |-
      Indien uit het door de Dienst Wegverkeer aangehouden register niet blijkt dat ten aanzien van een motorrijtuig
      met betrekking waartoe gedurende een bepaald tijdvak een verplichting tot verzekering bestaat of heeft bestaan,
      gedurende dat tijdvak is voldaan aan de verzekeringsplicht uit hoofde van deze wet, kan een ambtenaar als bedoeld
      in [artikel 37][ref1] van degene, aan wie het kenteken voor dat motorrijtuig is opgegeven, vorderen dat hij
      aantoont dat niettemin aan de verzekeringsplicht gedurende dat tijdvak voldaan is.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel37
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '37'
        hoofdstuk: '6'
  - number: '34.2'
    text: |-
      Degene tot wie de vordering is gericht, kan daaraan voldoen door binnen een nader door de in het eerste lid
      bedoelde ambtenaar te bepalen termijn, welke echter niet korter mag zijn dan veertien dagen, een van een
      verzekeraar afkomstig geschrift op een hem opgegeven plaats ter inzage te verstrekken. Uit het geschrift moet
      blijken dat gedurende het tijdvak de aansprakelijkheid waartoe het motorrijtuig aanleiding kan geven, was gedekt
      door een verzekering overeenkomstig deze wet. De verzekeraar is gehouden een zodanig geschrift af te geven zo
      spoedig mogelijk, doch in ieder geval binnen tien dagen, nadat hem een daartoe strekkend verzoek heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel34
  - number: '34.3'
    text: |-
      Degene die niet aan de in het eerste lid bedoelde vordering voldoet, wordt gestraft met
      een hechtenis van ten hoogste drie maanden of geldboete van de tweede categorie. Het
      [zesde tot en met het achtste lid van artikel 30][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel30
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '30'
        hoofdstuk: '6'
  - number: '35'
    text: |-
      Overtreding van het bepaalde bij of krachtens algemene maatregel van bestuur, voor zover die overtreding
      uitdrukkelijk als strafbaar feit is aangemerkt, wordt gestraft met hechtenis van ten hoogste dertig dagen of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel35
  - number: '36'
    text: De bij of krachtens deze wet strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel36
  - number: '37'
    text: |-
      Met de opsporing van de strafbare feiten, bedoeld in dit hoofdstuk, zijn, behalve de ambtenaren
      bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, die krachtens
      [artikel 159 van de Wegenverkeerswet 1994][ref2] zijn aangewezen tot opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '159'
  - number: '38.1'
    text: |-
      Voor de uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere regelen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel38
  - number: '38.2'
    text: |-
      Inlichtingen omtrent de nakoming van de verplichting tot verzekering worden op aanvraag en tegen betaling, op
      de door de Dienst Wegverkeer vastgestelde wijze, van het daarvoor door deze dienst vastgestelde tarief door deze
      dienst verstrekt. Bij algemene maatregel van bestuur wordt vastgesteld wie tot betaling van het tarief is gehouden.
      [Artikel 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4q
  - number: '41'
    text: De bepalingen van deze wet treden in werking op door Ons te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel41
  - number: '42'
    text: 'Deze wet kan worden aangehaald als: Wet aansprakelijkheidsverzekering motorrijtuigen.'
    url: https://wetten.overheid.nl/BWBR0002415/2004-05-01#Artikel42
