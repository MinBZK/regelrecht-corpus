  - number: 1a
    text: |-
      In afwijking van [artikel 1][ref1] worden voor de toepassing van deze wet niet verstaan onder motorrijtuigen, de
      bij algemene maatregel van bestuur aangewezen rij- of voertuigen die:


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel1
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '1'
        hoofdstuk: '1'
  - number: 1a.a
    text: nauwelijks gevaar opleveren; en
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel1a
  - number: 1a.b
    text: niet hebben te gelden als voertuig in de zin van artikel 1, onderdeel 1, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel1a
  - number: '2.1'
    text: |-
      De bezitter van een motorrijtuig en degene op wiens naam dit in het kentekenregister is ingeschreven, zijn
      verplicht voor het motorrijtuig een verzekering te sluiten en in stand te houden welke aan de bij en krachtens deze
      wet gestelde bepalingen voldoet, indien dat motorrijtuig op een weg wordt geplaatst of daarmee op een weg wordt
      gereden, indien buiten een weg met dat motorrijtuig aan het verkeer wordt deelgenomen of indien dat motorrijtuig in
      het kentekenregister is ingeschreven en tenaamgesteld.
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
  - number: '2.2'
    text: 'In afwijking van het vorige lid rust de verplichting tot verzekering niet op de bezitter, maar op de houder die:'
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
  - number: 2.2.a
    text: het motorrijtuig op grond van een overeenkomst van huurkoop onder zich heeft, of
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
  - number: 2.2.b
    text: het motorrijtuig in vruchtgebruik heeft, of
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
  - number: 2.2.c
    text: anderszins het motorrijtuig, anders dan als bezitter, tot duurzaam gebruik onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
  - number: '2.3'
    text: |-
      De verplichting tot verzekering met betrekking tot een motorrijtuig dat in het kentekenregister is ingeschreven
      en tenaamgesteld, wordt opgeheven, indien het motorrijtuig buiten gebruik wordt gesteld en gehouden door plaatsing
      daarvan buiten een weg, gevolgd door een door de verzekeraar overeenkomstig [artikel 13][ref1] aan de Dienst
      Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref2], gedane kennisgeving van schorsing van
      de verzekering wegens buitengebruikstelling van het motorrijtuig. De in de vorige zin bedoelde opheffing van
      de verzekeringsplicht eindigt, zodra de verzekeraar overeenkomstig [artikel 13][ref3] aan de Dienst Wegverkeer
      kennis heeft gegeven van de beëindiging van de schorsing, zodra het motorrijtuig zich op een weg bevindt of zodra
      het buiten een weg deelneemt aan het verkeer. Bij of krachtens algemene maatregel van bestuur kunnen omtrent
      het in dit lid bepaalde nadere regels en voorwaarden worden gesteld. De in dit lid bedoelde opheffing van de
      verzekeringsplicht vindt slechts plaats, indien de tenaamstelling van het desbetreffende motorrijtuig in het
      kentekenregister is geschorst overeenkomstig [artikel 67 van de Wegenverkeerswet 1994][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel67
    url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#Artikel2
