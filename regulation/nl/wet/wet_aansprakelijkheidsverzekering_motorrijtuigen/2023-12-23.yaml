preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met het op 7 januari 1955 te Brussel tussen Nederland,
    België en Luxemburg gesloten verdrag betreffende de verplichte aansprakelijkheidsverzekering in zake motorrijtuigen
    (Trb. 1955, nr. 16), en de aanvullende overeenkomst hierop van 3 juli 1956 (Trb. 1956, nr. 75) noodzakelijk, en
    ook overigens wenselijk is, een regeling te treffen omtrent de verplichte verzekering tegen burgerrechtelijke
    aansprakelijkheid waartoe motorrijtuigen aanleiding kunnen geven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002415/2023-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden verstaan onder motorrijtuigen: alle rij- of voertuigen, bestemd om anders
      dan langs spoorstaven over de grond te worden voortbewogen uitsluitend of mede door een mechanische kracht,
      op of aan het rij- of voertuig zelf aanwezig dan wel door electrische tractie met stroomtoevoer van elders;
      als een deel daarvan wordt aangemerkt al hetgeen aan het rij- of voertuig is gekoppeld of na koppeling daarvan
      is losgemaakt of losgeraakt, zolang het nog niet buiten het verkeer tot stilstand is gekomen; verzekerden:
      zij wier aansprakelijkheid overeenkomstig de bepalingen van deze wet is gedekt; benadeelden: zij die schade
      hebben geleden welke grond oplevert voor toepassing van deze wet, alsmede hun rechtverkrijgenden; vergunning:
      een vergunning die een schadeverzekeraar ingevolge de [Wet op het financieel toezicht][ref1] behoeft voor de
      uitoefening van de branche Aansprakelijkheid motorrijtuigen; verzekeraar: een schadeverzekeraar die ingevolge de
      [Wet op het financieel toezicht][ref2] in Nederland zijn bedrijf in de branche Aansprakelijkheid motorrijtuigen
      mag uitoefenen, en het bureau, bedoeld in [artikel 2, zesde lid][ref3], dat is belast met de afwikkeling van
      de schade welke in Nederland is veroorzaakt door motorrijtuigen die gewoonlijk in het buitenland zijn gestald,
      en van de afwikkeling van de schade welke in een van de krachtens [artikel 3, derde lid][ref4], aangewezen
      landen is veroorzaakt door motorrijtuigen die gewoonlijk in Nederland zijn gestald; weg: een weg waarop de
      omschrijving van het begrip "wegen" in [artikel 1, eerste lid, onderdeel b, van de Wegenverkeerswet 1994][ref5]
      van toepassing is; onder "weg" wordt mede verstaan een vaartuig dat wordt gebruikt bij de uitoefening van een
      veerdienst; deelneming met het motorrijtuig aan het verkeer: het gebruik van het motorijtuig in overeenstemming
      met de functie van dat motorrijtuig als vervoermiddel, ongeacht de kenmerken van het motorrijtuig en ongeacht
      het terrein waarop het motorrijtuig wordt gebruikt en of het stilstaat of in beweging is; kenteken: een
      kenteken als bedoeld in [artikel 36 van de Wegenverkeerswet 1994][ref6]; Waarborgfonds Motorverkeer en fonds:
      de krachtens [artikel 23, eerste lid][ref7], aangewezen rechtspersoon; gevaarlijke stof: een stof als bedoeld
      in [artikel 1210, onderdeel a, van Boek 8 van het Burgerlijk Wetboek][ref8]; gebeurtenis: een gebeurtenis als
      bedoeld in [artikel 1210, onderdeel d, van Boek 8 van het Burgerlijk Wetboek][ref9]; exploitant: een exploitant
      als bedoeld in [artikel 1210, onderdeel e, van Boek 8 van het Burgerlijk Wetboek][ref10]; lidstaat: een lidstaat
      van de Europese Unie; Informatiecentrum: de krachtens [artikel 27b][ref11], eerste lid, aangewezen rechtspersoon;
      Schadevergoedingsorgaan: 'de krachtens [artikel 27k, eerste lid][ref12], aangewezen rechtspersoon; schaderegelaar:'
      een schaderegelaar als bedoeld in [artikel 4:70, tweede lid, van de Wet op het financieel toezicht][ref13];
      lidstaat van herkomst: lidstaat van herkomst als bedoeld in artikel 13, onderdeel 8, onder a, van [richtlijn
      2009/138/EG](32009L0138) van het Europees Parlement en de Raad van 25 november 2009 betreffende de toegang tot en
      uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009, L 335); richtlijn:
      [Richtlijn 2009/103/EG](32009L0103) van het Europees Parlement en de Raad van 16 september 2009 betreffende
      de verzekering tegen de wettelijke aansprakelijkheid waartoe de deelneming aan het verkeer van motorrijtuigen
      aanleiding kan geven en de controle op de verzekering tegen deze aansprakelijkheid (PbEU 2009, L 263), zoals
      gewijzigd.


