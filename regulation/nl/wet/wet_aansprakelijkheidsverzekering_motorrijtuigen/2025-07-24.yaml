        artikel: '1'
        hoofdstuk: '1'
  - number: '2'
    text: |-
      1 De bezitter van een motorrijtuig en degene op wiens naam dit in het kentekenregister is ingeschreven, zijn
      verplicht voor het motorrijtuig een verzekering te sluiten en in stand te houden welke aan de bij en krachtens deze
      wet gestelde bepalingen voldoet, indien dat motorrijtuig op een weg wordt geplaatst of daarmee op een weg wordt
      gereden, indien buiten een weg met dat motorrijtuig aan het verkeer wordt deelgenomen of indien dat motorrijtuig in
      het kentekenregister is ingeschreven en tenaamgesteld.

      2 In afwijking van het vorige lid rust de verplichting tot verzekering niet op de bezitter, maar op de houder die:

      a. het motorrijtuig op grond van een overeenkomst van huurkoop onder zich heeft, of

      b. het motorrijtuig in vruchtgebruik heeft, of

      c. anderszins het motorrijtuig, anders dan als bezitter, tot duurzaam gebruik onder zich heeft.

      3 De verplichting tot verzekering met betrekking tot een motorrijtuig dat in het kentekenregister is ingeschreven
      en tenaamgesteld, wordt opgeheven, indien het motorrijtuig buiten gebruik wordt gesteld en gehouden door plaatsing
      daarvan buiten een weg, gevolgd door een door de verzekeraar overeenkomstig [artikel 13][ref1] aan de Dienst
      Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref2], gedane kennisgeving van schorsing van
      de verzekering wegens buitengebruikstelling van het motorrijtuig. De in de vorige zin bedoelde opheffing van
      de verzekeringsplicht eindigt, zodra de verzekeraar overeenkomstig [artikel 13][ref3] aan de Dienst Wegverkeer
      kennis heeft gegeven van de beëindiging van de schorsing, zodra het motorrijtuig zich op een weg bevindt of zodra
      het buiten een weg deelneemt aan het verkeer. Bij of krachtens algemene maatregel van bestuur kunnen omtrent
      het in dit lid bepaalde nadere regels en voorwaarden worden gesteld. De in dit lid bedoelde opheffing van de
      verzekeringsplicht vindt slechts plaats, indien de tenaamstelling van het desbetreffende motorrijtuig in het
      kentekenregister is geschorst overeenkomstig [artikel 67 van de Wegenverkeerswet 1994][ref4].

      4 De verplichting tot verzekering is geschorst, zolang een door een ander gesloten verzekering overeenkomstig
      de bepalingen van deze wet met betrekking tot het motorrijtuig van kracht is. De verplichting tot verzekering
      is echter niet geschorst gedurende de in [artikel 13, vierde lid][ref5], en de in [artikel 13][ref6], bedoelde
      periode. Hetzelfde geldt voor de periode die voortvloeit uit [artikel 13][ref7].

      5 De verzekering moet zijn gesloten bij een schadeverzekeraar die ingevolge de
      [Wet op het financieel toezicht][ref8] in Nederland zijn bedrijf in de branche Aansprakelijkheid motorrijtuigen
      mag uitoefenen.

      6 Het eerste lid is niet van toepassing op motorrijtuigen die gewoonlijk in het buitenland zijn gestald, mits een
      voor dat doel door Onze Minister van Financiën erkend bureau, dat rechtspersoon met volledige rechtsbevoegdheid
      is, of groep van verzekeraars, dan wel een, bij algemene maatregel van bestuur daartoe erkende, in Nederland
      gevestigde buitenlandse instantie tegenover de benadeelden de verplichting op zich heeft genomen de schade, door
      die motorrijtuigen veroorzaakt, overeenkomstig de bepalingen van deze wet te vergoeden.

      7 Voor de toepassing van deze wet worden geacht gewoonlijk in Nederland te zijn gestald:

      a. motorrijtuigen die zijn voorzien van een kenteken, ongeacht of het een permanent of tijdelijk kenteken betreft;

      b. motorrijtuigen die ten onrechte niet zijn voorzien van een kenteken dan wel van een buitenlands kenteken, of
      zijn voorzien van een kenteken dan wel van een buitenlands kenteken dat niet overeenkomt of niet langer overeenkomt
      met het motorrijtuig, die in Nederland betrokken raken bij een ongeval, uitsluitend met het oog op het afwikkelen
      van een vordering door het bureau, bedoeld in het zesde lid, of het Waarborgfonds Motorverkeer;

      c. motorrijtuigen, die vanuit een andere lidstaat naar Nederland worden verzonden, vanaf de aanvaarding van de
      levering door de koper, gedurende een periode van maximaal 30 dagen, zelfs indien het motorrijtuig niet officieel
      in Nederland is geregistreerd, met uitzondering van motorrijtuigen die in een andere lidstaat krachtens de aldaar
      geldende wettelijke regeling zijn geregistreerd en ten aanzien waarvan in die andere lidstaat een verzekering is
      gesloten ter dekking van de burgerrechtelijke aansprakelijkheid voor de door het motorrijtuig veroorzaakte schade.

      Voor de toepassing van deze wet worden geacht gewoonlijk in het buitenland te zijn gestald:

      d. motorrijtuigen waarvoor een bijzonder kenteken met beperkte geldigheidsduur overeenkomstig een door Onze
      Minister van Verkeer en Waterstaat vastgesteld model is opgegeven;

      e. motorrijtuigen die van de toepassing van [artikel 36, eerste lid, van de Wegenverkeerswet 1994][ref9] zijn
      uitgezonderd en waarvoor een militair registratienummer is opgegeven;

      f. motorrijtuigen die in een ander land krachtens de aldaar geldende wettelijke regeling zijn geregistreerd of van
      een verzekeringsplaat of ander onderscheidingsteken zijn voorzien.

      8 Tot de motorrijtuigen met betrekking waartoe het bureau de in het zesde lid bedoelde verplichting op zich neemt,
      behoren in ieder geval de motorrijtuigen, welke gewoonlijk zijn gestald in een land dat ter uitvoering van deze
      bepaling bij algemene maatregel van bestuur is aangewezen, voor zover bij die maatregel daarvoor geen uitzondering
      is gemaakt.

      9 De schadeverzekeraars die ingevolge de [Wet op het financieel toezicht][ref10] in Nederland hun bedrijf in de
      branche Aansprakelijkheid motorrijtuigen mogen uitoefenen, betalen jaarlijks aan het bureau, bedoeld in het zesde
      lid, de door het bureau te bepalen bijdragen, berekend op basis van de in Nederland geboekte premie of het aantal
      en de aard van de door ieder van hen in Nederland verzekerde motorrijtuigen.


