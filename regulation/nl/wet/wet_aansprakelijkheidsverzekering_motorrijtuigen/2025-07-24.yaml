  - number: 24b
    text: |-
      1 Onverminderd het bepaalde in [artikel 24][ref1], betalen de schadeverzekeraars met zetel in Nederland die
      een vergunning hebben als bedoeld in [artikel 2:27, eerste lid, van de Wet op het financieel toezicht][ref2]
      voor de uitoefening van hun bedrijf in de branche Aansprakelijkheid motorrijtuigen, jaarlijks aan het fonds
      een door het fonds te bepalen bedrag ter financiering van de verplichtingen van het fonds ingevolge de
      [artikelen 26a tot en met 26c][ref3]. Dit bedrag wordt berekend op basis van het aantal en de aard van de door
      ieder van hen in Nederland of in een andere lidstaat verzekerde motorrijtuigen.

      2 Onverminderd het bepaalde in [artikel 24][ref4], betalen de schadeverzekeraars met
      zetel in een staat die geen lidstaat is en die een vergunning hebben als bedoeld in
      [artikel 2:40, eerste lid, van de Wet op het financieel toezicht][ref5] voor de uitoefening van hun bedrijf in
      de branche Aansprakelijkheid motorrijtuigen, jaarlijks aan het fonds een door het fonds te bepalen bedrag ter
      financiering van de verplichtingen van het fonds ingevolge de [artikelen 26a tot en met 26c][ref6]. Dit bedrag
      wordt berekend op basis van het aantal en de aard van de door ieder van hen in Nederland verzekerde motorrijtuigen.

      3 De bepaling van de bedragen bedoeld in het eerste en tweede lid geschiedt uiterlijk op 30 juni van ieder jaar. De
      storting moet geschieden binnen een maand na het besluit tot bepaling van het verschuldigde bedrag.

      4 De bedragen bedoeld in het eerste en tweede lid worden door het fonds afzonderlijk van de in
      [artikel 24, eerste en derde lid][ref7], bedoelde bedragen geadministreerd.

      5 De kosten die voortvloeien uit de verplichtingen die het fonds ingevolge de [artikelen 26a tot en met 26c][ref8]
      heeft, worden uitsluitend uit de krachtens het eerste en tweede lid ontvangen bedragen voldaan. Niettemin is
      het fonds bevoegd deze kosten in eerste instantie te voldoen uit de krachtens [artikel 24, eerste lid][ref9],
      ontvangen bedragen, mits het fonds het aldus aangewende bedrag binnen een jaar aanvult met de krachtens het eerste
      en tweede lid ontvangen bedragen.

      6 Over de kosten die op grond van het vijfde lid worden voldaan uit de krachtens [artikel 24, eerste lid][ref10],
      ontvangen bedragen wordt rente in rekening gebracht. De hoogte van deze rente is gebaseerd op de rente bedoeld in
      [artikel 4, eerste lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref11].

      7 Het fonds brengt van de krachtens het eerste en tweede lid ontvangen bedragen jaarlijks een bedrag over naar zijn
      algemene middelen.

      8 De schadeverzekeraars bedoeld in het eerste en tweede lid, waarborgen, ieder overeenkomstig het aantal en de aard
      van de door hen verzekerde motorrijtuigen als bedoeld in het eerste en tweede lid, de verplichtingen van het fonds
      ingevolge de [artikelen 26a tot en met 26c][ref12].


