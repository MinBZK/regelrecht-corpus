  - number: '12'
    text: |-
      1 De verzekering met betrekking tot een motorrijtuig dat een kenteken behoeft, eindigt, wanneer de verplichting
      tot verzekering op een ander overgaat. De verzekeringnemer moet binnen acht dagen na de overgang daarvan mededeling
      doen aan de verzekeraar. Indien de overgang het gevolg is van het overlijden van de verzekeringnemer, rust de
      verplichting tot mededeling op diens erfgenamen en is de termijn, binnen welke de mededeling moet zijn verricht,
      dertig dagen.

      2 De verzekering met betrekking tot een motorrijtuig dat geen kenteken behoeft, eindigt niet, wanneer de
      verplichting tot verzekering op een ander overgaat.

      3 Van het bepaalde in dit artikel kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel12
  - number: '13'
    text: |-
      1 De verzekeraar is verplicht ten aanzien van de verzekering waartoe deze wet verplicht met betrekking tot een
      motorrijtuig dat een kenteken behoeft aan de Dienst Wegverkeer, bedoeld in [artikel 4][ref1], kennis te geven van:

      a. het sluiten van de verzekering;

      b. de beëindiging, de vernietiging en de ontbinding van de verzekering;

      c. de in [artikel 2, derde lid][ref2], bedoelde schorsing van de verzekering en de beëindiging van die schorsing;

      d. iedere andere schorsing van de verzekering of van de dekking,

      alsmede van het einde van die schorsing.

      2 De Dienst Wegverkeer houdt een register aan waarin de in het eerste lid genoemde kennisgevingen worden
      aangetekend, alsmede de door de verzekeraars gedane kennisgevingen, bedoeld in [artikel 13][ref3].

      3 Geen kennisgeving behoeft echter te geschieden, indien ten gevolge van het sluiten van een nieuwe verzekering
      tussen dezelfde partijen en ten aanzien van hetzelfde motorrijtuig het in [artikel 3][ref4] bedoelde risico zonder
      onderbreking blijft gedekt.

      4 De verplichtingen van de verzekeraar jegens de benadeelde blijven bestaan voor ongevallen en gebeurtenissen
      welke plaats vinden binnen 16 dagen na de aanvang van de dag, volgende op die waarop volgens de kennisgeving
      van de verzekeraar de verzekering is beëindigd, vernietigd, ontbonden of geschorst of de dekking is geschorst,
      mits de kennisgeving binnen 30 dagen na de aanvang van die dag bij de Dienst Wegverkeer is gedaan. Indien de
      verzekeraar de kennisgeving niet binnen de in de vorige zin bedoelde termijn van 30 dagen heeft gedaan, blijven
      zijn verplichtingen jegens de benadeelde bestaan voor ongevallen en gebeurtenissen welke plaats vinden binnen 16
      dagen na de aanvang van de dag, volgende op die waarop de kennisgeving bij de Dienst Wegverkeer is ingediend. De
      [Algemene termijnenwet][ref5] is op de in dit lid genoemde termijnen niet van toepassing.

      5 Deze verplichtingen eindigen echter van rechtswege door het van kracht worden van een nieuwe verzekering welke
      ten aanzien van hetzelfde motorrijtuig het in [artikel 3][ref6] bedoelde risico dekt.

      6 Een kennisgeving overeenkomstig het eerste lid wordt mede gedaan ten aanzien van verzekeringen
      waartoe deze wet verplicht met betrekking tot motorrijtuigen die voor herstel of bewerking ter
      beschikking zijn gesteld van een natuurlijke persoon of een rechtspersoon en die zijn voorzien van een
      kenteken dat niet voor een bepaald voertuig is opgegeven, overeenkomstig het bepaalde bij of krachtens
      [artikel 37, derde lid van de Wegenverkeerswet 1994][ref7].

      7 De verzekeraar die als zodanig in het register wordt aangewezen, kan de benadeelde niet tegenwerpen dat hij niet
      de in de [eerste zin van het eerste lid van artikel 6][ref8] bedoelde verzekeraar is, tenzij hij aantoont dat de
      registratie ten onrechte is geschied of dat zijn verplichtingen op grond van een kennisgeving overeenkomstig het
      eerste lid, onder *b, c* of *d*, niettemin jegens de benadeelde zijn geëindigd.

      8 Voor de uitvoering van dit artikel en van [artikel 13][ref9] worden bij of krachtens algemene maatregel van
      bestuur nadere regels gesteld.


