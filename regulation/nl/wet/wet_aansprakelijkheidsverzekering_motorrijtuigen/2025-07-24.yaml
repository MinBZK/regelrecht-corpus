  - number: 26b
    text: |-
      1 Als bij het fonds een vordering als bedoeld in [artikel 26a, eerste of tweede lid][ref1], is ingediend, stelt
      het fonds de volgende instellingen of personen hiervan in kennis:

      a. het orgaan bedoeld in artikel 10bis of artikel 25bis van de richtlijn in de lidstaat van herkomst van de
      verzekeraar;

      b. als de vordering betrekking heeft op de vergoeding van schade als gevolg van feiten die zich hebben voorgedaan
      in een andere staat dan de lidstaat van woonplaats van de benadeelde, het schadevergoedingsorgaan bedoeld in
      artikel 24 van de richtlijn in de lidstaat van woonplaats van de benadeelde; en

      c. de verzekeraar of zijn bewindvoerder of liquidateur in de zin van artikel 268, eerste lid, onderdeel e)
      respectievelijk onderdeel f) van [richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad van
      25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf
      (Solvabiliteit II) (PbEU 2009, L 335), dan wel de Nederlandsche Bank N.V.

      2 Een verzekeraar die verkeert in een situatie als bedoeld in [artikel 26a, eerste lid][ref2], dan wel zijn
      bewindvoerder of liquidateur bedoeld in het vorige lid, of de Nederlandsche Bank N.V., stelt het fonds of het
      orgaan bedoeld in artikel 10bis of artikel 25bis van de richtlijn in een andere lidstaat ervan in kennis als hij
      een vergoeding uitkeert of zijn aansprakelijkheid afwijst met betrekking tot een vordering die ook bij dit fonds of
      dit orgaan is ingediend.

      3 Aan degenen die een vordering bij het fonds hebben ingediend als bedoeld in
      [artikel 26a, eerste of tweede lid][ref3], doet het fonds, aan de hand van onder meer de inlichtingen die het op
      zijn verzoek van hen heeft verkregen, binnen drie maanden een met redenen omkleed voorstel tot schadevergoeding,
      als het heeft vastgesteld dat op grond van artikel 26a, eerste of tweede lid, een recht op schadevergoeding
      bestaat, de vordering niet wordt betwist en de schade geheel of gedeeltelijk is begroot. Als het fonds heeft
      vastgesteld dat er geen recht op schadevergoeding op grond van artikel 26a, eerste of tweede lid, bestaat, als de
      burgerrechtelijke aansprakelijkheid bedoeld in artikel 26a, eerste of tweede lid, wordt afgewezen of niet duidelijk
      is vastgesteld, of als de schade niet volledig is begroot, geeft het fonds binnen drie maanden een met redenen
      omkleed antwoord op de verschillende onderdelen van de vordering.

      4 Het fonds keert een op grond van [artikel 26a, eerste of tweede lid][ref4], verschuldigde schadevergoeding
      onverwijld aan de benadeelde uit, en in ieder geval binnen drie maanden nadat de benadeelde het voorstel bedoeld
      in het vorige lid heeft aanvaard. Is een gedeelte van de schade begroot, dan is de vorige zin van toepassing op
      dit gedeelte.

      5 De [artikelen 6, tweede lid][ref5], [7][ref6] en [9][ref7] zijn van overeenkomstige toepassing ten opzichte van
      het fonds.

      6 De regels die op grond van het toepasselijke recht gelden voor de verjaring van de rechtsvordering van
      de benadeelde tegenover de verzekeraar, zijn van overeenkomstige toepassing op de rechtsvordering die de
      benadeelde ingevolge dit artikel en [artikel 26a][ref8] tegenover het fonds heeft, met dien verstande dat deze
      rechtsvordering in ieder geval met overeenkomstige toepassing van [artikel 10][ref9] verjaart door verloop van
      drie jaar te rekenen van het feit waaruit de schade is ontstaan.


