  - number: '3'
    text: |-
      1 De verzekering moet tegen betaling van één enkele premie, gedurende de gehele looptijd van de verzekering,
      met inbegrip van de perioden waarin het motorrijtuig zich op het grondgebied van een andere lidstaat bevindt,
      dekken de burgerrechtelijke aansprakelijkheid, waartoe het motorrijtuig in het verkeer aanleiding kan geven, van
      iedere bezitter, houder en bestuurder van het verzekerde motorrijtuig, alsmede van degenen die daarmede worden
      vervoerd, zulks met uitzondering van de burgerrechtelijke aansprakelijkheid van hen die zich na het sluiten van
      de verzekering door diefstal of geweldpleging de macht over het motorrijtuig hebben verschaft en van hen die, dit
      wetende, dat motorrijtuig zonder geldige reden gebruiken.

      2 De verzekering moet de schade omvatten, welke aan personen en aan zaken wordt toegebracht door feiten die zijn
      voorgevallen op het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing
      is. Hierin is begrepen de schade, toegebracht aan personen die onder welke titel ook, worden vervoerd door het
      motorrijtuig, dat de schade veroorzaakt; de zaken, door dat motorrijtuig vervoerd, kunnen van de verzekering worden
      uitgesloten, behoudens wanneer het betreft zaken, toebehorende aan personen, vervoerd krachtens een ingevolge de
      [Wet personenvervoer 2000][ref1] geldige vergunning. (*Stb*. 1987, 175)

      3 De verzekering moet voorts de schade omvatten welke aan personen en zaken wordt toegebracht door feiten,
      voorgevallen in bij algemene maatregel van bestuur aangewezen landen. De hoogte van de dekking van de schade,
      die bedoeld in het tweede en vijfde lid daaronder begrepen, wordt bepaald door de wetgeving van het land waar het
      feit is voorgevallen dan wel door de wetgeving van het land waar het motorrijtuig gewoonlijk is gestald, indien
      in laatstbedoeld land de dekking hoger is. Indien het bureau, bedoeld in [artikel 2 zesde lid][ref2], een zodanige
      schade heeft verrekend, heeft het voor het betaalde bedrag verhaal op degene op wie de verplichting tot verzekering
      rust, voor zover deze verplichting niet overeenkomstig het bepaalde in dit lid is nagekomen.

      4 In afwijking van het bepaalde in het derde lid moet ten aanzien van motorrijtuigen, als bedoeld in artikel 7
      van de richtlijn, de verzekering de schade omvatten welke aan personen en zaken wordt toegebracht door feiten,
      voorgevallen op het grondgebied waar de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is.

      5 In afwijking van het tweede lid, eerste zin, het derde lid, eerste zin en het vierde lid, moet ten aanzien van
      een motorrijtuig dat niet heeft te gelden als voertuig in de zin van artikel 1, onderdeel 1, van de richtlijn, de
      verzekering de schade omvatten, welke aan personen en aan zaken wordt toegebracht door feiten die zijn voorgevallen
      in Nederland en in bij algemene maatregel van bestuur aangewezen landen.

      6 De verzekering moet de burgerrechtelijke aansprakelijkheid voor de door het motorrijtuig veroorzaakte schade
      dekken zoals die aansprakelijkheid voortvloeit uit de toepasselijke wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
