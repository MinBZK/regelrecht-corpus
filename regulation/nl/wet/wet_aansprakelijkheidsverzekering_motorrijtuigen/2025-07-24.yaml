  - number: '25'
    text: |-
      1 Een benadeelde kan, wanneer er een burgerrechtelijke aansprakelijkheid voor de door een motorrijtuig veroorzaakte
      schade of een zodanige aansprakelijkheid als bedoeld in [artikel 3a][ref1] bestaat, een recht op schadevergoeding
      tegen het fonds geldend maken:

      a. wanneer niet kan worden vastgesteld wie de aansprakelijke persoon is, tenzij aannemelijk is, dat de benadeelde
      niet tot die vaststelling heeft gedaan, wat redelijkerwijs van hem kon worden verwacht;

      b. wanneer de verplichting tot verzekering niet is nagekomen;

      c. wanneer de schade voortvloeit uit een handelen of nalaten van degene die zich door diefstal of geweldpleging
      de macht over het motorrijtuig heeft verschaft of van hem die, dit wetende, dat motorrijtuig zonder geldige
      reden gebruikt, en de verzekeraar, de Staat, of degene, die krachtens [artikel 18][ref2] is vrijgesteld van de
      verzekeringsplicht deswege niet aansprakelijk is;

      d. wanneer op grond van een vrijstelling krachtens de [artikelen 17, derde lid][ref3], of [18][ref4] een
      verzekering niet is afgesloten.

      2 Het fonds is jegens het bureau, bedoeld in [artikel 2 zesde lid][ref5], voorts aansprakelijk voor hetgeen dit
      bureau heeft betaald ter zake van de schade, in een van de krachtens [artikel 3, derde lid][ref6], aangewezen
      landen veroorzaakt door een motorrijtuig dat gewoonlijk in Nederland is gestald en met betrekking waartoe krachtens
      [artikel 19, eerste lid][ref7], een geldig bewijs van vrijstelling is uitgereikt. Op de aansprakelijkheid van het
      fonds ingevolge de vorige zin is het bepaalde in de [eerste vijf leden van artikel 26][ref8] niet van toepassing.

      3 Het fonds geeft in de gevallen bedoeld in het eerste lid aan degenen die zich tot hem wenden voor vergoeding
      van de rechtstreeks door hen geleden schade, aan de hand van de inlichtingen die het op zijn verzoek van hen heeft
      verkregen, een met redenen omkleed antwoord met betrekking tot zijn tussenkomst.

      4 Indien het fonds en een verzekeraar het niet eens zijn over de vraag wie van hen de schade moet vergoeden, dient
      degene die als eerste werd aangesproken, tot vergoeding van de schade over te gaan. Indien mocht blijken dat de
      ander geheel of gedeeltelijk tot vergoeding van de schade gehouden is, zal deze tot verrekening overgaan.


