  - number: '30'
    text: |-
      1 Hij, die als bezitter, dan wel als degene op wiens naam een motorrijtuig in het kentekenregister is ingeschreven,
      dan wel als houder in de zin van [artikel 2, tweede lid][ref1], een motorrijtuig op een weg doet rijden of laat
      staan of toelaat dat daarmede op een weg wordt gereden of gestaan, of buiten een weg met een motorrijtuig deelneemt
      of toelaat dat daarmede wordt deelgenomen aan het verkeer zonder dat hij voor dat motorrijtuig een verzekering
      overeenkomstig deze wet heeft gesloten en in stand gehouden, wordt gestraft met hechtenis van ten hoogste drie
      maanden of geldboete van de tweede categorie.

      2 De in het vorige lid genoemde personen worden met gelijke straf gestraft, indien zij voor een motorrijtuig dat in
      het kentekenregister is ingeschreven en tenaamgesteld niet een verzekering overeenkomstig deze wet hebben gesloten
      en in stand gehouden.

      3 De in het eerste lid genoemde personen zijn niet strafbaar, indien op hen de verplichting tot verzekering niet
      rust.

      4 De bestuurder van een motorrijtuig die daarmede op een weg rijdt of staat of buiten een weg met een motorrijtuig
      deelneemt aan het verkeer zonder dat er voor dat motorrijtuig een verzekering overeenkomstig deze wet is gesloten
      en in stand gehouden, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de tweede
      categorie.

      5 De in het vorige lid bedoelde bestuurder is niet strafbaar indien:

      a. met betrekking tot het motorrijtuig vrijstelling van de verplichting tot verzekering is verleend en een geldig
      bewijs van die vrijstelling is uitgereikt;

      b. een in [artikel 2, zesde lid][ref2], bedoeld bureau, groep van verzekeraars of buitenlandse instantie de
      verplichting op zich heeft genomen de door het motorrijtuig veroorzaakte schade overeenkomstig de bepalingen van
      deze wet te vergoeden.

      6 Bij veroordeling wegens een strafbaar feit, omschreven in het eerste, tweede of vierde lid, kan de schuldige
      de bevoegdheid worden ontzegd motorrijtuigen te besturen voor de tijd van ten hoogste één jaar en ingeval tijdens
      het plegen van het strafbare feit nog geen vijf jaar zijn verlopen na het einde van de tijdsduur, waarvoor bij
      een vroegere onherroepelijke veroordeling de schuldige de bevoegdheid motorrijtuigen te besturen is ontzegd, voor
      de tijd van ten hoogste vijf jaren. Met een veroordeling wordt een strafbeschikking gelijkgesteld. Onder vroegere
      onherroepelijke veroordeling wordt mede verstaan een vroegere onherroepelijke veroordeling door een strafrechter
      in een andere lidstaat van de Europese Unie. Overigens zijn de bepalingen van de [Wegenverkeerswet 1994](onbekend),
      betreffende de bijkomende straf van ontzegging van de rijbevoegdheid motorrijtuigen te besturen van overeenkomstige
      toepassing.

      7 Bij veroordeling wegens een strafbaar feit, omschreven in het eerste, tweede of vierde lid, kan de rechter
      tevens de schuldige de bijkomende straf van betaling van een bedrag van ten hoogste € 2.723 aan het Waarborgfonds
      Motorverkeer opleggen. [Artikel 24a van het Wetboek van Strafrecht][ref3] en de [artikelen 6:4:2][ref4] en
      [6:4:7 van het Wetboek van Strafvordering][ref5] zijn van overeenkomstige toepassing.

      8 De in het vorige lid bedoelde bijkomende straf wordt ten uitvoer gelegd met overeenkomstige toepassing van
      de [artikelen 6:1:1][ref6], [6:1:2][ref7], [6:4:1][ref8], [6:4:3][ref9], [6:4:5][ref10], [6:4:6][ref11] en
      [6:4:8 van het Wetboek van Strafvordering][ref12]. Het openbaar ministerie draagt er zorg voor, dat de geïnde
      bedragen tegen kwijting aan het Waarborgfonds Motorverkeer worden uitgekeerd.


