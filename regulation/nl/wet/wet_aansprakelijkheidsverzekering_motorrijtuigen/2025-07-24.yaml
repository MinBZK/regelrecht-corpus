  - number: '14'
    text: |-
      1 De bestuurder van een motorrijtuig dat geen kenteken behoeft, alsmede de bestuurder van een motorrijtuig
      als bedoeld in [artikel 2, zevende lid, onder d en e][ref1], moet, tenzij bij of krachtens algemene maatregel
      van bestuur anders is bepaald, bij zich hebben een bij of krachtens die maatregel voorgeschreven bewijs van
      verzekering. De bestuurder van een motorrijtuig die bij een ongeval of een gebeurtenis is betrokken, is verplicht,
      wanneer hij ingevolge het bepaalde in dit lid een document bij zich moet hebben, dit behoorlijk ter inzage te
      verstrekken aan degenen die eveneens bij dat ongeval of die gebeurtenis zijn betrokken.

      2 De verplichtingen van de verzekeraar die een bewijs van verzekering heeft uitgereikt, eindigen slechts
      door het verloop van een termijn van 16 dagen na afloop van de periode waarvoor het bewijs is afgegeven. De
      [Algemene termijnenwet][ref2] is op deze termijn niet van toepassing.

      3 Deze verplichtingen eindigen echter van rechtswege na het van kracht worden van een nieuwe verzekering welke ten
      aanzien van hetzelfde motorrijtuig het in [artikel 3][ref3] bedoelde risico dekt.

      4 In afwijking van het tweede lid eindigen de verplichtingen van het bureau bedoeld in
      [artikel 2, zesde lid][ref4], door verloop van de geldigheidsduur van het, voor het motorrijtuig afgegeven,
      internationale verzekeringsbewijs, indien die verplichtingen uit de afgifte van dat bewijs voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002448
