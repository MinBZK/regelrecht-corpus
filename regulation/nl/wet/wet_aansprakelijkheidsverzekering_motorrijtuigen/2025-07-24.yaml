  - number: '18'
    text: |-
      1 Van de verplichting tot het sluiten van een verzekering kunnen, op een daartoe aan Onze Minister van Financiën
      gedaan verzoek, worden vrijgesteld de in [artikel 2, eerste en tweede lid][ref1], bedoelde personen die
      gemoedsbezwaren hebben tegen het sluiten van een verzekering. Rechtspersonen kunnen van de in de vorige zin
      bedoelde verplichting worden vrijgesteld, indien natuurlijke personen die bij die rechtspersonen betrokken zijn
      gemoedsbezwaren hebben tegen het sluiten van een verzekering. Bij algemene maatregel van bestuur kunnen omtrent het
      in de vorige zin bepaalde nadere regels worden gesteld. Het bepaalde in de tweede en derde zin van het eerste lid
      van het vorige artikel is, ingeval een vrijstelling is verleend, van overeenkomstige toepassing.

      2 Het verzoek geschiedt door indiening bij Onze Minister van Financiën van een door de verzoeker ondertekende
      verklaring, waarvan het model door Onze genoemde Minister wordt vastgesteld. Uit de verklaring moet blijken dat de
      verzoeker overwegende gemoedsbezwaren heeft tegen elke verzekering, welke ook, en dat hij mitsdien noch zichzelf
      noch iemand anders noch hem toebehorende goederen heeft verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: '19'
    text: |-
      1 Indien de in [artikel 18 tweede lid][ref1] bedoelde verklaring naar het oordeel van Onze Minister van Financiën
      overeenkomstig de waarheid is, verleent hij de verzoeker de gevraagde vrijstelling. Ten bewijze van de vrijstelling
      reikt hij voor elk van de motorrijtuigen waarvan de vrijgestelde de bezitter, degene, op wiens naam deze in het
      kentekenregister zijn ingeschreven, dan wel de in [artikel 2, tweede lid][ref2], bedoelde houder is, tegen betaling
      een bewijs uit, dat ten hoogste een jaar geldig is. De bestuurders van deze motorrijtuigen moeten een geldig bewijs
      van vrijstelling bij zich hebben. Zolang de vrijstelling geldt, wordt het bewijs op verzoek van de vrijgestelde
      tegen betaling van jaar tot jaar vernieuwd. Het model van dit bewijs wordt vastgesteld door Onze voornoemde
      Minister.

      2 Onze Minister van Financiën kan de verleende vrijstelling intrekken:

      a. op verzoek van de vrijgestelde;

      b. indien de gemoedsbezwaren, op grond waarvan vrijstelling is verleend, naar zijn oordeel niet langer geacht
      kunnen worden te bestaan;

      c. indien gedurende een termijn van tenminste één jaar geen bewijs van vrijstelling is uitgereikt;

      d. indien de vrijgestelde in gebreke blijft binnen twee maanden het bedrag, verschuldigd voor het verkrijgen van
      een in het eerste lid bedoeld bewijs, te betalen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen omtrent het in de vorige leden bepaalde
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel2
