  - number: 27g
    text: |-
      Indien een benadeelde binnen zeven jaar te rekenen van het feit waaruit de schade is ontstaan, daartoe een verzoek
      indient, verstrekt het Informatiecentrum onverwijld de volgende informatie:

      a. de naam en het adres van de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt;

      b. het polisnummer; en

      c. de naam en het adres van de schaderegelaar van de verzekeraar, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27g
  - number: 27h
    text: |-
      1 Indien een benadeelde er rechtmatig belang bij heeft, deelt het Informatiecentrum hem naam en adres van de
      bezitter, van degene, op wiens naam het motorrijtuig in het kentekenregister is ingeschreven of van de houder van
      het motorrijtuig mee. Het Informatiecentrum informeert daartoe in het bijzonder bij:

      a. de verzekeraar; of

      b. de Dienst Wegverkeer.

      2 Indien voor het motorrijtuig de afwijking geldt van artikel 5, eerste lid, van de richtlijn deelt het
      Informatiecentrum de benadeelde de naam mee van de autoriteit of de instantie die overeenkomstig artikel 5, eerste
      lid, derde alinea, van de richtlijn is belast met de schadevergoeding aan de benadeelden, indien de procedure van
      artikel 2, onderdeel a, van de richtlijn niet van toepassing is.

      3 Indien voor het motorrijtuig de afwijking geldt van artikel 5, tweede lid, van de richtlijn deelt het
      Informatiecentrum de benadeelde de naam mee van de instantie waaronder het motorrijtuig ressorteert in de lidstaat
      waar het gewoonlijk is gestald.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27h
  - number: 27i
    text: |-
      Het Informatiecentrum werkt samen met de informatiecentra die in de andere lidstaten zijn aangewezen. Ten
      aanzien van motorrijtuigen die vanuit een lidstaat naar een andere lidstaat worden verzonden, werkt het
      Informatiecentrum samen met de informatiecentra die in andere lidstaten zijn aangewezen om ervoor te zorgen de in
      de [artikelen 27f tot en met 27h][ref1] bedoelde gegevens met betrekking tot deze motorrijtuigen beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27f
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27i
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27f
        hoofdstuk: 4a
  - number: 27j
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. schade: schade ten gevolge van feiten, veroorzaakt door deelneming aan het verkeer van motorrijtuigen die
      gewoonlijk zijn gestald en verzekerd in een andere lidstaat dan Nederland en die zich ofwel hebben voorgedaan in
      een andere lidstaat dan die van de woonplaats van de benadeelde, ofwel in een staat buiten de Europese Unie waar
      een bureau, groep van verzekeraars of instantie werkzaam is dat onderscheidenlijk die overeenkomt met het bureau,
      bedoeld in [artikel 2, zesde lid][ref1];

      b. benadeelden: personen met woonplaats in Nederland die schade als bedoeld in onderdeel a hebben geleden, alsmede
      hun rechtverkrijgenden, evenwel met uitsluiting van verzekeraars, uitvoeringsinstellingen als bedoeld in artikel
      41, derde lid, van de Organisatiewet sociale verzekeringen 1997, en andere instanties die door vergoeding van de
      schade in de rechten van deze personen zijn getreden;

      c. verzekeraar: de verzekeraar die in een lidstaat in het bezit is van een vergunning als bedoeld in artikel 14 of
      162 van [richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad van 25 november 2009 betreffende
      de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009,
      L 335);

      d. motorrijtuig: voertuig in de zin van artikel 1, onderdeel 1, van de richtlijn of bij algemene maatregel
      van bestuur aangewezen motorrijtuig als bedoeld in artikel 1 dat gewoonlijk is gestald in een bij die algemene
      maatregel van bestuur aangewezen lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27j
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: '2'
        hoofdstuk: '1'
  - number: 27k
    text: |-
      1 Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige
      rechtsbevoegdheid aan als Schadevergoedingsorgaan dat tot taak heeft in de gevallen, genoemd in artikel 27o, eerste
      lid, schade te vergoeden aan benadeelden.

      2 Een aanwijzing vindt slechts plaats, indien de rechtspersoon aan de volgende eisen voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.

      3 Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing intrekken, indien de
      rechtspersoon naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan wel indien de
      rechtspersoon anderszins zijn taak niet meer onafhankelijk vervult.

      4 Intrekking van een aanwijzing geschiedt onder gelijktijdige voorziening door Onze Minister van Justitie en Onze
      Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij nadere regels kunnen stellen.

      5 Een aanwijzing en een intrekking van een aanwijzing worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27k
  - number: 27l
    text: |-
      Het Schadevergoedingsorgaan kan zijn statuten niet wijzigen, tenzij de wijziging door Onze Minister van Justitie en
      Onze Minister van Financiën is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27l
  - number: 27m
    text: |-
      1 Het Schadevergoedingsorgaan verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle
      gevraagde inlichtingen omtrent de uitvoering van zijn taak.

      2 Het Schadevergoedingsorgaan zendt jaarlijks binnen zes maanden na afloop van het boekjaar aan Onze Minister van
      Justitie en Onze Minister van Financiën de balans en de staat van baten en lasten alsmede het bestuursverslag over
      het betrokken boekjaar. Deze stukken gaan vergezeld van een verklaring omtrent de getrouwheid, afgelegd door een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27m
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 27n
    text: |-
      Bij de aanwijzing, bedoeld in [artikel 27k, eerste lid][ref1], wordt bepaald op welke wijze de vergoeding door het
      Schadevergoedingsorgaan van schade als bedoeld in [artikel 27r][ref2], wordt bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27k
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel27r
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27n
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27k
        hoofdstuk: 4b
      - id: ref2
        bwb_id: BWBR0002415
        artikel: 27r
        hoofdstuk: 4b
  - number: 27o
    text: |-
      1 Een benadeelde kan, wanneer er een burgerrechtelijke aansprakelijkheid voor schade bestaat, een verzoek
      schadevergoeding indienen bij het Schadevergoedingsorgaan, indien:

      a. binnen drie maanden na de datum waarop hij zijn verzoek tot schadevergoeding heeft ingediend bij de verzekeraar
      van het motorrijtuig waarmee de schade is veroorzaakt, of bij diens schaderegelaar in Nederland, die verzekeraar of
      die schaderegelaar hem geen met redenen omkleed antwoord op het verzoek heeft verstrekt;

      b. de verzekeraar heeft nagelaten om in Nederland een schaderegelaar aan te stellen;

      c. de verzekeraar niet kan worden geïdentificeerd binnen twee maanden na het voorvallen van het feit waaruit de
      schade is ontstaan; of

      d. het motorrijtuig niet kan worden geïdentificeerd.

      2 Een benadeelde kan geen verzoek tot schadevergoeding indienen bij het Schadevergoedingsorgaan:

      a. in het geval, bedoeld in het eerste lid, onderdeel b, indien hij zijn verzoek tot schadevergoeding rechtstreeks
      heeft ingediend bij de verzekeraar en hij binnen drie maanden na de indiening van het verzoek een met redenen
      omkleed antwoord heeft ontvangen; of

      b. indien hij rechtstreeks tegen de verzekeraar een rechtsvordering heeft ingesteld.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27o
  - number: 27p
    text: |-
      1 Het Schadevergoedingsorgaan neemt het verzoek tot schadevergoeding in behandeling binnen twee maanden nadat de
      benadeelde het verzoek heeft ingediend.

      2 Het Schadevergoedingsorgaan beëindigt de behandeling van het verzoek zodra de verzekeraar of diens schaderegelaar
      in Nederland binnen de in het eerste lid genoemde periode van twee maanden alsnog een met redenen omkleed antwoord
      op het verzoek heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27p
  - number: 27q
    text: |-
      Het Schadevergoedingsorgaan stelt de navolgende partijen onmiddellijk in kennis van het bij hem ingediende verzoek
      tot schadevergoeding met de mededeling dat het verzoek binnen twee maanden na de indiening ervan in behandeling
      wordt genomen:

      a. de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt, of diens schaderegelaar;

      b. het schadevergoedingsorgaan in de lidstaat van vestiging van de verzekeraar, bedoeld in onderdeel a; en

      c. indien deze bekend is, de persoon die de schade heeft veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27q
  - number: 27r
    text: |-
      Het Schadevergoedingsorgaan gaat slechts over tot vergoeding van schade, indien de benadeelde aantoont dat hij
      alle bekende als zodanig aansprakelijke personen en, voor zover de aansprakelijkheid van deze personen behoort
      te zijn verzekerd volgens de desbetreffende wetgeving van de lidstaat waar het motorrijtuig waarmee de schade
      is veroorzaakt, gewoonlijk is gestald, hun verzekeraars of hun schaderegelaars in Nederland tot betaling heeft
      aangemaand.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27r
  - number: 27s
    text: |-
      Het Schadevergoedingsorgaan vergoedt geen schade, hoger dan de wettelijk vastgelegde bedragen in de lidstaat
      waar het feit heeft plaatsgevonden waaruit de schade is ontstaan, dan wel in de lidstaat waar het motorrijtuig
      gewoonlijk is gestald, indien in laatstbedoelde lidstaat de dekking hoger is.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27s
  - number: 27t
    text: |-
      1 Na vergoeding van schade aan een benadeelde heeft het Schadevergoedingsorgaan recht van verhaal:

      a. in de in [artikel 27o, eerste lid, onderdelen a en b][ref1] genoemde gevallen op het schadevergoedingsorgaan in
      de lidstaat van vestiging van de verzekeraar van het motorrijtuig waarmee de schade is veroorzaakt;

      b. in het in [artikel 27o, eerste lid, onderdeel c][ref2] genoemde geval op het nationale waarborgfonds in de
      lidstaat waar het motorrijtuig waarmee de schade is veroorzaakt gewoonlijk is gestald, dat overeenkomt met het
      Waarborgfonds Motorverkeer;

      c. in het in [artikel 27o, eerste lid, onderdeel d][ref3] genoemde geval op het nationale waarborgfonds in de
      lidstaat waar het feit heeft plaatsgevonden waaruit de schade is ontstaan, dat overeenkomt met het Waarborgfonds
      Motorverkeer;

      d. indien het ongeval is veroorzaakt door een motorrijtuig uit een staat buiten de Europese Unie, waar een bureau,
      groep van verzekeraars of instantie werkzaam is dat, onderscheidenlijk die overeenkomt met het bureau, bedoeld
      in [artikel 2, zesde lid][ref4], en waarvan de verzekeraar binnen twee maanden na het ongeval niet kan worden
      geïdentificeerd, op het nationale waarborgfonds in de lidstaat waar het feit heeft plaatsgevonden waaruit de schade
      is ontstaan, dat overeenkomt met het Waarborgfonds Motorverkeer.

      2 Indien een schadevergoedingsorgaan uit een andere lidstaat een persoon in diens lidstaat schade heeft
      vergoed op basis van wetgeving die overeenkomt met [artikel 27o][ref5] en daarna verhaal zoekt op het
      Schadevergoedingsorgaan, restitueert het Schadevergoedingsorgaan de door het schadevergoedingsorgaan uit die andere
      lidstaat betaalde bedrag. Het Schadevergoedingsorgaan meldt de naam van de betrokken verzekeraar aan de Pensioen-
      & Verzekeringskamer.

      3 Indien op het Schadevergoedingsorgaan verhaal is genomen door een schadevergoedingsorgaan uit een andere
      lidstaat, heeft het voor het betaalde bedrag verhaal op degene die burgerrechtelijk aansprakelijk is of op diens
      verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002415#Artikel27o
