  - number: '28'
    text: |-
      1 De [artikelen 5 tot en met 15][ref1] blijven van toepassing op een schadeverzekeraar als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2] met betrekking tot de schade tengevolge van een ongeval
      of een gebeurtenis dat heeft plaatsgehad voor of binnen 30 dagen na de intrekking van de vergunning dan wel
      de intrekking van een overeenkomstige vergunning indien het een verzekeraar met zetel in een andere lidstaat
      betreft, of het besluit als bedoeld in [artikel 1:58, tweede lid, van de Wet op het financieel toezicht][ref3]. De
      [Algemene Termijnenwet][ref4] is op deze termijn niet van toepassing.

      2 Degene die met een verzekeraar die niet of niet meer in het bezit is van een vergunning dan wel een
      overeenkomstige vergunning indien het een verzekeraar met zetel in een andere lidstaat betreft, of ten aanzien van
      wie een besluit is genomen als bedoeld in [artikel 1:58, tweede lid, van de Wet op het financieel toezicht][ref5],
      een verzekering heeft gesloten waartoe deze wet verplicht, kan deze verzekering door opzegging beëindigen; de
      verzekeraar geeft alsdan de vooruitbetaalde premie terug voor het gedeelte dat evenredig is aan het op de datum
      van de ontvangst der opzegging nog niet verstreken gedeelte van de termijn, waarvoor de premie werd betaald, onder
      aftrek van een door de Nederlandsche Bank N.V. te bepalen percentage van het terug te betalen bedrag aan onkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel5
