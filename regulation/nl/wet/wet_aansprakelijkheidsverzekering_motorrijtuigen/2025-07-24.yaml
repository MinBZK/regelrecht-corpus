  - number: '5'
    text: |-
      Indien de overeenkomst een beding inhoudt dat de verzekerde persoonlijk voor een deel in de vergoeding van
      de schade zal bijdragen, blijft de verzekeraar niettemin jegens de benadeelde gehouden tot betaling van de
      schadeloosstelling die krachtens de overeenkomst ten laste van de verzekerde blijft.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel5
  - number: 5a
    text: |-
      1 De verzekeringnemer heeft te allen tijde het recht van de verzekeraar een verklaring te verzoeken omtrent de
      ingediende schadevorderingen of het ontbreken daarvan ten aanzien van het door de verzekering gedekte motorrijtuig
      of de gedekte motorrijtuigen gedurende ten minste de laatste 5 voorafgaande jaren van de looptijd van de
      verzekering. De verzekeraar verstrekt deze verklaring binnen 15 dagen na indiening van het verzoek aan de hand van
      het op grond van artikel 16 van de richtlijn vastgestelde model.

      2 Een verzekeraar maakt op zijn website openbaar op welke wijze hij bij het berekenen van de premie voor de in
      [artikel 2, eerste lid][ref1], bedoelde verzekering gebruik maakt van de in het eerste lid bedoelde verklaringen.

      3 Een verzekeraar maakt, als hij bij het berekenen van de premie of bij het toekennen van kortingen rekening houdt
      met verklaringen als bedoeld in het eerste lid, geen onderscheid tussen verzekeringnemers uitsluitend op grond van
      hun vorige lidstaat van woonplaats. Een verzekeraar kent bij het berekenen van de premie en bij het toekennen van
      kortingen op de premie eenzelfde gewicht toe aan verklaringen als bedoeld in het eerste lid die in Nederland zijn
      afgegeven als aan verklaringen die in een andere lidstaat zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel2
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel5a
    references:
