      - id: ref2
        bwb_id: BWBR0005034
        artikel: '1220'
  - number: 6a
    text: |-
      Is bij een ongeval zowel een motorrijtuig betrokken als een aanhangwagen dat aan dit motorrijtuig is gekoppeld
      of na koppeling daarvan is losgemaakt of losgeraakt en is de aanhangwagen afzonderlijk verzekerd tegen de
      burgerrechtelijke aansprakelijkheid waartoe in het verkeer aanleiding wordt gegeven, dan stelt de verzekeraar
      van de aanhangwagen de benadeelde op diens verzoek onverwijld in kennis van de identiteit van de verzekeraar van
      het motorrijtuig, indien de verzekeraar van de aanhangwagen niet zelf gehouden is de schade van de benadeelde
      volledig te vergoeden. Als de verzekeraar van de aanhangwagen niet in staat is de verzekeraar van het motorrijtuig
      te identificeren, stelt deze de benadeelde onverwijld in kennis van de in de lidstaat van het ongeval geldende
      schadevergoedingsregeling overeenkomstig artikel 10 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel6a
  - number: '7'
    text: |-
      1 Voor de uitvoering van de bepalingen van deze wet kan de verzekeraar door de benadeelde worden gedagvaard, hetzij
      voor de rechter van de plaats van het feit, waaruit de schade is ontstaan, hetzij voor de rechter van de woonplaats
      van de benadeelde, hetzij voor de rechter van de zetel van de verzekeraar.

      2 De aansprakelijke persoon kan door de benadeelde worden gedagvaard, hetzij voor de rechter van de plaats van het
      feit, waaruit de schade is ontstaan, hetzij voor de rechter van de woonplaats van de benadeelde, hetzij voor de
      rechter van de woonplaats van de aansprakelijke persoon.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel7
  - number: '8'
    text: |-
      De verzekerden moeten van ieder ongeval en iedere gebeurtenis waarvan zij kennis dragen, mededeling doen aan
      de verzekeraar, indien bij dat ongeval of die gebeurtenis het verzekerde motorrijtuig is betrokken en schade is
      ontstaan tot welker dekking door verzekering deze wet verplicht. De verzekeringnemer moet aan de verzekeraar alle
      door de verzekeringsovereenkomst voorgeschreven inlichtingen en bescheiden verschaffen. De overige verzekerden
      moeten aan de verzekeraar op zijn verzoek alle nodige inlichtingen en bescheiden verschaffen.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel8
  - number: '9'
    text: |-
      1 Aan een vonnis gewezen in een geschil ter zake van door een motorrijtuig veroorzaakte schade, komt tegenover de
      verzekeraar, de verzekerde of de benadeelde gezag van gewijsde toe, indien zij in het geding de positie van een
      procespartij hebben gehad.

      2 Voorts kan het vonnis dat is gewezen in een geschil tussen de benadeelde en de verzekerde, worden tegengeworpen
      aan de verzekeraar, indien is komen vast te staan dat de laatste in feite de leiding van het geding op zich heeft
      genomen; aan de verzekeraar staat alsdan geen tegenbewijs open tegen de bij gewijsde als bewezen aangenomen feiten.

      3 De verzekeraar kan de verzekerde in het geding roepen, dat door de benadeelde tegenover hem wordt ingesteld. De
      oproeping dient te geschieden door middel van dagvaarding voor het nemen van de conclusie van antwoord. De in het
      geding geroepene heeft de positie van een procespartij.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel9
  - number: '10'
    text: |-
      1 Een uit deze wet voortvloeiende rechtsvordering van de benadeelde tegen de verzekeraar verjaart door verloop van
      drie jaar te rekenen van het feit waaruit de schade is ontstaan.

      2 In afwijking van het eerste lid verjaart een rechtsvordering tot vergoeding van schade als bedoeld in
      [artikel 1210, onderdeel ][ref1], van de benadeelde tegen de verzekeraar door verloop van drie jaren na de aanvang
      van de dag, volgende op die waarop de benadeelde bekend was of redelijkerwijze bekend had behoren te zijn met
      de schade en de daarvoor aansprakelijke persoon, en in ieder geval door verloop van tien jaren na de gebeurtenis
      waardoor de schade is ontstaan.

      3 Indien de gebeurtenis bestond uit een opeenvolging van feiten met dezelfde oorzaak, loopt de termijn van tien
      jaren, bedoeld in het tweede lid, vanaf de dag waarop het laatste van die feiten plaatsvond.

      4 Handelingen die de verjaring van de rechtsvordering van een benadeelde tegen een verzekerde stuiten, stuiten
      tevens de verjaring van de rechtsvordering van die benadeelde tegen de verzekeraar. Handelingen die de verjaring
      van de rechtsvordering van een benadeelde tegen de verzekeraar stuiten, stuiten tevens de verjaring van de
      rechtsvordering van de benadeelde tegen de verzekerden.

      5 De verjaring wordt ten opzichte van een verzekeraar gestuit door iedere onderhandeling tussen de verzekeraar
      en de benadeelde. Een nieuwe termijn van drie jaar begint te lopen te rekenen van het ogenblik waarop een van
      de partijen bij deurwaardersexploot of aangetekende brief aan de andere partij heeft kennisgegeven dat zij de
      onderhandelingen afbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1210
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel10
