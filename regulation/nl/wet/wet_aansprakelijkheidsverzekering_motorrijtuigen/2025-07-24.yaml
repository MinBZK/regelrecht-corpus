  - number: 24a
    text: |-
      1 De schadeverzekeraars die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland hun bedrijf in de
      branche Aansprakelijkheid motorrijtuigen mogen uitoefenen, alsmede de Staat, waarborgen, ieder overeenkomstig
      het aantal en de aard van de door hen in Nederland verzekerde motorrijtuigen, onderscheidenlijk overeenkomstig
      het aantal en de aard van de motorrijtuigen waarvan de Staat de bezitter of de houder als bedoeld in
      [artikel 2, tweede lid][ref2], is, de verplichtingen van het fonds met uitzondering van de verplichtingen van het
      fonds ingevolge de [artikelen 26a tot en met 26c][ref3].

      2 De Staat waarborgt voorts de verplichtingen van het fonds, voor zover de bedragen in het
      [derde lid van artikel 24][ref4] bedoeld, niet toereikend zijn tot vergoeding van schade, waartoe door de in
      genoemd artikellid bedoelde motorrijtuigen aanleiding is gegeven.


