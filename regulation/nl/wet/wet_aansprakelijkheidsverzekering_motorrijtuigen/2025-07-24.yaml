  - number: 13a
    text: |-
      1 Een kennisgeving als bedoeld in [artikel 13, eerste lid][ref1], wordt mede gedaan ten aanzien van verzekeringen
      tot het dekken van de burgerrechtelijke aansprakelijkheid waartoe in het verkeer aanleiding wordt gegeven door
      motorrijtuigen die behoren tot de bedrijfsvoorraad van een natuurlijke persoon of rechtspersoon met een op grond
      van [artikel 4aud, eerste lid, van de Wegenverkeerswet 1994][ref2] verleende erkenning bedrijfsvoorraad.

      2 De verzekeraar is verplicht aan de Dienst Wegverkeer kennis te geven van het sluiten van een verzekering
      als bedoeld in het eerste lid door een natuurlijke persoon of een rechtspersoon met een op grond van
      [artikel 4aud, eerste lid, van de Wegenverkeerswet 1994][ref3] verleende erkenning bedrijfsvoorraad.

      3 De natuurlijke persoon of rechtspersoon met een op grond van
      [artikel 4aud, eerste lid, van de Wegenverkeerswet 1994][ref4] verleende erkenning bedrijfsvoorraad is verplicht
      aan de Dienst Wegverkeer kennis te geven van het opnemen van het motorrijtuig in de bedrijfsvoorraad. De Dienst
      Wegverkeer bevestigt deze kennisgeving voor ontvangst.

      4 De kennisgeving, bedoeld in het tweede lid, geldt tezamen met de voor ontvangst bevestigde kennisgeving, bedoeld
      in het derde lid, als de kennisgeving, bedoeld in [artikel 13, eerste lid, onder ][ref5].

      5 De voor ontvangst door de Dienst Wegverkeer bevestigde mededeling waaruit blijkt dat het motorrijtuig de
      bedrijfsvoorraad verlaat, geldt als de kennisgeving door de verzekeraar van het einde van de dekking met betrekking
      tot het motorrijtuig.

      6 De verzekeraar is verplicht aan de Dienst Wegverkeer kennis te geven van de beëindiging, de vernietiging, de
      ontbinding en de schorsing van de verzekering. [Artikel 13, vierde lid][ref6], is van overeenkomstige toepassing.

      7 De dekking met betrekking tot het motorrijtuig eindigt van rechtswege doordat de mededeling aan de Dienst
      Wegverkeer waaruit blijkt dat het motorrijtuig de bedrijfsvoorraad verlaat door de Dienst Wegverkeer voor ontvangst
      wordt bevestigd. De verplichtingen van de verzekeraar jegens de benadeelde blijven echter bestaan voor ongevallen
      welke plaatsvinden binnen 16 dagen na de aanvang van de dag, volgende op die waarop de mededeling aan de Dienst
      Wegverkeer waaruit blijkt dat het motorrijtuig de bedrijfsvoorraad verlaat, door de Dienst Wegverkeer voor
      ontvangst is bevestigd.


