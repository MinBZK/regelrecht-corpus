  - number: '24'
    text: |-
      1 De schadeverzekeraars die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland hun bedrijf in de
      branche Aansprakelijkheid motorrijtuigen mogen uitoefenen, betalen jaarlijks aan het fonds een door het fonds
      te bepalen bedrag, berekend op basis van het aantal en de aard van de door ieder van hen in Nederland verzekerde
      motorrijtuigen. Het fonds bepaalt op overeenkomstige wijze jaarlijks tevens het door de Staat aan het fonds te
      betalen bedrag. De bepaling bedoeld in de vorige volzinnen geschiedt uiterlijk op 30 juni van ieder jaar. De
      storting moet geschieden binnen een maand na het besluit tot bepaling van het verschuldigde bedrag.

      2 Bij de bepaling van dit bedrag worden in aanmerking genomen de over het verleden door het fonds verkregen
      overschotten of geleden tekorten. Tevens wordt rekening gehouden met de in het komende jaar te verwachten
      schadelast.

      3 De bedragen bedoeld in [artikel 21][ref2] worden door het fonds afzonderlijk geadministreerd en worden
      uitsluitend aangewend tot betaling van schade en kosten, waartoe aanleiding wordt gegeven door motorrijtuigen met
      betrekking waartoe krachtens [artikel 19, eerste lid][ref3], een geldig bewijs van vrijstelling is uitgereikt, en
      ter dekking van de kosten verbonden aan de behandeling van de verzoeken om vrijstelling en aan de uitreiking van de
      in [artikel 19, eerste lid][ref4], bedoelde bewijzen.

      4 Echter brengt het fonds van de krachtens [artikel 21][ref5] ontvangen bedragen jaarlijks een bedrag over naar
      zijn algemene middelen; voor de vaststelling hiervan gelden dezelfde maatstaven als die welke krachtens het eerste
      lid worden gebezigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0002415#Artikel21
