  - number: '32'
    text: |-
      De houder van een bewijs als bedoeld in [artikel 19 eerste lid][ref1] is verplicht dit, wanneer het ongeldig is
      geworden, op eerste aanmaning bij het bevoegde gezag in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel19
