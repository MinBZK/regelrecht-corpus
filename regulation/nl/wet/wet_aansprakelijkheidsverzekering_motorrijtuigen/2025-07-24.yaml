        artikel: '2'
        hoofdstuk: '1'
  - number: '6'
    text: |-
      1 De benadeelde heeft jegens de verzekeraar door wie de aansprakelijkheid volgens deze wet is gedekt, een eigen
      recht op schadevergoeding. Dit eigen recht kan evenwel niet worden uitgeoefend indien een fonds of fondsen zijn
      gevormd overeenkomstig [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref1]. Het tenietgaan van zijn schuld
      aan de verzekerde bevrijdt de verzekeraar niet jegens de benadeelde, tenzij deze is schadeloos gesteld.

      2 Indien er bij een ongeval of een gebeurtenis meer dan een benadeelde is en het totaalbedrag van de verschuldigde
      schadeloosstellingen de verzekerde som overschrijdt, worden de rechten van de benadeelden tegen de verzekeraar
      naar evenredigheid teruggebracht tot het beloop van die som. Niettemin blijft de verzekeraar die, onbekend met
      het bestaan van vorderingen van andere benadeelden, te goeder trouw aan een benadeelde een groter bedrag dan
      het aan deze toekomende deel heeft uitgekeerd, jegens die anderen of, indien een fonds of fondsen zijn gevormd
      overeenkomstig [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref2], jegens degene die dat fonds of die
      fondsen heeft gevormd slechts gehouden tot het beloop van het overblijvende gedeelte van de verzekerde som.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
