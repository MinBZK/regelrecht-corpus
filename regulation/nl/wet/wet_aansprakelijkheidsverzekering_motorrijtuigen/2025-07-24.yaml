        artikel: '1210'
  - number: '11'
    text: |-
      1 Geen uit de wettelijke bepalingen omtrent de verzekeringsovereenkomst of uit deze overeenkomst zelf
      voortvloeiende nietigheid, verweer of verval kan door een verzekeraar aan een benadeelde worden tegengeworpen. Het
      bepaalde in de vorige zin geldt niet met betrekking tot het bedrag, waarmede het van de verzekeraar gevorderde de
      krachtens [artikel 22][ref1] vastgestelde som of sommen overschrijdt.

      2 Het eerste lid is jegens de aansprakelijke persoon van overeenkomstige toepassing wanneer de verzekeraar
      wordt verzocht om een bedrag te voldoen in verband met de vorming van een fonds of fondsen overeenkomstig
      [artikel 1220 van Boek 8 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel1220
