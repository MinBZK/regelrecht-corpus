  - number: 26a
    text: |-
      1 Een benadeelde met woonplaats in Nederland kan, wanneer er een burgerrechtelijke aansprakelijkheid bestaat
      voor de schade ten gevolge van feiten die zijn veroorzaakt door een motorrijtuig en die zich hebben voorgedaan
      in Nederland of die zijn veroorzaakt door een motorrijtuig dat gewoonlijk is gestald en verzekerd in een lidstaat
      en die zich hebben voorgedaan in een andere lidstaat dan Nederland of in een staat buiten de Europese Unie waar
      een bureau, groep van verzekeraars of instantie werkzaam is dat onderscheidenlijk die overeenkomt met het bureau,
      bedoeld in artikel 2, zesde lid, een recht op schadevergoeding tegen het fonds geldend maken, vanaf het tijdstip
      dat:

      a. de verzekeraar van het motorrijtuig is onderworpen aan een faillissementsprocedure;

      b. de verzekeraar van het motorrijtuig is onderworpen aan een liquidatieprocedure als bedoeld in artikel 268 van
      [richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad van 25 november 2009 betreffende de
      toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009,
      L 335); of

      c. de Nederlandsche Bank N.V. ten aanzien van de verzekeraar van het motorrijtuig een besluit tot afwikkeling als
      bedoeld in [artikel 3A:85 van de Wet op het financieel toezicht][ref1] heeft genomen, voor zover door dat besluit
      de benadeelde minder zou ontvangen dan zonder dat besluit.

      2 In gevallen als bedoeld in het eerste lid, aanhef en onder c, kan ook een benadeelde met woonplaats buiten
      Nederland een recht op schadevergoeding tegen het fonds geldend maken. Bovendien kan een benadeelde met woonplaats
      in een staat buiten de Europese Unie, wanneer er een burgerrechtelijke aansprakelijkheid bestaat als bedoeld in het
      eerste lid, een recht op schadevergoeding tegen het fonds geldend maken, vanaf het tijdstip dat de verzekeraar op
      grond van [artikel 213ag van de Faillissementswet][ref2] in staat van faillissement is verklaard.

      3 Het fonds is niet aansprakelijk voor de schade voor zover deze buiten de dekking valt die de verzekering ten
      minste moet bieden op grond van de wetgeving van het land waar het feit is voorgevallen dan wel op grond van de
      wetgeving van het land waar het motorrijtuig gewoonlijk is gestald, indien in laatstbedoeld land de dekking ruimer
      is.

      4 Het fonds is slechts aansprakelijk, indien de benadeelde aantoont dat hij alle bekende als zodanig aansprakelijke
      personen en, voor zover de aansprakelijkheid van deze personen volgens de toepasselijke wetgeving verzekerd
      behoort te zijn, hun verzekeraars tot betaling heeft gemaand. Aanmaning kan echter achterwege blijven jegens de
      verzekeraar die verkeert in een situatie als bedoeld in het eerste lid en jegens de verzekeringnemer en andere
      verzekerden wiens aansprakelijkheid overeenkomstig de toepasselijke wetgeving is gedekt door een verzekering met
      deze verzekeraar.

      5 Voor de toepassing van dit artikel en de [artikelen 26b][ref3] en [26c][ref4] wordt onder verzekeraar verstaan:
      de verzekeraar die in een lidstaat in het bezit is van een vergunning als bedoeld in artikel 14 of 162 van
      [richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad van 25 november 2009 betreffende de
      toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009,
      L 335).


