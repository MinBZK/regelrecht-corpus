  - number: 23b
    text: |-
      1 Het fonds verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle gevraagde inlichtingen
      omtrent de uitvoering van zijn taak.

      2 Het fonds zendt jaarlijks binnen zes maanden na afloop van het boekjaar aan Onze Minister van Justitie en
      Onze Minister van Financiën de balans en de staat van baten en lasten alsmede het bestuursverslag over het
      betrokken boekjaar. Deze stukken worden met inachtneming van de [artikelen 24, derde en vierde lid][ref1], en
      [24b, vierde tot en met zevende lid][ref2], opgesteld en gaan vergezeld van een verklaring omtrent de getrouwheid,
      afgelegd door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel24b
