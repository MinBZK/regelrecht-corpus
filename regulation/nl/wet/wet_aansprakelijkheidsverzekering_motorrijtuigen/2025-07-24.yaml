  - number: '26'
    text: |-
      1 Het fonds is niet aansprakelijk voor schade, voor zover deze de som of sommen, vastgesteld krachtens
      [artikel 22][ref1], overtreft.

      2 Het fonds is niet aansprakelijk tegenover de benadeelde die ingevolge artikel 4, eerste en tweede lid, van het
      recht op een uitkering kan worden uitgesloten.

      3 Het fonds is niet aansprakelijk voor de schade, bedoeld in [artikel 4, derde lid][ref2], noch voor schade aan
      zaken, door het motorrijtuig vervoerd.

      4 Het fonds is in een geval als bedoeld in [artikel 25, eerste lid, onder a][ref3], jegens een benadeelde voor de
      schade aan diens zaken slechts aansprakelijk voor zover deze schade meer bedraagt dan een bedrag dat bij algemene
      maatregel van bestuur wordt vastgesteld; met betrekking tot het deel van de schade dat geringer is dan dit bedrag,
      ontstaat voor het fonds geen aansprakelijkheid doordat een andere benadeelde de vordering tot vergoeding daarvan
      verkrijgt.

      5 Het fonds is slechts aansprakelijk, indien de benadeelde aantoont dat hij alle bekende als zodanig aansprakelijke
      personen en, voor zover de aansprakelijkheid van deze personen volgens deze wet verzekerd behoort te zijn, hun
      verzekeraars tot betaling heeft aangemaand.

      6 De [artikelen 6, tweede lid][ref4], [7][ref5] en [9][ref6] zijn van overeenkomstige toepassing ten opzichte van
      het fonds.

      7 [Artikel 10][ref7] is van overeenkomstige toepassing op de rechtsvordering van de benadeelde tegenover het fonds.


