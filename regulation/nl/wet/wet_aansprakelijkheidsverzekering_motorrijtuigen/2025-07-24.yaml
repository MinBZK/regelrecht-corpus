  - number: 26d
    text: |-
      Het fonds is bevoegd om overeenkomsten als bedoeld in de artikelen 10bis, dertiende lid, en 25bis, dertiende lid,
      van de richtlijn uit te onderhandelen en te sluiten.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel26d
  - number: '27'
    text: |-
      1 Het fonds heeft een recht van verhaal tegen:

      a. alle aansprakelijke personen;

      b. degene die zijn verplichting tot verzekering niet is nagekomen met betrekking tot het motorrijtuig waarmee de
      schade is veroorzaakt of met betrekking tot het motorrijtuig aan boord waarvan de gevaarlijke stof zich bevond
      waarmee de schade is veroorzaakt; of

      c. de waarborgfondsen van die lidstaten die gebruik maken van de mogelijkheid om op grond van artikel 5, leden 2
      tot en met 5, van de richtlijn bepaalde motorrijtuigen vrij te stellen van de verzekeringsplicht.

      Het bepaalde onder a en b geldt in het geval van de [artikelen 26b, vierde lid][ref1] en [26c, tweede lid][ref2],
      slechts voor zover aan de verzekeraar een recht van verhaal zou zijn toegekomen. Het fonds heeft voorts tegenover
      de verzekeraars van de aansprakelijke personen de rechten van een benadeelde.

      2 Het fonds heeft overigens tegenover de aansprakelijke personen dezelfde rechten als een verzekeraar tegenover
      de verzekerden.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel26b
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel26c
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27
    references:
