  - number: 26c
    text: |-
      1 Het fonds stelt de organen bedoeld in de artikelen 10bis en 25bis van de richtlijn en de schadevergoedingsorganen
      bedoeld in artikel 24 van de richtlijn in andere lidstaten onverwijld in kennis van een beschikking als bedoeld in
      [artikel 213ag, derde lid, van de Faillissementswet][ref1] waarbij een verzekeraar waarvan Nederland de lidstaat
      van herkomst is, in staat van faillissement is verklaard.

      2 Het fonds kan volledige terugbetaling vorderen van het op basis van [artikel 26b, vierde lid][ref2], uitgekeerde
      bedrag van het orgaan bedoeld in artikel 10bis of artikel 25bis van de richtlijn in de lidstaat van herkomst van de
      verzekeraar. Als een orgaan als bedoeld in artikel 10bis of artikel 25bis van de richtlijn in een andere lidstaat
      een benadeelde schade heeft vergoed op basis van wetgeving die dient ter implementatie van artikel 10bis of
      artikel 25bis van de richtlijn vanwege het feit dat ten aanzien van een verzekeraar waarvan Nederland de lidstaat
      van herkomst is, sprake is van een situatie als bedoeld in [artikel 26a, eerste lid, onderdeel a of b][ref3], en
      dit orgaan verhaal zoekt op het fonds, restitueert het fonds het door dit orgaan in die andere lidstaat betaalde
      bedrag binnen een redelijke termijn en in ieder geval binnen zes maanden nadat het verzoek tot restitutie is
      gedaan, tenzij het fonds en dit orgaan schriftelijk anders zijn overeengekomen nadat het fonds het verzoek tot
      restitutie heeft ontvangen.

      3 De rechten van de benadeelde jegens de persoon die het ongeval heeft veroorzaakt en jegens diens verzekeraar
      gaan bij wijze van subrogatie over op het fonds, voor zover de schade van de benadeelde ten laste van het fonds
      is vergoed op grond van het tweede lid van dit artikel of op grond van [artikel 26b, vierde lid][ref4]. Dit geldt
      echter niet voor de rechten van de benadeelde jegens een verzekeringnemer of een andere verzekerde, voor zover de
      aansprakelijkheid van deze verzekeringnemer of verzekerde overeenkomstig het toepasselijke recht is gedekt door een
      verzekering met de verzekeraar die verkeert in een situatie als bedoeld in [artikel 26a, eerste lid][ref5].

      4 Voor zover schade ten laste van een orgaan als bedoeld in artikel 10bis of artikel 25bis van de richtlijn in een
      andere lidstaat is vergoed op basis van wetgeving die dient ter implementatie van artikel 10bis of artikel 25bis
      van de richtlijn, vindt overgang van de rechten van de benadeelde als bedoeld in het vorige lid bij wijze van
      subrogatie plaats op het orgaan in die lidstaat overeenkomstig het recht van die lidstaat.

      5 Waar dit dienstig is aan de vervulling van de taken die het fonds op grond van de [artikelen 26a][ref6],
      [26b][ref7] en dit artikel heeft, werkt het fonds samen met andere instellingen en personen, en in het bijzonder
      met:

      a. organen als bedoeld in artikel 10bis of artikel 25bis van de richtlijn in andere lidstaten;

      b. het Schadevergoedingsorgaan en de schadevergoedingsorganen bedoeld in artikel 24 van de richtlijn in andere
      lidstaten;

      c. de verzekeraar die verkeert in een situatie als bedoeld in [artikel 26a, eerste lid][ref8];

      d. de bewindvoerder of liquidateur van deze verzekeraar in de zin van artikel 268, eerste lid, onderdeel e)
      respectievelijk onderdeel f) van [richtlijn 2009/138/EG](32009L0138) van het Europees Parlement en de Raad van
      25 november 2009 betreffende de toegang tot en uitoefening van het verzekerings- en het herverzekeringsbedrijf
      (Solvabiliteit II) (PbEU 2009, L 335), dan wel de Nederlandsche Bank N.V.;

      e. de schaderegelaars van deze verzekeraar;

      f. de bevoegde nationale autoriteiten van andere lidstaten.

      6 Het fonds is bevoegd informatie, onder meer betreffende specifieke vorderingen als bedoeld in
      [artikel 26a, eerste of tweede lid][ref9], te verzoeken en te verstrekken aan de in het vijfde lid bedoelde
      personen en organen voor zover dit noodzakelijk is voor de vervulling van de taken die het fonds heeft op grond
      van de artikelen 26a, [26b][ref10] en dit artikel. Het Schadevergoedingsorgaan, de verzekeraar die verkeert in
      een situatie als bedoeld in artikel 26a, eerste lid, de schaderegelaars van deze verzekeraar, de bewindvoerder
      of liquidateur bedoeld in het vorige lid van deze verzekeraar, of, als ten aanzien van de verzekeraar een besluit
      is genomen als bedoeld in artikel 26a, eerste lid, onderdeel c, de Nederlandsche Bank N.V., verstrekken het fonds
      en de organen bedoeld in artikel 10bis of artikel 25bis van de richtlijn in andere lidstaten desgevraagd de in de
      vorige zin bedoelde informatie.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de taken en
      verplichtingen van het fonds en de procedure voor de terugbetalingen bedoeld in het tweede lid aan en door het
      fonds.


