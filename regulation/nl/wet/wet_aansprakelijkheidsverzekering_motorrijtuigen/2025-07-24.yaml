  - number: '20'
    text: |-
      Onze Minister van Financiën stelt jaarlijks het bedrag vast dat de verzoekers zijn verschuldigd voor het verkrijgen
      van het in het vorig artikel bedoelde bewijs.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel20
  - number: '21'
    text: |-
      Onze Minister van Financiën betaalt jaarlijks de uit hoofde van het vorige artikel ontvangen bedragen aan het
      fonds.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel21
  - number: '22'
    text: |-
      De som of sommen, waarvoor de in deze wet bedoelde verzekering ten minste moet zijn gesloten, worden door Ons bij
      algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige
      rechtsbevoegdheid aan, die onder de naam Waarborgfonds Motorverkeer tot taak heeft in de gevallen,
      in [artikel 25][ref1] genoemd, aan de benadeelden hun schade te vergoeden overeenkomstig het bepaalde
      in [artikel 26][ref2]. Deze rechtspersoon heeft bovendien tot taak in de gevallen, bedoeld in
      [artikel 26a, eerste en tweede lid][ref3], aan de benadeelden hun schade te vergoeden overeenkomstig het bepaalde
      in de [artikelen 26a tot en met 26c][ref4].

      2 Een aanwijzing als bedoeld in het eerste lid vindt slechts plaats, indien de rechtspersoon aan de volgende eisen
      voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.

      3 Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing als bedoeld in het eerste lid
      intrekken indien de rechtspersoon naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan
      wel indien de rechtspersoon anderszins zijn taak niet meer onafhankelijk vervult.

      4 Intrekking van een in het eerste lid bedoelde aanwijzing geschiedt onder gelijktijdige voorziening door Onze
      Minister van Justitie en Onze Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij
      nadere regels kunnen stellen. De intrekking heeft de ontbinding van de rechtspersoon ten gevolge en doet de
      vermogensbestanddelen daarvan onder algemene titel op de Staat overgaan.

      5 Een aanwijzing en een intrekking van een aanwijzing als bedoeld in dit artikel worden in de *Staatscourant*
      bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel26a
      [ref4]: https://wetten.overheid.nl/BWBR0002415#Artikel26a
