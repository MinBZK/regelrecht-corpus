        artikel: 26c
        hoofdstuk: '4'
  - number: 27a
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. benadeelden: zij die schade hebben geleden, veroorzaakt door motorrijtuigen die gewoonlijk zijn gestald en
      verzekerd in een lidstaat, alsmede hun rechtverkrijgenden;

      b. verzekeraar: de verzekeraar die in een lidstaat in het bezit is van een vergunning als bedoeld in artikel 14 of
      162 van richtlijn 2009/138/EG van het Europees Parlement en de Raad van 25 november 2009 betreffende de toegang tot
      en uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II) (PbEU 2009, L 335).
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27a
  - number: 27b
    text: |-
      1 Onze Minister van Justitie en Onze Minister van Financiën wijzen een rechtspersoon met volledige
      rechtsbevoegdheid aan als Informatiecentrum dat tot taak heeft informatie te verstrekken aan benadeelden teneinde
      hen in staat te stellen een vordering tot schadevergoeding in te dienen.

      2 Een aanwijzing vindt slechts plaats, indien de rechtspersoon aan de volgende eisen voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taak naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taak is gewaarborgd.

      3 Onze Minister van Justitie en Onze Minister van Financiën kunnen een aanwijzing intrekken indien de rechtspersoon
      naar hun oordeel niet meer aan de in het tweede lid vermelde eisen voldoet, dan wel indien de rechtspersoon
      anderszins zijn taak niet meer onafhankelijk vervult.

      4 Intrekking van een aanwijzing geschiedt onder gelijktijdige voorziening door Onze Minister van Justitie en Onze
      Minister van Financiën in de in het eerste lid bedoelde taak, waaromtrent zij nadere regels kunnen stellen.

      5 Een aanwijzing en een intrekking van een aanwijzing worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27b
  - number: 27c
    text: |-
      Het Informatiecentrum kan zijn statuten niet wijzigen, tenzij de wijziging door Onze Minister van Justitie en Onze
      Minister van Financiën is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27c
  - number: 27d
    text: |-
      Het Informatiecentrum verstrekt aan Onze Minister van Justitie en Onze Minister van Financiën alle gevraagde
      inlichtingen omtrent de uitvoering van zijn taak.
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27d
  - number: 27e
    text: |-
      Bij de aanwijzing, bedoeld in [artikel 27b, eerste lid][ref1], wordt bepaald op welke wijze de werkzaamheden van
      het Informatiecentrum ter uitvoering van zijn taak, worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27e
    references:
      - id: ref1
        bwb_id: BWBR0002415
        artikel: 27b
        hoofdstuk: 4a
  - number: 27f
    text: |-
      1 Het Informatiecentrum coördineert ter uitvoering van de hem op grond van [artikel 27b, eerste lid][ref1],
      opgelegde taak de verzameling en verstrekking van de volgende gegevens:

      a. de kentekens van de motorrijtuigen die gewoonlijk in Nederland zijn gestald;

      1°. de polisnummers van de verzekeringen, bedoeld in de [artikelen 3][ref2] en [3a][ref3] en, indien de verzekering
      is beëindigd, vernietigd of ontbonden, de datum waarop de dekking is geëindigd;

      2°. het nummer van het internationale verzekeringsbewijs of van de grensverzekeringspolis dat, onderscheidenlijk
      die is afgegeven voor motorrijtuigen waarvoor de in artikel 5, tweede lid, van de richtlijn bepaalde afwijking
      geldt;

      c. de namen en adressen van de verzekeraars en de schaderegelaars;

      d. de lijst van motorrijtuigen waarvoor in een of meer lidstaten overeenkomstig artikel 5, eerste en tweede lid,
      van de richtlijn wordt afgeweken van de verplichte verzekering tegen burgerrechtelijke aansprakelijkheid, waartoe
      deze in het verkeer aanleiding kunnen geven;

      e. met betrekking tot motorrijtuigen als bedoeld onder d:

      1°. de naam van de autoriteit of de instantie die overeenkomstig artikel 5, eerste lid, derde alinea, van de
      richtlijn, is belast met de schadevergoeding aan de benadeelden, indien de procedure van artikel 2, onderdeel a,
      van de richtlijn niet van toepassing is en indien voor het motorrijtuig de afwijking geldt van artikel 5, eerste
      lid, van de richtlijn;

      2°. de naam van de instantie waaronder het motorrijtuig ressorteert in de lidstaat waar het gewoonlijk is gestald,
      indien voor het motorrijtuig de afwijking geldt van artikel 5, tweede lid, van de richtlijn.

      2 De in het eerste lid, onder a, b en c, genoemde gegevens worden bewaard gedurende zeven jaar
      na de doorhaling van de inschrijving van het motorrijtuig in het kentekenregister, bedoeld in
      [artikel 42, eerste lid, van de Wegenverkeerswet 1994][ref4] of van de beëindiging van de dekking.


      [ref1]: https://wetten.overheid.nl/BWBR0002415#Artikel27b
      [ref2]: https://wetten.overheid.nl/BWBR0002415#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002415#Artikel3a
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel42
    url: https://wetten.overheid.nl/BWBR0002415/2025-07-24#Artikel27f
