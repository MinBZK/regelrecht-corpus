preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat Curaçao en Sint Maarten de hoedanigheid van land in het Koninkrijk
    verkrijgen, dat Bonaire, Sint Eustatius en Saba toetreden tot het staatsbestel van Nederland, dat in verband
    daarmee besloten is om de Nederlandse Antillen op te heffen als land en dat daarom wijziging van het Statuut voor
    het Koninkrijk der Nederlanden noodzakelijk is;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal,
    artikel 55 van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028249/2010-10-10#ArtikelAanhef
articles:
  - number: I.1
    text: Curaçao en Sint Maarten hebben elk de hoedanigheid van land in het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028249/2010-10-10#ArtikelI
  - number: I.2
    text: Bonaire, Sint Eustatius en Saba zijn onderdeel van het staatsbestel van Nederland.
    url: https://wetten.overheid.nl/BWBR0028249/2010-10-10#ArtikelI
  - number: I.3
    text: Het land de Nederlandse Antillen is opgeheven.
    url: https://wetten.overheid.nl/BWBR0028249/2010-10-10#ArtikelI
  - number: IV.1
    text: |-
      Deze rijkswet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0028249/2010-10-10#ArtikelIV
  - number: IV.2
    text: |-
      In afwijking van het eerste lid, treden de [artikelen I][ref1] en [II][ref2] van deze rijkswet
      in werking op een bij koninklijk besluit te bepalen tijdstip, dat niet ligt voor het tijdstip
      van inwerkingtreding van de [Rijkswet financieel toezicht Curaçao en Sint Maarten][ref3],
      de [Rijkswet Gemeenschappelijk Hof van Justitie][ref4], de
      [Rijkswet openbare ministeries van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref5],
      de [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref6] en de
      [Rijkswet Raad voor de rechtshandhaving][ref7], en dat voor de verschillende onderdelen van artikel I en II
      verschillend kan worden vastgesteld.


