      1 De gemeenteraad stelt bij verordening regels vast, die zijn gericht op de realisatie en de vormgeving van
      cliëntenparticipatie bij de uitvoering van de wet met inachtneming van [artikel 150 van de Gemeentewet][ref1].

      2 In deze verordening worden ten minste geregeld:

      a. dat de reikwijdte van de cliëntenparticipatie betrekking heeft op het integrale gemeentelijke
      gehandicaptenbeleid;

      b. dat het college van burgemeester en wethouders tijdig advies vraagt aan de lokale platforms over wijziging in de
      verordening en uitvoeringsregelingen;

      c. welke faciliteiten het college van burgemeester en wethouders beschikbaar stelt aan de lokale platforms.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel150
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '150'
  - number: '2'
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de verlening van woonvoorzieningen,
      vervoersvoorzieningen en rolstoelen ten behoeve van de deelneming aan het maatschappelijk verkeer van in de
      gemeente woonachtige gehandicapten. De gemeenteraad stelt met inachtneming van het bepaalde bij of krachtens deze
      wet daartoe regels vast bij verordening.

      2 Het eerste lid is niet van toepassing op gehandicapten die verblijven in een instelling die ingevolge
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref1] (*Stb.* 1992, 392) is toegelaten.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid kan, in overeenstemming met Onze Minister van Volksgezondheid,
      Welzijn en Sport, met betrekking tot het tweede lid afwijkende regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
  - number: '3'
    text: |-
      Het college van burgemeester en wethouders biedt verantwoorde voorzieningen aan. Onder verantwoorde voorzieningen
      worden verstaan de voorzieningen die doeltreffend, doelmatig en cliëntgericht worden verleend.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel3
  - number: '4'
    text: |-
      1 Een vreemdeling kan voor de in [artikel 2, eerste lid][ref1], bedoelde voorzieningen
      slechts in aanmerking komen indien hij rechtmatig verblijf houdt in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref2].

      2 Bij algemene maatregel van bestuur kan worden bepaald dat hier te lande verblijvende vreemdelingen, anders dan
      die bedoeld in [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref3], in aanmerking kunnen
      komen voor voorzieningen als bedoeld in [artikel 2, eerste lid][ref4], onverminderd de overige vereisten voor de
      toekenning van een voorziening:

      a. ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of

      b. vreemdelingen die, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref5], rechtmatig in Nederland verblijf hebben
      als bedoeld in [artikel 8, onder g of h, van de Vreemdelingenwet 2000][ref6].


