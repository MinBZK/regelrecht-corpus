  - number: '6'
    text: |-
      1 De gemeenteraad kan bij verordening bepalen dat de gehandicapte, voor zover de voorziening niet bestaat uit een
      aan hem verleende financiële tegemoetkoming, een eigen bijdrage is verschuldigd.

      2 De hoogte van de eigen bijdrage kan worden afgestemd op het inkomen van de gehandicapte en zijn echtgenoot. Ten
      aanzien van de vaststelling van het inkomen van de gehandicapte die de leeftijd van 18 jaar nog niet heeft bereikt,
      kan in aanmerking worden genomen het gezamenlijk inkomen van de ouders van de gehandicapte, dan wel indien de
      gehandicapte een pleegkind is, het gezamenlijk inkomen van de pleegouders indien laatstgenoemden het pleegkind als
      een eigen kind opvoeden en onderhouden.

      3 Onze Minister van Sociale Zaken en Werkgelegenheid kan, na overleg met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, regels stellen met betrekking tot de eigen bijdragen.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel6
  - number: '7'
    text: |-
      Het college van burgemeester en wethouders kan de gehandicapte, voor zover dit van belang kan zijn voor de
      beoordeling van de aanspraak op een voorziening, oproepen in persoon te verschijnen en zich door een of meer
      daartoe aangewezen deskundigen te doen onderzoeken.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel7
  - number: '8'
    text: |-
      1 Alvorens op een aanvraag van een woonvoorziening waarvan de kosten gelijk zijn aan of meer bedragen dan € 20 420
      te besluiten, wint het college van burgemeester en wethouders omtrent de noodzaak van deze voorziening advies in
      van het orgaan, bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref1].

      2 Bij algemene maatregel van bestuur kan worden bepaald dat het eerste lid van overeenkomstige toepassing is op in
      die maatregel aan te wijzen voorzieningen.

      3 Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan
      acht weken na de datum van uitgifte van het Staatsblad waarin het is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9a
  - number: '9'
    text: |-
      Roerende zaken, voor de aanschaf waarvan krachtens deze wet een financiële vergoeding is verleend, dan wel die
      krachtens deze wet in eigendom of bruikleen zijn verleend, zijn niet vatbaar voor vervreemding, verpanding,
      belening of beslag, zolang die roerende zaken geschikt zijn om de beperkingen van de gehandicapte op het gebied
      van het wonen of van het zich binnen of buiten de woning verplaatsen op te heffen of te verminderen. Elk beding
      strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel9
  - number: '10'
    text: |-
      Onze Minister van Defensie is bevoegd uit eigen beweging en desgevraagd verplicht, kosteloos, uit de door of
      namens hem gevoerde administratie, aan de colleges van burgemeesters en wethouders die gegevens te verstrekken die
      noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel10
  - number: 10a
    text: |-
      1 Onze Minister van Sociale Zaken en Werkgelegenheid kan ten laste van 's Rijks kas aan de gemeente een uitkering
      verstrekken in de kosten van:

      a. voorzieningen aan gehandicapten die verblijven in een instelling die ingevolge
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref1] is toegelaten;

      b. woonvoorzieningen waarvan de kosten gelijk zijn aan of meer bedragen dan € 20 420.

      2 Met betrekking tot het eerste lid worden bij of krachtens algemene maatregel van bestuur nadere regels gesteld.
      Daarbij kan onderscheid worden gemaakt tussen categorieën gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel8
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '8'
  - number: 10b
    text: |-
      1 Het college van burgemeester en wethouders verstrekt desgevraagd kosteloos aan Onze Minister van Sociale Zaken en
      Werkgelegenheid de gegevens die hij met betrekking tot deze wet nodig heeft.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      verstrekken van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel10b
  - number: '11'
    text: |-
      1 Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake
      van schending of verkeerde toepassing van [artikel 1, derde tot en met zevende lid][ref1], en de daarop berustende
      bepalingen.

      2 Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel1
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '1'
        paragraaf: '1'
  - number: '22'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer binnen drie jaar na inwerkingtreding van deze wet, en vervolgens binnen drie
      jaar daarna, aan de Staten-Generaal een verslag over de verlening van woonvoorzieningen, vervoersvoorzieningen en
      rolstoelen krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel22
  - number: '23'
    text: |-
      1 Indien in het kader van de uitvoering van artikel 57, tweede lid, van de Algemene Arbeidsongeschiktheidswet,
      of artikel P 9, tweede lid, van de Algemene burgerlijke pensioenwet, dan wel artikel P 8, tweede lid, van de
      Spoorwegpensioenwet terzake van de verstrekking van een hulpmiddel een overeenkomst van bruikleen is gesloten,
      wordt de verstrekking van dat hulpmiddel, gedurende de nog resterende looptijd van de overeenkomst, dan wel, indien
      de gebruiksduur van het hulpmiddel korter is dan de resterende looptijd van de overeenkomst, tot het einde van die
      gebruiksduur, beheerst door de regels zoals die luidden onmiddellijk voorafgaande aan de datum van inwerkingtreding
      van [artikel 12][ref1] van deze wet.

      2 Het eerste lid is van overeenkomstige toepassing op de periodieke vergoeding die op grond van artikel P 9, tweede
      lid, van de Algemene burgerlijke pensioenwet aan de gehandicapte wordt verleend voor de kosten van aanschaf en
      onderhoud van een vervoermiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel12
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '12'
        paragraaf: '3'
  - number: '24'
    text: |-
      Aan de gehandicapte aan wie over de periode onmiddellijk voorafgaande aan de datum van inwerkingtreding van deze
      wet, krachtens artikel 57, tweede lid, van de Algemene Arbeidsongeschiktheidswet, of krachtens artikel P 9, tweede
      lid, van de Algemene burgerlijke pensioenwet, of krachtens artikel P 8, tweede lid, van de Spoorwegpensioenwet, dan
      wel krachtens [artikel X5, eerste en tweede lid, van de Algemene militaire pensioenwet](onbekend) een financiële
      tegemoetkoming is verleend in de kosten van het gebruik van een vervoermiddel, wordt desgevraagd door het
      gemeentebestuur ook over de jaren 1994 en 1995 een financiële tegemoetkoming verleend, tenzij in de verordening als
      bedoeld in [artikel 5, eerste lid][ref1], anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel5
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006169
        artikel: '5'
        paragraaf: '2'
  - number: '25'
    text: |-
      De bepalingen bij of krachtens [artikel 7 van de Algemene Wet Bijzondere Ziektekosten][ref1], zoals die bepalingen
      luidden onmiddellijk voorafgaande aan de datum van inwerkingtreding van deze wet blijven van toepassing op de
      beroepsmilitair die is ontslagen, anders dan uit hoofde van invaliditeit met dienstverband, en die op grond van de
      regeling geneeskundige verzorging gepensioneerde militairen KL/Klu (*Stb.* 1962, 241), dan wel op de voet van die
      regeling, in aanmerking is gebracht voor genees- en heelkundige voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel7
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '7'
  - number: '26'
    text: |-
      Voor de datum van inwerkingtreding van deze wet ingediende aanvragen voor een voorziening als bedoeld in artikel
      57, tweede lid, van de Algemene Arbeidsongeschiktheidswet, of artikel P 9, tweede lid, van de Algemene burgerlijke
      pensioenwet, of artikel P 8, tweede lid, van de Spoorwegpensioenwet, dan wel [artikel X5, eerste en tweede lid,
      van de Algemene militaire pensioenwet](onbekend) worden afgehandeld op basis van de regels zoals die luidden
      onmiddellijk voorafgaande aan de datum van inwerkingtreding van deze wet, met dien verstande dat geen financiële
      tegemoetkoming wordt verleend over een periode gelegen na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel26
  - number: '27'
    text: |-
      Indien het bij koninklijke boodschap van 6 november 1992 ingediende voorstel van Wet, houdende wettelijke regeling
      van aanspraak op zorg in de [Algemene Wet Bijzondere Ziektekosten][ref1] en wijziging van enige andere wetten tot
      wet wordt verheven en in werking treedt, komt [artikel 2 tweede lid][ref2], als volgt te luiden:

      2 Het eerste lid is niet van toepassing op gehandicapten die verblijven in een instelling, die een of meer vormen
      van zorg omschreven krachtens artikel 6*a* en in de [artikelen 6](onbekend) (*Stb.* 1992, 392), verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0006169#Artikel2
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0006169
        artikel: '2'
        paragraaf: '2'
  - number: '29'
    text: 'Deze wet kan worden aangehaald als: Wet voorzieningen gehandicapten.'
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel29
  - number: '30'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen, onderdelen daarvan of voor de verlening van onderscheidenlijk de woonvoorzieningen, de
      vervoersvoorzieningen of de rolstoelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel30
