  - number: '5'
    text: |-
      1 De verordening, bedoeld in [artikel 2, eerste lid][ref1], bevat in ieder geval regels met betrekking tot:

      a. de gevallen en de vorm waarin voorzieningen kunnen worden verleend, waarbij wordt bepaald dat woonvoorzieningen
      waarvan de kosten gelijk zijn aan of meer bedragen dan € 45 378 niet worden verleend, tenzij weigering van
      die voorziening gelet op het belang dat deze regeling beoogt te beschermen zou leiden tot onbillijkheden van
      overwegende aard;

      b. de hoogte van de financiële tegemoetkomingen;

      c. de procedure met betrekking tot de toekenning, de herziening, de beëindiging en de terugvordering van
      voorzieningen, daaronder begrepen het inwinnen van deskundigenadvies;

      d. de gronden waarop voorzieningen kunnen worden beëindigd, dan wel teruggevorderd.

      2 De hoogte van de financiële tegemoetkomingen kan worden afgestemd op het inkomen van de gehandicapte en zijn
      echtgenoot. Ten aanzien van de vaststelling van het inkomen van de gehandicapte die de leeftijd van 18 jaar nog
      niet heeft bereikt, kan in aanmerking worden genomen het gezamenlijk inkomen van de ouders van de gehandicapte, dan
      wel indien de gehandicapte een pleegkind is, het gezamenlijk inkomen van de pleegouders indien laatstgenoemden het
      pleegkind als een eigen kind opvoeden en onderhouden.

      3 Een financiële tegemoetkoming voor een bouwkundige of woontechnische ingreep in of aan een woonruimte wordt
      verleend aan de eigenaar van de woonruimte.

      4 Onze Minister van Sociale Zaken en Werkgelegenheid kan, na overleg met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, regels stellen met betrekking tot de financiële tegemoetkomingen.

      5 Op de financiële tegemoetkomingen is [titel 4.2 van de Algemene wet bestuursrecht][ref2] niet van toepassing.

      6 Het bedrag, genoemd in het eerste lid, onder a, kan door Onze Minister van Sociale Zaken en Werkgelegenheid,
      na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, met ingang van een
      kalenderjaar worden gewijzigd, indien daartoe aanleiding bestaat als gevolg van de ontwikkeling van de prijzen van
      bouwkundige of woontechnische ingrepen in of aan de woning.


      [ref1]: https://wetten.overheid.nl/BWBR0006169#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0006169/2006-03-08#Artikel5
