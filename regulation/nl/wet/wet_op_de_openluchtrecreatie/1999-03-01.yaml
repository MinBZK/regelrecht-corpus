    text: |-
      Provinciale staten kunnen in het belang van de natuur- en landschapsbescherming een of meer gebieden aanwijzen
      waarvoor het verbod van [artikel 15][ref1] onverkort geldt of waarvoor het aantal kampeermiddelen, bedoeld in dat
      artikel, op een daarbij te bepalen lager aantal wordt gesteld gedurende een daarbij te bepalen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel15
