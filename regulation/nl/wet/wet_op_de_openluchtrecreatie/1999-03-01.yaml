  - number: '40'
    text: |-
      De rechten en plichten, voortspruitende uit een kampeerovereenkomst welke van kracht is op het tijdstip van
      inwerkingtreding van de [artikelen 21 tot en met 23][ref1] worden te rekenen vanaf een jaar na dat tijdstip
      beheerst door de bepalingen van deze wet, of zoveel eerder als partijen dat overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel21
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel40
    references:
