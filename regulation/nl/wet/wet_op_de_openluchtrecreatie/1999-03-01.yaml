        hoofdstuk: VI
  - number: '33'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister daartoe aangewezen ambtenaren.

      2 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn tevens belast de bij besluit van
      burgemeester en wethouders daartoe aangewezen ambtenaren. Bij algemene maatregel van bestuur kunnen terzake van de
      uitoefening van dit toezicht regelen worden gesteld.

      3 Met het toezicht op de naleving van het krachtens [artikel 17][ref1] bepaalde zijn mede belast de bij besluit van
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer daartoe aangewezen ambtenaren.

      4 Van een besluit als bedoeld in het eerste en derde lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel17
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '17'
        hoofdstuk: IV
  - number: '34'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de daartoe aangewezen buitengewone
      opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn tevens belast:

      a. de in [artikel 33, tweede en derde lid][ref4], bedoelde ambtenaren, voor zover deze zijn aangewezen bij besluit
      van Onze Minister van Justitie en

      b. de ambtenaren, aangewezen bij besluit van Onze Minister in overeenstemming met Onze Minister van Justitie.

      3 Van een besluit als bedoeld in het eerste en tweede lid, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref4]: https://wetten.overheid.nl/BWBR0006548#Artikel33
