  - number: '17'
    text: |-
      1 In het belang van de hygiëne, de gezondheid en de veiligheid worden bij of krachtens algemene maatregel van
      bestuur met betrekking tot kampeerterreinen en jachthavens regelen gesteld.

      2 De regelen, bedoeld in het eerste lid, kunnen verschillen per soort en naar gelang van de grootte van
      kampeerterreinen en van jachthavens alsmede per soort en naar gelang van het aantal toe te laten kampeermiddelen
      op kampeerterreinen onderscheidenlijk pleziervaartuigen in jachthavens. Zij kunnen inhouden dat burgemeester en
      wethouders in daarbij aangegeven gevallen ontheffing daarvan mogen verlenen.

      3 De voordracht tot een besluit als bedoeld in het eerste lid, wordt Ons gedaan door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel17
  - number: '18'
    text: |-
      1 Indien de toestand van een kampeerterrein zodanig is, dat onmiddellijk gevaar dreigt voor de gezondheid of de
      veiligheid van de kampeerders, kan de burgemeester de houder van dat kampeerterrein gelasten dat onverwijld te doen
      ontruimen en ontruimd te houden.

      2 De burgemeester heft de last op verzoek van de houder van dat kampeerterrein of uit eigen beweging op, zodra het
      in het eerste lid bedoelde gevaar is geweken.

      3 Van een besluit als bedoeld in het eerste of tweede lid, wordt mededeling gedaan aan de inspecteur.

      4 De werking van een besluit als bedoeld in het tweede lid, wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel18
  - number: '19'
    text: |-
      1 De inspecteur kan de burgemeester verzoeken [artikel 18, eerste lid][ref1], toe te passen.

      2 De bekendmaking aan de inspecteur van de beslissing op zijn verzoek geschiedt binnen vierentwintig uur na
      ontvangst van het verzoek.

      3 Indien de burgemeester [artikel 18, eerste lid][ref2], op verzoek van de inspecteur heeft toegepast, hoort hij de
      inspecteur alvorens een besluit krachtens [artikel 18, tweede lid][ref3], te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel18
