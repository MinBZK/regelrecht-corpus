  - number: '21'
    text: |-
      1 Elke overeenkomst ter zake van een bemiddeling bij koop of verkoop van een kampeermiddel tussen de houder van
      een kampeerterrein of een door hem aangewezen derde en de koper of verkoper van een kampeermiddel moet schriftelijk
      worden aangegaan en betreft in ieder geval:

      a. de aard en de omvang van de bemiddeling.

      b. het tijdvak waarover de bemiddeling zich uitstrekt en

      c. de vergoeding welke in rekening wordt gebracht voor de bemiddeling dan wel de wijze waarop deze vergoeding wordt
      berekend.

      2 De houder van een kampeerterrein of een door hem aangewezen derde mag ter zake van een bemiddeling bij koop of
      verkoop van een kampeermiddel slechts aan hetzij de koper hetzij de verkoper een vergoeding als bedoeld in het
      eerste lid, in rekening brengen.

      3 Leidt de bemiddeling niet tot koop of verkoop van een kampeermiddel dan kunnen de ter zake van de bemiddeling
      werkelijk gemaakte kosten in rekening worden gebracht, indien dat tevoren schriftelijk is overeengekomen.

      4 Elke overeenkomst of elk beding in strijd met het bepaalde in de voorafgaande leden is nietig.

      5 De houder van een kampeerterrein dient degene die met hem een kampeerovereenkomst voor onbepaalde tijd of voor
      een tijdvak van ten minste zeven maanden wenst aan te gaan, bij het sluiten van die overeenkomst in de gelegenheid
      te stellen kennis te nemen van de voorwaarden die hij hanteert bij een overeenkomst als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel21
  - number: '22'
    text: |-
      1 Elk in verband met het tot stand komen van een kampeerovereenkomst gemaakt beding waarbij ten behoeve van een der
      partijen dan wel door of tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.

      2 Is het voordeel slechts voor een deel onredelijk, dan blijft het beding voor het overige in stand, voor zover
      dit, gelet op de inhoud en strekking van het beding, niet in onverbrekelijk verband met het nietige deel staat.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel22
  - number: '23'
    text: |-
      Voor zover een kampeerovereenkomst afwijkt van het reglement als bedoeld in [artikel 9][ref1], ten nadele van
      degene die het kampeermiddel plaatst of geplaatst houdt, kan deze laatste zich rechtstreeks beroepen op het
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel9
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: '24'
    text: |-
      Het is verboden zonder voorafgaande verklaring van geen bezwaar van burgemeester en wethouders een volkstuincomplex
      te vestigen.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel24
  - number: '25'
    text: |-
      De aanvraag voor een verklaring als bedoeld in [artikel 24][ref1], gaat vergezeld van een rapport waarin
      wordt aangegeven of, en zo ja, in welke mate de bodem van het terrein waarop de aanvrager voornemens is een
      volkstuincomplex te vestigen, verontreinigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel24
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '24'
        hoofdstuk: VII
  - number: '26'
    text: |-
      Burgemeester en wethouders weigeren in ieder geval een verklaring van geen bezwaar indien uit het rapport, bedoeld
      in [artikel 25][ref1], blijkt dat vestiging van een volkstuincomplex op het desbetreffende terrein uit het oogpunt
      van volksgezondheid bezwaar ontmoet.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel25
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '25'
        hoofdstuk: VII
  - number: '27'
    text: |-
      Er is een structuurschema dat in ieder geval inzicht geeft in de ruimtelijke aspecten van het rijksbeleid inzake
      openluchtrecreatie. Het structuurschema is een plan als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '2'
  - number: '31'
    text: |-
      1 De gemeenteraad kent een naar billijkheid te bepalen schadevergoeding toe aan en op verzoek van:

      a. de houder van een kampeerterrein, indien deze schade lijdt of zal lijden als gevolg van een besluit tot
      wijziging of intrekking van een vrijstelling, vergunning of ontheffing of de aan een vrijstelling, vergunning of
      ontheffing verbonden voorschriften;

      b. de aanvrager van een vergunning of ontheffing indien deze schade lijdt of zal lijden als gevolg van een besluit
      tot weigering van de vergunning of ontheffing of de aan de vergunning of ontheffing verbonden voorschriften.

      2 Een schadevergoeding als bedoeld in het eerste lid, wordt slechts verleend, indien de schade redelijkerwijs niet
      of niet geheel ten laste behoort te blijven van degene die de schade lijdt of zal lijden en de vergoeding niet of
      niet voldoende door aankoop, onteigening of anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel31
  - number: '32'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld waarbij het bepaalde in
      [hoofdstuk III][ref1], [hoofdstuk IV][ref2], [hoofdstuk V][ref3] en [hoofdstuk VI][ref4], geheel of gedeeltelijk
      van overeenkomstige toepassing wordt verklaard op:

      a. het plaatsen of geplaatst houden van bouwwerken waarin gelegenheid wordt gegeven tot het houden van recreatief
      nachtverblijf, niet zijnde een hotel, een pension of een woning anders dan een zomerhuis of

      b. het houden van recreatief nachtverblijf in een bouwwerk niet zijnde een hotel, een pension of een woning anders
      dan een zomerhuis.

      2 Onder een zomerhuis als bedoeld in het eerste lid, wordt verstaan elk permanent ter plaatse aanwezig
      recreatiewoonverblijf, waarvan de gebruikers het hoofdverblijf elders hebben, voor zover dit zomerhuis deel
      uitmaakt van een complex van zodanige huizen dat in het kader van een bedrijf of in enigerlei vorm van onderlinge
      samenwerking door de rechthebbenden wordt beheerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0006548#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0006548#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0006548#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel32
    references:
