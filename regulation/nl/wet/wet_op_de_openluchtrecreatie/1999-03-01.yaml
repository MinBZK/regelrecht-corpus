preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van artikel 22, derde lid, van de
    Grondwet, regels te stellen ten behoeve van de openluchtrecreatie, alsmede, in het kader van het regeringsstreven
    naar vermindering en vereenvoudiging van overheidsregelingen, de wettelijke regelen inzake het kamperen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;

      b. kampeerterrein: terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting bestemd, om
      daarop gelegenheid te geven tot het plaatsen of geplaatst houden van kampeermiddelen ten behoeve van recreatief
      nachtverblijf;

      c. kampeermiddel: tent, tentwagen, kampeerauto of caravan dan wel enig ander onderkomen of enig ander
      voertuig of gewezen voertuig of gedeelte daarvan, voor zover geen bouwwerk zijnde, waarvoor ingevolge
      [artikel 40 van de Woningwet][ref1] een bouwvergunning vereist is; een en ander voor zover deze onderkomens of
      voertuigen geheel of ten dele blijvend zijn bestemd of opgericht dan wel worden of kunnen worden gebruikt voor
      recreatief nachtverblijf;

      d. kampeerovereenkomst: overeenkomst tussen de houder van een kampeerterrein en degene die een kampeermiddel
      plaatst of geplaatst houdt betreffende het plaatsen of geplaatst houden daarvan;

      e. jachthaven: haven met de daarbij behorende grond waar overwegend gelegenheid wordt gegeven voor het aanleggen,
      afmeren of afgemeerd houden van pleziervaartuigen;

      f. inspecteur: op grond van [artikel 33, derde lid][ref2], aangewezen toezichthouder;

      g. volkstuin: perceel grond dat zich niet in de onmiddellijke nabijheid van de woning van de gebruiker bevindt,
      waarop de gebruiker gewassen teelt voor eigen gebruik;

      h. volkstuincomplex: terrein met een oppervlakte van ten minste 10 are waarop zich twee of meer volkstuinen
      bevinden.

      2 In afwijking van het bepaalde in het eerste lid worden niet als kampeermiddelen beschouwd vaartuigen, woonwagens
      in de zin van de [Woningwet][ref3], tenten in gebruik voor het houden van bijeenkomsten, tentoonstellingen of
      voorstellingen, en voertuigen in gebruik als direktiekeet.

      3 Ingeval een caravan is aan te merken als een bouwwerk en het plaatsen geschiedt in overeenstemming
      met de bepalingen van deze wet is voor het plaatsen geen bouwvergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref4] vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0005181
      [ref4]: https://wetten.overheid.nl/BWBR0005181#Artikel40
