  - number: '8'
    text: |-
      1 Het is verboden zonder vergunning van burgemeester en wethouders een kampeerterrein te houden.

      2 Van het verbod, bedoeld in het eerste lid, kunnen burgemeester en wethouders vrijstelling of ontheffing verlenen
      voor:

      a. het houden van de kampeerterrein voor ten hoogste tien kampeermiddelen;

      b. het houden van een kampeerterrein door een organisatie met een doelstelling van sociale, culturele, educatieve
      of wetenschappelijke aard ten behoeve van eigen doeleinden of

      c. het houden van een natuurkampeerterrein dat voldoet aan door Onze Minister gestelde regelen.

      3 In afwijking van het tweede lid, onderdeel *a*, kunnen burgemeester en wethouders voor door hen per kalenderjaar
      vast te stellen korte perioden, het aantal toe te laten kampeermiddelen verhogen tot ten hoogste vijftien.

      4 De regelen, bedoeld in het tweede lid, onderdeel *c*, hebben in ieder geval betrekking op het soort en het aantal
      toe te laten kampeermiddelen, de periode gedurende welke deze kampeermiddelen op het terrein aanwezig mogen zijn,
      alsmede op de inrichting en het gebruik van het kampeerterrein.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel8
  - number: '9'
    text: |-
      1 Een aanvraag tot een vergunning als bedoeld in [artikel 8, eerste lid][ref1], dient vergezeld te gaan van een
      reglement.

      2 Een reglement bevat voorwaarden met betrekking tot het gebruik van het kampeerterrein en het verblijf daarop.
      Hiertoe behoren in elk geval:

      a. bepalingen die een inzicht geven in de opbouw van het tarief;

      b. bepalingen over de wijze van bekendmaking van de geldende prijzen;

      c. de vergoeding onderscheidenlijk de berekeningswijze van de vergoeding die de houder van de vergunning berekent
      onderscheidenlijk hanteert bij de in [artikel 21, eerste lid][ref2], bedoelde bemiddeling;

      d. de regelen, die de houder van de vergunning in acht neemt bij het aangaan van kampeerovereenkomsten en die in
      elk geval betrekking hebben op:

      1°. de duur van de overeenkomst;

      2°. de wijze, de termijn en de gronden van opzegging;

      3°. de gevallen waarin degene die het kampeermiddel plaatst aanspraak op verlenging van de overeenkomst kan maken
      en

      4°. de verplichtingen die voor degene die het kampeermiddel plaatst geldelijke gevolgen met zich meebrengen;

      e. de kampeerregels en

      f. bepalingen over de wijze van bekendmaking van het reglement.

      3 Wijzigingen in een reglement worden toegezonden aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel21
