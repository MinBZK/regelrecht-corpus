      - id: ref2
        bwb_id: BWBR0006548
        artikel: '34'
        hoofdstuk: XI
  - number: '36'
    text: |-
      1 De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 34][ref3] bedoelde ambtenaren.

      2 De in de [artikelen 33][ref4] en [34][ref5] bedoelde ambtenaren zijn bevoegd tot het onderzoeken van stoffen die
      een bedreiging kunnen vormen voor de hygiëne, gezondheid en veiligheid van een kampeerterrein of van een jachthaven
      en het verrichten van opmetingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel513
