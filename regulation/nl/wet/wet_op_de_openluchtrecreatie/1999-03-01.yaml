  - number: '39'
    text: |-
      1 Vergunningen, vrijstellingen en ontheffingen verleend op grond van de [artikelen 14](onbekend), [21]
      (onbekend), [22](onbekend) en [27 van de Kampeerwet](onbekend) blijven gedurende twee jaar na inwerkingtreding
      van de [artikelen 8][ref1] en [13 tot en met 16][ref2] van kracht, voor zover zij niet eerder zijn vervallen of
      ingetrokken.

      2 Indien aanvragen, ingediend in de periode genoemd in het eerste lid, voor vergunningen, vrijstellingen of
      ontheffingen als bedoeld in [artikel 8][ref3], ten behoeve van kampeerterreinen waarvoor vergunning, vrijstelling
      of ontheffing is verleend op grond van de artikelen [14](onbekend), [21](onbekend) of [22 van de Kampeerwet]
      (onbekend), zouden moeten worden geweigerd uitsluitend wegens strijd met een goedgekeurd bestemmingsplan of
      het ontbreken daarvan, verlenen burgemeester en wethouders niettemin de gevraagde vergunning, vrijstelling of
      ontheffing. Ten aanzien van een hernieuwde aanvraag volgen burgemeester en wethouders een zelfde handelswijze.

      3 Ontheffingen als bedoeld in [artikel 27, vierde lid, van de Kampeerwet](onbekend) blijven ook na afloop van
      de in het eerste lid bedoelde periode van kracht zolang geen verordering als bedoeld in [artikel 15][ref4] is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006548#Artikel8
