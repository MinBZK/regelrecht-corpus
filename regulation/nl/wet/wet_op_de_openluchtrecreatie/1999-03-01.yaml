  - number: '10'
    text: |-
      1 Een vergunning als bedoeld in [artikel 8, eerste lid][ref1], kan slechts worden verleend indien:

      a. is voldaan of op redelijke wijze zal worden voldaan aan de regelen gesteld bij of krachtens deze wet en

      b. de aanvraag betrekking heeft op een terrein dat bij bestemmingsplan uitsluitend of mede als kampeerterrein is
      aangewezen.

      2 Een vrijstelling of ontheffing als bedoeld in [artikel 8, tweede lid][ref2], kan slechts worden verleend:

      a. indien is voldaan of op redelijke wijze zal worden voldaan aan de regelen gesteld bij of krachtens deze wet en

      b. voor zover het bestemmingsplan zich er niet tegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
