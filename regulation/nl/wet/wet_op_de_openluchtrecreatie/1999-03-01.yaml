        artikel: '21'
        hoofdstuk: VI
  - number: '41'
    text: |-
      De [Kampeerwet](onbekend) wordt ingetrokken op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel41
  - number: '44'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel44
  - number: '45'
    text: 'Deze wet kan worden aangehaald als: Wet op de openluchtrecreatie.'
    url: https://wetten.overheid.nl/BWBR0006548/1999-03-01#Artikel45
