  - number: '38'
    text: |-
      1 Gedragingen in strijd met het verbod, gesteld in de [artikelen 8][ref1] en [24][ref2], met regelen
      gesteld bij of krachtens [artikel 17][ref3], met voorschriften of beperkingen verbonden aan een vergunning
      als bedoeld in [artikel 8, eerste lid][ref4], aan een vrijstelling of een ontheffing als bedoeld in
      [artikel 8, tweede lid][ref5], of met een last gegeven krachtens [artikel 18, eerste lid][ref6], of
      [artikel 20 juncto artikel 18, eerste lid][ref7], worden gestraft met hechtenis van ten hoogste vier maanden of met
      een geldboete van de tweede categorie.

      2 Gedragingen in strijd met het verbod, gesteld bij [artikel 15][ref8] of met voorschriften of beperkingen
      verbonden aan een ontheffing als bedoeld in [artikel 13][ref9] worden gestraft met hechtenis van ten hoogste een
      maand of een geldboete van de eerste categorie.

      3 De strafbare feiten, bedoeld in het eerste en tweede lid, zijn overtredingen.


