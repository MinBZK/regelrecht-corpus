  - number: '12'
    text: |-
      Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 8, eerste lid][ref1], of een ontheffing
      als bedoeld in [artikel 8, tweede lid][ref2], intrekken indien:

      a. de verstrekte gegevens zodanig onjuist of onvolledig blijken dat, waren de juiste gegevens verstrekt, een andere
      beslissing zou zijn genomen of

      b. blijkt dat de beperkingen of de voorschriften gesteld krachtens [artikel 11][ref3] dan wel de regelen gesteld
      krachtens [artikel 17][ref4] niet of niet behoorlijk worden nageleefd.


