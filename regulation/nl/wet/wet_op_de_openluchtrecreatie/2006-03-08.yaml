---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: wet_op_de_openluchtrecreatie
regulatory_layer: WET
publication_date: '2005-06-23'
valid_from: '2006-03-08'
bwb_id: BWBR0006548
url: https://wetten.overheid.nl/BWBR0006548/2006-03-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, mede ter uitvoering van artikel 22, derde lid, van de
    Grondwet, regels te stellen ten behoeve van de openluchtrecreatie, alsmede, in het kader van het regeringsstreven
    naar vermindering en vereenvoudiging van overheidsregelingen, de wettelijke regelen inzake het kamperen te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
  - number: 1.1.b
    text: |-
      kampeerterrein: terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting bestemd, om
      daarop gelegenheid te geven tot het plaatsen of geplaatst houden van kampeermiddelen ten behoeve van recreatief
      nachtverblijf;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
  - number: 1.1.c
    text: |-
      kampeermiddel: tent, tentwagen, kampeerauto of caravan dan wel enig ander onderkomen of enig ander
      voertuig of gewezen voertuig of gedeelte daarvan, voor zover geen bouwwerk zijnde, waarvoor ingevolge
      [artikel 40 van de Woningwet][ref1] een bouwvergunning vereist is; een en ander voor zover deze onderkomens of
      voertuigen geheel of ten dele blijvend zijn bestemd of opgericht dan wel worden of kunnen worden gebruikt voor
      recreatief nachtverblijf;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: 1.1.d
    text: |-
      kampeerovereenkomst: overeenkomst tussen de houder van een kampeerterrein en degene die een kampeermiddel plaatst
      of geplaatst houdt betreffende het plaatsen of geplaatst houden daarvan.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
  - number: '1.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid worden niet als kampeermiddelen beschouwd vaartuigen, woonwagens
      in de zin van de [Woningwet][ref1], tenten in gebruik voor het houden van bijeenkomsten, tentoonstellingen of
      voorstellingen, en voertuigen in gebruik als direktiekeet.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '1.3'
    text: |-
      Ingeval een caravan is aan te merken als een bouwwerk en het plaatsen geschiedt in overeenstemming
      met de bepalingen van deze wet is voor het plaatsen geen bouwvergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref1] vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: '8.1'
    text: Het is verboden zonder vergunning van burgemeester en wethouders een kampeerterrein te houden.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: '8.2'
    text: |-
      Van het verbod, bedoeld in het eerste lid, kunnen burgemeester en wethouders vrijstelling of ontheffing verlenen
      voor:
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: 8.2.a
    text: het houden van de kampeerterrein voor ten hoogste tien kampeermiddelen;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: 8.2.b
    text: |-
      het houden van een kampeerterrein door een organisatie met een doelstelling van sociale, culturele, educatieve of
      wetenschappelijke aard ten behoeve van eigen doeleinden of
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: 8.2.c
    text: het houden van een natuurkampeerterrein dat voldoet aan door Onze Minister gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: '8.3'
    text: |-
      In afwijking van het tweede lid, onderdeel *a*, kunnen burgemeester en wethouders voor ten hoogste de periode
      van 15 maart tot en met 31 oktober in elk kalenderjaar, het aantal toe te laten kampeermiddelen verhogen tot ten
      hoogste vijftien.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: '8.4'
    text: |-
      De regelen, bedoeld in het tweede lid, onderdeel *c*, hebben in ieder geval betrekking op het soort en het aantal
      toe te laten kampeermiddelen, de periode gedurende welke deze kampeermiddelen op het terrein aanwezig mogen zijn,
      alsmede op de inrichting en het gebruik van het kampeerterrein.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel8
  - number: '9.1'
    text: |-
      Een aanvraag tot een vergunning als bedoeld in [artikel 8, eerste lid][ref1], dient vergezeld te gaan van een
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Een reglement bevat voorwaarden met betrekking tot het gebruik van het kampeerterrein en het verblijf daarop.
      Hiertoe behoren in elk geval:
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.a
    text: bepalingen die een inzicht geven in de opbouw van het tarief;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.b
    text: bepalingen over de wijze van bekendmaking van de geldende prijzen;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.c
    text: |-
      de vergoeding onderscheidenlijk de berekeningswijze van de vergoeding die de houder van de vergunning berekent
      onderscheidenlijk hanteert bij de in [artikel 21, eerste lid][ref1], bedoelde bemiddeling;


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel21
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '21'
        hoofdstuk: VI
  - number: 9.2.d
    text: |-
      de regelen, die de houder van de vergunning in acht neemt bij het aangaan van kampeerovereenkomsten en die in elk
      geval betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.d.1°
    text: de duur van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.d.2°
    text: de wijze, de termijn en de gronden van opzegging;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.d.3°
    text: de gevallen waarin degene die het kampeermiddel plaatst aanspraak op verlenging van de overeenkomst kan maken en
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.d.4°
    text: de verplichtingen die voor degene die het kampeermiddel plaatst geldelijke gevolgen met zich meebrengen;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.e
    text: de kampeerregels en
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: 9.2.f
    text: bepalingen over de wijze van bekendmaking van het reglement.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: '9.3'
    text: Wijzigingen in een reglement worden toegezonden aan burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel9
  - number: '10.1'
    text: |-
      Een vergunning als bedoeld in [artikel 8, eerste lid][ref1], kan slechts worden verleend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 10.1.a
    text: is voldaan of op redelijke wijze zal worden voldaan aan de regelen gesteld bij of krachtens deze wet en
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
  - number: 10.1.b
    text: |-
      de aanvraag betrekking heeft op een terrein dat bij bestemmingsplan uitsluitend of mede als kampeerterrein is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
  - number: '10.2'
    text: |-
      Een vrijstelling of ontheffing als bedoeld in [artikel 8, tweede lid][ref1], kan slechts worden verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 10.2.a
    text: indien is voldaan of op redelijke wijze zal worden voldaan aan de regelen gesteld bij of krachtens deze wet en
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
  - number: 10.2.b
    text: voor zover het bestemmingsplan zich er niet tegen verzet.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel10
  - number: '11.1'
    text: |-
      Burgemeester en wethouders verbinden aan een vergunning als bedoeld in [artikel 8, eerste lid][ref1], of aan
      een vrijstelling of een ontheffing als bedoeld in [artikel 8, tweede lid][ref2], voorschriften over de soort
      en het aantal van de op het kampeerterrein toe te laten kampeermiddelen. Burgemeester en wethouders kunnen deze
      voorschriften wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Burgemeester en wethouders kunnen in het belang van de orde, de rust, de veiligheid, de natuur- en
      landschapsbescherming, de bescherming van het milieu, de hygiëne en de gezondheid, alsmede overige onderwerpen
      betreffende het kamperen aan een vergunning als bedoeld in [artikel 8, eerste lid][ref1], of aan een vrijstelling
      of een ontheffing als bedoeld in [artikel 8, tweede lid][ref2], beperkingen of voorschriften verbinden, dan wel
      deze beperkingen of voorschriften wijzigen of intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12'
    text: |-
      Burgemeester en wethouders kunnen een vergunning als bedoeld in [artikel 8, eerste lid][ref1], of een ontheffing
      als bedoeld in [artikel 8, tweede lid][ref2], intrekken indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12.a
    text: |-
      de verstrekte gegevens zodanig onjuist of onvolledig blijken dat, waren de juiste gegevens verstrekt, een andere
      beslissing zou zijn genomen of
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel12
  - number: 12.b
    text: |-
      blijkt dat de beperkingen of de voorschriften gesteld krachtens [artikel 11][ref1] niet of niet behoorlijk worden
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel11
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Onverminderd het bepaalde krachtens [artikel 14][ref1] kunnen burgemeester en wethouders ontheffing verlenen van
      het verbod, bedoeld in [artikel 8, eerste lid][ref2], voor het gelegenheid geven tot het plaatsen of geplaatst
      houden van kampeermiddelen buiten de in [artikel 8, eerste of tweede lid][ref3], bedoelde kampeerterreinen, door
      groepen uitgaande van een vereniging of andere organisatie met een doelstelling van sociale, culturele, educatieve
      of wetenschappelijke aard, gedurende een in de ontheffing aangegeven korte, aaneengesloten periode.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Het bepaalde in [de artikelen 11][ref1] en [12][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel12
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '11'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '14'
    text: |-
      Gedeputeerde staten kunnen in het belang van de natuur- en landschapsbescherming een of meer gebieden aanwijzen
      waarvoor geen ontheffing als bedoeld in [artikel 13][ref1] kan worden verleend gedurende een daarbij te bepalen
      periode of waarvoor een aantal kampeermiddelen ten aanzien waarvan een ontheffing als bedoeld in [artikel 13][ref2]
      kan worden verleend op een daarbij te bepalen maximum aantal wordt gesteld gedurende een daarbij te bepalen
      periode.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel13
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.1'
    text: |-
      Het is verboden ten behoeve van recreatief nachtverblijf kampeermiddelen te plaatsen of geplaatst
      te houden buiten kampeerterreinen waarvoor een vergunning, vrijstelling of ontheffing als bedoeld in
      [artikel 8, eerste onderscheidenlijk tweede lid][ref1], of een ontheffing als bedoeld in [artikel 13][ref2] is
      verleend, behoudens voor zover bij verordening door de gemeenteraad afwijking van dit verbod is toegestaan voor het
      plaatsen of geplaatst houden van ten hoogste vijf kampeermiddelen gedurende korte perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel13
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid kan bij verordening het plaatsen van één kampeermiddel voor eigen gebruik door de
      eigenaar van een terrein voor langere perioden dan bedoeld in het eerste lid, worden toegestaan. Daarbij kan tevens
      worden bepaald dat het is toegestaan tijdelijk bij dat kampeermiddel ten hoogste twee andere kampeermiddelen voor
      eigen gebruik te plaatsen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel15
  - number: '15.3'
    text: |-
      Bij verordening als bedoeld in het eerste lid, kan niet worden toegestaan het plaatsen of geplaatst houden
      van kampeermiddelen ten behoeve van recreatief nachtverblijf op terreinen aansluitend aan of behorende bij
      kampeerterreinen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel15
  - number: '16'
    text: |-
      Gedeputeerde staten kunnen in het belang van de natuur- en landschapsbescherming een of meer gebieden aanwijzen
      waarvoor het verbod van [artikel 15][ref1] onverkort geldt of waarvoor het aantal kampeermiddelen, bedoeld in
      [dat artikel][ref2], op een daarbij te bepalen lager aantal wordt gesteld gedurende een daarbij te bepalen periode.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel15
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '15'
        hoofdstuk: III
  - number: '21.1'
    text: |-
      Elke overeenkomst ter zake van een bemiddeling bij koop of verkoop van een kampeermiddel tussen de houder van een
      kampeerterrein of een door hem aangewezen derde en de koper of verkoper van een kampeermiddel moet schriftelijk
      worden aangegaan en betreft in ieder geval:
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: 21.1.a
    text: de aard en de omvang van de bemiddeling.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: 21.1.b
    text: het tijdvak waarover de bemiddeling zich uitstrekt en
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: 21.1.c
    text: |-
      de vergoeding welke in rekening wordt gebracht voor de bemiddeling dan wel de wijze waarop deze vergoeding wordt
      berekend.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: '21.2'
    text: |-
      De houder van een kampeerterrein of een door hem aangewezen derde mag ter zake van een bemiddeling bij koop of
      verkoop van een kampeermiddel slechts aan hetzij de koper hetzij de verkoper een vergoeding als bedoeld in het
      eerste lid, in rekening brengen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: '21.3'
    text: |-
      Leidt de bemiddeling niet tot koop of verkoop van een kampeermiddel dan kunnen de ter zake van de bemiddeling
      werkelijk gemaakte kosten in rekening worden gebracht, indien dat tevoren schriftelijk is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: '21.4'
    text: Elke overeenkomst of elk beding in strijd met het bepaalde in de voorafgaande leden is nietig.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: '21.5'
    text: |-
      De houder van een kampeerterrein dient degene die met hem een kampeerovereenkomst voor onbepaalde tijd of voor een
      tijdvak van ten minste zeven maanden wenst aan te gaan, bij het sluiten van die overeenkomst in de gelegenheid te
      stellen kennis te nemen van de voorwaarden die hij hanteert bij een overeenkomst als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel21
  - number: '22.1'
    text: |-
      Elk in verband met het tot stand komen van een kampeerovereenkomst gemaakt beding waarbij ten behoeve van een der
      partijen dan wel door of tegenover een derde enig niet redelijk voordeel wordt overeengekomen, is nietig.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel22
  - number: '22.2'
    text: |-
      Is het voordeel slechts voor een deel onredelijk, dan blijft het beding voor het overige in stand, voor zover dit,
      gelet op de inhoud en strekking van het beding, niet in onverbrekelijk verband met het nietige deel staat.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel22
  - number: '23'
    text: |-
      Voor zover een kampeerovereenkomst afwijkt van het reglement als bedoeld in [artikel 9][ref1], ten nadele van
      degene die het kampeermiddel plaatst of geplaatst houdt, kan deze laatste zich rechtstreeks beroepen op het
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel9
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '9'
        hoofdstuk: III
        paragraaf: '2'
  - number: '31.1'
    text: 'Burgemeester en wethouders kennen een naar billijkheid te bepalen schadevergoeding toe aan en op verzoek van:'
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel31
  - number: 31.1.a
    text: |-
      de houder van een kampeerterrein, indien deze schade lijdt of zal lijden als gevolg van een besluit tot wijziging
      of intrekking van een vrijstelling, vergunning of ontheffing of de aan een vrijstelling, vergunning of ontheffing
      verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel31
  - number: 31.1.b
    text: |-
      de aanvrager van een vergunning of ontheffing indien deze schade lijdt of zal lijden als gevolg van een besluit tot
      weigering van de vergunning of ontheffing of de aan de vergunning of ontheffing verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel31
  - number: '31.2'
    text: |-
      Een schadevergoeding als bedoeld in het eerste lid, wordt slechts verleend, indien de schade redelijkerwijs niet of
      niet geheel ten laste behoort te blijven van degene die de schade lijdt of zal lijden en de vergoeding niet of niet
      voldoende door aankoop, onteigening of anderszins is verzekerd.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel31
  - number: '33'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn belast de bij besluit van
      burgemeester en wethouders daartoe aangewezen ambtenaren. Bij algemene maatregel van bestuur kunnen terzake van de
      uitoefening van dit toezicht regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel33
  - number: '34.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de daartoe aangewezen buitengewone
      opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '34.2'
    text: 'Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn tevens belast:'
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel34
  - number: 34.2.a
    text: |-
      de in [artikel 33][ref1], bedoelde ambtenaren, voor zover deze zijn aangewezen bij besluit van Onze Minister van
      Justitie en


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel33
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '33'
        hoofdstuk: XI
  - number: 34.2.b
    text: de ambtenaren, aangewezen bij besluit van Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel34
  - number: '34.3'
    text: |-
      Van een besluit als bedoeld in het eerste en tweede lid, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel34
  - number: '35'
    text: |-
      De in de [artikelen 33][ref1] en [34][ref2] bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde
      apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel34
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '33'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '34'
        hoofdstuk: XI
  - number: '36.1'
    text: |-
      De [artikelen 5:13][ref1] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 34][ref3] bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006548#Artikel34
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0006548
        artikel: '34'
        hoofdstuk: XI
  - number: '36.2'
    text: |-
      De in de [artikelen 33][ref1] en [34][ref2] bedoelde ambtenaren zijn bevoegd tot het onderzoeken van stoffen die
      een bedreiging kunnen vormen voor de hygiëne, gezondheid en veiligheid van een kampeerterrein en het verrichten
      van opmetingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel34
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '33'
        hoofdstuk: XI
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '34'
        hoofdstuk: XI
  - number: '37'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], voor zover het betreft de verplichting tot het
      verlenen van medewerking aan een krachtens [artikel 33][ref2] of [34][ref3] aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0006548#Artikel34
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '33'
        hoofdstuk: XI
      - id: ref3
        bwb_id: BWBR0006548
        artikel: '34'
        hoofdstuk: XI
  - number: '38.1'
    text: |-
      Gedragingen in strijd met het verbod, gesteld in de [artikelen 8][ref1], met voorschriften of beperkingen verbonden
      aan een vergunning als bedoeld in [artikel 8, eerste lid][ref2], aan een vrijstelling of een ontheffing als bedoeld
      in [artikel 8, tweede lid][ref3], worden gestraft met hechtenis van ten hoogste vier maanden of met een geldboete
      van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006548
        artikel: '8'
        hoofdstuk: III
        paragraaf: '1'
  - number: '38.2'
    text: |-
      Gedragingen in strijd met het verbod, gesteld bij [artikel 15][ref1] of met voorschriften of beperkingen verbonden
      aan een ontheffing als bedoeld in [artikel 13][ref2] worden gestraft met hechtenis van ten hoogste een maand of een
      geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel13
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '15'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: '38.3'
    text: De strafbare feiten, bedoeld in het eerste en tweede lid, zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel38
  - number: '44'
    text: Deze wet vervalt op 1 januari 2008.
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel44
  - number: '45'
    text: 'Deze wet kan worden aangehaald als: Wet op de openluchtrecreatie.'
    url: https://wetten.overheid.nl/BWBR0006548/2006-03-08#Artikel45
