  - number: X
    text: >-
      Deze wet treedt in werking op 13 juni 2014. Wordt het Staatsblad waarin deze wet wordt geplaatst later uitgegeven
      dan 12 juni 2014, dan treedt zij in werking op de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
