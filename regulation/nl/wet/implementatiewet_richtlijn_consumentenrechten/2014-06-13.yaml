preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat de Richtlijn 2011/83/EU van het Europees Parlement en de Raad van 25
    oktober 2011 betreffende consumentenrechten, tot wijziging van Richtlijn 93/13/EEG van de Raad en van Richtlijn
    1999/44/EG van het Europees Parlement en de Raad en tot intrekking van Richtlijn 85/577/EEG en van Richtlijn 97/7/
    EG van het Europees Parlement en de Raad moet worden omgezet in bepalingen van nationaal recht en dat daartoe de
    Boeken 6 en 7 van het Burgerlijk Wetboek, de Wet handhaving consumentenbescherming en enige andere wetten moeten
    worden gewijzigd;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0035034/2014-06-13#ArtikelAanhef
