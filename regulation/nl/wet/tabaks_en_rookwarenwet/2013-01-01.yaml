  - number: 11b.2
    text: |-
      De hoogte van de bestuurlijke boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de
      wegens een afzonderlijke overtreding te betalen geldsom ten hoogste:
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11b
  - number: 11b.2.a
    text: |-
      € 450 000 bedraagt wegens overtreding van [artikel 5][ref1] of [5a][ref2], indien die overtreding is begaan door
      een fabrikant, groothandel of importeur van tabaksproducten;


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: 5a
        paragraaf: '3'
  - number: 11b.2.b
    text: € 4 500 bedraagt in andere dan de onder a bedoelde gevallen.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11b
  - number: 11b.3
    text: |-
      In afwijking van het eerste lid kan de overtreding niet met een bestuurlijke boete worden afgedaan, indien de in
      de bijlage ter zake van de overtreding voorziene bestuurlijke boete aanmerkelijk wordt overschreden door het met de
      overtreding behaalde economische voordeel.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11b
  - number: 11c.1
    text: |-
      De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen bestuurlijke
      boete.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11c
  - number: 11c.2
    text: Bij algemene maatregel van bestuur kan de bijlage worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11c
  - number: 11c.3
    text: |-
      Een krachtens het tweede lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het Staatsblad, waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11c
  - number: 11c.4
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het tweede lid wordt vastgesteld op voordracht van Onze Minister,
      in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11c
  - number: '12'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 7][ref1], [artikel 9, vierde lid][ref2],
      en [artikel 11a][ref3], wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004302#Artikel11a
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: '9'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004302
        artikel: 11a
        paragraaf: '5'
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel13
  - number: '13.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel13
  - number: '15'
    text: |-
      Van elke krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzochte zaak wordt aan de
      belanghebbende op diens verzoek een vergoeding gegeven ter grootte van het bedrag waarmee haar verkoopwaarde ten
      gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '17'
    text: |-
      De toezichthouders zijn bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner, voor zover dit binnentreden beperkt blijft tot het zich begeven naar en het betreden
      van de in de woning aanwezige bedrijfsruimten.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel17
  - number: '18'
    text: |-
      In het belang van de volksgezondheid kunnen voorts bij algemene maatregel van bestuur regels worden gesteld ter
      uitvoering van een bindende regeling inzake tabaksproducten, die krachtens het [Verdrag tot oprichting van de
      Europese Gemeenschap](onbekend) tot stand is gekomen.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel18
  - number: '21'
    text: 'Deze wet kan worden aangehaald als: Tabakswet.'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel21
  - number: '22'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel22
