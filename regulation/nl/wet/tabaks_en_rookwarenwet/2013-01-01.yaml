  - number: 5c.3
    text: 'Op vordering van de eiser kan aan de uitspraak worden verbonden:'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
  - number: 5c.3.a
    text: een verbod van de reclame of de sponsoring;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
  - number: 5c.3.b
    text: |-
      een gebod tot het verwijderen of doen verwijderen, dan wel tot het wijzigen of doen wijzigen, van de reclame of
      de sponsoring;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
  - number: 5c.3.c
    text: |-
      een veroordeling tot het openbaar maken of laten openbaar maken van de uitspraak, zulks op door de rechter te
      bepalen wijze en op kosten van de door de rechter aan te geven partij of partijen.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
  - number: 5c.4
    text: |-
      De rechter kan in zijn uitspraak aangeven op welke wijze de inbreuk op [artikel 5][ref1] of [5a][ref2] wordt
      weggenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: 5a
        paragraaf: '3'
  - number: 5c.5
    text: |-
      Geschillen ter zake van de tenuitvoerlegging van de in het derde lid bedoelde veroordelingen, alsmede van de
      veroordeling tot betaling van een dwangsom, zo deze is opgelegd, worden bij uitsluiting door de rechtbank Rotterdam
      beslist.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
  - number: '7.2'
    text: |-
      Het is verboden in inrichtingen voor gezondheidszorg, welzijn, maatschappelijke dienstverlening, kunst en cultuur,
      sport, sociaal-cultureel werk of onderwijs, voor zover die inrichtingen behoren tot bij algemene maatregel
      van bestuur aangewezen categorieën, bedrijfsmatig of anders dan om niet tabaksproducten aan particulieren te
      verstrekken of met dat doel aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het is verboden in bij algemene maatregel van bestuur aangewezen categorieën van bedrijven en organisaties
      bedrijfsmatig of anders dan om niet tabaksproducten aan particulieren te verstrekken of met dat doel aanwezig te
      hebben.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet tabaksproducten te verstrekken aan een persoon van wie niet
      is vastgesteld dat deze de leeftijd van 16 jaar heeft bereikt. Onder verstrekken wordt eveneens begrepen het
      verstrekken van een tabaksproduct aan een persoon van wie is vastgesteld dat deze de leeftijd van 16 jaar heeft
      bereikt, welk tabaksproduct echter kennelijk bestemd is voor een persoon van wie niet is vastgesteld dat deze de
      leeftijd van 16 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vaststelling, bedoeld in het eerste lid, blijft achterwege, indien het een persoon betreft die onmiskenbaar
      de leeftijd van 16 jaar heeft bereikt. De vaststelling geschiedt aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, van de Wet op de identificatieplicht][ref1], dan wel een bij of krachtens algemene
      maatregel van bestuur aangewezen document.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8.3'
    text: |-
      Op plaatsen waar bedrijfsmatig of anders dan om niet tabaksproducten aan particulieren plegen te worden verstrekt,
      dient duidelijk zichtbaar en goed leesbaar te worden aangegeven dat aan personen jonger dan 16 jaar geen
      tabaksproducten worden verstrekt. Onze Minister kan daaromtrent nadere regels stellen en een model voorschrijven.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het is verboden bedrijfsmatig tabaksproducten gratis aan particulieren uit te reiken, toe te zenden of op enigerlei
      andere wijze beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet sigaretten aan particulieren te verstrekken of met dat doel
      aanwezig te hebben anders dan in een gesloten verpakking, die niet zonder kenbare beschadiging kan worden geopend.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het is verboden sigaretten in een verpakking van minder dan negentien stuks, behoudens uitzonderingen bij
      ministeriële regeling, in de handel te brengen of daartoe aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel9
  - number: '9.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen methoden voor het bedrijfsmatig of anders dan om niet verstrekken van
      tabaksproducten aan particulieren zonder ter hand stelling door tussenkomst van een verstrekkende persoon worden
      verboden. Op het verbod kunnen, overeenkomstig bij algemene maatregel van bestuur gestelde regelen, beperkingen
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      Voor de instellingen, diensten en bedrijven die door de Staat en de openbare lichamen worden beheerd, worden
      door het bevoegde orgaan zodanige maatregelen getroffen, dat van de daardoor geboden voorzieningen gebruik kan
      worden gemaakt en de werkzaamheden daarin kunnen worden verricht zonder daarbij hinder of overlast van roken te
      ondervinden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort in ieder geval het instellen, aanduiden en handhaven van
      een rookverbod in ruimten, behorende tot bij algemene maatregel van bestuur, aangewezen categorieën. Op het verbod
      kunnen, overeenkomstig bij de algemene maatregel van bestuur gestelde regelen, beperkingen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Bij algemene maatregel van bestuur kan aan degenen die - anders dan in een hoedanigheid als bedoeld
      in [artikel 10][ref1] - het beheer hebben over gebouwen of inrichtingen voor gezondheidszorg, welzijn,
      maatschappelijke dienstverlening, kunst en cultuur, sport, sociaal-cultureel werk of onderwijs, voor zover die
      gebouwen of inrichtingen behoren tot bij algemene maatregel van bestuur aangewezen categorieën, de verplichting
      worden opgelegd tot het treffen van maatregelen als bedoeld in [artikel 10, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel10
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '10'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: '10'
        paragraaf: '5'
  - number: '11.2'
    text: |-
      [Artikel 10, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel10
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '10'
        paragraaf: '5'
  - number: 11a.1
    text: |-
      Werkgevers zijn verplicht zodanige maatregelen te treffen dat werknemers in staat worden gesteld hun werkzaamheden
      te verrichten zonder daarbij hinder of overlast van roken door anderen te ondervinden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Exploitanten van middelen voor personenvervoer zijn verplicht zodanige maatregelen te treffen dat passagiers in
      staat worden gesteld hun reis te volbrengen zonder daarbij hinder of overlast van roken te ondervinden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.3
    text: |-
      Nederlandse luchtvaartmaatschappijen zijn verplicht zodanige maatregelen te treffen dat passagiers aan boord van
      hun vliegtuigen tijdens het gebruik voor de burgerluchtvaart op vluchten van en naar op Nederlands grondgebied
      gelegen luchthavens in staat worden gesteld hun reis te volbrengen zonder daarbij hinder of overlast van roken
      te ondervinden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.4
    text: |-
      Diegenen die – anders dan in een hoedanigheid als bedoeld in [artikel 10][ref1] of [11][ref2] – het beheer
      hebben over voor het publiek toegankelijke gebouwen, voor zover die gebouwen behoren tot bij algemene
      maatregel van bestuur aangewezen categorieën, zijn verplicht tot het treffen van maatregelen als bedoeld in
      [artikel 10, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004302#Artikel10
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '10'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: '11'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0004302
        artikel: '10'
        paragraaf: '5'
  - number: 11a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen op de in dit artikel bedoelde verplichtingen beperkingen worden
      aangebracht. Zo kan worden bepaald dat de verplichtingen, bedoeld in het eerste lid, niet gelden voor bij die
      maatregel aangewezen:
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.5.a
    text: categorieën van werkgevers;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.5.b
    text: ruimten in gebouwen;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11a.5.c
    text: andere plaatsen waar werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel11a
  - number: 11b.1
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van het bepaalde bij of krachtens
      de [artikelen 2][ref1], [3][ref2], [3a][ref3], [3b][ref4], [3c][ref5], [3e][ref6], [4][ref7], [5][ref8],
      [5a][ref9], [7][ref10], [8][ref11], [9][ref12], [10][ref13], [11][ref14], [11a][ref15] of [18][ref16].


