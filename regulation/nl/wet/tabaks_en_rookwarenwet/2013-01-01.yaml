---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tabaks_en_rookwarenwet
regulatory_layer: WET
publication_date: '2025-05-07'
valid_from: '2013-01-01'
bwb_id: BWBR0004302
url: https://wetten.overheid.nl/BWBR0004302/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in het belang van de volksgezondheid regelen te stellen
    ter beperking van het gebruik van tabak en meer in het bijzonder ertoe strekkende hinder voor hen die geen tabak
    gebruiken tegen te gaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      tabaksproducten: producten die voor roken, snuiven, zuigen of pruimen bestemd zijn en die, al is het slechts ten
      dele, uit tabak bestaan, ook indien genetisch gemodificeerd;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.b
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.c
    text: 'bijlage: de bijlage bij deze wet;'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.d
    text: |-
      reclame: elke handeling in de economische sfeer met als doel de verkoop van tabaksproducten te bevorderen en elke
      vorm van commerciële mededeling die het bekendheid geven aan of het aanprijzen van een tabaksproduct tot doel dan
      wel rechtstreeks of onrechtstreeks tot gevolg heeft, met inbegrip van reclame waarmee, zonder het tabaksproduct
      rechtstreeks te noemen, wordt getracht het reclameverbod te omzeilen door gebruik te maken van een naam, merk,
      symbool of enig ander onderscheidend teken van een tabaksproduct;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.e
    text: |-
      sponsoring: elke openbare of particuliere economische bijdrage aan een activiteit, evenement of persoon, die het
      bekendheid geven aan of het aanprijzen van een tabaksproduct tot doel dan wel rechtstreeks of onrechtstreeks tot
      gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.f
    text: |-
      tabaksverkooppunt: iedere plaats waar tabaksproducten aanwezig zijn voor het bedrijfsmatig of anders dan om niet
      verstrekken;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.g
    text: |-
      tabaksspeciaalzaak: een inrichting, zijnde een winkel of een onderdeel daarvan, met een afsluitbare eigen
      toegang, waarin een totaal assortiment aan tabaksproducten van ten minste 90 merkenversies aanwezig is voor het
      bedrijfsmatig of anders dan om niet verstrekken en:
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.g.1°
    text: met een verkoopvloeroppervlakte van minimaal 10 m2, of,
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.g.2°
    text: |-
      met een verkoopvloeroppervlakte van minder dan 10 m2, die reeds voor 1 januari 2001 als tabakszaak stond
      ingeschreven bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.h
    text: 'teer: het ongezuiverde water- en nicotinevrije condensaat van rook;'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.i
    text: 'nicotine: nicotinealkaloïden;'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.j
    text: |-
      ingrediënten: stoffen of bestanddelen, met uitzondering van tabaksbladeren en andere natuurlijke of niet-
      getransformeerde delen van de tabaksplant, die bij de productie of de bereiding van tabaksproducten worden gebruikt
      en nog in het eindproduct aanwezig zijn, al dan niet in gewijzigde vorm, met inbegrip van papier, filter, inkt
      en kleefstoffen;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: 1.k
    text: |-
      diensten van de informatiemaatschappij: diensten in de zin van artikel 1, tweede lid, van [richtlijn nr. 98/34/
      EG](31998L0034) van het Europees Parlement en de Raad van 22 juni 1998 betreffende een informatieprocedure op het
      gebied van normen en technische voorschriften en regels betreffende de diensten van de informatiemaatschappij (PbEG
      L 204).
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur worden in het belang van de volksgezondheid eisen gesteld, waaraan
      tabaksproducten moeten voldoen ter zake van aanduidingen die moeten voorkomen op de verpakking waarin zij aan
      particulieren worden verstrekt. Indien de aanduiding betrekking heeft op de samenstelling van de producten kan
      bij of krachtens de maatregel een daarbij omschreven methode van onderzoek worden aangewezen, die bij uitsluiting
      beslissend is voor de vaststelling of met betrekking tot het produkt al dan niet de juiste aanduiding is gebezigd.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het belang van de volksgezondheid eisen worden gesteld, waaraan
      tabaksproducten moeten voldoen ter zake van de samenstelling, zoals het nicotinegehalte en de hoeveelheden teer
      en koolmonoxyde die bij de verbranding ontstaan. Bij of krachtens de maatregel kan een daartoe omschreven methode
      van onderzoek worden aangewezen, die bij uitsluiting beslissend is voor de vaststelling of met betrekking tot een
      produkt al dan niet aan de daaraan gestelde eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden bedrijfsmatig of anders dan om niet tabaksproducten te verstrekken of daartoe aanwezig te hebben,
      indien die producten niet aan de krachtens [artikel 2][ref1] gestelde eisen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel2
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het eerste lid niet van toepassing is indien
      aannemelijk wordt gemaakt dat het produkt voor uitvoer is bestemd of is bestemd om te worden vernietigd dan wel in
      overeenstemming te worden gebracht met de daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3
  - number: 3a
    text: |-
      Het is verboden tabaksproducten, bestemd voor oraal gebruik anders dan roken of pruimen, in de vorm van poeder,
      fijne deeltjes of een combinatie van deze vormen dan wel in vormen die eruitzien als levensmiddelen, bedrijfsmatig
      te verstrekken of daartoe aanwezig te hebben.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3a
  - number: 3b.1
    text: |-
      Tabaksproducenten en -importeurs zijn verplicht jaarlijks bij Onze Minister een lijst in te dienen van alle
      ingrediënten, met opgave van de hoeveelheden, die voor de productie van hun tabaksproducten worden gebruikt,
      opgesplitst naar merk en type per eenheid product.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3b
  - number: 3b.2
    text: |-
      Bij de lijst gaat een verklaring waarin wordt uiteengezet waarom de ingrediënten aan de tabaksproducten worden
      toegevoegd. De functie en de categorie ervan worden vermeld. Bij de lijst gaan tevens de voor de producent of de
      importeur beschikbare toxicologische gegevens betreffende de ingrediënten in verbrande en onverbrande vorm, naar
      gelang van het geval, waarbij in het bijzonder de gevolgen daarvan voor de gezondheid worden vermeld en mogelijke
      verslavende effecten in aanmerking worden genomen. De lijst wordt opgesteld in afnemende volgorde naar gewicht van
      de respectieve ingrediënten van het product.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3b
  - number: 3b.3
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de lijst, het tijdstip waarop de lijst
      moet worden ingediend, alsmede de bij te voegen bescheiden en gegevens.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3b
  - number: 3b.4
    text: |-
      Onze Minister draagt op een door hem te bepalen wijze zorg voor openbaarmaking van de in het eerste en tweede
      lid bedoelde lijst van ingrediënten en de in het derde lid bedoelde bescheiden en gegevens. Daarbij blijft de
      openbaarmaking van bedrijfs- en fabricagegegevens achterwege, voor zover het belang van openbaarmaking niet opweegt
      tegen de onevenredige benadeling van de verstrekker van die gegevens.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3b
  - number: 3b.5
    text: |-
      Alle ingevolge dit artikel verstrekte gegevens worden door Onze Minister jaarlijks aan de Commissie voor de
      Europese Gemeenschappen gezonden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3b
  - number: 3c.1
    text: |-
      Tabaksproducenten en -importeurs zijn verplicht medewerking te verlenen aan door Onze Minister ingestelde,
      aangewezen of goedgekeurde metingen en onderzoekingen, die tot doel hebben na te gaan wat het gehalte is aan teer,
      nicotine, koolmonoxide en andere stoffen die tabaksproducten, opgesplitst naar merk en type per eenheid product,
      voortbrengen, alsook om de gevolgen van deze andere stoffen voor de gezondheid na te gaan, daarbij onder meer
      rekening houdend met het inherente gevaar van afhankelijkheid.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3c
  - number: 3c.2
    text: |-
      De metingen en onderzoekingen voor gehaltes aan teer, nicotine en koolmonoxide worden uitgevoerd of geverifieerd
      door laboratoria die zijn erkend door en onder toezicht staan van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3c
  - number: 3c.3
    text: |-
      De resultaten van de metingen en onderzoekingen worden jaarlijks aan Onze Minister overgelegd of zo veel minder
      frequent als bij regeling van Onze Minister is bepaald.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3c
  - number: 3c.4
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop toepassing wordt gegeven
      aan het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3c
  - number: 3d
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de erkenning van laboratoria,
      die metingen en onderzoekingen als bedoeld in [artikel 3c][ref1] verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel3c
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: 3c
        paragraaf: '2'
  - number: 3e
    text: |-
      Met ingang van 30 september 2003 is het verboden op de verpakking van tabaksproducten teksten, namen, handelsmerken
      en figuratieve of andere tekens te gebruiken, die de suggestie wekken dat een bepaald tabaksproduct minder
      schadelijk is dan een ander tabaksproduct.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel3e
  - number: '5.1'
    text: Elke vorm van reclame of sponsoring is verboden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onder het verbod, bedoeld in het eerste lid, worden eveneens begrepen onder de reikwijdte van de
      [Mediawet 2008][ref1] vallende reclameboodschappen, telewinkelboodschappen, sponsoring en productplaatsing voor
      tabaksproducten. Het gebruik maken van namen, (beeld)merken of andere onderscheidende tekens die door hun sterke
      gelijkenis bij het publiek redelijkerwijs de indruk geven dat het sponsoring door een producent of verkoper van
      tabaksproducten betreft, is evenmin toegestaan in het media-aanbod. In afwijking van het eerste lid is sponsoring
      van radioprogramma’s toegestaan, indien dit geschiedt door ondernemingen waarvan de hoofdactiviteit niet wordt
      gevormd door de vervaardiging of de verkoop van tabaksproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: '5.3'
    text: |-
      Het verbod, bedoeld in het eerste lid, anders dan met betrekking tot onder de reikwijdte van de
      [Mediawet 2008][ref1] vallende reclameboodschappen, telewinkelboodschappen, sponsoring en productplaatsing voor
      tabaksproducten, geldt niet, indien een naam die reeds te goeder trouw wordt gebruikt voor zowel tabaksproducten
      als andere producten of diensten welke door een zelfde onderneming of door verschillende ondernemingen in de handel
      zijn gebracht of worden aangeboden, voor reclame voor die andere producten of diensten wordt gebruikt en die naam
      gebruikt wordt in een duidelijk andere presentatievorm dan die waarin hij voor het tabaksproduct wordt gebruikt,
      met uitsluiting van enig ander onderscheidend teken dat reeds voor een tabaksproduct gebruikt wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0025028
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025028
  - number: '5.4'
    text: 'Het eerste lid geldt evenmin voor:'
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.a
    text: |-
      commerciële mededelingen in de pers en andere gedrukte publicaties, alsmede in diensten van de
      informatiemaatschappij, die de aanprijzing van een tabaksproduct tot doel dan wel rechtstreeks of onrechtstreeks
      tot gevolg hebben, en die:
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.a.1°
    text: uitsluitend bestemd zijn voor personen die werkzaam zijn in de tabakshandel; of
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.a.2°
    text: |-
      worden gedrukt en uitgegeven in, dan wel worden verleend vanuit landen buiten de Europese Unie, mits deze niet
      hoofdzakelijk voor landen binnen de Europese Unie bestemd zijn;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.b
    text: |-
      de reguliere presentatie van te koop aangeboden tabaksproducten door middel van het tonen daarvan in een gesloten
      verpakking tegen een neutrale achtergrond en de normale prijsaanduiding daarvan in tabaksverkooppunten, met dien
      verstande dat de verpakkingseis niet geldt voor sigaren, pijptabak en pruimtabak in een tabaksspeciaalzaak;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.c
    text: |-
      uitsluitend voor de koper van tabaksproducten bestemde reclame in een tabaksspeciaalzaak of aan de voorgevel
      daarvan, dan wel in een met een afsluitbare eigen toegang duidelijk afgescheiden tabaksverkooppunt in een
      levensmiddelenzaak of een warenhuis, mits de reclame niet op minderjarigen is gericht en:
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.c.1°
    text: aan de voorgevel van een tabaksspeciaalzaak in totaal niet meer dan 2 m2 beslaat;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.c.2°
    text: |-
      voor zover aanwezig in een afgescheiden tabaksverkooppunt in een levensmiddelenzaak of een warenhuis alleen
      is bevestigd aan, op, in of tegen het gedeelte van de besloten ruimte dat bestemd is voor de presentatie van
      tabaksproducten en uitsluitend is gericht op personen die in het tabaksverkooppunt zelve aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5.4.c.3°
    text: voldoet aan de bij ministeriële regeling te stellen voorschriften.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: '5.5'
    text: |-
      Iedere uitreiking om niet of tegen een symbolische vergoeding, die het aanprijzen van een tabaksproduct ten doel of
      tot rechtstreeks of onrechtstreeks gevolg heeft, is verboden.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: '5.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het bijzonder voor minderjarigen bestemde goederen en diensten
      worden aangewezen, die niet bedrijfsmatig mogen worden verstrekt in tabaksspeciaalzaken en in afgescheiden
      tabaksverkooppunten in levensmiddelenzaken en warenhuizen, indien daar reclame voor tabaksproducten wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5
  - number: 5a.1
    text: |-
      Het is verboden voor een tabaksproduct een naam, een merk, een symbool of enig ander onderscheidend teken
      van een ander product of van een andere dienst te gebruiken, tenzij dit tabaksproduct reeds vóór de datum van
      inwerkingtreding van het in [artikel 5, eerste lid][ref1], bedoelde verbod onder die naam, dat merk of symbool, dan
      wel met dat onderscheidende teken, in de handel was.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
  - number: 5a.2
    text: |-
      Het is verboden voor producten of diensten, die na de datum van inwerkingtreding van het in
      [artikel 5, eerste lid][ref1], bedoelde verbod op de markt worden gebracht, een naam, merk, symbool of een ander
      onderscheidend teken te gebruiken dat eerder al voor een tabaksproduct werd gebruikt, tenzij de naam, het merk, het
      symbool of het andere onderscheidende teken van het product of de dienst in een duidelijk andere vorm dan die van
      het tabaksproduct wordt gepresenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
  - number: 5b.1
    text: |-
      Op vordering van een rechtspersoon als bedoeld in het derde lid kan reclame of sponsoring, die in strijd is met het
      bepaalde in de [artikelen 5][ref1] of [5a][ref2], onrechtmatig worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004302#Artikel5a
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004302
        artikel: 5a
        paragraaf: '3'
  - number: 5b.2
    text: De vordering kan worden ingesteld tegen degene die verantwoordelijk is voor de reclame of sponsoring.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5b
  - number: 5b.3
    text: |-
      De vordering komt toe aan rechtspersonen met volledige rechtsbevoegdheid, die tot doel hebben de preventie van
      roken, het stoppen met roken of de behartiging van de belangen van jongeren, consumenten of niet-rokers.
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5b
  - number: 5b.4
    text: |-
      De eiser is niet ontvankelijk, indien niet blijkt dat hij, alvorens de vordering in te stellen, de
      verantwoordelijke de gelegenheid heeft geboden om de reclame of de sponsoring te verwijderen, dan wel, als
      [artikel 5, derde lid][ref1], van toepassing is, de reclame of sponsoring zodanig te wijzigen dat de bezwaren die
      grond voor de vordering zouden opleveren, zijn weggenomen. Een termijn van twee weken na schriftelijke kennisgeving
      van de bezwaren is daartoe in elk geval voldoende.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: '5'
        paragraaf: '3'
  - number: 5c.1
    text: |-
      De rechtbank Rotterdam is bij uitsluiting bevoegd tot kennisneming van vorderingen als bedoeld in
      [artikel 5b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5b
    url: https://wetten.overheid.nl/BWBR0004302/2013-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0004302
        artikel: 5b
        paragraaf: '3'
  - number: 5c.2
    text: |-
      De in [artikel 5b][ref1] bedoelde rechtspersonen hebben de bevoegdheden, geregeld in de [artikelen 285][ref2]
      en [376 van het Wetboek van Burgerlijke Rechtsvordering][ref3]; artikel [379 van dat wetboek][ref4] is niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004302#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel285
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel376
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel379
