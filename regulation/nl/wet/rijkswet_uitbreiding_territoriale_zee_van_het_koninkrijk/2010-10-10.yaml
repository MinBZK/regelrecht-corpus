---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.5.2/schema/v0.5.2/schema.json
$id: rijkswet_uitbreiding_territoriale_zee_van_het_koninkrijk
regulatory_layer: WET
publication_date: 2010-09-01
valid_from: 2010-10-10
bwb_id: BWBR0003749
url: https://wetten.overheid.nl/BWBR0003749/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het bijzonder voor de veiligheid van de scheepvaart voor de
    kust en voor de bescherming van het zeemilieu van belang is dat het Koninkrijk in de Nederlandse Antillen zijn
    territoriale zee tot twaalf zeemijlen uitbreidt;

    Dat het tevens wenselijk is ter gelegenheid van deze uitbreiding preciseringen aan te brengen in de grens tussen de
    binnenwateren en de territoriale zee van het Koninkrijk in de Nederlandse Antillen;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003749/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De territoriale zee van het Koninkrijk in Aruba, Curaçao, Sint Maarten en in de openbare lichamen Bonaire, Sint
      Eustatius en Saba wordt uitgebreid tot twaalf zeemijlen, met inachtneming van regels te stellen bij algemene
      maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0003749/2010-10-10#Artikel1
    machine_readable:
      open_terms:
        - id: regels_territoriale_zee
          type: object
          required: true
          delegated_to: Onze Minister
          delegation_type: ALGEMENE_MAATREGEL_VAN_RIJKSBESTUUR
          legal_basis: artikel 1 Rijkswet uitbreiding territoriale zee van het Koninkrijk
      execution:
        output:
          - name: uitgebreide_territoriale_zee
            type: object
            description: De uitgebreide territoriale zee van het Koninkrijk
          - name: afstand_zeemijlen
            type: number
            description: Afstand in zeemijlen
        actions:
          - output: afstand_zeemijlen
            value: 12
          - output: uitgebreide_territoriale_zee
            value:
              operation: OBJECT
              values:
                - name: locaties
                  value:
                    - Aruba
                    - Curaçao
                    - Sint Maarten
                    - Bonaire
                    - Sint Eustatius
                    - Saba
                - name: afstand
                  value: $afstand_zeemijlen
  - number: '2'
    text: |-
      1 Deze rijkswet treedt in werking op een door Ons te bepalen tijdstip.

      2 Deze rijkswet wordt aangehaald als: Rijkswet uitbreiding territoriale zee van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0003749/2010-10-10#Artikel2
    machine_readable:
      execution:
        parameters:
          - name: inwerkingtredingsdatum
            type: date
