        bwb_id: BWBR0028070
  - number: '20'
    text: |-
      Dit besluit treedt in werking op het krachtens [artikel 66 van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1]
      vastgestelde tijdstip.


