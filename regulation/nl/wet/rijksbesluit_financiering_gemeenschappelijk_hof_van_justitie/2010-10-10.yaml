preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 2 december 2009, nr. 5630762/09/6, gedaan mede namens de
    Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op artikel 55, eerste en tweede lid, van de Rijkswet Gemeenschappelijk Hof van Justitie;

    De Raad van State van het Koninkrijk gehoord (advies van 23 december 2009, nr. W03.09.0518/II/K);

    Gezien het nader rapport van Onze Minister van Justitie van 17 augustus 2010, nr. 5636986/10, uitgebracht mede
    namens de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *instroom:* instroom van te behandelen rechtszaken in een jaar onderverdeeld naar afzonderlijke zaakscategorieën;
        - *kostprijs:* de naar de zaakscluster gedifferentieerde kosten per product die worden gebruikt voor de
      vaststelling van instroomgerelateerde bijdrage van de landen aan het Hof;
        - *zaakscategorie:* een deel van de instroom dat door het Hof en de gerechten op gelijksoortige wijze wordt
      behandeld;
        - *zaakscluster:* een aantal op basis van de werklast samenhangende zaakscategorieën.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 Er is een systeem van meting van inkomende zaken naar zaakscluster. Dit systeem houdt in het meten van het aantal
      inkomende zaken per zaakscategorie en daarbinnen per afzonderlijk Gerecht in eerste aanleg.

      2 De meting gebeurt op het niveau van de afzonderlijke zaakscategorieën.

      3 Het Hof draagt zorg voor de indeling van de zaakscategorieën en de zaaksclusters.

      4 Het Hof beheert de aan de indeling in zaakscategorieën en zaaksclusters ten grondslag liggende definities en
      modellen.

      5 De indeling en de daaraan ten grondslag liggende definities en modellen van zaakscategorieën en -clusters,
      alsmede belangrijke wijzigingen daarin, behoeven de instemming van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel2
  - number: '3'
    text: |-
      1 Er is een systeem van kostprijsberekening voor het Hof. Dit systeem houdt in het toerekenen van directe en
      indirecte kosten aan aantallen inkomende zaken per zaakscluster voor het Hof en de Gerechten in eerste aanleg
      gezamenlijk en daaruit eenduidig afgeleid voor het Hof en elk Gerecht in eerste aanleg afzonderlijk.

      2 De meting gebeurt op het niveau van de zaakscluster.

      3 Het Hof beheert de aan de kostprijsmeting ten grondslag liggende definities en modellen

      4 De definities en modellen als bedoeld in het derde lid, en belangrijke wijzigingen daarin, behoeven de instemming
      van Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel3
  - number: '4'
    text: |-
      1 Er is een werklastmetingssysteem voor de rechtspraak. Dit systeem houdt in het meten van de werklast van het
      direct personeel bij het Hof en de Gerechten in eerste aanleg gemoeid met de behandeling van instromende zaken.

      2 De meting gebeurt op het niveau van de afzonderlijke zaakscategorieën.

      3 Het Hof beheert het werklastmetingssysteem.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel4
  - number: '5'
    text: |-
      De jaarlijks door de landen aan het Hof toe te kennen bijdrage ten behoeve van de activiteiten van het Hof, de
      Gerechten in eerste aanleg en de Beheerraad is gelijk aan het bedrag dat ten behoeve van het Hof is opgenomen voor
      het desbetreffende begrotingsjaar vastgestelde begroting van de respectievelijke Ministeries van Justitie.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel5
  - number: '6'
    text: |-
      De door de landen aan het Hof toe te kennen bijdrage bestaat uit de volgende onderdelen:

      a. een instroomgerelateerde bijdrage;

      b. een bijdrage voor de gerechtskosten;

      c. een bijdrage voor de kosten voor de Beheerraad;

      d. een bijdrage voor de kosten voor de huisvesting;

      e. een bijdrage voor de overige kosten.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 De instroomgerelateerde bijdrage wordt bepaald door de voor het desbetreffende jaar geldende kostprijzen
      te vermenigvuldigen met het gemiddelde van de twee begrotingsjaren voorafgaand aan het jaar vóór het bedoelde
      begrotingsjaar aantal ingestroomde zaken per zaakscluster eventueel verminderd of vermeerderd met een door
      de beheerraad op voorstel van het Hof vastgesteld aantal zaken per zaakscluster. Het aantal zaken wordt per
      zaakscluster opgenomen in de begroting van het Hof.

      2 Het aantal in de begroting van het Hof opgenomen zaken per zaakscluster is onderverdeeld naar de landen.

      3 Door de landen kan, nadat daarover door tussenkomst van de Beheerraad overleg is gevoerd door Onze Ministers,
      gemotiveerd worden afgeweken van het in de begroting van het Hof opgenomen aantal instromende en te financieren
      zaken.

      4 Onze Ministers informeren de raad van ministers van het Koninkrijk over de uitkomst van het overleg, bedoeld in
      het derde lid.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 De kostprijzen worden voor drie opeenvolgende jaren vastgesteld en opgenomen in de begroting van de
      respectievelijke Ministeries van Justitie.

      2 De prijzen zijn gebaseerd op:

      a. de in het verleden gerealiseerde prijs per zaakscluster;

      b. veranderingen in de verhouding van de zaakscategorieën binnen de onderscheiden zaaksclusters;

      c. de uitkomsten van de werklastmeting, bedoeld in [artikel 4][ref1].

      d. overwegingen van doelmatigheid;

      e. majeure beleids- en wetswijzigingen of noodzakelijke organisatorische aanpassingen.

      3 Jaarlijks worden de prijzen aangepast in verband met algemene salaris- en prijsontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028144#Artikel4
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028144
        artikel: '4'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Het Hof baseert in de meerjarenraming het aantal zaken per zaakscluster op de gemiddelde instroom per
      zaakscluster van de vier jaar aan het jaar waarop de begroting betrekking heeft voorafgaand.

      2 Bij de meerjarenraming kan rekening worden gehouden met gevolgen van economische ontwikkelingen of
      wetswijzigingen.

      3 Over de in het eerste lid genoemde raming kunnen nadere afspraken worden gemaakt tussen het Hof en de landen door
      tussenkomst van de Beheerraad.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel9
  - number: '10'
    text: |-
      1 De bijdrage voor gerechtskosten per land wordt bepaald door de gemiddelde gerechtskosten per zaakscluster te
      vermenigvuldigen met het aantal in de begroting van Onze Ministers opgenomen aantal zaken, onderverdeeld naar
      zaakscluster.

      2 Onder gerechtskosten per zaak wordt verstaan: de gerealiseerde kosten in zaaksclusters in het aan het
      begrotingsjaar voorafgaande jaar gedeeld door het aantal afgehandelde straf, civiele en bestuursrechtelijke zaken
      in dat jaar.

      3 Indien het in het eerste lid bedoelde bedrag niet toereikend is, stellen Onze Ministers aanvullende financiële
      middelen ter beschikking aan het Hof teneinde de met de gerechtskosten gemoeide uitgaven van de gerechten te
      bekostigen. Hierover worden door Onze Ministers met het Hof door tussenkomst van de Beheerraad, nadere afspraken
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 De bijdrage voor de kosten voor de Beheerraad is gelijk aan het bedrag dat hiervoor is opgenomen in de begroting
      van het desbetreffende land.

      2 De in het begrotingsvoorstel van het Hof opgenomen bedrag voor de kosten van de Beheerraad wordt gelijk over de
      landen verdeeld.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel11
  - number: '12'
    text: |-
      1 De bijdrage voor de kosten voor de huisvesting van het Hof en de gerechten is gelijk aan het bedrag dat hiervoor
      is opgenomen in de begroting van het desbetreffende land.

      2 Het in het begrotingsvoorstel van het Hof opgenomen bedrag voor de huisvesting van het Hof en de gerechten
      is onderverdeeld naar de landen. Hierover kunnen door het Hof en de landen nadere afspraken worden gemaakt door
      tussenkomst van de beheerraad.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 De bijdrage voor overige uitgaven is gelijk aan het bedrag dat hiervoor is opgenomen in de begroting van het
      desbetreffende land.

      2 Het Hof neemt in zijn begrotingsvoorstel een plan op met daarin een raming van de overige uitgaven voor het
      begrotingsjaar, een omschrijving van de activiteiten en de daarmee nagestreefde concrete doelstellingen. Het totale
      bedrag voor de overige uitgaven opgenomen in het begrotingsvoorstel van het Hof wordt in gelijke delen over de
      landen verdeeld, tenzij daarover andere afspraken worden gemaakt.

      3 In de raming worden incidentele en structurele kosten zichtbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel13
  - number: '14'
    text: |-
      1 Onze Ministers kunnen gezamenlijk voorschriften aan het Hof stellen met betrekking tot de jaarlijkse
      bijdragetoekenning, door tussenkomst van de beheerraad.

      2 De door Onze Ministers gezamenlijk aan de jaarlijkse bijdrage te verbinden voorschriften kunnen slechts
      betrekking hebben op:

      a. de door de Gerechten in eerste aanleg en het Hof gezamenlijk in behandeling te nemen en af te handelen
      zaaksaantallen per zaakscluster;

      b. te realiseren doelstellingen zoals opgenomen in het [artikel 13][ref1] bedoelde plan;

      c. het realiseren van afspraken op het terrein van arbeidsvoorwaarden;

      d. beheersmatige aspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0028144#Artikel13
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028144
        artikel: '13'
        hoofdstuk: '3'
  - number: '15'
    text: |-
      1 In de balans worden onder het eigen vermogen van het Hof slechts opgenomen:

      a. een exploitatiereserve, dat wil zeggen een reserve die wordt aangehouden om jaarlijkse fluctuaties in de
      exploitatie en risico’s in de bedrijfsvoering op te vangen;

      b. een verplichte reserve, dat wil zeggen een reserve die wordt aangehouden als gevolg van activering van
      immateriële vaste activa;

      c. het onverdeeld resultaat, zijnde het exploitatieresultaat over het jaar waarop de verslaglegging betrekking
      heeft.

      2 Het totaal van de exploitatiereserve en het onverdeeld resultaat van het Hof bedraagt ten hoogste 10% van de
      gemiddelde jaarlijkse baten van het Hof, berekend over de laatste drie jaar.

      3 Het eigen vermogen van het Hof is minimaal nul.

      4 Een positief exploitatieresultaat van het Hof komt tot de in het tweede lid bedoelde grens ten goede aan de
      exploitatiereserve van het Hof. Het meerdere keert het Hof uit aan Onze Ministers naar rato van de bijdrage van het
      desbetreffende land.

      5 Een negatief exploitatieresultaat van het Hof komt ten laste van de exploitatiereserve van het Hof. In het
      uitzonderlijke geval dat dit leidt tot een negatief vermogen wordt dit aangezuiverd door Onze Ministers naar rato
      van de bijdrage van het gemiddelde over de afgelopen vijf jaar van elk van de landen en vindt overleg plaats over
      de te nemen maatregelen als bedoeld in [artikel 17][ref1].

      6 Voor het tegen een financiële vergoeding verrichten van activiteiten die niet in een wettelijke regeling aan het
      Hof zijn opgedragen voor anderen dan Onze Ministers, behoeft het Hof instemming van Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0028144#Artikel17
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028144
        artikel: '17'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      1 Het Hof heeft een eigen vermogen bestaande uit een exploitatiereserve, een verplichte reserve en het onverdeeld
      resultaat.

      2 De exploitatiereserve van het Hof is bestemd om risico’s in de bedrijfsvoering van het Hof als geheel op te
      vangen.

      3 Onze Ministers kunnen met inachtneming van [artikel 15, tweede lid][ref1], om niet een toevoeging doen aan de
      exploitatiereserve van het Hof teneinde het eigen vermogen van het Hof te versterken.

      4 Het is het Hof niet toegestaan bijdragen in de vorm van een lening te aanvaarden van anderen dan Onze Minister
      van Financiën van Nederland. Bijdragen van anderen worden toegevoegd aan de exploitatiereserve van het Hof.


      [ref1]: https://wetten.overheid.nl/BWBR0028144#Artikel15
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028144
        artikel: '15'
        hoofdstuk: '3'
  - number: '17'
    text: |-
      Bij een dreigend exploitatieverlies dat leidt tot een negatief vermogen van het Hof, een exploitatiewinst
      die uitkomt boven de in [artikel 15, tweede lid][ref1], bedoelde grens dan wel een ingrijpende wijziging van
      omstandigheden met aantoonbare gevolgen voor de instroom, overleggen Onze Ministers, de Beheerraad en het Hof over
      de te nemen maatregelen en passen zonodig, onverminderd artikel 15, vierde lid, tweede volzin, de gefinancierde
      instroomaantallen van het Hof en de kostprijs aan.


      [ref1]: https://wetten.overheid.nl/BWBR0028144#Artikel15
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028144
        artikel: '15'
        hoofdstuk: '3'
  - number: '18'
    text: |-
      1 Het Hof verstrekt Onze Ministers en de Beheerraad de voor de uitoefening van hun taak met betrekking tot de
      financiering van het Hof benodigde informatie. Daartoe behoren in elk geval:

      a. gegevens over de instroomgerelateerde bijdrage, de gerechtskosten, de kosten voor de beheerraad, de kosten voor
      de huisvesting en de overige kosten;

      b. kostprijsgegevens, waaronder de uitkomsten van de werklastmeting;

      c. gegevens over de instroom van zaken, de afgehandelde zaken en de doorlooptijden;

      d. balansgegevens, waaronder gegevens over het eigen vermogen.

      2 De Beheerraad en het Hof maken in een informatieprotocol nadere afspraken over de ten behoeve van de financiering
      te verstrekken informatie. Daarin wordt in ieder geval vastgelegd de verplichting tot het uitwisselen van
      informatie met betrekking tot de uitstroom van zaken.
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Het met ingang van de inwerkingtreding van de [Rijkswet Gemeenschappelijk Hof van Justitie][ref1] door het Hof toe
      te passen begrotings- en verantwoordingsstelsel is het baten-lastenstelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0028070
    url: https://wetten.overheid.nl/BWBR0028144/2010-10-10#Artikel19
    references:
