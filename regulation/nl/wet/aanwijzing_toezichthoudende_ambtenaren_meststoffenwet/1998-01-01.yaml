preamble:
  text: |-
    Gelet op artikel 26, van het Meststoffenwet (Stb. 1986, 598) en het Besluit aanwijzing van Ministers betrokken bij
    aanwijzing toezichthoudende ambtenaren Meststoffenwet (Stb. 1986, 621);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004065/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De ambtenaren van de Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij aan te
      wijzen als ambtenaren, belast met het toezicht op de naleving van het bij of krachtens de [Meststoffenwet][ref1]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0004065/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '2'
    text: |-
      Deze regeling wordt geplaatst in de Nederlandse Staatscourant en treedt in werking met ingang van de dag waarop het
      [Registratiebesluit dierlijke meststoffen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004061
