        artikel: 9a
      - id: ref12
        bwb_id: BWBR0003391
        artikel: '6'
      - id: ref13
        bwb_id: BWBR0003391
        artikel: '10'
  - number: '24.2'
    text: |-
      Voor de toepassing van het vorige lid wordt met de daar bedoelde notariële verklaring gelijkgesteld de verklaring
      van een persoon bedoeld in [artikel 91 van de Overgangswet nieuw Burgerlijk Wetboek][ref1], die overeenkomstig het
      daar bepaalde een onderhandse akte tot levering heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002565#Artikel91
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002565
        artikel: '91'
  - number: '25.1'
    text: |-
      Voor zover na de overdracht aan de gemeente van een onroerende zaak of van een beperkt recht waaraan zo’n
      zaak is onderworpen ingevolge de [artikelen 10 tot en met 24][ref1] en [26][ref2] vanwege een besluit tot
      aanwijzing overeenkomstig [artikel 2][ref3] in samenhang met [artikel 3][ref4] of [4][ref5], zonder dat de in
      [artikel 3, eerste lid][ref6], of [4, eerste lid][ref7], bedoelde andere bestemming is verwezenlijkt, bij een
      onherroepelijk bestemmingsplan een bestemming is aangewezen waarmee de totstandkoming van de aanwijzing zou zijn
      uitgesloten, kan de verkoper vorderen dat de gemeente hem de schade zal vergoeden die hij als gevolg van die
      overdracht mocht hebben geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0003391#Artikel4
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel25
