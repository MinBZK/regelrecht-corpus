  - number: 9b.1
    text: |-
      Op het tijdstip van inwerkingtreding van een besluit als bedoeld in [artikel 9a, eerste of tweede lid][ref1],
      vervalt een eerder besluit tot aanwijzing of voorlopige aanwijzing van de betrokken grond van de gemeenteraad
      of van burgemeester en wethouders van rechtswege, met dien verstande dat indien aan burgemeester en wethouders
      reeds een opgave is gedaan als bedoeld in [artikel 11, eerste lid][ref2], die opgave in stand blijft en wordt
      aangemerkt als een opgave aan gedeputeerde staten onderscheidenlijk Onze Minister. Gedeputeerde staten nemen,
      onderscheidenlijk Onze Minister neemt bij de toepassing van de [artikelen 11 tot en met 21][ref3] de plaats in van
      burgemeester en wethouders, en de provincie onderscheidenlijk de Staat de plaats van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '11'
  - number: 9b.2
    text: |-
      Op het tijdstip van inwerkingtreding van een besluit als bedoeld in [artikel 9a, tweede lid][ref1], vervalt
      een eerder besluit tot aanwijzing of tot voorlopige aanwijzing van de betrokken grond van provinciale staten of
      gedeputeerde staten van rechtswege, met dien verstande dat indien aan gedeputeerde staten reeds een opgave is
      gedaan als bedoeld in [artikel 11, eerste lid][ref2], die opgave in stand blijft en wordt aangemerkt als een opgave
      aan Onze Minister. Onze Minister neemt bij de toepassing van de [artikelen 11 tot en met 21][ref3] de plaats in van
      gedeputeerde staten, en de Staat de plaats van de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9b
