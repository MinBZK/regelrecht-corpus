  - number: 9a.2
    text: |-
      Indien Onze Minister het voornemen heeft toepassing te geven aan [artikel 3.28, eerste en vierde lid][ref1],
      of [3.29 van de Wet ruimtelijke ordening][ref2] kan deze, op gelijke wijze als de gemeenteraad, overeenkomstig
      [artikel 2][ref3] in samenhang met [artikel 3][ref4], [4][ref5] of [5][ref6] gronden aanwijzen, met dien
      verstande dat voor een aanwijzing in samenhang met [artikel 3][ref7] in plaats van «bestemmingsplan» wordt gelezen:
      «inpassingsplan» en dat voor een aanwijzing in samenhang met [artikel 4][ref8] uitsluitend een structuurvisie
      als bedoeld in [artikel 2.3 van de Wet ruimtelijke ordening][ref9] in aanmerking komt. Bij een aanwijzing
      overeenkomstig de [artikelen 4][ref10] en [5][ref11] geeft Onze Minister aan op welke wijze invulling gegeven zal
      worden aan een inpassingsplan of projectbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
