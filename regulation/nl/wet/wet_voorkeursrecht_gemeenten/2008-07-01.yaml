        artikel: 9a
      - id: ref2
        bwb_id: BWBR0003391
        artikel: 9a
  - number: 9c
    text: |-
      Gronden die zijn aangewezen ingevolge [artikel 2][ref1] in samenhang met [artikel 3][ref2], [4][ref3]
      of [5][ref4], [artikel 6][ref5] of [artikel 9a, eerste of tweede lid][ref6], kunnen niet binnen twee jaar na het
      intrekken of het van rechtswege vervallen van zodanige aanwijzing opnieuw ingevolge een zodanig besluit worden
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel3
