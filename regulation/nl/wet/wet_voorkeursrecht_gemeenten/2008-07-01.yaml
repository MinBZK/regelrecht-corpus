  - number: 1.f
    text: |-
      verkoper: eigenaar van een onroerende zaak of rechthebbende op een beperkt recht als bedoeld in onderdeel g die tot
      vervreemding wenst over te gaan, alsmede degene die bij ontbinding van een gemeenschap met de vereffening is belast
      en tot vervreemding wenst over te gaan;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel1
  - number: 1.g
    text: |-
      vervreemding: overdracht in eigendom of verdeling van een onroerende zaak alsmede overdracht of verdeling dan
      wel vestiging van een recht van opstal, erfpacht, beklemming of vruchtgebruik, waaraan een onroerende zaak is
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel1
  - number: '2'
    text: |-
      De gemeenteraad kan gronden aanwijzen waarop de [artikelen 10 tot en met 24][ref1], [26][ref2] en [27][ref3] van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel27
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '27'
  - number: '3.1'
    text: |-
      Voor aanwijzing komen in aanmerking gronden waaraan bij het bestemmingsplan, projectbesluit of inpassingsplan een
      niet-agrarische bestemming is toegekend en waarvan het gebruik afwijkt van dat plan of besluit.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: '3.2'
    text: 'Een besluit tot aanwijzing vermeldt ten aanzien van de onroerende zaken waarop het betrekking heeft:'
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: 3.2.a
    text: de kadastrale aanduiding;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: 3.2.b
    text: de grootte van elk van de desbetreffende percelen volgens de kadastrale registratie;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: 3.2.c
    text: |-
      de grootte van een perceelsgedeelte, indien de aanwijzing betrekking heeft op een gedeelte van een onroerende zaak,
      en
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: 3.2.d
    text: |-
      de namen van de eigenaren van de desbetreffende onroerende zaken en van de rechthebbenden op de beperkte rechten
      waaraan die zaken zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: '3.3'
    text: |-
      Bij het besluit behoort een kadastraal overzicht waarop duidelijk zijn aangegeven de gronden waarop de aanwijzing
      betrekking heeft en de bijbehorende percelen of perceelsgedeelten.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], komen voor aanwijzing voorts in aanmerking:


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
  - number: 4.1.a
    text: |-
      gronden die zijn begrepen in een structuurvisie, waarbij aanwijzingen zijn gegeven voor de bestemming en
      waaraan bij de structuurvisie een niet-agrarische bestemming is toegedacht en waarvan het gebruik afwijkt van de
      toegedachte bestemming;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel4
  - number: 4.1.b
    text: |-
      gronden die bij een structuurvisie zijn aangewezen tot moderniseringsgebied als bedoeld in
      [artikel 3.5 van de Wet ruimtelijke ordening][ref1], ongeacht of het gebruik van de gronden in die gebieden al dan
      niet afwijkt van die visie.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '4.2'
    text: |-
      [Artikel 3, tweede en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
  - number: '5.1'
    text: |-
      In afwijking van de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], komen voor aanwijzing ook in
      aanmerking gronden die nog niet zijn opgenomen in een bestemmingsplan, projectbesluit of structuurvisie, maar
      waarbij in het besluit tot aanwijzing aan de betrokken gronden een niet-agrarische bestemming wordt toegedacht en
      waarvan het gebruik afwijkt van die bestemming. In het besluit tot aanwijzing wordt aangegeven of nadien nog zal
      worden overgegaan tot het vaststellen van een structuurvisie.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel4
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '4'
  - number: '5.2'
    text: |-
      [Artikel 3, tweede en derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
  - number: '6.1'
    text: |-
      Burgemeester en wethouders kunnen gronden voorlopig aanwijzen, mits bij het hiertoe strekkend besluit aan die
      gronden een niet-agrarische bestemming is toegedacht en het gebruik afwijkt van de toegedachte bestemming. Het
      besluit vervalt van rechtswege drie maanden na dagtekening of zoveel eerder als een besluit van de gemeenteraad tot
      aanwijzing ingevolge [artikel 3][ref1], [4][ref2] of [5][ref3] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel5
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '5'
  - number: '6.2'
    text: |-
      De [artikelen 3, tweede en derde lid][ref1], [10 tot en met 24][ref2], [26][ref3] en [27][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel27
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0003391
        artikel: '27'
  - number: '6.3'
    text: |-
      Indien bezwaar of beroep aanhangig is tegen een besluit tot voorlopige aanwijzing en dit besluit vervalt omdat
      een besluit van de gemeenteraad tot aanwijzing in werking is getreden, wordt het bezwaar of beroep geacht te zijn
      gericht tegen het besluit van de gemeenteraad.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel6
  - number: '7.1'
    text: |-
      Het besluit tot aanwijzing of voorlopige aanwijzing ligt voor eenieder ter inzage op een door burgemeester en
      wethouders aangewezen plaats. Zij maken de terinzagelegging bekend in de Staatscourant, in één of meer dag- of
      nieuwsbladen die in de gemeente verspreid worden en voorts op de gebruikelijke wijze. Het besluit treedt in werking
      de dag na dagtekening van de Staatscourant waarin de terinzagelegging bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel7
  - number: '7.2'
    text: |-
      Burgemeester en wethouders zenden een mededeling van de aanwijzing aan ieder van de in het besluit vermelde
      eigenaren en beperkt gerechtigden. De mededeling bevat een zakelijke beschrijving van de betekenis van de
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel7
  - number: '8.1'
    text: |-
      Indien een aanwijzing niet meer voldoet aan de eisen, gesteld in [artikel 3, eerste lid][ref1],
      [4, eerste lid][ref2], onderscheidenlijk [5, eerste lid][ref3], besluiten burgemeester en wethouders tot het
      intrekken van die aanwijzing. In het besluit worden vermeld de percelen of perceelsgedeelten waarop de intrekking
      betrekking heeft. Het besluit tot intrekking wordt gevoegd bij de ingevolge [artikel 7, eerste lid][ref4], ter
      inzage gelegde stukken en in kopie gezonden naar de desbetreffende eigenaren en beperkt gerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel7
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003391
        artikel: '7'
  - number: '8.2'
    text: |-
      Degene die een recht heeft op aangewezen gronden uit hoofde van eigendom of een beperkt recht als bedoeld in
      [artikel 1, onderdeel g][ref1], kan bij burgemeester en wethouders een aanvraag indienen tot intrekking van het
      besluit tot aanwijzing. Zij nemen een besluit uiterlijk vier weken na de dag van ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel1
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '1'
  - number: '9.1'
    text: |-
      Indien een bestemmingsplan is vastgesteld vervalt een besluit tot aanwijzing van rechtswege tien jaar na
      inwerkingtreding van het bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
  - number: '9.2'
    text: |-
      Indien een projectbesluit is vastgesteld vervalt een besluit tot aanwijzing van
      rechtswege indien het bestemmingsplan na het verstrijken van de termijn, genoemd in
      [artikel 3.13, eerste lid, van de Wet ruimtelijke ordening][ref1], dan wel in voorkomend geval de termijn, bedoeld
      in [artikel 3.13, tweede lid, van die wet][ref2] niet tijdig is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '9.3'
    text: |-
      Indien een structuurvisie is vastgesteld vervalt een besluit tot aanwijzing van rechtswege drie jaar na
      vaststelling van die visie, tenzij voor dat tijdstip een bestemmingsplan of projectbesluit is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
  - number: '9.4'
    text: |-
      Indien een inpassingsplan is vastgesteld vervalt een besluit tot aanwijzing van rechtswege tien jaar na
      inwerkingtreding van het inpassingsplan.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
  - number: '9.5'
    text: |-
      Een besluit tot aanwijzing als bedoeld in [artikel 5][ref1] vervalt van rechtswege drie jaar na dagtekening, tenzij
      voor dat tijdstip een structuurvisie, bestemmingsplan of projectbesluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel5
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '5'
  - number: '9.6'
    text: |-
      Een mededeling van het van rechtswege vervallen van een besluit tot aanwijzing wordt gevoegd bij de ingevolge
      [artikel 7, eerste lid][ref1], ter inzage gelegde stukken en in kopie gezonden naar de desbetreffende eigenaren en
      beperkt gerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel7
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '7'
  - number: 9a.1
    text: |-
      Indien provinciale staten het voornemen hebben toepassing te geven aan [artikel 3.26, eerste en vierde lid][ref1],
      of [3.27 van de Wet ruimtelijke ordening][ref2] kunnen zij, op gelijke wijze als de gemeenteraad, overeenkomstig
      [artikel 2][ref3] in samenhang met [artikel 3][ref4], [4][ref5] of [5][ref6], gronden aanwijzen, met dien
      verstande dat voor een aanwijzing in samenhang met [artikel 3][ref7] in plaats van «bestemmingsplan» wordt gelezen:
      «inpassingsplan» en dat voor een aanwijzing in samenhang met [artikel 4][ref8] uitsluitend een structuurvisie als
      bedoeld in [artikel 2.2 van de Wet ruimtelijke ordening][ref9] in aanmerking komt. In een besluit tot aanwijzing
      overeenkomstig [artikel 4][ref10] of [5][ref11] geven provinciale staten aan op welke wijze invulling gegeven zal
      worden aan een inpassingsplan of projectbesluit. Gedeputeerde staten kunnen op gelijke wijze als burgemeester en
      wethouders overeenkomstig [artikel 6][ref12] gronden voorlopig aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref9]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref10]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref11]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref12]: https://wetten.overheid.nl/BWBR0003391#Artikel6
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
