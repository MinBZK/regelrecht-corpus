      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel6
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9b
    references:
