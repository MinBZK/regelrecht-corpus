  - number: '10.1'
    text: |-
      Een verkoper kan eerst tot vervreemding overgaan nadat de gemeente in de gelegenheid is gesteld het desbetreffende
      goed te kopen.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: '10.2'
    text: Het bepaalde in het vorige lid geldt niet ingeval de vervreemding geschiedt ingevolge
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.a
    text: |-
      een overeenkomst tussen bloed- of aanverwanten in de rechte lijn of in de zijlijn tot in de tweede graad of met een
      pleegkind. Onder pleegkind wordt verstaan degene, die duurzaam als een eigen kind is onderhouden en opgevoed;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.b
    text: verdeling van een huwelijksgemeenschap of een nalatenschap;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.c
    text: een uiterste wilsbeschikking;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.d
    text: |-
      een overeenkomst met de Staat, een provincie, een waterschap of een door Ons aan te wijzen publiekrechtelijk
      lichaam of in het openbaar belang werkzame rechtspersoon. Onze aanwijzing wordt in de *Staatscourant*
      bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.e
    text: een verkoop krachtens wetsbepaling of bevel des rechters of een openbare executoriale verkoop;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.2.f
    text: |-
      een overeenkomst, gesloten met een pachter ingevolge het bepaalde in
      [afdeling 11 van titel 5 van Boek 7 van het Burgerlijk Wetboek][ref1] en betrekking hebbende op een
      onroerende zaak die is aangewezen bij een besluit als bedoeld in [artikel 5][ref2] of [6][ref3] dan wel
      [artikel 9a, eerste of tweede lid][ref4], in samenhang met [artikel 5][ref5] of [6][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel6
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0003391
        artikel: 9a
      - id: ref5
        bwb_id: BWBR0003391
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0003391
        artikel: '6'
  - number: '10.3'
    text: |-
      Voorts geldt het bepaalde in het eerste lid niet ingeval de vervreemding geschiedt ingevolge een overeenkomst
      betreffende een onroerende zaak, dan wel een overeenkomst behelzende een verplichting van de verkoper betreffende
      een onroerende zaak, voorzover:
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.3.a
    text: |-
      vervreemding geschiedt aan een in die overeenkomst met name genoemde partij, en een tegen een in die overeenkomst
      met name genoemde prijs, dan wel tegen een volgens die overeenkomst bepaalbare prijs, en
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: 10.3.b
    text: |-
      de overeenkomst is ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1], vóór de dag na de dagtekening van de
      Staatscourant waarin de nederlegging ter inzage van het besluit tot aanwijzing of voorlopige aanwijzing is
      bekendgemaakt, en


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: 10.3.c
    text: |-
      de vervreemding geschiedt binnen zes maanden na de dag van de inschrijving van de overeenkomst in de openbare
      registers als bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: '10.4'
    text: |-
      Een overeenkomst als bedoeld in het derde lid, aanhef, kan worden ingeschreven in de openbare registers, bedoeld in
      het derde lid, mits deze is vervat in een akte. De inschrijving heeft het rechtsgevolg dat voor de verkoper niet de
      verplichting zoals bedoeld in het eerste lid ontstaat, voorzover is voldaan aan de in het derde lid, onder a, b en
      c, genoemde vereisten.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: '10.5'
    text: |-
      Het derde lid is telkens gedurende een periode van drie jaar op een overeenkomst als bedoeld in dat lid met
      betrekking tot een bepaalde onroerende zaak of een gedeelte daarvan, en de daarin met name genoemde verkoper of
      koper, slechts één maal van toepassing. De periode van drie jaar vangt aan op de datum van eerste inschrijving in
      de openbare registers. Onder koper wordt in dit geval verstaan de partij waarmee een overeenkomst is gesloten.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel10
  - number: '11.1'
    text: |-
      Ter voldoening aan het bepaalde in [artikel 10, eerste lid][ref1], verstrekt de verkoper een schriftelijke opgave
      aan burgemeester en wethouders van het goed, dat onderwerp uitmaakt van de voorgenomen vervreemding, zomede
      ten aanzien van de desbetreffende onroerende zaken, de kadastrale aanduiding daarvan, de grootte van elk der
      desbetreffende percelen volgens de basisregistratie kadaster en, indien een onroerende zaak waarop de voorgenomen
      vervreemding betrekking heeft, een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '10'
  - number: '11.2'
    text: |-
      Indien de voorgenomen vervreemding betrekking heeft op onroerende zaken die slechts ten dele in de aanwijzing of
      voorlopige aanwijzing, bedoeld in [artikel 2][ref1] in samenhang met [artikel 3][ref2], [4][ref3] of [5][ref4], of
      [artikel 6][ref5] dan wel bedoeld in [artikel 9a, eerste of tweede lid][ref6], in samenhang met [artikel 3][ref7],
      [4][ref8] of [5][ref9], of [artikel 6][ref10] zijn opgenomen maar een samenhangend geheel vormen, kan de
      verkoper, onverminderd het bepaalde in [afdeling 11 van titel 5 van Boek 7 van het Burgerlijk Wetboek][ref11],
      eisen dat dit geheel van onroerende zaken wordt betrokken in de mogelijke aankoop door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel5
