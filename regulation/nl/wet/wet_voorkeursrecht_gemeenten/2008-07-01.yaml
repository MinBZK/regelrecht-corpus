      - id: ref11
        bwb_id: BWBR0005290
        afdeling: '11'
  - number: '11.3'
    text: |-
      De verkoper kan eisen, dat in de verkoop wordt betrokken het bedrijf of de onderneming waarin de onroerende zaken
      als onderdeel daarvan worden geëxploiteerd.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel11
  - number: '11.4'
    text: Burgemeester en wethouders bevestigen ten spoedigste schriftelijk de ontvangst van de opgave.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel11
  - number: '12.1'
    text: |-
      Binnen acht weken nà de ontvangst van de in [artikel 11, eerste lid][ref1], bedoelde opgave maken burgemeester en
      wethouders bekend of de gemeente het daarin vermelde goed in beginsel wenst aan te kopen tegen een nader overeen te
      komen prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '12.2'
    text: |-
      Indien burgemeester en wethouders binnen de in het vorige lid genoemde termijn hebben bekendgemaakt, dat de
      gemeente het in zijn opgave vermelde goed niet wenst aan te kopen, heeft de verkoper gedurende de periode van
      drie jaren na die bekendmaking de vrijheid tot vervreemding aan derden voorzover betreft het in zijn opgave
      vermelde goed, in dier voege dat die vervreemding moet betreffen alle in zijn opgave vermelde goederen te zamen,
      met inbegrip van het gedeelte en van het bedrijf of de onderneming, waarvan de verkoper bij het verstrekken van
      die opgave ingevolge [artikel 11, tweede en derde lid][ref1], heeft geëist, dat het mede in de verkoop zou worden
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '12.3'
    text: |-
      Bij overschrijding door burgemeester en wethouders van de in het eerste lid genoemde termijn is het bepaalde in
      het vorige lid van overeenkomstige toepassing, met dien verstande, dat de aldaar genoemde periode van drie jaren
      aanvangt na verloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel12
  - number: '13'
    text: |-
      Bij de bekendmaking van een besluit van burgemeester en wethouders, genomen ingevolge
      [artikel 12, eerste lid][ref1], en strekkende tot aankoop in beginsel door de gemeente tegen een nader overeen te
      komen prijs, wordt de inhoud van [artikel 14][ref2] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel14
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '14'
  - number: '14'
    text: |-
      De verkoper kan binnen vier weken na ontvangst van de in [artikel 13][ref1] bedoelde mededeling Gedeputeerde
      Staten verzoeken te worden ontheven van de verplichting, met de gemeente te onderhandelen over de verkoop, in dier
      voege, dat hij voorzover betreft het daarbij betrokken goed de vrijheid zal hebben tot vervreemding aan derden. Het
      verzoekschrift bevat de gronden waarop het verzoek berust. Bij het verzoekschrift wordt de in [artikel 13][ref2]
      bedoelde mededeling in afschrift overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '15.1'
    text: |-
      Gedeputeerde Staten beslissen op een verzoek tot ontheffing als bedoeld in [artikel 14][ref1], behoudens het
      bepaalde in de tweede zin van het tweede lid, binnen zes weken na ontvangst van het verzoek van de verkoper.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel14
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '14'
  - number: '15.2'
    text: |-
      Alvorens te beslissen op een verzoek tot ontheffing, als bedoeld in [artikel 14][ref1], stellen Gedeputeerde
      Staten burgemeester en wethouders en de verkoper in de gelegenheid de belangen der gemeente, onderscheidenlijk zijn
      belangen, toe te lichten. Zij kunnen te dien einde hun beschikking eenmaal voor drie weken verdagen. Zij willigen
      het verzoek tot ontheffing uitsluitend in op grond van gewichtige redenen en voor de duur van ten hoogste drie
      jaren. Zij kunnen daarbij beperkingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel14
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '14'
  - number: '16.1'
    text: |-
      Indien burgemeester en wethouders en de verkoper, nadat gehandeld is overeenkomstig het bepaalde in de
      [artikelen 12][ref1]-[15][ref2], in onderhandeling zijn getreden over de verkoop, kan de verkoper aan burgemeester
      en wethouders de wens te kennen geven, dat over de prijs advies zal worden uitgebracht door deskundigen, te
      benoemen door de rechter. Binnen twee weken na de ontvangst van het desbetreffende schriftelijke verzoek van de
      verkoper, verzoeken burgemeester en wethouders de rechtbank van het arrondissement waarin de gemeente is gelegen,
      een of meer deskundigen te benoemen, ten einde het bedoelde advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel15
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '15'
  - number: '16.2'
    text: |-
      Bij overschrijding door burgemeester en wethouders van de in het vorige lid genoemde termijn is
      [artikel 12, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
  - number: '16.3'
    text: |-
      Bij hun verzoekschrift leggen burgemeester en wethouders over een gewaarmerkt afschrift van het verzoek van de
      verkoper.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel16
  - number: '16.4'
    text: |-
      De rechtbank benoemt een of meer deskundigen, die zo spoedig mogelijk met redenen omkleed schriftelijk advies
      uitbrengen. De deskundigen stellen hun advies vast met overeenkomstige toepassing van de artikelen 40*b*-40*f* van
      de [onteigeningswet][ref1]. Zij leggen het advies neer ter griffie van de rechtbank en zenden daarvan een exemplaar
      aan ieder van beide partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001842
  - number: '16.5'
    text: De kosten van het verzoek en het advies van deskundigen komen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel16
  - number: '17.1'
    text: |-
      Binnen vier weken na dagtekening van het in [artikel 16][ref1] bedoelde advies kunnen burgemeester en wethouders
      met redenen omkleed de rechtbank verzoeken, een oordeel over de prijs te geven, of aan de verkoper berichten, dat
      zij zich met het advies kunnen verenigen dan wel dat de gemeente van de aankoop afziet.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel16
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '16'
  - number: '17.2'
    text: |-
      Ingeval burgemeester en wethouders binnen de in het eerste lid gestelde termijn aan de verkoper hebben bericht, dat
      zij zich met het advies kunnen verenigen, zijn zij, behoudens het bepaalde in het volgende lid, tot uiterlijk drie
      maanden na dagtekening van dat bericht tegenover de verkoper daaraan gebonden. Tot het einde van die termijn kan
      de verkoper de rechtbank met redenen omkleed verzoeken, een oordeel over de prijs te geven of aan burgemeester en
      wethouders berichten, dat hij zich met het advies kan verenigen, dan wel dat hij van de verkoop afziet. Na afloop
      van die termijn kan hij zich niet meer tegenover burgemeester en wethouders beroepen op hun in de eerste zin van
      dit lid bedoelde bericht, noch op hun besluit, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '17.3'
    text: |-
      Ingeval de verkoper binnen de in het vorige lid gestelde termijn van drie maanden het aldaar bedoelde verzoek
      aan de rechtbank heeft gedaan, kunnen burgemeester en wethouders hem binnen twee weken na dagtekening van dat
      verzoek berichten dat de gemeente alsnog van de aankoop afziet. Bij gebreke van zodanig bericht geldt na afloop van
      laatstgenoemde termijn [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel21
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '21'
  - number: '17.4'
    text: |-
      Ingeval burgemeester en wethouders binnen de in het eerste lid genoemde termijn van vier weken of binnen de in het
      derde lid gestelde termijn van twee weken aan de verkoper hebben bericht, dat de gemeente van de aankoop afziet of
      alsnog afziet, is [artikel 12, tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
  - number: '17.5'
    text: |-
      Bij overschrijding door burgemeester en wethouders van de in het eerste lid gestelde termijn is
      [artikel 12, derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
  - number: '17.6'
    text: |-
      Het bepaalde in het tweede tot en met vijfde lid blijft buiten toepassing indien de verkoper toepassing geeft aan
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel27
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '27'
  - number: '18.1'
    text: |-
      Indien een verzoek als bedoeld in [artikel 17][ref1] aan de rechtbank wordt gedaan, benoemt deze een van haar
      leden als commissaris om, te zamen met de ingevolge [artikel 16][ref2] benoemde deskundigen en vergezeld van een
      griffier, een onderzoek in te stellen en te dien einde de ligging en gesteldheid van de desbetreffende onroerende
      zaak op te nemen. De tijd en plaats van de opneming worden door de rechter-commissaris zo spoedig mogelijk bepaald
      en door de griffier meegedeeld aan de deskundigen zomede aan de partijen, die bij de opneming aanwezig kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel16
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '16'
  - number: '18.2'
    text: |-
      Van de opneming maakt de griffier een door de rechter-commissaris en door hemzelf te ondertekenen proces-verbaal
      op. De rechter-commissaris draagt aan de deskundigen op een nader advies over de verkoopprijs uit te brengen
      en stelt de dag vast, waarop dit advies ter griffie van de rechtbank zal worden neergelegd. Deze dag zal niet
      later worden bepaald dan uiterlijk drie maanden na de dag van opneming. In het proces-verbaal wordt de dag van de
      nederlegging vermeld.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel18
  - number: '19'
    text: |-
      In de eerste voor de behandeling van burgerlijke zaken bestemde terechtzitting, welke plaats heeft na verloop van
      vier weken na de in [artikel 18, tweede lid][ref1], bedoelde nederlegging, kunnen beide partijen hun belangen bij
      pleidooi bepleiten. De griffier roept partijen zomede de deskundigen op om ter terechtzitting aanwezig te zijn.
      Uiterlijk vier weken na de terechtzitting doet de rechtbank bij beschikking uitspraak over de verkoopprijs. Het
      bepaalde in de tweede tot en met vierde zin van [artikel 16, vierde lid][ref2], is van overeenkomstige toepassing.
      Van de beschikking staat geen hoger beroep noch beroep in cassatie open.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel16
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '16'
  - number: '20.1'
    text: |-
      De kosten van de in de [artikelen 18][ref1] en [19][ref2] omschreven procedure, de kosten van het in
      [artikel 18][ref3] bedoelde advies van de deskundigen, de kosten van de deskundigen, verbonden aan het bijwonen van
      de in [artikel 19][ref4] bedoelde terechtzitting alsmede de redelijkerwijze door de verkoper voor rechtsbijstand
      en andere deskundige bijstand gemaakte kosten komen ten laste van de gemeente, met dien verstande echter, dat de
      rechtbank indien zij daartoe termen vindt in de omstandigheden van het geval, bevoegd is de kosten geheel of voor
      een deel te compenseren.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel19
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003391
        artikel: '19'
  - number: '20.2'
    text: |-
      De beschikking van de rechtbank is, voorzover betreft de daarin opgenomen kostenveroordeling, vatbaar voor
      tenuitvoerlegging.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel20
  - number: '21'
    text: |-
      Gedurende drie maanden na dagtekening van de beschikking van de rechtbank is de gemeente, indien de verkoper zulks
      verlangt, verplicht haar medewerking te verlenen aan de totstandkoming van een akte tot levering aan haar van het
      betrokken goed tegen betaling aan de verkoper van de door de rechtbank bij haar beschikking bepaalde prijs.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel21
  - number: '24.1'
    text: |-
      De inschrijving in de in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare
      registers van een akte, behelzende een vervreemding anders dan aan de gemeente, vindt alleen plaats indien onder
      de akte is opgenomen een notariële verklaring, houdende, hetzij dat de betrokken onroerende zaak niet is opgenomen
      in een aanwijzing als bedoeld in [artikel 2][ref2] in samenhang met [artikel 3][ref3], [4][ref4] of [5][ref5]
      of [artikel 9a, eerste of tweede lid][ref6], in samenhang met [artikel 3][ref7], [4][ref8] of [5][ref9] dan
      wel voorlopige aanwijzing als bedoeld in [artikel 6][ref10] of in [artikel 9a, eerste of tweede lid][ref11],
      in samenhang met [artikel 6][ref12], hetzij dat de vervreemding niet in strijd is met het bepaalde in de
      [artikelen 10 tot en met 23][ref13] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref7]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref8]: https://wetten.overheid.nl/BWBR0003391#Artikel4
      [ref9]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref10]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref11]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref12]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref13]: https://wetten.overheid.nl/BWBR0003391#Artikel10
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
