  - number: 9a.4
    text: |-
      Bij toepassing van het eerste of tweede lid verstrekken gedeputeerde staten, onderscheidenlijk Onze Minister
      onverwijld een exemplaar van het besluit tot aanwijzing of voorlopige aanwijzing en de bijbehorende kadastrale
      kaart aan de Dienst voor het kadaster en de openbare registers, ter inschrijving van die stukken in de openbare
      registers en doen mededeling van de aanwijzing of voorlopige aanwijzing aan burgemeester en wethouders van de
      gemeente en gedeputeerde staten van de provincie waarin de gronden waarop de aanwijzing betrekking heeft zijn
      gelegen. [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1] is niet van toepassing. Evenzo
      doen gedeputeerde staten, onderscheidenlijk Onze Minister mededeling van het intrekken of van het van rechtswege
      vervallen van een besluit tot aanwijzing aan:


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '24'
  - number: 9a.4.a
    text: de Dienst voor het kadaster en de openbare registers;
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
  - number: 9a.4.b
    text: de desbetreffende eigenaren en beperkt gerechtigden, en
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
  - number: 9a.4.c
    text: burgemeester en wethouders van de gemeente waarin de gronden waarop de aanwijzing betrekking had, zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
  - number: 9a.5
    text: |-
      Bij toepassing van het eerste lid worden de in de [artikelen 10][ref1], [11][ref2], [12][ref3] en
      [16 tot en met 24][ref4], [26][ref5] en [27][ref6] geregelde bevoegdheden en verplichtingen met uitsluiting van de
      bevoegdheid ter zake van burgemeester en wethouders, uitgeoefend door gedeputeerde staten en neemt de provincie de
      plaats in van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel12
