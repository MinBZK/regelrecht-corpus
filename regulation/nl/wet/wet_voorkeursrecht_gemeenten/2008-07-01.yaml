  - number: '25.3'
    text: |-
      Indien toepassing is gegeven aan [artikel 9a, eerste of tweede lid][ref1], treedt voor de toepassing van het eerste
      of tweede lid de provincie onderscheidenlijk de Staat in de plaats van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: 9a
  - number: '26.1'
    text: |-
      Een gemeente kan de nietigheid inroepen van rechtshandelingen die zijn verricht met de kennelijke strekking afbreuk
      te doen aan haar in deze wet geregelde voorkeurspositie.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel26
  - number: '26.2'
    text: |-
      Het verzoek moet worden gedaan binnen acht weken nadat de gemeente een afschrift heeft ontvangen van de akte
      waarin de desbetreffende rechtshandeling is vervat bij de rechtbank van het arrondissement waarbinnen de gemeente
      is gelegen. De gemeente is niet ontvankelijk in haar verzoek indien zij met de desbetreffende rechtshandeling
      schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel26
  - number: '27.1'
    text: |-
      In het in het tweede lid van dit artikel bedoelde geval kan de verkoper de in [artikel 16, eerste lid][ref1],
      bedoelde rechtbank verzoeken te bepalen, dat de gemeente gehouden is medewerking te verlenen aan de overdracht
      aan haar tegen een door de rechtbank vast te stellen prijs van het goed, dat is vervat in de opgave, bedoeld in
      [artikel 11][ref2], eventueel met inbegrip van de ingevolge het tweede en derde lid van dat artikel mede in die
      opgave vermelde bestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '27.2'
    text: |-
      Het verzoekschrift, dat met redenen moet zijn omkleed, kan worden gedaan binnen twee maanden te rekenen van de
      dag waarop burgemeester en wethouders de in [artikel 16, tweede lid][ref1] bedoelde termijn hebben overschreden
      of de dag van de ontvangst van een bericht ingevolge [artikel 17, eerste lid][ref2], inhoudende dat de gemeente
      afziet van de aankoop, of de dag waarop burgemeester en wethouders de in dat artikellid genoemde termijn hebben
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel17
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '17'
  - number: '27.3'
    text: |-
      De rechtbank doet binnen zes maanden na de ontvangst van het verzoekschrift bij beschikking uitspraak over het
      verzoek en bij toewijzing daarvan, tevens over de prijs. Zij beoordeelt of het redelijk is dat een verkoop aan
      de gemeente, gezien de bijzondere persoonlijke omstandigheden die terzake van belang kunnen zijn, achterwege zou
      blijven. Van de beschikking staat geen hoger beroep noch beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
  - number: '27.4'
    text: |-
      Bij toewijzing van het verzoek zijn de [artikelen 18][ref1]-[20][ref2] van toepassing. [Artikel 21][ref3] blijft
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel21
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '21'
  - number: '27.5'
    text: |-
      De gehoudenheid van de gemeente tot medewerking aan de in het eerste lid bedoelde overdracht ingevolge een daartoe
      strekkende beschikking van de rechtbank vervalt indien de verkoper niet binnen een tijdvak van drie maanden, te
      rekenen van de dagtekening van die beschikking, zijn recht op die medewerking heeft geldend gemaakt in rechte, of
      buiten rechte door de gemeente bij exploit tot die medewerking uit te nodigen.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
  - number: '27.6'
    text: |-
      Bij afwijzing van het verzoek heeft de verkoper gedurende een periode van drie jaren, te rekenen van de dagtekening
      van de rechterlijke beschikking, de vrijheid tot vervreemding aan derden voorzover betreft het in zijn opgave,
      bedoeld in [artikel 11][ref1], vermelde goed, met dien verstande dat die vervreemding moet betreffen alle in die
      opgave vermelde goederen te zamen, met inbegrip van het gedeelte en van het bedrijf of de onderneming, waarvan de
      verkoper bij het verstrekken van die opgave ingevolge het [tweede en derde lid van artikel 11][ref2] heeft geëist
      dat het mede in de verkoop zou worden betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '28'
    text: Wij geven bij algemene maatregel van bestuur nadere voorschriften voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel28
  - number: '30'
    text: Deze wet kan worden aangehaald als "Wet voorkeursrecht gemeenten".
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel30
