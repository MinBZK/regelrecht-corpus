  - number: '25.2'
    text: |-
      Gelijke bevoegdheid heeft de verkoper na de overdracht ingevolge de [artikelen 10 tot en met 24][ref1] en
      [26][ref2] vanwege een besluit tot aanwijzing overeenkomstig [artikel 2][ref3] in samenhang met [5][ref4], of
      een besluit tot voorlopige aanwijzing overeenkomstig [artikel 6][ref5], voor zover de bij die overdracht betrokken
      onroerende zaak niet binnen de desbetreffende termijn, genoemd in [artikel 6][ref6] of [9][ref7] is opgenomen
      in een besluit als bedoeld in [artikel 5][ref8], onderscheidenlijk in een bestemmingsplan, projectbesluit of
      structuurvisie, waarbij de bij de aanwijzing of voorlopige aanwijzing aan de betrokken onroerende zaak toegedachte
      bestemming is gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0003391#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0003391#Artikel5
