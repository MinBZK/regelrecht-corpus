      - id: ref6
        bwb_id: BWBR0003391
        artikel: '6'
  - number: 9b.4
    text: |-
      Bij toepassing van [artikel 9a, tweede lid][ref1], kunnen provinciale en gedeputeerde staten geen gebruik meer
      maken van de bevoegdheid, bedoeld in [artikel 9a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9b
