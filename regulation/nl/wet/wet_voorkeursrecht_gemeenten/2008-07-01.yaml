  - number: 9a.6
    text: |-
      Bij toepassing van het tweede lid worden de in de [artikelen 10][ref1], [11][ref2], [12][ref3] en
      [16 tot en met 24][ref4], [26][ref5] en [27][ref6] geregelde bevoegdheden en verplichtingen met uitsluiting van de
      bevoegdheid ter zake van burgemeester en wethouders of van gedeputeerde staten uitgeoefend door Onze Minister en
      neemt de Staat de plaats in van de gemeente, onderscheidenlijk de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel27
    url: https://wetten.overheid.nl/BWBR0003391/2008-07-01#Artikel9a
