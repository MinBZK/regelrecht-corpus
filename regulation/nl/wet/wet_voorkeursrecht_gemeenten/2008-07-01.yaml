      - id: ref3
        bwb_id: BWBR0003391
        artikel: '11'
  - number: 9b.3
    text: |-
      Bij toepassing van [artikel 9a, eerste of tweede lid][ref1], kunnen de gemeenteraad en burgemeester en wethouders
      geen gebruik meer maken van de bevoegdheid, bedoeld in [artikel 2][ref2] in samenhang met [artikel 3][ref3],
      [4][ref4] of [5][ref5] en [artikel 6][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel3
