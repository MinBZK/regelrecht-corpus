  - number: '7'
    text: |-
      1 Het besluit tot aanwijzing of voorlopige aanwijzing wordt door het college van burgemeester en wethouders
      bekendgemaakt. Het besluit treedt in werking de dag na dagtekening van het gemeenteblad waarin het is
      bekendgemaakt.

      2 Van het besluit tot aanwijzing of voorlopige aanwijzing wordt door het college van burgemeester en wethouders
      mededeling gedaan aan ieder van de in het besluit vermelde eigenaren en beperkt gerechtigden.
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel7
  - number: '8'
    text: |-
      1 Voor zover een aanwijzing niet meer voldoet aan de eisen, gesteld in [artikel 3, eerste lid][ref1],
      [4, eerste lid][ref2], onderscheidenlijk [5, eerste lid][ref3], besluiten burgemeester en wethouders tot het
      intrekken van die aanwijzing. In het besluit worden vermeld de percelen of perceelsgedeelten waarop de intrekking
      betrekking heeft. Het besluit tot intrekking wordt gevoegd bij de ingevolge [artikel 7, eerste lid][ref4], ter
      inzage gelegde stukken en in kopie gezonden naar de desbetreffende eigenaren en beperkt gerechtigden.

      2 Degene die een recht heeft op aangewezen gronden uit hoofde van eigendom of een beperkt recht als bedoeld in
      [artikel 1, onderdeel f][ref5] kan bij burgemeester en wethouders een aanvraag indienen tot intrekking van het
      besluit tot aanwijzing. Zij nemen een besluit uiterlijk vier weken na de dag van ontvangst van de aanvraag.

      3 In geval van onherroepelijke vernietiging in beroep van het in [artikel 3, eerste lid][ref6], bedoelde
      bestemmingsplan of inpassingsplan, geldt de in artikel 3 bedoelde aanwijzing tot een jaar na de datum van de
      vernietiging als zijnde in overeenstemming met de eisen gesteld in artikel 3, eerste lid, behoudens eerdere
      intrekking door burgemeester en wethouders.


