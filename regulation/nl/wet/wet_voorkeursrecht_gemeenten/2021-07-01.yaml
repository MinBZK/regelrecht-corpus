        afdeling: '11'
  - number: '12'
    text: |-
      1 Burgemeester en wethouders besluiten binnen zes weken na ontvangst van de opgave of de gemeente al dan niet in
      beginsel bereid is het goed tegen nader overeen te komen voorwaarden te kopen of op grond van een andere titel
      te verkrijgen.

      2 Indien burgemeester en wethouders binnen de termijn, genoemd in het eerste lid, beslissen niet bereid te
      zijn het goed te kopen of op grond van een andere titel te verkrijgen heeft de vervreemder gedurende drie jaar
      na die beslissing de vrijheid tot vervreemding aan derden voorzover het betreft het in zijn aanbod vermelde
      goed. De vervreemding betreft alle in de opgave vermelde goederen tezamen, met inbegrip van het gedeelte
      en van het bedrijf of de onderneming, waarvan de vervreemder bij het verstrekken van die opgave ingevolge
      [artikel 11, derde of vierde lid][ref1], heeft geëist dat het mede in de verkoop zou worden betrokken.

      3 Bij overschrijding van de termijn, genoemd in het eerste lid, is het tweede lid van overeenkomstige toepassing
      met dien verstande dat de in dat lid genoemde periode van drie jaar aanvangt na verloop van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '13'
    text: |-
      1 Indien burgemeester en wethouders en de vervreemder in onderhandeling zijn getreden ter bepaling van de
      vervreemdingsvoorwaarden en gehandeld is overeenkomstig de [artikelen 11][ref1] en [12, eerste lid][ref2], kan de
      vervreemder aan burgemeester en wethouders verzoeken om binnen vier weken de rechter te verzoeken een oordeel over
      de prijs te geven.

      2 Bij hun verzoekschrift overleggen burgemeester en wethouders een gewaarmerkt afschrift van het verzoek van de
      vervreemder.

      3 Bij overschrijding van de in het eerste lid genoemde termijn of indien burgemeester en wethouders schriftelijk
      weigeren een verzoekschrift in te dienen, is [artikel 12, derde lid][ref3], van overeenkomstige toepassing.

      4 De rechtbank benoemt een of meer deskundigen die zo spoedig mogelijk aan de rechtbank advies over de prijs
      uitbrengen. Bij het ten behoeve van het advies uit te voeren onderzoek wordt onder meer de ligging en de
      gesteldheid van de desbetreffende onroerende zaak betrokken. De rechtbank oordeelt met overeenkomstige toepassing
      van de [artikelen 40b tot en met 40f van de onteigeningswet.][ref4]

      5 De rechtbank doet binnen zes maanden na ontvangst van het verzoekschrift bij beschikking uitspraak. Van de
      beschikking van de rechtbank staat uitsluitend beroep in cassatie open.

      6 De kosten van de rechterlijke procedure, het deskundigenadvies alsmede de redelijkerwijs door de vervreemder
      voor rechtsbijstand en andere deskundige bijstand gemaakte kosten komen ten laste van de gemeente. Indien de
      rechter daartoe termen vindt in de omstandigheden van het geval, is deze bevoegd de kosten geheel of gedeeltelijk
      te compenseren.

      7 Indien door schriftelijke intrekking van het verzoek door burgemeester en wethouders de procedure tussentijds
      wordt beëindigd, heeft de vervreemder gedurende drie jaar na de intrekking de vrijheid tot vervreemding aan derden
      voorzover het betreft het in zijn opgave vermelde goed. De rechter beslist dan bij beschikking over de kosten,
      bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0001842#Artikel40b
