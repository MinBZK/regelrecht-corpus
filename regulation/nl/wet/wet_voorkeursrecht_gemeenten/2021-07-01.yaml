preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, een regeling te treffen voor de totstandkoming van een
    voorkeursrecht van gemeenten bij de verwerving van onroerend goed;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. bestemmingsplan: bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref1];

      b. inpassingsplan: inpassingsplan als bedoeld in [artikel 3.26][ref2] onderscheidenlijk
      [3.28 van de Wet ruimtelijke ordening][ref3];

      c. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      d. structuurvisie: structuurvisie als bedoeld in [artikel 2.1][ref4], [2.2][ref5] onderscheidenlijk
      [2.3 van de Wet ruimtelijke ordening][ref6];

      e. vervreemder: eigenaar van een onroerende zaak of rechthebbende op een beperkt recht als bedoeld in onderdeel f
      die tot vervreemding wenst over te gaan, alsmede degene die bij ontbinding van een gemeenschap met de vereffening
      is belast en tot vervreemding wenst over te gaan;

      f. vervreemding: overdracht in eigendom of verdeling van een onroerende zaak alsmede overdracht of verdeling dan
      wel vestiging van een recht van opstal, erfpacht, beklemming of vruchtgebruik, waaraan een onroerende zaak is
      onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.1
