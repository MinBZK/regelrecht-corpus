  - number: '6'
    text: |-
      1 Burgemeester en wethouders kunnen gronden voorlopig aanwijzen, mits bij het hiertoe strekkend besluit aan die
      gronden een niet-agrarische bestemming is toegedacht en het gebruik afwijkt van de toegedachte bestemming. Het
      besluit vervalt van rechtswege drie maanden na dagtekening of zoveel eerder als een besluit van de gemeenteraad tot
      aanwijzing ingevolge [artikel 3][ref1], [4][ref2] of [5][ref3] in werking treedt.

      2 De [artikelen 3, tweede en derde lid][ref4], [10 tot en met 15][ref5], [24][ref6] en [26][ref7] zijn van
      overeenkomstige toepassing.

      3 Indien bezwaar of beroep aanhangig is tegen een besluit tot voorlopige aanwijzing en dit besluit vervalt omdat
      een besluit van de gemeenteraad tot aanwijzing in werking is getreden, wordt het bezwaar of beroep mede geacht te
      zijn gericht tegen het besluit van de gemeenteraad.


