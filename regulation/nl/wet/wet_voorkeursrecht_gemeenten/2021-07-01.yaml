  - number: '10'
    text: |-
      1 Een vervreemder kan eerst tot vervreemding overgaan nadat de gemeente in de gelegenheid is gesteld het
      desbetreffende goed te verkrijgen.

      2 Het bepaalde in het vorige lid geldt niet ingeval de vervreemding geschiedt ingevolge

      a. een overeenkomst tussen bloed- of aanverwanten in de rechte lijn of in de zijlijn tot in de tweede graad of met
      een pleegkind. Onder pleegkind wordt verstaan degene, die duurzaam als een eigen kind is onderhouden en opgevoed;

      b. verdeling van een huwelijksgemeenschap of een nalatenschap;

      c. een uiterste wilsbeschikking;

      d. een overeenkomst met de Staat, een provincie, een waterschap of een door Ons aan te wijzen publiekrechtelijk
      lichaam of in het openbaar belang werkzame rechtspersoon. Onze aanwijzing wordt in de *Staatscourant*
      bekendgemaakt;

      e. een verkoop krachtens wetsbepaling of bevel des rechters of een executoriale verkoop,
      met dien verstande dat ingeval van een onderhandse executoriale verkoop als bedoeld in
      [artikel 3: 268, tweede lid, van het Burgerlijk Wetboek ][ref1] de voorzieningenrechter niet beslist omtrent
      het verzoek tot onderhandse verkoop zolang niet het bestuursorgaan in de gelegenheid is gesteld om, gelet op het
      gunstiger bod, een bod te doen;

      f. een overeenkomst, betrekking hebbende op gronden die zijn aangewezen bij een besluit als bedoeld in
      [artikel 5][ref2] of [6][ref3] dan wel [artikel 9a, eerste of tweede lid][ref4], in samenhang met artikel 5 of 6,
      gesloten met een pachter aan wie ten aanzien van deze gronden ten tijde van de inwerkingtreding van dit besluit een
      voorkeursrecht toekwam als bedoeld in [artikel 378 van Boek 7 van het Burgerlijk Wetboek][ref5].

      3 Voorts geldt het bepaalde in het eerste lid niet ingeval de vervreemding geschiedt ingevolge een overeenkomst
      betreffende een onroerende zaak, dan wel een overeenkomst behelzende een verplichting van de vervreemder
      betreffende een onroerende zaak, voorzover:

      a. vervreemding geschiedt aan een in die overeenkomst met name genoemde partij, en een tegen een in die
      overeenkomst met name genoemde prijs, dan wel tegen een volgens die overeenkomst bepaalbare prijs, en

      b. de overeenkomst is ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref6], voordat een besluit tot aanwijzing of
      voorlopige aanwijzing in werking is getreden, en

      c. de vervreemding geschiedt binnen zes maanden na de dag van de inschrijving van de overeenkomst in de openbare
      registers als bedoeld onder b.

      4 Een overeenkomst als bedoeld in het derde lid, aanhef, kan worden ingeschreven in de openbare registers, bedoeld
      in het derde lid, mits deze is vervat in een akte. De inschrijving heeft het rechtsgevolg dat voor de vervreemder
      niet de verplichting zoals bedoeld in het eerste lid ontstaat, voorzover is voldaan aan de in het derde lid, onder
      a, b en c, genoemde vereisten.

      5 Het derde lid is telkens gedurende een periode van drie jaar op een overeenkomst als bedoeld in dat lid met
      betrekking tot een bepaalde onroerende zaak of een gedeelte daarvan, en de daarin met name genoemde vervreemder of
      verkrijger, slechts één maal van toepassing. De periode van drie jaar vangt aan op de datum van eerste inschrijving
      in de openbare registers. Onder verkrijger wordt in dit geval verstaan de partij waarmee een overeenkomst is
      gesloten.

      6 Het eerste lid geldt eveneens niet indien burgemeester en wethouders op aanvraag van een vervreemder op grond
      van door die vervreemder aannemelijk gemaakte gewichtige redenen daartoe besluiten. Zij kunnen daarbij beperkingen
      opleggen.


