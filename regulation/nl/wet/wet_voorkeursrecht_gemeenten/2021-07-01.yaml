  - number: 9b
    text: |-
      1 Op het tijdstip van inwerkingtreding van een besluit als bedoeld in [artikel 9a, eerste of tweede lid][ref1],
      vervalt een eerder besluit tot aanwijzing of voorlopige aanwijzing van de betrokken grond van de gemeenteraad
      of van burgemeester en wethouders van rechtswege, met dien verstande dat indien aan burgemeester en wethouders
      reeds een opgave is gedaan als bedoeld in [artikel 11, eerste lid][ref2], die opgave in stand blijft en wordt
      aangemerkt als een opgave aan gedeputeerde staten onderscheidenlijk Onze Minister. Gedeputeerde staten nemen,
      onderscheidenlijk Onze Minister neemt bij de toepassing van de [artikelen 11 tot en met 15][ref3] de plaats in van
      burgemeester en wethouders, en de provincie onderscheidenlijk de Staat de plaats van de gemeente.

      2 Op het tijdstip van inwerkingtreding van een besluit als bedoeld in [artikel 9a, tweede lid][ref4], vervalt
      een eerder besluit tot aanwijzing of tot voorlopige aanwijzing van de betrokken grond van provinciale staten of
      gedeputeerde staten van rechtswege, met dien verstande dat indien aan gedeputeerde staten reeds een opgave is
      gedaan als bedoeld in [artikel 11, eerste lid][ref5], die opgave in stand blijft en wordt aangemerkt als een opgave
      aan Onze Minister. Onze Minister neemt bij de toepassing van de [artikelen 11 tot en met 15][ref6] de plaats in van
      gedeputeerde staten, en de Staat de plaats van de provincie.

      3 Bij toepassing van [artikel 9a, eerste of tweede lid][ref7], kunnen de gemeenteraad en burgemeester en wethouders
      geen gebruik meer maken van de bevoegdheid, bedoeld in [artikel 2][ref8] in samenhang met [artikel 3][ref9],
      [4][ref10] of [5][ref11] en [artikel 6][ref12].

      4 Bij toepassing van [artikel 9a, tweede lid][ref13], kunnen provinciale en gedeputeerde staten geen gebruik meer
      maken van de bevoegdheid, bedoeld in [artikel 9a, eerste lid][ref14].


