        artikel: '26'
  - number: '3'
    text: |-
      1 Voor aanwijzing komen in aanmerking gronden waaraan bij het bestemmingsplan of inpassingsplan een niet-agrarische
      bestemming is toegekend en waarvan het gebruik afwijkt van dat plan.

      2 Een besluit tot aanwijzing vermeldt ten aanzien van de onroerende zaken waarop het betrekking heeft:

      a. de kadastrale aanduiding;

      b. de grootte van elk van de desbetreffende percelen volgens de kadastrale registratie;

      c. de grootte van een perceelsgedeelte, indien de aanwijzing betrekking heeft op een gedeelte van een onroerende
      zaak, en

      d. de namen van de eigenaren van de desbetreffende onroerende zaken en van de rechthebbenden op de beperkte rechten
      waaraan die zaken zijn onderworpen.

      3 Bij het besluit behoort een kadastraal overzicht waarop duidelijk zijn aangegeven de gronden waarop de aanwijzing
      betrekking heeft en de bijbehorende percelen of perceelsgedeelten.
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel3
  - number: '4'
    text: |-
      1 In afwijking van [artikel 3, eerste lid][ref1], komen voor aanwijzing voorts in aanmerking:

      a. gronden die zijn begrepen in een structuurvisie, waarbij aanwijzingen zijn gegeven voor de bestemming en
      waaraan bij de structuurvisie een niet-agrarische bestemming is toegedacht en waarvan het gebruik afwijkt van de
      toegedachte bestemming;

      b. gronden die bij een structuurvisie zijn aangewezen tot moderniseringsgebied als bedoeld in
      [artikel 3.5 van de Wet ruimtelijke ordening][ref2], ongeacht of het gebruik van de gronden in die gebieden al dan
      niet afwijkt van die visie.

      2 [Artikel 3, tweede en derde lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel4
