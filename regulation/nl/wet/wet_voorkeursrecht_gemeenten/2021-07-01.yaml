  - number: '9'
    text: |-
      1 Een besluit tot aanwijzing als bedoeld in [artikel 3][ref1] of [artikel 9a][ref2] in samenhang met artikel 3
      vervalt van rechtswege tien jaar na de inwerkingtreding van het bestemmingsplan onderscheidenlijk inpassingsplan.

      2 Een besluit tot aanwijzing als bedoeld in [artikel 4][ref3], vervalt van rechtswege drie jaar na dagtekening van
      dat besluit, tenzij voordien een bestemmingsplan of inpassingsplan is vastgesteld.

      3 Een besluit tot aanwijzing als bedoeld in [artikel 5][ref4] vervalt van rechtswege drie jaar na dagtekening,
      tenzij voor dat tijdstip een structuurvisie, bestemmingsplan of inpassingsplan is vastgesteld.

      4 Indien [artikel 8, derde lid][ref5], van toepassing is, vervalt het besluit tot aanwijzing, bedoeld in
      [artikel 3][ref6], van rechtswege na afloop van de in het derde lid van artikel 8 genoemde termijn, tenzij voor
      dat tijdstip voor de in de aanwijzing begrepen gronden een bestemmingsplan of inpassingsplan is vastgesteld,
      dat voldoet aan de in artikel 3, eerste lid, gestelde eisen. In dat geval vervalt het besluit tot aanwijzing van
      rechtswege tien jaar na de inwerkingtreding van het bestemmingsplan onderscheidenlijk inpassingsplan.

      5 Een mededeling van het van rechtswege vervallen van een besluit tot aanwijzing wordt gevoegd bij de ingevolge
      [artikel 7, eerste lid][ref7], ter inzage gelegde stukken en in kopie gezonden naar de desbetreffende eigenaren en
      beperkt gerechtigden.


