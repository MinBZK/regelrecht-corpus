  - number: 9a
    text: |-
      1 Indien provinciale staten het voornemen hebben toepassing te geven aan
      [artikel 3.26, eerste en vierde lid, van de Wet ruimtelijke ordening][ref1] kunnen zij, op gelijke wijze als
      de gemeenteraad, overeenkomstig [artikel 2][ref2] in samenhang met [artikel 3][ref3], [4][ref4] of [5][ref5],
      gronden aanwijzen, met dien verstande dat voor een aanwijzing in samenhang met [artikel 4][ref6] uitsluitend
      een structuurvisie als bedoeld in [artikel 2.2 van de Wet ruimtelijke ordening][ref7] in aanmerking komt. In een
      besluit tot aanwijzing overeenkomstig [artikel 4][ref8] of [5][ref9] geven provinciale staten aan op welke wijze
      invulling gegeven zal worden aan een inpassingsplan. Gedeputeerde staten kunnen op gelijke wijze als burgemeester
      en wethouders overeenkomstig [artikel 6][ref10] gronden voorlopig aanwijzen.

      2 Indien Onze Minister het voornemen heeft toepassing te geven aan
      [artikel 3.28, eerste en vierde lid, van de Wet ruimtelijke ordening][ref11] kan deze, op gelijke wijze als de
      gemeenteraad, overeenkomstig [artikel 2][ref12] in samenhang met [artikel 3][ref13], [4][ref14] of [5][ref15]
      gronden aanwijzen, met dien verstande dat voor een aanwijzing in samenhang met [artikel 4][ref16] uitsluitend een
      structuurvisie als bedoeld in [artikel 2.3 van de Wet ruimtelijke ordening][ref17] in aanmerking komt. Bij een
      aanwijzing overeenkomstig de [artikelen 4][ref18] en [5][ref19] geeft Onze Minister aan op welke wijze invulling
      gegeven zal worden aan een inpassingsplan.

      3 De [artikelen 6, derde lid][ref20], [7 tot en met 15][ref21], [24][ref22] en [26][ref23] zijn van overeenkomstige
      toepassing.

      4 Bij toepassing van het eerste of tweede lid verstrekken gedeputeerde staten, onderscheidenlijk Onze Minister
      onverwijld een exemplaar van het besluit tot aanwijzing of voorlopige aanwijzing en de bijbehorende kadastrale
      kaart aan de Dienst voor het kadaster en de openbare registers, ter inschrijving van die stukken in de openbare
      registers en doen mededeling van de aanwijzing of voorlopige aanwijzing aan burgemeester en wethouders van de
      gemeente en gedeputeerde staten van de provincie waarin de gronden waarop de aanwijzing betrekking heeft zijn
      gelegen. [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref24] is niet van toepassing. Evenzo
      doen gedeputeerde staten, onderscheidenlijk Onze Minister mededeling van het intrekken of van het van rechtswege
      vervallen van een besluit tot aanwijzing aan:

      a. de Dienst voor het kadaster en de openbare registers;

      b. de desbetreffende eigenaren en beperkt gerechtigden, en

      c. burgemeester en wethouders van de gemeente waarin de gronden waarop de aanwijzing betrekking had, zijn gelegen.

      5 Bij toepassing van het eerste lid worden de in de [artikelen 10][ref25], [11][ref26], [12][ref27], [24][ref28],
      [26][ref29] en [27][ref30] geregelde bevoegdheden en verplichtingen met uitsluiting van de bevoegdheid ter zake
      van burgemeester en wethouders, uitgeoefend door gedeputeerde staten en neemt de provincie de plaats in van de
      gemeente.

      6 Bij toepassing van het tweede lid worden de in de [artikelen 10][ref31], [11][ref32], [12][ref33], [24][ref34],
      [26][ref35] en [27][ref36] geregelde bevoegdheden en verplichtingen met uitsluiting van de bevoegdheid ter zake van
      burgemeester en wethouders of van gedeputeerde staten uitgeoefend door Onze Minister en neemt de Staat de plaats in
      van de gemeente, onderscheidenlijk de provincie.


