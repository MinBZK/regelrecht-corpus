  - number: '25'
    text: |-
      1 Voor zover na de overdracht aan de gemeente van een onroerende zaak of van een beperkt recht waaraan zo’n zaak
      is onderworpen ingevolge de [artikelen 10 tot en met 15][ref1], [24][ref2] en [26][ref3] vanwege een besluit tot
      aanwijzing overeenkomstig [artikel 2][ref4] in samenhang met [artikel 3][ref5] of [4][ref6], zonder dat de in
      [artikel 3, eerste lid][ref7], of [4, eerste lid][ref8], bedoelde andere bestemming is verwezenlijkt, bij een
      onherroepelijk bestemmingsplan een bestemming is aangewezen waarmee de totstandkoming van de aanwijzing zou zijn
      uitgesloten, kan de vervreemder vorderen dat de gemeente hem de schade zal vergoeden die hij als gevolg van die
      overdracht mocht hebben geleden.

      2 Gelijke bevoegdheid heeft de vervreemder na de overdracht ingevolge de [artikelen 10 tot en met 15][ref9],
      [24][ref10] en [26][ref11] vanwege een besluit tot aanwijzing overeenkomstig [artikel 2][ref12] in samenhang
      met [5][ref13], of een besluit tot voorlopige aanwijzing overeenkomstig [artikel 6][ref14], voor zover de bij
      die overdracht betrokken onroerende zaak niet binnen de desbetreffende termijn, genoemd in [artikel 6][ref15]
      of [9][ref16] is opgenomen in een besluit als bedoeld in [artikel 5][ref17], onderscheidenlijk in een
      bestemmingsplan of structuurvisie, waarbij de bij de aanwijzing of voorlopige aanwijzing aan de betrokken
      onroerende zaak toegedachte bestemming is gehandhaafd.

      3 Indien toepassing is gegeven aan [artikel 9a, eerste of tweede lid][ref18], treedt voor de toepassing van het
      eerste of tweede lid de provincie onderscheidenlijk de Staat in de plaats van de gemeente.


