  - number: '14'
    text: |-
      Indien de vervreemder binnen drie maanden, te rekenen van de dag van onherroepelijk worden van de beschikking,
      bedoeld in [artikel 13, vijfde lid][ref1], bij aangetekende brief aan de gemeente verlangt dat deze het betrokken
      goed verkrijgt, is de gemeente verplicht haar medewerking te verlenen aan de totstandkoming van een notariële
      akte tot levering aan haar van het betrokken goed tegen betaling aan de vervreemder van de bij onherroepelijke
      rechterlijke beschikking bepaalde prijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '15'
    text: |-
      1 De vervreemder kan de rechtbank verzoeken te bepalen dat de gemeente wegens de bijzondere persoonlijke
      omstandigheden van de vervreemder gehouden is medewerking te verlenen aan de overdracht tegen een door de rechtbank
      vast te stellen prijs van het goed, dat is vervat in de opgave, bedoeld in [artikel 11][ref1], eventueel met
      inbegrip van de ingevolge het derde en vierde lid van dat artikel mede in die opgave vermelde bestanddelen.

      2 Het met redenen omkleed verzoekschrift kan worden gedaan binnen twee maanden te rekenen van de dag:

      a. waarop burgemeester en wethouders de termijn, bedoeld in [artikel 13, eerste lid][ref2], hebben overschreden of
      indien zij schriftelijk weigeren een verzoekschrift in te dienen;

      b. waarop de intrekking, bedoeld in [artikel 13, zevende lid][ref3], van het verzoek ter griffie is ontvangen.

      3 De rechtbank doet binnen zes maanden na ontvangst van het verzoekschrift bij beschikking uitspraak over het
      verzoek en bij toewijzing daarvan tevens over de prijs. Zij beoordeelt of het redelijk is dat vervreemding aan
      de gemeente, gezien de bijzondere persoonlijke omstandigheden die terzake van belang kunnen zijn, achterwege zou
      blijven. Van de beschikking staat uitsluitend beroep in cassatie open.

      4 Bij afwijzing van het verzoek heeft de vervreemder gedurende drie jaar na het onherroepelijk worden van de
      rechterlijke beschikking de vrijheid tot vervreemding aan derden voorzover betreft het in zijn opgave, bedoeld
      in [artikel 11][ref4], vermelde goed. De vervreemding betreft alle in de opgave vermelde goederen tezamen, met
      inbegrip van het gedeelte en van het bedrijf of de onderneming, waarvan de vervreemder bij het verstrekken van die
      opgave ingevolge artikel 11, derde of vierde lid, heeft geëist dat het mede in de verkoop zou worden betrokken.

      5 De [artikelen 13, vierde en zesde lid][ref5], en [14][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
