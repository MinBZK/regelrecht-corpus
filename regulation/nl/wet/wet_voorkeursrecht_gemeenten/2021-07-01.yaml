  - number: '11'
    text: |-
      1 Ter voldoening aan [artikel 10, eerste lid][ref1], bericht de vervreemder aan burgemeester en wethouders bij
      aangetekende brief dat hij in beginsel bereid is over te gaan tot vervreemding van het desbetreffende goed aan de
      gemeente tegen nader overeen te komen voorwaarden.

      2 De opgave, bedoeld in het eerste lid, bevat een opgave van het goed dat onderwerp uitmaakt van de voorgenomen
      vervreemding alsmede ten aanzien van de desbetreffende onroerende zaken:

      a. de kadastrale aanduiding;

      b. de grootte van elk van de desbetreffende percelen volgens de kadastrale registratie;

      c. de grootte van een perceelsgedeelte, indien het aanbod betrekking heeft op een gedeelte van een onroerende zaak.

      3 Indien de opgave betrekking heeft op onroerende zaken die slechts ten dele in de aanwijzing of
      voorlopige aanwijzing zijn opgenomen maar een samenhangend geheel vormen, kan de vervreemder onverminderd
      [afdeling 11 van titel 5 van Boek 7 van het Burgerlijk Wetboek][ref2], eisen dat dit geheel van onroerende zaken
      wordt betrokken in de mogelijke vervreemding aan de gemeente.

      4 De vervreemder kan eisen dat in de vervreemding wordt betrokken het bedrijf of de onderneming waarin de
      onroerende zaken als onderdeel daarvan worden geëxploiteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Afdeling11
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel11
