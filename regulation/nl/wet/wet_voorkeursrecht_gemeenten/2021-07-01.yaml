  - number: '24'
    text: |-
      1 De inschrijving in de in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare
      registers van een akte, behelzende een vervreemding anders dan aan de gemeente, vindt alleen plaats indien op
      het in te schrijven stuk is opgenomen een notariële verklaring, houdende dat op de betrokken onroerende zaak geen
      aanwijzing of voorlopige aanwijzing in de zin van deze wet van toepassing is, hetzij dat de vervreemding niet in
      strijd is met deze wet.

      2 Voor de toepassing van het vorige lid wordt met de daar bedoelde notariële verklaring gelijkgesteld de verklaring
      van een persoon bedoeld in [artikel 91 van de Overgangswet nieuw Burgerlijk Wetboek][ref2], die overeenkomstig het
      daar bepaalde een onderhandse akte tot levering heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002565#Artikel91
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel24
