  - number: '26'
    text: |-
      1 Een gemeente kan de nietigheid inroepen van rechtshandelingen die zijn verricht met de kennelijke strekking
      afbreuk te doen aan haar in deze wet geregelde voorkeurspositie.

      2 Het verzoek moet worden gedaan binnen acht weken nadat de gemeente een afschrift heeft ontvangen van de akte
      waarin de desbetreffende rechtshandeling is vervat bij de rechtbank van het arrondissement waarbinnen de gemeente
      is gelegen. De gemeente is niet ontvankelijk in haar verzoek indien zij met de desbetreffende rechtshandeling
      schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel26
  - number: '28'
    text: Wij geven bij algemene maatregel van bestuur nadere voorschriften voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel28
  - number: '30'
    text: Deze wet kan worden aangehaald als "Wet voorkeursrecht gemeenten".
    url: https://wetten.overheid.nl/BWBR0003391/2021-07-01#Artikel30
