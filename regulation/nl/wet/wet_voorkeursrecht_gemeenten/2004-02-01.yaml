  - number: '10'
    text: |-
      1 Een verkoper kan eerst tot vervreemding overgaan nadat de gemeente in de gelegenheid is gesteld het
      desbetreffende goed te kopen.

      2 Het bepaalde in het vorige lid geldt niet ingeval de vervreemding geschiedt ingevolge

      a. een overeenkomst tussen bloed- of aanverwanten in de rechte lijn of in de zijlijn tot de tweede graad of met een
      pleegkind. Onder pleegkind wordt verstaan degene, die duurzaam als een eigen kind is onderhouden en opgevoed;

      b. verdeling van een huwelijksgemeenschap of een nalatenschap;

      c. een uiterste wilsbeschikking;

      d. een overeenkomst met de Staat, een provincie, een waterschap of een door Ons aan te wijzen publiekrechtelijk
      lichaam of in het openbaar belang werkzame rechtspersoon. Onze aanwijzing wordt in de *Staatscourant*
      bekendgemaakt;

      e. een verkoop krachtens wetsbepaling of bevel des rechters of een openbare executoriale verkoop;

      f. een overeenkomst, gesloten met een pachter ingevolge het bepaalde in
      [Hoofdstuk I, paragraaf 9 A van de Pachtwet][ref1] en betrekking hebbende op een onroerende zaak die is
      aangewezen bij een besluit, als bedoeld in [artikel 8][ref2], dan wel is opgenomen in een voorstel als bedoeld
      in [artikel 8][ref3].

      3 Voorts geldt het bepaalde in het eerste lid niet ingeval de vervreemding geschiedt ingevolge een overeenkomst
      betreffende een onroerende zaak, dan wel een overeenkomst behelzende een verplichting van de verkoper betreffende
      een onroerende zaak, voorzover:

      a. vervreemding geschiedt aan een in die overeenkomst met name genoemde partij, en een tegen een in die
      overeenkomst met name genoemde prijs, dan wel tegen een volgens die overeenkomst bepaalbare prijs, en

      b. de overeenkomst is ingeschreven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref4], vóór de dag na de dagtekening van
      de Staatscourant waarin de nederlegging ter inzage van het besluit van de gemeente tot vestiging van een
      voorkeursrecht is bekendgemaakt, en

      c. de vervreemding geschiedt binnen zes maanden na de dag van de inschrijving van de overeenkomst in de openbare
      registers als bedoeld onder b.

      Onder een besluit van de gemeente tot vestiging van een voorkeursrecht wordt verstaan een besluit van de
      gemeenteraad als bedoeld in [artikel 2, eerste lid][ref5], of [artikel 8, eerste lid][ref6], dan wel een voorstel
      van burgemeester en wethouders als bedoeld in [artikel 6, eerste lid][ref7], of [artikel 8a, eerste lid][ref8].

      4 Een overeenkomst als bedoeld in het derde lid, aanhef, kan worden ingeschreven in de openbare registers, bedoeld
      in het derde lid, mits deze is vervat in een akte. De inschrijving heeft het rechtsgevolg dat voor de verkoper niet
      de verplichting zoals bedoeld in het eerste lid ontstaat, voorzover is voldaan aan de in het derde lid, onder a, b
      en c, genoemde vereisten.

      5 Het derde lid is telkens gedurende een periode van drie jaar op een overeenkomst als bedoeld in dat lid met
      betrekking tot een bepaalde onroerende zaak of een gedeelte daarvan, en de daarin met name genoemde verkoper of
      koper, slechts één maal van toepassing. De periode van drie jaar vangt aan op de datum van eerste inschrijving in
      de openbare registers. Onder koper wordt in dit geval verstaan de partij waarmee een overeenkomst is gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002269#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel8
