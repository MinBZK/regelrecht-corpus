  - number: '6'
    text: |-
      1 Een voorstel van burgemeester en wethouders aan de gemeenteraad tot het nemen van een besluit als bedoeld
      in [artikel 2, eerste lid][ref1], gedaan vóór de vaststelling van een structuurplan als bedoeld in dat lid of
      een bestemmingsplan en betrekking hebbende op gronden, welke zijn begrepen in het ter inzage gelegde ontwerp
      voor dat plan, kan worden bekend gemaakt door overeenkomstige toepassing van [artikel 2, derde lid][ref2] en
      [artikel 4, eerste tot en met derde lid][ref3].

      2 Door toepassing van het vorige lid verkrijgt het aldaar bedoelde voorstel, daags na dagtekening van de
      *Staatscourant* waarin zijn nederlegging ter inzage is bekend gemaakt, ten aanzien van de daarbij betrokken gronden
      het rechtsgevolg van een besluit als bedoeld in [artikel 2, eerste lid][ref4], in dier voege, dat op die gronden
      de [artikelen 10][ref5]-[24][ref6], [26][ref7] en [27][ref8] van toepassing zijn, met dien verstande dat in artikel
      11, tweede lid, in de plaats van "de aanwijzing, bedoeld in [artikel 2][ref9]" is te lezen "het voorstel, bedoeld
      in [artikel 6][ref10]".


