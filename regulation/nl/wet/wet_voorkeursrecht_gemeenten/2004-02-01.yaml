  - number: 9a
    text: |-
      1 Een voorstel van burgemeester en wethouders ten aanzien waarvan [artikel 6, eerste lid][ref1], of
      [8a, eerste lid, van de wet][ref2] is toegepast wordt aangemerkt als een besluit.

      2 Indien bezwaar of beroep aanhangig is tegen een voorstel van burgemeester en wethouders als bedoeld
      in [artikel 6][ref3] onderscheidenlijk [8a][ref4], en ingevolge [artikel 7, eerste lid, onder b][ref5],
      onderscheidenlijk [artikel 8a, derde lid, onder b][ref6], het daaraan verbonden rechtsgevolg vervalt omdat een
      besluit van de gemeenteraad als bedoeld in [artikel 2][ref7] onderscheidenlijk [artikel 8][ref8] in werking is
      getreden, wordt het bezwaar of beroep geacht te zijn gericht tegen het raadsbesluit.

      3 Indien bezwaar of beroep aanhangig is tegen een voorstel van burgemeester en wethouders als bedoeld in
      [artikel 8a][ref9] en ingevolge [artikel 8a, derde lid, onder c][ref10], het daaraan verbonden rechtsgevolg vervalt
      omdat het rechtsgevolg van een voorstel als bedoeld in [artikel 6][ref11] in werking is getreden, wordt het bezwaar
      of beroep geacht te zijn gericht tegen het nieuwe voorstel.


