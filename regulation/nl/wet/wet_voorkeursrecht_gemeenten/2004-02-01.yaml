preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, een regeling te treffen voor de totstandkoming van een
    voorkeursrecht van gemeenten bij de verwerving van onroerend goed;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder:

      a. vervreemding: de overdracht in eigendom of de toedeling van een onroerende zaak alsmede de overdracht of
      toedeling dan wel vestiging van een recht van opstal, erfpacht, beklemming of vruchtgebruik, waaraan een onroerende
      zaak is onderworpen;

      b. verkoper: de eigenaar van een onroerende zaak of de rechthebbende op een beperkt recht als onder *a* bedoeld,
      die tot vervreemding wenst over te gaan, alsmede degene, die bij ontbinding van een gemeenschap met de vereffening
      is belast en tot vervreemding wenst over te gaan;

      c. structuurplan: een structuurplan als bedoeld in [artikel 7 van de Wet op de Ruimtelijke Ordening][ref1], of een
      regionaal structuurplan als bedoeld in artikel 36*c* van die wet;

      d. bestemmingsplan: een bestemmingsplan, als bedoeld in [artikel 10 van de Wet op de Ruimtelijke Ordening][ref2],
      een plan van uitbreiding als bedoeld in paragraaf 7 van de [Woningwet][ref3] 1901 en een wederopbouwplan als
      bedoeld in paragraaf 1 van de Wederopbouwwet.

      e. Onze Minister: Onze Minister van Volkshuisvesting en Ruimtelijke Ordening.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel10
