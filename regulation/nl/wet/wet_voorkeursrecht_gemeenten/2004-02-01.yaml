  - number: '3'
    text: |-
      1 In afwijking in zoverre van [artikel 2, tweede lid][ref1], komen gronden, begrepen in een structuurplan, als
      bedoeld in het eerste lid van dat artikel, die bij zodanig plan zijn aangewezen voor stads- en dorpsvernieuwing
      in de zin van [artikel 1, eerste lid, van de Wet op de stads- en dorpsvernieuwing][ref2], of in een
      stadsvernieuwingsplan, voor een aanwijzing, als bedoeld in [artikel 2, eerste lid][ref3], in aanmerking ongeacht of
      het gebruik van die gronden al dan niet afwijkt van het plan.

      2 Met betrekking tot gronden, als bedoeld in het eerste lid, ten aanzien waarvan [artikel 2, eerste lid][ref4],
      of [artikel 6, eerste lid][ref5], toepassing heeft gevonden, zijn de [artikelen 5, eerste lid][ref6], en
      [7, eerste lid][ref7], voorzover betreft het doen vervallen van de aldaar bedoelde aanwijzing of het aldaar
      bedoelde rechtsgevolg als gevolg van het niet meer voldoen aan de in [artikel 2, tweede lid][ref8], gestelde eis
      dat het gebruik van de gronden afwijkt van het plan, eerst van toepassing nadat de uitvoering van het plan ten
      aanzien van die gronden is voltooid.

      3 De gemeente biedt door haar aangekochte voor afzonderlijke vervreemding vatbare woningen, die zijn gebouwd op
      gronden als bedoeld in het tweede lid en laatstelijk zijn verhuurd geweest, binnen één maand na de inschrijving
      in de in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref9] bedoelde openbare registers te
      koop aan aan degene die blijkens een notariële of geregistreerde onderhandse akte sedert ten minste zes maanden
      vóór het tijdstip van de inschrijving huurder van die woning is en tevens, voor zover vereist ingevolge de
      [Huisvestingswet][ref10], ten aanzien van die woning een vergunning als bedoeld in artikel 7, eerste lid, van die
      wet heeft verkregen.


