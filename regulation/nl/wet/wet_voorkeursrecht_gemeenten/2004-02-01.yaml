  - number: '18'
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 17][ref1] aan de rechtbank wordt gedaan, benoemt deze een van haar
      leden als commissaris om, te zamen met de ingevolge [artikel 16][ref2] benoemde deskundigen en vergezeld van een
      griffier, een onderzoek in te stellen en te dien einde de ligging en gesteldheid van de desbetreffende onroerende
      zaak op te nemen. De tijd en plaats van de opneming worden door de rechter-commissaris zo spoedig mogelijk bepaald
      en door de griffier meegedeeld aan de deskundigen zomede aan de partijen, die bij de opneming aanwezig kunnen zijn.

      2 Van de opneming maakt de griffier een door de rechter-commissaris en door hemzelf te ondertekenen proces-verbaal
      op. De rechter-commissaris draagt aan de deskundigen op een nader advies over de verkoopprijs uit te brengen
      en stelt de dag vast, waarop dit advies ter griffie van de rechtbank zal worden neergelegd. Deze dag zal niet
      later worden bepaald dan uiterlijk drie maanden na de dag van opneming. In het proces-verbaal wordt de dag van de
      nederlegging vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel16
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel18
