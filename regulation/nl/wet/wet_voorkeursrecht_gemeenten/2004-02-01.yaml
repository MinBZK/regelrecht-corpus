  - number: '8'
    text: |-
      1 De gemeenteraad kan gronden aanwijzen waarop van toepassing zijn de [artikelen 10–24][ref1], [26][ref2] en
      [27][ref3], voor zover die gronden nog niet zijn opgenomen in een ter inzage gelegd ontwerp van een structuurplan
      als bedoeld in [artikel 2, eerste lid][ref4], of van een bestemmingsplan, waarbij aan de betrokken gronden een
      gewijzigde bestemming wordt toegedacht onderscheidenlijk gegeven. Bij het raadsbesluit behoort een kaart waarop de
      betrokken gronden en de aan die gronden toegedachte bestemming zijn aangeduid.

      2 Voor een aanwijzing als bedoeld in het eerste lid komen alleen in aanmerking gronden waaraan bij dat raadsbesluit
      een niet-agrarische bestemming wordt toegedacht en waarvan het gebruik afwijkt van de toegedachte bestemming.

      3 Op het in het eerste lid bedoelde besluit is [artikel 2, derde lid][ref5], van toepassing en is [artikel 4][ref6]
      van overeenkomstige toepassing.

      4 Het in het eerste lid bedoelde besluit geldt voor een termijn van ten hoogste twee jaren, te rekenen van zijn
      dagtekening.

      5 Burgemeester en wethouders doen de in het eerste lid bedoelde aanwijzing vervallen:

      a. voor zover de bij dat besluit aangewezen gronden worden opgenomen in het ontwerp van een structuurplan als
      bedoeld in [artikel 2, eerste lid][ref7], of van een bestemmingsplan, zodra dit ontwerp is ter inzage gelegd, met
      dien verstande dat, voor zover die gronden tegelijk met die terinzagelegging worden opgenomen in een voorstel als
      bedoeld in [artikel 6, eerste lid][ref8], burgemeester en wethouders de aanwijzing ten aanzien van die gronden
      doen vervallen zodra dat voorstel ingevolge [artikel 6, tweede lid][ref9], het aldaar bedoelde rechtsgevolg heeft
      gekregen;

      b. terstond na verloop van de in het vierde lid bedoelde termijn.

      6 [Artikel 5][ref10] is van overeenkomstige toepassing.


