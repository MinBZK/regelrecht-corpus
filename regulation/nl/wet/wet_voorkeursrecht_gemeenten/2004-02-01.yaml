  - number: '26'
    text: |-
      1 Een gemeente kan de nietigheid inroepen van rechtshandelingen die zijn verricht met de kennelijke strekking
      afbreuk te doen aan haar in deze wet geregelde voorkeurspositie.

      2 Het verzoek moet worden gedaan binnen acht weken nadat de gemeente een afschrift heeft ontvangen van de akte
      waarin de desbetreffende rechtshandeling is vervat bij de rechtbank van het arrondissement waarbinnen de gemeente
      is gelegen. De gemeente is niet ontvankelijk in haar verzoek indien zij met de desbetreffende rechtshandeling
      schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel26
  - number: '27'
    text: |-
      1 In het in het tweede lid van dit artikel bedoelde geval kan de verkoper de in [artikel 16, eerste lid][ref1],
      bedoelde rechtbank verzoeken te bepalen, dat de gemeente gehouden is medewerking te verlenen aan de overdracht
      aan haar tegen een door de rechtbank vast te stellen prijs van het goed, dat is vervat in de opgave, bedoeld in
      [artikel 11][ref2], eventueel met inbegrip van de ingevolge het tweede en derde lid van dat artikel mede in die
      opgave vermelde bestanddelen.

      2 Het verzoekschrift, dat met redenen moet zijn omkleed, kan worden gedaan binnen twee maanden te rekenen van de
      dag waarop burgemeester en wethouders de in [artikel 16, tweede lid][ref3] bedoelde termijn hebben overschreden
      of de dag van de ontvangst van een bericht ingevolge [artikel 17, eerste lid][ref4], inhoudende dat de gemeente
      afziet van de aankoop, of de dag waarop burgemeester en wethouders de in dat artikellid genoemde termijn hebben
      overschreden.

      3 De rechtbank doet binnen zes maanden na de ontvangst van het verzoekschrift bij beschikking uitspraak over het
      verzoek en bij toewijzing daarvan, tevens over de prijs. Zij beoordeelt of het redelijk is dat een verkoop aan
      de gemeente, gezien de bijzondere persoonlijke omstandigheden die terzake van belang kunnen zijn, achterwege zou
      blijven. Van de beschikking staat geen hoger beroep noch beroep in cassatie open.

      4 Bij toewijzing van het verzoek zijn de [artikelen 18][ref5]-[20][ref6] van toepassing. [Artikel 21][ref7] blijft
      buiten toepassing.

      5 De gehoudenheid van de gemeente tot medewerking aan de in het eerste lid bedoelde overdracht ingevolge een
      daartoe strekkende beschikking van de rechtbank vervalt indien de verkoper niet binnen een tijdvak van drie
      maanden, te rekenen van de dagtekening van die beschikking, zijn recht op die medewerking heeft geldend gemaakt in
      rechte, of buiten rechte door de gemeente bij exploit tot die medewerking uit te nodigen.

      6 Bij afwijzing van het verzoek heeft de verkoper gedurende een periode van drie jaren, te rekenen van de
      dagtekening van de rechterlijke beschikking, de vrijheid tot vervreemding aan derden voorzover betreft het in
      zijn opgave, bedoeld in [artikel 11][ref8], vermelde goed, met dien verstande dat die vervreemding moet betreffen
      alle in die opgave vermelde goederen te zamen, met inbegrip van het gedeelte en van het bedrijf of de onderneming,
      waarvan de verkoper bij het verstrekken van die opgave ingevolge het [tweede en derde lid van artikel 11][ref9]
      heeft geëist dat het mede in de verkoop zou worden betrokken.


