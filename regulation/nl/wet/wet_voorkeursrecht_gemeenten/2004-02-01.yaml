  - number: '7'
    text: |-
      1 Burgemeester en wethouders doen het ingevolge [artikel 6, tweede lid][ref1], aan het aldaar bedoelde voorstel
      verbonden rechtsgevolg vervallen:

      a. zodra en voorzover de in het ontwerp-plan begrepen gronden, waarop het voorstel betrekking heeft, ingevolge
      het bepaalde in [artikel 2, tweede lid][ref2], niet meer in aanmerking zouden komen voor een aanwijzing door de
      gemeenteraad bij een besluit als bedoeld in [artikel 2, eerste lid][ref3];

      b. zodra het structuurplan of het bestemmingsplan is vastgesteld of - indien en voorzover de gronden waarop
      hun voorstel betrekking heeft, onmiddellijk aansluitend aan die vaststelling door de gemeenteraad worden
      aangewezen bij een besluit als bedoeld in [artikel 2, eerste lid][ref4], - zodra dit besluit ingevolge
      [artikel 4, vierde lid][ref5], in werking treedt;

      c. terstond na verloop van vijf maanden, te rekenen van de dag, waarop het ontwerp-plan is ter inzage gelegd.

      2 Burgemeester en wethouders geven toepassing aan het vorige lid door het plaatsen van een aantekening bij de
      ingevolge [artikel 6, eerste lid][ref6], ter inzage liggende stukken en doen van het vervallen van het meergenoemde
      rechtsgevolg mededeling aan de betrokken eigenaren en beperkt gerechtigden zomede aan het desbetreffende kantoor
      van de Dienst voor het kadaster en de openbare registers. [Artikel 5][ref7] is daarbij van overeenkomstige
      toepassing.


