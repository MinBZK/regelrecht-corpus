  - number: '4'
    text: |-
      1 Het in [artikel 2][ref1] bedoelde raadsbesluit en de bijbehorende kadastrale kaart liggen voor een ieder ter
      gemeentesecretarie ter inzage. Burgemeester en wethouders maken de nederlegging bekend in de *Staatscourant*, in
      één of meer dag- of nieuwsbladen, die in de gemeente verspreid worden en voorts op de gebruikelijke wijze.

      2 Tevens zenden burgemeester en wethouders een kennisgeving van de aanwijzing aan ieder van de in het raadsbesluit
      vermelde eigenaren en beperkt gerechtigden. De kennisgeving bevat een zakelijke beschrijving van de betekenis van
      de aanwijzing.

      3 Voorts verstrekken burgemeester en wethouders een exemplaar van het besluit en de bijbehorende kadastrale kaart
      aan het desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers, ter overschrijving van
      die stukken in de openbare registers. Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek is niet van
      toepassing.

      4 Het raadsbesluit treedt in werking daags na dagtekening van de in het eerste lid bedoelde *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel2
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '2'
  - number: '5'
    text: |-
      1 Zodra en voorzover de bij het raadsbesluit gegeven aanwijzing niet meer beantwoordt aan de in
      [artikel 2, tweede lid][ref1], gestelde eisen of de in [artikel 2, vierde lid][ref2], bedoelde termijn is
      verstreken, doen burgemeester en wethouders de aanwijzing vervallen door het plaatsen van een desbetreffende
      aantekening bij de ingevolge [artikel 4, eerste lid][ref3], ter inzage liggende stukken, onder vermelding van
      de percelen en perceelsgedeelten waarop de aantekening betrekking heeft. Van het vervallen van de aanwijzing
      doen burgemeester en wethouders mededeling aan een ieder die in de kadastrale registratie ten aanzien van de
      desbetreffende zaken staat vermeld als eigenaar of rechthebbende op een beperkt recht waaraan die zaken zijn
      onderworpen, zomede aan het desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers. Het
      bepaalde in [artikel 4, derde lid][ref4], is van overeenkomstige toepassing.

      2 Een eigenaar of beperkt gerechtigde kan aan burgemeester en wethouders verzoeken, aan het bepaalde in het vorige
      lid uitvoering te geven. Burgemeester en wethouders beslissen binnen vier weken na de dag, waarop de aanvrage is
      ontvangen.


