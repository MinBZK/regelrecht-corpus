  - number: 8a
    text: |-
      1 Een voorstel van burgemeester en wethouders aan de gemeenteraad tot het nemen van een besluit
      als bedoeld in [artikel 8, eerste lid][ref1], kan worden bekendgemaakt door overeenkomstige
      toepassing van [artikel 2, derde lid][ref2], en [artikel 4, eerste tot en met derde lid][ref3].
      [Artikel 8, eerste lid, tweede volzin][ref4] is van overeenkomstige toepassing.

      2 Door toepassing van het vorige lid verkrijgt het aldaar bedoelde voorstel, daags na dagtekening van de
      Staatscourant waarin zijn nederlegging ter inzage is bekend gemaakt, ten aanzien van de daarbij betrokken gronden
      het rechtsgevolg van een besluit als bedoeld in [artikel 8, eerste lid][ref5], in dier voege, dat op die gronden
      de [artikelen 10][ref6]–24, 26 en 27 van toepassing zijn, met dien verstande dat in artikel 11, tweede lid, in de
      plaats van «,de aanwijzing, bedoeld in [artikel 2][ref7]» is te lezen «het voorstel, bedoeld in [artikel 8][ref8]».

      3 Burgemeester en wethouders doen het ingevolge het tweede lid aan het aldaar bedoelde voorstel verbonden
      rechtsgevolg vervallen:

      a. zodra en voor zover de in het voorstel begrepen gronden niet meer in aanmerking zouden komen voor aanwijzing bij
      een besluit als bedoeld in [artikel 8][ref9];

      b. voor zover de raad de in het voorstel begrepen gronden heeft aangewezen bij een besluit als bedoeld
      in [artikel 8, eerste lid][ref10], zodra dit besluit ingevolge [artikel 8, derde lid][ref11], juncto
      [artikel 4, vierde lid][ref12], in werking treedt;

      c. voor zover burgemeester en wethouders de in het voorstel begrepen gronden hebben opgenomen in een voorstel als
      bedoeld in [artikel 6][ref13], zodra het rechtsgevolg van dit voorstel ingevolge [artikel 6, tweede lid][ref14],
      juncto [artikel 4, vierde lid][ref15], in werking treedt;

      d. terstond na verloop van acht weken na dagtekening van het voorstel.

      4 [Artikel 7, tweede lid][ref16], is van overeenkomstige toepassing.


