  - number: '2'
    text: |-
      1 Bij besluit van de gemeenteraad kunnen gronden, begrepen in een structuurplan, waarbij aanwijzingen
      zijn gegeven voor de bestemming, of in een bestemmingsplan, worden aangewezen als gronden, waarop de
      [artikelen 10][ref1]-[24][ref2], [26][ref3] en [27][ref4] van toepassing zijn.

      2 Voor een aanwijzing als bedoeld in het eerste lid komen alleen in aanmerking de gronden, waaraan bij
      het structuurplan, onderscheidenlijk het bestemmingsplan een niet-agrarische bestemming is toegedacht,
      onderscheidenlijk gegeven en waarvan het gebruik afwijkt van dat plan.

      3 Het in het eerste lid bedoelde besluit vermeldt, onder verwijzing naar een bijgevoegde kadastrale kaart, ten
      aanzien van de onroerende zaken waarop het betrekking heeft, de kadastrale aanduiding daarvan, de grootte van elk
      der desbetreffende percelen volgens de kadastrale registratie en, indien een in de aanwijzing opgenomen onroerende
      zaak een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte. Het besluit vermeldt tevens
      volgens de kadastrale registratie de namen van de eigenaren van de in de aanwijzing opgenomen onroerende zaken en
      van de rechthebbenden op de beperkte rechten waaraan die zaken zijn onderworpen. Op de bijgevoegde kadastrale kaart
      zijn de aangewezen gronden en de bijbehorende percelen en perceelsgedeelten duidelijk aangegeven.

      4 Een besluit als bedoeld in het eerste lid, dat betrekking heeft op in een structuurplan begrepen gronden, geldt
      voor een daarbij te stellen termijn van ten hoogste twee jaar. De gemeenteraad kan de in de eerste zin bedoelde
      termijn éénmaal met ten hoogste één jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0003391#Artikel27
