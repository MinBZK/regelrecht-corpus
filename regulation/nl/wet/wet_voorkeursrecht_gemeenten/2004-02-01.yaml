        bwb_id: BWBR0002269
  - number: '12'
    text: |-
      1 Binnen acht weken nà de ontvangst van de in [artikel 11, eerste lid][ref1], bedoelde opgave maken burgemeester en
      wethouders bekend of de gemeente het daarin vermelde goed in beginsel wenst aan te kopen tegen een nader overeen te
      komen prijs.

      2 Indien burgemeester en wethouders binnen de in het vorige lid genoemde termijn hebben bekendgemaakt, dat de
      gemeente het in zijn opgave vermelde goed niet wenst aan te kopen, heeft de verkoper gedurende de periode van
      drie jaren na die bekendmaking de vrijheid tot vervreemding aan derden voorzover betreft het in zijn opgave
      vermelde goed, in dier voege dat die vervreemding moet betreffen alle in zijn opgave vermelde goederen te zamen,
      met inbegrip van het gedeelte en van het bedrijf of de onderneming, waarvan de verkoper bij het verstrekken van
      die opgave ingevolge [artikel 11, tweede en derde lid][ref2], heeft geëist, dat het mede in de verkoop zou worden
      betrokken.

      3 Bij overschrijding door burgemeester en wethouders van de in het eerste lid genoemde termijn is het bepaalde in
      het vorige lid van overeenkomstige toepassing, met dien verstande, dat de aldaar genoemde periode van drie jaren
      aanvangt na verloop van die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel11
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '11'
  - number: '13'
    text: |-
      Bij de bekendmaking van een besluit van burgemeester en wethouders, genomen ingevolge
      [artikel 12, eerste lid][ref1], en strekkende tot aankoop in beginsel door de gemeente tegen een nader overeen te
      komen prijs, wordt de inhoud van [artikel 14][ref2] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel14
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '14'
  - number: '14'
    text: |-
      De verkoper kan binnen vier weken na ontvangst van de in [artikel 13][ref1] bedoelde mededeling Gedeputeerde
      Staten verzoeken te worden ontheven van de verplichting, met de gemeente te onderhandelen over de verkoop, in dier
      voege, dat hij voorzover betreft het daarbij betrokken goed de vrijheid zal hebben tot vervreemding aan derden. Het
      verzoekschrift bevat de gronden waarop het verzoek berust. Bij het verzoekschrift wordt de in [artikel 13][ref2]
      bedoelde mededeling in afschrift overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel13
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '13'
  - number: '15'
    text: |-
      1 Gedeputeerde Staten beslissen op een verzoek tot ontheffing als bedoeld in [artikel 14][ref1], behoudens het
      bepaalde in de tweede zin van het tweede lid, binnen zes weken na ontvangst van het verzoek van de verkoper.

      2 Alvorens te beslissen op een verzoek tot ontheffing, als bedoeld in [artikel 14][ref2], stellen Gedeputeerde
      Staten burgemeester en wethouders en de verkoper in de gelegenheid de belangen der gemeente, onderscheidenlijk zijn
      belangen, toe te lichten. Zij kunnen te dien einde hun beschikking eenmaal voor drie weken verdagen. Zij willigen
      het verzoek tot ontheffing uitsluitend in op grond van gewichtige redenen en voor de duur van ten hoogste drie
      jaren. Zij kunnen daarbij beperkingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel14
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '14'
  - number: '16'
    text: |-
      1 Indien burgemeester en wethouders en de verkoper, nadat gehandeld is overeenkomstig het bepaalde in de
      [artikelen 12][ref1]-[15][ref2], in onderhandeling zijn getreden over de verkoop, kan de verkoper aan burgemeester
      en wethouders de wens te kennen geven, dat over de prijs advies zal worden uitgebracht door deskundigen, te
      benoemen door de rechter. Binnen twee weken na de ontvangst van het desbetreffende schriftelijke verzoek van de
      verkoper, verzoeken burgemeester en wethouders de rechtbank van het arrondissement waarin de gemeente is gelegen,
      een of meer deskundigen te benoemen, ten einde het bedoelde advies uit te brengen.

      2 Bij overschrijding door burgemeester en wethouders van de in het vorige lid genoemde termijn is
      [artikel 12, derde lid][ref3], van overeenkomstige toepassing.

      3 Bij hun verzoekschrift leggen burgemeester en wethouders over een gewaarmerkt afschrift van het verzoek van de
      verkoper.

      4 De rechtbank benoemt een of meer deskundigen, die zo spoedig mogelijk met redenen omkleed schriftelijk advies
      uitbrengen. De deskundigen stellen hun advies vast met overeenkomstige toepassing van de artikelen 40*b*-40*f* van
      de [onteigeningswet][ref4]. Zij leggen het advies neer ter griffie van de rechtbank en zenden daarvan een exemplaar
      aan ieder van beide partijen.

      5 De kosten van het verzoek en het advies van deskundigen komen ten laste van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0001842
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0003391
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0001842
  - number: '17'
    text: |-
      1 Binnen vier weken na dagtekening van het in [artikel 16][ref1] bedoelde advies kunnen burgemeester en wethouders
      met redenen omkleed de rechtbank verzoeken, een oordeel over de prijs te geven, of aan de verkoper berichten, dat
      zij zich met het advies kunnen verenigen dan wel dat de gemeente van de aankoop afziet.

      2 Ingeval burgemeester en wethouders binnen de in het eerste lid gestelde termijn aan de verkoper hebben bericht,
      dat zij zich met het advies kunnen verenigen, zijn zij, behoudens het bepaalde in het volgende lid, tot uiterlijk
      drie maanden na dagtekening van dat bericht tegenover de verkoper daaraan gebonden. Tot het einde van die termijn
      kan de verkoper de rechtbank met redenen omkleed verzoeken, een oordeel over de prijs te geven of aan burgemeester
      en wethouders berichten, dat hij zich met het advies kan verenigen, dan wel dat hij van de verkoop afziet. Na
      afloop van die termijn kan hij zich niet meer tegenover burgemeester en wethouders beroepen op hun in de eerste zin
      van dit lid bedoelde bericht, noch op hun besluit, bedoeld in [artikel 13][ref2].

      3 Ingeval de verkoper binnen de in het vorige lid gestelde termijn van drie maanden het aldaar bedoelde verzoek
      aan de rechtbank heeft gedaan, kunnen burgemeester en wethouders hem binnen twee weken na dagtekening van dat
      verzoek berichten dat de gemeente alsnog van de aankoop afziet. Bij gebreke van zodanig bericht geldt na afloop van
      laatstgenoemde termijn [artikel 21][ref3].

      4 Ingeval burgemeester en wethouders binnen de in het eerste lid genoemde termijn van vier weken of binnen de in
      het derde lid gestelde termijn van twee weken aan de verkoper hebben bericht, dat de gemeente van de aankoop afziet
      of alsnog afziet, is [artikel 12, tweede lid][ref4], van overeenkomstige toepassing.

      5 Bij overschrijding door burgemeester en wethouders van de in het eerste lid gestelde termijn is
      [artikel 12, derde lid][ref5], van overeenkomstige toepassing.

      6 Het bepaalde in het tweede tot en met vijfde lid blijft buiten toepassing indien de verkoper toepassing geeft
      aan [artikel 27][ref6].


