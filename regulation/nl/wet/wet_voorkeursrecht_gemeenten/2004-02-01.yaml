  - number: '11'
    text: |-
      1 Ter voldoening aan het bepaalde in [artikel 10, eerste lid][ref1], verstrekt de verkoper een schriftelijke
      opgave aan burgemeester en wethouders van het goed, dat onderwerp uitmaakt van de voorgenomen vervreemding, zomede
      ten aanzien van de desbetreffende onroerende zaken, de kadastrale aanduiding daarvan, de grootte van elk der
      desbetreffende percelen volgens de kadastrale registratie en, indien een onroerende zaak waarop de voorgenomen
      vervreemding betrekking heeft, een gedeelte van een perceel uitmaakt, bovendien de grootte van dat gedeelte.

      2 Indien de voorgenomen vervreemding betrekking heeft op onroerende zaken die slechts ten dele in de aanwijzing,
      bedoeld in [artikel 2][ref2], zijn opgenomen maar een samenhangend geheel vormen, kan de verkoper, onverminderd
      het bepaalde in Hoofdstuk I, paragraaf 9A van de [Pachtwet][ref3], eisen dat dit geheel van onroerende zaken wordt
      betrokken in de mogelijke aankoop door de gemeente.

      3 De verkoper kan eisen, dat in de verkoop wordt betrokken het bedrijf of de onderneming waarin de onroerende zaken
      als onderdeel daarvan worden geëxploiteerd.

      4 Burgemeester en wethouders bevestigen ten spoedigste schriftelijk de ontvangst van de opgave.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002269
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel11
