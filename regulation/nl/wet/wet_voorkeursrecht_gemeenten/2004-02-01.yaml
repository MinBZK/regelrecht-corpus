    text: |-
      Gronden die aangewezen waren bij een besluit als bedoeld in [artikel 2, eerste lid][ref1], dat
      betrekking had op in een structuurplan begrepen gronden, of betrokken waren bij een voorstel, als
      bedoeld in [artikel 6, eerste lid][ref2], dan wel aangewezen waren bij een besluit als bedoeld in
      [artikel 8, eerste lid][ref3], of betrokken waren bij een voorstel als bedoeld in [artikel 8][ref4], kunnen
      niet binnen twee jaar na het verstrijken van de in [artikel 2, vierde lid][ref5], bedoelde termijn of na het
      in [artikel 7, eerste lid][ref6], bedoelde vervallen van het rechtsgevolg, dan wel na het verstrijken van de
      in [artikel 8, vierde lid][ref7], bedoelde termijn of na het in [artikel 8][ref8], bedoelde vervallen van het
      rechtsgevolg opnieuw bij een zodanig besluit worden aangewezen of bij een zodanig voorstel worden betrokken.


