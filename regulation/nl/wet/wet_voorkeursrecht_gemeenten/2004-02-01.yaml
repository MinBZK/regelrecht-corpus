  - number: '21'
    text: |-
      Gedurende drie maanden na dagtekening van de beschikking van de rechtbank is de gemeente, indien de verkoper zulks
      verlangt, verplicht haar medewerking te verlenen aan de totstandkoming van een akte tot levering aan haar van het
      betrokken goed tegen betaling aan de verkoper van de door de rechtbank bij haar beschikking bepaalde prijs.
    url: https://wetten.overheid.nl/BWBR0003391/2004-02-01#Artikel21
  - number: '24'
    text: |-
      1 De inschrijving in de in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1] bedoelde openbare
      registers van een akte, behelzende een vervreemding anders dan aan de gemeente, vindt alleen plaats indien onder
      de akte is opgenomen een notariële verklaring, houdende, hetzij dat de betrokken onroerende zaak niet is opgenomen
      in een aanwijzing als bedoeld in [artikel 2][ref2] of [artikel 8][ref3] dan wel in een voorstel als bedoeld in
      [artikel 6][ref4] of [artikel 8a][ref5], hetzij dat de vervreemding niet in strijd is met het bepaalde in de
      [artikelen 10][ref6]-[23][ref7] van deze wet.

      2 Voor de toepassing van het vorige lid wordt met de daar bedoelde notariële verklaring gelijkgesteld de verklaring
      van een persoon bedoeld in [artikel 91 van de Overgangswet nieuw Burgerlijk Wetboek][ref8], die overeenkomstig het
      daar bepaalde een onderhandse akte tot levering heeft opgesteld.


