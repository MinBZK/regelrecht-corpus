  - number: '25'
    text: |-
      1 Indien en voorzover na de overdracht van een onroerende zaak of van een beperkt recht waaraan zodanige zaak
      is onderworpen, aan de gemeente ingevolge de [artikelen 10][ref1]-[24][ref2] en [26][ref3], welke van toepassing
      waren krachtens een besluit als bedoeld in [artikel 2, eerste lid][ref4], of een voorstel als bedoeld in
      [artikel 6, eerste lid][ref5], voor deze onroerende zaak, zonder dat de in [artikel 2, tweede lid][ref6], bedoelde
      bestemming is verwerkelijkt, bij een onherroepelijk goedgekeurd bestemmingsplan een bestemming is aangewezen,
      ingevolge welke het laatstgenoemde artikellid de totstandkoming van dat besluit of voorstel zou hebben uitgesloten,
      kan de verkoper vorderen dat de gemeente hem zal vergoeden de schade welke hij als gevolg van die overdracht mocht
      hebben geleden.

      2 Gelijke bevoegdheid heeft de verkoper na de overdracht ingevolge de [artikelen 10][ref7]–24 en 26, welke
      van toepassing waren krachtens een besluit als bedoeld in [artikel 8, eerste lid][ref8], dan wel een voorstel
      als bedoeld in [artikel 8][ref9], voor zover de bij die overdracht betrokken onroerende zaak niet binnen de in
      [artikel 8, vierde lid][ref10], genoemde termijn is opgenomen in een structuur- of bestemmingsplan dan wel een
      ontwerp daarvoor, waarbij de bij het raadsbesluit aan de betrokken onroerende zaak ingevolge [artikel 8][ref11]
      toegedachte bestemming is gehandhaafd, onderscheidenlijk niet binnen de in [artikel 8][ref12], genoemde termijn is
      opgenomen in een besluit als bedoeld in [artikel 8][ref13].


