preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet gemeenschappelijke regelingen en enkele andere
    wetten te wijzigen teneinde provincies en gemeenten de mogelijkheid te bieden, de afstemming van de ruimtelijke
    problematiek in een – door de provincie bepaald – gebied met stedelijke kenmerken te realiseren door de instelling
    van een openbaar lichaam waaraan bij wet taken worden toegekend;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019114/2006-01-01#ArtikelAanhef
articles:
  - number: XVII
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen vijf jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019114/2006-01-01#ArtikelXVII
  - number: XVIII
    text: |-
      Indien voor het tijdstip waarop deze wet in werking treedt, een aanvraag om een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] is ingediend bij het dagelijks bestuur van een regionaal openbaar
      lichaam als bedoeld in de Kaderwet bestuur in verandering en op die aanvraag nog niet is beslist, wordt op de
      aanvraag beslist door burgemeester en wethouders van de gemeente waarin de inrichting geheel of in hoofdzaak zal
      zijn of is gelegen. De behandeling van de aanvraag wordt door burgemeester en wethouders voortgezet in de staat
      waarin zij zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0019114/2006-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.1'
  - number: XIX
    text: |-
      1 De [Kaderwet bestuur in verandering][ref1] wordt ingetrokken.

      2 Een gemeenschappelijke regeling, getroffen krachtens de [Kaderwet bestuur in verandering][ref2], geldt
      met ingang van de datum van inwerkingtreding van deze wet als een regeling, tot stand gekomen op basis van
      [hoofdstuk XI van de Wet gemeenschappelijke regelingen][ref3].

      3 Het dagelijks bestuur van een openbaar lichaam, ingesteld bij een gemeenschappelijke regeling als bedoeld in het
      tweede lid, wijzigt binnen acht weken na inwerkingtreding van deze wet de gemeenschappelijke regeling voor zover
      dat noodzakelijk is in verband met de inwerkingtreding van deze wet. De gewijzigde regeling wordt gezonden aan
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, die de regeling opneemt in het register, bedoeld in
      [artikel 109, eerste lid][ref4], en aan gedeputeerde staten.

      4 Indien het bestuur van een gemeente die deel uitmaakt van een gemeenschappelijke regeling waarbij een openbaar
      lichaam als bedoeld in het tweede lid is ingesteld, binnen drie maanden na inwerkingtreding van deze wet
      gedeputeerde staten meedeelt dat het een besluit als bedoeld in [artikel 110, eerste lid][ref5], gewenst acht en
      indien gedeputeerde staten naar aanleiding van deze mededelingen gemeenten uitnodigen tot aanpassing of opheffing
      van de plusregio over te gaan, vindt de besluitvorming over deze aanpassing of opheffing plaats binnen een jaar na
      inwerkingtreding van deze wet. De [artikelen 114][ref6] en [120][ref7] zijn van overeenkomstige toepassing.


