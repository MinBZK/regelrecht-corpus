  - number: '2'
    text: |-
      Aan de secretaris-generaal blijft voorbehouden de bevoegdheid om besluiten te nemen, indien deze worden genomen op
      grond van:

      a. [artikel 7:611][ref1] jo. [artikel 7:658 van het Burgerlijk Wetboek][ref2], voor zover de schadeloosstelling
      betrekking heeft op immateriële schade, of materiële schade boven een bedrag van € 10.000,–;

      b. een financiële vergoeding in verband met de beëindiging van de arbeidsovereenkomst die de uitkomst van de
      berekening overeenkomstig een transitievergoeding in de zin van [artikel 7:673 van het Burgerlijk Wetboek][ref3],
      vermeerderd met € 10.000, overstijgt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel611
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel658
