  - number: '3'
    text: |-
      De plaatsvervangend secretaris-generaal wordt aangewezen en volmacht verleend om op te treden als leidinggevende
      in de zin van paragraaf 1.3 van de CAO Rijk ten aanzien van de hoofden van de taakorganisaties als bedoeld in
      [artikel 2, derde lid, van het Organisatiebesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0041639/2023-05-25#Artikel3
    references:
