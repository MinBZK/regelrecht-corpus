  text: |-
    Gelet op artikel 3, eerste lid, onder a, van het Mandaatbesluit Ministerie van Justitie en Veiligheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041639/2023-05-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Van het ingevolge [artikel 2 van het Mandaatbesluit Ministerie van Justitie en Veiligheid][ref1] aan de
      secretaris-generaal verleende mandaat wordt ondermandaat verleend aan de plaatsvervangend secretaris-generaal
      ten aanzien van de aangelegenheden die de eigenaarsrol betreffen zoals bedoeld in de Regeling agentschappen
      en de circulaire 'Governance ten aanzien van zbo’s’, voor de diensten en baten-lastenagentschappen genoemd in
      [artikel 2, derde lid van het Organisatiebesluit][ref2], de Inspectie Justitie en Veiligheid, het secretariaat
      van het Schadefonds Geweldsmisdrijven, het instituut Nationaal rapporteur mensenhandel en seksueel geweld
      tegen kinderen alsmede de in [artikel 3, eerste lid van het Organisatiebesluit][ref3] genoemde zelfstandige
      bestuursorganen.

      2 De in het eerste lid genoemde aangelegenheden omvatten in ieder geval de besluiten ten aanzien van benoeming
      en bezoldiging, verplaatsing, disciplinaire maatregelen en ontslag van hoofden van de diensten en baten-
      lastenagentschappen genoemd in [artikel 2, derde lid van het Organisatiebesluit][ref4] en het secretariaat van het
      Schadefonds Geweldsmisdrijven.


