        bwb_id: BWBR0040293
        artikel: '2'
  - number: '4'
    text: |-
      De plaatsvervangend secretaris-generaal kan verleend ondermandaat op grond van dit besluit niet verder
      ondermandateren.
    url: https://wetten.overheid.nl/BWBR0041639/2023-05-25#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 19 oktober 2018.
    url: https://wetten.overheid.nl/BWBR0041639/2023-05-25#Artikel5
