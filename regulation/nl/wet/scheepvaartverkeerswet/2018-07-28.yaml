$id: scheepvaartverkeerswet
regulatory_layer: WET
publication_date: '2020-03-04'
valid_from: '2018-07-28'
bwb_id: BWBR0004364
url: https://wetten.overheid.nl/BWBR0004364/2018-07-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op de ontwikkelingen in het scheepvaartverkeer en in de
    ordening daarvan alsmede op de bij de ordening van dat verkeer betrokken belangen, wenselijk is de bepalingen
    met betrekking tot het scheepvaartverkeer op de binnenwateren en op zee te herzien alsmede, gezien hun onderlinge
    samenhang, onder te brengen in één wettelijke regeling, welke mede als grondslag kan dienen voor de uitvoering van
    verdragen en van besluiten van volkenrechtelijke organisaties, voorzover deze het Koninkrijk binden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.b
    text: |-
      schip: elk vaartuig, met inbegrip van een vaartuig zonder waterverplaatsing en een watervliegtuig, dat feitelijk
      wordt gebruikt of geschikt is om te worden gebruikt als middel tot verplaatsing te water;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.c
    text: 'scheepvaartverkeer: verkeer van schepen en andere vaartuigen;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.d
    text: |-
      scheepvaartwegen: voor het openbaar scheepvaartverkeer openstaande binnenwateren en de Nederlandse territoriale
      zee, daaronder begrepen de daarin aanwezige waterstaatswerken;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.e
    text: |-
      het voeren van een schip of ander vaartuig: het feitelijk de leiding hebben over een schip of ander vaartuig wat
      het deelnemen daarvan aan het scheepvaartverkeer betreft;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.f
    text: 'verkeersdeelnemer: degene die een schip of ander vaartuig voert;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.g
    text: |-
      verkeersteken: een in, naast of boven een scheepvaartweg aangebracht voorwerp of aangebrachte combinatie van
      voorwerpen waarmee aan het scheepvaartverkeer wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.g.1°
    text: een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg, of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.g.2°
    text: |-
      een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.h
    text: |-
      bekendmaking met dezelfde strekking als een verkeersteken: een schriftelijke mededeling aan het scheepvaartverkeer
      waarmee aan dat verkeer wordt gegeven:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.h.1°
    text: een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg, of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.h.2°
    text: |-
      een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.i
    text: |-
      verkeersbegeleiding: het door middel van een samenstel van personele en infrastructurele voorzieningen op
      stelselmatige en interactieve wijze bewerkstelligen en onderhouden van een veilig en vlot scheepvaartverkeer;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.j
    text: |-
      verkeersinformatie: een door een daartoe bevoegd persoon gegeven inlichting aan een of meerdere verkeersdeelnemers
      dan wel aan anderen met betrekking tot een scheepvaartweg of een gedeelte daarvan dan wel het scheepvaartverkeer
      of afzonderlijke schepen daarop, waarbij deze inlichting mede kan bestaan uit vaarweginformatie en tactische
      verkeersinformatie;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.k
    text: |-
      Scheldereglement: het reglement ter uitvoering van artikel IX van het Tractaat van 19 april 1839, en van Hoofdstuk
      II, afdelingen 1 en 2, van het Tractaat van 5 november 1842 betreffende het loodswezen en het gemeenschappelijk
      toezicht (Trb. 1995, 48) zoals deze sedertdien is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.l
    text: |-
      verkeersaanwijzing: een door een daartoe bevoegd persoon aan een of meerdere verkeersdeelnemers gegeven gebod om
      een bepaald resultaat in het verkeersgedrag te bewerkstelligen of opgelegd verbod van een bepaald resultaat in
      het verkeersgedrag;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.m
    text: |-
      Herziene Rijnvaartakte: de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte, met bijlagen en
      slotprotocol, (*Trb.* 1955, 161), zoals deze sedertdien is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.n
    text: |-
      Nederlandse zeeschepen: zeeschepen die onder de Nederlandse vlag varen, met uitzondering van zeeschepen die het
      recht daartoe ontlenen aan de regels die in Aruba, Curaçao of Sint Maarten terzake gelden;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.o
    text: |-
      verwerken van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke: hetgeen daaronder wordt verstaan in
      artikel 4, onderdelen 1, 2 en 7, van de Algemene verordening gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.p
    text: |-
      River Information Services: de geharmoniseerde informatiediensten ter ondersteuning van het verkeers-
      en vervoersmanagement voor de binnenvaart, met inbegrip van de technisch haalbare koppelingen met andere
      vervoerswijzen dan wel met commerciële activiteiten, niet zijnde interne commerciële activiteiten tussen betrokken
      bedrijven;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.q
    text: 'vaarweginformatie: geografische, hydrologische en administratieve informatie over de scheepvaartweg;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.r
    text: |-
      tactische verkeersinformatie: informatie waarop onmiddellijke navigatiebeslissingen in de actuele verkeerssituatie
      en de nabije geografische omgeving zijn gebaseerd;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.s
    text: |-
      verdrag inzake het gemeenschappelijk nautisch beheer: het op 21 december 2005 te Middelburg totstandgekomen verdrag
      tussen het Koninkrijk der Nederlanden en het Vlaams Gewest inzake het gemeenschappelijk nautisch beheer in het
      Scheldegebied (Trb. 2005, 312);
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.t
    text: |-
      vaarbewijs: document ten bewijze van de bevoegdheid om op de Nederlandse binnenwateren een schip te voeren,
      waaronder begrepen een daarmee vergelijkbaar document dat is afgegeven door een buitenlandse autoriteit;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.u
    text: |-
      snelle motorboot: schip dat een lengte heeft van minder dan 20 meter en dat bij gebruikmaking van zijn mechanische
      middelen tot voortbeweging, sneller dan 20 km per uur ten opzichte van het water kan varen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.1.v
    text: |-
      de Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '1.2'
    text: |-
      In de [artikelen 10 tot en met 13][ref1], [15 tot en met 16a][ref2], [27 tot en met 29][ref3] en [35][ref4] van
      deze wet en in de op deze wet berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel35
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: '35'
        hoofdstuk: '7'
  - number: 1.2.a
    text: 'kapitein: degene die is belast met het gezag over een zeeschip;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.2.b
    text: 'loods: degene die bij of krachtens de wet of verdrag bevoegd is verklaard als loods op te treden;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.2.c
    text: 'zeeschip: een schip dat blijkens zijn constructie uitsluitend of in hoofdzaak is bestemd voor de vaart ter zee.'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen zaken die geen schip zijn, onderscheidenlijk schepen die geen zeeschepen
      zijn, voor de toepassing van deze wet en de daarop berustende bepalingen met een schip onderscheidenlijk een
      zeeschip worden gelijkgesteld, dan wel deze wet en de daarop berustende bepalingen niet van toepassing worden
      verklaard op zaken die een schip zijn, onderscheidenlijk schepen die een zeeschip zijn.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: '1.4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder het beheer van een scheepvaartweg verstaan het
      waterstaatkundig beheer daarvan dan wel, in afwijking hiervan, het vaarwegbeheer van die scheepvaartweg indien het
      laatstbedoelde beheer afzonderlijk bij een openbaar lichaam berust.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: '1.5'
    text: 'In deze wet wordt, tenzij daarin anders is bepaald, mede verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.5.a
    text: |-
      schip: een samenstel van schepen of van een of meer schepen met een of meer andere vaartuigen, waarvan ten minste
      één schip deel uitmaakt dat ter voortbeweging gebruik maakt van zijn motor en dat dient voor het voortbewegen of
      het sturen van het samenstel;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: 1.5.b
    text: |-
      zeeschip: een samenstel van zeeschepen of van een of meer zeeschepen met een of meer andere schepen of andere
      vaartuigen, waarvan ten minste één schip deel uitmaakt dat ter voortbeweging gebruik maakt van een of meer van zijn
      motoren en dat dient voor het voortbewegen of sturen van het samenstel.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel1
  - number: '2.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen is dan wel zijn, tenzij daarin anders is
      bepaald, het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.1.a
    text: indien het betreft een scheepvaartweg in beheer bij
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.1.a.1°
    text: 'het Rijk: Onze Minister;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.1.a.2°
    text: 'een provincie: gedeputeerde staten;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.1.a.3°
    text: 'een gemeente: burgemeester en wethouders;'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.1.a.4°
    text: |-
      een openbaar lichaam als bedoeld in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref1]: het
      dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 2.1.b
    text: |-
      indien het betreft een scheepvaartweg die niet in beheer is bij enig openbaar lichaam: burgemeester en wethouders
      van de gemeente waarin de scheepvaartweg is gelegen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, 1°, zijn burgemeester en wethouders van een gemeente het bevoegd
      gezag met betrekking tot het gedeelte van de Nederlandse territoriale zee dat binnen het gebied van de gemeente is
      gelegen. Het in de vorige volzin bepaalde lijdt uitzondering indien dit gedeelte van de Nederlandse territoriale
      zee of een deel daarvan
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.2.a
    text: |-
      van belang is voor het doorgaande scheepvaartverkeer dan wel het scheepvaartverkeer van of naar een Nederlandse
      haven of ander Nederlands binnenwater en als zodanig door Onze Minister is aangewezen bij een in de Staatscourant
      bekend te maken besluit, of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: 2.2.b
    text: |-
      door Onze Minister van Defensie als militair oefengebied is aangewezen bij een in de Staatscourant bekend te maken
      besluit.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: '2.3'
    text: |-
      Ten aanzien van een scheepvaartweg in beheer bij een waterschap bepalen provinciale staten wie het bevoegd gezag
      is. Zij wijzen als zodanig aan het dagelijks bestuur van het waterschap voor zover dit verenigbaar is met de in het
      reglement aan het waterschap ter behartiging opgedragen taken, en in andere gevallen burgemeester en wethouders van
      de gemeente waarin de scheepvaartweg is gelegen of gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: '2.4'
    text: |-
      In afwijking van het eerste lid, onderdeel a, 3°, en onderdeel b, en van het derde lid kunnen provinciale staten
      ten aanzien van een scheepvaartweg als bedoeld in die bepalingen in het belang van de eenheid van de ordening van
      het doorgaande scheepvaartverkeer op die scheepvaartweg gedeputeerde staten als bevoegd gezag aanwijzen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: '2.5'
    text: |-
      Onze Minister kan voor een scheepvaartweg in beheer bij het Rijk een van de in het eerste lid, onderdeel a,
      genoemde organen van een openbaar lichaam als bevoegd gezag aanwijzen. Aan een dergelijke aanwijzing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel2
  - number: '3.1'
    text: |-
      Toepassing van de [artikelen 4][ref1], [11][ref2] en [12][ref3] kan, behoudens het bepaalde in het tweede lid,
      slechts geschieden in het belang van:


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel12
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.1.a
    text: het verzekeren van de veiligheid en het vlotte verloop van het scheepvaartverkeer;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: 3.1.b
    text: het instandhouden van scheepvaartwegen en het waarborgen van de bruikbaarheid daarvan;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: 3.1.c
    text: |-
      het voorkomen of beperken van schade door het scheepvaartverkeer aan de waterhuishouding, oevers en waterkeringen,
      of werken gelegen in of over scheepvaartwegen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: 3.1.d
    text: het voorkomen of beperken van externe veiligheidsrisico’s in verband met schepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: 3.1.e
    text: het voorkomen of beperken van verontreiniging door schepen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: '3.2'
    text: |-
      Toepassing van [artikel 4][ref1] ten behoeve van een in het eerste lid genoemd belang kan mede geschieden in het
      belang van het voorkomen of beperken van:


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.2.a
    text: hinder of gevaar door het scheepvaartverkeer voor personen die zich anders dan op een schip te water bevinden;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: 3.2.b
    text: |-
      schade door het scheepvaartverkeer aan de landschappelijke of natuurwetenschappelijke waarden van een gebied waarin
      scheepvaartwegen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel3
  - number: '4.1'
    text: 'Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.1.a
    text: het deelnemen aan het scheepvaartverkeer op scheepvaartwegen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.1.b
    text: verkeerstekens;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.1.c
    text: bekendmakingen met dezelfde strekking als een verkeersteken;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.1.d
    text: verkeersaanwijzingen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.1.e
    text: |-
      het ontvangen, bewaren en verstrekken van gegevens met betrekking tot de scheepvaart door organisaties en personen
      die niet deelnemen aan het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.2'
    text: 'De in het eerste lid, onder a, bedoelde regels kunnen slechts inhouden:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a
    text: 'verplichtingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.1°
    text: het varen en het ligplaats nemen met schepen en andere vaartuigen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.2°
    text: het tonen van optische tekens door schepen en andere vaartuigen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.3°
    text: het geven van geluidsseinen door schepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.4°
    text: de aanwezigheid en het gebruik van bepaalde navigatiemiddelen aan boord van schepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.5°
    text: de aanwezigheid en het gebruik van bepaalde communicatiemiddelen aan boord van schepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.a.6°
    text: het aanbrengen van kentekens op schepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.b
    text: |-
      andere verplichtingen van verkeersdeelnemers of andere personen aan boord van schepen en andere vaartuigen met
      betrekking tot het deelnemen aan het scheepvaartverkeer;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: 4.2.c
    text: |-
      verplichtingen van andere personen dan die genoemd in onderdeel b, met betrekking tot het deelnemen aan het
      scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor daarin aangewezen scheepvaartwegen in afwijking van of in aanvulling
      op de krachtens het eerste lid, onder a, te stellen regels andere regels met betrekking tot het deelnemen aan
      het scheepvaartverkeer worden gesteld. Daarin kunnen aan degenen die een schip voeren, naast verplichtingen met
      betrekking tot de in het tweede lid bedoelde onderwerpen, verplichtingen worden opgelegd, die al dan niet gericht
      zijn op het deelnemen aan verkeersbegeleiding en onder andere betrekking hebben op het melden van aankomst, vertrek
      of positie van een schip, alsmede van gegevens met betrekking tot het schip, de daarmee vervoerde lading, of de uit
      te voeren reis.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.4'
    text: |-
      Ter uitvoering van het eerste lid, onderdeel e, kunnen ten behoeve van de River Information Services
      persoonsgegevens worden verwerkt. De verwerking van deze gegevens vindt plaats teneinde een goede uitvoering
      te kunnen geven aan de bij of krachtens deze wet gestelde voorschriften omtrent de toepassing van River
      Information Services. De bij of krachtens algemene maatregel van bestuur aangewezen bevoegde autoriteit is
      verwerkingsverantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.5'
    text: |-
      Ter uitvoering van het tweede lid, onderdeel b, worden persoonsgegevens over gezondheid als bedoeld in artikel
      4, onderdeel 15, van de Algemene verordening gegevensbescherming en persoonsgegevens van strafrechtelijke aard
      als bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] verwerkt.
      De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of de aanvragers van bij algemene
      maatregel van bestuur aangewezen Rijnpatenten voldoen of niet meer voldoen aan de wettelijke vereisten voor de
      verlening van deze patenten. De bij of krachtens algemene maatregel van bestuur aangewezen bevoegde autoriteit is
      verwerkingsverantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '4.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bescherming van de persoonsgegevens
      die in het kader van River Information Services worden verkregen alsmede met betrekking tot de bescherming van de
      persoonlijke levenssfeer bij de toepassing van River Information Services.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.7'
    text: |-
      In de krachtens het eerste lid, onderdelen a of e, het derde en zesde lid te stellen regels kan met betrekking tot
      daarin aangewezen onderdelen Onze Minister bevoegd worden verklaard tot het stellen van nadere regels.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '4.8'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de apparatuur en de
      softwaretoepassingen die ten behoeve van River Information Services worden gebruikt door personen en organisaties
      die niet deelnemen aan het scheepvaartverkeer als bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel4
  - number: '5.1'
    text: |-
      Beslissingen met betrekking tot het aanbrengen of verwijderen van een verkeersteken worden genomen door het bevoegd
      gezag. Dit gezag draagt zorg voor het aanbrengen of verwijderen van verkeerstekens.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel5
  - number: '5.2'
    text: |-
      Het bevoegd gezag kan van de bevoegdheid tot het nemen van beslissingen als bedoeld in het eerste lid machtiging
      verlenen aan degene die is belast met de uitoefening van de bij of krachtens deze wet verleende bevoegdheden ten
      aanzien van de deelname aan het scheepvaartverkeer op de desbetreffende scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel5
  - number: '6.1'
    text: |-
      Een verkeersteken dat een gebod of verbod dan wel de opheffing van een gebod of verbod aangeeft, wordt, behoudens
      in bij algemene maatregel van bestuur aan te geven bijzondere omstandigheden, niet aangebracht of verwijderd dan
      nadat het desbetreffende besluit door de zorg van het bevoegd gezag is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel6
  - number: '6.2'
    text: Een belanghebbende kan tegen een besluit als bedoeld in het eerste lid beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de totstandkoming van besluiten als bedoeld
      in het eerste lid en de wijze van bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel6
  - number: '7.1'
    text: |-
      Van een gebod of verbod, aangegeven met een verkeersteken, kan door het bevoegd gezag, zonodig onder beperkingen,
      vrijstelling of ontheffing worden verleend. Aan een besluit tot vrijstelling of ontheffing kunnen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel7
  - number: '7.2'
    text: |-
      Bij de toepassing van het eerste lid wordt rekening gehouden met het belang of de belangen, ten dienste waarvan het
      desbetreffende gebod of verbod is gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel7
  - number: '7.3'
    text: |-
      Een besluit met betrekking tot een vrijstelling of een kennisgeving van een besluit met betrekking tot een
      ontheffing wordt door de zorg van het bevoegd gezag bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel7
  - number: '7.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de totstandkoming van besluiten met
      betrekking tot een vrijstelling of een ontheffing en de wijze van bekendmaking als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel7
  - number: '7.5'
    text: |-
      Het bevoegd gezag kan van de bevoegdheid, bedoeld in het eerste lid, mandaat verlenen aan degene die is belast
      met de uitoefening van de bij of krachtens deze wet verleende bevoegdheden ten aanzien van de deelname aan het
      scheepvaartverkeer op de desbetreffende scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel7
  - number: '8'
    text: |-
      De [artikelen 5 tot en met 7][ref1] zijn van overeenkomstige toepassing met betrekking tot bekendmakingen met
      dezelfde strekking als een verkeersteken.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel5
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke personen bevoegd zijn tot het geven van
      verkeersinformatie dan wel tot het geven van verkeersaanwijzingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel9
  - number: '9.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen waaraan in het
      eerste lid bedoelde personen wat opleiding, kundigheid en ervaring betreft moeten voldoen voor de uitvoering van de
      in dat lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel9
  - number: '9.3'
    text: |-
      Indien krachtens de in het tweede lid bedoelde maatregel regels worden gesteld voor ambtenaren van politie,
      aangesteld voor de uitvoering van de politietaak, worden die regels gesteld in overeenstemming met Onze Minister
      van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel9
  - number: '10.1'
    text: |-
      De kapitein is verplicht om tijdens de vaart van het zeeschip op de in de bijlage van deze wet aangegeven
      scheepvaartwegen gebruik te maken van de diensten van een loods.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: '10.2'
    text: |-
      Van de in het eerste lid bedoelde verplichting kan ten aanzien van een of meer in de bijlage van deze wet
      aangegeven scheepvaartwegen bij algemene maatregel van bestuur vrijstelling worden verleend voor:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: 10.2.a
    text: daarbij aangewezen categorieën van zeeschepen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: 10.2.b
    text: |-
      zeeschepen indien de kapitein of een aan boord zijnde stuurman tijdens de vaart op de desbetreffende scheepvaartweg
      in het bezit is van een verklaring van vrijstelling en als verkeersdeelnemer optreedt. Een verklaring van
      vrijstelling wordt afgegeven aan degene die voldoet aan daartoe bij algemene maatregel van bestuur te stellen
      eisen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de afgifte van
      de verklaring van vrijstelling en de opleiding en examinering van degenen die voor een dergelijke verklaring in
      aanmerking wensen te komen en worden een of meer instanties aangewezen die, naast de besturen van de regionale
      loodsencorporaties, met het verzorgen van een opleiding en het afnemen van examens zijn belast.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: '10.3'
    text: |-
      Van de in het eerste lid bedoelde verplichting kan in bij algemene maatregel van bestuur te bepalen omstandigheden
      of gevallen en op een in die maatregel aan te geven wijze door Onze Minister of een in die maatregel aangewezen
      ander gezag, zonodig onder beperkingen, voor een zeeschip ontheffing worden verleend. Aan een besluit tot
      ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: '10.4'
    text: |-
      Bij de toepassing van het tweede en derde lid wordt rekening gehouden met de in [artikel 3, eerste lid][ref1],
      bedoelde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel3
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      Ter uitvoering van de aanvraag om afgifte van een verklaring van vrijstelling, de periodieke controle op de
      houders van verklaringen en de intrekking van verklaringen, worden persoonsgegevens over gezondheid als bedoeld
      in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming verwerkt. De verwerking van deze
      gegevens vindt plaats teneinde te kunnen beoordelen of aan de wettelijke vereisten voor de afgifte van een
      verklaring is voldaan onderscheidenlijk niet meer wordt voldaan. Het bij of krachtens algemene maatregel van
      bestuur aangewezen bestuursorgaan dat is belast met de afgifte en de intrekking van verklaringen van vrijstelling
      is verwerkingsverantwoordelijke voor deze verwerking.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel10
  - number: '11.1'
    text: |-
      In bij algemene maatregel van bestuur te bepalen omstandigheden of gevallen en op een in die maatregel aan te geven
      wijze kan door Onze Minister of een in die maatregel aangewezen ander gezag
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: 11.1.a
    text: |-
      de kapitein die op grond van [artikel 10, tweede lid][ref1], van de loodsplicht is vrijgesteld, niettemin worden
      verplicht om tijdens de vaart van het zeeschip op een in de bijlage van deze wet aangegeven scheepvaartweg gebruik
      te maken van de diensten van een loods;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 11.1.b
    text: |-
      de kapitein worden verplicht om tijdens de vaart van het zeeschip op een door genoemde Minister of dat ander gezag
      aangewezen scheepvaartweg die niet is aangegeven in de bijlage van deze wet, gebruik te maken van de diensten van
      een loods; en
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: 11.1.c
    text: 'de kapitein worden verplicht ten behoeve van het loodsen aanwijzingen op te volgen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: 11.1.c.1°
    text: het gebruik van meer dan één loods; en
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: 11.1.c.2°
    text: |-
      het gebruik maken van de diensten van een loods aan boord van het zeeschip, dan wel vanaf de wal of vanaf een ander
      schip.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: '11.2'
    text: |-
      De maatregel, bedoeld in het eerste lid, heeft geen betrekking op scheepvaartwegen waarop bij of krachtens
      hoofdstuk III van het Scheldereglement een loodsplicht geldt.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel11
  - number: '12.1'
    text: Bij algemene maatregel van bestuur worden voor kapiteins verplichtingen ten behoeve van het loodsen geregeld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: '12.2'
    text: 'Deze verplichtingen hebben slechts betrekking op:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: 12.2.a
    text: het aanvragen van een loods;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: 12.2.b
    text: de dienstverrichting van een loods;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: 12.2.c
    text: het verstrekken van voor het loodsen noodzakelijke inlichtingen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: 12.2.d
    text: het treffen van voor het loodsen noodzakelijke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: '12.3'
    text: |-
      In de krachtens het eerste lid te stellen regels kan met betrekking tot bepaalde onderdelen daarvan Onze Minister
      bevoegd worden verklaard nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel12
  - number: '13'
    text: |-
      Het bepaalde in deze paragraaf is van overeenkomstige toepassing ten aanzien van een schip dat geen zeeschip is en
      degene die daarover de leiding heeft, indien dit schip zich op zee bevindt.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel13
  - number: '14.1'
    text: |-
      Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om verkeerstekens voor het
      scheepvaartverkeer dat zich op een scheepvaartweg bevindt, aan te brengen of te verwijderen in verband met
      door een ander in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale
      verkeersgebruik van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te
      vergoeden die het heeft gemaakt voor het aanbrengen of verwijderen van die verkeerstekens.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel14
  - number: '14.2'
    text: |-
      Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om schepen op een scheepvaartweg te
      volgen, daaraan verkeersinformatie te geven dan wel deze te begeleiden met een schip in verband met door een ander
      in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale verkeersgebruik
      van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te vergoeden, die het heeft
      gemaakt voor die maatregelen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel14
  - number: 14a.1
    text: |-
      De kosten verbonden aan de aanvraag en de afgifte van diploma’s en verklaringen van vrijstelling als bedoeld in
      [artikel 10, tweede lid, onderdeel b][ref1], de deelname aan de daarvoor vereiste opleidingen en examens en de
      afgifte van andere documenten, verplicht gesteld bij of krachtens deze wet, kunnen ten laste worden gebracht van de
      aanvrager van het diploma of andere document, onderscheidenlijk de kandidaat voor de bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 14a.2
    text: |-
      De tarieven voor de kosten van deelname aan de opleidingen en de examens, en voor de verstrekking van afschriften
      uit de krachtens deze wet door de Nederlandse loodsencorporatie bij te houden registers worden vastgesteld bij
      besluit van de Autoriteit Consument en Markt, overeenkomstig het bepaalde bij of krachtens [hoofdstuk VIA van de
      Loodsenwet](onbekend). De tarieven voor de overige kosten worden vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel14a
  - number: '15.1'
    text: |-
      De kapitein op wie een verplichting als bedoeld in de [artikelen 10, eerste lid][ref1], of [11, eerste lid][ref2],
      rust, dan wel de eigenaar of rompbevrachter van het desbetreffende schip of de persoon die gezagvoerder is van een
      zeeschip dat geen Scheldevaarder is, als bedoeld in artikel 9, eerste lid, van het Scheldereglement, is gehouden
      loodsgeld te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel11
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.2'
    text: |-
      De kapitein die tijdens de vaart op een scheepvaartweg gebruik maakt van de diensten van een loods zonder dat
      daartoe op hem een verplichting als bedoeld in de [artikelen 10, eerste lid][ref1], of [11, eerste lid][ref2],
      rust, dan wel de eigenaar of rompbevrachter van het desbetreffende schip, is gehouden daarvoor loodsgeld te
      betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel11
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.3'
    text: |-
      Degene die gehouden is loodsgeld te betalen, kan door de organisatie waaraan het loodsgeld is verschuldigd, worden
      verplicht tot het stellen van zekerheid met betrekking tot de voldoening van het loodsgeld en tot het verschaffen
      van de in verband met de bepaling van het toepasselijke tarief benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15
  - number: 15a.1
    text: Het loodsgeld strekt tot vergoeding van de kosten met betrekking tot het loodsen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
  - number: 15a.2
    text: |-
      Het loodsgeld is verschuldigd aan de door de algemene raad van de Nederlandse loodsencorporatie aan te wijzen
      organisatie. Deze aanwijzing wordt bekend gemaakt in de *Staatscourant*. Aan die aanwijzing worden met inachtneming
      van [artikel 26 Loodsenwet][ref1] voorschriften verbonden omtrent de aanwending van het loodsgeld door de
      aangewezen organisatie en kunnen, eveneens met inachtneming van genoemd artikel, voorschriften worden verbonden
      omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel26
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '26'
  - number: 15a.2.a
    text: de inning van het loodsgeld;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
  - number: 15a.2.b
    text: de verplichting tot het stellen van zekerheid met betrekking tot de voldoening van het loodsgeld;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
  - number: 15a.2.c
    text: |-
      de gevolgen van het in gebreke blijven van de organisatie ten aanzien van de inning of de aanwending van het
      loodsgeld;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
  - number: 15a.2.d
    text: |-
      de verplichting van de kapitein tot het verschaffen van de in verband met de bepaling van het toepasselijke tarief
      benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15a
  - number: 15b.1
    text: |-
      De inning van het loodsgeld en de loodsvergoedingen, die ingevolge het Scheldereglement geheven worden en aan het
      Rijk toekomen, geschiedt volgens de bij of krachtens het Scheldereglement geldende bepalingen door een door de
      algemene raad van de Nederlandse loodsencorporatie aan te wijzen organisatie. Deze aanwijzing wordt bekendgemaakt
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15b
  - number: 15b.2
    text: |-
      De krachtens het eerste lid aangewezen organisatie is rechthebbende op de ingevolge het Scheldereglement geheven
      loodsgelden en loodsvergoedingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15b
  - number: 15b.3
    text: |-
      Aan de aanwijzing, bedoeld in het eerste lid, worden met inachtneming van [artikel 26 Loodsenwet][ref1]
      voorschriften verbonden omtrent de aanwending door de organisatie van de aan deze toekomende gelden en kunnen,
      eveneens met inachtneming van genoemd artikel, voorschriften worden verbonden omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel26
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '26'
  - number: 15b.3.a
    text: de inning van het loodsgeld en de loodsvergoedingen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15b
  - number: 15b.3.b
    text: |-
      de gevolgen van het in gebreke blijven van de organisatie ten aanzien van de inning of de aanwending van het
      loodsgeld en de loodsvergoedingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15b
  - number: 15ba.1
    text: |-
      Een aanwijzing, bedoeld in de [artikelen 15a, tweede lid][ref1], en [15b, eerste lid][ref2], behoeft de goedkeuring
      van de Autoriteit Consument en Markt. Onverminderd [artikel 10:27 van de Algemene wet bestuursrecht][ref3] kan de
      goedkeuring kan slechts worden onthouden indien het belang van behoorlijk markttoezicht zich daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15ba
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 15ba.2
    text: |-
      Een krachtens de [artikelen 15a, tweede lid][ref1], onderscheidenlijk [15b, eerste lid][ref2], aangewezen
      organisatie voert in de boekhouding een administratief onderscheid in voor iedere dienst of taak die
      bij of krachtens de wet bij uitsluiting aan registerloodsen, de organen van de Nederlandse en regionale
      loodsencorporaties, de aangewezen organisaties of samenwerkingsverbanden van registerloodsen is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15ba
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 15ba.3
    text: |-
      Bij regeling van de Autoriteit Consument en Markt kunnen nadere regels worden gesteld met betrekking tot de
      boekhouding, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15ba
  - number: 15ba.4
    text: |-
      De algemene raad en de ledenvergadering van de Nederlandse loodsencorporatie zijn bevoegd van de krachtens de
      [artikelen 15a, tweede lid][ref1], onderscheidenlijk [15b, eerste lid][ref2], aangewezen organisaties, alsmede van
      de ter uitvoering van [artikel 15, eerste lid, onder b, van de Loodsenwet][ref3] opgerichte samenwerkingsverbanden
      van registerloodsen, alle inlichtingen en gegevens te verlangen die deze organen voor de uitoefening van de
      hen bij en krachtens de [Loodsenwet][ref4] opgedragen taken redelijkerwijs nodig achten. De organisaties en
      samenwerkingsverbanden verlenen binnen de gestelde termijn alle gevraagde medewerking.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
      [ref3]: https://wetten.overheid.nl/BWBR0004365#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0004365
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15ba
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15a
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004365
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0004365
  - number: 15c.1
    text: |-
      De kapitein, eigenaar of rompbevrachter van een zeeschip dat gevoerd wordt door een verkeersdeelnemer op wie een
      verplichting rust als bedoeld in [artikel 4, derde lid][ref1], gericht op het deelnemen aan verkeersbegeleiding,
      is gehouden het verkeersbegeleidingstarief te betalen en de in verband met de bepaling van het tarief benodigde
      informatie te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15c.2
    text: |-
      In bij algemene maatregel van bestuur aan te wijzen gevallen en op een in die maatregel aan te geven wijze kan
      Onze Minister aan een kapitein, eigenaar of rompbevrachter een gehele of gedeeltelijke ontheffing verlenen van
      de verplichting tot het betalen van het in het eerste lid bedoelde tarief. Aan een besluit tot ontheffing kunnen
      voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15c
  - number: 15c.3
    text: |-
      [Paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] is van toepassing op de ontheffing van de verplichting
      tot het betalen van het in het eerste lid bedoelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 15d.1
    text: |-
      Het verkeersbegeleidingstarief strekt tot vergoeding van ten laste van het Rijk komende kosten van
      verkeersbegeleiding, voor zover deze strekt tot individuele dienstverlening.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15d
  - number: 15d.2
    text: |-
      Het in het eerste lid bedoelde tarief is verschuldigd aan het Rijk. Bij algemene maatregel van bestuur worden de
      scheepvaartwegen aangewezen waarop het tarief is verschuldigd en worden de maatstaven voor de toepassing en de
      vrijstellingen van het verkeersbegeleidingstarief geregeld. Daarin kunnen regels worden gesteld betreffende het
      stellen van zekerheid.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15d
  - number: 15d.3
    text: |-
      Het in het eerste lid bedoelde tarief wordt vastgesteld bij ministeriële regeling. Bij ministeriële regeling
      worden tevens regels gesteld met betrekking tot de inning en de wijze van betaling van het tarief. Onze Minister,
      onderscheidenlijk het bij ministeriële regeling aangewezen bestuursorgaan of de bij ministeriële regeling
      aangewezen ambtenaar is bevoegd tot het uitvaardigen van een dwangbevel tot invordering van de verschuldigde
      geldsom.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel15d
  - number: '16'
    text: |-
      De [artikelen 15][ref1] en [15][ref2] zijn van overeenkomstige toepassing ten aanzien van een schip dat geen
      zeeschip is en op degene die daarover de leiding heeft, het schip in eigendom heeft of het als rompbevrachter
      exploiteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15a
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 16a
    text: |-
      De [artikelen 15][ref1] en [15][ref2] zijn van overeenkomstige toepassing ten aanzien van een schip dat geen
      zeeschip is en behoort tot een categorie die bij algemene maatregel van bestuur aangewezen kan worden en op degene
      die over dat schip de leiding heeft, het schip in eigendom heeft of het als rompbevrachter exploiteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15d
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15c
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15d
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '17.1'
    text: |-
      Degene die een schip voert dat behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie, is
      verplicht om aan de daartoe bij of krachtens die maatregel aangewezen personen ten behoeve van de statistiek
      bepaalde gegevens te verstrekken met betrekking tot het schip, de daarmee vervoerde lading of de uit te voeren
      reis.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel17
  - number: '17.2'
    text: 'Bij algemene maatregel van bestuur worden nadere regels gesteld. Deze regels hebben slechts betrekking op:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel17
  - number: 17.2.a
    text: de inhoud van de te verstrekken gegevens;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel17
  - number: 17.2.b
    text: de plaatsen waar gegevens moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel17
  - number: 17.2.c
    text: het verstrekken van de gegevens.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel17
  - number: '18.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het gebruik van scheepvaartwegen
      door personen die zich anders dan op een schip te water bevinden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel18
  - number: '18.2'
    text: |-
      Deze regels mogen slechts strekken tot het voorkomen of het beperken van hinder of gevaar voor het
      scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel18
  - number: '19'
    text: |-
      Het stellen van regels krachtens het bepaalde in de [hoofdstukken 2 tot en met 4][ref1] geschiedt met inachtneming
      van bindende verdragen en bindende besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '20.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties voor zover die het Koninkrijk binden, regels worden gesteld met betrekking tot het deelnemen aan het
      scheepvaartverkeer door Nederlandse zeeschepen:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel20
  - number: 20.1.a
    text: in volle zee;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel20
  - number: 20.1.b
    text: |-
      op alle niet-Nederlandse wateren die met de volle zee in verbinding staan en bevaarbaar zijn voor zeegaande
      schepen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel20
  - number: '20.2'
    text: |-
      Het bepaalde in het eerste lid, onderdeel *b*, is niet van toepassing, voorzover door de voor die wateren daartoe
      bevoegde autoriteiten afwijkende regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel20
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties welke betrekking hebben op de ordening van het scheepvaartverkeer voor de Nederlandse kust buiten de
      Nederlandse territoriale zee, voorzover die verdragen of besluiten het Koninkrijk binden, regels worden gesteld.
      Voorzover daarbij uitvoering wordt gegeven aan artikel 211, zesde lid, van het op 10 december 1982 te Montego-Bay
      totstandgekomen Verdrag van de Verenigde Naties inzake het recht van de zee (Trb. 1983, 83), geschiedt zulks met
      inachtneming van de voorschriften, genoemd in dat verdrag.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel21
  - number: '21.2'
    text: |-
      In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze Minister
      bevoegd worden verklaard tot het stellen van nadere regels.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel21
  - number: '22.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van de Herziene Rijnvaartakte voor zover dit noodzakelijk
      is voor een goede uitvoering van dat verdrag met betrekking tot de scheepvaart, regels inzake andere onderwerpen
      dan die bedoeld in de [Hoofdstukken 2 tot en met 4][ref1] worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '22.2'
    text: |-
      In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze Minister
      bevoegd worden verklaard tot het stellen van nadere regels.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel22
  - number: '23'
    text: |-
      Bij de toepassing van de [artikelen 19 tot en met 21][ref1] wordt afgeweken van het bepaalde in deze wet, indien
      verdragen of besluiten van volkenrechtelijke organisaties voor zover deze het Koninkrijk binden daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel19
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '19'
        hoofdstuk: '5'
  - number: 23a
    text: |-
      Behoeft de voorzitter van een veiligheidsregio, in geval van een ramp of crisis, bijstand van de Gemeenschappelijk
      Nautische Autoriteit, genoemd in artikel 6 van het Verdrag inzake het gemeenschappelijk nautisch beheer, dan
      dient hij een daartoe strekkend verzoek in bij Onze Minister. Onze Minister geleidt dit verzoek door aan de
      Gemeenschappelijke Nautische Autoriteit.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel23a
  - number: '24'
    text: |-
      Onze Minister, indien deze het bevoegd gezag is, is bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel24
  - number: 24a
    text: |-
      Onze Minister is gerechtigd te verrichten hetgeen in strijd met het bepaalde bij of krachtens [artikel 15][ref1],
      wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '25'
    text: |-
      Indien een verkeersdeelnemer aan wie een verkeersaanwijzing is gegeven, een krachtens
      [artikel 4, eerste lid, onderdeel d][ref1], geregelde verplichting met betrekking tot een verkeersaanwijzing
      overtreedt en daarvoor onmiddellijk gevaar voor de veiligheid van personen of goederen ontstaat of dreigt te
      ontstaan, is het bevoegd gezag bevoegd tot oplegging van een last onder bestuursdwang ter voorkoming of bestrijding
      van dat gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '26'
    text: |-
      Het is verboden om opzettelijk wederrechtelijk een aan een ander toebehorend schip of ander vaartuig te gebruiken
      voor het deelnemen aan het scheepvaartverkeer op een scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel26
  - number: '27.1'
    text: |-
      Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen,
      terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijze moet weten, dat het
      gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het voeren
      of sturen van dat schip, dan wel de bekwaamheid tot het adviseren van de kapitein of de verkeersdeelnemer, kan
      verminderen, dat hij niet in staat moet worden geacht dat schip naar behoren te kunnen voeren of te kunnen sturen,
      dan wel de kapitein of de verkeersdeelnemer naar behoren te kunnen adviseren.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '27.2'
    text: |-
      Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen, na
      zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: 27.2.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: 27.2.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per milliliter
      bloed.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '27.3'
    text: |-
      Het is degene die op een scheepvaartweg een varend schip voert verboden dit te doen sturen door een persoon,
      waarvan hij weet of redelijkerwijze moet weten dat deze verkeert in een toestand als in het eerste lid of tweede
      lid omschreven.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '27.4'
    text: |-
      Het is degene die op een scheepvaartweg een varend klein schip voert of stuurt verboden dit te doen terwijl
      hij verkeert in een toestand als omschreven in het eerste of tweede lid en het verkeer belemmert of dreigt te
      belemmeren.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '27.5'
    text: |-
      In dit artikel en in de [artikelen 28][ref1], [28a][ref2] en [29][ref3] wordt onder een varend schip verstaan een
      schip dat niet ten anker of gemeerd ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel29
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '28'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 28a
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '29'
        hoofdstuk: '7'
  - number: '27.6'
    text: 'In dit artikel wordt onder een klein schip verstaan:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: 27.6.a
    text: een schip met een lengte van minder dan 20 meter dat uitsluitend door spierkracht wordt voortbewogen;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: 27.6.b
    text: |-
      een schip met een lengte van minder dan 5 meter dat uitsluitend door middel van zijn zeilen wordt voortbewogen of
      dat ter voortbeweging gebruik maakt van een motor waarmee geen hogere snelheid bereikt kan worden dan zes kilometer
      per uur.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '27.7'
    text: |-
      In dit artikel wordt onder lengte van een schip verstaan de grootste lengte van de romp gemeten van de voorkant van
      het voorste tot de achterkant van het achterste deel van het schip.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel27
  - number: '28.1'
    text: |-
      Op de eerste vordering van een opsporingsambtenaar als bedoeld in artikel 141 van het Wetboek van Strafvordering
      is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verplicht zijn medewerking te
      verlenen aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die opsporingsambtenaar te geven
      aanwijzingen ademlucht te blazen in een door die opsporingsambtenaar aangewezen apparaat.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene die aanstalten maakt een schip dat op een scheepvaartweg
      voor vertrek gereed ligt, te gaan voeren of sturen, dan wel als loods aan boord van een zodanig schip de kapitein
      of de verkeersdeelnemer over de te voeren navigatie te gaan adviseren.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28
  - number: 28a.1
    text: |-
      Indien degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of verkeersdeelnemer adviseert over de te voeren navigatie, verdacht wordt van handelen
      in strijd met [artikel 27, eerste, tweede of vierde lid][ref1], kan een opsporingsambtenaar als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref2] hem bevelen zijn medewerking te verlenen aan een onderzoek
      als bedoeld in [artikel 27, tweede lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 28a.2
    text: |-
      De verdachte aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een
      voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten dienste van het
      onderzoek gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die aanstalten maakt een schip dat op
      een scheepvaartweg voor vertrek gereed ligt, te gaan voeren of sturen, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te gaan adviseren, indien de
      opsporingsambtenaar redelijkerwijs kan aannemen dat dit voeren, sturen of adviseren zal leiden tot handelen in
      strijd met [artikel 27, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 28a.4
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een onderzoek van uitgeademde lucht voor hem om bijzondere geneeskundige redenen onwenselijk
      is.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.5
    text: |-
      In het geval bedoeld in het vierde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot een
      voltooid onderzoek van uitgeademde lucht, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming
      geeft tot het verrichten van een onderzoek als bedoeld in [artikel 27, tweede lid, onderdeel b][ref1]. Gelijke
      bevoegdheid heeft de opsporingsambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een
      andere in [artikel 27, eerste lid][ref2], bedoelde stof dan alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 28a.6
    text: |-
      Indien de verdachte zijn op grond van het vijfde lid gevraagde toestemming niet verleent, kan de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te
      onderwerpen aan een bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.7
    text: |-
      De verdachte die is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te geven
      en zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.8
    text: |-
      De in het zevende lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.9
    text: |-
      De krachtens het achtste lid van de in het zevende lid genoemde verplichtingen vrijgestelde personen zijn
      verplicht mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door
      een van de daartoe bij regeling van Onze Minister van Veiligheid en Justitie aangewezen ambtenaren van
      politie, aangesteld voor de uitvoering van de politietaak, bevolen onderzoek teneinde op andere wijze dan
      door bloed- of ademonderzoek het gebruik van de in [artikel 27, eerste lid][ref1], bedoelde stoffen of het in
      [artikel 27, tweede lid, onderdeel b][ref2], genoemde gehalte vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 28a.10
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met de toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Veiligheid en
      Justitie aangewezen ambtenaren van politie, aangesteld voor de uitvoering van de politietaak, door een arts de in
      het zevende lid bedoelde hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere
      geneeskundige redenen onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte
      in de gelegenheid is gesteld zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het zesde lid
      worden bevolen zijn medewerking te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht
      zijn medewerking te verlenen. Indien de verdachte weigert zijn medewerking te verlenen wordt het bloedmonster
      vernietigd.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
  - number: 28a.11
    text: |-
      Bij algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Veiligheid en Justitie, worden
      regels gesteld omtrent de wijze van uitvoering van [artikel 28 en van dit artikel][ref1]. Deze regels hebben mede
      betrekking op de mogelijkheid tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van
      Veiligheid en Justitie worden in de bij die algemene maatregel van bestuur aangegeven gevallen voorschriften ter
      uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 28a
        hoofdstuk: '7'
  - number: '29.1'
    text: |-
      Een opsporingsambtenaar als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] kan, indien hij
      een ernstige verdenking heeft dat degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als
      loods aan boord van een zodanig schip de kapitein of de verkeersdeelnemer over de te voeren navigatie adviseert,
      handelt in strijd met [artikel 27, eerste, tweede of vierde lid][ref2], aan die persoon een verbod opleggen op
      een scheepvaartweg een varend schip te voeren of te sturen, dan wel als loods aan boord van een zodanig schip
      de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren, voor de tijd gedurende welke hij
      verwacht dat deze toestand zal voortduren tot ten hoogste vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: '29.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene die aanstalten maakt een schip dat op een
      scheepvaartweg voor vertrek gereed ligt, te voeren of te sturen, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren, indien de opsporingsambtenaar
      ernstige reden heeft om aan te nemen dat dit voeren, sturen of adviseren zal leiden tot handelen in strijd met
      [artikel 27, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: '29.3'
    text: |-
      Het is degene aan wie een verbod op grond van dit artikel is opgelegd, gedurende de tijd waarvoor het verbod geldt,
      verboden op een scheepvaartweg een varend schip te voeren of te sturen, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29
  - number: '29.4'
    text: |-
      Degene aan wie een verbod op grond van dit artikel is opgelegd, is verplicht de bevelen die door de
      opsporingsambtenaar worden gegeven voor de uitvoering van het verbod op te volgen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29
  - number: 29a.1
    text: |-
      Voor zover bij of krachtens de Herziene Rijnvaartakte wordt voorzien in het onderwerp van de regeling van
      [artikel 27, eerste tot en met vierde lid][ref1], zijn deze artikelleden niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 29a.2
    text: |-
      Indien bij of krachtens de Herziene Rijnvaartakte wordt voorzien in het onderwerp van de regeling van
      [artikel 27, eerste tot en met vierde lid][ref1], zijn de [artikelen 27, vijfde lid][ref2], [28][ref3], [28a][ref4]
      en [29][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref5]: https://wetten.overheid.nl/BWBR0004364#Artikel29
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '28'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: 28a
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0004364
        artikel: '29'
        hoofdstuk: '7'
  - number: '30.1'
    text: |-
      Het is verboden om, zonder daartoe bevoegd te zijn, een krachtens [artikel 4, eerste lid, onderdeel b][ref1], of
      een krachtens het verdrag inzake het gemeenschappelijk nautisch beheer vastgesteld verkeersteken aan te brengen of
      te doen aanbrengen dan wel te verwijderen of te doen verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Het is verboden om een voorwerp van welke aard ook, dat het scheepvaartverkeer op een scheepvaartweg in verwarring
      of in gevaar zou kunnen brengen, daarlangs, daarin of daarboven aan te brengen, te doen aanbrengen of te houden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel30
  - number: '31.1'
    text: |-
      Handelen in strijd met [artikel 26][ref1] wordt, voorzoveel daartegen niet bij het [Wetboek van Strafrecht][ref2]
      is voorzien, gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '26'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0001854
  - number: '31.2'
    text: |-
      Handelen in strijd met de [artikelen 27, eerste tot en met vierde lid][ref1], [28][ref2], en
      [artikel 29, derde en vierde lid][ref3], wordt gestraft met gevangenisstraf van ten hoogste drie maanden of
      geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel29
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 28a
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '29'
        hoofdstuk: '7'
  - number: '31.3'
    text: |-
      Handelen in strijd met [artikel 28][ref1] wordt gestraft met gevangenisstraf van ten hoogste twee maanden of
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel28
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '28'
        hoofdstuk: '7'
  - number: '31.4'
    text: |-
      Overtreding van de regels, gesteld krachtens [artikel 4][ref1] en van de voorschriften verbonden aan een
      besluit, genomen krachtens [artikel 7, eerste lid][ref2] of met overeenkomstige toepassing daarvan krachtens
      [artikel 8][ref3], wordt gestraft met:


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel8
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 31.4.a
    text: |-
      hechtenis van ten hoogste twee maanden of geldboete van de derde categorie, indien de overtreding is begaan in
      de Nederlandse territoriale zee, voor zover het verdrag inzake het gemeenschappelijk nautisch beheer niet van
      toepassing is, de Rotterdamse waterweg, het Noordzeekanaal of de Eems-Dollard,
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: 31.4.b
    text: |-
      hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie, indien de overtreding is begaan op een
      andere scheepvaartweg;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: 31.4.c
    text: |-
      hechtenis van ten hoogste twee maanden of geldboete van de derde categorie, indien de overtreding betrekking
      heeft op het ontvangen, bewaren of verstrekken van gegevens met betrekking tot de scheepvaart door organisaties of
      personen die niet deelnemen aan het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: '31.5'
    text: |-
      Overtreding van [artikel 10, eerste lid][ref1], met een zeeschip of een schip als bedoeld in [artikel 13][ref2],
      wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel13
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.6'
    text: |-
      Niet-nakoming van de verplichtingen bedoeld in [artikel 11][ref1], alsmede overtreding van de regels,
      gesteld krachtens [artikel 12][ref2], en van de voorschriften verbonden aan een besluit genomen krachtens
      [artikel 10, derde lid][ref3], met een zeeschip of een schip als bedoeld in [artikel 13][ref4] wordt gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel13
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '31.7'
    text: |-
      Overtreding met een Nederlands schip van de krachtens [artikel 20, eerste lid][ref1], gestelde regels, begaan
      in volle zee of op een ander in [artikel 20, eerste lid, onderdeel ][ref2], bedoeld water waarop die regels ten
      aanzien van dat schip van toepassing zijn, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete
      van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel20
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '20'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '20'
        hoofdstuk: '5'
  - number: '31.8'
    text: |-
      Overtreding van de krachtens [artikel 21][ref1] gestelde regels wordt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel21
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '21'
        hoofdstuk: '5'
  - number: '31.9'
    text: |-
      Overtreding van [artikel 30][ref1] wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel30
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '30'
        hoofdstuk: '7'
  - number: '31.10'
    text: |-
      Overtreding van [artikel 17][ref1] en van de regels, gesteld krachtens [artikel 18][ref2], wordt gestraft met
      hechtenis van ten hoogste twee weken of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel18
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '17'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '18'
        hoofdstuk: '4'
  - number: '31.11'
    text: |-
      Overtreding van krachtens deze wet gestelde regels, als bedoeld in het vierde, zesde, zevende, achtste en tiende
      lid, vormt slechts een strafbaar feit voor zover dit in die regels uitdrukkelijk is bepaald.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: '31.12'
    text: |-
      Het bepaalde in het vierde lid, aanhef en onderdeel b, en het tiende lid is niet van toepassing op overtreding van
      in artikel 32 van de Herziene Rijnvaartakte strafbaar gestelde feiten.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: '31.13'
    text: |-
      De in het eerste en tweede lid van dit artikel strafbaar gestelde feiten zijn misdrijven. De in of krachtens het
      derde tot en met tiende lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: '31.14'
    text: |-
      De Nederlandse strafwet is toepasselijk op een ieder die een krachtens het achtste lid strafbaar gesteld feit heeft
      begaan.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: '31.15'
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar in het kader van de Internationale Maritieme Organisatie van
      de Verenigde Naties tot stand gekomen besluiten die betrekking hebben op de ordening van het scheepvaartverkeer,
      kan overtreding van deze besluiten ook als strafbaar feit worden aangemerkt indien deze besluiten in de Engelse
      taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31
  - number: 31a.1
    text: |-
      Overtreding van artikel 9, eerste lid, van het Scheldereglement met een zeeschip, een Scheldevaarder of een schip
      als bedoeld in [artikel 13][ref1] wordt gestraft met hechtenis van ten hoogste twee maanden of een geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel13
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 31a.2
    text: |-
      Niet-nakoming van de voorschriften verbonden aan een ontheffing, bedoeld in artikel 9, vierde lid, van het
      Scheldereglement, van een verplichting opgelegd krachtens artikel 11 van het Scheldereglement, alsmede overtreding
      van de regels gesteld bij en krachtens de artikelen 13, eerste lid, en 14, eerste lid, van het Scheldereglement,
      wordt gestraft met hechtenis van twee maanden of een geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.3
    text: |-
      Overtreding van de regels gesteld krachtens artikel 4, derde lid, van het verdrag inzake het gemeenschappelijk
      nautisch beheer wordt gestraft met:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.3.a
    text: |-
      hechtenis van ten hoogste twee maanden of een geldboete van de derde categorie, indien de overtreding is begaan in
      de Nederlandse territoriale zee of de Westerschelde;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.3.b
    text: |-
      hechtenis van ten hoogste twee maanden of een geldboete van de tweede categorie, indien de overtreding is begaan op
      een andere scheepvaartweg waarop dat verdrag van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.3.c
    text: |-
      hechtenis van ten hoogste twee maanden of een geldboete van de derde categorie, indien de overtreding betrekking
      heeft op het ontvangen, bewaren of verstrekken van gegevens met betrekking tot de scheepvaart door organisaties en
      personen die niet deelnemen aan het scheepvaartverkeer,
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.4
    text: |-
      Niet-nakoming van een krachtens het verdrag inzake het gemeenschappelijk nautisch beheer gegeven gebod of verbod,
      vervat in een verkeersteken of een bekendmaking met dezelfde strekking als een verkeersteken, in de zin van
      dat verdrag, dan wel een krachtens dat verdrag gegeven voorschrift of beperking, verbonden aan een vrijstelling
      of ontheffing van een verkeersteken of bekendmaking met dezelfde strekking als een verkeersteken, dan wel een
      krachtens dat verdrag gegeven verkeersaanwijzing, wordt gestraft met:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.4.a
    text: |-
      hechtenis van ten hoogste twee maanden of een geldboete van de derde categorie indien de overtreding is begaan in
      de Nederlandse territoriale zee of de Westerschelde;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.4.b
    text: |-
      hechtenis van ten hoogste twee maanden of een geldboete van de tweede categorie, indien de overtreding is begaan op
      een andere scheepvaartweg waarop dat verdrag van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: 31a.5
    text: De bij of krachtens dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel31a
  - number: '32.1'
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten en van de in de Herziene Rijnvaartakte
      strafbaar gestelde feiten, voor zover deze laatste de overtreding betreffen van bepalingen die krachtens deze wet
      zijn vastgesteld, zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1], belast de daartoe
      door het bevoegd gezag, in overeenstemming met Onze Minister van Veiligheid en Justitie, aangewezen buitengewone
      opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '32.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel32
  - number: '32.3'
    text: |-
      De [artikelen 5:13][ref1], [5:15 tot en met 5:17][ref2] en [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33'
    text: |-
      Een opsporingsambtenaar als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] kan, indien hij
      op grond van feiten of omstandigheden redelijkerwijze kan vermoeden dat een schip betrokken is geweest bij een
      aanvaring waarbij een persoon is gedood, letsel heeft bekomen of in zijn gezondheid is benadeeld dan wel aan enige
      zaak die niet toebehoort aan een persoon die zich op het schip bevindt, schade is toegebracht, in het belang van
      de opsporing van de verkeersdeelnemer of de andere personen die deel uitmaken van de bemanning vorderen dat zij
      de inlichtingen en gegevens verstrekken die nodig zijn voor de vaststelling van hun identiteit en van die van het
      schip.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '34.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren, aangewezen
      bij het besluit, bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel32
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '32'
        hoofdstuk: '7'
  - number: '34.2'
    text: |-
      Bij besluit van Onze Minister kunnen andere dan de in het eerste lid bedoelde ambtenaren worden aangewezen voor
      het toezicht op de naleving van het bepaalde bij of krachtens deze wet. Ambtenaren van provincies, gemeenten of
      waterschappen worden aangewezen op voordracht van, en in overeenstemming met de desbetreffende besturen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel34
  - number: '34.3'
    text: |-
      In de in het tweede lid bedoelde besluit kunnen eisen worden gesteld met betrekking tot de kennis en kunde van de
      toezichthouders en de wijze waarop zij hun taak vervullen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel34
  - number: '34.4'
    text: Het besluit bedoeld in het tweede lid wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel34
  - number: '34.5'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '35.1'
    text: Indien een persoon er van wordt verdacht dat hij, terwijl hij een zeeschip of samenstel van zeeschepen voerde,
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: 35.1.a
    text: |-
      een in [artikel 31, eerste of tweede lid][ref1], bedoeld strafbaar feit heeft begaan,


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel31
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '31'
        hoofdstuk: '7'
  - number: 35.1.b
    text: |-
      een in [artikel 31, vierde, vijfde of zesde lid][ref1], bedoeld strafbaar feit heeft begaan, waardoor ernstig
      gevaar voor de veiligheid van personen of goederen kan ontstaan,


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel31
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '31'
        hoofdstuk: '7'
  - number: 35.1.c
    text: |-
      een in artikel 32 van de Herziene Rijnvaartakte strafbaar gesteld feit heeft begaan, waardoor ernstig gevaar voor
      de veiligheid van personen of goederen kan ontstaan, voorzover dit feit de overtreding betreft van een bepaling die
      krachtens deze wet is vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: 35.1.d
    text: |-
      een in [artikel 31a][ref1] bedoeld strafbaar feit heeft begaan, waardoor ernstig gevaar voor de veiligheid van
      personen of goederen kan ontstaan,


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel31a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 31a
        hoofdstuk: '7'
  - number: '35.2'
    text: |-
      De officier van justitie is bevoegd het zeeschip of de zeeschepen van het samenstel op een door hem aan te wijzen
      plaats op een scheepvaartweg vast te doen houden, indien naar zijn oordeel de betrokkene niet voldoende zekerheid
      heeft gesteld voor een door hem te bepalen geldsom waarop een terzake van het plegen van het strafbaar feit op te
      leggen geldboete kan worden verhaald. Alvorens de plaats tot vasthouding aan te wijzen raadpleegt de officier van
      justitie het ten aanzien van de scheepvaartweg bevoegde gezag.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.3'
    text: |-
      De in het tweede lid bedoelde vasthouding mag ten hoogste vier dagen na de dag waarop tot vasthouding is
      overgegaan, duren.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.4'
    text: |-
      Indien binnen de in het derde lid genoemde termijn niet een zekerheid is gesteld als bedoeld in het tweede lid, kan
      de rechter-commissaris belast met de behandeling van strafzaken op vordering van de officier van justitie beslissen
      de vasthouding van het zeeschip of de zeeschepen van het samenstel te verlengen tot ten hoogste dertig dagen.
      De in het eerste lid bedoelde persoon die wordt verdacht van een in dat lid bedoeld strafbaar feit wordt vooraf
      gehoord of althans behoorlijk opgeroepen. De beslissing is dadelijk uitvoerbaar en wordt aan de in de vorige volzin
      bedoelde persoon betekend.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.5'
    text: |-
      De in het eerste lid bedoelde persoon die wordt verdacht van een in dat lid bedoeld strafbaar feit en de officier
      van justitie kunnen gedurende veertien dagen na betekening van de beslissing van de rechter-commissaris aan
      eerstbedoelde persoon tegen die beslissing beroep instellen bij de rechtbank. De rechtbank beslist zo spoedig
      mogelijk.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.6'
    text: |-
      De officier van justitie geeft het zeeschip of de zeeschepen van het samenstel vrij zodra de door hem ingevolge het
      tweede lid verlangde zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.7'
    text: De kapitein is de kosten van de vasthouding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.8'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de zekerheidstelling bedoeld in het
      tweede lid beëindigd, nadat een bij dat vonnis opgelegde geldboete, vermeerderd met de kosten van de vasthouding,
      is betaald onderscheidenlijk daarop in mindering is gebracht. Tot dat tijdstip en te rekenen vanaf de dag dat de
      zekerheid is gesteld wordt bij gederfde rente over de tot zekerheid gestelde geldsom die gederfde rente vergoed tot
      een maximum van het percentage dat is vastgesteld krachtens het bepaalde in artikel 9, derde lid, van de Wet op de
      consignatie van gelden (*Stb.* 1980, 473).
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
  - number: '35.9'
    text: |-
      Met betrekking tot dit artikel is [artikel 1, vijfde lid, onder b][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel1
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '1'
        hoofdstuk: '1'
  - number: 35a.1
    text: |-
      In de gevallen, bedoeld in het tweede lid, onderdelen a, b of c, overhandigt de houder van een
      vaarbewijs tegen wie proces-verbaal wordt opgemaakt wegens overtreding van een voorschrift als bedoeld in
      [artikel 35b, eerste lid][ref1], zijn vaarbewijs op eerste vordering aan de opsporingsambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35b
        hoofdstuk: '7'
  - number: 35a.2
    text: |-
      Vaarbewijzen die ingevolge het eerste lid zijn ingevorderd worden onverwijld overgedragen aan de officier van
      justitie. De officier van justitie is bevoegd ingevorderde vaarbewijzen onder zich te houden totdat de veroordeling
      onherroepelijk is geworden of, indien de bevoegdheid tot het voeren van schepen onvoorwaardelijk is ontzegd, tot
      het tijdstip waarop de ontzegging is verstreken, indien:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.2.a
    text: |-
      bij onderzoek is gebleken of, bij ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het
      alcoholgehalte van de adem van degene die een schip voert of stuurt, hoger is dan 785 microgram alcohol per liter
      uitgeademde lucht, onderscheidenlijk het alcoholgehalte van zijn bloed hoger blijkt te zijn dan 1,8 milligram
      alcohol per milliliter bloed;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.2.b
    text: met een zodanige snelheid is gevaren dat ernstig gevaar voor de veiligheid van personen of goederen is ontstaan; of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.2.c
    text: |-
      op grond van andere feiten of omstandigheden ernstig rekening moet worden gehouden met de mogelijkheid dat de
      bestuurder opnieuw een feit als bedoeld in [artikel 35b, eerste lid][ref1], zal begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35b
        hoofdstuk: '7'
  - number: 35a.3
    text: 'De officier van justitie geeft het ingevorderde vaarbewijs onverwijld terug aan de houder:'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.3.a
    text: indien hij binnen tien dagen na de dag van invordering geen toepassing geeft aan het tweede lid;
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.3.b
    text: |-
      indien ernstig rekening moet worden gehouden met de mogelijkheid dat aan de houder in geval van veroordeling
      door de rechter geen onvoorwaardelijke ontzegging van de bevoegdheid tot het voeren van een schip zal worden
      opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur dan de tijd gedurende welke het vaarbewijs is
      ingevorderd of ingehouden geweest, of
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.3.c
    text: |-
      indien het onderzoek van de zaak op de terechtzitting niet binnen 26 weken na de dag van invordering is
      aangevangen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
  - number: 35a.4
    text: |-
      Tegen toepassing van het eerste of tweede lid kan de belanghebbende bij klaagschrift opkomen. Zolang in
      de zaak nog geen vervolging is ingesteld, wordt het klaagschrift ingediend ter griffie van de rechtbank
      in het arrondissement waar het in het eerste lid bedoelde feit werd begaan, en anders ter griffie
      van het gerecht in feitelijke aanleg waarvoor de vervolging plaatsvindt of het laatst plaatsvond.
      [Artikel 552a, vierde en zesde lid, van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.
      De raadkamer van het gerecht geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan door diens
      raadsman, te hebben gehoord, althans opgeroepen, zijn met redenen omklede beslissing, die onverwijld aan de
      belanghebbende wordt betekend. Tegen de beslissing kan door het openbaar ministerie binnen veertien dagen daarna
      en door de belanghebbende binnen veertien dagen na de betekening beroep in cassatie worden ingesteld. De Hoge Raad
      beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 552a
  - number: 35a.5
    text: |-
      Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, maar op grond van
      een feit waarvoor de toepassing van het eerste of tweede lid niet is toegelaten, kan de rechter op verzoek van
      de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade die hij ten gevolge
      van die toepassing heeft geleden, waaronder begrepen nadeel dat niet in vermogensschade bestaat. De artikelen
      [89, derde tot en met zesde lid][ref1], [90][ref2], [91][ref3] en [93 van het Wetboek van Strafvordering][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '93'
  - number: 35b.1
    text: |-
      De houder van een vaarbewijs kan de bevoegdheid tot het voeren van schepen, voor zover daartoe een vaarbewijs is
      vereist, voor ten hoogste vijf jaren worden ontzegd wegens het op de binnenwateren voeren of doen voeren van:
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
  - number: 35b.1.a
    text: |-
      een snelle motorboot in strijd met voorschriften gesteld krachtens
      [artikel 4, eerste lid, onderdelen a en d, en derde lid][ref1], en waarbij ernstig gevaar voor de veiligheid van
      personen of goederen is ontstaan, of in strijd met [artikel 27][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 35b.1.b
    text: |-
      een schip waarvoor een bij ministeriële regeling aan te wijzen vaarbewijs is vereist, herhaaldelijk in strijd met
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '27'
        hoofdstuk: '7'
  - number: 35b.2
    text: |-
      Indien tijdens het plegen van een van de feiten, bedoeld in het eerste lid, nog geen vijf jaren zijn verlopen na
      het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die feiten de
      betrokkene de bevoegdheid tot het voeren van schepen, voor zover daartoe een vaarbewijs is vereist, is ontzegd, kan
      hem die bevoegdheid voor ten hoogste tien jaren worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
  - number: 35b.3
    text: |-
      Bij het opleggen van de straf, bedoeld in het eerste en tweede lid, wordt de tijd gedurende welke het vaarbewijs
      van de veroordeelde ingevolge [artikel 35a][ref1] vóór het tijdstip waarop die straf ingaat, ingevorderd of
      ingehouden is geweest, op de duur van die straf in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 35a
        hoofdstuk: '7'
  - number: 35b.4
    text: |-
      De tenuitvoerlegging van de veroordeling vindt niet plaats dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 587][ref1] en [588 van het Wetboek van Strafvordering][ref2], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het vaarbewijs uiterlijk op
      dat tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel587
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel588
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '587'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '588'
  - number: 35b.5
    text: |-
      De houder levert het vaarbewijs, tenzij het is ingevorderd en niet teruggegeven, in op het parket van het openbaar
      ministerie vanwaar hij het schrijven, bedoeld in het vierde lid, heeft ontvangen, uiterlijk op het tijdstip van
      ingang van de ontzegging.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
  - number: 35b.6
    text: Teruggave van het vaarbewijs vindt plaats zodra de termijn van de ontzegging is verstreken.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
  - number: 35b.7
    text: |-
      De termijn van ontzegging van de bevoegdheid tot het voeren van schepen wordt van rechtswege verlengd met het
      aantal dagen dat is verstreken tussen het tijdstip waarop het vaarbewijs ingevolge het vijfde lid had moeten worden
      ingeleverd en het tijdstip waarop nadien die inlevering heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35b
  - number: 35c
    text: |-
      De opsporingsambtenaar die bij de uitoefening van de hem bij of krachtens wet verleende bevoegdheden de beschikking
      krijgt over een vaarwijs waarvan ingevolge dit hoofdstuk de overgifte is gevorderd, waarvan een verplichting
      tot inlevering bestaat of dat ingevolge de [Binnenvaartwet][ref1] zijn geldigheid heeft verloren, is bevoegd
      dat vaarbewijs in te nemen en het door te geleiden naar het betrokken parket van het openbaar ministerie, naar
      degene bij wie de houder dat vaarbewijs had dienen in te leveren onderscheidenlijk naar de instantie die het heeft
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: '36.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de [artikelen 10, eerste lid][ref1], [15][ref2] en
      [17][ref3] alsmede de krachtens de [artikelen 4][ref4], [11][ref5] en [12][ref6] gestelde regels die in die
      maatregel zijn aangegeven, niet of slechts met beperkingen van toepassing zijn op Nederlandse of daarmee in
      die maatregel gelijk te stellen oorlogsschepen, die zich bevinden in de territoriale zee of daarop aansluitende
      Nederlandse scheepvaartwegen die in die maatregel zijn aangewezen. Bij algemene maatregel van bestuur kan worden
      bepaald dat [artikel 15, eerste en tweede lid][ref7], niet of slechts met beperkingen van toepassing is op andere
      dan Nederlandse oorlogsschepen, indien dit met de vlaggestaat van de betreffende schepen is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15c
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0004364#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0004364#Artikel15
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 15c
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '17'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004364
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0004364
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0004364
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '36.2'
    text: |-
      Bij algemene maatregel van bestuur kan het scheepvaartverkeer de toegang tot scheepvaartwegen die uitsluitend zijn
      bestemd tot gebruik door Nederlandse oorlogsschepen dan wel door andere Nederlandse schepen of andere vaartuigen,
      welke in gebruik zijn voor de uitvoering van de militaire taak, worden verboden of slechts in beperkte mate
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel36
  - number: '36.3'
    text: |-
      Overtreding van de in het tweede lid bedoelde regels wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel36
  - number: '36.4'
    text: Het in het derde lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel36
  - number: '37.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land
      of een gedeelte daarvan de [artikelen 37a, eerste lid][ref3], en [38][ref4] gezamenlijk of afzonderlijk in werking
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel37a
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel38
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: 37a
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0004364
        artikel: '38'
        hoofdstuk: '8'
  - number: '37.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
  - number: '37.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
  - number: '37.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
  - number: '37.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
  - number: '37.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37
  - number: 37a.1
    text: |-
      In afwijking van het bij of krachtens deze wet bepaalde kan Onze Minister de maatregelen treffen die hij nodig acht
      in het belang van een ordelijk verloop van het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37a
  - number: 37a.2
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de door hem krachtens
      het eerste lid getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel37a
  - number: '38.1'
    text: |-
      Toepassing van het bepaalde bij of krachtens de [artikelen 4 tot en met 13][ref1] kan ten aanzien van de
      Nederlandse territoriale zee of daarop aansluitende scheepvaartwegen mede geschieden in het belang van de
      uitwendige veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat hetgeen bij of krachtens de
      [artikelen 4 tot en met 13][ref1] is bepaald en hetgeen door besturen van andere openbare lichamen dan het Rijk
      is bepaald bij of krachtens verordeningen die betrekking hebben op de ordening van het scheepvaartverkeer op
      scheepvaartwegen, geen toepassing vindt ten aanzien van schepen of andere vaartuigen, welke in gebruik zijn voor de
      uitvoering van de militaire taak.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '38.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat hetgeen bij of krachtens de
      [artikelen 4 tot en met 13][ref1] is bepaald en hetgeen door besturen van andere openbare lichamen dan het Rijk
      is bepaald bij of krachtens verordeningen die betrekking hebben op de ordening van het scheepvaartverkeer op
      scheepvaartwegen, geen toepassing vindt ten aanzien van schepen of andere vaartuigen, welke worden gebruikt ten
      behoeve van de in die maatregel aangewezen overheidsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '39.1'
    text: |-
      Het bij of krachtens de Oorlogswet voor Nederland aangewezen militair gezag is bevoegd om indien de beperkte of de
      algemene noodtoestand is afgekondigd, met betrekking tot de ordening van het scheepvaartverkeer op scheepvaartwegen
      regels te stellen in afwijking van hetgeen is bepaald bij of krachtens deze wet en van hetgeen door besturen
      van andere openbare lichamen dan het Rijk is bepaald bij of krachtens verordeningen die betrekking hebben op
      de ordening van het scheepvaartverkeer op scheepvaartwegen, voorzover zulks met het oog op de uitvoering van de
      militaire taak ter handhaving van de uitwendige of inwendige veiligheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel39
  - number: '39.2'
    text: |-
      Overtreding van de in het eerste lid bedoelde regels wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel39
  - number: '39.3'
    text: Het in het tweede lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel39
  - number: '41'
    text: De toepasselijkheid van deze wet wordt beperkt door de in het volkenrecht erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel41
  - number: '42'
    text: |-
      De bevoegdheid van provinciale staten, gemeenteraden, waterschappen en havenschappen tot het stellen van regels
      blijft ten aanzien van het onderwerp waarin deze wet voorziet, gehandhaafd, voorzover die regels niet in strijd
      zijn met de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel42
  - number: '43'
    text: |-
      De Wet van 15 april 1891 (*Stb.* 91), houdende bepalingen ter voorkoming van aanvaring of aandrijving op de
      openbare wateren in het Rijk, die voor de scheepvaart openstaan, wordt ingetrokken, met dien verstande dat de
      krachtens genoemde wet gestelde regels worden geacht te zijn gesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel43
  - number: '44'
    text: De Wet van 20 april 1895 (*Stb.* 71) tot regeling van het bakenwezen op openbare wateren wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel44
  - number: '45'
    text: |-
      De Zeeaanvaringswet 1977 (*Stb.* 1979, 196) wordt ingetrokken, met dien verstande dat de krachtens die wet gestelde
      regels worden geacht te zijn gesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel45
  - number: '49.2'
    text: |-
      De krachtens artikel 1, onderdeel 1° en 2°, van de Wet van 28 februari 1891 tot vaststelling van bepalingen
      betreffende ’s Rijks waterstaatswerken vóór de inwerkingtreding van het eerste lid van dit artikel gestelde regels
      die betrekking hebben op het deelnemen aan het scheepvaartverkeer, worden geacht te zijn gesteld krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel49
  - number: '52.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur als bedoeld in de [artikelen 4, eerste lid, onderdeel a][ref1],
      [9, tweede lid][ref2], [10, tweede en derde lid][ref3], [11, eerste lid][ref4], [16a][ref5], dat niet uitsluitend
      bepalingen bevat ter implementatie van een besluit van de Centrale Commissie voor de Rijnvaart, wordt gelijktijdig
      in de *Staatscourant* bekend gemaakt en aan de beide Kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0004364#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0004364#Artikel16a
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel52
