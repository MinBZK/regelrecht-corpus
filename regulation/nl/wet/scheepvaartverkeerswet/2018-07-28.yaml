  - number: '52.2'
    text: |-
      Gedurende 30 dagen vanaf de dag waarop de bekendmaking is geschied, kan een ieder met betrekking tot het ontwerp
      zijn zienswijze naar voren brengen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel52
  - number: '52.3'
    text: |-
      Binnen de in het tweede lid bedoelde termijn kan door of namens een der Kamers of door ten minste een vijfde van
      het grondwettelijk aantal leden van een der Kamers van de Staten-Generaal de wens te kennen worden gegeven dat het
      in de maatregel te regelen onderwerp bij de wet wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel52
  - number: '52.4'
    text: In het geval, bedoeld in het derde lid, dienen Wij zo spoedig mogelijk een desbetreffend wetsvoorstel in.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel52
  - number: '53.1'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel53
  - number: '53.2'
    text: |-
      Bij de inwerkingtreding van deze wet stelt Onze Minister van Veiligheid en Justitie de nummering van de artikelen,
      paragrafen en hoofdstukken van deze wet opnieuw vast, en brengt de in deze wet voorkomende aanhalingen van
      de artikelen, paragrafen en hoofdstukken met de nieuwe nummering in overeenstemming. Hij draagt zorg dat de
      overeenkomstig de eerste volzin bijgewerkte tekst van deze wet in het *Staatsblad* wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel53
  - number: '54'
    text: 'Deze wet kan worden aangehaald als: Scheepvaartverkeerswet.'
    url: https://wetten.overheid.nl/BWBR0004364/2018-07-28#Artikel54
