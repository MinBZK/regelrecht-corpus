        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15'
    text: |-
      1 De kapitein op wie een verplichting als bedoeld in de [artikelen 10, eerste lid][ref1], of
      [11, eerste lid][ref2], rust, dan wel de eigenaar of rompbevrachter van het desbetreffende schip of de persoon
      die gezagvoerder is van een zeeschip dat geen Scheldevaarder is, als bedoeld in artikel 9, eerste lid, van het
      Scheldereglement, is gehouden loodsgeld te betalen.

      2 De kapitein die tijdens de vaart op een scheepvaartweg gebruik maakt van de diensten van een loods zonder dat
      daartoe op hem een verplichting als bedoeld in de [artikelen 10, eerste lid][ref3], of [11, eerste lid][ref4],
      rust, dan wel de eigenaar of rompbevrachter van het desbetreffende schip, is gehouden daarvoor loodsgeld te
      betalen.

      3 Degene die gehouden is loodsgeld te betalen, kan door de organisatie waaraan het loodsgeld is verschuldigd,
      worden verplicht tot het stellen van zekerheid met betrekking tot de voldoening van het loodsgeld en tot het
      verschaffen van de in verband met de bepaling van het toepasselijke tarief benodigde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel11
