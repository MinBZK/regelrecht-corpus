  - number: '35'
    text: |-
      1 Indien een persoon er van wordt verdacht dat hij, terwijl hij een zeeschip of samenstel van zeeschepen voerde,

      a. een in [artikel 31, eerste of tweede lid][ref1], bedoeld strafbaar feit heeft begaan,

      b. een in [artikel 31, vierde, vijfde of zesde lid][ref2], bedoeld strafbaar feit heeft begaan, waardoor ernstig
      gevaar voor de veiligheid van personen of goederen kan ontstaan,

      c. een in artikel 32 van de Herziene Rijnvaartakte strafbaar gesteld feit heeft begaan, waardoor ernstig gevaar
      voor de veiligheid van personen of goederen kan ontstaan, voorzover dit feit de overtreding betreft van een
      bepaling die krachtens deze wet is vastgesteld, of

      d. een in [artikel 31a][ref3] bedoeld strafbaar feit heeft begaan, waardoor ernstig gevaar voor de veiligheid van
      personen of goederen kan ontstaan,

      en indien redelijkerwijze moet worden gevreesd dat de betrokkene zich zal onttrekken aan de tenuitvoerlegging van
      een hem opgelegde straf, is de officier van justitie bevoegd de in het tweede lid bedoelde maatregelen te nemen.

      2 De officier van justitie is bevoegd het zeeschip of de zeeschepen van het samenstel op een door hem aan te wijzen
      plaats op een scheepvaartweg vast te doen houden, indien naar zijn oordeel de betrokkene niet voldoende zekerheid
      heeft gesteld voor een door hem te bepalen geldsom waarop een terzake van het plegen van het strafbaar feit op te
      leggen geldboete kan worden verhaald. Alvorens de plaats tot vasthouding aan te wijzen raadpleegt de officier van
      justitie het ten aanzien van de scheepvaartweg bevoegde gezag.

      3 De in het tweede lid bedoelde vasthouding mag ten hoogste vier dagen na de dag waarop tot vasthouding is
      overgegaan, duren.

      4 Indien binnen de in het derde lid genoemde termijn niet een zekerheid is gesteld als bedoeld in het tweede lid,
      kan de rechter-commissaris belast met de behandeling van strafzaken op vordering van de officier van justitie
      beslissen de vasthouding van het zeeschip of de zeeschepen van het samenstel te verlengen tot ten hoogste dertig
      dagen. De in het eerste lid bedoelde persoon die wordt verdacht van een in dat lid bedoeld strafbaar feit wordt
      vooraf gehoord of althans behoorlijk opgeroepen. De beslissing is dadelijk uitvoerbaar en wordt aan de in de vorige
      volzin bedoelde persoon betekend.

      5 De in het eerste lid bedoelde persoon die wordt verdacht van een in dat lid bedoeld strafbaar feit en de
      officier van justitie kunnen gedurende veertien dagen na betekening van de beslissing van de rechter-commissaris
      aan eerstbedoelde persoon tegen die beslissing beroep instellen bij de rechtbank. De rechtbank beslist zo spoedig
      mogelijk.

      6 De officier van justitie geeft het zeeschip of de zeeschepen van het samenstel vrij zodra de door hem ingevolge
      het tweede lid verlangde zekerheid is gesteld.

      7 De kapitein is de kosten van de vasthouding verschuldigd.

      8 Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de zekerheidstelling bedoeld in het
      tweede lid beëindigd, nadat een bij dat vonnis opgelegde geldboete, vermeerderd met de kosten van de vasthouding,
      is betaald onderscheidenlijk daarop in mindering is gebracht. Tot dat tijdstip en te rekenen vanaf de dag dat de
      zekerheid is gesteld wordt bij gederfde rente over de tot zekerheid gestelde geldsom die gederfde rente vergoed tot
      een maximum van het percentage dat is vastgesteld krachtens het bepaalde in artikel 9, derde lid, van de Wet op de
      consignatie van gelden (*Stb.* 1980, 473).

      9 Met betrekking tot dit artikel is [artikel 1, vijfde lid, onder b][ref4], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel31a
