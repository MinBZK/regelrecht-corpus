  - number: '31'
    text: |-
      1 Handelen in strijd met [artikel 26][ref1] wordt, voorzoveel daartegen niet bij het [Wetboek van Strafrecht][ref2]
      is voorzien, gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de derde categorie.

      2 Handelen in strijd met de [artikelen 27, eerste tot en met vierde lid][ref3], [28][ref4], en
      [artikel 29, derde en vierde lid][ref5], wordt gestraft met gevangenisstraf van ten hoogste drie maanden of
      geldboete van de derde categorie.

      3 Handelen in strijd met [artikel 28][ref6] wordt gestraft met gevangenisstraf van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      4 Overtreding van de regels, gesteld krachtens [artikel 4][ref7] en van de voorschriften verbonden aan een
      besluit, genomen krachtens [artikel 7, eerste lid][ref8] of met overeenkomstige toepassing daarvan krachtens
      [artikel 8][ref9], wordt gestraft met:

      a. hechtenis van ten hoogste twee maanden of geldboete van de derde categorie, indien de overtreding is begaan
      in de Nederlandse territoriale zee, voor zover het verdrag inzake het gemeenschappelijk nautisch beheer niet van
      toepassing is, de Rotterdamse waterweg, het Noordzeekanaal of de Eems-Dollard,

      b. hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie, indien de overtreding is begaan op
      een andere scheepvaartweg;

      c. hechtenis van ten hoogste twee maanden of geldboete van de derde categorie, indien de overtreding betrekking
      heeft op het ontvangen, bewaren of verstrekken van gegevens met betrekking tot de scheepvaart door organisaties of
      personen die niet deelnemen aan het scheepvaartverkeer.

      5 Overtreding van [artikel 10, eerste lid][ref10], met een zeeschip of een schip als bedoeld in
      [artikel 13][ref11], wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de derde categorie.

      6 Niet-nakoming van de verplichtingen bedoeld in [artikel 11][ref12], alsmede overtreding van de regels,
      gesteld krachtens [artikel 12][ref13], en van de voorschriften verbonden aan een besluit genomen krachtens
      [artikel 10, derde lid][ref14], met een zeeschip of een schip als bedoeld in [artikel 13][ref15] wordt gestraft met
      hechtenis van ten hoogste twee maanden of geldboete van de derde categorie.

      7 Overtreding met een Nederlands schip van de krachtens [artikel 20, eerste lid][ref16], gestelde regels, begaan
      in volle zee of op een ander in [artikel 20, eerste lid, onderdeel ][ref17], bedoeld water waarop die regels ten
      aanzien van dat schip van toepassing zijn, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete
      van de derde categorie.

      8 Overtreding van de krachtens [artikel 21][ref18] gestelde regels wordt gestraft met hechtenis van ten hoogste
      twee maanden of geldboete van de derde categorie.

      9 Overtreding van [artikel 30][ref19] wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      tweede categorie.

      10 Overtreding van [artikel 17][ref20] en van de regels, gesteld krachtens [artikel 18][ref21], wordt gestraft met
      hechtenis van ten hoogste twee weken of geldboete van de eerste categorie.

      11 Overtreding van krachtens deze wet gestelde regels, als bedoeld in het vierde, zesde, zevende, achtste en tiende
      lid, vormt slechts een strafbaar feit voor zover dit in die regels uitdrukkelijk is bepaald.

      12 Het bepaalde in het vierde lid, aanhef en onderdeel b, en het tiende lid is niet van toepassing op overtreding
      van in artikel 32 van de Herziene Rijnvaartakte strafbaar gestelde feiten.

      13 De in het eerste en tweede lid van dit artikel strafbaar gestelde feiten zijn misdrijven. De in of krachtens het
      derde tot en met tiende lid strafbaar gestelde feiten zijn overtredingen.

      14 De Nederlandse strafwet is toepasselijk op een ieder die een krachtens het achtste lid strafbaar gesteld feit
      heeft begaan.


