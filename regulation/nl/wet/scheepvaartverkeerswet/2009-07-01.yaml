  - number: '28'
    text: |-
      1 Op de eerste vordering van een opsporingsambtenaar als bedoeld in artikel 141 van het Wetboek van Strafvordering
      is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verplicht zijn medewerking te
      verlenen aan een voorlopig onderzoek van uitgeademde lucht en daartoe volgens door die opsporingsambtenaar te geven
      aanwijzingen ademlucht te blazen in een door die opsporingsambtenaar aangewezen apparaat.

      2 Het eerste lid is van overeenkomstige toepassing op degene die aanstalten maakt een schip dat op een
      scheepvaartweg voor vertrek gereed ligt, te gaan voeren of sturen, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te gaan adviseren.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel28
  - number: 28a
    text: |-
      1 Indien degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of verkeersdeelnemer adviseert over de te voeren navigatie, verdacht wordt van handelen
      in strijd met [artikel 27, eerste, tweede of vierde lid][ref1], kan een opsporingsambtenaar als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref2] hem bevelen zijn medewerking te verlenen aan een onderzoek
      als bedoeld in [artikel 27, tweede lid, onderdeel a ][ref3].

      2 De verdachte aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht te blazen in een
      voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten dienste van het
      onderzoek gegeven aanwijzingen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die aanstalten maakt een schip dat
      op een scheepvaartweg voor vertrek gereed ligt, te gaan voeren of sturen, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te gaan adviseren, indien de
      opsporingsambtenaar redelijkerwijs kan aannemen dat dit voeren, sturen of adviseren zal leiden tot handelen in
      strijd met [artikel 27, eerste of tweede lid][ref4].

      4 De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het
      verlenen van medewerking aan een onderzoek van uitgeademde lucht voor hem om bijzondere geneeskundige redenen
      onwenselijk is.

      5 In het geval bedoeld in het vierde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot een
      voltooid onderzoek van uitgeademde lucht, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming
      geeft tot het verrichten van een onderzoek als bedoeld in [artikel 27, tweede lid, onderdeel b][ref5]. Gelijke
      bevoegdheid heeft de opsporingsambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een
      andere in [artikel 27, eerste lid][ref6], bedoelde stof dan alcoholhoudende drank verkeert.

      6 Indien de verdachte zijn op grond van het vijfde lid gevraagde toestemming niet verleent, kan de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, hem bevelen zich te onderwerpen aan een
      bloedonderzoek.

      7 De verdachte die is bevolen zich aan een bloedonderzoek te onderwerpen, is verplicht aan dit bevel gevolg te
      geven en zijn medewerking te verlenen. Hem wordt door een arts zoveel bloed afgenomen als voor het onderzoek
      noodzakelijk is.

      8 De in het zevende lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname
      van bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.

      9 De krachtens het achtste lid van de in het zevende lid genoemde verplichtingen vrijgestelde personen zijn
      verplicht mee te werken aan een door de officier van justitie, door een hulpofficier van justitie of door een van
      de daartoe bij regeling van Onze Minister van Justitie aangewezen ambtenaren, aangesteld voor de uitvoering van
      de politietaak, bevolen onderzoek teneinde op andere wijze dan door bloed- of ademonderzoek het gebruik van de in
      [artikel 27, eerste lid][ref7], bedoelde stoffen of het in [artikel 27, tweede lid, onderdeel ][ref8], genoemde
      gehalte vast te stellen.

      10 Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met de toestemming van de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren, aangesteld voor de uitvoering van de politietaak, door een arts de in het zevende lid
      bedoelde hoeveelheid bloed worden afgenomen, tenzij aannemelijk is dat dit bij hem om bijzondere geneeskundige
      redenen onwenselijk is. Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid
      is gesteld zijn toestemming daartoe te geven. Zo nodig kan hem overeenkomstig het zesde lid worden bevolen zijn
      medewerking te verlenen. De verdachte aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te
      verlenen. Indien de verdachte weigert zijn medewerking te verlenen wordt het bloedmonster vernietigd.

      11 Bij algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Justitie, worden regels gesteld
      omtrent de wijze van uitvoering van [artikel 28 en van dit artikel][ref9]. Deze regels hebben mede betrekking op
      de mogelijkheid tot het doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden
      in de bij die algemene maatregel van bestuur aangegeven gevallen voorschriften ter uitvoering van die regels
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
