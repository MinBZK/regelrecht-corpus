  - number: 37a
    text: |-
      1 In afwijking van het bij of krachtens deze wet bepaalde kan Onze Minister de maatregelen treffen die hij nodig
      acht in het belang van een ordelijk verloop van het scheepvaartverkeer.

      2 Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de door hem krachtens
      het eerste lid getroffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel37a
  - number: '38'
    text: |-
      1 Toepassing van het bepaalde bij of krachtens de [artikelen 4 tot en met 13][ref1] kan ten aanzien van de
      Nederlandse territoriale zee of daarop aansluitende scheepvaartwegen mede geschieden in het belang van de
      uitwendige veiligheid.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat hetgeen bij of krachtens de
      [artikelen 4 tot en met 13][ref2] is bepaald en hetgeen door besturen van andere openbare lichamen dan het Rijk
      is bepaald bij of krachtens verordeningen die betrekking hebben op de ordening van het scheepvaartverkeer op
      scheepvaartwegen, geen toepassing vindt ten aanzien van schepen of andere vaartuigen, welke in gebruik zijn voor de
      uitvoering van de militaire taak.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat hetgeen bij of krachtens de
      [artikelen 4 tot en met 13][ref3] is bepaald en hetgeen door besturen van andere openbare lichamen dan het Rijk
      is bepaald bij of krachtens verordeningen die betrekking hebben op de ordening van het scheepvaartverkeer op
      scheepvaartwegen, geen toepassing vindt ten aanzien van schepen of andere vaartuigen, welke worden gebruikt ten
      behoeve van de in die maatregel aangewezen overheidsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
