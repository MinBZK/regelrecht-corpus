        paragraaf: '4'
  - number: '25'
    text: |-
      Indien een verkeersdeelnemer aan wie een verkeersaanwijzing is gegeven, een krachtens
      [artikel 4, eerste lid, onderdeel d][ref1], geregelde verplichting met betrekking tot een verkeersaanwijzing
      overtreedt en daarvoor onmiddellijk gevaar voor de veiligheid van personen of goederen ontstaat of dreigt te
      ontstaan, is het bevoegd gezag bevoegd tot oplegging van een last onder bestuursdwang ter voorkoming of bestrijding
      van dat gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
