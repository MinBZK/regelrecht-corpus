  - number: '36'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat de [artikelen 10, eerste lid][ref1], [15][ref2]
      en [17][ref3] alsmede de krachtens de [artikelen 4][ref4], [11][ref5] en [12][ref6] gestelde regels die in die
      maatregel zijn aangegeven, niet of slechts met beperkingen van toepassing zijn op Nederlandse of daarmee in
      die maatregel gelijk te stellen oorlogsschepen, die zich bevinden in de territoriale zee of daarop aansluitende
      Nederlandse scheepvaartwegen die in die maatregel zijn aangewezen.

      Bij algemene maatregel van bestuur kan worden bepaald dat [artikel 15, eerste en tweede lid][ref7], niet of slechts
      met beperkingen van toepassing is op andere dan Nederlandse oorlogsschepen, indien dit met de vlaggestaat van de
      betreffende schepen is overeengekomen.

      2 Bij algemene maatregel van bestuur kan het scheepvaartverkeer de toegang tot scheepvaartwegen die uitsluitend
      zijn bestemd tot gebruik door Nederlandse oorlogsschepen dan wel door andere Nederlandse schepen of andere
      vaartuigen, welke in gebruik zijn voor de uitvoering van de militaire taak, worden verboden of slechts in beperkte
      mate toegestaan.

      3 Overtreding van de in het tweede lid bedoelde regels wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      4 Het in het derde lid strafbaar gestelde feit is een overtreding.


