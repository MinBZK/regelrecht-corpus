  - number: '26'
    text: |-
      Het is verboden om opzettelijk wederrechtelijk een aan een ander toebehorend schip of ander vaartuig te gebruiken
      voor het deelnemen aan het scheepvaartverkeer op een scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel26
  - number: '27'
    text: |-
      1 Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen,
      terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijze moet weten, dat het
      gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het voeren
      of sturen van dat schip, dan wel de bekwaamheid tot het adviseren van de kapitein of de verkeersdeelnemer, kan
      verminderen, dat hij niet in staat moet worden geacht dat schip naar behoren te kunnen voeren of te kunnen sturen,
      dan wel de kapitein of de verkeersdeelnemer naar behoren te kunnen adviseren.

      2 Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen, na
      zodanig gebruik van alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan driehonderdvijftig microgram alcohol
      per liter uitgeademde lucht;

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,8 milligram alcohol per
      milliliter bloed.

      3 Het is degene die op een scheepvaartweg een varend schip voert verboden dit te doen sturen door een persoon,
      waarvan hij weet of redelijkerwijze moet weten dat deze verkeert in een toestand als in het eerste lid of tweede
      lid omschreven.

      4 Het is degene die op een scheepvaartweg een varend klein schip voert of stuurt verboden dit te doen terwijl
      hij verkeert in een toestand als omschreven in het eerste of tweede lid en het verkeer belemmert of dreigt te
      belemmeren.

      5 In dit artikel en in de [artikelen 28][ref1], [28][ref2] en [29][ref3] wordt onder een varend schip verstaan een
      schip dat niet ten anker of gemeerd ligt.

      6 In dit artikel wordt onder een klein schip verstaan:

      a. een schip met een lengte van minder dan 20 meter dat uitsluitend door spierkracht wordt voortbewogen;

      b. een schip met een lengte van minder dan 5 meter dat uitsluitend door middel van zijn zeilen wordt voortbewogen
      of dat ter voortbeweging gebruik maakt van een motor waarmee geen hogere snelheid bereikt kan worden dan zes
      kilometer per uur.

      7 In dit artikel wordt onder lengte van een schip verstaan de grootste lengte van de romp gemeten van de voorkant
      van het voorste tot de achterkant van het achterste deel van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel29
