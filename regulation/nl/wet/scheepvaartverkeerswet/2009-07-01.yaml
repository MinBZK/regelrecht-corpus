  - number: '33'
    text: |-
      Een opsporingsambtenaar als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] kan, indien hij
      op grond van feiten of omstandigheden redelijkerwijze kan vermoeden dat een schip betrokken is geweest bij een
      aanvaring waarbij een persoon is gedood, letsel heeft bekomen of in zijn gezondheid is benadeeld dan wel aan enige
      zaak die niet toebehoort aan een persoon die zich op het schip bevindt, schade is toegebracht, in het belang van
      de opsporing van de verkeersdeelnemer of de andere personen die deel uitmaken van de bemanning vorderen dat zij
      de inlichtingen en gegevens verstrekken die nodig zijn voor de vaststelling van hun identiteit en van die van het
      schip.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
