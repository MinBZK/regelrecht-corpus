        bwb_id: BWBR0003765
      - id: ref2
        bwb_id: BWBR0003765
        artikel: '17'
  - number: '24'
    text: |-
      Onze Minister, indien deze het bevoegd gezag is, is bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel24
  - number: 24a
    text: |-
      Onze Minister is gerechtigd te verrichten hetgeen in strijd met het bepaalde bij of krachtens [artikel 15][ref1],
      wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
