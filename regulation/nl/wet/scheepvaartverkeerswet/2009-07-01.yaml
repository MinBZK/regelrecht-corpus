  - number: '53'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      2 Bij de inwerkingtreding van deze wet stelt Onze Minister van Justitie de nummering van de artikelen, paragrafen
      en hoofdstukken van deze wet opnieuw vast, en brengt de in deze wet voorkomende aanhalingen van de artikelen,
      paragrafen en hoofdstukken met de nieuwe nummering in overeenstemming. Hij draagt zorg dat de overeenkomstig de
      eerste volzin bijgewerkte tekst van deze wet in het *Staatsblad* wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel53
  - number: '54'
    text: 'Deze wet kan worden aangehaald als: Scheepvaartverkeerswet.'
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel54
