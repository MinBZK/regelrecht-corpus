  - number: 15c
    text: |-
      1 De kapitein, eigenaar of rompbevrachter van een zeeschip dat gevoerd wordt door een verkeersdeelnemer op wie een
      verplichting rust als bedoeld in [artikel 4, derde lid][ref1], gericht op het deelnemen aan verkeersbegeleiding,
      is gehouden het verkeersbegeleidingstarief te betalen en de in verband met de bepaling van het tarief benodigde
      informatie te verstrekken.

      2 In bij algemene maatregel van bestuur aan te wijzen gevallen en op een in die maatregel aan te geven wijze kan
      Onze Minister aan een kapitein, eigenaar of rompbevrachter een gehele of gedeeltelijke ontheffing verlenen van
      de verplichting tot het betalen van het in het eerste lid bedoelde tarief. Aan een besluit tot ontheffing kunnen
      voorschriften en beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15d
    text: |-
      1 Het verkeersbegeleidingstarief strekt tot vergoeding van ten laste van het Rijk komende kosten van
      verkeersbegeleiding, voor zover deze strekt tot individuele dienstverlening.

      2 Het in het eerste lid bedoelde tarief is verschuldigd aan het Rijk. Bij algemene maatregel van bestuur worden
      de scheepvaartwegen aangewezen waarop het tarief is verschuldigd en worden de maatstaven voor de toepassing en de
      vrijstellingen van het verkeersbegeleidingstarief geregeld. Daarin kunnen regels worden gesteld betreffende het
      stellen van zekerheid.

      3 Het in het eerste lid bedoelde tarief wordt vastgesteld bij ministeriële regeling. Bij ministeriële regeling
      worden tevens regels gesteld met betrekking tot de inning en de wijze van betaling van het tarief. Onze Minister,
      onderscheidenlijk het bij ministeriële regeling aangewezen bestuursorgaan of de bij ministeriële regeling
      aangewezen ambtenaar is bevoegd tot het uitvaardigen van een dwangbevel tot invordering van de verschuldigde
      geldsom.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel15d
  - number: '16'
    text: |-
      De [artikelen 15][ref1] en [15][ref2] zijn van overeenkomstige toepassing ten aanzien van een schip dat geen
      zeeschip is en op degene die daarover de leiding heeft, het schip in eigendom heeft of het als rompbevrachter
      exploiteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15a
