        artikel: 15d
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '17'
    text: |-
      1 Degene die een schip voert dat behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie,
      is verplicht om aan de daartoe bij of krachtens die maatregel aangewezen personen ten behoeve van de statistiek
      bepaalde gegevens te verstrekken met betrekking tot het schip, de daarmee vervoerde lading of de uit te voeren
      reis.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld. Deze regels hebben slechts betrekking op:

      a. de inhoud van de te verstrekken gegevens;

      b. de plaatsen waar gegevens moeten worden verstrekt;

      c. het verstrekken van de gegevens.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel17
  - number: '18'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het gebruik van
      scheepvaartwegen door personen die zich anders dan op een schip te water bevinden.

      2 Deze regels mogen slechts strekken tot het voorkomen of het beperken van hinder of gevaar voor het
      scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel18
  - number: '19'
    text: |-
      Het stellen van regels krachtens het bepaalde in de [hoofdstukken 2 tot en met 4][ref1] geschiedt met inachtneming
      van bindende verdragen en bindende besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '20'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties voor zover die het Koninkrijk binden, regels worden gesteld met betrekking tot het deelnemen aan het
      scheepvaartverkeer door Nederlandse zeeschepen:

      a. in volle zee;

      b. op alle niet-Nederlandse wateren die met de volle zee in verbinding staan en bevaarbaar zijn voor zeegaande
      schepen.

      2 Het bepaalde in het eerste lid, onderdeel *b*, is niet van toepassing, voorzover door de voor die wateren daartoe
      bevoegde autoriteiten afwijkende regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel20
  - number: '21'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties welke betrekking hebben op de ordening van het scheepvaartverkeer voor de Nederlandse kust buiten de
      Nederlandse territoriale zee, voorzover die verdragen of besluiten het Koninkrijk binden, regels worden gesteld.
      Voorzover daarbij uitvoering wordt gegeven aan artikel 211, zesde lid, van het op 10 december 1982 te Montego-Bay
      totstandgekomen Verdrag van de Verenigde Naties inzake het recht van de zee (Trb. 1983, 83), geschiedt zulks met
      inachtneming van de voorschriften, genoemd in dat verdrag.

      2 In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze
      Minister bevoegd worden verklaard tot het stellen van nadere regels.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel21
  - number: '22'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van de Herziene Rijnvaartakte voor zover dit
      noodzakelijk is voor een goede uitvoering van dat verdrag met betrekking tot de scheepvaart, regels inzake andere
      onderwerpen dan die bedoeld in de [Hoofdstukken 2 tot en met 4][ref1] worden gesteld.

      2 In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze
      Minister bevoegd worden verklaard tot het stellen van nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '23'
    text: |-
      Bij de toepassing van de [artikelen 19 tot en met 21][ref1] wordt afgeweken van het bepaalde in deze wet, indien
      verdragen of besluiten van volkenrechtelijke organisaties voor zover deze het Koninkrijk binden daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel19
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '19'
        hoofdstuk: '5'
  - number: 23a
    text: |-
      Behoeft een burgemeester in geval van een ramp of een zwaar ongeval als bedoeld in de
      [Wet rampen en zware ongevallen][ref1] of van ernstige vrees voor het ontstaan daarvan bijstand van de
      Gemeenschappelijk Nautische Autoriteit, genoemd in artikel 6 van het verdrag inzake het gemeenschappelijk nautisch
      beheer, dan dient hij daartoe met toepassing van [artikel 17 van die wet][ref2] een verzoek in. Onze Minister
      verzoekt de Gemeenschappelijke Nautische Autoriteit om bijstand.


      [ref1]: https://wetten.overheid.nl/BWBR0003765
      [ref2]: https://wetten.overheid.nl/BWBR0003765#Artikel17
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel23a
