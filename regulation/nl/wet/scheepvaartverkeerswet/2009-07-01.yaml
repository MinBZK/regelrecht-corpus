  - number: '39'
    text: |-
      1 Het bij of krachtens de Oorlogswet voor Nederland aangewezen militair gezag is bevoegd om indien de beperkte
      of de algemene noodtoestand is afgekondigd, met betrekking tot de ordening van het scheepvaartverkeer op
      scheepvaartwegen regels te stellen in afwijking van hetgeen is bepaald bij of krachtens deze wet en van hetgeen
      door besturen van andere openbare lichamen dan het Rijk is bepaald bij of krachtens verordeningen die betrekking
      hebben op de ordening van het scheepvaartverkeer op scheepvaartwegen, voorzover zulks met het oog op de uitvoering
      van de militaire taak ter handhaving van de uitwendige of inwendige veiligheid noodzakelijk is.

      2 Overtreding van de in het eerste lid bedoelde regels wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      3 Het in het tweede lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel39
  - number: '41'
    text: De toepasselijkheid van deze wet wordt beperkt door de in het volkenrecht erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel41
  - number: '42'
    text: |-
      De bevoegdheid van provinciale staten, gemeenteraden, waterschappen en havenschappen tot het stellen van regels
      blijft ten aanzien van het onderwerp waarin deze wet voorziet, gehandhaafd, voorzover die regels niet in strijd
      zijn met de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel42
  - number: '43'
    text: |-
      De Wet van 15 april 1891 (*Stb.* 91), houdende bepalingen ter voorkoming van aanvaring of aandrijving op de
      openbare wateren in het Rijk, die voor de scheepvaart openstaan, wordt ingetrokken, met dien verstande dat de
      krachtens genoemde wet gestelde regels worden geacht te zijn gesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel43
  - number: '44'
    text: De Wet van 20 april 1895 (*Stb.* 71) tot regeling van het bakenwezen op openbare wateren wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel44
  - number: '45'
    text: |-
      De Zeeaanvaringswet 1977 (*Stb.* 1979, 196) wordt ingetrokken, met dien verstande dat de krachtens die wet gestelde
      regels worden geacht te zijn gesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel45
  - number: '49'
    text: |-
      1

      2 De krachtens artikel 1, onderdeel 1° en 2°, van de Wet van 28 februari 1891 tot vaststelling van bepalingen
      betreffende ’s Rijks waterstaatswerken vóór de inwerkingtreding van het eerste lid van dit artikel gestelde regels
      die betrekking hebben op het deelnemen aan het scheepvaartverkeer, worden geacht te zijn gesteld krachtens deze
      wet.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel49
  - number: '51'
    text: |-
      Het koninklijk besluit van 30 juni 1983 (*Stb.* 389), houdende het van kracht zijn voor de Rijn in Nederland van
      het Reglement van politie voor de Rijnvaart (Besluit Rijnvaartpolitiereglement 1983), en de besluiten tot wijziging
      van dat besluit, worden geacht te zijn vastgesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel51
  - number: '52'
    text: |-
      1 Het ontwerp van een algemene maatregel van bestuur als bedoeld in de [artikelen 4, eerste lid, onderdeel a][ref1],
      [9, tweede lid][ref2], [10, tweede en derde lid][ref3], [11, eerste lid][ref4], [16a][ref5], wordt gelijktijdig in
      de *Staatscourant* bekend gemaakt en aan de beide Kamers der Staten-Generaal overgelegd.

      2 Gedurende 30 dagen vanaf de dag waarop de bekendmaking is geschied, kan een ieder met betrekking tot het ontwerp
      zijn zienswijze naar voren brengen bij Onze Minister.

      3 Binnen de in het tweede lid bedoelde termijn kan door of namens een der Kamers of door ten minste een vijfde van
      het grondwettelijk aantal leden van een der Kamers van de Staten-Generaal de wens te kennen worden gegeven dat het
      in de maatregel te regelen onderwerp bij de wet wordt geregeld.

      4 In het geval, bedoeld in het derde lid, dienen Wij zo spoedig mogelijk een desbetreffend wetsvoorstel in.


