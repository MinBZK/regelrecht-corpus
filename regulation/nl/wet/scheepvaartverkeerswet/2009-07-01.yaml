      1 Voor zover bij of krachtens het Koninkrijk bindende verdragen of besluiten van volkenrechtelijke organisaties
      wordt voorzien in het onderwerp van de regeling van [artikel 27, eerste tot en met vierde lid][ref1], zijn deze
      artikelleden niet van toepassing.

      2 Indien bij of krachtens het Koninkrijk bindende verdragen of besluiten van volkenrechtelijke organisaties
      wordt voorzien in het onderwerp van de regeling van [artikel 27, eerste tot en met vierde lid][ref2], zijn de
      [artikelen 27, vijfde lid][ref3], [28][ref4], [28a][ref5] en [29][ref6] van overeenkomstige toepassing.


