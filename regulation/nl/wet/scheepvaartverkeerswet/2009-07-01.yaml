  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke personen bevoegd zijn tot het geven van
      verkeersinformatie dan wel tot het geven van verkeersaanwijzingen.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen waaraan in het
      eerste lid bedoelde personen wat opleiding, kundigheid en ervaring betreft moeten voldoen voor de uitvoering van de
      in dat lid genoemde taken.

      3 Indien krachtens de in het tweede lid bedoelde maatregel regels worden gesteld voor ambtenaren, aangesteld voor
      de uitoefening van de politietaak, worden die regels gesteld in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel9
  - number: '10'
    text: |-
      1 De kapitein is verplicht om tijdens de vaart van het zeeschip op de in de bijlage van deze wet aangegeven
      scheepvaartwegen gebruik te maken van de diensten van een loods.

      2 Van de in het eerste lid bedoelde verplichting kan ten aanzien van een of meer in de bijlage van deze wet
      aangegeven scheepvaartwegen bij algemene maatregel van bestuur vrijstelling worden verleend voor:

      a. daarbij aangewezen categorieën van zeeschepen;

      b. zeeschepen indien de kapitein of een aan boord zijnde stuurman tijdens de vaart op de desbetreffende
      scheepvaartweg in het bezit is van een verklaring van vrijstelling en als verkeersdeelnemer optreedt. Een
      verklaring van vrijstelling wordt afgegeven aan degene die voldoet aan daartoe bij algemene maatregel van bestuur
      te stellen eisen. Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de
      afgifte van de verklaring van vrijstelling en de opleiding en examinering van degenen die voor een dergelijke
      verklaring in aanmerking wensen te komen en worden een of meer instanties aangewezen die, naast de besturen van de
      regionale loodsencorporaties, met het verzorgen van een opleiding en het afnemen van examens zijn belast.

      3 Van de in het eerste lid bedoelde verplichting kan in bij algemene maatregel van bestuur te bepalen
      omstandigheden of gevallen en op een in die maatregel aan te geven wijze door Onze Minister of een in die maatregel
      aangewezen ander gezag, zonodig onder beperkingen, voor een zeeschip ontheffing worden verleend. Aan een besluit
      tot ontheffing kunnen voorschriften worden verbonden.

      4 Bij de toepassing van het tweede en derde lid wordt rekening gehouden met de in [artikel 3, eerste lid][ref1],
      bedoelde belangen.

      5 Ter uitvoering van de aanvraag om afgifte van een verklaring van vrijstelling, de periodieke controle op de
      houders van verklaringen en de intrekking van verklaringen, worden persoonsgegevens betreffende de gezondheid
      verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of aan de wettelijke vereisten
      voor de afgifte van een verklaring is voldaan onderscheidenlijk niet meer wordt voldaan. Het bij of krachtens
      algemene maatregel van bestuur aangewezen bestuursorgaan dat is belast met de afgifte en de intrekking van
      verklaringen van vrijstelling is verantwoordelijke voor deze verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel3
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11'
    text: |-
      1 In bij algemene maatregel van bestuur te bepalen omstandigheden of gevallen en op een in die maatregel aan te
      geven wijze kan door Onze Minister of een in die maatregel aangewezen ander gezag

      a. de kapitein die op grond van [artikel 10, tweede lid][ref1], van de loodsplicht is vrijgesteld, niettemin worden
      verplicht om tijdens de vaart van het zeeschip op een in de bijlage van deze wet aangegeven scheepvaartweg gebruik
      te maken van de diensten van een loods;

      b. de kapitein worden verplicht om tijdens de vaart van het zeeschip op een door genoemde Minister of dat ander
      gezag aangewezen scheepvaartweg die niet is aangegeven in de bijlage van deze wet, gebruik te maken van de diensten
      van een loods; en

      c. de kapitein worden verplicht ten behoeve van het loodsen aanwijzingen op te volgen met betrekking tot:

      1°. het gebruik van meer dan één loods; en

      2°. het gebruik maken van de diensten van een loods aan boord van het zeeschip, dan wel vanaf de wal of vanaf een
      ander schip.

      2 De maatregel, bedoeld in het eerste lid, heeft geen betrekking op scheepvaartwegen waarop bij of krachtens
      hoofdstuk III van het Scheldereglement een loodsplicht geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur worden voor kapiteins verplichtingen ten behoeve van het loodsen geregeld.

      2 Deze verplichtingen hebben slechts betrekking op:

      a. het aanvragen van een loods;

      b. de dienstverrichting van een loods;

      c. het verstrekken van voor het loodsen noodzakelijke inlichtingen;

      d. het treffen van voor het loodsen noodzakelijke voorzieningen.

      3 In de krachtens het eerste lid te stellen regels kan met betrekking tot bepaalde onderdelen daarvan Onze Minister
      bevoegd worden verklaard nadere regels te stellen.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel12
  - number: '13'
    text: |-
      Het bepaalde in deze paragraaf is van overeenkomstige toepassing ten aanzien van een schip dat geen zeeschip is en
      degene die daarover de leiding heeft, indien dit schip zich op zee bevindt.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel13
  - number: '14'
    text: |-
      1 Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om verkeerstekens voor het
      scheepvaartverkeer dat zich op een scheepvaartweg bevindt, aan te brengen of te verwijderen in verband met
      door een ander in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale
      verkeersgebruik van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te
      vergoeden die het heeft gemaakt voor het aanbrengen of verwijderen van die verkeerstekens.

      2 Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om schepen op een scheepvaartweg te
      volgen, daaraan verkeersinformatie te geven dan wel deze te begeleiden met een schip in verband met door een ander
      in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale verkeersgebruik
      van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te vergoeden, die het heeft
      gemaakt voor die maatregelen.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel14
  - number: 14a
    text: |-
      1 De kosten verbonden aan de aanvraag en de afgifte van diploma’s en verklaringen van vrijstelling als bedoeld in
      [artikel 10, tweede lid, onderdeel b ][ref1], de deelname aan de daarvoor vereiste opleidingen en examens en de
      afgifte van andere documenten, verplicht gesteld bij of krachtens deze wet, kunnen ten laste worden gebracht van de
      aanvrager van het diploma of andere document, onderscheidenlijk de kandidaat voor de bedoelde examens.

      2 De tarieven voor de kosten van deelname aan de opleidingen en de examens, en voor de verstrekking van afschriften
      uit de krachtens deze wet door de Nederlandse loodsencorporatie bij te houden registers worden vastgesteld bij
      besluit van de raad van bestuur van de Nederlandse Mededingingsautoriteit, overeenkomstig het bepaalde bij of
      krachtens [hoofdstuk VIA van de Loodsenwet](onbekend). De tarieven voor de overige kosten worden vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel14a
    references:
