  - number: '30'
    text: |-
      1 Het is verboden om, zonder daartoe bevoegd te zijn, een krachtens [artikel 4, eerste lid, onderdeel b][ref1], of
      een krachtens het verdrag inzake het gemeenschappelijk nautisch beheer vastgesteld verkeersteken aan te brengen of
      te doen aanbrengen dan wel te verwijderen of te doen verwijderen.

      2 Het is verboden om een voorwerp van welke aard ook, dat het scheepvaartverkeer op een scheepvaartweg in
      verwarring zou kunnen brengen, daarlangs, daarin of daarboven aan te brengen, te doen aanbrengen of te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
