  - number: '4'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. het deelnemen aan het scheepvaartverkeer op scheepvaartwegen;

      b. verkeerstekens;

      c. bekendmakingen met dezelfde strekking als een verkeersteken;

      d. verkeersaanwijzingen;

      e. het ontvangen, bewaren en verstrekken van gegevens met betrekking tot de scheepvaart door organisaties en
      personen die niet deelnemen aan het scheepvaartverkeer.

      2 De in het eerste lid, onder a, bedoelde regels kunnen slechts inhouden:

      a. verplichtingen met betrekking tot:

      1°. het varen en het ligplaats nemen met schepen en andere vaartuigen;

      2°. het tonen van optische tekens door schepen en andere vaartuigen;

      3°. het geven van geluidsseinen door schepen;

      4°. de aanwezigheid en het gebruik van bepaalde navigatiemiddelen aan boord van schepen;

      5°. de aanwezigheid en het gebruik van bepaalde communicatiemiddelen aan boord van schepen;

      6°. het aanbrengen van kentekens op schepen;

      b. andere verplichtingen van verkeersdeelnemers of andere personen aan boord van schepen en andere vaartuigen met
      betrekking tot het deelnemen aan het scheepvaartverkeer;

      c. verplichtingen van andere personen dan die genoemd in onderdeel b, met betrekking tot het deelnemen aan het
      scheepvaartverkeer.

      3 Bij algemene maatregel van bestuur kunnen voor daarin aangewezen scheepvaartwegen in afwijking van of in
      aanvulling op de krachtens het eerste lid, onder a, te stellen regels andere regels met betrekking tot het
      deelnemen aan het scheepvaartverkeer worden gesteld. Daarin kunnen aan degenen die een schip voeren, naast
      verplichtingen met betrekking tot de in het tweede lid bedoelde onderwerpen, verplichtingen worden opgelegd, die al
      dan niet gericht zijn op het deelnemen aan verkeersbegeleiding en onder andere betrekking hebben op het melden van
      aankomst, vertrek of positie van een schip, alsmede van gegevens met betrekking tot het schip, de daarmee vervoerde
      lading, of de uit te voeren reis.

      4 Ter uitvoering van het eerste lid, onderdeel e, kunnen ten behoeve van de River Information Services
      persoonsgegevens worden verwerkt. De verwerking van deze gegevens vindt plaats teneinde een goede uitvoering te
      kunnen geven aan de bij of krachtens deze wet gestelde voorschriften omtrent de toepassing van River Information
      Services. De bij of krachtens algemene maatregel van bestuur aangewezen bevoegde autoriteit is verantwoordelijke
      voor deze verwerking.

      5 Ter uitvoering van het tweede lid, onderdeel b, worden persoonsgegevens betreffende de gezondheid en
      strafrechtelijke persoonsgegevens verwerkt. De verwerking van deze gegevens vindt plaats teneinde te kunnen
      beoordelen of de aanvragers van bij algemene maatregel van bestuur aangewezen Rijnpatenten voldoen of niet meer
      voldoen aan de wettelijke vereisten voor de verlening van deze patenten. De bij of krachtens algemene maatregel van
      bestuur aangewezen bevoegde autoriteit is verantwoordelijke voor deze verwerking.

      6 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de bescherming van de
      persoonsgegevens die in het kader van River Information Services worden verkregen alsmede met betrekking tot de
      bescherming van de persoonlijke levenssfeer bij de toepassing van River Information Services.

      7 In de krachtens het eerste lid, onderdelen a of e, het derde en zesde lid te stellen regels kan met betrekking
      tot daarin aangewezen onderdelen Onze Minister bevoegd worden verklaard tot het stellen van nadere regels.

      8 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de apparatuur en de
      softwaretoepassingen die ten behoeve van River Information Services worden gebruikt door personen en organisaties
      die niet deelnemen aan het scheepvaartverkeer als bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel4
  - number: '5'
    text: |-
      1 Beslissingen met betrekking tot het aanbrengen of verwijderen van een verkeersteken worden genomen door het
      bevoegd gezag. Dit gezag draagt zorg voor het aanbrengen of verwijderen van verkeerstekens.

      2 Het bevoegd gezag kan van de bevoegdheid tot het nemen van beslissingen als bedoeld in het eerste lid machtiging
      verlenen aan degene die is belast met de uitoefening van de bij of krachtens deze wet verleende bevoegdheden ten
      aanzien van de deelname aan het scheepvaartverkeer op de desbetreffende scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel5
  - number: '6'
    text: |-
      1 Een verkeersteken dat een gebod of verbod dan wel de opheffing van een gebod of verbod aangeeft, wordt, behoudens
      in bij algemene maatregel van bestuur aan te geven bijzondere omstandigheden, niet aangebracht of verwijderd dan
      nadat het desbetreffende besluit door de zorg van het bevoegd gezag is bekendgemaakt.

      2 Een belanghebbende kan tegen een besluit als bedoeld in het eerste lid beroep instellen bij de rechtbank.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de totstandkoming van besluiten als
      bedoeld in het eerste lid en de wijze van bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel6
  - number: '7'
    text: |-
      1 Van een gebod of verbod, aangegeven met een verkeersteken, kan door het bevoegd gezag, zonodig onder beperkingen,
      vrijstelling of ontheffing worden verleend. Aan een besluit tot vrijstelling of ontheffing kunnen voorschriften
      worden verbonden.

      2 Bij de toepassing van het eerste lid wordt rekening gehouden met het belang of de belangen, ten dienste waarvan
      het desbetreffende gebod of verbod is gesteld.

      3 Een besluit met betrekking tot een vrijstelling of een kennisgeving van een besluit met betrekking tot een
      ontheffing wordt door de zorg van het bevoegd gezag bekendgemaakt.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld inzake de totstandkoming van besluiten met
      betrekking tot een vrijstelling of een ontheffing en de wijze van bekendmaking als bedoeld in het derde lid.

      5 Het bevoegd gezag kan van de bevoegdheid, bedoeld in het eerste lid, mandaat verlenen aan degene die is belast
      met de uitoefening van de bij of krachtens deze wet verleende bevoegdheden ten aanzien van de deelname aan het
      scheepvaartverkeer op de desbetreffende scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2009-07-01#Artikel7
  - number: '8'
    text: |-
      De [artikelen 5 tot en met 7][ref1] zijn van overeenkomstige toepassing met betrekking tot bekendmakingen met
      dezelfde strekking als een verkeersteken.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel5
