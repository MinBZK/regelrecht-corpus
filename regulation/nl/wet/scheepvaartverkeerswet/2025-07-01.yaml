  - number: '9'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur wordt bepaald welke personen bevoegd zijn tot het geven van
      verkeersinformatie dan wel tot het geven van verkeersaanwijzingen.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de eisen waaraan in het
      eerste lid bedoelde personen wat opleiding, kundigheid en ervaring betreft moeten voldoen voor de uitvoering van de
      in dat lid genoemde taken.

      3 Indien krachtens de in het tweede lid bedoelde maatregel regels worden gesteld voor ambtenaren van politie,
      aangesteld voor de uitvoering van de politietaak, worden die regels gesteld in overeenstemming met Onze Minister
      van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel9
  - number: '10'
    text: |-
      1 De kapitein van een zeeschip maakt tijdens de vaart op de scheepvaartwegen die deel uitmaken van een
      zeehavengebied, gebruik van de diensten van een loods.

      2 Voor de toepassing van het eerste lid wordt onder zeehavengebied verstaan de scheepvaartwegen die deel uitmaken
      van een zeehaven, die de aanloop daarnaar vormen of de verbinding vormen tussen zeehavens.

      3 Bij of krachtens algemene maatregel van bestuur worden de in het eerste lid bedoelde zeehavengebieden en
      scheepvaartwegen nader aangeduid.

      4 Onverminderd het eerste lid maakt de kapitein van een zeeschip in ieder geval in bij of krachtens algemene
      maatregel van bestuur te bepalen omstandigheden, ook op andere daarvoor aangewezen scheepvaartwegen gebruik van de
      diensten van een loods.

      5 Bij of krachtens algemene maatregel van bestuur wordt het gezag aangewezen dat op een in die maatregel aan te
      geven wijze belast wordt met de uitvoering van deze paragraaf en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Van de verplichting, bedoeld in [artikel 10, eerste lid][ref1], kan ten aanzien van een of meerdere aangewezen
      scheepvaartwegen in een zeehavengebied bij of krachtens algemene maatregel van bestuur:

      a. aan de kapitein van een zeeschip behorend tot een bepaalde categorie zeeschepen vrijstelling worden verleend;

      b. aan de kapitein vrijstelling, respectievelijk ontheffing, worden verleend voor een zeeschip indien de kapitein
      of eerste stuurman tijdens de vaart op de betreffende scheepvaartweg, voldoet aan de bij of krachtens die
      maatregel gestelde eisen wat betreft opleiding, kundigheid en ervaring of aan andere bij of krachtens die maatregel
      vastgestelde eisen;

      c. worden bepaald dat bij wijze van experiment, onder bij of krachtens die maatregel te bepalen voorwaarden, van de
      onderdelen a en b, kan worden afgeweken, om te onderzoeken of er mogelijkheden zijn om in andere gevallen dan bij
      of krachtens die onderdelen is bepaald, vrijstelling of ontheffing te verlenen.

      2 Onverminderd het eerste lid kunnen personen die op grond van het eerste lid zijn vrijgesteld of ontheven van
      de verplichting gebruik te maken van de diensten van een loods, in bij algemene maatregel van bestuur te bepalen
      gevallen, niettemin worden verplicht van de diensten van een loods gebruik te maken.

      3 Bij de behandeling van een aanvraag voor het verlenen van een vrijstelling of ontheffing als bedoeld in het
      eerste lid, de periodieke controle daarop en de intrekking daarvan kunnen persoonsgegevens worden verwerkt. De
      verwerking vindt plaats om te kunnen beoordelen of aan de wettelijke vereisten voor de afgifte van een ontheffing
      en de daaraan verbonden voorschriften en beperkingen wordt voldaan. Het gezag dat bevoegd is de ontheffing te
      verlenen, is verantwoordelijk voor deze verwerking.

      4 Aan een besluit tot vrijstelling, respectievelijk ontheffing, als bedoeld in het eerste lid, onderdeel b, kunnen
      voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
