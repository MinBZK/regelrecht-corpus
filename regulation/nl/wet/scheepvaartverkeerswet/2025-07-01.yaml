        artikel: '141'
  - number: '34'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren, aangewezen
      bij het besluit, bedoeld in [artikel 32, eerste lid][ref1].

      2 Bij besluit van Onze Minister kunnen andere dan de in het eerste lid bedoelde ambtenaren worden aangewezen voor
      het toezicht op de naleving van het bepaalde bij of krachtens deze wet. Ambtenaren van provincies, gemeenten of
      waterschappen worden aangewezen op voordracht van, en in overeenstemming met de desbetreffende besturen.

      3 In de in het tweede lid bedoelde besluit kunnen eisen worden gesteld met betrekking tot de kennis en kunde van de
      toezichthouders en de wijze waarop zij hun taak vervullen.

      4 Het besluit bedoeld in het tweede lid wordt in de Staatscourant geplaatst.

      5 De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel32
