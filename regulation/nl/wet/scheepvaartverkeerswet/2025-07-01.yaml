  - number: 35b
    text: |-
      1 De houder van een vaarbewijs kan de bevoegdheid tot het voeren van schepen, voor zover daartoe een vaarbewijs is
      vereist, voor ten hoogste vijf jaren worden ontzegd wegens het op de binnenwateren voeren of doen voeren van:

      a. een snelle motorboot in strijd met voorschriften gesteld krachtens
      [artikel 4, eerste lid, onderdelen a en d, en derde lid][ref1], en waarbij ernstig gevaar voor de veiligheid van
      personen of goederen is ontstaan, of in strijd met [artikel 27][ref2], of

      b. een schip waarvoor een bij ministeriële regeling aan te wijzen vaarbewijs is vereist, herhaaldelijk in strijd
      met [artikel 27][ref3].

      2 Indien tijdens het plegen van een van de feiten, bedoeld in het eerste lid, nog geen vijf jaren zijn verlopen
      na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die feiten de
      betrokkene de bevoegdheid tot het voeren van schepen, voor zover daartoe een vaarbewijs is vereist, is ontzegd, kan
      hem die bevoegdheid voor ten hoogste tien jaren worden ontzegd.

      3 Bij het opleggen van de straf, bedoeld in het eerste en tweede lid, wordt de tijd gedurende welke het vaarbewijs
      van de veroordeelde ingevolge [artikel 35a][ref4] vóór het tijdstip waarop die straf ingaat, ingevorderd of
      ingehouden is geweest, op de duur van die straf in mindering gebracht.

      4 De tenuitvoerlegging van de veroordeling vindt niet plaats dan nadat aan de veroordeelde in persoon een schrijven
      is uitgereikt, volgens de [artikelen 36d][ref5] en [36e van het Wetboek van Strafvordering][ref6], waarin het
      tijdstip van ingang en de duur van de ontzegging, de verplichting tot inlevering van het vaarbewijs uiterlijk op
      dat tijdstip, alsmede het gevolg van niet tijdige inlevering worden medegedeeld.

      5 De houder levert het vaarbewijs, tenzij het is ingevorderd en niet teruggegeven, in op het parket van het
      openbaar ministerie vanwaar hij het schrijven, bedoeld in het vierde lid, heeft ontvangen, uiterlijk op het
      tijdstip van ingang van de ontzegging.

      6 Teruggave van het vaarbewijs vindt plaats zodra de termijn van de ontzegging is verstreken.

      7 De termijn van ontzegging van de bevoegdheid tot het voeren van schepen wordt van rechtswege verlengd met het
      aantal dagen dat is verstreken tussen het tijdstip waarop het vaarbewijs ingevolge het vijfde lid had moeten worden
      ingeleverd en het tijdstip waarop nadien die inlevering heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
