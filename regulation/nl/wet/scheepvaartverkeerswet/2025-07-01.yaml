preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op de ontwikkelingen in het scheepvaartverkeer en in de
    ordening daarvan alsmede op de bij de ordening van dat verkeer betrokken belangen, wenselijk is de bepalingen
    met betrekking tot het scheepvaartverkeer op de binnenwateren en op zee te herzien alsmede, gezien hun onderlinge
    samenhang, onder te brengen in één wettelijke regeling, welke mede als grondslag kan dienen voor de uitvoering van
    verdragen en van besluiten van volkenrechtelijke organisaties, voorzover deze het Koninkrijk binden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:

      a. Onze Minister: Onze Minister van Infrastructuur en Waterstaat;

      b. schip: elk vaartuig, met inbegrip van een vaartuig zonder waterverplaatsing en een watervliegtuig, dat feitelijk
      wordt gebruikt of geschikt is om te worden gebruikt als middel tot verplaatsing te water;

      c. scheepvaartverkeer: verkeer van schepen en andere vaartuigen;

      d. scheepvaartwegen: voor het openbaar scheepvaartverkeer openstaande binnenwateren en de Nederlandse territoriale
      zee, daaronder begrepen de daarin aanwezige waterstaatswerken;

      e. het voeren van een schip of ander vaartuig: het feitelijk de leiding hebben over een schip of ander vaartuig wat
      het deelnemen daarvan aan het scheepvaartverkeer betreft;

      f. verkeersdeelnemer: degene die een schip of ander vaartuig voert;

      g. verkeersteken: een in, naast of boven een scheepvaartweg aangebracht voorwerp of aangebrachte combinatie van
      voorwerpen waarmee aan het scheepvaartverkeer wordt gegeven:

      1°. een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg, of

      2°. een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg;

      h. bekendmaking met dezelfde strekking als een verkeersteken: een schriftelijke mededeling aan het
      scheepvaartverkeer waarmee aan dat verkeer wordt gegeven:

      1°. een inlichting over de toestand van een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg, of

      2°. een inlichting, aanbeveling, gebod of verbod onderscheidenlijk opheffing van een gebod of verbod voor het
      verkeersgedrag op een bepaalde plaats in of een bepaald gedeelte van een scheepvaartweg;

      i. verkeersbegeleiding: het door middel van een samenstel van personele en infrastructurele voorzieningen op
      stelselmatige en interactieve wijze bewerkstelligen en onderhouden van een veilig en vlot scheepvaartverkeer;

      j. verkeersinformatie: een door een daartoe bevoegd persoon gegeven inlichting aan een of meerdere
      verkeersdeelnemers dan wel aan anderen met betrekking tot een scheepvaartweg of een gedeelte daarvan dan wel het
      scheepvaartverkeer of afzonderlijke schepen daarop, waarbij deze inlichting mede kan bestaan uit vaarweginformatie
      en tactische verkeersinformatie;

      k. Scheldereglement: het reglement ter uitvoering van artikel IX van het Tractaat van 19 april 1839, en
      van Hoofdstuk II, afdelingen 1 en 2, van het Tractaat van 5 november 1842 betreffende het loodswezen en het
      gemeenschappelijk toezicht (Trb. 1995, 48) zoals deze sedertdien is gewijzigd;

      l. verkeersaanwijzing: een door een daartoe bevoegd persoon aan een of meerdere verkeersdeelnemers gegeven gebod
      om een bepaald resultaat in het verkeersgedrag te bewerkstelligen of opgelegd verbod van een bepaald resultaat in
      het verkeersgedrag;

      m. Herziene Rijnvaartakte: de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte, met bijlagen
      en slotprotocol, (*Trb.* 1955, 161), zoals deze sedertdien is gewijzigd;

      n. Nederlandse zeeschepen: zeeschepen die op grond van voor Nederland geldende rechtsregels gerechtigd zijn de vlag
      van het Koninkrijk te voeren;

      o. verwerken van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke: hetgeen daaronder wordt verstaan
      in artikel 4, onderdelen 1, 2 en 7, van de Algemene verordening gegevensbescherming;

      p. River Information Services: de geharmoniseerde informatiediensten ter ondersteuning van het verkeers-
      en vervoersmanagement voor de binnenvaart, met inbegrip van de technisch haalbare koppelingen met andere
      vervoerswijzen dan wel met commerciële activiteiten, niet zijnde interne commerciële activiteiten tussen betrokken
      bedrijven;

      q. vaarweginformatie: geografische, hydrologische en administratieve informatie over de scheepvaartweg;

      r. tactische verkeersinformatie: informatie waarop onmiddellijke navigatiebeslissingen in de actuele
      verkeerssituatie en de nabije geografische omgeving zijn gebaseerd;

      s. verdrag inzake het gemeenschappelijk nautisch beheer: het op 21 december 2005 te Middelburg totstandgekomen
      verdrag tussen het Koninkrijk der Nederlanden en het Vlaams Gewest inzake het gemeenschappelijk nautisch beheer in
      het Scheldegebied (Trb. 2005, 312);

      t. vaarbewijs: document ten bewijze van de bevoegdheid om op de Nederlandse binnenwateren een schip te voeren,
      waaronder begrepen een daarmee vergelijkbaar document dat is afgegeven door een buitenlandse autoriteit;

      u. snelle motorboot: schip dat een lengte heeft van minder dan 20 meter en dat bij gebruikmaking van zijn
      mechanische middelen tot voortbeweging, sneller dan 20 km per uur ten opzichte van het water kan varen;

      v. de Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1].

      2 In de [artikelen 10 tot en met 13][ref2], [15 tot en met 16a][ref3], [27 tot en met 29][ref4] en [35][ref5] van
      deze wet en in de op deze wet berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:

      a. kapitein: degene die is belast met het gezag over een zeeschip;

      b. loods: degene die bij of krachtens de wet of verdrag bevoegd is verklaard als loods op te treden;

      c. zeeschip: een schip dat blijkens zijn constructie uitsluitend of in hoofdzaak is bestemd voor de vaart ter zee.

      3 Bij algemene maatregel van bestuur kunnen zaken die geen schip zijn, onderscheidenlijk schepen die geen
      zeeschepen zijn, voor de toepassing van deze wet en de daarop berustende bepalingen met een schip onderscheidenlijk
      een zeeschip worden gelijkgesteld, dan wel deze wet en de daarop berustende bepalingen niet van toepassing worden
      verklaard op zaken die een schip zijn, onderscheidenlijk schepen die een zeeschip zijn.

      4 In deze wet en de daarop berustende bepalingen wordt onder het beheer van een scheepvaartweg verstaan het
      waterstaatkundig beheer daarvan dan wel, in afwijking hiervan, het vaarwegbeheer van die scheepvaartweg indien het
      laatstbedoelde beheer afzonderlijk bij een openbaar lichaam berust.

      5 In deze wet wordt, tenzij daarin anders is bepaald, mede verstaan onder:

      a. schip: een samenstel van schepen of van een of meer schepen met een of meer andere vaartuigen, waarvan
      ten minste één schip deel uitmaakt dat ter voortbeweging gebruik maakt van zijn motor en dat dient voor het
      voortbewegen of het sturen van het samenstel;

      b. zeeschip: een samenstel van zeeschepen of van een of meer zeeschepen met een of meer andere schepen of andere
      vaartuigen, waarvan ten minste één schip deel uitmaakt dat ter voortbeweging gebruik maakt van een of meer van zijn
      motoren en dat dient voor het voortbewegen of sturen van het samenstel.


