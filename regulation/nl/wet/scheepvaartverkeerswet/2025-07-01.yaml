  - number: '12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor kapiteins regels gesteld over operationele zaken
      betreffende het loodsen, waaronder het gelijktijdig gebruik van de diensten van meer dan één loods en het gebruik
      maken van de diensten van een loods vanaf de wal of vanaf een ander schip.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel12
  - number: '13'
    text: |-
      Het bepaalde in deze paragraaf is van overeenkomstige toepassing ten aanzien van een schip dat geen zeeschip is en
      degene die daarover de leiding heeft, indien dit schip zich op zee bevindt.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel13
  - number: '14'
    text: |-
      1 Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om verkeerstekens voor het
      scheepvaartverkeer dat zich op een scheepvaartweg bevindt, aan te brengen of te verwijderen in verband met
      door een ander in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale
      verkeersgebruik van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te
      vergoeden die het heeft gemaakt voor het aanbrengen of verwijderen van die verkeerstekens.

      2 Indien het door het bevoegd gezag redelijkerwijze nodig wordt geoordeeld om schepen op een scheepvaartweg te
      volgen, daaraan verkeersinformatie te geven dan wel deze te begeleiden met een schip in verband met door een ander
      in, op of boven die scheepvaartweg te ondernemen activiteiten welke niet behoren tot het normale verkeersgebruik
      van die scheepvaartweg, kan die ander door het bevoegd gezag worden verplicht de kosten te vergoeden, die het heeft
      gemaakt voor die maatregelen.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel14
  - number: 14a
    text: |-
      1 De kosten verbonden aan de aanvraag en de afgifte van diploma’s en van vrijstellingen, respectievelijk
      ontheffingen als bedoeld in artikel 11, eerste lid, onderdeel b de deelname aan de daarvoor vereiste opleidingen en
      examens en de afgifte van andere documenten, verplicht gesteld bij of krachtens deze wet, kunnen ten laste worden
      gebracht van de aanvrager van het diploma of andere document, onderscheidenlijk de kandidaat voor de bedoelde
      examens.

      2 De tarieven voor de kosten verbonden aan de deelname aan de opleidingen en de examens die door de regionale
      loodsencorporaties op grond van [artikel 13 van de Loodsenwet][ref1], worden verzorgd in het kader van het verlenen
      van een vrijstelling of ontheffing, bedoeld in [artikel 11, eerste lid, onderdeel b][ref2], worden vastgesteld bij
      besluit van de Autoriteit Consument en Markt overeenkomstig [hoofdstuk VIA van de Loodsenwet][ref3] en de daarop
      gebaseerde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel13
