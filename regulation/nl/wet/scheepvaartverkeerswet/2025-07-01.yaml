  - number: 35a
    text: |-
      1 In de gevallen, bedoeld in het tweede lid, onderdelen a, b of c, overhandigt de houder van een
      vaarbewijs tegen wie proces-verbaal wordt opgemaakt wegens overtreding van een voorschrift als bedoeld in
      [artikel 35b, eerste lid][ref1], zijn vaarbewijs op eerste vordering aan de opsporingsambtenaar.

      2 Vaarbewijzen die ingevolge het eerste lid zijn ingevorderd worden onverwijld overgedragen aan de officier van
      justitie. De officier van justitie is bevoegd ingevorderde vaarbewijzen onder zich te houden totdat de veroordeling
      onherroepelijk is geworden of, indien de bevoegdheid tot het voeren van schepen onvoorwaardelijk is ontzegd, tot
      het tijdstip waarop de ontzegging is verstreken, indien:

      a. bij onderzoek is gebleken of, bij ontbreken van een dergelijk onderzoek, een ernstig vermoeden bestaat dat het
      alcoholgehalte van de adem van degene die een schip voert of stuurt, hoger is dan 785 microgram alcohol per liter
      uitgeademde lucht, onderscheidenlijk het alcoholgehalte van zijn bloed hoger blijkt te zijn dan 1,8 milligram
      alcohol per milliliter bloed;

      b. met een zodanige snelheid is gevaren dat ernstig gevaar voor de veiligheid van personen of goederen is ontstaan;
      of

      c. op grond van andere feiten of omstandigheden ernstig rekening moet worden gehouden met de mogelijkheid dat de
      bestuurder opnieuw een feit als bedoeld in [artikel 35b, eerste lid][ref2], zal begaan.

      3 De officier van justitie geeft het ingevorderde vaarbewijs onverwijld terug aan de houder:

      a. indien hij binnen tien dagen na de dag van invordering geen toepassing geeft aan het tweede lid;

      b. indien ernstig rekening moet worden gehouden met de mogelijkheid dat aan de houder in geval van veroordeling
      door de rechter geen onvoorwaardelijke ontzegging van de bevoegdheid tot het voeren van een schip zal worden
      opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur dan de tijd gedurende welke het vaarbewijs is
      ingevorderd of ingehouden geweest, of

      c. indien het onderzoek van de zaak op de terechtzitting niet binnen 26 weken na de dag van invordering is
      aangevangen.

      4 Tegen toepassing van het eerste of tweede lid kan de belanghebbende bij klaagschrift opkomen. Zolang
      in de zaak nog geen vervolging is ingesteld, wordt het klaagschrift ingediend ter griffie van de
      rechtbank in het arrondissement waar het in het eerste lid bedoelde feit werd begaan, en anders ter
      griffie van het gerecht in feitelijke aanleg waarvoor de vervolging plaatsvindt of het laatst plaatsvond.
      [Artikel 552a, vierde en zesde lid, van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing.
      De raadkamer van het gerecht geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan door diens
      raadsman, te hebben gehoord, althans opgeroepen, zijn met redenen omklede beslissing, die onverwijld aan de
      belanghebbende wordt betekend. Tegen de beslissing kan door het openbaar ministerie binnen veertien dagen daarna
      en door de belanghebbende binnen veertien dagen na de betekening beroep in cassatie worden ingesteld. De Hoge Raad
      beslist zo spoedig mogelijk.

      5 Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, maar op
      grond van een feit waarvoor de toepassing van het eerste of tweede lid niet is toegelaten, kan de
      rechter op verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor
      de schade die hij ten gevolge van die toepassing heeft geleden, waaronder begrepen nadeel dat niet in
      vermogensschade bestaat. De [artikelen 533, derde, vierde en zesde lid][ref4], [534][ref5], [535][ref6] en
      [536 van het Wetboek van Strafvordering][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel35b
