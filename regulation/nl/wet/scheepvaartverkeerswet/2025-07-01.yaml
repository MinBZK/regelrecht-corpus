  - number: '29'
    text: |-
      1 Een opsporingsambtenaar als bedoeld in [artikel 141 van het Wetboek van Strafvordering][ref1] kan, indien hij
      een ernstige verdenking heeft dat degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als
      loods aan boord van een zodanig schip de kapitein of de verkeersdeelnemer over de te voeren navigatie adviseert,
      handelt in strijd met [artikel 27, eerste, tweede of vierde lid][ref2], aan die persoon een verbod opleggen op
      een scheepvaartweg een varend schip te voeren of te sturen, dan wel als loods aan boord van een zodanig schip
      de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren, voor de tijd gedurende welke hij
      verwacht dat deze toestand zal voortduren tot ten hoogste vierentwintig uren.

      2 Het eerste lid is van overeenkomstige toepassing op degene die aanstalten maakt een schip dat op een
      scheepvaartweg voor vertrek gereed ligt, te voeren of te sturen, dan wel als loods aan boord van een zodanig
      schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren, indien de opsporingsambtenaar
      ernstige reden heeft om aan te nemen dat dit voeren, sturen of adviseren zal leiden tot handelen in strijd met
      [artikel 27, eerste of tweede lid][ref3].

      3 Het is degene aan wie een verbod op grond van dit artikel is opgelegd, gedurende de tijd waarvoor het verbod
      geldt, verboden op een scheepvaartweg een varend schip te voeren of te sturen, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer over de te voeren navigatie te adviseren.

      4 Degene aan wie een verbod op grond van dit artikel is opgelegd, is verplicht de bevelen die door de
      opsporingsambtenaar worden gegeven voor de uitvoering van het verbod op te volgen.


