    text: |-
      1 Toepassing van de [artikelen 4][ref1], [10, vierde lid][ref2], [11][ref3] en [12][ref4] kan, behoudens het
      bepaalde in het tweede lid, slechts geschieden in het belang van:

      a. het verzekeren van de veiligheid en het vlotte verloop van het scheepvaartverkeer;

      b. het instandhouden van scheepvaartwegen en het waarborgen van de bruikbaarheid daarvan;

      c. het voorkomen of beperken van schade door het scheepvaartverkeer aan de waterhuishouding, oevers en
      waterkeringen, of werken gelegen in of over scheepvaartwegen;

      d. het voorkomen of beperken van externe veiligheidsrisico’s in verband met schepen;

      e. het voorkomen of beperken van verontreiniging door schepen.

      2 Toepassing van [artikel 4][ref5] ten behoeve van een in het eerste lid genoemd belang kan mede geschieden in het
      belang van het voorkomen of beperken van:

      a. hinder of gevaar door het scheepvaartverkeer voor personen die zich anders dan op een schip te water bevinden;

      b. schade door het scheepvaartverkeer aan de landschappelijke of natuurwetenschappelijke waarden van een gebied
      waarin scheepvaartwegen zijn gelegen.


