  - number: 35c
    text: |-
      De opsporingsambtenaar die bij de uitoefening van de hem bij of krachtens wet verleende bevoegdheden de beschikking
      krijgt over een vaarwijs waarvan ingevolge dit hoofdstuk de overgifte is gevorderd, waarvan een verplichting
      tot inlevering bestaat of dat ingevolge de [Binnenvaartwet][ref1] zijn geldigheid heeft verloren, is bevoegd
      dat vaarbewijs in te nemen en het door te geleiden naar het betrokken parket van het openbaar ministerie, naar
      degene bij wie de houder dat vaarbewijs had dienen in te leveren onderscheidenlijk naar de instantie die het heeft
      afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0023009
  - number: '36'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat de [artikelen 10, eerste en vierde lid][ref1],
      [15c, eerste lid][ref2], en [17][ref3] alsmede de krachtens de [artikelen 4][ref4],
      [11, eerste en tweede lid][ref5] en [12][ref6] gestelde regels die in die maatregel zijn aangegeven, niet
      of slechts met beperkingen van toepassing zijn op Nederlandse of daarmee in die maatregel gelijk te stellen
      oorlogsschepen, die zich bevinden in de territoriale zee of daarop aansluitende Nederlandse scheepvaartwegen die in
      die maatregel zijn aangewezen.

      Bij algemene maatregel van bestuur kan worden bepaald dat [artikel 15, eerste en tweede lid][ref7], niet of slechts
      met beperkingen van toepassing is op andere dan Nederlandse oorlogsschepen, indien dit met de vlaggestaat van de
      betreffende schepen is overeengekomen.

      2 Bij algemene maatregel van bestuur kan het scheepvaartverkeer de toegang tot scheepvaartwegen die uitsluitend
      zijn bestemd tot gebruik door Nederlandse oorlogsschepen dan wel door andere Nederlandse schepen of andere
      vaartuigen, welke in gebruik zijn voor de uitvoering van de militaire taak, worden verboden of slechts in beperkte
      mate toegestaan.

      3 Overtreding van de in het tweede lid bedoelde regels wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de tweede categorie.

      4 Het in het derde lid strafbaar gestelde feit is een overtreding.


