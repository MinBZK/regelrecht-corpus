  - number: 16a
    text: |-
      De [artikelen 15][ref1] en [15][ref2] zijn van overeenkomstige toepassing ten aanzien van een schip dat geen
      zeeschip is en behoort tot een categorie die bij algemene maatregel van bestuur aangewezen kan worden en op degene
      die over dat schip de leiding heeft, het schip in eigendom heeft of het als rompbevrachter exploiteert.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel15d
