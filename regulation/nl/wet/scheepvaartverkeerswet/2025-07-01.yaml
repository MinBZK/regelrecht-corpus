  - number: '4'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. het deelnemen aan het scheepvaartverkeer op scheepvaartwegen;

      b. verkeerstekens;

      c. bekendmakingen met dezelfde strekking als een verkeersteken;

      d. verkeersaanwijzingen;

      e. het ontvangen, bewaren en verstrekken van gegevens met betrekking tot de scheepvaart door het bevoegd gezag en
      door organisaties en personen die niet deelnemen aan het scheepvaartverkeer.

      2 De in het eerste lid, onder a, bedoelde regels kunnen slechts inhouden:

      a. verplichtingen met betrekking tot:

      1° het varen en het ligplaats nemen met schepen en andere vaartuigen;

      2° het tonen van optische tekens door schepen en andere vaartuigen;

      3° het geven van geluidsseinen door schepen;

      4° de aanwezigheid en het gebruik van bepaalde navigatiemiddelen aan boord van schepen;

      5° de aanwezigheid en het gebruik van bepaalde communicatiemiddelen aan boord van schepen;

      6° het aanbrengen van kentekens op schepen;

      b. andere verplichtingen van verkeersdeelnemers of andere personen aan boord van schepen en andere vaartuigen met
      betrekking tot het deelnemen aan het scheepvaartverkeer;

      c. verplichtingen van andere personen dan die genoemd in onderdeel b, met betrekking tot het deelnemen aan het
      scheepvaartverkeer.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voor daarin aangewezen scheepvaartwegen in afwijking
      van of in aanvulling op de krachtens het eerste lid, onder a, te stellen regels andere regels met betrekking tot
      het deelnemen aan het scheepvaartverkeer worden gesteld. Daarin kunnen aan degenen die een schip voeren, naast
      verplichtingen met betrekking tot de in het tweede lid bedoelde onderwerpen, verplichtingen worden opgelegd, die al
      dan niet gericht zijn op het deelnemen aan verkeersbegeleiding en onder andere betrekking hebben op het melden van
      aankomst, vertrek of positie van een schip, alsmede van gegevens met betrekking tot het schip, de daarmee vervoerde
      lading, de opvarenden of de uit te voeren reis.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot de apparatuur en de
      softwaretoepassingen die ten behoeve van River Information Services worden gebruikt door het bevoegd gezag en
      organisaties en personen die niet deelnemen aan het scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel4
  - number: 4a
    text: |-
      1 Ter uitvoering van [artikel 4, eerste lid, onderdeel e][ref1], en artikel 4, derde lid, worden persoonsgegevens
      verwerkt. De verwerking van deze gegevens vindt plaats ter verzekering van de veiligheid en het vlotte verloop
      van het scheepvaartverkeer en ter uitvoering van verdragen of bindende EU-rechtshandelingen alleen of gezamenlijk.
      Het bevoegd gezag en de organisatie of persoon die niet deelneemt aan het scheepvaartverkeer die bij of krachtens
      algemene maatregel van bestuur is aangewezen, is verwerkingsverantwoordelijke.

      2 De verwerking van gegevens bedoeld in het eerste lid kan tevens de verwerking van gegevens over gezondheid als
      bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming bevatten. Deze verwerking vindt
      plaats teneinde de veiligheid en reddingkansen te verhogen van opvarenden aan boord van passagiersschepen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de bescherming van de
      persoonsgegevens bedoeld in het eerste en tweede lid.

      4 Ter uitvoering van [artikel 4, tweede lid, onderdeel b][ref2], worden gegevens over gezondheid als bedoeld in
      artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming en persoonsgegevens van strafrechtelijke
      aard als bedoeld in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3] verwerkt.
      De verwerking van deze gegevens vindt plaats teneinde te kunnen beoordelen of de aanvragers van bij algemene
      maatregel van bestuur aangewezen Rijnpatenten voldoen of niet meer voldoen aan de wettelijke vereisten voor de
      verlening van deze patenten. De bij of krachtens algemene maatregel van bestuur aangewezen bevoegde autoriteit is
      verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
