  - number: '15'
    text: |-
      1 De kapitein die gebruik maakt van de diensten van een loods, dan wel de eigenaar of rompbevrachter van het schip
      waarvoor gebruik wordt gemaakt van de diensten van een loods, is gehouden loodsgeld te betalen.

      2 Het eerste lid is niet van toepassing op de kapitein of gezagvoerder van een Scheldevaarder als bedoeld in
      artikel 1, eerste lid, van het Scheldereglement.

      3 Degene die gehouden is loodsgeld te betalen, kan door de organisatie waaraan het loodsgeld is verschuldigd,
      worden verplicht tot het stellen van zekerheid met betrekking tot de voldoening van het loodsgeld en tot het
      verschaffen van de in verband met de bepaling van het toepasselijke tarief benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel15
  - number: 15a
    text: |-
      1 Het loodsgeld strekt tot vergoeding van de kosten met betrekking tot het loodsen.

      2 Het loodsgeld is verschuldigd aan de door de algemene raad van de Nederlandse loodsencorporatie aan te wijzen
      organisatie. Deze aanwijzing wordt bekend gemaakt in de *Staatscourant*. Aan die aanwijzing worden met inachtneming
      van [artikel 26 Loodsenwet][ref1] voorschriften verbonden omtrent de aanwending van het loodsgeld door de
      aangewezen organisatie en kunnen, eveneens met inachtneming van genoemd artikel, voorschriften worden verbonden
      omtrent:

      a. de inning van het loodsgeld;

      b. de verplichting tot het stellen van zekerheid met betrekking tot de voldoening van het loodsgeld;

      c. de gevolgen van het in gebreke blijven van de organisatie ten aanzien van de inning of de aanwending van het
      loodsgeld;

      d. de verplichting van de kapitein tot het verschaffen van de in verband met de bepaling van het toepasselijke
      tarief benodigde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel26
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '26'
  - number: 15b
    text: |-
      1 De inning van het loodsgeld en de loodsvergoedingen, die ingevolge het Scheldereglement geheven worden en aan
      het Rijk toekomen, geschiedt volgens de bij of krachtens het Scheldereglement geldende bepalingen door een door de
      algemene raad van de Nederlandse loodsencorporatie aan te wijzen organisatie. Deze aanwijzing wordt bekendgemaakt
      in de Staatscourant.

      2 De krachtens het eerste lid aangewezen organisatie is rechthebbende op de ingevolge het Scheldereglement geheven
      loodsgelden en loodsvergoedingen.

      3 Aan de aanwijzing, bedoeld in het eerste lid, worden met inachtneming van [artikel 26 Loodsenwet][ref1]
      voorschriften verbonden omtrent de aanwending door de organisatie van de aan deze toekomende gelden en kunnen,
      eveneens met inachtneming van genoemd artikel, voorschriften worden verbonden omtrent:

      a. de inning van het loodsgeld en de loodsvergoedingen;

      b. de gevolgen van het in gebreke blijven van de organisatie ten aanzien van de inning of de aanwending van het
      loodsgeld en de loodsvergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel26
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel15b
    references:
