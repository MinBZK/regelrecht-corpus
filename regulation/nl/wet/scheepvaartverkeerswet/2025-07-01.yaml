  - number: '17'
    text: |-
      1 Degene die een schip voert dat behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie,
      is verplicht om aan de daartoe bij of krachtens die maatregel aangewezen personen ten behoeve van de statistiek
      bepaalde gegevens te verstrekken met betrekking tot het schip, de daarmee vervoerde lading of de uit te voeren
      reis.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld. Deze regels hebben slechts betrekking op:

      a. de inhoud van de te verstrekken gegevens;

      b. de plaatsen waar gegevens moeten worden verstrekt;

      c. het verstrekken van de gegevens.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel17
  - number: '18'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het gebruik van
      scheepvaartwegen door personen die zich anders dan op een schip te water bevinden.

      2 Deze regels mogen slechts strekken tot het voorkomen of het beperken van hinder of gevaar voor het
      scheepvaartverkeer.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Het stellen van regels krachtens het bepaalde in de [hoofdstukken 2 tot en met 4][ref1] geschiedt met inachtneming
      van bindende verdragen en bindende besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '20'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties voor zover die het Koninkrijk binden, regels worden gesteld met betrekking tot het deelnemen aan het
      scheepvaartverkeer door Nederlandse zeeschepen:

      a. in volle zee;

      b. op alle niet-Nederlandse wateren die met de volle zee in verbinding staan en bevaarbaar zijn voor zeegaande
      schepen.

      2 Het bepaalde in het eerste lid, onderdeel *b*, is niet van toepassing, voorzover door de voor die wateren daartoe
      bevoegde autoriteiten afwijkende regels zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel20
  - number: '21'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van verdragen of besluiten van volkenrechtelijke
      organisaties welke betrekking hebben op de ordening van het scheepvaartverkeer voor de Nederlandse kust buiten de
      Nederlandse territoriale zee, voorzover die verdragen of besluiten het Koninkrijk binden, regels worden gesteld.
      Voorzover daarbij uitvoering wordt gegeven aan artikel 211, zesde lid, van het op 10 december 1982 te Montego-Bay
      totstandgekomen Verdrag van de Verenigde Naties inzake het recht van de zee (Trb. 1983, 83), geschiedt zulks met
      inachtneming van de voorschriften, genoemd in dat verdrag.

      2 In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze
      Minister bevoegd worden verklaard tot het stellen van nadere regels.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel21
  - number: '22'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter uitvoering van de Herziene Rijnvaartakte voor zover dit
      noodzakelijk is voor een goede uitvoering van dat verdrag met betrekking tot de scheepvaart, regels inzake andere
      onderwerpen dan die bedoeld in de [Hoofdstukken 2 tot en met 4][ref1] worden gesteld.

      2 In de krachtens het eerste lid te stellen regels kan met betrekking tot daarin aangewezen onderdelen Onze
      Minister bevoegd worden verklaard tot het stellen van nadere regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004364
        hoofdstuk: '2'
  - number: '23'
    text: |-
      Bij de toepassing van de [artikelen 19 tot en met 21][ref1] wordt afgeweken van het bepaalde in deze wet, indien
      verdragen of besluiten van volkenrechtelijke organisaties voor zover deze het Koninkrijk binden daartoe nopen.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel19
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '19'
        hoofdstuk: '5'
  - number: 23a
    text: |-
      Behoeft de voorzitter van een veiligheidsregio, in geval van een ramp of crisis, bijstand van de Gemeenschappelijk
      Nautische Autoriteit, genoemd in artikel 6 van het Verdrag inzake het gemeenschappelijk nautisch beheer, dan
      dient hij een daartoe strekkend verzoek in bij Onze Minister. Onze Minister geleidt dit verzoek door aan de
      Gemeenschappelijke Nautische Autoriteit.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel23a
  - number: '24'
    text: |-
      Onze Minister, indien deze het bevoegd gezag is, is bevoegd tot oplegging van een last onder bestuursdwang ter
      handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel24
  - number: 24a
    text: |-
      Onze Minister is gerechtigd te verrichten hetgeen in strijd met het bepaalde bij of krachtens [artikel 15][ref1],
      wordt nagelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel15b
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '25'
    text: |-
      Indien een verkeersdeelnemer aan wie een verkeersaanwijzing is gegeven, een krachtens
      [artikel 4, eerste lid, onderdeel d][ref1], geregelde verplichting met betrekking tot een verkeersaanwijzing
      overtreedt en daarvoor onmiddellijk gevaar voor de veiligheid van personen of goederen ontstaat of dreigt te
      ontstaan, is het bevoegd gezag bevoegd tot oplegging van een last onder bestuursdwang ter voorkoming of bestrijding
      van dat gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '26'
    text: |-
      Het is verboden om opzettelijk wederrechtelijk een aan een ander toebehorend schip of ander vaartuig te gebruiken
      voor het deelnemen aan het scheepvaartverkeer op een scheepvaartweg.
    url: https://wetten.overheid.nl/BWBR0004364/2025-07-01#Artikel26
  - number: '27'
    text: |-
      1 Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen,
      terwijl hij verkeert onder zodanige invloed van een stof waarvan hij weet of redelijkerwijze moet weten, dat het
      gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het voeren
      of sturen van dat schip, dan wel de bekwaamheid tot het adviseren van de kapitein of de verkeersdeelnemer, kan
      verminderen, dat hij niet in staat moet worden geacht dat schip naar behoren te kunnen voeren of te kunnen sturen,
      dan wel de kapitein of de verkeersdeelnemer naar behoren te kunnen adviseren.

      2 Het is degene die op een scheepvaartweg een varend schip voert of stuurt, dan wel als loods aan boord van een
      zodanig schip de kapitein of de verkeersdeelnemer adviseert over de te voeren navigatie, verboden dit te doen, na
      zodanig gebruik van alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan tweehonderdtwintig microgram alcohol
      per liter uitgeademde lucht;

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan 0,5 milligram alcohol per
      milliliter bloed.

      3 Het is degene die op een scheepvaartweg een varend schip voert verboden dit te doen sturen door een persoon,
      waarvan hij weet of redelijkerwijze moet weten dat deze verkeert in een toestand als in het eerste lid of tweede
      lid omschreven.

      4 Het is degene die op een scheepvaartweg een varend klein schip voert of stuurt verboden dit te doen terwijl
      hij verkeert in een toestand als omschreven in het eerste of tweede lid en het verkeer belemmert of dreigt te
      belemmeren.

      5 In dit artikel en in de [artikelen 28][ref1], [28a][ref2] en [29][ref3] wordt onder een varend schip verstaan een
      schip dat niet ten anker of gemeerd ligt.

      6 In dit artikel wordt onder een klein schip verstaan:

      a. een schip met een lengte van minder dan 20 meter dat uitsluitend door spierkracht wordt voortbewogen;

      b. een schip met een lengte van minder dan 5 meter dat uitsluitend door middel van zijn zeilen wordt voortbewogen
      of dat ter voortbeweging gebruik maakt van een motor waarmee geen hogere snelheid bereikt kan worden dan zes
      kilometer per uur.

      7 In dit artikel wordt onder lengte van een schip verstaan de grootste lengte van de romp gemeten van de voorkant
      van het voorste tot de achterkant van het achterste deel van het schip.


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel29
