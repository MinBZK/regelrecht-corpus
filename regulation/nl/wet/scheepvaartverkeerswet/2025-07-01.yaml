  - number: '32'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten en van de in de Herziene
      Rijnvaartakte strafbaar gestelde feiten, voor zover deze laatste de overtreding betreffen van bepalingen die
      krachtens deze wet zijn vastgesteld, zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref1],
      belast de daartoe door het bevoegd gezag, in overeenstemming met Onze Minister van Veiligheid en Justitie,
      aangewezen buitengewone opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De [artikelen 5:13][ref4], [5:15 tot en met 5:17][ref5] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.


