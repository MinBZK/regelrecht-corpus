preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een andere verdeling tussen de overheid,
    ouders en studenten met betrekking tot de bijdrage in de kosten van studeren in het hoger onderwijs, dat het
    billijk is aan studenten die onder het studievoorschotstelsel hebben gestudeerd een tegemoetkoming te verstrekken,
    en dat het de doorstroom van mbo-gediplomeerden naar het hoger beroepsonderwijs ten goede kan komen, indien voor
    deze groep studenten de zogenoemde 1-februariregeling wordt verruimd naar een 1-septemberregeling;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048256/2023-09-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048256/2023-09-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet herinvoering basisbeurs hoger onderwijs.'
    url: https://wetten.overheid.nl/BWBR0048256/2023-09-01#ArtikelVI
