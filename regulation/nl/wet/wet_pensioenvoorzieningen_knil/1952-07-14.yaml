preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nadere regelen te stellen met betrekking tot de
    pensioenaanspraken van bepaalde groepen van gewezen militairen van het Koninklijk Nederlands Indonesisch Leger,
    alsmede van hun nagelaten betrekkingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het pensioen, waarop de militair, die op of na 27 December 1949 in vaste militaire dienst was bij het Koninklijk
      Nederlands Indonesisch Leger en ingevolge artikel 32 van de "Regelingen betreffende militaire aangelegenheden", II,
      Hoofdstuk IV, gehecht aan de Overgangsovereenkomst, behorende bij de Mantelresolutie der Ronde Tafel Conferentie,
      werd geplaatst in vaste militaire dienst bij de Koninklijke landmacht, en op wie, indien deze plaatsing niet was
      geschied, artikel 39 dan wel artikel 40 van genoemde regelingen, II, Hoofdstuk V, van toepassing zou zijn geweest,
      recht kan doen gelden krachtens de Pensioenwet voor de landmacht 1922, zal niet minder bedragen dan het pensioen,
      waarop hij recht zou hebben kunnen doen gelden bij toepassing van genoemde artikelen 39 en 40.
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel1
  - number: '2'
    text: |-
      1 Het pensioen, waarop de nagelaten betrekkingen van een militair, bedoeld in artikel 1, en van een militair, als
      daar bedoeld, die onder toekenning van pensioen de militaire dienst heeft verlaten, ter zake van diens overlijden
      recht kunnen doen gelden krachtens de Militaire Weduwenwet 1922 dan wel de Pensioenwet voor de landmacht 1922,
      zal niet minder bedragen dan het pensioen, hetwelk dan wel de onderstand, welke haar, bij toepassing van de op 26
      December 1949 geldende regelen, direct of indirect ten laste van de begroting van Indonesië zou zijn toegekomen
      indien de betrokken militair of gewezen militair op 25 Juli 1950 was overleden.

      2 Indien in verband met het overlijden van een militair of gewezen militair als bedoeld in het eerste lid, recht op
      pensioen dan wel onderstand wordt ontleend zowel aan een op 26 December 1949 op hem van toepassing geweest zijnde
      pensioenregeling, als aan een der in het eerste lid genoemde wetten, bestaat slechts recht op pensioen krachtens
      een dezer wetten, voor zover en voor zoveel dat pensioen meer bedraagt dan het pensioen dan wel de onderstand
      krachtens eerder bedoelde pensioenregeling. Bedraagt laatstbedoeld pensioen dan wel onderstand meer dan het
      pensioen krachtens een der in het eerste lid genoemde wetten, dan bestaat geen recht op pensioen krachtens deze
      wetten.
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel2
  - number: '3'
    text: |-
      Het bepaalde in artikel 2 onder 2° der Pensioenwet voor de landmacht 1922 is ook van toepassing ten aanzien van de
      militair, bedoeld in [artikel 1][ref1], indien de verwonding, verminking, ziekten of gebreken zijn ontstaan, tot
      uiting gekomen of verergerd gedurende de dienst bij het Koninklijk Nederlands Indonesisch Leger.


      [ref1]: https://wetten.overheid.nl/BWBR0002090#Artikel1
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002090
        artikel: '1'
  - number: '4'
    text: |-
      De op 24 Juli 1950 tot het Koninklijk Nederlands Indonesisch Leger behorende militairen, die op deze datum nog
      niet een van de bestemmingen, genoemd in artikel 32 van de "Regelingen betreffende militaire aangelegenheden", II,
      Hoofdstuk IV, gehecht aan de Overgangsovereenkomst, behorende bij de Mantelresolutie der Ronde Tafel Conferentie,
      hadden gevolgd - met uitzondering van diegenen, die buiten Indonesië verbleven en bestemd waren af te vloeien in
      het werelddeel waar zij zich op genoemde datum bevonden - en die met ingang van genoemde datum tijdelijk dienst
      verrichten bij de Koninklijke landmacht, worden, voor de toepassing van de Pensioenwet voor de landmacht 1922,
      geacht militairen van de Koninklijke landmacht te zijn zolang zij genoemde dienst verrichten.
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel4
  - number: '5'
    text: |-
      Indien de nagelaten betrekkingen, bedoeld in [artikel 2][ref1], die overeenkomstig dat artikel zijn gepensionneerd
      krachtens de Militaire Weduwenwet 1922 dan wel de Pensioenwet voor de landmacht 1922, niettemin in een geldelijk
      nadeliger positie komen te verkeren dan die, in welke zij zouden hebben verkeerd, indien zij een pensioen dan wel
      een onderstand, direct of indirect ten laste van de begroting van Indonesië, zouden hebben genoten bij toepassing
      van de op 26 December 1949 geldende regelingen, zal daarin worden voorzien naar bij algemene maatregel van bestuur
      te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002090#Artikel2
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002090
        artikel: '2'
  - number: '7'
    text: Deze wet kan worden aangehaald als "Wet pensioenvoorzieningen K.N.I.L.".
    url: https://wetten.overheid.nl/BWBR0002090/1952-07-14#Artikel7
  - number: '8'
    text: |-
      1 De [artikelen 1][ref1], [2][ref2], [3][ref3] en [5][ref4] werken terug tot 27 December 1949.

      2 [Artikel 4][ref5] werkt terug tot 24 Juli 1950.

      3 [Artikel 6][ref6] werkt terug tot 21 Juli 1951.


