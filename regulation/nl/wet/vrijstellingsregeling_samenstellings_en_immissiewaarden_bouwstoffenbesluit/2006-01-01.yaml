  - number: '2.2'
    text: |-
      Voor het gebruik van grond op of in de bodem wordt vrijstelling van de [artikelen 6, tweede lid][ref1], tot en met
      [15][ref2] van het Besluit verleend voor zover het betreft de stoffen die zijn opgenomen in [bijlage B][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0010551
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0010551
  - number: '2.3'
    text: |-
      1 Voor het gebruik van MVR-grond op of in de bodem wordt vrijstelling verleend van de artikelen 6, tweede lid, tot
      en met 15 van het Besluit.

      2 Bij het gebruiken van MVR-grond op of in de bodem is artikel 5, eerste, tweede en vierde lid, van het Besluit van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 In dit artikel wordt verstaan onder toegestane samenstellingswaarde van een stof: de samenstellingswaarde van
      een stof, zoals aangegeven in [bijlage A][ref1], dan wel bijlage 1 voor zover deze stof niet in [bijlage A][ref2]
      is genoemd.

      2 Indien het aantal getoetste stoffen meer is dan negen en minder dan eenentwintig, dan is, in afwijking van
      [artikel 1, onder h][ref3], van het Besluit, overschrijding van de toegestane samenstellingswaarde voor ten hoogste
      drie van deze stoffen toegestaan.

      Indien het aantal getoetste stoffen meer is dan twintig, dan is, in afwijking van [Artikel 1, onder h][ref4],
      van het Besluit, overschrijding van de toegestane samenstellingswaarden voor ten hoogste vier van deze stoffen
      toegestaan.

      3 Bij een overschrijding van de toegestane samenstellingswaarde als bedoeld in het tweede lid, bedraagt de
      getoetste samenstellingswaarde voor:

      a. aldrin/endrin/dieldrin en DDT/DDE/DDD ten hoogste driemaal de toegestane samenstellingswaarde;

      b. elk van de overige stoffen, anders dan genoemd in onderdeel a, ten hoogste tweemaal de toegestane
      samenstellingswaarde.

      4 De getoetste samenstellingswaarde, bedoeld in het derde lid, overstijgt de tussenwaarde niet.

      5 Voor het gebruik van grond op of in de bodem, waarbij de toegestane samenstellingswaarden van stoffen wordt
      overschreden als aangegeven in het derde en voorzover is voldaan aan het vierde lid, wordt vrijstelling verleend
      van de [artikelen 6, tweede lid][ref5], tot en met [15][ref6] van het Besluit.

      6 Bij het gebruik van grond op of in de bodem, als aangegeven in vijfde lid, is
      [artikel 5, eerste, tweede en vierde lid][ref7], van het Besluit van overeenkomstige toepassing.


