  - number: '2.1'
    text: |-
      In deze paragraaf wordt verstaan onder:



            a
             bijlage A en B:

              de bij deze regeling behorende [bijlage A][ref1] en [B][ref2];



            b
             MVR-grond:

              grond waarvan de samenstellingswaarde van één of meer stoffen uit [bijlage A][ref3], de
      samenstellingswaarde, zoals aangegeven in bijlage 1 overschrijdt, tot ten hoogste de in [bijlage A][ref4]
      aangegeven samenstellingswaarde;



            c
             tussenwaarde:

              de helft van de som van de samenstellingswaarden voor grond van een stof als aangegeven in
      [bijlage A][ref5], dan wel bijlage 1 voor zover die stof niet in [bijlage A][ref6] is genoemd, en van die stof als
      aangegeven in bijlage 2.


