  - number: '2.5'
    text: |-
      Voor het gebruik van bouwstoffen niet zijnde schone grond wordt vrijstelling verleend van de samenstellingswaarde
      voor tetrahydrofuran, bedoeld in bijlage 2, voor zover de samenstellingswaarde niet meer bedraagt dan 2 mg/kg droge
      stof. 2
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel2.5
  - number: '2.6'
    text: |-
      Voor grond met gemeten organisch stofgehalte van minder dan 10% geldt, in afwijking van bijlage 1 en 2 van het
      Besluit, voor de omrekening van de samenstellingswaarden van de standaardgrond naar de samenstellingswaarden voor
      de te beoordelen grond, voor PAK’s dat de samenstellingswaarde van de te beoordelen grond gelijk is aan die van
      de standaardgrond.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel2.6
  - number: '3.1'
    text: |-
      1 Voor het gebruik van bouwstoffen niet zijnde schone grond wordt vrijstelling verleend van de immissiewaarde voor
      bromide, voor zover de immissiewaarde voor bromide niet meer bedraagt dan 90 mg/m

      2 In afwijking van het eerste lid geldt, bij het gebruiken van een bouwstof op plaatsen waar een direct contact
      is of mogelijk is met brak oppervlaktewater of zeewater met van nature een chloridegehalte van meer dan 5000 mg/l,
      voor bromide geen immissiewaarde.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Voor het gebruik van menggranulaat op of in de bodem als niet-vormgegeven categorie 1 bouwstof, wordt
      vrijstelling verleend van de immissiewaarde voor sulfaat, voor zover de immissiewaarde voor sulfaat niet meer
      bedraagt dan 150.000 mg/m

      2 De in het eerste lid gegeven vrijstelling geldt tot 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Voor het gebruik van bouwstoffen niet zijnde schone grond wordt vrijstelling verleend van de in bijlage 2 opgenomen
      immissiewaarden voor:

      a. cyanide (vrij);

      b. cyanide (complex) (pH groter of gelijk aan 5);

      c. cyanide (complex) (pH kleiner dan 5).
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Voor het gebruik van bitumen dakbedekkingsmaterialen, zoals die regulier in de burger- en utiliteitsbouw worden
      gebruikt, wordt vrijstelling verleend van de samenstellingswaarde voor minerale olie, zoals aangegeven in bijlage
      2.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 1999.
    url: https://wetten.overheid.nl/BWBR0010551/2006-01-01#Artikel3.5
  - number: '3.6'
    text: |-
