        afdeling: '3'
  - number: '5.16'
    text: |-
      In de centrale administratie van 's Rijks schatkist worden de volgende rekeningen-courant geopend:

      a. één of meer rekeningen-courant op naam van de SVB ten behoeve van de financiële middelen van de fondsen die de
      SVB beheert;

      b. één of meer rekeningen-courant op naam van het UWV ten behoeve van de financiële middelen van de fondsen die het
      UWV beheert;

      c. één of meer rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het
      Fonds langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      1 Ten gunste van de rekeningen-courant van de SVB en het UWV worden geboekt:

      a. de bijdragen van het Rijk aan de rekening-couranthouders ten behoeve van de desbetreffende fondsen;

      b. de afdrachten van de door de rijksbelastingdienst geïnde premies aan de rekening-couranthouders ten behoeve van
      de desbetreffende fondsen;

      c. de creditrente, bedoeld in [artikel 5.18, eerste lid][ref1];

      d. de bijschrijvingen op het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.

      2 Ten laste van de rekeningen-courant van de SVB en het UWV worden geboekt:

      a. de afdrachten door de rekening-couranthouders ten gunste van het tegoed van ’s Rijks schatkist of ten gunste van
      het tegoed dat een derde bij ’s Rijks schatkist in rekening-courant aanhoudt;

      b. de eventuele terugbetalingen aan de rijksbelastingdienst samenhangende met de afdrachten, bedoeld in het eerste
      lid, onderdeel b;

      c. de debetrente, bedoeld in [artikel 5.18, tweede lid][ref2];

      d. de afschrijvingen van het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.

      3 De Minister van Financiën sluit met de SVB en het UWV overeenkomsten ter uitwerking van het gebruik van de
      rekeningen-courant.

      4 In een overeenkomst als bedoeld in het derde lid worden afspraken vastgelegd over de wederzijdse
      informatievoorziening tussen enerzijds de Minister van Financiën en anderzijds respectievelijk de SVB en het UWV.

      5 De boekingen, bedoeld in het eerste lid, onderdeel b, worden door de Minister van Financiën van valutadata
      voorzien, zodanig dat deze data overeenkomen met de gemiddelde data waarop de premies door de rijksbelastingdienst
      worden geïnd.

      6 De [artikelen 4.3][ref3] en [4.4 van de Regeling zorgverzekering][ref4] zijn van overeenkomstige toepassing op
      de rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het Fonds langdurige
      zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.18
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel5.18
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel4.3
      [ref4]: https://wetten.overheid.nl/BWBR0018715#Artikel4.4
