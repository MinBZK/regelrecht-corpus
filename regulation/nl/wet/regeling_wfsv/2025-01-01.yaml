  - number: '3.9'
    text: |-
      Voor de sector uitzendbedrijven wordt voor de premiecomponent voor de ZW-lasten van de gedifferentieerde
      premie Werkhervattingskas, bedoeld in [artikel 2.6, vierde of vijfde lid, van het Besluit Wfsv][ref1]
      een maximum vastgesteld, dat 1,75 maal het voor die lasten in die sector met toepassing van
      [artikel 2.10, eerste lid, van het Besluit Wfsv][ref2] vastgestelde percentage bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2.6'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2.10'
  - number: '3.14'
    text: |-
      De sectorale premiecomponenten voor de ZW-lasten en de WGA-lasten van de sectorale premiepercentages,
      bedoeld in [artikel 2.10, tweede lid, van het Besluit Wfsv][ref1], zijn voor de sectoren 57 en 60, bedoeld in
      [bijlage 1][ref2] bij deze regeling, gelijk aan het gewogen gemiddelde van deze premiecomponenten van de sectorale
      premiepercentages voor de sectoren 57 en 60.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0019150
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2.10'
      - id: ref2
        bwb_id: BWBR0019150
  - number: '3.15'
    text: |-
      Als overheidswerkgever als bedoeld in [artikel 40, derde lid, van de Wfsv][ref1] worden aangewezen:

      a. de Koning, ten aanzien van door hem in dienst genomen overheidswerknemers die bij de Koninklijke Hofhouding
      werkzaam zijn en uit dien hoofde onder de Pensioenregeling van de Stichting tot verzorging van de pensioenen van
      het personeel van de Koninklijke Hofhouding van het Huis van Oranje-Nassau vallen;

      b. het Rijk, de provincies, de gemeenten en de waterschappen;

      c. rechtspersonen, anders dan bedoeld in onderdeel b, die:

      1° bij of krachtens de wet zijn ingesteld, en

      2° overheidswerknemers rechtstreeks ten laste van de rechtspersoon bezoldigen of belonen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 3.15a
    text: |-
      Voor de garantie, bedoeld in [artikel 40, tweede lid, van de Wfsv][ref1], wordt het model gehanteerd dat is
      opgenomen in [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0019150
