      1 De rijksbijdrage, bedoeld in [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref1], wordt verstrekt op
      de wijze, genoemd in de [artikelen 5.40a tot en met 5.41b][ref2], en ter dekking van de in die artikelen genoemde
      uitvoeringskosten.

      2 Voor zover in deze paragraaf is bepaald dat bepaalde uitvoeringskosten direct ten laste komen van de
      rijksbijdrage aan het UWV, bedoeld in [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref3], komen deze
      uitvoeringskosten niet als uitgaven ten laste van de fondsen, bedoeld in artikel 45, eerste lid, onderdelen a tot
      en met d, van die wet.

      3 Op de administratieve afhandeling van rijksbijdragen op grond van
      [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref4], verstrekt over kalenderjaren die zijn gelegen voor
      1 januari 2020, zijn de [artikelen 5.40 tot en met 5.41a][ref5] van toepassing zoals deze luidden op 31 december
      2019.


