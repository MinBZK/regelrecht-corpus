  - number: 4.2.1
    text: |-
      Het verzoek geschiedt door indiening bij de SVB van een door de verzoeker ondertekende verklaring, waarvan het
      model door de SVB wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Deze verklaring houdt tenminste in, dat degene, die de verklaring indient, overwegende gemoedsbezwaren heeft
      tegen elke vorm van verzekering, dat hij mitsdien noch zichzelf, noch iemand anders, noch zijn eigendommen heeft
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Voorzover de volksverzekeringen in het geding zijn, blijkt uit de verklaring tevens, of degene, die haar indient,
      de in deze wetten geregelde voorzieningen al dan niet als verzekeringen beschouwt.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Uit een door een werkgever bij de SVB ingediende verklaring blijkt of deze ook gemoedsbezwaren heeft tegen de
      nakoming van de hem als werkgever opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      Wanneer het verzoek een rechtspersoon betreft, wordt de verklaring ingediend bij de SVB door het op grond van een
      wettelijk voorschrift of statuten van die rechtspersoon daartoe bevoegde orgaan.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Onverminderd [artikel 4.2][ref1] houdt de verklaring, bedoeld in het eerste lid, tevens in, dat de natuurlijke
      personen, die behoren tot het orgaan, dat op grond van een wettelijk voorschrift of de statuten bevoegd is te
      besluiten de ontheffing aan te vragen, in meerderheid overwegende gemoedsbezwaren hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '4'
        hoofdstuk: '4'
