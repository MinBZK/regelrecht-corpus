  - number: 4.1.1
    text: |-
      De persoon, die gemoedsbezwaren heeft tegen één van de volksverzekeringen, bedoeld in
      [artikel 2 van de Wfsv][ref1], of alle werknemersverzekeringen als bedoeld in artikel 2 van de Wfsv, alsmede
      de rechtspersoon, waarbij natuurlijke personen betrokken zijn, die zodanige gemoedsbezwaren hebben, kan op
      zijn verzoek door de SVB worden ontheven van verplichtingen hem bij de [Wfsv][ref2], of bij één van deze
      volksverzekeringen of werknemersverzekeringen opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0017745
  - number: 4.1.2
    text: |-
      In afwijking van het eerste lid kan geen ontheffing worden verleend van de verplichtingen, bedoeld in
      [artikel 54 van de AWBZ][ref1], de [artikelen 13][ref2] en [49 van de ZW][ref3], de [artikelen 12][ref4] en
      [80 van de WAO][ref5], de [artikelen 27][ref6] en [33 van de Wet WIA][ref7] en de [artikelen 13][ref8] en
      [25 van de WW][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel49
