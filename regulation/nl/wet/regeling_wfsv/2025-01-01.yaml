  - number: '3.35'
    text: |-
      Voor de berekening van de quotumpercentages, bedoeld in [artikel 38f, tweede lid, van de Wfsv][ref1], wordt voor de
      toepassing van de variabelen van de formule, bedoeld in dat lid, het volgende in acht genomen:

      a. voor variabele A:

      1°. onder een baan wordt verstaan het gemiddeld aantal verloonde uren van arbeidsbeperkten in de onderscheiden
      sectoren tezamen overeenkomstig variabele C als bedoeld in onderdeel c;

      2°. het aantal banen in 2013 vervuld door arbeidsbeperkten werkzaam bij werkgevers die op grond van
      [artikel 34, derde, vierde en zesde lid, van de Wfsv][ref2] een quotumheffing zijn verschuldigd, gemeten over de
      maand december 2012 bedraagt op grond van [artikel 3.33, eerste lid][ref3], met overeenkomstige toepassing van
      [artikel 3.34, eerste en tweede lid][ref4], voor de overheidssector 13.504 banen en voor de niet-overheidssector
      35.927 banen.

      b. voor variabele B:

      1°. het aantal extra banen voor arbeidsbeperkten dat voor de berekening van het quotumpercentage in het
      desbetreffende kalenderjaar wordt geteld, bedraagt voor de overheidsector in:

      1°. 2017: 8.750;

      2°. 2018: 11.250;

      3°. 2019: 13.750;

      4°. 2020: 16.250;

      5°. 2021: 18.750;

      6°. 2022: 21.250;

      7°. 2023: 23.750.

      8°. 2024 en verder: 25.000

      2°. het aantal extra banen voor arbeidsbeperkten dat voor de berekening van het quotumpercentage in het
      desbetreffende kalenderjaar wordt geteld, bedraagt voor de niet-overheidssector in:

      1°. 2017: 19.500;

      2°. 2018: 27.000;

      3°. 2019: 35.500;

      4°. 2020: 45.000;

      5°. 2021: 55.000;

      6°. 2022: 65.000;

      7°. 2023: 75.000;

      8°. 2024: 85.000;

      9°. 2025: 95.000;

      10°. 2026 en verder: 100.000.

      c. voor variabele C: het gemiddeld aantal verloonde uren van arbeidsbeperkten in de onderscheiden sectoren tezamen
      bedraagt 1.331 uren per jaar.

      d. voor variabele D: het totaal aantal banen bij werkgevers in de sector overheid die op grond van
      [artikel 34, derde en vierde lid, van de Wfsv][ref5] quotumheffing zijn verschuldigd, bedraagt voor het
      kalenderjaar:

      2018: 1.073.426,07;

      2019: 1.074.355,16;

      2020: 1.087.495,31;

      2021: 1.084.046,22;

      2022: 1.116.687,84;

      2023: 1.173.363,61;

      2024: 1.208.742,31;

      2025: 1.247.135,49.

      e. voor variabele E: het gemiddeld aantal verloonde uren van een werknemer in de onderscheiden sectoren tezamen
      bedraagt 1.623 uren per jaar.

      f. voor variabele H: het aantal gerealiseerde extra banen voor arbeidsbeperkten bij werkgevers als bedoeld in
      [artikel 34, vierde en zesde lid, van de Wfsv][ref6] in de sector overheid bedraagt in:

        - 2020: –284,10;
        - 2021: – 283,25;
        - 2022: –285,41;
        - 2023: –283,60;
        - 2024: – 256,99;
        - 2025: – 266,00.


