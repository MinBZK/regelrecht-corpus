  - number: '5.19'
    text: De rekening-couranthouder is bevoegd een bedrag van ten hoogste € 2,5 miljoen buiten de rekening-courant te houden.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 De totale opbrengsten van de gecombineerde heffing van de loonbelasting en de premies voor de sociale
      verzekeringen alsmede de daarop betrekking hebbende naheffingsaanslagen, belasting- en invorderingsrente en
      boeteontvangsten worden uitgesplitst in een voor de afdracht vastgesteld verdeelpercentage per belasting/
      premiejaar.

      2 Het verdeelpercentage wordt maandelijks per belasting/premiejaar door de Minister van Financiën vastgesteld op
      basis van de over het belasting/premiejaar ontvangen loonaangiften en opgelegde naheffingen.

      3 Alle ontvangen gelden over het belasting/premiejaar worden verdeeld op basis van het verdeelpercentage, bedoeld
      in het eerste lid. De mutatie ten opzichte van de vorige periode vormt het af te dragen bedrag.

      4 In het tweede jaar na afloop van het belasting/premiejaar wordt het verdeelpercentage voor het betreffende
      belasting/premiejaar definitief vastgesteld. Dit percentage wordt gehanteerd voor de definitieve verdeling van de
      ontvangen gelden over het betreffende belasting/premiejaar voor alle betalingen die daarna worden geïnd.

      5 In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het vierde lid, te verlengen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: '5.21'
    text: |-
      1 De opbrengsten van de gecombineerde heffing van de loonbelasting, inkomstenbelasting en de premie voor de
      volksverzekeringen worden uitgesplitst volgens een voor de loonheffing en voor de inkomensheffing afzonderlijk
      vastgesteld toedelingspercentage.

      2 Voorafgaand aan het belasting/premiejaar worden in overleg tussen de beheerders van de fondsen voor
      de volksverzekeringen en de Minister van Financiën voorlopige toedelingspercentages vastgesteld. De
      toedelingspercentages worden gebaseerd op de transactieramingen voor het desbetreffende belasting/premiejaar.

      3 In het tweede jaar na afloop van het belasting/premiejaar wordt het toedelingspercentage voor de loonheffing
      definitief vastgesteld. In het vierde kalenderjaar na afloop van het belasting/premiejaar wordt het
      toedelingspercentage voor de inkomensheffing definitief vastgesteld. De definitieve vaststelling vindt plaats op
      basis van de gerealiseerde belastingheffing en leidt tot een correctie van de reeds afgedragen premie-opbrengsten
      aan de fondsen met de belastingopbrengsten.

      4 De opbrengsten van de loonheffing en de inkomensheffing die door de rijksbelastingdienst worden geïnd nadat
      het toedelingspercentage definitief is vastgesteld, worden uitgesplitst op basis van het definitief vastgestelde
      toedelingspercentage.

      5 De correctie, bedoeld in het derde lid, wordt door de Minister van Financiën met de beheerder van dat fonds
      afgerekend.

      6 In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het derde lid, te verlengen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21a
    text: |-
      1 De belasting- en invorderingsrente en boeteontvangsten die betrekking hebben op de opbrengsten van de
      gecombineerde heffing van de loonbelasting, inkomstenbelasting en de premie voor de volksverzekeringen, bedoeld in
      [artikel 5.21, eerste lid][ref1], worden uitgesplitst volgens een voor de loonheffing en voor de inkomensheffing
      gezamenlijk vastgesteld toedelingspercentage.

      2 Het toedelingspercentage, bedoeld in het eerste lid, wordt in overleg tussen de beheerders van de fondsen voor
      de volksverzekeringen en de Minister van Financiën voorafgaand aan het belasting/premiejaar vastgesteld en wordt
      gebaseerd op de transactieramingen voor het desbetreffende belasting/premiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.21
