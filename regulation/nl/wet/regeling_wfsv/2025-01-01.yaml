  - number: '5.2'
    text: |-
      Tot elke sector van het bedrijfs- en beroepsleven worden gerekend de werkzaamheden, verricht in de takken van
      bedrijf of beroep of gedeelten daarvan, welke in de bij deze regeling behorende [bijlage 1][ref1] zijn vermeld.
      Werkzaamheden die een overheidswerkgever als werkgever doet verrichten, worden gerekend tot een van de sectoren 61
      tot en met 66.


      [ref1]: https://wetten.overheid.nl/BWBR0019150
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0019150
  - number: '5.3'
    text: |-
      Werkzaamheden, verricht in takken van bedrijf en beroep, welke niet in [bijlage 1][ref1] bij deze regeling zijn
      vermeld, worden geacht te behoren tot een sector van het bedrijfs- en beroepsleven, waartoe takken van bedrijf
      en beroep behoren, waarin werkzaamheden worden verricht, welke naar de aard het meest met de eerstbedoelde
      werkzaamheden overeenkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019150
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0019150
  - number: 5.4.1
    text: |-
      De inspecteur kan op aanvraag van twee of meer werkgevers, wier bedrijven of instellingen in juridisch opzicht
      zelfstandig zijn, doch tot een economische of organisatorische eenheid behoren bij voor bezwaar vatbare beschikking
      beslissen dat deze werkgevers aangesloten zijn bij dezelfde sector. Deze werkgevers worden aangesloten in de
      sector waaronder de werkzaamheden ressorteren voor welke door de gezamenlijke werkgevers het grootste bedrag
      aan premieplichtig loon wordt betaald of vermoedelijk zal worden betaald, tenzij de inspecteur in verband met de
      maatschappelijke functie van het geheel van deze bedrijven of instellingen anders beslist.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      In afwijking van het eerste lid, kan de inspecteur op verzoek van een werkgever bij voor bezwaar vatbare
      beschikking beslissen dat de werkgever vanaf een bij de beslissing aan te wijzen datum is aangesloten bij de sector
      waaronder de werkzaamheden van die werkgever ressorteren.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      De inspecteur kan op aanvraag van werkgevers, wier bedrijven of instellingen dermate sterk verbonden zijn met
      een bepaalde tak van bedrijf of beroep dat deze bedrijven of instellingen geacht kunnen worden nevenbedrijven of
      neveninstellingen te zijn van deze tak van bedrijf of beroep bij voor bezwaar vatbare beschikking beslissen dat
      deze bedrijven of instellingen aangesloten worden bij de sector waaronder de bedoelde tak van bedrijf of beroep
      ressorteert.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.4
  - number: 5.4.4
    text: |-
      De inspecteur kan, ambtshalve of op verzoek van een of meer werkgevers, bij voor bezwaar vatbare beschikking
      beslissen dat de aansluiting van een of meer werkgevers bij een sector wordt gewijzigd of ingetrokken vanaf een bij
      de beslissing aan te wijzen datum.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.4
  - number: 5.4.5
    text: |-
      Een aanvraag als bedoeld in het eerste of derde lid wordt niet in behandeling genomen indien deze is ingediend op
      of na 29 juni 2018, 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.4
  - number: 5.5.1
    text: |-
      De werkgever die in verband met het aantal arbeidsuren van de werknemers in dienst van zijn onderneming is
      aangesloten bij de sector Metaal- en technische bedrijfstakken, is de eerste dag in het eerstvolgende kalenderjaar
      na afloop van de hierna bedoelde periode aangesloten bij de sector Metaalindustrie of de sector Elektrotechnische
      industrie, indien het bedoeld aantal arbeidsuren per week in de onderneming, rekening houdende met het in de
      bedrijfstak geldende normale aantal arbeidsuren per week in de onderneming, gedurende een ononderbroken periode
      van onderscheidenlijk drie, twee of één jaar, te rekenen vanaf 1 januari van enig jaar, ten minste heeft bedragen
      onderscheidenlijk 1200, 2000 of 3000.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.5
  - number: 5.5.2
    text: |-
      De werkgever die in verband met het aantal arbeidsuren van de werknemers in dienst van zijn onderneming is
      aangesloten bij de sector Metaalindustrie of de sector Elektrotechnische industrie, is de eerste dag in het
      eerstvolgende kalenderjaar na afloop van de hierna bedoelde periode aangesloten bij de sector Metaal- en technische
      bedrijfstakken, indien het bedoeld aantal arbeidsuren per week in de onderneming, rekening houdende met het in de
      bedrijfstak geldende normale aantal arbeidsuren per week in de onderneming, gedurende een ononderbroken periode
      van onderscheidenlijk drie, twee of één jaar, te rekenen vanaf 1 januari van enig jaar, minder heeft bedragen dan
      onderscheidenlijk 1200, 800 of 400.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.5
  - number: 5.5.3
    text: |-
      In geval van rechtsopvolging van een werkgever als bedoeld in het eerste of tweede lid wordt voor de toepassing van
      deze leden aangenomen dat sprake is van eenzelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.5
  - number: 5.6.1
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage van
      deze regeling bij de sectoren Metaalindustrie, Elektrotechnische industrie en Metaal- en technische bedrijfstakken
      genoemde takken van bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers
      van toepassing is en die als werkgever zijn ingedeeld bij de sector Metaal- en technische bedrijfstakken, doch
      waarbij op genoemde datum gedurende een ononderbroken periode van vier, drie, twee of één jaar, respectievelijk
      ten minste 30, 50, 100 of 150 werknemers ten behoeve van bedoelde bedrijfsuitoefening in dienst waren, blijven
      aangesloten bij de sector Metaal- en technische bedrijfstakken.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.6
  - number: 5.6.2
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage van
      deze regeling bij de sector Metaalindustrie en de sector Metaal- en technische bedrijfstakken genoemde takken van
      bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers van toepassing is
      en die als werkgever zijn ingedeeld bij de sector Metaalindustrie doch waarbij op genoemde datum gedurende een
      ononderbroken periode van vier, drie, twee of één jaar respectievelijk minder dan 30, 15, 10 of 5 werknemers ten
      behoeve van bedoelde bedrijfsuitoefening in dienst waren, blijven aangesloten bij de sector Metaalindustrie.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.6
  - number: 5.6.3
    text: |-
      Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage
      van deze regeling bij de sector Elektrotechnische industrie en de sector Metaal- en technische bedrijfstakken
      genoemde takken van bedrijf of beroep waarop het tot 1 januari 1985 geldende criterium van het aantal werknemers
      van toepassing is en die als werkgever zijn ingedeeld bij de sector Elektrotechnische industrie, doch waarbij op
      genoemde datum gedurende een ononderbroken periode van vier, drie, twee of één jaar respectievelijk minder dan 30,
      15, 10 of 5 werknemers ten behoeve van bedoelde bedrijfsuitoefening in dienst waren, blijven aangesloten bij de
      sector Elektrotechnische industrie.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.6
  - number: 5.6.4
    text: |-
      In geval van rechtsopvolging van een werkgever als bedoeld in het eerste, tweede of derde lid wordt voor de
      toepassing van deze leden aangenomen dat sprake is van eenzelfde aansluiting.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.6
  - number: 5.7.1
    text: |-
      Een werkgever als bedoeld in [artikel 5.6][ref1] of de ondernemingsraad die aan de onderneming van die werkgever is
      verbonden, kan aan de inspecteur verzoeken te beslissen dat die werkgever is aangesloten bij die sector waarbij hij
      op grond van [artikel 5.5][ref2] en zonder het bepaalde in [artikel 5.6][ref3] zou zijn aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
        afdeling: '1'
  - number: 5.7.2
    text: |-
      Een verzoek als bedoeld in het eerste lid, wordt ingewilligd indien tussen de werkgever en de aan zijn onderneming
      verbonden ondernemingsraad daarover overeenstemming bestaat.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.7
  - number: 5.7.3
    text: |-
      Indien geen ondernemingsraad is verbonden aan de onderneming van de in het eerste lid bedoelde werkgever, treden
      de gezamenlijke werknemers in alle rechten van een ondernemingsraad wat betreft het in het eerste en tweede lid
      gestelde, met dien verstande dat als oordeel van de gezamenlijke werknemers geldt de met meerderheid van stemmen
      door hen ter zake uitgesproken mening.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.7
  - number: 5.8a.1
    text: |-
      Een werkgever, aangesloten bij sector 17, Detailhandel en ambachten is aangesloten bij sector 19,
      Grootwinkelbedrijf, indien het loon dat hij betaalt gedurende drie jaren tenminste het bedrag is, dat genoemd wordt
      in de bijlage bij deze regeling bij de sector Grootwinkelbedrijf.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.8a
  - number: 5.8a.2
    text: |-
      Een werkgever, aangesloten bij sector 19, Grootwinkelbedrijf, is aangesloten bij sector 17, Detailhandel en
      ambachten, indien het loon dat hij betaalt gedurende drie jaren lager is dan het bedrag, dat genoemd wordt in de
      bijlage bij deze regeling bij de sector Grootwinkelbedrijf.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.8a
  - number: '5.15'
    text: |-
      In deze afdeling en [afdeling 3][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0019150
        hoofdstuk: '5'
        afdeling: '3'
  - number: 5.15.a
    text: |-
      een rekening-courant: een rekening in de centrale administratie van ’s Rijks schatkist bij het ministerie van
      Financiën op naam van een rekening-couranthouder, waarop dagelijks het geldelijk tegoed (positief of negatief)
      wordt bijgehouden van de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
  - number: 5.15.b
    text: 'de rekening-couranthouder: de SVB, het UWV of het Zorginstituut, ieder voorzover het hem aangaat;'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
  - number: 5.15.c
    text: |-
      het verdeelpercentage: het percentage waarmee de totale opbrengst van de loonheffing (de gecombineerde heffing van
      loonbelasting en premie voor de volksverzekeringen) en de premie voor de werknemersverzekeringen wordt verdeeld in
      een opbrengst van de loonheffing en in een opbrengst van de diverse premies voor de werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
  - number: 5.15.d
    text: |-
      het toedelingspercentage: het percentage waarmee de opbrengst van de loonheffing respectievelijk de inkomensheffing
      (de gecombineerde heffing van inkomstenbelasting en premie voor de volksverzekeringen) wordt verdeeld in
      belastingopbrengst en opbrengst van de premie voor de volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
  - number: 5.15.e
    text: 'de valutadatum: de dag waarop het bedrag van een boeking rentedragend wordt.'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.15
  - number: '5.16'
    text: 'In de centrale administratie van ''s Rijks schatkist worden de volgende rekeningen-courant geopend:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.16
  - number: 5.16.a
    text: |-
      één of meer rekeningen-courant op naam van de SVB ten behoeve van de financiële middelen van de fondsen die de
      SVB beheert;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.16
  - number: 5.16.b
    text: |-
      één of meer rekeningen-courant op naam van het UWV ten behoeve van de financiële middelen van de fondsen die het
      UWV beheert;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.16
  - number: 5.16.c
    text: |-
      één of meer rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het Fonds
      langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.16
  - number: 5.17.1
    text: 'Ten gunste van de rekeningen-courant van de SVB en het UWV worden geboekt:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.1.a
    text: de bijdragen van het Rijk aan de rekening-couranthouders ten behoeve van de desbetreffende fondsen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.1.b
    text: |-
      de afdrachten van de door de rijksbelastingdienst geïnde premies aan de rekening-couranthouders ten behoeve van de
      desbetreffende fondsen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.1.c
    text: |-
      de creditrente, bedoeld in [artikel 5.18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '2'
  - number: 5.17.1.d
    text: de bijschrijvingen op het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.2
    text: 'Ten laste van de rekeningen-courant van de SVB en het UWV worden geboekt:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.2.a
    text: |-
      de afdrachten door de rekening-couranthouders ten gunste van het tegoed van ’s Rijks schatkist of ten gunste van
      het tegoed dat een derde bij ’s Rijks schatkist in rekening-courant aanhoudt;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.2.b
    text: |-
      de eventuele terugbetalingen aan de rijksbelastingdienst samenhangende met de afdrachten, bedoeld in het eerste
      lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.2.c
    text: |-
      de debetrente, bedoeld in [artikel 5.18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '2'
  - number: 5.17.2.d
    text: de afschrijvingen van het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.3
    text: |-
      De Minister van Financiën sluit met de SVB en het UWV overeenkomsten ter uitwerking van het gebruik van de
      rekeningen-courant.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.4
    text: |-
      In een overeenkomst als bedoeld in het derde lid worden afspraken vastgelegd over de wederzijdse
      informatievoorziening tussen enerzijds de Minister van Financiën en anderzijds respectievelijk de SVB en het UWV.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.5
    text: |-
      De boekingen, bedoeld in het eerste lid, onderdeel b, worden door de Minister van Financiën van valutadata
      voorzien, zodanig dat deze data overeenkomen met de gemiddelde data waarop de premies door de rijksbelastingdienst
      worden geïnd.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
  - number: 5.17.6
    text: |-
      De [artikelen 4.3][ref1] en [4.4 van de Regeling zorgverzekering][ref2] zijn van overeenkomstige toepassing op de
      rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het Fonds langdurige
      zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '4'
  - number: 5.18.1
    text: |-
      Over de dagelijkse creditsaldi van elk van de rekeningen-courant
      wordt door de Minister van Financiën een rente vergoed overeenkomstig
      [artikel 4, eerste lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040289#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0040289
        artikel: '4'
  - number: 5.18.2
    text: |-
      Over de dagelijkse debetsaldi van elk van de rekeningen-courant wordt
      door de rekening-couranthouders een rente betaald overeenkomstig
      [artikel 4, vijfde lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040289#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0040289
        artikel: '4'
  - number: 5.18.3
    text: |-
      De Staat verrekent de verschuldigde creditrente met verschuldigde debetrente. Deze rente die verschuldigd is, wordt
      verrekend op de rekening-courant per de eerste kalenderdag na afloop van het jaar waarop de credit- respectievelijk
      debetrente betrekking heeft. Daartoe stelt de Minister van Financiën een rentenota op.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.18
  - number: '5.19'
    text: De rekening-couranthouder is bevoegd een bedrag van ten hoogste € 2,5 miljoen buiten de rekening-courant te houden.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.19
  - number: 5.20.1
    text: |-
      De totale opbrengsten van de gecombineerde heffing van de loonbelasting en de premies voor de sociale verzekeringen
      alsmede de daarop betrekking hebbende naheffingsaanslagen, belasting- en invorderingsrente en boeteontvangsten
      worden uitgesplitst in een voor de afdracht vastgesteld verdeelpercentage per belasting/premiejaar.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: 5.20.2
    text: |-
      Het verdeelpercentage wordt maandelijks per belasting/premiejaar door de Minister van Financiën vastgesteld op
      basis van de over het belasting/premiejaar ontvangen loonaangiften en opgelegde naheffingen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: 5.20.3
    text: |-
      Alle ontvangen gelden over het belasting/premiejaar worden verdeeld op basis van het verdeelpercentage, bedoeld in
      het eerste lid. De mutatie ten opzichte van de vorige periode vormt het af te dragen bedrag.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: 5.20.4
    text: |-
      In het tweede jaar na afloop van het belasting/premiejaar wordt het verdeelpercentage voor het betreffende
      belasting/premiejaar definitief vastgesteld. Dit percentage wordt gehanteerd voor de definitieve verdeling van de
      ontvangen gelden over het betreffende belasting/premiejaar voor alle betalingen die daarna worden geïnd.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: 5.20.5
    text: |-
      In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het vierde lid, te verlengen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.20
  - number: 5.21.1
    text: |-
      De opbrengsten van de gecombineerde heffing van de loonbelasting, inkomstenbelasting en de premie voor de
      volksverzekeringen worden uitgesplitst volgens een voor de loonheffing en voor de inkomensheffing afzonderlijk
      vastgesteld toedelingspercentage.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21.2
    text: |-
      Voorafgaand aan het belasting/premiejaar worden in overleg tussen de beheerders van de fondsen voor
      de volksverzekeringen en de Minister van Financiën voorlopige toedelingspercentages vastgesteld. De
      toedelingspercentages worden gebaseerd op de transactieramingen voor het desbetreffende belasting/premiejaar.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21.3
    text: |-
      In het tweede jaar na afloop van het belasting/premiejaar wordt het toedelingspercentage voor de loonheffing
      definitief vastgesteld. In het vierde kalenderjaar na afloop van het belasting/premiejaar wordt het
      toedelingspercentage voor de inkomensheffing definitief vastgesteld. De definitieve vaststelling vindt plaats op
      basis van de gerealiseerde belastingheffing en leidt tot een correctie van de reeds afgedragen premie-opbrengsten
      aan de fondsen met de belastingopbrengsten.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21.4
    text: |-
      De opbrengsten van de loonheffing en de inkomensheffing die door de rijksbelastingdienst worden geïnd nadat het
      toedelingspercentage definitief is vastgesteld, worden uitgesplitst op basis van het definitief vastgestelde
      toedelingspercentage.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21.5
    text: |-
      De correctie, bedoeld in het derde lid, wordt door de Minister van Financiën met de beheerder van dat fonds
      afgerekend.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21.6
    text: |-
      In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het derde lid, te verlengen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21
  - number: 5.21a.1
    text: |-
      De belasting- en invorderingsrente en boeteontvangsten die betrekking hebben op de opbrengsten van de
      gecombineerde heffing van de loonbelasting, inkomstenbelasting en de premie voor de volksverzekeringen, bedoeld in
      [artikel 5.21, eerste lid][ref1], worden uitgesplitst volgens een voor de loonheffing en voor de inkomensheffing
      gezamenlijk vastgesteld toedelingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21a
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '2'
  - number: 5.21a.2
    text: |-
      Het toedelingspercentage, bedoeld in het eerste lid, wordt in overleg tussen de beheerders van de fondsen voor
      de volksverzekeringen en de Minister van Financiën voorafgaand aan het belasting/premiejaar vastgesteld en wordt
      gebaseerd op de transactieramingen voor het desbetreffende belasting/premiejaar.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.21a
  - number: 5.22.1
    text: |-
      De rijksbelastingdienst rapporteert uiterlijk de tiende werkdag na afloop van de maand over de opbrengsten, bedoeld
      in de [artikelen 5.20][ref1] en [5.21][ref2] aan de Minister van Financiën en de SVB, het UWV en het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel5
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0019150
        artikel: '5'
        hoofdstuk: '5'
        afdeling: '2'
  - number: 5.22.2
    text: |-
      In afwijking van het eerste lid vindt de rapportage over de laatste maand van het kalenderjaar uiterlijk de
      vijftiende werkdag na afloop van het kalenderjaar plaats.
