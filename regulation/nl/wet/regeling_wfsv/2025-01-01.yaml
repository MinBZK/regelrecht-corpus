    text: |-
      Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister van Sociale Zaken en Werkgelegenheid in het
      jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende jaar geraamde uitvoeringskosten
      voor basisdienstverlening. De eerste zin is niet van toepassing op de geraamde uitvoeringskosten voor
      basisdienstverlening voor het jaar 2020.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel5.40a
  - number: 5.40a.5
    text: |-
      De Minister van Sociale Zaken en Werkgelegenheid stort op de rekening-courant van het UWV, bedoeld in
      [artikel 120, eerste lid, van de Wfsv][ref1], een voorschot ter hoogte van 1/12e deel van het bedrag, bedoeld in
      het vierde lid, met als valutadag de vijftiende dag van elke kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel120
