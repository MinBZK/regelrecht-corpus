    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
  - number: 4.3.3.a
    text: |-
      een afschrift van de aan elk van de tot de in het tweede lid bedoelde meerderheid behorende natuurlijke personen
      verleende ontheffing, bedoeld in [artikel 4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.3.b
    text: een gewaarmerkt afschrift van de statuten van de rechtspersoon, en
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
  - number: 4.3.3.c
    text: |-
      een gewaarmerkt afschrift van de notulen van de vergadering, waarin het besluit tot het aanvragen van de ontheffing
      is genomen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      De SVB verleent de ontheffing, indien de verklaring naar haar mening overeenkomstig de waarheid is. Aan een
      werkgever, die heeft verklaard geen gemoedsbezwaren te hebben tegen de nakoming van de hem als werkgever opgelegde
      verplichtingen, kan op die grond een ontheffing van de hem anders dan in zijn hoedanigheid van werkgever opgelegde
      verplichtingen niet worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Voorzover volksverzekeringen in het geding zijn, wordt, indien de verzoeker heeft verklaard, dat hij de in één of
      meer van de genoemde wetten geregelde voorzieningen niet als verzekering beschouwt, geen ontheffing verleend van de
      in die wet of wetten opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      Van de verleende ontheffing wordt door de SVB aan de verzoeker een bewijs uitgereikt, waarvan het model wordt
      vastgesteld door de SVB.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      Degene, die is ontheven van zijn verplichtingen als werkgever, is verplicht te zorgen, dat het hem uitgereikte
      bewijs van ontheffing of een afschrift daarvan wordt en blijft opgehangen op een plaats, die vrij toegankelijk
      is voor alle in zijn dienst zijnde werknemers en waar deze geregeld plegen te komen, op zodanige wijze, dat van
      hetgeen op het desbetreffende stuk staat vermeld, gemakkelijk kan worden kennisgenomen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.7
  - number: 4.8.1
    text: |-
      Indien degene aan wie ontheffing is verleend aan de loonbelasting is onderworpen, is hij verplicht van de hem
      verleende ontheffing mededeling te doen aan degene, die de inhouding verricht, door het tonen aan laatstbedoelde
      van het uitgereikte bewijs van ontheffing.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.8
  - number: 4.8.2
    text: |-
      Voor de werknemer, die niet aan de loonbelasting is onderworpen, geldt dezelfde verplichting ten opzichte van diens
      werkgever.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.8
  - number: 4.9.1
    text: 'Een ontheffing wordt door de SVB ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.1.a
    text: op verzoek van degene, aan wie de ontheffing is verleend;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.1.b
    text: |-
      indien naar het oordeel van de SVB de gemoedsbezwaren, op grond waarvan de ontheffing is verleend, niet langer
      geacht kunnen worden te bestaan.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.2
    text: |-
      De ontheffing kan worden ingetrokken, indien verplichtingen, die nog op de degene aan wie ontheffing is verleend
      rusten ingevolge de in [artikel 4.1][ref1] genoemde wetten, of die hem bij deze regeling zijn opgelegd, niet door
      hem worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.9.3
    text: |-
      De SVB kan bij de intrekking tevens bepalen, dat een verzoek om ontheffing gedaan binnen twee jaren na de
      dagtekening van de intrekking, enkel op die grond niet-ontvankelijk kan worden verklaard.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Degene, wiens ontheffing is ingetrokken, is verplicht binnen drie dagen na de dagtekening van de desbetreffende
      kennisgeving, het bewijs van ontheffing terug te geven aan de SVB.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.5
    text: |-
      Indien degene, wiens ontheffing is ingetrokken, aan de loonbelasting is onderworpen, doet de SVB van de intrekking
      mededeling aan degene, die de inhouding verricht.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.6
    text: |-
      Ten aanzien van de werknemer, die niet aan de loonbelasting is onderworpen, wordt eenzelfde mededeling als bedoeld
      in het vorige lid gedaan aan diens werkgever.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: 4.9.7
    text: |-
      Onverminderd het overigens in dit artikel bepaalde vervalt de ontheffing, die is verleend aan een rechtspersoon, na
      verloop van vijf jaar na de datum van ingang van de ontheffing. Met ingang van de datum, waarop een ontheffing is
      vervallen, kan een nieuwe ontheffing worden verleend.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel4.9
  - number: '5.1'
    text: |-
      Het bedrijfs- en beroepsleven wordt ingedeeld in de volgende genummerde sectoren, bedoeld in
      [artikel 95, van de Wfsv][ref1]:


