  - number: 5.29b
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *toeslagen:* toeslagen op grond van de [TW][ref1], inclusief de op grond van enige wet over de toeslagen door
      het UWV verschuldigde premies die niet op deze toeslagen in mindering kunnen worden gebracht en de door het UWV
      verschuldigde vergoedingen, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2];

      b. *uitkeringen:* uitkeringen op grond van de [IOW][ref3] en de [Wajong][ref4], inclusief de op grond van enige
      wet over de uitkeringen door het UWV verschuldigde premies, die niet op deze uitkeringen in mindering kunnen worden
      gebracht, de door het UWV verschuldigde vergoedingen, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref5], en
      de tegemoetkomingen op grond van de [artikelen 2:52][ref6] en [3:10 van de Wajong][ref7];

      c. *tegemoetkomingen:* tegemoetkomingen op grond van de
      [artikelen 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref8], zoals dat
      luidde op 31 december 2013, [63a van de Wet werk en inkomen naar arbeidsvermogen][ref9],
      [65l van de Wet op de arbeidsongeschiktheidsverzekering][ref10],
      [67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref11] en
      [3:75 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12];

      d. *overige baten en lasten:* de overige baten en lasten met betrekking tot het Wajong-fonds en de overige baten en
      lasten met betrekking tot het Toeslagenfonds.


