  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - AKW: de [Algemene Kinderbijslagwet][ref1];
        - ANW: de [Algemene nabestaandenwet][ref2];
        - AOW: [Algemene Ouderdomswet][ref3];
        - Wlz: De [Wet langdurige zorg][ref4].
        - *IOW:* de [Wet inkomensvoorziening oudere werklozen][ref5];
        - TW: de [Toeslagenwet][ref6];
        - Wajong: de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7];
        - WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref8];
        - Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref9];
        - Wfsv: de [Wet financiering sociale verzekeringen][ref10];
        - WW: de [Werkloosheidswet][ref11];
        - Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref12];
        - ZW: de [Ziektewet][ref13].


