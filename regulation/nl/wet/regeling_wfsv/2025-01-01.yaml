  - number: '3.34'
    text: |-
      1 Voor de toepassing van [artikel 122n, tweede lid, van de Wfsv][ref1] wordt als arbeidsbeperkte beschouwd de
      arbeidsbeperkte werknemer die aan de werkgever in de sector overheid onderscheidenlijk de sector niet-overheid ter
      beschikking is gesteld om voor hem onder zijn toezicht en leiding arbeid te verrichten.

      2 Het aantal banen, uitgedrukt in verloonde uren, bedoeld in [artikel 3.33, eerste lid][ref2], wordt voor 2013
      verminderd met het aantal banen, uitgedrukt in verloonde uren, van de ter beschikking gestelde arbeidsbeperkten,
      bedoeld in het eerste lid, door werkgevers in de overheidssector aan werkgevers in de niet-overheidssector
      onderscheidenlijk door werkgevers in de niet-overheidssector aan werkgevers in de overheidssector. De banen,
      uitgedrukt in verloonde uren, die in mindering zijn gebracht worden gerekend tot de niet-overheidssector
      onderscheidenlijk de overheidssector waartoe de werkgever behoort waaraan de arbeidsbeperkte ter beschikking is
      gesteld.

      3 Het aantal banen, uitgedrukt in verloonde uren, bedoeld in [artikel 3.33, tweede en derde lid][ref3], wordt
      voor 2015 en voor de jaren daarna, bedoeld in deze leden, verminderd met het aantal banen, uitgedrukt in verloonde
      uren in de maand december in het desbetreffende kalenderjaar, van de ter beschikking gestelde arbeidsbeperkten,
      bedoeld in het eerste lid, door werkgevers in de overheidssector aan werkgevers in de niet-overheidssector
      onderscheidenlijk door werkgevers in de niet-overheidssector aan werkgevers in de overheidssector. Het tweede lid,
      tweede zin, is van overeenkomstige toepassing. De toepassing van het tweede lid, tweede zin, vindt plaats op grond
      van een verdeelsleutel die bij de jaarlijkse meting van het aantal banen, bedoeld in artikel 3.33, tweede en derde
      lid, wordt geactualiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel122n
