  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid en de Minister van
    Volksgezondheid, Welzijn en Sport;

    Gelet op de artikelen 13, 17, vijfde en zesde lid, 34, tweede lid, 40, derde lid, 41, eerste lid, 55, 63, 67, 81,
    95, eerste lid, 96, derde lid, 102, derde lid, 110, derde lid, 119, zesde en zevende lid, 120, tweede, zevende en
    achtste lid, 121 en 122 van de Wet financiering sociale verzekeringen, en de artikelen 2.2, achtste lid, en 2.3,
    eerste en derde lid, van het Besluit Wfsv;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - AKW: de [Algemene Kinderbijslagwet][ref1];
        - ANW: de [Algemene nabestaandenwet][ref2];
        - AOW: [Algemene Ouderdomswet][ref3];
        - Wlz: De [Wet langdurige zorg][ref4].
        - *IOW:* de [Wet inkomensvoorziening oudere werklozen][ref5];
        - TW: de [Toeslagenwet][ref6];
        - Wajong: de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7];
        - WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref8];
        - Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref9];
        - Wfsv: de [Wet financiering sociale verzekeringen][ref10];
        - WW: de [Werkloosheidswet][ref11];
        - Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref12];
        - ZW: de [Ziektewet][ref13].


