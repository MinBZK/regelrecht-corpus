      [65l van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] en
      [3:75 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6];

      c. uitkeringen op grond van de [IOW][ref7].


