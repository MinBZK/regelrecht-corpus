      uitbetaling van kindgebonden budget aan degenen die in Marokko zijn belast met de zorg voor in Marokko woonachtige
      kinderen;

      b. *uitvoeringskosten:* het totaalbedrag van de kosten die de SVB maakt bij de uitvoering, bedoeld in
      [artikel 34, derde lid, onderdeel b, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      voor zover het betreft de [Wet op het kindgebonden budget][ref3], de uitvoering van de
      [Regeling samenloop met buitenlandse tegemoetkomingen 2008][ref4] en de uitvoering van de uitbetaling van
      kindgebonden budget aan degenen die in Marokko zijn belast met de zorg voor in Marokko woonachtige kinderen van een
      aanspraak op het kindgebonden budget.


