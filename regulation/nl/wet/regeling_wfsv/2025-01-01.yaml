  - number: '5.18'
    text: |-
      1 Over de dagelijkse creditsaldi van elk van de rekeningen-courant
      wordt door de Minister van Financiën een rente vergoed overeenkomstig
      [artikel 4, eerste lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].

      2 Over de dagelijkse debetsaldi van elk van de rekeningen-courant
      wordt door de rekening-couranthouders een rente betaald overeenkomstig
      [artikel 4, vijfde lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref2].

      3 De Staat verrekent de verschuldigde creditrente met verschuldigde debetrente. Deze rente die verschuldigd
      is, wordt verrekend op de rekening-courant per de eerste kalenderdag na afloop van het jaar waarop de credit-
      respectievelijk debetrente betrekking heeft. Daartoe stelt de Minister van Financiën een rentenota op.


