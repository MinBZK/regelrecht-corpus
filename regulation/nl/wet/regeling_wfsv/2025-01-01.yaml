      1 Voor 1 oktober van elk jaar verstrekt de SVB aan de Minister van Sociale Zaken en Werkgelegenheid in het jaarplan
      met begroting een opgave van het totaalbedrag aan de voor het komende jaar geraamde baten en lasten met betrekking
      tot het Algemeen Kinderbijslagfonds, uitgesplitst naar uitkeringslasten per maand en uitvoeringskosten per jaar.

      2 De bedragen in de opgave, bedoeld in het eerste lid, worden gespecificeerd naar het aantal
      kinderbijslaggerechtigden en het aantal kinderen naar leeftijdsklassen en naar rangorde uitgesplitst naar
      toepassing van [artikel 12 van de Algemene Kinderbijslagwet][ref1].


