  - number: '2.4'
    text: |-
      Ten aanzien van degene die gedurende een gedeelte van het kalenderjaar niet premieplichtig is, wordt voor de
      premieheffing bij wege van aanslag als premie-inkomen geen hoger bedrag in aanmerking genomen dan het premie-
      inkomen verminderd met het gedeelte daarvan waarop, op grond van een internationale regeling inzake sociale
      zekerheid die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere
      mogendheid van toepassing is, of dat, bij gebreke van een internationale regeling, is onderworpen aan premieheffing
      krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere mogendheid.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Ten aanzien van degene die gedurende een deel van het kalenderjaar anders dan door overlijden niet premieplichtig
      is, wordt voor de premieheffing bij wege van aanslag als premie-inkomen in aanmerking genomen het bedrag dat
      naar tijdsevenredigheid is afgeleid van het in [artikel 8, derde lid, van de Wfsv][ref1] vermelde premie-inkomen
      dat maximaal in aanmerking zou zijn genomen indien gedurende het gehele kalenderjaar sprake zou zijn geweest van
      premieplicht, tenzij toepassing van de bepalingen in [die wet][ref2] of van de overige bepalingen in deze regeling
      tot een lager premie-inkomen leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '2.6'
    text: |-
      Ingeval zich ten aanzien van een verzekerde die in de premieheffing bij wege van aanslag wordt betrokken in
      het kalenderjaar tijdvakken voordoen waarin anders dan ingevolge [artikel 11, vierde lid, van de Wfsv][ref1]
      verschillende premiepercentages gelden, wordt van hem de premie geheven naar een percentage (heffingspercentage)
      dat is samengesteld uit tijdsevenredige delen van die verschillende premiepercentages. Het heffingspercentage wordt
      afgerond op honderdsten naar beneden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: 2.6a
    text: |-
      Ten aanzien van degene die gedurende een gedeelte van het kalenderjaar anders
      dan door overlijden niet premieplichtig is, wordt de heffingskorting, bedoeld in
      [artikel 12, eerste lid, onderdelen a, b en c, van de Wfsv][ref1], tijdsevenredig verminderd naar rato van de
      periode van premieplicht in het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel12
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.6a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '12'
  - number: '2.7'
    text: |-
      Ingeval voor de premieheffing bij wege van aanslag het premie-inkomen, het heffingspercentage of de heffingskorting
      moet worden bepaald door middel van tijdsevenredige vaststelling, wordt daarbij:
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.7
  - number: 2.7.a
    text: een kalenderjaar op 360 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.7
  - number: 2.7.b
    text: een kalendermaand op 30 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.7
  - number: 2.7.c
    text: de dag waarop het tijdvak aanvangt als een gehele dag in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.7
  - number: 2.7.d
    text: de dag waarop het tijdvak eindigt niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.7
  - number: '3.1'
    text: |-
      Voor de toepassing van [artikel 17, eerste en tweede lid, van de Wfsv][ref1] wordt een loontijdvak dat zich
      uitstrekt over twee kalenderjaren, geacht te behoren tot het kalenderjaar waarin het loon over dat loontijdvak
      wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '3.2'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.2
  - number: 3.2.a
    text: 'arbeidsloon: loon uit een dienstbetrekking;'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.2
  - number: 3.2.b
    text: |-
      uitkering: een uitkering krachtens de [ZW][ref1],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2], de [WAO][ref3], de [Wet WIA][ref4] of
      de [WW][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0004045
  - number: 3.2.c
    text: |-
      aanvulling: arbeidsloon dat naar aard en strekking overeenkomt met een uitkering en door de werkgever, op grond van
      een aan zijn werknemer toegekende aanspraak, over dezelfde periode als waarover de uitkering wordt verstrekt aan de
      werknemer wordt betaald.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Indien een werknemer die van één of meerdere werkgevers arbeidsloon ontvangt, vervolgens in plaats van één of elk
      van die lonen uitkering en aanvulling ontvangt, wordt het totaalbedrag van die uitkering en aanvulling voor de
      toepassing van [artikel 17 van de Wfsv][ref1] geacht bij dezelfde werkgever te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 3.3.2
    text: |-
      Indien het eerste lid toepassing vindt, blijft bij de berekening van het loon waarnaar de premies op grond van
      [hoofdstuk 3 van de Wfsv][ref1] worden geheven de aanvulling buiten aanmerking voorzover de aanvulling en uitkering
      tezamen meer bedragen dan het bedrag, bedoeld in [artikel 17, eerste lid, van de Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '3.4'
    text: |-
      Indien een werknemer van twee of meer werkgevers arbeidsloon ontvangt en vervolgens in
      plaats van één van die lonen een uitkering op grond van de [ZW][ref1] of op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2] ontvangt en in plaats van het overige
      loon of één of meer van de overige lonen een uitkering ontvangt, worden deze uitkeringen, in afwijking van
      [artikel 17, eerste lid, van de Wfsv][ref3] geacht niet bij dezelfde werkgever te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 3.4a
    text: |-
      Indien voor de werknemer gedurende een loontijdvak verschillende premiepercentages gelden, wordt het op grond
      van [artikel 17, derde lid, van de Wfsv][ref1] berekende verschil naar evenredigheid van de lonen waarvoor die
      verschillende premiepercentages gelden, aan die lonen toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 3.4b.1
    text: |-
      Bij de berekening van het percentage, bedoeld in [artikel 2.3, eerste lid, onderdeel b, van het Besluit Wfsv][ref1]
      wordt het aantal verloonde uren in een kalenderjaar, bedoeld in dat onderdeel, berekend door de verloonde uren
      in alle aangiftetijdvakken van dat kalenderjaar uit alle dienstbetrekkingen tussen de betreffende werkgever en
      werknemer bij elkaar op te tellen.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.4b.2
    text: |-
      Bij de berekening van het aantal uren dat als omvang van de te verrichten arbeid is overeengekomen ten
      aanzien van de dienstbetrekking of dienstbetrekkingen tussen de betreffende werkgever en werknemer, bedoeld in
      [artikel 2.3, eerste lid, onderdeel b, van het Besluit Wfsv][ref1] wordt deze omvang:


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.4b.2.a
    text: |-
      per dienstbetrekking en per aangiftetijdvak berekend als afgeleide van het in de aangifte opgegeven aantal
      contracturen per week, waarbij het aantal contracturen per week:
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.a.1°
    text: bij een aangiftetijdvak van vier weken wordt vermenigvuldigd met 4;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.a.2°
    text: bij een aangiftetijdvak van een maand wordt vermenigvuldigd met 13/3;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.a.3°
    text: bij een aangiftetijdvak van een half jaar wordt vermenigvuldigd met 26;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.a.4°
    text: bij een aangiftetijdvak van een jaar wordt vermenigvuldigd met 52;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.b
    text: zoals ingevolge onderdeel a berekend rekenkundig afgerond op 2 decimalen; en
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.2.c
    text: |-
      uit alle aangiftetijdvakken in een kalenderjaar en alle dienstbetrekkingen tussen de betreffende werkgever en
      werknemer bij elkaar opgeteld om de overeengekomen arbeidsomvang per kalenderjaar te berekenen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.3
    text: |-
      In het geval waarin de dienstbetrekking niet het gehele aangiftetijdvak heeft geduurd, wordt in afwijking van het
      tweede lid, onderdeel a, het in de loonaangifte opgegeven aantal contracturen per week vermenigvuldigd met het
      aantal kalenderdagen dat de dienstbetrekking in dat aangiftetijdvak heeft geduurd en vervolgens gedeeld door 7. De
      overeengekomen omvang van de te verrichten arbeid per aangiftetijdvak wordt rekenkundig afgerond op 2 decimalen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.4
    text: |-
      Bij de bepaling van het aantal contracturen per week ingevolge het tweede lid wordt gedurende het gehele
      aangiftetijdvak uitgegaan van het aantal contracturen per week dat van toepassing is op de laatste dag van het
      aangiftetijdvak of, indien de dienstbetrekking gedurende het aangiftetijdvak is geëindigd, op de laatste dag van
      de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: 3.4b.5
    text: |-
      Het percentage, bedoeld in [artikel 2.3, eerste lid, onderdeel b, van het Besluit Wfsv][ref1] wordt naar beneden
      afgerond op een heel percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.4b.6
    text: |-
      Het gemiddelde aantal uren dat is overeengekomen in arbeidsovereenkomsten die voldoen aan de voorwaarden voor
      toepassing van het lage premiepercentage, bedoeld in [artikel 2.3, derde lid, van het Besluit Wfsv][ref1],
      wordt berekend door de totale omvang van de te verrichten arbeid op jaarbasis te delen door de duur van de
      dienstbetrekking of dienstbetrekkingen waarop het lage premiepercentage van toepassing is, uitgedrukt in weken. Het
      bepaalde in het tweede, derde en vierde lid is van overeenkomstige toepassing. Dit getal wordt naar boven afgerond
      op hele uren.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.4b.7
    text: |-
      Voor het bepalen van de duur van de dienstbetrekking of dienstbetrekkingen, uitgedrukt in weken als bedoeld in het
      zesde lid, wordt het aantal kalenderdagen dat er tussen de werkgever en werknemer een of meer dienstbetrekkingen
      hebben bestaan waarop het lage premiepercentage van toepassing is, gedeeld door 7. Dit getal wordt rekenkundig
      afgerond op 2 decimalen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.4b
  - number: '3.9'
    text: |-
      Voor de sector uitzendbedrijven wordt voor de premiecomponent voor de ZW-lasten van de gedifferentieerde
      premie Werkhervattingskas, bedoeld in [artikel 2.6, vierde of vijfde lid, van het Besluit Wfsv][ref1]
      een maximum vastgesteld, dat 1,75 maal het voor die lasten in die sector met toepassing van
      [artikel 2.10, eerste lid, van het Besluit Wfsv][ref2] vastgestelde percentage bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
  - number: '3.14'
    text: |-
      De sectorale premiecomponenten voor de ZW-lasten en de WGA-lasten van de sectorale premiepercentages,
      bedoeld in [artikel 2.10, tweede lid, van het Besluit Wfsv][ref1], zijn voor de sectoren 57 en 60, bedoeld in
      [bijlage 1][ref2] bij deze regeling, gelijk aan het gewogen gemiddelde van deze premiecomponenten van de sectorale
      premiepercentages voor de sectoren 57 en 60.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019150
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019150
  - number: '3.15'
    text: |-
      Als overheidswerkgever als bedoeld in [artikel 40, derde lid, van de Wfsv][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 3.15.a
    text: |-
      de Koning, ten aanzien van door hem in dienst genomen overheidswerknemers die bij de Koninklijke Hofhouding
      werkzaam zijn en uit dien hoofde onder de Pensioenregeling van de Stichting tot verzorging van de pensioenen van
      het personeel van de Koninklijke Hofhouding van het Huis van Oranje-Nassau vallen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
  - number: 3.15.b
    text: het Rijk, de provincies, de gemeenten en de waterschappen;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
  - number: 3.15.c
    text: 'rechtspersonen, anders dan bedoeld in onderdeel b, die:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
  - number: 3.15.c.1
    text: bij of krachtens de wet zijn ingesteld, en
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
  - number: 3.15.c.2
    text: overheidswerknemers rechtstreeks ten laste van de rechtspersoon bezoldigen of belonen.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15
  - number: 3.15a
    text: |-
      Voor de garantie, bedoeld in [artikel 40, tweede lid, van de Wfsv][ref1], wordt het model gehanteerd dat is
      opgenomen in [bijlage 2][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0019150
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.15a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0019150
  - number: '3.16'
    text: |-
      In deze afdeling wordt verstaan onder eigenrisicodrager: de werkgever aan wie op grond van
      [artikel 40 van de Wfsv][ref1] toestemming is verleend het risico te dragen van de betalingen, bedoeld in
      [artikel 40, eerste lid, van de Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 3.17.1
    text: |-
      Voor de eigenrisicodrager die ter dekking van het risico, bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref1], een verzekering heeft gesloten, bedragen de kosten, die
      op grond van [artikel 41, eerste lid, van de Wfsv][ref2] voor verhaal op de werknemer in aanmerking komen de door
      hem verschuldigde premie, voor zover die premie betrekking heeft op verzekering van dat risico.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel41
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '41'
  - number: 3.17.2
    text: |-
      Voor de werkgever die ter dekking van het risico, bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref1], geen verzekering heeft gesloten worden de kosten,
      die op grond van [artikel 41, eerste lid, van de Wfsv][ref2] voor verhaal op een werknemer in aanmerking komen,
      vastgesteld op een percentage van het loon van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel41
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '41'
  - number: 3.17.3
    text: |-
      Het percentage, bedoeld in het tweede lid, wordt bepaald door de verwachte WGA-totaallasten, bedoeld in
      [artikel 2.5, eerste lid, onderdeel h, van het Besluit Wfsv][ref1] in het kalenderjaar waarvoor de premie
      wordt vastgesteld of de WGA-totaallasten in het voorgaande kalenderjaar te delen door het totaal van het
      premieplichtig loon dat in dat kalenderjaar ten laste komt of in voorgaande kalenderjaar is gekomen van
      de eigenrisicodrager. Dit percentage bedraagt ten hoogste 1,5 maal de gedifferentieerde premie, bedoeld in
      [artikel 2.6, derde, vierde, vijfde en zesde lid, van het Besluit Wfsv][ref2], waarbij de premiecomponent ZW-
      lasten niet in aanmerking wordt genomen, die ten hoogste op de werkgever van toepassing zou zijn indien hij geen
      eigenrisicodrager zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.17.4
    text: |-
      Indien na afloop van het kalenderjaar blijkt, dat de te verwachten bedragen in een kalenderjaar afwijken van de
      gerealiseerde bedragen, kan indien dit zou leiden tot een ander bedrag van de kosten voor het verhaal, het bedrag
      van het verhaal in het kalenderjaar volgend op dat kalenderjaar worden herzien tot ten hoogste het bedrag, bedoeld
      in [artikel 41, eerste lid, van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel41
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '41'
  - number: '3.18'
    text: |-
      De werkgever kan de met betrekking tot een werknemer door hem verschuldigde premie
      Werkhervattingskas die betrekking heeft op de premiecomponent WGA-lasten, bedoeld in
      [artikel 2.5, eerste lid, onderdeel g, van het Besluit Wfsv][ref1], tot ten hoogste de helft verhalen op de
      werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: '3.30'
    text: |-
      De werknemer die werkzaam is in een dienstbetrekking of op basis van een arbeidsovereenkomst als bedoeld in
      [artikel 78d, eerste lid, van de Participatiewet][ref1] wordt mede beschouwd als een arbeidsbeperkte.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel78d
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 78d
  - number: 3.31.1
    text: |-
      Voor de toepassing van [hoofdstuk 3, afdeling 4, paragraaf 4a van de Wfsv][ref1] en
      [artikel 122n van de Wfsv][ref2] worden overheidswerkgevers gerekend tot de sector overheid, en werkgevers, met
      uitzondering van overheidswerkgevers, tot de sector niet-overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Paragraaf4a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel122n
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0017745
        paragraaf: 4a
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 122n
  - number: 3.31.2
    text: |-
      In afwijking van het eerste lid wordt een overheidswerkgever die tevens premieplichtig is ten gunste van het
      Algemeen Werkloosheidsfonds, aangemerkt als werkgever die behoort tot de sector niet-overheid indien van het
      totaal aantal verloonde uren ten minste de helft is onderworpen aan de premieplicht ten gunste van het Algemeen
      Werkloosheidsfonds.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.31
  - number: 3.31.3
    text: |-
      De indeling van overheidswerkgevers en werkgevers overeenkomstig het eerste en tweede lid wordt bepaald op basis
      van het laatste aangiftetijdvak in het kalenderjaar voorafgaand aan het kalenderjaar waarover het quotumtekort,
      bedoeld in [artikel 38g van de Wfsv][ref1], wordt vastgesteld en geldt gedurende dat laatste kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38g
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38g
  - number: '3.32'
    text: |-
      Voor de toepassing van [artikel 38g, derde lid, van de Wfsv][ref1] wordt het gemiddeld aantal verloonde uren van
      een werkzame arbeidsbeperkte op jaarbasis bepaald op 1.331 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38g
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38g
  - number: 3.33.1
    text: |-
      Het aantal banen in 2013 vervuld door arbeidsbeperkten als bedoeld in de
      [artikelen 38b, eerste lid, van de Wfsv][ref1] en [artikel 3.30][ref2], uitgedrukt in verloonde uren in de maand
      december 2012, bedraagt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel3
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0019150
        artikel: '3'
        hoofdstuk: 3a
  - number: 3.33.1.a
    text: 'de overheidssector: 1.176.671 uren;'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.33
  - number: 3.33.1.b
    text: 'de niet-overheidssector: 7.162.200 uren.'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel3.33
