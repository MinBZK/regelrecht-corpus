      1 De uitvoeringskosten van het UWV voor de beoordelingen van de verdienmogelijkheid van het wettelijk minimumloon,
      bedoeld in [artikel 3.5, eerste lid, van het Besluit SUWI][ref1], de werkzaamheden ten behoeve van de vaststelling
      of een persoon medisch urenbeperkt is als bedoeld in [artikel 6b, vierde lid, van de Participatiewet][ref2]
      en de werkzaamheden ten behoeve van de vaststelling of een persoon uitsluitend in een beschutte
      omgeving onder aangepaste omstandigheden mogelijkheden heeft tot arbeidsparticipatie, bedoeld in
      [artikel 10b, tweede lid, van de Participatiewet][ref3] komen als bedoeld in [artikel 5.40, tweede lid][ref4],
      ten laste van het Algemeen Werkloosheidsfonds. De rijksbijdrage aan het UWV, bedoeld in
      [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref5], komt, voor zover deze strekt tot vergoeding van de
      uitvoeringskosten van het UWV, bedoeld in de eerste zin, ten gunste van het Algemeen Werkloosheidsfonds.

      2 Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister van Sociale Zaken en Werkgelegenheid in het
      jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende jaar geraamde uitvoeringskosten.

      3 De Minister van Sociale Zaken en Werkgelegenheid stort op de rekening-courant van het UWV, bedoeld in
      [artikel 120, eerste lid, van de Wfsv][ref6] een voorschot ter hoogte van 1/12e deel van het in het tweede lid
      bedoelde bedrag, met als valutadag de vijftiende dag van elke kalendermaand.

      4 De Minister van Sociale Zaken en Werkgelegenheid kan na overleg met het UWV van het in het tweede lid bedoelde
      bedrag afwijken.

      5 In het jaarverslag, bedoeld in [artikel 49 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref7],
      neemt het UWV de gerealiseerde uitvoeringskosten en de ontvangen voorschotten op.

      6 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref8], rekent de Minister van Sociale Zaken
      en Werkgelegenheid de baten en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


