  - number: 5.40a
    text: |-
      1 Onder basisdienstverlening wordt in dit artikel verstaan de door het UWV te verrichten taken op grond van:

      a. de [artikelen 30][ref1], [30a][ref2], [30b][ref3], [31][ref4] en [33 van de Wet SUWI][ref5], voor zover het
      betreft de instandhouding van de polisadministratie, bedoeld in artikel 33 van de Wet SUWI, de leerwerkloketten,
      de werkgeversservicepunten en de technische voorzieningen ten behoeve van de registratie van werkzoekenden en
      vacatures;

      b. het bepaalde bij of krachtens [artikel 5 van de Wet arbeid vreemdelingen][ref6] inzake het afgeven en intrekken
      van tewerkstellingsvergunningen en advisering inzake verlenen, verlengen of intrekken van een gecombineerde
      vergunning;

      c. het bepaalde bij of krachtens [artikel 671a van Boek 7 van het Burgerlijk Wetboek][ref7] inzake de behandeling
      van verzoeken om schriftelijke toestemming tot het opzeggen van een arbeidsovereenkomst.

      2 Van de kosten voor de werkgeversservicepunten, bedoeld in het eerste lid, onderdeel a, wordt 30% toegerekend aan
      de kosten voor basisdienstverlening.

      3 De rijksbijdrage aan het UWV, bedoeld in [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref8] komt voor
      zover deze strekt tot vergoeding van de uitvoeringskosten van het UWV voor basisdienstverlening ten gunste van het
      Algemeen Werkloosheidsfonds. De uitvoeringskosten van het UWV voor basisdienstverlening komen ten laste van het
      Algemeen Werkloosheidsfonds.

      4 Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister van Sociale Zaken en Werkgelegenheid in het
      jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende jaar geraamde uitvoeringskosten
      voor basisdienstverlening. De eerste zin is niet van toepassing op de geraamde uitvoeringskosten voor
      basisdienstverlening voor het jaar 2020.

      5 De Minister van Sociale Zaken en Werkgelegenheid stort op de rekening-courant van het UWV, bedoeld in
      [artikel 120, eerste lid, van de Wfsv][ref9], een voorschot ter hoogte van 1/12e deel van het bedrag, bedoeld in
      het vierde lid, met als valutadag de vijftiende dag van elke kalendermaand.

      6 De Minister van Sociale Zaken en Werkgelegenheid kan na overleg met het UWV van het bedrag, bedoeld in het vierde
      lid, afwijken.

      7 In afwijking van het vijfde lid wordt het maandelijkse voorschot van de rijksbijdrage basisdienstverlening voor
      het jaar 2020 gebaseerd op een totaalbedrag van € 78.927.000.

      8 In het jaarverslag, bedoeld in [artikel 49, eerste lid, van de Wet SUWI][ref10], neemt het UWV de gerealiseerde
      uitvoeringskosten en de ontvangen voorschotten op.

      9 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref11], rekent de Minister van Sociale Zaken
      en Werkgelegenheid de baten en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


