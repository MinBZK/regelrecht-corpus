    text: |-
      1 Onder de uitvoeringskosten Wsw-indicatiestelling wordt verstaan de kosten die gemoeid zijn met de activiteiten
      van het UWV, bedoeld in [artikel 30d van de Wet SUWI][ref1].

      2 De rijksbijdrage aan het UWV, bedoeld in [artikel 45, eerste lid, onderdeel e, van de Wet SUWI][ref2], komt voor
      zover deze strekt tot vergoeding van de uitvoeringskosten van het UWV voor Wsw-indicatiestelling ten gunste van het
      Algemeen Werkloosheidsfonds. De uitvoeringskosten van het UWV voor Wsw-indicatiestelling komen ten laste van het
      Algemeen Werkloosheidsfonds.

      3 Voor 1 oktober van elk jaar verstrekt het UWV aan de Minister van Sociale Zaken en Werkgelegenheid in het
      jaarplan met begroting een opgave van het totaalbedrag aan de voor het komende jaar geraamde uitvoeringskosten Wsw-
      indicatiestelling. De eerste zin is niet van toepassing op de geraamde uitvoeringskosten voor Wsw-indicatiestelling
      voor het jaar 2020.

      4 De Minister van Sociale Zaken en Werkgelegenheid stort op de rekening-courant van het UWV, bedoeld in
      [artikel 120, eerste lid, van de Wfsv][ref3], een voorschot ter hoogte van 1/12e deel van het bedrag, bedoeld in
      het derde lid, met als valutadag de vijftiende dag van elke kalendermaand.

      5 De Minister van Sociale Zaken en Werkgelegenheid kan na overleg met het UWV van het bedrag, bedoeld in het derde
      lid, afwijken.

      6 In afwijking van het vierde lid wordt het maandelijkse voorschot van de rijksbijdrage Wsw-indicatiestelling voor
      het jaar 2020 gebaseerd op een totaalbedrag van € 3.543.000.

      7 In het jaarverslag, bedoeld in [artikel 49, eerste lid, van de Wet SUWI][ref4], neemt het UWV de gerealiseerde
      uitvoeringskosten en de ontvangen voorschotten op.

      8 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref5], rekent de Minister van Sociale Zaken
      en Werkgelegenheid de baten en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


