  - number: '2.1'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de landen van het Koninkrijk der Nederlanden aangemerkt als
      afzonderlijke mogendheden.
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Voor de toepassing van [artikel 8, eerste lid, van de Wfsv][ref1] wordt verstaan onder partner:
      degene, die partner is in de zin van [artikel 5a van de Algemene wet inzake rijksbelastingen][ref2] en
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref3], waarbij het vierde lid, onderdeel b, van het laatstgenoemde
      artikel buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 5a
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '1'
  - number: '2.3'
    text: 'Voor de heffing van premie voor de volksverzekeringen behoren niet tot het premie-inkomen:'
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.a
    text: |-
      uitkeringen op grond van de socialezekerheidswetgeving van een andere mogendheid die zijn onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van die andere
      mogendheid;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.b
    text: |-
      ten aanzien van degene die verzekerd is en die tevens werkzaamheden verricht of heeft verricht buiten het Europese
      deel van Nederland:
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.b.1°
    text: |-
      het gedeelte van het premie-inkomen dat onderworpen is aan premieheffing krachtens een wettelijke regeling inzake
      uitkeringen bij ouderdom en overlijden ten behoeve van Bonaire, Sint Eustatius en Saba,
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.b.2°
    text: |-
      het gedeelte van het premie-inkomen, waarop ingevolge een internationale regeling inzake sociale zekerheid die
      tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere mogendheid van
      toepassing is,
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.b.3°
    text: |-
      het gedeelte van het premie-inkomen, dat, bij gebreke van een internationale regeling, is onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere
      mogendheid;
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
  - number: 2.3.c
    text: |-
      ten aanzien van degene die niet is uitgezonderd van de verplichte verzekering voor
      de volksverzekeringen op grond van de [artikelen 13, eerste lid, onderdeel a][ref1],
      [13, tweede lid, onderdeel c][ref2], [13, derde lid, onderdeel a][ref3], [13, vierde lid, onderdeel c][ref4],
      [14, eerste lid, onderdeel a][ref5], [15, eerste lid, onderdelen a, b of c, subonderdeel 1°][ref6], of
      __REF006___________________________________________________________________________________________________________
      ____ in verband met het verrichten van de in die artikelen bedoelde andere werkzaamheden: het belastbare loon
      uit de dienstbetrekking uit hoofde waarvan hij zou zijn uitgezonderd van de verplichte verzekering voor de
      volksverzekeringen indien hij die andere werkzaamheden niet zou hebben verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010182#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0010182#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0010182#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0010182#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0010182#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0010182#Artikel15
      [ref7]: https://wetten.overheid.nl/BWBR0010182#Artikel16
    url: https://wetten.overheid.nl/BWBR0019150/2025-01-01#Artikel2.3
    references:
