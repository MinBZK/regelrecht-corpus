  - number: '3.8'
    text: |-
      1 Het op grond van [artikel 2.2, eerste lid, van het Besluit Wfsv][ref1] vastgestelde deel van het
      sectorpremiepercentage ter dekking van de werkloosheidslasten voor de sector uitzendbedrijven, wordt verschillend
      vastgesteld voor de sectoronderdelen, genoemd in [artikel 3.6][ref2].

      2 Per sectoronderdeel wordt het gewogen gemiddelde vastgesteld van het percentage, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.8
