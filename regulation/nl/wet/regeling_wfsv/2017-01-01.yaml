  - number: '5.14'
    text: |-
      1 Het UWV wijst, met inachtneming van het tweede lid, de sectorfondsen aan waarvoor een reserve voor de
      werkloosheidslasten wordt gevormd en in standgehouden.

      2 De reserve wordt niet gevormd of in stand gehouden, indien in het tweede kalenderjaar voorafgaande aan het
      kalenderjaar waarin de reserve zou worden gevormd of in stand gehouden, of in de 14 aan dat tweede kalenderjaar
      voorafgaande kalenderjaren, het lastenpercentage van de werkloosheidslasten niet ten minste éénmaal een wijziging
      van minimaal de drempelwaarde heeft gekend.

      3 De reserve heeft aan het einde van elk kalenderjaar een omvang van ten hoogste 2,5 maal de verzekerde loonsom in
      dat kalenderjaar maal het verschil tussen de grootste wijziging van het lastenpercentage van de werkloosheidslasten
      en de drempelwaarde in het jaar van de grootste wijziging.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.14
  - number: '5.15'
    text: |-
      In deze afdeling en [afdeling 3][ref1] wordt verstaan onder:

      a. een rekening-courant: een rekening in de centrale administratie van ’s Rijks schatkist bij het ministerie van
      Financiën op naam van een rekening-couranthouder, waarop dagelijks het geldelijk tegoed (positief of negatief)
      wordt bijgehouden van de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;

      b. de rekening-couranthouder: de SVB, het UWV of het Zorginstituut, ieder voorzover het hem aangaat;

      c. Euribor: de dagelijks door de European Banking Federation vastgestelde rente waartegen op de geldmarkt
      interbancair deposito's in euro's van verschillende looptijden worden aangeboden in de landen waar de euro
      betaalmiddel is;

      d. het verdeelpercentage: het percentage waarmee de totale opbrengst van de loonheffing (de gecombineerde heffing
      van loonbelasting en premie voor de volksverzekeringen) en de premie voor de werknemersverzekeringen wordt verdeeld
      in een opbrengst van de loonheffing en in een opbrengst van de diverse premies voor de werknemersverzekeringen;

      e. het toedelingspercentage: het percentage waarmee de opbrengst van de loonheffing respectievelijk de
      inkomensheffing (de gecombineerde heffing van inkomstenbelasting en premie voor de volksverzekeringen) wordt
      verdeeld in belastingopbrengst en opbrengst van de premie voor de volksverzekeringen;

      f. de valutadatum: de dag waarop het bedrag van een boeking rentedragend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0019150
        hoofdstuk: '5'
        afdeling: '3'
  - number: '5.16'
    text: |-
      In de centrale administratie van 's Rijks schatkist worden de volgende rekeningen-courant geopend:

      a. één of meer rekeningen-courant op naam van de SVB ten behoeve van de financiële middelen van de fondsen die de
      SVB beheert;

      b. één of meer rekeningen-courant op naam van het UWV ten behoeve van de financiële middelen van de fondsen die het
      UWV beheert;

      c. één of meer rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het
      Fonds langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.16
  - number: '5.17'
    text: |-
      1 Ten gunste van de rekeningen-courant van de SVB en het UWV worden geboekt:

      a. de bijdragen van het Rijk aan de rekening-couranthouders ten behoeve van de desbetreffende fondsen;

      b. de afdrachten van de door de rijksbelastingdienst geïnde premies aan de rekening-couranthouders ten behoeve van
      de desbetreffende fondsen;

      c. de creditrente, bedoeld in [artikel 5.18, vijfde lid][ref1];

      d. de bijschrijvingen op het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.

      2 Ten laste van de rekeningen-courant van de SVB en het UWV worden geboekt:

      a. de afdrachten door de rekening-couranthouders ten gunste van het tegoed van ’s Rijks schatkist of ten gunste van
      het tegoed dat een derde bij ’s Rijks schatkist in rekening-courant aanhoudt;

      b. de eventuele terugbetalingen aan de rijksbelastingdienst samenhangende met de afdrachten, bedoeld in het eerste
      lid, onderdeel b;

      c. de debetrente, bedoeld in [artikel 5.18, vijfde lid][ref2];

      d. de afschrijvingen van het tegoed van ’s Rijks schatkist bij een bankinstelling door de rekening-couranthouders.

      3 De Minister van Financiën sluit met de SVB en het UWV overeenkomsten ter uitwerking van het gebruik van de
      rekeningen-courant.

      4 In een overeenkomst als bedoeld in het derde lid worden afspraken vastgelegd over de wederzijdse
      informatievoorziening tussen enerzijds de Minister van Financiën en anderzijds respectievelijk de SVB en het UWV.

      5 De boekingen, bedoeld in het eerste lid, onderdeel b, worden door de Minister van Financiën van valutadata
      voorzien, zodanig dat deze data overeenkomen met de gemiddelde data waarop de premies door de rijksbelastingdienst
      worden geïnd.

      6 De [artikelen 4.3][ref3] en [4.4 van de Regeling zorgverzekering][ref4] zijn van overeenkomstige toepassing op
      de rekeningen-courant op naam van het Zorginstituut ten behoeve van de financiële middelen van het Fonds langdurige
      zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.18
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel5.18
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel4.3
      [ref4]: https://wetten.overheid.nl/BWBR0018715#Artikel4.4
