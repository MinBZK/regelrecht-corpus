  - number: '3.28'
    text: |-
      Voor de toepassing van [artikel 48b van de Wfsv][ref1] wordt bij de vaststelling van de door een werkgever met een
      ander aangiftetijdvak dan een maand de premiekorting voor het jaar 2014 als volgt berekend: bij een aangiftetijdvak
      van vier aaneengesloten weken wordt van de over het zevende aangiftetijdvak toe te passen premiekorting 13/28 in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48b
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.28
