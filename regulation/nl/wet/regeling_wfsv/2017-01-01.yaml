  - number: '3.31'
    text: |-
      1 Voor de toepassing van [hoofdstuk 3, afdeling 4, paragraaf 4a van de Wfsv][ref1] en
      [artikel 122n van de Wfsv][ref2] worden overheidswerkgevers gerekend tot de sector overheid, en werkgevers, met
      uitzondering van overheidswerkgevers, tot de sector niet-overheid.

      2 In afwijking van het eerste lid wordt een overheidswerkgever die tevens premieplichtig is ten gunste van
      een sectorfonds, aangemerkt als werkgever die behoort tot de sector niet-overheid indien van het totaal aantal
      verloonde uren ten minste de helft is onderworpen aan de premieplicht ten gunste van een sectorfonds.

      3 De indeling van overheidswerkgevers en werkgevers overeenkomstig het eerste en tweede lid wordt bepaald op basis
      van het laatste aangiftetijdvak in het kalenderjaar voorafgaand aan het kalenderjaar waarover het quotumtekort,
      bedoeld in [artikel 38g van de Wfsv][ref3], wordt vastgesteld en geldt gedurende dat laatste kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Paragraaf4a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel122n
