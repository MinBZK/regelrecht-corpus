        artikel: '1.2'
  - number: '2.3'
    text: |-
      Voor de heffing van premie voor de volksverzekeringen behoren niet tot het premie-inkomen:

      a. uitkeringen op grond van de socialezekerheidswetgeving van een andere mogendheid die zijn onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van die andere
      mogendheid;

      b. ten aanzien van degene die verzekerd is en die tevens werkzaamheden verricht of heeft verricht buiten het
      Europese deel van Nederland:

      1°. het gedeelte van het premie-inkomen dat onderworpen is aan premieheffing krachtens een wettelijke regeling
      inzake uitkeringen bij ouderdom en overlijden ten behoeve van Bonaire, Sint Eustatius en Saba,

      2°. het gedeelte van het premie-inkomen, waarop ingevolge een internationale regeling inzake sociale zekerheid
      die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere mogendheid van
      toepassing is,

      3°. het gedeelte van het premie-inkomen, dat, bij gebreke van een internationale regeling, is onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere
      mogendheid;

      c. ten aanzien van degene die niet is uitgezonderd van de verplichte verzekering voor
      de volksverzekeringen op grond van de [artikelen 13, eerste lid, onderdeel a][ref1],
      [13, tweede lid, onderdeel c][ref2], [13, derde lid, onderdeel a][ref3], [13, vierde lid, onderdeel c][ref4],
      [14, eerste lid, onderdeel a][ref5], [15, eerste lid, onderdelen a, b of c, subonderdeel 1°][ref6], of
      __REF006___________________________________________________________________________________________________________
      ____ in verband met het verrichten van de in die artikelen bedoelde andere werkzaamheden: het belastbare loon
      uit de dienstbetrekking uit hoofde waarvan hij zou zijn uitgezonderd van de verplichte verzekering voor de
      volksverzekeringen indien hij die andere werkzaamheden niet zou hebben verricht.


