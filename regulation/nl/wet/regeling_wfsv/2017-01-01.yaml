  - number: 3.24a
    text: |-
      De werkgever kan de premiekorting, bedoeld in de [artikelen 47, eerste of tweede lid][ref1], en
      [49, eerste of tweede lid, van de Wfsv][ref2] uitsluitend verrekenen met het totaal van de verschuldigde premies,
      bedoeld in artikel 47, eerste lid, onderscheidenlijk 49, eerste lid, van de Wfsv in het kalenderjaar waarin recht
      bestaat op de premiekorting.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.24a
