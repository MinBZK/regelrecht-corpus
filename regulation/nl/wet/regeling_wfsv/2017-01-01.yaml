        artikel: '49'
  - number: '3.25'
    text: |-
      1 In geval van overgang van een onderneming als bedoeld in
      [Boek 7, Titel 10, Afdeling 8, van het Burgerlijk Wetboek][ref1], waarbij de werkgever die de onderneming
      overdraagt, de premievrijstelling, bedoeld in [artikel 122c van de Wfsv][ref2], toepast, wordt de toepassing van
      [artikel 122c van de Wfsv][ref3] voortgezet door de werkgever die de onderneming overneemt, voor zover de werknemer
      voor wie [artikel 122c van de Wfsv][ref4] werd toegepast de werkzaamheden uitoefent in de onderneming, die wordt
      overgenomen.

      2 De toepassing van de premievrijstelling op grond van [artikel 122c van de Wfsv][ref5] eindigt met ingang van de
      eerste dag van het loontijdvak, waarin de werknemer 62 jaar wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
