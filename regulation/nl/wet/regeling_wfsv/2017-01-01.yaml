      sectorpremiepercentage ter dekking van de werkloosheidslasten en het op grond van artikel 2.2, tweede lid, van het
      Besluit Wfsv vastgestelde opslagpercentage voor de dekking van de daar bedoelde overige ziekengeld- en WGA-lasten
      en WGA-staartlasten voor de sector grafische industrie, worden vastgesteld voor de sectoronderdelen, genoemd in
      [artikel 3.10][ref2], op basis van de lasten en loonsommen van de sector.

      2 Het deel van het sectorpremiepercentage ter dekking van de werkloosheidslasten wordt per sectoronderdeel berekend
      aan de hand van het gemiddelde risico van de sector.

      3 Het opslagpercentage ter dekking van overige ziekengeld- en WGA-lasten en WGA-staartlasten wordt per
      sectoronderdeel berekend aan de hand van het gemiddelde risico van de sector.


