  - number: '3.26'
    text: |-
      Voor de toepassing van [artikel 48a van de Wfsv][ref1] wordt een dienstbetrekking die is aangevangen vóór 1 januari
      2014 en wordt beëindigd vóór, op of na die datum maar binnen drie maanden wordt opgevolgd door een dienstbetrekking
      bij dezelfde werkgever geacht niet te zijn onderbroken.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48a
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 48a
  - number: '3.27'
    text: |-
      1 Indien een werkgever niet gedurende een periode van in totaal twee jaar premiekorting als bedoeld in
      [artikel 48a, tweede lid, van de Wfsv][ref1] heeft toegepast:

      a. worden dienstbetrekkingen bij dezelfde werkgever die elkaar met tussenpozen van minder dan drie
      maanden opvolgen, geacht niet te zijn onderbroken en worden de perioden waarin de premiekorting kan
      worden toegepast opgeteld totdat in totaal twee jaar premiekorting is toegepast, met inachtneming van
      [artikel 48a, tweede lid, onderdeel c, van de Wfsv][ref2];

      b. kan indien dienstbetrekkingen bij dezelfde werkgever elkaar met tussenpozen van drie maanden of meer doch ten
      hoogste zes maanden opvolgen, de premiekorting niet opnieuw worden toegepast en beslaat de premiekortingsperiode
      de periode vanaf het moment dat de eerdere premiekortingsperiode een aanvang nam totdat twee jaar zijn
      verstreken, zonder dat over de tussenliggende periode premiekorting is toegepast, met inachtneming van
      [artikel 48a, tweede lid, onderdeel c, van de Wfsv][ref3].

      2 Het eerste lid is van overeenkomstige toepassing indien de dienstbetrekking in de periode, bedoeld in de
      onderdelen a of b, van dat lid, niet is onderbroken maar in de genoemde periode geen premiekorting kon worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48a
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel48a
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel48a
