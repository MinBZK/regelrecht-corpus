  - number: '5.18'
    text: |-
      1 Over de dagelijkse credit-saldi van elk van de rekeningen-courant wordt door de Minister van Financiën een rente
      vergoed die gelijk is aan het 12-maands Euribor van de desbetreffende dag.

      2 Over de dagelijkse debet-saldi van elk van de rekeningen-courant wordt door de rekening-couranthouders een rente
      betaald die gelijk is aan het 1-maands Euribor.

      3 In afwijking van het eerste lid wordt door de Minister van Financiën aan het UWV over het gedurende het
      gehele jaar aanwezige minimale creditsaldo van de rekening-courant ten behoeve van de financiële middelen van de
      gezamenlijke sectorfondsen een rente vergoed die gelijk is aan het effectief rendement op staatsobligaties met
      een resterende looptijd van 5 tot 6 jaar verhoogd met 10 basispunten. Voor de dagsaldi die boven dit minimale
      creditsaldo uitkomen, wordt over die meerdere saldi een aanvullende rente berekend. Daarvoor is het eerste lid
      van toepassing.

      4 De Minister van Financiën deelt de geldende rentepercentages schriftelijk aan de rekening-couranthouders mee.

      5 De rente wordt jaarlijks achteraf, met valutadatum 31 december van het jaar waarop de renteberekening betrekking
      heeft, ten gunste respectievelijk ten laste van de rekeningen-courant geboekt. Daartoe stelt de Minister van
      Financiën een rentenota op.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.18
  - number: '5.19'
    text: De rekening-couranthouder is bevoegd een bedrag van ten hoogste € 2,5 miljoen buiten de rekening-courant te houden.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 De totale opbrengsten van de gecombineerde heffing van de loonbelasting en de premies voor de sociale
      verzekeringen alsmede op looninkomsten betrekking hebbende naheffingsaanslagen, heffings- en invorderingsrente
      en boeteontvangsten worden uitgesplitst in een voor de afdracht vastgesteld verdeelpercentage per belasting/
      premiejaar.

      2 Het verdeelpercentage wordt maandelijks per belasting/premiejaar door de Minister van Financiën vastgesteld op
      basis van de in het belasting/premiejaar ontvangen loonaangiften en opgelegde naheffingen.

      3 Alle ontvangen gelden over het belasting/premiejaar worden verdeeld op basis van het verdeelpercentage, bedoeld
      in het eerste lid. De mutatie ten opzichte van de vorige periode vormt het af te dragen bedrag.

      4 Een jaar na afloop van het belasting/premiejaar wordt het verdeelpercentage voor het betreffende belasting/
      premiejaar definitief vastgesteld. Dit percentage wordt gehanteerd voor de definitieve verdeling van de ontvangen
      gelden over het betreffende belasting/premiejaar. De mutatie ten opzichte van de reeds betaalde bedragen, vormt het
      af te dragen bedrag. Dit verdeelpercentage wordt tevens gehanteerd voor alle betalingen die daarna worden geïnd.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.20
  - number: '5.21'
    text: |-
      1 De opbrengsten van de gecombineerde heffing van de loonbelasting, inkomstenbelasting en de premie voor de
      volksverzekeringen worden uitgesplitst volgens een voor de loonheffing en voor de inkomensheffing afzonderlijk
      vastgesteld toedelingspercentage.

      2 Voorafgaand aan het belasting/premiejaar worden in overleg tussen de beheerders van de fondsen voor
      de volksverzekeringen en de Minister van Financiën voorlopige toedelingspercentages vastgesteld. De
      toedelingspercentages worden gebaseerd op de transactieramingen voor het desbetreffende belasting/premiejaar.

      3 In het tweede jaar na afloop van het belasting/premiejaar wordt het toedelingspercentage voor de loonheffing
      definitief vastgesteld. In het vierde kalenderjaar na afloop van het belasting/premiejaar wordt het
      toedelingspercentage voor de inkomensheffing definitief vastgesteld. De definitieve vaststelling vindt plaats
      op basis van de gerealiseerde belastingopbrengsten en leidt tot een correctie van de reeds afgedragen premie-
      opbrengsten aan de fondsen.

      4 De opbrengsten van de loonheffing en de inkomensheffing die door de rijksbelastingdienst worden geïnd nadat
      het toedelingspercentage definitief is vastgesteld, worden uitgesplitst op basis van het definitief vastgestelde
      toedelingspercentage.

      5 De correctie, bedoeld in het derde lid, wordt door de Minister van Financiën met de beheerder van dat fonds
      afgerekend.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.21
  - number: '5.22'
    text: |-
      1 De rijksbelastingdienst rapporteert uiterlijk de tiende werkdag na afloop van de maand over de opbrengsten,
      bedoeld in de [artikelen 5.20][ref1] en [5.21][ref2] aan de Minister van Financiën en de SVB, het UWV en het
      Zorginstituut.

      2 In afwijking van het eerste lid vindt de rapportage over de laatste maand van het kalenderjaar uiterlijk de
      vijftiende werkdag na afloop van het kalenderjaar plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.20
