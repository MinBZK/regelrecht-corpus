      a. de grafische industrie exclusief het fotografisch bedrijf, bedoeld in onderdeel b;

      b. het fotografisch bedrijf, al of niet verbonden met een detailhandel in fotoartikelen, bedoeld in sector 9,
      onderdeel 5, zoals opgenomen in [bijlage 1][ref2] bij deze regeling.


