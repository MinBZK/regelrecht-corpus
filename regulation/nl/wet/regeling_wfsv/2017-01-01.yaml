  - number: 5.29a
    text: |-
      1 Deze paragraaf heeft betrekking op de middelen voor het Toeslagenfonds en het Arbeidsongeschiktheidsfonds
      jonggehandicapten, waarin voorzien wordt door rijksbijdragen.

      2 De middelen voor Arbeidsongeschiktheidsfonds jonggehandicapten dienen ter dekking van lasten die op grond van
      enige wettelijk voorschrift ten laste van het Arbeidsongeschiktheidsfonds jonggehandicapten komen.

      3 De middelen voor het Toeslagenfonds dienen ter dekking van lasten van het UWV voor:

      a. toeslagen op grond van de [TW][ref1];

      b. uitkeringen op grond van de [Tijdelijke wet BIA][ref2];

      c. tegemoetkomingen op grond van de [artikelen 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref3],
      zoals dat luidde op 31 december 2013, [63a van de Wet werk en inkomen naar arbeidsvermogen][ref4],
      [65l van de Wet op de arbeidsongeschiktheidsverzekering][ref5],
      [67i van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6] en
      [3:75 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref7];

      d. uitkeringen op grond van de [IOW][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0004043
