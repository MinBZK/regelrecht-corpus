  - number: '4.2'
    text: |-
      1 Het verzoek geschiedt door indiening bij de SVB van een door de verzoeker ondertekende verklaring, waarvan het
      model door de SVB wordt vastgesteld.

      2 Deze verklaring houdt tenminste in, dat degene, die de verklaring indient, overwegende gemoedsbezwaren heeft
      tegen elke vorm van verzekering, dat hij mitsdien noch zichzelf, noch iemand anders, noch zijn eigendommen heeft
      verzekerd.

      3 Voorzover de volksverzekeringen in het geding zijn, blijkt uit de verklaring tevens, of degene, die haar indient,
      de in deze wetten geregelde voorzieningen al dan niet als verzekeringen beschouwt.

      4 Uit een door een werkgever bij de SVB ingediende verklaring blijkt of deze ook gemoedsbezwaren heeft tegen de
      nakoming van de hem als werkgever opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Wanneer het verzoek een rechtspersoon betreft, wordt de verklaring ingediend bij de SVB door het op grond van een
      wettelijk voorschrift of statuten van die rechtspersoon daartoe bevoegde orgaan.

      2 Onverminderd [artikel 4.2][ref1] houdt de verklaring, bedoeld in het eerste lid, tevens in, dat de natuurlijke
      personen, die behoren tot het orgaan, dat op grond van een wettelijk voorschrift of de statuten bevoegd is te
      besluiten de ontheffing aan te vragen, in meerderheid overwegende gemoedsbezwaren hebben.

      3 Bij het verzoek, bedoeld in het eerste lid, worden gevoegd:

      a. een afschrift van de aan elk van de tot de in het tweede lid bedoelde meerderheid behorende natuurlijke personen
      verleende ontheffing, bedoeld in [artikel 4.1][ref2];

      b. een gewaarmerkt afschrift van de statuten van de rechtspersoon, en

      c. een gewaarmerkt afschrift van de notulen van de vergadering, waarin het besluit tot het aanvragen van de
      ontheffing is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel4.1
