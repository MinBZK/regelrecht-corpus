  - number: '5.12'
    text: |-
      In [artikel 5.14][ref1] wordt verstaan onder:

      a. *de verzekerde loonsom:* het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref2], waarover het
      UWV in een kalenderjaar de premies ten gunste van een sectorfonds ontvangt, met uitzondering van het loon, waarop
      [artikel 28, tweede lid, van de Wfsv][ref3] van toepassing is;

      b. *werkloosheidslasten:* hetgeen op grond van [artikel 104, eerste lid, van de Wfsv][ref4] ten laste van
      een sectorfonds komt en hetgeen op grond van artikel 104, vierde lid, van de Wfsv ten laste van het Algemeen
      Werkloosheidsfonds komt;

      c. *de drempelwaarde:* 0,4 procentpunt.

      d. *het lastenpercentage:* het percentage van de verzekerde loonsom in een kalenderjaar waarin de
      werkloosheidslasten van dat kalenderjaar tot uitdrukking komen;

      e. *de wijziging van het lastenpercentage in een kalenderjaar:* het verschil tussen het lastenpercentage in een
      kalenderjaar en het lastenpercentage in het daaraan voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.14
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel104
