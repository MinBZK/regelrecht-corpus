  - number: '5.23'
    text: |-
      In deze afdeling wordt verstaan onder:

      a. Algemeen Kinderbijslagfonds: het Algemeen Kinderbijslagfonds, genoemd in [artikel 29a van de AKW][ref1];

      b. lasten met betrekking tot het Algemeen Kinderbijslagfonds: de op grond van de [AKW][ref2] uit te keren
      kinderbijslagen, alsmede de aan de uitvoering van de [AKW][ref3] verbonden kosten;

      c. overige baten en lasten met betrekking tot het Algemeen Kinderbijslagfonds: de baten verkregen met toepassing
      van [artikel 17a van de AKW][ref4], de baten verkregen met toepassing van [artikel 17 van de AKW][ref5] en de baten
      en lasten verkregen door interesten en diversen;

      d. Wajong-fonds: het Arbeidsongeschiktheidsfonds jonggehandicapten, genoemd in [artikel 5:1 van de Wajong][ref6];

      e. Toeslagenfonds: het Toeslagenfonds, genoemd in [artikel 31 van de Toeslagenwet][ref7];

      f. overige baten en lasten met betrekking tot het Wajong-fonds: wettelijke rente, proceskosten, rentelasten, baten
      op grond van [artikel 4:2 van de Wajong][ref8], en de vereveningsbijdrage, bedoeld in [artikel 2:54][ref9] of
      [3:46 van de Wajong][ref10];

      g. valutadag: de op de rekening-courantafschriften aangegeven dag van betaling;

      h. overige baten en lasten met betrekking tot het Toeslagenfonds: wettelijke rente, proceskosten, rentelasten en de
      baten verkregen met toepassing van [artikel 14a van de TW][ref11].


