  - number: '4.1'
    text: |-
      1 De persoon, die gemoedsbezwaren heeft tegen één van de volksverzekeringen, bedoeld in
      [artikel 2 van de Wfsv][ref1], of alle werknemersverzekeringen als bedoeld in artikel 2 van de Wfsv, alsmede
      de rechtspersoon, waarbij natuurlijke personen betrokken zijn, die zodanige gemoedsbezwaren hebben, kan op
      zijn verzoek door de SVB worden ontheven van verplichtingen hem bij de [Wfsv][ref2], of bij één van deze
      volksverzekeringen of werknemersverzekeringen opgelegd.

      2 In afwijking van het eerste lid kan geen ontheffing worden verleend van de verplichtingen, bedoeld in
      [artikel 54 van de AWBZ][ref3], de [artikelen 13][ref4] en [49 van de ZW][ref5], de [artikelen 12][ref6] en
      [80 van de WAO][ref7], de [artikelen 27][ref8] en [33 van de Wet WIA][ref9] en de [artikelen 13][ref10] en
      [25 van de WW][ref11].


