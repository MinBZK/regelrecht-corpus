  - number: '3.19'
    text: |-
      In deze afdeling wordt onder aangiftetijdvak verstaan: het tijdvak, waarover premies werknemersverzekeringen
      worden betaald. De premiekorting, bedoeld in [artikel 47, eerste of tweede lid][ref1], en
      [49, eerste lid, van de Wfsv][ref2], wordt berekend en toegepast per aangiftetijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '49'
  - number: 3.19a
    text: |-
      Onder aanvang van dienstbetrekking als bedoeld in de [artikelen 47][ref1] en [49, eerste lid, van de Wfsv][ref2]
      wordt niet verstaan de aanvang van een diensbetrekking binnen zes maanden na het eindigen van een dienstbetrekking
      tussen dezelfde werknemer en werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.19a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '49'
  - number: '3.20'
    text: |-
      1 De werkgever kan de premiekorting, bedoeld in de [artikel 47, eerste of tweede lid][ref1], en
      [49, eerste lid, van de Wfsv][ref2] niet toepassen, indien de werknemer binnen drie jaar na ommekomst van de in die
      artikelleden bedoelde periode van drie jaar, na beëindiging van de dienstbetrekking, wederom bij die werkgever in
      dienst treedt.

      2 De werkgever kan de premiekorting, bedoeld in [artikel 49, eerste lid, van de Wfsv][ref3] niet toepassen, indien
      de werknemer binnen één jaar na ommekomst van de in [artikel 49, tweede lid][ref4] bedoelde periode van één jaar,
      na beëindiging van de dienstbetrekking, wederom bij die werkgever in dienst treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '47'
      - id: ref2
