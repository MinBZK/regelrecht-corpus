        artikel: 38g
  - number: '3.33'
    text: |-
      1 Het aantal banen in 2013 vervuld door arbeidsbeperkten als bedoeld in de
      [artikelen 38b, eerste lid, van de Wfsv][ref1] en [artikel 3.30][ref2], uitgedrukt in verloonde uren in de maand
      december 2012, bedraagt voor:

      a. de overheidssector: 1.176.671 uren;

      b. de niet-overheidssector: 7.162.200 uren.

      2 Het cumulatief aantal extra te realiseren banen voor arbeidsbeperkten, bedoeld in het eerste lid, uitgedrukt in
      verloonde uren in de maand december in het desbetreffende kalenderjaar, bedraagt voor de overheidsector in:

      1°. 2015: 332.760 uren;

      2°. 2016: 720.980 uren;

      3°. 2017: 1.109.200 uren;

      4°. 2018: 1.386.500 uren;

      5°. 2019: 1.663.800 uren;

      6°. 2020: 1.941.100 uren;

      7°. 2021: 2.218.400 uren;

      8°. 2022: 2.495.700 uren;

      9°. 2023 en verder: 2.773.000 uren.

      3 Het cumulatief aantal extra te realiseren banen voor arbeidsbeperkten, bedoeld in het eerste lid, uitgedrukt in
      verloonde uren in de maand december in het desbetreffende kalenderjaar, bedraagt voor de niet-overheidssector in:

      1°. 2015: 665.520 uren;

      2°. 2016: 1.552.880 uren;

      3°. 2017: 2.551.160 uren;

      4°. 2018: 3.438.520 uren;

      5°. 2019: 4.436.800 uren;

      6°. 2020: 5.546.000 uren;

      7°. 2021: 6.655.200 uren;

      8°. 2022: 7.764.400 uren;

      9°. 2023: 8.873.600 uren;

      10°. 2024: 9.982.800 uren.

      11°. 2025 en verder: 11.092.000 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel3.33
