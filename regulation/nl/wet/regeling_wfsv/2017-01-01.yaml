        afdeling: '2'
  - number: '3.6'
    text: |-
      De sector uitzendbedrijven wordt ingedeeld in de volgende sectoronderdelen, bedoeld in
      [artikel 95, eerste lid, van de Wfsv][ref1]:

      a. uitzendbedrijven IA: groepen uitzendkrachten met administratieve of (para)medische functies krachtens
      een uitzendovereenkomst in de zin van [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref2] en op wier
      uitzendovereenkomst een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3]
      van toepassing is, werkzaam bij uitzendbedrijven;

      b. uitzendbedrijven IIA: groepen uitzendkrachten met technische of overige functies krachtens een
      uitzendovereenkomst in de zin van [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref4] en op wier
      uitzendovereenkomst een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref5]
      van toepassing is, werkzaam bij uitzendbedrijven;

      c. intermediaire diensten: intercedenten en consulenten; filiaalhouders en vestigingsmanagers; administratief
      personeel; directie en stafleden; operationele stafmedewerkers; boekhouding en uitzendadministratie; al het
      personeel waarvan de werkzaamheden zijn terug te voeren op het ter beschikking stellen van arbeidskrachten aan
      derden, werkzaam bij uitzendbedrijven;

      d. uitzendbedrijven IB en IIB: groepen uitzendkrachten met administratieve, (para)medische
      functies, technische of overige functies krachtens een uitzendovereenkomst in de zin van
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref6] en op wier uitzendovereenkomst niet een beding als
      bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref7] van toepassing is, werkzaam bij
      uitzendbedrijven;

      e. detachering: overige werknemers die niet vallen onder de uitzendbedrijven, genoemd in de onderdelen a tot en met
      d, werkzaam bij uitzendbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel690
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel691
