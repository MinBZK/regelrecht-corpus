  - number: '3.18'
    text: |-
      De werkgever kan de met betrekking tot een werknemer door hem verschuldigde premie
      Werkhervattingskas die betrekking heeft op de premiecomponent WGA-lasten, bedoeld in
      [artikel 2.5, eerste lid, onderdeel g, van het Besluit Wfsv][ref1], tot ten hoogste de helft verhalen op de
      werknemer.


