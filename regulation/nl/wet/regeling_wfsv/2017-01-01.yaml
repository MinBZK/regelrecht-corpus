      besluit van toepassing is.

      2 Het UWV kan, gehoord de sectorfondsen, bedoeld in [artikel 2.3, eerste lid, van het Besluit Wfsv][ref2], in
      afwijking van het eerste lid, het op grond van [artikel 2.2, eerste lid, van het Besluit Wfsv][ref3] vastgestelde
      deel van het sectorpremiepercentage ter dekking van de werkloosheidslasten voor de werknemer op wie artikel 2.3,
      tweede lid, onderdeel b, van het Besluit Wfsv van toepassing is, ten hoogste vaststellen op 12,5 procent.


