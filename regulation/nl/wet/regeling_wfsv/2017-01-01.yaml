  - number: '3.22'
    text: |-
      1 In geval van overgang van een onderneming als bedoeld in
      [Boek 7, Titel 10, Afdeling 8, van het Burgerlijk Wetboek][ref1], waarbij door de werkgever die de
      onderneming overdraagt een premiekorting als bedoeld in [artikel 47, eerste of tweede lid][ref2], of
      [artikel 49 van de Wfsv][ref3], is toegepast, wordt voor de toepassing van genoemde artikelen de premiekorting
      aangemerkt als een premiekorting toegepast door de werkgever die de onderneming overneemt.

      2 Indien slechts een deel van de onderneming overgaat als bedoeld in het eerste lid, vindt het eerste lid
      uitsluitend toepassing, indien de werknemers voor wie premiekortingen zijn toegepast als bedoeld in het eerste lid,
      hun werkzaamheden uitoefenen bij het deel van de onderneming dat wordt overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel49
