        artikel: 48b
  - number: '3.29'
    text: |-
      Ten aanzien van de toepassing van de [artikelen 48a][ref1] en [48b van de Wfsv][ref2]:

      a. zijn de [artikelen 3.19][ref3], [3.22][ref4] en [3.24, eerste en derde lid][ref5], van overeenkomstige
      toepassing;

      b. is [artikel 3.24a][ref6] van overeenkomstige toepassing met dien verstande dat voor het kalenderjaar 2014 geldt
      dat de premiekorting, bedoeld in [artikel 48a van de Wfsv][ref7], door de werkgever verrekend kan worden in de
      aangiftetijdvakken die betrekking hebben op de periode vanaf 1 juli 2014.


