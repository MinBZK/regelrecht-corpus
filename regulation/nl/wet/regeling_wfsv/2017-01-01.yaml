  - number: '3.24'
    text: |-
      1 Indien de dienstbetrekking met de werknemer niet aanvangt respectievelijk eindigt op de eerste dag
      respectievelijk laatste dag van het aangiftetijdvak, wordt het bedrag van de premiekorting, bedoeld in
      [artikel 48][ref1] en [50 van de Wfsv][ref2], over dat aangiftetijdvak vermenigvuldigd met de factor A/B

      waarbij

      A staat voor: het aantal kalenderdagen in dat aangiftetijdvak dat de werknemer in dienstbetrekking heeft gestaan
      tot de werkgever;

      B staat voor: het totale aantal kalenderdagen in dat aangiftetijdvak.

      2 Indien een werknemer in het aangiftetijdvak werkzaam is in een dienstbetrekking waarin de beloning voor de
      arbeid niet is gebaseerd op overeengekomen arbeidsduur, wordt voor de toepassing van [artikel 48][ref3] en
      [50 van de Wfsv][ref4] bij een loon van ten minste het voor hem geldende wettelijk minimumloon per 1 januari van
      het kalenderjaar waarvoor de premie wordt vastgesteld, de werknemer geacht ten minste 36 uur per week te hebben
      gewerkt. Indien het loon in dat aangiftetijdvak minder is dan het voor hem geldende wettelijk minimumloon per
      1 januari van het kalenderjaar waarvoor de premie wordt vastgesteld, dan wordt het in de eerste zin bedoelde aantal
      uren per week naar evenredigheid verminderd met een factor C/D

      waarbij

      C staat voor: het loon dat uit de dienstbetrekking wordt genoten in het aangiftetijdvak;

      D staat voor: het voor de werknemer geldende wettelijke minimumloon per 1 januari van het kalenderjaar waarvoor de
      premie wordt vastgesteld.

      3 Het eerste lid is van overeenkomstige toepassing in het aangiftetijdvak waarin de maximale duur voor de
      toepassing van de premiekorting is bereikt, dan wel indien de betrokkene niet langer werknemer is als bedoeld in
      [artikel 1 van de Wfsv][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel1
