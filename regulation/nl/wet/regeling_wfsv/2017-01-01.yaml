    text: |-
      1 Een werkgever, aangesloten bij sector 17, Detailhandel en ambachten is aangesloten bij sector 19,
      Grootwinkelbedrijf, indien het loon dat hij betaalt gedurende drie jaren tenminste het bedrag is, dat genoemd wordt
      in de bijlage bij deze regeling bij de sector Grootwinkelbedrijf.

      2 Een werkgever, aangesloten bij sector 19, Grootwinkelbedrijf, is aangesloten bij sector 17, Detailhandel en
      ambachten, indien het loon dat hij betaalt gedurende drie jaren lager is dan het bedrag, dat genoemd wordt in de
      bijlage bij deze regeling bij de sector Grootwinkelbedrijf.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel5.8a
  - number: '5.9'
    text: |-
      1 Het UWV vergoedt met inachtneming van de [artikelen 102, eerste en tweede lid][ref1], en
      [110, eerste en tweede lid, van de Wfsv][ref2], per kalenderjaar aan de Minister van Sociale Zaken
      en Werkgelegenheid de door de SVB in dat jaar aan werknemers toegekende remigratiebijdragen, doch
      ten hoogste tot een bedrag gelijk aan het totaal van de uitkeringen die op grond van de [WW][ref3]
      in dat kalenderjaar waarin remigratiebijdragen zijn verstrekt, aan deze werknemers hadden moeten
      worden betaald, indien zij werkloos waren gebleven en niet naar een bestemmingsland als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Remigratiewet][ref4] waren vertrokken.

      2 Onder remigratiebijdrage als bedoeld in het eerste lid wordt verstaan: een periodieke uitkering als
      bedoeld in [artikel 4, eerste lid, van de Remigratiewet][ref5] of een tegemoetkoming als bedoeld in
      [artikel 4, derde lid, van de Remigratiewet][ref6].


