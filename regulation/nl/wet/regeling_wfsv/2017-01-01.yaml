  - number: '2.1'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de landen van het Koninkrijk der Nederlanden aangemerkt als
      afzonderlijke mogendheden.
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      Voor de toepassing van [artikel 8, eerste lid, van de Wfsv][ref1] wordt verstaan onder partner:
      degene, die partner is in de zin van [artikel 5a van de Algemene wet inzake rijksbelastingen][ref2] en
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref3], waarbij het vierde lid, onderdeel b, van het laatstgenoemde
      artikel buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0019150/2017-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
