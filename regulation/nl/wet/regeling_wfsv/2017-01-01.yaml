  - number: '3.34'
    text: |-
      1 Voor de toepassing van [artikel 122n, tweede lid, van de Wfsv][ref1] wordt als arbeidsbeperkte beschouwd de
      arbeidsbeperkte werknemer die aan de werkgever in de sector overheid onderscheidenlijk de sector niet-overheid ter
      beschikking is gesteld om voor hem onder zijn toezicht en leiding arbeid te verrichten.

      2 Het aantal banen, uitgedrukt in verloonde uren, bedoeld in [artikel 3.33, eerste lid][ref2], wordt voor 2013
      verminderd met het aantal banen, uitgedrukt in verloonde uren, van de ter beschikking gestelde arbeidsbeperkten,
      bedoeld in het eerste lid, door werkgevers in de overheidssector aan werkgevers in de niet-overheidssector
      onderscheidenlijk door werkgevers in de niet-overheidssector aan werkgevers in de overheidssector. De banen,
      uitgedrukt in verloonde uren, die in mindering zijn gebracht worden gerekend tot de niet-overheidssector
      onderscheidenlijk de overheidssector waartoe de werkgever behoort waaraan de arbeidsbeperkte ter beschikking is
      gesteld.

      3 Het aantal banen, uitgedrukt in verloonde uren, bedoeld in [artikel 3.33, tweede en derde lid][ref3], wordt
      voor 2015 en voor de jaren daarna, bedoeld in deze leden, verminderd met het aantal banen, uitgedrukt in verloonde
      uren in de maand december in het desbetreffende kalenderjaar, van de ter beschikking gestelde arbeidsbeperkten,
      bedoeld in het eerste lid, door werkgevers in de overheidssector aan werkgevers in de niet-overheidssector
      onderscheidenlijk door werkgevers in de niet-overheidssector aan werkgevers in de overheidssector. Het tweede lid,
      tweede zin, is van overeenkomstige toepassing met dien verstande dat hierbij de personen die arbeid verrichten in
      een dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref4] niet in aanmerking worden
      genomen. De toepassing van het tweede lid, tweede zin, vindt plaats op grond van een verdeelsleutel die bij de
      jaarlijkse meting van het aantal banen, bedoeld in artikel 3.33, tweede en derde lid, wordt geactualiseerd.

      4 Per 1 januari 2015 bedraagt het totaal aantal ter beschikking gestelde arbeidsbeperkten die arbeid verrichten
      in een dienstbetrekking in de zin van [artikel 2 van de Wet sociale werkvoorziening][ref5] of die nog een
      geldende indicatiebeschikking hadden op grond van [artikel 11 van de Wet sociale werkvoorziening][ref6], zoals
      dat artikel luidde voor de datum van inwerkingtreding van [artikel II van de Invoeringswet Participatiewet][ref7],
      en vervolgens arbeid zijn gaan verrichten in een dienstbetrekking in de zin artikel 2 van de Wet sociale
      werkvoorziening en de ter beschikkingstelling van de laatstbedoelde arbeidsbeperkten is aangevangen in 2013 of
      2014, 29501 personen.

      5 Over de maand december van het desbetreffende kalenderjaar, bedoeld in [artikel 3.33, tweede en derde lid][ref8],
      wordt het aantal ter beschikking gestelde arbeidsbeperkten die arbeid verrichten in een dienstbetrekking in de zin
      van [artikel 2 van de Wet sociale werkvoorziening][ref9] vastgesteld en wordt ten aanzien van deze arbeidsbeperkten
      het gemiddeld aantal verloonde uren in die maand per persoon vastgesteld.

      6 Indien voor het desbetreffende kalenderjaar, bedoeld in [artikel 3.33, tweede en derde lid][ref10], in de maand
      december sprake is van een toename van het aantal ter beschikking gestelde arbeidsbeperkten, bedoeld in het vijfde
      lid, ten opzichte van het aantal ter beschikking gestelde arbeidsbeperkten, bedoeld in het vierde lid, wordt deze
      toename in het desbetreffende kalenderjaar in aanmerking genomen tot ten hoogste het aantal personen dat werkzaam
      is in een beschutte werkomgeving als bedoeld in [artikel 10b van de Participatiewet][ref11] in de maand december
      van het desbetreffende kalenderjaar bedoeld in artikel 3.33, tweede en derde lid.

      7 Het aantal ter beschikking gestelde arbeidsperkten in enig kalenderjaar, bedoeld in het vijfde lid, met
      inachtneming van het zesde lid, wordt vermenigvuldigd met het gemiddeld aantal verloonde uren per persoon, bedoeld
      in het vijfde lid.

      8 Het tweede lid, tweede zin, is van overeenkomstige toepassing ten aanzien van de banen van ter beschikking
      gestelde arbeidsbeperkten, uitgedrukt in verloonde uren, bedoeld in het zevende lid, voor 2015 en voor de jaren
      daarna, bedoeld [artikel 3.33, tweede en derde lid][ref12], op grond van een verdeelsleutel die bij de jaarlijkse
      meting van het aantal banen, bedoeld in artikel 3.33, tweede en derde lid, wordt geactualiseerd.

      9 Ten aanzien van het jaarlijks cumulatief aantal extra te realiseren banen, bedoeld in
      [artikel 3.33, tweede en derde lid][ref13], zijn voor het kalenderjaar 2015 het derde lid, tweede zin, en het zesde
      lid niet van toepassing.


