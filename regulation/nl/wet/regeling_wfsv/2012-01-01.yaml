  - number: '3.7'
    text: |-
      1 De inspecteur stelt jaarlijks bij voor bezwaar vatbare beschikking het individuele ziekteverzuimcijfer vast van
      een werkgever die is ingedeeld in de sectoronderdelen uitzendbedrijven IA of IIA.

      2 Het UWV stelt jaarlijks het gemiddelde ziekteverzuimcijfer vast van de sectoronderdelen uitzendbedrijven IA en
      IIA.

      3 Een werkgever die is ingedeeld in het sectoronderdeel uitzendbedrijven IA wordt nader ingedeeld in:

      a. de opslagklasse als het individuele ziekteverzuimcijfer ten minste 10% hoger is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel;

      b. de middenklasse als het individuele ziekteverzuimcijfer minder dan 10% hoger of lager is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel of als geen individueel ziekteverzuimcijfer is gerealiseerd;

      c. de kortingsklasse als het individuele ziekteverzuimcijfer ten minste 10% lager is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel.

      4 Een werkgever die is ingedeeld in het sectoronderdeel uitzendbedrijven IIA wordt nader ingedeeld in:

      a. de opslagklasse als het individuele ziekteverzuimcijfer ten minste 20% hoger is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel;

      b. de middenklasse als het individuele ziekteverzuimcijfer minder dan 20% hoger of lager is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel of als geen individueel ziekteverzuimcijfer is gerealiseerd;

      c. de kortingsklasse als het individuele ziekteverzuimcijfer ten minste 20% lager is dan het gemiddelde
      ziekteverzuimcijfer van dat sectoronderdeel.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.7
