  - number: '3.23'
    text: |-
      Indien voor een werknemer, die de leeftijd van 62 jaar heeft bereikt, premiekorting wordt toegepast
      op grond van [artikel 47, eerste lid, van de Wfsv][ref1], wordt de premiekorting op grond van
      [artikel 47, derde lid, van de Wfsv][ref2] toegepast met ingang van de eerste dag van het aangiftetijdvak, waarin
      de termijn van drie jaar, bedoeld in [artikel 47, eerste lid, van de Wfsv][ref3], verstrijkt. De toepassing van de
      premiekorting, bedoeld in [artikel 47, eerste lid, van de Wfsv][ref4], eindigt met ingang van die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel47
