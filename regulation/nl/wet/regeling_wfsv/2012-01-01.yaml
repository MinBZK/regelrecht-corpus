        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '3.5'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. uitzendbedrijven IA: groepen uitzendkrachten met administratieve of (para)medische functies krachtens
      een uitzendovereenkomst in de zin van [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref1] en op wier
      uitzendovereenkomst een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref2]
      van toepassing is, werkzaam bij uitzendbedrijven;

      b. uitzendbedrijven IIA: groepen uitzendkrachten met technische of overige functies krachtens een
      uitzendovereenkomst in de zin van [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref3] en op wier
      uitzendovereenkomst een beding als bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref4]
      van toepassing is, werkzaam bij uitzendbedrijven;

      c. intermediaire diensten: intercedenten en consulenten; filiaalhouders en vestigingsmanagers; administratief
      personeel; directie en stafleden; operationele stafmedewerkers; boekhouding en uitzendadministratie; al het
      personeel waarvan de werkzaamheden zijn terug te voeren op het ter beschikking stellen van arbeidskrachten aan
      derden, werkzaam bij uitzendbedrijven;

      d. uitzendbedrijven IB en IIB: groepen uitzendkrachten met administratieve, (para)medische
      functies, technische of overige functies krachtens een uitzendovereenkomst in de zin van
      [artikel 690 van Boek 7 van het Burgerlijk Wetboek][ref5] en op wier uitzendovereenkomst niet een beding als
      bedoeld in [artikel 691, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref6] van toepassing is, werkzaam bij
      uitzendbedrijven;

      e. detachering: groepen uitzendkrachten die niet vallen onder de hierboven genoemde uitzendbedrijven, werkzaam
      bij uitzendbedrijven;

      f. loonsom: het premieloon vermeerderd met de direct verstrekte uitkeringen op grond van de [Ziektewet][ref7] in
      het tweede kalenderjaar voorafgaand aan het kalenderjaar waarvoor de premie wordt vastgesteld;

      g. ziekengeldlasten: de uitkeringen in het tweede kalenderjaar voorafgaand aan het kalenderjaar waarvoor de premie
      wordt vastgesteld, die op grond van [artikel 104, eerste lid, onderdeel c, van de Wfsv][ref8] ten laste van een
      sectorfonds komen;

      h. individuele ziekteverzuimcijfer: het quotiënt van de aan een werkgever toe te rekenen ziekengeldlasten en de
      loonsom;

      i. gemiddelde ziekteverzuimcijfer: het quotiënt van de aan een sectoronderdeel toe te rekenen ziekengeldlasten en
      de loonsom.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel690
