      1 Het sectorpremiepercentage voor de werknemer op wie
      [artikel 2.3, tweede lid, onderdeel a, van het Besluit Wfsv][ref1] van toepassing is, verhoudt zich:

      a. voor de sectoren, bedoeld in [artikel 2.3, eerste lid, onderdelen b tot en met e, van het Besluit Wfsv][ref2]
      als ten minste 1 staat tot 5 tot het sectorpremiepercentage voor de werknemer op wie
      [artikel 2.3, tweede lid, onderdeel b, van dat besluit][ref3] van toepassing is;

      b. voor de sector, bedoeld in [artikel 2.3, eerste lid, onderdeel a, van het Besluit Wfsv][ref4]
      als ten minste 1 staat tot 7 tot het sectorpremiepercentage voor de werknemer op wie
      [artikel 2.3, tweede lid, onderdeel b, van dat besluit][ref5] van toepassing is.

      2 Het sectorpremiepercentage, bedoeld in het eerste lid, onderdelen a en b, kan ten hoogste 12,5 procent bedragen.

      3 In afwijking van het eerste en tweede lid, blijft het maximum sectorpremiepercentage, bedoeld in het tweede lid,
      buiten toepassing indien dit er toe zou leiden dat de verhouding, bedoeld in het eerste lid, kleiner is dan 1 staat
      tot 5.


