  - number: '5.34'
    text: |-
      1 In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de
      ontvangen voorschotten, bedoeld in [artikel 5.31, eerste lid][ref2], met betrekking tot hetToeslagenfonds en het
      Wajong-fonds opgenomen, waarbij de gegevens met betrekking tot het Toeslagenfonds tevens worden gespecificeerd naar
      de in [artikel 5.29a, derde lid][ref3], genoemde wetten, met uitzondering van onderdeel b.

      2 De overige baten en lasten met betrekking tot het Toeslagenfonds en het Wajong-fonds kunnen in de jaarrekening,
      bedoeld in het eerste lid, worden toegerekend aan respectievelijk de [Toeslagenwet][ref4] en de [Wet Wajong][ref5].

      3 Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref6], rekent de Minister van Sociale Zaken
      en Werkgelegenheid de baten en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.

      4 Voor de afrekening van de toeslagen, de uitkeringen, de tegemoetkomingen, de overige posten en de
      uitvoeringskosten en de vaststelling en afrekening van de rijksbijdrage ten gunste of ten laste van het
      Toeslagenfonds en Wajong-fonds voor het jaar 2011, zijn de [artikelen 5.34][ref7], respectievelijk [5.35][ref8],
      zoals die luidden op 31 december 2011, van toepassing.


