      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '17'
  - number: 3.4a
    text: |-
      1 De premies die op grond van [hoofdstuk 3 van de Wfsv][ref1] zijn verschuldigd, worden per loontijdvak met
      inachtneming van [artikel 17, eerste en tweede lid, van die wet][ref2], berekend over het verschil tussen het loon
      dat de werknemer in het kalenderjaar waarvoor de premie wordt vastgesteld heeft genoten tot en met dat loontijdvak
      en het loon dat de werknemer in dat kalenderjaar heeft genoten tot en met het aan dat loontijdvak voorafgaande
      loontijdvak.

      2 Indien voor de werknemer gedurende een loontijdvak verschillende premiepercentages gelden, wordt het op grond
      van het eerste lid berekende verschil naar evenredigheid van de lonen waarvoor die verschillende premiepercentages
      gelden, aan die lonen toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.4a
    references:
