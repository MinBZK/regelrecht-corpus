  - number: '3.26'
    text: |-
      De werkgever kan de premiekorting, bedoeld in [artikel 47, eerste lid, van de Wfsv][ref1] niet toepassen bij een
      dienstbetrekking met een werknemer, die aanvangt binnen zes maanden na het eindigen van de dienstbetrekking met
      diezelfde werknemer, waarbij de werkgever voor het in dienst nemen van die werknemer recht op premievrijstelling
      had op grond van [artikel 47, eerste lid, aanhef en onderdeel a, van de Wfsv][ref2], zoals dat artikel luidde op
      31 december 2008.


