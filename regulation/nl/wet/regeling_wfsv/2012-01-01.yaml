        artikel: '40'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: '3.17'
    text: |-
      1 Voor de eigenrisicodrager die ter dekking van het risico, bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref1], een verzekering heeft gesloten, bedragen de kosten, die
      op grond van [artikel 41, eerste lid, van de Wfsv][ref2] voor verhaal op de werknemer in aanmerking komen de door
      hem verschuldigde premie, voor zover die premie betrekking heeft op verzekering van dat risico.

      2 Voor de werkgever die ter dekking van het risico, bedoeld in
      [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref3], geen verzekering heeft gesloten worden de kosten,
      die op grond van [artikel 41, eerste lid, van de Wfsv][ref4] voor verhaal op een werknemer in aanmerking komen,
      vastgesteld op een percentage van het loon van de werknemer.

      3 Het percentage, bedoeld in het tweede lid, wordt bepaald door het totaal van de in het kalenderjaar waarvoor de
      premie wordt vastgesteld te verwachten betalingen van WGA-uitkeringen of in het voorgaande kalenderjaar betaalde
      WGA-uitkeringen overeenkomstig [artikel 82 van de Wet WIA][ref5] te delen door het totaal van het premieplichtig
      loon dat in dat kalenderjaar ten laste komt of is gekomen van de eigenrisicodrager. Dit percentage bedraagt ten
      hoogste 1,5 maal de gedifferentieerde premie, bedoeld in [2.14, eerste lid, van het Besluit Wfsv][ref6], die ten
      hoogste op de werkgever van toepassing zou zijn indien hij geen eigenrisicodrager zou zijn.

      4 Indien na afloop van het kalenderjaar blijkt, dat de te verwachten bedragen in een kalenderjaar afwijken van de
      gerealiseerde bedragen, kan indien dit zou leiden tot een ander bedrag van de kosten voor het verhaal, het bedrag
      van het verhaal in het kalenderjaar volgend op dat kalenderjaar worden herzien tot ten hoogste het bedrag, bedoeld
      in [artikel 41, eerste lid][ref7].


