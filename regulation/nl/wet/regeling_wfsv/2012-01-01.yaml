  - number: '2.4'
    text: |-
      1 Ten aanzien van degene die gedurende een gedeelte van het kalenderjaar niet premieplichtig is doch gedurende
      die periode wel belastingplichtig is, wordt voor de premieheffing bij wege van aanslag het premie-inkomen naar
      tijdsevenredigheid afgeleid van het premie-inkomen dat in aanmerking zou zijn genomen als de premieplicht volledig
      zou zijn samengevallen met de belastingplicht.

      2 In afwijking van het eerste lid wordt als premie-inkomen geen hoger bedrag in aanmerking genomen dan het premie-
      inkomen verminderd met het gedeelte daarvan, waarop, op grond van een internationale regeling inzake sociale
      zekerheid die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere
      mogendheid van toepassing is, of dat, bij gebreke van een internationale regeling, is onderworpen aan premieheffing
      krachtens een wettelijke regeling inzake uitkeringen bij ouderdom en overlijden van een andere mogendheid.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.4
  - number: '2.5'
    text: |-
      Ten aanzien van degene die gedurende een deel van het kalenderjaar anders dan door overlijden niet premieplichtig
      is, wordt voor de premieheffing bij wege van aanslag als premie-inkomen in aanmerking genomen het bedrag dat
      naar tijdsevenredigheid is afgeleid van het in [artikel 8, derde lid, van de Wfsv][ref1] vermelde premie-inkomen
      dat maximaal in aanmerking zou zijn genomen indien gedurende het gehele kalenderjaar sprake zou zijn geweest van
      premieplicht, tenzij toepassing van de bepalingen in [die wet][ref2] of van de overige bepalingen in deze regeling
      tot een lager premie-inkomen leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0017745
  - number: '2.6'
    text: |-
      Ingeval zich ten aanzien van een verzekerde die in de premieheffing bij wege van aanslag wordt betrokken in
      het kalenderjaar tijdvakken voordoen waarin anders dan ingevolge [artikel 11, vierde lid, van de Wfsv][ref1]
      verschillende premiepercentages gelden, wordt van hem de premie geheven naar een percentage (heffingspercentage)
      dat is samengesteld uit tijdsevenredige delen van die verschillende premiepercentages. Het heffingspercentage wordt
      afgerond op honderdsten naar beneden.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel11
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '11'
  - number: '2.7'
    text: |-
      Ingeval voor de premieheffing bij wege van aanslag het heffingspercentage of het premie-inkomen moet worden bepaald
      door middel van tijdsevenredige vaststelling, wordt daarbij:

      a. een kalenderjaar op 360 dagen gesteld;

      b. een kalendermaand op 30 dagen gesteld;

      c. de dag waarop het tijdvak aanvangt als een gehele dag in aanmerking genomen;

      d. de dag waarop het tijdvak eindigt niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.7
  - number: '3.1'
    text: |-
      Voor de toepassing van [artikel 17, eerste en tweede lid, van de Wfsv][ref1] wordt een loontijdvak dat zich
      uitstrekt over twee kalenderjaren, geacht te behoren tot het kalenderjaar waarin het loon over dat loontijdvak
      wordt genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '3.2'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. arbeidsloon: loon uit een dienstbetrekking;

      b. uitkering: een uitkering krachtens de [ZW][ref1],
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref2], de [WAO][ref3], de [Wet WIA][ref4] of
      de [WW][ref5];

      c. aanvulling: arbeidsloon dat naar aard en strekking overeenkomt met een uitkering en door de werkgever, op grond
      van een aan zijn werknemer toegekende aanspraak, over dezelfde periode als waarover de uitkering wordt verstrekt
      aan de werknemer wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0004045
  - number: '3.3'
    text: |-
      1 Indien een werknemer die van één of meerdere werkgevers arbeidsloon ontvangt, vervolgens in plaats van één of
      elk van die lonen uitkering en aanvulling ontvangt, wordt het totaalbedrag van die uitkering en aanvulling voor de
      toepassing van [artikel 17 van de Wfsv][ref1] geacht bij dezelfde werkgever te zijn genoten.

      2 Indien het eerste lid toepassing vindt, blijft bij de berekening van het loon waarnaar de premies op grond
      van [hoofdstuk 3 van de Wfsv][ref2] worden geheven de aanvulling buiten aanmerking voorzover de aanvulling en
      uitkering tezamen meer bedragen dan het bedrag, bedoeld in [artikel 17, eerste lid, van de Wfsv][ref3] en blijft
      bij de berekening van het loon waarnaar de premie op grond van [afdeling 2 van hoofdstuk 3 van de Wfsv][ref4]
      wordt geheven de aanvulling buiten aanmerking voorzover de uitkering minder bedraagt dan het bedrag, bedoeld in
      [artikel 17, tweede lid, van de Wfsv][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Afdeling2
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.3
    references:
