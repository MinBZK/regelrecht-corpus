      1 In verband met het middelenbeheer wordt de rijksbijdrage, bedoeld in
      [artikel 45, tweede lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] beschouwd
      als middelen die deel uitmaken van het Algemeen Werkloosheidsfonds.

      2 De Minister van Sociale Zaken en Werkgelegenheid bepaalt dat bepaalde
      kosten, die ten laste komen van de rijksbijdrage aan het UWV, bedoeld in
      [artikel 45, tweede lid, onderdeel e, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      in afwijking van het eerste lid niet als uitgaven ten laste van de fondsen, bedoeld in
      [artikel 45, tweede lid, onderdelen a tot en met d, van die wet][ref3] komen.


