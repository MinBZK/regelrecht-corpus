  - number: '4.1'
    text: |-
      1 De persoon, die gemoedsbezwaren heeft tegen één van de verzekeringen, geregeld in de [AOW][ref1], de [ANW][ref2],
      de [AWBZ][ref3], de [ZW][ref4], de [WAO][ref5], de [Wet WIA][ref6] en de [WW][ref7], alsmede de rechtspersoon,
      waarbij natuurlijke personen betrokken zijn, die zodanige gemoedsbezwaren hebben, kan op zijn verzoek door de SVB
      worden ontheven van verplichtingen hem bij de [Wfsv][ref8], of één van de andere, in dit artikel genoemde wetten
      opgelegd.

      2 In afwijking van het eerste lid kan geen ontheffing worden verleend van de verplichtingen, bedoeld in
      [artikel 54 van de AWBZ][ref9], de [artikelen 13][ref10] en [49 van de ZW][ref11], de [artikelen 12][ref12] en
      [80 van de WAO][ref13], de [artikelen 27][ref14] en [33 van de Wet WIA][ref15] en de [artikelen 13][ref16] en
      [25 van de WW][ref17].


