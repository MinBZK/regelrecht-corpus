  - number: '4.2'
    text: |-
      1 Het verzoek geschiedt door indiening bij de SVB van een door de verzoeker ondertekende verklaring, waarvan het
      model door de SVB wordt vastgesteld.

      2 Deze verklaring houdt tenminste in, dat degene, die de verklaring indient, overwegende gemoedsbezwaren heeft
      tegen elke vorm van verzekering, dat hij mitsdien noch zichzelf, noch iemand anders, noch zijn eigendommen heeft
      verzekerd.

      3 Voorzover de volksverzekeringen in het geding zijn, blijkt uit de verklaring tevens, of degene, die haar indient,
      de in deze wetten geregelde voorzieningen al dan niet als verzekeringen beschouwt.

      4 Uit een door een werkgever bij de SVB ingediende verklaring blijkt of deze ook gemoedsbezwaren heeft tegen de
      nakoming van de hem als werkgever opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Wanneer het verzoek een rechtspersoon betreft, wordt de verklaring ingediend bij de SVB door het op grond van een
      wettelijk voorschrift of statuten van die rechtspersoon daartoe bevoegde orgaan.

      2 Onverminderd [artikel 4.2][ref1] houdt de verklaring, bedoeld in het eerste lid, tevens in, dat de natuurlijke
      personen, die behoren tot het orgaan, dat op grond van een wettelijk voorschrift of de statuten bevoegd is te
      besluiten de ontheffing aan te vragen, in meerderheid overwegende gemoedsbezwaren hebben.

      3 Bij het verzoek, bedoeld in het eerste lid, worden gevoegd:

      a. een afschrift van de aan elk van de tot de in het tweede lid bedoelde meerderheid behorende natuurlijke personen
      verleende ontheffing, bedoeld in [artikel 4.1][ref2];

      b. een gewaarmerkt afschrift van de statuten van de rechtspersoon, en

      c. een gewaarmerkt afschrift van de notulen van de vergadering, waarin het besluit tot het aanvragen van de
      ontheffing is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '4.2'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0019150
        artikel: '4.1'
        hoofdstuk: '4'
  - number: '4.4'
    text: |-
      De SVB verleent de ontheffing, indien de verklaring naar haar mening overeenkomstig de waarheid is. Aan een
      werkgever, die heeft verklaard geen gemoedsbezwaren te hebben tegen de nakoming van de hem als werkgever opgelegde
      verplichtingen, kan op die grond een ontheffing van de hem anders dan in zijn hoedanigheid van werkgever opgelegde
      verplichtingen niet worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      Voorzover volksverzekeringen in het geding zijn, wordt, indien de verzoeker heeft verklaard, dat hij de in één of
      meer van de genoemde wetten geregelde voorzieningen niet als verzekering beschouwt, geen ontheffing verleend van de
      in die wet of wetten opgelegde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      Van de verleende ontheffing wordt door de SVB aan de verzoeker een bewijs uitgereikt, waarvan het model wordt
      vastgesteld door de SVB.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      Degene, die is ontheven van zijn verplichtingen als werkgever, is verplicht te zorgen, dat het hem uitgereikte
      bewijs van ontheffing of een afschrift daarvan wordt en blijft opgehangen op een plaats, die vrij toegankelijk
      is voor alle in zijn dienst zijnde werknemers en waar deze geregeld plegen te komen, op zodanige wijze, dat van
      hetgeen op het desbetreffende stuk staat vermeld, gemakkelijk kan worden kennisgenomen.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      1 Indien degene aan wie ontheffing is verleend aan de loonbelasting is onderworpen, is hij verplicht van de hem
      verleende ontheffing mededeling te doen aan degene, die de inhouding verricht, door het tonen aan laatstbedoelde
      van het uitgereikte bewijs van ontheffing.

      2 Voor de werknemer, die niet aan de loonbelasting is onderworpen, geldt dezelfde verplichting ten opzichte van
      diens werkgever.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      1 Een ontheffing wordt door de SVB ingetrokken:

      a. op verzoek van degene, aan wie de ontheffing is verleend;

      b. indien naar het oordeel van de SVB de gemoedsbezwaren, op grond waarvan de ontheffing is verleend, niet langer
      geacht kunnen worden te bestaan.

      2 De ontheffing kan worden ingetrokken, indien verplichtingen, die nog op de degene aan wie ontheffing is verleend
      rusten ingevolge de in [artikel 4.1][ref1] genoemde wetten, of die hem bij deze regeling zijn opgelegd, niet door
      hem worden nageleefd.

      3 De SVB kan bij de intrekking tevens bepalen, dat een verzoek om ontheffing gedaan binnen twee jaren na de
      dagtekening van de intrekking, enkel op die grond niet-ontvankelijk kan worden verklaard.

      4 Degene, wiens ontheffing is ingetrokken, is verplicht binnen drie dagen na de dagtekening van de desbetreffende
      kennisgeving, het bewijs van ontheffing terug te geven aan de SVB.

      5 Indien degene, wiens ontheffing is ingetrokken, aan de loonbelasting is onderworpen, doet de SVB van de
      intrekking mededeling aan degene, die de inhouding verricht.

      6 Ten aanzien van de werknemer, die niet aan de loonbelasting is onderworpen, wordt eenzelfde mededeling als
      bedoeld in het vorige lid gedaan aan diens werkgever.

      7 [Artikel 4.9][ref2] vindt overeenkomstige toepassing ten aanzien van de mededeling van de intrekking van de
      ontheffing.

      8 Onverminderd het overigens in dit artikel bepaalde vervalt de ontheffing, die is verleend aan een rechtspersoon,
      na verloop van vijf jaar na de datum van ingang van de ontheffing. Met ingang van de datum, waarop een ontheffing
      is vervallen, kan een nieuwe ontheffing worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '4.1'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0019150
        artikel: '4.9'
        hoofdstuk: '4'
  - number: '4.10'
    text: |-
      In geval van intrekking van een ontheffing van verplichtingen als werknemer, is het UWV bevoegd
      [artikel 44 van de Ziektewet][ref1] toe te passen indien ongeschiktheid tot werken wegens ziekte, anders dan wegens
      zwangerschap en bevalling, bestond op de dag van intrekking van de ontheffing, dan wel is ingetreden binnen vier
      weken na die dag. Op deze termijnen is de [Algemene termijnenwet][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002448
