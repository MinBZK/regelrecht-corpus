      10 De [Financieringsregeling Toeslagenfonds en Arbeidsongeschiktheidsfonds jonggehandicapten][ref10] wordt
      ingetrokken.

      11 De [Financieringsregeling rijksbijdrage Arbeidsongeschiktheidsfonds][ref11] wordt ingetrokken.


