    text: |-
      In deze regeling wordt verstaan onder:

        - AKW: de [Algemene Kinderbijslagwet][ref1];
        - ANW: de [Algemene nabestaandenwet][ref2];
        - AOW: [Algemene Ouderdomswet][ref3];
        - AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref4];
        - *IOW:* de [Wet inkomensvoorziening oudere werklozen][ref5];
        - Tijdelijke wet BIA: de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref6];
        - TW: de [Toeslagenwet][ref7];
        - Wet Wajong: de [Wet werk en arbeidsondersteuning jonggehandicapten][ref8];
        - WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref9];
        - Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref10];
        - Wfsv: de [Wet financiering sociale verzekeringen][ref11];
        - WW: de [Werkloosheidswet][ref12];
        - Wet WIA: de [Wet werk en inkomen naar arbeidsvermogen][ref13];
        - ZW: de [Ziektewet][ref14].


