  - number: '5.8'
    text: |-
      1 Ondernemingen waarvan de bedrijfsuitoefening uitsluitend of in overwegende mate behoort tot de in de bijlage
      van deze regeling bij de sector Gezondheid, geestelijke en maatschappelijke belangen onder de punten 1 tot en met
      15, 20, 24 tot en met 26 en 29 genoemde takken van bedrijf en beroep, zijn ten aanzien van alle werkzaamheden van
      rechtswege aangesloten bij deze sector.

      2 De inspecteur kan bij voor bezwaar vatbare beschikking beslissen dat een werkgever ten aanzien van bepaalde
      werkzaamheden vanaf een bij de beslissing aan te wijzen datum is aangesloten bij een andere sector indien:

      a. die werkzaamheden behoren tot het onderdeel van het bedrijfs- en beroepsleven dat onder die andere sector
      ressorteert;

      b. die werkzaamheden niet geacht kunnen worden voort te vloeien uit het in het eerste lid bedoelde bedrijf of
      beroep van de werkgever, en;

      c. die werkzaamheden niet uitsluitend of in hoofdzaak ten behoeve van dat bedrijf of beroep worden verricht.

      3 De inspecteur kan, ambtshalve of op verzoek van een werkgever, bij voor bezwaar vatbare beschikking beslissen dat
      de aansluiting van een werkgever ten aanzien van bepaalde werkzaamheden bij een sector als bedoeld in het tweede
      lid, wordt gewijzigd of ingetrokken vanaf een bij de beslissing aan te wijzen datum.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      1 Het UWV vergoedt met inachtneming van de [artikelen 102, eerste en tweede lid][ref1], en
      [110, eerste en tweede lid, van de Wfsv][ref2], per kalenderjaar aan de Minister voor Wonen, Wijken en Integratie
      de door de SVB in dat jaar aan werknemers toegekende remigratiebijdragen, doch ten hoogste tot een bedrag gelijk
      aan het totaal van de uitkeringen die op grond van de [WW][ref3] in dat kalenderjaar waarin remigratiebijdragen
      zijn verstrekt, aan deze werknemers hadden moeten worden betaald, indien zij werkloos waren gebleven en niet
      naar een bestemmingsland als bedoeld in [artikel 1, eerste lid, onderdeel e, van de Remigratiewet][ref4] waren
      vertrokken.

      2 Onder remigratiebijdrage als bedoeld in het eerste lid wordt verstaan: een periodieke uitkering als
      bedoeld in [artikel 4, eerste lid, van de Remigratiewet][ref5] of een tegemoetkoming als bedoeld in
      [artikel 4, derde lid, van de Remigratiewet][ref6].


