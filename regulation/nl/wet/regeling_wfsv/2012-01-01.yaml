  - number: '3.16'
    text: |-
      In deze afdeling wordt verstaan onder eigenrisicodrager: de werkgever aan wie op grond van
      [artikel 40 van de Wfsv][ref1] toestemming is verleend het risico te dragen van de betalingen, bedoeld in
      [artikel 40, eerste lid, van de Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
