        artikel: '23'
  - number: '5.14'
    text: |-
      1 De reserves voor de sectorfondsen, bedoeld in [artikel 23, eerste lid, van de Wfsv][ref1], worden alle
      onderscheiden in een reserve voor de werkloosheidslasten en een reserve voor de ziekengeldlasten.

      2 De reserve voor de ziekengeldlasten heeft aan het einde van elk kalenderjaar een omvang van 10% van het
      gemiddelde van die lasten in dat kalenderjaar en de twee daaraan voorafgaande kalenderjaren.

      3 Het UWV wijst, met inachtneming van het vierde lid, de sectorfondsen aan waarvoor een reserve voor de
      werkloosheidslasten wordt gevormd en instandgehouden.

      4 Een reserve voor de werkloosheidslasten wordt niet gevormd en instandgehouden als niet wordt
      voldaan aan de voorwaarden als bedoeld in [artikel 5.13, eerste lid][ref2], onder toepassing van
      [artikel 5.12, tweede en derde lid][ref3].

      5 [Artikel 5.13, tweede lid][ref4], is van overeenkomstige toepassing op de omvang van de reserve voor de
      werkloosheidslasten, onder toepassing van [artikel 5.12, tweede en derde lid][ref5].

      6 Bij de toepassing van het vierde lid wordt de wijziging van het lastenpercentage van de werkloosheidslasten in
      1996 op nihil gesteld en worden de lastenpercentages in 1998 herberekend met een correctiefactor die door het UWV
      per sector is vastgesteld.


