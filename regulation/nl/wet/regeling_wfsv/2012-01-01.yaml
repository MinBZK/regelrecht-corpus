  - number: '3.13'
    text: |-
      1 Voor de vaststelling van het sectorpremiepercentage worden met de werknemer op wie
      [artikel 2.3, tweede lid, onderdeel a, van het Besluit Wfsv][ref1] van toepassing is, gelijkgesteld:

      a. scholieren en studenten die blijkens een schriftelijke overeenkomst ten hoogste acht aaneengesloten weken per
      kalenderjaar in dienstbetrekking zullen staan tot dezelfde werkgever;

      b. de werknemer die de beroepspraktijkvorming volgt van de beroepsbegeleidende leerweg van een beroepsopleiding als
      bedoeld in [artikel 7.2.2, eerste lid, onderdelen a tot en met e, van de Wet educatie en beroepsonderwijs][ref2],
      op de grondslag van een overeenkomst als bedoeld in [artikel 7.2.8][ref3], gesloten door de partijen, genoemd
      in [artikel 7.2.9 van die wet][ref4] en mede ondertekend door het bestuur van het desbetreffende kenniscentrum
      beroepsonderwijs bedrijfsleven.

      2 Voor de toepassing van het eerste lid, onderdeel a wordt onder scholieren en studenten verstaan:

      a. de werknemer die bij het begin van het kalenderkwartaal recht heeft op een gift, een
      voorwaardelijke gift of een prestatiebeurs op grond van de [Wet studiefinanciering 2000][ref5] of de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6];

      b. de werknemer die bij het begin van het kalenderkwartaal recht heeft op een tegemoetkoming op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref7];

      c. de werknemer voor wie bij het begin van het kalenderkwartaal recht bestaat op kinderbijslag op grond van de
      [Algemene Kinderbijslagwet][ref8];

      d. de werknemer die bij het begin van het kalenderkwartaal staat ingeschreven bij een onderwijsinstelling waar hij
      een voltijdse opleiding volgt en die inwoner is van een lidstaat van de Europese Unie, van een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of van Zwitserland.

      3 Voor de toepassing van het eerste lid, onderdeel a, bewaart de werkgever bij zijn loonadministratie een
      schriftelijke door de werknemer gedagtekende en ondertekende verklaring dat ten zijnen aanzien het kalenderkwartaal
      als loontijdvak kan worden aangemerkt alsmede:

      a. ingeval het tweede lid, onderdeel a van toepassing is, het correspondentienummer;

      b. ingeval het tweede lid, onderdeel b van toepassing is, het onderwijsnummer;

      c. ingeval het tweede lid, onderdeel c van toepassing is, het registratienummer;

      d. ingeval het tweede lid, onderdeel d van toepassing is, een kopie van een internationale studentenkaart als
      bedoeld in [artikel 6.3, tweede lid, onderdeel d, van de Uitvoeringsregeling loonbelasting 2011][ref9].

      4 Voor de toepassing van het eerste lid, onderdeel b, bewaart de werkgever een afschrift van de in dat onderdeel
      genoemde overeenkomst bij de loonadministratie.


