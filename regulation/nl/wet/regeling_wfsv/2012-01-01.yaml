      1 In [artikel 5.13][ref1] wordt verstaan onder:

      a. de verzekerde loonsom: het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref2], waarover
      het UWV in een kalenderjaar de premies ten gunste van het Algemeen Werkloosheidsfonds zou ontvangen, indien
      [artikel 17, tweede lid, van de Wfsv][ref3] buiten toepassing zou blijven;

      b. de werkloosheidslasten: hetgeen op grond van [artikel 100, onderdeel a, van de Wfsv][ref4] ten laste van het
      Algemeen werkloosheidsfonds komt;

      c. de drempelwaarde: 0,2 procentpunt.

      2 In [artikel 5.14][ref5] wordt verstaan onder:

      a. de verzekerde loonsom: het totaalbedrag van het loon, bedoeld in [artikel 26 van de Wfsv][ref6], waarover het
      UWV in een kalenderjaar de premies ten gunste van een sectorfonds ontvangt, met uitzondering van het loon, waarop
      [artikel 28, tweede lid, van de Wfsv][ref7] van toepassing is;

      b. de ziekengeldlasten: hetgeen op grond van [artikel 104, eerste lid, onderdeel c, van de Wfsv][ref8] ten laste
      van een sectorfonds komt alsmede het deel van de op dit onderdeel betrekking hebbende uitvoeringskosten en premies
      als bedoeld in [artikel 104, eerste lid, onderdeel d en e, van de Wfsv][ref9];

      c. werkloosheidslasten: hetgeen op grond van [artikel 104, eerste lid, van de Wfsv][ref10] ten
      laste van een sectorfonds komt, met uitzondering van de ziekengeldlasten en hetgeen op grond van
      [artikel 104, vierde lid, van de Wfsv][ref11] ten laste van het Algemeen Werkloosheidsfonds komt;

      d. de drempelwaarde: tot 1996 0,2 procentpunt, daarna 0,4 procentpunt.

      3 In de [artikelen 5.13][ref12] en[ 5.14][ref13] wordt verstaan onder:

      a. het lastenpercentage: het percentage van de verzekerde loonsom in een kalenderjaar waarin de werkloosheidslasten
      van dat kalenderjaar tot uitdrukking komen;

      b. de wijziging van het lastenpercentage in een kalenderjaar: het verschil tussen het lastenpercentage in een
      kalenderjaar en het lastenpercentage in het daaraan voorafgaande kalenderjaar.


