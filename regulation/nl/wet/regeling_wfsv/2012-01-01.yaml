  - number: '3.24'
    text: |-
      1 Indien de dienstbetrekking met de werknemer niet aanvangt respectievelijk eindigt op de eerste dag
      respectievelijk laatste dag van het aangiftetijdvak, wordt het bedrag van de premiekorting, bedoeld in
      [artikel 47, eerste en derde lid][ref1], en [122b, eerste lid, van de Wfsv][ref2], over dat aangiftetijdvak
      vermenigvuldigd met de factor A/B

      waarbij

      A staat voor: het aantal kalenderdagen in dat aangiftetijdvak dat de werknemer in dienstbetrekking heeft gestaan
      tot de werkgever;

      B staat voor: het totale aantal kalenderdagen in dat aangiftetijdvak.

      2 Indien een werknemer in het aangiftetijdvak werkzaam is in een dienstbetrekking waarin de beloning voor de arbeid
      niet is gebaseerd op overeengekomen arbeidsduur, wordt voor de toepassing van [artikel 48 van de Wfsv][ref3] bij
      een loon van ten minste het voor hem geldende wettelijk minimumloon per 1 januari van het kalenderjaar waarvoor
      de premie wordt vastgesteld, de werknemer geacht ten minste 36 uur per week te hebben gewerkt. Indien het loon in
      dat aangiftetijdvak minder is dan het voor hem geldende wettelijk minimumloon per 1 januari van het kalenderjaar
      waarvoor de premie wordt vastgesteld, dan wordt het in de eerste zin bedoelde aantal uren per week naar
      evenredigheid verminderd met een factor C/D

      waarbij

      C staat voor: het loon dat uit de dienstbetrekking wordt genoten in het aangiftetijdvak;

      D staat voor: het voor de werknemer geldende wettelijke minimumloon per 1 januari van het kalenderjaar waarvoor de
      premie wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel122b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel48
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.24
