  - number: '2.1'
    text: |-
      Voor de toepassing van dit hoofdstuk worden de landen van het Koninkrijk der Nederlanden aangemerkt als
      afzonderlijke mogendheden.
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Voor de toepassing van [artikel 8, eerste lid, van de Wfsv][ref1] wordt verstaan onder partner:

      degene die partner is in de zin van [artikel 1.2 van de Wet inkomstenbelasting 2001][ref2] en degene die
      gelet op het derde lid, onderdeel b, van laatstbedoeld artikel geen keuze voor behandeling als binnenlandse
      belastingplichtige heeft gedaan of heeft kunnen doen.

      2 In afwijking van het eerste lid geldt, ingeval de premieplichtige en zijn partner beiden belastingplichtig zijn,
      de gemaakte keuze, bedoeld in [artikel 1.2, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref3],
      zowel voor de heffing van de inkomstenbelasting als voor de heffing van de premie voor de volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel2.2
    references:
