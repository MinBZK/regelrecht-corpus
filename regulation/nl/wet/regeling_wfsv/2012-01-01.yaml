      1 Deze paragraaf heeft betrekking op de middelen voor het Toeslagenfonds en het Arbeidsondersteuningsfonds
      jonggehandicapten, waarin voorzien wordt door rijksbijdragen.

      2 De middelen voor Arbeidsondersteuningsfonds jonggehandicapten dienen ter dekking van lasten die op grond van
      enige wettelijk voorschrift ten laste van het Arbeidsondersteuningsfonds jonggehandicapten komen.

      3 De middelen voor het Toeslagenfonds dienen ter dekking van lasten van het UWV voor:

      a. toeslagen op grond van de [TW][ref1];

      b. uitkeringen op grond van de [Tijdelijke wet BIA][ref2];

      c. tegemoetkomingen op grond van [artikel 10 van de Wet tegemoetkoming chronisch zieken en gehandicapten][ref3];

      d. uitkeringen op grond van de [IOW][ref4].


