  - number: '5.15'
    text: |-
      In deze afdeling en [afdeling 3][ref1] wordt verstaan onder:

      a. een rekening-courant: een rekening in de centrale administratie van ’s Rijks schatkist bij het ministerie van
      Financiën op naam van een rekening-couranthouder, waarop dagelijks het geldelijk tegoed (positief of negatief)
      wordt bijgehouden van de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;

      b. de rekening-couranthouder: de SVB, het UWV of het College zorgverzekeringen, ieder voorzover het hem aangaat;

      c. Euribor: de dagelijks door de European Banking Federation vastgestelde rente waartegen op de geldmarkt
      interbancair deposito's in euro's van verschillende looptijden worden aangeboden in de landen waar de euro
      betaalmiddel is;

      d. het verdeelpercentage: het percentage waarmee de totale opbrengst van de loonheffing (de gecombineerde heffing
      van loonbelasting en premie voor de volksverzekeringen) en de premie voor de werknemersverzekeringen wordt verdeeld
      in een opbrengst van de loonheffing en in een opbrengst van de diverse premies voor de werknemersverzekeringen;

      e. het toedelingspercentage: het percentage waarmee de opbrengst van de loonheffing respectievelijk de
      inkomensheffing (de gecombineerde heffing van inkomstenbelasting en premie voor de volksverzekeringen) wordt
      verdeeld in belastingopbrengst en opbrengst van de premie voor de volksverzekeringen;

      f. de valutadatum: de dag waarop het bedrag van een boeking rentedragend wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel5.15
