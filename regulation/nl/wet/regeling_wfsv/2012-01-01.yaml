  - number: '3.21'
    text: |-
      1 Indien een werkgever niet gedurende een periode van in totaal drie respectievelijk één jaar
      premiekorting als bedoeld in [artikel 47, eerste lid][ref1], en [49, eerste lid][ref2], respectievelijk
      [artikel 49, tweede lid, van de Wfsv][ref3] heeft toegepast:

      a. worden dienstbetrekkingen bij dezelfde werkgever die elkaar met tussenpozen van minder dan drie maanden
      opvolgen, geacht niet te zijn onderbroken en worden de perioden waarin de premiekorting wordt toegepast opgeteld
      totdat in totaal drie respectievelijk één jaar premiekorting is toegepast;

      b. kan indien dienstbetrekkingen bij dezelfde werkgever elkaar met tussenpozen van drie maanden of meer doch ten
      hoogste drie jaar opvolgen, de premiekorting niet opnieuw worden toegepast en beslaat de premiekortingsperiode de
      periode vanaf het moment dat de eerdere premiekortingsperiode een aanvang nam totdat respectievelijk drie of één
      jaar zijn verstreken, zonder dat over de tussenliggende periode premiekorting is toegepast.

      2 Het eerste lid is van overeenkomstige toepassing indien de dienstbetrekking in de periode, bedoeld in de
      onderdelen a of b, van dat lid, niet is onderbroken maar in de genoemde periode geen premiekorting kon worden
      toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel3.21
