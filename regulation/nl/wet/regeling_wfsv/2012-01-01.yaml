      1 De Minister van Sociale Zaken en Werkgelegenheid stort op de rekening-courant, bedoeld
      in [artikel 5.16, onderdeel b][ref1], een periodiek voorschot op het bedrag, bedoeld in
      [artikel 5.30, eerste lid][ref2], van:

      a. geraamde uitkeringslasten, toeslagen en tegemoetkomingen met als valutadatum de tweeëntwintigste dag van elke
      maand, en

      b. 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.

      2 De Minister van Sociale Zaken en Werkgelegenheid kan, na overleg met het UWV, van de in het eerste lid,
      onderdelen a en b, bedoelde bedragen afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5.16
      [ref2]: https://wetten.overheid.nl/BWBR0019150#Artikel5.30
