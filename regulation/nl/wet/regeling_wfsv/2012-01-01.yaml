      1 De reserve voor het Algemeen Werkloosheidsfonds, bedoeld in [artikel 23, eerste lid, van de Wfsv][ref1], wordt
      niet gevormd of instandgehouden, indien in het tweede kalenderjaar voorafgaande aan het kalenderjaar waarin de
      reserve zou worden gevormd of instandgehouden, of in de 14 aan dat tweede kalenderjaar voorafgaande kalenderjaren,
      het lastenpercentage van de werkloosheidslasten niet ten minste éénmaal een wijziging van minimaal de drempelwaarde
      heeft gekend.

      2 De reserve heeft aan het einde van elk kalenderjaar een omvang van ten hoogste 2,5 maal de verzekerde loonsom in
      dat kalenderjaar maal het verschil tussen de grootste wijziging van het lastenpercentage van de werkloosheidslasten
      en de drempelwaarde in het jaar van de grootste wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel23
    url: https://wetten.overheid.nl/BWBR0019150/2012-01-01#Artikel5.13
