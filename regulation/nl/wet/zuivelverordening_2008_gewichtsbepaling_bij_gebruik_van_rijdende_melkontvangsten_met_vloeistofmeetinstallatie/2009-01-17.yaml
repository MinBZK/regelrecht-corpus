  - number: '2.1'
    text: |-
      Indien voor de bepaling van het gewicht van de geleverde hoeveelheid boerderijmelk, als bedoeld in
      [artikel 7 van Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1], gebruik wordt gemaakt van een
      rijdende melkontvangst (RMO) met een vloeistofmeetinstallatie voor melk, wordt het bepaalde in deze verordening in
      acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0017209#Artikel7
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017209
        artikel: '7'
  - number: '2.2'
    text: |-
      Met de in deze verordening bedoelde RMO’s met vloeistofmeetinstallatie worden gelijkgesteld RMO’s met
      vloeistofmeetinstallatie, die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat
      van de Europese Unie, dan wel rechtmatig zijn vervaardigd in een staat die partij is bij de overeenkomst inzake de
      Europese Ruimte, en die aan ten minste gelijkwaardige technische eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel2
  - number: '3'
    text: |-
      De ontvanger van boerderijmelk maakt gebruik van RMO’s voorzien van een vloeistofmeetinstallatie die voldoet aan de
      hiernavolgende eisen:
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: '3.1'
    text: |-
      Voorzien van een vloeistofmeetinstallatie die voldoet aan de in [artikel 4][ref1] genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel4
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '4'
        paragraaf: '3'
  - number: '3.2'
    text: |-
      Voorzien van een doelmatige ruimte, waarin de monsters diepgekoelde boerderijmelk kunnen worden gekoeld en bewaard
      op een temperatuur van ten minste 0,0° C en ten hoogste 4,0° C.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: '3.3'
    text: |-
      Op een duidelijke zichtbare plaats voorzien van een verzegelbare opschriftenplaat, waarop de volgende gegevens
      zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.a
    text: merk of naam van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.b
    text: 'gegevens over de nauwkeurigheid: nauwkeurigheidsklasse 0,5 en bestemd voor melk;'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.c
    text: 'gegevens met betrekking tot gebruiksomstandigheden (melk): de minimale en maximale werkdruk;'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.d
    text: 'meetcapaciteit: gegevens over de minimale en maximale volumestroom;'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.e
    text: kenmerk ter identificatie van het meetinstrument (waaronder duidelijk leesbaar het nummer van de melkmeter);
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.f
    text: |-
      nummer van het certificaat van het EG-type-onderzoek (alleen voor na september 2008 in de handel gebrachte en/of in
      gebruik genomen vloeistofmeetinstallaties);
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.g
    text: 'de kleinste ontvangsthoeveelheid: 900 liter;'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: 3.3.h
    text: |-
      de basishoeveelheid, zijnde de melkinhoud op het gemiddelde rustniveau van de vloeistofmeetinstallatie tot de
      melkmeter.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel3
  - number: '4.1'
    text: 'De *vloeistofmeetinstallatie* is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.1.a
    text: |-
      Een typegoedkeuring overeenkomstig het bepaalde in de [Metrologiewet][ref1] (alleen voor na september 2008 in de
      handel gebrachte en/of in gebruik genomen vloeistofmeetinstallaties).


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 4.1.b
    text: |-
      Een melkmeter: de meter registreert zowel de hoeveelheid melk van elke melkveehouder afzonderlijk, als de
      totale hoeveelheid melk welke per rit wordt ontvangen en is voorzien van de wettelijke kenmerken en waarvan de
      justeerinrichting door het Nederlands Meetinstituut of een andere daartoe bevoegde instantie is verzegeld. De
      melkmeter is voorzien van een aanwijsinrichting, waarvan de afleeseenheid < 1 liter is.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.1.c
    text: |-
      Een luchtafscheider met op doelmatige wijze aangebracht kijkglas of niveau-aanwijzer en met een op een duidelijk
      zichtbare plaats aangebrachte opschriftenplaat, waarop de volgende gegevens zijn vermeld: - De inhoudsvariaties per
      cm niveauverschil over het gebied van ten minste plus en minus 5 cm ten opzichte van het gemiddelde rustniveau.
        - Het kijkglas of de niveau-aanwijzer is op zodanige wijze aangebracht, dat het rustniveau kan worden vastgesteld.
      Het rustniveau bevindt zich altijd in een door 2 streepjes afgebakende zone, waarvan het volume ten hoogste
      7 liter bedraagt. De afstand tussen de twee streepjes bedraagt ten minste 15 mm. De luchtafvoerleiding van de
      luchtafscheider mondt rechtstreeks uit in de buitenlucht. Indien dit niet het geval is, is in deze leiding een
      beveiligingsinrichting opgenomen, die de melkpomp uitschakelt indien tijdens normaal bedrijf melk door deze leiding
      stroomt.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.1.d
    text: |-
      De melkpomp met de bijbehorende aandrijving, welke - voor zover niet aangedreven door een elektromotor met
      constant toerental - door een verzegelbaar stroomregelventiel in het hydraulische systeem van de melkpomp,
      zodanig moet zijn geborgd, dat de maximaal toelaatbare volumestroom niet kan worden overschreden (zie
      [artikel 3, lid 3, onder d][ref1]). Indien gebruik wordt gemaakt van dataregistratie-apparatuur behoeft een
      stroomregelventiel zoals hierboven bedoeld, niet te zijn aangebracht, indien ten behoeve van de melkveehouder en
      de zuivelfabriek een duidelijke schriftelijke signalering plaatsvindt van een grotere dan de maximale volumestroom;
      dat wil zeggen bij overschrijding van het daarbij behorende aantal afgegeven pulsen per tijdseenheid gedurende meer
      dan 15 seconden.


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel3
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '3'
        paragraaf: '3'
  - number: '4.2'
    text: |-
      De melkmeter vertoont bij het vaststellen van het aantal liters zonder luchtafscheider geen grotere fout dan plus
      of minus 0,3%.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: '4.3'
    text: |-
      De complete vloeistofmeetinstallatie veroorzaakt bij het vaststellen van het aantal liters melk geen grotere
      gemiddelde afwijking dan plus of min 0,75%.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: '4.4'
    text: |-
      De vloeistofmeetinstallatie is zodanig uitgevoerd, dat voor de desbetreffende onderdelen in elk geval de volgende
      voorzieningen zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.4.A
    text: 'Melkpomp Deze is:'
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.4.A.a
    text: |-
      Voorzien van een toe- en afvoerleiding, die zodanig zijn uitgevoerd, dat - ten behoeve van de controle van
      de melkmeter - een omloopleiding met regelafsluiter kan worden gemonteerd. Hiertoe is zowel aan de zuig- als
      aan de persleiding van de pomp een extra pijpstuk (2”) gemaakt, tenzij door aangebrachte koppelingen in de
      leiding bedoelde pijpstukken eenvoudig zijn aan te brengen. Bovenstaande voorziening kan achterwege blijven
      indien het toerental van de pomp aan de bedieningszijde regelbaar is van 0 tot maximaal (ingesteld volgens
      [artikel 4, lid 1, onder d][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel4
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '4'
        paragraaf: '3'
  - number: 4.4.A.b
    text: |-
      Zo nodig, uitsluitend ten behoeve van de controlemetingen aan de melkmeter, voorzien van een extra inrichting om de
      pomp aan en uit te kunnen schakelen als de luchtafscheider is uitgebouwd. Indien aan het begin en/of einde van de
      zuigperiode met een automatisch geregeld lager toerental wordt gewerkt, is dit lagere toerental ook met voornoemde
      inrichting instelbaar. De inrichting is zodanig uitgevoerd, dat er tijdens normaal bedrijf niet op foutieve wijze
      gebruik van kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.4.B
    text: |-
      Luchtafscheider Deze is zo aangesloten op het leidingwerk, dat ze op eenvoudige wijze kan worden vervangen door
      een kortsluitleiding ten behoeve van de controle van de melkmeter. Hiertoe kunnen de toe- en afvoerleiding worden
      losgenomen en omgezwaaid.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: 4.4.C
    text: |-
      Melkmeter Wanneer de afleesbaarheid > 0,1 liter is, zijn zodanige voorzieningen aanwezig dat tijdens controle
      afgelezen kan worden op 0,1 liter.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel4
  - number: '5.1'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor dat de RMO voldoet aan de eisen, zoals die zijn gesteld in
      [artikel 3][ref1]. Hiertoe laat de ontvanger van boerderijmelk de RMO één keer per jaar keuren door een door de
      voorzitter, gehoord het COKZ, aangewezen instelling/erkende keurder.


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel3
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '3'
        paragraaf: '3'
  - number: '5.2'
    text: |-
      De in lid 1 bedoelde instelling hanteert de door de voorzitter, gehoord het COKZ, vastgestelde werkwijzen ten
      aanzien van de keuring en de toe te passen nauwkeurigheidsgrenzen, zoals neergelegd in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel4
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '4'
        paragraaf: '3'
  - number: '5.3'
    text: |-
      Voor het aanbrengen van de wettelijke kenmerken is de in lid 1 bedoelde instelling in het bezit van een door het
      Nederlands Meetinstituut of de aangewezen instantie verleende bevoegdheid; het door het Nederlands Meetinstituut
      goed te keuren kwaliteitshandboek is hiervan een onderdeel.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel5
  - number: '5.4'
    text: |-
      Een gewijzigde RMO wordt door de ontvanger van boerderijmelk direct aan een weegcontrole
      onderworpen. Deze weegcontrole moet worden uitgevoerd overeenkomstig de werkwijze als omschreven in
      [artikel 6, lid 2, onder A][ref1]. Indien de omrekeningsfactoren kleiner is dan 1,028 dan wel groter is dan 1,035,
      wordt binnen één week na vaststelling van de vorige omrekeningsfactoren opnieuw de omrekeningsfactor van deze
      RMO vastgesteld. Indien de omrekeningsfactoren wederom kleiner is dan 1,028 dan wel groter is dan 1,035, wordt
      de RMO binnen 10 werkdagen aansluitende op de weegcontrole voor een keuring bij de erkende keurder aangeboden en
      wordt hiervan binnen één week melding gemaakt aan het COKZ. Een gewijzigde RMO betreft een RMO waarbij wijzigingen
      zijn aangebracht in de vloeistofmeetinstallatie die gevolgen kunnen hebben voor de hoeveelheidvaststelling (zie
      [artikel 7, lid 3][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0025401#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025401#Artikel7
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025401
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0025401
        artikel: '7'
        paragraaf: '4'
  - number: '5.5'
    text: |-
      De resultaten van deze keuring moeten door de ontvanger van boerderijmelk worden geregistreerd ten behoeve
      van het door het COKZ uit te voeren toezicht. Indien bij een keuring op de meetnauwkeurigheid van de
      vloeistofmeetinstallatie van een RMO wordt geconstateerd dat niet wordt voldaan aan de eisen welke te dien aanzien
      zijn neergelegd in deze voorwaarden, draagt de ontvanger van boerderijmelk er zorg voor dat de betrokken RMO binnen
      een termijn van 8 weken aan een herkeuring wordt onderworpen. De resultaten van deze keuring moeten eveneens door
      de ontvanger van boerderijmelk worden geregistreerd ten behoeve van het door het COKZ uit te voeren toezicht. Bij
      herkeuring moet de RMO binnen een periode van 6 maanden opnieuw voor een keuring worden aangeboden. Indien bij
      deze herkeuring de RMO niet blijkt te voldoen aan de hiervoor bedoelde voorwaarden, is het gebruik van de RMO voor
      het vaststellen van de hoeveelheden van door veehouders aan de ontvanger van boerderijmelk geleverde melk niet
      meer toegestaan. De RMO wordt niet eerder ingezet dan is vastgesteld dat de RMO voldoet aan de eisen ten aanzien
      van de meetnauwkeurigheid. De ontvanger van melk meldt de afkeuring bij herkeuring direct aan het COKZ. De door de
      ontvanger van boerderijmelk genomen maatregelen moeten worden geregistreerd en de bijbehorende keuringsrapporten
      moeten beschikbaar zijn ten behoeve van het door het COKZ uit te voeren toezicht.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel5
  - number: '6.1'
    text: |-
      De vaststelling en de notering van het volume van elke melkleverantie vinden plaats in liters. Het gebruik van een
      omrekeningsfactor in de data-apparatuur op de RMO is toegestaan, mits overeenkomstig het bepaalde bij of krachtens
      de [Metrologiewet][ref1], op de plaats van inname van de melk de geregistreerde liters en de omrekeningsfactor
      inzichtelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: '6.2'
    text: |-
      De omrekening van liters naar kilogrammen melk vindt plaats met behulp van een door de ontvanger van melk
      vast te stellen omrekeningsfactor. Deze factor wordt éénmaal per kalendermaand bepaald en is van toepassing
      op de daaropvolgende kalendermaand. De ontvanger van boerderijmelk heeft een procedure waarbij de werkwijze
      van de vaststelling van de omrekeningsfactor aantoonbaar en objectief wordt vastgesteld. De bepaling van de
      omrekeningsfactor wordt door de ontvanger van boerderijmelk als volgt uitgevoerd:
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel6
  - number: 6.2.A
    text: |-
      Indien de ontvanger van boerderijmelk gebruik maakt van één RMO wordt voor de desbetreffende in gebruik zijnde
      RMO in de kalendermaand een omrekeningsfactor vastgesteld door na beëindiging van een melkrit het gewicht van
      de ontvangen melk door middel van een weegbrug of tanksnelweger in kilogrammen vast te stellen. Dat gewicht
      wordt gedeeld door het totale aantal gedurende die rit ontvangen liters melk, zoals dat met behulp van de
      vloeistofmeetinstallatie op de betreffende RMO werd vastgesteld: Bij gebruikmaking van een weegbrug wordt voor
      de bepaling van de omrekeningsfactor ofwel: - na beëindiging van een melkrit eerst het gewicht van de geladen RMO
      vastgesteld, alvorens het gewicht van de lege RMO (tarragewicht) te bepalen, ofwel
        - voor de aanvang van een melkrit het gewicht van de lege RMO (tarragewicht) vastgesteld en na beëindiging
      van de melkrit het gewicht van de geladen RMO bepaald. In laatstgenoemd geval wordt bij de vaststelling van de
      omrekeningsfactor rekening gehouden met het verbruik van dieselolie door de RMO. Hierbij wordt uitgegaan van een
      verbruik van 1 kg op 3 kilometer.
        - Het gevonden getal wordt afgerond op de derde decimaal (tot 0,0005 naar beneden en vanaf 0,0005 tot 0,001 naar
      boven). De omrekeningsfactor voor iedere RMO wordt vastgesteld op het getal, dat resulteert uit deze afronding,
      doch ten minste op 1,028.
        - De bepaling van het gewicht van de van veehouders ontvangen boerderijmelk geschiedt door, met behulp van de
      omrekeningsfactor voor de betreffende RMO, het aantal liters, als bepaald in dit punt, om te rekenen in kg, waarbij
      hoeveelheden tot een halve kg naar beneden en hoeveelheden van een halve tot één kg naar boven worden afgerond.
        - De gegevens waaruit de omrekeningsfactor wordt afgeleid, worden gedurende ten minste één jaar op het bedrijf van
      de ontvanger van boerderijmelk bewaard onder vermelding van de data van bepaling van de omrekeningsfactor en de
      gemiddelde temperatuur van de melk bij aankomst op de zuivelfabriek.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel6
  - number: 6.2.B
    text: |-
      Indien gebruik wordt gemaakt van twee of meer RMO’s gebruikt de ontvanger van boerderijmelk, in afwijking
      van het bepaalde in punt A, per fabriek of per groep van fabrieken of per groep van ontvangers een uniforme
      omrekeningsfactor. Deze uniforme omrekeningsfactor wordt als volgt vastgesteld: - Van iedere in gebruik zijnde RMO
      wordt op de wijze als omschreven in punt A de omrekeningsfactor bepaald.
        - Het, op de wijze als omschreven in punt A, in kilogrammen vastgestelde gewicht van de melk ontvangen door RMO’s,
      waarvan de omrekeningsfactoren niet kleiner zijn dan 1,028 en niet groter dan 1,035 wordt gedeeld door het totaal
      door deze RMO’s ontvangen liters melk. De op deze wijze vastgestelde uniforme omrekeningsfactor geldt voor alle
      in gebruik zijnde RMO’s, inclusief die RMO’s waarvan de omrekeningsfactoren kleiner zijn dan 1,028 dan wel groter
      dan 1,035.
        - Indien de omrekeningsfactor voor een RMO kleiner is dan 1,028 dan wel groter is dan 1,035, wordt binnen één
      week na vaststelling van de vorige omrekeningsfactor opnieuw de omrekeningsfactor van deze RMO vastgesteld. Indien
      de omrekeningsfactor wederom kleiner is dan 1,028 dan wel groter is dan 1,035, wordt de RMO binnen 10 werkdagen
      aansluitende op de weegcontrole voor een keuring bij de erkende keurder worden aangeboden en wordt hiervan binnen
      één week melding gemaakt aan het COKZ.
        - De uniforme omrekeningsfactor wordt éénmaal per uitbetalingsperiode bepaald. Van elke in gebruik zijnde RMO wordt
      de datum, alsmede het tijdstip waarop de factorvaststelling plaatsvindt vastgelegd. De ontvanger van boerderijmelk
      draagt er zorg voor dat voor de weging van de RMO ten behoeve van de factorvaststelling een voor de betreffende
      ontvanger van boerderijmelk representatief aantal leveranties boerderijmelk wordt gehanteerd. Alle op de berekening
      van de uniforme omrekeningsfactor betrekking hebbende gegevens (datum, liters, kilogrammen en factoren) worden ten
      genoegen van het COKZ door de ontvanger van boerderijmelk op een duidelijke wijze geadministreerd.
        - De bepaling van het gewicht van de van veehouders ontvangen boerderijmelk geschiedt door, met behulp van de
      omrekeningsfactor voor alle RMO’s, het aantal liters, als bepaald in dit punt, om te rekenen in kg, waarbij
      hoeveelheden tot een halve kg naar beneden en hoeveelheden van een halve tot één kg naar boven worden afgerond.
      De gegevens waaruit de omrekeningsfactor wordt afgeleid, worden gedurende ten minste één jaar op het bedrijf van
      de ontvanger van boerderijmelk bewaard onder vermelding van de data van bepaling van de omrekeningsfactor en de
      gemiddelde temperatuur van de melk bij aankomst op de zuivelfabriek.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel6
  - number: '6.3'
    text: |-
      De tanksnelweger of weegbrug die wordt gebruikt voor de bepaling van de omrekeningsfactor voldoet aan de navolgende
      eisen: Een tanksnelweger met een afleeseenheid groter dan of gelijk aan 10 kg of de weegbrug, als bedoeld in lid
      2, onder A, is voorzien van de wettelijke kenmerken en voldoet aan de nauwkeurigheidseisen voor de ingebruikname
      van nieuwe weegwerktuigen, zoals bepaald bij of krachtens de [Metrologiewet][ref1]. Een tanksnelweger met een
      afleeseenheid kleiner dan 10 kg als bedoeld in lid 2, punt A is voorzien van de wettelijke kenmerken en voldoet
      aan de nauwkeurigheidseisen voor de keuring van reeds in gebruik zijnde weegwerktuigen, zoals is bepaald bij of
      krachtens de [Metrologiewet][ref2]. De weegbrug of de tanksnelweger wordt ten minste éénmaal per 2% jaar onderzocht
      door de erkende keurder. Indien tijdens dit onderzoek wordt geconstateerd dat niet aan de hiervoor genoemde
      nauwkeurigheidseisen wordt voldaan, vraagt de ontvanger van boerderijmelk binnen een maand nadat het resultaat
      van dit onderzoek schriftelijk aan hem is medegedeeld, een nieuw onderzoek aan bij de erkende keurder. Bezit de
      betrokken apparatuur bij dit onderzoek evenmin de vereiste nauwkeurigheid, dan is het gebruik hiervan voor de
      bepaling van de omrekeningsfactor niet langer toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019517
      [ref2]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019517
      - id: ref2
        bwb_id: BWBR0019517
  - number: '7.1'
    text: |-
      De chauffeur-monsternemer, die door de ontvanger van boerderijmelk wordt belast met het ontvangen en vervoeren van
      melk door middel van een RMO, is terzake kundig en voert de te verrichten handelingen uit overeenkomstig een door
      de ontvanger van boerderijmelk opgestelde instructie, die ter goedkeuring is voorgelegd aan het COKZ.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: '7.2'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor, dat de RMO en in het bijzonder de vloeistof meetinstallatie,
      waaronder wordt verstaan de melkmeter, de luchtafscheider, de zuigslang en het leidingwerk, in een deugdelijke
      staat verkeren. Tevens worden slangen, koppelingen, kleppen, de kraan van de boerderijtank en afdichtingen van de
      melkpomp op lekkage gecontroleerd. Eventuele gebreken worden onmiddellijk hersteld.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: '7.3'
    text: |-
      Een gewijzigde RMO is een RMO waarbij essentiële wijzigingen in de vloeistofmeetinstallatie zijn aangebracht; deze
      wijzigingen worden geadministreerd ten genoegen van het COKZ en hebben met name betrekking op:
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: 7.3.a
    text: de melkpomp, indien dit een verandering in de opzuigcapaciteit tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: 7.3.b
    text: |-
      de luchtafscheider, indien het een wijziging van het binnenwerk dan wel een vervanging van de gehele
      luchtafscheider betreft;
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: 7.3.c
    text: de melkinhoud, indien dit een wijziging van de basishoeveelheid tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: 7.3.d
    text: |-
      de melkmeter, indien het een verandering in de meter dan wel een vervanging van de meter betreft en voorzover het
      COKZ dit nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: '7.4'
    text: De ontvanger van boerderijmelk houdt zich aan de eventuele aanwijzingen die door het COKZ worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: '7.5'
    text: |-
      De ontvanger van boerderijmelk draagt er zorg voor dat aan het door het COKZ uit te voeren toezicht alle
      medewerking wordt verleend.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel7
  - number: '8'
    text: |-
      De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar voldoet aan de
      bepalingen bij deze verordening. Dit kwaliteitssysteem is vastgelegd in een door de ontvanger van boerderijmelk
      opgesteld handboek.
    url: https://wetten.overheid.nl/BWBR0025401/2009-01-17#Artikel8
