articles:
  - number: '1'
    text: |-
      In deze verordening wordt gebezigd de terminologie van de
      [Zuivelverordening 2005, Grondslag uitbetaling boerderijmelk][ref1]. Voorts wordt in deze verordening verstaan
      onder:






                  Metrologiewet:



      __REF001___________________________________________________________________________________________________________
      __________________________. (Stb. 2006, 137).




                  toezichthoudende instantie:


                  Een in Nederland gevestigde rechtspersoon die op grond van [artikel 27 van de Metrologiewet][ref3]
      door de Minister van Economische Zaken is aangewezen en tot taak heeft gekregen zorg te dragen voor de
      uitoefening van het toezicht op de naleving van het bepaalde bij of krachtens [hoofdstuk 5][ref4] en
      [artikel 39 van de Metrologiewet][ref5].




                  weegbrug:


                  een weegbrug die is voorzien van de wettelijke kenmerken en voldoet aan de nauwkeurigheidseisen voor de
      ingebruikname van nieuwe werktuigen, zoals bepaald bij of krachtens de [Metrologiewet][ref6].




                  tanksnelweger:


                  weegtank met een afleeseenheid groter dan of gelijk aan 10 kg die is voorzien van de wettelijke
      kenmerken en die voldoet aan de nauwkeurigheidseisen voor de ingebruikname van nieuwe weegwerktuigen, zoals bepaald
      bij of krachtens de [Metrologiewet][ref7] of een weegtank met een afleeseenheid kleiner dan 10 kg die is voorzien
      van wettelijke kenmerken en die voldoet aan de nauwkeurigheidseisen voor de keuring van reeds in gebruik zijnde
      weegwerktuigen, zoals bepaald bij of krachtens de [Metrologiewet][ref8].




                  typegoedkeuring:


                  keuring van de vloeistofmeetinstallatie overeenkomstig de [Metrologiewet][ref9].




                  erkende keurder :


                  erkenning verleend aan natuurlijk of rechtspersoon als bedoeld in
      [artikel 11, lid 1 van de Metrologiewet][ref10].




                  keuring:


                  een overeenstemmingsbeoordeling (keuring) van in gebruik genomen meetinstrumenten als bedoeld in
      [artikel 7 van de Metrologiewet][ref11].




                  herkeuring:


                  een overeenstemmingsbeoordeling (keuring) van een afgekeurde RMO.




                  weegcontrole:


                  Na beëindiging van de melkrit wordt het gewicht van ingenomen melk vastgesteld op een zuivelgekeurde
      weegbrug.




                  vloeistofmeetinstallatie:


                  een installatie voorzien van een pomp, vloeistofmeter en luchtafscheider voor de meting van de bij
      melkveehouders in te nemen hoeveelheid melk.


