  - number: 1.1.–
    text: |-
      *Natura 2000-vergunning:* vergunning als bedoeld in [artikel 2.7, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
    references:
