        artikel: '9'
  - number: 1.1.–
    text: |-
      *Verordening invasieve uitheemse soorten:* verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van
      de Europese Unie van 22 oktober 2014 betreffende de preventie en beheersing van de introductie en verspreiding van
      invasieve uitheemse soorten (PbEU L 317);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *voor stikstof gevoelige habitat:* voor stikstof gevoelig leefgebied voor vogelsoorten, natuurlijke habitat en
      habitat van soorten waarvoor een instandhoudingsdoelstelling geldt;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *wet:* [Wet natuurbescherming][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: 1.1.−
    text: '*woningbouwcluster:* cluster van ruimtelijk samenhangende woningbouwprojecten.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 2.1.1
    text: |-
      Voor de vaststelling of een project dat niet direct verband houdt met of nodig is voor het beheer van een Natura
      2000-gebied, afzonderlijk of in combinatie met plannen of andere projecten significante gevolgen kan hebben voor
      dat gebied door het veroorzaken van stikstofdepositie in het gebied op een voor stikstof gevoelige habitat, wordt
      de stikstofdepositie berekend met AERIUS Calculator versie 2023.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.1
  - number: 2.1.2
    text: AERIUS Calculator wordt beheerd onder verantwoordelijkheid van de Minister voor Natuur en Stikstof.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.1
  - number: '2.2'
    text: 'Deze paragraaf is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.a
    text: |-
      woningbouwprojecten, inclusief noodzakelijke en direct met het project samenhangende nutsvoorzieningen,
      waterhuishoudkundige maatregelen en infrastructuur en noodzakelijke voorzieningen ten behoeve van een goed woon-
      en leefklimaat;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.b
    text: |-
      voor zover het betreft wegen in beheer bij het Rijk: renovatieprojecten en projecten ter vergroting van de
      veiligheid van weggebruikers en anderen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.c
    text: gemelde PAS-projecten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.d
    text: rijksvastgoedprojecten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.e
    text: projecten van de Minister van Infrastructuur en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.f
    text: |-
      projecten die bijdragen aan het terugdringen van emissies van broeikasgassen of aan de transitie naar een
      klimaatneutrale energievoorziening, economie en samenleving;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.g
    text: projecten van de Minister van Defensie; en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
  - number: 2.2.h
    text: |-
      projecten waarvoor gedeputeerde staten van de provincie bevoegd gezag zijn voor de Natura 2000-vergunning of
      waarvoor de omgevingsvergunning op grond van [artikel 6.10a, eerste lid, van het Besluit omgevingsrecht][ref1] niet
      wordt verleend dan nadat gedeputeerde staten hebben verklaard dat zij daartegen geen bedenkingen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '6'
  - number: 2.3.1
    text: |-
      Een besluit waarbij een project wordt toegestaan, kan worden genomen met gebruikmaking van in AERIUS Register
      opgenomen depositieruimte. Daarbij wordt gebruikgemaakt van AERIUS Register versie 2023.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.3
  - number: 2.3.2
    text: AERIUS Register wordt beheerd door de Minister voor Natuur en Stikstof.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.3
  - number: 2.3.3
    text: |-
      In AERIUS Register kan ten hoogste 70% van de vermindering van stikstofdepositie op Natura 2000-gebieden als
      gevolg van een maatregel als bedoeld in [artikel 2.4][ref1] als depositieruimte worden opgenomen. De beperking
      tot ten hoogste 70% geldt niet voor depositieruimte die het gevolg is van een maatregel waarbij al eerder aan deze
      beperking toepassing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.3.4
    text: |-
      In AERIUS Register wordt onderscheid gemaakt tussen depositieruimte die beschikbaar is voor de categorieën
      van projecten, bedoeld in [artikel 2.2, onderdelen a tot en met h][ref1], waarbij voor de categorieën van
      projecten, bedoeld in artikel 2.2, onderdelen a, b en c, gezamenlijk depositieruimte beschikbaar is als bepaald
      in [artikel 2.4b][ref2]. Binnen elke categorie van projecten kan in AERIUS Register een nader onderscheid worden
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4.1
    text: |-
      Een maatregel als bedoeld in [artikel 2.3, derde lid][ref1], is in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
