  - number: 2.4.1.d
    text: |-
      een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming met of op verzoek van de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.1.e
    text: |-
      een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming met of op verzoek van de Minister van
      Infrastructuur en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.1.f
    text: |-
      een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming met of op verzoek van de Minister voor
      Klimaat en Energie;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.1.g
    text: |-
      een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming met of op verzoek van de Minister van
      Defensie; en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.1.h
    text: |-
      een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming met of op verzoek van provinciale
      staten of gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.2
    text: |-
      Op verzoek van burgemeester en wethouders, het dagelijks bestuur van een waterschap of gedeputeerde staten kan
      een door, onder verantwoordelijkheid van, na afstemming met of op verzoek van het bevoegde bestuursorgaan van de
      gemeente, het waterschap of de provincie getroffen maatregel, door de minister die het aangaat of gedeputeerde
      staten, worden aangemerkt als een getroffen maatregel als bedoeld in het eerste lid, onderdelen d tot en met h.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.3
    text: 'Onder een maatregel als bedoeld in het eerste lid, onderdelen d tot en met h, wordt in ieder geval begrepen:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.3.a
    text: |-
      de intrekking of wijziging van een toestemming voor een activiteit die stikstofdepositie veroorzaakt waardoor de
      stikstofdepositie door die activiteit vermindert; en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.3.b
    text: |-
      een wettelijk voorschrift of ander besluit dat leidt tot een vermindering van de stikstofdepositie door een
      toegestane activiteit.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.4
    text: 'Voor de toepassing van het derde lid, onder a, wordt verstaan onder toestemming:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.4.a
    text: een Natura 2000-vergunning of een omgevingsvergunning;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.4.b
    text: |-
      een ander op deze specifieke activiteit betrekking hebbend besluit voor het nemen waarvan de gevolgen van de
      activiteit voor de fysieke leefomgeving zijn beoordeeld;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.4.c
    text: |-
      als een vergunning of besluit als bedoeld onder a of b ontbreekt en als de activiteit rechtmatig werd uitgevoerd op
      de datum waarop artikel 6, derde lid, van de Habitatrichtlijn is gaan gelden voor het betrokken Natura 2000-gebied
      en sindsdien onafgebroken is uitgevoerd: de meest beperkende toestemming volgend uit:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.4.c.1°
    text: |-
      een omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2.4.4.c.2°
    text: |-
      een melding van een activiteit als bedoeld in [artikel 1.10 van het Activiteitenbesluit milieubeheer][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
  - number: 2.4.4.c.3°
    text: een ander op deze activiteit betrekking hebbend besluit of wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.5
    text: 'De ministers en gedeputeerde staten nemen depositieruimte alleen in AERIUS Register op:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.5.a
    text: |-
      als voor de maatregel een wettelijk voorschrift of een besluit nodig is: nadat dat voorschrift of besluit in
      werking is getreden;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.5.b
    text: voor zover de vermindering van stikstofdepositie met zekerheid en nauwkeurigheid kan worden vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.5.c
    text: als handhaving van de wettelijke voorschriften die verband houden met de maatregel voldoende is verzekerd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.6
    text: |-
      De minister die het aangaat of gedeputeerde staten geven elektronisch op een algemeen toegankelijke wijze kennis
      van:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.6.a
    text: |-
      hun voornemen om een wettelijk voorschrift of beleidsregel vast te stellen als een maatregel als bedoeld in het
      eerste lid, onderdelen d tot en met h;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4.6.b
    text: het opnemen van depositieruimte in AERIUS Register.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
  - number: 2.4a.1
    text: |-
      De minister voor Natuur en Stikstof draagt zorg voor het registreren in AERIUS Register van depositieruimte die
      ontstaat door:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
  - number: 2.4a.1.a
    text: |-
      een maatregel als bedoeld in [artikel 2.4, eerste lid, onderdelen a, b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4a.1.b
    text: |-
      een maatregel als bedoeld in [artikel 2.4, tweede lid][ref1], voor zover deze niet door een ander bestuursorgaan is
      aangemerkt als maatregel als bedoeld in artikel 2.4, eerste lid, onderdelen d tot en met h.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4a.2
    text: |-
      De minister die het aangaat draagt zorg voor het opnemen van depositieruimte in AERIUS Register die ontstaat door
      een maatregel als bedoeld in [artikel 2.4, eerste lid, onderdelen d tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4a.3
    text: |-
      Gedeputeerde staten dragen zorg voor het opnemen van depositieruimte in AERIUS Register die ontstaat door een
      maatregel als bedoeld in [artikel 2.4, eerste lid, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4a.4
    text: |-
      De ministers en gedeputeerde staten kunnen depositieruimte in AERIUS Register opnemen als depositieruimte waarvan
      ten hoogste 0,05 mol stikstof per hectare per jaar kan worden gebruikt in een besluit waarbij een project wordt
      toegestaan als bedoeld in [artikel 2.5, eerste lid][ref1], als de depositieruimte ontstaat door een maatregel als
      bedoeld in [artikel 2.4][ref2] die hen aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4b.1
    text: |-
      Depositieruimte die is verkregen door een maatregel als bedoeld in
      [artikel 2.4, eerste lid, onderdelen a en b][ref1], is alleen beschikbaar voor gemelde PAS-
      projecten, woningbouwprojecten en projecten ten aanzien van wegen in beheer bij het Rijk als bedoeld in
      [artikel 2.2, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4b.2
    text: |-
      Depositieruimte als bedoeld in het eerste lid is gedurende de eerste 17 weken na de datum waarop zij in AERIUS
      Register is opgenomen, alleen beschikbaar voor gemelde PAS-projecten.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4b.3
    text: |-
      In afwijking van het tweede lid kan de Minister voor Natuur en Stikstof, in overeenstemming met de Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en de Minister van Infrastructuur en Waterstaat, depositieruimte als
      bedoeld in het eerste lid ook beschikbaar stellen voor een woningbouwproject als:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4b.3.a
    text: |-
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties hem uiterlijk drie weken voor het opnemen van de
      depositieruimte in AERIUS Register heeft geïnformeerd dat voor het project een Natura 2000-vergunning of
      omgevingsvergunning:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4b.3.a.1°
    text: is aangevraagd; of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4b.3.a.2°
    text: |-
      naar alle waarschijnlijkheid zal worden aangevraagd voordat een nieuwe versie van AERIUS Register wordt aangewezen;
      en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4b.3.b
    text: hij daarbij een berekening op hexagoonniveau van de benodigde depositieruimte voor het project heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4b
  - number: 2.4c
    text: |-
      Depositieruimte die is verkregen door een maatregel als bedoeld in [artikel 2.4, eerste lid, onderdeel c][ref1], is
      alleen beschikbaar voor gemelde PAS-projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4c
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4d.1
    text: |-
      Depositieruimte die is verkregen door een maatregel getroffen door, onder verantwoordelijkheid van, na afstemming
      met of op verzoek van de volgende ministers is alleen beschikbaar voor de volgende projecten:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
  - number: 2.4d.1.a
    text: 'de Minister van Binnenlandse Zaken en Koninkrijksrelaties: rijksvastgoedprojecten en woningbouwprojecten;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
  - number: 2.4d.1.b
    text: 'de Minister van Infrastructuur en Waterstaat: projecten van die minister;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
  - number: 2.4d.1.c
    text: |-
      de Minister voor Klimaat en Energie: projecten die bijdragen aan het terugdringen van emissies van broeikasgassen
      of aan de transitie naar een klimaatneutrale energievoorziening, economie en samenleving;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
  - number: 2.4d.1.d
    text: 'de Minister van Defensie: projecten van die minister.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
  - number: 2.4d.2
    text: |-
      De minister die het aangaat kan de depositieruimte op verzoek van een andere minister of gedeputeerde staten ook
      beschikbaar stellen voor andere projecten als bedoeld in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4d
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4e.1
    text: |-
      Depositieruimte die is verkregen door een maatregel als bedoeld in [artikel 2.4, eerste lid, onderdeel h][ref1],
      is alleen beschikbaar voor projecten waarvoor gedeputeerde staten van de betrokken provincie
      bevoegd gezag zijn voor de Natura 2000-vergunning of waarvoor de omgevingsvergunning op grond van
      [artikel 6.10a, eerste lid, van het Besluit omgevingsrecht][ref2] niet wordt verleend dan nadat gedeputeerde staten
      van de betrokken provincie hebben verklaard dat zij daartegen geen bedenkingen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4e
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
  - number: 2.4e.2
    text: |-
      Gedeputeerde staten kunnen depositie als bedoeld in het eerste lid op verzoek van een minister of gedeputeerde
      staten van een andere provincie ook beschikbaar stellen voor andere projecten als bedoeld in [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4e
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4f
    text: |-
      In afwijking van de [artikelen 2.4b tot en met 2.4e][ref1] is depositieruimte ten aanzien waarvan
      [artikel 2.4a, vierde lid][ref2], is toegepast, beschikbaar voor alle in [artikel 2.2][ref3] bedoelde projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4f
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref3
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.5.1
    text: 'Depositieruimte kan, behalve in een Natura 2000-vergunning, ook worden toegedeeld in:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.1.a
    text: een omgevingsvergunning;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.1.b
    text: een tracébesluit;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.1.c
    text: een kavelbesluit.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.2
    text: Depositieruimte kan alleen worden toegedeeld in een besluit als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.3
    text: Depositieruimte wordt alleen toegedeeld voor zover zij eerder is gereserveerd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
  - number: 2.5.4
    text: |-
      Depositieruimte wordt voor onbepaalde tijd toegedeeld en kan alleen nogmaals worden gereserveerd of toegedeeld
      nadat zij weer beschikbaar is gekomen met toepassing van [artikel 2.10.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.6.1
    text: Reservering of toedeling van depositieruimte is mogelijk voor zover daarvoor depositieruimte beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.6
  - number: 2.6.2
    text: |-
      De beschikbare depositieruimte voor een hectare van een voor stikstof gevoelige habitat in een Natura 2000-gebied
      is de door de minister of gedeputeerde staten in AERIUS Register opgenomen depositieruimte voor die hectare,
      verminderd met de depositieruimte die met toepassing van [artikel 2.10][ref1] is afgeschreven of met toepassing van
      de [artikelen 2.7 tot en met 2.8d][ref2] is gereserveerd, en vermeerderd met de depositieruimte die met toepassing
      van artikel 2.10 is bijgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.6.3
    text: |-
      De depositieruimte die ten behoeve van een of meer projecten wordt gereserveerd of toegedeeld in verband met de
      toename van stikstofdepositie is niet groter dan de hoogste stikstofdepositie op een hectare van een voor stikstof
      gevoelige habitat in een Natura 2000-gebied die die projecten in een jaar kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.6
  - number: 2.7.1
    text: 'Stikstofdepositieruimte kan worden gereserveerd door:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.1.a
    text: |-
      het bevoegd gezag voor de Natura 2000-vergunning voor projecten als bedoeld in
      [artikel 2.4, eerste lid, onderdelen a tot en met g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.7.1.b
    text: de Minister van Infrastructuur en Waterstaat voor tracébesluiten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.1.c
    text: de Minister voor Klimaat en Energie voor kavelbesluiten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.1.d
    text: |-
      gedeputeerde staten voor andere projecten dan bedoeld in [artikel 2.4, eerste lid, onderdelen a, b en c][ref1],
      waarvoor zij het bevoegd gezag zijn voor de Natura 2000-vergunning of waarvoor de omgevingsvergunning op grond van
      [artikel 6.10a, eerste lid, van het Besluit omgevingsrecht][ref2] niet wordt verleend dan nadat gedeputeerde staten
      hebben verklaard dat zij daartegen geen bedenkingen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027464#Artikel6
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0027464
        artikel: '6'
  - number: 2.7.2
    text: |-
      Stikstofdepositieruimte voor projecten als bedoeld in [artikel 2.4, eerste lid, onderdelen a, b en c][ref1], ten
      aanzien waarvan [artikel 2.8d][ref2] is toegepast, kan worden gereserveerd nadat 17 weken zijn verstreken na de
      datum waarop de depositieruimte in AERIUS Register is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.7.3
    text: |-
      De in het tweede lid bedoelde reservering geschiedt in de volgorde waarin de aanvragen om de Natura 2000-vergunning
      zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.4
    text: |-
      Gedeputeerde staten reserveren alleen stikstofdepositieruimte voor een woningbouwproject als de woningen niet
      worden aangesloten op een distributienet voor aardgas.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.5
    text: 'Een reservering als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.5.a
    text: 'onderdelen a en d: vervalt als het bevoegd gezag een besluit heeft genomen op de aanvraag om de vergunning;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.5.b
    text: 'onderdeel b: vervalt als de Minister van Infrastructuur en Waterstaat het tracébesluit heeft vastgesteld;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.7.5.c
    text: 'onderdeel c: vervalt als de Minister voor Klimaat en Energie het kavelbesluit heeft genomen.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.7
  - number: 2.8a.1
    text: |-
      Op aanvraag van het college van burgemeester en wethouders kunnen gedeputeerde staten depositieruimte reserveren
      voor een woningbouwcluster in een gemeente.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
  - number: 2.8a.2
    text: |-
      Bij de aanvraag wordt een berekening verstrekt waaruit blijkt dat in AERIUS Register binnen de depositieruimte
      die is verkregen door een maatregel als bedoeld in [artikel 2.4, eerste lid, onderdeel d][ref1], voldoende
      depositieruimte beschikbaar is voor het cluster.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.8a.3
    text: |-
      Gedeputeerde staten beslissen over de reservering van depositieruimte voor woningbouwclusters in de volgorde waarin
      de aanvragen zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
  - number: 2.8a.4
    text: |-
      Gedeputeerde staten reserveren alleen depositieruimte voor een woningbouwcluster als de woningen niet worden
      aangesloten op een distributienet voor aardgas.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
  - number: 2.8a.5
    text: |-
      Een reservering voor een woningbouwcluster vervalt als en voor zover gedeputeerde staten depositieruimte reserveren
      voor de woningbouwprojecten in dat cluster, maar in elk geval als sinds de reservering twee jaar zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
  - number: 2.8a.6
    text: Gedeputeerde staten kunnen de termijn, bedoeld in het vijfde lid, eenmaal verlengen met ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8a
  - number: 2.8b.1
    text: |-
      Het bevoegd gezag reserveert alleen depositieruimte voor een gemeld PAS-project als is voldaan aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.a
    text: |-
      voor het project gold een meldingsplicht op grond van
      [artikel 8 van de Regeling programmatische aanpak stikstof][ref1] zoals dat luidde tot 1 januari 2017 of
      [artikel 2.7][ref2] van de Regeling natuurbescherming zoals dat luidde op 28 mei 2019;


      [ref1]: https://wetten.overheid.nl/BWBR0036688#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
    references:
      - id: ref1
        bwb_id: BWBR0036688
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.8b.1.b
    text: voor het project is in de periode van 1 juli 2015 tot 29 mei 2019 een melding gedaan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.c
    text: 'het project is in de periode van 1 juli 2015 tot 29 mei 2019:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.c.1°
    text: volledig gerealiseerd, waaronder wordt verstaan dat installaties, gebouwen en infrastructuur waren opgericht;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.c.2°
    text: |-
      nog niet volledig gerealiseerd, maar de initiatiefnemer heeft in die periode al wel een begin gemaakt met de
      realisatie, zoals aanleg of oprichting van installaties, gebouwen en infrastructuur; of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.c.3°
    text: |-
      nog niet begonnen, maar in die periode zijn al wel onomkeerbare en significante investeringsverplichtingen voor het
      project aangegaan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.d
    text: |-
      voor de activiteit waarop de melding betrekking heeft, is geen toereikende en onherroepelijke Natura 2000-
      vergunning of omgevingsvergunning verleend;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.e
    text: |-
      als de melding betrekking heeft op een wijziging van een project dat geheel of gedeeltelijk was gerealiseerd voor
      1 februari 2009 maar na de datum waarop artikel 6, derde lid, van de Habitatrichtlijn is gaan gelden voor het
      betrokken Natura 2000-gebied, dan is de totale stikstofdepositie die door het gewijzigde project wordt veroorzaakt
      op een voor stikstof gevoelige habitat in dat gebied niet groter dan de op het moment van de melding geldende
      grenswaarde, bedoeld in [artikel 2.12 van het Besluit natuurbescherming][ref1] zoals dat luidde op 28 mei 2019;


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '2'
  - number: 2.8b.1.f
    text: |-
      als het project substantieel afwijkt van het gemelde project, veroorzaakt het gewijzigde project niet meer
      stikstofdepositie op een of meer voor stikstof gevoelige habitats in Natura 2000-gebieden dan het gemelde project;
      en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.1.g
    text: de activiteit waarop het project betrekking heeft, wordt nog verricht.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8b.2
    text: Het eerste lid, onderdeel g, geldt niet als het project voldoet aan onderdeel c, onder 3°, van dat lid.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8b
  - number: 2.8c
    text: |-
      Het bevoegd gezag geeft bij het reserveren van depositieruimte voor gemelde PAS-projecten voorrang aan
      projecten ten aanzien waarvan het voor 13 januari 2022 een verzoek heeft ontvangen tot handhaving van
      [artikel 2.7, tweede lid, van de wet][ref1]. Als het na toepassing van de eerste zin noodzakelijk is om een keuze
      te maken tussen projecten, kiest het bevoegd gezag die combinatie van projecten die gezamenlijk voor een optimale
      benutting van de beschikbare depositieruimte zorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8c
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 2.8d.1
    text: |-
      Het bevoegd gezag kan voor gemelde PAS-projecten alleen depositieruimte reserveren als deze zijn geselecteerd met
      toepassing van [artikel 2.8c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8d
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.8d.2
    text: |-
      Het bevoegd gezag kan de ruimte reserveren na ontvangst van een aanvraag om een Natura 2000-vergunning of
      omgevingsvergunning voor dat project.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.8d
  - number: 2.10.1
    text: 'Het bevoegd gezag voor de Natura 2000-vergunning draagt zorg voor:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.1.a
    text: afschrijving in AERIUS Register van depositieruimte die aan dat project is toegedeeld;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.1.b
    text: |-
      doorhaling van gereserveerde depositieruimte als de betrokken vergunningaanvraag is ingetrokken of als een besluit
      is genomen op de betrokken aanvraag;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.1.c
    text: omzetting van toegedeelde in gereserveerde depositieruimte als de vergunning is vernietigd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.2
    text: 'Voor tracébesluiten draagt de Minister van Infrastructuur en Waterstaat zorg voor:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.2.a
    text: afschrijving in AERIUS Register van depositieruimte die hij heeft toegedeeld;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.2.b
    text: doorhaling van gereserveerde depositieruimte als hij het betrokken tracébesluit heeft vastgesteld;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.2.c
    text: omzetting van toegedeelde in gereserveerde depositieruimte als het tracébesluit is vernietigd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.3
    text: 'Voor kavelbesluiten draagt de Minister voor Klimaat en Energie zorg voor:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.3.a
    text: afschrijving in AERIUS Register van depositieruimte die hij heeft toegedeeld;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.3.b
    text: doorhaling van gereserveerde depositieruimte als hij het betrokken kavelbesluit heeft genomen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.3.c
    text: omzetting van toegedeelde in gereserveerde depositieruimte als het kavelbesluit is vernietigd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.4
    text: |-
      De in het eerste tot en met derde lid bedoelde bestuursorganen kunnen zorg dragen voor de bijschrijving in AERIUS
      Register van depositieruimte die is vrijgevallen wanneer:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.4.a
    text: het besluit waarin depositieruimte is toegedeeld, is ingetrokken voordat het project is aangevangen; of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.4.b
    text: de bouw- en aanlegfase waarvoor depositieruimte is toegedeeld, is afgerond.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.10.5
    text: |-
      De in het eerste tot en met derde lid bedoelde bestuursorganen dragen zorg voor de bijschrijving in AERIUS
      Register van depositieruimte die weer beschikbaar komt omdat het besluit waarin depositieruimte is toegedeeld, is
      ingetrokken of gewijzigd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.10
  - number: 2.11.1
    text: |-
      Dit artikel is van toepassing op de monitoring voor de omgevingswaarde voor stikstofdepositie voor 2030, bedoeld in
      [artikel 1.12a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 2.11.2
    text: De monitoring vindt plaats met behulp van AERIUS Monitor versie 2023.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.11
  - number: 3.1.1
    text: |-
      Van de verboden, bedoeld in [artikel 3.1 van de wet][ref1], wordt vrijstelling verleend aan grondgebruikers voor de
      bestrijding van Canadese ganzen, houtduiven, kauwen en zwarte kraaien.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.1.2
    text: |-
      Van de verboden, bedoeld in [artikel 3.10, eerste lid, onderdelen a en b, van de wet][ref1], wordt vrijstelling
      verleend aan grondgebruikers voor de bestrijding van konijnen en vossen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.1.3
    text: |-
      De vrijstellingen, bedoeld in het eerste en tweede lid, worden verleend voor de handelingen, bedoeld in
      [artikel 3.15, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.1.4
    text: |-
      De categorieën van schade, bedoeld in [artikel 3.15, zesde lid, onderdeel c, van de wet][ref1], zijn de categorieën
      van schade als bedoeld in de [artikelen 3.10, tweede lid, onderdeel b][ref2], en 3.15, zesde lid, onderdeel b, van
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.1.5
    text: |-
      De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien wordt voldaan aan de in de
      [artikelen 3.2 tot en met 3.4][ref1] gestelde voorschriften en beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      De handelingen waarvoor vrijstelling wordt verleend, vinden plaats overeenkomstig het faunabeheerplan, dat
      is vastgesteld overeenkomstig [artikel 3.12, eerste, derde tot en met zesde lid, van de wet][ref1] en dat is
      goedgekeurd overeenkomstig artikel 3.12, zevende lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.3.1
    text: |-
      Als middelen als bedoeld in de [artikelen 3.3, vijfde lid, onderdeel a][ref1], en
      [3.25, tweede lid, van de wet][ref2], die mogen worden gebruikt ter uitvoering van de vrijstelling, bedoeld in
      [artikel 3.1, eerste lid][ref3], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.1.a
    text: geweren;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.1.b
    text: honden, niet zijnde lange honden, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.1.c
    text: haviken, slechtvalken en woestijnbuizerds.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.2
    text: |-
      Als methoden als bedoeld in [artikel 3.3, vijfde lid, onderdeel a, van de wet][ref1], die mogen worden gebruikt ter
      uitvoering van de vrijstelling, bedoeld in [artikel 3.1, eerste lid][ref2], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.2.a
    text: het vangen of doden met gebruikmaking van niet-levende lokvogels;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.2.b
    text: het vangen of doden met gebruikmaking van een akoestisch middel waarmee lokgeluiden kunnen worden gemaakt, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.2.c
    text: het vangen of doden met gebruikmaking van lokvoer, dat niet vergiftigd of verdovend is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3
    text: |-
      Als middelen als bedoeld in [artikel 3.25, tweede lid, van de wet][ref1], die mogen worden gebruikt ter uitvoering
      van de vrijstelling, bedoeld in [artikel 3.1, tweede lid][ref2], worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.3.a
    text: geweren;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.b
    text: honden, niet zijnde lange honden;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.c
    text: haviken, slechtvalken en woestijnbuizerds;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.d
    text: fretten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.e
    text: kastvallen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.f
    text: vangkooien, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.3.3.g
    text: buidels.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.3
  - number: 3.4.1
    text: |-
      Ter uitvoering van de vrijstellingen, bedoeld in [artikel 3.1, eerste en tweede lid][ref1], worden:


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.1.a
    text: |-
      geen andere vangmiddelen of dodingsmiddelen gebruikt dan de in
      [artikel 3.3, eerste, onderscheidenlijk derde lid][ref1], genoemde middelen;


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.1.b
    text: |-
      aardhonden niet gebruikt voor het vangen of doden van vossen in holen in de periode van 1 maart tot en met
      31 augustus;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.4
  - number: 3.4.1.c
    text: |-
      de in [artikel 3.3, eerste en derde lid][ref1], aangewezen middelen, met uitzondering van fretten, kastvallen,
      vangkooien en buidels, niet gebruikt op zondagen, de nieuwjaarsdag, de tweede paasdag, de tweede pinksterdag, de
      eerste en tweede kerstdag, en de hemelvaartsdag.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: |-
      Ter uitvoering van de vrijstelling, bedoeld in [artikel 3.1, eerste lid][ref1], worden geen andere methoden
      gebruikt dan de in [artikel 3.3, tweede lid][ref2], genoemde methoden.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: '3.5'
    text: 'De jacht op de hierna genoemde wildsoorten is geopend gedurende de daarbij vermelde tijdvakken:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: 3.5.a
    text: 'fazantenhaan: van 15 oktober tot en met 31 januari;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: 3.5.b
    text: 'fazantenhen: van 15 oktober tot en met 31 december;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: 3.5.c
    text: |-
      haas: van 15 oktober tot en met 31 december in de provincies Drenthe, Flevoland, Friesland, Gelderland, Noord-
      Brabant, Noord-Holland, Overijssel, Zeeland en Zuid-Holland;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: 3.5.d
    text: 'houtduif: van 15 oktober tot en met 31 januari;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: 3.5.e
    text: 'wilde eend: van 15 augustus tot en met 31 januari.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.5
  - number: '3.6'
    text: |-
      Als organisaties als bedoeld in [artikel 3.2, eerste lid, onderdeel c, van het Besluit natuurbescherming](onbekend)
      worden aangewezen de organisaties, genoemd in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0038668
  - number: '3.7'
    text: |-
      Als examens als bedoeld in de [artikelen 3.28, tweede lid, onderdeel a][ref1], en
      [3.30, tweede lid, tweede volzin][ref2], in samenhang met artikel 3.28, tweede lid, onderdeel a, en 3.30, derde
      lid, van de wet worden erkend het jachtexamen, het examen voor het gebruik van jachtvogels en het examen voor het
      gebruik van eendenkooien die worden afgenomen door de Stichting Jachtexamens.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: '3.8'
    text: |-
      Als gelijkwaardig aan erkende examens als bedoeld in de
      [artikelen 3.28, tweede lid, onderdeel a, tweede zinsdeel][ref1], [3.30, tweede lid, tweede volzin][ref2], in
      samenhang met artikel 3.28, tweede lid, onderdeel a, tweede zinsdeel, en 3.30, derde lid, van de wet worden
      aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.8.a
    text: |-
      met betrekking tot het theoretische gedeelte: het theoretische gedeelte A en B van het jachtexamen, afgelegd
      vanaf 1 april 1984 op grond van het bepaalde bij of krachtens het Belgisch Koninklijk besluit van 28 februari 1977
      betreffende de afgifte van jachtverloven en jachtvergunningen, het Belgisch ministerieel besluit van 2 maart 1977
      tot inrichting van het jachtexamen en het Besluit van de Vlaamse Executieve van 29 mei 1991 tot inrichting van
      het jachtexamen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.8.b
    text: |-
      het jachtexamen, afgelegd op grond van het bepaalde bij of krachtens het Besluit van de Vlaamse regering van
      18 januari 1995 betreffende de organisatie van het jachtexamen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.8.c
    text: |-
      het jachtexamen, afgelegd op grond van het bepaalde bij of krachtens het Besluit van de Waalse regering van 2 april
      1998 tot organisatie van het jachtexamen in het Waalse Gewest;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.8.d
    text: |-
      met betrekking tot het theoretische gedeelte, het theoretische gedeelte A en B van het jachtexamen, afgelegd
      vanaf 1 april 1984 op grond van het bepaalde bij of krachtens het Belgisch Koninklijk besluit van 28 februari
      1977 betreffende de afgifte van jachtverloven en jachtvergunningen en het Besluit van de Brusselse Hoofdstedelijke
      Executieve van 21 januari 1991 tot organisatie van het jachtexamen in het Brusselse Hoofdstedelijk Gewest;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.8.e
    text: |-
      het jachtexamen, afgelegd op grond van het bepaalde bij of krachtens het gewijzigde Règlement grand-ducal van
      16 april 1991 betreffende de voorwaarden en modaliteiten met betrekking tot de bekwaamheidsproef voor het verlenen
      van een eerste jachtvergunning;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.8.f
    text: het jachtexamen, afgelegd op grond van het bepaalde bij of krachtens het Bundesjagdgesetz.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.8
  - number: 3.9.1
    text: |-
      De kennis, bedoeld in [artikel 3.18, eerste lid, onderdeel a, van het Besluit natuurbescherming](onbekend), wordt
      getoetst met:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a
    text: 'ten minste vijftig meerkeuzevragen, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a.1°
    text: |-
      vijftien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2°, 3° en 4°, van
      het Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a.2°
    text: |-
      tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5° en 6°, van het Besluit
      natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a.3°
    text: |-
      tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 7° en 8°, van het Besluit
      natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a.4°
    text: |-
      tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 9° en 10°, van het
      Besluit natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.a.5°
    text: |-
      vijf vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.b
    text: 'ten minste vijfentwintig meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.b.1°
    text: |-
      vijftien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het
      Besluit natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.1.b.2°
    text: |-
      tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 4°, 5°, 6°, 7°, 8°,
      9°, 10°, 11° en 12°, van het Besluit natuurbescherming](onbekend).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.2
    text: |-
      De schietvaardigheid en vakbekwaamheid, bedoeld in [artikel 3.18, eerste lid, onderdeel b, van het Besluit
      natuurbescherming](onbekend), worden getoetst door middel van:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.2.a
    text: het schieten op ten minste vijfentwintig kleiduiven met hagel;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.2.b
    text: |-
      het doen van ten minste vier schoten in twee series van twee schoten met groot-kaliber kogelgeweer op een doel
      gelegen op een afstand van ten minste vijftig meter, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.2.c
    text: |-
      het tonen van weidelijk gedrag en bekwaamheid in het veilig omgaan met een geweer in ten minste tien gesimuleerde
      situaties.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.3
    text: 'Een jachtexamen is uitsluitend met gunstig gevolg afgelegd, indien degene die het examen aflegt:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.3.a
    text: van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.3.b
    text: |-
      bij het schieten, bedoeld in het tweede lid, onderdeel a, ten minste achttien van de vijfentwintig kleiduiven heeft
      geraakt;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.3.c
    text: |-
      bij het doen van schoten, bedoeld in het tweede lid, onderdeel b, ten minste drie treffers heeft die zijn gelegen
      binnen een cirkel van vijftien centimeter, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.9.3.d
    text: |-
      weidelijk gedrag en bekwaamheid als bedoeld in het tweede lid, onderdeel c, naar het oordeel van de organisatie die
      het examen afneemt, heeft getoond.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.9
  - number: 3.10.1
    text: |-
      De kennis, bedoeld in [artikel 3.19, eerste lid, onderdeel a, van het Besluit natuurbescherming](onbekend), wordt
      getoetst met:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a
    text: 'ten minste vijftig meerkeuzevragen, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a.1°
    text: |-
      vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2° en 3°, van het
      Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a.2°
    text: |-
      vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5°, van het Besluit
      natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a.3°
    text: |-
      tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 7° en 8°, van het Besluit
      natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a.4°
    text: |-
      vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 10°, van het Besluit
      natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.a.5°
    text: |-
      vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.b
    text: 'ten minste twintig meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.b.1°
    text: |-
      tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het Besluit
      natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.1.b.2°
    text: |-
      tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 5°, 7°, 8°, 10°, 11°
      en 12°, van het Besluit natuurbescherming](onbekend).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.2
    text: |-
      De bekwaamheid, bedoeld in [artikel 3.19, eerste lid, onderdeel b, van het Besluit natuurbescherming](onbekend),
      wordt getoetst bij de beoordeling van twee stages van een jaar bij twee mentoren, aangewezen door de in
      [artikel 3.7][ref1] genoemde organisatie. De stages hebben tot doel om bekwaamheid te verwerven ten aanzien van
      de omgang met jachtvogels, het dragen en zeeg maken van jachtvogels, de verzorging van jachtvogels, het aanleggen
      van tuig, het doden van prooien en slachten van aasdieren, het aanleren van gewenst gedrag van jachtvogels, het
      voorkomen en afleren van ongewenst gedrag van jachtvogels, het zoeken en terugvangen van verloren jachtvogels, het
      beoordelen van de inzetbaarheid van jachtvogels, het toepassen van fretten en het gebruik van fluit, loer en balg.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.3.1
  - number: 3.10.3
    text: |-
      Een examen voor het gebruik van jachtvogels is uitsluitend met gunstig gevolg afgelegd indien degene die het examen
      aflegt:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.3.a
    text: van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.10.3.b
    text: |-
      voldoende bekwaamheid als bedoeld in het tweede lid heeft verworven, naar het oordeel van de organisatie die het
      examen afneemt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.10
  - number: 3.11.1
    text: 'De kennis, bedoeld in [artikel 3.22, eerste lid, van het Besluit natuurbescherming](onbekend), wordt getoetst met:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.a
    text: 'ten minste veertig meerkeuzevragen, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.a.1°
    text: |-
      vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2° en 3°, van het
      Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.a.2°
    text: |-
      vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5°, van het Besluit
      natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.a.3°
    text: |-
      vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 10°, van het Besluit
      natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.a.4°
    text: |-
      vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.b
    text: 'ten minste vijftien meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.b.1°
    text: |-
      tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het Besluit
      natuurbescherming](onbekend), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.1.b.2°
    text: |-
      vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 5°, 10°, 11° en 12°,
      van het Besluit natuurbescherming](onbekend).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.11.2
    text: |-
      Een examen voor het gebruik van eendenkooien is uitsluitend met gunstig gevolg afgelegd indien degene die het
      examen aflegt van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.11
  - number: 3.12.1
    text: |-
      Een jachtakte wordt aangevraagd door middel van een volledig ingevuld en ondertekend formulier, dat kosteloos bij
      de korpschef verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.12
  - number: 3.12.2
    text: |-
      Een valkeniersakte wordt aangevraagd door middel van een volledig ingevuld en ondertekend formulier, dat kosteloos
      bij de Minister van Landbouw, Natuur en Voedselkwaliteit verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.12
  - number: 3.12.3
    text: |-
      Een jachtakte of valkeniersakte kan in het geval, bedoeld in [artikel 3.28, vijfde lid, van de wet][ref1] namens
      de persoon voor wie de akte bestemd is, worden aangevraagd door een jachthouder die hem voor de jacht heeft
      uitgenodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.12.4
    text: |-
      Een aanvraag als bedoeld in het eerste of tweede lid gaat vergezeld van twee goed gelijkende pasfoto's van degene
      voor wie de akte bestemd is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.12
  - number: 3.13.1
    text: |-
      Het model van de jachtakte, bedoeld in [artikel 3.28, zevende lid, van de wet][ref1], wordt gevormd door een
      modelformulier, dat door de korpschef wordt gewaarmerkt door middel van een stempelafdruk en een handtekening voor
      de periode waarvoor de jachtakte wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.13.2
    text: |-
      Als modelformulier als bedoeld in het eerste lid wordt vastgesteld het modelformulier, opgenomen in
      [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0038668
  - number: 3.13.3
    text: |-
      De jachtakte wordt voorzien van de pasfoto van degene voor wie de akte is bestemd. Deze foto wordt door de
      korpschef door middel van een stempelafdruk gewaarmerkt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.13
  - number: 3.13.4
    text: |-
      Als model van de valkeniersakte, bedoeld in [artikel 3.30, tweede lid, van de wet][ref1], in samenhang met
      [artikel 3.28, zevende lid, van de wet][ref2], wordt vastgesteld het model, opgenomen in bijlage 4.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.13.5
    text: |-
      In afwijking van het tweede lid wordt voor de periode van 1 april 2016
      tot en met 31 maart 2017 vastgesteld het modelformulier, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____________, zoals deze gold op 31 december 2016, voorzien van een zegel als bedoeld in
      [artikel 2 van die regeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013474#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013474#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0013474
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013474
        artikel: '2'
  - number: '3.14'
    text: |-
      Als voorschriften als bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.14.a
    text: |-
      de artikelen 4, eerste lid, eerste volzin, tweede lid, eerste volzin, derde en vierde lid, 5, eerste en vierde lid,
      eerste volzin, 6, derde lid, 8, eerste lid, in samenhang met het vijfde lid, en 9, eerste, vierde en vijfde lid van
      de CITES-basisverordening;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.14
  - number: 3.14.b
    text: |-
      artikel 3, eerste lid, van [verordening (EG) nr. 1007/2009](32009R1007) van het Europees Parlement en de Raad van
      16 september 2009 betreffende de handel in zeehondenproducten (PbEU 2009, L 286), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.14
  - number: 3.14.c
    text: |-
      artikel 3, eerste lid, van [verordening (EEG) nr. 3254/91](31991R3254) van de Raad van 4 november 1991 houdende
      een verbod op het gebruik van de wildklem in de Gemeenschap en op het binnenbrengen in de Gemeenschap van pelzen en
      produkten die vervaardigd zijn van bepaalde in het wild levende diersoorten uit landen waar gebruik wordt gemaakt
      van de wildklem of andere vangmethoden die niet stroken met de internationale normen voor humane vangst met behulp
      van vallen (PbEG 1991, L 308).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.14
  - number: 3.15.1
    text: |-
      Het is verboden in strijd te handelen met de voorwaarden en vereisten, bedoeld in artikel 11, derde lid, van de
      CITES-basisverordening.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.15.2
    text: |-
      Ten aanzien van een plant van een in bijlage 5 genoemde soort kan degene die de plant uitvoert een fytosanitair
      certificaat aanvragen bij de Minister van Landbouw, Natuur en Voedselkwaliteit. Het fytosanitaire certificaat
      voldoet aan artikel 17, tweede lid, van de CITES-uitvoeringsverordening.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.15.3
    text: |-
      In plaats van een uitvoervergunning als bedoeld in artikel 5, eerste lid, van de CITES-basisverordening wordt
      aanvaard een fytosanitair certificaat dat is verleend overeenkomstig het tweede lid of dat is afgegeven door een
      bevoegde administratieve instantie van een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.15.4
    text: |-
      De etiketten, bedoeld in de artikelen 52, eerste lid, en 66, zesde lid, van de CITES-uitvoeringsverordening, worden
      aangevraagd bij de minister. Een aanvraag wordt gedaan voor een minimum van 100 etiketten. De aanvrager zendt
      ongebruikte etiketten onverwijld terug naar de minister.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.15.5
    text: |-
      Het is verboden de producten, genoemd in de bijlage bij [richtlijn 83/129/EEG](31983L0129) van de Raad van 28 maart
      1983 betreffende de invoer in de Lid-Staten van huiden van bepaalde zeehondenjongen en daarvan vervaardigde
      produkten (PbEG 1983, L 91), voor handelsdoeleinden binnen Nederland te brengen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.15.6
    text: |-
      Het verbod, bedoeld in het vijfde lid, geldt niet voor producten die afkomstig zijn van de traditionele jacht van
      de Eskimobevolking.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.15
  - number: 3.16.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.2, eerste lid][ref1], en
      [3.6, eerste lid, van de wet][ref2], voor het verkopen, vervoeren voor verkoop, onder zich hebben voor verkoop of
      ten verkoop aanbieden van een dode vogel of een ander dood dier, of producten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.16.2
    text: |-
      De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien de vogel of het andere dier aantoonbaar
      is verkregen overeenkomstig het bepaalde bij en krachtens de [artikelen 3.15, tweede of vierde lid][ref1],
      [3.16, tweede of vierde lid][ref2], [3.17, eerste lid][ref3], of [3.18, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.17.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.1, eerste lid][ref1],
      [3.2, zesde lid][ref2], [3.5, eerste lid][ref3], en [3.6, tweede lid][ref4], van de wet voor het opzettelijk vangen
      en onder zich hebben van een zieke of gewonde vogel of een ziek of gewond ander dier, met het oog op het vervoeren
      van de vogel of het dier met een dierenambulance.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.17.2
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.5, eerste lid][ref1], en
      [3.6, tweede lid][ref2], van de wet voor het opzettelijk vangen en onder zich hebben van een zieke of gewonde
      bruinvis, gewone dolfijn, tuimelaar, witflankdolfijn of witsnuitdolfijn, met het oog op het vervoeren van het dier,
      anders dan met een dierenambulance.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.17.3
    text: |-
      De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien de vogel of het andere
      dier binnen twaalf uur wordt overgedragen aan personen of instanties die krachtens de [wet][ref1] en de
      [Wet dieren][ref2] gerechtigd zijn uit het wild afkomstige dieren onder zich te hebben voor opvang en verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
      - id: ref2
        bwb_id: BWBR0030250
  - number: 3.18.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.2, zesde lid, van de wet][ref1],
      voor het onder zich hebben en vervoeren van een dode vogel met het oog op preparatie daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.18.2
    text: 'De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
  - number: 3.18.2.a
    text: de vogel kennelijk is gestorven buiten schuld of medeweten van degene die zich de vogel heeft toegeëigend, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
  - number: 3.18.2.b
    text: 'degene die de vogel onder zich heeft:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
  - number: 3.18.2.b.1°
    text: de vogel binnen drie dagen aflevert bij een preparateur voor preparatie, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
  - number: 3.18.2.b.2°
    text: |-
      de vogel zelf prepareert en voldoet aan [artikel 3.26 van het Besluit natuurbescherming][ref1] en
      [artikel 3.23][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.18.3
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.2, zesde lid, van de wet][ref1],
      voor het onder zich hebben van een geprepareerde vogel.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.18.4
    text: |-
      De vrijstelling, bedoeld in het derde lid, geldt uitsluitend, indien de vogel is gemerkt met een merkteken
      overeenkomstig het bepaalde in [artikel 3.26, tweede lid, onderdeel b, van het Besluit natuurbescherming][ref1] en
      [artikel 3.23, vierde en vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.18.5
    text: |-
      Onverminderd het tweede en vierde lid, gelden de vrijstellingen, bedoeld in het eerste en derde lid, uitsluitend
      indien de vogel aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in
      Nederland is gebracht of verkregen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18
  - number: 3.18a.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.2, eerste en zesde lid, van de wet][ref1], voor het verkopen, vervoeren, onder zich hebben of ten
      verkoop aanbieden van een dode vogel die vanuit een ander land Nederland is binnen gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.18a.2
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.6, eerste en tweede lid, van de wet][ref1], voor het onder zich hebben, vervoeren, verhandelen, ruilen
      of te koop of te ruil aanbieden van een dood dier of een dode plant die vanuit een ander land Nederland is binnen
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.18a.3
    text: 'De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
  - number: 3.18a.3.a
    text: |-
      de vogel, het dier of de plant aantoonbaar is verkregen buiten Nederland overeenkomstig de aldaar geldende
      regelgeving, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
  - number: 3.18a.3.b
    text: |-
      ingeval de vogel, het dier of de plant behoort tot een soort, genoemd in bijlage A, B, C of D van de CITES-
      basisverordening, de vogel, het dier of de plant aantoonbaar met inachtneming van de CITES-basisverordening en
      CITES-uitvoeringsverordening in Nederland is gebracht of verkregen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
  - number: 3.18a.4
    text: |-
      De vrijstelling, bedoeld in het tweede lid, is niet van toepassing ten aanzien van botten en daarvan of daarmee
      vervaardigde producten van de tijger (Panthera tigris).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.18a
  - number: 3.19.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.24, eerste, tweede en derde lid, van het Besluit natuurbescherming][ref1], voor onderscheidenlijk:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.19.1.a
    text: |-
      het onder zich hebben of verhandelen van een aantoonbaar gefokte vogel van een soort als bedoeld in artikel 1
      van de Vogelrichtlijn, die niet is genoemd in bijlage A, B, C of D bij de CITES-basisverordening, of producten of
      eieren daarvan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.1.b
    text: |-
      het onder zich hebben van een aantoonbaar gefokte vogel van een soort die is genoemd in bijlage A, B, C of D bij de
      CITES-basisverordening, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.1.c
    text: |-
      het verhandelen van een aantoonbaar gefokte vogel van een soort die is genoemd in bijlage C of D bij de CITES-
      basisverordening, of producten of eieren daarvan.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.2
    text: |-
      Ingeval de vogel behoort of mede behoort tot een soort als bedoeld in artikel 1 van de Vogelrichtlijn, geldt de
      vrijstelling, bedoeld in het eerste lid, uitsluitend, indien:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.2.a
    text: 'de vogel is voorzien van:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.2.a.1°
    text: |-
      een gesloten pootring, overeenkomstig het bepaalde in [artikel 3.28 van het Besluit natuurbescherming][ref1] en
      [artikel 3.25][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.19.2.a.2°
    text: |-
      een gesloten pootring die, of een ander merkteken dat aantoonbaar rechtmatig is afgegeven door een overheidsorgaan
      van een andere staat dan Nederland, of een door een overheidsorgaan van een andere staat dan Nederland erkende
      organisatie, in overeenstemming met de wettelijke eisen van de betreffende staat, onderscheidenlijk indien het
      product of ei van een dergelijke vogel afkomstig is, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.2.a.3°
    text: |-
      ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D, bij de CITES-basisverordening, een
      microchiptransponder overeenkomstig artikel 66, tweede lid, van de CITES-uitvoeringsverordening, tenzij de minister
      een verklaring heeft afgegeven dat een microchiptransponder wegens lichamelijke kenmerken van de betrokken dieren
      aantoonbaar niet veilig kan worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.2.b
    text: |-
      ingeval het een levende vogel betreft die behoort tot een soort, genoemd in bijlage A bij de CITES-
      basisverordening, is voldaan aan het bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref1] en het
      bepaalde in [artikel 3.24][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.19.2.c
    text: |-
      ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D van de CITES-basisverordening, de vogel
      aantoonbaar met inachtneming van de CITES-basisverordening en CITES-uitvoeringsverordening in Nederland is gebracht
      of verkregen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3
    text: |-
      Ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D, bij de CITES-basisverordening, niet
      zijnde een soort als bedoeld in artikel 1 van de Vogelrichtlijn, geldt de vrijstelling, bedoeld in het eerste lid,
      uitsluitend indien:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.a
    text: |-
      ingeval het een levende gefokte vogel betreft, behorende tot een soort, genoemd in bijlage A bij de CITES-
      basisverordening:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.a.1°
    text: |-
      ten aanzien van de vogel is voldaan aan het tweede lid, onderdeel a, onder 1°, 2° of 3°, onderscheidenlijk indien
      het product of ei van een dergelijke vogel afkomstig is;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.a.2°
    text: is voldaan aan het bepaalde in artikel 3.27 van het Besluit natuurbescherming en het bepaalde in artikel 3.24, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.a.3°
    text: |-
      de vogel aantoonbaar met inachtneming van de CITES-basisverordening en CITES-uitvoeringsverordening in Nederland is
      gebracht of verkregen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.b
    text: |-
      ingeval het een dode vogel, een product of een ei van een vogel betreft, behorende tot een soort, genoemd in
      bijlage A bij de CITES-basisverordening, de vogel, het product of het ei aantoonbaar met inachtneming van de CITES-
      basisverordening en de CITES-uitvoeringsverordening in Nederland is gebracht of verkregen, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.c
    text: 'ingeval de vogel behoort tot een soort, genoemd in bijlage B, C of D, bij de CITES-basisverordening:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.c.1°
    text: |-
      de vogel aantoonbaar is gefokt of het product of het ei van een dergelijke vogel afkomstig is of de vogel, het
      product of het ei aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in
      Nederland zijn gebracht of verkregen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.3.c.2°
    text: |-
      ingeval de vogel behoort tot een soort, genoemd in bijlage B bij de CITES-basisverordening, is voldaan aan het
      bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref1] en het bepaalde in [artikel 3.24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.19.4
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op het onder zich hebben in het veld van een
      levende vogel van een in artikel 1 van de Vogelrichtlijn bedoelde soort:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.4.a
    text: van het geslacht Cygnus, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
  - number: 3.19.4.b
    text: |-
      van de orde roofvogels of uilen, tenzij degene die de vogel onder zich heeft, overeenkomstig
      [artikel 3.30, eerste lid, van de wet][ref1] gerechtigd is de vogel te gebruiken als jachtvogel.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.19.5
    text: |-
      De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op het onder zich hebben van een
      levende havik. Een ontheffing als bedoeld in [artikel 3.40 van de wet][ref1] van het verbod, bedoeld in
      [artikel 3.24, eerste of tweede lid, van het Besluit natuurbescherming][ref2], op het onder zich hebben,
      onderscheidenlijk verhandelen van een gefokte havik, wordt slechts verleend indien de aanvrager door het overleggen
      van DNA-fingerprints van zowel de oudervogels als de jonge vogel het bewijs levert dat de havik in gevangenschap
      is gefokt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.19
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.20.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.24, tweede lid, van het Besluit natuurbescherming][ref1], voor het onder zich hebben van:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.20.1.a
    text: |-
      een dood gewerveld dier, een ongewerveld dier of een plant, behorende tot een soort, genoemd in bijlage A bij de
      CITES-basisverordening, of producten of eieren daarvan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.1.b
    text: |-
      een levend, aantoonbaar gefokt gewerveld dier, niet zijnde een vogel als bedoeld in artikel 3.19, eerste lid,
      onderdeel a of b, van een soort, genoemd in bijlage A bij de CITES-basisverordening, of producten of eieren
      daarvan, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.1.c
    text: |-
      een dier, niet zijnde een vogel als bedoeld in artikel 1 van de Vogelrichtlijn, of een plant van een soort, genoemd
      in bijlage B, C of D bij de CITES-basisverordening, of producten of eieren daarvan.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.2
    text: 'De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.2.a
    text: 'het dier of de plant:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.2.a.1°
    text: |-
      aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in Nederland is
      gebracht of verkregen, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.2.a.2°
    text: |-
      als het een ongewerveld dier of een plant betreft, aantoonbaar in Nederland is gefokt, onderscheidenlijk
      gekweekt, of, als het een levend, gefokt gewerveld dier van een soort, genoemd in bijlage A bij de CITES-
      basisverordening, betreft, is voorzien van een microchiptransponder overeenkomstig artikel 66, derde lid, van de
      CITES-uitvoeringsverordening, tenzij de minister een verklaring heeft afgegeven dat een microchiptransponder wegens
      lichamelijke kenmerken van de betrokken dieren aantoonbaar niet veilig kan worden aangebracht, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.2.b
    text: |-
      is voldaan aan het bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref1] en het bepaalde in
      [artikel 3.24][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.20.2.c
    text: |-
      als het een levend uit het wild afkomstig dier betreft van een soort, genoemd in bijlage
      B bij de CITES-verordening, ten aanzien van het dier een administratie wordt bijgehouden.
      [Artikel 3.27, derde lid, van het Besluit natuurbescherming][ref1] en [artikel 3.24][ref2] zijn van toepassing op
      de administratie, bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.20.3
    text: |-
      De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van botten
      en daarvan of daarmee vervaardigde producten van de tijger (Panthera tigris) en hoorns en daarvan of daarmee
      vervaardigde producten van de soorten van de familie neushoorns (Rhinocerotidea).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.4
    text: |-
      De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel b, is niet van toepassing ten aanzien van dieren
      van soorten behorende tot de orde van de primaten (Primates) of de familie van de katachtigen (Felidae).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5
    text: |-
      De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel c, is niet van toepassing ten aanzien van levende
      dieren van de soorten:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.a
    text: Bengaalse kat (Prionailurus bengalensis);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.b
    text: Canadese lynx (Lynx canadensis);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.c
    text: caracal (Caracal caracal);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.d
    text: poema (Puma concolor);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.e
    text: roestkat (Prionailurus rubiginosus);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.f
    text: rode lynx (Lynx rufus);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.g
    text: jagoearoendi of otterkat (Herpailurus yaguarondi);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.h
    text: leeuw (Panthera leo);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.i
    text: fretkat (Cryptoprocta ferox), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.5.j
    text: behorende tot de orde van de primaten (Primates).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
  - number: 3.20.6
    text: |-
      Onverminderd het tweede lid, geldt de vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel c, ten
      aanzien van de aal (Anguilla anguilla) uitsluitend indien aantoonbaar is voldaan aan het bij of krachtens de
      [Visserijwet 1963][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: 3.21.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.24, derde lid, van het Besluit
      natuurbescherming](onbekend), voor het verhandelen van een dier, niet zijnde een vogel als bedoeld in artikel 1
      van de Vogelrichtlijn, of een plant van een soort, genoemd in bijlage C of D bij de CITES-basisverordening, of
      producten of eieren daarvan.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.21
  - number: 3.21.2
    text: 'De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien het dier of de plant aantoonbaar:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.21
  - number: 3.21.2.a
    text: |-
      in Nederland is gebracht of verkregen met inachtneming van de CITES-basisverordening en de CITES-
      uitvoeringsverordening, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.21
  - number: 3.21.2.b
    text: in Nederland is gefokt, onderscheidenlijk gekweekt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.21
  - number: 3.21a
    text: |-
      Onverminderd [artikel 3.2, eerste en zesde lid, van de wet][ref1], wordt aan een ieder vrijstelling verleend van de
      verboden, bedoeld in [artikel 3.24, tweede en derde lid, van het Besluit natuurbescherming][ref2], voor het onder
      zich hebben of verhandelen van een uit het wild afkomstige vogel, behorende tot een soort als bedoeld in artikel 1
      van de Vogelrichtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.21a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.22.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.25 van het Besluit natuurbescherming][ref1], voor het onder zich hebben of verhandelen van een dood
      dier.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.22.2
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.25 van het Besluit natuurbescherming][ref1], voor het onder zich hebben van een levend dier.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.22.3
    text: 'De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien het dier:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
  - number: 3.22.3.a
    text: 'aantoonbaar is verkregen:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
  - number: 3.22.3.a.1°
    text: |-
      in Nederland overeenkomstig een ontheffing of vrijstelling als bedoeld in de [artikelen 3.10, tweede lid][ref1],
      in samenhang met [artikel 3.8, eerste of tweede lid, van de wet][ref2], een vrijstelling als bedoeld
      in de [artikelen 3.15, tweede of vierde lid][ref3], of [3.16, tweede of vierde lid, van de wet][ref4],
      een ontheffing als bedoeld in [3.17, eerste lid, van de wet][ref5], een opdracht als bedoeld in
      [artikel 3.18, eerste lid, van de wet ][ref6]of op grond van [artikel 3.20, eerste lid, van de wet][ref7], of


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.22.3.a.2°
    text: buiten Nederland overeenkomstig de aldaar geldende regelgeving, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
  - number: 3.22.3.b
    text: |-
      indien het een dood dier betreft, aantoonbaar in het wild is gestorven buiten schuld of medeweten van degene die
      zich het dier heeft toegeëigend.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22
  - number: 3.22a.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1] voor het opzettelijk vangen van een ziek of gewond
      dier, met uitzondering van de gewone zeehond of grijze zeehond, met het oog op het vervoeren van het dier met een
      dierenambulance.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.22a.2
    text: |-
      Aan personen die in dienst zijn van, of als opdrachtnemer of als vrijwilliger actief zijn voor een
      van de organisaties, bedoeld in het vijfde lid, wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1] voor het opzettelijk vangen van een zieke of gewonde
      gewone zeehond of grijze zeehond, met het oog op het vervoeren van het dier, met een dierenambulance of anders dan
      met een dierenambulance.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.22a.3
    text: |-
      De in het tweede lid bedoelde personen zijn werkzaam binnen het werkgebied van de in het vijfde lid bedoelde
      organisatie, weergegeven op de kaart in [bijlage 5a][ref1] bij deze regeling, en beschikken aantoonbaar over:


      [ref1]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0038668
  - number: 3.22a.3.a
    text: 'kennis van:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.3.a.1°
    text: gewone en grijze zeehonden en hun leefomgeving;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.3.a.2°
    text: het beheer van de gewone en grijze zeehond;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.3.a.3°
    text: de belangrijkste wettelijke voorschriften op het terrein van de natuurbescherming en dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.3.a.4°
    text: het gedrag van gewone en grijze zeehonden bij ziekte of verwonding; en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.3.b
    text: bekwaamheid in de omgang met de gewone en grijze zeehond.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.4
    text: 'De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.4.a
    text: |-
      het dier binnen twaalf uur wordt overgedragen aan personen of instanties die krachtens de wet en de Wet dieren
      gerechtigd zijn uit het wild afkomstige dieren onder zich te hebben en te verzorgen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.4.b
    text: |-
      indien het een zieke of gewonde ree, edelhert, damhert of wild zwijn betreft, vóór het vervoer melding is gemaakt
      bij de meldkamer van de politie van het aantal, de vindplaats en de soort zieke of gewonde dieren en het vervoer
      geschiedt door een door de politie aangewezen vervoerder.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.5
    text: |-
      De vrijstelling, bedoeld in het tweede lid, geldt uitsluitend, indien het dier binnen twaalf uur wordt overgedragen
      aan één van de volgende organisaties, indien zij bij de beslissing over het vangen, met het oog op het vervoeren
      van het dier, het Handelingskader zeehondenopvang, opgenomen in [bijlage 5b][ref1], volgen, en indien zij krachtens
      de [Wet dieren][ref2] gerechtigd zijn uit het wild afkomstige gewone zeehonden of grijze zeehonden onder zich te
      hebben en te verzorgen:


      [ref1]: https://wetten.overheid.nl/BWBR0038668
      [ref2]: https://wetten.overheid.nl/BWBR0030250
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
    references:
      - id: ref1
        bwb_id: BWBR0038668
      - id: ref2
        bwb_id: BWBR0030250
  - number: 3.22a.5.a
    text: Stichting A Seal Centrum voor Zeezoogdierenzorg te Stellendam;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.5.b
    text: Stichting Texels Museum (Ecomare) op Texel;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.5.c
    text: Stichting Zeehondencentrum Pieterburen te Pieterburen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.5.d
    text: Stichting Zeehondenopvang Eemsdelta te Uithuizen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.22a.5.e
    text: Stichting Zeehondenopvang Terschelling op West-Terschelling.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.22a
  - number: 3.23.1
    text: |-
      De gegevens, bedoeld in [artikel 3.26, derde lid, onderdeel a, van het Besluit natuurbescherming][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.23.1.a
    text: de soort waartoe de ter preparatie aangeboden vogel behoort;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.b
    text: het aantal ter preparatie aangeboden vogels;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.c
    text: de datum van ontvangst en aflevering van de ter preparatie aangeboden vogel;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.d
    text: de kennelijke doodsoorzaak van de ter preparatie aangeboden vogel;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.e
    text: de naam en het adres van degenen van wie de ter preparatie aangeboden vogel is ontvangen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.f
    text: de naam en het adres van degenen aan wie de ter preparatie aangeboden vogel is afgeleverd, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.1.g
    text: |-
      het nummer van het op de ter preparatie aangeboden vogel overeenkomstig
      [artikel 3.26, tweede lid, onderdeel b, van het Besluit natuurbescherming][ref1], aangebrachte merkteken.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.23.2
    text: |-
      Degene die de vogel prepareert, verstrekt de gegevens, bedoeld in het eerste lid, aan de minister door middel van
      een elektronische melding in een door de minister aangeboden systeem.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.3
    text: |-
      Degene die de vogel prepareert geeft een wijziging in gegevens, bedoeld in het eerste lid, onderdeel e, door aan de
      minister. Het tweede lid is van overeenkomstige toepassing op het doorgeven van een wijziging.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.23.4
    text: |-
      Een merkteken als bedoeld in [artikel 3.26, derde lid, onderdeel b, van het Besluit natuurbescherming][ref1] wordt
      door de minister verstrekt en is voorzien van de letters NL, gevolgd door de letters LNV en een uniek nummer.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.23.5
    text: |-
      Een merkteken als bedoeld in het vierde lid wordt aangevraagd door middel van een volledig ingevuld en ondertekend
      formulier, dat kosteloos bij de minister verkrijgbaar is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.23
  - number: 3.24.1
    text: |-
      De administratie, bedoeld in [artikel 3.27, eerste lid, van het Besluit natuurbescherming][ref1], bevat de volgende
      gegevens over de aldaar bedoelde dieren en planten:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.24.1.a
    text: de wetenschappelijke soortnaam van het dier of de plant en het aantal dieren of planten van die soort;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.b
    text: de datum en de plaats van verkrijging van het dier of de plant;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.c
    text: de naam, het adres en het land van de leverancier van wie het dier of de plant is verkregen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.d
    text: het land van herkomst van het dier of de plant, indien dit afwijkt van onderdeel c;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.e
    text: het nummer van het bij de verkrijging van het dier of de plant behorende CITES-document;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.f
    text: de datum en de plaats van vervreemding van het dier of de plant;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.g
    text: de naam, het adres en het land van de afnemer van het dier of de plant;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.h
    text: het nummer van het bij de vervreemding van het dier of de plant behorende CITES-document;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.i
    text: de datum van de geboorte en het aantal nakomelingen van een dier;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.j
    text: gegevens over de soort en de code van de merktekens;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.k
    text: de datum van de aanbrenging van merktekens aan het dier of de plant;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.1.l
    text: de datum en de plaats van sterfte van het dier of de plant.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.2
    text: |-
      De administratie, bedoeld in [artikel 3.27, eerste lid, van het Besluit natuurbescherming][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.24.2.a
    text: is op naam gesteld, volledig en voorzien van een logische indeling en opeenvolgende nummering;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.2.b
    text: |-
      wordt gevoerd op een wijze dat controle daarvan direct mogelijk is en de gegevens, bedoeld in het eerste lid,
      daaruit duidelijk blijken, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.2.c
    text: |-
      wordt bewaard met alle aantekeningen en bescheiden, waaronder nota's, vrachtbrieven en andere bewijsmiddelen,
      boeken, registers of andere hulpmiddelen, die betrekking hebben op het onder zich hebben en verhandelen van dieren
      op planten als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.24.3
    text: |-
      De gegevens, bedoeld in het eerste lid, en de documenten, bedoeld in het tweede lid, worden bewaard gedurende ten
      minste drie jaren na de datum van de laatste in de administratie aangebrachte wijziging of aanvulling.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.24
  - number: 3.25.1
    text: |-
      Voor de soorten, genoemd in bijlage 6, heeft een pootring als bedoeld in
      [artikel 3.28, eerste lid, van het Besluit natuurbescherming][ref1] een maximale diameter als in de bijlage bij die
      soort genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.25.2
    text: |-
      In afwijking van het eerste lid kan de pootring een diameter hebben die groter is dan de in de bijlage 6
      vastgestelde maximale diameter, als de aanvrager aannemelijk kan maken dat een grotere diameter in verband met de
      dikte van de poot bij de aanvraag noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.3
    text: 'Een pootring als bedoeld in het eerste lid voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.3.a
    text: |-
      ringen met een diameter van 2,5 tot en met 2,9 mm, gemeten aan de binnenkant van een ring, zijn vervaardigd van
      metaal, waarop een geanodiseerde kleurlaag is aangebracht, en zijn op zodanige wijze voorzien van een breukzone,
      dat de ring knapt, indien de ring wordt opgerekt;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.3.b
    text: |-
      ringen met een diameter kleiner dan 2,5 mm en groter dan 2,9 mm, gemeten aan de binnenkant van een ring, zijn
      vervaardigd van metaal, waarop een geanodiseerde kleurlaag is aangebracht, of zijn vervaardigd van gekleurde
      kunststof, en zijn van zodanige kwaliteit, dat de ring knapt, indien de ring wordt opgerekt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.4
    text: |-
      In afwijking van het derde lid kunnen ringen voor papegaaiachtigen en roofvogels vervaardigd zijn van roestvrij
      staal.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.5
    text: |-
      Een pootring als bedoeld in het eerste lid is voorzien van een kleurlaag, die voor elk jaar waarin de ring mag
      worden aangebracht, verschillend is.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.6
    text: |-
      De aanvrager brengt een pootring als bedoeld in het eerste lid uitsluitend aan op in Nederland in gevangenschap
      geboren en gefokte vogels van de soort waarvoor hij de ring heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.25.7
    text: Een aanvrager is niet gerechtigd een pootring als bedoeld in het eerste lid aan derden te verschaffen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.25
  - number: 3.26.1
    text: |-
      Als rechtspersoonlijkheid bezittende organisaties als bedoeld in
      [artikel 3.28, vijfde lid, van het Besluit natuurbescherming][ref1] die zijn belast met de uitgifte van gesloten
      pootringen zijn aangewezen de in [bijlage 7][ref2] genoemde organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
  - number: 3.26.2
    text: 'De organisaties, bedoeld in het eerste lid, verstrekken uitsluitend gesloten pootringen:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.2.a
    text: |-
      waarvoor door de leverancier een schriftelijke garantie is afgegeven dat de ringen voldoen aan de specificaties,
      bedoeld in [artikel 3.25][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.26.2.b
    text: |-
      die ten minste zijn voorzien van de letters NL, de aanduiding van de binnendiameter tot in tienden van een
      millimeter, de laatste twee cijfers van het jaartal waarin de ring mag worden aangebracht en, per ringmaat, een
      uniek nummer bestaande uit de bondscode, een kweeknummer en een volgnummer.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, zijn de gesloten pootringen, afgegeven door Kleindier Liefhebbers
      Nederland, voorzien van een uniek nummer bestaande uit de bondscode en een volgnummer.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.4
    text: |-
      Gesloten pootringen worden aangevraagd met gebruikmaking van een door één van de organisaties, bedoeld in het
      eerste lid, ter beschikking gesteld aanvraagformulier dat volledig ingevuld en ondertekend wordt teruggestuurd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.5
    text: 'De organisaties, bedoeld in het eerste lid, geven geen pootring uit, indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.5.a
    text: niet aannemelijk is dat de aanvrager vogels, waarvoor hij een pootring aanvraagt, fokt, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.5.b
    text: |-
      het redelijke vermoeden bestaat dat de aanvrager handelt of zal handelen in strijd met
      [artikel 3.25, zesde of zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 3.26.6
    text: |-
      De aanvrager vermeldt in zijn aanvraag per soort hoeveel ringen hij aanvraagt. De hoeveelheid ringen staat in
      verhouding tot de te verwachten nakweek.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7
    text: |-
      De organisaties, bedoeld in het eerste lid, houden een administratie bij met gebruikmaking van een door de minister
      beschikbaar gesteld automatiseringssysteem. In de administratie worden de volgende gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7.a
    text: de soorten vogels waarvoor gesloten pootringen zijn aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7.b
    text: |-
      bij gefokte vogels behorende tot soorten die zijn opgenomen in bijlage A bij de CITES-basisverordening, het aantal
      verstrekte gesloten pootringen, de ringmaat en de bijbehorende unieke nummers als bedoeld in artikel 4 per soort en
      het aantal ouderparen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7.c
    text: |-
      bij gefokte vogels behorende tot andere soorten dan bedoeld in onderdeel b, het aantal verstrekte pootringen, de
      ringmaat en de bijbehorende unieke nummers, bedoeld in het tweede lid, onderdeel b, en derde lid;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7.d
    text: de datum van toekenning van de gesloten pootringen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.7.e
    text: de noodzakelijke gegevens ter identificatie van de personen aan wie de gesloten pootringen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.8
    text: De administratie, bedoeld in het zevende lid, wordt bewaard gedurende een periode van ten minste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.26.9
    text: |-
      De organisaties, bedoeld in het eerste lid, verschaffen de minister desgevraagd, op een door de minister te bepalen
      wijze, alle informatie met betrekking tot de afgifte van gesloten pootringen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.26
  - number: 3.27.1
    text: 'Als douanekantoren als bedoeld in [artikel 3.29 van het Besluit natuurbescherming](onbekend) worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a
    text: 'voor levende dieren:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a.1°
    text: Schiphol Cargo, Evert van de Beekstraat 384, 1118 CZ Schiphol;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a.2°
    text: Schiphol Passagiers, vertrekpassage 1 -260, 1118 AP, Luchthaven Schiphol;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a.3°
    text: Maastricht Aachen Airport, Vliegveldweg 2, 6199 AD, Maastricht;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a.4°
    text: Rotterdam Haven, Bosporusstraat 5, 3199 LJ, Rotterdam (Maasvlakte);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.a.5°
    text: Rotterdam Haven, Reeweg 16, 3088 KA, Rotterdam, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.1.b
    text: |-
      voor dode dieren, dode of levende planten en producten, nesten en eieren van dieren of producten van planten: alle
      douanekantoren.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.27.2
    text: |-
      Indien voor dieren dan wel producten, nesten of eieren van dieren, behorende tot soorten als bedoeld in het eerste
      lid, veterinaire voorschriften gelden, worden deze dieren of producten, nesten of eieren daarvan binnengebracht op
      plaatsen die voor de betrokken dieren of producten, nesten of eieren daarvan als inspectiepost aan de grens zijn
      erkend ingevolge [richtlijn 91/496/EEG](31991L0496) van de Raad van de Europese Gemeenschappen van 15 juli 1991
      tot vaststelling van de beginselen voor de organisatie van de veterinaire controles voor dieren uit derde landen
      die in de Gemeenschap worden binnengebracht en tot wijziging van de [richtlijnen 89/662/EEG](31989L0662), [90/425/
      EEG](31990L0425) en [90/675/EEG](31990L0675) (PbEG L 268) of [richtlijn 97/78/EG](31997L0078) van de Raad van
      de Europese Unie van 18 december 1997 tot vaststelling van de beginselen voor de organisatie van de veterinaire
      controles voor producten die uit derde landen in de Gemeenschap worden binnengebracht (PbEG 1998, L 24).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.27
  - number: 3.28.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.34, eerste lid, van de wet][ref1],
      voor het uitzetten van dieren van de in [bijlage 8][ref2] aangewezen diersoorten voor de bestrijding van ziekten,
      plagen of onkruiden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
  - number: 3.28.2
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.34, eerste lid, van de wet][ref1],
      voor het uitzetten van dieren van de in [bijlage 9][ref2] aangewezen diersoorten tezamen met de in het eerste lid
      bedoelde dieren, als prooidieren voor die dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
  - number: 3.28.3
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 2.3, eerste lid, van de Wet dieren][ref1], voor het gebruiken van dieren van de in [bijlage 9][ref2]
      aangewezen diersoorten, met het oog op de productie van van die dieren afkomstige producten.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0030250
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0038668
  - number: '3.29'
    text: |-
      Als voorschrift als bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] wordt aangewezen artikel 7, eerste lid,
      aanhef in samenhang met de onderdelen a, b, c, d, e, f, g of h, van de Verordening uitheemse invasieve soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.30.1
    text: |-
      Van het verbod, bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] in samenhang met [artikel 3.29][ref2] van
      deze regeling, wordt, voor zover het betreft de handelingen, bedoeld in artikel 7, eerste lid, onderdelen b, d,
      e en f, van de Verordening uitheemse invasieve soorten, vrijstelling verleend als beheersmaatregel als bedoeld in
      artikel 19 van de Verordening uitheemse invasieve soorten voor handelingen met dieren van de volgende soorten:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.30.1.a
    text: de Chinese wolhandkrab (Eriocheir sinensis);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.1.b
    text: de Gevlekte Amerikaanse rivierkreeft (Orconectus Limosus);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.1.c
    text: de Geknobbelde Amerikaanse rivierkreeft (Orconectes virilis);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.1.d
    text: de Californische rivierkreeft (Pacifastacus leniusculus);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.1.e
    text: de Rode Amerikaanse rivierkreeft (Procambarus Clarkia), en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.1.f
    text: de Marmerkreeft (Procambarus fallax forma virginalis).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.2
    text: 'De vrijstelling wordt slechts verleend voor:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.2.a
    text: |-
      bevissing van de dieren in Nederlandse binnenwateren en kustwateren, de opslag, de handel, het transport, het
      houden, het gebruik of de vernietiging van de opgeviste dieren, en alle onmiddellijk daarmee samenhangende
      handelingen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.2.b
    text: |-
      handelingen als bedoeld in onderdeel a ten aanzien van dieren die als beheersmaatregel zijn opgevist en in
      de handel zijn gebracht in andere lidstaten van de Europese Unie overeenkomstig de in die lidstaten geldende
      wetgeving.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3
    text: 'Aan de vrijstelling zijn de volgende voorschriften en beperkingen verbonden:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.a
    text: 'degene die de in het tweede lid, onder a, bedoelde handelingen verricht draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.a.1°
    text: |-
      alle passende maatregelen worden getroffen bij de bevissing, de opslag, de handel, het transport, het houden en het
      gebruik van de betrokken dieren om te voorkomen dat zij zich kunnen voortplanten, kunnen ontsnappen en zich kunnen
      verspreiden;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.a.2°
    text: |-
      alle passende maatregelen worden getroffen bij de opslag, het transport en het houden van de dieren om te voorkomen
      dat de betrokken dieren door onbevoegden kunnen worden verwijderd uit de omgeving waarin zij worden opgeslagen
      of getransporteerd;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.a.3°
    text: |-
      het schoonmaken, het beheren van afval en het onderhoud van vistuigen, transport- en opslagmaterialen bij
      bevissing, de opslag, de handel, het transport en het houden van de dieren op zodanige wijze plaatsvindt dat
      exemplaren van de soorten zich niet kunnen verspreiden of door onbevoegden kunnen worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.a.4°
    text: |-
      voorkomen wordt dat dieren van de soorten op het grondgebied van andere lidstaten worden gebracht, tenzij die
      lidstaten dat toestaan in het kader van door hen getroffen beheersmaatregelen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.3.b
    text: |-
      degene die de in het tweede lid, onderdeel a, bedoelde handelingen verricht maakt te allen tijde aannemelijk dat
      hij voldoet aan de in het eerste lid bedoelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30.4
    text: |-
      Als passende maatregel als bedoeld in het derde lid, onderdeel a, onderdelen 1° en 2°, wordt in ieder geval
      beschouwd een fysieke scheiding tussen de dieren en hun natuurlijke leefomgeving, waarbij de dieren die overleven
      zich vervolgens niet kunnen voortplanten en zich niet kunnen verspreiden.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30
  - number: 3.30a.1
    text: |-
      Als invasieve uitheemse dier- en plantensoorten als bedoeld in
      [artikel 3.32, eerste lid, van het Besluit natuurbescherming][ref1] worden aangewezen de soorten, genoemd in
      [bijlage 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
  - number: 3.30a.2
    text: |-
      Gedeputeerde staten brengen uiterlijk op 1 juni 2019, en daarna telkens na zes jaar
      aan de Minister een rapportage uit over de uitvoering van de maatregelen, bedoeld in
      [artikel 3.32, eerste lid, van het Besluit natuurbescherming][ref1], ten aanzien van de in [bijlage 10][ref2]
      genoemde soorten.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038668
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038668
  - number: 3.30a.3
    text: 'Deze rapportage bevat informatie voor het gehele provinciale grondgebied over:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
  - number: 3.30a.3.a
    text: |-
      de aard en de doeltreffendheid van de op grond van
      [artikel 3.32, eerste lid, van het Besluit natuurbescherming][ref1] genomen maatregelen, alsmede de gevolgen van
      deze maatregelen voor niet-doelsoorten;


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.30a.3.b
    text: |-
      de maatregelen die zijn genomen om het publiek te informeren over de aanwezigheid van invasieve uitheemse soorten
      en over andere acties die burgers verzocht worden te ondernemen, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
  - number: 3.30a.3.c
    text: |-
      indien beschikbaar, de kostprijs van de in de onderdelen a en b bedoelde maatregelen die zijn genomen om aan de
      Verordening invasieve uitheemse soorten te voldoen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30a
  - number: 3.30b.1
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref1] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref2], voor zover het betreft het onder zich hebben, het
      voorhanden hebben of het in bezit hebben van een plant van een soort, genoemd in artikel 3.1a van het Besluit
      natuurbescherming, of delen of producten daarvan, voor niet-commerciële doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.30b.2
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref1] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref2], voor zover het betreft het verhandelen of het in
      bezit hebben van een plant van een soort, genoemd in artikel 3.1a van het Besluit natuurbescherming, of delen of
      producten daarvan, indien deze handelingen plaatsvinden in het kader van uitroeiing, bestrijding of beheersing van
      die soort.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.30b.3
    text: |-
      Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref1] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref2], voor zover het betreft het verhandelen en in bezit
      hebben van een dode plant van een soort, genoemd in artikel 3.1a van het Besluit natuurbescherming, of dode delen
      of dode producten van een plant van die soort.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 3.30b.4
    text: 'Aan de vrijstelling, bedoeld in het tweede lid, zijn de volgende voorschriften en beperkingen verbonden:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
  - number: 3.30b.4.a
    text: |-
      degene die de in het tweede lid bedoelde handelingen verricht draagt er zorg voor dat alle passende maatregelen
      worden getroffen om te voorkomen dat de planten, of delen of producten daarvan, zich kunnen voortplanten of zich
      kunnen verspreiden in het milieu;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
  - number: 3.30b.4.b
    text: |-
      degene die de in het tweede lid bedoelde handelingen verricht kan te allen tijde aannemelijk maken dat hij voldoet
      aan het in onderdeel a bedoelde voorschrift.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
  - number: 3.30b.5
    text: |-
      Als passende maatregel als bedoeld in het vierde lid, onderdeel a, wordt in ieder geval beschouwd een fysieke
      scheiding tussen de planten en hun natuurlijke leefomgeving.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.30b
  - number: '3.31'
    text: |-
      Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.10, eerste lid, onderdelen a, b en c, van de wet][ref1], ten aanzien dieren en planten van de in bijlage
      11 aangewezen soorten, indien het betreft handelingen in het kader van:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 3.31.a
    text: |-
      bestendig beheer of onderhoud van vaarwegen, watergangen, waterkeringen, waterstaatswerken, oevers, vliegvelden,
      wegen, spoorwegen of bermen, of in het kader van natuurbeheer;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.31
  - number: 3.31.b
    text: bestendig beheer of onderhoud in de landbouw en de bosbouw;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.31
  - number: 3.31.c
    text: bestendig gebruik, of
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.31
  - number: 3.31.d
    text: |-
      de ruimtelijke ontwikkeling of inrichting van gebieden, daaronder begrepen het daarop volgende gebruik van het
      ingerichte of ontwikkelde gebied, voor zover de in de onderdelen a tot en met d genoemde handelingen onderdeel zijn
      van een in [artikel 1.3, eerste lid, van het Besluit natuurbescherming][ref1] aangewezen categorie van handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.31
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '1'
  - number: 3.32.1
    text: |-
      De faunabeheereenheid met het werkgebied bestaande uit de gebieden, bedoeld in
      [artikel 1.9, eerste lid, van het Besluit natuurbescherming][ref1], heeft de rechtsvorm van een stichting. De leden
      van het bestuur van de stichting worden benoemd en ontslagen door de gerechtigde, bedoeld in artikel 1.9, eerste
      lid, van het Besluit natuurbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '1'
  - number: 3.32.2
    text: |-
      De faunabeheereenheid, bedoeld in het eerste lid, stelt voor de in dat lid bedoelde gebieden een faunabeheerplan
      op, dat ten minste de volgende gegevens bevat:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.a
    text: de omvang van het werkgebied van de faunabeheereenheid;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.b
    text: een kaart waarop de begrenzing van het werkgebied van de faunabeheereenheid is aangegeven;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.c
    text: |-
      kwantitatieve gegevens over de populatie van de diersoorten ten aanzien waarvan een duurzaam beheer of bestrijding
      noodzakelijk wordt geacht, met inbegrip van gegevens over de aanwezigheid van de populaties in het betrokken gebied
      gedurende het jaar;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.d
    text: |-
      een onderbouwing van de noodzaak van een duurzaam beheer of bestrijding van de in onderdeel c bedoelde diersoorten,
      waaronder een onderbouwde verwachting van de belangen die zouden worden geschaad, indien niet tot beheer of
      bestrijding zou worden overgegaan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.e
    text: |-
      een beschrijving van de mate waarin de in onderdeel d bedoelde belangen zijn geschaad in de vijf jaren voorafgaand
      aan het tijdstip van de aanvraag om goedkeuring van het faunabeheerplan;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.f
    text: de gewenste stand van de in onderdeel c bedoelde diersoorten;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.g
    text: |-
      per diersoort een beschrijving van de aard, omvang en noodzaak van de handelingen die zullen worden verricht om de
      gewenste stand, bedoeld in onderdeel f, te bereiken;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.h
    text: |-
      per diersoort en gewas een beschrijving van de handelingen die in de periode, bedoeld in onderdeel e, zijn verricht
      om het schaden van de in onderdeel d bedoelde belangen te voorkomen, alsmede, voorzover daarover redelijkerwijs
      kwantitatieve gegevens beschikbaar zijn, een beschrijving van de effectiviteit van die handelingen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.i
    text: |-
      voor zover het plan betrekking heeft op het beheer van edelherten, damherten, reeën of wilde zwijnen, een
      beschrijving van het voedselaanbod, de relatie tussen dit voedselaanbod en de grootte van de populatie van de
      betrokken dieren alsmede de mogelijkheden van uitwisseling met aangrenzende terreinen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.j
    text: |-
      een beschrijving van de plaatsen in het werkgebied van de faunabeheereenheid waar en de perioden in het jaar waarin
      de in onderdeel g bedoelde handelingen zullen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.k
    text: |-
      voor zover daarover kwantitatieve gegevens beschikbaar zijn, een onderbouwde inschatting van de verwachte
      effectiviteit van de in onderdeel g bedoelde handelingen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.2.l
    text: een beschrijving van de wijze waarop de effectiviteit van de voorgenomen handelingen zal worden bepaald.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.3
    text: Het faunabeheerplan heeft een geldigheidsduur van ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
  - number: 3.32.4
    text: |-
      De jachthouder van de gebieden, bedoeld in [artikel 1.7, eerste lid, van het Besluit natuurbescherming][ref1], is
      uitgezonderd van [artikel 3.14, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel3.32
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 4.1.1
    text: |-
      Als voorschriften als bedoeld in [artikel 4.8, eerste lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 4.1.1.a
    text: |-
      artikel 4, eerste lid, van [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de Europese Unie van
      20 december 2005 inzake de opzet van een FLEGT-vergunningen-systeem voor de invoer van hout in de Europese
      Gemeenschap (PbEU 2005, L 347);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de artikelen 4 en 5 van verordening (EU) nr. 995/2010 van het Europees Parlement en de Raad van de Europese Unie
      van 20 oktober 2010 tot vaststelling van de verplichtingen van marktdeelnemers die hout en houtproducten op de
      markt brengen (PbEU 2010, L 295).
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.1
  - number: 4.1.2
    text: |-
      In afwijking van artikel 5, eerste lid, van [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de
      Europese Unie van 20 december 2005 inzake de opzet van een FLEGT-vergunningen-systeem voor de invoer van hout in
      de Europese Gemeenschap (PbEU 2005, L 347), wordt de aldaar bedoelde vergunning ingediend ten minste één werkdag
      voorafgaand aan het moment dat de aangifte voor het in het vrije verkeer brengen bij de douane wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.1
  - number: 4.2.1
    text: |-
      De melding, bedoeld in [artikel 4.2, eerste lid, van de wet][ref1], vindt voor de categorieën van handelingen en
      projecten, bedoeld in [artikel 1.3, eerste lid, van het Besluit natuurbescherming][ref2], plaats door het zenden
      aan de Minister van Landbouw, Natuur en Voedselkwaliteit van een door hem beschikbaar gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '1'
  - number: 4.2.2
    text: |-
      Het formulier, bedoeld in het eerste lid, wordt aan de Minister van Landbouw, Natuur en Voedselkwaliteit gezonden
      ten minste één maand doch niet langer dan één jaar voor het moment van de voorgenomen velling van de houtopstand.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.3
    text: |-
      Indien een houtopstand wordt geveld in het kader van een handeling of project als bedoeld in
      [artikel 1.3, eerste lid, van het Besluit natuurbescherming][ref1], kan de minister een ontheffing als bedoeld in
      [artikel 4.5, eerste lid, van de wet][ref2] verlenen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 4.2.3.a
    text: |-
      de grond die de eigenaar wil beplanten gelegen is in hetzelfde gebied als dat waar zich de gevelde houtopstand
      bevond;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.3.b
    text: |-
      de grond die de eigenaar wil beplanten niet van mindere kwaliteit is dan die waarop zich de gevelde houtopstand
      bevond;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.3.c
    text: |-
      de grond die de eigenaar wil beplanten ten minste een gelijke oppervlakte heeft als die waarop zich de gevelde
      houtopstand bevond;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.3.d
    text: de gevelde houtopstand geen deel uitmaakte van een boskern;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.3.e
    text: de belangen in verband met de bodemproductie niet worden geschaad.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.4
    text: 'De gebieden, bedoeld in het derde lid, onderdeel a, zijn:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.4.a
    text: 'gebied 1: de provincies Groningen, Friesland en Drenthe;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.4.b
    text: 'gebied 2: de provincie Overijssel met uitzondering van de Noordoostpolder en de provincies Gelderland en Utrecht;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.4.c
    text: 'gebied 3: de provincies Noord-Holland, Zuid-Holland en Zeeland en de IJsselmeerpolders;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.2.4.d
    text: 'gebied 4: de provincies Noord-Brabant en Limburg.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.2
  - number: 4.3.1
    text: |-
      Aan een ieder die een handeling of project als bedoeld in [artikel 1.3, eerste lid, van het Besluit
      natuurbescherming](onbekend) uitvoert, wordt vrijstelling verleend van de [artikelen 4.2, eerste lid][ref1], en
      [4.3, eerste, tweede en vijfde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 4.3.2
    text: 'De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend indien:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
  - number: 4.3.2.a
    text: |-
      de houtopstand niet ter voldoening aan [artikel 4.3, eerste lid, van de wet][ref1] is aangelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 4.3.2.b
    text: |-
      voordat tot aanleg van de houtopstand wordt overgegaan, het tijdstip en de plaats van aanleg middels een formulier
      zijn gemeld bij de minister en de minister de ontvangst van de melding heeft bevestigd;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
  - number: 4.3.2.c
    text: |-
      het bos binnen een periode van 40 jaar na het op het formulier vermelde tijdstip van aanleg in zijn geheel wordt
      geveld.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
  - number: 4.3.3
    text: |-
      De minister stelt het modelformulier voor de melding, bedoeld in het tweede lid, onderdeel b, vast. Het
      modelformulier voorziet onder meer in een kadastrale omschrijving van de percelen waar tot aanleg van het bos wordt
      overgegaan.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel4.3
  - number: 5.1.1
    text: |-
      Voor de behandeling van een aanvraag van een vergunning als bedoeld in [artikel 2.7, tweede lid, van de wet][ref1]
      worden, ingeval [artikel 1.3, vijfde lid, van de wet][ref2] van toepassing is, door de minister aan de aanvrager de
      volgende vergoedingen in rekening gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel5
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '5'
  - number: 5.1.1.a
    text: 'indien de vergunning voor een geldigheidsduur van maximaal één jaar wordt aangevraagd: € 800,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.1.b
    text: 'indien de vergunning voor een geldigheidsduur van één tot drie jaar wordt aangevraagd: € 1.900,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.1.c
    text: 'indien de vergunning voor een geldigheidsduur van drie jaar of meer wordt aangevraagd: € 3.500,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.2
    text: |-
      Voor de behandeling van een aanvraag van een ontheffing als bedoeld in de [artikelen 3.3, eerste lid][ref1], en
      [3.8, eerste lid][ref2], in voorkomend geval in samenhang met [artikel 3.10, tweede lid, van de wet][ref3] worden,
      ingeval [artikel 1.3, vijfde lid, van de wet][ref4] van toepassing is, door de minister aan de aanvrager de
      volgende vergoeding in rekening gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '1'
  - number: 5.1.2.a
    text: 'indien de ontheffing voor een geldigheidsduur van maximaal één jaar wordt aangevraagd: € 600,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.2.b
    text: 'indien de ontheffing voor een geldigheidsduur van één tot drie jaar wordt aangevraagd: € 1.600,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.2.c
    text: 'indien de ontheffing voor een geldigheidsduur van drie jaar of meer wordt aangevraagd: € 3.000,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.3
    text: |-
      Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in de
      [artikelen 3.3, derde lid][ref1], en [3.8, derde lid, van de wet][ref2] wordt door de minister aan de aanvrager de
      volgende vergoeding in rekening gebracht: € 80,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.1.4
    text: |-
      Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in
      [artikel 3.34, vijfde lid, van de wet][ref1] wordt door de minister aan de aanvrager de volgende vergoeding in
      rekening gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.1.4.a
    text: 'voor de herintroductie van een soort: € 1.600,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.4.b
    text: 'voor het uitzetten, planten of zaaien van exoten: € 800,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.5
    text: |-
      Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in
      [artikel 3.40 van de wet][ref1] wordt door de minister aan de aanvrager de volgende vergoeding in rekening
      gebracht: € 100,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.1.6
    text: |-
      In afwijking van het vijfde lid, wordt voor de behandeling van een aanvraag tot afgifte of
      wijziging van een ontheffing als bedoeld in [artikel 3.40 van de wet][ref1] van het bepaalde in
      [artikel 3.24, eerste, tweede of derde lid, van het Besluit natuurbescherming][ref2] ten aanzien van levende dieren
      door de minister aan de aanvrager de volgende vergoeding in rekening gebracht: € 15,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
  - number: 5.1.7
    text: |-
      In afwijking van het eerste en tweede lid wordt, ingeval een aanvraag wordt afgewezen omdat voor het uitvoeren van
      de betreffende handeling geen vergunning, onderscheidenlijk ontheffing is vereist, aan de aanvrager de volgende
      vergoeding in rekening gebracht: € 800,–, onderscheidenlijk € 600,–.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.8
    text: |-
      Voor de goedkeuring van een gedragscode als bedoeld in de [artikelen 3.31, eerste lid][ref1], of
      [4.4, eerste lid, onderdeel d, van de wet][ref2] wordt door de minister aan de aanvrager de volgende vergoeding in
      rekening gebracht: € 3.000,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '4'
  - number: 5.1.9
    text: |-
      In afwijking van het eerste en tweede lid, worden voor de behandeling van een aanvraag tot wijziging van een
      vergunning als bedoeld in het eerste lid of van een ontheffing als bedoeld in het tweede lid door de minister aan
      de aanvrager de volgende vergoedingen in rekening gebracht:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.9.a
    text: 'indien de wijziging geen nieuwe ecologische beoordeling vergt: geen;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.9.b
    text: |-
      indien de wijziging een nieuwe ecologische beoordeling vergt: 25 procent van de vergoedingen als bedoeld in het
      eerste lid, onderdelen a, b of c, en het tweede lid, onderdelen a, b of c, voor zover het een aldaar bedoeld
      vergunning of ontheffing betreft.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
  - number: 5.1.10
    text: |-
      In afwijking van het eerste en achtste lid, wordt voor de behandeling van een aanvraag van een ontheffing als
      bedoeld in de [artikelen 3.3, eerste lid][ref1], en [3.8, eerste lid, van de wet][ref2] van de verboden als bedoeld
      in de [artikelen 3.2, zesde lid][ref3], onderscheidenlijk [3.6, tweede lid, van de wet][ref4], ingeval artikel
      1.3, vijfde lid, van de wet van toepassing is, door de minister aan de aanvrager de volgende vergoeding in rekening
      gebracht: € 60,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.2.1
    text: |-
      De vergoeding die de minister in rekening brengt aan de aanvrager voor de behandeling van een aanvraag tot afgifte
      van een valkeniersakte, bedraagt voor:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.1.a
    text: 'de uitgifte van een akte: € 65,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.1.b
    text: 'een duplicaat van een akte: € 30,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.2
    text: De gelden die voldaan zijn ter zake van uitgereikte valkeniersakten, worden niet gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3
    text: |-
      Voor de behandeling van een aanvraag tot afgifte of wijziging van de hierna genoemde documenten worden door de
      minister aan de aanvrager de volgende vergoedingen in rekening gebracht:
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.a
    text: 'een invoervergunning als bedoeld in artikel 4 van de CITES-basisverordening: € 60,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.b
    text: 'een uitvoervergunning als bedoeld in artikel 5 van de CITES-basisverordening: € 60,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.c
    text: 'een wederuitvoercertificaat als bedoeld in artikel 5 van de CITES-basisverordening: € 60,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.d
    text: 'een bijlage bij een document als bedoeld in onderdeel a, b of c waarop maximaal 3 soorten worden vermeld: € 60,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.e
    text: |-
      een inschrijving als wetenschappelijke instelling als bedoeld in artikel 7, vierde lid, van de CITES-
      basisverordening: € 40,–;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.f
    text: |-
      een certificaat als bedoeld in de artikelen 8, derde lid, en 9, tweede lid, onderdeel b, van de CITES-
      basisverordening: € 15,–;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.g
    text: |-
      een certificaat van persoonlijke eigendom als bedoeld in artikel 37, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.h
    text: 'een certificaat van monsterverzameling als bedoeld in artikel 44 bis van de CITES-uitvoeringsverordening: € 60,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.i
    text: |-
      een muziekinstrumentencertificaat als bedoeld in artikel 44 decies, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.j
    text: |-
      een certificaat voor reizende tentoonstellingen als bedoeld in artikel 30, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.k
    text: 'een etiket als bedoeld in artikel 66, zesde lid, van de CITES-uitvoeringsverordening: € 0,25;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.3.l
    text: 'een vergunning als bedoeld in artikel 66, zevende lid, van de CITES-uitvoeringsverordening: € 60,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
  - number: 5.2.4
    text: |-
      Voor de behandeling van een aanvraag tot afgifte van merktekens als bedoeld in [artikel 3.23, vierde lid][ref1],
      wordt door de minister aan de aanvrager de volgende vergoeding in rekening gebracht: € 1,– per merkteken.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.4.5
  - number: 5.2.5
    text: |-
      Voor de behandeling van een aanvraag tot afgifte van een document als bedoeld in de artikelen 8, zesde
      lid, en 9, zesde lid, van de Verordening invasieve uitheemse soorten wordt door de Minister, indien
      de aanvraag niet gelijktijdig geschiedt met de aanvraag tot afgifte van een ontheffing als bedoeld in
      [artikel 3.40 van de wet][ref1], de volgende vergoeding in rekening gebracht: € 15,–.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 5.3.1
    text: |-
      De aan erkende organisaties door de leverancier in rekening gebrachte kostprijs voor de vervaardiging van gesloten
      pootringen wordt aan de aanvrager doorberekend.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.3
  - number: 5.3.2
    text: |-
      De erkende organisaties kunnen de in het eerste lid bedoelde kostprijs verhogen met een bedrag ter dekking van de
      kosten voor de uitreiking van ringen ter hoogte van maximaal € 1,– per ring.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.3
  - number: 5.3.3
    text: |-
      Gesloten pootringen worden niet uitgereikt dan na voldoening van de som van in het eerste en tweede lid bepaalde
      bedragen.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.3
  - number: 5.4.1
    text: 'De vergoeding van kosten voor het verstrekken van een jachtakte bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.1.a
    text: |-
      de uitgifte van een jachtakte: € 192,65 als het onderzoek, bedoeld in
      [artikel 48a van de Regeling wapens en munitie][ref1], deel uitmaakt van de aanvraag; in andere gevallen € 138,20;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel48a
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 48a
  - number: 5.4.1.b
    text: |-
      de uitgifte van een jachtakte voor de periode aansluitend op de periode waarvoor een jachtakte was uitgegeven:
      € 68,20;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.1.c
    text: 'het wijzigen van een jachtakte: € 30,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.1.d
    text: 'het vervangen als gevolg van verlies van een jachtakte: € 30,–;'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.1.e
    text: 'een duplicaat van een jachtakte: € 30,–.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.2
    text: De gelden die voldaan zijn ter zake van uitgereikte akten, worden niet gerestitueerd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.4.3
    text: |-
      De vergoeding van kosten voor een combinatie van de in het eerste lid genoemde handelingen bedraagt niet meer dan
      het bedrag dat verschuldigd zou zijn voor dat deel van de combinatie waarvoor de hoogste vergoeding geldt.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.4
  - number: 5.5.1
    text: |-
      Een ontheffing, vergunning, akte, document of merkteken als bedoeld in de [artikelen 5.1][ref1] of [5.2][ref2]
      wordt niet afgegeven dan na voldoening van de in bedoelde artikelonderdelen genoemde vergoedingen van kosten of
      nadat zekerheid tot betaling is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel5
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.5.2
    text: |-
      Indien ter uitvoering van een door de minister op grond van [artikel 7.4 van de wet][ref1] genomen besluit een
      ontheffing of document benodigd is, kan de minister in afwijking van de [artikelen 5.1][ref2] en [5.2][ref3] van
      deze regeling bepalen dat geen vergoeding van kosten in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0038668#Artikel5
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0038668
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0038668
        artikel: '5'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      Als ambtenaren als bedoeld in [artikel 7.1, eerste lid, onderdeel a, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
  - number: 6.1.a
    text: de ambtenaren van de Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken en Klimaat, en
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel6.1
  - number: 6.1.b
    text: |-
      de ambtenaren van de Nederlandse Voedsel- en Warenautoriteit, met uitzondering van de ambtenaren, bedoeld in
      [artikel 7.1, eerste lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel7
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '7'
  - number: 7.14.1
    text: |-
      Als examens als bedoeld in de [artikelen 3.28, tweede lid, onderdeel a][ref1],
      [3.30, tweede lid, tweede volzin][ref2], in samenhang met artikel 3.28, tweede
      lid, onderdeel a, onderscheidenlijk 3.30, derde lid, van de wet worden erkend de
      krachtens [artikel 39, eerste lid, onderdeel c, van de Flora- en faunawet][ref3] en
      [artikel 13a, eerste lid, van de Jachtwet][ref4] erkende jachtexamens voor de jacht met het geweer, de jacht met
      jachtvogels, onderscheidenlijk de jacht met de eendenkooi.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009640#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0002155#Artikel13a
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0009640
        artikel: '39'
      - id: ref4
        bwb_id: BWBR0002155
        artikel: 13a
  - number: 7.14.2
    text: |-
      Als het met goed gevolg hebben afgelegd van het jachtexamen, bedoeld in
      [artikel 3.18, eerste lid, van het Besluit natuurbescherming][ref1], het examen voor het gebruik van jachtvogels,
      bedoeld in [artikel 3.19, eerste lid, van het Besluit natuurbescherming][ref2], en het examen voor het gebruik
      van eendenkooien, bedoeld in [artikel 3.22, eerste lid, van het Besluit natuurbescherming][ref3], wordt erkend
      het bezit in enig jaar in de periode van 1 januari 1977 tot 1 april 2002 van een geldige jachtakte als bedoeld
      in de [Jachtwet][ref4] of een geldige vergunning als bedoeld in artikel 11 van de Vogelwet 1936 inzake haviken
      of slechtvalken.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002155
  - number: 7.14a
    text: |-
      Als personen als bedoeld in [artikel 3.20, tweede lid, van het Besluit natuurbescherming][ref1]
      zijn aangewezen de personen die op 31 december 2016 waren aangewezen in
      [artikel 1a van de Regeling erkenning jachtexamen en preparateursexamen Flora- en faunawet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015463#Artikel1a
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.14a
    references:
      - id: ref1
        bwb_id: BWBR0038662
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0015463
        artikel: 1a
  - number: '7.15'
    text: |-
      Het verbod, bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] geldt niet ten aanzien van het voorschrift,
      bedoeld in artikel 3.29 van deze regeling, voor de houder van dieren van de soorten Amerikaanse voseekhoorn
      (Sciurus niger), grijze eekhoorn (Sciurus carolinensis) en Pallas’ eekhoorn (Callosciurus erythraeus), indien
      de houder op het tijdstip van inwerkingtreding van de [wet][ref2] aantoonbaar voldeed aan het bepaalde in
      [artikel 8a, tweede en derde lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037552
      [ref3]: https://wetten.overheid.nl/BWBR0011853#Artikel8a
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037552
      - id: ref3
        bwb_id: BWBR0011853
        artikel: 8a
  - number: '7.16'
    text: |-
      Een ring die of een ander merkteken dat rechtmatig is aangebracht vóór de inwerkingtreding van deze regeling
      en, voorzover van toepassing, in overeenstemming is met de basisverordening en de uitvoeringsverordening wordt
      beschouwd als een ring of merkteken als bedoeld in deze regeling.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.16
  - number: '7.17'
    text: |-
      Archiefbescheiden van de Minister van Landbouw, Natuur en Voedselkwaliteit betreffende een bevoegdheid tot het
      nemen van een besluit met betrekking tot projecten of handelingen die op grond van de [wet][ref1] wordt uitgeoefend
      door gedeputeerde staten, worden overgedragen aan gedeputeerde staten van de provincie waar het project of de
      handeling in hoofdzaak wordt gerealiseerd, onderscheidenlijk verricht, voor zover de archiefbescheiden niet
      overeenkomstig de [Archiefwet 1995][ref2] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
      [ref2]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0037552
      - id: ref2
        bwb_id: BWBR0007376
  - number: '7.18'
    text: Deze regeling treedt in werking op 1 januari 2017.
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.18
  - number: '7.19'
    text: 'Deze regeling wordt aangehaald als: Regeling natuurbescherming.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel7.19
