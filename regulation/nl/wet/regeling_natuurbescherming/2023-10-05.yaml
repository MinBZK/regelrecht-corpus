        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 1.1.–
    text: |-
      *gesloten pootring:* individueel gemerkte, ononderbroken ring of manchet, zonder enige naad of las, waarmee op geen
      enkele wijze is geknoeid en waarvan het formaat zodanig is dat hij, nadat hij in de eerste levensdagen van de vogel
      is aangebracht, niet kan worden verwijderd wanneer de poot van de vogel zijn definitieve omvang heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *kavelbesluit:* kavelbesluit als bedoeld in [artikel 1 van de Wet windenergie op zee][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036752#Artikel1
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
    references:
