preamble:
  text: |-
    Handelende mede namens de Minister van Infrastructuur en Milieu en na overleg met de Minister van Defensie en
    gedeputeerde staten van de provincies ten aanzien van de artikelen 2.1, 2.2, 2.3, 2.4, 2.6 en 2.7, handelende mede
    namens de Minister van Infrastructuur en Milieu en in overeenstemming met de Minister van Defensie en gedeputeerde
    staten van de provincies ten aanzien van artikel 2.5, handelende na overleg met gedeputeerde staten van de
    provincies ten aanzien van artikel 3.5 en handelende in overeenstemming met gedeputeerde staten van de provincies
    ten aanzien van artikel 3.28, eerste en tweede lid;

    Gelet op verordening (EG) nr. 338/97 van de Raad van de Europese Unie van 9 december 1996 inzake de bescherming van
    in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer (PbEG 1997, L 61) en
    verordening (EG) nr. 865/2006 van de Commissie van 6 mei 2006, houdende uitvoeringsbepalingen van Verordening (EG)
    nr. 338/97 van de Raad inzake de bescherming van in het wild levende dier- en plantensoorten door controle op het
    desbetreffende handelsverkeer (PbEU 2006, L 166);

    Gelet op verordening (EG) nr. 1007/2009 van het Europees Parlement en de Raad van 16 september 2009 betreffende de
    handel in zeehondenproducten (PbEU 2009, L 286);

    Gelet op verordening (EEG) nr. 3254/91 van de Raad van de Europese Gemeenschappen van 4 november 1991 houdende een
    verbod op het gebruik van de wildklem in de Gemeenschap en op het binnenbrengen in de Gemeenschap van pelzen en
    produkten die vervaardigd zijn van bepaalde in het wild levende diersoorten uit landen waar gebruik wordt gemaakt
    van de wildklem of andere vangmethoden die niet stroken met de internationale normen voor humane vangst met behulp
    van vallen (PbEG L 308);

    Gelet op richtlijn 83/129/EEG van de Raad van 28 maart 1983 betreffende de invoer in de Lid-Staten van huiden van
    bepaalde zeehondenjongen en daarvan vervaardigde produkten (PbEG 1983, L 91);

    Gelet op verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van 22 oktober 2014 betreffende de
    preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten (PbEU 2014, L 317);

    Gelet op verordening (EG) nr. 2173/2005 van de Raad van de Europese Unie van 20 december 2005 inzake de opzet van
    een FLEGT-vergunningen-systeem voor de invoer van hout in de Europese Gemeenschap (PbEU 2005, L 347);

    Gelet op verordening (EU) nr. 995/2010 van het Europees Parlement en de Raad van de Europese Unie van 20 oktober
    2010 tot vaststelling van de verplichtingen van marktdeelnemers die hout en houtproducten op de markt brengen (PbEU
    2010, L 295);

    Gelet op de artikelen 2.9, zevende en achtste lid, 3.3, tweede lid in samenhang met artikel 1.3, vijfde lid, en
    derde lid, 3.8, tweede lid in samenhang met artikel 1.3, vijfde lid, en derde lid, 3.10, tweede lid in samenhang
    met artikel 3.8, 3.15, tweede lid, 3.22, tweede lid, 3.25, tweede lid, 3.28, tweede lid, onderdeel a, en zevende
    lid, 3.30, derde, vierde en negende lid, 3.34, derde lid in samenhang met artikel 1.3, vijfde lid, en vijfde lid,
    3.37, eerste en tweede lid, 3.40, 4.8, eerste en tweede lid, 6.2, eerste, tweede en derde lid, en 7.1, eerste lid,
    onderdeel a, van de Wet natuurbescherming;

    Gelet op de artikelen 2.7, derde lid, 2.8, eerste lid, 2.9, zesde lid, 3.2, eerste lid, onderdeel c, 3.18, tweede
    lid, 3.19, tweede lid, 3.21, vierde lid, 3.22, tweede lid, 3.26, derde lid, artikel 3.27, tweede lid, 3.28, vierde
    en vijfde lid, en 3.29 van het Besluit natuurbescherming;

    Gelet op de artikelen 2.2, eerste lid, en 10.1, eerste lid, van de Wet dieren, artikel 5.14, derde lid, onderdeel
    a, en zevende lid, van de Wet inkomstenbelasting 2001, artikel 95 van de Wet inrichting landelijk gebied, artikel
    32 van de Gezondheids- en welzijnswet voor dieren, de artikelen 13, eerste lid, onderdeel b, 15 en 19, eerste lid,
    onderdeel a, van de Landbouwwet, artikel 17, eerste lid, aanhef en onder 2°, van de Wet op de economische delicten,
    de artikelen 8, achtste lid, 9, vijfde lid, 14, vierde lid, 22, tweede lid en 28a, tweede lid, van de Wet wapens en
    munitie, artikel 9, tweede lid, van het Besluit Gedragstoezicht financiële ondernemingen Wft, artikel 4.4, eerste
    lid, van het Besluit omgevingsrecht, de artikelen 3 en 4 van het Reglement zee- en kustvisserij 1977 en artikel 2,
    eerste lid, onderdeel d, van het Besluit vrijstellingen stortverbod buiten inrichtingen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *AERIUS Calculator:* rekeninstrument voor de vaststelling van de omvang van stikstofdepositie op een voor stikstof
      gevoelige habitat in een Natura 2000-gebied, beschikbaar op www.aerius.nl;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *AERIUS Monitor:* applicatie, beschikbaar op www.aerius.nl, voor het tonen van gegevens over de gevoeligheid
      voor stikstof van habitats, de omvang van stikstofdepositie op die habitats in Natura 2000-gebieden en de relatie
      daartussen;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *AERIUS Register:* registratiesysteem als bedoeld in [artikel 2.3][ref1] voor het registreren van depositieruimte
      die kan worden gebruikt bij het nemen van een besluit waarbij een project wordt toegestaan, beschikbaar op
      [www.aerius.nl](onbekend);


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0038668
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 1.1.–
    text: |-
      *CITES-basisverordening:* [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van 9 december
      1996 inzake de bescherming van in het wild levende dier- en plantensoorten door controle op het desbetreffende
      handelsverkeer (PbEG L 61);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *CITES-uitvoeringsverordening:* [verordening (EG) nr. 865/2006](32006R0865) van de Commissie van 6 mei 2006,
      houdende uitvoeringsbepalingen van [Verordening (EG) nr. 338/97](31997R0338) van de Raad inzake de bescherming van
      in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer (PbEU 2006, L 166);
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.–
    text: |-
      *depositieruimte:* in AERIUS Register opgenomen ruimte, uitgedrukt in mol stikstof per hectare per jaar, voor
      stikstofdepositie op een Natura 2000-gebied;
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
  - number: 1.1.−
    text: |-
      *gemeld PAS-project:* project dat voldoet aan de voorwaarden van [artikel 2.8b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel1.1
    references:
      - id: ref1
