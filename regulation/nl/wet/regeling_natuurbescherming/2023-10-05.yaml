        artikel: '2'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: 2.4.1.a
    text: |-
      de onomkeerbare sluiting van varkenshouderijlocaties op grond van
      [artikel 4, eerste lid, van de Subsidieregeling sanering varkenshouderijen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel4
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0042634
        artikel: '4'
  - number: 2.4.1.b
    text: |-
      de blijvende vermindering van de stikstofemissie, bedoeld in
      [artikel 6, eerste lid, van de Regeling provinciale aankoop veehouderijen nabij natuurgebieden][ref1] zoals zij
      luidde tot 1 december 2022;


      [ref1]: https://wetten.overheid.nl/BWBR0046077#Artikel6
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0046077
