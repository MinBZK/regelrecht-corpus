      de blijvende vermindering van stikstofemissie door een maatregel als bedoeld in
      [artikel 2, eerste lid, van de Regeling provinciale maatregelen PAS-melders][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0048054#Artikel2
    url: https://wetten.overheid.nl/BWBR0038668/2023-10-05#Artikel2.4
    references:
