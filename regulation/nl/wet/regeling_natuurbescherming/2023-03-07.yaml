        artikel: '3.28'
  - number: '3.26'
    text: |-
      1 Als rechtspersoonlijkheid bezittende organisaties als bedoeld in
      [artikel 3.28, vijfde lid, van het Besluit natuurbescherming][ref1] die zijn belast met de uitgifte van gesloten
      pootringen zijn aangewezen de in [bijlage 7][ref2] genoemde organisaties.

      2 De organisaties, bedoeld in het eerste lid, verstrekken uitsluitend gesloten pootringen:

      a. waarvoor door de leverancier een schriftelijke garantie is afgegeven dat de ringen voldoen aan de specificaties,
      bedoeld in [artikel 3.25][ref3], en

      b. die ten minste zijn voorzien van de letters NL, de aanduiding van de binnendiameter tot in tienden van een
      millimeter, de laatste twee cijfers van het jaartal waarin de ring mag worden aangebracht en, per ringmaat, een
      uniek nummer bestaande uit de bondscode, een kweeknummer en een volgnummer.

      3 In afwijking van het tweede lid, onderdeel b, zijn de gesloten pootringen, afgegeven door Kleindier Liefhebbers
      Nederland, voorzien van een uniek nummer bestaande uit de bondscode en een volgnummer.

      4 Gesloten pootringen worden aangevraagd met gebruikmaking van een door één van de organisaties, bedoeld in het
      eerste lid, ter beschikking gesteld aanvraagformulier dat volledig ingevuld en ondertekend wordt teruggestuurd.

      5 De organisaties, bedoeld in het eerste lid, geven geen pootring uit, indien:

      a. niet aannemelijk is dat de aanvrager vogels, waarvoor hij een pootring aanvraagt, fokt, of

      b. het redelijke vermoeden bestaat dat de aanvrager handelt of zal handelen in strijd met
      [artikel 3.25, zesde of zevende lid][ref4].

      6 De aanvrager vermeldt in zijn aanvraag per soort hoeveel ringen hij aanvraagt. De hoeveelheid ringen staat in
      verhouding tot de te verwachten nakweek.

      7 De organisaties, bedoeld in het eerste lid, houden een administratie bij met gebruikmaking van een door de
      minister beschikbaar gesteld automatiseringssysteem. In de administratie worden de volgende gegevens opgenomen:

      a. de soorten vogels waarvoor gesloten pootringen zijn aangevraagd;

      b. bij gefokte vogels behorende tot soorten die zijn opgenomen in bijlage A bij de CITES-basisverordening, het
      aantal verstrekte gesloten pootringen, de ringmaat en de bijbehorende unieke nummers als bedoeld in artikel 4 per
      soort en het aantal ouderparen;

      c. bij gefokte vogels behorende tot andere soorten dan bedoeld in onderdeel b, het aantal verstrekte pootringen, de
      ringmaat en de bijbehorende unieke nummers, bedoeld in het tweede lid, onderdeel b, en derde lid;

      d. de datum van toekenning van de gesloten pootringen, en

      e. de noodzakelijke gegevens ter identificatie van de personen aan wie de gesloten pootringen zijn verstrekt.

      8 De administratie, bedoeld in het zevende lid, wordt bewaard gedurende een periode van ten minste vijf jaren.

      9 De organisaties, bedoeld in het eerste lid, verschaffen de minister desgevraagd, op een door de minister te
      bepalen wijze, alle informatie met betrekking tot de afgifte van gesloten pootringen.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.28
