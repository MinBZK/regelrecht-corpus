      1 Ter uitvoering van de vrijstellingen, bedoeld in [artikel 3.1, eerste en tweede lid][ref1], worden:

      a. geen andere vangmiddelen of dodingsmiddelen gebruikt dan de in
      [artikel 3.3, eerste, onderscheidenlijk derde lid][ref2], genoemde middelen;

      b. aardhonden niet gebruikt voor het vangen of doden van vossen in holen in de periode van 1 maart tot en met
      31 augustus;

      c. de in [artikel 3.3, eerste en derde lid][ref3], aangewezen middelen, met uitzondering van fretten, kastvallen,
      vangkooien en buidels, niet gebruikt op zondagen, de nieuwjaarsdag, de tweede paasdag, de tweede pinksterdag, de
      eerste en tweede kerstdag, en de hemelvaartsdag.

