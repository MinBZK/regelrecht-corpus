      1 De aan erkende organisaties door de leverancier in rekening gebrachte kostprijs voor de vervaardiging van
      gesloten pootringen wordt aan de aanvrager doorberekend.

      2 De erkende organisaties kunnen de in het eerste lid bedoelde kostprijs verhogen met een bedrag ter dekking van de
      kosten voor de uitreiking van ringen ter hoogte van maximaal € 1,– per ring.

      3 Gesloten pootringen worden niet uitgereikt dan na voldoening van de som van in het eerste en tweede lid bepaalde
      bedragen.
