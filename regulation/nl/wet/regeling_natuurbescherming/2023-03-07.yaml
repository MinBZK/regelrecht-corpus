        paragraaf: 2.1.2
      - id: ref3
        bwb_id: BWBR0038662
        artikel: '2.12'
  - number: 2.8c
    text: |-
      Het bevoegd gezag geeft bij het reserveren van depositieruimte voor gemelde PAS-projecten voorrang aan projecten
      ten aanzien waarvan het vóór de datum van inwerkingtreding van dit artikel een verzoek heeft ontvangen tot
      handhaving van [artikel 2.7, tweede lid, van de wet][ref1]. Als het na toepassing van de eerste zin noodzakelijk is
      om een keuze te maken tussen projecten, kiest het bevoegd gezag die combinatie van projecten die gezamenlijk voor
      een optimale benutting van de beschikbare depositieruimte zorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.8c
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '2.7'
  - number: 2.8d
    text: |-
      1 Het bevoegd gezag kan alleen depositieruimte reserveren voor gemelde PAS-projecten die zijn geselecteerd met
      toepassing van [artikel 2.8c][ref1].

      2 Het bevoegd gezag kan de ruimte reserveren na ontvangst van een aanvraag om een Natura 2000-vergunning of
      omgevingsvergunning voor dat project.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2.8c
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.8d
