      1 Van de verboden, bedoeld in [artikel 3.1 van de wet][ref1], wordt vrijstelling verleend aan grondgebruikers voor
      de bestrijding van Canadese ganzen, houtduiven, kauwen en zwarte kraaien.

      2 Van de verboden, bedoeld in [artikel 3.10, eerste lid, onderdelen a en b, van de wet][ref2], wordt vrijstelling
      verleend aan grondgebruikers voor de bestrijding van konijnen en vossen.

      3 De vrijstellingen, bedoeld in het eerste en tweede lid, worden verleend voor de handelingen, bedoeld in
      [artikel 3.15, vijfde lid, van de wet][ref3].

      4 De categorieën van schade, bedoeld in [artikel 3.15, zesde lid, onderdeel c, van de wet][ref4], zijn de
      categorieën van schade als bedoeld in de [artikelen 3.10, tweede lid, onderdeel b][ref5], en 3.15, zesde lid,
      onderdeel b, van de wet.

      5 De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien wordt voldaan aan de in de
      [artikelen 3.2 tot en met 3.4][ref6] gestelde voorschriften en beperkingen.


