      1 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.2, eerste lid][ref1], en
      [3.6, eerste lid, van de wet][ref2], voor het verkopen, vervoeren voor verkoop, onder zich hebben voor verkoop of
      ten verkoop aanbieden van een dode vogel of een ander dood dier, of producten daarvan.

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien de vogel of het andere dier aantoonbaar
      is verkregen overeenkomstig het bepaalde bij en krachtens de [artikelen 3.15, tweede of vierde lid][ref3],
      [3.16, tweede of vierde lid][ref4], [3.17, eerste lid][ref5], of [3.18, eerste lid, van de wet][ref6].


