  - number: '4.1'
    text: |-
      1 Als voorschriften als bedoeld in [artikel 4.8, eerste lid, van de wet][ref1] worden aangewezen:

      a. artikel 4, eerste lid, van [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de Europese Unie
      van 20 december 2005 inzake de opzet van een FLEGT-vergunningen-systeem voor de invoer van hout in de Europese
      Gemeenschap (PbEU 2005, L 347);

      b. de artikelen 4 en 5 van verordening (EU) nr. 995/2010 van het Europees Parlement en de Raad van de Europese
      Unie van 20 oktober 2010 tot vaststelling van de verplichtingen van marktdeelnemers die hout en houtproducten op de
      markt brengen (PbEU 2010, L 295).

      2 In afwijking van artikel 5, eerste lid, van [verordening (EG) nr. 2173/2005](32005R2173) van de Raad van de
      Europese Unie van 20 december 2005 inzake de opzet van een FLEGT-vergunningen-systeem voor de invoer van hout in
      de Europese Gemeenschap (PbEU 2005, L 347), wordt de aldaar bedoelde vergunning ingediend ten minste één werkdag
      voorafgaand aan het moment dat de aangifte voor het in het vrije verkeer brengen bij de douane wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4.8
