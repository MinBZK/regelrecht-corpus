  - number: '2.5'
    text: |-
      1 Depositieruimte kan, behalve in een Natura 2000-vergunning, ook worden toegedeeld in:

      a. een omgevingsvergunning;

      b. een tracébesluit.

      2 Depositieruimte kan alleen worden toegedeeld in een besluit als bedoeld in het eerste lid.

      3 Depositieruimte wordt eenmalig en voor onbepaalde tijd toegedeeld.

      4 Depositieruimte wordt alleen toegedeeld voor zover zij eerder is gereserveerd.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.5
  - number: '2.6'
    text: |-
      1 Reservering of toedeling van depositieruimte is mogelijk voor zover daarvoor depositieruimte beschikbaar is.

      2 De beschikbare depositieruimte voor een hectare van een voor stikstof gevoelige habitat in een Natura 2000-
      gebied is de bij vaststelling van de betrokken versie van het register in het register opgenomen depositieruimte
      voor die hectare, verminderd met de depositieruimte die tot dat moment met toepassing van [artikel 2.10][ref1] is
      afgeschreven of met toepassing van de [artikelen 2.8 tot en met 2.9][ref2] is gereserveerd, en vermeerderd met de
      depositieruimte die tot dat moment met toepassing van artikel 2.10 is bijgeschreven.

      3 De depositieruimte die ten behoeve van een of meer projecten wordt gereserveerd of toegedeeld in verband met de
      toename van stikstofdepositie is niet groter dan de hoogste stikstofdepositie op een hectare van een voor stikstof
      gevoelige habitat in een Natura 2000-gebied die die projecten in een jaar kunnen veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2.10
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.6
