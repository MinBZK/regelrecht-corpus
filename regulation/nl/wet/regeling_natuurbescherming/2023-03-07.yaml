  - number: '4.3'
    text: |-
      1 Aan een ieder die een handeling of project als bedoeld in [artikel 1.3, eerste lid, van het Besluit
      natuurbescherming](onbekend) uitvoert, wordt vrijstelling verleend van de [artikelen 4.2, eerste lid][ref1], en
      [4.3, eerste, tweede en vijfde lid, van de wet][ref2].

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend indien:

      a. de houtopstand niet ter voldoening aan [artikel 4.3, eerste lid, van de wet][ref3] is aangelegd;

      b. voordat tot aanleg van de houtopstand wordt overgegaan, het tijdstip en de plaats van aanleg middels een
      formulier zijn gemeld bij de minister en de minister de ontvangst van de melding heeft bevestigd;

      c. het bos binnen een periode van 40 jaar na het op het formulier vermelde tijdstip van aanleg in zijn geheel wordt
      geveld.

      3 De minister stelt het modelformulier voor de melding, bedoeld in het tweede lid, onderdeel b, vast. Het
      modelformulier voorziet onder meer in een kadastrale omschrijving van de percelen waar tot aanleg van het bos wordt
      overgegaan.


