  - number: '3.19'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.24, eerste, tweede en derde lid, van het Besluit natuurbescherming][ref1], voor onderscheidenlijk:

      a. het onder zich hebben of verhandelen van een aantoonbaar gefokte vogel van een soort als bedoeld in artikel 1
      van de Vogelrichtlijn, die niet is genoemd in bijlage A, B, C of D bij de CITES-basisverordening, of producten of
      eieren daarvan;

      b. het onder zich hebben van een aantoonbaar gefokte vogel van een soort die is genoemd in bijlage A, B, C of D bij
      de CITES-basisverordening, en

      c. het verhandelen van een aantoonbaar gefokte vogel van een soort die is genoemd in bijlage C of D bij de CITES-
      basisverordening, of producten of eieren daarvan.

      2 Ingeval de vogel behoort of mede behoort tot een soort als bedoeld in artikel 1 van de Vogelrichtlijn, geldt de
      vrijstelling, bedoeld in het eerste lid, uitsluitend, indien:

      a. de vogel is voorzien van:

      1°. een gesloten pootring, overeenkomstig het bepaalde in [artikel 3.28 van het Besluit natuurbescherming][ref2]
      en [artikel 3.25][ref3];

      2°. een gesloten pootring die, of een ander merkteken dat aantoonbaar rechtmatig is afgegeven door een
      overheidsorgaan van een andere staat dan Nederland, of een door een overheidsorgaan van een andere staat
      dan Nederland erkende organisatie, in overeenstemming met de wettelijke eisen van de betreffende staat,
      onderscheidenlijk indien het product of ei van een dergelijke vogel afkomstig is, of

      3°. ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D, bij de CITES-basisverordening, een
      microchiptransponder overeenkomstig artikel 66, tweede lid, van de CITES-uitvoeringsverordening, tenzij de minister
      een verklaring heeft afgegeven dat een microchiptransponder wegens lichamelijke kenmerken van de betrokken dieren
      aantoonbaar niet veilig kan worden aangebracht;

      b. ingeval het een levende vogel betreft die behoort tot een soort, genoemd in bijlage A bij de CITES-
      basisverordening, is voldaan aan het bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref4] en het
      bepaalde in [artikel 3.24][ref5], en

      c. ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D van de CITES-basisverordening, de vogel
      aantoonbaar met inachtneming van de CITES-basisverordening en CITES-uitvoeringsverordening in Nederland is gebracht
      of verkregen.

      3 Ingeval de vogel behoort tot een soort, genoemd in bijlage A, B, C of D, bij de CITES-basisverordening, niet
      zijnde een soort als bedoeld in artikel 1 van de Vogelrichtlijn, geldt de vrijstelling, bedoeld in het eerste lid,
      uitsluitend indien:

      a. ingeval het een levende gefokte vogel betreft, behorende tot een soort, genoemd in bijlage A bij de CITES-
      basisverordening:

      1°. ten aanzien van de vogel is voldaan aan het tweede lid, onderdeel a, onder 1°, 2° of 3°, onderscheidenlijk
      indien het product of ei van een dergelijke vogel afkomstig is;

      2°. is voldaan aan het bepaalde in artikel 3.27 van het Besluit natuurbescherming en het bepaalde in artikel 3.24,
      en

      3°. de vogel aantoonbaar met inachtneming van de CITES-basisverordening en CITES-uitvoeringsverordening in
      Nederland is gebracht of verkregen;

      b. ingeval het een dode vogel, een product of een ei van een vogel betreft, behorende tot een soort, genoemd in
      bijlage A bij de CITES-basisverordening, de vogel, het product of het ei aantoonbaar met inachtneming van de CITES-
      basisverordening en de CITES-uitvoeringsverordening in Nederland is gebracht of verkregen, of

      c. ingeval de vogel behoort tot een soort, genoemd in bijlage B, C of D, bij de CITES-basisverordening:

      1°. de vogel aantoonbaar is gefokt of het product of het ei van een dergelijke vogel afkomstig is of de vogel, het
      product of het ei aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in
      Nederland zijn gebracht of verkregen, en

      2°. ingeval de vogel behoort tot een soort, genoemd in bijlage B bij de CITES-basisverordening, is voldaan aan het
      bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref6] en het bepaalde in [artikel 3.24][ref7].

      4 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op het onder zich hebben in het veld van een
      levende vogel van een in artikel 1 van de Vogelrichtlijn bedoelde soort:

      a. van het geslacht Cygnus, of

      b. van de orde roofvogels of uilen, tenzij degene die de vogel onder zich heeft, overeenkomstig
      [artikel 3.30, eerste lid, van de wet][ref8] gerechtigd is de vogel te gebruiken als jachtvogel.

      5 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op het onder zich hebben van een
      levende havik. Een ontheffing als bedoeld in [artikel 3.40 van de wet][ref9] van het verbod, bedoeld in
      [artikel 3.24, eerste of tweede lid, van het Besluit natuurbescherming][ref10], op het onder zich hebben,
      onderscheidenlijk verhandelen van een gefokte havik, wordt slechts verleend indien de aanvrager door het overleggen
      van DNA-fingerprints van zowel de oudervogels als de jonge vogel het bewijs levert dat de havik in gevangenschap
      is gefokt.


