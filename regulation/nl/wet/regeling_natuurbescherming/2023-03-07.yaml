  - number: '3.21'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.24, derde lid, van het Besluit
      natuurbescherming](onbekend), voor het verhandelen van een dier, niet zijnde een vogel als bedoeld in artikel 1
      van de Vogelrichtlijn, of een plant van een soort, genoemd in bijlage C of D bij de CITES-basisverordening, of
      producten of eieren daarvan.

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien het dier of de plant aantoonbaar:

      a. in Nederland is gebracht of verkregen met inachtneming van de CITES-basisverordening en de CITES-
      uitvoeringsverordening, of

      b. in Nederland is gefokt, onderscheidenlijk gekweekt.
