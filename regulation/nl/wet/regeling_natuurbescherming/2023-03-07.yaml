  - number: '3.32'
    text: |-
      1 De faunabeheereenheid met het werkgebied bestaande uit de gebieden, bedoeld in
      [artikel 1.9, eerste lid, van het Besluit natuurbescherming][ref1], heeft de rechtsvorm van een stichting. De leden
      van het bestuur van de stichting worden benoemd en ontslagen door de gerechtigde, bedoeld in artikel 1.9, eerste
      lid, van het Besluit natuurbescherming.

      2 De faunabeheereenheid, bedoeld in het eerste lid, stelt voor de in dat lid bedoelde gebieden een faunabeheerplan
      op, dat ten minste de volgende gegevens bevat:

      a. de omvang van het werkgebied van de faunabeheereenheid;

      b. een kaart waarop de begrenzing van het werkgebied van de faunabeheereenheid is aangegeven;

      c. kwantitatieve gegevens over de populatie van de diersoorten ten aanzien waarvan een duurzaam beheer of
      bestrijding noodzakelijk wordt geacht, met inbegrip van gegevens over de aanwezigheid van de populaties in het
      betrokken gebied gedurende het jaar;

      d. een onderbouwing van de noodzaak van een duurzaam beheer of bestrijding van de in onderdeel c bedoelde
      diersoorten, waaronder een onderbouwde verwachting van de belangen die zouden worden geschaad, indien niet tot
      beheer of bestrijding zou worden overgegaan;

      e. een beschrijving van de mate waarin de in onderdeel d bedoelde belangen zijn geschaad in de vijf jaren
      voorafgaand aan het tijdstip van de aanvraag om goedkeuring van het faunabeheerplan;

      f. de gewenste stand van de in onderdeel c bedoelde diersoorten;

      g. per diersoort een beschrijving van de aard, omvang en noodzaak van de handelingen die zullen worden verricht om
      de gewenste stand, bedoeld in onderdeel f, te bereiken;

      h. per diersoort en gewas een beschrijving van de handelingen die in de periode, bedoeld in onderdeel e, zijn
      verricht om het schaden van de in onderdeel d bedoelde belangen te voorkomen, alsmede, voorzover daarover
      redelijkerwijs kwantitatieve gegevens beschikbaar zijn, een beschrijving van de effectiviteit van die handelingen;

      i. voor zover het plan betrekking heeft op het beheer van edelherten, damherten, reeën of wilde zwijnen, een
      beschrijving van het voedselaanbod, de relatie tussen dit voedselaanbod en de grootte van de populatie van de
      betrokken dieren alsmede de mogelijkheden van uitwisseling met aangrenzende terreinen;

      j. een beschrijving van de plaatsen in het werkgebied van de faunabeheereenheid waar en de perioden in het jaar
      waarin de in onderdeel g bedoelde handelingen zullen plaatsvinden;

      k. voor zover daarover kwantitatieve gegevens beschikbaar zijn, een onderbouwde inschatting van de verwachte
      effectiviteit van de in onderdeel g bedoelde handelingen;

      l. een beschrijving van de wijze waarop de effectiviteit van de voorgenomen handelingen zal worden bepaald.

      3 Het faunabeheerplan heeft een geldigheidsduur van ten hoogste vijf jaren.

      4 De jachthouder van de gebieden, bedoeld in [artikel 1.7, eerste lid, van het Besluit natuurbescherming][ref2], is
      uitgezonderd van [artikel 3.14, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel1.9
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel1.7
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3.14
