      2 Gedeputeerde staten brengen uiterlijk op 1 juni 2019, en daarna telkens na zes jaar
      aan de Minister een rapportage uit over de uitvoering van de maatregelen, bedoeld in
      [artikel 3.32, eerste lid, van het Besluit natuurbescherming][ref3], ten aanzien van de in [bijlage 10][ref4]
      genoemde soorten.

      3 Deze rapportage bevat informatie voor het gehele provinciale grondgebied over:

      a. de aard en de doeltreffendheid van de op grond van
      [artikel 3.32, eerste lid, van het Besluit natuurbescherming][ref5] genomen maatregelen, alsmede de gevolgen van
      deze maatregelen voor niet-doelsoorten;

      b. de maatregelen die zijn genomen om het publiek te informeren over de aanwezigheid van invasieve uitheemse
      soorten en over andere acties die burgers verzocht worden te ondernemen, en

      c. indien beschikbaar, de kostprijs van de in de onderdelen a en b bedoelde maatregelen die zijn genomen om aan de
      Verordening invasieve uitheemse soorten te voldoen.


