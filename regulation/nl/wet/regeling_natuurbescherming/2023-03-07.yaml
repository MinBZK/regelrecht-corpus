  - number: '2.7'
    text: |-
      1 Reservering van depositieruimte geschiedt door registratie van de reservering in het register door:

      a. gedeputeerde staten voor woningbouwprojecten en woningbouwclusters;

      b. de Minister van Infrastructuur en Waterstaat voor tracébesluiten;

      c. het bevoegd gezag voor de Natura 2000-vergunning voor gemelde PAS-projecten.

      2 Een reservering voor een woningbouwproject, een tracébesluit of een gemeld PAS-project vervalt als:

      a. het bevoegd gezag een besluit heeft genomen op de betrokken aanvraag voor een Natura 2000-vergunning of een
      omgevingsvergunning;

      b. de Minister van Infrastructuur en Waterstaat het tracébesluit heeft vastgesteld waarvoor hij depositieruimte
      had gereserveerd.

      3 Een reservering voor een woningbouwcluster vervalt als en voor zover gedeputeerde staten depositieruimte
      reserveren voor de woningbouwprojecten in dat cluster, maar in elk geval als sinds de reservering twee jaar zijn
      verstreken.

      4 Gedeputeerde staten kunnen de termijn, bedoeld in het derde lid, eenmaal verlengen met ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.7
  - number: '2.8'
    text: |-
      1 Gedeputeerde staten kunnen depositieruimte reserveren voor een woningbouwproject na de ontvangst van:

      a. een aanvraag voor een Natura 2000-vergunning voor dat project;

      b. de mededeling van een gemeente dat zij een aanvraag heeft ontvangen voor een omgevingsvergunning voor dat
      project.

      2 Gedeputeerde staten beslissen over de reservering van depositieruimte voor woningbouwprojecten in de volgorde
      waarin de aanvragen van een Natura 2000-vergunning of omgevingsvergunning voor deze projecten zijn ontvangen.

      3 Gedeputeerde staten reserveren alleen depositieruimte voor een woningbouwproject als de woningen niet worden
      aangesloten op een distributienet voor aardgas.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.8
  - number: 2.8a
    text: |-
      1 Op aanvraag van het college van burgemeester en wethouders kunnen gedeputeerde staten depositieruimte reserveren
      voor een woningbouwcluster in een gemeente.

      2 Bij de aanvraag wordt een berekening verstrekt waaruit blijkt dat in het register voldoende depositieruimte
      beschikbaar is voor het cluster.

      3 Gedeputeerde staten beslissen over de reservering van depositieruimte voor woningbouwclusters in de volgorde
      waarin de aanvragen zijn ontvangen.

      4 Gedeputeerde staten reserveren alleen depositieruimte voor een woningbouwcluster als de woningen niet worden
      aangesloten op een distributienet voor aardgas.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.8a
  - number: 2.8b
    text: |-
      1 Het bevoegd gezag reserveert alleen depositieruimte voor een gemeld PAS-project als is voldaan aan de volgende
      voorwaarden:

      a. voor het project gold een meldingsplicht op grond van
      [artikel 8 van de Regeling programmatische aanpak stikstof][ref1] zoals dat luidde tot 1 januari 2017 of
      [artikel 2.7][ref2] van de Regeling natuurbescherming zoals dat luidde op 28 mei 2019;

      b. voor het project is in de periode van 1 juli 2015 tot 29 mei 2019 een melding gedaan;

      c. het project is in de periode van 1 juli 2015 tot 29 mei 2019:

      1°. volledig gerealiseerd, waaronder wordt verstaan dat installaties, gebouwen en infrastructuur waren opgericht;

      2°. nog niet volledig gerealiseerd, maar de initiatiefnemer heeft in die periode al wel een begin gemaakt met de
      realisatie, zoals aanleg of oprichting van installaties, gebouwen en infrastructuur; of

      3°. nog niet begonnen, maar in die periode zijn al wel onomkeerbare en significante investeringsverplichtingen voor
      het project aangegaan;

      d. voor de activiteit waarop de melding betrekking heeft, is geen toereikende en onherroepelijke Natura 2000-
      vergunning of omgevingsvergunning verleend;

      e. als de melding betrekking heeft op een wijziging van een project dat geheel of gedeeltelijk was gerealiseerd
      voor 1 februari 2009 maar na de datum waarop artikel 6, derde lid, van de Habitatrichtlijn is gaan gelden voor het
      betrokken Natura 2000-gebied, dan is de totale stikstofdepositie die door het gewijzigde project wordt veroorzaakt
      op een voor stikstof gevoelige habitat in dat gebied niet groter dan de op het moment van de melding geldende
      grenswaarde, bedoeld in [artikel 2.12 van het Besluit natuurbescherming][ref3] zoals dat luidde op 28 mei 2019;

      f. als het project substantieel afwijkt van het gemelde project, veroorzaakt het gewijzigde project niet meer
      stikstofdepositie op een of meer voor stikstof gevoelige habitats in Natura 2000-gebieden dan het gemelde project;
      en

      g. de activiteit waarop het project betrekking heeft, wordt nog verricht.

      2 Het eerste lid, onderdeel g, geldt niet als het project voldoet aan onderdeel c, onder 3°, van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036688#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2.7
      [ref3]: https://wetten.overheid.nl/BWBR0038662#Artikel2.12
