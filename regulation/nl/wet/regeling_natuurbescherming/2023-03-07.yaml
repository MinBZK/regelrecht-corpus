  - number: '2.1'
    text: |-
      1 Voor de vaststelling of een project dat niet direct verband houdt met of nodig is voor het beheer van een Natura
      2000-gebied, afzonderlijk of in combinatie met plannen of andere projecten significante gevolgen kan hebben voor
      dat gebied door het veroorzaken van stikstofdepositie in het gebied op een voor stikstof gevoelige habitat, wordt
      de stikstofdepositie berekend met AERIUS Calculator versie 2022.

      2 AERIUS Calculator wordt beheerd onder verantwoordelijkheid van de minister.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.1
  - number: '2.2'
    text: |-
      Deze paragraaf is alleen van toepassing op:

      a. woningbouwprojecten, inclusief noodzakelijke en direct met het project samenhangende nutsvoorzieningen,
      waterhuishoudkundige maatregelen en infrastructuur en noodzakelijke voorzieningen ten behoeve van een goed woon-
      en leefklimaat;

      b. de tracébesluiten voor de projecten:

      1°. A1/A28 Knooppunt Hoevelaken;

      2°. A4 Haaglanden – N14;

      3°. A6 Almere Buiten Oost – Lelystad;

      4°. A12/A27 Ring Utrecht;

      5°. A27 Houten – Hooipolder;

      6°. A58 Eindhoven – Tilburg;

      7°. A58 Sint Annabosch – Galder;

      c. woningbouwclusters; en

      d. gemelde PAS-projecten.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.2
  - number: '2.3'
    text: |-
      1 Er is een register met de naam AERIUS Register, waarin gegevens worden opgenomen over depositieruimte.

      2 Een besluit waarbij een project wordt toegestaan, kan worden genomen met gebruikmaking van in AERIUS Register
      opgenomen depositieruimte. Daarbij wordt gebruikgemaakt van AERIUS Register versie 2022.

      3 Het register wordt beheerd onder verantwoordelijkheid van de minister.

      4 De minister draagt er zorg voor dat depositieruimte in het register wordt opgenomen die ontstaat door de
      vermindering van stikstofdepositie op Natura 2000-gebieden als gevolg van de bronmaatregelen, bedoeld in
      [artikel 2.4][ref1].

      5 De minister neemt ten hoogste 70% van de vermindering van stikstofdepositie als depositieruimte in het register
      op.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.3
