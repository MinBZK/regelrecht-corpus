  - number: '3.3'
    text: |-
      1 Als middelen als bedoeld in de [artikelen 3.3, vijfde lid, onderdeel a][ref1], en
      [3.25, tweede lid, van de wet][ref2], die mogen worden gebruikt ter uitvoering van de vrijstelling, bedoeld in
      [artikel 3.1, eerste lid][ref3], worden aangewezen:

      a. geweren;

      b. honden, niet zijnde lange honden, en

      c. haviken, slechtvalken en woestijnbuizerds.

      2 Als methoden als bedoeld in [artikel 3.3, vijfde lid, onderdeel a, van de wet][ref4], die mogen worden gebruikt
      ter uitvoering van de vrijstelling, bedoeld in [artikel 3.1, eerste lid][ref5], worden aangewezen:

      a. het vangen of doden met gebruikmaking van niet-levende lokvogels;

      b. het vangen of doden met gebruikmaking van een akoestisch middel waarmee lokgeluiden kunnen worden gemaakt, en

      c. het vangen of doden met gebruikmaking van lokvoer, dat niet vergiftigd of verdovend is.

      3 Als middelen als bedoeld in [artikel 3.25, tweede lid, van de wet][ref6], die mogen worden gebruikt ter
      uitvoering van de vrijstelling, bedoeld in [artikel 3.1, tweede lid][ref7], worden aangewezen:

      a. geweren;

      b. honden, niet zijnde lange honden;

      c. haviken, slechtvalken en woestijnbuizerds;

      d. fretten;

      e. kastvallen;

      f. vangkooien, en

      g. buidels.


