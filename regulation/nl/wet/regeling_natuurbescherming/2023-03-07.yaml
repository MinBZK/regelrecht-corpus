      1 De vergoeding van kosten voor het verstrekken van een jachtakte bedraagt voor:

      a. de uitgifte van een jachtakte: € 192,65 als het onderzoek, bedoeld in
      [artikel 48a van de Regeling wapens en munitie][ref1], deel uitmaakt van de aanvraag; in andere gevallen € 138,20;

      b. de uitgifte van een jachtakte voor de periode aansluitend op de periode waarvoor een jachtakte was uitgegeven:
      € 68,20;

      c. het wijzigen van een jachtakte: € 30,–;

      d. het vervangen als gevolg van verlies van een jachtakte: € 30,–;

      e. een duplicaat van een jachtakte: € 30,–.

      2 De gelden die voldaan zijn ter zake van uitgereikte akten, worden niet gerestitueerd.

      3 De vergoeding van kosten voor een combinatie van de in het eerste lid genoemde handelingen bedraagt niet meer dan
      het bedrag dat verschuldigd zou zijn voor dat deel van de combinatie waarvoor de hoogste vergoeding geldt.


