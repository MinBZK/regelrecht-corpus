  - number: '3.9'
    text: |-
      1 De kennis, bedoeld in [artikel 3.18, eerste lid, onderdeel a, van het Besluit natuurbescherming](onbekend), wordt
      getoetst met:

      a. ten minste vijftig meerkeuzevragen, waarvan:

      1°. vijftien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2°, 3° en 4°,
      van het Besluit natuurbescherming](onbekend);

      2°. tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5° en 6°, van het
      Besluit natuurbescherming](onbekend);

      3°. tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 7° en 8°, van het
      Besluit natuurbescherming](onbekend);

      4°. tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 9° en 10°, van het
      Besluit natuurbescherming](onbekend), en

      5°. vijf vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);

      b. ten minste vijfentwintig meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:

      1°. vijftien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het
      Besluit natuurbescherming](onbekend), en

      2°. tien vragen over de onderwerpen, bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 4°, 5°, 6°, 7°,
      8°, 9°, 10°, 11° en 12°, van het Besluit natuurbescherming](onbekend).

      2 De schietvaardigheid en vakbekwaamheid, bedoeld in [artikel 3.18, eerste lid, onderdeel b, van het Besluit
      natuurbescherming](onbekend), worden getoetst door middel van:

      a. het schieten op ten minste vijfentwintig kleiduiven met hagel;

      b. het doen van ten minste vier schoten in twee series van twee schoten met groot-kaliber kogelgeweer op een doel
      gelegen op een afstand van ten minste vijftig meter, en

      c. het tonen van weidelijk gedrag en bekwaamheid in het veilig omgaan met een geweer in ten minste tien
      gesimuleerde situaties.

      3 Een jachtexamen is uitsluitend met gunstig gevolg afgelegd, indien degene die het examen aflegt:

      a. van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord;

      b. bij het schieten, bedoeld in het tweede lid, onderdeel a, ten minste achttien van de vijfentwintig kleiduiven
      heeft geraakt;

      c. bij het doen van schoten, bedoeld in het tweede lid, onderdeel b, ten minste drie treffers heeft die zijn
      gelegen binnen een cirkel van vijftien centimeter, en

      d. weidelijk gedrag en bekwaamheid als bedoeld in het tweede lid, onderdeel c, naar het oordeel van de organisatie
      die het examen afneemt, heeft getoond.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.9
  - number: '3.10'
    text: |-
      1 De kennis, bedoeld in [artikel 3.19, eerste lid, onderdeel a, van het Besluit natuurbescherming](onbekend), wordt
      getoetst met:

      a. ten minste vijftig meerkeuzevragen, waarvan:

      1°. vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2° en 3°, van
      het Besluit natuurbescherming](onbekend);

      2°. vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5°, van het Besluit
      natuurbescherming](onbekend);

      3°. tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 7° en 8°, van het
      Besluit natuurbescherming](onbekend);

      4°. vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 10°, van het
      Besluit natuurbescherming](onbekend), en

      5°. vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);

      b. ten minste twintig meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:

      1°. tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het
      Besluit natuurbescherming](onbekend), en

      2°. tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 5°, 7°, 8°, 10°,
      11° en 12°, van het Besluit natuurbescherming](onbekend).

      2 De bekwaamheid, bedoeld in [artikel 3.19, eerste lid, onderdeel b, van het Besluit natuurbescherming]
      (onbekend), wordt getoetst bij de beoordeling van twee stages van een jaar bij twee mentoren, aangewezen door de
      in [artikel 3.7][ref1] genoemde organisatie. De stages hebben tot doel om bekwaamheid te verwerven ten aanzien van
      de omgang met jachtvogels, het dragen en zeeg maken van jachtvogels, de verzorging van jachtvogels, het aanleggen
      van tuig, het doden van prooien en slachten van aasdieren, het aanleren van gewenst gedrag van jachtvogels, het
      voorkomen en afleren van ongewenst gedrag van jachtvogels, het zoeken en terugvangen van verloren jachtvogels, het
      beoordelen van de inzetbaarheid van jachtvogels, het toepassen van fretten en het gebruik van fluit, loer en balg.

      3 Een examen voor het gebruik van jachtvogels is uitsluitend met gunstig gevolg afgelegd indien degene die het
      examen aflegt:

      a. van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord;

      b. voldoende bekwaamheid als bedoeld in het tweede lid heeft verworven, naar het oordeel van de organisatie die het
      examen afneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3.7
