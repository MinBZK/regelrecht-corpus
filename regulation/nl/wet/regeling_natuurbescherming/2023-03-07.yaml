  - number: '3.23'
    text: |-
      1 De gegevens, bedoeld in [artikel 3.26, derde lid, onderdeel a, van het Besluit natuurbescherming][ref1], zijn:

      a. de soort waartoe de ter preparatie aangeboden vogel behoort;

      b. het aantal ter preparatie aangeboden vogels;

      c. de datum van ontvangst en aflevering van de ter preparatie aangeboden vogel;

      d. de kennelijke doodsoorzaak van de ter preparatie aangeboden vogel;

      e. de naam en het adres van degenen van wie de ter preparatie aangeboden vogel is ontvangen;

      f. de naam en het adres van degenen aan wie de ter preparatie aangeboden vogel is afgeleverd, en

      g. het nummer van het op de ter preparatie aangeboden vogel overeenkomstig
      [artikel 3.26, tweede lid, onderdeel b, van het Besluit natuurbescherming][ref2], aangebrachte merkteken.

      2 Degene die de vogel prepareert, verstrekt de gegevens, bedoeld in het eerste lid, aan de minister door middel van
      een elektronische melding in een door de minister aangeboden systeem.

      3 Degene die de vogel prepareert geeft een wijziging in gegevens, bedoeld in het eerste lid, onderdeel e, door aan
      de minister. Het tweede lid is van overeenkomstige toepassing op het doorgeven van een wijziging.

      4 Een merkteken als bedoeld in [artikel 3.26, derde lid, onderdeel b, van het Besluit natuurbescherming][ref3]
      wordt door de minister verstrekt en is voorzien van de letters NL, gevolgd door de letters LNV en een uniek nummer.

      5 Een merkteken als bedoeld in het vierde lid wordt aangevraagd door middel van een volledig ingevuld en
      ondertekend formulier, dat kosteloos bij de minister verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3.26
      [ref3]: https://wetten.overheid.nl/BWBR0038662#Artikel3.26
