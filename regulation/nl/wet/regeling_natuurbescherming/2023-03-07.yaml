articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      – *AERIUS Calculator:* rekeninstrument voor de vaststelling van de omvang van stikstofdepositie op een voor
      stikstof gevoelige habitat in een Natura 2000-gebied, beschikbaar op www.aerius.nl;

      – *AERIUS Monitor:* applicatie, beschikbaar op www.aerius.nl, voor het tonen van gegevens over de gevoeligheid
      voor stikstof van habitats, de omvang van stikstofdepositie op die habitats in Natura 2000-gebieden en de relatie
      daartussen;

      – *CITES-basisverordening:* [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van
      9 december 1996 inzake de bescherming van in het wild levende dier- en plantensoorten door controle op het
      desbetreffende handelsverkeer (PbEG L 61);

      – *CITES-uitvoeringsverordening:* [verordening (EG) nr. 865/2006](32006R0865) van de Commissie van 6 mei 2006,
      houdende uitvoeringsbepalingen van [Verordening (EG) nr. 338/97](31997R0338) van de Raad inzake de bescherming van
      in het wild levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer (PbEU 2006, L 166);

      – *depositieruimte:* in het register opgenomen ruimte, uitgedrukt in mol stikstof per hectare per jaar, voor
      stikstofdepositie op een Natura 2000-gebied;

      − *gemeld PAS-project:* project dat voldoet aan de voorwaarden van [artikel 2.8b][ref1];

      – *gesloten pootring:* individueel gemerkte, ononderbroken ring of manchet, zonder enige naad of las, waarmee op
      geen enkele wijze is geknoeid en waarvan het formaat zodanig is dat hij, nadat hij in de eerste levensdagen van
      de vogel is aangebracht, niet kan worden verwijderd wanneer de poot van de vogel zijn definitieve omvang heeft
      bereikt;

      – *minister:* Minister voor Natuur en Stikstof;

      – *Natura 2000-vergunning:* vergunning als bedoeld in [artikel 2.7, tweede lid, van de wet][ref2];

      – *omgevingsvergunning:* omgevingsvergunning voor het realiseren van een project als bedoeld in
      [artikel 2.7, tweede lid, van de wet][ref3];

      – *register:* stikstofdepositieregister, bedoeld in [artikel 2.3][ref4], beschikbaar op www.aerius.nl;

      – *tracébesluit:* tracébesluit als bedoeld in [artikel 9 van de Tracéwet][ref5] voor een in
      [artikel 2.2, onderdeel b][ref6], genoemd project;

      – *Verordening invasieve uitheemse soorten:* verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad
      van de Europese Unie van 22 oktober 2014 betreffende de preventie en beheersing van de introductie en verspreiding
      van invasieve uitheemse soorten (PbEU L 317);

      – *voor stikstof gevoelige habitat:* voor stikstof gevoelig leefgebied voor vogelsoorten, natuurlijke habitat en
      habitat van soorten waarvoor een instandhoudingsdoelstelling geldt;

      – *wet:* [Wet natuurbescherming][ref7];

      − *woningbouwcluster:* cluster van ruimtelijk samenhangende woningbouwprojecten.


