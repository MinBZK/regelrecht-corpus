      1 De vergoeding die de minister in rekening brengt aan de aanvrager voor de behandeling van een aanvraag tot
      afgifte van een valkeniersakte, bedraagt voor:

      a. de uitgifte van een akte: € 65,–;

      b. een duplicaat van een akte: € 30,–.

      2 De gelden die voldaan zijn ter zake van uitgereikte valkeniersakten, worden niet gerestitueerd.

      3 Voor de behandeling van een aanvraag tot afgifte of wijziging van de hierna genoemde documenten worden door de
      minister aan de aanvrager de volgende vergoedingen in rekening gebracht:

      a. een invoervergunning als bedoeld in artikel 4 van de CITES-basisverordening: € 60,–;

      b. een uitvoervergunning als bedoeld in artikel 5 van de CITES-basisverordening: € 60,–;

      c. een wederuitvoercertificaat als bedoeld in artikel 5 van de CITES-basisverordening: € 60,–;

      d. een bijlage bij een document als bedoeld in onderdeel a, b of c waarop maximaal 3 soorten worden vermeld:
      € 60,–;

      e. een inschrijving als wetenschappelijke instelling als bedoeld in artikel 7, vierde lid, van de CITES-
      basisverordening: € 40,–;

      f. een certificaat als bedoeld in de artikelen 8, derde lid, en 9, tweede lid, onderdeel b, van de CITES-
      basisverordening: € 15,–;

      g. een certificaat van persoonlijke eigendom als bedoeld in artikel 37, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;

      h. een certificaat van monsterverzameling als bedoeld in artikel 44 bis van de CITES-uitvoeringsverordening:
      € 60,–;

      i. een muziekinstrumentencertificaat als bedoeld in artikel 44 decies, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;

      j. een certificaat voor reizende tentoonstellingen als bedoeld in artikel 30, eerste lid, van de CITES-
      uitvoeringsverordening: € 45,–;

      k. een etiket als bedoeld in artikel 66, zesde lid, van de CITES-uitvoeringsverordening: € 0,25;

      l. een vergunning als bedoeld in artikel 66, zevende lid, van de CITES-uitvoeringsverordening: € 60,–.

      4 Voor de behandeling van een aanvraag tot afgifte van merktekens als bedoeld in [artikel 3.23, vierde lid][ref1],
      wordt door de minister aan de aanvrager de volgende vergoeding in rekening gebracht: € 1,– per merkteken.

      5 Voor de behandeling van een aanvraag tot afgifte van een document als bedoeld in de artikelen 8, zesde
      lid, en 9, zesde lid, van de Verordening invasieve uitheemse soorten wordt door de Minister, indien
      de aanvraag niet gelijktijdig geschiedt met de aanvraag tot afgifte van een ontheffing als bedoeld in
      [artikel 3.40 van de wet][ref2], de volgende vergoeding in rekening gebracht: € 15,–.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel3.23
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3.40
