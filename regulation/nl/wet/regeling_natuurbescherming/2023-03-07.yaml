  - number: '4.2'
    text: |-
      1 De melding, bedoeld in [artikel 4.2, eerste lid, van de wet][ref1], vindt voor de categorieën van handelingen en
      projecten, bedoeld in [artikel 1.3, eerste lid, van het Besluit natuurbescherming][ref2], plaats door het zenden
      aan de Minister van Landbouw, Natuur en Voedselkwaliteit van een door hem beschikbaar gesteld formulier.

      2 Het formulier, bedoeld in het eerste lid, wordt aan de Minister van Landbouw, Natuur en Voedselkwaliteit gezonden
      ten minste één maand doch niet langer dan één jaar voor het moment van de voorgenomen velling van de houtopstand.

      3 Indien een houtopstand wordt geveld in het kader van een handeling of project als bedoeld in
      [artikel 1.3, eerste lid, van het Besluit natuurbescherming][ref3], kan de minister een ontheffing als bedoeld in
      [artikel 4.5, eerste lid, van de wet][ref4] verlenen indien:

      a. de grond die de eigenaar wil beplanten gelegen is in hetzelfde gebied als dat waar zich de gevelde houtopstand
      bevond;

      b. de grond die de eigenaar wil beplanten niet van mindere kwaliteit is dan die waarop zich de gevelde houtopstand
      bevond;

      c. de grond die de eigenaar wil beplanten ten minste een gelijke oppervlakte heeft als die waarop zich de gevelde
      houtopstand bevond;

      d. de gevelde houtopstand geen deel uitmaakte van een boskern;

      e. de belangen in verband met de bodemproductie niet worden geschaad.

      4 De gebieden, bedoeld in het derde lid, onderdeel a, zijn:

      a. gebied 1: de provincies Groningen, Friesland en Drenthe;

      b. gebied 2: de provincie Overijssel met uitzondering van de Noordoostpolder en de provincies Gelderland en
      Utrecht;

      c. gebied 3: de provincies Noord-Holland, Zuid-Holland en Zeeland en de IJsselmeerpolders;

      d. gebied 4: de provincies Noord-Brabant en Limburg.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel4.2
