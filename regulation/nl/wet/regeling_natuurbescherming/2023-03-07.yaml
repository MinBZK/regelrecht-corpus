  - number: '3.15'
    text: |-
      1 Het is verboden in strijd te handelen met de voorwaarden en vereisten, bedoeld in artikel 11, derde lid, van de
      CITES-basisverordening.

      2 Ten aanzien van een plant van een in bijlage 5 genoemde soort kan degene die de plant uitvoert een fytosanitair
      certificaat aanvragen bij de Minister van Landbouw, Natuur en Voedselkwaliteit. Het fytosanitaire certificaat
      voldoet aan artikel 17, tweede lid, van de CITES-uitvoeringsverordening.

      3 In plaats van een uitvoervergunning als bedoeld in artikel 5, eerste lid, van de CITES-basisverordening wordt
      aanvaard een fytosanitair certificaat dat is verleend overeenkomstig het tweede lid of dat is afgegeven door een
      bevoegde administratieve instantie van een andere lidstaat van de Europese Unie.

      4 De etiketten, bedoeld in de artikelen 52, eerste lid, en 66, zesde lid, van de CITES-uitvoeringsverordening,
      worden aangevraagd bij de minister. Een aanvraag wordt gedaan voor een minimum van 100 etiketten. De aanvrager
      zendt ongebruikte etiketten onverwijld terug naar de minister.

      5 Het is verboden de producten, genoemd in de bijlage bij [richtlijn 83/129/EEG](31983L0129) van de Raad
      van 28 maart 1983 betreffende de invoer in de Lid-Staten van huiden van bepaalde zeehondenjongen en daarvan
      vervaardigde produkten (PbEG 1983, L 91), voor handelsdoeleinden binnen Nederland te brengen.

      6 Het verbod, bedoeld in het vijfde lid, geldt niet voor producten die afkomstig zijn van de traditionele jacht van
      de Eskimobevolking.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.15
  - number: '3.16'
