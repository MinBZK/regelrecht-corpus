  - number: '3.17'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.1, eerste lid][ref1],
      [3.2, zesde lid][ref2], [3.5, eerste lid][ref3], en [3.6, tweede lid][ref4], van de wet voor het opzettelijk vangen
      en onder zich hebben van een zieke of gewonde vogel of een ziek of gewond ander dier, met het oog op het vervoeren
      van de vogel of het dier met een dierenambulance.

      2 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in de [artikelen 3.5, eerste lid][ref5],
      en [3.6, tweede lid][ref6], van de wet voor het opzettelijk vangen en onder zich hebben van een zieke of gewonde
      bruinvis, gewone dolfijn, tuimelaar, witflankdolfijn of witsnuitdolfijn, met het oog op het vervoeren van het dier,
      anders dan met een dierenambulance.

      3 De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien de vogel of het andere
      dier binnen twaalf uur wordt overgedragen aan personen of instanties die krachtens de [wet][ref7] en de
      [Wet dieren][ref8] gerechtigd zijn uit het wild afkomstige dieren onder zich te hebben voor opvang en verzorging.


