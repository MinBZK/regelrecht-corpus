  - number: '3.24'
    text: |-
      1 De administratie, bedoeld in [artikel 3.27, eerste lid, van het Besluit natuurbescherming][ref1], bevat de
      volgende gegevens over de aldaar bedoelde dieren en planten:

      a. de wetenschappelijke soortnaam van het dier of de plant en het aantal dieren of planten van die soort;

      b. de datum en de plaats van verkrijging van het dier of de plant;

      c. de naam, het adres en het land van de leverancier van wie het dier of de plant is verkregen;

      d. het land van herkomst van het dier of de plant, indien dit afwijkt van onderdeel c;

      e. het nummer van het bij de verkrijging van het dier of de plant behorende CITES-document;

      f. de datum en de plaats van vervreemding van het dier of de plant;

      g. de naam, het adres en het land van de afnemer van het dier of de plant;

      h. het nummer van het bij de vervreemding van het dier of de plant behorende CITES-document;

      i. de datum van de geboorte en het aantal nakomelingen van een dier;

      j. gegevens over de soort en de code van de merktekens;

      k. de datum van de aanbrenging van merktekens aan het dier of de plant;

      l. de datum en de plaats van sterfte van het dier of de plant.

      2 De administratie, bedoeld in [artikel 3.27, eerste lid, van het Besluit natuurbescherming][ref2]:

      a. is op naam gesteld, volledig en voorzien van een logische indeling en opeenvolgende nummering;

      b. wordt gevoerd op een wijze dat controle daarvan direct mogelijk is en de gegevens, bedoeld in het eerste lid,
      daaruit duidelijk blijken, en

      c. wordt bewaard met alle aantekeningen en bescheiden, waaronder nota's, vrachtbrieven en andere bewijsmiddelen,
      boeken, registers of andere hulpmiddelen, die betrekking hebben op het onder zich hebben en verhandelen van dieren
      op planten als bedoeld in het eerste lid.

      3 De gegevens, bedoeld in het eerste lid, en de documenten, bedoeld in het tweede lid, worden bewaard gedurende ten
      minste drie jaren na de datum van de laatste in de administratie aangebrachte wijziging of aanvulling.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.27
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3.27
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.24
