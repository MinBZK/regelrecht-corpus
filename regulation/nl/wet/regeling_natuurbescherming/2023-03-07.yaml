  - number: 3.21a
    text: |-
      Onverminderd [artikel 3.2, eerste en zesde lid, van de wet][ref1], wordt aan een ieder vrijstelling verleend van de
      verboden, bedoeld in [artikel 3.24, tweede en derde lid, van het Besluit natuurbescherming][ref2], voor het onder
      zich hebben of verhandelen van een uit het wild afkomstige vogel, behorende tot een soort als bedoeld in artikel 1
      van de Vogelrichtlijn.


