      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref1] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref2], voor zover het betreft het onder zich hebben, het
      voorhanden hebben of het in bezit hebben van een plant van een soort, genoemd in artikel 3.1a van het Besluit
      natuurbescherming, of delen of producten daarvan, voor niet-commerciële doeleinden.

      2 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref3] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref4], voor zover het betreft het verhandelen of het in
      bezit hebben van een plant van een soort, genoemd in artikel 3.1a van het Besluit natuurbescherming, of delen of
      producten daarvan, indien deze handelingen plaatsvinden in het kader van uitroeiing, bestrijding of beheersing van
      die soort.

      3 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.39 van de wet][ref5] in samenhang
      met [artikel 3.1a van het Besluit natuurbescherming][ref6], voor zover het betreft het verhandelen en in bezit
      hebben van een dode plant van een soort, genoemd in artikel 3.1a van het Besluit natuurbescherming, of dode delen
      of dode producten van een plant van die soort.

      4 Aan de vrijstelling, bedoeld in het tweede lid, zijn de volgende voorschriften en beperkingen verbonden:

      a. degene die de in het tweede lid bedoelde handelingen verricht draagt er zorg voor dat alle passende maatregelen
      worden getroffen om te voorkomen dat de planten, of delen of producten daarvan, zich kunnen voortplanten of zich
      kunnen verspreiden in het milieu;

      b. degene die de in het tweede lid bedoelde handelingen verricht kan te allen tijde aannemelijk maken dat hij
      voldoet aan het in onderdeel a bedoelde voorschrift.

      5 Als passende maatregel als bedoeld in het vierde lid, onderdeel a, wordt in ieder geval beschouwd een fysieke
      scheiding tussen de planten en hun natuurlijke leefomgeving.


