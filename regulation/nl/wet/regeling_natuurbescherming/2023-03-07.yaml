      - id: ref2
        bwb_id: BWBR0007376
  - number: '7.18'
    text: Deze regeling treedt in werking op 1 januari 2017.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel7.18
  - number: '7.19'
    text: 'Deze regeling wordt aangehaald als: Regeling natuurbescherming.'
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel7.19
