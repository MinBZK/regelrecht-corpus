  - number: 2.4a
    text: |-
      1 In het register wordt een onderscheid gemaakt tussen depositieruimte die beschikbaar is voor:

      a. woningbouwprojecten en tracébesluiten;

      b. woningbouwclusters; en

      c. gemelde PAS-projecten.

      2 Depositieruimte die is verkregen door de onomkeerbare sluiting van varkenshouderijlocaties, bedoeld in
      [artikel 2.4, eerste lid][ref1], is alleen beschikbaar voor woningbouwprojecten en tracébesluiten, behoudens voor
      zover toepassing is gegeven aan het derde lid.

      3 De minister, in overeenstemming met de Minister van Infrastructuur en Waterstaat en de Minister voor
      Volkshuisvesting en Ruimtelijke Ordening, kan:

      a. depositieruimte die is verkregen door de onomkeerbare sluiting van varkenshouderijlocaties, ook beschikbaar
      stellen voor:

      1°. woningbouwclusters;

      2°. gemelde PAS-projecten;

      b. depositieruimte die beschikbaar is voor woningbouwclusters of gemelde PAS-projecten, ook beschikbaar stellen
      voor woningbouwprojecten en tracébesluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.4a
    references:
