  - number: '3.25'
    text: |-
      1 Voor de soorten, genoemd in bijlage 6, heeft een pootring als bedoeld in
      [artikel 3.28, eerste lid, van het Besluit natuurbescherming][ref1] een maximale diameter als in de bijlage bij die
      soort genoemd.

      2 In afwijking van het eerste lid kan de pootring een diameter hebben die groter is dan de in de bijlage 6
      vastgestelde maximale diameter, als de aanvrager aannemelijk kan maken dat een grotere diameter in verband met de
      dikte van de poot bij de aanvraag noodzakelijk is.

      3 Een pootring als bedoeld in het eerste lid voldoet aan de volgende eisen:

      a. ringen met een diameter van 2,5 tot en met 2,9 mm, gemeten aan de binnenkant van een ring, zijn vervaardigd van
      metaal, waarop een geanodiseerde kleurlaag is aangebracht, en zijn op zodanige wijze voorzien van een breukzone,
      dat de ring knapt, indien de ring wordt opgerekt;

      b. ringen met een diameter kleiner dan 2,5 mm en groter dan 2,9 mm, gemeten aan de binnenkant van een ring, zijn
      vervaardigd van metaal, waarop een geanodiseerde kleurlaag is aangebracht, of zijn vervaardigd van gekleurde
      kunststof, en zijn van zodanige kwaliteit, dat de ring knapt, indien de ring wordt opgerekt.

      4 In afwijking van het derde lid kunnen ringen voor papegaaiachtigen en roofvogels vervaardigd zijn van roestvrij
      staal.

      5 Een pootring als bedoeld in het eerste lid is voorzien van een kleurlaag, die voor elk jaar waarin de ring mag
      worden aangebracht, verschillend is.

      6 De aanvrager brengt een pootring als bedoeld in het eerste lid uitsluitend aan op in Nederland in gevangenschap
      geboren en gefokte vogels van de soort waarvoor hij de ring heeft aangevraagd.

      7 Een aanvrager is niet gerechtigd een pootring als bedoeld in het eerste lid aan derden te verschaffen.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.28
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.25
