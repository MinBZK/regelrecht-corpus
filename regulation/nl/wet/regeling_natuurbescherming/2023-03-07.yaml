  - number: 3.22a
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van de wet][ref1] voor het opzettelijk vangen van een ziek of gewond
      dier, met uitzondering van de gewone zeehond of grijze zeehond, met het oog op het vervoeren van het dier met een
      dierenambulance.

      2 Aan personen die in dienst zijn van, of als opdrachtnemer of als vrijwilliger actief zijn voor een
      van de organisaties, bedoeld in het vijfde lid, wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.10, eerste lid, onderdeel a, van de wet][ref2] voor het opzettelijk vangen van een zieke of gewonde
      gewone zeehond of grijze zeehond, met het oog op het vervoeren van het dier, met een dierenambulance of anders dan
      met een dierenambulance.

      3 De in het tweede lid bedoelde personen zijn werkzaam binnen het werkgebied van de in het vijfde lid bedoelde
      organisatie, weergegeven op de kaart in [bijlage 5a][ref3] bij deze regeling, en beschikken aantoonbaar over:

      a. kennis van:

      1°. gewone en grijze zeehonden en hun leefomgeving;

      2°. het beheer van de gewone en grijze zeehond;

      3°. de belangrijkste wettelijke voorschriften op het terrein van de natuurbescherming en dierenwelzijn;

      4°. het gedrag van gewone en grijze zeehonden bij ziekte of verwonding; en

      b. bekwaamheid in de omgang met de gewone en grijze zeehond.

      4 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:

      a. het dier binnen twaalf uur wordt overgedragen aan personen of instanties die krachtens de wet en de Wet dieren
      gerechtigd zijn uit het wild afkomstige dieren onder zich te hebben en te verzorgen, en

      b. indien het een zieke of gewonde ree, edelhert, damhert of wild zwijn betreft, vóór het vervoer melding is
      gemaakt bij de meldkamer van de politie van het aantal, de vindplaats en de soort zieke of gewonde dieren en het
      vervoer geschiedt door een door de politie aangewezen vervoerder.

      5 De vrijstelling, bedoeld in het tweede lid, geldt uitsluitend, indien het dier binnen twaalf uur wordt
      overgedragen aan één van de volgende organisaties, indien zij bij de beslissing over het vangen, met het oog op het
      vervoeren van het dier, het Handelingskader zeehondenopvang, opgenomen in [bijlage 5b][ref4], volgen, en indien zij
      krachtens de [Wet dieren][ref5] gerechtigd zijn uit het wild afkomstige gewone zeehonden of grijze zeehonden onder
      zich te hebben en te verzorgen:

      a. Stichting A Seal Centrum voor Zeezoogdierenzorg te Stellendam;

      b. Stichting Texels Museum (Ecomare) op Texel;

      c. Stichting Zeehondencentrum Pieterburen te Pieterburen;

      d. Stichting Zeehondenopvang Eemsdelta te Uithuizen;

      e. Stichting Zeehondenopvang Terschelling op West-Terschelling.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.10
