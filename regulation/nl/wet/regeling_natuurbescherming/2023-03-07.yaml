  - number: '3.30'
    text: |-
      1 Van het verbod, bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] in samenhang met [artikel 3.29][ref2]
      van deze regeling, wordt, voor zover het betreft de handelingen, bedoeld in artikel 7, eerste lid, onderdelen b, d,
      e en f, van de Verordening uitheemse invasieve soorten, vrijstelling verleend als beheersmaatregel als bedoeld in
      artikel 19 van de Verordening uitheemse invasieve soorten voor handelingen met dieren van de volgende soorten:

      a. de Chinese wolhandkrab (Eriocheir sinensis);

      b. de Gevlekte Amerikaanse rivierkreeft (Orconectus Limosus);

      c. de Geknobbelde Amerikaanse rivierkreeft (Orconectes virilis);

      d. de Californische rivierkreeft (Pacifastacus leniusculus);

      e. de Rode Amerikaanse rivierkreeft (Procambarus Clarkia), en

      f. de Marmerkreeft (Procambarus fallax forma virginalis).

      2 De vrijstelling wordt slechts verleend voor:

      a. bevissing van de dieren in Nederlandse binnenwateren en kustwateren, de opslag, de handel, het transport,
      het houden, het gebruik of de vernietiging van de opgeviste dieren, en alle onmiddellijk daarmee samenhangende
      handelingen, en

      b. handelingen als bedoeld in onderdeel a ten aanzien van dieren die als beheersmaatregel zijn opgevist en in
      de handel zijn gebracht in andere lidstaten van de Europese Unie overeenkomstig de in die lidstaten geldende
      wetgeving.

      3 Aan de vrijstelling zijn de volgende voorschriften en beperkingen verbonden:

      a. degene die de in het tweede lid, onder a, bedoelde handelingen verricht draagt er zorg voor dat:

      1°. alle passende maatregelen worden getroffen bij de bevissing, de opslag, de handel, het transport, het houden
      en het gebruik van de betrokken dieren om te voorkomen dat zij zich kunnen voortplanten, kunnen ontsnappen en zich
      kunnen verspreiden;

      2°. alle passende maatregelen worden getroffen bij de opslag, het transport en het houden van de dieren om te
      voorkomen dat de betrokken dieren door onbevoegden kunnen worden verwijderd uit de omgeving waarin zij worden
      opgeslagen of getransporteerd;

      3°. het schoonmaken, het beheren van afval en het onderhoud van vistuigen, transport- en opslagmaterialen bij
      bevissing, de opslag, de handel, het transport en het houden van de dieren op zodanige wijze plaatsvindt dat
      exemplaren van de soorten zich niet kunnen verspreiden of door onbevoegden kunnen worden verwijderd;

      4°. voorkomen wordt dat dieren van de soorten op het grondgebied van andere lidstaten worden gebracht, tenzij die
      lidstaten dat toestaan in het kader van door hen getroffen beheersmaatregelen, en

      b. degene die de in het tweede lid, onderdeel a, bedoelde handelingen verricht maakt te allen tijde aannemelijk dat
      hij voldoet aan de in het eerste lid bedoelde voorschriften.

      4 Als passende maatregel als bedoeld in het derde lid, onderdeel a, onderdelen 1° en 2°, wordt in ieder geval
      beschouwd een fysieke scheiding tussen de dieren en hun natuurlijke leefomgeving, waarbij de dieren die overleven
      zich vervolgens niet kunnen voortplanten en zich niet kunnen verspreiden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.37
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel3.29
