  - number: '3.20'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.24, tweede lid, van het Besluit natuurbescherming][ref1], voor het onder zich hebben van:

      a. een dood gewerveld dier, een ongewerveld dier of een plant, behorende tot een soort, genoemd in bijlage A bij de
      CITES-basisverordening, of producten of eieren daarvan;

      b. een levend, aantoonbaar gefokt gewerveld dier, niet zijnde een vogel als bedoeld in artikel 3.19, eerste
      lid, onderdeel a of b, van een soort, genoemd in bijlage A bij de CITES-basisverordening, of producten of eieren
      daarvan, of

      c. een dier, niet zijnde een vogel als bedoeld in artikel 1 van de Vogelrichtlijn, of een plant van een soort,
      genoemd in bijlage B, C of D bij de CITES-basisverordening, of producten of eieren daarvan.

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:

      a. het dier of de plant:

      1°. aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in Nederland is
      gebracht of verkregen, of

      2°. als het een ongewerveld dier of een plant betreft, aantoonbaar in Nederland is gefokt, onderscheidenlijk
      gekweekt, of, als het een levend, gefokt gewerveld dier van een soort, genoemd in bijlage A bij de CITES-
      basisverordening, betreft, is voorzien van een microchiptransponder overeenkomstig artikel 66, derde lid, van de
      CITES-uitvoeringsverordening, tenzij de minister een verklaring heeft afgegeven dat een microchiptransponder wegens
      lichamelijke kenmerken van de betrokken dieren aantoonbaar niet veilig kan worden aangebracht, en

      b. is voldaan aan het bepaalde in [artikel 3.27 van het Besluit natuurbescherming][ref2] en het bepaalde in
      [artikel 3.24][ref3];

      c. als het een levend uit het wild afkomstig dier betreft van een soort, genoemd in bijlage
      B bij de CITES-verordening, ten aanzien van het dier een administratie wordt bijgehouden.
      [Artikel 3.27, derde lid, van het Besluit natuurbescherming][ref4] en [artikel 3.24][ref5] zijn van toepassing op
      de administratie, bedoeld in de vorige volzin.

      3 De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel a, is niet van toepassing ten aanzien van botten
      en daarvan of daarmee vervaardigde producten van de tijger (Panthera tigris) en hoorns en daarvan of daarmee
      vervaardigde producten van de soorten van de familie neushoorns (Rhinocerotidea).

      4 De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel b, is niet van toepassing ten aanzien van dieren
      van soorten behorende tot de orde van de primaten (Primates) of de familie van de katachtigen (Felidae).

      5 De vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel c, is niet van toepassing ten aanzien van levende
      dieren van de soorten:

      a. Bengaalse kat (Prionailurus bengalensis);

      b. Canadese lynx (Lynx canadensis);

      c. caracal (Caracal caracal);

      d. poema (Puma concolor);

      e. roestkat (Prionailurus rubiginosus);

      f. rode lynx (Lynx rufus);

      g. jagoearoendi of otterkat (Herpailurus yaguarondi);

      h. leeuw (Panthera leo);

      i. fretkat (Cryptoprocta ferox), en

      j. behorende tot de orde van de primaten (Primates).

      6 Onverminderd het tweede lid, geldt de vrijstelling, bedoeld in het eerste lid, aanhef en onderdeel c, ten
      aanzien van de aal (Anguilla anguilla) uitsluitend indien aantoonbaar is voldaan aan het bij of krachtens de
      [Visserijwet 1963][ref6] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.24
