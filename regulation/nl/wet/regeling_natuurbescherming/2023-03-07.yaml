  - number: '3.11'
    text: |-
      1 De kennis, bedoeld in [artikel 3.22, eerste lid, van het Besluit natuurbescherming](onbekend), wordt getoetst
      met:

      a. ten minste veertig meerkeuzevragen, waarvan:

      1°. vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2° en 3°, van
      het Besluit natuurbescherming](onbekend);

      2°. vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 5°, van het Besluit
      natuurbescherming](onbekend);

      3°. vijftien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 10°, van het
      Besluit natuurbescherming](onbekend), en

      4°. vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 11° en 12°, van het
      Besluit natuurbescherming](onbekend);

      b. ten minste vijftien meerkeuzevragen, gesteld met behulp van beelddragers, waarvan:

      1°. tien vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 1° en 2°, van het
      Besluit natuurbescherming](onbekend), en

      2°. vijf vragen over onderwerpen als bedoeld in [artikel 3.18, eerste lid, onderdeel a, onder 3°, 5°, 10°, 11° en
      12°, van het Besluit natuurbescherming](onbekend).

      2 Een examen voor het gebruik van eendenkooien is uitsluitend met gunstig gevolg afgelegd indien degene die het
      examen aflegt van de vragen, bedoeld in het eerste lid, ten minste 70% goed heeft beantwoord.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.11
  - number: '3.12'
    text: |-
      1 Een jachtakte wordt aangevraagd door middel van een volledig ingevuld en ondertekend formulier, dat kosteloos bij
      de korpschef verkrijgbaar is.

      2 Een valkeniersakte wordt aangevraagd door middel van een volledig ingevuld en ondertekend formulier, dat
      kosteloos bij de Minister van Landbouw, Natuur en Voedselkwaliteit verkrijgbaar is.

      3 Een jachtakte of valkeniersakte kan in het geval, bedoeld in [artikel 3.28, vijfde lid, van de wet][ref1]
      namens de persoon voor wie de akte bestemd is, worden aangevraagd door een jachthouder die hem voor de jacht heeft
      uitgenodigd.

      4 Een aanvraag als bedoeld in het eerste of tweede lid gaat vergezeld van twee goed gelijkende pasfoto's van degene
      voor wie de akte bestemd is.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.28
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3.28'
  - number: '3.13'
    text: |-
      1 Het model van de jachtakte, bedoeld in [artikel 3.28, zevende lid, van de wet][ref1], wordt gevormd door een
      modelformulier, dat door de korpschef wordt gewaarmerkt door middel van een stempelafdruk en een handtekening voor
      de periode waarvoor de jachtakte wordt verleend.

      2 Als modelformulier als bedoeld in het eerste lid wordt vastgesteld het modelformulier, opgenomen in
      [bijlage 3][ref2].

      3 De jachtakte wordt voorzien van de pasfoto van degene voor wie de akte is bestemd. Deze foto wordt door de
      korpschef door middel van een stempelafdruk gewaarmerkt.

      4 Als model van de valkeniersakte, bedoeld in [artikel 3.30, tweede lid, van de wet][ref3], in samenhang met
      [artikel 3.28, zevende lid, van de wet][ref4], wordt vastgesteld het model, opgenomen in bijlage 4.

      5 In afwijking van het tweede lid wordt voor de periode van 1 april
      2016 tot en met 31 maart 2017 vastgesteld het modelformulier, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _____________, zoals deze gold op 31 december 2016, voorzien van een zegel als bedoeld in
      [artikel 2 van die regeling][ref6].


