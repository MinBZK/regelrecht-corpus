    text: |-
      1 Voor de behandeling van een aanvraag van een vergunning als bedoeld in
      [artikel 2.7, tweede lid, van de wet][ref1] worden, ingeval [artikel 1.3, vijfde lid, van de wet][ref2] van
      toepassing is, door de minister aan de aanvrager de volgende vergoedingen in rekening gebracht:

      a. indien de vergunning voor een geldigheidsduur van maximaal één jaar wordt aangevraagd: € 800,–;

      b. indien de vergunning voor een geldigheidsduur van één tot drie jaar wordt aangevraagd: € 1.900,–;

      c. indien de vergunning voor een geldigheidsduur van drie jaar of meer wordt aangevraagd: € 3.500,–.

      2 Voor de behandeling van een aanvraag van een ontheffing als bedoeld in de [artikelen 3.3, eerste lid][ref3],
      en [3.8, eerste lid][ref4], in voorkomend geval in samenhang met [artikel 3.10, tweede lid, van de wet][ref5]
      worden, ingeval [artikel 1.3, vijfde lid, van de wet][ref6] van toepassing is, door de minister aan de aanvrager de
      volgende vergoeding in rekening gebracht:

      a. indien de ontheffing voor een geldigheidsduur van maximaal één jaar wordt aangevraagd: € 600,–;

      b. indien de ontheffing voor een geldigheidsduur van één tot drie jaar wordt aangevraagd: € 1.600,–;

      c. indien de ontheffing voor een geldigheidsduur van drie jaar of meer wordt aangevraagd: € 3.000,–.

      3 Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in de
      [artikelen 3.3, derde lid][ref7], en [3.8, derde lid, van de wet][ref8] wordt door de minister aan de aanvrager de
      volgende vergoeding in rekening gebracht: € 80,–.

      4 Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in
      [artikel 3.34, vijfde lid, van de wet][ref9] wordt door de minister aan de aanvrager de volgende vergoeding in
      rekening gebracht:

      a. voor de herintroductie van een soort: € 1.600,–;

      b. voor het uitzetten, planten of zaaien van exoten: € 800,–.

      5 Voor de behandeling van een aanvraag tot afgifte of wijziging van een ontheffing als bedoeld in
      [artikel 3.40 van de wet][ref10] wordt door de minister aan de aanvrager de volgende vergoeding in rekening
      gebracht: € 100,–.

      6 In afwijking van het vijfde lid, wordt voor de behandeling van een aanvraag tot afgifte of
      wijziging van een ontheffing als bedoeld in [artikel 3.40 van de wet][ref11] van het bepaalde in
      [artikel 3.24, eerste, tweede of derde lid, van het Besluit natuurbescherming][ref12] ten aanzien van levende
      dieren door de minister aan de aanvrager de volgende vergoeding in rekening gebracht: € 15,–.

      7 In afwijking van het eerste en tweede lid wordt, ingeval een aanvraag wordt afgewezen omdat voor het uitvoeren
      van de betreffende handeling geen vergunning, onderscheidenlijk ontheffing is vereist, aan de aanvrager de volgende
      vergoeding in rekening gebracht: € 800,–, onderscheidenlijk € 600,–.

      8 Voor de goedkeuring van een gedragscode als bedoeld in de [artikelen 3.31, eerste lid][ref13], of
      [4.4, eerste lid, onderdeel d, van de wet][ref14] wordt door de minister aan de aanvrager de volgende vergoeding in
      rekening gebracht: € 3.000,–.

      9 In afwijking van het eerste en tweede lid, worden voor de behandeling van een aanvraag tot wijziging van een
      vergunning als bedoeld in het eerste lid of van een ontheffing als bedoeld in het tweede lid door de minister aan
      de aanvrager de volgende vergoedingen in rekening gebracht:

      a. indien de wijziging geen nieuwe ecologische beoordeling vergt: geen;

      b. indien de wijziging een nieuwe ecologische beoordeling vergt: 25 procent van de vergoedingen als bedoeld in
      het eerste lid, onderdelen a, b of c, en het tweede lid, onderdelen a, b of c, voor zover het een aldaar bedoeld
      vergunning of ontheffing betreft.

      10 In afwijking van het eerste en achtste lid, wordt voor de behandeling van een aanvraag van een ontheffing als
      bedoeld in de [artikelen 3.3, eerste lid][ref15], en [3.8, eerste lid, van de wet][ref16] van de verboden als
      bedoeld in de [artikelen 3.2, zesde lid][ref17], onderscheidenlijk [3.6, tweede lid, van de wet][ref18], ingeval
      artikel 1.3, vijfde lid, van de wet van toepassing is, door de minister aan de aanvrager de volgende vergoeding in
      rekening gebracht: € 60,–.


