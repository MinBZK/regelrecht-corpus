  - number: '3.22'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.25 van het Besluit natuurbescherming][ref1], voor het onder zich hebben of verhandelen van een dood
      dier.

      2 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in
      [artikel 3.25 van het Besluit natuurbescherming][ref2], voor het onder zich hebben van een levend dier.

      3 De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien het dier:

      a. aantoonbaar is verkregen:

      1°. in Nederland overeenkomstig een ontheffing of vrijstelling als bedoeld in de [artikelen 3.10, tweede lid][ref3],
      in samenhang met [artikel 3.8, eerste of tweede lid, van de wet][ref4], een vrijstelling als bedoeld
      in de [artikelen 3.15, tweede of vierde lid][ref5], of [3.16, tweede of vierde lid, van de wet][ref6],
      een ontheffing als bedoeld in [3.17, eerste lid, van de wet][ref7], een opdracht als bedoeld in
      [artikel 3.18, eerste lid, van de wet ][ref8]of op grond van [artikel 3.20, eerste lid, van de wet][ref9], of

      2°. buiten Nederland overeenkomstig de aldaar geldende regelgeving, of

      b. indien het een dood dier betreft, aantoonbaar in het wild is gestorven buiten schuld of medeweten van degene die
      zich het dier heeft toegeëigend.


