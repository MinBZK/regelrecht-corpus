  - number: '3.14'
    text: |-
      Als voorschriften als bedoeld in [artikel 3.37, eerste lid, van de wet][ref1] worden aangewezen:

      a. de artikelen 4, eerste lid, eerste volzin, tweede lid, eerste volzin, derde en vierde lid, 5, eerste en vierde
      lid, eerste volzin, 6, derde lid, 8, eerste lid, in samenhang met het vijfde lid, en 9, eerste, vierde en vijfde
      lid van de CITES-basisverordening;

      b. artikel 3, eerste lid, van [verordening (EG) nr. 1007/2009](32009R1007) van het Europees Parlement en de Raad
      van 16 september 2009 betreffende de handel in zeehondenproducten (PbEU 2009, L 286), en

      c. artikel 3, eerste lid, van [verordening (EEG) nr. 3254/91](31991R3254) van de Raad van 4 november 1991 houdende
      een verbod op het gebruik van de wildklem in de Gemeenschap en op het binnenbrengen in de Gemeenschap van pelzen en
      produkten die vervaardigd zijn van bepaalde in het wild levende diersoorten uit landen waar gebruik wordt gemaakt
      van de wildklem of andere vangmethoden die niet stroken met de internationale normen voor humane vangst met behulp
      van vallen (PbEG 1991, L 308).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.37
