  - number: 3.18a
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.2, eerste en zesde lid, van de wet][ref1], voor het verkopen, vervoeren, onder zich hebben of ten
      verkoop aanbieden van een dode vogel die vanuit een ander land Nederland is binnen gebracht.

      2 Aan een ieder wordt vrijstelling verleend van de verboden, bedoeld in
      [artikel 3.6, eerste en tweede lid, van de wet][ref2], voor het onder zich hebben, vervoeren, verhandelen, ruilen
      of te koop of te ruil aanbieden van een dood dier of een dode plant die vanuit een ander land Nederland is binnen
      gebracht.

      3 De vrijstellingen, bedoeld in het eerste en tweede lid, gelden uitsluitend, indien:

      a. de vogel, het dier of de plant aantoonbaar is verkregen buiten Nederland overeenkomstig de aldaar geldende
      regelgeving, en

      b. ingeval de vogel, het dier of de plant behoort tot een soort, genoemd in bijlage A, B, C of D van de CITES-
      basisverordening, de vogel, het dier of de plant aantoonbaar met inachtneming van de CITES-basisverordening en
      CITES-uitvoeringsverordening in Nederland is gebracht of verkregen.

      4 De vrijstelling, bedoeld in het tweede lid, is niet van toepassing ten aanzien van botten en daarvan of daarmee
      vervaardigde producten van de tijger (Panthera tigris).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3.6
