  - number: '3.18'
    text: |-
      1 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.2, zesde lid, van de wet][ref1],
      voor het onder zich hebben en vervoeren van een dode vogel met het oog op preparatie daarvan.

      2 De vrijstelling, bedoeld in het eerste lid, geldt uitsluitend, indien:

      a. de vogel kennelijk is gestorven buiten schuld of medeweten van degene die zich de vogel heeft toegeëigend, en

      b. degene die de vogel onder zich heeft:

      1°. de vogel binnen drie dagen aflevert bij een preparateur voor preparatie, of

      2°. de vogel zelf prepareert en voldoet aan [artikel 3.26 van het Besluit natuurbescherming][ref2] en
      [artikel 3.23][ref3] van deze regeling.

      3 Aan een ieder wordt vrijstelling verleend van het verbod, bedoeld in [artikel 3.2, zesde lid, van de wet][ref4],
      voor het onder zich hebben van een geprepareerde vogel.

      4 De vrijstelling, bedoeld in het derde lid, geldt uitsluitend, indien de vogel is gemerkt met een merkteken
      overeenkomstig het bepaalde in [artikel 3.26, tweede lid, onderdeel b, van het Besluit natuurbescherming][ref5] en
      [artikel 3.23, vierde en vijfde lid][ref6].

      5 Onverminderd het tweede en vierde lid, gelden de vrijstellingen, bedoeld in het eerste en derde lid, uitsluitend
      indien de vogel aantoonbaar met inachtneming van de CITES-basisverordening en de CITES-uitvoeringsverordening in
      Nederland is gebracht of verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.2
