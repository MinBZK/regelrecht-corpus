        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: 2.1.2
  - number: '2.4'
    text: |-
      1 De onomkeerbare sluiting van varkenshouderijlocaties op grond van
      [artikel 4, eerste lid, van de Subsidieregeling sanering varkenshouderijen][ref1] is een bronmaatregel als bedoeld
      in [artikel 2.3, vierde lid][ref2].

      2 Op verzoek van een college van burgemeester en wethouders, van gedeputeerde staten of van het dagelijks bestuur
      van een waterschap kan de minister een maatregel van dat bestuursorgaan aanmerken als een bronmaatregel als bedoeld
      in [artikel 2.3, vierde lid][ref3].

      3 Een bronmaatregel als bedoeld in het eerste en tweede lid wordt alleen in de berekening van de vermindering van
      stikstofdepositie betrokken:

      a. als voor de maatregel een wettelijk voorschrift of een besluit nodig is: nadat dat voorschrift of besluit in
      werking is getreden;

      b. voor zover de vermindering van stikstofdepositie met zekerheid en nauwkeurigheid kan worden vastgesteld; en

      c. als handhaving van de wettelijke voorschriften die verband houden met de bronmaatregel verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0038668#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0038668#Artikel2.3
