  - number: '2.9'
    text: |-
      Voordat de Minister van Infrastructuur en Waterstaat depositieruimte reserveert voor een tracébesluit, stemt hij
      dat af met gedeputeerde staten van de betrokken provincies.
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.9
  - number: '2.10'
    text: |-
      1 Voor woningbouwprojecten dragen gedeputeerde staten terstond zorg voor:

      a. afschrijving in het register van depositieruimte die aan dat project is toegedeeld;

      b. doorhaling van gereserveerde depositieruimte als de betrokken vergunningaanvraag is ingetrokken of als een
      besluit is genomen op de betrokken aanvraag;

      c. de bijschrijving in het register van depositieruimte die is vrijgevallen omdat:

      1°. de vergunning waarbij depositieruimte is toegedeeld, is ingetrokken voordat het project is aangevangen;

      2°. de bouw- en aanlegfase waarvoor depositieruimte is toegedeeld, is afgerond;

      d. omzetting van toegedeelde in gereserveerde depositieruimte als de vergunning is vernietigd.

      2 Voor woningbouwclusters dragen gedeputeerde staten terstond zorg voor:

      a. doorhaling van gereserveerde depositieruimte voor zover zij die ruimte hebben gereserveerd voor de
      woningbouwprojecten in dat cluster;

      b. de bijschrijving in het register van depositieruimte die is vrijgevallen doordat de termijn, bedoeld in
      [artikel 2.7, derde of vierde lid][ref1], is verstreken.

      3 Voor tracébesluiten draagt de Minister van Infrastructuur en Waterstaat terstond zorg voor:

      a. afschrijving in het register van depositieruimte die hij heeft toegedeeld;

      b. doorhaling van gereserveerde depositieruimte als hij het betrokken tracébesluit heeft vastgesteld;

      c. de bijschrijving in het register van depositieruimte die is vrijgevallen omdat de bouw- en aanlegfase waarvoor
      depositieruimte is toegedeeld, is afgerond;

      d. omzetting van toegedeelde in gereserveerde depositieruimte als het tracébesluit is vernietigd.

      4 Voor gemelde PAS-projecten draagt het bevoegd gezag terstond zorg voor:

      a. afschrijving in het register van depositieruimte die aan dat project is toegedeeld;

      b. doorhaling van gereserveerde depositieruimte als de betrokken vergunningaanvraag is ingetrokken of als een
      besluit is genomen op de betrokken aanvraag;

      c. omzetting van toegedeelde in gereserveerde depositieruimte als de vergunning is vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0038668#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0038668/2023-03-07#Artikel2.10
