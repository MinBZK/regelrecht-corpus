      De handelingen waarvoor vrijstelling wordt verleend, vinden plaats overeenkomstig het faunabeheerplan, dat
      is vastgesteld overeenkomstig [artikel 3.12, eerste, derde tot en met zesde lid, van de wet][ref1] en dat is
