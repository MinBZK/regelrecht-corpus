---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_draagvlak_natuur
regulatory_layer: WET
publication_date: '2007-02-15'
valid_from: '2005-07-17'
bwb_id: BWBR0012519
url: https://wetten.overheid.nl/BWBR0012519/2005-07-17
preamble:
  text: |-
    Gelet op artikel 2 van de Kaderwet LNV-subsidies,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
            Dienst Regelingen:

              Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;



            c
             project:

              geheel van afgebakende en eenmalige activiteiten met een bovenprovinciaal karakter gericht op één of meer
      concrete resultaten;



            d
             programma:

              samenhangend geheel van activiteiten met een bovenprovinciaal karakter gericht op één of meer van de in
      [artikel 21][ref1] genoemde doelstellingen, waarbij de uitvoering op grond van ontwikkelingen binnen het programma
      of maatschappelijke ontwikkelingen gedurende de looptijd kan worden aangepast;



            e
             natuur:

              beleidsterreinen natuur, bos en landschap.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel21
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '21'
        paragraaf: '8'
  - number: '2'
    text: |-
      De minister kan subsidie verstrekken voor projecten respectievelijk programma's die een bijdrage leveren aan de
      realisering van de in [artikel 16][ref1] respectievelijk [artikel 21][ref2] geformuleerde doelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel21
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '16'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0012519
        artikel: '21'
        paragraaf: '8'
  - number: '3'
    text: |-
      Voor subsidieverleningen komen in aanmerking stichtingen, verenigingen of samenwerkingsverbanden daarvan, waarvan
      het werkgebied zich uitstrekt over meer dan twee provincies.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel3
  - number: '4.1'
    text: |-
      De minister stelt jaarlijks een subsidieplafond voor de verlening van subsidies op grond van deze regeling vast
      voor het komende begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel4
  - number: '4.2'
    text: De minister maakt een besluit als bedoeld in het eerste lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2][ref1] kan worden verleend voor de volgende met het project of programma
      verband houdende kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel2
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '2'
        paragraaf: '2'
  - number: 5.1.a
    text: |-
      de gemaakte en te betalen loonkosten van het direct bij de uitvoering van het project of programma betrokken
      personeel in dienst van de subsidieontvanger berekend aan de hand van de normbedragen per salarisschaal, zoals
      opgenomen in de Handleiding Overheidstarieven van het Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: 5.1.b
    text: kosten van verbruikte materialen of hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: 5.1.c
    text: |-
      aan derden verschuldigde kosten ter zake van planvormings- en uitvoeringsactiviteiten tot een maximum van 35% van
      de in de onderdelen a, b en d genoemde kosten;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: 5.1.d
    text: |-
      kosten van vrijwilligers, voor zover deze een vrijwilligersvergoeding ontvangen, tot maximaal het bedrag dat
      jaarlijks belastingvrij als vrijwilligersvergoeding kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: 5.1.e
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: 5.1.f
    text: de voor de vaststelling van de subsidie benodigde accountantsverklaring, tot een maximum van € 1820.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: '5.2'
    text: |-
      Een subsidie voor programma's kan tevens worden verleend voor de kosten van de in [artikel 24][ref1] bedoelde
      evaluatie tot een maximum van 10% van de in de onderdelen a tot en met e van het eerste lid genoemde kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel24
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '24'
        paragraaf: '8'
  - number: '5.3'
    text: |-
      De subsidiabele kosten worden verhoogd met een forfaitaire opslag voor overhead van 10% van de in het eerste lid,
      onderdeel a, bedoelde loonkosten.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: '5.4'
    text: |-
      De subsidiabele kosten kunnen worden verhoogd met een opslag voor onvoorziene kosten van maximaal 15% van de in het
      eerste lid, onderdelen b tot en met f, genoemde kosten.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: '5.5'
    text: |-
      De kosten, bedoeld in het eerste, tweede en vierde lid, worden in aanmerking genomen met inbegrip van de
      verschuldigde omzetbelasting indien de aanvrager de omzetbelasting niet kan verrekenen met de door hem af te dragen
      omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: '5.6'
    text: |-
      Voor het normbedrag, bedoeld in het eerste lid, onderdeel a, wordt uitgegaan van het kosten-plus tarief gebaseerd
      op respectievelijk ten hoogste salarisschaal 6 voor ondersteund personeel, ten hoogste salarisschaal 11 voor
      uitvoerend personeel en ten hoogste salarisschaal 13 voor toezichthoudend personeel.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel5
  - number: '6.1'
    text: |-
      De subsidie bedraagt maximaal 100% van de in [artikel 5][ref1] bedoelde kosten met dien verstande dat voor
      programma's de te verlenen subsidie gemiddeld jaarlijks ten hoogste € 56.722,53 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel5
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '5'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Indien voor het project of programma waarvoor op grond van deze regeling subsidie wordt verleend, andere subsidies
      door de Rijksoverheid worden verstrekt, wordt slechts een zodanig bedrag op grond van deze regeling verstrekt, dat
      de som van de subsidies het in het eerste lid genoemde percentage niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel6
  - number: '6.3'
    text: |-
      Indien voor het project of programma waarvoor op grond van deze regeling subsidie is verleend, subsidies door
      anderen dan de Rijksoverheid of financiële middelen door niet-bestuursorganen worden verstrekt, wordt slechts een
      zodanig bedrag op grond van deze regeling verstrekt, dat de som van de subsidies of de financiële middelen niet
      meer bedraagt dan 100% van de totale kosten van het project of programma.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel6
  - number: '7.1'
    text: |-
      De minister stelt jaarlijks een of meer perioden vast waarin aanvragen tot subsidieverlening kunnen worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel7
  - number: '7.2'
    text: De minister maakt besluiten als bedoeld in het eerste lid bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel7
  - number: '8.1'
    text: |-
      Een aanvraag tot subsidieverlening wordt gericht aan de minister en ingediend bij Dienst Regelingen met
      gebruikmaking van het daarvoor bestemde aanvraagformulier en gaat vergezeld van een projectplan of programmaplan.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: '8.2'
    text: 'Het projectplan of programmaplan houdt in ieder geval in:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: 8.2.a
    text: |-
      een beschrijving van het project of programma, waarin is opgenomen een probleemanalyse, het doel van het project of
      programma, de noodzaak van het project of programma alsmede de noodzaak van de kosten;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: 8.2.b
    text: |-
      een sluitende begroting voor het project of programma alsmede een toelichting daarop; indien het een meerjarig
      project of programma betreft, is de begroting een meerjarenbegroting met een liquiditeitsplanning per jaar;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: 8.2.c
    text: |-
      de doelstelling of de doelstellingen, bedoeld in [artikel 16][ref1] respectievelijk [artikel 21][ref2], waarop het
      project respectievelijk het programma betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel21
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '16'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0012519
        artikel: '21'
        paragraaf: '8'
  - number: 8.2.d
    text: de criteria die gehanteerd worden om de resultaten van het project of programma te toetsen;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: 8.2.e
    text: de realisatietermijn.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel8
  - number: '9'
    text: |-
      De minister beslist binnen vier maanden na afloop van een aanvraagperiode op aanvragen die in de betrokken
      aanvraagperiode zijn ingediend met inachtneming van [artikel 20][ref1] dan wel [artikel 25][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel25
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '20'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0012519
        artikel: '25'
        paragraaf: '8'
  - number: '10'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '11'
    text: |-
      De subsidieontvanger maakt een aanvang met het project of het programma binnen één jaar na afgifte van de
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel11
  - number: '12'
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op eenvoudige en
      duidelijke wijze alle kosten van het project of programma kunnen worden afgelezen, gespecificeerd overeenkomstig de
      in [artikel 5][ref1] onderscheiden kostenposten, waarbij ter zake van de loonkosten van het personeel in dienst van
      de subsidieontvanger een door middel van een sluitende tijdschrijving vastgestelde urenverantwoording aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel5
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '5'
        paragraaf: '2'
  - number: '13.1'
    text: De aanvraag tot subsidievaststelling wordt binnen vier maanden na afloop van het project of programma ingediend.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
  - number: '13.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
  - number: 13.2.a
    text: een financiële verantwoording van het project of programma;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
  - number: 13.2.b
    text: |-
      een verklaring van een registeraccountant of een accountant-administratieconsulent als bedoeld in
      [artikel 2:393, eerste lid, van het Burgerlijk Wetboek][ref1] waaruit blijkt dat is voldaan aan de in deze regeling
      gestelde voorwaarden en verplichtingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 13.2.c
    text: de eindrapportage.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
  - number: '13.3'
    text: |-
      Een aanvraag tot vaststelling van een programmasubsidie gaat tevens vergezeld van de resultaten van de in
      [artikel 24][ref1] bedoelde evaluatie en indien van toepassing van een verantwoording van aanpassingen in de
      uitvoering van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel24
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '24'
        paragraaf: '8'
  - number: '13.4'
    text: |-
      De registeraccountant of accountant-administratieconsulent, bedoeld in het tweede lid, onderdeel b, controleert met
      inachtneming van het in [bijlage 1][ref1] bij deze regeling opgenomen controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0012519
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012519
  - number: '13.5'
    text: |-
      De goedkeurende accountantsverklaring wordt opgesteld overeenkomstig de in [bijlage 2][ref1] opgenomen
      modelaccountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0012519
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012519
  - number: '13.6'
    text: |-
      De minister behoudt zich het recht voor om de Accountantsdienst van het Ministerie van Landbouw, Natuurbeheer en
      Visserij een review te laten uitvoeren op de door de accountant van de aanvrager verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel13
  - number: '14'
    text: |-
      De minister stelt binnen vier maanden na ontvangst van de in [artikel 13][ref1] bedoelde bescheiden de subsidie
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel13
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '13'
        paragraaf: '5'
  - number: '15.1'
    text: 'De minister kan de subsidieontvanger op diens verzoek voorschotten verstrekken van:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel15
  - number: 15.1.a
    text: ten hoogste 80% van het verleende subsidiebedrag indien het een subsidie voor een programma betreft;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel15
  - number: 15.1.b
    text: ten hoogste 95% van het verleende subsidiebedrag indien het een subsidie voor een project betreft.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel15
  - number: '15.2'
    text: Het eerste voorschot wordt niet eerder verstrekt dan nadat het project of programma daadwerkelijk is gestart.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel15
  - number: '15.3'
    text: De aanvraag tot voorschotverlening gaat vergezeld van een overzicht van de liquiditeitsbehoefte.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel15
  - number: '16'
    text: 'Subsidies voor projecten worden verstrekt ter realisering van één of meer van de volgende doelstellingen:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel16
  - number: 16.a
    text: |-
      vergroten van de kennis van de natuur door het ontwikkelen van modelprogramma's en bijbehorende trainingen voor
      intermediairs en leerkrachten, voor gebruik bij binnen- en buitenschoolse natuur- en milieueducatie;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel16
  - number: 16.b
    text: |-
      vergroten van de kennis van de natuur bij groepen die een bijdrage kunnen leveren aan de realisering van
      natuurdoelstellingen, door het geven van voorlichting of het ontwikkelen van voorlichtingsmateriaal;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel16
  - number: 16.c
    text: |-
      vergroten van de aandacht voor natuur door het ontwikkelen van een visie op de positie van de natuur in de
      samenleving, het inbrengen van deze visie in overlegsituaties en het vragen van publieke aandacht voor deze visie,
      of
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel16
  - number: 16.d
    text: |-
      verhogen van de organisatiegraad en verbeteren van de onderlinge contacten door het stimuleren van samenwerking
      tussen organisaties op het gebied van natuur en het bevorderen van informatie-uitwisseling tussen die organisaties.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel16
  - number: '18'
    text: 'Geen subsidie wordt verleend voor projecten:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel18
  - number: 18.a
    text: die een looptijd hebben van meer dan 3 jaar;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel18
  - number: 18.b
    text: waarvan de subsidiabele kosten minder dan € 11.344,51 bedragen;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel18
  - number: 18.c
    text: |-
      met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag tot subsidieverlening
      schriftelijk aan de aanvrager is bevestigd.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel18
  - number: '19.1'
    text: |-
      De subsidieontvanger voert het project uit overeenkomstig het projectplan waarop de beschikking tot
      subsidieverlening betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel19
  - number: '19.2'
    text: |-
      Indien de projectduur langer is dan één jaar, rapporteert de subsidieontvanger tenminste eenmaal per jaar op een
      door de minister te bepalen wijze omtrent de voortgang van het project.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel19
  - number: '20'
    text: |-
      De minister rangschikt de aanvragen die voor een subsidie in aanmerking komen zodanig dat een project hoger
      gerangschikt wordt naarmate:
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel20
  - number: 20.a
    text: |-
      een project meer bijdraagt aan de verwezenlijking van de doelstellingen bedoeld in [artikel 16][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel16
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '16'
        paragraaf: '7'
  - number: 20.b
    text: |-
      de subsidieaanvrager erin slaagt andere subsidies of financiële middelen voor de realisatie van het project te
      verkrijgen, en
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel20
  - number: 20.c
    text: |-
      het project meer aansluit bij het beleid zoals beschreven in de nota’s ‘Natuur voor mensen, mensen voor natuur’ en
      ‘Vitaal en samen’.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel20
  - number: '21'
    text: |-
      Subsidies voor programma's worden verstrekt ter vergroting van de betrokkenheid van maatschappelijke partijen bij
      natuur en natuurbeleid door:
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel21
  - number: 21.a
    text: |-
      het uitwisselen van kennis en ideeën over natuur met betrokken partijen in de maatschappij, het ontwikkelen en
      structureren van deze kennis binnen de eigen organisatie ten behoeve van beleidsprocessen bij overheden en het
      inbrengen van deze kennis in alle fasen van deze beleidsprocessen;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel21
  - number: 21.b
    text: |-
      het verbreden van de resultaten van eerder uitgevoerde projecten, waarvan de doelstelling past binnen
      [artikel 16][ref1] van deze regeling, door de bevordering van het gebruik en de acceptatie van in deze projecten
      ontwikkelde methoden, programma's, ideeën en materialen bij de geëigende doelgroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel16
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '16'
        paragraaf: '7'
  - number: '22'
    text: 'Geen subsidie wordt verleend voor programma''s:'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel22
  - number: 22.a
    text: die een looptijd hebben korter dan 3 jaar of langer dan 5 jaar;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel22
  - number: 22.b
    text: waarvan de subsidiabele kosten gemiddeld jaarlijks minder dan € 22.689,01 bedragen;
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel22
  - number: 22.c
    text: |-
      met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag tot subsidieverlening
      schriftelijk aan de aanvrager is bevestigd.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel22
  - number: '23.1'
    text: |-
      De subsidieontvanger voert het programma uit overeenkomstig het programmaplan, behoudens door de minister
      goedgekeurde wijzigingen van het programmaplan.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel23
  - number: '23.2'
    text: |-
      De minister kan aan Dienst Regelingen gemelde wijzigingen van het programmaplan goedkeuren. Deze goedkeuring
      wordt niet verleend voor zover het wijzigingen ten aanzien van de doelstelling betreft. De minister deelt de
      subsidieontvanger mede of en in welke mate de wijziging van het werkplan gevolgen heeft voor de verleende subsidie
      of voor de bij de verlening van de subsidie vastgestelde verplichtingen. De wijziging heeft geen verhoging
      tot gevolg van het bedrag van de subsidie of het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel23
  - number: '24'
    text: De subsidieontvanger voert jaarlijks een evaluatie uit op een nader door de minister te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel24
  - number: '25'
    text: |-
      De minister rangschikt de aanvragen die voor een subsidie in aanmerking komen zodanig dat een programma hoger
      gerangschikt wordt naarmate:
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel25
  - number: 25.a
    text: |-
      het programma beter aansluit bij de in [artikel 21][ref1] genoemde doelstellingen en de in
      [artikel 20, onderdeel c][ref2], bedoelde nota’s;


      [ref1]: https://wetten.overheid.nl/BWBR0012519#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012519#Artikel20
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012519
        artikel: '21'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0012519
        artikel: '20'
        paragraaf: '7'
  - number: 25.b
    text: |-
      het programma doelmatiger kan worden uitgevoerd als gevolg van de aanwezigheid van kennis, kunde en capaciteit bij
      de uitvoerende organisatie, de beschikking over een netwerk en het maatschappelijk draagvlak van de uitvoerende
      organisatie of organisaties voor zover noodzakelijk voor het goed uitvoeren van het programma, en
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel25
  - number: 25.c
    text: |-
      de subsidieaanvrager erin slaagt andere subsidies of financiële middelen voor de realisatie van het programma te
      verkrijgen
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel25
  - number: '27.1'
    text: |-
      De Regeling versterking maatschappelijke betekenis natuur en de Regeling subsidiëring niet-terreinbeherende
      organisaties worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel27
  - number: '27.2'
    text: De in het eerste lid genoemde regelingen blijven van toepassing op grond daarvan verleende subsidies.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel27
  - number: '28'
    text: Deze regeling treedt in werking op 1 juni 2001.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel28
  - number: '29'
    text: |-
      Twee jaar na inwerkingtreding en voorts iedere drie jaar wordt een verslag gepubliceerd over de doeltreffendheid en
      de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel29
  - number: '30'
    text: 'Deze regeling wordt aangehaald als: Regeling draagvlak natuur.'
    url: https://wetten.overheid.nl/BWBR0012519/2005-07-17#Artikel30
