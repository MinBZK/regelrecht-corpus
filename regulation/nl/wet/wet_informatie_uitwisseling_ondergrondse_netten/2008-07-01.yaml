  - number: '26.3'
    text: |-
      Bij de vaststelling van de hoogte van de boete houdt Onze Minister in ieder geval rekening met de aard, de ernst en
      de duur van de overtreding.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel26
  - number: '26.4'
    text: |-
      [Artikel 51 van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '27'
    text: Onze Minister legt geen bestuurlijke boete op voorzover de overtreding niet aan de overtreder kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel27
  - number: '28.1'
    text: Onze Minister legt geen bestuurlijke boete op indien de overtreder is overleden.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel28
  - number: '28.2'
    text: |-
      Een bestuurlijke boete vervalt indien zij op het tijdstip van het overlijden van de overtreder niet onherroepelijk
      is. Een onherroepelijke bestuurlijke boete vervalt voorzover zij op dat tijdstip nog niet is betaald.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel28
  - number: '29'
    text: 'Onze Minister legt geen bestuurlijke boete op indien:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel29
  - number: 29.a
    text: aan de overtreder wegens dezelfde overtreding reeds eerder een bestuurlijke boete is opgelegd;
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel29
  - number: 29.b
    text: |-
      een kennisgeving als bedoeld in [artikel 34, tweede lid, onderdeel a][ref1], is bekendgemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel34
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '34'
        hoofdstuk: '6'
  - number: 29.c
    text: een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen, of
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel29
  - number: 29.d
    text: |-
      het recht tot strafvordering is vervallen ingevolge [artikel 74][ref1] of [74c van het Wetboek van Strafrecht][ref2]
      dan wel ingevolge [artikel 37 van de Wet op de economische delicten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel37
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74c
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '37'
  - number: '30.1'
    text: |-
      De bevoegdheid van Onze Minister tot het opleggen van een bestuurlijke boete vervalt vijf jaren nadat de
      overtreding heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel30
  - number: '30.2'
    text: |-
      Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel30
  - number: '31.1'
    text: |-
      Indien een ambtenaar als bedoeld in [artikel 24, eerste lid][ref1] vaststelt dat een overtreding als bedoeld in
      [artikel 26][ref2] is begaan, maakt hij een rapport op.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel26
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '24'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '26'
        hoofdstuk: '6'
  - number: '31.2'
    text: 'Het rapport is gedagtekend en vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
  - number: 31.2.a
    text: de naam van de overtreder;
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
  - number: 31.2.b
    text: de overtreding alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
  - number: 31.2.c
    text: zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
  - number: '31.3'
    text: |-
      Een afschrift van het rapport wordt uiterlijk bij de bekendmaking van de beschikking tot oplegging van de
      bestuurlijke boete aan de overtreder toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
  - number: '31.4'
    text: |-
      Indien van de overtreding een proces-verbaal als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1]
      is opgemaakt en verder geen strafrechtelijke vervolging is ingesteld, treedt dit voor de toepassing van dit artikel
      in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: '32.1'
    text: |-
      Indien aan een handeling van Onze Minister redelijkerwijs de gevolgtrekking kan worden verbonden dat aan de
      overtreder een bestuurlijke boete zal worden opgelegd, is er geen verplichting meer van de zijde van die overtreder
      om ten behoeve van deze oplegging een verklaring omtrent de overtreding af te leggen.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel32
  - number: '32.2'
    text: De overtreder wordt hierop gewezen alvorens hem wordt gevraagd inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het voornemen tot het opleggen
      van een bestuurlijke boete berust, in te zien en daarvan afschriften te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel33
  - number: '33.2'
    text: |-
      Voorzover blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt Onze Minister er zoveel
      mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een voor deze begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister stelt de overtreder in de gelegenheid zijn zienswijze naar voren te brengen over het voornemen tot
      het opleggen van een bestuurlijke boete. Het rapport wordt reeds bij de uitnodiging daartoe aan de overtreder
      toegezonden of uitgereikt. Indien blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, zorgt Onze
      Minister voor bijstand door een tolk.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel34
  - number: '34.2'
    text: 'Indien Onze Minister, nadat de overtreder zijn zienswijze naar voren heeft gebracht, beslist dat:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel34
  - number: 34.2.a
    text: voor de overtreding geen bestuurlijke boete zal worden opgelegd, of
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel34
  - number: 34.2.b
    text: |-
      de overtreding alsnog aan de officier van justitie zal worden voorgelegd, wordt dit schriftelijk aan de overtreder
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel34
  - number: '35'
    text: |-
      Onze Minister beslist binnen dertien weken na de dagtekening van het rapport omtrent het opleggen van een
      bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel35
  - number: '36'
    text: 'De beschikking tot oplegging van een last onder dwangsom of een bestuurlijke boete vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.a
    text: 'indien een last onder dwangsom wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.a.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.a.2°
    text: de inhoud van de last en de termijn waarvoor deze geldt;
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.b
    text: 'indien een bestuurlijke boete wordt opgelegd:'
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.b.1°
    text: de naam van de overtreder, en
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.b.2°
    text: het bedrag van de boete;
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: 36.c
    text: |-
      de overtreding ter zake waarvan de last of de bestuurlijke boete wordt opgelegd alsmede het overtreden wettelijke
      voorschrift.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel36
  - number: '37.1'
    text: |-
      Een bestuurlijke boete wordt betaald aan Onze Minister binnen zes weken nadat de beschikking waarbij de boete is
      opgelegd, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel37
  - number: '37.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen zes weken vanaf de datum waarop de beschikking
      bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel37
  - number: '37.3'
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel37
  - number: '37.4'
    text: |-
      De werking van een beschikking als bedoeld in het eerste lid wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel37
  - number: '38.1'
    text: |-
      Bij gebreke van betaling binnen de in [artikel 37, derde lid][ref1], bedoelde termijn van twee weken kan Onze
      Minister de verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking hebbende kosten,
      invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel37
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '37'
        hoofdstuk: '6'
  - number: '38.2'
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploit betekend en levert
      een executoriale titel op in de zin van [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '38.3'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel38
  - number: '38.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel38
  - number: '44'
    text: |-
      Deze wet laat onverlet dat de gemeenteraad in het belang van de openbare orde en veiligheid bij verordening
      voorschriften kan geven omtrent het verrichten van graafwerkzaamheden, waaronder het binden van graafwerkzaamheden
      aan het hebben van een vergunning.
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel44
  - number: '45.1'
    text: |-
      Binnen drie maanden na inwerkingtreding van [artikel 6, eerste lid][ref1], geeft een beheerder zijn beheerpolygoon
      of beheerpolygonen aan de Dienst op.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '6'
        hoofdstuk: '3'
  - number: '45.2'
    text: |-
      In afwijking van [artikel 10][ref1] is een beheerder gedurende acht jaar na
      inwerkingtreding van [artikel 6, eerste lid][ref2], niet verplicht om liggingsgegevens
      van netten die een verbinding vormen tussen een net en een onroerende zaak als bedoeld in
      [artikel 16, onderdeel a tot en met e, van de Wet waardering onroerende zaken][ref3], aan de Dienst te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '6'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '46.3'
    text: |-
      In afwijking van de [artikelen 10][ref1], en [12, onderdeel b][ref2], kunnen tot het moment van inwerkingtreding
      van [artikel 5, eerste lid][ref3], bij of krachtens algemene maatregel van bestuur regels worden gesteld over het
      aanleveren van informatie door beheerders. Deze regels kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel5
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel46
