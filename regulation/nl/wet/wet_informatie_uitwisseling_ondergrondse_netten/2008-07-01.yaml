  - number: '26.1'
    text: |-
      Ingeval van overtreding van de [artikelen 2][ref1] en [13, derde lid][ref2], kan Onze Minister een bestuurlijke
      boete opleggen van ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel13
