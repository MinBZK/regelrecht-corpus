  - number: '49.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een goede invoering van deze wet tot 3 jaar na
      inwerkingtreding van [artikel 4][ref1] regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel4
    url: https://wetten.overheid.nl/BWBR0023775/2008-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '4'
        hoofdstuk: '3'
  - number: '49.2'
    text: |-
      Tot 5 jaar na inwerkingtreding van deze wet kan Onze Minister bij regeling aan daarbij aan te geven categorieën van
      beheerders vrijstelling verlenen van de verplichtingen van [artikel 6, tweede lid][ref1], [10, eerste lid][ref2],
      [45][ref3] en [46][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel45
