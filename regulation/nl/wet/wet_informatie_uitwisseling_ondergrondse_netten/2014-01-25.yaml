  - number: '24.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel24
  - number: '25'
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van
      de verplichtingen, gesteld bij of krachtens de [artikelen 2][ref1], [6, tweede lid][ref2],
      [10, eerste lid][ref3], [13, eerste, derde, vierde en vijfde lid][ref4], en
      [15, eerste lid][ref5], [21, eerste, tweede en derde lid, onder a en c][ref6], [23][ref7],
      [45][ref8], [46, tweede, derde en vierde lid][ref9] en [49, eerste lid][ref10], of van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref11].


