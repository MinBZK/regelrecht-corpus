        hoofdstuk: '4'
  - number: '21.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: 21.3.a
    text: |-
      het op zorgvuldige wijze verrichten van graafwerkzaamheden, bedoeld in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel2
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '2'
        hoofdstuk: '2'
  - number: 21.3.b
    text: registratiemeldingen, oriëntatieverzoeken en graafmeldingen;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: 21.3.c
    text: |-
      de voorzorgsmaatregelen en de inachtneming daarvan, bedoeld in [artikel 13, eerste, tweede en vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel13
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '13'
        hoofdstuk: '4'
  - number: 21.3.d
    text: |-
      de ontvangstbevestiging, bedoeld in [artikel 9, onderdeel a][ref1], en het graafbericht.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel9
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
