  - number: '26.2'
    text: |-
      Ingeval van overtreding van het bepaalde bij of krachtens de [artikelen 6, tweede lid][ref1],
      [8][ref2], [10, eerste lid][ref3], [13, eerste, vierde en vijfde lid][ref4],
      [15, eerste lid][ref5], [16][ref6], [17, eerste en derde lid][ref7], [18, eerste en derde lid][ref8],
      [21, eerste en tweede lid, derde lid, onder a, b en c, vierde lid, onder a en b][ref9], [22, eerste lid][ref10],
