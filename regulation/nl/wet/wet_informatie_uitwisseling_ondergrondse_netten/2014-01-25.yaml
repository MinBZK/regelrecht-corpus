$id: wet_informatie_uitwisseling_ondergrondse_netten
regulatory_layer: WET
publication_date: '2012-01-26'
valid_from: '2014-01-25'
bwb_id: BWBR0023775
url: https://wetten.overheid.nl/BWBR0023775/2014-01-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ten behoeve van zorgvuldig graven in de ondergrond wenselijk is te
    voorzien in betere informatie-uitwisseling betreffende de ligging van netten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.b
    text: |-
      Dienst: de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel2
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '2'
  - number: 1.1.c
    text: 'graafwerkzaamheden: het mechanisch verrichten van werkzaamheden in de ondergrond;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.d
    text: 'graaflocatie: de locatie waar graafwerkzaamheden worden verricht;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.e
    text: |-
      net: een ondergrondse kabel of leiding, daaronder mede begrepen lege buizen, ondergrondse ondersteuningswerken
      en beschermingswerken, bestemd voor transport van vaste, vloeibare of gasvormige stoffen, van energie of van
      informatie;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.f
    text: 'opdrachtgever: degene die opdracht geeft tot het uitvoeren van een werk waarbij graafwerkzaamheden worden verricht;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.g
    text: 'grondroerder: degene onder wiens verantwoordelijkheid of leiding graafwerkzaamheden worden verricht;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.h
    text: |-
      beheerder: degene die als natuurlijk persoon handelende in de uitoefening van een beroep of een bedrijf dan wel als
      rechtspersoon een net beheert;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.i
    text: |-
      registratiemelding: de melding van de beheerder, bedoeld in [artikel 6, tweede lid][ref1], dan wel
      [artikel 45, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel45
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '45'
        hoofdstuk: '8'
  - number: 1.1.j
    text: |-
      beheerpolygoon: de weergave door een beheerder van een aaneengesloten gebied, waarbinnen hij een of meer netten
      beheert;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.k
    text: |-
      oriëntatieverzoek: het verzoek aan de Dienst om gebiedsinformatie, bedoeld in
      [artikel 7, eerste onderscheidenlijk tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel7
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '7'
        hoofdstuk: '4'
  - number: 1.1.l
    text: |-
      oriëntatiepolygoon: de weergave door een opdrachtgever, grondroerder of bestuursorgaan van een aangesloten gebied,
      ten aanzien waarvan deze met het oog op een belang als bedoeld in [artikel 7, eerste of tweede lid][ref1], om
      gebiedsinformatie verzoekt;


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel7
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '7'
        hoofdstuk: '4'
  - number: 1.1.m
    text: |-
      graafmelding: de melding aan de Dienst van voorgenomen graafwerkzaamheden, bedoeld in
      [artikel 8, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel8
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '8'
        hoofdstuk: '4'
  - number: 1.1.n
    text: 'graafpolygoon: de weergave door een grondroerder van het gebied, waarbinnen de graaflocatie zich bevindt;'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.o
    text: |-
      graafbericht: het bericht van de Dienst, bedoeld in [artikel 9, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel9
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '9'
        hoofdstuk: '4'
  - number: 1.1.p
    text: |-
      liggingsgegevens: de gegevens omtrent de ligging van een net binnen de betrokken oriëntatiepolygoon dan wel
      graafpolygoon;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
  - number: 1.1.q
    text: |-
      net met gevaarlijke inhoud: een buisleiding die behoort tot een krachtens
      [artikel 12.12, tweede lid, van de Wet milieubeheer][ref1] aangewezen categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 1.1.r
    text: |-
      gebiedsinformatie: het geheel van informatie dat door beheerders, ingevolge [artikel 10, eerste lid][ref1], aan de
      Dienst is verstrekt over de betrokken oriëntatiepolygoon dan wel graafpolygoon.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: '1.2'
    text: |-
      Onder net als bedoeld in het eerste lid, onderdeel e, wordt niet begrepen de niet met andere kabels of
      leidingen samengebonden delen van kabels of leidingen die een verbinding vormen tussen een net dat naar
      zijn aard voor aansluiting van huishoudens wordt opengesteld, en één onroerende zaak als bedoeld in
      [artikel 16, onderdeel a tot en met e, van de Wet waardering onroerende zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel16
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '16'
  - number: '2.1'
    text: |-
      De opdrachtgever draagt er zorg voor dat de graafwerkzaamheden waartoe hij opdracht geeft, op zorgvuldige wijze
      kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: '2.2'
    text: De grondroerder verricht de graafwerkzaamheden op zorgvuldige wijze.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: '2.3'
    text: 'Ter uitvoering van het tweede lid zorgt de grondroerder ten minste dat:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: 2.3.a
    text: vóór aanvang van de graafwerkzaamheden een graafmelding is gedaan,
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: 2.3.b
    text: onderzoek is verricht naar de precieze ligging van onderdelen van netten op de graaflocatie, en
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: 2.3.c
    text: op de graaflocatie de van de Dienst ontvangen gebiedsinformatie aanwezig is.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel2
  - number: '3.1'
    text: |-
      De aanleg, de instandhouding en de opruiming van netten door een beheerder geschieden op zodanige wijze dat het
      beheer van andere netten niet in gevaar wordt gebracht of zonder noodzaak wordt bemoeilijkt.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel3
  - number: '3.2'
    text: |-
      De beheerder die in strijd handelt met het eerste lid, neemt op eigen kosten maatregelen ten aanzien van het
      betreffende onderdeel van zijn net, waaronder zonodig het verplaatsen daarvan, om aan de strijdigheid onverwijld
      een einde te maken.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel3
  - number: '4'
    text: |-
      Er is een elektronisch informatiesysteem waarmee informatie tussen beheerders enerzijds en opdrachtgevers,
      grondroerders en bestuursorganen anderzijds wordt uitgewisseld.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel4
  - number: '5.1'
    text: De Dienst is belast met het beheer van het elektronische informatiesysteem.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel5
  - number: '5.2'
    text: 'De Dienst verstrekt op verzoek via het elektronische informatiesysteem gebiedsinformatie aan:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel5
  - number: 5.2.a
    text: |-
      opdrachtgevers en grondroerders ten behoeve van het voorbereiden van graafwerkzaamheden en het op zorgvuldige wijze
      verrichten van graafwerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel5
  - number: 5.2.b
    text: bestuursorganen voor zover deze gebiedsinformatie noodzakelijk is voor de uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel5
  - number: '6.1'
    text: Ten behoeve van de informatie-uitwisseling over ondergrondse netten registreert de Dienst de beheerpolygonen.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel6
  - number: '6.2'
    text: Degene die
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel6
  - number: 6.2.a
    text: een net gaat beheren dat niet ligt binnen een door de Dienst op zijn naam geregistreerde beheerpolygoon, of
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel6
  - number: 6.2.b
    text: |-
      niet langer een net zal beheren dat ligt binnen een door de Dienst op zijn naam geregistreerde beheerpolygoon of
      deel daarvan,
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel6
  - number: '7.1'
    text: |-
      Een opdrachtgever of een grondroerder kan de Dienst om gebiedsinformatie verzoeken ten behoeve van het voorbereiden
      van graafwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel7
  - number: '7.2'
    text: |-
      Een bestuursorgaan kan de Dienst om gebiedsinformatie verzoeken voor zover deze informatie noodzakelijk is voor de
      uitvoering van de hem opgedragen taak.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel7
  - number: '7.3'
    text: Bij het oriëntatieverzoek geeft de opdrachtgever, de grondroerder of het bestuursorgaan een oriëntatiepolygoon op.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel7
  - number: '8.1'
    text: |-
      Een grondroerder meldt het voornemen tot het verrichten van graafwerkzaamheden aan de Dienst ten hoogste twintig
      werkdagen voorafgaande aan de aanvang van die graafwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel8
  - number: '8.2'
    text: Bij de graafmelding geeft de grondroerder een graafpolygoon op.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel8
  - number: '8.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de graafwerkzaamheden ten hoogste een bij algemene maatregel van
      bestuur te bepalen diepgang hebben en uitgevoerd zullen worden in grond die in eigendom of beheer is van de
      grondroerder en hij weet dat sinds de voorafgaande graafmelding de ligging van de netten in deze grond niet is
      veranderd.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel8
  - number: '9'
    text: 'Na ontvangst van een oriëntatieverzoek of graafmelding:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel9
  - number: 9.a
    text: |-
      verstrekt de Dienst aan degene die het oriëntatieverzoek of de graafmelding heeft gedaan onverwijld een
      ontvangstbevestiging;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel9
  - number: 9.b
    text: |-
      bericht de Dienst hierover onverwijld onder vermelding van de oriëntatiepolygoon of graafpolygoon alle beheerders
      wier beheerpolygoon geheel of gedeeltelijk samenvalt met deze oriëntatiepolygoon onderscheidenlijk graafpolygoon.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel9
  - number: '10.1'
    text: |-
      Onverwijld doch uiterlijk binnen één werkdag na verzending van een graafbericht verstrekt een beheerder via het
      elektronische informatiesysteem in ieder geval de volgende informatie aan de Dienst:
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
  - number: 10.1.a
    text: de liggingsgegevens,
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
  - number: 10.1.b
    text: de relevante eigenschappen van zijn net binnen de betreffende oriëntatiepolygoon dan wel graafpolygoon,
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
  - number: 10.1.c
    text: |-
      in voorkomend geval welke voorzorgsmaatregelen als bedoeld in [artikel 13, eerste of tweede lid][ref1], zullen
      worden getroffen, en


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel13
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '13'
        hoofdstuk: '4'
  - number: 10.1.d
    text: zijn contactgegevens.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
  - number: '10.2'
    text: |-
      Indien een beheerder de termijn, genoemd in het eerste lid, overschrijdt, doet de Dienst daarvan onverwijld
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel10
  - number: '11.1'
    text: |-
      De Dienst verstrekt gebiedsinformatie via het elektronische informatiesysteem onverwijld na ontvangst van
      alle informatie als bedoeld in [artikel 10][ref1], doch uiterlijk binnen twee werkdagen na verzending van het
      graafbericht, aan degene die het oriëntatieverzoek of de graafmelding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: '11.2'
    text: |-
      Indien degene die het oriëntatieverzoek of de graafmelding heeft gedaan geen gebruik maakt van het elektronische
      informatiesysteem, verstrekt de Dienst gebiedsinformatie op andere wijze onverwijld na ontvangst van alle vereiste
      informatie, doch uiterlijk binnen drie werkdagen na verzending van het graafbericht.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel11
  - number: '11.3'
    text: |-
      Indien de Dienst niet binnen de termijn, bedoeld in het eerste lid, van alle beheerders de ingevolge
      [artikel 10, eerste lid][ref1], vereiste informatie heeft ontvangen, doet de Dienst daarvan mededeling bij het
      verstrekken van de gebiedsinformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: '12'
    text: |-
      Onze Minister kan voor de situatie dat graafmeldingen die betrekking hebben op graafwerkzaamheden als bedoeld in
      [artikel 8, derde lid][ref1], gezamenlijk worden gedaan door tussenkomst van een door Onze Minister aan te wijzen
      organisatie, bij regeling vrijstelling verlenen van de verplichtingen ten aanzien van de termijnen, bepaald in de
      artikelen 8, eerste lid, [9][ref2], [10, eerste lid][ref3], en [11, eerste lid][ref4]. De vrijstelling kan onder
      beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Artikel11
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '8'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '9'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0023775
        artikel: '11'
        hoofdstuk: '4'
  - number: '13.1'
    text: |-
      De beheerder van een net met gevaarlijke inhoud treft voorzorgsmaatregelen voordat een grondroerder
      graafwerkzaamheden in de omgeving daarvan verricht. Deze voorzorgsmaatregelen betreffen in ieder geval de
      aanwijzing ter plaatse van de exacte ligging van dat net door de beheerder.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel13
  - number: '13.2'
    text: |-
      De beheerder van een net met een grote waarde kan voorzorgsmaatregelen treffen voordat een grondroerder
      graafwerkzaamheden in de omgeving daarvan verricht.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel13
  - number: '13.3'
    text: |-
      Indien de beheerder heeft aangegeven dat hij voorzorgsmaatregelen treft, vangt de grondroerder de
      graafwerkzaamheden niet aan dan nadat de beheerder deze voorzorgsmaatregelen heeft getroffen.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel13
  - number: '13.4'
    text: |-
      De beheerder treft de voorzorgsmaatregelen binnen drie werkdagen nadat de grondroerder contact met hem heeft
      opgenomen, tenzij hij in overleg met de grondroerder andere afspraken maakt.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel13
  - number: '13.5'
    text: |-
      Indien een beheerder voorzorgsmaatregelen treft, treft de grondroerder eveneens de nodige voorzorgsmaatregelen.
      Hij legt deze schriftelijk vast en brengt deze voor aanvang van de graafwerkzaamheden ter kennis van de betrokken
      beheerder.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel13
  - number: '14'
    text: |-
      Onze Minister van Veiligheid en Justitie kan ter voorkoming van een terroristisch misdrijf als bedoeld in
      [artikel 83 van het Wetboek van Strafrecht][ref1] of om op voorhand de gevolgen daarvan te beperken aan de Dienst
      alle nodige aanwijzingen geven ten aanzien van de informatie-uitwisseling.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel83
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '83'
  - number: '15.1'
    text: |-
      De beheerder rapporteert aan de Dienst telkens in januari het aantal schadegevallen als gevolg van
      graafwerkzaamheden in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel15
  - number: '15.2'
    text: |-
      Het bestuur van de Dienst neemt een overzicht op van het aantal schadegevallen in het jaarverslag, bedoeld in
      [artikel 25 van de Organisatiewet Kadaster][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006463#Artikel25
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006463
        artikel: '25'
  - number: '16'
    text: |-
      De grondroerder meldt schade aan een net als gevolg van zijn graafwerkzaamheden onverwijld aan de beheerder van het
      beschadigde net.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel16
  - number: '17.1'
    text: |-
      Indien de ligging van een net afwijkt van de liggingsgegevens die aan de grondroerder zijn verstrekt, meldt de
      grondroerder dit onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel17
  - number: '17.2'
    text: Van de melding, bedoeld in het eerste lid, doet de Dienst onverwijld mededeling aan de betrokken beheerder.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel17
  - number: '17.3'
    text: |-
      De beheerder treft binnen dertig werkdagen na ontvangst van de mededeling, bedoeld in het tweede lid, de als gevolg
      van de melding, bedoeld in het eerste lid, noodzakelijke maatregelen.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel17
  - number: '18.1'
    text: |-
      Indien de grondroerder een net aantreft dat niet in de door de Dienst verstrekte liggingsgegevens is vermeld of
      waarvan niet duidelijk is wie de beheerder is, meldt de grondroerder dit onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
  - number: '18.2'
    text: |-
      De Dienst bericht onverwijld alle beheerders wier beheerpolygoon geheel of gedeeltelijk samenvalt met de
      graafpolygoon en de bij ministeriële regeling te bepalen beheerders dat er een net is aangetroffen, waarover geen
      liggingsgegevens zijn verstrekt als bedoeld in [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: '18.3'
    text: Indien er een beheerder van het net is, meldt deze zich onverwijld bij de Dienst.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
  - number: '18.4'
    text: |-
      Indien de Dienst niet binnen tien werkdagen na het bericht, bedoeld in het tweede lid, een melding als bedoeld in
      het derde lid ontvangt:
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
  - number: 18.4.a
    text: |-
      geeft de Dienst de met betrekking tot dat net bekende gegevens door aan de gemeente in welker grondgebied dat net
      zich bevindt;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
  - number: 18.4.b
    text: registreert de Dienst de globale ligging van de met betrekking tot dat net bekende gegevens als polygoon.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
  - number: '18.5'
    text: |-
      Voor de toepassing van [artikel 9][ref1] wordt de gemeente, bedoeld in het vierde lid, gelijkgesteld met een
      beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel9
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '9'
        hoofdstuk: '4'
  - number: '19'
    text: |-
      Op een gemeente die gegevens heeft ontvangen door toepassing van [artikel 18, vierde lid][ref1], zijn de
      [artikelen 10][ref2] en [17, tweede lid][ref3], van overeenkomstige toepassing met dien verstande dat de gemeente
      de met betrekking tot dat net bekende gegevens verstrekt, met inbegrip van eventuele correcties ingevolge
      [artikel 17, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Artikel17
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel19
    references:
