  - number: '48.1'
    text: |-
      In afwijking van [artikel 17, eerste lid][ref1], doet een grondroerder tot het moment van inwerkingtreding van
      [artikel 5, eerste lid][ref2], de melding, bedoeld in [artikel 17, eerste lid][ref3], bij de beheerder indien hij
      gegevens ingevolge [artikel 46, tweede lid][ref4], rechtstreeks van de beheerder heeft verkregen. In dat geval is
      [artikel 17, tweede lid][ref5], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0023775#Artikel17
