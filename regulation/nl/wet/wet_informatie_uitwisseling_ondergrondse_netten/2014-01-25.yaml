  - number: '44'
    text: |-
      Deze wet laat onverlet dat de gemeenteraad in het belang van de openbare orde en veiligheid bij verordening
      voorschriften kan geven omtrent het verrichten van graafwerkzaamheden, waaronder het binden van graafwerkzaamheden
      aan het hebben van een vergunning.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel44
  - number: '45'
    text: |-
      Binnen drie maanden na inwerkingtreding van [artikel 6, eerste lid][ref1], geeft een beheerder zijn beheerpolygoon
      of beheerpolygonen aan de Dienst op.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '6'
        hoofdstuk: '3'
  - number: '46.1'
    text: |-
      Tot het moment van inwerkingtreding van [artikel 5, eerste lid][ref1], is de Dienst belast met de informatie-
      uitwisseling betreffende ondergrondse netten.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel5
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '5'
        hoofdstuk: '3'
  - number: '46.2'
    text: |-
      Tot het moment van inwerkingtreding van [artikel 5, eerste lid][ref1], verstrekt de beheerder, in afwijking van
      [artikel 10, eerste lid][ref2], de informatie, bedoeld in [artikel 10][ref3], aan degene die het oriëntatieverzoek
      of de graafmelding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: '46.3'
    text: |-
      In afwijking van de [artikelen 10][ref1], en [12, onderdeel b][ref2], kunnen tot het moment van inwerkingtreding
      van [artikel 5, eerste lid][ref3], bij of krachtens algemene maatregel van bestuur regels worden gesteld over het
      aanleveren van informatie door beheerders. Deze regels kunnen betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel5
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
    references:
