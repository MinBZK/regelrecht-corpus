  - number: '21.1'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: 21.1.a
    text: |-
      de informatie die op grond van [artikel 10][ref1] wordt verstrekt, waarbij voor verschillende categorieën netten
      verschillende regels kunnen worden gesteld, en de wijze waarop die informatie wordt verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel10
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '10'
        hoofdstuk: '4'
  - number: 21.1.b
    text: de toegang tot en de aansluiting op het informatiesysteem;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: 21.1.c
    text: beheerpolygonen, oriëntatiepolygonen en graafpolygonen.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: '21.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de situatie dat vanwege
      de door een calamiteit geboden spoed niet aan [artikel 2, eerste en derde lid][ref1], kan worden voldaan dan wel
      de in [hoofdstuk 4][ref2] beschreven procedure kan worden gevolgd, waarbij voor zover nodig van [dat artikel][ref3]
      onderscheidenlijk de bepalingen van [dat hoofdstuk][ref4] kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0023775
        hoofdstuk: '4'
