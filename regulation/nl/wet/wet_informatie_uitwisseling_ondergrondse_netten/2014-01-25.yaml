  - number: '48.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop een melding als bedoeld in het eerste lid
      wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel48
  - number: '49.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een goede invoering van deze wet tot 3 jaar na
      inwerkingtreding van [artikel 4][ref1] regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel4
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '4'
        hoofdstuk: '3'
  - number: '49.2'
    text: |-
      Tot 5 jaar na inwerkingtreding van deze wet kan Onze Minister bij regeling voor daarbij aan te geven
      categorieën van beheerders of categorieën van delen van netten vrijstelling verlenen van de verplichtingen van
      [artikel 6, tweede lid][ref1], [10, eerste lid][ref2], [18, eerste lid][ref3], [45][ref4] en [46][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0023775#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0023775#Artikel46
