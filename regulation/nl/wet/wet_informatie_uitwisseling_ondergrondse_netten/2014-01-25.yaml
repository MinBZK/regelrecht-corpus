    text: welke informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
  - number: 46.3.b
    text: aan wie de informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
  - number: 46.3.c
    text: de wijze waarop de informatie wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
  - number: 46.3.d
    text: de termijnen waarbinnen deze informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
  - number: '46.4'
    text: |-
      In afwijking van [artikel 15][ref1] rapporteren de beheerders gedurende vier jaar na inwerkingtreding van
      dit artikel in de maanden januari en juli het aantal schadegevallen als gevolg van graafwerkzaamheden in de
      voorafgaande zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel15
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '15'
        hoofdstuk: '4'
  - number: '47'
    text: |-
      In afwijking van [artikel 11, eerste en tweede lid][ref1], kunnen tot het moment van inwerkingtreding van
      [artikel 5, eerste lid][ref2], bij ministeriële regeling regels worden gesteld over het aanleveren van informatie
      door de Dienst aan degene, die een oriëntatieverzoek of een graafmelding heeft gedaan. Deze regels kunnen
      betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel15
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel47
