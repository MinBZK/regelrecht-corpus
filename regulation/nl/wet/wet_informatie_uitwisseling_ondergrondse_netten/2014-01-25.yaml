        hoofdstuk: '4'
  - number: 23.b
    text: regels gesteld over de informatie-uitwisseling in de gebieden, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel23
  - number: '24.1'
