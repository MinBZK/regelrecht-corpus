        artikel: '17'
        hoofdstuk: '4'
  - number: '20'
    text: |-
      De Dienst bewaart gedurende een bij algemene maatregel van bestuur te bepalen periode gegevens over de uitvoering
      van de [artikelen 6, tweede lid][ref1], [7][ref2], [8, eerste en tweede lid][ref3], [9][ref4], [10][ref5],
      [11][ref6], [12, onderdeel b][ref7], [15, eerste lid][ref8], [17, eerste en tweede lid][ref9], [18][ref10],
      [45, eerste lid][ref11], [46, vierde lid][ref12], en [47][ref13], met uitzondering van de gegevens, bedoeld in
      [artikel 10, eerste lid, onderdelen a, b en c][ref14].


