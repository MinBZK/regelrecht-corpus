        bwb_id: BWBR0023775
        artikel: '9'
        hoofdstuk: '4'
  - number: '21.4'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
  - number: 21.4.a
    text: |-
      meldingen als bedoeld in de [artikelen 15, eerste lid][ref1], [17, eerste lid][ref2], en
      [18, eerste en derde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0023775#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0023775#Artikel18
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023775
        artikel: '17'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0023775
        artikel: '18'
        hoofdstuk: '4'
  - number: 21.4.b
    text: |-
      het bewaren en verstrekken van de informatie, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel20
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de gebiedsinformatie die
      op grond van [artikel 11][ref1] aan de grondroerder wordt verstrekt, waarbij voor verschillende categorieën
      graafwerkzaamheden verschillende regels kunnen worden gesteld, en de wijze waarop die gebiedsinformatie wordt
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel11
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '11'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      Bij regeling van het bestuur van de Dienst worden regels gesteld omtrent de wijze waarop de registratie van
      beheerders, bedoeld in [artikel 6, eerste lid][ref1], plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Artikel6
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023775
        artikel: '6'
        hoofdstuk: '3'
  - number: '22.3'
    text: |-
      Bij regeling van het bestuur van de Dienst kunnen regels worden gesteld omtrent de tijden gedurende welke
      oriëntatieverzoeken en graafmeldingen kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel22
  - number: '23'
    text: 'Bij algemene maatregel van bestuur worden:'
    url: https://wetten.overheid.nl/BWBR0023775/2014-01-25#Artikel23
  - number: 23.a
    text: |-
      de gebieden aangewezen ten aanzien waarvan om veiligheidsredenen kan worden afgeweken van de voorschriften gesteld
      bij of krachtens [hoofdstuk 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023775#Hoofdstuk4
