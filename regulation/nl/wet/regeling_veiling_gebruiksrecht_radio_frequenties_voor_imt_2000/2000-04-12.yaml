  - number: '22'
    text: |-
      1 De deelnemer waarvan de veilingmeester heeft vastgesteld dat deze geen bod of een ongeldig bod als bedoeld in
      [artikel 19, derde lid][ref1], heeft uitgebracht, wordt hiervan afzonderlijk door de notaris op de hoogte gesteld.

      2 Indien de veilingmeester heeft vastgesteld dat een deelnemer op grond van [artikel 7][ref2] van verdere deelname
      van de veiling is uitgesloten, of op grond van [artikel 21, vierde lid][ref3], niet langer gerechtigd is om in
      enige ronde een bod uit te brengen, deelt de notaris aan alle deelnemers de identiteit van de betreffende deelnemer
      mee.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011289#Artikel21
