  - number: '13'
    text: |-
      Onverminderd [artikel 21][ref1] is een deelnemer gerechtigd om in iedere ronde een bod uit te brengen op één van de
      kavels A tot en met E, voor zover de aanvraag van die deelnemer de vergunning betreft ter uitvoering waarvan radio-
      frequenties van de betreffende kavel ter beschikking zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel21
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '21'
        paragraaf: '6'
  - number: '14'
    text: Een deelnemer is onvoorwaardelijk en onherroepelijk aan zijn bod gebonden.
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel14
  - number: '15'
    text: |-
      1 In afwijking van [artikel 14][ref1] vervalt het bod van een deelnemer die op grond van [artikel 7][ref2] van
      verdere deelname aan de veiling is uitgesloten.

      2 Indien een deelnemer als bedoeld in het eerste lid het hoogste bod op een kavel heeft uitgebracht, stelt de
      veilingmeester voor de betreffende ronde vast welke deelnemer het hoogste bod op die kavel heeft uitgebracht.

      3 Indien toepassing van het tweede lid tot gevolg heeft dat die deelnemer een bod heeft uitgebracht op meer kavels
      dan waarop de deelnemer op grond van [artikel 13][ref3] in de betreffende ronde een bod mag uitbrengen, stelt de
      veilingmeester vast welke deelnemer vervolgens het hoogste bod op de betreffende kavel heeft uitgebracht.

      4 De veilingmeester past het derde lid ten hoogste twee keer toe.

      5 Indien na toepassing van het vierde lid de veilingmeester ingevolge [artikel 13][ref4] niet kan vaststellen welke
      deelnemer het hoogste bod op de betreffende kavel heeft uitgebracht, vervallen alle eerdere biedingen op die kavel.

      6 In het geval, bedoeld in het vijfde lid, is het in de volgende ronde voor die kavel minimaal te bieden bedrag,
      bedoeld in [artikel 10, tweede lid, onderdeel b, onder 2°][ref5], gelijk aan het minimaal te bieden bedrag dat is
      vastgesteld voor de daaraan voorafgaande ronde.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel14
