articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Verkeer en Waterstaat;



            b
            besluit:

              [Frequentiebesluit][ref1];



            c
             IMT-2000:

              International Mobile Telecommunications-2000, de familie van mobiele telecommunicatiesystemen voor de derde
      generatie, met de daarbij behorende radio- interfaces, zoals door de Internationale Telecommunicatie Unie (ITU) is
      vastgesteld op basis van resolutie 212 van de ITU;



            d
             aanvraag:

              aanvraag om een vergunning voor IMT-2000;



            e
             aanvrager:

              degene, bedoeld in [artikel 1, onder f, van de Regeling aanvraag vergunning voor IMT-2000][ref2];



            f
             deelnemer:

              de aanvrager die is toegelaten tot deelname aan de veiling;



            g
             bedrag ter zekerstelling:

              bedrag, bedoeld in [artikel 10 van de Regeling aanvraag vergunning voor IMT-2000][ref3];



            h
             kavel:

              een of meer radio-frequenties die ter beschikking zijn voor de uitvoering van een vergunning en waarvan het
      gebruiksrecht wordt verleend door middel van een veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0009997
      [ref2]: https://wetten.overheid.nl/BWBR0011288#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011288#Artikel10
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel1
