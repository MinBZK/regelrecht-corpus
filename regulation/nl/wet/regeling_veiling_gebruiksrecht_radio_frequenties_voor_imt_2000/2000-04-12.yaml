  - number: '19'
    text: |-
      1 De veilingmeester beslist omtrent de geldigheid van een uitgebracht bod.

      2 Indien een bod niet voldoet aan het bepaalde in [artikel 9][ref1], [11][ref2], [12][ref3], [13][ref4],
      [16, tweede en derde lid][ref5], [17, tweede tot en met vijfde lid][ref6], of [18, eerste lid, onder d][ref7],
      wordt de deelnemer gedurende de veiling maximaal acht keer op aanwijzing van de veilingmeester via de notaris in
      de gelegenheid gesteld alsnog aan de betreffende artikelen te voldoen binnen een door de veilingmeester te stellen
      termijn.

      3 Een bod is ongeldig indien:

      a. na toepassing van het tweede lid nog niet is voldaan aan de daarin genoemde artikelen;

      b. een deelnemer reeds acht keer in de gelegenheid is gesteld om aan de in het tweede lid genoemde bepalingen te
      voldoen.


