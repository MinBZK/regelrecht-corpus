  - number: '16'
    text: |-
      1 De notaris verstrekt voorafgaand aan de eerste ronde aan iedere deelnemer drie paskaarten. Het model van de
      paskaart is als [bijlage 1][ref1] bij deze regeling gevoegd.

      2 Een deelnemer mag een paskaart inleveren in plaats van een biedkaart.

      3 Een paskaart mag slechts tot en met de dertigste ronde worden ingeleverd, met dien verstande dat:

      a. na de tiende ronde nog ten hoogste twee paskaarten mogen worden ingeleverd; en

      b. na de twintigste ronde nog slechts een paskaart mag worden ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0011289
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011289
  - number: '17'
    text: |-
      1 De notaris verstrekt voorafgaand aan elke ronde een biedkaart aan iedere deelnemer die gerechtigd is een bod uit
      te brengen. Het model van deze biedkaart is als [bijlage 2][ref1] bij deze regeling gevoegd.

      2 Een bod wordt uitgebracht door middel van de in het eerste lid bedoelde biedkaart.

      3 De biedkaart wordt in de Nederlandse taal ingevuld.

      4 Een bod wordt uitgebracht in Nederlandse guldens.

      5 Het bedrag van het bod wordt zowel in cijfers als letters geschreven en wordt vermeld in hele guldens.

      6 De ingevulde en gesloten biedkaart wordt op de plaats van de veiling in de daartoe bestemde ruimte, met
      inachtneming van [artikel 18, vierde lid][ref2], aan de notaris aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0011289
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel18
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011289
      - id: ref2
        bwb_id: BWBR0011289
        artikel: '18'
        paragraaf: '6'
  - number: '18'
    text: |-
      1 Een bod wordt uitgebracht op een biedkaart die:

      a. niet eerder dan het in
      [artikel 10, eerste lid, onder 2°, onderscheidenlijk het tweede lid, onderdeel b, onder 3°][ref1],
      bedoelde tijdstip, of niet later dan het in
      [artikel 10, eerste lid, onder 3°, onderscheidenlijk het tweede lid, onderdeel b, onder 4°][ref2], bedoelde
      tijdstip in de daartoe bestemde ruimte gesloten aan de notaris wordt aangeboden;

      b. wordt ingeleverd door een deelnemer die gerechtigd is in de betreffende ronde een bod uit te brengen;

      c. wordt ingeleverd door degene die gerechtigd is om namens de deelnemer handelingen te verrichten in de
      veilingprocedure;

      d. volledig en op de juiste wijze is ingevuld.

      2 De notaris stelt vast of degene die de biedkaart inlevert, niet eerder, onderscheiden-lijk niet later dan de in
      het eerste lid, onder a, bedoelde tijdstippen in de daartoe bestemde ruimte aanwezig is.

      3 De notaris controleert of degene die de biedkaart inlevert, gerechtigd is om namens de deelnemer handelingen te
      verrichten in de veilingprocedure.

      4 Nadat de notaris heeft vastgesteld dat is voldaan aan het eerste lid, onder a, b en c, deponeert de deelnemer de
      biedkaart in de daartoe bestemde brievenbus.

      5 De notaris neemt een biedkaart niet in ontvangst indien niet is voldaan aan het eerste lid, onder a, b of c.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel10
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel18
