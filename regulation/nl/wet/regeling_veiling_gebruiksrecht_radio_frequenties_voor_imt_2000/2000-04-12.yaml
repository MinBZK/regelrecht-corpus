  - number: '12'
    text: |-
      1 In afwijking van [artikel 11][ref1] stelt de veilingmeester het minimaal te bieden bedrag, bedoeld in
      [artikel 10, tweede lid, onderdeel b, onder 2°][ref2], voor kavel A respectievelijk kavel B, indien:

      a. in de eerste ronde op de betreffende kavel niet het bedrag, bedoeld in [artikel 9, eerste lid][ref3], is
      geboden, vast op zeventig miljoen gulden;

      b. in de tweede ronde op de betreffende kavel niet het bedrag, bedoeld onder a, is geboden, vast op vijfendertig
      miljoen gulden;

      c. in de derde ronde op de betreffende kavel niet het bedrag, bedoel onder b, is geboden, vast op nul gulden.

      2 In afwijking van [artikel 11][ref4] stelt de veilingmeester het minimaal te bieden bedrag, bedoeld in
      [artikel 10, tweede lid, onderdeel b, onder 2°][ref5], voor kavel C, kavel D, respectievelijk kavel E, indien:

      a. in de eerste ronde op de betreffende kavel niet het bedrag, bedoeld in [artikel 9, tweede lid][ref6], is
      geboden, vast op zestig miljoen gulden;

      b. in de tweede ronde op de betreffende kavel niet het bedrag, bedoeld onder a, is geboden, vast op dertig miljoen
      gulden;

      c. in de derde ronde op de betreffende kavel niet het bedrag, bedoeld onder b, is geboden, vast op nul gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel11
