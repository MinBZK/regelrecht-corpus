  - number: '23'
    text: |-
      1 De laatste ronde is de ronde:

      a. waarin geen bod is uitgebracht;

      b. waarin, na toepassing van [artikel 19, tweede lid][ref1], op geen van de kavels een geldig bod is uitgebracht;

      c. die door de veilingmeester als laatste ronde is aangekondigd.

      2 De veilingmeester kan de ronde, bedoeld in het eerste lid, onder c, afkondigen indien naar het redelijk oordeel
      van de veilingmeester het verloop van de veiling zodanig is dat de vergunningen niet binnen de termijn, bedoeld in
      [artikel 15, tweede lid, van het besluit][ref2] kunnen worden verleend.

      3 De ronde, bedoeld in het eerste lid, onder c, wordt door de veilingmeester tien ronden voorafgaand aan die ronde
      aangekondigd, waarna de notaris dit aan de deelnemers bekend maakt.

      4 De veilingmeester stelt na de laatste ronde, bedoeld in het eerste lid, onder a en onder b, vast dat de laatste
      ronde is gehouden, waarna de notaris dit aan de deelnemers bekend maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel15
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '19'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '15'
  - number: '24'
    text: |-
      De veiling is afgerond op het tijdstip dat de laatste ronde is gehouden en de veilingmeester met betrekking tot
      elke kavel heeft vastgesteld:

      a. welke deelnemer het hoogste bod heeft uitgebracht;

      b. dat er, na toepassing van [artikel 19, tweede lid][ref1], geen geldig bod is uitgebracht; of

      c. dat er geen bod is uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel19
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '19'
        paragraaf: '6'
  - number: '25'
    text: |-
      1 De veilingmeester stelt na de laatste ronde per kavel vast welke deelnemer het hoogste bod heeft uitgebracht.

      2 De minister verleent aan de deelnemer, bedoeld in het eerste lid, de vergunning waar voor het gebruik de
      radio-frequenties van de betreffende kavel ter beschikking zijn, nadat het verschuldigde bedrag, bedoeld in
      [artikel 26][ref1] is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel26
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '26'
        paragraaf: '6'
  - number: '26'
    text: |-
      De deelnemer, bedoeld in [artikel 25, eerste lid][ref1], betaalt het door hem verschuldigde bedrag binnen 14
      kalenderdagen volgend op het tijdstip waarop is vastgesteld dat hij het hoogste bod op een kavel heeft uitgebracht
      op onderstaand bankrekeningnummer:

      22.58.49.046,

      F. van Lanschot Bankiers N.V., Den Haag

      t.n.v.:

      Pels Rijcken & Droogleever Fortuijn,

      derdengelden notariaat,

      inzake IMT-2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel25
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '25'
        paragraaf: '6'
  - number: '27'
    text: |-
      1 Indien een deelnemer van wie op grond van [artikel 25, eerste lid][ref1], is vastgesteld dat hij het hoogste bod
      op een kavel heeft uitgebracht, zijn betalingsverplichting niet, niet geheel of niet tijdig is nagekomen, stelt de
      minister binnen drie weken na afronding van de veiling, bedoeld in [artikel 24][ref2], vast of de betreffende kavel
      opnieuw wordt geveild.

      2 Een deelnemer die op grond van [artikel 7][ref3] van verdere deelneming aan de veiling is uitgesloten en de
      deelnemer, bedoeld in het eerste lid, zijn uitgesloten van deelname aan de veiling waarbij een of meer kavels
      opnieuw worden geveild.

      3 Met inachtneming van het eerste en tweede lid, zijn slechts de deelnemers die bij de aanvang van de veiling
      gerechtigd waren een bod uit te brengen en niet het hoogste bod hebben uitgebracht op een van de andere kavels dan
      de kavel die opnieuw geveild wordt, gerechtigd om deel te nemen aan deze veiling.

      4 De minister maakt uiterlijk twee weken nadat op grond van het eerste lid is vastgesteld dat een kavel opnieuw
      wordt geveild, de datum en het tijdstip bekend waarop deze veiling een aanvang neemt, alsmede de plaats van deze
      veiling.

      5 Het in de eerste ronde minimaal te bieden bedrag voor een kavel die op grond van het eerste lid opnieuw wordt
      geveild, bedraagt tachtig procent van het hoogste bod dat door de in het eerste lid bedoelde deelnemer voor de
      betreffende kavel is uitgebracht.

      6 De [artikelen 1 tot en met 8][ref4], [10][ref5], [11][ref6], [13 tot en met 15][ref7], [17 tot en met 19][ref8]
      en [21 tot en met 27][ref9] zijn van toepassing op de in het eerste lid bedoelde veiling.


