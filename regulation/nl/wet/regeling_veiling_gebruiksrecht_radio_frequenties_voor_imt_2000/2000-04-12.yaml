  - number: '28'
    text: |-
      1 Indien een kavel niet opnieuw wordt geveild, wordt aan de deelnemer die niet het hoogste bod op een kavel
      heeft uitgebracht in het geval de deelnemer ter voldoening van het bedrag ter zekerstelling een waarborgsom
      heeft gestort, deze waarborgsom vermeerderd met de rente van een éénmaandsdeposito van de bank, bedoeld in
      [artikel 9, van de Regeling aanvraag vergunning voor IMT-2000][ref1], terugbetaald, of wordt in het geval de
      betreffende deelnemer ter voldoening van de zekerstelling een bankgarantie heeft overgelegd, deze bankgarantie
      teruggegeven, mits de staat geen vordering op de deelnemer heeft in verband met door de staat geleden schade dan
      wel door de staat gemaakte kosten.

      2 Indien een kavel opnieuw wordt geveild, en een deelnemer als bedoeld in [artikel 27, derde lid][ref2], niet het
      hoogste bod op een kavel heeft uitgebracht in de veiling, bedoeld in [artikel 27, eerste lid][ref3], is het eerste
      lid van overeenkomstige toepassing.

      3 Indien een kavel opnieuw wordt geveild en een deelnemer als bedoeld in [artikel 27, derde lid][ref4], niet
      deelneemt aan de veiling, bedoeld in [artikel 27, eerste lid][ref5], is het eerste lid van overeenkomstige
      toepassing.


