  - number: '2'
    text: |-
      1 De minister bepaalt de plaats van de veiling, alsmede het tijdstip waarop de veiling een aanvang neemt. Dit wordt
      schriftelijk aan de deelnemers medegedeeld.

      2 De veiling wordt uitsluitend op werkdagen gehouden.
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel2
  - number: '3'
    text: |-
      Geveild worden de kavels A tot en met E, bedoeld in
      [artikel 3, tweede lid, van de Regeling aanvraag vergunning voor IMT-2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel3
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '3'
  - number: '4'
    text: |-
      1 De minister wijst een veilingmeester aan.

      2 De veilingmeester leidt de veiling en draagt zorg voor een goed verloop van de veiling.

      3 Voorzover deze bevoegdheden niet bij of krachtens de wet aan de minister zijn voorbehouden, beschikt de
      veilingmeester, naast de bevoegdheden in de [paragrafen 5][ref1] en [6][ref2] van deze regeling, over de
      bevoegdheden die noodzakelijk zijn voor een goede uitvoering van zijn taak.

      4 De veilingmeester handelt bij de uitoefening van zijn taak in overeenstemming met de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011289
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011289
        paragraaf: '6'
  - number: '5'
    text: |-
      1 De minister wijst een notaris aan.

      2 De notaris, bedoeld in het eerste lid, beschikt over de bevoegdheden, bedoeld in de [paragrafen 5][ref1] en
      [6][ref2] van deze regeling en heeft tijdens de veilingprocedure een controlerende taak ten behoeve van een
      ordelijk verloop van de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Paragraaf5
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Paragraaf6
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011289
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0011289
        paragraaf: '6'
  - number: '6'
    text: |-
      1 Gedurende de veiling geschiedt alle communicatie tussen de deelnemers en de veilingmeester uitsluitend
      schriftelijk, door tussenkomst van de notaris.

      2 De deelnemers kunnen gedurende de veiling aan de veilingmeester vragen stellen met betrekking tot de
      veilingprocedure.

      3 De veilingmeester beantwoordt vragen als bedoeld in het tweede lid niet indien die vragen in het kader van de
      vraag- en antwoordprocedure, bedoeld in [artikel 5 van de Regeling aanvraag vergunning voor IMT-2000][ref1] zijn
      gesteld dan wel gesteld hadden kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0011288#Artikel5
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011288
        artikel: '5'
  - number: '7'
    text: |-
      1 Een deelnemer onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken of gedragingen die
      afbreuk doen aan de tot stand te brengen mededinging in de veilingprocedure.

      2 Een deelnemer onthoudt zich gedurende de veiling van gedragingen die het goed of ordelijk verloop van de veiling
      verstoren.

      3 De minister kan een deelnemer die handelt in strijd met het eerste lid van verdere deelname aan de veiling
      uitsluiten.

      4 De minister kan op voordracht van de veilingmeester een deelnemer die handelt in strijd met het tweede lid van
      verdere deelname van de veiling uitsluiten.

      5 Een voordracht als bedoeld in het vierde lid wordt niet gedaan dan nadat de veilingmeester de betreffende
      deelnemer ten minste een maal heeft meegedeeld dat verdere met het tweede lid in strijd zijnde gedragingen kunnen
      leiden tot uitsluiting van verdere deelname aan de veiling.
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel7
  - number: '8'
    text: |-
      1 De kavels worden gelijktijdig bij opbod geveild.

      2 De veiling vindt in ronden plaats.
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel8
  - number: '9'
    text: |-
      1 Het in de eerste ronde minimaal te bieden bedrag bedraagt voor kavel A en voor kavel B honderd miljoen gulden.

      2 Het in de eerste ronde minimaal te bieden bedrag bedraagt voor elk van de kavels C tot en met E negentig miljoen
      gulden.
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel9
  - number: '10'
    text: |-
      1 De veilingmeester stelt voorafgaand aan de eerste ronde vast:

      1°. het rondenummer;

      2°. vanaf welk tijdstip de biedkaarten kunnen worden ingeleverd; en

      3°. op welk tijdstip uiterlijk de biedkaarten moeten zijn ingeleverd.

      2 De veilingmeester stelt voorafgaand aan elke volgende ronde vast:

      a. met betrekking tot de voorgaande ronde:

      1º. het rondenummer;

      2º. het aantal keren dat een paskaart is ingeleverd;

      3º. het aantal keren dat op de kavels een bod is uitgebracht;

      4º. het hoogst geboden bedrag per kavel en het aantal keren dat het hoogste bedrag is geboden;

      5º. voor iedere afzonderlijke kavel, de deelnemer die, na eventuele toepassing van [artikel 15][ref1] of na
      eventuele loting, bedoeld in [artikel 21, zesde lid][ref2], wordt aangemerkt als degene die het hoogste bod op die
      kavel heeft uitgebracht;

      b. met betrekking tot de volgende ronde:

      1º. het rondenummer;

      2º. het minimaal te bieden bedrag per kavel;

      3º. vanaf welk tijdstip de biedkaarten kunnen worden ingeleverd; en

      4º. op welk tijdstip uiterlijk de biedkaarten moeten zijn ingeleverd.

      3 Een ronde eindigt op het tijdstip, bedoeld in het eerste lid, onder 3°, onderscheidenlijk het tweede
      lid, onderdeel b, onder 4°, of zoveel eerder als alle biedkaarten of paskaarten met inachtneming van
      [artikel 19, tweede lid][ref3], onderscheidenlijk [artikel 20][ref4], zijn ingeleverd.

      4 De veilingmeester rondt het hoogst geboden bedrag op de kavels A tot en met E af op eenheden van 100.000 gulden.

      5 De notaris deelt aan alle deelnemers mee hetgeen de veilingmeester heeft vastgesteld op grond van het eerste en
      tweede lid, met dien verstande dat met betrekking tot het bedrag, bedoeld in het tweede lid, onderdeel a, onder 4°,
      wordt meegedeeld het door de veilingmeester afgeronde bedrag, bedoeld in het vierde lid.

      6 De deelnemers van wie de veilingmeester heeft vastgesteld dat deze het hoogst geboden bedrag op een kavel hebben
      uitgebracht, worden hiervan door de notaris tevens afzonderlijk op de hoogte gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011289#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0011289#Artikel20
