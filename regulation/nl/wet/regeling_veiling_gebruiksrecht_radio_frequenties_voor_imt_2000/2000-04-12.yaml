        bwb_id: BWBR0011289
        artikel: '18'
        paragraaf: '6'
  - number: '20'
    text: |-
      Ten aanzien van de paskaarten zijn de [artikelen 17, zesde lid][ref1], [18][ref2], en [19, derde lid][ref3], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0011289#Artikel19
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011289
        artikel: '17'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0011289
        artikel: '18'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0011289
        artikel: '19'
        paragraaf: '6'
  - number: '21'
    text: |-
      1 Een deelnemer brengt in iedere ronde op één kavel een bod uit.

      2 Indien een deelnemer in een ronde overeenkomstig de [artikelen 16][ref1] en [20][ref2] een paskaart heeft
      ingeleverd, is deze deelnemer gerechtigd om in de daarop volgende ronde een bod uit te brengen.

      3 In afwijking van het eerste lid is een deelnemer die het hoogste bod op een kavel heeft uitgebracht tot de ronde
      die volgt op de ronde waarin een andere deelnemer een hoger bod op die kavel heeft uitgebracht, niet gerechtigd om
      een bod uit te brengen op enige kavel.

      4 Onverminderd het derde lid is een deelnemer die in een ronde geen bod of een ongeldig bod heeft uitgebracht, niet
      langer gerechtigd in enige daarop volgende ronde een bod uit te brengen.

      5 In afwijking van het derde lid, is een deelnemer die in een ronde het hoogste bod op een kavel heeft uitgebracht,
      gerechtigd op die kavel een bod uit te brengen in de ronde, bedoeld in [artikel 23, eerste lid, onder c][ref3].

      6 Indien in een ronde twee of meer deelnemers hetzelfde hoogste bedrag voor eenzelfde kavel hebben geboden, stelt
      de veilingmeester op grond van een door de notaris te houden loting vast wie van hen wordt aangemerkt als degene
      die het hoogste bod in die ronde op die kavel heeft uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0011289#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0011289#Artikel23
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel21
