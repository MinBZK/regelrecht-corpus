  - number: '11'
    text: |-
      1 Het minimaal te bieden bedrag per kavel, bedoeld in [artikel 10, tweede lid, onderdeel b, onder 2°][ref1], is
      gelijk aan het in de voorgaande ronde hoogst geboden bedrag voor die kavel vermeerderd met:

      a. een bedrag van tweehonderdduizend gulden, of

      b. een door de veilingmeester vast te stellen percentage van ten hoogste tien procent.

      2 De veilingmeester rondt het bedrag, bedoeld in het eerste lid, af op hele guldens.


      [ref1]: https://wetten.overheid.nl/BWBR0011289#Artikel10
    url: https://wetten.overheid.nl/BWBR0011289/2000-04-12#Artikel11
