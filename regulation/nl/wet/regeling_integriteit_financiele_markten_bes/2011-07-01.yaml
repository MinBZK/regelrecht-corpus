  - number: '5'
    text: |-
      1 De toezichtautoriteit verkrijgt inzicht in de in [artikel 4, eerste lid][ref1], bedoelde voornemens, handelingen
      en antecedenten op grond van:

      a. door betrokkene verstrekte gegevens en inlichtingen;

      b. door de procureur-generaal uit inlichtingen van de justitiële documentatiedienst verstrekte gegevens;

      c. gegevens en inlichtingen, verkregen van de rijksbelastingdienst;

      d. gegevens en inlichtingen, verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van Nederlandse
      of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of
      op personen die op die markten werkzaam zijn;

      e. ambtsberichten van het Openbaar Ministerie;

      f. inlichtingen, verkregen van door betrokkene opgegeven referenties;

      g. gegevens uit openbare bronnen;

      h. inlichtingen, verkregen van curatoren of bewindvoerders met betrekking tot faillissementen, surseances,
      schuldsaneringen, bewindvoeringen of noodregelingen waarbij de in [artikel 3][ref2] bedoelde persoon betrokken is
      geweest; of

      i. inlichtingen, verkregen van organisaties van huidige of voormalige beroepsgenoten van betrokkene.

      2 Indien de gegevens of inlichtingen, verkregen overeenkomstig het eerste lid, de toezichtautoriteit aanleiding
      geven tot nader onderzoek, kan de toezichtautoriteit ook inlichtingen inwinnen en gegevens opvragen bij andere
      personen of instanties dan genoemd in dat lid. De toezichtautoriteit stelt de betrokkene in dat geval vooraf
      schriftelijk in kennis van:

      a. de reden van het nadere onderzoek;

      b. de personen of instanties bij wie nadere gegevens of inlichtingen zullen worden ingewonnen; en

      c. de aard van de nadere gegevens of inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0028608#Artikel3
