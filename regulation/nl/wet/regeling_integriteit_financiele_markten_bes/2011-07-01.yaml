  - number: '16'
    text: |-
      1 Een instelling beschikt over procedures en maatregelen met betrekking tot de omgang met en vastlegging van
      incidenten. Die procedures en maatregelen voorzien in elk geval in een degelijke administratieve vastlegging van:

      1°. de kenmerken van het incident;

      2°. gegevens over degene(n) die het incident heeft (hebben) bewerkstelligd;

      3°. de naar aanleiding van het incident genomen maatregelen.

      2 De instelling neemt naar aanleiding van een incident maatregelen die zijn gericht op het beheersen van de
      opgetreden risico’s en het voorkomen van herhaling.

      3 De instelling informeert de toezichtautoriteit onverwijld schriftelijk omtrent incidenten.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel16
  - number: '17'
    text: |-
      1 Een instelling houdt een overzicht bij van de integriteitsgevoelige functies in haar onderneming, en van de
      taken, bevoegdheden en verantwoordelijkheden behorende bij elk van die functies.

      2 Een instelling maakt een onderbouwde beoordeling van de betrouwbaarheid van personen die zij wil benoemen in een
      integriteitsgevoelige functie.

      3 Een instelling draagt zorg voor de beoordeling van de betrouwbaarheid van personen die, anders dan op grond van
      een arbeidsovereenkomst, werkzaamheden in een integriteitgevoelige functie verrichten.

      4 Een instelling maakt voortdurend een onderbouwde beoordeling van de betrouwbaarheid van personen die benoemd zijn
      of werkzaamheden verrichten in een integriteitsgevoelige functie.

      5 Een instelling beschikt over procedures en maatregelen die waarborgen dat zij voldoet aan het tweede tot en met
      het vierde lid. De werkzaamheden die zijn verricht ten behoeve van de naleving van die leden en de uitkomsten van
      die werkzaamheden worden door de instelling schriftelijk vastgelegd.

      6 De toezichtautoriteit kan nadere regels stellen met betrekking tot de wijze waarop een instelling de
      betrouwbaarheid beoordeelt van personen als bedoeld in het tweede tot en met het vierde lid en de vastlegging van
      gegevens ingevolge het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel17
  - number: '18'
    text: |-
      1 Omtrent een persoon van wie zij de betrouwbaarheid heeft beoordeeld ingevolge
      [artikel 17, tweede tot en met vierde lid][ref1], verstrekt een instelling desgevraagd schriftelijk inlichtingen
      aan een andere instelling ten behoeve van de beoordeling door die andere instelling van die persoon ingevolge
      artikel 17, tweede tot en met vierde lid, zodanig dat over de betrouwbaarheid een juist en zo volledig mogelijk
      beeld bestaat.

      2 Een instelling onthoudt zich van handelingen waarvan zij weet of redelijkerwijs moet vermoeden dat deze een
      onjuist beeld kunnen doen ontstaan van een persoon als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel17
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel18
