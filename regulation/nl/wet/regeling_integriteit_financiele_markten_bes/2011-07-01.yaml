  - number: '24'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

        - *betaler:* een rekeninghouder, zijnde een natuurlijke persoon of rechtspersoon, die een geldelijke overmaking
      vanaf de door hem gehouden rekening toestaat, of bij ontbreken van een rekening, een natuurlijke of rechtspersoon
      die de opdracht tot het overmaken van geld geeft;
        - *betalingsdienstaanbieder:* kredietinstelling of geldtransactiekantoor;
        - *begunstigde:* natuurlijke persoon of rechtspersoon die de beoogde uiteindelijke ontvanger van de overgemaakte
      gelden is;
        - *blokovermaking:* meerdere afzonderlijke geldelijke overmakingen die zijn gebundeld met het oog op de transmissie
      ervan;
        - *geldelijke overmaking:* transactie die door een betalingsdienstaanbieder langs elektronische weg wordt
      uitgevoerd voor rekening van een betaler met de bedoeling bij een betalingsdienstaanbieder gelden beschikbaar te
      stellen voor een begunstigde, ongeacht of de betaler en de begunstigde een en dezelfde persoon zijn;
        - *intermediaire betalingsdienstaanbieder:* betalingsdienstaanbieder die noch handelt in opdracht van de betaler,
      noch van de begunstigde, en die betrokken is bij de uitvoering van geldelijke overmakingen;
        - *unieke identificatiecode:* een combinatie van letters, cijfers of symbolen, door de betalingsdienstaanbieder
      bepaald, overeenkomstig de protocollen van het betalings- en afwikkelingssysteem of het berichtensysteem dat voor
      de geldelijke overmaking is gebruikt.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel24
  - number: '25'
    text: |-
      De bepalingen van deze paragraaf zijn niet van toepassing op geldelijke overmakingen die met behulp van een
      krediet- of debetkaart worden verricht, mits:

      a. de begunstigde een overeenkomst met de betalingsdienstaanbieder heeft op grond waarvan de betaling voor de
      levering van goederen en de verrichting van diensten mogelijk is; en

      b. bij de geldelijke overmaking een unieke identificatiecode is gevoegd die het mogelijk maakt deze geldelijke
      overmaking terug te traceren naar de betaler.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel25
  - number: '26'
    text: |-
      De bepalingen van deze paragraaf zijn niet van toepassing op geldelijke overmakingen die via een mobiele telefoon
      of een ander digitaal of Informatie Technologie (IT)-toestel werden verricht, indien dergelijke geldelijke
      overmakingen vooraf zijn betaald en het bedrag van USD 150 niet overschrijden.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel26
  - number: '27'
    text: |-
      De bepalingen van deze paragraaf zijn niet van toepassing op:

      a. geldelijke overmakingen waarbij de betaler geld van zijn eigen rekening afhaalt;

      b. geldelijke overmakingen waarbij er sprake is van een incassomachtiging tussen twee partijen op grond waarvan
      betalingen tussen deze partijen via rekeningen kunnen worden verricht, mits bij de geldelijke overmaking een
      unieke identificatiecode is gevoegd die het mogelijk maakt de transactie naar de natuurlijke of de rechtspersoon
      te traceren;

      c. geldelijke overmakingen waarbij ingehouden cheques worden gebruikt;

      d. geldelijke overmakingen aan de overheid voor belastingen, boetes of andere heffingen binnen de openbare
      lichamen;

      e. geldelijke overmakingen waarbij zowel de betaler als de begunstigde betalingsdienstaanbieders zijn die voor
      eigen rekening handelen.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel27
  - number: '28'
    text: |-
      1 De volledige informatie over de betaler bestaat uit zijn volledige naam of namen, adres en rekeningnummer.

      2 Het adres mag worden vervangen door de geboorteplaats en -datum van de betaler of zijn cliëntidentificatienummer.

      3 Bij gebreke van het rekeningnummer van de betaler vervangt de betalingsdienstaanbieder van de betaler dit door
      een unieke identificatiecode aan de hand waarvan de geldelijke overmaking terug kan worden getraceerd naar de
      betaler.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel28
  - number: '29'
    text: |-
      1 Betalingsdienstaanbieders zorgen ervoor dat de volledige informatie over de betaler bij de geldovermakingen wordt
      gevoegd.

      2 De betalingsdienstaanbieder van de betaler bewaart gedurende vijf jaar de volledige informatie over de betaler
      welke bij geldovermakingen wordt gevoegd.

      3 In afwijking van het eerste lid wordt bij geldelijke overmakingen waarbij zowel de betalingsdienstaanbieder van
      de betaler als de betalingsdienstaanbieder van de begunstigde in een openbaar lichaam is gevestigd, alleen het
      rekeningnummer van de betaler gevoegd of een unieke identificatiecode aan de hand waarvan de geldelijke overmaking
      terug kan worden getraceerd naar de betaler.

      4 In geval het derde lid toepasselijk is, stelt de betalingsdienstaanbieder van de betaler evenwel op verzoek van
      de betalingsdienstaanbieder van de begunstigde uiterlijk drie werkdagen na ontvangst van dit verzoek de volledige
      informatie over de betaler ter beschikking van de betalingsdienstaanbieder van de begunstigde.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel29
  - number: '30'
    text: |-
      1 Wanneer de betalingsdienstaanbieder van de begunstigde buiten de openbare lichamen is gevestigd, wordt bij
      geldovermakingen de volledige informatie over de betaler gevoegd.

      2 Wanneer de betalingsdienstaanbieders van de begunstigden buiten de openbare lichamen zijn gevestigd, is
      bij blokovermakingen die afkomstig zijn van één betaler het eerste lid niet van toepassing op de gebundelde
      afzonderlijke geldovermakingen, mits het batchbestand de in dat lid bedoelde informatie bevat en bij de
      afzonderlijke geldovermakingen het rekeningnummer van de betaler of een unieke identificatiecode is gevoegd.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel30
  - number: '31'
    text: |-
      Een betalingsdienstaanbieder beschikt over procedures en maatregelen die ertoe strekken dat hij, indien een andere
      betalingsdienstaanbieder regelmatig nalaat de vereiste informatie over de betaler te verstrekken, overweegt te
      besluiten alle toekomstige geldovermakingen van deze betalingsdienstaanbieder te weigeren of zijn relatie met die
      betalingsdienstaanbieder al dan niet te beperken of te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel31
  - number: '32'
    text: |-
      De betalingsdienstaanbieder van de begunstigde controleert of de velden voor informatie over de betaler in
      het berichtensysteem of het betalings- en afwikkelingssysteem dat voor de geldovermaking gebruikt wordt, zijn
      ingevuld met karakters of invoer die toegelaten zijn volgens de procedures van het berichten- of het betalings-
      en afwikkelingssysteem. Deze betalingsdienstaanbieder beschikt over effectieve procedures om het ontbreken van de
      volgende informatie over de betaler op te merken:

      a. bij geldovermakingen waarbij de betalingsdienstaanbieder van de betaler in een openbaar lichaam is gevestigd, de
      uit hoofde van [artikel 29, derde lid][ref1], vereiste informatie;

      b. bij geldovermakingen waarbij de betalingsdienstaanbieder van de betaler buiten de openbare lichamen is
      gevestigd, de in [artikel 28, eerste lid][ref2], bedoelde volledige informatie over de betaler, of, in voorkomend
      geval, de uit hoofde van [artikel 36][ref3] vereiste informatie;

      en

      c. bij blokovermakingen waarbij de betalingsdienstaanbieder van de betaler buiten de openbare lichamen is
      gevestigd, dient de in [artikel 28, eerste lid][ref4], bedoelde volledige informatie over de betaler alleen in de
      blokovermaking te staan, en niet bij de daarin gebundelde afzonderlijke geldovermakingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0028608#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028608#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0028608#Artikel28
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028608
        artikel: '29'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028608
        artikel: '28'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0028608
        artikel: '36'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0028608
        artikel: '28'
        paragraaf: '4'
  - number: '33'
    text: |-
      Ingeval de betalingsdienstaanbieder van de begunstigde bij de ontvangst van geldelijke overmakingen constateert
      dat de krachtens de bepalingen van deze paragraaf vereiste informatie over de betaler onvolledig is, weigert hij de
      overmaking tot hij de bedoelde informatie heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel33
  - number: '34'
    text: |-
      De betalingsdienstaanbieder van de begunstigde houdt alle over de betaler ontvangen informatie gedurende vijf jaar
      bij.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel34
  - number: '35'
    text: |-
      Intermediaire betalingsdienstaanbieders dragen ervoor zorg dat alle ontvangen informatie over de betaler welke bij
      een geldelijke overmaking is gevoegd, bij die overmaking blijft.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel35
  - number: '36'
    text: |-
      1 Dit artikel is van toepassing wanneer de betalingsdienstaanbieder van de betaler buiten de openbare lichamen is
      gevestigd en de intermediaire betalingsdienstaanbieder in een openbaar lichaam is gevestigd.

      2 Tenzij de intermediaire betalingsdienstaanbieder bij de ontvangst van een geldelijke overmaking constateert dat
      de krachtens de bepalingen van deze paragraaf vereiste informatie over de betaler ontbreekt of onvolledig is, kan
      hij een betalingssysteem met technische beperkingen gebruiken dat belet dat de informatie over de betaler bij de
      geldelijke overmaking blijft om de geldovermakingen naar de betalingsdienstaanbieder van de begunstigde te sturen.

      3 Wanneer de intermediaire betalingsdienstaanbieder bij ontvangst van een geldelijke overmaking constateert dat
      de krachtens deze paragraaf vereiste informatie over de betaler ontbreekt of onvolledig is, gebruikt hij enkel een
      betalingssysteem met technische beperkingen als het de betalingsdienstaanbieder van de begunstigde hierover kan
      inlichten, hetzij binnen een berichten- of betalingssysteem dat voorziet in de melding van dit feit, hetzij via een
      andere procedure, mits deze communicatiewijze door beide betalingsdienstaanbieders is aanvaard of overeengekomen.

      4 Wanneer de intermediaire betalingsdienstaanbieder een betalingssysteem met technische beperkingen gebruikt, stelt
      hij op verzoek van de betalingsdienstaanbieder van de begunstigde uiterlijk drie werkdagen na ontvangst van dit
      verzoek alle ontvangen informatie over de betaler ter beschikking van deze betalingsdienstaanbieder, ongeacht of
      die informatie volledig is of niet.

      5 In de in het tweede en derde lid vermelde gevallen bewaart de intermediaire betalingsdienstaanbieder alle
      ontvangen informatie gedurende vijf jaar.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel36
  - number: '37'
    text: |-
      Een instelling beschikt over procedures en maatregelen die waarborgen dat zij op verzoek van de toezichtautoriteit
      onverwijld de bij geldovermakingen te voegen informatie over de betaler en de daarop betrekking hebbende
      bewijsstukken verstrekt aan de toezichtautoriteit.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel37
  - number: '38'
    text: |-
      Het model voor het aangiftebiljet voor de aanmelding van een grensoverschrijdend geldtransport, bedoeld in
      [artikel 2, tweede lid, van de Wet grensoverschrijdende geldtransporten BES][ref1], is vastgesteld overeenkomstig
      de bij deze regeling behorende [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028165#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028608
