  - number: '43'
    text: |-
      1 Indien een cliënt niet fysiek aanwezig is voor identificatie neemt een dienstverlener maatregelen om het daaruit
      voortvloeiende hogere risico op witwassen of financieren van terrorisme te compenseren. De dienstverlener kan aan
      de vorige volzin voldoen indien hij:

      a. de identiteit van de cliënt verifieert aan de hand van aanvullende documenten, gegevens of informatie;

      b. de overgelegde documenten beoordeelt op echtheid; of

      c. waarborgt dat de eerste betaling die met de zakelijke relatie of transactie verband houdt, wordt gedaan ten
      gunste of ten laste van een rekening van de cliënt bij een bank met zetel in een lidstaat van de Europese Unie
      of in een door de Minister van Financiën aangewezen staat die beschikt over een vergunning om in die lidstaat
      onderscheidenlijk die staat haar bedrijf te mogen uitoefenen.

      2 Een dienstverlener draagt er zorg voor dat hij over procedures beschikt om te bepalen of de cliënt zijn
      woonplaats of vestiging heeft in een land of gebied met een verhoogd risico voor witwassen of de financiering van
      terrorisme dan wel een politiek prominent persoon is.

      3 Onverminderd het eerste lid draagt een dienstverlener die een zakelijke relatie aangaat met of een transactie
      verricht voor een cliënt die een zijn woonplaats of vestiging heeft in een land of gebied met een verhoogd risico
      voor witwassen of de financiering van terrorisme dan wel een politiek prominent persoon is, er tevens zorg voor
      dat:

      a. de beslissing tot het aangaan van die relatie of het verrichten van die transactie wordt genomen of wordt
      goedgekeurd door personen die daartoe door de dienstverlener zijn gemachtigd;

      b. hij adequate maatregelen treft om de bron van het vermogen vast te stellen dat bij de zakelijke relatie of
      transactie wordt gebruikt; en

      c. hij doorlopend controle uitoefent op de zakelijke relatie.

      4 Het derde lid is van overeenkomstige toepassing ten aanzien van:

      a. het aangaan van een zakelijke relatie met of het verrichten van een transactie gericht op private banking;

      b. het aangaan van een zakelijke relatie met of het verrichten van een transactie voor een cliënt die betrokken is
      bij de exploitatie van hazardspelen waaronder speelcasino’s, al dan niet via internet.

      5 Onderdeel b van het derde lid is van overeenkomstige toepassing op een kredietinstelling die een geldelijke
      overmaking als bedoeld in [artikel 24][ref1] verricht in opdracht van een cliënt die geen rekeninghouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel24
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0028608
        artikel: '24'
        paragraaf: '4'
  - number: '44'
    text: |-
      Een kredietinstelling die met een kredietinstelling buiten het Koninkrijk een vaste relatie aangaat voor de
      afwikkeling van transacties of de uitvoering van opdrachten draagt er zorg voor dat:

      a. zij voldoende informatie over de betrokken kredietinstelling verzamelt om een volledig beeld te krijgen van de
      aard van haar bedrijfsactiviteiten, en op basis van openbaar beschikbare informatie de reputatie van de bank en de
      kwaliteit van het toezicht dat op de kredietinstelling wordt uitgeoefend beoordeelt;

      b. zij de procedures en maatregelen ter voorkoming van witwassen en financieren van terrorisme van de betrokken
      kredietinstelling beoordeelt;

      c. indien het een nieuwe correspondentbankrelatie betreft, de beslissing tot het aangaan van die relatie wordt
      genomen of goedgekeurd door personen die daartoe door de kredietinstelling gemachtigd zijn;

      d. de verantwoordelijkheden van beide kredietinstellingen schriftelijk worden vastgelegd;

      e. de betrokken kredietinstelling de cliënt heeft geïdentificeerd en zijn identiteit heeft geverifieerd en
      daarnaast doorlopend toezicht houdt op de cliënten die rechtstreeks toegang hebben tot transitrekeningen en dat
      deze in staat is om haar op verzoek de relevante cliëntgegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel44
  - number: '45'
    text: |-
      De gegevens die in het uittreksel dan wel de verklaring, bedoeld in [artikel 3, tweede lid, van de wet][ref1],
      moeten zijn opgenomen, zijn:

      a. van de rechtspersoon: de rechtsvorm, de statutaire naam, de handelsnaam, het volledige adres, de plaats van
      vestiging, land van zetel, persoonsgegevens van bestuurders, statutaire bepalingen betreffende de bevoegdheid de
      rechtspersoon te binden, en indien de rechtspersoon bij een Kamer van Koophandel en Nijverheid, of soortgelijke
      instantie, is geregistreerd, het registratienummer en de staat of het openbaar lichaam of ander onderdeel van het
      Koninkrijk waarin een zodanige Kamer, of soortgelijke instantie, is ingesteld;

      b. van alle gemachtigden en vertegenwoordigers: de naam, de geboortedatum en het document aan de hand waarvan
      identificatie heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel3
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0028490
        artikel: '3'
  - number: '46'
    text: |-
      Als staat in de zin van [artikel 4, tweede en derde lid][ref1], en [artikel 5, vijfde lid, van de wet][ref2] worden
      aangewezen: de landen van het Koninkrijk, de Verenigde Staten van Amerika en Canada.


