  - number: '6'
    text: |-
      1 De betrouwbaarheid van een persoon als bedoeld in [artikel 3][ref1] staat niet buiten twijfel indien deze
      veroordeeld is terzake van een misdrijf, genoemd in onderdeel 1 van [bijlage A][ref2], tenzij er sinds het
      onherroepelijk worden van de uitspraak acht jaren of meer zijn verstreken.

      2 De toezichtautoriteit kan op grond van de omstandigheden of belangen, genoemd in [artikel 7][ref3], afwijken van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028608
      [ref3]: https://wetten.overheid.nl/BWBR0028608#Artikel7
