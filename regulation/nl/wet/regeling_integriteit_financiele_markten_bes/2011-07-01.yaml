  - number: '39'
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

        - *lidstaat:* een lidstaat van de Europese Unie;
        - *politiek prominente personen:* natuurlijke personen die een prominente publieke functie bekleden of hebben
      bekleed en directe familieleden of naaste geassocieerden van deze personen;
        - *wet:* de [Wet identificatie bij dienstverlening BES][ref1];
        - *zakelijke relatie:* een relatie als bedoeld in [artikel 5a van de wet][ref2].

      2 Voor de toepassing van het eerste lid wordt verstaan onder:

        - *prominente publieke functies:* de functies, tenzij bekleed door middelbare of lagere ambtenaren, van:
      1°. staatshoofden, regeringsleiders, ministers en staatssecretarissen; 2°. parlementsleden; 3°. leden van
      hooggerechtshoven, constitutionele hoven en andere hoge rechterlijke instanties die arresten wijzen waartegen
      doorgaans geen verder beroep mogelijk is, behalve in uitzonderlijke omstandigheden; 4°. leden van rekenkamers
      of van directies van centrale banken; 5°. ambassadeurs, zaakgelastigden en hoge legerofficieren; 6°. leden van
      bestuurs-, leidinggevende of toezichthoudende organen van overheidsbedrijven; inclusief posten op of internationaal
      niveau;
        - *directe familieleden:* 1°. de echtgenoot of echtgenote; 2°. een partner die naar nationaal recht als
      gelijkwaardig met een echtgenoot of echtgenote wordt aangemerkt; 3°. de kinderen en hun echtgenoten of partners;
      4°. de ouders;
        - *naaste geassocieerde:* a. een natuurlijke persoon van wie bekend is, dat deze met een persoon die een prominente
      publieke functie bekleedt of heeft bekleed de gezamenlijke uiteindelijke begunstigde is van juridische entiteiten
      of juridische constructies of met die persoon andere nauwe zakelijke relaties heeft; b. een natuurlijke persoon
      die alleen de juridisch begunstigde is van een juridische entiteit of juridische constructie waarvan bekend is,
      dat deze is opgezet ten behoeve van de feitelijke begunstiging van een persoon die een prominente publieke functie
      bekleedt of heeft bekleed.


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel39
