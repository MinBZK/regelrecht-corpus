        artikel: '13'
  - number: '12'
    text: |-
      1 Een beleidsbepaler of medebeleidsbepaler, zijnde een natuurlijke persoon, van een op de [bijlage A][ref1] bij
      de vergunning van een trustkantoor geplaatste persoon, beschikt naar het oordeel van de toezichtautoriteit over
      voldoende relevante kennis en ervaring om beheersdiensten onder de verantwoordelijkheid van het trustkantoor te
      verlenen.

      2 Indien een beleidsbepaler of medebeleidsbepaler van een op de [bijlage A][ref2] bij de vergunning van een
      trustkantoor geplaatste persoon een rechtspersoon is, beschikt iedere natuurlijke persoon die de rechtspersoon in
      deze vertegenwoordigt naar het oordeel van de toezichtautoriteit over voldoende relevante kennis en ervaring om
      beheersdiensten onder de verantwoordelijkheid van het trustkantoor te verlenen.

      3 Het eerste lid is van overeenkomstige toepassing op een op [bijlage B][ref3] bij de vergunning van een
      trustkantoor geplaatste natuurlijke persoon.

      4 Indien aanwezig, beschikt de Raad van Commissarissen van een op de [bijlage A][ref4] bij de vergunning van
      een trustkantoor geplaatste persoon bestaande uit natuurlijke personen, als geheel naar het oordeel van de
      toezichtautoriteit over voldoende relevante kennis en ervaring voor het toezicht op de bedrijfsvoering van die
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0028608
      [ref2]: https://wetten.overheid.nl/BWBR0028608
      [ref3]: https://wetten.overheid.nl/BWBR0028608
      [ref4]: https://wetten.overheid.nl/BWBR0028608
