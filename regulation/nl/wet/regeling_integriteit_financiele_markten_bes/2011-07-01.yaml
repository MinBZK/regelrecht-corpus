  - number: '54'
    text: |-
      Als transacties die zouden kunnen duiden op de financiering van terrorisme in de zin van bijlage A bij het
      Besluit indicatoren ongebruikelijke transacties creditcards en money transfers BES en bijlagen A tot en met E
      bij het Besluit indicatoren ongebruikelijke transacties BES worden in elk geval aangemerkt transacties waarbij
      als wederpartij optreedt, dan wel op andere wijze betrokken is, een natuurlijke persoon, rechtspersoon, groep of
      entiteit die is vermeld op:

      1°. de bijlage, behorende bij de artikelen 1 en 4 van het Gemeenschappelijk Standpunt 2001/931/GBVB van de Raad van
      de Europese Unie van 27 december 2001 betreffende de toepassing van specifieke maatregelen ter bestrijding van het
      terrorisme (PbEG L 344);

      2°. de lijst, vastgesteld op grond van artikel 2, derde lid, van [verordening (EG) nr. 2580/2001](32001R2580) van
      de Raad van de Europese Unie van 27 december 2001 inzake specifieke beperkende maatregelen tegen bepaalde personen
      en entiteiten met het oog op de strijd tegen het terrorisme (PbEG L 344); of

      3°. bijlage I bij [Verordening (EG) nr. 881/2002](32002R0881) van de Raad van de Europese Unie van 27 mei 2002 tot
      vaststelling van bepaalde specifieke beperkingen tegen sommige personen en entiteiten die banden hebben met Usama
      bin Laden, het Al-Qa'ida-netwerk en de Taliban, en tot intrekking van [Verordening (EG) nr. 467/2001](32001R0467)
      van de Raad tot instelling van een verbod op de uitvoer van bepaalde goederen en diensten naar Afghanistan, tot
      versterking van het verbod op vluchten en verlenging van de bevriezing van tegoeden en andere financiële middelen
      ten aanzien van de Taliban van Afghanistan (PbEG L 139).
