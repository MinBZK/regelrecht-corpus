  - number: '2'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder

        - *instelling:* 1°. een administrateur; 2°. een assurantiebemiddelaar; 3°. een beleggingsinstelling; 4°. een
      geldtransactiekantoor; 5°. een kredietinstelling; 6°. een trustkantoor.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel2
  - number: '3'
    text: |-
      1 Het beleid van een instelling wordt bepaald of medebepaald door personen wier betrouwbaarheid buiten twijfel
      staat. Indien binnen de instelling een orgaan is belast met toezicht op het beleid en de algemene gang van zaken
      van de instelling, wordt dit toezicht gehouden door personen wier betrouwbaarheid buiten twijfel staat.

      2 De betrouwbaarheid van een persoon als bedoeld in het eerste lid staat voor de duur van drie jaren buiten
      twijfel wanneer dat door de toezichtautoriteit voor de toepassing van deze regeling is vastgesteld, zolang niet een
      wijziging in de relevante feiten of omstandigheden een redelijke aanleiding geeft tot een nieuwe beoordeling.

      3 De toezichtautoriteit kan tot en met 31 december 2011 de opneming van Bonaire, Sint Eustatius en Saba in het
      Nederlandse staatsbestel aanmerken als een wijziging in de relevante feiten of omstandigheden in de zin van het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel3
  - number: '4'
    text: |-
      1 De toezichtautoriteit stelt vast of de betrouwbaarheid van een persoon als bedoeld in
      [artikel 3, eerste lid][ref1], buiten twijfel staat op basis van diens voornemens, handelingen en antecedenten.

      2 De toezichtautoriteit neemt bij de vaststelling, bedoeld in het eerste lid, in ieder geval in aanmerking:

      a. de in de onderdelen 1 en 2 van [Bijlage A][ref2] genoemde strafrechtelijke antecedenten;

      b. de in onderdeel 3 van [Bijlage A][ref3] genoemde financiële antecedenten;

      c. de in onderdeel 4 van [Bijlage A][ref4] genoemde toezichtantecedenten;

      d. de in onderdeel 5 van [Bijlage A][ref5] genoemde fiscaal bestuursrechtelijke antecedenten; en

      e. de in onderdeel 6 van [Bijlage A][ref6] genoemde overige antecedenten.

      3 In geval de betreffende instelling haar zetel in een openbaar lichaam heeft, neemt de toezichtautoriteit bij
      de vaststelling, bedoeld in het eerste lid, voorts in aanmerking de in onderdeel 7 van [Bijlage A][ref7] genoemde
      zakelijk financiële antecedenten.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel3
