  - number: '42'
    text: |-
      1 Vrijstelling van [artikel 2, eerste lid, onderdeel a, van de wet][ref1] wordt verleend aan dienstverleners, voor
      zover deze:

      a. diensten verlenen aan een cliënt ten aanzien waarvan onderzoek conform
      [artikel 2, eerste lid, onderdeel a, van de wet][ref2] is uitgevoerd door een andere dienstverlener; en

      b. beschikken over afschriften van alle stukken aan de hand waarvan dat onderzoek heeft plaatsgevonden alsmede over
      naam, adres en overige contactgegevens van die andere dienstverlener en van de persoon die binnen de organisatie
      van die andere dienstverlener verantwoordelijk is voor het bedoelde onderzoek.

      2 Vrijstelling van [artikel 2, eerste lid, van de wet][ref3] wordt verleend aan dienstverleners, voor zover deze
      diensten verlenen aan:

      a. een onderneming of instelling als bedoeld in [artikel 2, vierde lid, van de wet][ref4];

      b. een beleggingsinstelling of administrateur die over een vergunning als bedoeld in [artikel 3][ref5]
      onderscheidenlijk [artikel 14 van de Wet toezicht beleggingsinstellingen en administrateurs BES][ref6] beschikt;

      c. een trustkantoor dat over een vergunning als bedoeld in
      [artikel 2, tweede lid, van de Wet toezicht trustwezen BES][ref7] beschikt;

      d. een assurantiebemiddelaar die is ingeschreven in het register, bedoeld in
      [artikel 4 van de Wet assurantiebemiddelingsbedrijf BES][ref8];

      e. een natuurlijke persoon of rechtspersoon die is aangesloten bij een effectenbeurs die lid is van de Fédération
      Internationale des Bourses de Valeurs, en die is gevestigd in een land van het Koninkrijk, de Verenigde Staten van
      Amerika of Canada;

      f. een onderneming of instelling waaraan door de bevoegde autoriteiten van een land van het Koninkrijk,
      de Verenigde Staten van Amerika of Canada vergunning is verleend voor de uitoefening van het bedrijf van
      kredietinstelling, beleggingsinstelling, levensverzekeraar, effectenbemiddeling of vermogensbeheerder.

      3 Behoudens in de omstandigheid van [artikel 41, onderdeel a][ref9], wordt vrijstelling van
      [artikel 2, eerste lid, van de wet][ref10] verleend aan dienstverleners, voor zover deze een dienst verlenen als
      bedoeld in:

      a. [artikel 1, onderdeel b, onder 5°, van de wet][ref11], en de daar bedoelde premie is kleiner of gelijk aan:

      1°. USD 1.400 per jaar indien het een periodieke premie betreft; of

      2°. USD 2.800 indien het een eenmalige premie betreft;

      b. [artikel 1, onderdeel b, onder 6°, van de wet][ref12], en de daar bedoelde uitkering is kleiner of gelijk aan
      USD 11.000.

      4 Een dienstverlener verzamelt voldoende gegevens om te kunnen vaststellen of het tweede lid op een cliënt van
      toepassing is.


