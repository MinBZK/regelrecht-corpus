  - number: '14'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

        - *back-to-back lening:* kredietinstrument waarbij de kredietnemer geld of financiële instrumenten ter beschikking
      krijgt, waartegenover de kredietverstrekker een zekerheid ontvangt, direct of indirect, uit eigen liquide middelen
      van de kredietnemer;
        - *incident:* gedraging of gebeurtenis die een ernstig gevaar vormt voor de integere uitoefening van het bedrijf
      van de desbetreffende instelling;
        - *integriteitgevoelige functie:* a. functies van leidinggevende functionarissen die ressorteren onder de door de
      toezichtautoriteit op betrouwbaarheid getoetste beleidsbepalers en medebeleidsbepalers in de eerste echelon van de
      onder toezicht staande financiële onderneming; b. functies waaraan een bevoegdheid is verbonden die een wezenlijk
      risico bevat voor de integere uitoefening van het bedrijf van de financiële onderneming;
        - *integriteitsrisico:* gevaar voor aantasting van de reputatie of bestaande of toekomstige bedreiging van vermogen
      of resultaat van een instelling als gevolg van een ontoereikende naleving van hetgeen bij of krachtens enig
      wettelijk voorschrift is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel14
  - number: '15'
    text: |-
      1 Een instelling draagt zorg voor een integriteitsbewuste bedrijfscultuur, geïntegreerd in de bedrijfsvoering
      en gebaseerd op een systematische analyse van integriteitsrisico's. Zij legt haar intenties ter zake vast in een
      openbare verklaring.

      2 Een instelling legt schriftelijk haar beleid vast met betrekking tot het bepaalde in het eerste lid,
      eerste volzin, en informeert haar cliënten over de doelstellingen van de in deze paragraaf gestelde
      regels, de [Sanctiewet 1977][ref1] en de met betrekking tot het financieel verkeer op grond van die
      wet gestelde regels, en de bij of krachtens de [Wet identificatie bij dienstverlening BES][ref2] en de
      [Wet melding ongebruikelijke transacties BES][ref3] gestelde regels.

      3 Een instelling wijst ten minste één functionaris op managementniveau aan die op onafhankelijke en effectieve
      wijze de naleving controleert van op grond van wettelijke voorschriften op die instelling rustende verplichtingen
      met betrekking tot de integere uitoefening van het bedrijf en van interne regels ter zake die de instelling zelf
      heeft opgesteld alsmede van de regels bedoeld in het tweede lid. De functionaris kan binnen korte tijd beschikken
      over transactiegegevens, alsmede over gegevens die de instelling heeft vastgelegd ingevolge de hoofdstukken
      3, 4 en 5 of de [Wet identificatie bij dienstverlening BES][ref4] en andere voor zijn taak relevante gegevens.
      Een instelling beschikt over procedures die erin voorzien dat gesignaleerde tekortkomingen of gebreken worden
      gerapporteerd aan de functionaris. Een instelling beoordeelt periodiek de interne controlesystemen op hun
      effectiviteit en actualiteitswaarde en stelt deze zo nodig bij.

      4 Een instelling waarborgt dat kennis die wordt opgedaan bij de uitvoering van het derde lid en de resultaten van
      maatregelen genomen naar aanleiding van de controle bedoeld in dat lid binnen haar organisatie beschikbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0028490
      [ref3]: https://wetten.overheid.nl/BWBR0028598
      [ref4]: https://wetten.overheid.nl/BWBR0028490
