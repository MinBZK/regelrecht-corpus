  - number: '8'
    text: |-
      Een verklaring van geen bezwaar als bedoeld in
      [artikel 46, eerste lid, van de Wet toezicht bank- en kredietwezen 1994 BES][ref1] of
      [artikel 81, eerste lid, van de Wet toezicht verzekeringsbedrijf BES][ref2] wordt verleend tenzij de
      betrouwbaarheid van de aanvrager niet buiten twijfel staat. De [artikelen 3, tweede lid, tot en met 7][ref3] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0028495#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0028608#Artikel3
