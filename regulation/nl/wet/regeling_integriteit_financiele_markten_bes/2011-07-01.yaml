  - number: '9'
    text: |-
      1 Een bestuurder van een trustkantoor, zijnde een natuurlijke persoon, beschikt naar het oordeel van de
      toezichtautoriteit over voldoende relevante kennis en ervaring voor de bedrijfsvoering van het trustkantoor.

      2 Een beleidsbepaler, zijnde een natuurlijke persoon, niet zijnde een bestuurder, van een trustkantoor beschikt
      naar het oordeel van de toezichtautoriteit over voldoende relevante kennis en ervaring voor het bepalen of mede
      bepalen van het beleid van het trustkantoor.

      3 Indien een bestuurder van een trustkantoor of een beleidsbepaler, niet zijnde een bestuurder, van
      een trustkantoor een rechtspersoon is, beschikt iedere natuurlijke persoon die de rechtspersoon in deze
      vertegenwoordigt naar het oordeel van de toezichtautoriteit over voldoende relevante kennis en ervaring voor de
      bedrijfsvoering van het trustkantoor onderscheidenlijk voor het bepalen of mede bepalen van het beleid van het
      trustkantoor.

      4 Indien aanwezig, beschikt de Raad van Commissarissen van een trustkantoor bestaande uit natuurlijke personen, als
      geheel naar het oordeel van de toezichtautoriteit over voldoende relevante kennis en ervaring voor het toezicht op
      de bedrijfsvoering van het trustkantoor.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel9
  - number: '10'
    text: |-
      1 Het dagelijks beleid van een trustkantoor wordt te allen tijde bepaald door minstens één bestuurder, zijnde een
      natuurlijke persoon die woonachtig is in de openbare lichamen, in Curaçao of in Sint Maarten.

      2 De benoeming van een persoon als bedoeld in [artikel 9][ref1] vindt niet plaats dan na voorafgaand
      schriftelijk verzoek aan en schriftelijke goedkeuring door de toezichtautoriteit. De toezichtautoriteit kan
      de goedkeuring onthouden indien de betrouwbaarheid van de desbetreffende persoon niet buiten twijfel staat. De
      [artikelen 4 tot en met 7][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028608#Artikel4
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel10
