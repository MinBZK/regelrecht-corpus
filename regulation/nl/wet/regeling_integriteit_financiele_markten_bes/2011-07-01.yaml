articles:
  - number: '1'
    text: |-
      In deze regeling wordt, tenzij anders bepaald, verstaan onder:

        - *instelling:* 1°. een administrateur; 2°. een assurantiebemiddelaar; 3°. een beleggingsinstelling; 4°. een
      geldtransactiekantoor; 5°. een kredietinstelling; 6°. een trustkantoor; 7°. een verzekeraar;
        - *openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba; *toezichtsautoriteit:*
        - a. de Bank voor zover deze regeling strekt tot uitvoering van bepalingen van de
      [Wet toezicht bank- en kredietwezen 1994 BES][ref1], de [Wet toezicht trustwezen BES][ref2] of de
      [Wet toezicht verzekeringsbedrijf BES][ref3]; b. de Autoriteit Financiële Markten voor zover deze
      regeling strekt tot uitvoering van bepalingen van de [Wet assurantiebemiddelingsbedrijf BES][ref4]
      of de [Wet toezicht beleggingsinstellingen en administrateurs BES][ref5]; c. een ingevolge
      [artikel 8a, eerste lid, van de Wet identificatie bij financiële dienstverlening BES][ref6] aangewezen persoon
      voor zover deze regeling strekt tot uitvoering van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
