  - number: '13'
    text: |-
      1 Het dagelijkse beleid van een op de [bijlage A][ref1] bij de vergunning van een trustkantoor geplaatste persoon
      wordt te allen tijde bepaald door minstens één natuurlijke persoon die woonachtig is in de openbare lichamen, in
      Curaçao of in Sint Maarten.

      2 De benoeming van een in het eerste lid bedoelde natuurlijke persoon, en van iedere natuurlijke persoon die
      het beleid van een op de [bijlage A][ref2] bij de vergunning van een trustkantoor geplaatste persoon bepaalt of
      medebepaalt, en indien aanwezig de leden van de Raad van Commissarissen van die persoon, vindt niet plaats dan na
      een voorafgaand schriftelijk verzoek aan en een schriftelijke goedkeuring door de toezichtautoriteit.

      3 De toezichtautoriteit kan indien noodzakelijk met het oog op de activiteiten van een trustkantoor en de
      deskundigheid van de beleidsbepalers en medebeleidsbepalers van een trustkantoor in afwijking van het eerste
      lid bepalen dat het dagelijkse beleid van het trustkantoor wordt bepaald door een groter aantal personen. Het
      trustkantoor geeft daaraan gevolg binnen de door de toezichtautoriteit gestelde termijn.

      4 Het derde lid is van overeenkomstige toepassing op een op de [bijlage A][ref3] bij de vergunning van een
      trustkantoor geplaatste persoon.

      5 Indien dagelijkse beleid van een trustkantoor onderscheidenlijk een op de [bijlage A][ref4] bij de vergunning
      van een trustkantoor geplaatste persoon niet meer wordt bepaald door ten minste het ingevolge het eerste lid en
      [artikel 10][ref5] voorgeschreven aantal personen, dan dient dit direct schriftelijk door het trustkantoor aan
      de Bank te worden gemeld. Daarbij wordt aangegeven de termijn waarbinnen het trustkantoor respectievelijk de
      desbetreffende persoon weer zal voldoen aan het door de Bank gestelde aantal.

      6 Bij het verblijf buiten de openbare lichamen, Curaçao en Sint Maarten van alle bestuurders van een trustkantoor
      met zetel in de openbare lichamen of de personen belast met het dagelijkse beleid van een op de [bijlage A][ref6]
      bij de vergunning van een trustkantoor geplaatste persoon met zetel in de openbare lichamen, dient een in
      de openbare lichamen, Curaçao of Sint Maarten gevestigde natuurlijke persoon vooraf aan dat verblijf in het
      trustkantoor te zijn aangesteld, als de persoon die zo nodig door de toezichthouder als aanspreekpersoon aangemerkt
      moet worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028608
      [ref2]: https://wetten.overheid.nl/BWBR0028608
