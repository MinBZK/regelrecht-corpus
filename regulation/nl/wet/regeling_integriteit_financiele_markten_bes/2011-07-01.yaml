        artikel: '17'
        paragraaf: '3'
  - number: '19'
    text: |-
      1 Een instelling beschikt met het oog op een integere uitoefening van het bedrijf over procedures en maatregelen
      met betrekking tot de acceptatie van cliënten.

      2 De toezichtautoriteit kan met het oog op een integere uitoefening van het bedrijf regels stellen met betrekking
      tot het door kredietinstellingen te voeren beleid met betrekking tot afgeschermde rekeningen en rekeningen waarop
      waarden worden aangehouden ten behoeve van derden.

      3 De toezichtautoriteit kan voorts regels stellen met het oog op het voorkomen van misbruik van technische
      toepassingen voor witwassen of financiering van terrorisme.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel19
  - number: '20'
    text: |-
      1 Een kredietinstelling beschikt over procedures met betrekking tot de verstrekking van back-to-back leningen.

      2 Indien de kredietinstelling voornemens is een back-to-back lening te verstrekken, onderzoekt zij of het krediet
      voor legitieme doeleinden gebruikt zal worden.

      3 Indien er een back-to-back lening wordt verstrekt, legt de kredietinstelling de overeenkomst met vermelding van
      de gestelde essentiële zekerheden, deugdelijk vast.

      4 Dit artikel is niet van toepassing op een kredietinstelling met zetel buiten de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel20
  - number: '21'
    text: |-
      1 Een instelling beschikt over procedures en maatregelen die waarborgen dat zij, in geval van verzoek van de
      toezichtautoriteit, onderzoekt of in haar administratie bepaalde personen of instellingen voorkomen die in verband
      met vermoede terroristische activiteiten of daarmee verband houdende activiteiten, de integriteit van de financiële
      sector kunnen schaden.

      2 De in het eerste lid bedoelde procedures en maatregelen waarborgen voorts dat de instelling de uitkomst van het
      in het eerste lid bedoelde onderzoek verstrekt aan de toezichtautoriteit binnen een door de toezichtautoriteit te
      stellen termijn.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel21
  - number: '22'
    text: |-
      1 Een instelling waarborgt dat zij procedures en maatregelen heeft getroffen ter naleving van:

      a. de [Sanctiewet 1977][ref1] en de met betrekking tot het financieel verkeer op grond van die wet gestelde regels;

      b. de bij of krachtens de [Wet identificatie bij dienstverlening BES][ref2] en de
      [Wet melding ongebruikelijke transacties BES][ref3] gestelde regels.

      2 De maatregelen als bedoeld in het eerste lid, onderdeel a, zien ten minste op een adequate controle van de
      administratie van de instelling op het overeenkomen van de identiteit van een relatie met een (rechts)persoon of
      entiteit, als bedoeld in de Sanctieregelgeving, met het oog op het bevriezen van de financiële middelen van die
      relatie of het voorkomen van het ter beschikking stellen van financiële middelen of diensten aan die relatie.

      3 Voor de toepassing van het tweede lid wordt verstaan onder relatie: een ieder die betrokken is bij een financiële
      dienst of een financiële transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0028490
      [ref3]: https://wetten.overheid.nl/BWBR0028598
