  - number: '11'
    text: |-
      Een trustkantoor beschikt voor haar activiteiten, met inbegrip van de beheersdiensten die onder haar
      verantwoordelijkheid worden verleend door personen geplaatst op de [bijlagen A][ref1] en [B][ref2] bij haar
      vergunning, over voldoende expertise om te kunnen voldoen aan het bepaalde ingevolge de [artikelen 12][ref3] en
      [13 van de Wet toezicht trustwezen BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028608
      [ref2]: https://wetten.overheid.nl/BWBR0028608
      [ref3]: https://wetten.overheid.nl/BWBR0028368#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0028368#Artikel13
