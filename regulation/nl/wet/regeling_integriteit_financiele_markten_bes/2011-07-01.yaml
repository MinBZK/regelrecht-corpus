  - number: '7'
    text: |-
      De toezichtautoriteit neemt bij de vaststelling, bedoeld in [artikel 4][ref1], in aanmerking:

      a. het onderlinge verband tussen de aan een antecedent ten grondslag liggende gedraging of gedragingen en de
      overige omstandigheden van het geval;

      b. de belangen die de [Wet toezicht bank- en kredietwezen 1994 BES][ref2], de [Wet toezicht trustwezen BES][ref3],
      de [Wet toezicht verzekeringsbedrijf BES][ref4], de [Wet assurantiebemiddelingsbedrijf BES][ref5] en de
      [Wet toezicht beleggingsinstellingen en administrateurs BES][ref6] beogen te beschermen; en

      c. de overige belangen van de instelling of verzekeraar en de betrokkene.


