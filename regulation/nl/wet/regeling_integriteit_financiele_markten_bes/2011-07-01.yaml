  - number: '23'
    text: |-
      1 Een trustkantoor draagt zorg voor een deugdelijke administratie, en waarborgt dat zij maatregelen heeft
      getroffen om de rechten, met betrekking tot gelden of geldswaarden, van ondernemingen waaraan door het trustkantoor
      beheersdiensten zullen worden verleend en van derden te beschermen. De maatregelen strekken in elk geval tot
      een volledige scheiding tussen de vermogensbestanddelen van elk van die ondernemingen, iedere derde en van
      het trustkantoor en de rechtspersonen die ingevolge [artikel 6 van de Wet toezicht trustwezen BES][ref1] op
      [bijlage A][ref2] van haar vergunning zijn geplaatst.

      2 Een trustkantoor houdt op haar kantoor op een overzichtelijke wijze ten minste voor de Bank beschikbaar:

      a. de schriftelijke overeenkomsten tussen het trustkantoor en haar cliënten en andere overeenkomsten die het
      trustkantoor heeft gesloten terzake van de door het trustkantoor geleverde diensten;

      b. de in [bijlage B][ref3] bedoelde bescheiden en gegevens.

      3 Een trustkantoor informeert de Bank over voorgenomen wezenlijke wijzigingen in aspecten van haar bedrijfsvoering
      met betrekking tot welke in het eerste of tweede lid of in de [artikelen 15 tot en met 22][ref4] eisen zijn
      gesteld, alsmede over wijzigingen in de antecedenten van de personen die het beleid van het trustkantoor bepalen
      of medebepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028608
      [ref3]: https://wetten.overheid.nl/BWBR0028608
      [ref4]: https://wetten.overheid.nl/BWBR0028608#Artikel15
