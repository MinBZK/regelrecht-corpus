  - number: '47'
    text: |-
      1 Onverminderd het bepaalde bij of krachtens de [artikelen 2, tweede lid][ref1], en [3, derde lid, van de wet][ref2]
      waarborgt een dienstverlener die een zakelijke relatie met een cliënt is aangegaan, dat zij de gegevens van die
      cliënt die zij heeft vastgelegd ingevolge [artikel 6, onderdelen a en b, van de wet][ref3] voortdurend controleert
      en waar nodig aanpast zodat deze blijven overeenstemmen met de werkelijkheid.

      2 Een dienstverlener als bedoeld in het eerste lid beschikt over procedures en maatregelen met betrekking tot
      de analyse van gegevens van cliënten, mede in relatie tot de aan de cliënt verleende diensten, en ter zake van
      de detectie van afwijkende transactiepatronen. Aan de hand van voornoemde procedures en maatregelen bepaalt de
      dienstverlener tevens de risico’s van bepaalde cliënten of diensten.

      3 De dienstverlener draagt zorg voor de documentatie en vastlegging met betrekking tot de bewaking van het handelen
      van cliënten, en van de gegevens omtrent het onderzoek naar de herkomst van het vermogen van een cliënt. Dergelijke
      gegevens worden tot vijf jaar na de dienstverlening of het beëindigen van de relatie bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0028490#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028490#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028490#Artikel6
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel47
