      Het Meldpunt verstrekt aan De Nederlandsche Bank N.V. gegevens betreffende meldingen inzake transacties waarbij
      als wederpartij optreedt, dan wel op andere wijze betrokken is, een natuurlijke persoon, rechtspersoon, groep of
      entiteit die is vermeld op een van de lijsten, bedoeld in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel54
