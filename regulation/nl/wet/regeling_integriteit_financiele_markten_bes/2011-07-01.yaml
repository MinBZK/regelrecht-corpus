        artikel: '6'
  - number: '48'
    text: |-
      1 Een trustkantoor beschikt over gegevens aan de hand waarvan is bepaald wie als uiteindelijk belanghebbende
      kwalificeert en aan de hand waarvan de identiteit van de uiteindelijk belanghebbende is vastgesteld, alsmede over
      gegevens waaruit de eigendoms- en zeggenschapsstructuur van de cliënt blijkt.

      2 Indien een cliënt geen uiteindelijk belanghebbende heeft, beschikt het trustkantoor over gegevens aan de hand
      waarvan dit is bepaald.

      3 Een trustkantoor verleent geen dienst voordat aan het eerste of tweede lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel48
  - number: '49'
    text: |-
      1 Indien een trustkantoor optreedt als trustee van een trust, kent het trustkantoor de identiteit van de insteller
      van de trust en van de uiteindelijk belanghebbende bij de trust en beschikt het trustkantoor over gegevens aan
      de hand waarvan is bepaald wie de insteller is en welke natuurlijke persoon als uiteindelijk belanghebbende
      kwalificeert. Ook beschikt het trustkantoor over gegevens aan de hand waarvan de identiteit van de insteller en van
      de uiteindelijk belanghebbende is vastgesteld.

      2 Indien er geen uiteindelijk belanghebbende is, beschikt het trustkantoor over gegevens aan de hand waarvan dit
      is bepaald.

      3 Het trustkantoor heeft bij het verlenen van de in het eerste lid genoemde dienst kennis van de herkomst van het
      vermogen van de insteller van de trust en legt de gegevens omtrent het onderzoek naar de herkomst van het vermogen
      vast.
    url: https://wetten.overheid.nl/BWBR0028608/2011-07-01#Artikel49
  - number: '50'
    text: |-
      Een trustkantoor bewaart de gegevens bedoeld in de [artikelen 48][ref1] en [49][ref2] op toegankelijke wijze
      gedurende ten minste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028608#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0028608#Artikel49
