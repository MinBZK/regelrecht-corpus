  - number: '53'
    text: |-
      1 Een verzoek tot verstrekking van gegevens op grond van
      [artikel 2:13, tweede lid, onderdeel b of c, van het Besluit politiegegevens][ref1] wordt gericht aan de officier
      van justitie die door de Minister van Justitie is aangewezen als Landelijk officier van justitie inzake MOT-
      aangelegenheden.

      2 De Landelijk officier van justitie inzake MOT-aangelegenheden bepaalt de wijze waarop een verzoek als bedoeld in
      het eerste lid wordt ingediend.

      3 De Landelijk officier van justitie inzake MOT-aangelegenheden geleidt een verzoek als bedoeld in het eerste lid
      door naar het Meldpunt tenzij naar zijn oordeel

      a. het verzoek niet voldoet aan de op grond van het tweede lid gestelde voorschriften; of

      b. in geval van een verzoek op grond van
      [artikel 2:13, tweede lid, onderdeel c, van het Besluit politiegegevens][ref2] niet is voldaan aan de eisen gesteld
      in dat onderdeel.

      4 Het Meldpunt verstrekt gegevens op grond van
      [artikel 2:13, tweede lid, onderdeel b of c, van het Besluit politiegegevens][ref3] niet voor zover naar het
      oordeel van de Landelijk officier van justitie inzake MOT-aangelegenheden belangen inzake de opsporing zich
      daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel213
