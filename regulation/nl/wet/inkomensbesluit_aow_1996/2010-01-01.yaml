  - number: '7'
    text: |-
      1 Voor de toepassing van [artikel 8, eerste lid][ref1], [artikel 10, eerste en tweede lid][ref2], en
      [artikel 11 van de wet][ref3] wordt onder inkomen in verband met arbeid in het bedrijfs- of beroepsleven verstaan:

      a. een loondervingsuitkering alsmede uitkeringen die naar aard en strekking daarmee overeenkomen, met uitzondering
      van de uitkeringen die op grond van [artikel 3, derde lid][ref4], en [artikel 4, vierde lid][ref5], als opbrengst
      van arbeid worden beschouwd;

      b. een uitkering op grond van een particuliere verzekering wegens derving van inkomen, die ten behoeve van de
      werknemer in het kader van een individuele of collectieve arbeidsovereenkomst is afgesloten;

      c. een uitkering op grond van een pensioenregeling, voorzover niet begrepen onder a;

      d. een uitkering op grond van een regeling voor vervroegde uittreding of een regeling, die naar aard en strekking
      daarmee overeenkomt;

      e. een uitkering op grond van een regeling voor functioneel leeftijdsontslag of op grond van de
      [Uitkeringswet gewezen militairen][ref6];

      f. loon dat uit vroegere dienstbetrekking wordt genoten, voorzover niet begrepen onder a, b, c, d, e, j en k;

      g. een basisbeurs en een aanvullende beurs op grond van de [Wet studiefinanciering 2000][ref7] alsmede een beurs,
      die naar aard en strekking daarmee overeenkomt;

      h. een bedrijfsbeëindigingsvergoeding van de door Onze Minister van Economische Zaken opgerichte Stichting
      ontwikkeling en sanering midden- en kleinbedrijf;

      i. een maandelijkse bedrijfsbeëindigingsvergoeding van de door Onze Minister van Landbouw, Natuurbeheer en Visserij
      opgerichte Stichting ontwikkelings- en saneringsfonds voor de Landbouw;

      j. een uitkering ingevolge de wetgeving van de Nederlandse Antillen, Aruba, een volkenrechtelijke
      organisatie of een of meer andere Mogendheden, die naar aard en strekking overeenkomt met een
      uitkering als bedoeld in dit lid, voorzover niet al begrepen onder a, of met een nabestaandenuitkering,
      met uitzondering van een uitkering, die naar aard en strekking overeenkomt met een uitkering op
      grond van de [Algemene Kinderbijslagwet][ref8] of met zorg waarop aanspraak bestaat ingevolge een
      zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref9] of op grond van
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref10];

      k. het bedrag van de uitkering bedoeld in onderdeel j, waarop recht bestaat, maar die niet wordt uitbetaald, omdat
      onder de toepasselijke wetgeving gebruik is gemaakt van het daarin voorziene recht af te zien van het recht op die
      uitkering of de uitbetaling daarvan;

      l. een uitkering op grond van de [Algemene nabestaandenwet][ref11].

      2 In afwijking van het eerste lid, wordt niet als inkomen in verband met arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen te ontvangen, voor zover
      deze niet worden gedekt door stortingen van degene die het desbetreffende inkomen geniet;

      b. een eenmalige uitkering die na beëindiging van de dienstbetrekking aan een werknemer in verband met die
      beëindiging wordt betaald;

      c. het bedrag waarmee de arbeidsongeschiktheidsuitkering is verhoogd met toepassing
      van [artikel 22 van de Wet op de arbeidsongeschiktheidsverzekering][ref12], de
      [artikelen 53][ref13] of [63 van de Wet werk en inkomen naar arbeidsvermogen][ref14],
      [artikel 10 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref15], [artikel 2:51][ref16] of
      [3:9 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref17] of een combinatie van deze artikelen;

      d. vakantie-uitkering, over de in het eerste lid genoemde inkomensbestanddelen;

      e. een vakantie-bon, verstrekt naast een loondervingsuitkering, voor zover niet begrepen onder d;

      f. een uitkering die naar aard en strekking overeenkomt met een loondervingsuitkering, toegekend aan een directeur-
      grootaandeelhouder, die niet als werknemer in de zin van de [Wet financiering sociale verzekeringen][ref18] wordt
      beschouwd;

      g. periodieke uitkeringen uit hoofde van een stamrecht, dat is verkregen uit een eenmalige uitkering welke na
      beëindiging van de dienstbetrekking aan de werknemer in verband met die beëindiging is toegekend, mits de werknemer
      aantoont dat de eenmalige uitkering door de werkgever betaalbaar is gesteld om naar eigen inzicht van de werknemer
      te besteden.

      3 Voor de toepassing van het eerste lid, onderdeel c, wordt onder pensioenregeling verstaan hetgeen daaronder wordt
      verstaan voor de toepassing van de [Wet op de loonbelasting 1964][ref19].

      4 Voorzover over een inkomen als genoemd in het eerste lid, geen aanspraak op vakantieuitkering bestaat, wordt dit
      inkomen slechts voor een deel in aanmerking genomen. De laatste volzin van [artikel 5, derde lid][ref20] is voor
      het vaststellen van dit deel van overeenkomstige toepassing.

      5 Indien een uitkering als bedoeld in het eerste lid, gekort of geweigerd is op grond van een bestuurlijke boete
      of maatregel, wordt voor de toepassing van dit besluit als inkomen beschouwd de uitkering zonder deze korting of
      weigering.


