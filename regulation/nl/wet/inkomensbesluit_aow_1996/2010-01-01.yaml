  - number: '2'
    text: |-
      Voor de toepassing van [artikel 8, eerste lid][ref1], [artikel 10, eerste en tweede lid][ref2], en
      [artikel 11 van de wet][ref3] wordt onder inkomen uit arbeid in het bedrijfs- en beroepsleven verstaan:

      a. opbrengst van arbeid;

      b. winst uit bedrijf en zelfstandig uitgeoefend beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel11
