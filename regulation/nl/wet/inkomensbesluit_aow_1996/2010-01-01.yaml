articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            a
            de wet:

              de [Algemene Ouderdomswet][ref1];



            b
            een loondervingsuitkering:

              een uitkering krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref2],
      de [Ziektewet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4], de
      [Wet werk en inkomen naar arbeidsvermogen][ref5] alsmede een uitkering of inkomensvoorziening
      op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref7], de [Wet inkomensvoorziening oudere werklozen][ref8]
      en de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9], alsmede een uitkering op grond van
      [hoofdstuk 3][ref10], [afdeling 2, van de Wet arbeid en zorg][ref11] met uitzondering van een uitkering aan de
      werknemer of gelijkgestelde, bedoeld in [artikel 3:6, tweede lid, van die wet][ref12];



            c
            een stamrecht:

              een recht op periodieke uitkeringen ter vervanging van gederfd of te derven loon.


