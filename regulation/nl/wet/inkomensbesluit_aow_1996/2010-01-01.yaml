  - number: '5'
    text: |-
      1 Onder opbrengst van arbeid, bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover deze arbeid niet in
      dienstbetrekking wordt verricht, verstaan het belastbaar loon uit tegenwoordige arbeid of belastbaar resultaat uit
      overige werkzaamheden, bedoeld in [hoofdstuk 3][ref2] en [7 van de Wet inkomstenbelasting 2001][ref3], behoudens
      voorzover het een werkzaamheid betreft als bedoeld in de [artikelen 3.91, eerste lid, onderdelen a en b][ref4],
      en [3.92 van die wet][ref5].

      2 Het bij of krachtens [artikel 13 van de Wet op de loonbelasting 1964][ref6] bepaalde is met betrekking tot het
      eerste lid van overeenkomstige toepassing.

      3 Voorzover over de opbrengst van arbeid, zoals vastgesteld op grond van het eerste en tweede lid, geen
      aanspraak op vakantie-uitkering bestaat, wordt van dit inkomen slechts een deel in aanmerking genomen. Dit
      deel is gelijk aan het quotiënt van 100 en de som van 100 en het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet Minimumloon en minimumvakantiebijslag][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0008136#Artikel2
