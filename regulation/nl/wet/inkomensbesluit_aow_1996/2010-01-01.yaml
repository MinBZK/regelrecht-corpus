  - number: '6'
    text: |-
      1 Onder winst als bedoeld in [artikel 2, onderdeel b][ref1], wordt verstaan de belastbare winst uit
      onderneming, bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref2], vermeerderd met de
      ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref3], en de MKB-winstvrijstelling, bedoeld
      in [paragraaf 3.2.5 van die wet][ref4], met dien verstande dat de bestanddelen van de winst, bedoeld in
      [artikel 3.78, derde lid, onderdelen a, b en c, van die wet][ref5], niet geacht worden te behoren tot die winst.

      2 Indien de berekening van de in het eerste lid bedoelde winst leidt tot een negatief bedrag, wordt die winst op
      nihil gesteld.

      3 Van de winst uit bedrijf en zelfstandig uitgeoefend beroep, zoals vastgesteld op grond van het eerste en tweede
      lid, wordt slechts een deel in aanmerking genomen. De laatste volzin van [artikel 5, derde lid][ref6], is voor het
      vaststellen van dit deel van overeenkomstige toepassing.

      4 Indien de pensioengerechtigde en zijn echtgenoot samenwerken in de uitoefening van een bedrijf of in de
      zelfstandige uitoefening van een beroep en de echtgenoot dan wel de pensioengerechtigde geen vergoeding ontvangt
      ter zake van de in de onderneming verrichte arbeid, wordt ter vaststelling van het deel van de met inachtneming van
      het bepaalde in het eerste lid berekende winst, dat de echtgenoot toekomt, de winst vermenigvuldigd met de factor
      a/b, waarbij:

      a. het loon voorstelt van de werknemer, die in dienstbetrekking een gelijkwaardige functie uitoefent als de
      echtgenoot en

      b. de som voorstelt van het onder a bedoelde loon en het loon van de werknemer die in dienstbetrekking een
      gelijkwaardige functie uitoefent als de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0008136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.4
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Paragraaf3.2.5
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel3.78
