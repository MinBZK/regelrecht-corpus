  - number: '4'
    text: |-
      1 Onder opbrengst van arbeid, bedoeld in [artikel 2, onderdeel a][ref1], wordt, voor zover
      deze arbeid in dienstbetrekking wordt verricht doch niet door een werknemer in de zin van de
      [Wet financiering sociale verzekeringen][ref2], verstaan de gelden en alle andere voordelen die als beloning voor
      die arbeid worden genoten.

      2 Ten aanzien van de gelden en alle andere voordelen uit de dienstbetrekking, bedoeld in het eerste lid, is het
      bepaalde bij [artikel 16 van de Wet financiering sociale verzekeringen][ref3] van overeenkomstige toepassing.

      3 In afwijking van het tweede lid wordt niet als opbrengst van arbeid beschouwd:

      a. een uitkering, die naar aard en strekking met een loondervingsuitkering overeenkomt;

      b. een aanvulling daarop;

      c. vakantie-uitkering.

      4 In afwijking van het derde lid, onderdelen a en b, worden voor zolang de dienstbetrekking voortduurt, uitkeringen
      terzake van werkloosheid alsmede aanvullingen daarop als opbrengst van arbeid beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel16
