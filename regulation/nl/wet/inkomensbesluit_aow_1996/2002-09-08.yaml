  - number: 5a
    text: |-
      Onder opbrengst van arbeid wordt tevens verstaan een financiële tegemoetkoming op grond van
      [hoofdstuk 7 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0008136/2002-09-08#Artikel5a
    references:
