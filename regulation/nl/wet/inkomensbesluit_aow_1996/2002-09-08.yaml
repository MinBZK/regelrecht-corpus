articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            a
            de wet:

              de [Algemene Ouderdomswet][ref1];



            b
            een loondervingsuitkering:

              een uitkering krachtens de verplichte verzekering op grond van de [Werkloosheidswet][ref2],
      de [Ziektewet][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4] alsmede een
      uitkering op grond van de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6] en de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], alsmede een uitkering op grond van [hoofdstuk 3][ref8],
      [afdeling 2, van de Wet arbeid en zorg][ref9] met uitzondering van een uitkering aan de werknemer of
      gelijkgestelde, bedoeld in [artikel 3:6, tweede lid, van die wet][ref10].


