  - number: '9'
    text: |-
      1 De noodzakelijke omrekening van het in een buitenlandse munteenheid uitgedrukte inkomen uit of in verband
      met arbeid in de Nederlandse munteenheid geschiedt voor zover het een inkomen betreft dat is uitgedrukt in de
      munteenheid van een lid-staat van de Europese Gemeenschap volgens de op basis van artikel 107 van [verordening
      (EEG) nr. 574/72](31972R0574) van de Raad van de Europese Gemeenschappen van 21 maart 1972 (Pb EG L74)
      tot vaststelling van de wijze van toepassing van [verordening (EEG) nr. 1408/71](31971R1408) vastgestelde
      kwartaalkoersen, en voor zover het een inkomen betreft dat niet is uitgedrukt in de munteenheid van een lid-staat
      met behulp van de door De Nederlandsche Bank NV geadviseerde wisselkoersen.

      2 Een wijziging van de in het eerste lid bedoelde koers beïnvloedt het op grond van [artikel 8][ref1] vastgestelde
      inkomen niet, met dien verstande dat:

      1e bij wijziging van het inkomen uit of in verband met arbeid, anders dan ten gevolge van de koersmutaties, een
      omrekening plaatsvindt; en 2e tenminste eens per jaar een omrekening plaatsvindt.


