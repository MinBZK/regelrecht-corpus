        artikel: '11'
  - number: '3'
    text: |-
      1 Onder opbrengst van arbeid, bedoeld in [artikel 2, onderdeel a][ref1], wordt, voorzover deze arbeid in
      dienstbetrekking als bedoeld in [artikel 3a, eerste lid, van de Coördinatiewet Sociale Verzekering][ref2] wordt
      verricht, verstaan het loon in de zin van die wet.

      2 In afwijking van het eerste lid wordt niet als opbrengst van arbeid beschouwd:

      a. een aanspraak om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of verstrekkingen te
      ontvangen, voor zover deze niet wordt gedekt door stortingen van de werknemer;

      b. een loondervingsuitkering;

      c. een aanvulling op een loondervingsuitkering;

      d. vakantie-uitkering.

      3 In afwijking van het tweede lid, onderdelen b en c, worden voor zolang de dienstbetrekking
      voortduurt, uitkeringen op grond van de verplichte verzekering van de [Ziektewet][ref3], op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref4] aan de werknemer of gelijkgestelde,
      bedoeld in [artikel 3:6, eerste lid, van die wet][ref5] en op grond van de verplichte verzekering van de
      [Werkloosheidswet][ref6], alsmede aanvullingen op die uitkeringen als opbrengst van arbeid beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008136#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002126#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0004045
