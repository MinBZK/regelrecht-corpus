---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_trustkantoren
regulatory_layer: WET
publication_date: '2018-11-29'
valid_from: '2013-01-01'
bwb_id: BWBR0016189
url: https://wetten.overheid.nl/BWBR0016189/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, ter bevordering van de integriteit van het financiële stelsel in
    Nederland, wenselijk is trustkantoren onder toezicht te plaatsen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      trustkantoor: een rechtspersoon, vennootschap of natuurlijke persoon die, al dan niet tezamen met andere
      rechtspersonen, vennootschappen of natuurlijke personen, beroeps- of bedrijfsmatig een of meer van de in onderdeel
      d genoemde diensten verleent;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.b
    text: |-
      doelvennootschap: een rechtspersoon of vennootschap waaraan de in onderdeel d, onder 1° en 2°, genoemde diensten
      worden verleend;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c
    text: 'uiteindelijk belanghebbende: de natuurlijke persoon die'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c.1°
    text: een belang houdt van 25 procent of meer van het kapitaalbelang van een doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c.2°
    text: 25 procent of meer van de stemrechten van de algemene vergadering van een doelvennootschap kan uitoefenen;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c.3°
    text: feitelijk zeggenschap kan uitoefenen in een doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c.4°
    text: begunstigde van 25 procent of meer van het vermogen van een doelvennootschap is; of
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.c.5°
    text: een bijzondere zeggenschap heeft over 25 procent of meer van het vermogen van een doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d
    text: 'dienst:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.1°
    text: |-
      het zijn van bestuurder of vennoot van een rechtspersoon of vennootschap in opdracht van een, niet tot dezelfde
      groep als waarvan het trustkantoor deel uitmaakt behorende rechtspersoon, vennootschap of natuurlijke persoon;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.2°
    text: |-
      het in opdracht van een niet tot dezelfde groep als waarvan het trustkantoor deel uitmaakt
      behorende rechtspersoon, vennootschap of natuurlijke persoon, ter beschikking stellen van
      het adres of het postadres, bedoeld in de [artikelen 11, eerste lid, onderdeel c][ref1], en
      [14, eerste lid, onderdeel c, van de Handelsregisterwet 2007][ref2], aan een andere rechtspersoon of vennootschap,
      indien ten minste een van de volgende bijkomende werkzaamheden wordt verricht ten behoeve van die rechtspersoon
      of vennootschap of ten behoeve van een, tot dezelfde groep behorende, andere rechtspersoon, vennootschap of
      natuurlijke persoon:


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel14
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '14'
  - number: 1.d.2°.i)
    text: |-
      het op privaatrechtelijk gebied geven van advies of het verlenen van bijstand, met uitzondering van het verrichten
      van receptiewerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.2°.ii)
    text: |-
      het verstrekken van belastingadvies of het verzorgen van belastingaangiften en daarmee verband houdende
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.2°.iii)
    text: |-
      het verrichten van werkzaamheden in verband met het opstellen, beoordelen of controleren van de jaarrekening of het
      voeren van administraties;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.2°.iv)
    text: het werven van een bestuurder voor een rechtspersoon of vennootschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.2°.v)
    text: andere bij algemene maatregel van bestuur aan te wijzen bijkomende werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.3°
    text: het verkopen van of bemiddelen bij de verkoop van rechtspersonen;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.4°
    text: |-
      het zijn van een trustee in de zin van het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de
      erkenning van trusts in opdracht van een, niet tot dezelfde groep als waarvan het trustkantoor deel uitmaakt
      behorende rechtspersoon, vennootschap of natuurlijke persoon; of
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.5°
    text: |-
      het ten behoeve van de cliënt gebruik maken van een vennootschap, die tot dezelfde groep behoort als waarvan het
      trustkantoor deel uit maakt;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.d.6°
    text: andere bij algemene maatregel van bestuur aan te wijzen diensten;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.e
    text: 'bijkantoor: een of meer onderdelen zonder rechtspersoonlijkheid van een trustkantoor;'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.f
    text: |-
      groep: een economische eenheid waarin rechtspersonen, vennootschappen en natuurlijke personen organisatorisch zijn
      verbonden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.g
    text: |-
      gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste tien procent van het geplaatste
      aandelenkapitaal of een daarmee vergelijkbaar belang, of het rechtstreeks of middellijk kunnen uitoefenen van ten
      minste tien procent van de stemrechten of een daarmee vergelijkbare zeggenschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.h
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.i
    text: |-
      politiek prominente persoon: een persoon als bedoeld in artikel 2 van de Uitvoeringsrichtlijn 2006/70/EG van
      de Commissie van de Europese Gemeenschappen van 1 augustus 2006 tot vaststelling van uitvoeringsmaatregelen
      van Richtlijn 2005/60/EG van het Europees Parlement en de Raad wat betreft de definitie van politiek prominente
      personen en wat betreft de technische criteria voor vereenvoudigde cliëntenonderzoeksprocedures en voor
      vrijstellingen op grond van occasionele of zeer beperkte financiële activiteiten (PbEU L 214);
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: 1.j
    text: |-
      trustkantoor met zetel in een niet-aangewezen staat: trustkantoor met zetel in een staat buiten Nederland die
      niet op grond van [artikel 2, vijfde lid][ref1], is aangewezen als staat waar toezicht op trustkantoren wordt
      uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van de belangen die deze wet beoogt te beschermen;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.j
    text: 'toezichthouder: De Nederlandsche Bank N.V..'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden zonder vergunning van de toezichthouder vanuit een vestiging in Nederland als trustkantoor werkzaam
      te zijn.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het is een ieder met zetel buiten Nederland verboden zonder vergunning van de toezichthouder als trustkantoor
      werkzaam te zijn door middel van het verrichten van diensten naar Nederland.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden werkzaamheden te verrichten gericht op het verlenen van trustdiensten door een trustkantoor met
      zetel in een niet-aangewezen staat dat niet beschikt over een vergunning als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.4'
    text: 'Het eerste lid, tweede en derde lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: 2.4.a
    text: de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: 2.4.b
    text: |-
      een krachtens publiekrecht ingestelde rechtspersoon als bedoeld in
      [artikel 1 van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 2.4.c
    text: |-
      een rechtspersoon, vennootschap of natuurlijke persoon die beroeps- of bedrijfsmatig opdrachten van
      tijdelijke aard die betrekking hebben op management- en organisatievraagstukken, met daarbij behorende
      verantwoordelijkheden en bevoegdheden, uitvoert of doet uitvoeren, voor zover deze de diensten, bedoeld in
      [artikel 1, onderdeel d, onder 1°][ref1], verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel1
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.5'
    text: |-
      Het tweede lid is niet van toepassing op trustkantoren met zetel in een door Onze Minister aan te wijzen staat waar
      toezicht op het verlenen van trustdiensten wordt uitgeoefend dat in voldoende mate waarborgen biedt ten aanzien van
      de belangen die deze wet beoogt te beschermen.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.6'
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het aanwijzen van staten.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.7'
    text: Het besluit tot aanwijzing kan door Onze Minister worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: '2.8'
    text: |-
      Een besluit tot aanwijzing van een staat als bedoeld in het derde lid of de intrekking daarvan wordt bekend gemaakt
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2
  - number: 2a.1
    text: |-
      Onze Minister kan vrijstelling verlenen van [artikel 2, eerste, tweede of derde lid][ref1], indien de situatie
      van een onderscheiden categorie trustkantoren dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is
      met de belangen die deze wet beoogt te beschermen. Aan een vrijstelling kunnen voorschriften worden verbonden en
      beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2a.2
    text: |-
      De toezichthouder kan, op verzoek, ontheffing verlenen van [artikel 2, eerste, tweede of derde lid][ref1], indien
      de specifieke situatie van een trustkantoor dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is
      met de belangen die deze wet beoogt te beschermen. Aan een ontheffing kunnen voorschriften worden verbonden en
      beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2a.3
    text: |-
      Een vergunning als bedoeld in [artikel 2, eerste, tweede of derde lid][ref1] kan, onder door de toezichthouder
      te stellen voorschriften en beperkingen, aan een groep van trustkantoren worden verleend. Tenzij in de vergunning
      anders is bepaald, geldt de vergunning, alsmede de daaraan verbonden voorschriften of gestelde beperkingen, in
      gelijke zin voor alle trustkantoren die onderdeel uitmaken van de groep.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.1'
    text: 'De aanvrager van een vergunning verstrekt de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.a
    text: de identiteit en de antecedenten van de bestuurders en commissarissen van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.b
    text: de identiteit en de antecedenten van degenen die het beleid van het trustkantoor bepalen of mede bepalen;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.c
    text: |-
      de identiteit en de antecedenten van degenen die een gekwalificeerde deelneming houden in het trustkantoor, alsmede
      de omvang van de desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.d
    text: de formele en feitelijke zeggenschapsstructuur van de groep waartoe het trustkantoor behoort;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.e
    text: |-
      de naam, het adres en de statutaire zetel van het trustkantoor en, indien van toepassing, de naam en het adres van
      zijn bijkantoren;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.f
    text: |-
      de voorziene bedrijfsvoering, waaronder begrepen de maatregelen gericht op het bevorderen en handhaven van een
      integere bedrijfsvoering, en de voorziene administratieve organisatie en interne controle van het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: 3.1.g
    text: overige gegevens en bescheiden die de toezichthouder nodig acht in het belang van de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien de antecedenten van de personen, bedoeld in het eerste lid, onderdelen a, b en c, reeds zijn beoordeeld voor
      de toepassing van de [Wet op het financieel toezicht][ref1], bevat de aanvraag, in aanvulling op de in het eerste
      lid bedoelde gegevens, de datum van deze beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '3.3'
    text: Aan een vergunning kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: '3.4'
    text: De toezichthouder beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel3
  - number: '4'
    text: 'De toezichthouder verleent een vergunning tenzij:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel4
  - number: 4.a
    text: |-
      hij op grond van de voornemens of de antecedenten van de personen, bedoeld in
      [artikel 3, eerste lid, onderdelen a, b of c][ref1], van oordeel is dat de betrouwbaarheid van een van deze
      personen niet buiten twijfel staat;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 4.b
    text: |-
      hij van oordeel is dat de geschiktheid van een of meer van de personen, bedoeld in
      [artikel 3, eerste lid, onderdelen a en b][ref1], onvoldoende is om het beroep of bedrijf van trustkantoor uit
      te oefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 4.c
    text: |-
      hij van oordeel is dat de groep waartoe het trustkantoor behoort een formele of feitelijke zeggenschapsstructuur
      heeft die in zodanige mate ondoorzichtig is, dat deze een belemmering vormt of zou kunnen vormen voor het adequaat
      uitoefenen van toezicht op het trustkantoor;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel4
  - number: 4.d
    text: |-
      hij van oordeel is dat, gelet op hetgeen het trustkantoor ingevolge
      [artikel 3, eerste lid, onderdelen f en g][ref1], bij de aanvraag heeft overgelegd, het trustkantoor niet in staat
      zal zijn te voldoen aan de op grond van [artikel 10][ref2] te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel10
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '10'
        hoofdstuk: '3'
  - number: '5.1'
    text: |-
      Een trustkantoor meldt vooraf schriftelijk aan de toezichthouder een wijziging van de gegevens, bedoeld in
      [artikel 3, eerste lid, onderdelen a, b of c][ref1], voor zover het de identiteit van de daar genoemde personen
      betreft, of van de gegevens, bedoeld in [artikel 3, eerste lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd, indien de toezichthouder het voornemen daartoe
      afwijst binnen zes weken na ontvangst van de melding, bedoeld in het eerste lid, of, indien de toezichthouder om
      nadere gegevens of inlichtingen heeft verzocht, binnen zes weken na ontvangst van die gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien zich een wijziging voordoet in de antecedenten, bedoeld in
      [artikel 3, eerste lid, onderdelen a, b, of c][ref1], dan wel in de gegevens, bedoeld in
      [artikel 3, eerste lid, onderdelen e tot en met g][ref2], meldt het trustkantoor deze onverwijld schriftelijk aan
      de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '6'
    text: 'De toezichthouder kan een vergunning intrekken:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.b
    text: |-
      in geval de houder in staat van faillissement is verklaard of ten aanzien van hem de toepassing van de
      schuldsaneringsregeling, bedoeld in [titel III van de Faillissementswet][ref1], is uitgesproken;


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 6.c
    text: in geval van ontbinding of, indien de houder een natuurlijke persoon is, overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.d
    text: |-
      in geval de houder gedurende een termijn van meer dan zes maanden kennelijk niet langer werkzaamheden als
      trustkantoor verricht;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.e
    text: in geval de houder in gebreke blijft om te voldoen aan de verplichtingen, hem bij of krachtens deze wet opgelegd;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.f
    text: |-
      in geval de toezichthouder informatie bekend wordt die, was zij hem bekend geweest op het moment van het verlenen
      van de vergunning, ertoe zou hebben geleid dat de vergunning niet zou zijn verleend;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
  - number: 6.g
    text: |-
      in geval de toezichthouder na de tenuitvoerlegging van de in [artikel 8, negende lid][ref1], bedoelde executoriale
      titel, niet de ingevolge dat artikel verschuldigde betaling heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel8
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '7.1'
    text: |-
      De toezichthouder houdt een register waarin zijn ingeschreven de trustkantoren die op grond van een vergunning
      als bedoeld in [artikel 2, eerste lid][ref1], hun diensten mogen verlenen en de trustkantoren die op grond van een
      ontheffing als bedoeld in [artikel 2, vierde lid][ref2], hun diensten mogen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.2'
    text: 'In het register worden ten aanzien van een trustkantoor de volgende gegevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: 7.2.a
    text: |-
      de naam, het adres en de statutaire zetel van het trustkantoor en, indien van toepassing, de naam en het adres van
      zijn bijkantoren;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: 7.2.b
    text: de datum van inschrijving van het trustkantoor in het register;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: 7.2.c
    text: het nummer van inschrijving van het trustkantoor bij de Kamer van Koophandel en Fabrieken; en
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: 7.2.d
    text: |-
      de aan de vergunning of de ontheffing verbonden voorschriften en gestelde beperkingen, tenzij de bescherming van de
      persoonlijke levenssfeer of van gerechtvaardigde bedrijfsbelangen zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      De toezichthouder draagt zorg voor de doorhaling van de inschrijving van een trustkantoor waarvan de vergunning dan
      wel de ontheffing is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: '7.4'
    text: De toezichthouder houdt de gegevens in het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel7
  - number: '9.1'
    text: 'De toezichthouder kan bij:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
  - number: 9.1.a
    text: in het register ingeschreven trustkantoren;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
  - number: 9.1.b
    text: |-
      trustkantoren waarop een vrijstelling als bedoeld in [artikel 2, derde lid][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.1.c
    text: een ieder die met een in de onderdelen a of b bedoeld trustkantoor in een groep is verbonden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
  - number: 9.1.d
    text: |-
      een ieder van wie of waarvan redelijkerwijs kan worden vermoed dat deze handelt in strijd met de bij of krachtens
      deze wet gestelde regels; alle inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de
      uitoefening van de taken en bevoegdheden die hij op grond van deze wet heeft en teneinde na te gaan of de bij of
      krachtens deze wet gestelde bepalingen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door de
      toezichthouder te stellen redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Ten aanzien van de personen die door de toezichthouder zijn belast met het inwinnen van inlichtingen of met
      de uitoefening van andere taken en bevoegdheden die de toezichthouder heeft op grond van het bij of krachtens
      deze wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing, met dien verstande dat indien
      een onderzoek als bedoeld in [artikel 14, eerste lid][ref7], wordt ingesteld, degene bij wie het onderzoek wordt
      ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in
      zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0016189#Artikel14
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
  - number: '10.1'
    text: |-
      Met het oog op een integere bedrijfsvoering worden bij of krachtens algemene maatregel van bestuur regels gesteld
      aan trustkantoren. Hieronder worden begrepen regels met betrekking tot de administratieve organisatie – met
      inbegrip van de financiële administratie – en de interne controle, zodanig dat:
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.a
    text: |-
      het trustkantoor de identiteit kent van de uiteindelijk belanghebbende of over informatie beschikt waaruit blijkt
      dat er geen uiteindelijk belanghebbende is;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.b
    text: het trustkantoor kennis heeft van de herkomst en de bestemming van de gelden van de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.c
    text: |-
      het trustkantoor kennis heeft van de relevante delen van de structuur van de groep waartoe de doelvennootschap
      behoort;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.d
    text: het trustkantoor kennis heeft van het doel waarmee de in onderdeel c bedoelde structuur is opgezet;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.e
    text: 'het trustkantoor:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.e.1°
    text: |-
      beschikt over een op risico gebaseerd beleid om te bepalen of de uiteindelijk belanghebbende een politiek prominent
      persoon is;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.e.2°
    text: |-
      de beslissing tot het aangaan van een relatie met een politiek prominent persoon laat nemen of laat goedkeuren door
      personen die daartoe door het trustkantoor gemachtigd zijn;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.e.3°
    text: |-
      adequate maatregelen treft om de bron van het vermogen vast te stellen die bij de zakelijke relatie worden
      gebruikt; en
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.e.4°
    text: doorlopende controle uitoefent op de zakelijke relatie.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.f
    text: |-
      het trustkantoor de identiteit kent van de koper en van de houders van een gekwalificeerde deelneming in de koper,
      indien door het trustkantoor een dienst wordt verleend als bedoeld in [artikel 1, onderdeel d, onder 3°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel1
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '1'
        hoofdstuk: '1'
  - number: 10.1.g
    text: |-
      het trustkantoor in zijn hoedanigheid van trustee de identiteit kent van de insteller van een trust in de zin van
      het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning van trusts;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: 10.1.h
    text: door het trustkantoor geen dienst wordt verleend, indien niet wordt voldaan aan onderdeel a of f.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      Een trustkantoor zendt binnen een door de toezichthouder te stellen redelijke termijn aan de toezichthouder
      desgevraagd een rapportage omtrent zijn bedrijfsvoering en administratieve organisatie en interne controle. De
      toezichthouder bepaalt de wijze waarop de rapportage geschiedt en de periode waarop de rapportage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      De toezichthouder kan, indien niet is voldaan aan [artikel 5, eerste of derde lid][ref1], of indien zich een
      omstandigheid voordoet als bedoeld in [artikel 6, onderdeel e][ref2], aan het trustkantoor dan wel aan de bevoegde
      organen, een aanwijzing geven om ten aanzien van met name aan te geven onderwerpen een bepaalde gedragslijn te
      volgen. Het trustkantoor dan wel de bevoegde organen aan wie de aanwijzing is gegeven, volgt dan wel volgen deze op
      binnen een door de toezichthouder te stellen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel6
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      Indien van de in [artikel 3, eerste lid, onderdelen a, b of c][ref1] bedoelde personen, voor zover zij via
      een formele of feitelijke zeggenschapsstructuur het beleid bepalen of mede bepalen van het trustkantoor,
      de betrouwbaarheid niet langer buiten twijfel staat, of de geschiktheid niet langer voldoende is, kan de
      toezichthouder:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.2.a
    text: |-
      met betrekking tot de in [artikel 3, eerste lid, onderdelen a en b][ref1], bedoelde personen een aanwijzing geven
      aan het trustkantoor dat deze personen het beleid van het trustkantoor niet meer kunnen bepalen of mede bepalen;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.2.b
    text: |-
      aan de in [artikel 3, eerste lid, onderdeel c][ref1], bedoelde personen een aanwijzing geven om binnen een door
      de toezichthouder gestelde redelijke termijn ten aanzien van in de aanwijzingsbeschikking aan te geven punten een
      bepaalde gedragslijn te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke rechtspersonen,
      vennootschappen of natuurlijke personen zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een
      instantie als bedoeld in [artikel 13, eerste lid][ref1], zijn ontvangen, worden niet gepubliceerd en zijn geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel13
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '13'
        hoofdstuk: '4'
  - number: '12.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie
      als bedoeld in [artikel 13, eerste lid][ref1], verkregen, of van gegevens of inlichtingen, bij het onderzoek
      van zakelijke gegevens en bescheiden ontvangen, verder of anders gebruik te maken of daaraan verder of anders
      bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel13
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '13'
        hoofdstuk: '4'
  - number: '12.3'
    text: |-
      Het eerste en tweede lid laten ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '13.1'
    text: |-
      In afwijking van [artikel 12, eerste en tweede lid][ref1], kan de toezichthouder gegevens of inlichtingen,
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan Nederlandse of
      buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties
      die zijn belast met het toezicht op financiële markten of op rechtspersonen, vennootschappen of natuurlijke
      personen die op die markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel12
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '12'
        hoofdstuk: '4'
  - number: 13.1.a
    text: |-
      de verstrekking van gegevens of inlichtingen in internationaal verband niet kan plaatsvinden op basis van
      wederkerigheid;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.b
    text: |-
      de gegevens betrekking hebben op een rechtspersoon, vennootschap of natuurlijke persoon waaraan of aan wie het
      trustkantoor diensten verleent, onverlet de toepasselijkheid van de bepalingen van de [Sanctiewet 1977][ref1],
      de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref2], de Nederlandse belastingwetgeving,
      de bilaterale belastingverdragen en verdragen tot uitwisseling van gegevens of inlichtingen dan wel de
      toepasselijkheid van bindende besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op de
      financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003296
      [ref2]: https://wetten.overheid.nl/BWBR0024282
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003296
      - id: ref2
        bwb_id: BWBR0024282
  - number: 13.1.c
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende is bepaald;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.d
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.e
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.f
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.g
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.1.h
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten
      werkzaam zijn, verstrekt de toezichthouder deze niet aan een Nederlandse of buitenlandse instantie als bedoeld in
      het eerste lid, tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste of tweede lid aan de toezichthouder verzoekt om
      de gegevens of inlichtingen die op grond van dat lid zijn verstrekt te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, wordt dat verzoek slechts ingewilligd:
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.3.a
    text: indien het beoogde gebruik niet in strijd is met het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: 13.3.b
    text: |-
      indien die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met inachtneming
      van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou
      kunnen verkrijgen.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien het in het derde lid bedoelde verzoek betrekking heeft op een onderzoek naar strafbare feiten, wordt dit
      niet ingewilligd dan na toestemming van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn, kan de toezichthouder
      ten behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat is belast
      met de uitvoering van wettelijke regelingen inzake het toezicht op de financiële markten, inlichtingen vragen aan
      of een onderzoek instellen of doen instellen bij ieder ingeschreven trustkantoor dat ingevolge deze wet onder zijn
      toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen
      beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel14
  - number: '14.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door de toezichthouder te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel14
  - number: '15.1'
    text: |-
      De toezichthouder verstrekt aan de Stichting Autoriteit Financiële Markten, voor de toepassing van de
      [Wet op het financieel toezicht][ref1], de gegevens of inlichtingen die hij heeft verkregen bij de vervulling van
      de hem ingevolge deze wet opgedragen taak en die betrekking hebben op de betrouwbaarheid van de personen, bedoeld
      in [artikel 3, eerste lid, onderdelen a, b of c][ref2], voorzover deze naar het oordeel van de toezichthouder
      van belang zijn of zouden kunnen zijn voor het toezicht dat door de Stichting Autoriteit Financiële Markten wordt
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel3
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Het eerste lid is niet van toepassing indien de gegevens of inlichtingen zijn verkregen van een buitenlandse
      overheidsinstantie of van een buitenlandse van overheidswege aangewezen instantie als bedoeld in
      [artikel 13][ref1], tenzij die buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen
      uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft
      ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel13
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '13'
        hoofdstuk: '4'
  - number: '16.1'
    text: |-
      De toezichthouder kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 14, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel14
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
  - number: '16.2'
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 14, eerste lid][ref1], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel14
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
  - number: '16.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel16
  - number: '17.1'
    text: |-
      Schriftelijke afspraken tussen de toezichthouder en andere toezichthoudende autoriteiten die tot uitwerking van de
      in [artikel 13][ref1] bedoelde informatie-uitwisseling dienen, worden ter voorafgaande instemming van Onze Minister
      voorgelegd. Onze Minister kan zijn instemming slechts onthouden indien naar zijn oordeel de belangen die worden
      gediend door verdragen of bindende besluiten als bedoeld in [artikel 14, eerste lid][ref2], dan wel het algemeen
      belang zich tegen die afspraken verzetten onderscheidenlijk verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel14
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '13'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      In schriftelijke afspraken als bedoeld in het eerste lid met toezichthoudende autoriteiten van een staat waarmee
      het Koninkrijk geen verdrag als bedoeld in dat lid heeft gesloten, wordt bepaald dat deze afspraken bij de
      totstandkoming nadien van een dergelijk verdrag met die staat wederom ter instemming aan Onze Minister worden
      voorgelegd. In dat geval toetst Onze Minister die afspraken aan het betrokken verdrag.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      Instemming als bedoeld in het eerste lid of tweede lid wordt geacht te zijn verleend, indien Onze Minister niet
      heeft beslist binnen vier weken na ontvangst van het desbetreffende voorstel of, indien hij om nadere inlichtingen
      heeft verzocht, binnen vier weken na ontvangst daarvan.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel17
  - number: '17.4'
    text: |-
      Van schriftelijke afspraken als bedoeld in het eerste lid waarmee Onze Minister heeft ingestemd, wordt door de
      toezichthouder mededeling gedaan in de *Staatscourant.*
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      Voor de totstandkoming, wijziging of intrekking van een vrijstelling als bedoeld in [artikel 2, derde lid][ref1],
      de vast te stellen bedragen als bedoeld in [artikel 8, vierde lid][ref2], en het stellen van regels als bedoeld
      in de [artikelen 20, derde lid][ref3] en [21, derde lid][ref4], kan het advies van de toezichthouder worden
      ingewonnen. De toezichthouder is verplicht dit advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0016189#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0016189#Artikel21
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0016189
        artikel: '20'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0016189
        artikel: '21'
        hoofdstuk: '7'
  - number: '18.2'
    text: |-
      Eenmaal per jaar, uiterlijk op 1 mei, wordt door de toezichthouder verslag uitgebracht aan Onze Minister over de
      uitoefening van zijn taken en bevoegdheden in het voorgaande kalenderjaar. Dit verslag wordt door de zorg van de
      toezichthouder openbaar gemaakt, met dien verstande dat gegevens met betrekking tot afzonderlijke trustkantoren
      niet openbaar worden gemaakt zonder hun schriftelijke toestemming.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel18
  - number: '20.1'
    text: |-
      De toezichthouder kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften, gesteld
      bij of krachtens de [artikelen 2, eerste tot en met derde lid][ref1], [2a, eerste tot en met derde lid][ref2],
      [3, derde lid][ref3], [5][ref4], [9, tweede en derde lid][ref5], voor zover het betreft het voorschrift van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref6] en het voorschrift inzage te verlenen in zakelijke gegevens
      en bescheiden, [10][ref7], [11][ref8], [14, tweede lid][ref9], [16, tweede lid][ref10], [24, eerste lid][ref11]
      en [25, vierde lid][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0016189#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0016189#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0016189#Artikel10
