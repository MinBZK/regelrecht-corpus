        artikel: '25'
        hoofdstuk: 7a
  - number: '21.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke vaststellen op ten
      hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien diens
      voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel22
  - number: '23.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel23
  - number: '23.2'
    text: |-
      De schorsing van de verplichting tot betaling van de bestuurlijke boete schorst niet de berekening van de
      wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel23
  - number: '24.1'
    text: |-
      De toezichthouder kan een ieder die werkzaam is als trustkantoor zonder daartoe bevoegd te zijn op grond van een
      vergunning als bedoeld in [artikel 2, eerste lid][ref1], een aanwijzing geven die is gericht op het beëindigen van
      de desbetreffende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '24.2'
    text: 'De aanwijzing vermeldt:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
  - number: 24.2.a
    text: |-
      de werkzaamheden die in strijd met het verbod, bedoeld in [artikel 2, eerste lid][ref1], zijn verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 24.2.b
    text: |-
      indien van toepassing, een aanduiding van de plaats en het tijdstip waarop of de periode waarin in strijd met het
      verbod, bedoeld in [artikel 2, eerste lid][ref1], is gehandeld;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 24.2.c
    text: de wijze waarop de dienstverlening dient te worden afgebouwd en beëindigd;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
  - number: 24.2.d
    text: de termijn waarin het handelen in strijd met het bedoelde verbod moet zijn beëindigd.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
  - number: '24.3'
    text: |-
      Voordat de toezichthouder een aanwijzing geeft, stelt hij de betrokkene in de gelegenheid zijn zienswijze naar
      voren te brengen.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel24
  - number: '25.1'
    text: |-
      De toezichthouder kan één of meer personen benoemen als curator ten aanzien van alle of bepaalde organen of
      vertegenwoordigers van een trustkantoor indien dat trustkantoor niet voldoet aan hetgeen ingevolge deze wet is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '25.2'
    text: 'Het besluit ingevolge het eerste lid wordt slechts genomen:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.2.a
    text: |-
      nadat door het trustkantoor niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld in
      [artikel 11, eerste lid][ref1], gevolg is gegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel11
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '11'
        hoofdstuk: '3'
  - number: 25.2.b
    text: |-
      indien de in het eerste lid bedoelde overtreding een adequate functionering van het trustkantoor ernstig in gevaar
      brengt en dat trustkantoor voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te brengen over het
      voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '25.3'
    text: |-
      Het benoemingsbesluit bevat onder meer een beschrijving van de belangen waardoor de curator zich dient te
      laten leiden. De toezichthouder benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze
      termijn telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht. Met ingang
      van het tijdstip waarop het besluit tot benoeming van de curator aan het trustkantoor is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '25.4'
    text: 'Na de benoeming van een curator:'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.4.a
    text: verlenen de organen en de vertegenwoordigers van het trustkantoor de curator alle medewerking;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.4.b
    text: |-
      kan de toezichthouder de betrokken organen of vertegenwoordigers van het trustkantoor toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.4.c
    text: kan de toezichthouder te allen tijde de door hem aangewezen curator vervangen;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.4.d
    text: |-
      is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het eerste
      lid, elke persoon die deel uitmaakt van het orgaan van het trustkantoor dat deze handelingen verrichtte, hoofdelijk
      aansprakelijk tegenover het trustkantoor, tenzij het verrichten van deze handelingen niet aan hem is te verwijten
      en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan af te wenden;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: 25.4.e
    text: |-
      zijn de handelingen, bedoeld in onderdeel d, voor zover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '25.5'
    text: |-
      Zodra de omstandigheid, bedoeld in het eerste lid, niet langer aanwezig is, trekt de toezichthouder het besluit
      tot benoeming van de curator in. De toezichthouder maakt het besluit tot intrekking onverwijld bekend aan het
      trustkantoor.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '25.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een ieder die beroeps- of bedrijfshalve een dienst verleent zonder
      een daartoe strekkende vergunning als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '25.7'
    text: De kosten van de in het eerste lid bedoelde maatregel komen voor rekening van het in dat lid bedoelde trustkantoor.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel25
  - number: '31'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 12][ref1], teneinde de naleving van deze wet te bevorderen ter
      openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel12
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '12'
        hoofdstuk: '4'
  - number: 31.a
    text: |-
      zijn weigering om een aangevraagde vergunning of ontheffing te verlenen, wanneer deze weigering niet meer in beroep
      kan worden getroffen en de aanvrager handelt als was hem de vergunning of ontheffing verleend;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
  - number: 31.b
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 2, eerste lid][ref1], van toepassing is, niet over een vergunning beschikt;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 31.c
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon die beschikt over een vergunning, zich niet
      houdt aan de voorschriften of de beperkingen die aan die vergunning zijn verbonden of zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
  - number: 31.d
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon waarop een vrijstelling als bedoeld in
      [artikel 2, derde lid][ref1] of een ontheffing als bedoeld in [artikel 2, vierde lid][ref2], van toepassing is,
      zich niet houdt aan de voorschriften of de beperkingen die aan die vrijstelling of ontheffing zijn verbonden of
      gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 31.e
    text: |-
      het feit dat een trustkantoor de aanwijzing op grond van [artikel 11][ref1] niet heeft opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel11
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '11'
        hoofdstuk: '3'
  - number: '32'
    text: |-
      Degene jegens wie door de toezichthouder een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat de toezichthouder zijn handelen of nalaten op grond van [artikel 31][ref1] ter openbare kennis
      zal brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '33.1'
    text: |-
      De toezichthouder geeft, indien hij voornemens is op grond van [artikel 31][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '33.2'
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref1], is de toezichthouder niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '34'
    text: |-
      De beschikking om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: 34.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel34
  - number: 34.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel34
  - number: 34.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel34
  - number: '35'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '36'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking om op grond van
      [artikel 31][ref2] een feit ter openbare kennis te brengen in werking op de dag waarop het feit ter openbare kennis
      is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien beroep is ingesteld, van het beroep
      wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres ook niet met een redelijke inspanning
      kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '37.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '37.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 31][ref1] vervalt, indien de
      toezichthouder het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '38.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '38.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel38
  - number: '39'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 31][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '50.1'
    text: |-
      Een rechtspersoon, vennootschap of natuurlijke persoon die op het tijdstip van inwerkingtreding van deze wet vanuit
      een vestiging in Nederland als trustkantoor werkzaam is, wordt geacht niet in strijd te handelen met het verbod,
      bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '50.2'
    text: |-
      Het in het eerste lid bedoelde trustkantoor meldt zich binnen acht weken na het tijdstip van inwerkingtreding van
      deze wet schriftelijk bij de toezichthouder en verstrekt binnen een door de toezichthouder te stellen termijn de
      gegevens en inlichtingen die de toezichthouder nodig acht om te beoordelen of het trustkantoor voldoet aan het bij
      of krachtens deze wet bepaalde. Deze melding wordt beschouwd als een aanvraag voor een vergunning als bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '50.3'
    text: |-
      Op de aanvraag voor een vergunning beslist de toezichthouder binnen een jaar na de ontvangst van de in het
      tweede lid, eerste volzin, bedoelde gegevens en inlichtingen, of, indien de toezichthouder om nadere gegevens of
      inlichtingen heeft verzocht, binnen een jaar na de ontvangst van die nadere gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
  - number: '50.4'
    text: |-
      In afwijking van [artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref1] wordt het besluit om een
      aanvraag voor een vergunning niet te behandelen, aan het trustkantoor bekendgemaakt binnen acht weken nadat de
      in het tweede lid, eerste volzin, bedoelde gegevens en inlichtingen zijn verstrekt of nadat de daarvoor gestelde
      termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '50.5'
    text: |-
      Indien het trustkantoor niet of niet tijdig heeft voldaan aan het tweede lid, is het eerste lid niet langer van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
  - number: '50.6'
    text: |-
      Indien de toezichthouder op grond van de gegevens en inlichtingen waarvan hij ingevolge het tweede lid, eerste
      volzin, kennis heeft genomen van oordeel is dat het trustkantoor niet voldoet aan het bij of krachtens deze wet
      bepaalde, is het in het eerste lid bepaalde niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel50
  - number: '51'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel51
  - number: '52'
    text: 'Deze wet wordt aangehaald als: Wet toezicht trustkantoren.'
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel52
