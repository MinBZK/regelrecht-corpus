  - number: '20.2'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen ter zake van overtreding van
      voorschriften, gesteld bij of krachtens de [artikelen 2, eerste tot en met derde lid][ref1],
      [2a, eerste tot en met derde lid][ref2][3, derde lid][ref3], [5][ref4], [9, tweede en derde lid][ref5], voor
      zover het betreft het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref6] en het voorschrift
      inzage te verlenen in zakelijke gegevens en bescheiden, [10][ref7], [11][ref8], [14, tweede lid][ref9],
      [16, tweede lid][ref10], [24, eerste lid][ref11] en [25, vierde lid][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0016189#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0016189#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0016189#Artikel10
      [ref8]: https://wetten.overheid.nl/BWBR0016189#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0016189#Artikel14
      [ref10]: https://wetten.overheid.nl/BWBR0016189#Artikel16
      [ref11]: https://wetten.overheid.nl/BWBR0016189#Artikel24
      [ref12]: https://wetten.overheid.nl/BWBR0016189#Artikel25
    url: https://wetten.overheid.nl/BWBR0016189/2013-01-01#Artikel21
    references:
      - id: ref1
