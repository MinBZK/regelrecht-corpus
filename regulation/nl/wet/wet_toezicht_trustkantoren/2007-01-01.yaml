        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0016189
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0016189
        artikel: '10'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0016189
        artikel: '11'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0016189
        artikel: '16'
        hoofdstuk: '4'
  - number: '20.2'
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20.3'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel20
  - number: '21.1'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften, gesteld
      bij of krachtens de [artikelen 2, eerste en derde tot en met vijfde lid][ref1], [3, derde lid][ref2],
      [5][ref3], [9, tweede en derde lid][ref4], voor zover het betreft het voorschrift van
      [artikel 5:20 van de Algemene wet bestuursrecht][ref5] en het voorschrift inzage te verlenen in zakelijke gegevens
      en bescheiden, [10][ref6], [11][ref7], [14, tweede lid][ref8], en [16, tweede lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0016189#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0016189#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0016189#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0016189#Artikel11
      [ref8]: https://wetten.overheid.nl/BWBR0016189#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0016189#Artikel16
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016189
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0016189
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0016189
        artikel: '10'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0016189
        artikel: '11'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0016189
        artikel: '14'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0016189
        artikel: '16'
        hoofdstuk: '4'
  - number: '21.2'
    text: De boete komt toe aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel21
  - number: '21.3'
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel21
  - number: '22.1'
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage bij deze wet, met dien verstande dat
      de boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel22
  - number: '22.2'
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel22
  - number: '22.3'
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel22
  - number: '22.4'
    text: |-
      De toezichthouder kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel22
  - number: '23'
    text: |-
      Degene jegens wie door de toezichthouder een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan
      enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt
      gevraagd.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel23
  - number: '24.1'
    text: |-
      Indien de toezichthouder voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder
      vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel24
  - number: '24.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt de toezichthouder de betrokkene in
      de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 22][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel22
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '22'
        hoofdstuk: '7'
  - number: '25.1'
    text: De toezichthouder legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel25
  - number: '25.2'
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel25
  - number: 25.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel25
  - number: 25.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel25
  - number: 25.2.c
    text: |-
      de termijn, bedoeld in [artikel 27, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel27
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '27'
        hoofdstuk: '7'
  - number: '26.1'
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 24, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel24
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '24'
        hoofdstuk: '7'
  - number: '27.1'
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '27.2'
    text: |-
      Bij gebreke van betaling wordt de boete vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert
      de bekendmaking van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 24, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel24
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '24'
        hoofdstuk: '7'
  - number: '27.3'
    text: |-
      Indien de boete niet tijdig is betaald, stuurt de toezichthouder schriftelijk een aanmaning om binnen twee weken
      de boete, verhoogd met de rente en de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging,
      dat de boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal
      worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '27.4'
    text: |-
      Bij gebreke van tijdige betaling kan de toezichthouder de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '27.5'
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '27.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      toezichthouder.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '27.7'
    text: Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '27.8'
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel27
  - number: '28.1'
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '28.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 21][ref1] vervalt, indien
      de toezichthouder ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel21
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '21'
        hoofdstuk: '7'
  - number: '29.1'
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel29
  - number: '29.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel29
  - number: '30'
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel30
  - number: '31'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 12][ref1], teneinde de naleving van deze wet te bevorderen ter
      openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel12
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '12'
        hoofdstuk: '4'
  - number: 31.a
    text: |-
      zijn weigering om een aangevraagde vergunning of ontheffing te verlenen, wanneer deze weigering niet meer in beroep
      kan worden getroffen en de aanvrager handelt als was hem de vergunning of ontheffing verleend;
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
  - number: 31.b
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 2, eerste lid][ref1], van toepassing is, niet over een vergunning beschikt;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 31.c
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon die beschikt over een vergunning, zich niet
      houdt aan de voorschriften of de beperkingen die aan die vergunning zijn verbonden of zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
  - number: 31.d
    text: |-
      het feit dat een rechtspersoon, vennootschap of natuurlijke persoon waarop een vrijstelling als bedoeld in
      [artikel 2, derde lid][ref1] of een ontheffing als bedoeld in [artikel 2, vierde lid][ref2], van toepassing is,
      zich niet houdt aan de voorschriften of de beperkingen die aan die vrijstelling of ontheffing zijn verbonden of
      gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 31.e
    text: |-
      het feit dat een trustkantoor de aanwijzing op grond van [artikel 11][ref1] niet heeft opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel11
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '11'
        hoofdstuk: '3'
  - number: '32'
    text: |-
      Degene jegens wie door de toezichthouder een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking
      kan verbinden dat de toezichthouder zijn handelen of nalaten op grond van [artikel 31][ref1] ter openbare kennis
      zal brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '33.1'
    text: |-
      De toezichthouder geeft, indien hij voornemens is op grond van [artikel 31][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '33.2'
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref1], is de toezichthouder niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '34'
    text: |-
      De beschikking om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: 34.a
    text: het feit dat ter openbare kennis wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel34
  - number: 34.b
    text: de wijze waarop het feit ter openbare kennis wordt gebracht; en
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel34
  - number: 34.c
    text: de termijn waarna het feit ter openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel34
  - number: '35'
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '36'
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking om op grond van
      [artikel 31][ref2] een feit ter openbare kennis te brengen in werking op de dag waarop het feit ter openbare kennis
      is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien beroep is ingesteld, van het beroep
      wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres ook niet met een redelijke inspanning
      kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '37.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '37.2'
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 31][ref1] vervalt, indien de
      toezichthouder het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '38.1'
    text: |-
      De bevoegdheid om op grond van [artikel 31][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '38.2'
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel38
  - number: '39'
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 31][ref1] ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel31
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '31'
        hoofdstuk: '8'
  - number: '50.1'
    text: |-
      Een rechtspersoon, vennootschap of natuurlijke persoon die op het tijdstip van inwerkingtreding van deze wet vanuit
      een vestiging in Nederland als trustkantoor werkzaam is, wordt geacht niet in strijd te handelen met het verbod,
      bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '50.2'
    text: |-
      Het in het eerste lid bedoelde trustkantoor meldt zich binnen acht weken na het tijdstip van inwerkingtreding van
      deze wet schriftelijk bij de toezichthouder en verstrekt binnen een door de toezichthouder te stellen termijn de
      gegevens en inlichtingen die de toezichthouder nodig acht om te beoordelen of het trustkantoor voldoet aan het bij
      of krachtens deze wet bepaalde. Deze melding wordt beschouwd als een aanvraag voor een vergunning als bedoeld in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel2
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '50.3'
    text: |-
      Op de aanvraag voor een vergunning beslist de toezichthouder binnen een jaar na de ontvangst van de in het
      tweede lid, eerste volzin, bedoelde gegevens en inlichtingen, of, indien de toezichthouder om nadere gegevens of
      inlichtingen heeft verzocht, binnen een jaar na de ontvangst van die nadere gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
  - number: '50.4'
    text: |-
      In afwijking van [artikel 4:5, vierde lid, van de Algemene wet bestuursrecht][ref1] wordt het besluit om een
      aanvraag voor een vergunning niet te behandelen, aan het trustkantoor bekendgemaakt binnen acht weken nadat de
      in het tweede lid, eerste volzin, bedoelde gegevens en inlichtingen zijn verstrekt of nadat de daarvoor gestelde
      termijn ongebruikt is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '50.5'
    text: |-
      Indien het trustkantoor niet of niet tijdig heeft voldaan aan het tweede lid, is het eerste lid niet langer van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
  - number: '50.6'
    text: |-
      Indien de toezichthouder op grond van de gegevens en inlichtingen waarvan hij ingevolge het tweede lid, eerste
      volzin, kennis heeft genomen van oordeel is dat het trustkantoor niet voldoet aan het bij of krachtens deze wet
      bepaalde, is het in het eerste lid bepaalde niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel50
  - number: '51'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel51
  - number: '52'
    text: 'Deze wet wordt aangehaald als: Wet toezicht trustkantoren.'
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel52
  - number: '1'
    text: |-
      Voor de overtredingen genoemd in tabel 1 en tabel 2, begaan na het tijdstip van inwerkingtreding van deze wet, zijn
      de boetebedragen vastgesteld als volgt:






                    **Tariefnummer:**


                    **Bedrag (vast tarief):**




                    1.


                    € 453




                    2.


                    € 907




                    3.


                    € 5 445




                    4.


                    € 21 781




                    5.


                    € 87 125
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      Indien een boete wordt opgelegd voor het overtreden van een bepaling als genoemd in tabel 1, is bij de vaststelling
      van de hoogte van deze boete de volgende categorie-indeling naar omzet van toepassing met de daarbij behorende
      factor. *Categorie-indeling normgeadresseerden* *Categorie I*: trustkantoren met een omzet van minder dan € 45 400;
      factor: '0,5; *Categorie II*: trustkantoren met een omzet van ten minste € 45 400 maar minder dan € 90 800;'
      factor: '1; *Categorie III*: trustkantoren met een omzet van ten minste € 90 800 maar minder dan € 226 900; factor:'
      2; *Categorie IV*: trustkantoren met een omzet van ten minste € 226 900 maar minder dan € 453 800; factor: 3;
      *Categorie V*: trustkantoren met een omzet van ten minste € 453 800; factor: 4.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel2
  - number: '2.2'
    text: |-
      De boete wordt vastgesteld door het bedrag, bedoeld in [artikel 1][ref1], te vermenigvuldigen met de factor
      behorende bij de categorie naar omzet, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel1
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.3'
    text: |-
      Indien de gegevens omtrent de omzet niet aan de toezichthouder beschikbaar zijn gesteld, kan de toezichthouder
      aan degene aan wie de boete wordt opgelegd, verzoeken deze gegevens binnen een door hem te stellen termijn te
      verstrekken. Indien de betrokkene niet binnen de gestelde termijn voldoet aan dit verzoek, is bij de vaststelling
      van de hoogte van de boete categorie V van toepassing.
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel2
  - number: '3'
    text: |-
      Indien het een overtreding betreft waarvoor tariefnummer 1 of 2 is vastgesteld, behoeft de betrokkene op grond van
      [artikel 24, tweede lid][ref1], niet in de gelegenheid te worden gesteld om zijn zienswijze naar voren te brengen
      voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016189#Artikel24
    url: https://wetten.overheid.nl/BWBR0016189/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016189
        artikel: '24'
        hoofdstuk: '7'
