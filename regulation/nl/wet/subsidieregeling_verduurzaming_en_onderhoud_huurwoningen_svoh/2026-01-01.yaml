        bwb_id: BWBR0046234
        artikel: '8'
  - number: 11.1.c
    text: |-
      de aanvraag een subsidie betreft als bedoeld in de [artikelen 5][ref1], [5a][ref2] of [7][ref3] staatssteun bevat
      die gerechtvaardigd wordt op grond van de algemene groepsvrijstellingsverordening en:


