  - number: '11.2'
    text: 'De Minister wijst een aanvraag voor subsidie voor maatregelen af indien:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.a
    text: |-
      de aanvraag voor subsidie € 25.000 of meer betreft en de maatregelen reeds zijn uitgevoerd, in welk geval de
      Minister tevens kan besluiten tot vaststelling van de subsidie ter hoogte van het bedrag € 24.999;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.b
    text: |-
      de aanvraag voor subsidie betrekking heeft op een investering ten behoeve van het realiseren van een vergroting van
      het woonoppervlakte of de wooninhoud, waarvan in ieder geval sprake is bij:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.b.1°
    text: het realiseren van een nieuwe aanbouw;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.b.2°
    text: het realiseren van een nieuwe dakkapel;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.b.3°
    text: het betrekken van een aan- of inpandige garage bij de woning;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.b.4°
    text: het vergroten van het dak, de gevel, de vloer of de glasoppervlakte;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.c
    text: |-
      meer dan 24 maanden zijn verstreken tussen het installeren of aanbrengen van de maatregel of maatregelen en de
      aanvraag voor subsidie in het geval de subsidieaanvraag een subsidiebedrag van minder dan € 25.000 betreft; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.2.d
    text: |-
      meer dan 24 maanden zijn verstreken tussen de aanvraag voor subsidie en het installeren of aanbrengen van de
      maatregel of maatregelen in het geval de subsidieaanvraag een subsidiebedrag van ten minste € 25.000 betreft.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: '11.3'
    text: |-
      De Minister wijst een aanvraag voor subsidie voor duurzame warmteopties als bedoeld in [artikel 5a][ref1] af
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5a
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: 5a
  - number: 11.3.a
    text: |-
      de installatie waar de investering betrekking op heeft, is of wordt geïnstalleerd om te voldoen aan de wettelijke
      voorschriften, bedoeld in [afdeling 4.4 van het Besluit bouwwerken leefomgeving][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041297#Afdeling4.4
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0041297
        afdeling: '4.4'
  - number: 11.3.b
    text: de aanvraag voor subsidie betrekking heeft op een gebruikte installatie; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.3.c
    text: |-
      het een aanvraag voor subsidie betreft voor een lucht-waterwarmtepomp, grondwaterwarmtepomp of water-
      waterwarmtepomp als bedoeld in [artikel 5a, onderdeel a][ref1], met een thermisch vermogen tussen 1 kW en 70 kW
      behorend tot een energie-efficiëntieklasse lager dan A++ en deze is of wordt aangebracht op of na 1 januari 2024.


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5a
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: 5a
  - number: '12'
    text: |-
      Bij de verstrekking van een subsidie op grond van deze regeling van minder dan € 25.000 wordt toepassing gegeven
      aan [artikel 16, tweede lid, onderdeel a, van het Kaderbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
  - number: '13'
    text: 'Bij het verzoek tot vaststelling van de subsidie wordt meegestuurd:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.a
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen, met daarin ten minste de naam en het adres van de eigenaar
      en het branchegerelateerde bedrijf dat werkzaamheden betreffende de investering of investeringen heeft uitgevoerd,
      een omschrijving van het soort energiebesparende isolatiemaatregel en aanverwante werkzaamheden die door het
      branchegerelateerde bedrijf uitgevoerd zijn, de naam, het type, het merk en de dikte van het isolatiemateriaal dat
      gebruikt is en de plaats en bijhorende oppervlakte voor elk van de ingediende huurwoning of monumentale huurwoning
      dan wel huurwoningen of monumentale huurwoningen die geïsoleerd is of zijn;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.b
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen van de aanschaf en de installatie of het aanbrengen van de
      investering voor een duurzame warmteoptie, waaronder begrepen de door het branchegerelateerde bedrijf ondertekende
      factuur in geval van contante betaling van de investeringen, waarop ten minste het betaalde bedrag, de begunstigde
      en betaaldatum vermeld wordt;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.c
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen voor de onderhoudsmaatregelen, met een nadere onderbouwing
      van kozijnomvang in m2 en gebruikt product, merk en type van de nieuwe vervangende ventilatiebox;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.d
    text: |-
      mits van toepassing een factuur en betaalbewijs van het uitgevoerde maatwerkadvies of duurzaam monumentenadvies
      voor de betreffende huurwoning of monumentale huurwoning dan wel huurwoningen of monumentale huurwoningen, waarvoor
      subsidie voor maatregelen zal worden ontvangen via deze regeling;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.e
    text: |-
      ten minste één foto per energiebesparende isolatie- en onderhoudsmaatregel, genomen tijdens de uitvoering van de
      werkzaamheden door het branchegerelateerde bedrijf, met daarop zichtbaar de naam, merk, soort, en dikte van het
      isolatiemateriaal of merk en type ventilatiebox;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.f
    text: |-
      indien het een investering voor glas of deurisolatie als bedoeld in [artikel 5, onderdelen e of f][ref1], betreft,
      voor zover van toepassing, een kozijnstaat met daarin merk en type van het kozijn en het daarbij behorende frame,
      glas en netto afmetingen van het glas;


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '5'
  - number: 13.g
    text: 'indien het een investering in een duurzame warmteoptie betreft, een document waaruit blijkt dat een investering:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.g.1°
    text: in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.g.2°
    text: voldoet aan de technische eisen; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: 13.g.3°
    text: is geïnstalleerd of aangebracht door een branchegerelateerd bedrijf.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel13
  - number: '14.1'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: 14.1.a
    text: |-
      indien subsidie wordt aangevraagd van € 25.000 of meer voor maatregelen, duurzame warmteopties, een maatwerkadvies
      of een duurzaam monumentenadvies, die maatregelen uiterlijk 24 maanden na subsidieverlening uit te voeren;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: 14.1.b
    text: |-
      de in het kader van de subsidieverlening gevoerde administratie te bewaren tot tien belastingjaren na de datum van
      de beschikking tot subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: 14.1.c
    text: |-
      de huurder te informeren over de hoogte van het subsidiebedrag dat hij ontvangt, uiterlijk binnen een week na het
      moment dat hij de beschikking tot vaststelling van de subsidie ontvangt.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de uitvoering van de maatregelen binnen de termijn, genoemd in het eerste lid, buiten de schuld van de
      subsidieontvanger niet mogelijk is, kan de Minister die termijn op schriftelijk en gemotiveerd verzoek van de
      subsidieontvanger eenmaal met ten hoogste twaalf maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: '14.3'
    text: |-
      Een installatie, waarop de investering in een duurzame warmteoptie betrekking heeft, en waarvoor op grond van deze
      regeling een subsidie is verleend, wordt niet binnen een jaar na de datum van de subsidievaststelling vervreemd.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het derde lid is niet van toepassing op de vervreemding van een installatie tezamen met de woning waarin
      respectievelijk waarop de investering in een duurzame warmteoptie is geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14
  - number: 14a.1
    text: |-
      Een subsidieaanvraag die mogelijk is geworden vanaf het moment van inwerkingtreding van de **Regeling van de
      Minister voor Volkshuisvesting en Ruimtelijke Ordening van 1 februari 2023, nr. 2022-0000535845, tot wijziging
      van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH) in verband met het verruimen van de
      doelgroep, het toegankelijker maken van maatregelen voor monumentale huurwoningen, en het vervallen van de twee
      maatregeleneis** komt slechts voor subsidie in aanmerking als de maatregel wordt uitgevoerd na 31 maart 2023.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.2
    text: |-
      De Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH) zoals die gold direct voorafgaand aan het moment
      van inwerkingtreding van de **Regeling van de Minister voor Volkshuisvesting en Ruimtelijke Ordening van 1 februari
      2023, nr. 2022-0000535845, tot wijziging van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH) in
      verband met het verruimen van de doelgroep, het toegankelijker maken van maatregelen voor monumentale huurwoningen,
      en het vervallen van de twee maatregeleneis** blijft van toepassing voor verhuurders die voor 1 april 2023:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.2.a
    text: een subsidieaanvraag hebben ingediend; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.2.b
    text: aangevangen zijn met de uitvoering van maatregelen en een subsidieaanvraag hebben ingediend voor 1 april 2025.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Onder een maatwerkadvies als bedoeld in [artikel 7, eerste lid][ref1], komt ook voor subsidie mede in aanmerking
      een energieadvies dat in de periode tot 1 juli 2024 is opgesteld door een persoon die voldoet aan de eisen aan de
      vakbekwaamheid van ‘EPA-adviseur’ conform bijlage 2 van BRL 9500, deel 2.


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel7
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '7'
  - number: 14a.4
    text: |-
      Een subsidieaanvraag die mogelijk is geworden vanaf het moment van inwerkingtreding van de **Regeling van de
      Minister van Volkshuisvesting en Ruimtelijke Ordening van 27 december 2024 nr. 2024-0000945659, tot wijziging
      van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen in verband met het verlengen van de regeling, het
      verbreden van de regeling met duurzame warmteopties, het introduceren van een bonus voor biobased milieuvriendelijk
      isolatiemateriaal en het duurzaam monumentenadvies, en enkele andere maatregelen om de regeling beter aan te laten
      sluiten op de doelgroep** komt slechts voor subsidie in aanmerking als de maatregel is uitgevoerd na 31 december
      2024.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.5
    text: |-
      De Subsidieregeling Verduurzaming en Onderhoud Woningen (SVOH) zoals die gold direct voorafgaand aan het moment
      van inwerkingtreding van de **Regeling van de Minister van Volkshuisvesting en Ruimtelijke Ordening van 27 december
      2024 nr. 2024-0000945659, tot wijziging van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen in verband
      met het verlengen van de regeling, het verbreden van de regeling met duurzame warmteopties, het introduceren van
      een bonus voor biobased milieuvriendelijk isolatiemateriaal en het duurzaam monumentenadvies, en enkele andere
      maatregelen om de regeling beter aan te laten sluiten op de doelgroep** blijft van toepassing op verhuurders die na
      31 maart 2023 en voor 1 januari 2025:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.5.a
    text: een subsidieaanvraag hebben ingediend; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.5.b
    text: aangevangen zijn met de uitvoering van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.6
    text: |-
      Een subsidieaanvraag die mogelijk is geworden vanaf het moment van inwerkingtreding van de Regeling van de
      Minister van Volkshuisvesting en Ruimtelijke Ordening, van 9 december 2025, nr. 2025-0000034214 tot wijziging
      van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH) in verband met de wijziging van technische
      voorschriften en de subsidievoorwaarden, komt slechts voor subsidie in aanmerking als de maatregel is uitgevoerd na
      31 december 2025.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.7
    text: |-
      De Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH) zoals die gold direct voorafgaand aan het moment
      van inwerkingtreding van de Regeling van de Minister van Volkshuisvesting en Ruimtelijke Ordening, van 9 december
      2025, nr. 2025-0000034214 tot wijziging van de Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH)
      in verband met de wijziging van technische voorschriften en de subsidievoorwaarden, blijft van toepassing voor
      verhuurders die voor 1 januari 2026:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.7.a
    text: een subsidieaanvraag hebben ingediend; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14a.7.b
    text: aangevangen zijn met de uitvoering van maatregelen en een subsidieaanvraag hebben ingediend voor 1 januari 2026.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14a
  - number: 14b
    text: |-
      Ter bepaling van de subsidiehoogte wisselen de Rijksdienst voor Ondernemend Nederland en de uitvoeringsorganisatie
      belast met de uitvoering van Maatregel 29 onderling uitsluitend de volgende gegevens uit:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14b
  - number: 14b.a
    text: het adres van de woning waarvoor subsidie wordt aangevraagd of is verleend;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14b
  - number: 14b.b
    text: de gesubsidieerde activiteiten;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14b
  - number: 14b.c
    text: |-
      de naam van de regeling waarvoor eerder subsidie is verkregen, het subsidiebedrag en de datum van de beschikking
      tot subsidieverlening- en vaststelling; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14b
  - number: 14b.d
    text: indien noodzakelijk, de facturen van de gesubsidieerde activiteiten.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel14b
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van 1 april 2022 en vervalt met ingang van 1 januari 2030, met dien
      verstande dat zij van toepassing blijft op subsidies die op grond van deze regeling vóór laatstgenoemde datum zijn
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling Verduurzaming en Onderhoud Huurwoningen (SVOH).'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel16
