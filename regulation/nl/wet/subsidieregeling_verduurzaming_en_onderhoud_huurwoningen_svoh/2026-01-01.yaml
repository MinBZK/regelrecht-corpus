preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, en 4, eerste lid, van de Kaderwet overige BZK-subsidies en de artikelen 6,
    vijfde lid, onderdeel b, en zevende lid, 8, eerste en tweede lid, 11, eerste, tweede en derde lid, 14, en 20 van
    het Kaderbesluit BZK-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *adres:* adres als bedoeld in
      [artikel 1, onderdeel a, van de Wet basisregistratie adressen en gebouwen][ref1];
        - *algemene groepsvrijstellingsverordening:* [Verordening (EU) 651/2014](32014R0651) van de Commissie van 17 juni
      2014 zoals laatst gewijzigd bij [Verordening (EU) 2023/1315](32023R1315), waarbij bepaalde categorieën steun op
      grond van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie met de interne markt
      verenigbaar worden verklaard (PbEU 2023, L 167);
        - *biobased milieuvriendelijk isolatiemateriaal:* isolatiemateriaal waarvan ten minste 70% van de massa bestaat
      uit biobased materiaal als bedoeld in de EN16575:2014, zoals blijkt uit de materiaalsamenstelling van het product
      genoemd in de environmental product declaration van de fabrikant, en met een maximale milieukostenindicator van
      1,9, genoemd in de categorie 1-kaart als bedoeld in de Nationale Milieudatabase van het betreffende product, bij
      een Rd- of Rbf-waarde van 3,5 [m2K/W];
        - *branchegerelateerd bedrijf:* bedrijf dat in een handelsregister van een lidstaat van de Europese Unie of een van
      de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is ingeschreven in
      de sectie bouwnijverheid, bouwinstallatiebedrijf of een vergelijkbare sectie;
        - *de-minimisverordening:* [Verordening (EU) nr. 2023/2831](32023R2831) van de Commissie van 13 december 2023
      betreffende de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie
      op de-minimissteun (PbEU 2023, L 2023/2831);
        - *duurzaam monumentenadvies:* een advies als bedoeld in artikel 7, tweede lid;
        - *duurzame warmteoptie:* warmteoptie als bedoeld in artikel 5a;
        - *energiebesparende maatregelen:* maatregelen als bedoeld in [artikel 5][ref2];
        - *EP-maatwerkadviseur:* een persoon die voldoet aan de eisen aan de vakbekwaamheid van ‘EP-maatwerkadviseur’
      conform bijlage 2 van BRL 9500-MWA-W;
        - *EPREL:* productendatabank als bedoeld in artikel 12 van [verordening (EU) nr. 2017/1369](32017R1369) van het
      Europees Parlement en de Raad van 4 juli 2017 tot vaststelling van een kader voor energie-etikettering en tot
      intrekking van [Richtlijn 2010/30/EU](32010L0030) (PbEU 2017, L 198);
        - *ERM-adviseur:* een persoon die voldoet aan de eisen aan de vakbekwaamheid van de Beoordelingsrichtlijn Erkend
      Monumenten Adviesbureau (BRL ERM 2000) en werkt conform de Uitvoeringsrichtlijn Bouwtechnisch Advies (URL 2001);
        - *etiket:* gedrukt etiket als bedoeld in artikel 3, eerste lid, onderdeel a, van [verordening (EU) nr. 811/2013]
      (32013R0811) of artikel 3, eerste lid, onderdeel a, van [verordening (EU) nr. 812/2013](32013R0812);
        - *gebouw:* bouwwerk dat een voor mensen toegankelijke overdekte geheel of gedeeltelijk met wanden omsloten ruimte
      vormt en in de basisregistratie als bedoeld in [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref3]
      als pand een identificatiecode heeft als bedoeld in [artikel 19, eerste lid, aanhef en onder a, van die wet][ref4];
        - *GWP:* aardopwarmingsvermogen, als bedoeld in artikel 3, onderdeel 1, van [verordening (EU) 2024/573]
      (32024R0573);
        - *HR++ glas:* glas met een maximale U-waarde van 1,2 [W/m2K];
        - *huurwoning:* in Nederland gelegen voor verhuur bestemde bestaande woonruimte als bedoeld in
      [artikel 233 van Boek 7 van het Burgerlijk Wetboek][ref5] die als zodanig of als onderdeel daarvan
      verhuurd is geweest alvorens een eventuele renovatie plaatsvindt en in de basisregistratie als bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref6] met een woonfunctie, standplaats of ligplaats
      is geregistreerd, met uitzondering van een woning die wordt verhuurd in het kader van het hotel-, pension-, kamp-
      en vakantiebestedingsbedrijf aan personen die in die woning voor een korte periode verblijf houden;
        - *isolerende kozijnpanelen:* kozijnpanelen met minimaal dezelfde U-waarde als de glassoort waarmee deze worden
      gecombineerd in de kozijnen, met uitzondering van kozijnpanelen bij monumenten waarvoor een U-waarde wordt
      vastgesteld;
        - *Kaderbesluit:* [Kaderbesluit BZK-subsidies][ref7];
        - *maatregel:* energiebesparende maatregel of onderhoudsmaatregel;
        - *maatwerkadvies:* een advies als bedoeld in [artikel 7, eerste lid][ref8];
        - *meldcode:* code beschikbaar gesteld door de Minister: a. per type en merk installatie voor duurzame
      warmteopties; b. per soort isolatiemateriaal voor energiebesparende isolatiemaatregelen;
        - *Minister:* Minister van Volkshuisvesting en Ruimtelijke Ordening;
        - *monumentale huurwoning:* huurwoning die zelfstandig of als onderdeel van een gebouw deel uitmaakt van cultureel
      erfgoed dat is ingeschreven als: a. monument of archeologisch monument in het rijksmonumentenregister, bedoeld
      in [artikel 3.3 van de Erfgoedwet][ref9]; b. cultureel erfgoed in een gemeentelijk erfgoedregister als bedoeld in
      [artikel 3.16, derde lid, van de Erfgoedwet][ref10]; of c. cultureel erfgoed in een provinciaal erfgoedregister als
      bedoeld in [artikel 3.17, derde lid, van de Erfgoedwet][ref11];
        - *onderhoudsmaatregelen:* maatregelen als bedoeld in [artikel 6][ref12];
        - *prestatieverklaring:* prestatieverklaring als bedoeld in artikel 2.14 van het Besluit bouwwerken leefomgeving;
        - *productkaart:* productkaart als bedoeld in artikel 3, eerste lid, onderdeel b, van [verordening (EU)
      nr. 811/2013](32013R0811) of artikel 3, eerste lid, onderdeel b, van [verordening (EU) nr. 812/2013](32013R0812);
        - *ruimteverwarmingstoestel:* ruimteverwarmingstoestel met warmtepomp als bedoeld in bijlage I, onderdeel 3 of
      onderdeel 4, van [Verordening (EU) nr. 811/2013](32013R0811) of artikel 2, lid 17 of 18, van [Verordening (EU)
      nr. 813/2013](32013R0813), niet zijnde een lucht-luchtwarmtepomp;
        - *technische documentatie:* technische documentatie als bedoeld in artikel 3, eerste lid, onderdeel c, en
      bijlage V van [verordening (EU) nr. 811/2013](32013R0811), artikel 3, eerste lid, onderdeel c, en bijlage V
      van [verordening (EU) nr. 812/2013](32013R0812) of productinformatie als bedoeld in bijlage II, vijfde lid, van
      [Verordening (EU) nr. 813/2013](32013R0813);
        - *thermisch vermogen bij bivalente temperatuur:* thermisch vermogen bij bivalente temperatuur als bedoeld in tabel
      8 van bijlage V van [verordening (EU) nr. 811/2013](32013R0811) of tabel 2 van bijlage II van [Verordening (EU)
      nr. 813/2013](32013R0813);
        - *thermisch vermogen bij referentieontwerptemperatuur:* thermisch vermogen bij referentieontwerptemperatuur als
      bedoeld in tabel 10 van bijlage VII van [verordening (EU) nr. 811/2013](32013R0811) of tabel 4 van bijlage III van
      [Verordening (EU) nr. 813/2013](32013R0813);.
        - *thermische schil:* thermische schil als beschreven in ISSO 82.1;
        - *triple-glas:* glas met een maximale U-waarde van 0,7 [W/m2K];
        - *verordening (EU) 2024/573:* [verordening (EU) 2024/573](32024R0573) van het Europees Parlement en de Raad van
      7 februari 2024 betreffende gefluoreerde broeikasgassen, tot wijziging van [Richtlijn (EU) 2019/1937](32019L1937)
      en tot intrekking van [Verordening (EU) nr. 517/2014](32014R0517);
        - *verordening (EU) nr. 811/2013:* [verordening (EU) nr. 811/2013](32013R0811) van de Commissie van
      18 februari 2013 ter aanvulling van [Richtlijn 2010/30/EU](32010L0030) van het Europees Parlement en de
      Raad wat de energie-etikettering van ruimteverwarmingstoestellen, combinatieverwarmingstoestellen, pakketten
      van ruimteverwarmingstoestellen, temperatuurregelaars en zonne-energie-installaties en pakketten van
      combinatieverwarmingstoestellen, temperatuurregelaars en zonne-energie-installaties betreft (PbEU 2013, L 239);
        - *verordening (EU) nr. 812/2013:* [verordening (EU) nr. 812/2013](32013R0812) van de Commissie van 18 februari
      2013 ter aanvulling van [Richtlijn 2010/30/EU](32010L0030) van het Europees Parlement en de Raad wat de energie-
      etikettering van waterverwarmingstoestellen, warmwatertanks en pakketten van waterverwarmingstoestellen en zonne-
      energie-installaties betreft (PbEU 2013, L 239);
        - *verordening (EU) nr. 813/2013:* [verordening (EU) nr. 813/2013](32013R0813) van de Commissie van 2 augustus
      2013 tot uitvoering van [Richtlijn 2009/125/EG](32009L0125) van het Europees Parlement en de Raad wat eisen inzake
      ecologisch ontwerp voor ruimteverwarmingstoestellen en combinatieverwarmingstoestellen betreft (PbEU 2013, L 239);
        - *waterverwarmingstoestel:* waterverwarmingstoestel met warmtepomp als bedoeld in artikel 2, onderdeel zeventien,
      van [verordening (EU) nr. 812/2013](32013R0812).


