        bwb_id: BWBR0046234
        artikel: '8'
  - number: 11.1.b
    text: |-
      de aanvraag een subsidie betreft als bedoeld in [artikel 8, eerste lid, onderdeel b][ref1], en er reeds door een
      ander of hetzelfde bestuursorgaan subsidie is verstrekt aan de aanvrager voor het uitvoeren van dezelfde maatregel,
      bedoeld in artikel 8, eerste lid, onderdeel b, bij dezelfde huurwoningen of monumentale huurwoningen;


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel8
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
    references:
