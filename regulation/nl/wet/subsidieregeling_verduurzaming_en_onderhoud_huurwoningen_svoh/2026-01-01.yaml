    text: |-
      er sprake is van een onderneming in moeilijkheden als bedoeld artikel 2, achttiende lid, van de algemene
      groepsvrijstellingsverordening of een onderneming ten aanzien waarvan een bevel tot terugvordering van steun
      uitstaat als bedoeld in artikel 1, vierde lid, onder a, van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.c.3°
    text: |-
      een bedrag aan subsidie verstrekt zou worden dat hoger is dan geoorloofd is op grond van artikel 38 bis, elfde lid,
      van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.c.4°
    text: |-
      als de subsidieontvanger een onderneming is of als de subsidiabele kosten worden gemaakt en betaald door een
      onderneming, de gekozen maatregelen niet gezamenlijk leiden tot een verbetering van de energieprestatie van het
      gebouw, gemeten in primaire energie van ten minste 20%;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.c.5°
    text: |-
      een bedrag aan subsidie verstrekt zou worden dat hoger is dan geoorloofd is op grond van artikel 41, zevende lid,
      van de algemene groepsvrijstellingsverordening; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.c.6°
    text: |-
      een bedrag aan subsidie verstrekt zou worden dat hoger is dan geoorloofd is op grond van artikel 49, derde lid, van
      de algemene groepsvrijstellingsverordening; of.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.d
    text: |-
      de aanvraag een subsidie betreft als bedoeld in de [artikelen 5][ref1], [5a][ref2], [6][ref3] of [7][ref4] die
      wordt verleend met toepassing van de de-minimisverordening en een bedrag aan subsidie verstrekt zou worden dat
      hoger is dan geoorloofd is op grond van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0046234#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0046234#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0046234#Artikel7
