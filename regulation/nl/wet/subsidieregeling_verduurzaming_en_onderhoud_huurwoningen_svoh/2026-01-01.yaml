  - number: '9.2'
    text: |-
      In het geval een aanvraag voor subsidie voor één maatregel wordt ingediend, bedraagt het subsidiebedrag de helft
      van het subsidiebedrag, bedoeld in het eerste lid, tenzij de aanvraag:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9
  - number: 9.2.a
    text: 'mede betrekking heeft op een duurzame warmteoptie: of'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9
  - number: 9.2.b
    text: |-
      betrekking heeft op alle woningen in hetzelfde gebouw en er ten aanzien van dat gebouw ten minste een tweede
      maatregel of een duurzame warmteoptie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      In het geval binnen 24 maanden vanaf het moment van de subsidiebeschikking voor één maatregel een subsidieaanvraag
      voor een tweede maatregel in dezelfde huurwoning of monumentale huurwoning wordt ingediend, bedraagt het
      subsidiebedrag voor zowel de eerste als de tweede maatregel het volledige subsidiebedrag, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9
  - number: 9a.1
    text: 'De subsidie voor duurzame warmteopties bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.a
    text: |-
      een verwarmingstoestel dat is of wordt geïnstalleerd en is uitgerust met een lucht-waterwarmtepomp als bedoeld
      in artikel 5a, onderdeel a, onder 1°, bij een thermisch vermogen ten behoeve van ruimteverwarming bij bivalente
      temperatuur:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.a.1°
    text: 'tot 1 kW lucht-waterwarmtepomp ten behoeve van (tap)waterverwarming: € 500;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.a.2°
    text: |-
      vanaf 1 kW tot en met 70 kW en behorend tot de energie-efficiëntieklasse A++ of hoger: € 1.025, vermeerderd met
      € 225 voor elke kW thermisch vermogen bij bivalente temperatuur vanaf 0 kW;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.a.3°
    text: 'van 71 kW of meer: € 1.500, vermeerderd met € 150 voor elke kW thermisch vermogen hoger dan 0 kW;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.b
    text: |-
      een verwarmingstoestel dat is of wordt geïnstalleerd en is uitgerust met een grond-waterwarmtepomp of met
      een water-waterwarmtepomp als bedoeld in artikel 5a, onderdeel a, onder 1°, bij een thermisch vermogen bij
      referentieontwerptemperatuur:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.b.1°
    text: 'tot 1 kW grond-waterwarmtepomp of water-waterwarmtepomp ten behoeve van (tap)waterverwarming: € 500;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.b.2°
    text: 'Van 1 kW tot en met 10 kW en behorend tot de energie-efficiëntieklasse A++ of hoger: € 4.200;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.b.3°
    text: |-
      van meer dan 10 kW tot en met 70 kW en behorend tot de energie-efficiëntieklasse A++ of hoger: € 4.200, vermeerderd
      met € 150 voor elke kW thermisch vermogen hoger dan 10 kW;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.b.4°
    text: 'van 71 kW of meer: € 3.750, vermeerderd met € 150 voor elke kW thermisch vermogen hoger dan 10 kW;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.c
    text: 'een zonneboiler als bedoeld in artikel 5a, onderdeel b, die is of wordt geïnstalleerd:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.c.1°
    text: |-
      € 1,02 per kWh jaarlijkse zonne-energiebijdrage van de zonneboiler bij een apertuuroppervlakte van ten hoogste
      5 vierkante meter;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.c.2°
    text: |-
      € 0,55 per kWh jaarlijkse zonne-energiebijdrage van een zonneboiler bij een apertuuroppervlakte van meer dan 5 tot
      ten hoogste 10 vierkante meter;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.1.c.3°
    text: |-
      € 0,28 per kWh jaarlijkse zonne-energiebijdrage van een zonneboiler met een apertuuroppervlakte van meer dan
      10 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.2
    text: |-
      De subsidie, bedoeld in het eerste lid, onderdeel a, subonderdeel 1°, en onderdeel b, subonderdeel 1°, wordt
      verhoogd met:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.2.a
    text: |-
      € 225, indien de warmtepomp tot 1 kW ten behoeve van tapwaterverwarming blijkens het etiket behoort tot de energie-
      efficiëntieklasse A+;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.2.b
    text: |-
      € 450, indien de warmtepomp tot 1 kW ten behoeve van tapwaterverwarming blijkens het etiket behoort tot de energie-
      efficiëntieklasse A++.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.3
    text: 'De subsidie, wordt verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.3.a
    text: |-
      € 200, indien de warmtepomp tot en met 70 kW, bedoeld in het eerste lid, onderdeel a, subonderdeel 2°, blijkens het
      etiket behoort tot de energie-efficiëntieklasse A+++ of hoger;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.3.b
    text: |-
      € 225, indien de warmtepomp tot en met 70 kW, bedoeld in het eerste lid, onderdeel b, subonderdeel 2° en 3°,
      blijkens het etiket behoort tot de energie-efficiëntieklasse A+++ of hoger.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.4
    text: |-
      De jaarlijkse zonne-energiebijdrage, bedoeld in het eerste lid, onderdeel c, wordt voor zonneboilers vastgesteld
      op:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.4.a
    text: |-
      2.799 kWh, minus het jaarlijks aandeel van niet uit zonne-energie verkregen warmte volgens de productkaart conform
      het capaciteitsprofiel L, en minus het supplementair elektriciteitsgebruik volgens de productkaart, indien er
      sprake is van een apertuuroppervlakte van ten hoogste 5 vierkante meter;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.4.b
    text: |-
      4.427 kWh, minus het jaarlijks aandeel van niet uit zonne-energie verkregen warmte volgens de productkaart conform
      het capaciteitsprofiel XL, en minus het supplementair elektriciteitsgebruik volgens de productkaart, indien er
      sprake is van een apertuuroppervlakte van meer dan 5 en ten hoogste 10 vierkante meter;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.4.c
    text: |-
      het product van 1.293 kWh, het totale collectoroppervlak van alle collectoren volgens de productkaart, het
      collectorrendement volgens de productkaart, de instralingshoekmodifier volgens de productkaart en de verliesfactor
      van de warmwatertank, bedoeld in het vijfde of zesde lid, indien er sprake is van een apertuuroppervlakte van meer
      dan 10 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Afhankelijk van de energie-efficiëntieklasse vermeld op het etiket of de energie-efficiëntieklasse vastgesteld
      volgens de methode, bedoeld in bijlage II, onderdeel 2, van [verordening (EU) nr. 812/2013](32013R0812), bedraagt
      de verliesfactor van de warmwatertank, bedoeld in het vierde lid, onderdeel c:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5.a
    text: 0,95 bij energie-efficiëntieklasse A+;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5.b
    text: 0,91 bij energie-efficiëntieklasse A;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5.c
    text: 0,86 bij energie-efficiëntieklasse B;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5.d
    text: 0,83 bij energie-efficiëntieklasse C;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.5.e
    text: 0,81 bij energie-efficiëntieklasse D tot en met G.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.6
    text: |-
      In afwijking van het vijfde lid bedraagt de verliesfactor voor een warmwatertank met een volume van 2.000 liter en
      meer 0,81.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9a.7
    text: |-
      Voor zover de subsidieaanvraag betrekking heeft of mede betrekking heeft op een tweede of volgende investering
      in een lucht-waterwarmtepomp met een vermogen vanaf 1 kW, wordt per aanvrager per adres of per gebouw, het
      basisbedrag, bedoeld in het eerste lid, onderdelen 2° en 3°, alsmede de verhoging, bedoeld in het derde lid,
      slechts éénmaal verstrekt voor deze investering of niet nogmaals verstrekt indien het basisbedrag en de verhoging
      reeds bij een eerdere subsidieaanvraag zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9a
  - number: 9b.1
    text: |-
      Indien is geïnvesteerd in biobased milieuvriendelijk isolatiemateriaal, wordt de op grond van artikel 9, eerste
      lid, onder a tot en met d, berekende subsidie per vierkante meter vermeerderd met:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.1.a
    text: 'in geval van dakisolatie: € 5 per m2;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.1.b
    text: 'in geval van zolder- of vlieringisolatie of spouwmuurisolatie: € 1,50 per m2;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.1.c
    text: 'in geval van gevelisolatie: € 6 per m2;'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.1.d
    text: 'in geval van vloerisolatie: € 2 per m2; en'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.1.e
    text: 'in geval van een investering in bodemisolatie: € 1 per m2.'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9b.2
    text: |-
      De bedragen, genoemd in het eerste lid, worden niet gehalveerd in het geval er sprake is van de situatie, bedoeld
      in artikel 9, tweede lid, en het biobased milieuvriendelijk isolatiemateriaal betreft.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9b
  - number: 9c.1
    text: |-
      Het subsidiebedrag voor investeringen in maatregelen, een maatwerkadvies of een duurzaam monumenten advies bedraagt
      ten hoogste € 10.000 per huurwoning of monumentale huurwoning.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9c
  - number: 9c.2
    text: |-
      Het subsidiebedrag voor investeringen in maatregelen, duurzame warmteopties, een maatwerkadvies of duurzaam
      monumentenadvies bedraagt ten hoogste € 15.000 per huurwoning of monumentale huurwoning.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel9c
  - number: '10.1'
    text: Een aanvraag voor subsidie kan worden ingediend van 1 april 2022 tot 1 januari 2030.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het aanvraagformulier dat door de Minister ter beschikking is
      gesteld op de website van de Rijksdienst voor Ondernemend Nederland.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: '10.3'
    text: Een aanvraag kan betrekking hebben op meerdere huurwoningen of monumentale huurwoningen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: '10.4'
    text: |-
      In plaats van de gegevens en bescheiden, genoemd in [artikel 11, derde lid, van het Kaderbesluit][ref1], bevat een
      aanvraag in ieder geval de volgende gegevens en verklaringen:


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel11
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '11'
  - number: 10.4.a
    text: |-
      het adres, de postcode en het huisnummer en toevoeging van iedere huurwoning of monumentale huurwoning ten behoeve
      waarvan subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.b
    text: het bankrekeningnummer waarop het subsidiebedrag dient te worden overgemaakt;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.c
    text: bij aanvragen van € 25.000 of meer de verwachte aanvangs- en einddatum van de uitvoering van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.d
    text: |-
      bij aanvragen van € 25.000 of meer door de verhuurder ondertekende offertes voor de te uit te voeren maatregelen,
      onder vermelding, voor zover van belang voor de subsidieverstrekking, van de aantallen of de oppervlakten
      waarover de onderscheiden maatregelen worden uitgevoerd, alsmede van de energetische kwaliteit van de te uitvoeren
      maatregelen;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.e
    text: |-
      een verklaring waaruit blijkt dat de aanvrager geen subsidie van een ander of hetzelfde bestuursorgaan heeft
      ontvangen voor het uitvoeren van dezelfde activiteiten, bedoeld in [artikel 8][ref1], bij dezelfde huurwoning of
      monumentale huurwoning dan wel huurwoningen of monumentale huurwoningen;


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel8
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '8'
  - number: 10.4.f
    text: |-
      indien ook subsidie wordt aangevraagd voor maatwerkadvies of een duurzaam monumentenadvies, een verklaring dat
      daarvoor niet reeds subsidie is aangevraagd bij of verstrekt door een ander of hetzelfde bestuursorgaan;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.g
    text: |-
      de naam, het adres en het inschrijfnummer bij de Kamer van Koophandel van de certificaathouder die het
      maatwerkadvies of het duurzaam monumentenadvies heeft opgesteld, alsmede het nummer van het certificaat;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.h
    text: |-
      de naam en het adres van de EP-maatwerkadviseur die de huurwoning of de monumentale huurwoning heeft opgenomen ten
      behoeve van het maatwerkadvies alsmede de naam, het adres, het inschrijfnummer bij de Kamer van Koophandel en het
      nummer van het certificaat van de certificaathouder waarvoor hij werkt, indien dit niet de certificaathouder is,
      bedoeld in onderdeel g;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.i
    text: |-
      de naam en het adres van de ERM-adviseur die de monumentale huurwoning heeft opgenomen ten behoeve van het duurzaam
      monumentenadvies alsmede de naam, het adres, het inschrijfnummer bij de Kamer van Koophandel en het nummer van
      het certificaat van de certificaathouder waarvoor hij werkt, indien dit niet de certificaathouder is, bedoeld in
      onderdeel g;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.j
    text: |-
      indien van toepassing, een verklaring waaruit blijkt dat de subsidieaanvrager voor de activiteiten waarvoor op
      grond van deze regeling subsidie wordt aangevraagd niet meer steun ontvangt dan is toegestaan op grond van de de-
      minimisverordening;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.k
    text: |-
      indien sprake is van een verhuurder waarbij meer dan 250 personen werkzaam zijn en waarvan tevens de jaaromzet
      hoger is dan € 50.000.000, dan wel het jaarlijkse balanstotaal hoger is dan € 43.000.000, een verklaring waaruit
      blijkt dat als gevolg van de subsidie sprake is van een wezenlijke toename van:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.k.1°
    text: |-
      het aantal energiebesparende maatregelen, het aantal duurzame warmteopties, de onderhoudsmaatregelen of het aantal
      maatwerkadviezen;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.k.2°
    text: |-
      de totale uitgaven van de verhuurder voor de energiebesparende maatregelen, de duurzame warmteopties, de
      onderhoudsmaatregelen, het maatwerkadvies of het duurzaam monumentenadvies; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.k.3°
    text: |-
      De snelheid waarmee de energiebesparende maatregelen, de duurzame warmteopties, de onderhoudsmaatregelen, het
      maatwerkadvies of het duurzaam monumentenadvies worden voltooid;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.l
    text: |-
      indien de aanvraag ziet op een monumentale huurwoning, kan de Minister aanvullend bewijs vragen waaruit blijkt dat
      de monumentale huurwoning geregistreerd staat als monument;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.m
    text: de meldcode, indien er een meldcode beschikbaar is gesteld;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.n
    text: |-
      indien het een investering voor een ruimteverwarmingstoestel of een waterverwarmingstoestel als bedoeld in artikel
      5a, onderdeel a, betreft:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.n.1°
    text: het thermische vermogen bij bivalente of referentieontwerptemperatuur van deze installatie;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.n.2°
    text: |-
      vergezeld van de volledige berekening volgens tabel 8 van [verordening (EU) 811/2013](32013R0811) of tabel 2 van
      [verordening (EU) 813/2013](32013R0813) en het type en vulgewicht van het koudemiddel; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.4.o
    text: |-
      indien het een investering voor een zonneboiler als bedoeld in artikel 5a, onderdeel b, betreft, de gegevens ten
      aanzien van de energetische opbrengst van deze installatie.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: '10.5'
    text: 'Bij aanvragen van minder dan € 25.000 worden tevens de volgende gegevens en zaken meegestuurd:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.a
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen, met daarin ten minste de naam en het adres van de
      eigenaar en het branchegerelateerde bedrijf dat werkzaamheden betreffende de investering of investeringen heeft
      uitgevoerd, de plaats waar het isolatiemateriaal gebruikt is en bijhorende oppervlakte voor elk van de ingediende
      huurwoningen of monumentale huurwoningen die geïsoleerd zijn, en indien er geen meldcode beschikbaar is gesteld:
      een omschrijving van het soort energiebesparende isolatiemaatregel en samenhangende werkzaamheden die door het
      branchegerelateerde bedrijf uitgevoerd zijn, de naam, het type, het merk, de dikte, van het isolatiemateriaal dat
      gebruikt is;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.b
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen van de aanschaf en de installatie van een duurzame
      warmteoptie, waaronder begrepen de door het branchegerelateerde bedrijf ondertekende factuur in geval van contante
      betaling van de investeringen, waarop ten minste het betaalde bedrag, de begunstigde en de betaaldatum vermeld
      wordt;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.c
    text: |-
      factuur of facturen en betaalbewijs of betaalbewijzen voor de onderhoudsmaatregelen, met een nadere onderbouwing
      van kozijnomvang in m2 en gebruikt product en merk en type van de nieuwe vervangende ventilatiebox;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.d
    text: |-
      mits van toepassing, een factuur en betaalbewijs van het uitgevoerde maatwerkadvies of duurzaam monumentenadvies
      voor de betreffende huurwoning of monumentale huurwoning dan wel huurwoningen of monumentale huurwoningen, waarvoor
      de verhuurder subsidie aanvraagt via deze regeling;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.e
    text: |-
      ten minste één foto per energiebesparende isolatie- en onderhoudsmaatregel, genomen tijdens de uitvoering van de
      werkzaamheden door het branchegerelateerde bedrijf, met daarop zichtbaar de naam, merk, soort, en dikte van het
      isolatiemateriaal of merk en type ventilatiebox;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.5.f
    text: |-
      indien het een investering voor glas, voor- of achterzetbeglazing of kozijnpaneel- of deurisolatie als bedoeld
      in [artikel 5, onderdelen e, f of g][ref1] betreft, voor zover van toepassing, een kozijnstaat met daarin merk en
      type van het kozijn en het daarbij behorende frame, glas en netto afmetingen van het glas of de kozijnpanelen per
      kozijn.


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '5'
  - number: '10.6'
    text: |-
      Indien een aanvraag betrekking heeft op alle huurwoningen of monumentale huurwoningen in hetzelfde gebouw, bevat,
      in afwijking van het vierde lid, onder a en d, en vijfde lid, onder a, de aanvraag:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.6.a
    text: |-
      het adres of de kadastrale aanduiding van het gebouw of de identificatiecode van het pand als bedoeld in
      [artikel 19, eerste lid, aanhef en onder a, van de Wet basisregistratie adressen en gebouwen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023466#Artikel19
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023466
        artikel: '19'
  - number: 10.6.b
    text: |-
      bij aanvragen van minder dan € 25.000: factuur of facturen en betaalbewijs of betaalbewijzen, met daarin ten
      minste de naam en het adres van de eigenaar en het branchegerelateerde bedrijf dat werkzaamheden betreffende de
      investering of investeringen heeft uitgevoerd, de plaats waar het isolatiemateriaal gebruikt is en bijhorende
      totale oppervlakte dat geïsoleerd is, en indien er geen meldcode beschikbaar is gesteld: een omschrijving van het
      soort energiebesparende isolatiemaatregel en samenhangende werkzaamheden die door het branchegerelateerde bedrijf
      uitgevoerd zijn, de naam, het type, het merk, de dikte, van het isolatiemateriaal dat gebruikt is;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: 10.6.c
    text: |-
      bij aanvragen van € 25.000 of meer: door de verhuurder ondertekende offertes voor de te uit te voeren maatregelen,
      onder vermelding, voor zover van belang voor de subsidieverstrekking, van de aantallen of de totale oppervlakten
      waarover de onderscheiden maatregelen worden uitgevoerd, alsmede van de energetische kwaliteit van de te uitvoeren
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel10
  - number: '11.1'
    text: 'De Minister wijst de aanvraag voor een subsidie af voor zover:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
  - number: 11.1.a
    text: |-
      de aanvrager reeds subsidie heeft ontvangen van een ander of hetzelfde bestuursorgaan voor het uitvoeren van
      dezelfde maatregelen, bedoeld in [artikel 8, eerste lid, onderdeel a][ref1], bij dezelfde huurwoningen of
      monumentale huurwoningen;


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel8
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel11
    references:
