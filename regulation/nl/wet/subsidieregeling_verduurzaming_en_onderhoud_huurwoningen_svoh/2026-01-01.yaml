        artikel: '6'
  - number: '2'
    text: |-
      Deze regeling heeft tot doel energiebesparing, duurzame warmteopties en onderhoud te stimuleren in bestaande
      huurwoningen en monumentale huurwoningen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij de verstrekking van een subsidie op grond van deze regeling van € 25.000 of meer voor de kosten van
      energiebesparende maatregelen, duurzame warmteopties, een maatwerkadvies en een duurzaam monumentenadvies wordt
      toepassing gegeven aan:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: 3.1.a
    text: artikel 38 bis van de algemene groepsvrijstellingverordening;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: 3.1.b
    text: artikel 41 van de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: 3.1.c
    text: artikel 49 van de algemene groepsvrijstellingsverordening; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: 3.1.d
    text: de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij de verstrekking van subsidie op grond van deze regeling van minder dan € 25.000 voor de kosten van
      energiebesparende maatregelen, duurzame warmteopties, een maatwerkadvies en een duurzaam monumentenadvies wordt
      toepassing gegeven aan de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij de verstrekking van subsidie op grond van deze regeling voor de kosten van onderhoudsmaatregelen wordt
      toepassing gegeven aan de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel3
  - number: '4.1'
    text: Het subsidieplafond bedraagt € 152.000.000.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel4
  - number: '4.2'
    text: De Minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Energiebesparende maatregelen zijn het door een branchegerelateerd bedrijf in een woning laten aanbrengen
      van isolatiemateriaal, dat is voorzien van een prestatieverklaring, voor één of meer van de volgende typen
      energiebesparende maatregelen:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.a
    text: |-
      isoleren van spouwmuren in de bestaande thermische schil met isolatiemateriaal met een minimale Rd-waarde van
      1,1 [m2K/W] voor de gehele daarvoor in aanmerking komende oppervlakten of voor minimaal 10 m2 per huurwoning of
      monumentale huurwoning, waarbij, in het geval lokaal gespoten PIR of PUR wordt aangebracht, dat gebeurt met HFK-
      vrije blaasmiddelen;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.b
    text: |-
      isoleren van de binnen- of buitengevel in de bestaande thermische schil met isolatiemateriaal met een minimale
      Rd-waarde van 3,5 [m2K/W] voor de gehele daarvoor in aanmerking komende oppervlakten of voor minimaal 10 m2 per
      huurwoning of met een minimale Rd-waarde van 2,5 [m2K/W] voor de gehele daarvoor in aanmerking komende oppervlakten
      of voor minimaal 10 m2 per monumentale huurwoning;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.c
    text: |-
      isoleren van het dak in de bestaande thermische schil of het laten isoleren van de zolder- of vlieringvloer in
      de bestaande thermische schil indien de zolder of vliering onverwarmd is, waarbij het niet toegestaan is om een
      combinatie van deze twee isolatievormen gezamenlijk in een subsidieaanvraag in te dienen en waarbij, in het geval
      lokaal gespoten PIR of PUR wordt aangebracht, dat gebeurt met HFK-vrije blaasmiddelen, en waarbij isolatiemateriaal
      wordt gebruikt met een minimale Rd-waarde van 3,5 [m2K/W] voor de gehele daarvoor in aanmerking komende
      oppervlakten of voor minimaal 20 m2 per huurwoning of, als het een monumentale huurwoning betreft, met een minimale
      Rd-waarde van 2,5 [m2K/W] voor de gehele daarvoor in aanmerking komende oppervlakten of voor minimaal 20 m2 per
      monumentale huurwoning;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.d
    text: |-
      isoleren van de vloer dan wel bodem in de bestaande thermische schil, waarbij, in het geval lokaal gespoten PIR
      of PUR wordt aangebracht, dat gebeurt met HFK-vrije blaasmiddelen, en waarbij een minimale Rd- of Rbf-waarde van
      3,5 [m2K/W] wordt behaald voor de gehele daarvoor in aanmerking komende oppervlakten of voor minimaal 20 m2 per
      huurwoning of monumentale huurwoning;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.e
    text: |-
      vervangen van glas, kozijnpanelen of deuren in de bestaande thermische schil of voor minimaal 3 m2 per huurwoning,
      gemeten op basis van binnenwerkse maten, door:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.e.1°
    text: |-
      HR++ glas of nieuwe isolerende kozijnpanelen met een Up-waarde van ten hoogste 1,2 [W/m2K] of nieuwe isolerende
      deuren met een Ud-waarde van ten hoogste 1,5 [W/m2K]; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.e.2°
    text: |-
      triple-glas, in combinatie met een nieuw isolerend kozijn, of nieuwe isolerende kozijnpanelen met een Up-waarde van
      ten hoogste 0,7 [W/m2K] of nieuwe isolerende deuren met een Ud-waarde van ten hoogste 1,0 [W/m2K];
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.f
    text: |-
      vervangen van glas, kozijnpanelen of deuren in de bestaande thermische schil voor minimaal 3 m2 per monumentale
      huurwoning, gemeten op basis van binnenwerkse maten, door hoogrendementsglas met een Ug-waarde van ten hoogste
      2,0 [W/m2K], nieuwe isolerende kozijnpanelen of nieuwe isolerende deuren;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.g
    text: |-
      in de bestaande thermische schil voor minimaal 3 m2 per monumentale huurwoning, gemeten op basis van binnenwerkse
      maten:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.g.1°
    text: |-
      vervangen van voor- of achterzetbeglazing door voor- of achterzetbeglazing met een Ug-waarde van ten hoogste
      2,0 [W/m2K];
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.g.2°
    text: plaatsen van voor- of achterzetbeglazing met een Ug-waarde van ten hoogste 2,0 [W/m2K]; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.g.3°
    text: plaatsen van voor- of achterzetbeglazing met een Ug-waarde van ten hoogste 5,8 [W/m2K];
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.h
    text: 'aanleggen van een ventilatiesysteem door:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.h.1°
    text: |-
      het voor de eerste keer aanleggen van een compleet systeem voor CO-gestuurde ventilatie of het voor de eerste
      keer aanleggen van een compleet systeem voor balansventilatie met warmteterugwinning, met een rendement van ten
      minste 85%, per huurwoning of monumentale huurwoning waarvan de sturing per huurwoning, monumentale huurwoning
      of appartement afzonderlijk is te regelen en waarbij de CO-sensoren ten minste aanwezig zijn in de woonkamer en
      hoofdslaapkamer; of
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5.h.2°
    text: |-
      het voor de eerste keer aanleggen van decentrale balansventilatiesystemen met geïntegreerde CO-sensoren met een
      rendement van ten minste 80%, mits die ten minste in de woonkamer en de hoofdslaapkamer van elke afzonderlijke
      huurwoning, monumentale huurwoning of appartement worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5
  - number: 5a
    text: |-
      Duurzame warmteopties zijn het door een branchegerelateerd bedrijf laten installeren van één of meer van de
      volgende installaties:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a
    text: 'een ruimteverwarmingstoestel of een waterverwarmingstoestel dat:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.1°
    text: is uitgerust met een lucht-waterwarmtepomp, een grond-waterwarmtepomp of een water-waterwarmtepomp;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.2°
    text: |-
      een thermisch vermogen heeft van ten hoogste 400 kW bij bivalente temperatuur in geval van een lucht-
      waterwarmtepomp dan wel bij een referentieontwerptemperatuur in geval van een grond-waterwarmtepomp of een water-
      waterwarmtepomp;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.3°
    text: |-
      is voorzien van een etiket, een productkaart en de bijbehorende technische documentatie en is geregistreerd in
      EPREL, indien sprake is van een installatie met een thermisch vermogen tot en met 70kW;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.4°
    text: |-
      is voorzien van technische documentatie, indien sprake is van een installatie met een thermisch vermogen van 71 kW
      tot ten hoogste 400 kW;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.5°
    text: |-
      geen gezamenlijk thermisch vermogen heeft dat meer is dan 500 kW bij bivalente temperatuur in geval van een
      lucht-waterwarmtepomp dan wel bij een referentieontwerptemperatuur in geval van een grond-waterwarmtepomp of
      een water-waterwarmtepomp, indien sprake is van meerdere warmtepompen aangesloten op hetzelfde verwarmings- of
      afgiftesysteem; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.a.6°
    text: een koudemiddel met een GWP kleiner dan 750 bevat, in geval van een splitwarmtepomp;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.b
    text: 'een zonneboiler, waaronder begrepen een zonneboilercombi, bestaande uit een zonne-energie-installatie die:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.b.1°
    text: |-
      is bedoeld voor het maken van warm tapwater of voor het leveren van ruimteverwarming in combinatie met het maken
      van warm tapwater;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.b.2°
    text: een totale apertuuroppervlakte van ten hoogste 200 m2 per verwarmings- of afgiftesysteem heeft;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.b.3°
    text: is voorzien van een productkaart en de bijbehorende technische documentatie; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: 5a.b.4°
    text: is voorzien van een etiket, indien sprake is van een zonneboilercombi.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel5a
  - number: '6'
    text: 'Onderhoudsmaatregelen zijn het door een branchegerelateerd bedrijf laten:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel6
  - number: 6.a
    text: |-
      plaatsen van een nieuw buitenkozijn van een deur of raam in de bestaande thermische schil waarbij het glas in het
      buitenkozijn een oppervlakte heeft van ten minste 3 m2 per huurwoning of 3 m2 per monumentale huurwoning, gemeten
      op basis van binnenwerkse maten, met uitzondering bij de toepassing van triple glas;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel6
  - number: 6.b
    text: |-
      herstellen van een buitenkozijn van een deur of raam in een monumentale huurwoning in de bestaande thermische
      schil, waarbij het buitenkozijn een oppervlakte betreft van ten minste 3 m2 per monumentale huurwoning, gemeten op
      basis van binnenwerkse maten; en
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel6
  - number: 6.c
    text: vervangen of installeren van een ventilatiebox.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een maatwerkadvies is een op het moment van indiening van de aanvraag niet ouder dan drie jaar door een EP-
      maatwerkadviseur opgesteld rapport dat in EP-online is geregistreerd en het volgende bevat:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: 7.1.a
    text: |-
      een beschrijving van de energieprestatie van de huurwoning of monumentale huurwoning op basis van een ter plekke
      door een EP-maatwerkadviseur uitgevoerde technische en bouwkundige beoordeling van de schil en de installaties van
      de huurwoning of monumentale huurwoning;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: 7.1.b
    text: |-
      een beschrijving van de mogelijk te verrichten maatregelen, met de keuzemogelijkheden en de voor- en nadelen per
      maatregel;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: 7.1.c
    text: |-
      een inschatting van de investering en de te realiseren energiebesparing per mogelijk te verrichten maatregel, welke
      leidt tot een onderbouwde geadviseerde prioritering;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: 7.1.d
    text: de terugverdientijd per mogelijk te verrichten maatregel.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een duurzaam monumentenadvies is een op het moment van indiening van de aanvraag niet ouder dan drie jaar door een
      ERM-adviseur opgesteld rapport dat uitsluitend betrekking heeft op monumentale huurwoningen en minimaal voldoet aan
      niveau 2, waarbij onderzoek wordt gedaan naar de huidige situatie en kansen voor energiebesparing en -opwekking met
      oog voor de monumentale waarden en gebouwgebruik.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De Minister kan aan een verhuurder ten behoeve van een huurwoning of monumentale huurwoning waarvan hij ten tijde
      van de subsidieaanvraag eigenaar is, subsidie verstrekken voor:
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: 8.1.a
    text: |-
      één of meer maatregelen of duurzame warmteopties, waaronder in ieder geval één energiebesparende maatregel of
      duurzame warmteoptie;
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: 8.1.b
    text: een maatwerkadvies of duurzaam monumentenadvies.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Subsidie op grond van het eerste lid, onderdeel b, wordt uitsluitend verstrekt in combinatie met subsidie op grond
      van het eerste lid, onderdeel a, en wanneer het advies is opgesteld voorafgaand aan het uitvoeren van de in het
      advies geadviseerde maatregelen.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      Subsidie op grond van het eerste lid, onderdeel a, wordt slechts verstrekt voor maatregelen die uitgevoerd zijn na
      de datum van inwerkingtreding van deze regeling.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: '8.4'
    text: Per adres wordt voor dezelfde maatregel slechts eenmaal subsidie op grond van dit artikel verstrekt.
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: '8.5'
    text: 'Het vierde lid is niet van toepassing op een tweede aanvraag voor:'
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
  - number: 8.5.a
    text: |-
      de aanschaf en het door een branchegerelateerd bedrijf in een huurwoning of monumentale huurwoning laten vervangen
      of plaatsen van glas, kozijnpanelen, voor- of achterzetbeglazing of deuren in de bestaande thermische schil,
      bedoeld in [artikel 5, onderdeel e, f of g][ref1], die door de verhuurder is ingediend binnen 24 maanden nadat de
      subsidiebeschikking voor de eerste aanvraag voor die energiebesparende maatregel in die huurwoning of monumentale
      huurwoning is verleend; of


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel5
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '5'
  - number: 8.5.b
    text: |-
      de aanschaf en het door een branchegerelateerd bedrijf in een huurwoning of monumentale woning laten plaatsen
      of laten herstellen van een nieuw buitenkozijn van een deur of raam in de bestaande thermische schil, bedoeld
      in [artikel 6, onderdeel a of b][ref1], die door de verhuurder is ingediend binnen 24 maanden nadat de
      subsidiebeschikking voor de eerste aanvraag voor die onderhoudsmaatregel in die huurwoning of monumentale
      huurwoning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0046234#Artikel6
    url: https://wetten.overheid.nl/BWBR0046234/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0046234
        artikel: '6'
  - number: '8.6'
    text: |-
      Er wordt op grond van het eerste lid geen subsidie verstrekt ten behoeve van een huurwoning of monumentale
      huurwoning die in eigendom is van een toegelaten instelling als bedoeld in [artikel 19 van de Woningwet][ref1].


