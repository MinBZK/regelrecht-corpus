  - number: '83.2'
    text: |-
      De zorgautoriteit kan een verzekeraar onderscheidenlijk rechtspersoon een last onder dwangsom
      opleggen ter zake van overtreding van de [artikelen 25, eerste en tweede lid][ref1], respectievelijk
      [30 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel30
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel83
