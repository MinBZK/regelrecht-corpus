  - number: '56.1'
    text: |-
      Voordat de zorgautoriteit een beschikking neemt op een aanvraag tot vaststelling van een tarief als bedoeld
      in [artikel 52, onderdelen a of d][ref1], stelt zij de naar haar oordeel betrokken zorgaanbieder en betrokken
      ziektekostenverzekeraar in de gelegenheid te worden gehoord, indien dezen of een van hen daarom hebben verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel52
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '56.2'
    text: |-
      De zorgautoriteit doet van haar voornemen een aanvraag in behandeling te nemen tijdig mededeling aan de in het
      eerste lid bedoelde betrokkenen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56
  - number: 56a.1
    text: |-
      De zorgautoriteit kan een beschikbaarheidbijdrage toekennen ten behoeve van de beschikbaarheid
      van bij algemene maatregel van bestuur aangewezen vormen van zorg als bedoeld in
      [artikel 1, eerste lid, onderdeel b, onder 1°][ref1], van deze wet met inachtneming van daarbij te stellen
      voorwaarden, voorschriften en beperkingen. Een zorgaanbieder kan de beschikbaarheidbijdrage bij het Zorginstituut
      in rekening brengen ten laste van het Zorgverzekeringsfonds dan wel het Fonds langdurige zorg. Voor een
      beschikbaarheidbijdrage komen uitsluitend vormen van zorg in aanmerking waarvan de kosten niet of niet geheel
      zijn toe te rekenen naar, of door middel van tarieven in de zin van deze wet in rekening te brengen zijn aan,
      individuele ziektekostenverzekeraars of verzekerden, of waarvan de bekostiging bij een zodanige toerekening dan wel
      een zodanige tarifering marktverstorend zou werken, en die niet op andere wijze worden bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
        hoofdstuk: '1'
  - number: 56a.2
    text: 'De zorgautoriteit past het eerste lid toe:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.2.a
    text: op aanvraag van een zorgaanbieder of een ziektekostenverzekeraar;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.2.b
    text: |-
      ambtshalve, indien een beleidsregel als bedoeld in [artikel 57][ref1] dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 56a.3
    text: De toekenning op grond van het eerste lid laat de door de zorgaanbieder in rekening gebrachte tarieven onverlet.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.4
    text: 'Een aanvraag om toepassing van het eerste lid bevat een voorstel voor:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.4.a
    text: het in rekening te brengen bedrag;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.4.b
    text: degene door wie het bedrag in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.5
    text: De zorgautoriteit kan aan de toekenning van het bedrag voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur en onder daarbij te stellen voorwaarden, voorschriften en
      beperkingen, kan worden bepaald in welke vorm de zorgautoriteit de beschikbaarheidbijdrage kan toekennen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald of en in welke gevallen Onze minister of de
      zorgautoriteit, onder daarbij te stellen voorwaarden, voorschriften of beperkingen, zorgaanbieders kunnen aanwijzen
      die worden belast met een dienst van algemeen economisch belang als bedoeld in artikel 106, tweede lid, van het
      Verdrag betreffende de Werking van de Europese Unie of een dienst van algemeen belang als bedoeld in Protocol nr.
      26 bij het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.8
    text: |-
      Bij de krachtens het eerste lid vast te stellen algemene maatregel van bestuur kan voor een daarbij aangewezen
      vorm van zorg worden bepaald dat de zorgautoriteit geen beschikbaarheidbijdrage verstrekt dan nadat Onze Minister
      daarvoor een verklaring van geen bezwaar heeft verleend.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56a.9
    text: |-
      Onze Minister kan een verklaring van geen bezwaar als bedoeld in het achtste lid slechts onthouden vanwege strijd
      met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56a
  - number: 56b.1
    text: |-
      De zorgautoriteit kan een vereffeningbedrag vaststellen, zijnde een bedrag dat een ziektekostenverzekeraar bij
      een zorgaanbieder in rekening kan brengen ten behoeve van het vereffenen van het voor een prestatie of geheel van
      prestaties in rekening gebrachte, betrekking hebbend op een door de zorgautoriteit bepaalde periode.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.2
    text: 'De zorgautoriteit past het eerste lid toe:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.2.a
    text: op aanvraag van een ziektekostenverzekeraar of een zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.2.b
    text: |-
      ambtshalve, indien een beleidsregel als bedoeld in [artikel 57][ref1] dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 56b.3
    text: De vaststelling op grond van het eerste lid laat de door de zorgaanbieder in rekening gebrachte tarieven onverlet.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.4
    text: 'Een aanvraag om toepassing van het eerste lid bevat een voorstel voor:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.4.a
    text: het in rekening te brengen bedrag.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.4.b
    text: degene aan wie het bedrag in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.4.c
    text: degene door wie het bedrag in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.4.d
    text: de wijze waarop het bedrag in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: 56b.5
    text: De zorgautoriteit kan aan de vaststelling van het bedrag voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel56b
  - number: '57.1'
    text: 'De zorgautoriteit stelt beleidsregels vast met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
  - number: 57.1.a
    text: |-
      het uitoefenen van de bevoegdheid om verplichtingen op te leggen op grond van de [artikelen 48][ref1] en
      [49][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel49
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 57.1.b
    text: |-
      het uitoefenen van de bevoegdheid om tarieven vast te stellen op grond van
      [artikel 50, eerste lid, onderdeel a, b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 57.1.c
    text: |-
      het uitoefenen van de bevoegdheid tot het vaststellen van prestatiebeschrijvingen op grond van
      [artikel 50, eerste lid, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 57.1.d
    text: |-
      het uitoefenen van de bevoegdheid om een grens vast te stellen op grond van [artikel 50, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 57.1.e
    text: |-
      het uitoefenen van de bevoegdheid tot het vaststellen van bedragen als bedoeld in de [artikelen 56a][ref1] en
      [56b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel56b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 56b
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '57.2'
    text: |-
      De beleidsregels, bedoeld in het eerste lid, onder b, c en e, kunnen inhouden op welke wijze, waaronder
      schriftelijk of elektronisch, onder welke voorwaarden of met inachtneming van welke voorschriften of beperkingen
      een aanvraag als bedoeld in die artikelen moet worden ingediend. De beperkingen kunnen mede inhouden dat de
      aanvraag alleen gedaan kan worden door een zorgaanbieder met een ziektekostenverzekeraar gezamenlijk of dat een
      aanvraag moet worden gedaan binnen een bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
  - number: '57.3'
    text: |-
      De beleidsregels kunnen inhouden onder welke voorwaarden of met inachtneming van welke voorschriften en beperkingen
      voor in die regel te onderscheiden delen van een prestatie of geheel van prestaties daarbij nader aangegeven
      beleidsregels van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
  - number: '57.4'
    text: |-
      De beleidsregels kunnen inhouden dat deze alleen van toepassing zijn voor instellingen die zijn aangewezen op grond
      van [artikel 8 van de Wet op bijzondere medische verrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '8'
  - number: '58.1'
    text: |-
      Indien de zorgautoriteit in een beleidsregel als bedoeld in [artikel 57][ref1] de mogelijkheid opneemt van een
      experiment, neemt zij de in dit artikel bedoelde bepalingen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '58.2'
    text: |-
      In de beleidsregel kan de zorgautoriteit opnemen onder welke voorwaarden of met inachtneming van welke in die
      beleidsregel aangegeven voorschriften of beperkingen kan worden afgeweken van andere, in die beleidsregel genoemde
      beleidsregels als bedoeld in [artikel 57][ref1], of van in die beleidsregel genoemde, door haar gestelde algemeen
      verbindende regels.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '58.3'
    text: |-
      De beperkingen, bedoeld in het tweede lid, kunnen inhouden dat de werking van de desbetreffende beleidsregel
      is beperkt tot een bepaald gebied, tot een bepaalde categorie of een deel van een categorie van zorgaanbieders,
      van ziektekostenverzekeraars, van patiënten of van prestaties, of tot een beperkt aantal zorgaanbieders,
      ziektekostenverzekeraars, patiënten of prestaties.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
  - number: '58.4'
    text: |-
      De beleidsregel kan inhouden dat onder in die beleidsregel gestelde voorwaarden of met inachtneming van in die
      beleidsregel aangegeven voorschriften of beperkingen:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
  - number: 58.4.a
    text: |-
      [artikel 35][ref1] niet van toepassing is op het tarief voor de bij het experiment betrokken prestaties;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel35
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 58.4.b
    text: |-
      [artikel 35, eerste lid, onder c en d][ref1], niet van toepassing is op de prestatiebeschrijving van de bij het
      experiment betrokken prestaties;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel35
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 58.4.c
    text: |-
      [artikel 12, eerste, tweede of derde lid, van de Zorgverzekeringswet][ref1] of
      [artikel 4.2.2 van de Wet langdurige zorg][ref2] niet van toepassing is op het tarief voor de bij het experiment
      betrokken prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '4'
  - number: '58.5'
    text: |-
      Een beleidsregel als bedoeld in het eerste lid bepaalt de maximale duur van het experiment, die ten hoogste vijf
      jaren bedraagt. De zorgautoriteit kan besluiten de gevolgen van het experiment geheel of gedeeltelijk in stand te
      laten tot het einde van het boekjaar volgend op het boekjaar waarin het experiment is geëindigd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
  - number: '58.6'
    text: De zorgautoriteit evalueert het experiment tijdig en tijdens zijn uitvoering.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
  - number: '58.7'
    text: |-
      De zorgautoriteit rapporteert over de uitslag van een experiment aan Onze Minister in ieder geval binnen drie
      maanden na afloop van het experiment.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel58
  - number: '59'
    text: |-
      De zorgautoriteit stelt niet dan na een aanwijzing van Onze Minister op grond van
      [artikel 7, eerste lid, onder b][ref1], een beleidsregel vast met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel7
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 59.a
    text: |-
      het toepassen van [artikel 50, eerste lid, onderdeel a, b of c][ref1], indien voor de betrokken prestatie of voor
      een betrokken categorie van zorgaanbieders met betrekking tot de betrokken prestatie nog geen zodanige beleidsregel
      geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 59.b
    text: |-
      het wijzigen van een beleidsregel met betrekking tot de vaststelling van een tarief als bedoeld in
      [artikel 50, eerste lid, onderdeel a, b of c][ref1], in die zin dat de bij die beleidsregel betrokken prestatie
      onder een andere tariefsoort als bedoeld in die onderdelen komt te vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 59.c
    text: |-
      het vaststellen van een grens als bedoeld in [artikel 50, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 59.d
    text: |-
      het wijzigen van een beleidsregel met betrekking tot de vaststelling van een grens als bedoeld in de onderdelen van
      [artikel 50, tweede lid][ref1], in die zin dat de in die beleidsregel genoemde grens onder een andere grenssoort
      als bedoeld in die onderdelen komt te vallen;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 59.e
    text: |-
      het vaststellen van een bedrag als bedoeld in [artikel 56a][ref1] en [56b][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel56b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 56b
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 59.f
    text: |-
      een experiment als bedoeld in [artikel 58][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel58
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '60.1'
    text: 'In dit hoofdstuk worden persoonsgegevens onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.1.a
    text: identificerende persoonsgegevens,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.1.b
    text: medische persoonsgegevens,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.1.c
    text: strafrechtelijke persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: '60.2'
    text: 'Onder identificerende persoonsgegevens wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.2.a
    text: naam, adres, woonplaats, postadres;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.2.b
    text: geboortedatum en geslacht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: 60.2.c
    text: |-
      administratieve gegevens, zoals nummers van bank-, giro- en creditcard, gegevens uit de basisregistratie personen
      en registratie ingevolge de [Wet op de beroepen in de individuele gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: '60.3'
    text: |-
      Onder medische persoonsgegevens wordt in het kader van deze wet verstaan de gegevens over gezondheid als bedoeld in
      artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
  - number: '60.4'
    text: |-
      Onder strafrechtelijke persoonsgegevens wordt verstaan persoonsgegevens van strafrechtelijke aard als bedoeld
      in [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] en persoonsgegevens
      betreffende onrechtmatig of hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van dat gedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '61.1'
    text: |-
      Een ieder is gehouden desgevraagd aan de zorgautoriteit of aan een daartoe door deze aangewezen persoon, verder in
      dit artikel aan te duiden als vrager, kosteloos en met inachtneming van het bepaalde krachtens [artikel 65][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
  - number: 61.1.a
    text: |-
      de gegevens en inlichtingen te verstrekken welke redelijkerwijs voor de uitvoering van deze wet van belang kunnen
      zijn;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: 61.1.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze van de vrager – waarvan de
      raadpleging redelijkerwijs van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen uitoefenen
      op de uitvoering van deze wet, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.2'
    text: |-
      Ingeval deze wet aangelegenheden van een derde aanmerkt als aangelegenheden van degene die op grond van het eerste
      lid inlichtingenplichtig is, gelden, voor zover het deze aangelegenheden betreft, gelijke verplichtingen voor de
      derde.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.3'
    text: |-
      De in het eerste lid, onderdeel b, bedoelde verplichting geldt onverminderd voor een derde bij wie zich
      gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de vrager voor raadpleging
      beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.4'
    text: |-
      De vrager stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan in
      kennis.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.5'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze – zulks ter keuze van de vrager – en binnen een door de vrager te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.6'
    text: |-
      Toegelaten moet worden dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '61.7'
    text: |-
      De verplichting van het eerste of tweede lid geldt niet indien de betrokkene de gevraagde gegevens of inlichtingen
      reeds aan een ander bestuursorgaan heeft verstrekt en zij door dat bestuursorgaan aan de zorgautoriteit verstrekt
      kunnen worden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel61
  - number: '62.1'
    text: |-
      De zorgautoriteit kan, met inachtneming van het bepaalde krachtens [artikel 65][ref1], regels stellen, inhoudende
      welke gegevens en inlichtingen regelmatig moeten worden verstrekt dan wel onder welke omstandigheden deze moeten
      worden verstrekt door de zorgaanbieders, ziektekostenverzekeraars en degenen, bedoeld in [artikel 44][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel44
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '62.2'
    text: |-
      Het eerste lid is mede van toepassing ten aanzien van degene die gegevens verzamelt, bewaart en bewerkt
      ten behoeve van zorgaanbieders of ziektekostenverzekeraars, alsmede ten aanzien van de groep in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], indien zorgaanbieders of ziektekostenverzekeraars
      daartoe behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '63'
    text: De in dit hoofdstuk bedoelde gegevens en inlichtingen dienen volledig en naar waarheid te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel63
  - number: '64'
    text: |-
      Op het opvragen van gegevens en inlichtingen, bedoeld in de [artikelen 61][ref1] en [62][ref2], is
      [afdeling 5.2 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing, met uitzondering van de
      [artikelen 5:11][ref4], [5:12][ref5] en [5:20][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '61'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '62'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '5.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '65'
    text: 'Onze Minister geeft bij ministeriële regeling aan:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel65
  - number: 65.a
    text: |-
      welke van de in [artikel 60][ref1] onderscheiden categorieën van persoonsgegevens noodzakelijk zijn voor de
      uitoefening van de in die regeling aangewezen taken en bevoegdheden van de zorgautoriteit;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel60
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
  - number: 65.b
    text: |-
      welke van de in [artikel 60][ref1] onderscheiden categorieën van persoonsgegevens de zorgautoriteit mag verstrekken
      aan de in [artikel 70][ref2] genoemde instanties ten behoeve van de uitoefening van hun taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel70
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '70'
        hoofdstuk: '5'
  - number: '66.1'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars zijn verplicht op verzoek henzelf betreffende identificerende gegevens
      alsmede, met inachtneming van het bepaalde krachtens [artikel 65][ref1], de in [artikel 60][ref2] bedoelde
      identificerende persoonsgegevens en medische persoonsgegevens aan de zorgautoriteit en de FIOD-ECD te verstrekken
      ten behoeve van het toezicht op de naleving en de handhaving van de [artikelen 35][ref3], [36][ref4] en [38][ref5],
      waaronder begrepen de uitvoering van de [Wet op de economische delicten][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0020078
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0020078
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref6
        bwb_id: BWBR0002063
  - number: '66.2'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars zijn niet verplicht op verzoek medische persoonsgegevens te verstrekken
      ten behoeve van de uitvoering van een verplichting die het eerste lid oplegt aan anderen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel66
  - number: '66.3'
    text: |-
      Het eerste lid is mede van toepassing op degene bedoeld in [artikel 44][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel44
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '66.4'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars verstrekken aan de Autoriteit Consument en Markt de medische
      persoonsgegevens die noodzakelijk zijn ten behoeve van het toezicht of de taken waarmee de Autoriteit Consument en
      Markt is belast op grond van de [paragrafen 4.3][ref1] en 4.3a van deze wet, de [hoofdstukken 2][ref2], [3][ref3],
      [4][ref4], [5][ref5], [8][ref6] en [10 van de Mededingingswet][ref7], voor zover het de zorgsector betreft, en
      [artikel 2, vierde lid, van de Instellingswet Autoriteit Consument en Markt][ref8], voor zover het marktonderzoeken
      en rapportages in de zorgsector betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk8
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk10
      [ref8]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0020078
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0008691
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008691
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0008691
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0008691
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0008691
        hoofdstuk: '8'
      - id: ref7
        bwb_id: BWBR0008691
        hoofdstuk: '10'
      - id: ref8
        bwb_id: BWBR0033043
        artikel: '2'
  - number: '67.1'
    text: |-
      Voor degene die op grond van deze wet gegevens en inlichtingen ontvangt, gelden dezelfde wettelijke voorschriften
      inzake geheimhouding van die gegevens en inlichtingen als voor degene die ze heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel67
  - number: '67.2'
    text: |-
      De gegevens en inlichtingen, bedoeld in [artikel 70, tweede lid][ref1], worden door de zorgautoriteit verstrekt
      mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel70
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '70'
        hoofdstuk: '5'
  - number: 67.2.a
    text: de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel67
  - number: 67.2.b
    text: |-
      voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel67
  - number: '67.3'
    text: |-
      Het eerste lid laat onverlet de bevoegdheden van de Algemene Rekenkamer ingevolge
      [artikel 7.34 van de Comptabiliteitswet 2016][ref1]. De Algemene Rekenkamer is bij het doen van mededelingen,
      bedoeld in de [artikelen 7.30][ref2], 7.34, negende lid, en [7.39 van de Comptabiliteitswet 2016][ref3] verplicht
      tot geheimhouding, voor zover het betreft gegevens en inlichtingen die haar ingevolge de eerste volzin bekend zijn
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '7'
  - number: '68.1'
    text: |-
      De zorgautoriteit kan, met inachtneming van het bepaalde krachtens [artikel 65][ref1], regels stellen, inhoudende
      aan wie daarbij te bepalen gegevens en inlichtingen als bedoeld in de [artikelen 61][ref2] en [62][ref3], moeten
      worden verstrekt, het tijdstip en de wijze waarop en de vorm waarin de gegevens en inlichtingen moeten worden
      verstrekt of door wie en de wijze waarop de gegevens moeten worden bewerkt of door wie en de wijze waarop de
      gegevens dan wel de bewerkingen van die gegevens moeten worden bekendgemaakt, alsmede dat een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref4] de juistheid van de verstrekte gegevens en
      inlichtingen bevestigt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '61'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '62'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '68.2'
    text: |-
      De regels, bedoeld in het eerste lid, kunnen ook inhouden de wijze waarop, de vorm waarin of door wie daarbij te
      bepalen gegevens en inlichtingen, waaronder medische persoonsgegevens, moeten worden bewerkt alvorens de bewerking
      moet worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68
  - number: 68a.1
    text: |-
      Een zorgaanbieder die aan een verzekerde zorg heeft verleend, en die daarvoor krachtens een door hem met
      de ziektekostenverzekeraar gesloten overeenkomst rechtstreeks een tarief bij die ziektekostenverzekeraar in
      rekening brengt, verstrekt die ziektekostenverzekeraar of een door die ziektekostenverzekeraar aangewezen
      persoon de persoonsgegevens van de verzekerde, waaronder gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15 van de Algemene verordening gegevensbescherming, die noodzakelijk zijn voor de uitvoering van de
      ziektekostenverzekering of van de wet, dan wel stelt hem deze gegevens voor dit doel voor inzage of het nemen van
      afschrift ter beschikking.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.2
    text: |-
      Een zorgaanbieder die aan een verzekerde zorg heeft verleend en die daarvoor bij de verzekerde een tarief in
      rekening brengt, verstrekt hem de persoonsgegevens, waaronder gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15 van de Algemene verordening gegevensbescherming, die voor zijn ziektekostenverzekeraar noodzakelijk
      zijn voor de uitvoering van de ziektekostenverzekering of van de wet.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.3
    text: |-
      Behoudens voor zover enig wettelijk voorschrift hen mededeling toestaat, zijn personen werkzaam bij een
      ziektekostenverzekeraar, bij een door de ziektekostenverzekeraar aangewezen persoon of bij een door Onze Minister
      aangewezen persoon als bedoeld in [artikel 87, derde lid, van de Zorgverzekeringswet][ref1], voor wie niet reeds
      uit hoofde van ambt of beroep een geheimhoudingsplicht geldt, verplicht tot geheimhouding van persoonsgegevens
      van een verzekerde, waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming, die voor een ziektekostenverzekeraar noodzakelijk zijn voor de uitvoering van
      een ziektekostenverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel87
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '87'
  - number: 68a.4
    text: 'Bij ministeriële regeling kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.a
    text: |-
      tot welke gegevens en tot welke categorie van ziektekostenverzekeraars als bedoeld in artikel 1, onderdeel f, de
      verplichting, bedoeld in het eerste of tweede lid, zich in ieder geval uitstrekt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.b
    text: op welke wijze gegevens, bedoeld in het eerste of tweede lid, worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.c
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.d
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.e
    text: |-
      in welke gevallen gegevens, bedoeld in het eerste of tweede lid, verder worden verwerkt met het oog
      op de uitvoering van ziektekostenverzekeringen, voor zover deze gegevens niet worden gebruikt voor het
      beoordelen en accepteren van een aspirant-verzekerde door een ziektekostenverzekeraar als bedoeld in
      [artikel 1, eerste lid, onderdeel f, onder 3°][ref1], en bovendien noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
        hoofdstuk: '1'
  - number: 68a.4.e.1°
    text: de betaling aan een zorgaanbieder of de vergoeding van zorgkosten aan een verzekerde,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.e.2°
    text: de vaststelling van eigen bijdragen, nog openstaand eigen risico of een no-claimteruggave aan de verzekerde,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.e.3°
    text: het uitoefenen van het verhaalsrecht, of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: 68a.4.e.4°
    text: het verrichten van controle of fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel68a
  - number: '69.1'
    text: |-
      Onverminderd de verplichting van zorgaanbieders, ziektekostenverzekeraars, organen van de woonplaats en
      van de verblijfplaats en bevoegde organen om gegevens en inlichtingen te verstrekken als bedoeld in de
      [artikelen 61][ref1] en [62][ref2], kan de zorgautoriteit bij het uitoefenen van aan haar opgedragen taken eigen
      informatie gebruiken indien de in die artikelen bedoelde gegevens en inlichtingen niet of niet volledig worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel62
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '61'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '62'
        hoofdstuk: '5'
  - number: '69.2'
    text: |-
      De zorgautoriteit is bevoegd alle gegevens en inlichtingen, die zij heeft verzameld op grond van alle haar daartoe
      ten dienste staande wettelijke bevoegdheden, te gebruiken voor alle aan haar opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel69
  - number: '69.3'
    text: |-
      Bij het gebruik door de zorgautoriteit van informatie, gegevens en inlichtingen als bedoeld in het eerste en
      tweede lid, is het bepaalde krachtens [artikel 65][ref1] met betrekking tot het verwerken van persoonsgegevens van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
  - number: '70.1'
    text: |-
      De zorgautoriteit, het Zorginstituut, het College sanering, de Inspectie gezondheidszorg en jeugd en de Inspectie
      Justitie en Veiligheid verstrekken elkaar die gegevens en inlichtingen die van belang kunnen zijn voor de
      uitoefening van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70
  - number: '70.2'
    text: |-
      De zorgautoriteit verstrekt desgevraagd aan de Autoriteit Consument en Markt, de Nederlandsche
      Bank, de Stichting Autoriteit Financiële Markten, het College bescherming persoonsgegevens,
      het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1], en de FIOD-ECD die
      gegevens en inlichtingen die van belang kunnen zijn voor de uitoefening van hun wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
  - number: '70.3'
    text: |-
      De zorgautoriteit verstrekt desgevraagd aan de Gezondheidsraad, het Rijksinstituut voor de volksgezondheid en
      milieu, de Raad voor de Volksgezondheid en Zorg, de Raad voor gezondheidsonderzoek, het Centraal Planbureau,
      het Centraal Bureau voor de Statistiek en het Sociaal Cultureel Planbureau in verband met de beperking van
      administratieve lasten die gegevens en inlichtingen die van belang kunnen zijn voor de uitoefening van hun
      wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70
  - number: '70.4'
    text: |-
      Bij de verstrekkingen als bedoeld in het eerste tot en met derde lid wordt het bepaalde krachtens
      [artikel 65][ref1] in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
  - number: '70.5'
    text: |-
      De zorgautoriteit maakt bij de toepassing van het eerste tot en met derde lid geen gebruik van haar bevoegdheden,
      bedoeld in de [artikelen 61][ref1] en [64][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel64
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '61'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '64'
        hoofdstuk: '5'
  - number: 70a
    text: |-
      Een ieder verstrekt op verzoek aan Onze Minister of aan een door Onze Minister aangewezen persoon kosteloos alle
      inlichtingen en gegevens, niet zijnde persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref1],
      die noodzakelijk zijn voor de uitvoering van artikel 91 van de toepassingsverordening en artikel 20 van [Richtlijn
      2011/24](32011L0024)/EU van het Europees Parlement en de Raad van 9 maart 2011 betreffende de toepassing van de
      rechten van patiënten bij grensoverschrijdende gezondheidszorg (PbEU 2011, L 88).


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '71'
    text: |-
      De griffiers of secretarissen van de in de [Wet op de rechterlijke organisatie][ref1] bedoelde gerechten, van de
      Centrale Raad van Beroep, van het College van Beroep voor het bedrijfsleven en van de tuchtcolleges, bedoeld in
      [artikel 47, derde lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], verstrekken aan Onze
      Minister, aan de zorgautoriteit, aan de FIOD-ECD of aan een krachtens [artikel 72][ref3] aangewezen persoon vrij
      van alle kosten alle gegevens en uittreksels uit of afschriften van vonnissen, arresten, uitspraken, registers, en
      andere stukken, die ten behoeve van de uitvoering van deze wet van hen worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel72
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '72.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet en met het in de [artikelen 16][ref1] en
      [16a][ref2] bedoelde toezicht, zijn belast:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel16a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 72.1.a
    text: de bij besluit van Onze Minister aangewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: 72.1.b
    text: de bij besluit van de zorgautoriteit aangewezen medewerkers van de zorgautoriteit;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: 72.1.c
    text: de ambtenaren van de Inspectie gezondheidszorg en jeugd;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: 72.1.d
    text: de medewerkers van de FIOD-ECD en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: 72.1.e
    text: ambtenaren van de Inspectie Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: '72.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onder a of b, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel72
  - number: '73'
    text: |-
      Degenen die ingevolge [artikel 72][ref1] belast zijn met toezicht op de naleving en degenen die ingevolge
      [artikel 17 van de Wet op de economische delicten][ref2] belast zijn met de opsporing van hetgeen bij of krachtens
      deze wet is bepaald of strafbaar is gesteld, verstrekken elkaar alle gegevens en inlichtingen voor zover dat
      noodzakelijk is voor de uitoefening van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '74'
    text: |-
      De zorgautoriteit heeft een meldpunt voor het ontvangen van gegevens en inlichtingen omtrent feiten en
      omstandigheden die mogelijk niet in overeenstemming zijn met het bij of krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel74
  - number: '75'
    text: |-
      De zorgautoriteit maakt openbaar op welke wijze zij van plan is uitvoering te geven aan de in dit hoofdstuk aan
      haar toegekende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel75
  - number: '76.1'
    text: |-
      De zorgautoriteit is bevoegd ter handhaving van het bepaalde bij of krachtens de [artikelen 23][ref1],
      [25, tweede lid][ref2], [27][ref3], [31][ref4], [31a, tweede lid][ref5], [31c][ref6],
      [31d, eerste tot en met vierde lid][ref7], [34][ref8], [35 tot en met 45][ref9], [48][ref10], [49][ref11],
      [49a][ref12], [49c, derde lid][ref13], [49d, tweede lid][ref14], [61][ref15], [62][ref16] en [68][ref17] een
      aanwijzing te geven, erop gericht dat aan het bepaalde bij of krachtens die artikelen wordt voldaan.


