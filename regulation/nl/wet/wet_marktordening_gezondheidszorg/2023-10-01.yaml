        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 81b.1.a
    text: een last onder bestuursdwang op te leggen; of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81b
  - number: 81b.1.b
    text: |-
      ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die tot de kennisgeving hebben
      geleid:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81b
  - number: 81b.1.b.1°
    text: |-
      dat de Regionale Ambulancevoorziening in strijd handelt met [artikel 13][ref1] of het bepaalde bij of krachtens
      [artikel 19 van de Wet ambulancezorgvoorzieningen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel19
