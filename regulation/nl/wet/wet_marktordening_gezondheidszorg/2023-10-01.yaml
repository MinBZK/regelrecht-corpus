  - number: '92.1'
    text: |-
      De zorgautoriteit legt een bestuurlijke boete op aan een ziektekostenverzekeraar die
      [artikel 15f van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1] overtreedt. De
      zorgautoriteit doet van het opleggen van de bestuurlijke boete mededeling aan de verzekerden en verzekeringnemers
      van wie de zorgautoriteit heeft vastgesteld dat hun ziektekostenverzekeraar zich via een elektronisch
      uitwisselingssysteem toegang tot hun gegevens heeft verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15f
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15f
  - number: '92.2'
    text: |-
      De boete voor een afzonderlijke overtreding bedraagt ten hoogste € 500 000 of, indien dat meer is, tien procent van
      de omzet van de onderneming in Nederland. [Artikel 85, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel85
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '92.3'
    text: |-
      De zorgautoriteit maakt een besluit tot het opleggen van een bestuurlijke boete ingevolge het eerste lid openbaar,
      nadat het rechtens onaantastbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel92
  - number: '92.4'
    text: |-
      De zorgautoriteit doet van de openbaarmaking, bedoeld in het derde lid, onverwijld mededeling aan de
      ziektekostenverzekeraar.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel92
  - number: '92.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze en inhoud van de
      openbaarmaking en over de wijze en inhoud van de mededeling door de zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel92
  - number: '104.1'
    text: |-
      De zorgautoriteit draagt het op grond van [artikel 81, eerste lid, onderdeel c][ref1], ingevorderde bedrag af aan
      het Zorgverzekeringsfonds of het Fonds langdurige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel81
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel104
    references:
