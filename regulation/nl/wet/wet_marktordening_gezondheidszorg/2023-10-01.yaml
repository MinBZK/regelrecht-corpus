  - number: 55.2.a
    text: indien de voorgestelde prestatiebeschrijving in strijd is met het recht of met het belang van de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel55
  - number: 55.2.b
