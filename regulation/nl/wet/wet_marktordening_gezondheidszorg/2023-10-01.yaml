      - id: ref2
        bwb_id: BWBR0043925
        artikel: '19'
  - number: 81b.1.b.2°
    text: dat aan de Regionale Ambulancevoorziening een aanwijzing is gegeven dan wel een last onder dwangsom is opgelegd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81b
