        artikel: '32'
  - number: '87.2'
    text: De bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste € 10 000 000.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel87
  - number: '88.1'
    text: |-
      De zorgautoriteit kan aan een zorgverzekeraar een bestuurlijke boete opleggen ter zake van overtreding
      van de voorschriften gesteld bij of krachtens de [artikelen 4, tweede tot en met vijfde lid][ref1],
      [5, derde lid][ref2], [9][ref3], [18a][ref4], [18b][ref5], [18bb][ref6], [18c][ref7], [37][ref8],
      [38, eerste en vierde lid][ref9], [64, tweede lid][ref10], [86][ref11], [90][ref12], [92][ref13], [114][ref14] of
      [118a, derde lid, van de Zorgverzekeringswet][ref15].


