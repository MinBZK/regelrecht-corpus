  - number: '86.3'
    text: De bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste € 500 000.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel86
  - number: '87.1'
    text: |-
      De zorgautoriteit kan een bestuurlijke boete opleggen aan een zorgverzekeraar die het Zorginstituut of een door hem
      aangewezen persoon onjuiste of onvolledige informatie verschaft met betrekking tot de aantallen bij hem verzekerde
      verzekeringsplichtigen, hun verzekerdenkenmerken of zijn zorgkosten, noodzakelijk voor de vaststelling van de
      bijdragen, bedoeld in de [artikelen 32 tot en met 34 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel87
    references:
