    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.f.1°
    text: een zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.f.2°
    text: een Wlz-uitvoerder;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.f.3°
    text: |-
      een particuliere ziektekostenverzekeraar, zijnde een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van verzekeraar mag uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 1.1.g
    text: |-
      verzekerde: degene die een verzekeringsovereenkomst betreffende het risico van ziektekosten heeft gesloten met een
      ziektekostenverzekeraar dan wel van rechtswege verzekerd is op grond van de [Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 1.1.h
    text: |-
      verzekeringsplichtige: degene die op grond van [artikel 2 van de Zorgverzekeringswet][ref1] verplicht is zich
      krachtens een zorgverzekering te verzekeren of te laten verzekeren;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 1.1.i
    text: 'consument: verzekeringsplichtige, verzekerde of patiënt;'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.j
    text: 'prestatie: de levering van zorg door een zorgaanbieder als bedoeld in onderdeel c, onder 1°;'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.k
    text: 'tarief: prijs voor een prestatie, een deel van een prestatie of geheel van prestaties van een zorgaanbieder;'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.l
    text: |-
      zorgautoriteit: de Nederlandse Zorgautoriteit, genoemd in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel3
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 1.1.m
    text: |-
      Zorginstituut: het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: 1.1.n
    text: 'financiële derivaten:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.n.1°
    text: financiële contracten waarvan de waarde is afgeleid van een onderliggende waarde of een referentieprijs;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.n.2°
    text: onderdelen van financiële contracten die, op zichzelf beschouwd, financiële contracten als bedoeld onder 1° zijn;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.o
    text: |-
      College sanering: het College sanering zorginstellingen, genoemd in de [Wet toelating zorginstellingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
  - number: 1.1.p
    text: |-
      FIOD-ECD: de Belastingdienst/Fiscale Inlichtingen- en opsporingsdienst en Economische Controledienst van het
      Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.q
    text: |-
      Zorgverzekeringsfonds: het fonds, genoemd in [artikel 39 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.1.r
    text: |-
      het CAK: het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '6'
  - number: 1.1.s
    text: |-
      socialezekerheidsverordening: [Verordening (EG) nr. 883/2004](32004R0883) van het Europees Parlement en de Raad van
      29 april 2004, betreffende de coördinatie van socialezekerheidsstelsels (PbEU 2004, L 166);
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.t
    text: |-
      toepassingsverordening: [Verordening (EG) nr. 987/2009](32009R0987) van het Europees Parlement en de Raad van
      16 september 2009 tot vaststelling van de wijze van toepassing van [Verordening (EG) nr. 883/2004](32004R0883)
      betreffende de coördinatie van de socialezekerheidsstelsels (PbEU 2009, L 284);
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.u
    text: |-
      orgaan van de woonplaats: rechtspersoon die door Onze Minister is aangewezen als orgaan van de woonplaats in de zin
      van de socialezekerheidsverordening of, voor zover het zorg betreft, een verdrag inzake sociale zekerheid waarbij
      Nederland partij is;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.v
    text: |-
      orgaan van de verblijfplaats: rechtspersoon die door Onze Minister is aangewezen als orgaan van de verblijfplaats
      in de zin van de socialezekerheidsverordening of, voor zover het zorg betreft, een verdrag inzake sociale zekerheid
      waarbij Nederland partij is;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.w
    text: |-
      bevoegd orgaan: rechtspersoon, niet zijnde het CAK, die door Onze Minister is aangewezen voor bepaalde
      taken van bevoegd orgaan als bedoeld in artikel 1, onderdeel q, onder iii, van verordening (EG) nr.
      883/2004 van het Europees Parlement en de Raad van 29 april 2004 betreffende de coördinatie van de sociale
      zekerheidsstelsels (PbEU 2004, L 166) en in verdragen inzake sociale zekerheid ten behoeve van personen bedoeld in
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: '1.2'
    text: |-
      Onder zorg bedoeld in het eerste lid, onderdeel b, wordt mede begrepen forensische zorg als omschreven in
      [artikel 1.1, tweede lid, van de Wet forensische zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040634#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040634
        artikel: '1'
  - number: '1.3'
    text: |-
      Voor de toepassing van deze wet wordt, voor zover het betreft de inkoop van forensische zorg, Onze Minister van
      Veiligheid en Justitie met een ziektekostenverzekeraar gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: '2.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien dat voor een goede uitvoering van deze wet nodig is,
      werkzaamheden die geheel of gedeeltelijk liggen op het gebied van de gezondheidszorg of geheel of gedeeltelijk ten
      behoeve van de gezondheidszorg worden verricht, worden aangewezen als zorg in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kan een vorm van zorg dan wel een categorie van zorgaanbieders of geen
      rechtspersoonlijkheid bezittende organisatorische verbanden van zorgaanbieders worden uitgezonderd van deze wet of
      een deel daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
  - number: '2.3'
    text: |-
      Deze wet is niet van toepassing op een zorgaanbieder voor zover deze jeugdhulp als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '2.4'
    text: 'Deze wet niet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
  - number: 2.4.a
    text: |-
      aanbieders als bedoeld in [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 2.4.b
    text: |-
      derden van wie een cliënt, aan wie een persoongebonden budget in de zin van die wet is verstrekt, de diensten,
      hulpmiddelen, woningaanpassingen en andere maatregelen die tot de maatwerkvoorziening behoren betrekt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
  - number: '2.5'
    text: |-
      Voor zover een rechtspersoon handelt als het orgaan van de woonplaats, het orgaan van de verblijfplaats of het
      bevoegd orgaan wordt deze voor de toepassing van deze wet niet aangemerkt als een ziektekostenverzekeraar.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel2
  - number: '3.1'
    text: Er is een Nederlandse Zorgautoriteit, die rechtspersoonlijkheid bezit.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
  - number: '3.2'
    text: De zorgautoriteit is gevestigd in een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
  - number: '3.3'
    text: De zorgautoriteit is belast met de taken die haar bij of krachtens wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
  - number: '3.4'
    text: De zorgautoriteit stelt bij de uitoefening van haar taken het algemeen consumentenbelang voorop.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
  - number: '3.5'
    text: De zorgautoriteit wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
  - number: '3.6'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is op de zorgautoriteit van toepassing, met uitzondering van
      [artikel 17 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel17
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '17'
  - number: '4.1'
    text: De zorgautoriteit bestaat uit ten hoogste drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel4
  - number: '4.2'
    text: |-
      Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de
      zorgautoriteit alsmede op grond van maatschappelijke kennis en ervaring.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel4
  - number: '4.3'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel4
  - number: '4.4'
    text: |-
      De leden van de zorgautoriteit hebben geen financiële of andere belangen bij instellingen of bedrijven die hun
      onpartijdigheid in het gedrang kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel4
  - number: '5.1'
    text: De zorgautoriteit stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel5
  - number: '5.2'
    text: |-
      Vergaderingen van de zorgautoriteit zijn niet openbaar, behoudens voor zover in het bestuursreglement anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel5
  - number: '5.3'
    text: |-
      In het bestuursreglement legt de zorgautoriteit in ieder geval vast hoe zij voldoet aan de verplichting ingevolge
      [artikel 3:2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.1'
    text: 'Onze Minister kan de zorgautoriteit een algemene aanwijzing geven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
  - number: 7.1.a
    text: de onderwerpen waaromtrent de zorgautoriteit ingevolge deze wet bevoegd is regels vast te stellen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
  - number: 7.1.b
    text: de onderwerpen waaromtrent de zorgautoriteit ingevolge deze wet bevoegd is beleidsregels vast te stellen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan in een aanwijzing als bedoeld in het eerste lid, onder b, bepalen dat de zorgautoriteit
      ambtshalve een tarief als bedoeld in [artikel 50, eerste lid, onderdeel b of c][ref1], of een prestatiebeschrijving
      vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '7.3'
    text: |-
      Onze Minister geeft een aanwijzing als bedoeld in het eerste lid voorzover deze betreft de forensische zorg in
      overeenstemming met Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
  - number: '7.4'
    text: Een aanwijzing heeft geen betrekking op een individuele zorgaanbieder, ziektekostenverzekeraar of consument.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel7
  - number: '8'
    text: |-
      Alvorens Onze Minister overeenkomstig [artikel 7, eerste lid, onder b][ref1], een aanwijzing vaststelt, deelt hij
      de zakelijke inhoud van het voorgenomen besluit schriftelijk mede aan de beide kamers der Staten-Generaal. Hij
      stelt het besluit niet eerder vast dan nadat 30 dagen zijn verstreken na die mededeling. Van de vaststelling doet
      Onze Minister mededeling door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel7
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '11.1'
    text: |-
      De zorgautoriteit zendt jaarlijks voor 1 oktober tegelijk met de begroting een werkprogramma voor het volgende
      kalenderjaar aan Onze Minister met een beschrijving van de activiteiten die de zorgautoriteit voornemens is ter
      uitvoering van haar taken te verrichten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel11
  - number: '11.2'
    text: |-
      Onverminderd [artikel 27 van de Kaderwet zelfstandige bestuursorganen][ref1] bevat de begroting een meerjarenraming
      van de beheerskosten voor de vier kalenderjaren, volgend op het begrotingsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
  - number: '12.1'
    text: |-
      Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van de zorgautoriteit voor het
      volgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '12.2'
    text: Onze Minister kan besluiten het budget voor de beheerskosten van de zorgautoriteit te wijzigen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '12.3'
    text: |-
      De zorgautoriteit gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die leiden
      tot overschrijding van het vastgestelde budget voor de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '12.4'
    text: |-
      Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de begroting
      betrekking heeft, is de zorgautoriteit bevoegd, teneinde haar activiteiten gaande te houden, te beschikken over ten
      hoogste een derde gedeelte van het budget dat laatstelijk voor haar voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '12.5'
    text: |-
      Onze Minister kan besluiten dat de zorgautoriteit in een geval als bedoeld in het vierde lid, kan beschikken over
      meer dan een derde gedeelte van het budget dat laatstelijk voor haar voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '12.6'
    text: |-
      Het door Onze Minister vastgestelde budget voor de beheerskosten van de zorgautoriteit wordt gedekt uit ’s Rijks
      kas.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel12
  - number: '14.1'
    text: |-
      Het werkprogramma, bedoeld in [artikel 11][ref1], behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel11
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.2'
    text: |-
      In afwijking van [artikel 29 van de Kaderwet zelfstandige bestuursorganen][ref1], behoeven wijzigingen in een
      goedgekeurde begroting geen goedkeuring van Onze Minister, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: 14.2.a
    text: de totale omvang van de begroting geen wijziging ondergaat, en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
  - number: 14.2.b
    text: |-
      de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag van
      vijf procent van het in [artikel 12][ref1] bedoelde budget niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel12
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.3'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
  - number: 14.3.a
    text: |-
      de inhoud en inrichting van het werkprogramma, bedoeld in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel11
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 14.3.b
    text: |-
      de inhoud en inrichting van het jaarverslag, de begroting en de jaarrekening, bedoeld in de [artikelen 18][ref1],
      [26][ref2] en [34 van de Kaderwet zelfstandige bestuursorganen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
  - number: 14.3.c
    text: de accountantscontrole van de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
  - number: 14.3.d
    text: |-
      de omvang van de egalisatiereserve, bedoeld in [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel33
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '33'
  - number: '14.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 12][ref1] wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel12
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '14.5'
    text: |-
      De accountant doet verslag van zijn bevindingen over de vraag of het beheer en de wijze waarop de zorgautoriteit is
      georganiseerd voldoen aan de eisen van rechtmatigheid, ordelijkheid en controleerbaarheid.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel14
  - number: '15.1'
    text: |-
      Na de goedkeuring, bedoeld in [artikel 14, eerste lid][ref1], van deze wet en in de
      [artikelen 29, eerste lid][ref2], en [34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref3], stelt de
      zorgautoriteit het werkprogramma, de begroting, het jaarverslag en de jaarrekening algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '15.2'
    text: |-
      Onze Minister brengt zijn oordeel over het functioneren van de zorgautoriteit ter kennis van beide kamers der
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel15
  - number: '16'
    text: 'De zorgautoriteit is belast met:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
  - number: 16.a
    text: markttoezicht, marktontwikkeling en tarief- en prestatieregulering, op het terrein van de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
  - number: 16.b
    text: |-
      toezicht op de rechtmatige uitvoering door de zorgverzekeraars van hetgeen bij
      of krachtens de [Zorgverzekeringswet][ref1] is geregeld, met uitzondering van de
      [artikelen 28a, eerste tot en met vijfde lid][ref2], [28b, vijfde tot en met zevende lid][ref3], en
      [artikel 28c, eerste, tweede, vijfde tot en met zevende lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel28b
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel28c
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
