        artikel: '86'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '104.4'
    text: |-
      De zorgautoriteit draagt de op grond van [artikel 84][ref1] ingevorderde dwangsommen af aan het Fonds langdurige
      zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel84
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '84'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '104.5'
    text: |-
      De zorgautoriteit draagt de op grond van de [artikelen 81a][ref1], [84a][ref2] en [90][ref3] ingevorderde
      dwangsommen en bestuurlijke boetes af aan het Zorgverzekeringsfonds of het Algemeen Fonds Bijzondere Ziektekosten.


