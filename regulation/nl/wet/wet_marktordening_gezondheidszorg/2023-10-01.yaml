      [artikel 1 van de Wet op de beroepen in de individuele gezondheidzorg][ref1], voor zover uitgevoerd, al
      dan niet onder eigen verantwoordelijkheid, door personen, ingeschreven in een register als bedoeld in
      [artikel 3 van die wet][ref2] of door personen als bedoeld in [artikel 34 van die wet][ref3] en voor zover die
      handelingen niet zijn begrepen onder 1°;


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006251#Artikel34
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
