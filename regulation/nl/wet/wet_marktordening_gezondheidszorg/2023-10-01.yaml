preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen inzake de ontwikkeling en ordening
    van markten op het gebied van de gezondheidszorg en het toezicht daarop, mede met het oog op een doelmatig
    en doeltreffend stelsel van de zorg en de beheersing van de kostenontwikkeling van de zorg, en dat het tevens
    wenselijk is in verband met de informatieachterstand van de consument en het machtsverschil tussen partijen in de
    zorg, de positie van de consument te beschermen en te bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.b
    text: 'zorg:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.b.1°
    text: |-
      zorg of dienst als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de [Wet langdurige zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
