        bwb_id: BWBR0006251
        artikel: '34'
  - number: 1.1.c
    text: 'zorgaanbieder:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.c.1°
    text: de natuurlijke persoon of rechtspersoon die beroeps- of bedrijfsmatig zorg verleent;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.c.2°
    text: |-
      de natuurlijke persoon of rechtspersoon voor zover deze tarieven in rekening brengt namens, ten behoeve van of in
      verband met het verlenen van zorg door een zorgaanbieder als bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
  - number: 1.1.d
    text: |-
      zorgverzekeraar: een zorgverzekeraar als bedoeld in de [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.1.e
    text: |-
      *Wlz-uitvoerder:* een rechtspersoon als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '1'
  - number: 1.1.f
