      - id: ref2
        bwb_id: BWBR0017745
  - number: 84a
    text: |-
      De zorgautoriteit kan een zorgaanbieder een last onder dwangsom opleggen ter zake van overtreding van
      [artikel 11i, tweede lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11i
