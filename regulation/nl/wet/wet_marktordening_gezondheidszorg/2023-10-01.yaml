        artikel: '19'
  - number: '91.2'
    text: |-
      [Artikel 85, tweede lid en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel85
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel91
