      [artikel 2.1.4b van de Wet maatschappelijke ondersteuning 2015][ref1] is geregeld;


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
    references:
