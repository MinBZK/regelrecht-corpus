        paragraaf: '4.2'
  - number: '77'
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder b en c][ref1], een aanwijzing geven
      aan een zorgverzekeraar, dan wel aan een verzekeraar die verzekeringen als zorgverzekering aanbiedt of uitvoert die
      niet aan het bepaalde bij of krachtens de [Zorgverzekeringswet][ref2] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018450
  - number: '78.1'
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder d][ref1], een aanwijzing
      geven aan een Wlz-uitvoerder die, of het CAK dat, niet voldoet aan het bepaalde bij of krachtens de
      [Wet langdurige zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0035917
  - number: '78.2'
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder f][ref1],
      een aanwijzing geven aan het CAK indien het CAK niet voldoet aan hetgeen bij of krachtens
      [artikel 2.1.4b van de Wet maatschappelijke ondersteuning 2015][ref2] is geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
  - number: '78.3'
    text: |-
      Indien een Wlz-uitvoerder werkzaamheden aan een andere Wlz-uitvoerder heeft uitbesteed en een door de
      zorgautoriteit op grond van het eerste lid gegeven aanwijzing met betrekking tot de wijze waarop deze taak door de
      desbetreffende persoon wordt uitgevoerd, niet binnen de in het tweede lid bedoelde termijn tot een rechtmatige en
      doelmatige uitvoering heeft geleid, meldt de zorgautoriteit dit, onder vermelding van de naam van de Wlz-uitvoerder
      waaraan is uitbesteed, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78
  - number: 78a
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder h][ref1], een aanwijzing
      geven aan een zorgaanbieder, erop gericht dat aan de naleving van het in dat onderdeel genoemde
      [artikel 11i, tweede lid, van de Wet kwaliteit, klachten en geschillen zorg][ref2] wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11i
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: 11i
  - number: 78c.1
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16a][ref1],
      een aanwijzing geven aan een ziektekostenverzekeraar die niet voldoet aan
      [artikel 15f van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0023864#Artikel15f
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 16a
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0023864
        artikel: 15f
  - number: 78c.2
    text: |-
      De zorgautoriteit doet van een aanwijzing mededeling aan de verzekerden en verzekeringnemers van wie de
      zorgautoriteit heeft vastgesteld dat hun ziektekostenverzekeraar zich via een elektronisch uitwisselingssysteem
      toegang tot hun gegevens heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78c
  - number: 78d
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder k][ref1], een aanwijzing geven aan
      een orgaan van de woonplaats, een orgaan van de verblijfplaats of een bevoegd orgaan, die niet voldoet aan het
      bepaalde bij of krachtens [artikel 123 van de Zorgverzekeringswet][ref2] alsmede, voor zover het zorg betreft, de
      socialezekerheidsverordening, de toepassingsverordening of de verdragen inzake sociale zekerheid waarbij Nederland
      partij is.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel123
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78d
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '123'
  - number: 78e
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder m][ref1], een
      aanwijzing geven aan het CAK indien het CAK niet voldoet aan hetgeen bij of krachtens de
      [Invoerings- en aanpassingswet Zorgverzekeringswet][ref2] en de [Zorgverzekeringswet][ref3] is geregeld, met
      uitzondering van de [artikelen 69a][ref4], [69b][ref5], [70][ref6] en [122a van de Zorgverzekeringswet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018830
      [ref3]: https://wetten.overheid.nl/BWBR0018450
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel69a
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel69b
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel70
      [ref7]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78e
    references:
