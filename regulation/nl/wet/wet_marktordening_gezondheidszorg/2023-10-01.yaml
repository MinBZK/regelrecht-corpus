  - number: '89.2'
    text: De bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste € 2 250.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel89
  - number: '90.1'
    text: |-
      De zorgautoriteit kan een zorgaanbieder een bestuurlijke boete opleggen ter zake van overtreding van
      [artikel 11i, tweede lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11i
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11i
  - number: '90.2'
    text: |-
      [Artikel 85, tweede en derde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel85
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel90
    references:
