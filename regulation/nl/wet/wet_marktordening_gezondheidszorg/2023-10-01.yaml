        artikel: 122a
  - number: 78f
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder n][ref1], een aanwijzing geven aan
      een instelling als bedoeld in de [Wet toelating zorginstellingen][ref2] die niet voldoet aan het bepaalde bij
      [artikel 5 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018906
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78f
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0018906
      - id: ref3
        bwb_id: BWBR0018906
        artikel: '5'
  - number: 78g
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onderdeel o][ref1],
      een aanwijzing geven aan een Regionale Ambulancevoorziening als bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref2], erop gericht dat aan de
      naleving van het in dat onderdeel genoemde [artikel 13][ref3] en het bepaalde bij of krachtens
      [artikel 19 van de Wet ambulancezorgvoorzieningen][ref4] wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043925#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0043925#Artikel19
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel78g
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0043925
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0043925
        artikel: '19'
  - number: '79.1'
    text: |-
      De zorgautoriteit geeft geen aanwijzing als bedoeld in de [artikelen 76 tot en met 78g][ref1] omtrent de
      beoordeling of behandeling van individuele gevallen door degene tot wie de aanwijzing is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel76
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '76'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '79.2'
    text: Bij de aanwijzing stelt de zorgautoriteit een termijn waarbinnen de betrokkene aan de aanwijzing voldoet.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel79
  - number: '80.1'
    text: |-
      Indien een zorgverzekeraar, een verzekeraar als bedoeld in [artikel 77][ref1], het CAK dan wel een Wlz-uitvoerder,
      hierna te noemen: betrokkene, niet binnen de termijn, bedoeld in [artikel 79, tweede lid][ref2], aan een krachtens
      [artikel 77][ref3] onderscheidenlijk [78][ref4] gegeven aanwijzing voldoet, is de zorgautoriteit bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel78
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '77'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '77'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0020078
        artikel: '78'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 80.1.a
    text: een last onder bestuursdwang op te leggen, of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: 80.1.b
    text: |-
      ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die tot die kennisgeving hebben
      geleid:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: 80.1.b.1°
    text: |-
      dat de betrokkene verzekeringen als zorgverzekering aanbiedt of uitvoert die niet aan het bij of krachtens de
      [Zorgverzekeringswet][ref1] geregelde voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 80.1.b.2°
    text: |-
      dat de zorgverzekeraar dan wel de Wlz-uitvoerder in strijd handelt met een of meer door de zorgautoriteit genoemde,
      bij of krachtens de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2] geregelde bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: 80.1.b.3°
    text: |-
      dat aan de betrokkene een aanwijzing is gegeven dan wel een last onder dwangsom of een bestuurlijke boete is
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '80.2'
    text: |-
      De zorgautoriteit stelt, indien zij voornemens is een feit ter openbare kennis te brengen, de betrokkene daarvan in
      kennis onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '80.3'
    text: |-
      In afwijking van [artikel 4:8 van de Algemene wet bestuursrecht][ref1] is de zorgautoriteit niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '80.4'
    text: |-
      De beschikking om een feit ter openbare kennis te brengen, vermeldt in ieder geval het feit dat ter openbare kennis
      wordt gebracht alsmede de wijze en de termijn waarop dit zal geschieden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '80.5'
    text: |-
      Het ter openbare kennis brengen geschiedt niet eerder dan nadat vijf werkdagen zijn verstreken na de bekendmaking,
      bedoeld in het tweede lid, aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '80.6'
    text: |-
      Indien de betrokkene verzoekt een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] te treffen, wordt de werking van de beschikking opgeschort
      totdat er een uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '80.7'
    text: |-
      Indien het adequaat functioneren van de verzekeringsmarkt of de positie van de verzekeraars op die markt geen
      uitstel toelaat, kan de zorgautoriteit, in afwijking van het tweede tot en met zesde lid, het feit onverwijld ter
      openbare kennis brengen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '80.8'
    text: |-
      Indien de betrokkene na een publicatie als bedoeld in het eerste lid, onderdeel b, alsnog voldoet aan de
      aanwijzing, doet de zorgautoriteit hiervan op dezelfde wijze mededeling als bij de voorafgaande publicatie.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel80
  - number: '81.1'
    text: |-
      Indien een zorgaanbieder of een ziektekostenverzekeraar, voorzover niet in een geval als bedoeld
      in [artikel 80, eerste lid][ref1], hierna te noemen: betrokkene, niet binnen de termijn, bedoeld in
      [artikel 79][ref2], aan een krachtens [artikel 76][ref3] of [78c][ref4] gegeven aanwijzing voldoet, is de
      zorgautoriteit bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel78c
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '76'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0020078
        artikel: 78c
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 81.1.a
    text: een last onder bestuursdwang op te leggen,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
  - number: 81.1.b
    text: |-
      ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die tot die kennisgeving hebben
      geleid:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
  - number: 81.1.b.1°
    text: |-
      dat de betrokkene in strijd handelt met een of meer door de zorgautoriteit genoemde, bij of krachtens deze wet
      geregelde bepalingen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
  - number: 81.1.b.2°
    text: |-
      dat aan de betrokkene een aanwijzing is gegeven dan wel een last onder dwangsom of een bestuurlijke boete is
      opgelegd, of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
  - number: 81.1.c
    text: |-
      het bedrag, bedoeld in [artikel 76, tweede lid][ref1], in te vorderen.
      [Titel 4.4 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '76'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '81.2'
    text: |-
      Indien het adequaat functioneren van de zorgverlenings- of zorginkoopmarkt of de positie van zorgaanbieders op die
      markt geen uitstel toelaat, kan de zorgautoriteit het feit onverwijld ter openbare kennis brengen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
  - number: '81.3'
    text: |-
      Het [tweede tot en met achtste lid van artikel 80][ref1] zijn van overeenkomstige toepassing met betrekking tot het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel80
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 81a.1
    text: |-
      Indien een zorgaanbieder niet binnen de termijn, bedoeld in [artikel 79, tweede lid][ref1], aan een krachtens
      [artikel 78a][ref2] gegeven aanwijzing voldoet, is de zorgautoriteit bevoegd: - een last onder bestuursdwang op te
      leggen, of
        - ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die
      tot de kennisgeving hebben geleid: 1e dat de zorgaanbieder in strijd handelt met
      [artikel 11i, tweede lid, van de Wet kwaliteit, klachten en geschillen zorg][ref3]; 2e dat aan de zorgaanbieder een
      aanwijzing is gegeven dan wel een last onder dwangsom of bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel78a
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel11i
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '79'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 78a
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: 11i
  - number: 81a.2
    text: |-
      [Artikel 80, tweede tot en met zesde lid en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel80
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 81a.3
    text: |-
      Indien het adequaat functioneren van de zorgverleningsmarkt of de positie van de zorgaanbieders
      op die markt geen uitstel toelaat, kan de zorgautoriteit, in afwijking van het tweede lid juncto
      [artikel 80, tweede tot en met zesde lid][ref1], het feit onverwijld ter openbare kennis brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel80
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '80'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 81b.1
    text: |-
      Indien een Regionale Ambulancevoorziening als bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref1] niet binnen de termijn, bedoeld in
      [artikel 79, tweede lid][ref2], aan een krachtens [artikel 78g][ref3] gegeven aanwijzing voldoet, is de
      zorgautoriteit bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel78g
