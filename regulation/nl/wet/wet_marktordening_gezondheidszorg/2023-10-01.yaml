  - number: '85.2'
    text: |-
      De bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste € 500 000 of, indien dat meer is,
      tien procent van de omzet van de onderneming in Nederland.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel85
  - number: '85.3'
    text: |-
      De berekening van de omzet, bedoeld in het tweede lid, geschiedt op de voet van hetgeen
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] bepaalt voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel85
    references:
