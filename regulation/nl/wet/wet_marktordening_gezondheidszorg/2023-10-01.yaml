        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '104.2'
    text: |-
      De zorgautoriteit draagt de op grond van de [artikelen 82][ref1] en [85][ref2] ingevorderde dwangsommen en
      bestuurlijke boetes af aan ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel85
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '82'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '104.3'
    text: |-
      De zorgautoriteit draagt de op grond van de [artikelen 83][ref1] en [86 tot en met 89][ref2] ingevorderde
      dwangsommen en bestuurlijke boetes af aan het Zorgverzekeringsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel86
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel104
