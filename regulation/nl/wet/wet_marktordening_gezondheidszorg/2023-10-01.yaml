  - number: '76.2'
    text: |-
      Indien de zorgautoriteit een zorgaanbieder een aanwijzing geeft ter handhaving van [artikel 35, zevende lid][ref1],
      of [artikel 37, eerste lid, aanhef en onder d][ref2], kan de aanwijzing voor zover het betreft de hoogte van
      het af te dragen bedrag uitsluitend de verplichting inhouden dat de zorgaanbieder een door de zorgautoriteit
      te bepalen bedrag van ten hoogste de overschrijding van de in die artikelen bedoelde vaste grens, bovengrens of
      bandbreedtegrens afdraagt aan het Zorgverzekeringsfonds of het Fonds langdurige zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '35'
