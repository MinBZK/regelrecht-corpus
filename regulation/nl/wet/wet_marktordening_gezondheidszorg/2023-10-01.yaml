  - number: 16a
    text: |-
      De zorgautoriteit is tevens belast met toezicht op de naleving door de ziektekostenverzekeraar van
      [artikel 15f van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel15f
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: 15f
  - number: '17.1'
    text: |-
      Met het oog op een effectieve en efficiënte besluitvorming over de wijze van behandeling van aangelegenheden van
      wederzijds belang en het verzamelen van informatie ten behoeve daarvan worden daarover afspraken gemaakt tussen de
      zorgautoriteit en:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.a
    text: de Autoriteit Consument en Markt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.b
    text: de Inspectie gezondheidszorg en jeugd;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.c
    text: De Nederlandsche Bank;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.d
    text: de Stichting Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.e
    text: het Zorginstituut;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.f
    text: |-
      het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013798#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0013798
        artikel: '8'
  - number: 17.1.g
    text: het College sanering;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.h
    text: de FIOD-ECD;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.i
    text: het College van procureurs-generaal van het Openbaar Ministerie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.j
    text: de Autoriteit persoonsgegevens en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.k
    text: Onze Minister, voor zo ver het betreft het toezicht op het CAK;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.l
    text: het CAK;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: 17.1.m
    text: de Inspectie Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: '17.2'
    text: |-
      De afspraken houden in ieder geval in dat een bestuursorgaan aan derden geen informatie vraagt indien een van de
      andere genoemde bestuursorganen de benodigde informatie kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel17
  - number: '18.1'
    text: |-
      De zorgautoriteit en de Autoriteit Consument en Markt bevorderen dat belanghebbenden zich bij aangelegenheden
      waarbij mogelijk sprake is van samenloop van bevoegdheden eerst wenden tot de zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel18
  - number: '18.2'
    text: |-
      Van samenloop van bevoegdheden als bedoeld in het eerste lid is sprake in een situatie waarin de mogelijke
      uitoefening van bevoegdheden van de zorgautoriteit op grond van [artikel 48][ref1] van deze wet en de mogelijke
      uitoefening van bevoegdheden van de Autoriteit Consument en Markt op grond van de [Mededingingswet][ref2] of
      Europese wet- en regelgeving samenvallen dan wel kunnen samenvallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0008691
  - number: '18.3'
    text: |-
      De zorgautoriteit past bij mogelijke samenloop van bevoegdheden voor zover mogelijk eerst de bevoegdheden toe die
      zij op grond van deze wet heeft, alvorens de Autoriteit Consument en Markt de haar ten dienste staande bevoegdheden
      op grond van de [Mededingingswet][ref1] toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008691
  - number: '18.4'
    text: |-
      De zorgautoriteit richt zich naar de uitleg van begrippen die de Autoriteit Consument en Markt hanteert in het
      kader van de toepassing van het mededingingsrecht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel18
  - number: '18.5'
    text: |-
      Van hetgeen bepaald is in het derde lid kan worden afgeweken indien de zorgautoriteit en de Autoriteit Consument
      en Markt in gezamenlijk overleg tot het oordeel komen dat een aangelegenheid op basis van effectiviteit van het
      wettelijke instrumentarium of uit efficiëntie of andere overwegingen beter door de Autoriteit Consument en Markt of
      door de Autoriteit Consument en Markt en de zorgautoriteit gezamenlijk kan worden behandeld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel18
  - number: '19.1'
    text: |-
      De zorgautoriteit volgt het oordeel van de Inspectie gezondheidszorg en jeugd over de kwaliteit van het handelen
      van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel19
  - number: '19.2'
    text: |-
      De zorgautoriteit volgt het oordeel van de Inspectie Justitie en Veiligheid over beveiligingsaspecten van
      forensische zorg.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel19
  - number: 19a
    text: |-
      De zorgautoriteit volgt de eenduidige uitleg van het Zorginstituut, bedoeld in
      [artikel 2a, derde lid, van de Wet kwaliteit, klachten en geschillen zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 2a
  - number: '20.1'
    text: 'De zorgautoriteit:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: 20.1.a
    text: |-
      geeft voorlichting omtrent de inhoud van haar regels, beleidsregels, beschikkingen en besluiten en ten algemene
      over de uitvoering van haar taken;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: 20.1.b
    text: |-
      stelt alle naar haar oordeel relevante informatie over regels, beleidsregels, beschikkingen en besluiten
      beschikbaar op internet;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: 20.1.c
    text: legt haar regels, beleidsregels, beschikkingen en besluiten voor een ieder ter inzage.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: '20.2'
    text: 'De zorgautoriteit geeft in de Staatscourant kennis van de terinzagelegging van:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: 20.2.a
    text: |-
      de beschikkingen met betrekking tot aanmerkelijke marktmacht onder vermelding van de opgelegde verplichting en de
      tijdsduur van de verplichting;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: 20.2.b
    text: de beschikkingen met betrekking tot tarieven en prestatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
  - number: '20.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op besluiten en beschikkingen van de zorgautoriteit ter
      uitvoering van [hoofdstuk 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0020078
        hoofdstuk: '6'
  - number: '21.1'
    text: |-
      De zorgautoriteit rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid, doeltreffendheid en
      doelmatigheid van voorgenomen beleid in verband met de uitoefening van haar taken, genoemd in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '21.2'
    text: |-
      De zorgautoriteit signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen inzake markten op
      het gebied van de zorg.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel21
  - number: '21.3'
    text: |-
      De rapportages en signaleringen bevatten geen medische persoonsgegevens als bedoeld in [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel60
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
  - number: '22.1'
    text: |-
      Onze Minister verstrekt desgevraagd aan de zorgautoriteit de voor de uitoefening van haar taak benodigde gegevens
      en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22
  - number: '22.2'
    text: |-
      Onze Minister en de zorgautoriteit stellen gezamenlijk een informatiestatuut vast. Het informatiestatuut bevat
      inhoudelijke en procedurele afspraken met betrekking tot de verstrekking van informatie, bedoeld in het eerste lid
      alsmede in [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '22.3'
    text: |-
      De gegevens en inlichtingen, bedoeld in het eerste lid alsmede in
      [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1], hebben geen betrekking op medische
      persoonsgegevens als bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel60
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
  - number: 22a.1
    text: |-
      Onze Minister van Veiligheid en Justitie verstrekt desgevraagd aan de zorgautoriteit de voor de uitoefening van
      haar taak benodigde gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22a
  - number: 22a.2
    text: |-
      Onze Minister van Veiligheid en Justitie stelt in overeenstemming met Onze Minister een informatiestatuut vast. Het
      informatiestatuut bevat inhoudelijke en procedurele afspraken met betrekking tot de verstrekking van informatie,
      bedoeld in het eerste lid alsmede in [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: 22a.3
    text: |-
      De gegevens en inlichtingen, bedoeld in het eerste lid alsmede in
      [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1], hebben geen betrekking op de medische
      persoonsgegevens als bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel60
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '60'
        hoofdstuk: '5'
  - number: 22a.4
    text: |-
      De gegevens en inlichtingen bedoeld in [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1], hebben
      geen betrekking op de bedrijfsvoering van zorgaanbieders die forensische zorg leveren of kunnen leveren en die een
      onevenredige inbreuk maken op hun onderhandelingspositie bij het overeenkomen van de levering van die zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: '23.1'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars voorzien in hun reglementen en voorwaarden in de mogelijkheid tot het
      doen van beklag over door partijen gebruikte formulieren.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: '23.2'
    text: |-
      Het beklag wordt gedaan bij de zorgautoriteit. Reglementen en voorwaarden dienen een bepaling te bevatten er
      toe strekkende dat uitspraken door de zorgautoriteit de zorgaanbieders, ziektekostenverzekeraars en consumenten
      strekken tot bindend advies.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: '23.3'
    text: 'Het bindend advies wordt gegeven na ontvangst van het beklag en kan er toe strekken dat het formulier:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: 23.3.a
    text: overbodig of te ingewikkeld is en niet behoeft te worden ingevuld;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: 23.3.b
    text: |-
      ingewikkeld is en een volgende keer zal worden beoordeeld als een formulier als bedoeld in onderdeel a, indien het
      niet binnen twee weken na het advies is aangepast;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: 23.3.c
    text: geen aanleiding geeft het beklag gegrond te verklaren.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel23
  - number: '24.1'
    text: |-
      De zorgautoriteit zendt voor 1 november aan Onze Minister en aan het Zorginstituut een samenvattend rapport over
      de rechtmatigheid van de uitvoering van de [Zorgverzekeringswet][ref1] en de daarop gebaseerde regelgeving door de
      zorgverzekeraars en het CAK in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '24.2'
    text: Onze Minister zendt het rapport aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel24
  - number: '24.3'
    text: De zorgautoriteit stelt het rapport algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel24
  - number: '24.4'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van het rapport.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel24
  - number: '25.1'
    text: |-
      De zorgautoriteit maakt, onverminderd haar bevoegdheid tot eigen onderzoek, bij de uitoefening van haar taken,
      genoemd in [artikel 16, onder b en c][ref1], zoveel mogelijk gebruik van de resultaten van door anderen verrichte
      controles.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '25.2'
    text: |-
      De zorgverzekeraars en het CAK verstrekken desgevraagd aan de zorgautoriteit de informatie over de uitgevoerde
      werkzaamheden van hen die met de controle zijn belast en lichten haar volledig in over de resultaten van de
      controle door overlegging van rapporten of op andere door de zorgautoriteit aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel25
  - number: '26.1'
    text: De zorgautoriteit stelt op verzoek van Onze Minister onderzoek in bij zorgverzekeraars of het CAK.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel26
  - number: '26.2'
    text: De zorgautoriteit kan tevens op verzoek van het Zorginstituut onderzoek bij zorgverzekeraars of het CAK instellen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel26
  - number: '27.1'
    text: |-
      De zorgautoriteit kan regels stellen met betrekking tot de controle door zorgverzekeraars, de inhoud en inrichting
      van het accountantsverslag, bedoeld in [artikel 38 van de Zorgverzekeringswet][ref1], en van het aan dat verslag
      ten grondslag liggende onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel38
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '38'
  - number: '27.2'
    text: |-
      Het CAK zendt voor 1 juli aan de zorgautoriteit een financieel verslag waarin het rapporteert over
      de uitvoering in het voorafgaande jaar van hetgeen bij of krachtens de [Zorgverzekeringswet][ref1],
      met uitzondering van de [artikelen 69a][ref2], [69b][ref3], [70][ref4] en [122a van die wet][ref5] en
      de [Invoerings- en aanpassingswet Zorgverzekeringswet][ref6] is geregeld en van de taken, bedoeld in
      [artikel 6.1.2, onderdeel l, van de Wet langdurige zorg][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel69a
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel69b
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel70
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
      [ref6]: https://wetten.overheid.nl/BWBR0018830
      [ref7]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 69a
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 69b
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '70'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: 122a
      - id: ref6
        bwb_id: BWBR0018830
      - id: ref7
        bwb_id: BWBR0035917
        artikel: '6'
  - number: '27.3'
    text: |-
      Het financieel verslag gaat vergezeld van een verklaring omtrent de getrouwheid en rechtmatigheid afgegeven door
      een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een verslag
      van zijn bevindingen over de ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '27.4'
    text: |-
      Het CAK zendt voor 1 juli aan de zorgautoriteit in tweevoud een uitvoeringsverslag waarin het rapporteert
      over de uitvoering in het voorafgaande jaar van hetgeen bij of krachtens de [Zorgverzekeringswet][ref1],
      met uitzondering van de [artikelen 69a][ref2], [69b][ref3], [70][ref4] en [122a van die wet][ref5], en
      de [Invoerings- en aanpassingswet Zorgverzekeringswet][ref6] is geregeld en van de taken, bedoeld in
      [artikel 6.1.2, onderdeel l, van de Wet langdurige zorg][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel69a
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel69b
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel70
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
      [ref6]: https://wetten.overheid.nl/BWBR0018830
      [ref7]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 69a
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 69b
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '70'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: 122a
      - id: ref6
        bwb_id: BWBR0018830
      - id: ref7
        bwb_id: BWBR0035917
        artikel: '6'
  - number: '27.5'
    text: |-
      Het CAK voegt bij het uitvoeringsverslag twee exemplaren van een verslag met bevindingen van een accountant als
      bedoeld in [artikel 393 van boek 2 van het Burgerlijk Wetboek][ref1] over de vraag of:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 27.5.a
    text: |-
      het uitvoeringsverslag overeenkomstig het vierde lid en het daaromtrent krachtens het zesde lid bepaalde is
      opgesteld;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
  - number: 27.5.b
    text: |-
      de uitvoering is geschied overeenkomstig de verplichtingen die bij of krachtens de wet in het voorafgaande jaar op
      het CAK rustten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
  - number: '27.6'
    text: |-
      De zorgautoriteit stelt nadere regels vast omtrent de inhoud en inrichting van het financieel verslag, het
      uitvoeringsverslag, de verklaring, bedoeld in het derde lid, en van het verslag, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
  - number: '27.7'
    text: |-
      De zorgautoriteit zendt het Zorginstituut onverwijld een exemplaar van de in het tweede tot en met vijfde lid,
      bedoelde stukken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel27
  - number: '28.1'
    text: |-
      De zorgautoriteit zendt voor 1 december aan Onze Minister en aan het Zorginstituut een samenvattend rapport over
      de rechtmatigheid en de doelmatigheid van de uitvoering van de [Wet langdurige zorg][ref1] en de daarop gebaseerde
      regelgeving door de Wlz-uitvoerders en het CAK, in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '28.2'
    text: Onze Minister zendt het rapport aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel28
  - number: '28.3'
    text: De zorgautoriteit stelt het rapport algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel28
  - number: '28.4'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van het rapport.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel28
  - number: '29.1'
    text: |-
      De zorgautoriteit maakt, onverminderd haar bevoegdheid tot eigen onderzoek, bij de uitoefening van haar taak,
      genoemd in [artikel 16, onder d][ref1], zoveel mogelijk gebruik van de resultaten van door anderen verrichte
      controles.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '29.2'
    text: |-
      De Wlz-uitvoerders en het CAK verstrekken desgevraagd aan de zorgautoriteit de informatie over de uitgevoerde
      werkzaamheden van hen die met de controle zijn belast en lichten haar volledig in over de resultaten van de
      controle door overlegging van rapporten of op andere door de zorgautoriteit aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel29
  - number: '30.1'
    text: De zorgautoriteit stelt op verzoek van Onze Minister onderzoek in bij Wlz-uitvoerders en het CAK.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel30
  - number: '30.2'
    text: |-
      De zorgautoriteit kan tevens op verzoek van het Zorginstituut onderzoek bij bij de Wlz-uitvoerders of het CAK
      instellen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel30
  - number: '31'
    text: 'De zorgautoriteit kan regels stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31
  - number: 31.a
    text: |-
      de controle door de Wlz-uitvoerders en, voor zover betrekking hebbend op de uitvoering van de in
      [artikel 6.1.2, onderdelen a, b, c en l, van de Wet langdurige zorg][ref1] bedoelde taken, door het CAK,


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '6'
  - number: 31.b
    text: |-
      de wijze waarop een Wlz-uitvoerder zijn financieel verslag, bedoeld in [artikel 4.3.1 van die wet][ref1] of zijn
      uitvoeringsverslag, bedoeld in [artikel 4.3.2 van die wet][ref2], inricht,


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '4'
  - number: 31.c
    text: |-
      de inhoud en inrichting van de verklaring en van het accountantsverslag, bedoeld in
      [artikel 4.3.1 van de Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
  - number: 31.d
    text: |-
      de inhoud en inrichting van het accountantsverslag, bedoeld in [artikel 4.3.2 van de Wet langdurige zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '4'
  - number: 31a.1
    text: |-
      De zorgautoriteit maakt, onverminderd haar bevoegdheid tot eigen onderzoek, bij de uitoefening van haar taak,
      bedoeld in [artikel 16, onder k][ref1], zoveel mogelijk gebruik van de resultaten van door anderen verrichte
      controles.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 31a.2
    text: |-
      De organen van de woonplaats en van de verblijfplaats en het bevoegd orgaan verstrekken desgevraagd aan de
      zorgautoriteit de informatie over de uitgevoerde werkzaamheden van hen die met de controle zijn belast en
      lichten haar volledig in over de resultaten van de controle door overlegging van rapporten of op andere door de
      zorgautoriteit aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31a
  - number: 31b.1
    text: |-
      De zorgautoriteit stelt op verzoek van Onze Minister onderzoek in bij het orgaan van de woonplaats, het orgaan van
      de verblijfplaats of het bevoegd orgaan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31b
  - number: 31b.2
    text: |-
      De zorgautoriteit kan tevens op verzoek van het CAK onderzoek doen bij het orgaan van de woonplaats, het orgaan van
      de verblijfplaats of het bevoegd orgaan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31b
  - number: 31c
    text: |-
      De zorgautoriteit kan regels stellen met betrekking tot de controle door het orgaan van de woonplaats, het orgaan
      van de verblijfplaats of het bevoegd orgaan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31c
  - number: 31d.1
    text: |-
      De organen van de woonplaats en van de verblijfplaats en het bevoegd orgaan zenden voor 1 juli aan de
      zorgautoriteit in tweevoud een uitvoeringsverslag over de uitvoering in het voorafgaande kalenderjaar van, voor
      zover het zorg betreft, de socialezekerheidsverordening, de toepassingsverordening en de verdragen inzake sociale
      zekerheid waarbij Nederland partij is.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
  - number: 31d.2
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gesteld omtrent de inhoud van het uitvoeringsverslag.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
  - number: 31d.3
    text: |-
      De organen van de woonplaats en van de verblijfplaats en het bevoegd orgaan voegen bij het
      uitvoeringsverslag twee exemplaren van een verslag met bevindingen van een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] over de vraag of:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 31d.3.a
    text: het uitvoeringsverslag overeenkomstig de daarvoor geldende regels is opgesteld;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
  - number: 31d.3.b
    text: |-
      de uitvoering is geschied overeenkomstig de verplichtingen die in het voorafgaande kalenderjaar op de organen
      rustten bij of krachtens, voor zover het zorg betreft, de socialezekerheidsverordening, de toepassingsverordening
      en de verdragen inzake sociale zekerheid waarbij Nederland partij is.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
  - number: 31d.4
    text: |-
      De zorgautoriteit kan regels stellen met betrekking tot de inhoud en inrichting van het accountantsverslag, bedoeld
      in het derde lid, en van het aan dat verslag ten grondslag liggende onderzoek.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31d
  - number: 31e.1
    text: |-
      De zorgautoriteit zendt voor 1 november aan het CAK een rapport over de rechtmatigheid van de uitvoering in het
      voorafgaande kalenderjaar door de organen van de woonplaats en van de verblijfplaats en het bevoegd orgaan van,
      voor zover het zorg betreft, de socialezekerheidsverordening, de toepassingsverordening en de verdragen inzake
      sociale zekerheid waarbij Nederland partij is.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31e
  - number: 31e.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van het rapport.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel31e
  - number: '32.1'
    text: |-
      De zorgautoriteit onderzoekt, met inachtneming van [artikel 65][ref1], de concurrentieverhoudingen en het
      marktgedrag op het gebied van de zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '65'
        hoofdstuk: '5'
  - number: '32.2'
    text: 'Het onderzoek kan zich onder meer richten op:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: 32.2.a
    text: |-
      de totstandkoming van overeenkomsten met betrekking tot zorg, tarieven of ziektekostenverzekeringen, naar de
      voorwaarden in die overeenkomsten en naar de resultaten daarvan;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: 32.2.b
    text: de marktwerking in de markten voor zorgverlening, zorginkoop en ziektekostenverzekeringen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: 32.2.c
    text: |-
      de informatieverstrekking door zorgaanbieders en ziektekostenverzekeraars aan de consumenten en de
      doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid van die informatie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: 32.2.d
    text: |-
      het presteren van zorgaanbieders en van ziektekostenverzekeraars, mede met het oog op de onderlinge vergelijking
      daarvan;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: 32.2.e
    text: |-
      de onderbouwing en ontwikkeling van kosten en prijzen, mede in relatie tot de kwaliteit, van zorgverlening en
      ziektekostenverzekering.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel32
  - number: '33'
    text: |-
      De zorgautoriteit kan haar bevindingen op grond van het onderzoek, bedoeld in [artikel 32][ref1], openbaar maken,
      met uitzondering van gegevens en inlichtingen die naar hun aard vertrouwelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel32
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '34.1'
    text: |-
      Een procedure die een ziektekostenverzekeraar of zorgaanbieder hanteert als voorwaarde voor het verlenen van
      diensten of zorg aan een andere zorgaanbieder of aan een consument mag uitsluitend informatie verlangen die van
      rechtstreeks belang is voor het onderwerp waarop die procedure betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: '34.2'
    text: |-
      Bij verandering van ziektekostenverzekeraar blijven alle met betrekking tot de betrokken verzekerde gehanteerde
      procedures geldig.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: '34.3'
    text: 'De zorgautoriteit kan regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: 34.3.a
    text: verrichtingen waarvoor geen procedure mag worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: 34.3.b
    text: de geldigheid van eenzelfde procedure voor een aantal handelingen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: 34.3.c
    text: |-
      de eenvormige invulling van procedures, waarbij kan worden voorgeschreven dat deze uitsluitend langs elektronische
      weg worden toegepast.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel34
  - number: '35.1'
    text: 'Het is een zorgaanbieder verboden een tarief in rekening te brengen:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: 35.1.a
    text: |-
      dat niet overeenkomt met het tarief dat voor de betrokken prestatie op grond van
      [artikel 50, eerste lid, onderdeel b][ref1], is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 35.1.b
    text: |-
      dat niet ligt binnen de tariefruimte die op grond van [artikel 50, eerste lid, onderdeel c][ref1], voor de
      betrokken prestatie is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 35.1.c
    text: |-
      voor een prestatie waarvoor geen prestatiebeschrijving op grond van [artikel 50, eerste lid, onderdeel d][ref1],
      is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 35.1.d
    text: |-
      voor een prestatie waarvoor een andere prestatiebeschrijving wordt gehanteerd dan op grond van
      [artikel 50, eerste lid, onderdeel d][ref1], is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 35.1.e
    text: anders dan op de wijze die overeenkomstig deze wet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: '35.2'
    text: |-
      Het is een zorgaanbieder verboden een tarief als bedoeld in het eerste lid, te betalen aan een andere zorgaanbieder
      of aan derden te vergoeden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: '35.3'
    text: |-
      Het is een ziektekostenverzekeraar verboden een tarief als bedoeld in het eerste lid, te betalen of aan derden
      te vergoeden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: '35.4'
    text: |-
      Een zorgaanbieder en een ziektekostenverzekeraar kunnen aan het aanbieden, overeenkomen of leveren van een
      prestatie als bedoeld in het eerste lid, onder c of d, dan wel aan het in rekening brengen, betalen of aan een
      derde vergoeden van een tarief als bedoeld in het eerste lid, geen rechten ontlenen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: '35.5'
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing op een verzekeraar in
      de zin van de [Wet op het financieel toezicht][ref1], voor zover niet begrepen onder
      [artikel 1, eerste lid, onder f, sub 3][ref2], van deze wet, op het orgaan van de woonplaats, op het orgaan van de
      verblijfplaats en op het bevoegd orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '1'
        hoofdstuk: '1'
  - number: '35.6'
    text: |-
      Indien de zorgautoriteit een regel heeft vastgesteld als bedoeld in [artikel 37, eerste lid][ref1], is het een
      zorgaanbieder als bedoeld in het vierde lid van dat artikel, die de betalingen uit in rekening gebrachte tarieven
      ontvangt, verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 35.6.a
    text: meer over te dragen dan het bedrag dat bij of krachtens deze wet is bepaald;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: 35.6.b
    text: af te wijken van de bij die regel gestelde voorwaarden, voorschriften en beperkingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: '35.7'
    text: |-
      Indien de zorgautoriteit bij de vaststelling van een tarief als bedoeld in
      [artikel 50, eerste lid, onderdelen a, b of c][ref1], op grond van het tweede lid van dat artikel een grens heeft
      vastgesteld, is het een zorgaanbieder verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 35.7.a
    text: |-
      met de som van de tarieven voor de betrokken prestaties gerelateerd aan de daarbij aangegeven periode van die grens
      af te wijken;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: 35.7.b
    text: af te wijken van de aan de grens verbonden voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35
  - number: 35a
    text: |-
      Het is een zorgaanbieder verboden een bedrag als bedoeld in [artikel 56a][ref1] in rekening te brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 35a.a
    text: |-
      dat hoger is dan het bedrag dat als bijdrage voor de beschikbaarheid van de desbetreffende zorg op grond van
      [artikel 56a, eerste lid][ref1], is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 35a.b
    text: anders dan op de wijze die overeenkomstig deze wet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35a
  - number: 35b
    text: |-
      Het is een ziektekostenverzekeraar verboden een bedrag als bedoeld in [artikel 56b][ref1] in rekening te brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56b
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 35b.a
    text: |-
      dat hoger is dan het bedrag dat voor de betrokken vereffening op grond van [artikel 56b, eerste lid][ref1], is
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56b
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 35b.b
    text: anders dan op de wijze die overeenkomstig deze wet is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel35b
  - number: '36.1'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars voeren een administratie waaruit in ieder geval de overeengekomen en
      geleverde prestaties blijken, alsmede wanneer die prestaties zijn geleverd, aan welke patiënt onderscheidenlijk aan
      welke verzekerde die prestaties door een zorgaanbieder zijn geleverd, de daarvoor in rekening gebrachte tarieven en
      de in verband daarmee ontvangen of verrichte betalingen of vergoedingen aan derden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
  - number: '36.2'
    text: |-
      Zorgaanbieders en ziektekostenverzekeraars voeren op zodanige wijze een administratie dat te allen tijde mogelijk
      is elk tarief dat overeenkomstig [artikel 50][ref1] of [52][ref2] is vastgesteld of dat ligt binnen de tariefruimte
      die op grond van artikel 50, eerste lid, onderdeel c, is vastgesteld, in rekening te brengen, te betalen of aan
      derden te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel52
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '36.3'
    text: |-
      De zorgautoriteit kan, ten behoeve van de vergelijkbaarheid van gegevens, toepassing van uniforme principes bij
      de toerekening van kosten en opbrengsten en bij het registreren van gegevens over kwaliteit en opbrengsten, nadere
      regels stellen betreffende de administratie van:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
  - number: 36.3.a
    text: |-
      zorgaanbieders en ziektekostenverzekeraars met het oog op de bevordering van concurrentie, het voorkomen van
      fraude, de inzichtelijkheid en toegankelijkheid van die administratie alsmede het vaststellen van tarieven, en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
  - number: 36.3.b
    text: |-
      zorgverzekeraars en Wlz-uitvoerders met het oog op de bevordering van een goede uitvoering van de
      [Zorgverzekeringswet][ref1] onderscheidenlijk de [Wet langdurige zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: '36.4'
    text: |-
      De in het derde lid bedoelde regels worden ten aanzien van zorgverzekeraars en Wlz-uitvoerders gesteld in
      overeenstemming met het Zorginstituut.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36
  - number: 36a.1
    text: |-
      De organen van de woonplaats en van de verblijfplaats en het bevoegd orgaan voeren een zodanige administratie dat
      daaruit in ieder geval de geleverde prestaties blijken, alsmede wanneer die prestaties zijn geleverd, aan welke
      persoon die prestaties door een zorgaanbieder zijn geleverd, de daarvoor in rekening gebrachte tarieven en de in
      verband daarmee ontvangen of verrichte betalingen of vergoedingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36a
  - number: 36a.2
    text: |-
      De administratie is gescheiden van de administratie van de overige activiteiten van de organen van de woonplaats en
      van de verblijfplaats en het bevoegd orgaan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36a
  - number: 36a.3
    text: 'De zorgautoriteit kan nadere regels stellen betreffende de administratie met het oog op:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36a
  - number: 36a.3.a
    text: het voorkomen van fraude en de inzichtelijkheid en toegankelijkheid van die administratie, en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36a
  - number: 36a.3.b
    text: |-
      de bevordering van een goede uitvoering, voor zover het zorg betreft, van de socialezekerheidsverordening, de
      toepassingsverordening en de verdragen inzake sociale zekerheid waarbij Nederland partij is.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel36a
  - number: '37.1'
    text: |-
      De zorgautoriteit kan regels vaststellen, inhoudende op welke wijze en onder welke voorwaarden of met inachtneming
      van welke voorschriften en beperkingen:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: 37.1.a
    text: aan wie, door wie, namens wie of via wie een tarief in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: 37.1.b
    text: aan wie of via wie een in rekening gebracht tarief mag worden betaald;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: 37.1.c
    text: |-
      door wie of namens wie ontvangsten voor een in rekening gebracht tarief moeten worden ingehouden, af- of
      overgedragen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: 37.1.d
    text: |-
      door wie of namens wie een door de zorgautoriteit te bepalen bedrag van ten hoogste de overschrijding van de op
      grond van [artikel 50, tweede lid, onderdelen a, c of d][ref1], vastgestelde grens wordt ingehouden en afgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '37.2'
    text: |-
      Indien de zorgautoriteit een regel vaststelt als bedoeld in het eerste lid, aanhef en onder a, voor een prestatie
      die door twee of meer zorgaanbieders gezamenlijk wordt geleverd, kan zij in die regel bepalen dat uitsluitend een
      daarbij door haar aangewezen zorgaanbieder een tarief voor die prestatie in rekening mag brengen aan de consument
      of diens ziektekostenverzekeraar, waarbij de andere bij die prestatie betrokken zorgaanbieders uitsluitend aan de
      aangewezen zorgaanbieder voor het deel van die prestatie dat door hen is geleverd een tarief in rekening kunnen
      brengen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: '37.3'
    text: |-
      Indien de zorgautoriteit een regel vaststelt als bedoeld in het eerste lid, aanhef en onder a, voor een prestatie
      die door twee of meer zorgaanbieders gezamenlijk wordt geleverd, kan zij, in die regel bepalen dat de bij
      die prestatie betrokken zorgaanbieders het tarief voor hun deel van die prestatie via de door haar aangewezen
      zorgaanbieder of een derde in rekening brengen bij de consument of diens ziektekostenverzekeraar en dat daarbij de
      aangewezen zorgaanbieder of derde het tarief op een zodanige wijze in rekening brengt dat duidelijk tot uitdrukking
      komt welk deel van de te verzenden rekening betrekking heeft op de door de eerstbedoelde zorgaanbieders verrichte
      deel van de prestatie.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: '37.4'
    text: |-
      Indien de zorgautoriteit in een regel als bedoeld in het eerste lid, aanhef en onder a en b, voor een prestatie
      die door twee of meer zorgaanbieders gezamenlijk wordt geleverd, bepaalt dat een in rekening gebracht tarief
      aan of via een in die regel aangewezen zorgaanbieder of derde, verder te noemen ontvanger, moet worden betaald,
      draagt deze ontvanger er zorg voor dat de ontvangsten voor de door de andere zorgaanbieders in rekening gebrachte
      tarieven worden ingehouden en alleen aan hen worden overgedragen indien en voor zover een betaling is ontvangen
      van de consument of diens ziektekostenverzekeraar. Indien de ontvanger tevens is aangewezen op grond van
      [artikel 37, eerste lid, aanhef en onder d][ref1], draagt deze er zorg voor dat de ontvangsten voor de door de
      andere zorgaanbieders in rekening gebrachte tarieven alleen worden overgedragen met inachtneming van hetgeen met
      betrekking tot die vergoeding of het geheel van vergoedingen voor een van de andere zorgaanbieders of voor alle
      andere zorgaanbieders gezamenlijk bij of krachtens deze wet is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '37.5'
    text: |-
      Indien en voor zover de zorgautoriteit in een regel als bedoeld in het eerste lid, aanhef en onder b,
      vaststelt aan wie of via wie een in rekening gebracht tarief moet worden betaald, is de consument of diens
      ziektekostenverzekeraar die betaling uitsluitend aan deze verschuldigd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: '37.6'
    text: |-
      De zorgautoriteit past het tweede en derde lid niet toe dan na een aanwijzing van Onze Minister op grond van
      [artikel 7][ref1]. [Artikel 8][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '37.7'
    text: |-
      Voor de verdere uitvoering van de wet wordt onder zorgaanbieder mede verstaan een ieder die de ontvangsten uit in
      rekening gebrachte tarieven ontvangt, inhoudt, af- of overdraagt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: '37.8'
    text: |-
      Het bepaalde bij of krachtens dit artikel is mede van toepassing ten aanzien van een ieder die voor een
      zorgaanbieder een administratie voert alsmede ten aanzien van degene die een administratie voert ten behoeve
      van of in verband met het in rekening brengen of betalen van een tarief, het ontvangen, inhouden, af- of
      overdragen van ontvangsten voor een in rekening gebracht tarief of het inhouden, af- of overdragen van een door
      de zorgautoriteit te bepalen bedrag in verband met het overschrijden van een door de zorgautoriteit op grond van
      [artikel 50, tweede lid, onderdelen a, c of d][ref1], vastgestelde grens.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '37.9'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing voor het in rekening brengen of betalen van een tarief voor
      een deel van een prestatie of een geheel van prestaties.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel37
  - number: '38.1'
    text: |-
      Zorgaanbieders informeren hun patiënten tijdig en zorgvuldig omtrent het voor de prestatie in rekening te brengen
      tarief.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.2'
    text: Zorgaanbieders brengen een tarief in rekening onder vermelding van de daarbijbehorende prestatiebeschrijving.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.3'
    text: 'De zorgautoriteit kan nadere regels stellen betreffende het door zorgaanbieders:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: 38.3.a
    text: bekendmaken van tarieven;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: 38.3.b
    text: specificeren van op verrichte prestaties betrekking hebbende rekeningen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.4'
    text: |-
      Zorgaanbieders maken informatie openbaar over de eigenschappen van aangeboden prestaties en diensten, op een
      zodanige wijze dat deze gegevens voor consumenten gemakkelijk vergelijkbaar zijn. Deze informatie betreft in ieder
      geval de tarieven en de kwaliteit van de aangeboden prestaties en diensten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.5'
    text: |-
      De zorgautoriteit kan, onverminderd de informatieverplichting die op grond van het vierde lid rust op
      zorgaanbieders, ten behoeve van de inzichtelijkheid van de markt periodiek informatie als bedoeld in het vierde lid
      openbaar maken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.6'
    text: |-
      Het vijfde lid geldt niet indien anderen reeds in voldoende mate in openbaarmaking van de daar bedoelde informatie
      voorzien.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '38.7'
    text: |-
      De zorgautoriteit kan regels stellen betreffende de informatievoorziening, bedoeld in het vierde lid, met het oog
      op de doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel38
  - number: '39.1'
    text: |-
      Zorgaanbieders dragen er zorg voor dat de door of namens hen verstrekte of beschikbaar gestelde informatie terzake
      van een product of dienst, waaronder reclame-uitingen, geen afbreuk doet aan het bepaalde bij of krachtens deze
      wet, de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2], en niet misleidend is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: '39.2'
    text: |-
      De zorgautoriteit kan regels stellen betreffende de informatievoorziening, bedoeld in het eerste lid, met het oog
      op de doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel39
  - number: '39.3'
    text: De in het tweede lid bedoelde regels worden gesteld in overeenstemming met de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel39
  - number: '40.1'
    text: |-
      Ziektekostenverzekeraars maken informatie openbaar over de eigenschappen van aangeboden producten en diensten op
      zodanige wijze dat deze gegevens voor consumenten gemakkelijk vergelijkbaar zijn. Deze informatie betreft in ieder
      geval de premies en de kwaliteit van de aangeboden producten en diensten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
  - number: '40.2'
    text: |-
      Zorgverzekeraars maken ten behoeve van de inzichtelijkheid, voor verzekeringsplichtigen, van de
      zorgverzekeringsmarkt informatie openbaar met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
  - number: 40.2.a
    text: de inhoud van de modelovereenkomsten;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
  - number: 40.2.b
    text: de wijze van dienstverlening aan verzekerden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
  - number: '40.3'
    text: |-
      Ziektekostenverzekeraars dragen er zorg voor dat de door of namens hen verstrekte of beschikbaar gestelde
      informatie ter zake van een product of dienst, waaronder reclame-uitingen, geen afbreuk doet aan het bepaalde bij
      of krachtens deze wet, de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2], en niet misleidend is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: '40.4'
    text: |-
      [Artikel 38, vijfde tot en met zevende lid][ref1], is ten aanzien van de informatieverstrekking door
      ziektekostenverzekeraars van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 40a.1
    text: |-
      De zorgaanbieder draagt zorg voor een eenduidige verdeling van taken, bevoegdheden en verantwoordelijkheden met
      betrekking tot de financiële bedrijfsvoering en legt die verdeling schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40a
  - number: 40a.2
    text: |-
      De zorgaanbieder onderscheidt in ieder geval in financiële zin zijn activiteiten op het gebied van de zorgverlening
      van zijn andere beroeps- of bedrijfsmatige activiteiten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40a
  - number: 40a.3
    text: |-
      Bij ministeriële regeling wordt bepaald welke financiële derivaten een zorgaanbieder voor welke doeleinden en onder
      welke voorwaarden kan aantrekken.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40a
  - number: 40a.4
    text: |-
      In de financiële administratie van de zorgaanbieder zijn ontvangsten, betalingen en de aangetrokken financiële
      derivaten traceerbaar naar bron en bestemming en is duidelijk wie op welk moment welke verplichtingen voor of
      namens de zorgaanbieder is aangegaan.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40a
  - number: 40a.5
    text: |-
      Het eerste, tweede en vierde lid zijn tevens van toepassing op een geen rechtspersoonlijkheid bezittend
      organisatorisch verband van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40a
  - number: 40b.1
    text: Een zorgaanbieder verantwoordt zich jaarlijks vóór 1 juni door het openbaar maken van een jaarverantwoording.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.2
    text: 'De jaarverantwoording bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.2.a
    text: een financiële verantwoording;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.2.b
    text: de op grond van ministeriële regeling bij de financiële verantwoording te voegen informatie, en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.2.c
    text: |-
      de op grond van ministeriële regeling te vermelden andere informatie betreffende de bedrijfsvoering van de
      zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.3
    text: 'Bij ministeriële regeling worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.3.a
    text: |-
      de inhoud en inrichting van de financiële verantwoording waaronder de op te nemen toelichting omtrent de door de
      zorgaanbieder aangetrokken financiële derivaten;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.3.b
    text: |-
      het door een registeraccountant of een Accountant-Administratieconsulent ten aanzien
      van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref1], uit te voeren onderzoek van de
      financiële verantwoording;


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: 40b.3.c
    text: de wijze waarop de jaarverantwoording openbaar wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.4
    text: |-
      In de ministeriële regelingen, bedoeld in het tweede en derde lid, kan onderscheid worden gemaakt tussen
      verschillende categorieën van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: 40b.5
    text: |-
      In de ministeriële regeling, bedoeld in het tweede en derde lid, worden zorgaanbieders die op twee opeenvolgende
      balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, hebben voldaan aan ten minste twee van
      de in [artikel 395a, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] genoemde vereisten, niet aangemerkt
      als een afzonderlijke categorie waarvoor afwijkende regels worden gesteld. De artikelen 395a, tweede lid, en
      [398, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel395a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel398
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 395a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '398'
  - number: 40b.6
    text: |-
      Dit artikel is tevens van toepassing op een geen rechtspersoonlijkheid bezittend organisatorisch verband van
      zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel40b
  - number: '41.1'
    text: |-
      In dit artikel en in de [artikelen 42][ref1] en [43][ref2] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 41.1.a
    text: |-
      overeenkomst op afstand: een verzekeringsovereenkomst betreffende het risico van ziektekosten tussen een
      ziektekostenverzekeraar en een consument, die wordt gesloten in het kader van een door de ziektekostenverzekeraar
      georganiseerd systeem van verkoop of dienstverrichting op afstand, waarbij tot en met de totstandkoming van die
      overeenkomst uitsluitend gebruik gemaakt wordt van een of meer technieken van communicatie op afstand;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
  - number: 41.1.b
    text: |-
      techniek voor communicatie op afstand: ieder middel dat, zonder gelijktijdige fysieke aanwezigheid van
      ziektekostenverzekeraar en consument, kan worden gebruikt voor het sluiten van een verzekeringsovereenkomst
      betreffende het risico van ziektekosten tussen die partijen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
  - number: '41.2'
    text: |-
      Een verzekerde kan een overeenkomst op afstand zonder een boete verschuldigd te zijn en zonder opgave van redenen
      ontbinden gedurende veertien kalenderdagen vanaf de dag waarop die overeenkomst is aangegaan, dan wel, indien dit
      later is, gedurende veertien kalenderdagen vanaf de dag waarop de informatie die de ziektekostenverzekeraar hem
      krachtens [artikel 43, tweede lid][ref1], dient te verstrekken, door hem is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '41.3'
    text: |-
      Indien een verzekerde gebruik wenst te maken van het in het tweede lid bedoelde recht, geeft hij daarvan voor het
      verstrijken van de in het tweede lid genoemde termijn kennis aan de ziektekostenverzekeraar volgens de instructies
      voor de uitoefening van dat recht, die hem krachtens [artikel 43, tweede lid][ref1], zijn gegeven. De kennisgeving
      wordt als tijdig aangemerkt indien zij schriftelijk of op een voor de ontvanger beschikbare en toegankelijke
      duurzame drager is verzonden voor het verstrijken van de termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '41.4'
    text: |-
      Indien aan een overeenkomst op afstand een andere overeenkomst verbonden is ten aanzien van een zaak of dienst
      die door de ziektekostenverzekeraar wordt geleverd of door een derde op grond van een overeenkomst tussen de
      ziektekostenverzekeraar en deze derde, brengt de ontbinding van de overeenkomst op afstand overeenkomstig het
      tweede lid, van rechtswege en zonder dat de verzekerde een boete verschuldigd is, de ontbinding mee van die
      verbonden overeenkomst.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel41
  - number: '42.1'
    text: Met de uitvoering van een overeenkomst op afstand wordt pas na toestemming van de verzekerde een begin gemaakt.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
  - number: '42.2'
    text: |-
      Indien de verzekerde gebruik maakt van zijn in [artikel 41, tweede lid][ref1], bedoelde recht, kan de
      ziektekostenverzekeraar uitsluitend een vergoeding vragen voor het product dat of dienst die krachtens de
      overeenkomst op afstand is geleverd. Deze vergoeding is:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 42.2.a
    text: |-
      niet hoger dan een bedrag dat evenredig is aan de verhouding tussen het reeds geleverde product of dienst en de
      volledige uitvoering van de overeenkomst op afstand; en
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
  - number: 42.2.b
    text: in geen geval zo hoog dat deze als een boete kan worden opgevat.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
  - number: '42.3'
    text: 'De ziektekostenverzekeraar kan slechts betaling van de in het tweede lid bedoelde vergoeding verlangen indien hij:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
  - number: 42.3.a
    text: |-
      kan aantonen dat de verzekerde overeenkomstig het bepaalde krachtens [artikel 43, tweede lid][ref1], is
      geïnformeerd over de in het tweede lid bedoelde vergoeding; en


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 42.3.b
    text: |-
      op uitdrukkelijk verzoek van de verzekerde met de uitvoering van de overeenkomst is begonnen voor het verstrijken
      van de in [artikel 41, tweede of derde lid][ref1], genoemde ontbindingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '42.4'
    text: |-
      De ziektekostenverzekeraar betaalt de consument zo spoedig mogelijk en uiterlijk binnen 30 kalenderdagen nadat
      hij de kennisgeving van de in [artikel 41][ref1] bedoelde ontbinding heeft ontvangen, al hetgeen hij krachtens de
      overeenkomst op afstand van hem ontvangen heeft terug, verminderd met het in het tweede lid bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '42.5'
    text: |-
      De consument geeft de ziektekostenverzekeraar onverwijld, en uiterlijk binnen 30 kalenderdagen nadat hij de
      kennisgeving van de in [artikel 41][ref1] bedoelde ontbinding heeft verzonden, alle zaken terug die hij van de
      ziektekostenverzekeraar heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '43.1'
    text: |-
      Van hetgeen bij of krachtens de [artikelen 41][ref1] en [42][ref2] is bepaald, kan niet ten nadele van de
      verzekerde worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel42
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '43.2'
    text: |-
      Ten aanzien van de informatieverstrekking door ziektekostenverzekeraars met betrekking tot
      overeenkomsten op afstand is het bij of krachtens de [artikelen 4:20, eerste en tweede lid][ref1], en
      [4:22 van de Wet op het financieel toezicht][ref2] ten aanzien van schadeverzekeraars bepaalde van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 43a
    text: |-
      De [artikelen 41, vierde lid][ref1], en [43][ref2] zijn van overeenkomstige toepassing op
      verzekeringsovereenkomsten tussen een ziektekostenverzekeraar en een consument die worden gesloten anders dan door
      middel van een overeenkomst op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '44'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 36][ref1] en [38 tot en met 43a][ref2] is mede van toepassing ten
      aanzien van degene die voor een zorgaanbieder of ziektekostenverzekeraar een administratie voert alsmede ten
      aanzien van degene die een administratie voert ten behoeve van of in verband met het aanbieden, overeenkomen,
      leveren, in rekening brengen, betalen of vergoeden aan derden van een prestatie of een tarief of het ontvangen van
      een betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '45'
    text: |-
      De zorgautoriteit kan, met het oog op de inzichtelijkheid van de zorgmarkten, de bevordering van de concurrentie
      of de tijdige signalering van risico’s voor de continuïteit van de bij de algemene maatregel van bestuur
      aangewezen vormen van zorg als bedoeld in [artikel 56a, eerste lid][ref1], regels stellen betreffende de wijze
      van totstandkoming van overeenkomsten met betrekking tot zorg of tarieven en betreffende de voorwaarden in die
      overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '46'
    text: |-
      De zorgautoriteit kan bij het vaststellen van een regel op grond van deze wet bepalen dat overeenkomsten in strijd
      met die regel nietig zijn indien en voor zover deze niet zijn aangepast binnen een door de zorgautoriteit te
      stellen termijn.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel46
  - number: '47'
    text: |-
      In de [artikelen 48][ref1] en [49][ref2] wordt onder aanmerkelijke marktmacht verstaan de positie van een of
      meer zorgaanbieders of ziektekostenverzekeraars om alleen dan wel gezamenlijk de ontwikkeling van daadwerkelijke
      concurrentie op de Nederlandse markt of een deel daarvan te kunnen belemmeren door de mogelijkheid zich in
      belangrijke mate onafhankelijk te gedragen van:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel49
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '49'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 47.a
    text: zijn concurrenten;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
  - number: 47.b
    text: ziektekostenverzekeraars, indien het een zorgaanbieder betreft;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
  - number: 47.c
    text: zorgaanbieders, indien het een zorgaanbieder betreft;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
  - number: 47.d
    text: zorgaanbieders, indien het een ziektekostenverzekeraar betreft, of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
  - number: 47.e
    text: consumenten.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel47
  - number: '48.1'
    text: |-
      Indien de zorgautoriteit van oordeel is dat een of meer zorgaanbieders of een of meer ziektekostenverzekeraars
      alleen dan wel gezamenlijk beschikt onderscheidenlijk beschikken over aanmerkelijke marktmacht op een door de
      zorgautoriteit volgens de beginselen van het algemeen mededingingsrecht afgebakende markt, kan de zorgautoriteit
      die zorgaanbieder of zorgaanbieders dan wel die ziektekostenverzekeraar of ziektekostenverzekeraars een of meer van
      de volgende verplichtingen opleggen:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.a
    text: |-
      de verplichting om door de zorgautoriteit te bepalen categorieën van informatie aan door de zorgautoriteit te
      bepalen categorieën van belanghebbenden op een door de zorgautoriteit te bepalen wijze bekend te maken;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.b
    text: |-
      de verplichting om bij de levering van door de zorgautoriteit te bepalen diensten, de afnemers van die diensten in
      gelijke gevallen gelijk te behandelen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.c
    text: de verplichting om een door de zorgautoriteit te bepalen dienst los te leveren van andere diensten;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.d
    text: |-
      de verplichting om de kosten en opbrengsten van door de zorgautoriteit te bepalen diensten die de zorgaanbieder
      of ziektekostenverzekeraar aan zichzelf of aan zijn afnemers aanbiedt, te scheiden van die van de overige door de
      zorgaanbieder of ziektekostenverzekeraar verrichte activiteiten en daartoe een gescheiden boekhouding te voeren
      overeenkomstig door de zorgautoriteit gegeven aanwijzingen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.e
    text: |-
      de verplichting om onder redelijke voorwaarden te voldoen aan elk redelijk verzoek van een zorgaanbieder of
      ziektekostenverzekeraar tot het sluiten van een overeenkomst op of ten behoeve van de zorginkoopmarkt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.f
    text: |-
      de verplichting voor een ziektekostenverzekeraar om in zijn overeenkomsten met zorgaanbieders niet een onredelijk
      hoge capaciteit overeen te komen in relatie tot de capaciteit die de verzekeraar naar verwachting voor zijn
      verzekerden nodig heeft;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.g
    text: |-
      de verplichting om voor het medegebruik van door de zorgautoriteit aan te wijzen categorieën van zorg, diensten of
      faciliteiten een openbaar aanbod te doen en in stand te houden;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.h
    text: |-
      de verplichting om het onder g bedoelde openbare aanbod overeenkomstig door de zorgautoriteit gegeven aanwijzingen
      te wijzigen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.i
    text: |-
      de verplichting om de tarieven van door de zorgautoriteit aan te wijzen diensten of leveringen vast te stellen
      overeenkomstig een door de zorgautoriteit te bepalen berekeningsmethode;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.j
    text: |-
      de verplichting om ten behoeve van de vaststelling als bedoeld onder i een kostentoerekeningssysteem te hanteren
      dat voldoet aan door de zorgautoriteit te bepalen toerekeningsprincipes;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.k
    text: |-
      de verplichting om op door de zorgautoriteit te bepalen wijze door middel van een accountantsverklaring of
      anderszins, eenmalig of periodiek aan te tonen dat aan de onder i en j bedoelde verplichting is voldaan;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.l
    text: |-
      de verplichting voor een zorgaanbieder om in zijn overeenkomsten met andere zorgaanbieders niet een onredelijk hoge
      capaciteit overeen te komen in relatie tot de capaciteit die de eerstbedoelde zorgaanbieder naar verwachting voor
      zijn consumenten nodig heeft;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: 48.1.m
    text: andere, bij ministeriële regeling aangewezen verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: '48.2'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '48.3'
    text: |-
      De zorgautoriteit neemt bij het opleggen van verplichtingen als bedoeld in het eerste lid de eisen van
      proportionaliteit in acht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: '48.4'
    text: |-
      De zorgautoriteit kan aan de verplichtingen, bedoeld in het eerste lid, voorschriften en beperkingen verbinden die
      nodig zijn voor een goede uitvoering van de verplichtingen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: '48.5'
    text: |-
      Een verplichting als bedoeld in het eerste lid geldt voor een periode van ten hoogste drie jaar na de datum waarop
      deze ingaat. De zorgautoriteit kan binnen die periode beslissen tot intrekking indien de verplichting naar haar
      oordeel niet meer noodzakelijk is. Voorts kan de zorgautoriteit binnen die periode beslissen tot wijziging of
      verlenging van de verplichting, telkens voor een periode van ten hoogste drie jaar.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel48
  - number: '49.1'
    text: |-
      Indien de zorgautoriteit een redelijk vermoeden heeft dat zij tot een oordeel als bedoeld in het eerste lid van
      [artikel 48][ref1] zal komen, kan zij in spoedeisende gevallen vooruitlopen op de toepassing van dat artikel en de
      desbetreffende zorgaanbieder of zorgaanbieders dan wel ziektekostenverzekeraar of ziektekostenverzekeraars een of
      meer van de verplichtingen opleggen, genoemd in het [eerste lid van artikel 48][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel48
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '49.2'
    text: |-
      [Artikel 48, derde en vierde lid][ref1], is van overeenkomstige toepassing op de verplichting, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '49.3'
    text: |-
      [Artikel 48, vijfde lid][ref1], is van overeenkomstige toepassing op de verplichting, bedoeld in het eerste lid,
      met dien verstande dat de verplichting geldt voor een periode van ten hoogste zes maanden en dat deze eenmaal met
      een periode van ten hoogste zes maanden kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '48'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 49a.1
    text: |-
      Het is een zorgaanbieder als bedoeld in [artikel 1, onderdeel c, onder 1][ref1], verboden een concentratie als
      omschreven in de [Mededingingswet][ref2] tot stand te brengen, zonder daaraan voorafgaande goedkeuring van de
      zorgautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008691
  - number: 49a.2
    text: |-
      Een aanvraag voor het verkrijgen van de goedkeuring wordt ingediend door de zorgaanbieder dan wel, in geval het
      meer dan een zorgaanbieder betreft, de zorgaanbieders gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49a
  - number: 49a.3
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing op een zorgaanbieder die in de regel door minder dan
      vijftig personen zorg doet verlenen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49a
  - number: 49b.1
    text: |-
      De aanvraag, bedoeld in [artikel 49a, tweede lid][ref1], gaat vergezeld van een rapport over de verwachte effecten
      van de beoogde concentratie.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 49a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 49b.2
    text: 'Het rapport biedt ten minste inzicht in:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.a
    text: de doelstellingen van de concentratie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.b
    text: de redenen voor concentratie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.c
    text: de structuur van de beoogde organisatie van de zorgaanbieder of zorgaanbieders;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.d
    text: de financiële gevolgen van de concentratie voor de zorgaanbieder of zorgaanbieders;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.e
    text: de gevolgen van de concentratie voor de zorgverlening aan de cliënt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.f
    text: |-
      de risico’s van de concentratie voor de kwaliteit en bereikbaarheid van de zorg en de wijze waarop deze risico’s
      worden ondervangen;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.g
    text: |-
      het oordeel en de aanbevelingen van cliënten, personeel en andere betrokkenen over het voornemen tot concentratie
      en de wijze waarop zij dit kenbaar hebben kunnen maken, alsmede een onderbouwing voor de wijze waarop het oordeel
      of de aanbevelingen zijn meegewogen bij het voornemen tot concentratie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.2.h
    text: de wijze waarop en het tijdsbestek waarbinnen de concentratie zal worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49b.3
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de inhoud van het rapport.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49b
  - number: 49c.1
    text: |-
      De zorgautoriteit besluit binnen vier weken op een aanvraag als bedoeld in [artikel 49a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 49a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 49c.2
    text: 'De zorgautoriteit onthoudt haar goedkeuring aan de concentratie indien:'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
  - number: 49c.2.a
    text: |-
      cliënten, personeel en andere betrokkenen niet op een zorgvuldige wijze zijn betrokken bij de voorbereiding van
      de concentratie, waarbij zij in ieder geval tijdig en op begrijpelijke wijze op de hoogte moeten zijn gebracht van
      de inhoud van de concentratieplannen en de manier waarop oordelen of aanbevelingen hierover kenbaar kunnen worden
      gemaakt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
  - number: 49c.2.b
    text: |-
      het oordeel en de aanbevelingen van cliënten, personeel en andere betrokkenen niet overtuigend en beargumenteerd
      zijn meegewogen in de besluitvorming tot concentratie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
  - number: 49c.2.c
    text: |-
      als gevolg van de concentratie de continuïteit van bij algemene maatregel van bestuur aangewezen vormen van zorg
      als bedoeld in [artikel 56a, eerste lid][ref1], in gevaar komt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel56a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 56a
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 49c.2.d
    text: |-
      het rapport als bedoeld in [artikel 49b, eerste lid][ref1], onvoldoende inzicht biedt in de verwachte effecten van
      de beoogde concentratie aan de hand van de eisen, bedoeld in artikel 49b, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49b
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 49b
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 49c.3
    text: De zorgautoriteit kan aan de goedkeuring voorwaarden, voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
  - number: 49c.4
    text: |-
      In geval de zorgautoriteit haar goedkeuring verleent aan de concentratie, maakt zij het rapport als bedoeld in
      [artikel 49b][ref1] openbaar. Gegevens die ingevolge [artikel 5.1 van de Wet open overheid][ref2] niet voor
      verstrekking in aanmerking komen, worden niet openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 49b
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 49c.5
    text: |-
      De zorgautoriteit geeft de mededingingsautoriteit inzicht in de gevolgen die de concentratie zal hebben voor de
      betaalbaarheid, toegankelijkheid en, volgens de bevindingen van de ambtenaren van de Inspectie gezondheidszorg en
      jeugd, voor de kwaliteit van zorg.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49c
  - number: 49d.1
    text: |-
      De zorgautoriteit kan, indien zij een redelijk vermoeden heeft dat zij haar goedkeuring niet zal onthouden, in
      spoedeisende gevallen op verzoek van degene die de aanvraag voor het verkrijgen van de goedkeuring heeft gedaan,
      ontheffing verlenen van het in [artikel 49a, eerste lid][ref1], bedoelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49a
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 49a
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 49d.2
    text: |-
      De ontheffing kan onder beperkingen worden verleend en aan de ontheffing kunnen binnen vier weken na het verlenen
      van de ontheffing voorwaarden of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49d
  - number: 49e.1
    text: |-
      Onze Minister stelt voor ieder kalenderjaar het bedrag vast dat in dat kalenderjaar beschikbaar
      is voor het verlenen van zorg als bedoeld in de [artikelen 3.3.1][ref1], [3.3.2][ref2] en
      [3.3.3 van de Wet langdurige zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel3
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '3'
  - number: 49e.2
    text: |-
      Ten behoeve van het voor zorg in natura vaststellen van tarieven als bedoeld in [artikel 50, eerste lid][ref1],
      en van bedragen als bedoeld in [artikel 56b][ref2], alsmede ten behoeve van het verstrekken van persoonsgebonden
      budgetten als bedoeld in de [Wet langdurig zorg][ref3], verdeelt de zorgautoriteit het bedrag, bedoeld in het
      eerste lid, over de regio’s, bedoeld in [artikel 4.2.4, tweede lid, van laatstgenoemde wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel56b
      [ref3]: https://wetten.overheid.nl/BWBR0035917
      [ref4]: https://wetten.overheid.nl/BWBR0035917#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 56b
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0035917
      - id: ref4
        bwb_id: BWBR0035917
        artikel: '4'
  - number: '50.1'
    text: |-
      De zorgautoriteit legt, met inachtneming van de [artikelen 51 tot en met 56][ref1] en [59][ref2], in een
      beschikking ten behoeve van het rechtsgeldig in rekening kunnen brengen van een tarief vast:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel59
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '51'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 50.1.a
    text: |-
      of er sprake is van een vrij tarief, zijnde een tarief waarop [artikel 35, eerste lid, onderdelen a en b][ref1],
      niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel35
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 50.1.b
    text: of er sprake is van een vast tarief;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.1.c
    text: of er sprake is van een bedrag dat ten minste of ten hoogste als tarief in rekening kan worden gebracht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.1.d
    text: |-
      de beschrijving van de prestatie, deel van de prestatie of geheel van prestaties behorend bij het tarief bedoeld in
      de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: '50.2'
    text: |-
      De zorgautoriteit kan bij de toepassing van het eerste lid ambtshalve voor de som van de tarieven voor de betrokken
      prestaties gerelateerd aan een daarbij aangegeven periode, voorafgaand aan die periode, vaststellen:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.2.a
    text: een vaste grens,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.2.b
    text: een ondergrens,
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.2.c
    text: een bovengrens of
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: 50.2.d
    text: een bandbreedtegrens.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: '50.3'
    text: |-
      De zorgautoriteit kan aan de vaststelling van een tarief, een prestatiebeschrijving of een grens als bedoeld in de
      voorgaande leden voorschriften of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
  - number: '50.4'
    text: |-
      De vaststelling van een tarief of een prestatiebeschrijving bevat in ieder geval voor zover van toepassing de
      onderwerpen, genoemd in [artikel 54][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel54
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '54'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '51'
    text: |-
      De zorgautoriteit past [artikel 50, eerste lid, onderdeel a][ref1], uitsluitend ambtshalve toe.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '52'
    text: |-
      De zorgautoriteit past [artikel 50, eerste lid, onderdelen b en c][ref1], toe:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 52.a
    text: |-
      op aanvraag van een zorgaanbieder en een ziektekostenverzekeraar, indien zij een tarief zijn overeengekomen.
      Het vastgestelde tarief geldt voor alle gevallen waarin de zorgaanbieder het tarief in rekening brengt aan de
      ziektekostenverzekeraar of aan degene die bij deze voor de prestatie waarop het tarief van toepassing is, is
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
  - number: 52.b
    text: |-
      op aanvraag van een zorgaanbieder of een ziektekostenverzekeraar dan wel ambtshalve, indien op een ingevolge
      onderdeel a gedane aanvraag afwijzend is beslist. De tweede volzin van onderdeel a is met betrekking tot dat tarief
      van overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
  - number: 52.c
    text: |-
      op aanvraag van een zorgaanbieder of van een ziektekostenverzekeraar, indien een overeenkomst als bedoeld in
      onderdeel a niet tot stand komt. Bij de vaststelling bepaalt de zorgautoriteit in welke gevallen het tarief geldt;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
  - number: 52.d
    text: |-
      op aanvraag van een zorgaanbieder dan wel ambtshalve, voor alle gevallen waarin het in rekening wordt
      gebracht aan iemand die voor de prestatie waarop het tarief van toepassing is, niet is verzekerd bij een
      ziektekostenverzekeraar. Daarbij kunnen met betrekking tot de kring van hen aan wie het tarief rechtsgeldig in
      rekening kan worden gebracht, beperkingen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
  - number: 52.e
    text: |-
      ambtshalve, indien een beleidsregel als bedoeld in [artikel 57][ref1] dat vordert;


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 52.f
    text: |-
      ambtshalve, indien de zorgautoriteit daarbij een grens als bedoeld in [artikel 50, tweede lid][ref1], vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '53'
    text: |-
      De zorgautoriteit past [artikel 50, eerste lid, onderdeel d][ref1], toe:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 53.a
    text: |-
      ingeval de zorgautoriteit gebruik maakt van de bevoegdheid op grond van [artikel 37, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 53.b
    text: |-
      in de gevallen, bedoeld in [artikel 52, onderdelen a tot en met f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel52
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 53.c
    text: |-
      op aanvraag van een zorgaanbieder of een ziektekostenverzekeraar met betrekking tot een prestatie
      waarvoor de zorgautoriteit op grond van het bepaalde bij of krachtens [artikel 2, tweede lid][ref1],
      [artikel 50, eerste lid, onderdeel a][ref2], of [artikel 58, vierde lid, onderdeel a][ref3], geen tarief behoeft
      vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel58
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0020078
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '54.1'
    text: |-
      Een aanvraag als bedoeld in [artikel 52][ref1] bevat een voorstel voor:


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel52
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '52'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 54.1.a
    text: het in rekening te brengen tarief;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel54
  - number: 54.1.b
    text: de periode waarvoor het tarief zal gelden.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel54
  - number: '54.2'
    text: |-
      Een aanvraag als bedoeld in [artikel 53][ref1] bevat een voorstel voor de vast te stellen prestatiebeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel53
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '54.3'
    text: |-
      Indien de zorgautoriteit geen regels heeft vastgesteld als bedoeld in
      [artikel 37, eerste lid, aanhef en onder a][ref1], bevat de aanvraag, bedoeld in de [artikelen 52][ref2] en
      [53][ref3], voorts een voorstel voor:


