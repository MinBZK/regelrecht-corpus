  - number: '88.2'
    text: De bestuurlijke boete voor een afzonderlijke overtreding bedraagt ten hoogste € 100 000.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel88
  - number: '89.1'
    text: |-
      De zorgautoriteit kan een bestuurlijke boete opleggen aan degene die niet voldoet aan een hem bij of
      krachtens [artikel 68a][ref1] van deze wet of [artikel 87, vijfde of zesde lid][ref2], [88][ref3] of
      [89 van de Zorgverzekeringswet][ref4] opgelegde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel87
