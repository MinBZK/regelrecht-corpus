  - number: 16.g
    text: |-
      de taak, bedoeld in [artikel 28, tweede lid, onderdeel a, van de Wet kwaliteit, klachten en geschillen zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel28
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
