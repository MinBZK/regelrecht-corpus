        artikel: '25'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '30'
  - number: '83.3'
    text: |-
      De zorgautoriteit kan een verzekeraar die verzekeringen als zorgverzekering aanbiedt of uitvoert die niet aan het
      bij of krachtens de [Zorgverzekeringswet][ref1] geregelde voldoen, een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '84'
    text: |-
      De zorgautoriteit kan een Wlz-uitvoerder een last onder dwangsom opleggen ter zake van
      overtreding van de voorschriften, gesteld bij of krachtens de [Wet langdurige zorg][ref1] of de
      [Wet financiering sociale verzekeringen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel84
