    text: |-
      toezicht op de uitvoering van de [artikelen 40a tot en met 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel16
    references:
