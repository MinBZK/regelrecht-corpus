  - number: '105'
    text: |-
      Met betrekking tot besluiten waarbij consumenten of patiënten belanghebbend kunnen zijn, worden voor de
      toepassing van [artikel 8:1 van de Algemene wet bestuursrecht][ref1], op landelijk niveau werkzame consumenten- en
      patiëntenorganisaties als belanghebbenden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '107'
    text: |-
      In afwijking van [artikel 45 van de Wet op de rechterlijke organisatie][ref1] neemt de rechtbank Rotterdam in
      eerste aanleg kennis van strafzaken en economische delicten in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel45
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '45'
  - number: '122'
    text: |-
      In afwijking van [artikel 4][ref1] kan de zorgautoriteit gedurende vier jaar, te rekenen vanaf de inwerkingtreding
      van [artikel 4][ref2] van deze wet, uit ten hoogste vier leden bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel4
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '123.1'
    text: |-
      De [Wet tarieven gezondheidszorg][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '123.2'
    text: |-
      Een tarief dat onmiddellijk voor het tijdstip waarop deze wet in werking treedt, rechtsgeldig in rekening placht
      te worden gebracht aan ziektekostenverzekeraars of aan degenen die bij deze voor de prestatie waarop het tarief
      van toepassing is, zijn verzekerd of niet zijn verzekerd, wordt in alle gevallen waarin het aan degene die tot die
      zelfde groep behoort, of aan een derde in rekening wordt gebracht, aangemerkt als een tarief dat ingevolge deze wet
      is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
  - number: '123.3'
    text: |-
      Een ingevolge de [Wet tarieven gezondheidszorg][ref1] gedaan verzoek om goedkeuring of vaststelling van een tarief
      door een orgaan voor gezondheidszorg of een ziektekostenverzekeraar wordt gelijkgesteld met een ingevolge deze wet
      gedane aanvraag tot vaststelling van een tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '123.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een prestatiebeschrijving van een vorm van zorg
      waarvoor een tarief in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
  - number: '123.5'
    text: |-
      Een ingevolge de [Wet tarieven gezondheidszorg][ref1] goedgekeurde beleidsregel wordt gelijkgesteld met een
      ingevolge deze wet vastgestelde beleidsregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '123.6'
    text: |-
      Een ingevolge de [Wet tarieven gezondheidszorg][ref1] door het College tarieven gezondheidszorg vastgestelde regel
      wordt gelijkgesteld met een ingevolge deze wet door de zorgautoriteit vastgestelde regel.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '123.7'
    text: |-
      Een ingevolge de [Wet tarieven gezondheidszorg][ref1] goedgekeurde beleidsregel inhoudende aan wie, door wie en op
      welke wijze en met inachtneming van welke voorwaarden, voorschriften of beperkingen een tarief in rekening wordt
      gebracht, wordt gelijkgesteld met een ingevolge deze wet door de zorgautoriteit vastgestelde regel als bedoeld
      in [artikel 37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003356
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '123.8'
    text: |-
      Een beleidsregel als bedoeld in [artikel 13 van de Wet tarieven gezondheidszorg][ref1] zoals die wet luidde
      onmiddellijk voor het tijdstip van inwerkingtreding van deze wet wordt gelijkgesteld met een aanwijzing als bedoeld
      in [artikel 7, eerste lid, aanhef en onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel7
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '124.1'
    text: |-
      Het College tarieven gezondheidszorg, genoemd in [artikel 18 van de Wet tarieven gezondheidszorg][ref1], en het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 77, eerste lid, van de Zorgverzekeringswet][ref2],
      zoals die wetten luidden onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, vormen gezamenlijk
      één rechtspersoon, en wel de zorgautoriteit. Besluiten van het College tarieven gezondheidszorg of het College
      van toezicht op de zorgverzekeringen worden na inwerkingtreding van deze wet aangemerkt als besluiten van de
      zorgautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel77
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '77'
  - number: '124.2'
    text: |-
      De vaststelling door de zorgautoriteit van een bestuursreglement als bedoeld in [artikel 5][ref1] onderscheidenlijk
      een «werkprogramma» en een «begroting» als bedoeld in [artikel 11][ref2], vindt plaats zo spoedig mogelijk
      onderscheidenlijk vindt voor het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in het
      Staatsblad is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel11
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '124.3'
    text: |-
      Onze Minister stelt voor de zorgautoriteit een voorlopig bestuursreglement vast. Het voorlopig reglement geldt
      totdat het bestuursreglement van de zorgautoriteit de goedkeuring van Onze Minister heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
  - number: '124.4'
    text: |-
      Voor zover het eerste tot en met derde lid daarin niet voorzien, stelt Onze Minister regels met betrekking tot
      de gevolgen van de inwerkingtreding van deze wet. Deze regels gelden tot en met 31 december van het kalenderjaar
      na dat waarin zij in werking zijn getreden. Van het vaststellen van deze regels wordt kennis gegeven aan de beide
      kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
  - number: '124.5'
    text: |-
      Voorzover de regels, bedoeld in het vierde lid betrekking hebben op onderwerpen waarover de zorgautoriteit regels
      kan stellen, gelden zij tot inwerkingtreding van die regels van de zorgautoriteit.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
  - number: '124.6'
    text: |-
      In afwijking van [artikel 6][ref1] van deze wet zijn de regels voor ambtenaren die zijn aangesteld
      bij ministeries gedurende een periode van vier jaren, te rekenen vanaf de datum waarop de
      [Invoerings- en aanpassingswet Zorgverzekeringswet][ref2] in werking is getreden, niet van toepassing op de
      rechtspositie van het personeel van de zorgautoriteit. Gedurende die periode wordt de rechtspositie van dat
      personeel geregeld door de zorgautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018830
