        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '91.1'
    text: |-
      De zorgautoriteit kan een Regionale Ambulancevoorziening als bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref1], een bestuurlijke boete
      opleggen ter zake van overtreding van [artikel 13][ref2] en het bepaalde bij of krachtens
      [artikel 19 van de Wet ambulancezorgvoorzieningen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0043925#Artikel19
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel91
    references:
