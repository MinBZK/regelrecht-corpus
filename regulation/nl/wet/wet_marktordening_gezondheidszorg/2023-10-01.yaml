  - number: '124.7'
    text: |-
      Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het College tarieven
      gezondheidszorg en het College van toezicht op de zorgverzekeringen in dienst van de zorgautoriteit
      aangesteld. Daarbij worden hun arbeidsvoorwaarden als geheel zoveel mogelijk op een gelijk niveau gesteld met
      de arbeidsvoorwaarden die verbonden waren aan hun dienstbetrekking bij het College tarieven gezondheidszorg,
      onderscheidenlijk het College van toezicht op de zorgverzekeringen. Bij ministeriële regeling kunnen regels worden
      gesteld omtrent het in dit lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel124
  - number: '127'
    text: |-
      Onze Minister zendt voor 1 januari 2009 een verslag aan de Staten-Generaal over de doeltreffendheid en de effecten
      van deze wet in de praktijk. Hierin wordt in ieder geval aandacht besteed aan:
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: 127.a
    text: |-
      de manier waarop de beslissingen van de zorgautoriteit hebben bijgedragen aan het bereiken van de doelstelling van
      de wet;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: 127.b
    text: het vaststellen van de aanmerkelijke marktmacht;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: 127.c
    text: de mate waarin de wet heeft bijgedragen aan het terugdringen van de bureaucratie;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: 127.d
    text: de effectiviteit en wenselijkheid van tariefsregulering;
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: 127.e
    text: de taken die betrekking hebben op het mededingingsrecht.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel127
  - number: '128'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel128
  - number: '129'
    text: 'Deze wet wordt aangehaald als: Wet marktordening gezondheidszorg.'
    url: https://wetten.overheid.nl/BWBR0020078/2023-10-01#Artikel129
