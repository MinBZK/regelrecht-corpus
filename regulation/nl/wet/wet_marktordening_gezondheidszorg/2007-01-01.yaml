        artikel: '40'
  - number: '37'
    text: |-
      De zorgautoriteit kan regels vaststellen, inhoudende aan wie, door wie of op welke wijze, onder welke voorwaarden
      of met inachtneming van welke voorschriften of beperkingen een tarief in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel37
  - number: '38'
    text: |-
      1 Zorgaanbieders informeren hun patiënten tijdig en zorgvuldig omtrent het voor de prestatie in rekening te brengen
      tarief.

      2 Zorgaanbieders brengen een tarief in rekening onder vermelding van de daarbijbehorende prestatiebeschrijving.

      3 De zorgautoriteit kan nadere regels stellen betreffende het door zorgaanbieders:

      a. bekendmaken van tarieven;

      b. specificeren van op verrichte prestaties betrekking hebbende rekeningen.

      4 Zorgaanbieders maken informatie openbaar over de eigenschappen van aangeboden prestaties en diensten, op een
      zodanige wijze dat deze gegevens voor consumenten gemakkelijk vergelijkbaar zijn. Deze informatie betreft in ieder
      geval de tarieven en de kwaliteit van de aangeboden prestaties en diensten.

      5 De zorgautoriteit kan, onverminderd de informatieverplichting die op grond van het vierde lid rust op
      zorgaanbieders, ten behoeve van de inzichtelijkheid van de markt periodiek informatie als bedoeld in het vierde lid
      openbaar maken.

      6 Het vijfde lid geldt niet indien anderen reeds in voldoende mate in openbaarmaking van de daar bedoelde
      informatie voorzien.

      7 De zorgautoriteit kan regels stellen betreffende de informatievoorziening, bedoeld in het vierde lid, met het oog
      op de doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel38
  - number: '39'
    text: |-
      1 Zorgaanbieders dragen er zorg voor dat de door of namens hen verstrekte of beschikbaar gestelde informatie
      terzake van een product of dienst, waaronder reclame-uitingen, geen afbreuk doet aan het bepaalde bij of krachtens
      deze wet, de [Zorgverzekeringswet][ref1] of de [Algemene Wet Bijzondere Ziektekosten][ref2], en niet misleidend is.

      2 De zorgautoriteit kan regels stellen betreffende de informatievoorziening, bedoeld in het eerste lid, met het oog
      op de doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid daarvan.

      3 De in het tweede lid bedoelde regels worden gesteld in overeenstemming met het Staatstoezicht op de
      volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0002614
  - number: '40'
    text: |-
      1 Ziektekostenverzekeraars maken informatie openbaar over de eigenschappen van aangeboden producten en diensten op
      zodanige wijze dat deze gegevens voor consumenten gemakkelijk vergelijkbaar zijn. Deze informatie betreft in ieder
      geval de premies en de kwaliteit van de aangeboden producten en diensten.

      2 Zorgverzekeraars maken ten behoeve van de inzichtelijkheid, voor verzekeringsplichtigen, van de
      zorgverzekeringsmarkt informatie openbaar met betrekking tot:

      a. de inhoud van de modelovereenkomsten;

      b. de wijze van dienstverlening aan verzekerden.

      3 Ziektekostenverzekeraars dragen er zorg voor dat de door of namens hen verstrekte of beschikbaar gestelde
      informatie ter zake van een product of dienst, waaronder reclame-uitingen, geen afbreuk doet aan het bepaalde bij
      of krachtens deze wet, de [Zorgverzekeringswet][ref1] of de [Algemene Wet Bijzondere Ziektekosten][ref2], en niet
      misleidend is.

      4 [Artikel 38, vijfde tot en met zevende lid][ref3], is ten aanzien van de informatieverstrekking door
      ziektekostenverzekeraars van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel40
