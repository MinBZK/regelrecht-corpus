  - number: '54'
    text: |-
      1 In afwijking van de [artikelen 50][ref1] en [51, eerste lid, onder b][ref2], kan een aanvraag als in die
      artikelen bedoeld, de vaststelling betreffen van het bedrag dat ten minste of ten hoogste als tarief voor de
      prestatie in rekening wordt gebracht.

      2 [Artikel 52, eerste, vierde, zesde en zevende lid][ref3], en [artikel 53][ref4] zijn van overeenkomstige
      toepassing op een aanvraag als bedoeld in het eerste lid.

      3 Een aanvraag of een ambtshalve vaststelling als bedoeld in het [tweede, derde en vijfde lid van artikel 52][ref5]
      of in het [derde, vierde en zesde lid van artikel 53][ref6] kan ook de vaststelling betreffen van het bedrag dat
      ten minste of ten hoogste als tarief voor een prestatie in rekening wordt gebracht.

      4 Bij toepassing van het derde lid bevat de beschikking van de zorgautoriteit, in afwijking van
      [artikel 52, zesde lid][ref7], juncto [artikel 51, eerste lid, onder b][ref8], of [artikel 53, zevende lid][ref9],
      juncto [artikel 51, aanhef en onder b][ref10], het bedrag dat ten minste of ten hoogste als tarief voor de
      prestatie in rekening wordt gebracht.


