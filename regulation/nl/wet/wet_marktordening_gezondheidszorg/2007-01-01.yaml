  - number: '42'
    text: |-
      1 Met de uitvoering van een overeenkomst op afstand wordt pas na toestemming van de verzekerde een begin gemaakt.

      2 Indien de verzekerde gebruik maakt van zijn in [artikel 41, tweede lid][ref1], bedoelde recht, kan de
      ziektekostenverzekeraar uitsluitend een vergoeding vragen voor het product dat of dienst die krachtens de
      overeenkomst op afstand is geleverd. Deze vergoeding is:

      a. niet hoger dan een bedrag dat evenredig is aan de verhouding tussen het reeds geleverde product of dienst en de
      volledige uitvoering van de overeenkomst op afstand; en

      b. in geen geval zo hoog dat deze als een boete kan worden opgevat.

      3 De ziektekostenverzekeraar kan slechts betaling van de in het tweede lid bedoelde vergoeding verlangen indien
      hij:

      a. kan aantonen dat de verzekerde overeenkomstig het bepaalde krachtens [artikel 43, tweede lid][ref2], is
      geïnformeerd over de in het tweede lid bedoelde vergoeding; en

      b. op uitdrukkelijk verzoek van de verzekerde met de uitvoering van de overeenkomst is begonnen voor het
      verstrijken van de in [artikel 41, tweede of derde lid][ref3], genoemde ontbindingstermijn.

      4 De ziektekostenverzekeraar betaalt de consument zo spoedig mogelijk en uiterlijk binnen 30 kalenderdagen nadat
      hij de kennisgeving van de in [artikel 41][ref4] bedoelde ontbinding heeft ontvangen, al hetgeen hij krachtens de
      overeenkomst op afstand van hem ontvangen heeft terug, verminderd met het in het tweede lid bedoelde bedrag.

      5 De consument geeft de ziektekostenverzekeraar onverwijld, en uiterlijk binnen 30 kalenderdagen nadat hij de
      kennisgeving van de in [artikel 41][ref5] bedoelde ontbinding heeft verzonden, alle zaken terug die hij van de
      ziektekostenverzekeraar heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel43
