  - number: '19'
    text: |-
      De zorgautoriteit volgt het oordeel van het Staatstoezicht op de volksgezondheid over de kwaliteit van het handelen
      van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel19
  - number: '20'
    text: |-
      1 De zorgautoriteit:

      a. geeft voorlichting omtrent de inhoud van haar regels, beleidsregels, beschikkingen en besluiten en ten algemene
      over de uitvoering van haar taken;

      b. stelt alle naar haar oordeel relevante informatie over regels, beleidsregels, beschikkingen en besluiten
      beschikbaar op internet;

      c. legt haar regels, beleidsregels, beschikkingen en besluiten voor een ieder ter inzage.

      2 De zorgautoriteit doet mededeling in de Staatscourant, onder vermelding dat deze bij haar ter inzage liggen, van:

      a. de vaststelling van regels door plaatsing van die regels;

      b. de vaststelling van beleidsregels als bedoeld in [artikel 57][ref1];

      c. de beschikkingen met betrekking tot aanmerkelijke marktmacht onder vermelding van de opgelegde verplichting en
      de tijdsduur van de verplichting;

      d. de beschikkingen met betrekking tot tarieven en prestatiebeschrijvingen.

      3 Het eerste en tweede lid zijn niet van toepassing op besluiten en beschikkingen van de zorgautoriteit ter
      uitvoering van [hoofdstuk 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel20
