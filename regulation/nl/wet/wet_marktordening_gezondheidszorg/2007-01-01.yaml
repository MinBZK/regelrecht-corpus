  - number: '60'
    text: |-
      1 In dit hoofdstuk worden persoonsgegevens onderscheiden in:

      a. identificerende persoonsgegevens,

      b. medische persoonsgegevens,

      c. strafrechtelijke persoonsgegevens.

      2 Onder identificerende persoonsgegevens wordt verstaan:

      a. naam, adres, woonplaats, postadres;

      b. geboortedatum en geslacht;

      c. administratieve gegevens, zoals nummers van bank-, giro- en creditcard,
      inschrijvingsgegevens van de gemeentelijke basisadministratie en registratie ingevolge de
      [Wet op de beroepen in de individuele gezondheidszorg][ref1].

      3 Onder medische persoonsgegevens wordt in het kader van deze wet verstaan de persoonsgegevens betreffende de
      gezondheid als bedoeld in [artikel 21 van de Wet bescherming persoonsgegevens][ref2].

      4 Onder strafrechtelijke persoonsgegevens wordt verstaan persoonsgegevens als bedoeld in
      [artikel 22 van de Wet bescherming persoonsgegevens][ref3] en persoonsgegevens betreffende onrechtmatig of
      hinderlijk gedrag in verband met een opgelegd verbod naar aanleiding van dat gedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel22
