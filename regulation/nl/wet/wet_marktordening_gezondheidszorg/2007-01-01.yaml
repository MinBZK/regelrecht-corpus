  - number: '70'
    text: |-
      1 De zorgautoriteit, het College zorgverzekeringen, het College bouw, het College sanering en het Staatstoezicht op
      de volksgezondheid verstrekken elkaar die gegevens en inlichtingen die van belang kunnen zijn voor de uitoefening
      van hun wettelijke taken.

      2 De zorgautoriteit verstrekt desgevraagd aan de Nederlandse Mededingingsautoriteit, De Nederlandsche Bank, de
      Stichting Autoriteit Financiële Markten, het College bescherming persoonsgegevens, de Consumentenautoriteit en de
      FIOD-ECD die gegevens en inlichtingen die van belang kunnen zijn voor de uitoefening van hun wettelijke taken.

      3 De zorgautoriteit verstrekt desgevraagd aan de Gezondheidsraad, het Rijksinstituut voor de volksgezondheid
      en milieu, de Raad voor de Volksgezondheid en Zorg, de Raad voor gezondheidsonderzoek, het Centraal Planbureau,
      het Centraal Bureau voor de Statistiek en het Sociaal Cultureel Planbureau in verband met de beperking van
      administratieve lasten die gegevens en inlichtingen die van belang kunnen zijn voor de uitoefening van hun
      wettelijke taken.

      4 Bij de verstrekkingen als bedoeld in het eerste tot en met derde lid wordt het bepaalde krachtens
      [artikel 65][ref1] in acht genomen.

      5 De zorgautoriteit maakt bij de toepassing van het eerste tot en met derde lid geen gebruik van haar bevoegdheden,
      bedoeld in de [artikelen 61][ref2] en [64][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel64
