  - number: '22'
    text: |-
      1 De zorgautoriteit verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde gegevens
      en inlichtingen. De zorgautoriteit verleent aan door Onze Minister aangewezen personen toegang tot en inzage in
      alle zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van diens taak redelijkerwijs nodig is.

      2 Onze Minister verstrekt desgevraagd aan de zorgautoriteit de voor de uitoefening van haar taak benodigde gegevens
      en inlichtingen.

      3 Onze Minister en de zorgautoriteit stellen gezamenlijk een informatiestatuut vast. Het informatiestatuut bevat
      inhoudelijke en procedurele afspraken met betrekking tot de verstrekking van informatie, bedoeld in het eerste en
      tweede lid.

      4 De gegevens en inlichtingen, bedoeld in het eerste en tweede lid, hebben geen betrekking op medische
      persoonsgegevens als bedoeld in [artikel 60][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel60
