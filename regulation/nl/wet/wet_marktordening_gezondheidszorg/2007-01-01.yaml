  - number: '64'
    text: |-
      Op het opvragen van gegevens en inlichtingen, bedoeld in de [artikelen 61][ref1] en [62][ref2], is
      [afdeling 5.2 van de Algemene wet bestuursrecht][ref3] van overeenkomstige toepassing, met uitzondering van de
      [artikelen 5:11][ref4], [5:12][ref5] en [5:20][ref6].


