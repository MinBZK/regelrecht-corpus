  - number: '123'
    text: |-
      1 De [Wet tarieven gezondheidszorg][ref1] wordt ingetrokken.

      2 Een tarief dat onmiddellijk voor het tijdstip waarop deze wet in werking treedt, rechtsgeldig in rekening placht
      te worden gebracht aan ziektekostenverzekeraars of aan degenen die bij deze voor de prestatie waarop het tarief
      van toepassing is, zijn verzekerd of niet zijn verzekerd, wordt in alle gevallen waarin het aan degene die tot die
      zelfde groep behoort, of aan een derde in rekening wordt gebracht, aangemerkt als een tarief dat ingevolge deze wet
      is tot stand gekomen.

      3 Een ingevolge de [Wet tarieven gezondheidszorg][ref2] gedaan verzoek om goedkeuring of vaststelling van een
      tarief door een orgaan voor gezondheidszorg of een ziektekostenverzekeraar wordt gelijkgesteld met een ingevolge
      deze wet gedane aanvraag tot vaststelling van een tarief.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op een prestatiebeschrijving van een vorm van zorg
      waarvoor een tarief in rekening wordt gebracht.

      5 Een ingevolge de [Wet tarieven gezondheidszorg][ref3] goedgekeurde beleidsregel wordt gelijkgesteld met een
      ingevolge deze wet vastgestelde beleidsregel.

      6 Een ingevolge de [Wet tarieven gezondheidszorg][ref4] door het College tarieven gezondheidszorg vastgestelde
      regel wordt gelijkgesteld met een ingevolge deze wet door de zorgautoriteit vastgestelde regel.

      7 Een ingevolge de [Wet tarieven gezondheidszorg][ref5] goedgekeurde beleidsregel inhoudende aan wie, door wie en
      op welke wijze en met inachtneming van welke voorwaarden, voorschriften of beperkingen een tarief in rekening wordt
      gebracht, wordt gelijkgesteld met een ingevolge deze wet door de zorgautoriteit vastgestelde regel als bedoeld
      in [artikel 37][ref6].

      8 Een beleidsregel als bedoeld in [artikel 13 van de Wet tarieven gezondheidszorg][ref7] zoals die wet luidde
      onmiddellijk voor het tijdstip van inwerkingtreding van deze wet wordt gelijkgesteld met een aanwijzing als bedoeld
      in [artikel 7, eerste lid, aanhef en onder c][ref8].


