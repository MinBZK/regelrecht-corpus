      1 Bij algemene maatregel van bestuur kunnen, indien dat voor een goede uitvoering van deze wet nodig is,
      werkzaamheden die geheel of gedeeltelijk liggen op het gebied van de gezondheidszorg of geheel of gedeeltelijk ten
      behoeve van de gezondheidszorg worden verricht, worden aangewezen als zorg in de zin van deze wet.

      2 Bij algemene maatregel van bestuur kan een vorm van zorg worden uitgezonderd van deze wet of een deel daarvan.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 Er is een Nederlandse Zorgautoriteit, die rechtspersoonlijkheid bezit.

      2 De zorgautoriteit is gevestigd in een door Onze Minister te bepalen plaats.

      3 De zorgautoriteit is belast met de taken die haar bij of krachtens wet zijn opgedragen.

      4 De zorgautoriteit stelt bij de uitoefening van haar taken het algemeen consumentenbelang voorop.

      5 De zorgautoriteit wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel3
  - number: '4'
    text: |-
      1 De zorgautoriteit bestaat uit ten hoogste drie leden, onder wie de voorzitter.

      2 Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden.

      3 Benoeming vindt plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van de
      zorgautoriteit alsmede op grond van maatschappelijke kennis en ervaring.

      4 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.

      5 Een lid van de zorgautoriteit vervult geen nevenfuncties die ongewenst zijn met het oog op een goede vervulling
      van zijn functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.

      6 Het lidmaatschap van de zorgautoriteit is onverenigbaar met:

      a. het lidmaatschap van het College zorgverzekeringen;

      b. het bestuur van De Nederlandsche Bank N.V.;

      c. het bestuur van de Stichting Autoriteit Financiële Markten;

      d. de raad van bestuur van de Nederlandse Mededingingsautoriteit;

      e. het hebben van zodanige financiële of andere belangen bij instellingen of bedrijven, dat de onpartijdigheid van
      het betrokken lid in het geding kan zijn.

      7 Bij ministeriële regeling kunnen andere functies of werkzaamheden dan die, genoemd in het zesde lid, worden
      aangewezen, die niet verenigbaar zijn met het lidmaatschap van de zorgautoriteit.

      8 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Minister. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in de
      Staatscourant.

      9 Onze Minister stelt de bezoldiging en de regels ten aanzien van de rechtspositie van de leden van de
      zorgautoriteit vast.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel4
  - number: '5'
    text: |-
      1 De zorgautoriteit stelt een bestuursreglement vast.

      2 Vergaderingen van de zorgautoriteit zijn niet openbaar, behoudens voor zover in het bestuursreglement anders
      is bepaald.

      3 In het bestuursreglement legt de zorgautoriteit in ieder geval vast hoe zij voldoet aan de verplichting ingevolge
      [artikel 3:2 van de Algemene wet bestuursrecht][ref1].

      4 Het bestuursreglement behoeft de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel32
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:2
  - number: '6'
    text: |-
      1 Op de rechtspositie van het personeel van de zorgautoriteit zijn de regels die gelden voor ambtenaren die zijn
      aangesteld bij ministeries van toepassing, met dien verstande dat waar in die regels een bevoegdheid is toegekend
      aan een andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid wordt
      uitgeoefend door de zorgautoriteit.

      2 Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan de zorgautoriteit een algemene aanwijzing geven met betrekking tot:

      a. de werkwijze en de uitoefening van de taken van de zorgautoriteit;

      b. de onderwerpen waaromtrent de zorgautoriteit ingevolge deze wet regels heeft vastgesteld of kan vaststellen;

      c. de onderwerpen waaromtrent de zorgautoriteit ingevolge deze wet beleidsregels heeft vastgesteld of kan
      vaststellen.

      2 Onze Minister kan in een aanwijzing als bedoeld in het eerste lid, onder c, bepalen dat de zorgautoriteit
      ambtshalve een tarief als bedoeld in [artikel 57, vierde lid, onder a of b][ref1], of een prestatiebeschrijving
      vaststelt.

      3 Een aanwijzing heeft geen betrekking op een individuele zorgaanbieder, ziektekostenverzekeraar of consument.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '8'
    text: |-
      Alvorens Onze Minister overeenkomstig [artikel 7, eerste lid, onder c][ref1], een aanwijzing vaststelt, deelt hij
      de zakelijke inhoud van het voorgenomen besluit schriftelijk mede aan de beide kamers der Staten-Generaal. Hij
      stelt het besluit niet eerder vast dan nadat 30 dagen zijn verstreken na die mededeling. Van de vaststelling doet
      Onze Minister mededeling door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel7
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '9'
    text: |-
      1 Een besluit van algemene strekking van de zorgautoriteit kan bij koninklijk besluit worden vernietigd wegens
      strijd met het recht of het belang van de volksgezondheid.

      2 Een besluit tot vernietiging wordt genomen binnen acht weken na bekendmaking van het te vernietigen besluit. Deze
      termijn kan eenmaal met vier weken worden verlengd.

      3 De rechtsgevolgen van het vernietigde besluit die zijn ingetreden voor de vernietiging, blijven in stand tenzij
      het besluit tot vernietiging anders bepaalt.

      4 Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zonodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval de zorgautoriteit haar uit de wet voortvloeiende verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel10
  - number: '11'
    text: |-
      1 De zorgautoriteit zendt jaarlijks voor 1 oktober aan Onze Minister een jaarplan voor het volgende kalenderjaar.

      2 Het jaarplan omvat:

      a. een werkprogramma met een beschrijving van de activiteiten die de zorgautoriteit voornemens is ter uitvoering
      van haar taken te verrichten;

      b. een begroting van de beheerskosten voor de uitvoering van de voorgenomen activiteiten; en

      c. een meerjarenraming voor de vier kalenderjaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van de zorgautoriteit voor het
      volgende kalenderjaar vast.

      2 Onze Minister kan besluiten het budget voor de beheerskosten van de zorgautoriteit te wijzigen.

      3 Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten, doet de zorgautoriteit daarvan onverwijld mededeling aan Onze Minister, onder vermelding
      van de oorzaak van de verschillen.

      4 De zorgautoriteit gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.

      5 Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de
      begroting betrekking heeft, is de zorgautoriteit bevoegd, teneinde haar activiteiten gaande te houden, te
      beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor haar voor een geheel jaar is
      vastgesteld.

      6 Onze Minister kan besluiten dat de zorgautoriteit in een geval als bedoeld in het vijfde lid, kan beschikken over
      meer dan een derde gedeelte van het budget dat laatstelijk voor haar voor een geheel jaar is vastgesteld.

      7 Het door Onze Minister vastgestelde budget voor de beheerskosten van de zorgautoriteit wordt gedekt uit ’s Rijks
      kas.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel12
  - number: '13'
    text: |-
      1 De zorgautoriteit zendt jaarlijks voor 15 maart aan Onze Minister een jaarverantwoording over het afgelopen
      kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.

      2 De jaarverantwoording omvat:

      a. een jaarrekening;

      b. een jaarverslag omtrent het door de zorgautoriteit gevoerde beleid, de doeltreffendheid van dat beleid, de
      bedrijfsvoering en de uitvoering van het werkprogramma in het afgelopen kalenderjaar; en

      c. een overzicht van de door de zorgautoriteit veroorzaakte administratieve lasten, berekend volgens de definities
      van de Interdepartementale Projectdirectie Administratieve Lasten (IPAL).

      3 De zorgautoriteit legt in haar jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over haar
      beheerskosten en over de rechtmatigheid en doelmatigheid van het beheer in het afgelopen kalenderjaar.

      4 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2], die Onze Minister desgevraagd inzicht geeft
      in zijn controlewerkzaamheden.

      5 De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen door de
      zorgautoriteit.

      6 De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
