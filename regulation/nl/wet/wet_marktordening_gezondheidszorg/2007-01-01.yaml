  - number: '23'
    text: |-
      1 Zorgaanbieders en ziektekostenverzekeraars voorzien in hun reglementen en voorwaarden in de mogelijkheid tot het
      doen van beklag over door partijen gebruikte formulieren.

      2 Het beklag wordt gedaan bij de zorgautoriteit. Reglementen en voorwaarden dienen een bepaling te bevatten er
      toe strekkende dat uitspraken door de zorgautoriteit de zorgaanbieders, ziektekostenverzekeraars en consumenten
      strekken tot bindend advies.

      3 Het bindend advies wordt gegeven na ontvangst van het beklag en kan er toe strekken dat het formulier:

      a. overbodig of te ingewikkeld is en niet behoeft te worden ingevuld;

      b. ingewikkeld is en een volgende keer zal worden beoordeeld als een formulier als bedoeld in onderdeel a, indien
      het niet binnen twee weken na het advies is aangepast;

      c. geen aanleiding geeft het beklag gegrond te verklaren.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel23
  - number: '24'
    text: |-
      1 De zorgautoriteit zendt voor 1 november aan Onze Minister en aan het College zorgverzekeringen een samenvattend
      rapport over de rechtmatigheid van de uitvoering van de [Zorgverzekeringswet][ref1] en de daarop gebaseerde
      regelgeving door de zorgverzekeraars in het voorafgaande kalenderjaar.

      2 Onze Minister zendt het rapport aan beide kamers der Staten-Generaal.

      3 De zorgautoriteit stelt het rapport algemeen verkrijgbaar.

      4 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en inrichting van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '25'
    text: |-
      1 De zorgautoriteit maakt, onverminderd haar bevoegdheid tot eigen onderzoek, bij de uitoefening van haar taken,
      genoemd in [artikel 16, onder b en c][ref1], zoveel mogelijk gebruik van de resultaten van door anderen verrichte
      controles.

      2 De zorgverzekeraars verstrekken desgevraagd aan de zorgautoriteit de informatie over de uitgevoerde werkzaamheden
      van hen die met de controle zijn belast en lichten haar volledig in over de resultaten van de controle door
      overlegging van rapporten of op andere door de zorgautoriteit aan te geven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
