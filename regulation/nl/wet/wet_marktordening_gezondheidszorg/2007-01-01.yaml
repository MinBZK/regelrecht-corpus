    text: |-
      1 Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van
      Beroep voor het bedrijfsleven.

      2 Met betrekking tot besluiten waarbij consumenten of patiënten belanghebbend kunnen zijn, worden voor de
      toepassing van het eerste lid op landelijk niveau werkzaam zijnde consumenten- en patiëntenorganisaties als
      belanghebbenden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel105
