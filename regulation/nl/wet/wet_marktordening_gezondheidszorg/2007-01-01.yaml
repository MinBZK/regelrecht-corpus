  - number: '80'
    text: |-
      1 Indien een zorgverzekeraar of een verzekeraar als bedoeld in [artikel 77][ref1], dan wel een AWBZ-verzekeraar,
      hierna te noemen: betrokkene, niet binnen de termijn, bedoeld in [artikel 79, tweede lid][ref2], aan een krachtens
      [artikel 77][ref3] onderscheidenlijk [78][ref4] gegeven aanwijzing voldoet, is de zorgautoriteit bevoegd:

      a. bestuursdwang toe te passen, of

      b. ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die tot die kennisgeving hebben
      geleid:

      1°. dat de betrokkene verzekeringen als zorgverzekering aanbiedt of uitvoert die niet aan het bij of krachtens de
      [Zorgverzekeringswet][ref5] geregelde voldoen;

      2°. dat de zorgverzekeraar in strijd handelt met een of meer door de zorgautoriteit genoemde, bij of krachtens de
      [Zorgverzekeringswet][ref6] of de [Algemene Wet Bijzondere Ziektekosten][ref7] geregelde bepalingen;

      3°. dat aan de betrokkene een aanwijzing is gegeven dan wel een last onder dwangsom of een bestuurlijke boete is
      opgelegd.

      2 De zorgautoriteit stelt, indien zij voornemens is een feit ter openbare kennis te brengen, de betrokkene daarvan
      in kennis onder vermelding van de gronden waarop het voornemen berust.

      3 In afwijking van [artikel 4:8 van de Algemene wet bestuursrecht][ref8] is de zorgautoriteit niet gehouden de
      betrokkene in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen
      adres bekend is en het adres ook niet met een redelijke inspanning kan worden verkregen.

      4 De beschikking om een feit ter openbare kennis te brengen, vermeldt in ieder geval het feit dat ter openbare
      kennis wordt gebracht alsmede de wijze en de termijn waarop dit zal geschieden.

      5 Het ter openbare kennis brengen geschiedt niet eerder dan nadat vijf werkdagen zijn verstreken na de
      bekendmaking, bedoeld in het tweede lid, aan de betrokkene.

      6 Indien de betrokkene verzoekt een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref9] te treffen, wordt de werking van de beschikking opgeschort
      totdat er een uitspraak is van de voorzieningenrechter.

      7 Indien het adequaat functioneren van de verzekeringsmarkt of de positie van de verzekeraars op die markt geen
      uitstel toelaat, kan de zorgautoriteit, in afwijking van het tweede tot en met zesde lid, het feit onverwijld ter
      openbare kennis brengen.

      8 Indien de betrokkene na een publicatie als bedoeld in het eerste lid, onderdeel b, alsnog voldoet aan de
      aanwijzing, doet de zorgautoriteit hiervan op dezelfde wijze mededeling als bij de voorafgaande publicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel78
