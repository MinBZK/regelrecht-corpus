      1 Zorgaanbieders en ziektekostenverzekeraars zijn verplicht henzelf betreffende identificerende gegevens alsmede,
      met inachtneming van het bepaalde krachtens [artikel 65][ref1], de in [artikel 60][ref2] bedoelde identificerende
      persoonsgegevens en medische persoonsgegevens aan de zorgautoriteit en de FIOD-ECD te verstrekken ten behoeve
      van het toezicht op de naleving en de handhaving van de [artikelen 35][ref3], [36][ref4] en [38][ref5], waaronder
      begrepen de uitvoering van de [Wet op de economische delicten][ref6].

      2 Zorgaanbieders en ziektekostenverzekeraars zijn niet verplicht medische persoonsgegevens te verstrekken ten
      behoeve van de uitvoering van een verplichting die het eerste lid oplegt aan anderen.

      3 Het eerste lid is mede van toepassing op degene bedoeld in [artikel 44][ref7].


