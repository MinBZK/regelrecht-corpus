  - number: '43'
    text: |-
      1 Van hetgeen bij of krachtens de [artikelen 41][ref1] en [42][ref2] is bepaald, kan niet ten nadele van de
      verzekerde worden afgeweken.

      2 Ten aanzien van de informatieverstrekking door ziektekostenverzekeraars met betrekking tot de overeenkomst
      op afstand is het ter zake bepaalde krachtens de [artikelen 31, eerste lid][ref3], juncto [100][ref4],
      [31, tweede lid][ref5], en [35 van de Wet financiële dienstverlening][ref6] van toepassing.


