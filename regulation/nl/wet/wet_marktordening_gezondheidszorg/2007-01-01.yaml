        bwb_id: BWBR0020078
        artikel: '72'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '17'
  - number: '74'
    text: |-
      De zorgautoriteit heeft een meldpunt voor het ontvangen van gegevens en inlichtingen omtrent feiten en
      omstandigheden die mogelijk niet in overeenstemming zijn met het bij of krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel74
  - number: '75'
    text: |-
      De zorgautoriteit maakt openbaar op welke wijze zij van plan is uitvoering te geven aan de in dit hoofdstuk aan
      haar toegekende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel75
  - number: '76'
    text: |-
      De zorgautoriteit is bevoegd ter handhaving van het bepaalde bij of krachtens de [artikelen 23][ref1],
      [25, tweede lid][ref2], [27][ref3], [34][ref4], [35 tot en met 45][ref5], [48][ref6], [49][ref7], [61][ref8],
      [62][ref9] en [68][ref10] een aanwijzing te geven, erop gericht dat aan het bepaalde bij of krachtens die artikelen
      wordt voldaan.


