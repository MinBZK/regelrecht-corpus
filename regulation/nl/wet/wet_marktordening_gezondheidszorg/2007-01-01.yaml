preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen inzake de ontwikkeling en ordening
    van markten op het gebied van de gezondheidszorg en het toezicht daarop, mede met het oog op een doelmatig
    en doeltreffend stelsel van de zorg en de beheersing van de kostenontwikkeling van de zorg, en dat het tevens
    wenselijk is in verband met de informatieachterstand van de consument en het machtsverschil tussen partijen in de
    zorg, de positie van de consument te beschermen en te bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. zorg:

      1°. zorg of dienst als omschreven bij of krachtens de [Zorgverzekeringswet][ref1] en de
      [Algemene Wet Bijzondere Ziektekosten][ref2];

      2°. handelingen op het gebied van de gezondheidszorg als bedoeld in
      [artikel 1, eerste lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref3], voor zover uitgevoerd,
      al dan niet onder eigen verantwoordelijkheid, door personen, ingeschreven in een register als bedoeld in
      [artikel 3 van die wet][ref4] of door personen als bedoeld in [artikel 34 van die wet][ref5] en voor zover die
      handelingen niet zijn begrepen onder 1°;

      c. zorgaanbieder:

      1°. de natuurlijke persoon of rechtspersoon die beroeps- of bedrijfsmatig zorg verleent;

      2°. de natuurlijke persoon of rechtspersoon voor zover deze tarieven in rekening brengt namens, ten behoeve van of
      in verband met het verlenen van zorg door een zorgaanbieder als bedoeld onder 1°;

      d. zorgverzekeraar: een zorgverzekeraar als bedoeld in de [Zorgverzekeringswet][ref6];

      e. AWBZ-verzekeraar: een zorgverzekeraar die zich overeenkomstig
      [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref7] als zodanig heeft aangemeld voor de uitvoering van
      [die wet][ref8];

      f. ziektekostenverzekeraar:

      1°. een zorgverzekeraar;

      2°. een AWBZ-verzekeraar;

      3°. een particuliere ziektekostenverzekeraar, zijnde een financiële onderneming die ingevolge de
      [Wet op het financieel toezicht][ref9] in Nederland het bedrijf van verzekeraar mag uitoefenen;

      g. verzekerde: degene die een verzekeringsovereenkomst betreffende het risico van ziektekosten
      heeft gesloten met een ziektekostenverzekeraar dan wel van rechtswege verzekerd is op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref10];

      h. verzekeringsplichtige: degene die op grond van [artikel 2 van de Zorgverzekeringswet][ref11] verplicht is zich
      krachtens een zorgverzekering te verzekeren of te laten verzekeren;

      i. consument: verzekeringsplichtige, verzekerde of patiënt;

      j. prestatie: de levering van zorg door een zorgaanbieder als bedoeld in onderdeel c, onder 1°;

      k. tarief: prijs voor een prestatie, een deel van een prestatie of geheel van prestaties van een zorgaanbieder;

      l. zorgautoriteit: de Nederlandse Zorgautoriteit, genoemd in [artikel 3][ref12];

      m. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in de [Zorgverzekeringswet][ref13];

      n. College bouw: het College bouw zorginstellingen, genoemd in de [Wet toelating zorginstellingen][ref14];

      o. College sanering: het College sanering zorginstellingen, genoemd in de [Wet toelating zorginstellingen][ref15];

      p. FIOD-ECD: de Belastingdienst/Fiscale Inlichtingen- en opsporingsdienst en Economische Controledienst van het
      Ministerie van Financiën;

      q. Zorgverzekeringsfonds: het fonds, genoemd in [artikel 39 van de Zorgverzekeringswet][ref16].


