      1 De zorgautoriteit kan een bestuurlijke boete opleggen aan degene die het bepaalde bij of krachtens de
      [artikelen 23][ref1], [34 tot en met 45][ref2], [48, eerste lid][ref3], [49][ref4], [61][ref5], [62][ref6] of
      [68][ref7] overtreedt.

      2 De boete voor een afzonderlijke overtreding bedraagt ten hoogste € 500 000 of, indien dat meer is, tien procent
      van de omzet van de onderneming in Nederland.

      3 De berekening van de omzet, bedoeld in het tweede lid, geschiedt op de voet van hetgeen
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref8] bepaalt voor de netto-omzet.


