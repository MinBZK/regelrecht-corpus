  - number: '26'
    text: |-
      1 De zorgautoriteit stelt op verzoek van Onze Minister onderzoek in bij zorgverzekeraars.

      2 De zorgautoriteit kan tevens op verzoek van het College zorgverzekeringen onderzoek bij zorgverzekeraars
      instellen.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel26
  - number: '27'
    text: |-
      De zorgautoriteit kan regels stellen met betrekking tot:

      a. de controle door zorgverzekeraars;

      b. de inhoud en inrichting van het accountantsverslag, bedoeld in [artikel 38 van de Zorgverzekeringswet][ref1], en
      van het aan dat verslag ten grondslag liggende onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel38
