  - number: '124'
    text: |-
      1 Het College tarieven gezondheidszorg, genoemd in [artikel 18 van de Wet tarieven gezondheidszorg][ref1], en het
      College van toezicht op de zorgverzekeringen, genoemd in [artikel 77, eerste lid, van de Zorgverzekeringswet][ref2],
      zoals die wetten luidden onmiddellijk voor het tijdstip van inwerkingtreding van deze wet, vormen gezamenlijk
      één rechtspersoon, en wel de zorgautoriteit. Besluiten van het College tarieven gezondheidszorg of het College
      van toezicht op de zorgverzekeringen worden na inwerkingtreding van deze wet aangemerkt als besluiten van de
      zorgautoriteit.

      2 De vaststelling door de zorgautoriteit van een bestuursreglement als bedoeld in [artikel 5][ref3]
      onderscheidenlijk een «werkprogramma» en een «begroting» als bedoeld in [artikel 11][ref4], vindt plaats zo spoedig
      mogelijk onderscheidenlijk vindt voor het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in
      het Staatsblad is geplaatst.

      3 Onze Minister stelt voor de zorgautoriteit een voorlopig bestuursreglement vast. Het voorlopig reglement geldt
      totdat het bestuursreglement van de zorgautoriteit de goedkeuring van Onze Minister heeft verkregen.

      4 Voor zover het eerste tot en met derde lid daarin niet voorzien, stelt Onze Minister regels met betrekking tot
      de gevolgen van de inwerkingtreding van deze wet. Deze regels gelden tot en met 31 december van het kalenderjaar
      na dat waarin zij in werking zijn getreden. Van het vaststellen van deze regels wordt kennis gegeven aan de beide
      kamers der Staten-Generaal.

      5 Voorzover de regels, bedoeld in het vierde lid betrekking hebben op onderwerpen waarover de zorgautoriteit regels
      kan stellen, gelden zij tot inwerkingtreding van die regels van de zorgautoriteit.

      6 In afwijking van [artikel 6][ref5] van deze wet zijn de regels voor ambtenaren die zijn
      aangesteld bij ministeries gedurende een periode van vier jaren, te rekenen vanaf de datum waarop de
      [Invoerings- en aanpassingswet Zorgverzekeringswet][ref6] in werking is getreden, niet van toepassing op de
      rechtspositie van het personeel van de zorgautoriteit. Gedurende die periode wordt de rechtspositie van dat
      personeel geregeld door de zorgautoriteit.

      7 Met ingang van de datum van inwerkingtreding van deze wet zijn de personeelsleden van het College
      tarieven gezondheidszorg en het College van toezicht op de zorgverzekeringen in dienst van de zorgautoriteit
      aangesteld. Daarbij worden hun arbeidsvoorwaarden als geheel zoveel mogelijk op een gelijk niveau gesteld met
      de arbeidsvoorwaarden die verbonden waren aan hun dienstbetrekking bij het College tarieven gezondheidszorg,
      onderscheidenlijk het College van toezicht op de zorgverzekeringen. Bij ministeriële regeling kunnen regels worden
      gesteld omtrent het in dit lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel18
