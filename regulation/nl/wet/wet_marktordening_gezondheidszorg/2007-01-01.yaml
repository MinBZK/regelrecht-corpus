  - number: '79'
    text: |-
      1 De zorgautoriteit geeft geen aanwijzing als bedoeld in [artikel 76][ref1], [77][ref2] of [78][ref3] omtrent de
      beoordeling of behandeling van individuele gevallen door degene tot wie de aanwijzing is gericht.

      2 Bij de aanwijzing stelt de zorgautoriteit een termijn waarbinnen de betrokkene aan de aanwijzing voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel76
