  - number: '55'
    text: |-
      1 Voordat de zorgautoriteit een beschikking neemt op een aanvraag tot vaststelling van een tarief, stelt zij de
      naar haar oordeel betrokken zorgaanbieder en betrokken ziektekostenverzekeraar in de gelegenheid te worden gehoord,
      indien dezen of een van hen daarom hebben verzocht.

      2 De zorgautoriteit doet van haar voornemen een aanvraag in behandeling te nemen tijdig mededeling aan de in het
      eerste lid bedoelde betrokkenen.

      3 Het eerste en tweede lid zijn niet van toepassing op de vaststelling van een tarief op grond van
      [artikel 52, eerste lid][ref1], en [artikel 53, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel52
