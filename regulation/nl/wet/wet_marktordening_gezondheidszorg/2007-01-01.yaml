  - number: '58'
    text: |-
      1 Indien de zorgautoriteit in een beleidsregel als bedoeld in [artikel 57][ref1] de mogelijkheid opneemt van een
      experiment, neemt zij de in dit artikel bedoelde bepalingen in acht.

      2 In de beleidsregel kan de zorgautoriteit opnemen onder welke voorwaarden of met inachtneming van welke in die
      beleidsregel aangegeven voorschriften of beperkingen kan worden afgeweken van andere, in die beleidsregel genoemde
      beleidsregels als bedoeld in [artikel 57][ref2], of van in die beleidsregel genoemde, door haar gestelde algemeen
      verbindende regels.

      3 De beperkingen, bedoeld in het tweede lid, kunnen inhouden dat de werking van de desbetreffende beleidsregel
      is beperkt tot een bepaald gebied, tot een bepaalde categorie of een deel van een categorie van zorgaanbieders,
      van ziektekostenverzekeraars, van patiënten of van prestaties, of tot een beperkt aantal zorgaanbieders,
      ziektekostenverzekeraars, patiënten of prestaties.

      4 De beleidsregel kan inhouden dat onder in die beleidsregel gestelde voorwaarden of met inachtneming van in die
      beleidsregel aangegeven voorschriften of beperkingen:

      a. [artikel 35][ref3] niet van toepassing is op het tarief voor de bij het experiment betrokken prestaties;

      b. [artikel 35, eerste lid, onder a en b][ref4], niet van toepassing is op de prestatiebeschrijving van de bij het
      experiment betrokken prestaties;

      c. [artikel 12, eerste lid, van de Zorgverzekeringswet][ref5] of
      [artikel 15 van de Algemene Wet Bijzondere Ziektekosten][ref6] niet van toepassing is op het tarief voor de bij het
      experiment betrokken prestaties;

      d. [artikel 12, tweede of derde lid, van de Zorgverzekeringswet][ref7] dan wel [artikel 16b, eerste lid][ref8], of
      [16c, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref9] niet van toepassing is op het tarief voor de
      bij het experiment betrokken prestaties.

      5 Een beleidsregel als bedoeld in het eerste lid bepaalt de maximale duur van het experiment, die ten hoogste vijf
      jaren bedraagt. De zorgautoriteit kan besluiten de gevolgen van het experiment geheel of gedeeltelijk in stand te
      laten tot het einde van het boekjaar volgend op het boekjaar waarin het experiment is geëindigd.

      6 De zorgautoriteit evalueert het experiment tijdig en tijdens zijn uitvoering.

      7 De zorgautoriteit rapporteert over de uitslag van een experiment aan Onze Minister in ieder geval binnen drie
      maanden na afloop van het experiment.


