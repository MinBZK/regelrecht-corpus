  - number: '67'
    text: |-
      1 Voor degene die op grond van deze wet gegevens en inlichtingen ontvangt, gelden dezelfde wettelijke voorschriften
      inzake geheimhouding van die gegevens en inlichtingen als voor degene die ze heeft verstrekt.

      2 De gegevens en inlichtingen, bedoeld in [artikel 70, tweede lid][ref1], worden door de zorgautoriteit verstrekt
      mits:

      a. de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en

      b. voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor zij worden verstrekt.

      3 Het eerste lid laat onverlet de bevoegdheden van de Algemene Rekenkamer ingevolge
      [artikel 91 van de Comptabiliteitswet 2001][ref2]. De Algemene Rekenkamer is bij het doen van mededelingen als
      bedoeld in [artikel 91, elfde tot en met veertiende lid, van die wet][ref3] verplicht tot geheimhouding voorzover
      het betreft gegevens en inlichtingen die haar ingevolge de eerste volzin bekend zijn geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel91
