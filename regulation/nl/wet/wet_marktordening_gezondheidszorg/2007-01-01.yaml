    text: |-
      1 De zorgautoriteit kan, met inachtneming van het bepaalde krachtens [artikel 65][ref1], regels stellen, inhoudende
      aan wie daarbij te bepalen gegevens en inlichtingen als bedoeld in de [artikelen 61][ref2] en [62][ref3], moeten
      worden verstrekt, het tijdstip en de wijze waarop en de vorm waarin de gegevens en inlichtingen moeten worden
      verstrekt of door wie en de wijze waarop de gegevens moeten worden bewerkt of door wie en de wijze waarop de
      gegevens dan wel de bewerkingen van die gegevens moeten worden bekendgemaakt, alsmede dat een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref4] de juistheid van de verstrekte gegevens en
      inlichtingen bevestigt.

      2 De regels, bedoeld in het eerste lid, kunnen ook inhouden de wijze waarop, de vorm waarin of door wie daarbij te
      bepalen gegevens en inlichtingen, waaronder medische persoonsgegevens, moeten worden bewerkt alvorens de bewerking
      moet worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
