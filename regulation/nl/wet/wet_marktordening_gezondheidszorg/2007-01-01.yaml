  - number: '44'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 36][ref1] en [38 tot en met 43][ref2] is mede van toepassing ten
      aanzien van degene die voor een zorgaanbieder of ziektekostenverzekeraar een administratie voert alsmede ten
      aanzien van degene die een administratie voert ten behoeve van of in verband met het aanbieden, overeenkomen,
      leveren, in rekening brengen, betalen of vergoeden aan derden van een prestatie of een tarief of het ontvangen van
      een betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel44
