  - number: '14'
    text: |-
      1 De onderdelen «werkprogramma» en «begroting» van het jaarplan, bedoeld in [artikel 11][ref1], en het onderdeel
      «jaarrekening» van de jaarverantwoording, bedoeld in [artikel 13][ref2], behoeven de goedkeuring van Onze Minister.

      2 Het eerste lid geldt niet voor wijzigingen in een goedgekeurde begroting, mits:

      a. de totale omvang van de begroting geen wijziging ondergaat, en

      b. de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van vijf procent van het in [artikel 12][ref3] bedoelde budget niet te boven gaat.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en de inrichting van:

      a. het jaarplan, bedoeld in [artikel 11][ref4];

      b. de jaarverantwoording, bedoeld in [artikel 13][ref5];

      c. de verklaring, bedoeld in [artikel 13, vierde lid][ref6], het verslag van bevindingen, bedoeld in
      [artikel 13, zesde lid][ref7], alsmede het aan die verklaring en dat verslag ten grondslag liggende onderzoek.

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 12][ref8] wordt vastgesteld.

      5 De zorgautoriteit voegt in overeenstemming met Onze Minister aan het jaarverslag een plan toe met de strekking,
      de administratieve lasten bedoeld in [artikel 13, tweede lid, onder c][ref9], elk jaar te beperken; het plan bevat
      tevens het resultaat van de uitvoering hiervan over het voorafgaande jaar.


