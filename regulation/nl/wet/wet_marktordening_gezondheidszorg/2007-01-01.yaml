  - number: '72'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast:

      a. de bij besluit van Onze Minister aangewezen ambtenaren;

      b. de bij besluit van de zorgautoriteit aangewezen medewerkers van de zorgautoriteit;

      c. de ambtenaren van het Staatstoezicht op de volksgezondheid; en

      d. de medewerkers van de FIOD-ECD.

      2 Van een besluit als bedoeld in het eerste lid, onder a of b, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel72
  - number: '73'
    text: |-
      Degenen die ingevolge [artikel 72][ref1] belast zijn met toezicht op de naleving en degenen die ingevolge
      [artikel 17 van de Wet op de economische delicten][ref2] belast zijn met de opsporing van hetgeen bij of krachtens
      deze wet is bepaald of strafbaar is gesteld, verstrekken elkaar alle gegevens en inlichtingen voor zover dat
      noodzakelijk is voor de uitoefening van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel17
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel73
    references:
