  - number: '34'
    text: |-
      1 Een procedure die een ziektekostenverzekeraar of zorgaanbieder hanteert als voorwaarde voor het verlenen van
      diensten of zorg aan een andere zorgaanbieder of aan een consument mag uitsluitend informatie verlangen die van
      rechtstreeks belang is voor het onderwerp waarop die procedure betrekking heeft.

      2 Bij verandering van ziektekostenverzekeraar blijven alle met betrekking tot de betrokken verzekerde gehanteerde
      procedures geldig.

      3 De zorgautoriteit kan regels stellen over:

      a. verrichtingen waarvoor geen procedure mag worden opgelegd;

      b. de geldigheid van eenzelfde procedure voor een aantal handelingen;

      c. de eenvormige invulling van procedures, waarbij kan worden voorgeschreven dat deze uitsluitend langs
      elektronische weg worden toegepast.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel34
  - number: '35'
    text: |-
      1 Het is een zorgaanbieder verboden een tarief in rekening te brengen:

      a. voor een prestatie waarvoor geen prestatiebeschrijving op grond van [artikel 56][ref1] is vastgesteld;

      b. voor een prestatie waarvoor een andere prestatiebeschrijving wordt gehanteerd dan op grond van
      [artikel 56][ref2] is vastgesteld;

      c. dat niet overeenkomt met het tarief dat voor de betrokken prestatie op grond van [artikel 50][ref3] of
      [52][ref4] is vastgesteld;

      d. dat niet ligt binnen de tariefruimte die op grond van [artikel 54][ref5] voor de betrokken prestatie is
      vastgesteld;

      e. anders dan op de wijze die overeenkomstig deze wet is vastgesteld.

      2 Het is een zorgaanbieder verboden een tarief als bedoeld in het eerste lid, te betalen aan een andere
      zorgaanbieder of aan derden te vergoeden.

      3 Het is een ziektekostenverzekeraar verboden een tarief als bedoeld in het eerste lid, te betalen of aan derden
      te vergoeden.

      4 Een zorgaanbieder en een ziektekostenverzekeraar kunnen aan het aanbieden, overeenkomen of leveren van een
      prestatie als bedoeld in het eerste lid, onder a of b, dan wel aan het in rekening brengen, betalen of aan een
      derde vergoeden van een tarief als bedoeld in het eerste lid, geen rechten ontlenen.

      5 Het derde en vierde lid zijn van overeenkomstige toepassing op een verzekeraar in de zin van de
      [Wet op het financieel toezicht][ref6], voor zover niet begrepen onder [artikel 1, onder f, sub 3][ref7], van deze
      wet.


