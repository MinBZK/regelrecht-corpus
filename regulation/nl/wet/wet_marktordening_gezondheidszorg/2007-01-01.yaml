    text: |-
      1 Met het oog op een effectieve en efficiënte besluitvorming over de wijze van behandeling van aangelegenheden van
      wederzijds belang en het verzamelen van informatie ten behoeve daarvan worden daarover afspraken gemaakt tussen de
      zorgautoriteit en:

      a. de Nederlandse Mededingingsautoriteit;

      b. het Staatstoezicht op de volksgezondheid;

      c. De Nederlandsche Bank;

      d. de Stichting Autoriteit Financiële Markten;

      e. het College zorgverzekeringen;

      f. het College bouw;

      g. het College sanering;

      h. de FIOD-ECD;

      i. het College van procureurs-generaal van het Openbaar Ministerie en

      j. het College bescherming persoonsgegevens.

      2 De afspraken houden in ieder geval in dat een bestuursorgaan aan derden geen informatie vraagt indien een van de
      andere genoemde bestuursorganen de benodigde informatie kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel17
  - number: '18'
    text: |-
      1 De zorgautoriteit en de Nederlandse Mededingingsautoriteit, verder in dit artikel te noemen de
      mededingingsautoriteit, bevorderen dat belanghebbenden zich bij aangelegenheden waarbij mogelijk sprake is van
      samenloop van bevoegdheden eerst wenden tot de zorgautoriteit.

      2 Van samenloop van bevoegdheden als bedoeld in het eerste lid is sprake in een situatie waarin de mogelijke
      uitoefening van bevoegdheden van de zorgautoriteit op grond van [artikel 48][ref1] van deze wet en de mogelijke
      uitoefening van bevoegdheden van de Mededingingsautoriteit op grond van de [Mededingingswet][ref2] of Europese wet-
      en regelgeving samenvallen dan wel kunnen samenvallen.

      3 De zorgautoriteit past bij mogelijke samenloop van bevoegdheden voor zover mogelijk eerst de bevoegdheden toe
      die zij op grond van deze wet heeft, alvorens de mededingingsautoriteit de haar ten dienste staande bevoegdheden op
      grond van de [Mededingingswet][ref3] toepast.

      4 De zorgautoriteit richt zich naar de uitleg van begrippen die de mededingingsautoriteit hanteert in het kader van
      de toepassing van het mededingingsrecht.

      5 Van hetgeen bepaald is in het derde lid kan worden afgeweken indien de zorgautoriteit en de
      mededingingsautoriteit in gezamenlijk overleg tot het oordeel komen dat een aangelegenheid op basis van
      effectiviteit van het wettelijke instrumentarium of uit efficiëntie of andere overwegingen beter door de
      mededingingsautoriteit of door de mededingingsautoriteit en de zorgautoriteit gezamenlijk kan worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0008691
      [ref3]: https://wetten.overheid.nl/BWBR0008691
