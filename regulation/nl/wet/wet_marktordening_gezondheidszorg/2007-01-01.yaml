  - number: '91'
    text: |-
      1 Degene die wordt verhoord met het oog op het opleggen van een bestuurlijke boete, is niet verplicht ten behoeve
      daarvan verklaringen omtrent de overtreding af te leggen.

      2 De betrokkene wordt hierop gewezen alvorens hem mondeling wordt gevraagd verklaringen af te leggen, en in ieder
      geval wanneer hij in de gelegenheid wordt gesteld over het voornemen tot oplegging van de bestuurlijke boete zijn
      zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel91
  - number: '92'
    text: |-
      1 De zorgautoriteit maakt van de overtreding een rapport op.

      2 Het rapport is gedagtekend en vermeldt in ieder geval:

      a. de naam van de overtreder;

      b. de overtreding alsmede het overtreden voorschrift;

      c. zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.

      3 Indien van de overtreding een proces-verbaal als bedoeld in [artikel 152 van het Wetboek van Strafvordering][ref1]
      is opgemaakt, treedt dit in de plaats van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel152
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '152'
  - number: '93'
    text: |-
      1 De zorgautoriteit stelt de overtreder desgevraagd in de gelegenheid de gegevens waarop het opleggen van de
      bestuurlijke boete, dan wel het voornemen daartoe, berust, in te zien en daarvan afschriften te vervaardigen.

      2 Voor zover blijkt dat de verdediging van de overtreder dit redelijkerwijs vergt, draagt de zorgautoriteit er
      zoveel mogelijk zorg voor dat deze gegevens aan de overtreder worden medegedeeld in een voor hem begrijpelijke
      taal.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel93
  - number: '94'
    text: |-
      1 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] wordt de overtreder in de gelegenheid
      gesteld zijn zienswijze over het voornemen tot het opleggen van een bestuurlijke boete naar voren te brengen.

      2 Bij de uitnodiging tot het naar voren brengen van zijn zienswijze wordt het rapport, bedoeld in
      [artikel 92][ref2], aan de overtreder toegezonden of uitgereikt.

      3 De zorgautoriteit zorgt voor bijstand door een tolk, indien naar haar oordeel de verdediging van de overtreder
      dit redelijkerwijs vergt.

      4 De overtreder ontvangt een schriftelijke mededeling indien de zorgautoriteit, nadat de overtreder zijn zienswijze
      naar voren heeft gebracht, heeft beslist dat:

      a. voor de overtreding geen bestuurlijke boete zal worden opgelegd; of

      b. de overtreding alsnog aan de officier van justitie zal worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel92
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '6.4'
        afdeling: 6.4.2
  - number: '95'
    text: |-
      1 De zorgautoriteit legt geen bestuurlijke boete op:

      a. voor zover de overtreding niet aan de overtreder kan worden verweten;

      b. voor zover voor de overtreding een rechtvaardigingsgrond bestond;

      c. indien aan de overtreder wegens dezelfde overtreding reeds eerder een bestuurlijke boete is opgelegd, dan wel
      een kennisgeving als bedoeld in [artikel 94, vierde lid, aanhef en onderdeel a][ref1], is gedaan;

      d. indien tegen de overtreder wegens dezelfde gedraging:

      1°. een strafvervolging is ingesteld en het onderzoek ter terechtzitting is begonnen; of

      2°. het recht tot strafvordering is vervallen ingevolge [artikel 74][ref2]
      of [74c van het Wetboek van Strafrecht][ref3], dan wel ingevolge
      [artikel 76 van de Algemene wet inzake rijksbelastingen][ref4].

      2 Indien de gedraging tevens een strafbaar feit is, wordt zij aan de officier van justitie voorgelegd, tenzij bij
      wettelijk voorschrift is bepaald, dan wel met het openbaar ministerie is overeengekomen, dat daarvan kan worden
      afgezien.

      3 Voor een gedraging die aan de officier van justitie moet worden voorgelegd, legt de zorgautoriteit slechts een
      bestuurlijke boete op indien:

      a. de officier van justitie haar heeft medegedeeld ten aanzien van de overtreder zowel van strafvervolging als van
      toepassing van [artikel 74 van het Wetboek van Strafrecht][ref5] af te zien; of

      b. zij niet binnen dertien weken een reactie van de officier van justitie heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel74c
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '94'
        hoofdstuk: '6'
        paragraaf: '6.4'
        afdeling: 6.4.2
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 74c
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref5
