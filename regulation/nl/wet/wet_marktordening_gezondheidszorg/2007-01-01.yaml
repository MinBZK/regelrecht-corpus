    text: |-
      1 In de [artikelen 91 tot en met 102][ref1] wordt verstaan onder:

      a. overtreding: een gedraging die in strijd is met het bepaalde bij of krachtens een wettelijk voorschrift;

      b. overtreder: degene die de overtreding pleegt of medepleegt.

      2 [Artikel 51 van het Wetboek van Strafrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel90
