    text: |-
      De griffiers of secretarissen van de in de [Wet op de rechterlijke organisatie][ref1] bedoelde gerechten, van de
      Centrale Raad van Beroep, van het College van Beroep voor het bedrijfsleven en van de tuchtcolleges, bedoeld in
      [artikel 47, derde lid, van de Wet op de beroepen in de individuele gezondheidszorg][ref2], verstrekken aan Onze
      Minister, aan de zorgautoriteit, aan de FIOD-ECD of aan een krachtens [artikel 72][ref3] aangewezen persoon vrij
      van alle kosten alle gegevens en uittreksels uit of afschriften van vonnissen, arresten, uitspraken, registers, en
      andere stukken, die ten behoeve van de uitvoering van deze wet van hen worden verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel72
