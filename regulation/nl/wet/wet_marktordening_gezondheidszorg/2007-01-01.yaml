  - number: '45'
    text: |-
      De zorgautoriteit kan, met het oog op de inzichtelijkheid van de zorgmarkten of de bevordering van de concurrentie,
      regels stellen betreffende de wijze van totstandkoming van overeenkomsten met betrekking tot zorg of tarieven en
      betreffende de voorwaarden in die overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel45
  - number: '46'
    text: Deze paragraaf is van toepassing op de zorgverzekeringsmarkt, de zorgverleningsmarkt en de zorginkoopmarkt.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel46
  - number: '47'
    text: |-
      In deze paragraaf wordt onder aanmerkelijke marktmacht verstaan de positie van een of meer zorgaanbieders
      of ziektekostenverzekeraars om alleen dan wel gezamenlijk de ontwikkeling van daadwerkelijke concurrentie op
      de Nederlandse markt of een deel daarvan te kunnen belemmeren door de mogelijkheid zich in belangrijke mate
      onafhankelijk te gedragen van:

      a. zijn concurrenten;

      b. ziektekostenverzekeraars, indien het een zorgaanbieder betreft;

      c. zorgaanbieders, indien het een ziektekostenverzekeraar betreft, of

      d. consumenten.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel47
  - number: '48'
    text: |-
      1 Indien de zorgautoriteit van oordeel is dat een of meer zorgaanbieders of een of meer ziektekostenverzekeraars
      alleen dan wel gezamenlijk beschikt onderscheidenlijk beschikken over aanmerkelijke marktmacht op een door de
      zorgautoriteit volgens de beginselen van het algemeen mededingingsrecht afgebakende markt, kan de zorgautoriteit
      die zorgaanbieder of zorgaanbieders dan wel die ziektekostenverzekeraar of ziektekostenverzekeraars een of meer van
      de volgende verplichtingen opleggen:

      a. de verplichting om door de zorgautoriteit te bepalen categorieën van informatie aan door de zorgautoriteit te
      bepalen categorieën van belanghebbenden op een door de zorgautoriteit te bepalen wijze bekend te maken;

      b. de verplichting om bij de levering van door de zorgautoriteit te bepalen diensten, de afnemers van die diensten
      in gelijke gevallen gelijk te behandelen;

      c. de verplichting om een door de zorgautoriteit te bepalen dienst los te leveren van andere diensten;

      d. de verplichting om de kosten en opbrengsten van door de zorgautoriteit te bepalen diensten die de zorgaanbieder
      of ziektekostenverzekeraar aan zichzelf of aan zijn afnemers aanbiedt, te scheiden van die van de overige door de
      zorgaanbieder of ziektekostenverzekeraar verrichte activiteiten en daartoe een gescheiden boekhouding te voeren
      overeenkomstig door de zorgautoriteit gegeven aanwijzingen;

      e. de verplichting om onder redelijke voorwaarden te voldoen aan elk redelijk verzoek van een zorgaanbieder of
      ziektekostenverzekeraar tot het sluiten van een overeenkomst op of ten behoeve van de zorginkoopmarkt;

      f. de verplichting voor een ziektekostenverzekeraar om in zijn overeenkomsten met zorgaanbieders niet een
      onredelijk hoge capaciteit overeen te komen in relatie tot de capaciteit die de verzekeraar naar verwachting voor
      zijn verzekerden nodig heeft;

      g. de verplichting om voor het medegebruik van door de zorgautoriteit aan te wijzen categorieën van zorg, diensten
      of faciliteiten een openbaar aanbod te doen en in stand te houden;

      h. de verplichting om het onder g bedoelde openbare aanbod overeenkomstig door de zorgautoriteit gegeven
      aanwijzingen te wijzigen;

      i. de verplichting om de tarieven van door de zorgautoriteit aan te wijzen diensten of leveringen vast te stellen
      overeenkomstig een door de zorgautoriteit te bepalen berekeningsmethode;

      j. de verplichting om ten behoeve van de vaststelling als bedoeld onder i een kostentoerekeningssysteem te hanteren
      dat voldoet aan door de zorgautoriteit te bepalen toerekeningsprincipes;

      k. de verplichting om op door de zorgautoriteit te bepalen wijze door middel van een accountantsverklaring of
      anderszins, eenmalig of periodiek aan te tonen dat aan de onder i en j bedoelde verplichting is voldaan;

      l. andere, bij ministeriële regeling aangewezen verplichtingen.

      2 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 De zorgautoriteit neemt bij het opleggen van verplichtingen als bedoeld in het eerste lid de eisen van
      proportionaliteit in acht.

      4 De zorgautoriteit kan aan de verplichtingen, bedoeld in het eerste lid, voorschriften en beperkingen verbinden
      die nodig zijn voor een goede uitvoering van de verplichtingen.

      5 Een verplichting als bedoeld in het eerste lid geldt voor een periode van ten hoogste drie jaar na de datum
      waarop deze ingaat. De zorgautoriteit kan binnen die periode beslissen tot intrekking indien de verplichting naar
      haar oordeel niet meer noodzakelijk is. Voorts kan de zorgautoriteit binnen die periode beslissen tot wijziging of
      verlenging van de verplichting, telkens voor een periode van ten hoogste drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '49'
    text: |-
      1 Indien de zorgautoriteit een redelijk vermoeden heeft dat zij tot een oordeel als bedoeld in het eerste lid van
      [artikel 48][ref1] zal komen, kan zij in spoedeisende gevallen vooruitlopen op de toepassing van dat artikel en de
      desbetreffende zorgaanbieder of zorgaanbieders dan wel ziektekostenverzekeraar of ziektekostenverzekeraars een of
      meer van de verplichtingen opleggen, genoemd in het [eerste lid van artikel 48][ref2].

      2 [Artikel 48, derde en vierde lid][ref3], is van overeenkomstige toepassing op de verplichting, bedoeld in het
      eerste lid.

      3 [Artikel 48, vijfde lid][ref4], is van overeenkomstige toepassing op de verplichting, bedoeld in het eerste lid,
      met dien verstande dat de verplichting geldt voor een periode van ten hoogste zes maanden en dat deze eenmaal met
      een periode van ten hoogste zes maanden kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel48
