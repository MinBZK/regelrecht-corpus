        paragraaf: '4.2'
  - number: '41'
    text: |-
      1 In dit artikel en in de [artikelen 42][ref1] en [43][ref2] wordt verstaan onder:

      a. overeenkomst op afstand: een verzekeringsovereenkomst betreffende het risico van ziektekosten tussen een
      ziektekostenverzekeraar en een consument, die wordt gesloten in het kader van een door de ziektekostenverzekeraar
      georganiseerd systeem van verkoop of dienstverrichting op afstand, waarbij tot en met de totstandkoming van die
      overeenkomst uitsluitend gebruik gemaakt wordt van een of meer technieken van communicatie op afstand;

      b. techniek voor communicatie op afstand: ieder middel dat, zonder gelijktijdige fysieke aanwezigheid van
      ziektekostenverzekeraar en consument, kan worden gebruikt voor het sluiten van een verzekeringsovereenkomst
      betreffende het risico van ziektekosten tussen die partijen.

      2 Een verzekerde kan een overeenkomst op afstand zonder een boete verschuldigd te zijn en zonder opgave van redenen
      ontbinden gedurende veertien kalenderdagen vanaf de dag waarop die overeenkomst is aangegaan, dan wel, indien dit
      later is, gedurende veertien kalenderdagen vanaf de dag waarop de informatie die de ziektekostenverzekeraar hem
      krachtens [artikel 43, tweede lid][ref3], dient te verstrekken, door hem is ontvangen.

      3 Indien een verzekerde gebruik wenst te maken van het in het tweede lid bedoelde recht, geeft hij daarvan voor het
      verstrijken van de in het tweede lid genoemde termijn kennis aan de ziektekostenverzekeraar volgens de instructies
      voor de uitoefening van dat recht, die hem krachtens [artikel 43, tweede lid][ref4], zijn gegeven. De kennisgeving
      wordt als tijdig aangemerkt indien zij schriftelijk of op een voor de ontvanger beschikbare en toegankelijke
      duurzame drager is verzonden voor het verstrijken van de termijn.

      4 Indien aan een overeenkomst op afstand een andere overeenkomst verbonden is ten aanzien van een zaak of dienst
      die door de ziektekostenverzekeraar wordt geleverd of door een derde op grond van een overeenkomst tussen de
      ziektekostenverzekeraar en deze derde, brengt de ontbinding van de overeenkomst op afstand overeenkomstig het
      tweede lid, van rechtswege en zonder dat de verzekerde een boete verschuldigd is, de ontbinding mee van die
      verbonden overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel43
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel41
