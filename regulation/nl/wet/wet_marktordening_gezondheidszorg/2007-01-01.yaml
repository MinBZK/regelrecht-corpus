  - number: '69'
    text: |-
      1 Onverminderd de verplichting van zorgaanbieders en ziektekostenverzekeraars om gegevens en inlichtingen te
      verstrekken als bedoeld in de [artikelen 61][ref1] en [62][ref2], kan de zorgautoriteit bij het uitoefenen van aan
      haar opgedragen taken eigen informatie gebruiken indien de in die artikelen bedoelde gegevens en inlichtingen niet
      of niet volledig worden verstrekt.

      2 De zorgautoriteit is bevoegd alle gegevens en inlichtingen, die zij heeft verzameld op grond van alle haar
      daartoe ten dienste staande wettelijke bevoegdheden, te gebruiken voor alle aan haar opgedragen taken.

      3 Bij het gebruik door de zorgautoriteit van informatie, gegevens en inlichtingen als bedoeld in het eerste en
      tweede lid, is het bepaalde krachtens [artikel 65][ref3] met betrekking tot het verwerken van persoonsgegevens van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel62
