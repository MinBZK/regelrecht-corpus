  - number: '56'
    text: |-
      1 Een zorgaanbieder of een ziektekostenverzekeraar kan de zorgautoriteit vragen een prestatiebeschrijving vast
      te stellen met betrekking tot een prestatie waarvoor de zorgautoriteit op grond van het bepaalde bij of krachtens
      [artikel 2, tweede lid][ref1], [artikel 57, vierde lid, onder c][ref2], dan wel [artikel 58, vierde lid][ref3],
      geen tarief behoeft vast te stellen.

      2 Een aanvraag als bedoeld in het eerste lid bevat een voorstel voor de toe te passen prestatiebeschrijving.

      3 Indien de zorgautoriteit geen regels heeft vastgesteld als bedoeld in [artikel 37][ref4] bevat de aanvraag voorts
      een voorstel voor:

      a. degene aan wie het tarief voor de prestatie in rekening wordt gebracht;

      b. degene door wie het tarief voor die prestatie in rekening wordt gebracht en

      c. de wijze waarop het tarief in rekening wordt gebracht.

      4 De [artikelen 52, derde tot en met vijfde lid en zevende lid][ref5], en [53, eerste lid][ref6], zijn van
      overeenkomstige toepassing op de vaststelling van een prestatiebeschrijving. Bij zodanige vaststelling bevat een
      beschikking in ieder geval de onderwerpen, genoemd in het tweede en derde lid, voor zover van toepassing.


