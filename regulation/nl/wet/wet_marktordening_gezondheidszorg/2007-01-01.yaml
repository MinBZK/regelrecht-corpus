    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder b en c][ref1], een aanwijzing geven
      aan een zorgverzekeraar, dan wel aan een verzekeraar die verzekeringen als zorgverzekering aanbiedt of uitvoert die
