      1 De zorgautoriteit kan een bestuurlijke boete opleggen aan een zorgverzekeraar die het
      bepaalde bij of krachtens de [artikelen 3][ref1], [25, derde lid][ref2], [28][ref3], of
      [29, eerste en tweede lid, van de Zorgverzekeringswet][ref4] overtreedt.

      2 De zorgautoriteit kan een bestuurlijke boete opleggen aan een verzekeraar of rechtspersoon die niet voldoet
      of niet heeft voldaan aan de voorschriften, gesteld bij de [artikelen 25, eerste en tweede lid][ref5], of
      [30 van de Zorgverzekeringswet][ref6].

      3 De boete voor een afzonderlijke overtreding bedraagt ten hoogste € 500 000.


