  - number: '81'
    text: |-
      1 Indien een zorgaanbieder of een ziektekostenverzekeraar, voorzover niet bedoeld in
      [artikel 80, eerste lid][ref1], hierna te noemen: betrokkene, niet binnen de termijn, bedoeld in
      [artikel 79][ref2], aan een krachtens [artikel 76][ref3] gegeven aanwijzing voldoet, is de zorgautoriteit bevoegd:

      a. bestuursdwang toe te passen, of

      b. ter openbare kennis te brengen, zo nodig onder vermelding van de overwegingen die tot die kennisgeving hebben
      geleid:

      1°. dat de betrokkene in strijd handelt met een of meer door de zorgautoriteit genoemde, bij of krachtens deze wet
      geregelde bepalingen;

      2°. dat aan de betrokkene een aanwijzing is gegeven dan wel een last onder dwangsom of een bestuurlijke boete is
      opgelegd.

      2 Indien het adequaat functioneren van de zorgverlenings- of zorginkoopmarkt of de positie van zorgaanbieders op
      die markt geen uitstel toelaat, kan de zorgautoriteit het feit onverwijld ter openbare kennis brengen.

      3 Het [tweede tot en met achtste lid van artikel 80][ref4] zijn van overeenkomstige toepassing met betrekking tot
      het eerste en tweede lid.


