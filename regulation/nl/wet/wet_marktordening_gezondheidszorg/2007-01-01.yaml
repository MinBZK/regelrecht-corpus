  - number: '32'
    text: |-
      1 De zorgautoriteit onderzoekt, met inachtneming van [artikel 65][ref1], de concurrentieverhoudingen en het
      marktgedrag op het gebied van de zorg.

      2 Het onderzoek kan zich onder meer richten op:

      a. de totstandkoming van overeenkomsten met betrekking tot zorg, tarieven of ziektekostenverzekeringen, naar de
      voorwaarden in die overeenkomsten en naar de resultaten daarvan;

      b. de marktwerking in de markten voor zorgverlening, zorginkoop en ziektekostenverzekeringen;

      c. de informatieverstrekking door zorgaanbieders en ziektekostenverzekeraars aan de consumenten en de
      doeltreffendheid, juistheid, inzichtelijkheid en vergelijkbaarheid van die informatie;

      d. het presteren van zorgaanbieders en van ziektekostenverzekeraars, mede met het oog op de onderlinge vergelijking
      daarvan;

      e. de onderbouwing en ontwikkeling van kosten en prijzen, mede in relatie tot de kwaliteit, van zorgverlening en
      ziektekostenverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel32
