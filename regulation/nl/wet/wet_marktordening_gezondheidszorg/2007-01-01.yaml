  - number: '61'
    text: |-
      1 Een ieder is gehouden desgevraagd aan de zorgautoriteit of aan een daartoe door deze aangewezen persoon,
      verder in dit artikel aan te duiden als vrager, kosteloos en met inachtneming van het bepaalde krachtens
      [artikel 65][ref1]:

      a. de gegevens en inlichtingen te verstrekken welke redelijkerwijs voor de uitvoering van deze wet van belang
      kunnen zijn;

      b. de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze van de vrager –
      waarvan de raadpleging redelijkerwijs van belang kan zijn voor de vaststelling van de feiten welke invloed kunnen
      uitoefenen op de uitvoering van deze wet, voor dit doel beschikbaar te stellen.

      2 Ingeval deze wet aangelegenheden van een derde aanmerkt als aangelegenheden van degene die op grond van het
      eerste lid inlichtingenplichtig is, gelden, voor zover het deze aangelegenheden betreft, gelijke verplichtingen
      voor de derde.

      3 De in het eerste lid, onderdeel b, bedoelde verplichting geldt onverminderd voor een derde bij wie zich
      gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de vrager voor raadpleging
      beschikbaar te stellen.

      4 De vrager stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan
      in kennis.

      5 De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze – zulks ter keuze van de vrager – en binnen een door de vrager te stellen termijn.

      6 Toegelaten moet worden dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.

      7 De verplichting van het eerste of tweede lid geldt niet indien de betrokkene de gevraagde gegevens of
      inlichtingen reeds aan een ander bestuursorgaan heeft verstrekt en zij door dat bestuursorgaan aan de
      zorgautoriteit verstrekt kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel65
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel61
