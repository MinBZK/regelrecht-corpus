  - number: '65'
    text: |-
      Onze Minister geeft bij ministeriële regeling aan:

      a. welke van de in [artikel 60][ref1] onderscheiden categorieën van persoonsgegevens noodzakelijk zijn voor de
      uitoefening van de in die regeling aangewezen taken en bevoegdheden van de zorgautoriteit;

      b. welke van de in [artikel 60][ref2] onderscheiden categorieën van persoonsgegevens de zorgautoriteit mag
      verstrekken aan de in [artikel 70][ref3] genoemde instanties ten behoeve van de uitoefening van hun taken en
      bevoegdheden.


