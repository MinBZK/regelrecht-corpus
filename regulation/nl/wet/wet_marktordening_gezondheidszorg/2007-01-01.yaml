  - number: '21'
    text: |-
      1 De zorgautoriteit rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid, doeltreffendheid en
      doelmatigheid van voorgenomen beleid in verband met de uitoefening van haar taken, genoemd in [artikel 16][ref1].

      2 De zorgautoriteit signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen inzake markten op
      het gebied van de zorg.

      3 De rapportages en signaleringen bevatten geen medische persoonsgegevens als bedoeld in [artikel 60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel60
