  - number: '57'
    text: |-
      1 De zorgautoriteit stelt beleidsregels vast met betrekking tot:

      a. het uitoefenen van de bevoegdheid om verplichtingen op te leggen op grond van de [artikelen 48][ref1] en
      [49][ref2];

      b. het uitoefenen van de bevoegdheid om tarieven vast te stellen op grond van de [artikelen 50][ref3] en
      [52][ref4];

      c. het uitoefenen van de bevoegdheid tot het vaststellen van prestatiebeschrijvingen op grond van
      [artikel 56][ref5].

      2 De beleidsregels, bedoeld in het eerste lid, onder b en c, kunnen inhouden op welke wijze, waaronder schriftelijk
      of elektronisch, onder welke voorwaarden of met inachtneming van welke voorschriften of beperkingen een aanvraag
      als bedoeld in die artikelen moet worden ingediend. De beperkingen kunnen mede inhouden dat de aanvraag alleen
      gedaan kan worden door een zorgaanbieder met een ziektekostenverzekeraar gezamenlijk of dat een aanvraag moet
      worden gedaan binnen een bepaalde termijn.

      3 De beleidsregels kunnen inhouden welke prestatiebeschrijving moet worden gehanteerd bij het in rekening brengen
      van een tarief.

      4 De beleidsregels kunnen inhouden dat met betrekking tot het in rekening te brengen tarief sprake is van:

      a. een vast tarief;

      b. een bedrag dat ten minste of ten hoogste als tarief in rekening wordt gebracht;

      c. een tarief waarop de [artikelen 35, eerste lid, onder c en d][ref6], en [50 tot en met 55][ref7] niet van
      toepassing zijn.

      5 De beleidsregels kunnen inhouden dat de zorgautoriteit ambtshalve een tarief danwel een bedrag dat ten minste of
      ten hoogste als tarief in rekening wordt gebracht of een prestatiebeschrijving vaststelt.

      6 De beleidsregels kunnen inhouden onder welke voorwaarden of met inachtneming van welke voorschriften en
      beperkingen voor in die regel te onderscheiden delen van een prestatie of geheel van prestaties daarbij nader
      aangegeven beleidsregels van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel50
