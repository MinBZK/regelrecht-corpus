  - number: '31'
    text: |-
      De zorgautoriteit kan regels stellen met betrekking tot:

      a. de controle door de AWBZ-verzekeraars;

      b. de inhoud en inrichting van de verklaring en van het accountantsverslag, bedoeld in
      [artikel 36 van de Algemene Wet Bijzondere Ziektekosten][ref1], en van het daaraan ten grondslag liggende
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel36
