      1 Na de goedkeuring, bedoeld in [artikel 14, eerste lid][ref1], stelt de zorgautoriteit het jaarplan en de
      jaarverantwoording algemeen verkrijgbaar.

      2 Onze Minister brengt zijn oordeel over het functioneren van de zorgautoriteit ter kennis van beide kamers der
      Staten-Generaal.


