  - number: '36'
    text: |-
      1 Zorgaanbieders en ziektekostenverzekeraars voeren een administratie waaruit in ieder geval de overeengekomen en
      geleverde prestaties blijken, alsmede wanneer die prestaties zijn geleverd, aan welke patiënt onderscheidenlijk aan
      welke verzekerde die prestaties door een zorgaanbieder zijn geleverd, de daarvoor in rekening gebrachte tarieven en
      de in verband daarmee ontvangen of verrichte betalingen of vergoedingen aan derden.

      2 Zorgaanbieders en ziektekostenverzekeraars voeren op zodanige wijze een administratie dat te allen tijde mogelijk
      is elk tarief dat overeenkomstig [artikel 50][ref1] of [52][ref2] is vastgesteld of dat ligt binnen de tariefruimte
      die op grond van [artikel 54][ref3] is vastgesteld, in rekening te brengen, te betalen of aan derden te vergoeden.

      3 De zorgautoriteit kan, ten behoeve van de vergelijkbaarheid van gegevens, toepassing van uniforme principes bij
      de toerekening van kosten en opbrengsten en bij het registreren van gegevens over kwaliteit en opbrengsten, nadere
      regels stellen betreffende de administratie van:

      a. zorgaanbieders en ziektekostenverzekeraars met het oog op de bevordering van concurrentie, het voorkomen van
      fraude, de inzichtelijkheid en toegankelijkheid van die administratie alsmede het vaststellen van tarieven, en

      b. zorgverzekeraars en AWBZ-verzekeraars met het oog op de bevordering van een goede uitvoering van de
      [Zorgverzekeringswet][ref4] onderscheidenlijk de [Algemene Wet Bijzondere Ziektekosten][ref5].

      4 De in het derde lid bedoelde regels worden ten aanzien van zorgverzekeraars, AWBZ-verzekeraars of de
      rechtspersonen, bedoeld in [artikel 40 van de Algemene Wet Bijzondere Ziektekosten][ref6], gesteld in
      overeenstemming met het College zorgverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0020078#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0018450
      [ref5]: https://wetten.overheid.nl/BWBR0002614
      [ref6]: https://wetten.overheid.nl/BWBR0002614#Artikel40
