  - number: '16'
    text: |-
      De zorgautoriteit is belast met:

      a. markttoezicht, marktontwikkeling en tarief- en prestatieregulering, op het terrein van de gezondheidszorg;

      b. toezicht op de rechtmatige uitvoering door de zorgverzekeraars van hetgeen bij of krachtens de
      [Zorgverzekeringswet][ref1] is geregeld;

      c. toezicht op de rechtmatige afrekening van de bijdragen, bedoeld in de
      [artikelen 32 tot en met 34 van de Zorgverzekeringswet][ref2], nadat een verzekeraar opgehouden is
      zorgverzekeringen uit te voeren;

      d. toezicht op de rechtmatige en doelmatige uitvoering door de AWBZ-verzekeraars en de rechtspersonen,
      bedoeld in [artikel 40 van de Algemene Wet Bijzondere Ziektekosten][ref3], van hetgeen bij of
      krachtens [die wet][ref4] en de [artikelen 91, tweede lid, tweede volzin][ref5], [123][ref6] en
      [124 van de Wet financiering sociale verzekeringen][ref7] is geregeld;

      e. toezicht op de uitvoering van de [artikelen 41][ref8], [42][ref9] en [43][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
