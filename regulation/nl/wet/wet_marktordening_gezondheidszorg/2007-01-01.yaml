  - number: '53'
    text: |-
      1 De zorgautoriteit beslist afwijzend op een aanvraag als bedoeld in [artikel 50, eerste lid][ref1], indien de
      daarbij voorgestelde prestatiebeschrijving, bedoeld in [artikel 51, eerste lid, onder a][ref2], in strijd is met
      het recht of met het belang van de volksgezondheid.

      2 Indien de zorgautoriteit op een ingevolge [artikel 50][ref3] gedane aanvraag op grond van het eerste lid
      van dit artikel afwijzend beslist, stelt zij op aanvraag van partijen of van een van hen dan wel ambtshalve
      een prestatiebeschrijving en een tarief vast. [Artikel 50, tweede lid][ref4], is met betrekking tot die
      prestatiebeschrijving en dat tarief van overeenkomstige toepassing.

      3 Op aanvraag van een zorgaanbieder of van een ziektekostenverzekeraar stelt de zorgautoriteit voorts een
      prestatiebeschrijving en een tarief vast, indien een overeenkomst als bedoeld in [artikel 50][ref5] niet tot stand
      komt. Daarbij wordt bepaald in welke gevallen de vastgestelde prestatiebeschrijving en het vastgestelde tarief
      geldt.

      4 Op aanvraag van een zorgaanbieder dan wel ambtshalve stelt de zorgautoriteit een prestatiebeschrijving en een
      tarief vast voor alle gevallen waarin het in rekening wordt gebracht aan iemand die voor de prestatie waarop het
      tarief van toepassing is, niet is verzekerd bij een ziektekostenverzekeraar. Daarbij kunnen met betrekking tot de
      kring van hen aan wie het tarief rechtsgeldig in rekening kan worden gebracht, beperkingen worden gesteld.

      5 Indien een aanvraag als bedoeld in [artikel 50][ref6] of in het tweede tot en met vierde lid van het onderhavige
      artikel, niet voldoet aan het bij of krachtens deze paragraaf bepaalde kan de zorgautoriteit ambtshalve een
      prestatiebeschrijving en een tarief vaststellen.

      6 In gevallen waarin een beleidsregel als bedoeld in [artikel 57][ref7] dat vordert, stelt de zorgautoriteit
      ambtshalve een tarief vast.

      7 Een beschikking op grond van dit artikel bevat in ieder geval de onderwerpen, genoemd in [artikel 51][ref8], voor
      zover van toepassing.

      8 De zorgautoriteit kan aan een beschikking voorschriften of beperkingen verbinden.


