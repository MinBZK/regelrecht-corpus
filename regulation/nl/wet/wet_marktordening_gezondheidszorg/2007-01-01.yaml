  - number: '50'
    text: |-
      1 Indien een zorgaanbieder met een ziektekostenverzekeraar een tarief is overeengekomen, vragen zij de
      zorgautoriteit dat tarief vast te stellen.

      2 Een op een in het eerste lid bedoelde aanvraag gedane vaststelling geldt voor alle gevallen waarin de
      zorgaanbieder het tarief in rekening brengt aan de ziektekostenverzekeraar of aan degene die bij deze voor de
      prestatie waarop het tarief van toepassing is, is verzekerd.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel50
  - number: '51'
    text: |-
      1 Een aanvraag als bedoeld [artikel 50, eerste lid][ref1], bevat een voorstel voor:

      a. de toe te passen prestatiebeschrijving;

      b. het voor de prestatie in rekening te brengen tarief.

      2 Indien de zorgautoriteit geen regels heeft vastgesteld als bedoeld in [artikel 37][ref2] bevat de aanvraag voorts
      een voorstel voor:

      a. degene aan wie het tarief in rekening wordt gebracht;

      b. degene door wie het tarief in rekening wordt gebracht;

      c. de wijze waarop het tarief in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel37
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel51
