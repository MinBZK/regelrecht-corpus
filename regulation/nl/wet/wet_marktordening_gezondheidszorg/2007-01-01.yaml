        artikel: '74'
  - number: '96'
    text: |-
      1 De zorgautoriteit legt geen bestuurlijke boete op indien de overtreder is overleden.

      2 Een bestuurlijke boete vervalt indien zij op het tijdstip van het overlijden van de overtreder niet
      onherroepelijk is.

      3 Een onherroepelijke bestuurlijke boete vervalt voor zover zij op het in het tweede lid bedoelde tijdstip nog niet
      is betaald.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel96
  - number: '97'
    text: |-
      1 Een bestuurlijke boete wordt afgestemd op de ernst, de duur en de frequentie van overtredingen en de mate waarin
      deze aan de overtreder kunnen worden verweten, waarbij zo nodig rekening wordt gehouden met de omstandigheden
      waaronder de overtredingen zijn gepleegd.

      2 [Artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '98'
    text: |-
      Mandaat tot het opleggen van een bestuurlijke boete wordt niet verleend aan degene die van de overtreding een
      rapport of proces-verbaal heeft opgemaakt.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel98
  - number: '99'
    text: |-
      1 De zorgautoriteit beslist omtrent het opleggen van de bestuurlijke boete binnen dertien weken na de dagtekening
      van het rapport.

      2 De beslistermijn wordt opgeschort met ingang van de dag waarop de gedraging aan het openbaar ministerie is
      voorgelegd, tot de dag waarop de zorgautoriteit weer bevoegd wordt een bestuurlijke boete op te leggen.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel99
  - number: '100'
    text: |-
      De beschikking tot oplegging van een bestuurlijke boete vermeldt in ieder geval:

      a. de naam van de overtreder;

      b. de overtreding alsmede het overtreden voorschrift;

      c. zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd;

      d. het bedrag van de boete;

      e. de termijn waarbinnen de boete betaald moet worden.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel100
  - number: '101'
    text: |-
      1 De bevoegdheid tot het opleggen van een bestuurlijke boete vervalt vijf jaren nadat de overtreding heeft
      plaatsgevonden.

      2 Indien tegen de bestuurlijke boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn
      opgeschort tot onherroepelijk op het bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel101
  - number: '102'
    text: |-
      Een bestuurlijke boete die is opgelegd wegens een gedraging die tevens een strafbaar feit is, vervalt indien
      het gerechtshof met toepassing van [artikel 12i van het Wetboek van Strafvordering][ref1] de vervolging van
      de overtreder voor dat feit beveelt. [Artikel 74b, eerste lid, van het Wetboek van Strafrecht][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel12i
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74b
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 12i
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 74b
  - number: '103'
    text: |-
      1 Een boete wordt betaald binnen zes weken na inwerkingtreding van de beschikking waarbij de boete is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking van de
      beschikking zes weken zijn verstreken.

      3 Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene aan wie de boete is opgelegd
      schriftelijk bevolen binnen twee weken het bedrag van de boete, verhoogd met de kosten van de aanmaning, alsnog
      te betalen.

      4 Bij gebreke van betaling binnen de in het derde lid genoemde termijn, kan de zorgautoriteit de verschuldigde
      boete, verhoogd met de kosten van de aanmaning en van de invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van degene die de boete verschuldigd is, bij deurwaardersexploot betekend en levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      zorgautoriteit.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of voor een te hoog bedrag is
      vastgesteld.

      9 De bevoegdheid tot invordering vervalt twee jaar nadat de beschikking inzake oplegging van de boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '104'
    text: |-
      1 De zorgautoriteit draagt de op grond van de [artikelen 82][ref1] en [85][ref2] ingevorderde dwangsommen en
      bestuurlijke boetes af aan ’s Rijks kas.

      2 De zorgautoriteit draagt de op grond van de [artikelen 83][ref3] en [86 tot en met 89][ref4] ingevorderde
      dwangsommen en bestuurlijke boetes af aan het Zorgverzekeringsfonds.

      3 De zorgautoriteit draagt de op grond van [artikel 84][ref5] ingevorderde dwangsommen af aan het Algemeen Fonds
      Bijzondere Ziektekosten.


