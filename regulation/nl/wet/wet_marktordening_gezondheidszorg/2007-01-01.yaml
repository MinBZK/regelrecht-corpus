      1 De zorgautoriteit kan een AWBZ-verzekeraar onderscheidenlijk een rechtspersoon als bedoeld in
      [artikel 40 van de Algemene Wet Bijzondere Ziektekosten][ref1] een last onder dwangsom opleggen
      ter zake van overtreding van de voorschriften, gesteld bij of krachtens [die wet][ref2] of de
      [Wet financiering sociale verzekeringen][ref3].

      2 De [artikelen 5:32, tweede tot en met vijfde lid][ref4], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref5] zijn van toepassing.


