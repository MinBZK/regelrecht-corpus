  - number: '62'
    text: |-
      1 De zorgautoriteit kan, met inachtneming van het bepaalde krachtens [artikel 65][ref1], regels stellen, inhoudende
      welke gegevens en inlichtingen regelmatig moeten worden verstrekt door de zorgaanbieders, ziektekostenverzekeraars
      en degenen, bedoeld in [artikel 44][ref2].

      2 Het eerste lid is mede van toepassing ten aanzien van degene die gegevens verzamelt, bewaart en bewerkt
      ten behoeve van zorgaanbieders of ziektekostenverzekeraars, alsmede ten aanzien van de groep in de zin van
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3], indien zorgaanbieders of ziektekostenverzekeraars
      daartoe behoren.


