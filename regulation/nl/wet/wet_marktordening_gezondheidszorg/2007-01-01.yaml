  - number: '78'
    text: |-
      De zorgautoriteit kan uit hoofde van haar taak, bedoeld in [artikel 16, onder d][ref1],
      een aanwijzing geven aan een AWBZ-verzekeraar of een rechtspersoon als bedoeld in
