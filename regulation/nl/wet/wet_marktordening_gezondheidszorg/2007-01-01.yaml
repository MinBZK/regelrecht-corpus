  - number: '127'
    text: |-
      1 Onze Minister zendt voor 1 januari 2009 een verslag aan de Staten-Generaal over de doeltreffendheid en de
      effecten van deze wet in de praktijk. Hierin wordt in ieder geval aandacht besteed aan:

      a. de manier waarop de beslissingen van de zorgautoriteit hebben bijgedragen aan het bereiken van de doelstelling
      van de wet;

      b. het vaststellen van de aanmerkelijke marktmacht;

      c. de mate waarin de wet heeft bijgedragen aan het terugdringen van de bureaucratie;

      d. de effectiviteit en wenselijkheid van tariefsregulering;

      e. de taken die betrekking hebben op het mededingingsrecht.

      2 Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier
      jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de
      zorgautoriteit. De zorgautoriteit is gehouden aan deze evaluatie medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel127
  - number: '128'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020078/2007-01-01#Artikel128
