  - number: '52'
    text: |-
      1 Indien de zorgautoriteit op een ingevolge [artikel 50][ref1] gedane aanvraag afwijzend beslist, stelt zij op
      aanvraag van partijen of van een van hen dan wel ambtshalve een tarief vast. [Artikel 50, tweede lid][ref2], is met
      betrekking tot dat tarief van overeenkomstige toepassing.

      2 Op aanvraag van een zorgaanbieder of van een ziektekostenverzekeraar stelt de zorgautoriteit voorts een tarief
      vast, indien een overeenkomst als bedoeld in [artikel 50][ref3] niet tot stand komt. Daarbij wordt bepaald in welke
      gevallen het vastgestelde tarief geldt.

      3 Op aanvraag van een zorgaanbieder dan wel ambtshalve stelt de zorgautoriteit een tarief vast voor alle gevallen
      waarin het in rekening wordt gebracht aan iemand die voor de prestatie waarop het tarief van toepassing is, niet
      is verzekerd bij een ziektekostenverzekeraar. Daarbij kunnen met betrekking tot de kring van hen aan wie het tarief
      rechtsgeldig in rekening kan worden gebracht, beperkingen worden gesteld.

      4 Indien een aanvraag als bedoeld in [artikel 50][ref4] of het eerste tot en met derde lid van het onderhavige
      artikel, niet voldoet aan het bij of krachtens deze paragraaf bepaalde kan de zorgautoriteit ambtshalve een tarief
      vaststellen.

      5 In gevallen waarin een beleidsregel als bedoeld in [artikel 57][ref5] dat vordert, stelt de zorgautoriteit
      ambtshalve een tarief vast.

      6 Een beschikking op grond van dit artikel bevat in ieder geval de onderwerpen, genoemd in [artikel 51][ref6], voor
      zover van toepassing.

      7 De zorgautoriteit kan aan een beschikking voorschriften of beperkingen verbinden.


