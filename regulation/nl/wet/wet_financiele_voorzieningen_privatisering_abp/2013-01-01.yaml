preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voorwaarden te scheppen voor de privatisering van het
    Algemeen burgerlijk pensioenfonds en dat daartoe maatregelen dienen te worden getroffen die leiden tot een gezonde
    financiële basis voor die privatisering, onder gelijktijdige invoering van een aantal inhoudingen in verband met de
    sociale zekerheid van het overheidspersoneel, en dat voorts de sociale partners in de overheidssector reparatie van
    de invaliditeitspensioenen gewenst achten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#ArtikelAanhef
