  - number: 28.2.a.3°
    text: |-
      en de inhouding, bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel31
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '31'
        paragraaf: '5'
  - number: '28.3'
    text: |-
      In afwijking van het eerste en tweede lid wordt voor de toepassing van het bij of krachtens deze paragraaf bepaalde
      ten aanzien van de werknemer die een deeltijdbetrekking vervult dan wel uit een deeltijdbetrekking een WAO-
      uitkering of uitkering, als bedoeld in het vierde lid, onderdeel *a*, onder 3°, ontvangt, onder loon verstaan: het
      in het eerste lid bedoelde loon, gedeeld door de deeltijdfactor, onderscheidenlijk de deeltijdfactor die gold voor
      de oorspronkelijke betrekking.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: '28.4'
    text: 'Onder werknemer wordt in deze paragraaf mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: 28.4.a
    text: |-
      de in het eerste lid bedoelde werknemer wiens dienstverhouding of functievervulling als zodanig is geëindigd en die
      daaraan recht ontleent op:
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: 28.4.a.1°
    text: |-
      een pensioen ingevolge de bij of krachtens de [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen ter
      zake van wettelijke en bovenwettelijke arbeidsongeschiktheid, alsmede arbeidsongeschiktheid met dienstverband, met
      uitzondering van dat gedeelte van het pensioen waarvan de hoogte wordt bepaald door invaliditeit met dienstverband;


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: 28.4.a.2°
    text: |-
      een uitkering op grond van een ontslag[uitkeringsregeling][ref1] anders dan in verband met vrijwillig vervroegd
      uittreden, functioneel leeftijdsontslag, of de toepassing van de [Uitkeringswet gewezen militairen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002537
      [ref2]: https://wetten.overheid.nl/BWBR0002540
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002537
      - id: ref2
        bwb_id: BWBR0002540
  - number: 28.4.b
    text: |-
      de gewezen overheidswerknemer die na beëindiging van zijn dienstverband, in verband met ziekte recht heeft op
      doorbetaling van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: '28.5'
    text: |-
      Degene die politiek ambtsdrager is als bedoeld in de [Algemene pensioenwet politieke ambtsdragers][ref1], alsmede
      degene die een functie vervult ter zake waarvan die wet bij of krachtens wet van overeenkomstige toepassing is
      verklaard, is als zodanig, respectievelijk in die functie, geen werknemer in de zin van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '28.6'
    text: |-
      Voor degene, bedoeld in het eerste lid en in het vierde lid, onderdeel *a*, onder 3°, eindigt het werknemerschap
      met ingang van de eerste dag van de maand volgende op die waarin hij de leeftijd van 65 heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: '28.7'
    text: |-
      Voor degene, bedoeld in het vierde lid, onderdeel *a*, onder 1° en 2°, eindigt het werknemerschap met ingang van de
      eerste dag van de maand waarin hij de leeftijd van 65 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel28
  - number: '29'
    text: |-
      De heffingsgrondslag waarnaar de inhouding ingevolge de bepalingen van deze paragraaf plaatsvinden, is het loon dat
      de werknemer in een uitbetalingstermijn van dezelfde werkgever heeft of geacht wordt te hebben ontvangen, met dien
      verstande dat de heffingsgrondslag, herleid naar een jaarbedrag, niet meer kan bedragen dan het bedrag dat wordt
      verkregen door het bedrag, bedoeld in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1],
      met betrekking tot een loontijdvak van een dag, te vermenigvuldigen met 261.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '31.1'
    text: |-
      De werkgever houdt op het loon van de werknemer een inhouding inzake werkloosheid in, ter grootte
      van een percentage van de heffingsgrondslag dat overeenkomt met het premiedeel dat op grond van
      [artikel 86, eerste lid, van de Werkloosheidswet][ref1] wordt vastgesteld door Onze Minister van Sociale Zaken en
      Werkgelegenheid, voor zover dat premiedeel ten laste wordt gebracht van de werknemer in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel86
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '86'
  - number: '31.2'
    text: |-
      In afwijking van het eerste lid bedraagt de inhouding inzake werkloosheid over het loon uit een deeltijdbetrekking:
      het met de deeltijdfactor vermenigvuldigde percentage, bedoeld in het eerste lid, van de heffingsgrondslag.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel31
  - number: '31.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de in het eerste lid bedoelde inhouding.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel31
  - number: '33.1'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.a
    text: 'bezoldigingsregelingen: de regelingen betreffende de beloning van de werknemer, bedoeld in onderdeel *c*;'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.b
    text: |-
      salarissen: de bedragen, vermeld in de bijlagen van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], dan wel hetgeen daarmee overeenkomt in de andere
      bezoldigingsregelingen, met uitzondering van de bezoldiging volgens de tabel, behorende bij het Besluit herziening
      bezoldiging militairen zeemacht 1954, en van de wedde eerste oefening in de zin van de Regeling inkomsten
      militairen landen luchtmacht 1969;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 33.1.c
    text: 'werknemer:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.c.1°
    text: degene die in burgerlijke overheidsdienst is;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.c.2°
    text: degene die in dienst is van een instelling als bedoeld in [artikel B 2 van de Abp-wet](onbekend);
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.c.3°
    text: de ambtenaar die in dienst is van een instelling als bedoeld in [artikel B 3 van de Abp-wet](onbekend);
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.c.4°
    text: |-
      de militair die wordt bezoldigd volgens de schaal behorende bij het Besluit herziening bezoldiging militairen
      zeemacht 1954, of die weddegenietend is in de zin van de Regeling inkomsten militairen land- en luchtmacht 1969;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
  - number: 33.1.c.5°
    text: |-
      degene die voorzitter of lid is van het dagelijks bestuur van een waterschap of van een ander publiekrechtelijk
      lichaam, en als zodanig geen werknemer is in de zin van de [Ziektewet][ref1], de [WAO][ref2] en de
      [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0004045
  - number: '33.2'
    text: |-
      Degene die politiek ambtsdrager is als bedoeld in de [Algemene pensioenwet politieke ambtsdragers][ref1], alsmede
      degene die een functie vervult ter zake waarvan die wet bij of krachtens wet van overeenkomstige toepassing is
      verklaard, is als zodanig, respectievelijk in die functie, geen werknemer in de zin van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0002691
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002691
  - number: '34.1'
    text: |-
      De salarissen worden met ingang van 1 januari 1995 aangepast met het percentage zoals dat in kolom 2 van de bij
      deze wet behorende tabel I is opgenomen achter de daarbij in kolom 1 genoemde salarisgrenzen, met inachtneming van
      de bij een algemene salariswijziging voor de desbetreffende bezoldigingsregeling gebruikelijke aanpassingsmethode.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel34
  - number: '34.2'
    text: |-
      Indien met ingang van 1 januari 1995 tevens een algemene salariswijziging plaatsvindt, wordt de daaruit
      voortvloeiende wijziging van de salarissen eerst aangebracht nadat uitvoering is gegeven aan de salarisaanpassing,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel34
  - number: '35.1'
    text: |-
      De aanpassing van de salarissen ingevolge [artikel 34][ref1], is geen algemene bezoldigingswijziging als bedoeld in
      de [artikelen A 8 van de Abp-wet](onbekend) en L 1 van de Amp-wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel34
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '34'
        paragraaf: '6'
  - number: '35.2'
    text: |-
      In afwijking van [artikel 2, derde lid, van de Vut-wet](onbekend) wordt de volgens het eerste en tweede lid van
      dat artikel vastgestelde bezoldiging met ingang van 1 januari 1995 gewijzigd overeenkomstig de salarisaanpassing,
      bedoeld in [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel34
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '34'
        paragraaf: '6'
  - number: '35.3'
    text: |-
      De berekeningsgrondslagen van uitkeringen op grond van een ontslag[uitkeringsregeling][ref1] die zijn afgeleid
      van de laatstelijk genoten bezoldiging, worden gewijzigd overeenkomstig de salarisaanpassing, bedoeld in
      [artikel 34][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002537
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Artikel34
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002537
      - id: ref2
        bwb_id: BWBR0007211
        artikel: '34'
        paragraaf: '6'
  - number: '36'
    text: |-
      De wijziging van het ambtelijk inkomen, bedoeld in [artikel C 1 van de Abp-wet](onbekend), en van de
      pensioengrondslag, bedoeld in artikel C 1 van de Amp-wet, die het gevolg is van de salarisaanpassing, bedoeld in
      [artikel 34][ref1], wordt buiten beschouwing gelaten voor de toepassing van de bepalingen van die pensioenwetten
      betreffende de pensioenberekening, voor zover dat ambtelijk inkomen, onderscheidenlijk die pensioengrondslag
      betrekking heeft op de pensioenberekening ter zake van diensttijd voor 1 januari 1995.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel34
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '34'
        paragraaf: '6'
  - number: '37'
    text: |-
      De in verband met het in deze paragraaf bepaalde nadere vaststelling van bedragen en nader te stellen regels werken
      terug tot en met 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel37
  - number: '64'
    text: 'De volgende wetten worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel64
  - number: 64.a
    text: de [Inhoudingswet overheidspersoneel 1982](onbekend);
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel64
  - number: 64.b
    text: |-
      de wet van 20 februari 1986, houdende voorlopige verlaging van de verschuldigde pensioenbijdrage als bedoeld in de
      Algemene burgerlijke pensioenwet in verband met verlaging van de invaliditeitspensioenen per 1 januari 1985 (*Stb.*
      88).
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel64
  - number: '65'
    text: |-
      De ministeriële regeling, bedoeld in [artikel 31, derde lid][ref1], wordt tot stand gebracht in overeenstemming met
      de Raad voor het Overheidspersoneelsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel31
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '31'
        paragraaf: '5'
  - number: '66'
    text: |-
      De militair, bedoeld in [artikel 28, eerste lid, onderdeel b, onder 2°][ref1], is met ingang van 1 januari
      1995 maandelijks een premie, bijdrage of vergoeding verschuldigd, waarvan de grootte dezelfde is als het
      vut-bijdrageverhaal dat zou zijn ingehouden op het loon, indien het een overheidswerknemer in de zin van
      [artikel 2 van de Wet privatisering ABP][ref2] betrof die werkzaam is binnen de sector Defensie. De doelstelling
      en de wijze van inhouding of verrekening van die premie, bijdrage of vergoeding worden vastgesteld bij algemene
      maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '28'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007791
        artikel: '2'
  - number: '67.1'
    text: |-
      Ten aanzien van betalingen na 1 januari 1995 van ambtelijk inkomen onderscheidenlijk loon dat betrekking
      heeft op tijd voor die datum, in verband met nabetaling of herberekening van ambtelijk inkomen of loon, zijn
      de [paragrafen 2][ref1], [3][ref2], [4][ref3] en [5][ref4], alsmede de desbetreffende nadere regels, van
      toepassing, tenzij het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Paragraaf3
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Paragraaf4
      [ref4]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007211
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007211
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007211
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007211
        paragraaf: '5'
  - number: 67.1.a
    text: betalingen van ambtelijk inkomen of loon dat reeds voor 1 januari 1995 vorderbaar en inbaar was;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel67
  - number: 67.1.b
    text: |-
      de in [artikel 74][ref1] bedoelde uitbetaling van vakantie-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel74
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '74'
        paragraaf: '12'
  - number: '67.2'
    text: |-
      De in het eerste lid bedoelde betalingen worden, voor zover het loon betreft als bedoeld in
      [hoofdstuk 3, afdeling 1, paragraaf 1, van de Wet financiering sociale verzekeringen][ref1], verhoogd met 1,86
      procent.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017745
        paragraaf: '1'
  - number: '68'
    text: |-
      Voor de toepassing van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt een beslissing van
      het bestuur van het ABP ingevolge het bepaalde in [paragraaf 2][ref2] en [artikel 80 van deze wet][ref3], van het
      bestuur van het Vut-fonds ingevolge het bepaalde in [paragraaf 3 van deze wet][ref4], of van het bestuur van het
      FAOP ingevolge het bepaalde in [paragraaf 4 van deze wet][ref5], gelijkgesteld met een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Paragraaf2
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0007211#Paragraaf3
      [ref5]: https://wetten.overheid.nl/BWBR0007211#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007211
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007211
        artikel: '80'
        paragraaf: '12'
      - id: ref4
        bwb_id: BWBR0007211
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0007211
        paragraaf: '4'
  - number: '69'
    text: |-
      [Artikel A 8 van de Abp-wet](onbekend) en artikel L 1 van de Amp-wet, zoals deze artikelen luidden op 31 december
      1994, blijven van toepassing ten aanzien van wijzigingen in de bezoldiging van het rijkspersoneel voor die datum.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel69
  - number: '70.1'
    text: |-
      In afwijking van [artikel B 7 van de Abp-wet](onbekend), zoals dat ingevolge deze wet is komen te
      luiden, blijft genoemd artikel, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel 53, onderdeel C, van deze wet][ref1], van kracht ten aanzien van diensttijd voor die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '70.2'
    text: |-
      In de ministeriële regeling, bedoeld in [artikel B 7 van de Abp-wet](onbekend), kan tot uiterlijk 1 augustus 1994
      tevens worden bepaald dat personen of groepen van personen geen ambtenaar zijn uit hoofde van de korte duur van
      hun dienstverhouding.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel70
  - number: '72.1'
    text: |-
      De pensioenbijdrage, bedoeld in [artikel C 3, tweede lid, van de Abp-wet](onbekend), over het jaar 1993 wordt,
      behoudens vermindering uit anderen hoofde, verminderd met 8,85 procent van de som der bijdragegrondslagen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel72
  - number: '72.2'
    text: |-
      In afwijking van [artikel C 6, tweede lid, van de Abp-wet](onbekend), beloopt de wachtgeldtijdbijdrage over
      het jaar 1993, de helft of een vierde van het ingevolge het eerste lid voor 1993 geldende percentage van de
      pensioenbijdrage, al naar gelang de met recht op wachtgeld doorgebrachte tijd voor de helft dan wel voor een vierde
      gedeelte als diensttijd meetelt.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel72
  - number: '73.1'
    text: |-
      De pensioenbijdrage, bedoeld in [artikel C 3, tweede lid, van de Abp-wet](onbekend), over het jaar 1994 wordt,
      behoudens vermindering uit anderen hoofde, verminderd met 9,8 procent van de som der bijdragegrondslagen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel73
  - number: '73.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze van betaling van de pensioenbijdrage
      over het jaar 1994.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel73
  - number: '73.3'
    text: |-
      [Artikel 72, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel72
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '72'
        paragraaf: '12'
  - number: '74.1'
    text: |-
      De organen, bedoeld in [artikel A 1, onderdeel ](onbekend), zijn pensioenbijdrage verschuldigd over de vakantie-
      uitkering die betrekking heeft op enig tijdvak in het jaar 1994 en die de ambtenaar, in verband met de regeling
      inzake het tijdstip van uitbetaling van die uitkering, eerst na dat jaar heeft of geacht wordt te hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel74
  - number: '74.2'
    text: |-
      De pensioenbijdrage over de in het eerste lid bedoelde vakantieuitkering bedraagt 9,65 procent en wordt door de
      organen voldaan in de maand volgende op die waarin de ambtenaar deze uitkering ontvangt of geacht wordt te hebben
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel74
  - number: '74.3'
    text: |-
      Ten aanzien van de pensioenbijdrage, bedoeld in het tweede lid, is het
      [Verhaalsbesluit Algemene burgerlijke pensioenwet][ref1], zoals dat luidde op 31 december 1994, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006869
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006869
  - number: '75'
    text: |-
      In afwijking van [artikel D 1 van de Abp-wet](onbekend), zoals dat ingevolge deze wet is komen te luiden,
      blijft het derde lid van genoemd artikel, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel 53, onderdeel F, van deze wet][ref1], van kracht ten aanzien van diensttijd tussen 30 september 1986
      en de datum van die inwerkingtreding, onverminderd artikel III, onderdeel B, van de wet van 3 juli 1986, tot
      wijziging van de Algemene burgerlijke pensioenwet en de Spoorwegpensioenwet met betrekking tot aanspraken van
      deelgerechtigden die de leeftijd van 25 jaar nog niet hebben bereikt (*Stb.* 393).


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '76.1'
    text: |-
      De [artikelen D 1](onbekend) en [D 2 van de Abp-wet](onbekend), zoals deze artikelen luidden op de dag voorafgaand
      aan de inwerkingtreding van [artikel 53, onderdelen F en G, van deze wet][ref1], blijven van toepassing ten aanzien
      van de belanghebbende die op het vorenbedoelde tijdstip tijd als bedoeld in [artikel D 1, tweede lid, onderdeel ]
      (onbekend), niet zijnde tijd als bedoeld in [artikel D 2, derde lid, van die wet](onbekend), zoals deze artikelen
      luidden op het vorenbedoelde tijdstip, mede als diensttijd in de zin van de [Abp-wet](onbekend) in aanmerking zou
      kunnen doen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '76.2'
    text: Zodra de belanghebbende dit wenst kan hij om overname verzoeken van de in het eerste lid bedoelde tijd.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
  - number: '76.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de belanghebbende die op de dag voorafgaande aan de inwerkingtreding
      van [artikel 53, onderdelen F en G, van deze wet][ref1] ambtenaar is, het verzoek, bedoeld in het tweede lid,
      uitsluitend indienen tot uiterlijk twee jaar na het tijdstip van die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '76.4'
    text: |-
      Indien het in het tweede lid bedoelde verzoek wordt gedaan, wordt daarvan door het bestuur van het ABP mededeling
      gedaan aan de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
  - number: '76.5'
    text: |-
      Indien een pensioen wordt toegekend ingevolge de Abp-wet waarbij tijd, bedoeld in het eerste lid, mede als voor
      pensioen geldende tijd in aanmerking is genomen, wordt daarvan door het bestuur van het ABP mededeling gedaan aan
      de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
  - number: '76.6'
    text: |-
      Binnen drie maanden na ontvangst van de in het vijfde lid bedoelde mededeling draagt de Minister van Defensie de
      actuariële tegenwaarde van het uitzicht op pensioen dat ingevolge de Amp-wet is opgebouwd door degene op wie die
      mededeling betrekking heeft, over aan het ABP.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel76
  - number: '77.1'
    text: |-
      Artikel D 2 van de Amp-wet, zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel 56, onderdeel B][ref1], van deze wet, blijft van toepassing ten aanzien van de belanghebbende die:


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel56
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '56'
        paragraaf: '10'
  - number: 77.1.a
    text: |-
      op het vorenbedoelde tijdstip voor pensioen geldende tijd in de zin van de [Abp-wet](onbekend) mede als diensttijd
      in de zin van de Amp-wet in aanmerking zou kunnen doen brengen;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: 77.1.b
    text: |-
      op het vorenbedoelde tijdstip voor pensioen geldende tijd in de zin van het eerste lid, onderdeel *b*, onder 3°
      en 4°, van dat artikel, zonder dat deze mede als diensttijd in de zin van de [Abp-wet](onbekend) in aanmerking zou
      kunnen komen, mede als diensttijd in de zin van de Amp-wet in aanmerking zou kunnen doen brengen;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: 77.1.c
    text: |-
      tijd, zonder dat deze mede als diensttijd in de zin van de [Abp-wet](onbekend) in aanmerking zou
      kunnen komen, heeft doorgebracht in een betrekking in de Nederlandse Antillen of Aruba in de zin van de
      overheidspensioenregelingen van die landen, hetzij in vaste dienst, hetzij in ononderbroken tijdelijke dienst van
      ten minste twaalf maanden dan wel in tijdelijke dienst die onmiddellijk is gevolgd door vaste dienst.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: '77.2'
    text: |-
      Zodra de belanghebbende dit wenst kan hij om overname verzoeken van de in het eerste lid, onderdeel *a*, bedoelde
      tijd.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: '77.3'
    text: |-
      In het geval dat op verzoek van de belanghebbende toepassing wordt gegeven aan het in het eerste lid, onderdeel
      *a*, bedoelde artikel D 2 van de Amp-wet, wordt daarvan door de Minister van Defensie mededeling gedaan aan het
      bestuur van het ABP.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: '77.4'
    text: |-
      Indien een pensioen wordt toegekend ingevolge de Amp-wet waarbij in het eerste lid, onderdeel *a*, bedoelde
      tijd mede als voor pensioen geldende tijd in aanmerking is genomen, wordt daarvan door de Minister van Defensie
      mededeling gedaan aan het bestuur van het ABP.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: '77.5'
    text: |-
      Binnen drie maanden na ontvangst van de in het vierde lid bedoelde mededeling draagt het bestuur van het ABP de
      actuariële tegenwaarde van het uitzicht op pensioen dat ingevolge de [Abp-wet](onbekend) is opgebouwd door degene
      op wie die mededeling betrekking heeft, over aan de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel77
  - number: '78.1'
    text: |-
      In afwijking van [artikel F 6 van de Abp-wet](onbekend) is de middelsom van berekeningsgrondslagen voor de
      dienstlijn die uitsluitend door toepassing van [artikel F 1](onbekend), eindigt voor 1 januari 1995:
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: 78.1.a
    text: |-
      wanneer de dienstlijn die begint na 31 december 1994, eindigt in 1995, het gemiddelde van de berekeningsgrondslagen
      over 1993 en 1994, onderscheidenlijk de berekeningsgrondslag over 1994;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: 78.1.b
    text: |-
      wanneer de dienstlijn die begint na 31 december 1994, eindigt in 1996, het gemiddelde van de berekeningsgrondslagen
      over 1994 en 1995, nadat de berekeningsgrondslag over 1995 is vermenigvuldigd met de debruteringsfactor, bedoeld in
      [artikel F 6, zesde lid, van de Abp-wet](onbekend), zoals dat artikel ingevolge deze wet is komen te luiden.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: '78.2'
    text: |-
      Bij toepassing van het eerste lid is de middelsom van berekeningsgrondslagen voor de dienstlijn die begint na 31
      december 1994:
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: 78.2.a
    text: |-
      wanneer die dienstlijn eindigt in 1995, gelijk aan het bedrag van de middelsom, bedoeld in het eerste lid,
      onderdeel a, nadat deze is gedeeld door de debruteringsfactor, bedoeld in [artikel F 6, zesde lid, van de Abp-wet]
      (onbekend), zoals dat artikel ingevolge deze wet is komen te luiden;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: 78.2.b
    text: |-
      wanneer die dienstlijn eindigt in 1996, gelijk aan het gemiddelde van de berekeningsgrondslagen over 1994 en 1995,
      nadat de berekeningsgrondslag over 1994 is gedeeld door de in onderdeel a bedoelde debruteringsfactor.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel78
  - number: '79.1'
    text: |-
      De bepalingen inzake de invaliditeitspensioenen ingevolge de [Abp-wet](onbekend) en de pensioenen ingevolge
      de Amp-wet uit hoofde van ziekten en gebreken, zoals deze van toepassing waren op de dag voorafgaand aan de
      inwerkingtreding van [artikel 53, onderdeel U, van deze wet][ref1], blijven van toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: 79.1.a
    text: degene die op die dag reeds een dergelijk pensioen ontvangt;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.1.b
    text: 'degene die:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.1.b.1°
    text: |-
      op 25 januari 1993 wegens ziekte verhinderd is zijn dienst te verrichten dan wel na die datum binnen dertig dagen
      na afloop van een dergelijke verhindering opnieuw als zodanig verhinderd is, en
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.1.b.2°
    text: |-
      in verband daarmee nadien wegens blijvende ongeschiktheid voor de vervulling van zijn betrekking recht heeft op een
      dergelijk pensioen, en
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.1.b.3°
    text: |-
      geheel of gedeeltelijk algemeen invalide is in de zin van [artikel F 8a, tweede lid, van de Abp-wet](onbekend),
      onderscheidenlijk geheel of gedeeltelijk arbeidsongeschikt is in de zin van artikel E 6 van de Amp-wet.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.1.c
    text: |-
      degene aan wie na de inwerkingtreding van [artikel 53, onderdeel U][ref1], van deze wet een dergelijk pensioen
      wordt toegekend naar aanleiding van een reeds voor die inwerkingtreding ontstaan recht daarop;


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: 79.1.d
    text: |-
      degene die op de dag voorafgaande aan de inwerkingtreding van [artikel 53, onderdeel U][ref1], van deze wet recht
      heeft op een herplaatsingswachtgeld als bedoeld in [artikel K 4, tweede lid, van de Abp-wet](onbekend) dan wel een
      herplaatsingstoelage als bedoeld in [artikel K 4, vierde lid, van die wet](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '79.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde belanghebbenden is [artikel F 8f van de Abp-wet](onbekend)
      onderscheidenlijk artikel E 6, zesde lid, van de Amp-wet van overeenkomstige toepassing, met dien verstande dat
      daarbij onder het invaliditeitspensioen dan wel arbeidsongeschiktheidspensioen tevens wordt begrepen de toeslag,
      bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.2.a
    text: '[artikel F 9a van de Abp-wet](onbekend);'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.2.b
    text: artikel F 7a van de Amp-wet;
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: 79.2.c
    text: artikel 10 van de in artikel 60 genoemde wet,
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel79
  - number: '80.1'
    text: 'Degene die:'
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: 80.1.a
    text: |-
      op of na 1 augustus 1993 in dienst is van een lichaam, als bedoeld in de [artikelen B 1](onbekend), [B 2](onbekend)
      of [B 3 van de Abp-wet](onbekend),
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: 80.1.b
    text: |-
      geen ambtenaar is vanwege de omstandigheid dat hij voor niet langer dan zes maanden in dienst is genomen, dan wel
      vanwege de geringe omvang van zijn werkzaamheden, bedoeld in [artikel B 7 van de Abp-wet](onbekend), zoals dat
      artikel luidde op de dag voorafgaand aan de inwerkingtreding van [artikel 53, onderdeel C][ref1], van deze wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: 80.1.c
    text: |-
      tijdens het vorenbedoeld dienstverband voor ten minste 15 procent arbeidsongeschikt is geworden en in verband
      daarmee een uitkering ingevolge de [WAO][ref1] ontvangt,


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '80.2'
    text: |-
      De in het eerste lid bedoelde aanvulling wordt door het bestuur van het ABP aan de belanghebbende op diens verzoek
      toegekend.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: '80.3'
    text: |-
      De belanghebbende aan wie een aanvulling, bedoeld in het eerste lid, is toegekend, is verplicht het bestuur van
      het ABP terstond mededeling te doen van wijziging of beëindiging van de WAO-uitkering die hij ontvangt, alsmede
      van wijziging of beëindiging van aanvullende uitkeringen die hij ontvangt ingevolge de op hem van toepassing zijnde
      arbeidsvoorwaarden of de door hem gesloten arbeidsovereenkomst. De voorgaande volzin is niet van toepassing op de
      wijziging van het bedrag van de WAO-uitkering ingevolge de toepassing van [artikel 15 van de WAO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '15'
  - number: '80.4'
    text: |-
      Het bestuur van het ABP wijzigt de toegekende aanvulling, bedoeld in het eerste lid, of trekt deze in, indien de
      mededeling, bedoeld in het derde lid, daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: '80.5'
    text: |-
      Het bestuur van het ABP is bevoegd de aanvulling, bedoeld in het eerste lid, geheel of gedeeltelijk in te trekken,
      indien de belanghebbende niet of niet tijdig voldoet aan de ingevolge het derde lid op hem rustende verplichting.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: '80.6'
    text: De aanvullingen die op grond van dit artikel zijn toegekend, komen ten laste van het ABP.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel80
  - number: '81.1'
    text: |-
      Degene die op het tijdstip van inwerkingtreding van [artikel 53, onderdeel U][ref1], van deze wet ambtenaar is en
      die kiest voor de verlaging van het pensioenbijdrageverhaal, bedoeld in [artikel F 8f, derde lid, van de Abp-wet]
      (onbekend), dient voor 1 december 1994 zijn keuze op de voorgeschreven wijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '81.2'
    text: |-
      Degene die na het in het eerste lid bedoelde tijdstip, maar voor 1 januari 1995 ambtenaar wordt, dient de in het
      eerste lid bedoelde keuze terstond bij de aanvang van de dienstverhouding waaraan die hoedanigheid wordt ontleend,
      op de voorgeschreven wijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel81
  - number: '81.3'
    text: |-
      Ten aanzien van degene op wie het eerste of tweede lid van toepassing is, gaat de verlaging van het
      pensioenbijdrageverhaal, bedoeld in [artikel F 8f van de Abp-wet](onbekend), in per 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel81
  - number: '81.4'
    text: |-
      In afwijking van het eerste lid en van [artikel F 8f van de Abp-wet](onbekend) wordt degene die op het tijdstip
      van inwerkingtreding van [artikel 53, onderdeel U][ref1], van deze wet ambtenaar is en de leeftijd van 58 jaar
      reeds heeft bereikt, met ingang van 1 januari 1995 in aanmerking gebracht voor de in [artikel F 8f, derde lid,
      van de Abp-wet](onbekend) bedoelde verlaging van het pensioenbijdrageverhaal, met behoud van de aanspraak op de
      aanvulling, bedoeld in het eerste lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '82.1'
    text: |-
      Degene die op het tijdstip van inwerkingtreding van [artikel 56, onderdeel I][ref1], van deze wet beroepsmilitair
      of gewezen beroepsmilitair is in de zin van de Amp-wet, en die kiest voor de verlaging van de pensioenbijdrage,
      bedoeld in artikel F 6c, tweede lid, van de Amp-wet, dient voor 1 december 1994 zijn keuze op de voorgeschreven
      wijze kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel56
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '56'
        paragraaf: '10'
  - number: '82.2'
    text: |-
      Degene die na het in het eerste lid bedoelde tijdstip, maar voor 1 januari 1995 beroepsmilitair in de zin van de
      Amp-wet wordt, dient de in het eerste lid bedoelde keuze terstond bij de aanvang van de dienstverhouding waaraan
      die hoedanigheid wordt ontleend, op de voorgeschreven wijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel82
  - number: '82.3'
    text: |-
      Ten aanzien van degene op wie het eerste of tweede lid van toepassing is, gaat de verlaging van de
      pensioenbijdrage, bedoeld in artikel F 6c van de Amp-wet, in per 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel82
  - number: '82.4'
    text: |-
      In afwijking van het eerste lid en van artikel F 6c van de Amp-wet wordt degene die op het tijdstip van
      inwerkingtreding van [artikel 56, onderdeel I][ref1], van deze wet beroepsmilitair of gewezen beroepsmilitair is in
      de zin van de Amp-wet en de leeftijd van 58 jaar reeds heeft bereikt, met ingang van 1 januari 1995 in aanmerking
      gebracht voor de in artikel F 6c, tweede lid, van de Amp-wet bedoelde verlaging van de pensioenbijdrage, met behoud
      van de aanspraak op de aanvulling, bedoeld in artikel E 6, zesde lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel56
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '56'
        paragraaf: '10'
  - number: '83.1'
    text: |-
      Degene die ingevolge de [Abp-wet](onbekend) een invaliditeitspensioen ontvangt, niet zijnde een pensioen als
      bedoeld in [artikel F 12 van die wet](onbekend), en wiens pensioen niet is berekend met toepassing van [artikel F
      1](onbekend), heeft recht op een toeslag ter grootte van een percentage van dat pensioen, welk percentage in kolom
      2 van de bij deze wet behorende tabel II is opgenomen achter de daarbij in kolom 1 genoemde pensioengrenzen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel83
  - number: '83.2'
    text: |-
      [Artikel 39, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel39
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '39'
        paragraaf: '7'
  - number: '83.3'
    text: |-
      Wanneer het invaliditeitspensioen met toepassing van de [artikelen J 18](onbekend), [J 19](onbekend) of [J 20
      van de Abp-wet](onbekend) een vermindering heeft ondergaan, wordt de toeslag berekend over het aldus verminderde
      pensioen.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel83
  - number: '83.4'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van degene wiens invaliditeitspensioen ingevolge
      [artikel F 9, negende lid, van de Abp-wet](onbekend), zoals dat artikel luidde op de dag voorafgaand
      aan de inwerkingtreding van [artikel 53, onderdeel U][ref1], van deze wet, 80 procent bedraagt van
      het bedrag dat overeenkomt met het tot een jaarbedrag herleide maximumsalaris volgens schaal 1 van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] vermeerderd met de daarbij behorende vakantie-
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0003630
  - number: '84.1'
    text: |-
      De gewezen militair, die als zodanig een pensioen ter zake van arbeidsongeschiktheid ingevolge de bij of krachtens
      de [Kaderwet militaire pensioenen][ref1] vastgestelde bepalingen ontvangt op basis van een pensioengrondslag die
      is vastgesteld over een periode die geheel is gelegen voor het jaar 1995, heeft recht op een toeslag ter grootte
      van een percentage van dat pensioen, welk percentage in kolom 2 van de bij deze wet behorende tabel II is opgenomen
      achter de daarbij in kolom 1 genoemde pensioengrenzen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '84.2'
    text: |-
      Wanneer het invaliditeitspensioen met toepassing van de bij of krachtens de [Kaderwet militaire pensioenen][ref1]
      vastgestelde bepalingen ter zake van samenloop met andere inkomsten een vermindering heeft ondergaan, wordt de
      toeslag berekend over het aldus verminderde pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0011955
  - number: '84.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van degene wiens pensioen wegens ziekten of gebreken
      ingevolge artikel F 6, zevende lid, van de Amp-wet, zoals dat artikel luidde op de dag voorafgaand
      aan de inwerkingtreding van [artikel 56, onderdeel I][ref1], van deze wet 80 procent bedraagt van het
      bedrag dat overeenkomt met het tot een jaarbedrag herleide maximum-salaris volgens schaal 1 van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] vermeerderd met de daarbij behorende vakantie-
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '56'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0003630
  - number: '85'
    text: |-
      In afwijking van [artikel F 12 van de Abp-wet](onbekend), zoals dat ingevolge deze wet is komen te luiden,
      blijft het eerste lid van genoemd artikel, zoals dat luidde op de dag voorafgaand aan de inwerkingtreding van
      [artikel 53, onderdeel F][ref1], van deze wet, van kracht ten aanzien van diensttijd tussen 30 september 1986
      en de datum van die inwerkingtreding, onverminderd artikel III, onderdeel B, van de wet van 3 juli 1986, tot
      wijziging van de Algemene burgerlijke pensioenwet en de Spoorwegpensioenwet met betrekking tot aanspraken van
      deelgerechtigden die de leeftijd van 25 jaar nog niet hebben bereikt (*Stb.* 393).


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel53
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '53'
        paragraaf: '9'
  - number: '86'
    text: |-
      Ten aanzien van degene die ingevolge de [Abp-wet](onbekend) of de Amp-wet nabestaanden- of wezenpensioen heeft
      verkregen voor 1 januari 1995, wordt diensttijd waarnaar het pensioen is of geacht wordt te zijn berekend en die
      niet daadwerkelijk in dienstverhouding is doorgebracht, voor zover nodig medebegrepen onder diensttijd gelegen voor
      die datum.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel86
  - number: '87'
    text: |-
      De pensioenen die ingevolge de artikelen J 1a en J 2a van de Abp-wet, zoals deze luidden op 31 december 1994,
      dan wel ingevolge de artikelen J 1a en J 2a van de Abp-wet, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van de Wet invoering franchisesysteem, zijn beperkt, worden met ingang van 1 januari 1995 nader
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel87
  - number: '88'
    text: |-
      De pensioenen die ingevolge de artikelen J 1a en J 2a van de Amp-wet, zoals deze luidden op 31 december 1994,
      dan wel ingevolge de artikelen J 1a en J 2a van de Amp-wet, zoals deze luidden op de dag voorafgaand aan de
      inwerkingtreding van de Wet invoering franchisesysteem militaire pensioenen, zijn beperkt, worden met ingang van 1
      januari 1995 nader vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel88
  - number: '89'
    text: |-
      Voor de toepassing van [artikel K 5, tweede lid, van de Abp-wet](onbekend) wordt het ambtelijk inkomen uit de
      oorspronkelijke betrekking, voor zover dat inkomen betrekking had of kan worden geacht betrekking te hebben gehad
      op een tijdvak gelegen voor 1 januari 1995, aangepast overeenkomstig de aanpassing van de salarissen ingevolge
      [artikel 34][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel34
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '34'
        paragraaf: '6'
  - number: '90'
    text: |-
      In afwijking van [artikel 6, tweede lid, van de Vut-wet](onbekend) bedraagt de uitkering voor de belanghebbende,
      bedoeld in [artikel 1, onderdeel ](onbekend), wiens vut-uitkering is ingegaan voor 1 januari 1995, het in
      het eerstbedoelde artikel vermelde percentage van de, met het percentage zoals dat in kolom 2 van de bij deze
      wet behorende tabel III is opgenomen achter de daarbij in kolom 1 genoemde bezoldigingsgrenzen, verminderde
      bezoldiging. Een en ander met dien verstande dat de in [artikel 6, derde lid, van die wet](onbekend) gegeven
      garantie inzake een minimum inkomen onverkort van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel90
  - number: '91'
    text: |-
      Artikel 10 van de wet van 20 december 1984, houdende aanpassing van uitkeringspercentages van ontslaguitkerings-
      en arbeidsongeschiktheidsregelingen voor overheidspersoneel, onderwijspersoneel en daarmee gelijk te
      stellen personeel, (*Stb.* 657) blijft van toepassing ten aanzien van de invaliditeitspensioenen, bedoeld in
      [artikel 79, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel79
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '79'
        paragraaf: '12'
