  - number: '92.6'
    text: |-
      Indien het bij koninklijke boodschap van 17 mei 1993 ingediende voorstel van wet houdende wijziging van de Algemene
      burgerlijke pensioenwet en andere overheidspensioenwetten (reparatie overheidspensioenen; Kamerstukken II 1992/93,
      23 155, nrs. 1-2) tot wet wordt verheven en gelijktijdig met een of meer onderdelen van deze wet in werking treedt,
      wordt dat onderdeel of worden die onderdelen geacht in werking te zijn getreden na eerstbedoelde wet.
    url: https://wetten.overheid.nl/BWBR0007211/2013-01-01#Artikel92
