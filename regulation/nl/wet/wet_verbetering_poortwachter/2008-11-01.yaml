preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om een reïntegratieverslag en verlenging van de
    wachttijd in de Wet op de arbeidsongeschiktheidsverzekering in te voeren, de bepalingen over de ziekmelding in
    de Ziektewet en over de loondoorbetalingsverplichting van de werkgever in het Burgerlijk Wetboek alsmede, in
    verband met het voorgaande, de Wet op de (re)integratie arbeidsgehandicapten en enige andere wetten, te wijzigen
    met het oog op verbetering van de procesgang tijdens het eerste ziektejaar van de werknemer en een heldere
    verantwoordelijkheidsverdeling van werkgevers, werknemers, arbodiensten en uitvoeringsinstanties daarbij;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013063/2008-11-01#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen 4 jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0013063/2008-11-01#ArtikelXIV
  - number: XV
    text: |-
      1 Ten aanzien van de verzekerde wiens eerste dag van ongeschiktheid tot het
      verrichten van arbeid wegens ziekte is gelegen voor de dag van inwerkingtreding van
      [artikel II, onderdeel M][ref1], zijn de [artikelen 46][ref2], [71a][ref3], [75e][ref4], en
      [75f van de Wet op de arbeidsongeschiktheidsverzekering][ref5], de [artikelen 8, eerste lid][ref6],
      [15, tweede lid][ref7], [16][ref8] en [18, tweede lid, van de Wet op de (re)integratie arbeidsgehandicapten][ref9],
      [15 van de Wet inschakeling werkzoekende][ref10], [52j van de Werkloosheidswet][ref11],
      en [14 van de Arbeidsomstandighedenwet][ref12] zoals deze luiden op de dag voorafgaand
      aan de inwerkingtreding van [artikel II, onderdeel M][ref13], van toepassing en zijn de
      [artikelen 34a][ref14] en [71b van de Wet op de arbeidsongeschiktheidsverzekering][ref15]
      en [artikel 629 lid 11, onderdeel d, van Boek 7 van het Burgerlijk Wetboek][ref16], en
      [artikel 76a, zesde lid, onderdeel b, van de Ziektewet][ref17] niet van toepassing.

      2 Ten aanzien van de verzekerde die voor de dag van inwerkingtreding van [artikel II, onderdeel B][ref18],
      zonder redelijke gronden weigert deel te nemen aan een voor hem gewenste opleiding of
      scholing of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, is
      [artikel 28, onderdeel g, van de Wet op de arbeidsongeschiktheid][ref19] niet van toepassing en is
      [artikel 21, vierde lid, van de Wet op de arbeidsongeschiktheid][ref20], zoals dat artikel luidde op de dag
      voorafgaand aan de inwerkingtreding van [artikel II, onderdeel B][ref21], van toepassing.

      3 Ten aanzien van de verzekerde die voor de dag van inwerkingtreding van [artikel XII, onderdeel A][ref22],
      zonder redelijke gronden weigert deel te nemen aan een voor hem gewenste opleiding of
      scholing of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, is
      [artikel 46, onderdeel g, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref23] niet van toepassing
      en is [artikel 9, derde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref24], zoals dat artikel
      luidde op de dag voorafgaand aan de inwerkingtreding van [artikel XII, onderdeel A][ref25], van toepassing.

      4 Ten aanzien van de jonggehandicapte die voor de dag van inwerkingtreding van
      [artikel XIII, onderdeel A][ref26], zonder redelijke gronden weigert deel te nemen aan een voor hem
      gewenste opleiding of scholing of onvoldoende meewerkt aan het bereiken van een gunstig resultaat ervan, is
      [artikel 38, onderdeel g, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref27] niet van
      toepassing en is [artikel 8, derde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref28],
      zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van [artikel XIII, onderdeel A][ref29],
      van toepassing.

      5 Indien op grond van het eerste lid toepassing wordt gegeven aan de [artikelen 46][ref30],
      [71a, derde of vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref31] of
      [artikel 52j van de Werkloosheidswet][ref32], zoals die luidden op de dag voorafgaand aan
      de inwerkingtreding van [artikel II, onderdeel M][ref33], zijn de [artikelen 89][ref34] en
      [97e, onderdeel h, van de Werkloosheidswet][ref35], zoals die luidden op de dag voorafgaand aan de
      inwerkingtreding van [artikel V, onderdeel B, onder 2][ref36], van toepassing, met dien verstande dat in
      [artikel 89, onderdeel f][ref37], en [artikel 97e, onderdeel h, van de Werkloosheidswet][ref38] voor «artikel 71a,
      tweede en derde lid» wordt gelezen: artikel 71a, derde en vierde lid.

      6 Indien [artikel 8, eerste lid, van de Wet op de (re)ïntegratie arbeidsgehandicapten][ref39],
      zoals dat lid luidde op het moment voorafgaand aan de inwerkingtreding van de
      [Invoeringswet Wet structuur uitvoeringsorganisatie werk en inkomen][ref40], toepassing vindt en op grond van
      dat artikel het reïntegratieverslag wordt verstrekt aan het Uitvoeringsinstituut werknemersverzekeringen, is
      [artikel 34a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref41] niet van toepassing.

      7 Bij ministeriële regeling kunnen in verband met de goede overgang van taken van het Uitvoeringsinstituut
      werknemersverzekeringen naar verplichtingen van de werkgever regels van overgangsrecht worden gesteld.


