---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_rietkerk_uitkering
regulatory_layer: WET
publication_date: '2014-07-15'
valid_from: '2015-01-01'
bwb_id: BWBR0004338
url: https://wetten.overheid.nl/BWBR0004338/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gezien de gezamenlijke verklaring met betrekking tot het overleg
    tussen een delegatie uit het kabinet en de Badan Persatuan op 28 november 1985 en 21 april 1986, wenselijk is
    regelen te stellen met betrekking tot de toekenning van een uitkering en van een herdenkingspenning;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.b
    text: |-
      het register: het register van personen die door de zorg van de Nederlandse regering in 1951 of 1952 in
      groepsverband naar Nederland zijn overgebracht, welk register is aangelegd op basis van de enquête van februari
      1952, bedoeld in het rapport van de commissie, ingesteld bij besluit van de Minister van Maatschappelijk Werk van
      24 september 1957, nr. U 2598 Kabinet;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.c
    text: 'de uitkeringsgerechtigde:'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.c.1°
    text: |-
      degene die voorkomt in het register, op 1 januari 1986 in enig persoonsregister, als bedoeld in artikel 27, eerste
      lid, van het Besluit Bevolkingsboekhouding (*Stb.* 1967, 442) was ingeschreven, op 1 januari 1986 in leven was, en
      niet als kind, pleeg- of adoptiefkind naar Nederland is meegekomen;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.c.2°
    text: |-
      degene die op 1 januari 1986 in enig persoonsregister, als bedoeld in artikel 27, eerste lid, van het Besluit
      Bevolkingsboekhouding was ingeschreven, op 1 januari 1986 in leven was, en waarvan door degene die de uitkering
      aanvraagt wordt aangetoond dat de betreffende persoon: - behoorde tot de groep personen die door de zorg van de
      Nederlandse regering in 1951 of 1952 in groepsverband naar Nederland zijn overgebracht, hetzij uit eigen hoofde,
      hetzij als echtgenoot of echtgenote van een andere uitkeringsgerechtigde, en
        - nadien viel onder de zorg van het Commissariaat Ambonezenzorg;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.c.3°
    text: |-
      degene die op 1 januari 1986 in enig persoonsregister, als bedoeld in artikel 27, eerste lid, van het Besluit
      Bevolkingsboekhouding (*Stb.* 1967, 442) was ingeschreven, op 1 januari 1986 in leven was, en die - onmiddellijk
      voor 27 december 1949 Nederlands onderdaan niet-Nederlander was op grond van de Wet op het Nederlands
      onderdaanschap (Wet van 10 februari 1910, *Stb.* nr. 55) en na overkomst in 1951 of 1952 naar Nederland door
      naturalisatie Nederlander is geworden, en
        - naar het oordeel van Onze Minister behoorde tot de groep personen die in 1951 of 1952 uit hoofde van hun
      dienstverband bij de Koninklijke Marine door de zorg van de Nederlandse regering in groepsverband naar Nederland
      zijn overgebracht;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.d
    text: |-
      de weduwe of weduwnaar: degene die op 1 januari 1986 in enig persoonsregister als bedoeld in artikel 27, eerste
      lid, van het Besluit Bevolkingsboekhouding was ingeschreven en die vóór 1 januari 1976 tot de datum van het
      overlijden gehuwd was met een uitkeringsgerechtigde of met een persoon die, ware hij op 1 januari 1986 nog in leven
      geweest, uitkeringsgerechtigd zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.e
    text: |-
      de erfgenamen: de erfgenamen gezamenlijk, onderscheidenlijk de erfgenaam van de uitkeringsgerechtigde die is
      overleden voor 1 januari 1989;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.f
    text: 'het uitkeringsjaar: het kalenderjaar, waarop de uitkering betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: 1.1.g
    text: |-
      de uitkering: de jaarlijkse uitkering, bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel4
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '4'
  - number: '1.2'
    text: |-
      Onze Minister kan als uitkeringsgerechtigde aanmerken een persoon: - die naar zijn oordeel behoort tot de groep
      personen die door de zorg van de Nederlandse regering in 1951 of 1952 in groepsverband naar Nederland zijn
      overgebracht hetzij uit eigen hoofde hetzij als echtgenoot of echtgenote van een andere uitkeringsgerechtigde, en
        - die niet onder de zorg van het Commissariaat Ambonezenzorg is gevallen, maar wel aan de overige voorwaarden van
      het eerste lid, onder *c,* ten tweede, voldoet, en
        - van wie door degene die de uitkering aanvraagt wordt aangetoond dat deze persoon zich onmiddellijk na aankomst in
      Nederland eigener beweging heeft onttrokken aan de zorg van het Commissariaat Ambonezenzorg.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel1
  - number: '2.1'
    text: 'Recht op de uitkering hebben:'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel2
  - number: 2.1.a
    text: de uitkeringsgerechtigde;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel2
  - number: 2.1.b
    text: de weduwe of weduwnaar.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel2
  - number: '2.2'
    text: |-
      Twee rechthebbenden die op 1 januari van het betreffende uitkeringsjaar met elkaar waren gehuwd, hebben slechts
      recht op één uitkering, die aan hen gezamenlijk, ieder voor de helft, toekomt.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel2
  - number: '2.3'
    text: De weduwe of weduwnaar heeft, onverminderd het bepaalde in het tweede lid, slechts recht op één uitkering.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het recht op de uitkering van de rechthebbenden, bedoeld in [artikel 2, eerste lid][ref1], vervalt met ingang van
      het uitkeringsjaar volgend op het jaar van overlijden van de betreffende rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel2
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '2'
  - number: '3.2'
    text: |-
      Indien de niet gehuwde rechthebbende dan wel de gehuwde rechthebbende die geen weduwe of weduwnaar nalaat, is
      overleden voor 1 januari 1989, treden de erfgenamen in zijn of haar plaats en duurt het recht op de uitkering ten
      bate van de erfgenamen voort tot en met 31 december 1988.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de rechthebbenden die met elkaar gehuwd waren, beiden zijn overleden voor 1 januari 1989, treden de
      erfgenamen van de uitkeringsgerechtigde in de plaats van de langstlevende rechthebbende en duurt het recht op de
      uitkering ten bate van de erfgenamen voort tot en met 31 december 1988.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van het bepaalde in het derde lid, treden, indien de rechthebbenden die met elkaar gehuwd waren,
      beiden uitkeringsgerechtigd waren, de erfgenamen van ieder van hen in de plaats van de langstlevende, waarbij de
      uitkering voor de helft toekomt aan de erfgenamen van de man en voor de helft aan de erfgenamen van de vrouw.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De uitkering ten bedrage van € 907,56 's jaars wordt op aanvraag, met inachtneming van het in deze wet bepaalde,
      door Onze Minister toegekend aan de rechthebbende, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel2
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '2'
  - number: '4.2'
    text: |-
      De toekenning blijft van kracht zolang het recht op de uitkering voortduurt, met dien verstande dat in het geval,
      bedoeld in [artikel 2, tweede lid][ref1], de toekenning wordt gewijzigd zonder dat daartoe een nieuwe aanvraag
      wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel2
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '2'
  - number: '4.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid, eindigt de toekenning in de gevallen, bedoeld in
      [artikel 3, tweede, derde en vierde lid][ref1], bij het eindigen van het recht op de uitkering van de
      rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel3
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '3'
  - number: '5.1'
    text: |-
      De aanvraag wordt schriftelijk en uiterlijk op 1 juli van enig uitkeringsjaar door of namens de rechthebbende
      ingediend.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      De aanvraag welke wordt ontvangen nà 1 juli van enig uitkeringsjaar geldt als aanvraag gedaan in het uitkeringsjaar
      volgende op dat waarin de aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel5
  - number: '5.3'
    text: Onze Minister beslist op de aanvraag vòòr het einde van het uitkeringsjaar waarin de aanvraag wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel5
  - number: '6.1'
    text: De aanvraag kan worden ingediend tot 1 oktober 1991.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel6
  - number: '6.2'
    text: 'Niet als aanvraag, bedoeld in het eerste lid, worden beschouwd:'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel6
  - number: 6.2.a
    text: |-
      een aanvraag van de weduwe of weduwnaar, voorzover aan de uitkeringsgerechtigde reeds eerder een uitkering is
      toegekend;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel6
  - number: 6.2.b
    text: |-
      een aanvraag van de erfgenamen, bedoeld in [artikel 3, derde of vierde lid][ref1], voorzover de aanvraag van de
      rechthebbende zelf geen eerste aanvraag zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel3
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '3'
  - number: '7.1'
    text: |-
      Aan de rechthebbende dan wel de erfgenamen die in de plaats treden van de rechthebbende, wordt op een daartoe
      strekkende aanvraag een herdenkingspenning uitgereikt.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '7.2'
    text: |-
      De aanvraag voor de herdenkingspenning wordt gelijktijdig met de aanvraag voor de uitkering bij Onze Minister
      ingediend.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '7.3'
    text: Geen herdenkingspenning wordt uitgereikt indien geen uitkering wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het bepaalde in het derde lid wordt aan de erfgenamen van een persoon die, ware hij op 1 januari
      1986 nog in leven geweest, uitkeringsgerechtigd zou zijn geweest en die geen weduwe of weduwnaar heeft nagelaten
      die rechthebbend is, op een daartoe strekkende aanvraag de herdenkingspenning uitgereikt. De aanvraag kan worden
      ingediend tot 1 oktober 1991.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '7.5'
    text: 'Geen herdenkingspenning wordt uitgereikt aan:'
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: 7.5.a
    text: de weduwe of weduwnaar van een uitkeringsgerechtigde aan wie reeds een penning is uitgereikt;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: 7.5.b
    text: de erfgenamen van de rechthebbende aan wie reeds een penning is uitgereikt;
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: 7.5.c
    text: |-
      degene die niet heeft voldaan aan het bij of krachtens deze wet bepaalde met betrekking tot het indienen van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '7.6'
    text: De vormgeving van de herdenkingspenning wordt door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel7
  - number: '8'
    text: |-
      De over de uitkering verschuldigde belasting ingevolgde de [Wet inkomstenbelasting 2001][ref1] en de verschuldigde
      premies ingevolge de [Algemene Ouderdomswet][ref2] (*Stb.* 1985, 181), de [Algemene nabestaandenwet][ref3], de
      [Algemene Wet Bijzondere Ziektekosten][ref4] (*Stb.* 1967, 655) en de [Algemene Kinderbijslagwet][ref5] (*Stb.*
      1980, 1) komen ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0007795
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0007795
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0002368
  - number: '9'
    text: |-
      De uitkering blijft buiten beschouwing bij de verlening van bijstand ingevolge de [Participatiewet][ref1] en
      andere, op het inkomen van de rechthebbende afgestemde publiekrechtelijke uitkeringen of verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '10'
    text: Ten aanzien van de uitkering blijft artikel 1461 van het Burgerlijk Wetboek buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot de bij de aanvraag van de uitkering of van de
      herdenkingspenning over te leggen bescheiden, de wijze van behandeling van die aanvragen, alsmede met betrekking
      tot de wijze en voorwaarden van de betaling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel11
  - number: '11.2'
    text: De regelen worden in de *Nederlandse Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel11
  - number: '12'
    text: |-
      In afwijking van het bepaalde in [artikel 5, eerste lid][ref1], kan de aanvraag voor de uitkering over het
      uitkeringsjaar 1986 tot uiterlijk 1 december 1986 worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0004338#Artikel5
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004338
        artikel: '5'
  - number: '13.1'
    text: |-
      Het Besluit Rietkerk-uitkering (*Stb.* 1986, 523) wordt ingetrokken met dien verstande dat de beslissingen genomen
      op grond van dit besluit geacht worden te zijn genomen krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel13
  - number: '13.2'
    text: |-
      Degene die op grond van het Besluit Rietkerk-uitkering niet in aanmerking kwam voor een uitkering maar op grond van
      enige bepaling van deze wet wel voor de uitkering in aanmerking kan komen, kan de aanvraag over de jaren 1986, 1987
      en 1988 tot uiterlijk 1 juli 1988 indienen. Een beslissing op een aanvraag ingevolge dit artikellid wordt voor 1
      januari 1989 genomen.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel13
  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 1986.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel14
  - number: '15'
    text: Deze wet kan worden aangehaald als Wet Rietkerk-uitkering.
    url: https://wetten.overheid.nl/BWBR0004338/2015-01-01#Artikel15
