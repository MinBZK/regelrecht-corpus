  - number: 93a.3
    text: |-
      Indien een ingevolge het eerste lid verschuldigd bedrag niet is betaald binnen de termijn, gesteld bij algemene
      maatregel van bestuur, wordt het desbetreffende bedrag vermeerderd met de wettelijke rente, te rekenen vanaf de dag
      waarop die termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93a
  - number: 93a.4
    text: |-
      Indien niet is betaald binnen de termijn bedoeld in het derde lid, wordt degene die het bedrag is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag, verhoogd met de wettelijke rente en de kosten voor de
      aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93a
  - number: 93b.1
    text: |-
      Bij gebreke van betaling binnen de in [artikel 93a, vierde lid][ref1], gestelde termijn kan het verschuldigde
      bedrag, verhoogd met de wettelijke rente en de op de aanmaning betrekking hebbende kosten, worden ingevorderd bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel93a
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93b
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 93a
        hoofdstuk: 12a
  - number: 93b.2
    text: |-
      [Artikel 68, tweede, derde en vierde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel68
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93b
    references:
