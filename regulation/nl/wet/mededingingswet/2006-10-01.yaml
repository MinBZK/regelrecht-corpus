  - number: '105.1'
    text: |-
      Indien op het tijdstip van inwerkingtreding van [artikel 24][ref1] ter zake van een beschikking, genomen op
      grond van artikel 24, eerste lid, onder *b*, of artikel 27, eerste lid, van de Wet economische mededinging, de in
      [artikel 6:7 van de Algemene wet bestuursrecht][ref2] genoemde termijn voor het indienen van een bezwaarschrift
      nog niet is verstreken en voorts nog geen bezwaar is gemaakt, geldt voor de toepassing van [artikel 6:7][ref3]
      het tijdstip van inwerkingtreding van [artikel 24][ref4] als tijdstip van bekendmaking van de beschikking. Het
      bezwaarschrift wordt ingediend bij de directeur-generaal en behandeld met toepassing van het recht zoals het geldt
      na het genoemde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel105
    references:
      - id: ref1
