    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70a
  - number: 70a.1.b
    text: |-
      een last onder dwangsom opleggen, die ertoe strekt de overtreding ongedaan te maken of verdere overtreding dan wel
      herhaling van de overtreding te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70a
  - number: 70a.2
    text: Een boete en een last onder dwangsom kunnen tezamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70a
  - number: 70a.3
    text: |-
