        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '104.2'
    text: |-
      Een op grond van artikel 27, eerste lid, van de Wet economische mededinging genomen beschikking wordt
      vanaf het tijdstip van inwerkingtreding van [artikel 24][ref1] aangemerkt als een voorlopige last als
      bedoeld in [artikel 83, eerste lid][ref2], met dien verstande dat die last, in afwijking van de in
      [artikel 85, derde lid, onderdeel ][ref3], genoemde termijn, vervalt indien niet binnen drie maanden na het
      genoemde tijdstip een rapport als bedoeld in [artikel 59, eerste lid][ref4], is opgemaakt ter zake van overtreding
      van [artikel 24, eerste lid][ref5], op het tijdstip waarop die drie maanden zijn verstreken. De directeur-generaal
      beslist binnen vier weken na het tijdstip van inwerkingtreding van [artikel 24][ref6] omtrent de dwangsom die aan
      die voorlopige last wordt verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel59
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel24
