        paragraaf: '5'
  - number: '95'
    text: De Wet economische mededinging wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel95
  - number: '100.1'
    text: |-
      Voor de toepassing van [verordening (EEG) nr. 4064/89](onbekend) van de Raad van de Europese Gemeenschappen van 21
      december 1989 betreffende de controle op concentraties van ondernemingen (PbEG 1990, L 257) ingevolge artikel 26,
      tweede lid, van [verordening 139/2004](onbekend), is [artikel 88][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel88
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '88'
        hoofdstuk: '10'
  - number: '100.2'
    text: |-
      Voor de toepassing van artikel 12, eerste lid, of artikel 13, vijfde en zesde lid, van [verordening (EEG) nr.
      4064/89](onbekend) van de Raad van de Europese Gemeenschappen van 21 december 1989 betreffende de controle op
      concentraties van ondernemingen (PbEG 1990, L 257) ingevolge artikel 26, tweede lid, van [verordening 139/2004]
      (onbekend), zijn onderscheidenlijk [artikel 89g][ref1] of de [artikelen 89b][ref2], [89c][ref3], [89e][ref4] en
      [89f][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel89g
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel89b
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel89c
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel89e
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel89f
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel100
