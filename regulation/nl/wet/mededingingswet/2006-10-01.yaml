  - number: '104.1'
    text: |-
      Een op grond van artikel 24, eerste lid, onder *b*, van de Wet economische mededinging genomen beschikking
      wordt vanaf het tijdstip van inwerkingtreding van [artikel 24][ref1] aangemerkt als een last als bedoeld in
      [artikel 56, eerste lid, onder ][ref2], met dien verstande dat [artikel 58, tweede lid][ref3], niet van toepassing
      is. De directeur-generaal beslist binnen zes weken na het genoemde tijdstip omtrent de dwangsom die aan die last
      wordt verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel58
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
