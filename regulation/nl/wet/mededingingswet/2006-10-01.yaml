  - number: 77.2.b
    text: waar en wanneer de onder*a*bedoelde feiten en omstandigheden zich hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: 77.2.c
    text: degene die de overtreding heeft begaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: 77.2.d
    text: de natuurlijke persoon of rechtspersoon die de overtreding kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: 77.2.e
    text: het overtreden wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: '77.3'
    text: Een afschrift van het rapport wordt toegezonden aan de in het tweede lid, onder *c*, bedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: '77.4'
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt de raad er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de betrokkene wordt
      meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel77
  - number: '78.1'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] worden de belanghebbenden schriftelijk
      opgeroepen om naar keuze schriftelijk of mondeling hun zienswijze naar voren te brengen omtrent het in
      [artikel 77, eerste lid][ref2], bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel77
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '78.2'
    text: |-
      Indien de raad voornemens is een last onder dwangsom op te leggen, stelt hij belanghebbenden tevens in de
      gelegenheid schriftelijk of mondeling hun zienswijze kenbaar te maken over de voorgenomen last.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel78
  - number: '78.3'
    text: |-
      Indien de belanghebbende zijn zienswijze mondeling naar voren brengt, draagt de raad er op verzoek van de
      belanghebbende die de Nederlandse taal onvoldoende begrijpt, zorg voor dat een tolk wordt benoemd die de
      belanghebbende kan bijstaan, tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel78
  - number: '79.1'
    text: |-
      Een boete als bedoeld in de [artikelen 69, eerste lid][ref1], [70a, eerste lid, onder a][ref2], [71][ref3],
      [72][ref4], [73][ref5], [74, eerste lid, onder ][ref6], en [75, eerste lid, onder ][ref7], en een last als bedoeld
      in de [artikelen 70, eerste lid][ref8], [70a, eerste lid, onder b][ref9], [artikel 74, eerste lid, onder ][ref10],
      en [artikel 75, eerste lid, onder ][ref11], wordt opgelegd bij beschikking van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel70a
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel73
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel74
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Artikel75
      [ref8]: https://wetten.overheid.nl/BWBR0008691#Artikel70
      [ref9]: https://wetten.overheid.nl/BWBR0008691#Artikel70a
      [ref10]: https://wetten.overheid.nl/BWBR0008691#Artikel74
      [ref11]: https://wetten.overheid.nl/BWBR0008691#Artikel75
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '69'
        hoofdstuk: '8'
