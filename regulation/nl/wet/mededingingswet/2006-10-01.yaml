---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mededingingswet
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2006-10-01'
bwb_id: BWBR0008691
url: https://wetten.overheid.nl/BWBR0008691/2006-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vervanging van de Wet economische mededinging
    nieuwe regels vast te stellen omtrent mededingingsafspraken en economische machtsposities, alsmede om regels te
    stellen omtrent toezicht op concentraties van ondernemingen, en daarbij zoveel mogelijk aan te sluiten bij de
    regels betreffende de mededinging krachtens het Verdrag tot oprichting van de Europese Gemeenschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.b
    text: |-
      mededingingsautoriteit: de Nederlandse Mededingingsautoriteit, genoemd in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.c
    text: 'raad: de raad van bestuur van de mededingingsautoriteit;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.d
    text: 'Verdrag: het Verdrag tot oprichting van de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.e
    text: 'overeenkomst: een overeenkomst in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.f
    text: 'onderneming: een onderneming in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.g
    text: 'ondernemersvereniging: een ondernemersvereniging in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.h
    text: |-
      onderling afgestemde feitelijke gedragingen: onderling afgestemde feitelijke gedragingen in de zin van artikel 81,
      eerste lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.i
    text: |-
      economische machtspositie: positie van een of meer ondernemingen die hen in staat stelt de instandhouding van een
      daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan te verhinderen door hun de mogelijkheid
      te geven zich in belangrijke mate onafhankelijk van hun concurrenten, hun leveranciers, hun afnemers of de
      eindgebruikers te gedragen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.j
    text: 'overtreding: een handeling die in strijd is met het bepaalde bij of krachtens deze wet;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.k
    text: |-
      onderzoek: handelingen die worden verricht met het oog op de vaststelling dat al dan niet een overtreding is
      begaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.l
    text: 'boete: de bestuurlijke sanctie bestaande in de verplichting aan de staat een bepaalde geldsom te betalen;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.m
    text: |-
      [verordening 1/2003](onbekend): [verordening (EG) nr. 1/2003](onbekend) van de Raad van de Europese Unie van 16
      december 2002 betreffende de uitvoering van de mededingingsregels van de artikelen 81 en 82 van het Verdrag (PbEG
      2003, L 1);
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.n
    text: |-
      [verordening 139/2004](onbekend): [verordening (EG) nr. 139/2004](onbekend) van de Raad van de Europese Unie van 20
      januari 2004 betreffende de controle op concentraties van ondernemingen (PbEG L 24);
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: 1.o
    text: 'mededingingsverordening: verordening genoemd in de onderdelen m en n.'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel1
  - number: '2.1'
    text: Er is een Nederlandse Mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel2
  - number: '2.2'
    text: De raad van bestuur vormt het bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel2
  - number: '3.1'
    text: De raad bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel3
  - number: '3.2'
    text: |-
      Benoeming, schorsing en ontslag van de leden geschieden op voordracht van Onze Minister bij koninklijk besluit.
      Benoeming vindt plaats op grond van deskundigheid op het gebied van de taken waarmee de raad is belast.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel3
  - number: '3.3'
    text: |-
      De voorzitter wordt benoemd voor een periode van ten hoogste zes jaar en de overige leden worden benoemd voor een
      periode van ten hoogste vier jaar. De leden kunnen eenmaal worden herbenoemd voor een periode van ten hoogste vier
      jaar.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel3
  - number: '3.4'
    text: |-
      Een lid van de raad kan op eigen verzoek worden ontslagen. Hij kan voorts worden geschorst of ontslagen wegens
      ongeschiktheid of onbekwaamheid voor de vervulde functie dan wel wegens andere zwaarwegende in zijn persoon gelegen
      redenen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel3
  - number: '4.1'
    text: |-
      Een lid van de raad vervult geen nevenfuncties die ongewenst zijn met het oog op een goede vervulling van zijn
      functie of de handhaving van zijn onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4
  - number: '4.2'
    text: |-
      Een lid van de raad meldt het voornemen tot het aanvaarden van een nevenfunctie anders dan uit hoofde van zijn
      functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4
  - number: '4.3'
    text: |-
      Nevenfuncties van een lid van de raad, anders dan uit hoofde van zijn functie worden openbaar gemaakt.
      Openbaarmaking geschiedt door het ter inzage leggen van een opgave van deze nevenfuncties bij de
      mededingingsautoriteit en bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4
  - number: '4.4'
    text: |-
      Een lid van de raad heeft geen financiële of andere belangen bij ondernemingen waardoor zijn onpartijdigheid in het
      geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4
  - number: 4a
    text: |-
      Onze Minister stelt de bezoldiging en de overige regels ten aanzien van de rechtspositie van de leden van de raad
      vast.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4a
  - number: 4b.1
    text: |-
      De raad stelt een bestuursreglement vast, waarin in ieder geval regels over de werkwijze en procedures zijn
      opgenomen. In het reglement worden tevens regels opgenomen over de verdeling van de werkzaamheden bij de
      voorbereiding van de besluiten van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4b
  - number: 4b.2
    text: |-
      Het bestuursreglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd
      met het recht of op de grond dat het bestuursreglement naar het oordeel van Onze Minister een goede taakuitoefening
      door de raad kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4b
  - number: 4b.3
    text: Het bestuursreglement wordt na de goedkeuring van Onze Minister bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel4b
  - number: '5'
    text: |-
      De raad is belast met taken ter uitvoering van deze wet, alsmede ter uitvoering van andere wetten, voor zover dat
      in de desbetreffende wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister stelt ten behoeve van de uitvoering van de in [artikel 5][ref1] bedoelde taken personeel ter
      beschikking van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5a.2
    text: Het personeel staat onder gezag van de raad en legt over werkzaamheden uitsluitend aan hem verantwoording af.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
  - number: 5a.3
    text: De raad stelt een mandaatregeling op ten aanzien van de bevoegdheden van het personeel.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
  - number: 5a.4
    text: |-
      In de mandaatregeling worden regels gesteld omtrent het verlenen van een algemeen mandaat met betrekking tot de
      uitvoering van de [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2] en kunnen regels worden gesteld in het kader
      van de uitvoering van andere wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 5a.5
    text: |-
      De raad voorziet in een specifieke organisatorische eenheid die wordt belast met uitvoering en toezicht op de
      [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 5a.6
    text: |-
      De in het derde lid bedoelde regeling behoeft de goedkeuring van Onze Minister. Onze Minister onthoudt zijn
      goedkeuring indien naar zijn oordeel de mandaatregeling een goede taakuitoefening door de raad kan belemmeren. De
      regeling wordt na goedkeuring door de raad bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
  - number: 5a.7
    text: |-
      Indien Onze Minister van oordeel is dat de mandaatregeling een goede taakuitoefening belemmert, kan hij de raad
      verzoeken de mandaatregeling te wijzigen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
  - number: 5a.8
    text: |-
      Indien de raad binnen drie maanden geen gevolg heeft gegeven aan een verzoek als bedoeld in het zevende lid kan
      Onze Minister de raad opdragen de mandaatregeling op een door hem gewenste wijze aan te passen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5a
  - number: 5b.1
    text: |-
      Onze Minister kan de raad opdragen werkzaamheden te verrichten in het kader van de uitvoering van regelgeving op
      het gebied van de mededinging op grond van het Verdrag, voor zover daarin niet reeds bij of krachtens de wet is
      voorzien, alsmede werkzaamheden op het gebied van de mededinging in verband met andere verdragen of internationale
      afspraken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5b
  - number: 5b.2
    text: |-
      Onze Minister kan de raad instructies geven met betrekking tot het verrichten van de in het eerste lid bedoelde
      werkzaamheden, alsmede met betrekking tot het door de raad in te nemen standpunt in een adviescomité als bedoeld
      in artikel 14, tweede lid, van [verordening 1/2003](onbekend) en artikel 19, vierde lid, van [verordening 139/2004]
      (onbekend), met dien verstande dat een instructie inzake een standpunt in een adviescomité geen betrekking heeft op
      de mededingingsaspecten van een individueel geval.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5b
  - number: 5c.1
    text: |-
      Onze Minister kan, al dan niet op verzoek van een van Onze andere Ministers, de raad opdragen een rapportage uit
      te brengen inzake de effecten voor de mededinging van voorgenomen of geldende regelgeving of van een voorgenomen of
      een geldend besluit.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5c
  - number: 5c.2
    text: De raad kan een in het eerste lid bedoelde rapportage ook uit eigen beweging uitbrengen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5c
  - number: 5c.3
    text: Het uitbrengen van een rapportage aan een van Onze andere Ministers geschiedt door tussenkomst van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5c
  - number: 5c.4
    text: |-
      Op verzoek van een of beide Kamers van de Staten-Generaal brengt de raad met tussenkomst van Onze Minister een
      rapportage uit aan de beide Kamers der Staten-Generaal. Onze Minister zendt de rapportage onverwijld naar de beide
      Kamers der Staten-Generaal. Onze Minister kan de rapportage doen vergezellen van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5c
  - number: 5d.1
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de uitoefening van de aan de raad toegekende
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5d
  - number: 5d.2
    text: |-
      Beleidsregels met betrekking tot de uitoefening van de in deze wet aan de raad toegekende bevoegdheden
      kunnen betrekking hebben of mede betrekking hebben op de wijze waarop de raad bij toepassing van
      [artikel 6, derde lid][ref1], andere belangen dan economische belangen in zijn afweging moet betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5d.3
    text: De bekendmaking van de beleidsregels geschiedt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5d
  - number: 5e.1
    text: |-
      De raad verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van alle zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van
      zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5e
  - number: 5e.2
    text: |-
      Onze Minister kan, nadat de raad in de gelegenheid is gesteld zijn opmerkingen te maken, nadere regels vaststellen
      met betrekking tot de gegevensuitwisseling tussen Onze Minister en de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5e
  - number: 5f.1
    text: |-
      Indien naar het oordeel van Onze Minister de raad bij de uitoefening van zijn taak ernstig in gebreke blijft, kan
      Onze Minister de noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5f
  - number: 5f.2
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de raad in de
      gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak naar behoren uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5f
  - number: 5f.3
    text: |-
      Indien de in het eerste lid bedoelde taakverwaarlozing betrekking heeft op werkzaamheden ten behoeve van de
      uitvoering van een andere wet als bedoeld in [artikel 5][ref1], treft Onze Minister de voorzieningen na overleg met
      Onze andere Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5f
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5f.4
    text: |-
      Onze Minister stelt de beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5f
  - number: 5g.1
    text: |-
      De raad stelt jaarlijks voor 1 juli een jaarverslag op. Het jaarverslag heeft betrekking op de uitvoering van deze
      wet en op de uitvoering van andere wetten als bedoeld in [artikel 5][ref1] voor zover in die wet niet is voorzien
      in een afzonderlijke verplichting tot het opstellen van een verslag.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5g
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5g.2
    text: |-
      Het verslag wordt gezonden aan Onze Minister en in voorkomend geval mede aan Onze andere Minister wie het aangaat
      en wordt algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5g
  - number: 5g.3
    text: |-
      Onze Minister brengt het verslag, vergezeld van zijn bevindingen daaromtrent alsmede van de bevindingen van Onze
      andere Minister, bedoeld in het tweede lid, voor 1 september ter kennis van de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5g
  - number: 5h.1
    text: |-
      Onze Minister zendt elke vijf jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van
      het functioneren van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5h
  - number: 5h.2
    text: |-
      Voor zover het verslag betrekking heeft op de werkzaamheden ten behoeve van de uitvoering van een andere wet
      als bedoeld in [artikel 5][ref1], stelt Onze Minister het verslag op na overleg met Onze andere Minister wie het
      aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5h
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5i.1
    text: De raad zendt jaarlijks voor 1 april aan Onze Minister de ontwerp-begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5i
  - number: 5i.2
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de raad daarvan onverwijld mededeling aan Onze Minister
      onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5i
  - number: 5j
    text: |-
      De raad draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de nodige technische
      en organisatorische voorzieningen ter beveiliging van de gegevens bij de mededingingsautoriteit tegen verlies of
      aantasting en tegen onbevoegde kennisneming, wijziging of verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5j
  - number: 5k
    text: De raad verschaft aan Onze Minister periodiek informatie over de geleverde en te leveren prestaties.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5k
  - number: 5l
    text: |-
      De raad kan uitvoeringsregels vaststellen ter uitvoering van de aan hem opgedragen taken. Van de uitvoeringsregels
      doet de raad mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel5l
  - number: '6.1'
    text: |-
      Verboden zijn overeenkomsten tussen ondernemingen, besluiten van ondernemersverenigingen en onderling afgestemde
      feitelijke gedragingen van ondernemingen, die ertoe strekken of ten gevolge hebben dat de mededinging op de
      Nederlandse markt of een deel daarvan wordt verhinderd, beperkt of vervalst.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel6
  - number: '6.2'
    text: De krachtens het eerste lid verboden overeenkomsten en besluiten zijn van rechtswege nietig.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel6
  - number: '6.3'
    text: |-
      Het eerste lid geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke gedragingen die
      bijdragen tot verbetering van de productie of van de distributie of tot bevordering van de technische of
      economische vooruitgang, mits een billijk aandeel in de daaruit voortvloeiende voordelen de gebruikers ten goede
      komt, en zonder nochtans aan de betrokken ondernemingen
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel6
  - number: 6.3.a
    text: beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel6
  - number: 6.3.b
    text: |-
      de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel6
  - number: '7.1'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke
      gedragingen als bedoeld in dat artikel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.1.a
    text: |-
      bij de desbetreffende overeenkomst of onderling afgestemde feitelijke gedraging niet meer dan acht ondernemingen
      betrokken zijn, dan wel bij de desbetreffende ondernemersvereniging niet meer dan acht ondernemingen betrokken
      zijn, en
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: 7.1.b
    text: |-
      de gezamenlijke omzet in het voorafgaande kalenderjaar van de bij de desbetreffende overeenkomst of onderling
      afgestemde feitelijke gedraging betrokken ondernemingen dan wel de gezamenlijke omzet van de bij de desbetreffende
      ondernemersvereniging betrokken ondernemingen niet hoger is dan:
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: 7.1.b.1°
    text: |-
      € 4 540 000, indien daarbij uitsluitend ondernemingen zijn betrokken wier activiteiten zich in hoofdzaak richten op
      het leveren van goederen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: 7.1.b.2°
    text: € 908 000, in alle andere gevallen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: '7.2'
    text: |-
      In geval van afzonderlijke overeenkomsten tussen een onderneming of een ondernemersvereniging en twee of
      meer andere ondernemingen, die dezelfde strekking hebben, worden voor de toepassing van het eerste lid die
      overeenkomsten tezamen beschouwd als één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: '7.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen, dat
      [artikel 6, eerste lid][ref1], niet van toepassing is op in die maatregel omschreven categorieën van
      overeenkomsten, besluiten of gedragingen als bedoeld in dat artikel, die in het algemeen vanuit een oogpunt van
      mededinging van duidelijk ondergeschikte betekenis zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '7.4'
    text: |-
      Het in het eerste lid, onder *a*, genoemde aantal en de in het eerste lid, onder *b*, genoemde bedragen kunnen bij
      algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel7
  - number: '8.1'
    text: |-
      De berekening van de omzet, bedoeld in [artikel 7, eerste lid, onder ][ref1], geschiedt op de voet van het bepaalde
      in [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '8.2'
    text: |-
      Indien een onderneming behoort tot een groep als bedoeld in [artikel 24][ref1] worden voor de berekening van de
      omzet van die onderneming de omzetten van alle tot die groep behorende ondernemingen opgeteld. Bij deze berekening
      worden transacties tussen de tot die groep behorende ondernemingen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '8.3'
    text: |-
      Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 7, eerste lid, onder ][ref1], worden de transacties tussen die ondernemingen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De raad kan op een overeenkomst tussen ondernemingen, een besluit van een ondernemersvereniging of een onderling
      afgestemde feitelijke gedraging van ondernemingen waarop krachtens [artikel 7, eerste of derde lid][ref1],
      [artikel 6, eerste lid][ref2], niet van toepassing is, bij beschikking alsnog [artikel 6, eerste lid][ref3], van
      toepassing verklaren, indien die overeenkomst, dat besluit of die gedraging gezien de marktverhoudingen op de
      relevante markt in aanzienlijke mate afbreuk doet aan de mededinging.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '9.3'
    text: |-
      De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10'
    text: |-
      [Artikel 6][ref1] geldt niet voor overeenkomsten, besluiten en gedragingen als bedoeld in dat artikel die
      rechtstreeks verbonden zijn aan een concentratie als bedoeld in [artikel 27][ref2], en noodzakelijk zijn voor de
      verwezenlijking van de desbetreffende concentratie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '11'
    text: |-
      Voor overeenkomsten, besluiten en gedragingen als bedoeld in [artikel 6, eerste lid][ref1], waarbij ten minste
      een onderneming of ondernemersvereniging betrokken is die bij wettelijk voorschrift of door een bestuursorgaan
      is belast met het beheer van diensten van algemeen economisch belang, geldt [artikel 6, eerste lid][ref2], voor
      zover de toepassing van dat artikel de vervulling van de aan die onderneming of ondernemersvereniging toevertrouwde
      bijzondere taak niet verhindert.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen waarvoor krachtens een
      verordening van de Raad van de Europese Unie of een verordening van de Commissie van de Europese Gemeenschappen
      artikel 81, eerste lid, van het Verdrag buiten toepassing is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen die de handel tussen de
      lid-staten van de Europese Gemeenschappen niet ongunstig kunnen beïnvloeden of waardoor de mededinging binnen de
      gemeenschappelijke markt niet wordt verhinderd, beperkt of vervalst doch die, indien dat wel het geval zou zijn,
      zouden zijn vrijgesteld krachtens een verordening als bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel12
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De raad kan op een overeenkomst tussen ondernemingen, een besluit van een ondernemersvereniging of een onderling
      afgestemde feitelijke gedraging van ondernemingen waarop krachtens het eerste lid [artikel 6, eerste lid][ref1],
      niet van toepassing is, bij beschikking alsnog [artikel 6, eerste lid][ref2], van toepassing verklaren,
      indien zich omstandigheden voordoen als die welke krachtens de desbetreffende verordening kunnen leiden tot de
      buitentoepassingverklaring van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '13.4'
    text: |-
      De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '14'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen waarvoor een op grond van
      artikel 81, derde lid, van het Verdrag verleende ontheffing geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen, dat
      [artikel 6, eerste lid][ref1], niet geldt voor in die maatregel omschreven categorieën van overeenkomsten,
      besluiten en gedragingen als bedoeld in dat artikel, die bijdragen tot verbetering van de produktie of van de
      distributie of tot bevordering van de technische of economische vooruitgang, mits een billijk aandeel in de daaruit
      voortvloeiende voordelen de gebruikers ten goede komt, en zonder nochtans aan de betrokken ondernemingen


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 15.1.a
    text: beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
  - number: 15.1.b
    text: |-
      de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
  - number: '15.2'
    text: |-
      In een algemene maatregel van bestuur als bedoeld in het eerste lid kan worden bepaald dat de raad op een
      overeenkomst, besluit of gedraging waarvoor krachtens die maatregel [artikel 6, eerste lid][ref1], niet geldt, bij
      beschikking alsnog [artikel 6, eerste lid][ref2], van toepassing kan verklaren, indien wordt voldaan aan de in die
      algemene maatregel van bestuur genoemde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.3'
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '15.4'
    text: |-
      De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '24.1'
    text: Het is ondernemingen verboden misbruik te maken van een economische machtspositie.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel24
  - number: '24.2'
    text: |-
      Het tot stand brengen van een concentratie als omschreven in [artikel 27][ref1] wordt niet aangemerkt als het
      misbruik maken van een economische machtspositie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Voor zover de toepassing van [artikel 24, eerste lid][ref1], de vervulling van bij wettelijk voorschrift of door
      een bestuursorgaan aan een onderneming opgedragen beheer van een dienst van algemeen economisch belang verhindert,
      kan de raad op aanvraag verklaren dat [artikel 24, eerste lid][ref2], niet van toepassing is op een daarbij
      aangewezen gedraging.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Een beschikking als bedoeld in het eerste lid kan onder beperkingen worden gegeven; aan een beschikking kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25
  - number: 25a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.a
    text: |-
      richtlijn: [richtlijn nr. 2000/52/EG](onbekend) van de Commissie van de Europese Gemeenschappen van 26 juli 2000
      (PbEG L 193) tot wijziging van [Richtlijn nr. 80/723/EEG](onbekend) betreffende de doorzichtigheid in de financiële
      betrekkingen tussen lidstaten en openbare bedrijven;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.b
    text: |-
      uitsluitend recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.c
    text: |-
      bijzonder recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.c.1°
    text: |-
      het aantal van deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere
      wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.c.2°
    text: |-
      verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens deze criteria worden aangewezen, of
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.c.3°
    text: |-
      aan een of meer ondernemingen op een andere wijze dan volgens deze criteria voordelen worden toegekend waardoor
      enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde
      geografische gebied onder in wezen gelijkwaardige voorwaarden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25a.d
    text: |-
      verschillende activiteiten: enerzijds producten of diensten met betrekking tot welke aan een onderneming een
      bijzonder of uitsluitend recht is verleend, of alle diensten van algemeen economisch belang waarmee een onderneming
      is belast en, anderzijds, elk ander afzonderlijk product met betrekking tot hetwelk of elke andere afzonderlijke
      dienst met betrekking tot welke de onderneming werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25a
  - number: 25b.1
    text: |-
      Ondernemingen waaraan overeenkomstig artikel 86, eerste lid, van het Verdrag een bijzonder of uitsluitend recht
      is verleend of die overeenkomstig artikel 86, tweede lid, van het Verdrag met het beheer van een dienst van
      algemeen economisch belang zijn belast en met betrekking tot deze dienst in enigerlei vorm, waaronder een subsidie,
      ondersteuning of compensatie, overheidssteun ontvangen, en die verschillende activiteiten uitvoeren, houden een
      zodanige administratie bij dat:
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25b
  - number: 25b.1.a
    text: de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25b
  - number: 25b.1.b
    text: |-
      alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25b
  - number: 25b.1.c
    text: |-
      de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25b
  - number: 25b.2
    text: |-
      De onderneming bewaart de in het eerste lid, onderdelen a, b en c, bedoelde gegevens gedurende vijf jaar, gerekend
      vanaf het einde van het boekjaar waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25b
  - number: 25c
    text: |-
      [Artikel 25b, eerste lid][ref1], is niet van toepassing op activiteiten die onder de toepassing vallen van
      specifieke door de Europese Gemeenschap vastgestelde bepalingen inzake een gescheiden administratie, andere dan die
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25d.1
    text: |-
      [Artikel 25b, eerste lid][ref1], is voorts niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25d.1.a
    text: |-
      ondernemingen die diensten verrichten welke de handel tussen lidstaten niet op merkbare wijze ongunstig kunnen
      beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
  - number: 25d.1.b
    text: |-
      ondernemingen waarvan de totale nettojaaromzet minder dan € 40 miljoen heeft bedragen gedurende de twee boekjaren
      voorafgaande aan het boekjaar waarin de onderneming een bijzonder of uitsluitend recht heeft genoten dat
      overeenkomstig artikel 86, eerste lid, van het Verdrag is verleend of waarin zij is belast met het beheer van een
      dienst van algemeen economisch belang overeenkomstig artikel 86, tweede lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
  - number: 25d.1.c
    text: |-
      ondernemingen die voor een redelijke periode met het beheer van een dienst van algemeen economisch belang belast
      zijn overeenkomstig artikel 86, tweede lid, van het Verdrag, indien de overheidssteun in enigerlei vorm, waaronder
      een subsidie, ondersteuning of compensatie, die zij ontvangen, was vastgesteld ingevolge een open, doorzichtige en
      niet-discriminerende procedure.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
  - number: 25d.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt ten aanzien van openbare kredietinstellingen de
      nettojaaromzet vervangen door een balanstotaal van minder dan € 800 miljoen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
  - number: 25d.3
    text: |-
      Het in het eerste lid, onderdeel b, en het in het tweede lid genoemde bedrag kunnen bij regeling van Onze
      Minister worden gewijzigd indien de wijziging voortvloeit uit een bindend besluit van een orgaan van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25d
  - number: 25e
    text: |-
      Indien de Commissie van de Europese Gemeenschappen verzoekt om terbeschikkingstelling van gegevens als bedoeld in
      [artikel 25b, eerste lid][ref1], verstrekt de onderneming die dit aangaat, de raad op diens verzoek binnen de door
      hem gestelde termijn de desbetreffende gegevens. De raad doet de gegevens toekomen aan de Commissie van de Europese
      Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25f
    text: |-
      Indien de goede uitvoering van de richtlijn dat vereist, kunnen bij regeling van Onze Minister nadere regels worden
      gesteld inzake de toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel25f
  - number: '26'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder zeggenschap verstaan de mogelijkheid om op grond van feitelijke of
      juridische omstandigheden een beslissende invloed uit te oefenen op de activiteiten van een onderneming.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel26
  - number: '27'
    text: 'Onder een concentratie wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: 27.a
    text: het fuseren van twee of meer voorheen van elkaar onafhankelijke ondernemingen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: 27.b
    text: het direct of indirect verkrijgen van zeggenschap door
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: 27.b.1°
    text: een of meer natuurlijke personen of rechtspersonen die reeds zeggenschap over ten minste een onderneming hebben, of
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: 27.b.2°
    text: |-
      een of meer ondernemingen over een of meer andere ondernemingen of delen daarvan door middel van de verwerving
      van participaties in het kapitaal of van vermogensbestanddelen, uit hoofde van een overeenkomst of op enige andere
      wijze;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: 27.c
    text: |-
      de totstandbrenging van een gemeenschappelijke onderneming die duurzaam alle functies van een zelfstandige
      economische eenheid vervult, en die er niet toe leidt dat de oprichtende ondernemingen hun marktgedrag coördineren.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel27
  - number: '28.1'
    text: |-
      In afwijking van [artikel 27][ref1] wordt niet als concentratie beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 28.1.a
    text: |-
      het door kredietinstellingen of andere financiële instellingen als bedoeld
      in [artikel 1, eerste lid, onderdelen ][ref1], verzekeraars als bedoeld in
      [artikel 1, onderdeel h, van de Wet toezicht verzekeringsbedrijf 1993][ref2] of verzekeraars als bedoeld
      in [artikel 1, onderdeel c, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3], tot wier normale
      werkzaamheden de verhandeling van effecten voor eigen rekening of voor rekening van derden behoort, tijdelijk
      houden van deelnemingen die zij in een onderneming hebben verworven ten einde deze deelnemingen weer te verkopen,
      mits zij de aan deze deelnemingen verbonden stemrechten niet uitoefenen om het marktgedrag van deze onderneming te
      bepalen, of zij deze stemrechten slechts uitoefenen om de verkoop van deze deelnemingen voor te bereiden, en deze
      verkoop plaatsvindt binnen een jaar na de verwerving;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '1'
  - number: 28.1.b
    text: het verkrijgen van zeggenschap door
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
  - number: 28.1.b.1°
    text: |-
      curatoren als bedoeld in [artikel 68, eerste lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel68
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '68'
  - number: 28.1.b.2°
    text: |-
      bewindvoerders als bedoeld in [artikel 215, tweede lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel215
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '215'
  - number: 28.1.b.3°
    text: |-
      personen als bedoeld in [artikel 28, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel28
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '28'
  - number: 28.1.b.4°
    text: |-
      bewindvoerders als bedoeld in [artikel 71, zevende lid, van de Wet toezicht kredietwezen 1992][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel71
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '71'
  - number: 28.1.b.5°
    text: |-
      personen als bedoeld in [artikel 54, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel54
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '54'
  - number: 28.1.b.6°
    text: |-
      bewindvoerders als bedoeld in [artikel 161, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel161
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '161'
  - number: 28.1.b.7°
    text: |-
      personen als bedoeld in [artikel 161, negende lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel161
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '161'
  - number: 28.1.b.8°
    text: |-
      personen als bedoeld in [artikel 27, derde lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '27'
  - number: 28.1.b.9°
    text: |-
      bewindvoerders als bedoeld in [artikel 70, eerste lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel70
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '70'
  - number: 28.1.b.10°
    text: |-
      personen als bedoeld in [artikel 70, negende lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007477#Artikel70
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007477
        artikel: '70'
  - number: 28.1.c
    text: |-
      het verwerven van participaties in het kapitaal als bedoeld in [artikel 27, onder b][ref1], door
      participatiemaatschappijen mits de aan de deelname verbonden stemrechten slechts worden uitgeoefend om de volle
      waarde van deze beleggingen veilig te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '28.2'
    text: |-
      De in het eerste lid, onder a, genoemde termijn kan op verzoek door de raad worden verlengd wanneer de
      desbetreffende instellingen of verzekeraars aantonen dat de verkoop binnen de gestelde termijn redelijkerwijs niet
      mogelijk was.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel28
  - number: '29.1'
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op concentraties waarbij de gezamenlijke omzet van de betrokken
      ondernemingen in het voorafgaande kalenderjaar meer bedroeg dan € 113 450 000, waarvan door ten minste twee van de
      betrokken ondernemingen ieder ten minste € 30 000 000 in Nederland is behaald.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel29
  - number: '29.2'
    text: De in het eerste lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel29
  - number: '29.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen de in het eerste lid bedoelde bedragen voor een bij die algemene
      maatregel van bestuur te bepalen categorie van ondernemingen voor een periode van ten hoogste vijf jaar worden
      verlaagd. Deze periode kan telkens bij algemene maatregel van bestuur worden verlengd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel29
  - number: '30.1'
    text: |-
      De berekening van de omzet, bedoeld in [artikel 29, eerste lid][ref1], geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '30.2'
    text: |-
      Wanneer de concentratie tot stand wordt gebracht door middel van de verwerving van de zeggenschap over delen van
      een of meer ondernemingen, welke delen al dan niet eigen rechtspersoonlijkheid bezitten, wordt bij de berekening
      van de omzet, bedoeld in [artikel 29, eerste lid][ref1], ten aanzien van de vervreemder of de vervreemders
      uitsluitend rekening gehouden met de omzet van de te vervreemden delen die voorwerp zijn van de transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid worden voor de berekening van de omzet van een betrokken onderneming
      als bedoeld in [artikel 29, eerste lid][ref1], de omzetten van de volgende ondernemingen opgeteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 30.3.a
    text: de betrokken onderneming;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.b
    text: 'de ondernemingen waarin de betrokken onderneming rechtstreeks of middellijk:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.b.1°
    text: meer dan de helft van het kapitaal of de bedrijfsactiva bezit, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.b.2°
    text: de bevoegdheid heeft meer dan de helft van de stemrechten uit te oefenen, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.b.3°
    text: |-
      de bevoegdheid heeft meer dan de helft van de leden van de raad van toezicht of van bestuur, of van de krachtens de
      wet tot vertegenwoordiging bevoegde organen te benoemen, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.b.4°
    text: het recht heeft de onderneming te leiden;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.c
    text: |-
      ondernemingen die in een betrokken onderneming over de in onderdeel *b* genoemde rechten of bevoegdheden
      beschikken;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.d
    text: |-
      ondernemingen waarin een in onderdeel c bedoelde onderneming over de in onderdeel *b* genoemde rechten of
      bevoegdheden beschikt;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.3.e
    text: |-
      ondernemingen waarbij ten minste twee ondernemingen als bedoeld in de onderdelen *a* tot en met *d* gezamenlijk
      over de in onderdeel *b* genoemde rechten of bevoegdheden beschikken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: '30.4'
    text: |-
      Indien bij de concentratie betrokken ondernemingen gezamenlijk beschikken over de in het derde lid, onderdeel *b*,
      genoemde rechten of bevoegdheden, wordt voor de berekening van de omzet van de betrokken ondernemingen als bedoeld
      in [artikel 29, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 30.4.a
    text: |-
      geen rekening gehouden met de omzet, die het resultaat is van de verkoop van produkten en het leveren van diensten
      tussen de gemeenschappelijke onderneming en elk van de betrokken ondernemingen of van enige andere met de betrokken
      onderneming verbonden onderneming als bedoeld in het derde lid, onderdelen *b* tot en met *e*;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: 30.4.b
    text: |-
      rekening gehouden met de omzet die het resultaat is van de verkoop van produkten en het verlenen van diensten
      tussen de gemeenschappelijke onderneming en derde ondernemingen. Deze omzet wordt aan de ondernemingen toegerekend
      in verhouding tot hun deelnemingen in de gemeenschappelijke onderneming.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
  - number: '30.5'
    text: |-
      Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 29, eerste lid][ref1], worden transacties tussen de in het derde lid bedoelde ondernemingen buiten
      beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Voor de toepassing van [artikel 29, eerste lid][ref1], wordt ten aanzien van kredietinstellingen
      en financiële instellingen in de zin van de [Wet toezicht kredietwezen 1992][ref2]
      de omzet vervangen door een tiende deel van de vaste en vlottende activa, bedoeld in
      [artikel 364, tweede en derde lid, van boek 2 van het Burgerlijk Wetboek][ref3] aan het slot van het voorafgaande
      boekjaar, waarvan voor ten minste € 22 690 000 materiële vaste activa in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005792
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel364
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005792
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '364'
  - number: '31.2'
    text: |-
      Voor verzekeraars in de zin van de [Wet toezicht verzekeringsbedrijf 1993][ref1] of de
      [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2] wordt voor de toepassing van
      [artikel 29, eerste lid][ref3], de omzet vervangen door de waarde van de bruto geboekte premies in het voorafgaande
      boekjaar, waarvan voor ten minste € 4 540 000 ontvangen van Nederlandse ingezetenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0007477
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0007477
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '34'
    text: |-
      Het is verboden een concentratie tot stand te brengen voordat het voornemen daartoe aan de raad is gemeld en
      vervolgens vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel34
  - number: '35.1'
    text: |-
      Bij een melding worden de bij algemene maatregel van bestuur aangewezen gegevens verstrekt.
      [Artikel 4:4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '35.2'
    text: |-
      Indien niet is voldaan aan het eerste lid of indien de verstrekte gegevens onvoldoende zijn voor de beoordeling van
      een melding, kan de raad van degene die de melding heeft gedaan, aanvulling van de melding verlangen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel35
  - number: '35.3'
    text: |-
      Door een onderneming bij de melding verstrekte gegevens die door die onderneming als vertrouwelijk zijn aangemerkt,
      worden niet eerder openbaar gemaakt dan nadat een week is verstreken na de bekendmaking van de daartoe strekkende
      beschikking van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel35
  - number: '35.4'
    text: |-
      Indien met betrekking tot de in het derde lid bedoelde beschikking van de raad een verzoek om een voorlopige
      voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] is gedaan, wordt de termijn,
      genoemd in de [artikelen 34][ref2] en [37, eerste en derde lid][ref3], opgeschort tot de dag waarop de
      schriftelijke uitspraak van de voorzieningenrechter van de rechtbank, bedoeld in [artikel 93, eerste lid][ref4],
      is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel93
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '93'
        hoofdstuk: '12'
  - number: '36'
    text: Van een ontvangen melding wordt door de raad zo spoedig mogelijk mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel36
  - number: '37.1'
    text: |-
      De raad deelt binnen vier weken na het ontvangen van een melding mede of voor het tot stand brengen van de
      concentratie, waarop die melding betrekking heeft, een vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel37
  - number: '37.2'
    text: |-
      De raad kan bepalen dat voor een concentratie een vergunning is vereist, indien hij reden heeft om aan te nemen
      dat als gevolg van die concentratie een economische machtspositie kan ontstaan of worden versterkt die tot gevolg
      heeft dat een daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan op significante wijze wordt
      belemmerd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel37
  - number: '37.3'
    text: |-
      Indien niet binnen vier weken toepassing is gegeven aan het eerste lid is voor de concentratie geen
      vergunning vereist. De in de vorige volzin bedoelde termijn vangt aan met ingang van de eerstvolgende dag
      na ontvangst van de melding die niet een zaterdag, zondag of algemeen erkende feestdag is in de zin van de
      [Algemene termijnenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '37.4'
    text: |-
      Door de mededeling van de raad dat voor een concentratie geen vergunning is vereist, houdt het in
      [artikel 34][ref1] vervatte verbod met betrekking tot die concentratie op te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '37.5'
    text: Van een mededeling van de raad als bedoeld in het eerste lid wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel37
  - number: '38'
    text: |-
      De in de [artikelen 34][ref1] en [37, eerste en derde lid][ref2], genoemde termijn van vier weken wordt opgeschort
      met ingang van de dag waarop de raad op grond van [artikel 35, tweede lid][ref3], aanvulling van de melding
      verlangt tot de dag waarop die aanvulling is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel35
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '39.1'
    text: |-
      [Artikel 34][ref1] geldt niet in geval van een openbaar overname of ruilaanbod gericht op het verkrijgen van een
      deelname in het kapitaal van een onderneming, mits daarvan onverwijld aan de raad melding wordt gedaan, en de
      verkrijger de aan de deelname in het kapitaal verbonden stemrechten niet uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '39.2'
    text: |-
      Indien de raad ter zake van een melding als bedoeld in het eerste lid mededeelt dat op grond van
      [artikel 37, eerste lid][ref1], een vergunning is vereist, dient de concentratie:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 39.2.a
    text: |-
      indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel39
  - number: 39.2.b
    text: |-
      indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel39
  - number: '39.3'
    text: |-
      De raad kan, op verzoek van degene die een melding heeft gedaan als bedoeld in het eerste lid, bepalen dat, in
      afwijking van het eerste lid, de in dat lid bedoelde stemrechten mogen worden uitgeoefend om de volle waarde van
      diens belegging te handhaven.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel39
  - number: '40.1'
    text: |-
      De raad kan om gewichtige redenen op verzoek van degene die een melding heeft gedaan, ontheffing verlenen van het
      in [artikel 34][ref1] gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '40.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel40
  - number: '40.3'
    text: |-
      Indien de raad na het verlenen van een ontheffing als bedoeld in het eerste lid ter zake van de betrokken melding
      mededeelt dat op grond van [artikel 37, eerste lid][ref1], een vergunning is vereist, en de concentratie tot stand
      is gebracht voor de mededeling daarvan, dient de concentratie:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 40.3.a
    text: |-
      indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel40
  - number: 40.3.b
    text: |-
      indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel40
  - number: '41.1'
    text: |-
      Het is verboden zonder vergunning een concentratie tot stand te brengen, waarop een mededeling op grond van
      [artikel 37, eerste lid][ref1], dat een vergunning is vereist, betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '41.2'
    text: |-
      Een vergunning wordt geweigerd, indien als gevolg van de voorgenomen concentratie een economische machtspositie zal
      ontstaan of worden versterkt die tot gevolg heeft dat een daadwerkelijke mededinging op de Nederlandse markt of een
      deel daarvan op significante wijze wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel41
  - number: '41.3'
    text: |-
      Indien ten minste een van de bij een concentratie betrokken ondernemingen bij wettelijk voorschrift of door
      een bestuursorgaan is belast met het beheer van diensten van algemeen economisch belang, kan een vergunning
      slechts worden geweigerd indien de weigering van die vergunning de vervulling van de hun toevertrouwde taak niet
      verhindert.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel41
  - number: '41.4'
    text: Een vergunning kan onder beperkingen worden verleend; aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel41
  - number: '42.1'
    text: Een aanvraag om vergunning wordt ingediend bij de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel42
  - number: '42.2'
    text: Bij algemene maatregel van bestuur kan worden bepaald welke gegevens bij een aanvraag dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel42
  - number: '42.3'
    text: |-
      Door een onderneming bij de aanvraag verstrekte gegevens die door die onderneming als vertrouwelijk zijn
      aangemerkt, worden niet eerder openbaar gemaakt dan nadat een week is verstreken na de bekendmaking van de daartoe
      strekkende beschikking van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel42
  - number: '42.4'
    text: |-
      Indien met betrekking tot de in het derde lid bedoelde beschikking van de raad een verzoek om een voorlopige
      voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] is gedaan, wordt de termijn,
      genoemd in [artikel 44, eerste lid][ref2], opgeschort tot de dag waarop de schriftelijke uitspraak van de
      voorzieningenrechter van de rechtbank, bedoeld in [artikel 93, eerste lid][ref3], is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel93
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '93'
        hoofdstuk: '12'
  - number: '42.5'
    text: Van een ontvangen aanvraag wordt door de raad zo spoedig mogelijk mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel42
  - number: '43'
    text: |-
      Een onderneming verstrekt desgevraagd aan de raad de inlichtingen omtrent bedrijfsgegevens van die onderneming, die
      voor de beoordeling van een aanvraag om een vergunning redelijkerwijs nodig zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel43
  - number: '44.1'
    text: |-
      De raad geeft zijn beschikking op de aanvraag binnen dertien weken na ontvangst van die aanvraag. Het niet binnen
      dertien weken geven van een beschikking wordt gelijkgesteld met het verlenen van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel44
  - number: '44.2'
    text: |-
      Indien een aanvraag is ingediend voordat blijkens een mededeling van de raad voor de desbetreffende concentratie
      een vergunning is vereist, wordt deze niet in behandeling genomen alvorens die mededeling is bekendgemaakt. De in
      het eerste lid genoemde termijn vangt aan op het moment van die bekendmaking.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel44
  - number: '44.3'
    text: |-
      De beschikking wordt, nadat zij is bekendgemaakt, ter inzage gelegd bij de mededingingsautoriteit. Gegevens die
      ingevolge [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking in aanmerking komen, worden
      niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '44.4'
    text: Van de beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel44
  - number: '45'
    text: |-
      De raad kan een vergunning intrekken indien de verstrekte gegevens zodanig onjuist waren dat op de aanvraag anders
      zou zijn beslist als de juiste gegevens wel bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel45
  - number: '46.1'
    text: |-
      De raad kan om gewichtige redenen op verzoek van degene die een vergunning heeft aangevraagd, ontheffing verlenen
      van het in [artikel 41, eerste lid][ref1], gestelde verbod tot op die aanvraag onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel41
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '46.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel46
  - number: '46.3'
    text: |-
      Indien nadat een ontheffing is verleend als bedoeld in het eerste lid de aanvraag om een vergunning wordt
      ingetrokken of de vergunning wordt geweigerd, dient de concentratie, voor zover deze dan reeds is tot stand
      gebracht, binnen dertien weken ongedaan te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel46
  - number: '46.4'
    text: |-
      Indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, dient de
      concentratie, voor zover deze dan reeds is tot stand gebracht, binnen dertien weken daarmee in overeenstemming te
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel46
  - number: '47.1'
    text: |-
      Onze Minister kan, nadat de raad een vergunning voor het tot stand brengen van een concentratie heeft geweigerd,
      op een daartoe strekkende aanvraag besluiten die vergunning te verlenen indien naar zijn oordeel gewichtige redenen
      van algemeen belang die zwaarder wegen dan de te verwachten belemmering van de mededinging, daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel47
  - number: '47.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid kan worden gedaan tot vier weken nadat de beschikking van de raad om een
      vergunning te weigeren onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel47
  - number: '47.3'
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is gedaan wordt de behandeling van beroepschriften inzake de
      beschikking van de raad opgeschort, totdat op die aanvraag onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel47
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke gegevens bij een tot Onze Minister gerichte aanvraag om
      een vergunning dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel48
  - number: '49.1'
    text: |-
      Onze Minister geeft zijn beschikking op een aanvraag, in overeenstemming met het gevoelen van de ministerraad,
      binnen acht weken na ontvangst van die aanvraag.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel49
  - number: '49.2'
    text: |-
      [Artikel 44, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel44
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '50.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van de raad
      aangewezen ambtenaren van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel50
  - number: '50.2'
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren beschikken met het oog op de toepassing van de bevoegdheid van de
      raad, bedoeld in [artikel 9, eerste lid][ref1], [artikel 13, tweede lid][ref2], [artikel 15, tweede lid][ref3], en
      [artikel 89a, eerste lid][ref4], over de bevoegdheden, die hun zijn toegekend ter uitoefening van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel89a
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: 89a
        hoofdstuk: '10'
  - number: '50.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel50
  - number: '51'
    text: |-
      [Artikel 5:17 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op geschriften met betrekking tot
      de toepassing van mededingingsregels, gewisseld tussen een onderneming en een advocaat die is toegelaten tot
      de balie, die zich bij de onderneming bevinden, doch waarop, indien zij zich zouden bevinden bij die advocaat,
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '52.1'
    text: |-
      Met het onderzoek zijn belast de krachtens [artikel 50, eerste lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '52.2'
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf worden toegekend,
      alsmede, met inachtneming van de daaraan in deze paragraaf gestelde beperkingen, over de bevoegdheden die hun zijn
      toegekend ter uitoefening van het toezicht, bedoeld in [artikel 50, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '53'
    text: |-
      Indien de in [artikel 52, eerste lid][ref1], bedoelde ambtenaren een redelijk vermoeden hebben dat een bepaalde
      onderneming of ondernemersvereniging een overtreding heeft begaan, is er geen verplichting aan de zijde van die
      onderneming of ondernemersvereniging ter zake een verklaring af te leggen. De betrokkenen worden hiervan in kennis
      gesteld voordat hun mondeling ter zake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '54'
    text: |-
      De in [artikel 52, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd om bedrijfsruimten en voorwerpen te
      verzegelen gedurende de tijd gelegen tussen 18.00 en 8.00 uur, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 54a
    text: |-
      De werkzaamheden in verband met de uitvoering van de [artikelen 60][ref1], [61][ref2], [62][ref3], [78][ref4]
      en [79][ref5] worden verricht door personen die niet betrokken zijn geweest bij de opstelling van het in
      [artikel 59, eerste lid][ref6], onderscheidenlijk [77, eerste lid][ref7], bedoelde rapport en het daaraan
      voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel78
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel79
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel59
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Artikel77
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '60'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '78'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '79'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0008691
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '55'
    text: |-
      De in [artikel 52, eerste lid][ref1], bedoelde ambtenaren oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheid zo nodig uit met behulp van de sterke
      arm.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '56.1'
    text: |-
      Ingeval van overtreding van [artikel 6, eerste lid][ref1], of van [artikel 24, eerste lid][ref2], kan de raad de
      natuurlijke persoon of rechtspersoon aan wie de overtreding kan worden toegerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 56.1.a
    text: een boete opleggen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
  - number: 56.1.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
  - number: '56.2'
    text: Een boete en een last onder dwangsom kunnen te zamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
  - number: '56.3'
    text: |-
      De raad legt geen boete op indien de natuurlijke persoon of rechtspersoon aan wie de overtreding kan worden
      toegerekend aannemelijk maakt dat hem van de overtreding geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
  - number: '56.4'
    text: |-
      Een bestuurder van een rechtspersoon wordt niet beschouwd als een natuurlijke persoon als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel56
  - number: '57.1'
    text: |-
      De in [artikel 56, eerste lid, onder a][ref1], bedoelde boete bedraagt ten hoogste € 450 000, of, indien dat
      meer is, 10% van de omzet van de onderneming dan wel, indien de overtreding door een ondernemersvereniging is
      begaan, van de gezamenlijke omzet van de daarvan deel uitmakende ondernemingen, in het boekjaar voorafgaande aan
      de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '57.2'
    text: |-
      Bij de vaststelling van de hoogte van de boete houdt de raad in ieder geval rekening met de ernst en de duur van
      de overtreding.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel57
  - number: '57.3'
    text: |-
      De berekening van de omzet, bedoeld in het eerste lid, geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '58.1'
    text: |-
      Een last onder dwangsom als bedoeld in [artikel 56, eerste lid, onder b][ref1], strekt ertoe de overtreding
      ongedaan te maken of verdere overtreding dan wel herhaling van de overtreding te voorkomen. Aan een last kunnen
      voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '58.2'
    text: Een last geldt voor een door de raad te bepalen termijn van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel58
  - number: '58.3'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34, eerste lid][ref3], en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '59.1'
    text: |-
      Indien de raad na afloop van het onderzoek een redelijk vermoeden heeft dat een overtreding als bedoeld in
      [artikel 56, eerste lid][ref1], is begaan en dat daarvoor een boete of een last onder dwangsom dient te worden
      opgelegd, doet hij een rapport opmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '59.2'
    text: 'In het rapport worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: 59.2.a
    text: de feiten en omstandigheden op grond waarvan is vastgesteld dat een overtreding is begaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: 59.2.b
    text: waar en wanneer de onder*a*bedoelde feiten en omstandigheden zich hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: 59.2.c
    text: de onderneming of ondernemersvereniging die de overtreding heeft begaan;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: 59.2.d
    text: de natuurlijke persoon of rechtspersoon die de overtreding kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: 59.2.e
    text: het overtreden wettelijk voorschrift.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: '59.3'
    text: |-
      Een afschrift van het rapport wordt toegezonden aan de in het tweede lid, onder *c*, bedoelde onderneming of
      ondernemersvereniging.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: '59.4'
    text: |-
      Op verzoek van de belanghebbende die het rapport wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende
      begrijpt, draagt de raad er zoveel mogelijk zorg voor dat de inhoud van het rapport aan de betrokkene wordt
      meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel59
  - number: '60.1'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] worden de belanghebbenden schriftelijk
      opgeroepen om naar keuze schriftelijk of mondeling hun zienswijze naar voren te brengen omtrent het in
      [artikel 59, eerste lid][ref2], bedoelde rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel59
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '60.2'
    text: |-
      Het rapport en alle verder op de zaak betrekking hebbende stukken worden gedurende een periode van ten minste vier
      weken voor belanghebbenden ter inzage gelegd. Bij de in het eerste lid bedoelde oproeping wordt vermeld waar en
      wanneer de stukken ter inzage zullen liggen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel60
  - number: '60.3'
    text: |-
      De [artikelen 3:11, tweede en derde lid][ref1], en [3:16, van de Algemene wet bestuursrecht][ref2] zijn van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '60.4'
    text: |-
      Indien een onderneming of ondernemersvereniging als bedoeld in [artikel 59, tweede lid, onder c][ref1], haar
      zienswijze mondeling naar voren brengt, draagt de raad er op verzoek van degene die de Nederlandse taal onvoldoende
      begrijpt, zorg voor dat een tolk wordt benoemd die de betrokkene bij het horen kan bijstaan, tenzij redelijkerwijs
      kan worden aangenomen dat daaraan geen behoefte bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel59
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '61.1'
    text: Belanghebbenden worden zo nodig in de gelegenheid gesteld te reageren op de naar voren gebrachte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel61
  - number: '61.2'
    text: Van hetgeen mondeling naar voren is gebracht, wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel61
  - number: '62.1'
    text: De raad beslist bij beschikking omtrent het opleggen van een boete of een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
  - number: '62.2'
    text: 'In de beschikking waarbij een boete of een last onder dwangsom wordt opgelegd, worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
  - number: 62.2.a
    text: |-
      indien een boete wordt opgelegd: de te betalen geldsom, alsmede een toelichting op de hoogte daarvan, met
      inachtneming van [artikel 57, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel57
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 62.2.b
    text: 'indien een last wordt opgelegd: de inhoud van de last en de termijn waarvoor deze geldt;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
  - number: 62.2.c
    text: de overtreding ter zake waarvan de boete of last wordt opgelegd, alsmede het overtreden wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
  - number: 62.2.d
    text: |-
      de in [artikel 59, tweede lid][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel59
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '62.3'
    text: |-
      Op verzoek van degene tot wie de beschikking is gericht, die de beschikking wegens zijn gebrekkige kennis van
      de Nederlandse taal onvoldoende begrijpt, draagt de raad er zoveel mogelijk zorg voor dat de in die beschikking
      vermelde informatie aan hem wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel62
  - number: '63.1'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 62, eerste lid][ref1], wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel62
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '63.2'
    text: |-
      Het eerste lid geldt niet voor zover in de beschikking een last onder dwangsom is opgelegd, en de raad zulks in de
      beschikking uitdrukkelijk heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel63
  - number: '64'
    text: |-
      De bevoegdheid tot het opleggen van een boete of een last onder dwangsom als bedoeld in
      [artikel 56, eerste lid][ref1], vervalt vijf jaren nadat de overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '65.1'
    text: |-
      Een beschikking als bedoeld in [artikel 62, eerste lid][ref1], wordt, nadat zij is bekendgemaakt, ter inzage gelegd
      bij de mededingingsautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel62
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '65.2'
    text: |-
      Van de beschikking wordt mededeling gedaan in de *Staatscourant*. Gegevens die ingevolge
      [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking in aanmerking komen, worden niet ter
      inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '66.1'
    text: De raad kan een last onder dwangsom wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel66
  - number: '66.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad, alvorens toepassing te
      geven aan het eerste lid, belanghebbenden in de gelegenheid schriftelijk of mondeling hun zienswijze kenbaar te
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '67.1'
    text: |-
      Een boete wordt betaald binnen dertien weken nadat de beschikking waarbij de boete is opgelegd, in werking is
      getreden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel67
  - number: '67.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop de in het eerste lid genoemde
      termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel67
  - number: '67.3'
    text: |-
      Indien niet is betaald binnen de in het eerste lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, verhoogd met de krachtens het tweede lid
      verschuldigde rente en de kosten van de aanmaning, te betalen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel67
  - number: '68.1'
    text: |-
      Bij gebreke van betaling binnen de in [artikel 67, derde lid][ref1], bedoelde termijn van twee weken kan de raad
      de verschuldigde boete, verhoogd met de krachtens [artikel 67, tweede lid][ref2], verschuldigde rente en de op de
      aanmaning en invordering betrekking hebbende kosten, invorderen bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel67
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '67'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '67'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: '68.2'
    text: |-
      Het dwangbevel wordt op kosten van degene die de boete is verschuldigd bij deurwaardersexploit betekend en levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '68.3'
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel68
  - number: '68.4'
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel68
  - number: '69.1'
    text: |-
      De raad kan degene die jegens de in [artikel 50, eerste lid][ref1], [artikel 52, eerste lid][ref2],
      of [artikel 89g, eerste lid][ref3], bedoelde ambtenaren in strijd handelt met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4], een boete opleggen van ten hoogste € 450 000,-
      of, indien het een onderneming of een ondernemersvereniging betreft en indien dat meer is, van ten hoogste 1% van
      de omzet van de onderneming, onderscheidenlijk van de gezamenlijke omzet van de ondernemingen die van de vereniging
      deel uitmaken, in het boekjaar voorafgaande aan de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel89g
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
