        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '69.2'
    text: |-
      De raad legt geen boete op indien de belanghebbende aannemelijk maakt dat hem van de overtreding geen verwijt kan
      worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel69
  - number: '69.3'
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '69.4'
    text: |-
      [Artikel 57, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel57
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '70.1'
    text: |-
      Ingeval de in [artikel 69, eerste lid][ref1], bedoelde overtreding een weigering inhoudt medewerking te verlenen
      aan de toepassing van [artikel 5:17, eerste lid, van de Algemene wet bestuursrecht][ref2] kan de raad een last
      onder dwangsom opleggen om inzage te verlenen in in die last aangegeven zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '70.2'
    text: |-
      Een boete als bedoeld in [artikel 69, eerste lid][ref1], en een last als bedoeld in het eerste lid van dit artikel,
      kunnen te zamen worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel69
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70
    references:
