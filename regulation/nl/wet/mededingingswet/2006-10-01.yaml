  - number: '105.2'
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van
      [artikel 24][ref1] is gemaakt onderscheidenlijk ingesteld met betrekking tot een beschikking, genomen op grond van
      artikel 24, eerste lid, onder *b*, of artikel 27, eerste lid, van de Wet economische mededinging, blijft het recht
      zoals het gold voor dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '105.3'
    text: |-
      Ten aanzien van het instellen van beroep tegen een op grond van het tweede lid gegeven beschikking op bezwaar
      en ten aanzien van de behandeling van het beroep, blijft het recht zoals het gold voor het tijdstip van
      inwerkingtreding van [artikel 24][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '106'
    text: |-
      De straffen en maatregelen, gesteld op overtredingen van voorschriften gesteld bij of krachtens de Wet economische
      mededinging, die een economisch delict opleveren en die zijn begaan voor het tijdstip waarop [artikel 94][ref1] in
      werking treedt, blijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel94
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '94'
        hoofdstuk: '13'
  - number: '107.1'
    text: |-
      De hoofdstukken van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende hoofdstukken of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel107
  - number: '107.3'
    text: |-
      [Artikel 32][ref1] vervalt twee jaar na het tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel32
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '110'
    text: 'Deze wet wordt aangehaald als: Mededingingswet.'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel110
