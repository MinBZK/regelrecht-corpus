  - number: 70a.1
    text: |-
      De raad kan ingeval van overtreding van [artikel 25b, eerste, tweede of derde lid][ref1], of van
      [artikel 25e, eerste volzin][ref2], de natuurlijke persoon of rechtspersoon aan wie de overtreding kan worden
      toegerekend:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25e
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel70a
    references:
