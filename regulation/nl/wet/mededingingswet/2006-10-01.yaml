        paragraaf: 1a
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '71'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '72'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0008691
        artikel: '73'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0008691
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref9
        bwb_id: BWBR0008691
        artikel: '75'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '82'
    text: |-
      De bevoegdheid tot het opleggen van een boete als bedoeld in de [artikelen 69, eerste lid][ref1], [71][ref2],
      [72][ref3], [73][ref4], [74, eerste lid, onder ][ref5], en [75, eerste lid, onder ][ref6], vervalt twee jaren nadat
      de overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel73
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel74
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel75
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '71'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008691
