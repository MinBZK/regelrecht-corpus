        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0008691
        artikel: '75'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref8
        bwb_id: BWBR0008691
        artikel: '70'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref9
        bwb_id: BWBR0008691
        artikel: 70a
        hoofdstuk: '8'
        paragraaf: 1a
      - id: ref10
        bwb_id: BWBR0008691
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref11
        bwb_id: BWBR0008691
        artikel: '75'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: '79.2'
    text: 'In de beschikking worden in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
  - number: 79.2.a
    text: 'indien een boete wordt opgelegd: de te betalen geldsom, alsmede een toelichting op de hoogte daarvan;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
  - number: 79.2.b
    text: 'indien een last wordt opgelegd: de inhoud van de last en de termijn waarvoor deze geldt;'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
  - number: 79.2.c
    text: |-
      de in [artikel 77, tweede lid][ref1], bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel77
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '79.3'
    text: |-
      Op verzoek van degene tot wie de beschikking is gericht, die de beschikking wegens zijn gebrekkige kennis van
      de Nederlandse taal onvoldoende begrijpt, draagt de raad er zoveel mogelijk zorg voor dat de in die beschikking
      vermelde informatie aan de betrokkene wordt meegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
  - number: '79.4'
    text: |-
      De beschikking dient te worden gegeven binnen dertien weken nadat een rapport als bedoeld in
      [artikel 77, eerste lid][ref1], is opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel77
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '80.1'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 79, eerste lid][ref1], wordt opgeschort totdat de
      beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel79
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '79'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '80.2'
    text: |-
      Het eerste lid geldt niet voorzover in de beschikking een last onder dwangsom is opgelegd, en de raad zulks in de
      beschikking uitdrukkelijk heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel80
  - number: '81'
    text: |-
      De [artikelen 67][ref1] en [68][ref2] zijn van toepassing op de in de [artikelen 69, eerste lid][ref3],
      [70a, eerste lid, onder a][ref4], [71][ref5], [72][ref6], [73][ref7], [74, eerste lid, onder ][ref8], en
      [75, eerste lid, onder ][ref9], bedoelde boete.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel70a
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel71
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel72
      [ref7]: https://wetten.overheid.nl/BWBR0008691#Artikel73
      [ref8]: https://wetten.overheid.nl/BWBR0008691#Artikel74
      [ref9]: https://wetten.overheid.nl/BWBR0008691#Artikel75
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '67'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
