        hoofdstuk: '8'
        paragraaf: '2'
  - number: 82a
    text: |-
      De bevoegdheid tot het opleggen van een boete of een last onder dwangsom als bedoeld in
      [artikel 70a, eerste lid][ref1], vervalt vijf jaren nadat de overtreding is begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel70a
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 70a
        hoofdstuk: '8'
        paragraaf: 1a
  - number: '83.1'
    text: |-
      De raad kan een voorlopige last onder dwangsom opleggen, indien naar zijn voorlopig oordeel aannemelijk is dat
      [artikel 6, eerste lid][ref1], of [artikel 24, eerste lid][ref2], is overtreden, en onverwijlde spoed, gelet op de
      belangen van de door de overtreding getroffen ondernemingen of het belang van instandhouding van een daadwerkelijke
      mededinging, dat vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '83.2'
    text: |-
      Een voorlopige last verplicht de natuurlijke persoon of rechtspersoon, aan wie de overtreding voorshands kan worden
      toegerekend, tot het verrichten of nalaten van in die last omschreven feitelijke gedragingen of rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel83
  - number: '83.3'
    text: |-
      De [artikelen 5:32, vierde en vijfde lid][ref1], [5:33][ref2], [5:34, eerste lid][ref3], en
      [5:35 van de Algemene wet bestuursrecht][ref4] zijn van overeenkomstige toepassing op de in het eerste lid bedoelde
      last.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '84.1'
    text: |-
      De raad deelt zijn voornemen een voorlopige last op te leggen schriftelijk en met redenen omkleed mee aan de
      belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel84
  - number: '84.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad belanghebbenden in
      de gelegenheid schriftelijk of mondeling hun zienswijze kenbaar te maken over het in het eerste lid bedoelde
      voornemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '85.1'
    text: De raad beslist zo spoedig mogelijk bij beschikking omtrent het opleggen van een voorlopige last.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel85
  - number: '85.2'
    text: Indien een voorlopige last wordt opgelegd, kan de raad in zijn beschikking bepalen wanneer deze vervalt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel85
  - number: '85.3'
    text: 'De voorlopige last vervalt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel85
  - number: 85.3.a
    text: |-
      indien niet binnen zes maanden nadat de beschikking is gegeven een rapport als bedoeld in
      [artikel 59, eerste lid][ref1], is opgemaakt, op het tijdstip waarop die zes maanden zijn verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel59
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 85.3.b
    text: |-
      indien binnen de onder *a* bedoelde termijn het daar bedoelde rapport is opgemaakt, zodra een beschikking als
      bedoeld in [artikel 62, eerste lid][ref1], is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel62
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '86'
    text: |-
      Op een beschikking omtrent een voorlopige last is [artikel 65][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel65
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '65'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '87.1'
    text: De raad kan een voorlopige last opheffen of wijzigen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel87
  - number: '87.2'
    text: |-
      De [artikelen 84][ref1], [85][ref2] en [86][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel86
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '84'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '85'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '86'
        hoofdstuk: '9'
  - number: '88'
    text: |-
      De raad wordt aangemerkt als de mededingingsautoriteit voor Nederland in de zin van [verordening 1/2003](onbekend)
      en als bevoegde autoriteit in de zin van [verordening 139/2004](onbekend) en oefent de krachtens de verordeningen
      op grond van artikel 83 van het Verdrag bestaande bevoegdheid uit om de artikelen 81 en 82 van het Verdrag
      toe te passen, alsmede de krachtens artikel 84 van het Verdrag bestaande bevoegdheid om te beslissen over de
      toelaatbaarheid van mededingingsafspraken en over het misbruik maken van een machtspositie op de gemeenschappelijke
      markt.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel88
  - number: '89'
    text: |-
      Ter zake van de uitoefening van de in [artikel 88][ref1] bedoelde bevoegdheden zijn de [hoofdstukken 6][ref2],
      [7][ref3] en [9][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '88'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0008691
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0008691
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0008691
        hoofdstuk: '9'
  - number: 89a.1
    text: |-
      De raad oefent de krachtens [artikel 29, tweede lid][ref1], van [verordening 1/2003](onbekend) bestaande
      bevoegdheid uit tot het buiten toepassing verklaren van een groepsvrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 89a.2
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 89a.3
    text: |-
      Een beschikking op grond van het eerste lid treedt niet eerder in werking dan zes weken na de datum van haar
      terinzagelegging overeenkomstig [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 89b.1
    text: |-
      Met het verlenen van bijstand bij een inspectie op grond van een mededingingsverordening door de Commissie van de
      Europese Gemeenschappen, zijn belast de krachtens [artikel 50, eerste lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 89b.2
    text: |-
      [Artikel 5:12 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 89b.3
    text: |-
      Bij verzet tegen een inspectie door de Commissie van de Europese Gemeenschappen, verlenen de aangewezen ambtenaren
      de nodige bijstand om de Commissie van de Europese Gemeenschappen in staat te stellen de inspectie te verrichten,
      zo nodig met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89b
  - number: 89c.1
    text: |-
      Voor het verlenen van de nodige bijstand indien een onderneming of ondernemersvereniging zich verzet tegen een
      inspectie op grond van een mededingingsverordening door de Commissie van de Europese Gemeenschappen is voor zover
      de inspectie een doorzoeking omvat, een voorafgaande machtiging vereist van de rechter-commissaris, belast met de
      behandeling van strafzaken bij de rechtbank te Rotterdam. De machtiging wordt zo mogelijk getoond.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89c
  - number: 89c.2
    text: |-
      De rechter-commissaris gaat bij de toetsing van het verzoek tot machtiging na of de voorgenomen dwangmaatregelen
      niet willekeurig zijn of onevenredig zijn in verhouding tot het voorwerp van de inspectie, zoals is bepaald in de
      mededingingsverordeningen en het gemeenschapsrecht. [Artikel 171 van het Wetboek van Strafvordering][ref1] is van
      overeenkomstige toepassing. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89c
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 89c.3
    text: De rechter-commissaris kan bij de inspectie aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89c
  - number: 89d.1
    text: |-
      Voor het uitvoeren van een inspectie als bedoeld in artikel 21, eerste lid, van [verordening 1/2003](onbekend)
      door de Commissie van de Europese Gemeenschappen in andere gebouwen, terreinen en vervoermiddelen dan die
      van ondernemingen en ondernemersverenigingen, waaronder de woningen van directeuren, bestuurders en andere
      personeelsleden, is een voorafgaande machtiging vereist van de rechter-commissaris, belast met de behandeling van
      strafzaken bij de rechtbank te Rotterdam. De machtiging wordt zo mogelijk getoond.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89d
  - number: 89d.2
    text: |-
      De rechter-commissaris toetst het verzoek tot machtiging overeenkomstig artikel 21, derde lid, van de verordening.
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89d
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 89d.3
    text: De rechter-commissaris kan bij de inspectie aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89d
  - number: 89d.4
    text: |-
      Voor zover het een inspectie in een woning betreft, geldt dit artikel in afwijking van de [artikelen 2][ref1],
      [3][ref2] en [8 van de Algemene wet op het binnentreden][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel8
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89d
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '8'
  - number: 89e.1
    text: |-
      Een machtiging als bedoeld in [artikel 89c, eerste lid][ref1], of [artikel 89d, eerste lid][ref2], is met redenen
      omkleed en ondertekend en vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel89c
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel89d
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 89c
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 89d
        hoofdstuk: '10'
  - number: 89e.1.a
    text: de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
  - number: 89e.1.b
    text: de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
  - number: 89e.1.c
    text: de beschikking waarbij de Commissie van de Europese Gemeenschappen de inspectie heeft gelast;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
  - number: 89e.1.d
    text: de dagtekening.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
  - number: 89e.2
    text: De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
  - number: 89e.3
    text: |-
      Voor zover het een inspectie in een woning betreft, geldt dit artikel in afwijking van
      [artikel 6 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89e
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '6'
  - number: 89f.1
    text: |-
      De ambtenaar die bijstand heeft verleend bij een inspectie in een woning of bij een doorzoeking van een andere
      plaats dan een woning, maakt op zijn ambtseed of -belofte een schriftelijk verslag op omtrent de inspectie.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2
    text: 'In het verslag vermeldt hij:'
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.a
    text: zijn naam of nummer en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.b
    text: de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.c
    text: de beschikking waarbij de Commissie van de Europese Gemeenschappen de inspectie heeft gelast;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.d
    text: de plaats van de inspectie en de naam van degene bij wie de inspectie is verricht;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.e
    text: de wijze van binnentreden en het tijdstip waarop de inspectie is begonnen en is beëindigd;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.f
    text: hetgeen tijdens de inspectie is verricht en overigens is voorgevallen;
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.2.g
    text: de namen of nummers en de hoedanigheid van de overige personen die aan de inspectie hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.3
    text: |-
      Het verslag wordt uiterlijk op de vierde dag na die waarop de inspectie is beëindigd, toegezonden aan de rechter-
      commissaris die de machtiging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.4
    text: |-
      Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop de inspectie is beëindigd, aan degene
      bij wie de inspectie is verricht, uitgereikt of toegezonden. Indien het doel van de inspectie daartoe noodzaakt,
      kan deze uitreiking of toezending worden uitgesteld. Uitreiking of toezending geschiedt in dat geval, zodra
      het belang van dit doel het toestaat. Indien het niet mogelijk is het afschrift uit te reiken of toe te zenden,
      houdt de rechter-commissaris of de ambtenaar die de bijstand heeft verleend, het afschrift gedurende zes maanden
      beschikbaar voor degene bij wie de inspectie is verricht.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
  - number: 89f.5
    text: |-
      Voor zover het een inspectie in een woning betreft, geldt dit artikel in afwijking van de [artikelen 10][ref1] en
      [11 van de Algemene wet op het binnentreden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89f
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '11'
  - number: 89g.1
    text: |-
      Met het verrichten van een inspectie op grond van een mededingingsverordening door de mededingingsautoriteit op
      verzoek van de Commissie van de Europese Gemeenschappen, zijn belast de krachtens [artikel 50, eerste lid][ref1],
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89g
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 89g.2
    text: |-
      De aangewezen ambtenaren beschikken voor het verrichten van de inspectie over de bevoegdheden die hun ingevolge
      [hoofdstuk 6][ref1] zijn toegekend ter uitoefening van toezicht en onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89g
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '6'
  - number: 89h.1
    text: |-
      De raad of de Commissie van de Europese Gemeenschappen kan, niet optredende als partij, bij de behandeling van
      een beroep bij de administratieve rechter schriftelijke opmerkingen maken ingevolge artikel 15, derde lid, eerste
      alinea, van [verordening 1/2003](onbekend), indien de raad of de Commissie van de Europese Gemeenschappen de wens
      daartoe te kennen heeft gegeven. De rechter kan daarvoor een termijn bepalen. Met toestemming van de rechter kunnen
      zij ter zitting ook mondelinge opmerkingen maken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89h
  - number: 89h.2
    text: |-
      Op een verzoek ingevolge artikel 15, derde lid, tweede alinea, van [verordening 1/2003](onbekend) verstrekt de
      rechter aan de raad en de Commissie van de Europese Gemeenschappen alle in die bepaling bedoelde stukken. Partijen
      kunnen binnen een door de rechter te bepalen termijn hun mening geven over de te verstrekken stukken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89h
  - number: 89h.3
    text: |-
      Partijen kunnen binnen een door de rechter te bepalen termijn reageren op de opmerkingen van de raad of de
      Commissie van de Europese Gemeenschappen. De rechter kan partijen in staat stellen op elkaars opmerkingen te
      reageren.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89h
  - number: 89i.1
    text: |-
      Indien de administratieve rechter inlichtingen of advies wil vragen ingevolge artikel 15, eerste lid, van
      [verordening 1/2003](onbekend), doet hij aan partijen schriftelijk opgave van de te stellen vragen en de te
      verzenden stukken.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89i
  - number: 89i.2
    text: |-
      Partijen kunnen binnen een door de rechter te bepalen termijn schriftelijk hun mening omtrent de te stellen vragen
      en de te verzenden stukken geven.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89i
  - number: 89i.3
    text: De griffier zendt een afschrift van het antwoord op het verzoek om inlichtingen of van het advies aan partijen.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89i
  - number: 89i.4
    text: |-
      Partijen kunnen binnen een door de rechter te bepalen termijn hun mening over het antwoord of het advies geven.
      [Artikel 8:29 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89i
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 89j
    text: |-
      Ingevolge artikel 15, tweede lid, van [verordening 1/2003](onbekend) verstrekt de griffier onverwijld een afschrift
      van de uitspraak van de administratieve rechter met betrekking tot de toepassing van de artikelen 81 en 82 van het
      Verdrag aan de Commissie van de Europese Gemeenschappen. De verstrekking geschiedt, behalve wanneer het arresten
      of beschikkingen van de Hoge Raad of uitspraken van de Afdeling bestuursrechtspraak van de Raad van State betreft,
      door tussenkomst van de Raad voor de rechtspraak. Wanneer naar het oordeel van de administratieve rechter de
      bescherming van zwaarwegende belangen van partijen of van derden daartoe aanleiding geeft, kan de griffier volstaan
      met verstrekking van een geanonimiseerd afschrift van de uitspraak.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel89j
  - number: '90'
    text: |-
      Gegevens of inlichtingen omtrent een onderneming, welke in verband met enige werkzaamheid ten behoeve van de
      uitvoering van deze wet zijn verkregen, met uitzondering van inlichtingen als bedoeld in artikel 28, eerste
      lid, van [verordening 1/2003](onbekend) en artikel 17, eerste lid, van [verordening 139/2004](onbekend), mogen
      uitsluitend voor de toepassing van deze wet, de mededingingsverordeningen, de [Elektriciteitswet 1998][ref1] en de
      [Gaswet][ref2] worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: '91'
    text: |-
      In afwijking van [artikel 90][ref1] is de raad bevoegd gegevens of inlichtingen, verkregen bij de uitoefening
      van de hem in deze wet opgedragen taken, te verstrekken aan: 1°. een buitenlandse instelling, die op grond
      van nationale wettelijke regels is belast met de toepassing van mededingingsregels, voor zover die gegevens
      of inlichtingen van betekenis zijn of kunnen zijn voor de uitoefening van de taak van die instelling en
      de verstrekking ervan naar het oordeel van de raad in het belang is van de Nederlandse economie, 2°. een
      bestuursorgaan dat op grond van een andere wettelijke regeling dan deze wet is belast met taken die de toepassing
      of mede de toepassing van bepalingen omtrent mededinging betreffen, voor zover die gegevens of inlichtingen
      van betekenis zijn of kunnen zijn voor de uitoefening van de genoemde taken van dat bestuursorgaan, mits a. de
      geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd, en b. voldoende is gewaarborgd dat
      de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel90
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '90'
        hoofdstuk: '11'
  - number: '92.1'
    text: |-
      Over een bezwaar tegen een beschikking als bedoeld in [artikel 62, eerste lid][ref1], adviseert een commissie als
      bedoeld in [artikel 7:13 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '92.2'
    text: |-
      De leden van de in het eerste lid bedoelde adviescommissie zijn niet werkzaam bij het Ministerie van Economische
      Zaken of bij de mededingingsautoriteit. Een lid van de raad kan evenmin deel uitmaken van een dergelijke
      adviescommissie.
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel92
  - number: '93.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '93.2'
    text: |-
      Ten aanzien van besluiten als bedoeld in de [artikelen 37, eerste lid][ref1], en [44, eerste lid][ref2], blijft
      [artikel 7:1 van de Algemene wet bestuursrecht][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 93a.1
    text: |-
      Overeenkomstig bij of krachtens algemene maatregel van bestuur te stellen regels is een vergoeding verschuldigd
      voor het geven van een beschikking als bedoeld in de [artikelen 25][ref1], [37][ref2], [40][ref3], [44][ref4],
      [46][ref5] en [47][ref6] voor ten hoogste de kosten die gemoeid zijn met het geven van die beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0008691#Artikel47
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: '46'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0008691
        artikel: '47'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 93a.2
    text: |-
      Een vergoeding als bedoeld in het eerste lid is verschuldigd door de aanvrager, dan wel, indien sprake is van een
      beschikking op grond van de [artikelen 37][ref1] of [40][ref2], door degene die de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel40
    url: https://wetten.overheid.nl/BWBR0008691/2006-10-01#Artikel93a
    references:
      - id: ref1
