        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '15.3'
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
    references:
      - id: ref1
