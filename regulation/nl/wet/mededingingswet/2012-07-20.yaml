        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De raad kan op een overeenkomst tussen ondernemingen, een besluit van een ondernemersvereniging of een onderling
      afgestemde feitelijke gedraging van ondernemingen waarop krachtens het eerste lid [artikel 6, eerste lid][ref1],
      niet van toepassing is, bij beschikking alsnog [artikel 6, eerste lid][ref2], van toepassing verklaren,
      indien zich omstandigheden voordoen als die welke krachtens de desbetreffende verordening kunnen leiden tot de
      buitentoepassingverklaring van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
