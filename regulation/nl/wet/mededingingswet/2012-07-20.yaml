  - number: '15.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen, dat
      [artikel 6, eerste lid][ref1], niet geldt voor in die maatregel omschreven categorieën van overeenkomsten,
      besluiten en gedragingen als bedoeld in dat artikel, die bijdragen tot verbetering van de produktie of van de
      distributie of tot bevordering van de technische of economische vooruitgang, mits een billijk aandeel in de daaruit
      voortvloeiende voordelen de gebruikers ten goede komt, en zonder nochtans aan de betrokken ondernemingen


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 15.1.a
    text: beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
  - number: 15.1.b
    text: |-
      de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
  - number: '15.2'
    text: |-
      In een algemene maatregel van bestuur als bedoeld in het eerste lid kan worden bepaald dat de raad op een
      overeenkomst, besluit of gedraging waarvoor krachtens die maatregel [artikel 6, eerste lid][ref1], niet geldt, bij
      beschikking alsnog [artikel 6, eerste lid][ref2], van toepassing kan verklaren, indien wordt voldaan aan de in die
      algemene maatregel van bestuur genoemde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
