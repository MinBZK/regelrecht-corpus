---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mededingingswet
regulatory_layer: WET
publication_date: '2021-08-31'
valid_from: '2012-07-20'
bwb_id: BWBR0008691
url: https://wetten.overheid.nl/BWBR0008691/2012-07-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vervanging van de Wet economische mededinging
    nieuwe regels vast te stellen omtrent mededingingsafspraken en economische machtsposities, alsmede om regels te
    stellen omtrent toezicht op concentraties van ondernemingen, en daarbij zoveel mogelijk aan te sluiten bij de
    regels betreffende de mededinging krachtens het Verdrag tot oprichting van de Europese Gemeenschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.b
    text: |-
      mededingingsautoriteit: de Nederlandse Mededingingsautoriteit, genoemd in [artikel 2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel2
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.c
    text: 'raad: de raad van bestuur van de mededingingsautoriteit;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.d
    text: 'Verdrag: het Verdrag tot oprichting van de Europese Gemeenschap;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.e
    text: 'overeenkomst: een overeenkomst in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.f
    text: 'onderneming: een onderneming in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.g
    text: 'ondernemersvereniging: een ondernemersvereniging in de zin van artikel 81, eerste lid, van het Verdrag;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.h
    text: |-
      onderling afgestemde feitelijke gedragingen: onderling afgestemde feitelijke gedragingen in de zin van artikel 81,
      eerste lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.i
    text: |-
      economische machtspositie: positie van een of meer ondernemingen die hen in staat stelt de instandhouding van een
      daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan te verhinderen door hun de mogelijkheid
      te geven zich in belangrijke mate onafhankelijk van hun concurrenten, hun leveranciers, hun afnemers of de
      eindgebruikers te gedragen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.j
    text: |-
      onderzoek: handelingen die worden verricht met het oog op de vaststelling dat al dan niet een overtreding is
      begaan;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.k
    text: |-
      [verordening 1/2003](onbekend): [verordening (EG) nr. 1/2003](onbekend) van de Raad van de Europese Unie van 16
      december 2002 betreffende de uitvoering van de mededingingsregels van de artikelen 81 en 82 van het Verdrag (PbEG
      2003, L 1);
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.l
    text: |-
      [verordening 139/2004](onbekend): [verordening (EG) nr. 139/2004](onbekend) van de Raad van de Europese Unie van 20
      januari 2004 betreffende de controle op concentraties van ondernemingen (PbEG L 24);
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.m
    text: 'mededingingsverordening: verordening genoemd in de onderdelen k en l;'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: 1.n
    text: |-
      consumentenorganisaties: stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun statuten tot
      taak hebben het behartigen van de collectieve belangen van consumenten.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel1
  - number: '2.1'
    text: Er is een Nederlandse Mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel2
  - number: '2.2'
    text: De raad van bestuur vormt het bestuur van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel2
  - number: '2.3'
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing, met uitzondering van
      [artikel 22 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '3.1'
    text: De raad bestaat uit drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel3
  - number: '3.2'
    text: Benoeming vindt plaats op grond van deskundigheid op het gebied van de taken waarmee de raad is belast.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel3
  - number: '3.3'
    text: |-
      De voorzitter wordt benoemd voor een periode van zeven jaar en de overige leden worden benoemd voor een periode van
      vijf jaar. De voorzitter en de leden kunnen eenmaal worden herbenoemd voor eenzelfde periode.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel3
  - number: '4'
    text: |-
      Een lid van de raad heeft geen financiële of andere belangen bij ondernemingen waardoor zijn onpartijdigheid in het
      geding kan zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel4
  - number: 4b.1
    text: |-
      De raad stelt een bestuursreglement vast, waarin in ieder geval regels over de werkwijze en procedures zijn
      opgenomen. In het reglement worden tevens regels opgenomen over de verdeling van de werkzaamheden bij de
      voorbereiding van de besluiten van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel4b
  - number: 4b.2
    text: Het bestuursreglement wordt na de goedkeuring van Onze Minister bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel4b
  - number: '5'
    text: |-
      De raad is belast met taken ter uitvoering van deze wet, alsmede ter uitvoering van andere wetten, voor zover dat
      in de desbetreffende wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5
  - number: 5a.1
    text: |-
      Onze Minister stelt ten behoeve van de uitvoering van de in [artikel 5][ref1] bedoelde taken personeel ter
      beschikking van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5a.2
    text: De raad stelt een mandaatregeling op ten aanzien van de bevoegdheden van het personeel.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
  - number: 5a.3
    text: |-
      In de mandaatregeling worden regels gesteld omtrent het verlenen van een algemeen mandaat met betrekking tot de
      uitvoering van de [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2] en kunnen regels worden gesteld in het kader
      van de uitvoering van andere wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 5a.4
    text: |-
      De raad voorziet in een specifieke organisatorische eenheid die wordt belast met uitvoering en toezicht op de
      [Elektriciteitswet 1998][ref1] en de [Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
      [ref2]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009755
      - id: ref2
        bwb_id: BWBR0011440
  - number: 5a.5
    text: |-
      De in het tweede lid bedoelde regeling behoeft de goedkeuring van Onze Minister. Onze Minister onthoudt zijn
      goedkeuring indien naar zijn oordeel de mandaatregeling een goede taakuitoefening door de raad kan belemmeren. De
      regeling wordt na goedkeuring door de raad bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
  - number: 5a.6
    text: |-
      Indien Onze Minister van oordeel is dat de mandaatregeling een goede taakuitoefening belemmert, kan hij de raad
      verzoeken de mandaatregeling te wijzigen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
  - number: 5a.7
    text: |-
      Indien de raad binnen drie maanden geen gevolg heeft gegeven aan een verzoek als bedoeld in het zesde lid kan Onze
      Minister de raad opdragen de mandaatregeling op een door hem gewenste wijze aan te passen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5a
  - number: 5b.1
    text: |-
      Onze Minister kan de raad opdragen werkzaamheden te verrichten in het kader van de uitvoering van regelgeving op
      het gebied van de mededinging op grond van het Verdrag, voor zover daarin niet reeds bij of krachtens de wet is
      voorzien, alsmede werkzaamheden op het gebied van de mededinging in verband met andere verdragen of internationale
      afspraken.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5b
  - number: 5b.2
    text: |-
      Onze Minister kan de raad instructies geven met betrekking tot het verrichten van de in het eerste lid bedoelde
      werkzaamheden, alsmede met betrekking tot het door de raad in te nemen standpunt in een adviescomité als bedoeld
      in artikel 14, tweede lid, van [verordening 1/2003](onbekend) en artikel 19, vierde lid, van [verordening 139/2004]
      (onbekend), met dien verstande dat een instructie inzake een standpunt in een adviescomité geen betrekking heeft op
      de mededingingsaspecten van een individueel geval.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5b
  - number: 5c.1
    text: |-
      Onze Minister kan, al dan niet op verzoek van een van Onze andere Ministers, de raad opdragen een rapportage uit
      te brengen inzake de effecten voor de mededinging van voorgenomen of geldende regelgeving of van een voorgenomen of
      een geldend besluit.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5c
  - number: 5c.2
    text: De raad kan een in het eerste lid bedoelde rapportage ook uit eigen beweging uitbrengen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5c
  - number: 5c.3
    text: Het uitbrengen van een rapportage aan een van Onze andere Ministers geschiedt door tussenkomst van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5c
  - number: 5c.4
    text: |-
      Op verzoek van een of beide Kamers van de Staten-Generaal brengt de raad met tussenkomst van Onze Minister een
      rapportage uit aan de beide Kamers der Staten-Generaal. Onze Minister zendt de rapportage onverwijld naar de beide
      Kamers der Staten-Generaal. Onze Minister kan de rapportage doen vergezellen van zijn bevindingen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5c
  - number: 5d
    text: |-
      Beleidsregels met betrekking tot de uitoefening van de in deze wet aan de raad toegekende bevoegdheden
      kunnen betrekking hebben of mede betrekking hebben op de wijze waarop de raad bij toepassing van
      [artikel 6, derde lid][ref1], andere belangen dan economische belangen in zijn afweging moet betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5e
    text: |-
      Onze Minister kan, nadat de raad in de gelegenheid is gesteld zijn opmerkingen te maken, nadere regels
      vaststellen met betrekking tot de in [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] bedoelde
      gegevensuitwisseling tussen Onze Minister en de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5e
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '20'
  - number: 5f
    text: |-
      Indien de raad bij werkzaamheden ten behoeve van de uitvoering van een andere wet als bedoeld in [artikel 5][ref1]
      die onder verantwoordelijkheid van een van Onze andere Ministers valt, zijn taak ernstig verwaarloost, treft Onze
      Minister de in [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref2] bedoelde voorzieningen
      na overleg met Onze andere Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5f
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 5g.1
    text: |-
      Het jaarverslag, bedoeld in [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], heeft
      betrekking op de uitvoering van deze wet en op de uitvoering van andere wetten als bedoeld in [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5g
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5g.2
    text: Het verslag wordt in voorkomend geval mede gezonden aan Onze andere Minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5g
  - number: 5g.3
    text: |-
      Bij de toezending van het jaarverslag aan de beide Kamers der Staten-Generaal op grond van
      [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] voegt Onze Minister zijn bevindingen
      daaromtrent alsmede de bevindingen van Onze andere Minister, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5g
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 5h
    text: |-
      Voor zover het verslag, bedoeld in [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1],
      betrekking heeft op de werkzaamheden ten behoeve van de uitvoering van een andere wet als bedoeld in
      [artikel 5][ref2], stelt Onze Minister het verslag op na overleg met Onze andere Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5h
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 5l.1
    text: De raad legt voorgenomen beleidsregels ten minste vier weken voor vaststelling daarvan aan Onze Minister voor.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5l
  - number: 5l.2
    text: |-
      Indien de voorgenomen beleidsregels naar het oordeel van Onze Minister in strijd zijn met het belang van een goede
      taakuitoefening door de raad, deelt Onze Minister dit gemotiveerd mee aan de raad binnen twee weken nadat de regels
      aan hem zijn voorgelegd.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5l
  - number: 5l.3
    text: |-
      Indien Onze Minister een kennisgeving als bedoeld in het tweede lid heeft gedaan, stelt de raad de beleidsregels
      niet vast.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5l
  - number: 5l.4
    text: De raad maakt door hem vastgestelde beleidsregels bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel5l
  - number: '6.1'
    text: |-
      Verboden zijn overeenkomsten tussen ondernemingen, besluiten van ondernemersverenigingen en onderling afgestemde
      feitelijke gedragingen van ondernemingen, die ertoe strekken of ten gevolge hebben dat de mededinging op de
      Nederlandse markt of een deel daarvan wordt verhinderd, beperkt of vervalst.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: '6.2'
    text: De krachtens het eerste lid verboden overeenkomsten en besluiten zijn van rechtswege nietig.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: '6.3'
    text: |-
      Het eerste lid geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke gedragingen die
      bijdragen tot verbetering van de productie of van de distributie of tot bevordering van de technische of
      economische vooruitgang, mits een billijk aandeel in de daaruit voortvloeiende voordelen de gebruikers ten goede
      komt, en zonder nochtans aan de betrokken ondernemingen
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: 6.3.a
    text: beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: 6.3.b
    text: |-
      de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: '6.4'
    text: Een onderneming of ondernemersvereniging die zich op het derde lid beroept, bewijst dat aan dat lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel6
  - number: '7.1'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke
      gedragingen als bedoeld in dat artikel indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.1.a
    text: |-
      bij de desbetreffende overeenkomst of onderling afgestemde feitelijke gedraging niet meer dan acht ondernemingen
      betrokken zijn, dan wel bij de desbetreffende ondernemersvereniging niet meer dan acht ondernemingen betrokken
      zijn, en
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: 7.1.b
    text: |-
      de gezamenlijke omzet in het voorafgaande kalenderjaar van de bij de desbetreffende overeenkomst of onderling
      afgestemde feitelijke gedraging betrokken ondernemingen dan wel de gezamenlijke omzet van de bij de desbetreffende
      ondernemersvereniging betrokken ondernemingen niet hoger is dan:
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: 7.1.b.1°
    text: |-
      € 5 500 000, indien daarbij uitsluitend ondernemingen zijn betrokken wier activiteiten zich in hoofdzaak richten op
      het leveren van goederen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: 7.1.b.2°
    text: € 1 100 000, in alle andere gevallen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: '7.2'
    text: |-
      Onverminderd het eerste lid, geldt [artikel 6, eerste lid][ref1], voorts niet voor overeenkomsten, besluiten
      en onderling afgestemde feitelijke gedragingen als bedoeld in dat artikel voor zover daarbij ondernemingen of
      ondernemersverenigingen betrokken zijn die daadwerkelijke of potentiële concurrenten zijn op een of meer van de
      relevante markten, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.2.a
    text: |-
      het gezamenlijke marktaandeel van de bij de overeenkomst, het besluit of de onderling afgestemde feitelijke
      gedraging betrokken ondernemingen of ondernemersverenigingen op geen van de relevante markten waarop de
      overeenkomst, het besluit of de onderling afgestemde feitelijke gedraging van invloed is, groter is dan 10%, en
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: 7.2.b
    text: |-
      de overeenkomst, het besluit of de onderling afgestemde feitelijke gedraging de handel tussen lidstaten niet op
      merkbare wijze ongunstig kan beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: '7.3'
    text: |-
      In geval van afzonderlijke overeenkomsten tussen een onderneming of een ondernemersvereniging en twee of
      meer andere ondernemingen, die dezelfde strekking hebben, worden voor de toepassing van het eerste lid die
      overeenkomsten tezamen beschouwd als één overeenkomst.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: '7.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen, dat
      [artikel 6, eerste lid][ref1], niet van toepassing is op in die maatregel omschreven categorieën van
      overeenkomsten, besluiten of gedragingen als bedoeld in dat artikel, die in het algemeen vanuit een oogpunt van
      mededinging van duidelijk ondergeschikte betekenis zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '7.5'
    text: |-
      Het in het eerste lid, onder a, genoemde aantal en de in het eerste lid, onder b, genoemde bedragen kunnen bij
      algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel7
  - number: '8.1'
    text: |-
      De berekening van de omzet, bedoeld in [artikel 7, eerste lid, onder b][ref1], geschiedt op de voet van het
      bepaalde in [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '8.2'
    text: |-
      Indien een onderneming behoort tot een groep als bedoeld in
      [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1] worden voor de berekening van de omzet van die
      onderneming de omzetten van alle tot die groep behorende ondernemingen opgeteld. Bij deze berekening worden
      transacties tussen de tot die groep behorende ondernemingen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '8.3'
    text: |-
      Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 7, eerste lid, onder b][ref1], worden de transacties tussen die ondernemingen buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De raad kan op een overeenkomst tussen ondernemingen, een besluit van een ondernemersvereniging of een onderling
      afgestemde feitelijke gedraging van ondernemingen waarop krachtens [artikel 7, eerste, tweede of vierde lid][ref1],
      [artikel 6, eerste lid][ref2], niet van toepassing is, bij beschikking alsnog [artikel 6, eerste lid][ref3], van
      toepassing verklaren, indien die overeenkomst, dat besluit of die gedraging gezien de marktverhoudingen op de
      relevante markt in aanzienlijke mate afbreuk doet aan de mededinging.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '9.3'
    text: |-
      De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10'
    text: |-
      [Artikel 6][ref1] geldt niet voor overeenkomsten, besluiten en gedragingen als bedoeld in dat artikel die
      rechtstreeks verbonden zijn aan een concentratie als bedoeld in [artikel 27][ref2], en noodzakelijk zijn voor de
      verwezenlijking van de desbetreffende concentratie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '11'
    text: |-
      Voor overeenkomsten, besluiten en gedragingen als bedoeld in [artikel 6, eerste lid][ref1], waarbij ten minste
      een onderneming of ondernemersvereniging betrokken is die bij wettelijk voorschrift of door een bestuursorgaan
      is belast met het beheer van diensten van algemeen economisch belang, geldt [artikel 6, eerste lid][ref2], voor
      zover de toepassing van dat artikel de vervulling van de aan die onderneming of ondernemersvereniging toevertrouwde
      bijzondere taak niet verhindert.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen waarvoor krachtens een
      verordening van de Raad van de Europese Unie of een verordening van de Commissie van de Europese Gemeenschappen
      artikel 81, eerste lid, van het Verdrag buiten toepassing is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.1'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen die de handel tussen de
      lid-staten van de Europese Gemeenschappen niet ongunstig kunnen beïnvloeden of waardoor de mededinging binnen de
      gemeenschappelijke markt niet wordt verhinderd, beperkt of vervalst doch die, indien dat wel het geval zou zijn,
      zouden zijn vrijgesteld krachtens een verordening als bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel12
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel13
