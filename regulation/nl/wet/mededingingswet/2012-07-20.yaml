        afdeling: '3.4'
  - number: '15.4'
    text: |-
      De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '16'
    text: |-
      [Artikel 6, eerste lid][ref1], geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 16.a
    text: |-
      een collectieve arbeidsovereenkomst als bedoeld in
      [artikel 1, eerste lid, van de Wet op de collectieve arbeidsovereenkomst][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001937#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001937
        artikel: '1'
  - number: 16.b
    text: |-
      een overeenkomst in een bedrijfstak tussen een of meer werkgeversorganisaties en een of meer werknemersorganisaties
      uitsluitend met betrekking tot pensioen als bedoeld in [artikel 1 van de Pensioenwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 16.c
    text: |-
      een overeenkomst of besluit van een organisatie van beoefenaren van een vrij beroep houdende uitsluitend de deelname
      aan een beroepspensioenregeling als bedoeld in [artikel 1 van de Wet verplichte beroepspensioenregeling][ref1],
      indien overeenkomstig [artikel 5 van die wet][ref2], met betrekking tot een zodanige regeling een verzoek is
      ingediend tot verplichtstelling door Onze Minister van Sociale Zaken en Werkgelegenheid en het verzoek niet is
      afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '5'
  - number: '24.1'
    text: Het is ondernemingen verboden misbruik te maken van een economische machtspositie.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel24
  - number: '24.2'
    text: |-
      Het tot stand brengen van een concentratie als omschreven in [artikel 27][ref1] wordt niet aangemerkt als het
      misbruik maken van een economische machtspositie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Voor zover de toepassing van [artikel 24, eerste lid][ref1], de vervulling van bij wettelijk voorschrift of door
      een bestuursorgaan aan een onderneming opgedragen beheer van een dienst van algemeen economisch belang verhindert,
      kan de raad op aanvraag verklaren dat [artikel 24, eerste lid][ref2], niet van toepassing is op een daarbij
      aangewezen gedraging.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Een beschikking als bedoeld in het eerste lid kan onder beperkingen worden gegeven; aan een beschikking kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25
  - number: 25a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.a
    text: |-
      richtlijn: richtlijn nr. 2006/111/EG van de Commissie van de Europese Gemeenschappen van 16 november 2006 (PbEG
      L 318) betreffende de doorzichtigheid in de financiële betrekkingen tussen lidstaten en openbare bedrijven en de
      financiële doorzichtigheid binnen bepaalde ondernemingen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.b
    text: |-
      uitsluitend recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.c
    text: |-
      bijzonder recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.c.1°
    text: |-
      het aantal van deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een andere
      wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.c.2°
    text: |-
      verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens deze criteria worden aangewezen, of
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.c.3°
    text: |-
      aan een of meer ondernemingen op een andere wijze dan volgens deze criteria voordelen worden toegekend waardoor
      enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde
      geografische gebied onder in wezen gelijkwaardige voorwaarden uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25a.d
    text: |-
      verschillende activiteiten: enerzijds producten of diensten met betrekking tot welke aan een onderneming een
      bijzonder of uitsluitend recht is verleend, of alle diensten van algemeen economisch belang waarmee een onderneming
      is belast en, anderzijds, elk ander afzonderlijk product met betrekking tot hetwelk of elke andere afzonderlijke
      dienst met betrekking tot welke de onderneming werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25a
  - number: 25b.1
    text: |-
      Ondernemingen waaraan overeenkomstig artikel 86, eerste lid, van het Verdrag een bijzonder of uitsluitend recht is
      verleend of die overeenkomstig artikel 86, tweede lid, van het Verdrag met het beheer van een dienst van algemeen
      economisch belang zijn belast en met betrekking tot deze dienst in enigerlei vorm compensatie ontvangen, en die
      verschillende activiteiten uitvoeren, houden een zodanige administratie bij dat:
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25b
  - number: 25b.1.a
    text: de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25b
  - number: 25b.1.b
    text: |-
      alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25b
  - number: 25b.1.c
    text: |-
      de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25b
  - number: 25b.2
    text: |-
      De onderneming bewaart de in het eerste lid, onderdelen a, b en c, bedoelde gegevens gedurende vijf jaar, gerekend
      vanaf het einde van het boekjaar waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25b
  - number: 25c
    text: |-
      [Artikel 25b, eerste lid][ref1], is niet van toepassing op activiteiten die onder de toepassing vallen van
      specifieke door de Europese Gemeenschap vastgestelde bepalingen inzake een gescheiden administratie, andere dan die
      van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25d.1
    text: |-
      [Artikel 25b, eerste lid][ref1], is voorts niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25d.1.a
    text: |-
      ondernemingen die diensten verrichten welke de handel tussen lidstaten niet op merkbare wijze ongunstig kunnen
      beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
  - number: 25d.1.b
    text: |-
      ondernemingen waarvan de totale nettojaaromzet minder dan € 40 miljoen heeft bedragen gedurende de twee boekjaren
      voorafgaande aan het boekjaar waarin de onderneming een bijzonder of uitsluitend recht heeft genoten dat
      overeenkomstig artikel 86, eerste lid, van het Verdrag is verleend of waarin zij is belast met het beheer van een
      dienst van algemeen economisch belang overeenkomstig artikel 86, tweede lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
  - number: 25d.1.c
    text: |-
      ondernemingen die voor een redelijke periode met het beheer van een dienst van algemeen economisch belang belast
      zijn overeenkomstig artikel 86, tweede lid, van het Verdrag, indien de overheidssteun in enigerlei vorm, waaronder
      een subsidie, ondersteuning of compensatie, die zij ontvangen, was vastgesteld ingevolge een open, doorzichtige en
      niet-discriminerende procedure.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
  - number: 25d.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel b, wordt ten aanzien van openbare banken de nettojaaromzet
      vervangen door een balanstotaal van minder dan € 800 miljoen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
  - number: 25d.3
    text: |-
      Het in het eerste lid, onderdeel b, en het in het tweede lid genoemde bedrag kunnen bij regeling van Onze
      Minister worden gewijzigd indien de wijziging voortvloeit uit een bindend besluit van een orgaan van de Europese
      Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25d
  - number: 25e
    text: |-
      Indien de Commissie van de Europese Gemeenschappen verzoekt om terbeschikkingstelling van gegevens als bedoeld in
      [artikel 25b, eerste lid][ref1], verstrekt de onderneming die dit aangaat, de raad op diens verzoek binnen de door
      hem gestelde termijn de desbetreffende gegevens. De raad doet de gegevens toekomen aan de Commissie van de Europese
      Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25f
    text: |-
      Indien de goede uitvoering van de richtlijn dat vereist, kunnen bij regeling van Onze Minister nadere regels worden
      gesteld inzake de toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25f
  - number: 25g.1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder overheidsbedrijf:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.1.a
    text: |-
      een onderneming met privaatrechtelijke rechtspersoonlijkheid, niet zijnde een personenvennootschap met
      rechtspersoonlijkheid, waarin een publiekrechtelijke rechtspersoon, al dan niet tezamen met een of meer andere
      publiekrechtelijke rechtspersonen, in staat is het beleid te bepalen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.1.b
    text: een onderneming in de vorm van een personenvennootschap, waarin een publiekrechtelijke rechtspersoon deelneemt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.2
    text: |-
      Een publiekrechtelijke rechtspersoon is alleen in staat in een onderneming het beleid te bepalen in de zin van het
      eerste lid, onder a:
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.2.a
    text: |-
      indien hij, al dan niet tezamen met een of meer andere publiekrechtelijke rechtspersonen, beschikt over de
      meerderheid van de stemrechten, verbonden aan de door de rechtspersoon van de onderneming uitgegeven aandelen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.2.b
    text: |-
      indien meer dan de helft van de leden van het bestuur of het toezichthoudend orgaan wordt benoemd door een of meer
      publiekrechtelijke rechtspersonen of door leden of aandeelhouders die een publiekrechtelijke rechtspersoon zijn;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25g.2.c
    text: |-
      indien de onderneming een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] is van een rechtspersoon waarvoor onderdeel a of b van
      toepassing is; of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 25g.2.d
    text: in andere gevallen, voor zover bij algemene maatregel van bestuur bepaald.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25g
  - number: 25h.1
    text: 'Dit hoofdstuk is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
  - number: 25h.1.a
    text: |-
      openbare scholen als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      [artikel 1 van de Wet op de expertisecentra][ref2], en [artikel 1 van de Wet op het voortgezet onderwijs][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '1'
  - number: 25h.1.b
    text: |-
      openbare instellingen als bedoeld in [artikel 1.1.1, onder c, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 25h.1.c
    text: |-
      openbare instellingen als bedoeld in
      [artikel 1.1, onder h, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 25h.1.d
    text: |-
      de instellingen, bedoeld in [artikel 1.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      en de organisaties, bedoeld in [artikel 3 van de TNO-wet][ref2] en in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003906#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004191#Artikel2
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003906
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0004191
        artikel: '2'
  - number: 25h.1.e
    text: |-
      publieke media-instellingen als bedoeld in [artikel 1 van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 25h.2
    text: |-
      Dit hoofdstuk is niet van toepassing op het aanbieden van goederen of diensten door bestuursorganen aan andere
      bestuursorganen of aan overheidsbedrijven voor zover deze goederen of diensten zijn bestemd voor de uitvoering van
      een publiekrechtelijke taak.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
  - number: 25h.3
    text: |-
      Dit hoofdstuk is niet van toepassing op bestuursorganen als bedoeld in
      [artikel 1.1, eerste lid, onder b, van de Algemene wet bestuursrecht][ref1] en op bestuursorganen van openbare
      lichamen die zijn ingesteld op grond van [artikel 134 van de Grondwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '134'
  - number: 25h.4
    text: |-
      Dit hoofdstuk is niet van toepassing indien het economische activiteiten van een bestuursorgaan betreft ten aanzien
      waarvan een maatregel is getroffen die naar het oordeel van het bestuursorgaan kan worden aangemerkt als een
      steunmaatregel die voldoet aan de criteria van artikel 87, eerste lid, van het Verdrag.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
  - number: 25h.5
    text: |-
      Dit hoofdstuk is niet van toepassing op economische activiteiten en op een bevoordeling als bedoeld in
      [artikel 25j][ref1], welke plaatsvinden respectievelijk plaatsvindt in het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25j
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25j
        hoofdstuk: 4b
  - number: 25h.6
    text: |-
      De vaststelling of economische activiteiten of een bevoordeling plaatsvinden respectievelijk plaatsvindt in het
      algemeen belang geschiedt voor provincies, gemeenten en waterschappen door provinciale staten, de gemeenteraad
      respectievelijk het algemeen bestuur en voor zelfstandige bestuursorganen in de zin van de Kaderwet zelfstandige
      bestuursorganen door de minister die het aangaat.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25h
  - number: 25i.1
    text: |-
      Een bestuursorgaan dat economische activiteiten verricht, brengt de afnemers van een product of dienst ten minste
      de integrale kosten van dat product of die dienst in rekening.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
  - number: 25i.2
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
  - number: 25i.2.a
    text: |-
      indien de economische activiteiten strekken ter uitoefening van een bijzonder of uitsluitend recht in de zin van
      [artikel 25a, onder c, respectievelijk b][ref1], en reeds voorschriften gelden omtrent de voor de desbetreffende
      activiteiten in rekening te brengen prijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25a
        hoofdstuk: 4a
  - number: 25i.2.b
    text: |-
      indien de economische activiteiten inhouden het verstrekken van gegevens die het bestuursorgaan heeft verkregen in
      het kader van de uitoefening van zijn publiekrechtelijke bevoegdheden of het verstrekken van gegevensbestanden die
      uit de genoemde gegevens zijn samengesteld;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
  - number: 25i.2.c
    text: |-
      op economische activiteiten die worden verricht door een onderneming die belast is met de uitvoering van de
      [Wet sociale werkvoorziening][ref1], voor zover op deze activiteiten [artikel 5 van die wet][ref2] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '5'
  - number: 25i.3
    text: |-
      Bij de vaststelling van de integrale kosten, bedoeld in het eerste lid, wordt voor de financiering met vreemd
      vermogen en met eigen vermogen voor zover dat redelijkerwijs aan de economische activiteiten kan worden
      toegerekend, een bedrag in aanmerking genomen dat niet lager is dan de lasten die in het normale handelsverkeer
      gebruikelijk zijn voor de financiering van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
  - number: 25i.4
    text: |-
      Op verzoek van de raad toont een bestuursorgaan aan dat het heeft voldaan aan de in het eerste lid bedoelde
      verplichting.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25i
  - number: 25j.1
    text: |-
      Een bestuursorgaan bevoordeelt niet een overheidsbedrijf, waarbij hij in de zin van
      [artikel 25g, eerste lid][ref1], is betrokken, boven andere ondernemingen waarmee dat overheidsbedrijf in
      concurrentie treedt en kent evenmin een dergelijk overheidsbedrijf anderszins voordelen toe die verder gaan dan in
      het normale handelsverkeer gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25g
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25g
        hoofdstuk: 4b
  - number: 25j.2
    text: 'Als bevoordeling als bedoeld in het eerste lid wordt in ieder geval ook aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
  - number: 25j.2.a
    text: |-
      het toestaan van het gebruik door het overheidsbedrijf van de naam en het beeldmerk van de publiekrechtelijke
      rechtspersoon van het bestuursorgaan op een wijze waardoor verwarring bij het publiek is te duchten over de
      herkomst van goederen en diensten;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
  - number: 25j.2.b
    text: |-
      het leveren van goederen aan, het verrichten van diensten voor en het ter beschikking stellen van middelen aan het
      overheidsbedrijf tegen een vergoeding die lager is dan de integrale kosten.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
  - number: 25j.3
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
  - number: 25j.3.a
    text: |-
      indien de bevoordeling verband houdt met economische activiteiten ter uitoefening van een bijzonder of uitsluitend
      recht in de zin van [artikel 25a, onder c, respectievelijk b][ref1], en reeds voorschriften gelden omtrent de voor
      de desbetreffende activiteiten in rekening te brengen prijzen;


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25a
        hoofdstuk: 4a
  - number: 25j.3.b
    text: |-
      indien naar het oordeel van het bestuursorgaan de bevoordeling kan worden aangemerkt als een steunmaatregel die
      voldoet aan de criteria van artikel 87, eerste lid, van het Verdrag;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
  - number: 25j.3.c
    text: |-
      op economische activiteiten die worden verricht door een onderneming die belast is met de uitvoering van de
      [Wet sociale werkvoorziening][ref1], voor zover op deze activiteiten [artikel 5 van die wet][ref2] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25j
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '5'
  - number: 25k
    text: |-
      Een bestuursorgaan gebruikt gegevens die hij heeft verkregen in het kader van de uitvoering van zijn
      publiekrechtelijke bevoegdheden alleen voor economische activiteiten die niet dienen ter uitvoering van de
      publiekrechtelijke bevoegdheden, indien deze gegevens ook aan derden beschikbaar kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25k
  - number: 25l
    text: |-
      Indien een bestuursorgaan een publiekrechtelijke bevoegdheid uitoefent ten aanzien van economische activiteiten die
      door hetzelfde of een ander bestuursorgaan van de desbetreffende publiekrechtelijke rechtspersoon worden verricht,
      wordt voorkomen dat dezelfde personen betrokken kunnen zijn bij zowel de uitoefening van de bevoegdheid als bij het
      verrichten van de economische activiteiten.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25l
  - number: 25m.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de toepassing van de
      [artikelen 25i][ref1] en [25j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25j
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25m
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
        hoofdstuk: 4b
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25j
        hoofdstuk: 4b
  - number: 25m.2
    text: |-
      De in het eerste lid bedoelde nadere regels hebben in elk geval betrekking op de kosten die bij de in
      [artikel 25i, eerste lid][ref1], bedoelde kostendoorberekening in aanmerking worden genomen en op beginselen voor
      de toerekening van indirecte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25m
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
        hoofdstuk: 4b
  - number: 25m.3
    text: 'De nadere regels op grond van het eerste lid worden gesteld na overleg met:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25m
  - number: 25m.3.a
    text: |-
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties voor zover de regels betrekking hebben op gemeenten of
      provincies, en
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25m
  - number: 25m.3.b
    text: de Minister van Infrastructuur en Milieu voor zover de regels betrekking hebben op waterschappen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel25m
  - number: '26'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder zeggenschap verstaan de mogelijkheid om op grond van feitelijke of
      juridische omstandigheden een beslissende invloed uit te oefenen op de activiteiten van een onderneming.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel26
  - number: '27.1'
    text: 'Onder een concentratie wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: 27.1.a
    text: het fuseren van twee of meer voorheen van elkaar onafhankelijke ondernemingen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: 27.1.b
    text: het direct of indirect verkrijgen van zeggenschap door
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: 27.1.b.1°
    text: een of meer natuurlijke personen of rechtspersonen die reeds zeggenschap over ten minste een onderneming hebben, of
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: 27.1.b.2°
    text: |-
      een of meer ondernemingen over een of meer andere ondernemingen of delen daarvan door middel van de verwerving
      van participaties in het kapitaal of van vermogensbestanddelen, uit hoofde van een overeenkomst of op enige andere
      wijze.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: '27.2'
    text: |-
      De totstandbrenging van een gemeenschappelijke onderneming die duurzaam alle functies van een zelfstandige
      economische eenheid vervult, is een concentratie in de zin van het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel27
  - number: '28.1'
    text: |-
      In afwijking van [artikel 27][ref1] wordt niet als concentratie beschouwd:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 28.1.a
    text: |-
      het door banken, financiële instellingen of verzekeraars als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], tot wier normale werkzaamheden de verhandeling van
      effecten voor eigen rekening of voor rekening van derden behoort, tijdelijk houden van deelnemingen die zij in
      een onderneming hebben verworven ten einde deze deelnemingen weer te verkopen, mits zij de aan deze deelnemingen
      verbonden stemrechten niet uitoefenen om het marktgedrag van deze onderneming te bepalen, of zij deze stemrechten
      slechts uitoefenen om de verkoop van deze deelnemingen voor te bereiden, en deze verkoop plaatsvindt binnen een
      jaar na de verwerving;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 28.1.b
    text: 'het verkrijgen van zeggenschap door:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
  - number: 28.1.b.1°
    text: |-
      curatoren als bedoeld in [artikel 68, eerste lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel68
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '68'
  - number: 28.1.b.2°
    text: |-
      bewindvoerders als bedoeld in [artikel 215, tweede lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel215
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '215'
  - number: 28.1.b.3°
    text: |-
      personen als bedoeld in [1:76, eerste lid, van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 28.1.b.4°
    text: |-
      bewindvoerders als bedoeld in [3:162, vierde lid, van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 28.1.b.5°
    text: |-
      personen als bedoeld in [artikel 3:175, negende lid, van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 28.1.c
    text: |-
      het verwerven van participaties in het kapitaal als bedoeld in [artikel 27, eerste lid, onder b][ref1], met
      inbegrip van participaties in een gemeenschappelijke onderneming als bedoeld in [artikel 27, tweede lid][ref2],
      door participatiemaatschappijen mits de aan de deelname verbonden stemrechten slechts worden uitgeoefend om de
      volle waarde van deze beleggingen veilig te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '28.2'
    text: |-
      De in het eerste lid, onder a, genoemde termijn kan op verzoek door de raad worden verlengd wanneer de
      desbetreffende instellingen of verzekeraars aantonen dat de verkoop binnen de gestelde termijn redelijkerwijs niet
      mogelijk was.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel28
  - number: '29.1'
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op concentraties waarbij de gezamenlijke omzet van de betrokken
      ondernemingen in het voorafgaande kalenderjaar meer bedroeg dan € 113 450 000, waarvan door ten minste twee van de
      betrokken ondernemingen ieder ten minste € 30 000 000 in Nederland is behaald.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel29
  - number: '29.2'
    text: De in het eerste lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel29
  - number: '29.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen de in het eerste lid bedoelde bedragen voor een bij die algemene
      maatregel van bestuur te bepalen categorie van ondernemingen voor een periode van ten hoogste vijf jaar worden
      verlaagd. Deze periode kan telkens bij algemene maatregel van bestuur worden verlengd.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel29
  - number: '30.1'
    text: |-
      De berekening van de omzet, bedoeld in [artikel 29, eerste lid][ref1], geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '30.2'
    text: |-
      Wanneer de concentratie tot stand wordt gebracht door middel van de verwerving van de zeggenschap over delen van
      een of meer ondernemingen, welke delen al dan niet eigen rechtspersoonlijkheid bezitten, wordt bij de berekening
      van de omzet, bedoeld in [artikel 29, eerste lid][ref1], ten aanzien van de vervreemder of de vervreemders
      uitsluitend rekening gehouden met de omzet van de te vervreemden delen die voorwerp zijn van de transactie. Twee of
      meer verwervingen als bedoeld in de eerste volzin die plaatsvinden binnen een door de raad in aanmerking te nemen
      periode en die afhankelijk van elkaar zijn of op een economische wijze zodanig met elkaar zijn verbonden dat deze
      verwervingen als één verwerving zouden moeten worden beoordeeld, worden beschouwd als één concentratie die tot
      stand gebracht wordt op de dag van de laatste transactie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '30.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid worden voor de berekening van de omzet van een betrokken onderneming
      als bedoeld in [artikel 29, eerste lid][ref1], de omzetten van de volgende ondernemingen opgeteld:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 30.3.a
    text: de betrokken onderneming;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.b
    text: 'de ondernemingen waarin de betrokken onderneming rechtstreeks of middellijk:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.b.1°
    text: meer dan de helft van het kapitaal of de bedrijfsactiva bezit, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.b.2°
    text: de bevoegdheid heeft meer dan de helft van de stemrechten uit te oefenen, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.b.3°
    text: |-
      de bevoegdheid heeft meer dan de helft van de leden van de raad van toezicht of van bestuur, of van de krachtens de
      wet tot vertegenwoordiging bevoegde organen te benoemen, dan wel
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.b.4°
    text: het recht heeft de onderneming te leiden;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.c
    text: ondernemingen die in een betrokken onderneming over de in onderdeel b genoemde rechten of bevoegdheden beschikken;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.d
    text: |-
      ondernemingen waarin een in onderdeel c bedoelde onderneming over de in onderdeel b genoemde rechten of
      bevoegdheden beschikt;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.3.e
    text: |-
      ondernemingen waarbij ten minste twee ondernemingen als bedoeld in de onderdelen a tot en met d gezamenlijk over de
      in onderdeel b genoemde rechten of bevoegdheden beschikken.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: '30.4'
    text: |-
      Indien bij de concentratie betrokken ondernemingen gezamenlijk beschikken over de in het derde lid, onderdeel b,
      genoemde rechten of bevoegdheden, wordt voor de berekening van de omzet van de betrokken ondernemingen als bedoeld
      in [artikel 29, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 30.4.a
    text: |-
      geen rekening gehouden met de omzet, die het resultaat is van de verkoop van produkten en het leveren van diensten
      tussen de gemeenschappelijke onderneming en elk van de betrokken ondernemingen of van enige andere met de betrokken
      onderneming verbonden onderneming als bedoeld in het derde lid, onderdelen b tot en met e;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: 30.4.b
    text: |-
      rekening gehouden met de omzet die het resultaat is van de verkoop van produkten en het verlenen van diensten
      tussen de gemeenschappelijke onderneming en derde ondernemingen. Deze omzet wordt aan de ondernemingen toegerekend
      in verhouding tot hun deelnemingen in de gemeenschappelijke onderneming.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
  - number: '30.5'
    text: |-
      Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 29, eerste lid][ref1], worden transacties tussen de in het derde lid bedoelde ondernemingen buiten
      beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Voor de toepassing van [artikel 29, eerste lid][ref1], wordt ten aanzien van banken en financiële instellingen
      als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] de omzet vervangen door de som van de
      volgende, overeenkomstig de regels op grond van [artikel 417 van Boek 2 van het Burgerlijk Wetboek][ref3], op de
      winst- en verliesrekening over het voorafgaande boekjaar opgenomen baten:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel417
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '417'
  - number: 31.1.a
    text: rentebaten en soortgelijke baten;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
  - number: 31.1.b
    text: opbrengsten uit waardepapieren;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
  - number: 31.1.c
    text: ontvangen provisie;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
  - number: 31.1.d
    text: resultaat uit financiële transacties;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
  - number: 31.1.e
    text: overige bedrijfsopbrengsten;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
  - number: '31.2'
    text: |-
      Voor verzekeraars in de zin van de [Wet op het financieel toezicht][ref1] wordt voor de toepassing van
      [artikel 29, eerste lid][ref2], de omzet vervangen door de waarde van de bruto geboekte premies in het voorafgaande
      boekjaar, waarvan voor ten minste € 4 540 000 ontvangen van Nederlandse ingezetenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel29
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '29'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '34'
    text: |-
      Het is verboden een concentratie tot stand te brengen voordat het voornemen daartoe aan de raad is gemeld en
      vervolgens vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel34
  - number: '35.1'
    text: |-
      Bij een melding worden de bij algemene maatregel van bestuur aangewezen gegevens verstrekt.
      [Artikel 4:4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '35.2'
    text: |-
      Indien niet is voldaan aan het eerste lid of indien de verstrekte gegevens onvoldoende zijn voor de beoordeling van
      een melding, kan de raad van de bij de concentratie betrokken partijen, aanvulling van de melding verlangen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel35
  - number: '35.3'
    text: |-
      Door een onderneming bij de melding verstrekte gegevens die door die onderneming als vertrouwelijk zijn aangemerkt,
      worden niet eerder openbaar gemaakt dan nadat een week is verstreken na de bekendmaking van de daartoe strekkende
      beschikking van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel35
  - number: '35.4'
    text: |-
      Indien met betrekking tot de in het derde lid bedoelde beschikking van de raad een verzoek om een voorlopige
      voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] is gedaan, wordt de termijn,
      genoemd in de [artikelen 34][ref2] en [37, eerste en derde lid][ref3], opgeschort tot de dag waarop de
      schriftelijke uitspraak van de voorzieningenrechter van de rechtbank, bedoeld in [artikel 93, eerste lid][ref4],
      is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel93
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: '93'
        hoofdstuk: '12'
  - number: '36'
    text: Van een ontvangen melding wordt door de raad zo spoedig mogelijk mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel36
  - number: '37.1'
    text: |-
      De raad deelt binnen vier weken na het ontvangen van een melding mede of voor het tot stand brengen van de
      concentratie, waarop die melding betrekking heeft, een vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
  - number: '37.2'
    text: |-
      De raad kan bepalen dat een vergunning is vereist voor een concentratie waarvan hij reden heeft om aan te nemen
      dat die de daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan op significante wijze zou
      kunnen belemmeren, met name als het resultaat van het in het leven roepen of het versterken van een economische
      machtspositie.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
  - number: '37.3'
    text: |-
      Indien de melding betrekking heeft op een concentratie als bedoeld in [artikel 27, tweede lid][ref1],
      waarmee de coördinatie van het concurrentiegedrag van de totstandbrengende ondernemingen wordt beoogd of
      totstandgebracht, betrekt de raad bij zijn besluit of een vergunning is vereist, tevens de criteria van
      [artikel 6, eerste en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '37.4'
    text: |-
      De mededeling dat voor het totstandbrengen van de concentratie geen vergunning is vereist, kan onder voorwaarden
      worden gedaan, indien uit de terzake van de melding verstrekte gegevens en voorstellen zonder meer blijkt dat de in
      het tweede en derde lid bedoelde gevolgen kunnen worden vermeden indien aan die voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
  - number: '37.5'
    text: |-
      Indien niet binnen vier weken toepassing is gegeven aan het eerste lid is voor de concentratie geen
      vergunning vereist. De in de vorige volzin bedoelde termijn vangt aan met ingang van de eerstvolgende dag
      na ontvangst van de melding die niet een zaterdag, zondag of algemeen erkende feestdag is in de zin van de
      [Algemene termijnenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '37.6'
    text: |-
      Door een onvoorwaardelijke mededeling als bedoeld in het eerste lid, dat voor een concentratie geen vergunning is
      vereist, houdt het in [artikel 34][ref1] vervatte verbod met betrekking tot die concentratie op te gelden. Ingeval
      van een mededeling als bedoeld in het vierde lid, blijft het in [artikel 34][ref2] vervatte verbod gelden totdat
      aan de gestelde voorwaarden is voldaan. Voldoen partijen niet of niet tijdig aan de voorwaarden, dan is alsnog een
      vergunning vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '37.7'
    text: Van een mededeling van de raad als bedoeld in het eerste lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel37
  - number: '38.1'
    text: |-
      Indien niet is voldaan aan [artikel 35, eerste lid][ref1], en de raad binnen vijf werkdagen na de dag van ontvangst
      van de melding, degene die de melding heeft gedaan, heeft verzocht om toezending van de ontbrekende gegevens of
      documenten, vangt de in de [artikelen 34][ref2] en [37, eerste en vijfde lid][ref3], bedoelde termijn van vier
      weken aan op de dag waarop die gegevens of documenten alsnog zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '38.2'
    text: |-
      Onverminderd het eerste lid, wordt de in de [artikelen 34][ref1] en [37, eerste en vijfde lid][ref2], bedoelde
      termijn van vier weken opgeschort met ingang van de dag waarop de raad op grond van [artikel 35, tweede lid][ref3],
      aanvulling van de melding verlangt tot de dag waarop de aanvulling door elk van de partijen van wie aanvulling is
      gevraagd, is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel35
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '35'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '38.3'
    text: |-
      De termijn kan voorts naar aanleiding van een met redenen omkleed verzoek van elk van degenen die de melding
      doen door de raad eenmalig worden opgeschort indien dat naar zijn oordeel in het belang van de behandeling van de
      melding is.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel38
  - number: '38.4'
    text: |-
      Een melding geldt als niet gedaan indien de in het tweede lid bedoelde aanvulling van gegevens niet heeft
      plaatsgevonden binnen zes maanden na de datum waarop het laatste verzoek tot aanvulling is gedaan en de termijn
      niet ingevolge het derde lid is opgeschort.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel38
  - number: '39.1'
    text: |-
      [Artikel 34][ref1] geldt niet in geval van een openbaar overname of ruilaanbod gericht op het verkrijgen van een
      deelname in het kapitaal van een onderneming, mits daarvan onverwijld aan de raad melding wordt gedaan, en de
      verkrijger de aan de deelname in het kapitaal verbonden stemrechten niet uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '39.2'
    text: |-
      Indien de raad ter zake van een melding als bedoeld in het eerste lid mededeelt dat op grond van
      [artikel 37, eerste lid][ref1], een vergunning is vereist, dient de concentratie:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 39.2.a
    text: |-
      indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel39
  - number: 39.2.b
    text: |-
      indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel39
  - number: '39.3'
    text: |-
      De raad kan, op verzoek van degene die een melding heeft gedaan als bedoeld in het eerste lid, bepalen dat, in
      afwijking van het eerste lid, de in dat lid bedoelde stemrechten mogen worden uitgeoefend om de volle waarde van
      diens belegging te handhaven.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel39
  - number: '40.1'
    text: |-
      De raad kan om gewichtige redenen op verzoek van degene die een melding heeft gedaan, ontheffing verlenen van het
      in [artikel 34][ref1] gestelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '34'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '40.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel40
  - number: '40.3'
    text: |-
      Indien de raad na het verlenen van een ontheffing als bedoeld in het eerste lid ter zake van de betrokken melding
      mededeelt dat op grond van [artikel 37, eerste lid][ref1], een vergunning is vereist, en de concentratie tot stand
      is gebracht voor de mededeling daarvan, dient de concentratie:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 40.3.a
    text: |-
      indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel40
  - number: 40.3.b
    text: |-
      indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel40
  - number: '41.1'
    text: |-
      Het is verboden zonder vergunning een concentratie tot stand te brengen waarvoor ingevolge [artikel 37][ref1] een
      vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '41.2'
    text: |-
      Een vergunning wordt geweigerd indien als gevolg van de voorgenomen concentratie de daadwerkelijke mededinging op
      de Nederlandse markt of een deel daarvan op significante wijze zou worden belemmerd, met name als het resultaat van
      het in het leven roepen of het versterken van een economische machtspositie. [Artikel 37, derde lid][ref1], is van
      overeenkomstige toepassing indien de aanvraag om een vergunning betrekking heeft op een concentratie als bedoeld
      in [artikel 27, tweede lid][ref2], waarmee de coördinatie van het concurrentiegedrag van de totstandbrengende
      ondernemingen wordt beoogd of totstandgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '37'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '27'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '41.3'
    text: |-
      Indien ten minste een van de bij een concentratie betrokken ondernemingen bij wettelijk voorschrift of door
      een bestuursorgaan is belast met het beheer van diensten van algemeen economisch belang, kan een vergunning
      slechts worden geweigerd indien de weigering van die vergunning de vervulling van de hun toevertrouwde taak niet
      verhindert.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel41
  - number: '41.4'
    text: Een vergunning kan onder beperkingen worden verleend; aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel41
  - number: '42.1'
    text: Een aanvraag om vergunning wordt ingediend bij de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel42
  - number: '42.2'
    text: Bij algemene maatregel van bestuur kan worden bepaald welke gegevens bij een aanvraag dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel42
  - number: '42.3'
    text: |-
      Door een onderneming bij de aanvraag verstrekte gegevens die door die onderneming als vertrouwelijk zijn
      aangemerkt, worden niet eerder openbaar gemaakt dan nadat een week is verstreken na de bekendmaking van de daartoe
      strekkende beschikking van de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel42
  - number: '42.4'
    text: |-
      Indien met betrekking tot de in het derde lid bedoelde beschikking van de raad een verzoek om een voorlopige
      voorziening als bedoeld in [artikel 8:81 van de Algemene wet bestuursrecht][ref1] is gedaan, wordt de termijn,
      genoemd in [artikel 44, eerste lid][ref2], opgeschort tot de dag waarop de schriftelijke uitspraak van de
      voorzieningenrechter van de rechtbank, bedoeld in [artikel 93, eerste lid][ref3], is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel93
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '93'
        hoofdstuk: '12'
  - number: '42.5'
    text: Van een ontvangen aanvraag wordt door de raad zo spoedig mogelijk mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel42
  - number: '43'
    text: |-
      Een onderneming verstrekt desgevraagd aan de raad de inlichtingen omtrent bedrijfsgegevens van die onderneming, die
      voor de beoordeling van een aanvraag om een vergunning redelijkerwijs nodig zijn.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel43
  - number: '44.1'
    text: |-
      De raad geeft zijn beschikking op de aanvraag binnen dertien weken na ontvangst van die aanvraag. Het niet binnen
      dertien weken geven van een beschikking wordt gelijkgesteld met het verlenen van een vergunning.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel44
  - number: '44.2'
    text: |-
      Indien een aanvraag is ingediend voordat blijkens een mededeling van de raad voor de desbetreffende concentratie
      een vergunning is vereist, wordt deze niet in behandeling genomen alvorens die mededeling is bekendgemaakt. De in
      het eerste lid genoemde termijn vangt aan op het moment van die bekendmaking.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel44
  - number: '44.3'
    text: |-
      De beschikking wordt, nadat zij is bekendgemaakt, ter inzage gelegd bij de mededingingsautoriteit. Gegevens die
      ingevolge [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking in aanmerking komen, worden
      niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '44.4'
    text: Van de beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel44
  - number: '45'
    text: |-
      De raad kan een vergunning intrekken indien de verstrekte gegevens zodanig onjuist waren dat op de aanvraag anders
      zou zijn beslist als de juiste gegevens wel bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel45
  - number: '46.1'
    text: |-
      De raad kan om gewichtige redenen op verzoek van degene die een vergunning heeft aangevraagd, ontheffing verlenen
      van het in [artikel 41, eerste lid][ref1], gestelde verbod tot op die aanvraag onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel41
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '46.2'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel46
  - number: '46.3'
    text: |-
      Indien nadat een ontheffing is verleend als bedoeld in het eerste lid de aanvraag om een vergunning wordt
      ingetrokken of de vergunning wordt geweigerd, dient de concentratie, voor zover deze dan reeds is tot stand
      gebracht, binnen dertien weken ongedaan te worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel46
  - number: '46.4'
    text: |-
      Indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, dient de
      concentratie, voor zover deze dan reeds is tot stand gebracht, binnen dertien weken daarmee in overeenstemming te
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel46
  - number: '47.1'
    text: |-
      Onze Minister kan, nadat de raad een vergunning voor het tot stand brengen van een concentratie heeft geweigerd,
      op een daartoe strekkende aanvraag besluiten die vergunning te verlenen indien naar zijn oordeel gewichtige redenen
      van algemeen belang die zwaarder wegen dan de te verwachten belemmering van de mededinging, daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel47
  - number: '47.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid kan worden gedaan tot vier weken nadat de beschikking van de raad om een
      vergunning te weigeren onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel47
  - number: '47.3'
    text: |-
      Indien een aanvraag als bedoeld in het eerste lid is gedaan wordt de behandeling van beroepschriften inzake de
      beschikking van de raad opgeschort, totdat op die aanvraag onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel47
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke gegevens bij een tot Onze Minister gerichte aanvraag om
      een vergunning dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel48
  - number: '49.1'
    text: |-
      Onze Minister geeft zijn beschikking op een aanvraag, in overeenstemming met het gevoelen van de ministerraad,
      binnen twaalf weken na ontvangst van die aanvraag.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49
  - number: '49.2'
    text: |-
      [Artikel 44, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel44
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 49a.1
    text: |-
      Een onderneming of een ondernemersvereniging kan voor het opmaken van een rapport als bedoeld in
      [artikel 59][ref1], of indien een rapport is vastgesteld, tot het moment waarop een beslissing als bedoeld in
      [artikel 62][ref2] is genomen bij de raad een aanvraag doen tot het nemen van een besluit waarmee de raad een in
      die aanvraag opgenomen toezegging voor de onderneming of de ondernemersvereniging bindend verklaart opdat:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel62
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 49a.1.a
    text: |-
      wordt voorkomen dat zal worden gehandeld in strijd met [artikel 6, eerste lid][ref1], of [24, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 49a.1.b
    text: |-
      het handelen in strijd met [artikel 6, eerste lid][ref1], of [24, eerste lid][ref2] wordt gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 49a.2
    text: 'De raad kan een besluit als bedoeld in het eerste lid nemen indien naar het oordeel van de raad:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49a.2.a
    text: |-
      verzekerd is dat de onderneming of ondernemersvereniging als gevolg van het besluit zal handelen in overeenstemming
      met [artikel 6, eerste lid][ref1], of [24, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 49a.2.b
    text: |-
      de onderneming of de ondernemersvereniging aannemelijk maakt dat zij het besluit op controleerbare wijze zal
      naleven, en
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49a.2.c
    text: |-
      in een concreet geval het nemen van het besluit uit een oogpunt van handhaving van de wet doelmatiger is dan het
      opleggen van een bestuurlijke boete of een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49a.3
    text: |-
      Bij een besluit als bedoeld in het eerste lid, besluit de raad tevens geen onderzoek te starten, een reeds
      ingesteld onderzoek niet langer voort te zetten, geen rapport op te maken of af te zien van het opleggen van een
      bestuurlijke boete of een last onder dwangsom. Het besluit bevat geen oordeel over de verenigbaarheid van het
      gedrag van de onderneming of de ondernemersvereniging met het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49a.4
    text: |-
      Nadat de raad een besluit als bedoeld in het eerste lid heeft genomen gedraagt de onderneming of de
      ondernemersvereniging zich overeenkomstig dat besluit.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49a.5
    text: |-
      Een besluit als bedoeld in het eerste lid, wordt voor een bepaalde periode gegeven. De raad kan besluiten het
      besluit telkens voor een bepaalde periode te verlengen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49a
  - number: 49b
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 49a, eerste lid][ref1], of een
      besluit tot verlenging als bedoeld in [artikel 49a, vijfde lid, tweede volzin][ref2], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 49c.1
    text: |-
      Nadat de raad een besluit als bedoeld in [artikel 49a, eerste lid][ref1], of een besluit tot verlenging als bedoeld
      in [artikel 49a, vijfde lid, tweede volzin][ref2], heeft genomen kan hij alsnog een onderzoek instellen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
  - number: 49c.1.a
    text: er een wezenlijke verandering is opgetreden in de feiten waarop het besluit berust,
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
  - number: 49c.1.b
    text: |-
      het besluit berust op door de onderneming of de ondernemersvereniging verstrekte onvolledige, onjuiste of
      misleidende gegevens, of
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
  - number: 49c.1.c
    text: |-
      de onderneming of de ondernemersvereniging handelt in strijd met [artikel 49a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
  - number: 49c.2
    text: |-
      De raad kan gedurende het onderzoek, bedoeld in het eerste lid, een besluit als bedoeld
      in [artikel 49a, eerste lid][ref1], of een besluit tot verlenging als bedoeld in
      [artikel 49a, vijfde lid, tweede volzin][ref2], intrekken dan wel wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
  - number: 49c.3
    text: |-
      Op de voorbereiding van een besluit tot wijziging als bedoeld in het tweede lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 49d.1
    text: |-
      Een besluit als bedoeld in [artikel 49a, eerste lid][ref1], of een besluit tot verlenging als bedoeld in
      [artikel 49a, vijfde lid, tweede volzin][ref2], wordt, nadat het is bekendgemaakt, ter inzage gelegd bij de
      mededingingsautoriteit. Gegevens die ingevolge [artikel 10 van de Wet openbaarheid van bestuur][ref3] niet voor
      verstrekking in aanmerking komen, worden niet ter inzage gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel49a
      [ref3]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 49a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0005252
        artikel: '10'
  - number: 49d.2
    text: Van het besluit wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel49d
  - number: '50.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van de raad
      aangewezen ambtenaren van de mededingingsautoriteit.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel50
  - number: '50.2'
    text: |-
      De krachtens het eerste lid aangewezen ambtenaren beschikken met het oog op de toepassing van de bevoegdheid van de
      raad, bedoeld in [artikel 9, eerste lid][ref1], [artikel 13, tweede lid][ref2], [artikel 15, tweede lid][ref3], en
      [artikel 89a, eerste lid][ref4], over de bevoegdheden, die hun zijn toegekend ter uitoefening van het toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel89a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: 89a
        hoofdstuk: '10'
  - number: '50.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel50
  - number: '51.1'
    text: |-
      [Artikel 5:17 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op geschriften met betrekking tot
      de toepassing van mededingingsregels, gewisseld tussen een onderneming en een advocaat die is toegelaten tot
      de balie, die zich bij de onderneming bevinden, doch waarop, indien zij zich zouden bevinden bij die advocaat,
      [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '51.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degenen, bedoeld in
      [artikel 51, tweede lid, onder 2° van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '52.1'
    text: |-
      Met het onderzoek zijn belast de krachtens [artikel 50, eerste lid][ref1], aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '52.2'
    text: |-
      Ten dienste van het onderzoek beschikken zij over de bevoegdheden die hun in deze paragraaf worden toegekend,
      alsmede, met inachtneming van de daaraan in deze paragraaf gestelde beperkingen, over de bevoegdheden die hun zijn
      toegekend ter uitoefening van het toezicht, bedoeld in [artikel 50, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '53.1'
    text: |-
      Indien de in [artikel 52, eerste lid][ref1], bedoelde ambtenaren een redelijk vermoeden hebben dat een bepaalde
      onderneming of ondernemersvereniging een overtreding heeft begaan, is er geen verplichting aan de zijde van die
      onderneming of ondernemersvereniging ter zake een verklaring af te leggen. De betrokkenen worden hiervan in kennis
      gesteld voordat hun mondeling ter zake om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '53.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van degenen, bedoeld in
      [artikel 51, tweede lid, onder 2° van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '54'
    text: |-
      De in [artikel 52, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd om bedrijfsruimten en voorwerpen te
      verzegelen, voor zover dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref2]
      bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 54a
    text: |-
      De werkzaamheden in verband met het opleggen van een bestuurlijke boete of een last onder dwangsom worden verricht
      door personen die niet betrokken zijn geweest bij de opstelling van het in [artikel 59, eerste lid][ref1],
      onderscheidenlijk [77, eerste lid][ref2], bedoelde rapport en het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel77
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel54a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '55.1'
    text: |-
      De in [artikel 52, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd een woning zonder toestemming
      van de bewoner te betreden en te doorzoeken, voor zover dat voor de uitoefening van de in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '55.2'
    text: |-
      De in [artikel 52, eerste lid][ref1], bedoelde ambtenaren oefenen de hun in
      [artikel 5:17 van de Algemene wet bestuursrecht][ref2] toegekende bevoegdheden alsmede de bevoegdheid tot
      binnentreden en doorzoeken als bedoeld in het eerste lid, zo nodig uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 55a.1
    text: |-
      Voor het betreden of het doorzoeken, bedoeld in [artikel 55, eerste lid][ref1], is een voorafgaande machtiging
      vereist van de rechter-commissaris, belast met de behandeling van strafzaken bij de rechtbank te Rotterdam. De
      machtiging kan bij wijze van voorzorgsmaatregel worden gevraagd. De machtiging wordt zo mogelijk getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel55
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 55a.2
    text: |-
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: 55a.3
    text: |-
      Tegen de beslissing van de rechter-commissaris staat voor zover het verzoek om een machtiging niet is toegewezen,
      voor de raad binnen veertien dagen beroep open bij de rechtbank te Rotterdam.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55a
  - number: 55a.4
    text: Het betreden of het doorzoeken vindt plaats onder toezicht van de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55a
  - number: 55a.5
    text: |-
      De [artikelen 2][ref1] en [3 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
  - number: 55b.1
    text: |-
      Een machtiging als bedoeld in [artikel 55a][ref1] is met redenen omkleed en ondertekend en vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel55a
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 55a
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 55b.1.a
    text: de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.1.b
    text: de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.1.c
    text: de wettelijke bepalingen waarop de doorzoeking en het binnentreden berusten;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.1.d
    text: het doel en voorwerp van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.1.e
    text: de dagtekening.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.2
    text: |-
      Indien het betreden of het doorzoeken dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden
      gesteld, zorgt de rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.3
    text: De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
  - number: 55b.4
    text: |-
      [Artikel 6 van de Algemene wet op het binnentreden][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '6'
  - number: 55c.1
    text: |-
      De ambtenaar die is binnengetreden of een doorzoeking als bedoeld in [artikel 55][ref1] heeft verricht, maakt op
      zijn ambtseed of -belofte een schriftelijk verslag op omtrent het binnentreden of de doorzoeking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel55
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 55c.2
    text: 'In het verslag vermeldt hij:'
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.a
    text: zijn naam of nummer en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.b
    text: de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.c
    text: de wettelijke bepalingen waarop de doorzoeking en het binnentreden berusten;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.d
    text: |-
      de plaats waar is binnengetreden of is doorzocht en de naam van degene bij wie is binnengetreden of de doorzoeking
      is verricht;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.e
    text: de wijze van binnentreden en het tijdstip waarop de doorzoeking is begonnen en is beëindigd;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.f
    text: hetgeen tijdens het onderzoek is verricht en overigens is voorgevallen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.2.g
    text: |-
      de namen of nummers en de hoedanigheid van de overige personen die zijn binnengetreden of aan de doorzoeking hebben
      deelgenomen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.3
    text: |-
      Het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden of de doorzoeking is beëindigd,
      toegezonden aan de rechter-commissaris die de machtiging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.4
    text: |-
      Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop is binnengetreden of de doorzoeking is
      beëindigd, aan degene bij wie is binnengetreden of bij wie de doorzoeking is verricht, uitgereikt of toegezonden.
      Indien het doel van het onderzoek daartoe noodzaakt, kan deze uitreiking of toezending worden uitgesteld.
      Uitreiking of toezending geschiedt in dat geval, zodra het belang van dit doel het toestaat. Indien het niet
      mogelijk is het afschrift uit te reiken of toe te zenden, houdt de rechter-commissaris of de ambtenaar die is
      binnengetreden of de doorzoeking heeft verricht, het afschrift gedurende zes maanden beschikbaar voor degene bij
      wie is binnengetreden of bij wie de doorzoeking is verricht.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
  - number: 55c.5
    text: |-
      De [artikelen 10][ref1] en [11 van de Algemene wet op het binnentreden][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel55c
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '11'
  - number: '56.1'
    text: |-
      Ingeval van overtreding van [artikel 6, eerste lid][ref1], of van [artikel 24, eerste lid][ref2], kan de raad de
      overtreder:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 56.1.a
    text: een bestuurlijke boete opleggen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel56
  - number: 56.1.b
    text: een last onder dwangsom opleggen;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel56
  - number: 56.1.c
    text: een bindende aanwijzing tot naleving van deze wet opleggen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel56
  - number: '56.2'
    text: |-
      Ingeval van overtreding van een bindende aanwijzing als bedoeld in het eerste lid, onder c, kan de raad de
      overtreder een bestuurlijke boete of een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel56
  - number: '57.1'
    text: |-
      De bestuurlijke boete bedraagt ten hoogste € 450 000 of, indien dat meer is, ten hoogste 10% van de omzet van
      de onderneming dan wel, indien de overtreding door een ondernemersvereniging is begaan, van de gezamenlijke
      omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de beschikking.
      Indien op grond van [artikel 5:1, derde lid, van de Algemene wet bestuursrecht][ref1] toepassing is gegeven
      aan [artikel 51, tweede lid, onder 2°, van het Wetboek van Strafrecht][ref2], bedraagt voor de daar bedoelde
      overtreder de bestuurlijke boete ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '57.2'
    text: |-
      De berekening van de omzet, bedoeld in het eerste lid, geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref1] voor de netto-omzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel377
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '377'
  - number: '58.1'
    text: Aan een last onder dwangsom kunnen voorschriften worden verbonden inzake het verstrekken van gegevens aan de raad.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel58
  - number: '58.2'
    text: Een last geldt voor een door de raad te bepalen termijn van ten hoogste twee jaren.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel58
  - number: 58a.1
    text: |-
      De last onder dwangsom kan worden opgelegd in de vorm van een structurele maatregel als bedoeld in artikel 7 van
      Verordening 1/2003, indien die maatregel evenredig is aan de gepleegde overtreding en noodzakelijk is om aan de
      overtreding daadwerkelijk een einde te maken. Een structurele maatregel kan uitsluitend worden opgelegd indien er
      niet een even effectieve maatregel ter correctie van de overtreding bestaat of indien een dergelijke maatregel voor
      de betrokken onderneming of ondernemersvereniging meer belastend zou zijn dan de structurele maatregel.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel58a
  - number: 58a.2
    text: |-
      [Artikel 58, tweede lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel58
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '59.1'
    text: |-
      Indien de raad na afloop van het onderzoek een redelijk vermoeden heeft dat een overtreding als bedoeld in
      [artikel 56][ref1] is begaan en dat daarvoor een bestuurlijke boete of een last onder dwangsom dient te worden
      opgelegd, doet hij een rapport als bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref2]
      opmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '59.2'
    text: |-
      Voor zover het rapport strekt ter voorbereiding van het opleggen van een last onder dwangsom, is
      [afdeling 5.4.2 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.4.2
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.4.2
  - number: '59.3'
    text: |-
      Van hetgeen mondeling naar voren is gebracht bij het geven van een zienswijze ten aanzien van het rapport wordt een
      verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59
  - number: 59a.1
    text: |-
      Alvorens een bestuurlijke boete op te leggen kan de boekhouding van de onderneming of de ondernemersvereniging door
      bij besluit van de raad aangewezen ambtenaren van de mededingingsautoriteit worden onderzocht teneinde de voor de
      oplegging van de bestuurlijke boete in aanmerking te nemen financiële gegevens te kunnen bepalen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59a
  - number: 59a.2
    text: |-
      De in het eerste lid bedoelde ambtenaren kunnen zich ten behoeve van het onderzoek, bedoeld in het eerste lid, laten
      bijstaan door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 59a.3
    text: |-
      De onderneming of de ondernemersvereniging is verplicht medewerking te verlenen aan een onderzoek als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel59a
  - number: '62'
    text: |-
      In afwijking van [artikel 5:51, eerste lid, van de Algemene wet bestuursrecht][ref1], beslist de raad omtrent het
      opleggen van een bestuurlijke boete of een last onder dwangsom binnen acht maanden na dagtekening van het rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '63'
    text: |-
      De werking van een beschikking als bedoeld in [artikel 56][ref1] wordt, voor zover daarbij een bestuurlijke boete
      wordt opgelegd, opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep
      is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '64.1'
    text: |-
      De vervaltermijn, bedoeld in [artikel 5:45 van de Algemene wet bestuursrecht][ref1] wordt telkens gestuit door
      een handeling van de mededingingsautoriteit ter verrichting van een onderzoek of procedure met betrekking tot
      de overtreding, alsmede door een dergelijke handeling van de Commissie van de Europese Gemeenschappen of van een
      mededingingsautoriteit van een andere lidstaat van de Europese Unie met betrekking tot een overtreding van de
      artikelen 81 en 82 van het Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '64.2'
    text: |-
      De stuiting van de vervaltermijn gaat in op de dag waarop tenminste één onderneming of
      ondernemersvereniging die aan de overtreding heeft deelgenomen, dan wel één van degenen, bedoeld in
      [artikel 51, tweede lid, onder 2° van het Wetboek van Strafrecht][ref1], van de handeling schriftelijk in kennis
      wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '51'
  - number: '64.3'
    text: |-
      Op het moment van stuiting vangt de vervaltermijn opnieuw aan. De bevoegdheid, bedoeld in het eerste lid
      vervalt echter uiterlijk tien jaren nadat de overtreding heeft plaatsgevonden, verlengd met de periode waarin de
      vervaltermijn ingevolge [artikel 5:45, derde lid, van de Algemene wet bestuursrecht][ref1] wordt opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '65.1'
    text: |-
      Een beschikking waarbij een bestuurlijke boete of een last onder dwangsom als bedoeld in [artikel 56][ref1] wordt
      opgelegd wordt, nadat zij is bekendgemaakt, ter inzage gelegd bij de mededingingsautoriteit. De beschikking wordt
      niet eerder ter inzage gelegd, dan nadat vijf dagen zijn verstreken na de bekendmaking van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '65.2'
    text: |-
      Van de beschikking wordt mededeling gedaan in de Staatscourant. Gegevens die ingevolge
      [artikel 10 van de Wet openbaarheid van bestuur][ref1] niet voor verstrekking in aanmerking komen, worden niet ter
      inzage gelegd. Van de beschikking wordt niet eerder mededeling gedaan, dan nadat vijf dagen zijn verstreken na de
      bekendmaking van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '66.1'
    text: De raad kan een last onder dwangsom wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel66
  - number: '66.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt de raad, alvorens toepassing te
      geven aan het eerste lid, de overtreder in de gelegenheid schriftelijk of mondeling zijn zienswijze kenbaar te
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '67'
    text: |-
      Een bestuurlijke boete wordt betaald binnen dertien weken nadat de beschikking waarbij de bestuurlijke boete is
      opgelegd, bekend is gemaakt.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel67
  - number: '68'
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel68
  - number: 68a.1
    text: |-
      Ingeval de bestuurlijke boete is opgelegd aan een ondernemersvereniging, kan de raad bij gebreke van betaling
      binnen de in [artikel 4:112, eerste lid, van de Algemene wet bestuursrecht][ref1] bedoelde termijn als gevolg van
      insolventie van de ondernemersvereniging, bij elke onderneming waarvan een vertegenwoordiger deel uitmaakte van het
      betrokken besluitvormende orgaan van de ondernemersvereniging op het tijdstip dat de beslissing tot het maken van
      de overtreding werd genomen, de bestuurlijke boete invorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 68a.2
    text: |-
      Indien na invordering overeenkomstig het eerste lid, de bestuurlijke boete niet volledig is betaald, kan de raad
      van elk van de bij de ondernemersvereniging aangesloten ondernemingen die op de markt waarop de overtreding is
      begaan in de desbetreffende periode werkzaam waren, het resterende bedrag vorderen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel68a
  - number: 68a.3
    text: |-
      Bij toepassing van het eerste en het tweede lid kan van elke onderneming geen hoger bedrag worden gevorderd dan 10%
      van de omzet over het boekjaar voorafgaande aan de beschikking.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel68a
  - number: 68a.4
    text: |-
      Een onderneming waarvan op grond van het eerste of tweede lid een bestuurlijke boete wordt gevorderd, is niet
      verplicht tot betaling indien zij aantoont dat zij de beslissing van de ondernemersvereniging tot het begaan van
      de overtreding niet heeft uitgevoerd en zij hetzij niet op de hoogte was van die beslissing hetzij actief afstand
      heeft genomen van die beslissing voordat het onderzoek naar de overtreding was aangevangen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel68a
  - number: '69.1'
    text: |-
      De raad kan degene die jegens de in [artikel 50, eerste lid][ref1], [artikel 52, eerste lid][ref2], of
      [artikel 89g, eerste lid][ref3], bedoelde ambtenaren in strijd handelt met [artikel 59a, derde lid][ref4],
      [77a, derde lid][ref5], of met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref6], een
      bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, van ten hoogste 1% van de omzet van
      de onderneming dan wel, indien de overtreding door een ondernemersvereniging is begaan, van de gezamenlijke omzet
      van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel89g
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel59a
      [ref5]: https://wetten.overheid.nl/BWBR0008691#Artikel77a
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008691
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008691
        artikel: 89g
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0008691
        artikel: 59a
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008691
        artikel: 77a
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '69.2'
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '70'
    text: |-
      Ingeval de in [artikel 69, eerste lid][ref1], bedoelde overtreding een weigering inhoudt medewerking te verlenen
      aan de toepassing van [artikel 5:17, eerste lid, van de Algemene wet bestuursrecht][ref2] kan de raad een last
      onder dwangsom opleggen om inzage te verlenen in in die last aangegeven zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '69'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 70a
    text: |-
      De raad kan ingeval van overtreding van [artikel 25b, eerste of tweede lid][ref1], of van
      [artikel 25e, eerste volzin][ref2], de overtreder:


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25e
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25e
        hoofdstuk: 4a
  - number: 70a.a
    text: |-
      een bestuurlijke boete opleggen van ten hoogste € 450 000 of, indien dat meer is, van ten hoogste 1% van de omzet
      van de onderneming dan wel, indien de overtreding door een ondernemersvereniging is begaan, van de gezamenlijke
      omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de beschikking;
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel70a
  - number: 70a.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel70a
  - number: 70b.1
    text: |-
      De raad kan degene, die een verzegeling als bedoeld in [artikel 54, eerste lid][ref1], verbreekt, opheft of
      beschadigt, of de door de verzegeling bedoelde afsluiting op andere wijze verijdelt, een bestuurlijke boete
      opleggen van ten hoogste € 450 000 of, indien dat meer is, van ten hoogste 1% van de omzet van de onderneming dan
      wel, indien de overtreding door een ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen
      die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel54
    url: https://wetten.overheid.nl/BWBR0008691/2012-07-20#Artikel70b
