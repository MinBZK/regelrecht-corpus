        artikel: 12r
  - number: 58b
    text: |-
      1 In dringende gevallen waarin volgens een eerste onderzoek dat op een overtreding van
      [artikel 6, eerste lid][ref1] of [24, eerste lid][ref2] wijst, de mededinging op ernstige en onherstelbare wijze
      dreigt te worden geschaad, kan de Autoriteit Consument en Markt aan een onderneming of ondernemersvereniging een
      zelfstandige last in de vorm van een voorlopige maatregel als bedoeld in artikel 11, eerste lid, van richtlijn (EU)
      2019/1, opleggen.

      2 De zelfstandige last is evenredig en van toepassing:

      a. gedurende een bepaalde tijdspanne die kan worden verlengd voor zover dat noodzakelijk en passend is; of

      b. tot het moment dat bij besluit is vastgesteld of er een overtreding is van [artikel 6, eerste lid][ref3] of
      [24, eerste lid][ref4].


