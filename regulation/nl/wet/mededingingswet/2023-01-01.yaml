    text: |-
      Voor overeenkomsten, besluiten en gedragingen als bedoeld in [artikel 6, eerste lid][ref1], waarbij ten minste
      een onderneming of ondernemersvereniging betrokken is die bij wettelijk voorschrift of door een bestuursorgaan
      is belast met het beheer van diensten van algemeen economisch belang, geldt [artikel 6, eerste lid][ref2], voor
      zover de toepassing van dat artikel de vervulling van de aan die onderneming of ondernemersvereniging toevertrouwde
      bijzondere taak niet verhindert.


