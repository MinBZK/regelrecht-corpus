  - number: '41'
    text: |-
      1 Het is verboden zonder vergunning een concentratie tot stand te brengen waarvoor ingevolge [artikel 37][ref1] een
      vergunning is vereist.

      2 Een vergunning wordt geweigerd indien als gevolg van de voorgenomen concentratie de daadwerkelijke mededinging op
      de Nederlandse markt of een deel daarvan op significante wijze zou worden belemmerd, met name als het resultaat van
      het in het leven roepen of het versterken van een economische machtspositie. [Artikel 37, derde lid][ref2], is van
      overeenkomstige toepassing indien de aanvraag om een vergunning betrekking heeft op een concentratie als bedoeld
      in [artikel 27, tweede lid][ref3], waarmee de coördinatie van het concurrentiegedrag van de totstandbrengende
      ondernemingen wordt beoogd of totstandgebracht.

      3 Indien ten minste een van de bij een concentratie betrokken ondernemingen bij wettelijk voorschrift of door
      een bestuursorgaan is belast met het beheer van diensten van algemeen economisch belang, kan een vergunning
      slechts worden geweigerd indien de weigering van die vergunning de vervulling van de hun toevertrouwde taak niet
      verhindert.

      4 Een vergunning kan onder beperkingen worden verleend; aan een vergunning kunnen voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel27
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel41
