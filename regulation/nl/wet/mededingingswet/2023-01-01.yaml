        bwb_id: BWBR0033043
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:17
  - number: '51'
    text: |-
      1 Voor het doorzoeken, bedoeld in [artikel 50, eerste lid][ref1], is een voorafgaande machtiging vereist van de
      rechter-commissaris, belast met de behandeling van strafzaken bij de rechtbank Rotterdam. De machtiging kan bij
      wijze van voorzorgsmaatregel worden gevraagd. De machtiging wordt zo mogelijk getoond.

      2 [Artikel 171 van het Wetboek van Strafvordering][ref2] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.

      3 Tegen de beslissing van de rechter-commissaris staat voor zover het verzoek om een machtiging niet is toegewezen,
      voor de Autoriteit Consument en Markt binnen veertien dagen beroep open bij de rechtbank Rotterdam.

      4 Het doorzoeken vindt plaats onder toezicht van de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '50'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '171'
  - number: '52'
    text: |-
      1 Een machtiging als bedoeld in [artikel 51, eerste lid][ref1], is met redenen omkleed en ondertekend en vermeldt:

      a. de naam van de rechter-commissaris die de machtiging heeft gegeven;

      b. de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;

      c. de wettelijke bepaling waarop de doorzoeking berust en het doel waartoe wordt doorzocht;

      d. de dagtekening.

      2 Indien het doorzoeken dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden gesteld, zorgt
      de rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.

      3 De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel51
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '51'
        hoofdstuk: '6'
  - number: '53'
    text: |-
      1 De ambtenaar die een doorzoeking als bedoeld in [artikel 50, eerste lid][ref1], heeft verricht, maakt op zijn
      ambtseed of -belofte een schriftelijk verslag op omtrent de doorzoeking.

      2 In het verslag vermeldt hij:

      a. zijn naam of nummer en zijn hoedanigheid;

      b. de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;

      c. de wettelijke bepaling waarop de doorzoeking berust;

      d. de plaats waar is doorzocht en de naam van degene bij wie de doorzoeking is verricht;

      e. het tijdstip waarop de doorzoeking is begonnen en is beëindigd;

      f. hetgeen tijdens het doorzoeken is verricht en overigens is voorgevallen;

      g. de namen of nummers en de hoedanigheid van de overige personen die aan de doorzoeking hebben deelgenomen.

      3 Het verslag wordt uiterlijk op de vierde dag na die waarop de doorzoeking is beëindigd, toegezonden aan de
      rechter-commissaris die de machtiging heeft gegeven.

      4 Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop de doorzoeking is beëindigd, aan
      degene bij wie de doorzoeking is verricht, uitgereikt of toegezonden. Indien het doel waartoe is doorzocht daartoe
      noodzaakt, kan deze uitreiking of toezending worden uitgesteld. Uitreiking of toezending geschiedt in dat geval,
      zodra het belang van dit doel het toestaat. Indien het niet mogelijk is het afschrift uit te reiken of toe te
      zenden, houdt de rechter-commissaris of de ambtenaar die de doorzoeking heeft verricht, het afschrift gedurende zes
      maanden beschikbaar voor degene bij wie de doorzoeking is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel50
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel53
    references:
      - id: ref1
