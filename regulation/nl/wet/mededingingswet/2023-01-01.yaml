  - number: '40'
    text: |-
      1 De Autoriteit Consument en Markt kan om gewichtige redenen op verzoek van degene die een melding heeft gedaan,
      ontheffing verlenen van het in [artikel 34, eerste lid][ref1], gestelde verbod.

      2 Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.

      3 Indien de Autoriteit Consument en Markt na het verlenen van een ontheffing als bedoeld in het eerste lid ter zake
      van de betrokken melding mededeelt dat op grond van [artikel 37, eerste lid][ref2], een vergunning is vereist, en
      de concentratie tot stand is gebracht voor de mededeling daarvan, dient de concentratie:

      a. indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;

      b. indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel40
