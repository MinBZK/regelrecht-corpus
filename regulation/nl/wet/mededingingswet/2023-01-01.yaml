  - number: '9'
    text: |-
      1 De Autoriteit Consument en Markt kan op een overeenkomst tussen ondernemingen, een besluit van een
      ondernemersvereniging of een onderling afgestemde feitelijke gedraging van ondernemingen waarop krachtens
      [artikel 7, eerste, tweede of vierde lid][ref1], [artikel 6, eerste lid][ref2], niet van toepassing is, bij
      beschikking alsnog [artikel 6, eerste lid][ref3], van toepassing verklaren, indien die overeenkomst, dat besluit
      of die gedraging gezien de marktverhoudingen op de relevante markt in aanzienlijke mate afbreuk doet aan de
      mededinging.

      2 Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref4] van toepassing.

      3 De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref5].


