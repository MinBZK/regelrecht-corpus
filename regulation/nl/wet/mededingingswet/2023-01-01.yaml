        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 49e
    text: |-
      1 Gegevens als bedoeld in artikel 31, vierde lid, van richtlijn (EU) 2019/1 worden door een partij uitsluitend
      gebruikt wanneer dat noodzakelijk is om haar rechten van verdediging uit te oefenen in een procedure bij een
      rechterlijke instantie die rechtstreeks verband houdt met de zaak waarvoor toegang is verleend en enkel wanneer die
      procedure betrekking heeft op de verdeling van een hoofdelijk opgelegde geldboete tussen deelnemers van het kartel
      of de vaststelling door de Autoriteit Consument en Markt van een overtreding van de artikelen 6, eerste lid of 24,
      eerste lid, dan wel de artikelen 101 of 102 van het Verdrag.

      2 Gegevens als bedoeld in artikel 31, vijfde lid, van richtlijn (EU) 2019/1 die in het kader van een onderzoek of
      procedure met het oog op de vaststelling van een overtreding van de artikelen 6, eerste lid, of 24 eerste lid, dan
      wel de artikelen 101 of 102 van het Verdrag door een partij zijn verkregen, worden door die partij niet gebruikt
      in een procedure bij een rechterlijke instantie tot het moment waarop de Autoriteit Consument en Markt of een
      mededingingsautoriteit van een andere lidstaat van de Europese Unie haar onderzoek of procedure met betrekking tot
      de overtreding afsluit door een besluit als bedoeld in de artikelen 10 of 12 van richtlijn (EU) 2019/1 te nemen of
      oordeelt dat er geen redenen zijn om verder op te treden.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel49e
  - number: '50'
    text: |-
      1 De in [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] bedoelde ambtenaren
      zijn bevoegd een woning zonder toestemming van de bewoner te doorzoeken, voor zover dat voor de uitoefening van de
      in [artikel 5:17 van de Algemene wet bestuursrecht][ref2] bedoelde bevoegdheden redelijkerwijs noodzakelijk is.

      2 Zo nodig oefenen zij de bevoegdheid tot doorzoeken uit met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel517
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel50
    references:
