      1 Voor zover de toepassing van [artikel 24, eerste lid][ref1], de vervulling van bij wettelijk voorschrift of door
      een bestuursorgaan aan een onderneming opgedragen beheer van een dienst van algemeen economisch belang verhindert,
      kan de Autoriteit Consument en Markt op aanvraag verklaren dat [artikel 24, eerste lid][ref2], niet van toepassing
      is op een daarbij aangewezen gedraging.

      2 Een beschikking als bedoeld in het eerste lid kan onder beperkingen worden gegeven; aan een beschikking kunnen
      voorschriften worden verbonden.


