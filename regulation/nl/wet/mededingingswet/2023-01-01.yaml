  - number: 25i
    text: |-
      1 Een bestuursorgaan dat economische activiteiten verricht, brengt de afnemers van een product of dienst ten minste
      de integrale kosten van dat product of die dienst in rekening.

      2 Het eerste lid is niet van toepassing:

      a. indien de economische activiteiten strekken ter uitoefening van een bijzonder of uitsluitend recht in de zin van
      [artikel 25a, onder c, respectievelijk b][ref1], en reeds voorschriften gelden omtrent de voor de desbetreffende
      activiteiten in rekening te brengen prijzen;

      b. indien de economische activiteiten inhouden het verstrekken van gegevens die het bestuursorgaan heeft verkregen
      in het kader van de uitoefening van zijn publiekrechtelijke bevoegdheden of het verstrekken van gegevensbestanden
      die uit de genoemde gegevens zijn samengesteld;

      c. op economische activiteiten die worden verricht door een onderneming die belast is met de uitvoering van de
      [Wet sociale werkvoorziening][ref2], voor zover op deze activiteiten [artikel 5 van die wet][ref3] van toepassing
      is.

      3 Bij de vaststelling van de integrale kosten, bedoeld in het eerste lid, wordt voor de financiering met
      vreemd vermogen en met eigen vermogen voor zover dat redelijkerwijs aan de economische activiteiten kan worden
      toegerekend, een bedrag in aanmerking genomen dat niet lager is dan de lasten die in het normale handelsverkeer
      gebruikelijk zijn voor de financiering van ondernemingen.

      4 Op verzoek van de Autoriteit Consument en Markt toont een bestuursorgaan aan dat het heeft voldaan aan de in het
      eerste lid bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0008903
      [ref3]: https://wetten.overheid.nl/BWBR0008903#Artikel5
