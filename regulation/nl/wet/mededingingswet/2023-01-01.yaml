  - number: '2'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bij of krachtens deze wet
      bepaalde.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan de Autoriteit Consument en Markt opdragen werkzaamheden te verrichten in het kader van de
      uitvoering van regelgeving op het gebied van de mededinging op grond van het Verdrag, voor zover daarin niet reeds
      bij of krachtens de wet is voorzien, alsmede werkzaamheden op het gebied van de mededinging in verband met andere
      verdragen of internationale afspraken.

      2 Onze Minister kan de Autoriteit Consument en Markt instructies geven met betrekking tot het verrichten van de
      in het eerste lid bedoelde werkzaamheden, alsmede met betrekking tot het door de Autoriteit Consument en Markt in
      te nemen standpunt in een adviescomité als bedoeld in artikel 14, tweede lid, van verordening 1/2003 en artikel
      19, vierde lid, van verordening 139/2004, met dien verstande dat een instructie inzake een standpunt in een
      adviescomité geen betrekking heeft op de mededingingsaspecten van een individueel geval.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister kan, al dan niet op verzoek van een van Onze andere Ministers, de Autoriteit Consument en
      Markt opdragen een rapportage uit te brengen inzake de effecten voor de mededinging van voorgenomen of geldende
      regelgeving of van een voorgenomen of een geldend besluit.

      2 Het uitbrengen van een rapportage aan een van Onze andere Ministers geschiedt door tussenkomst van Onze Minister.

      3 Op verzoek van een of beide Kamers van de Staten-Generaal brengt de Autoriteit Consument en Markt met tussenkomst
      van Onze Minister een rapportage uit aan de beide Kamers der Staten-Generaal. Onze Minister zendt de rapportage
      onverwijld naar de beide Kamers der Staten-Generaal. Onze Minister kan de rapportage doen vergezellen van zijn
      bevindingen.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel4
  - number: '5'
    text: |-
      Beleidsregels met betrekking tot de uitoefening van de in deze wet aan de Autoriteit Consument en Markt toegekende
      bevoegdheden kunnen betrekking hebben of mede betrekking hebben op de wijze waarop de Autoriteit Consument en Markt
      bij toepassing van [artikel 6, derde lid][ref1], andere belangen dan economische belangen in zijn afweging moet
      betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel5
