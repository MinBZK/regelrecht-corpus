  - number: '13'
    text: |-
      1 [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten tussen ondernemingen, besluiten van
      ondernemersverenigingen en onderling afgestemde feitelijke gedragingen van ondernemingen die de handel tussen
      de lid-staten van de Europese Unie niet ongunstig kunnen beïnvloeden of waardoor de mededinging binnen de
      gemeenschappelijke markt niet wordt verhinderd, beperkt of vervalst doch die, indien dat wel het geval zou zijn,
      zouden zijn vrijgesteld krachtens een verordening als bedoeld in [artikel 12][ref2].

      2 De Autoriteit Consument en Markt kan op een overeenkomst tussen ondernemingen, een besluit van
      een ondernemersvereniging of een onderling afgestemde feitelijke gedraging van ondernemingen waarop
      krachtens het eerste lid [artikel 6, eerste lid][ref3], niet van toepassing is, bij beschikking alsnog
      [artikel 6, eerste lid][ref4], van toepassing verklaren, indien zich omstandigheden voordoen als die welke
      krachtens de desbetreffende verordening kunnen leiden tot de buitentoepassingverklaring van die verordening.

      3 Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van toepassing.

      4 De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref6].


