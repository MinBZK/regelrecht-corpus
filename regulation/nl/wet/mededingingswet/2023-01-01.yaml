      - id: ref2
        bwb_id: BWBR0008691
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '57'
    text: |-
      1 De bestuurlijke boete bedraagt ten hoogste € 900.000 of, indien dat meer is, ten hoogste 10% van de omzet van de
      onderneming, dan wel, indien de overtreding door een ondernemersvereniging is begaan, van de gezamenlijke omzet van
      de ondernemingen die van de vereniging deel uitmaken en actief zijn op de markt die de gevolgen van de inbreuk door
      de vereniging ondervindt.

      2 Indien de overtreding door een ondernemersvereniging is begaan bedraagt de aansprakelijkheid van iedere
      onderneming die deel uitmaakt van de vereniging voor de betaling van de boete niet meer dan de overeenkomstig het
      eerste lid ten hoogste aan een onderneming op te leggen boete.

      3 Ingeval van overtreding van [artikel 6, eerste lid][ref1], wordt voor de toepassing van het eerste lid het
      bedrag van de bestuurlijke boete die ten hoogste kan worden opgelegd, vermenigvuldigd met het aantal jaren dat de
      overtreding heeft geduurd met een maximum van vier jaar en een minimum van één jaar.

      4 Voor de toepassing van het derde lid

      a. worden twaalf opvolgende maanden als jaar beschouwd, en

      b. wordt een deel van een jaar afgerond op hele kalendermaanden waarbij een hele kalendermaand telt als eentwaalfde
      jaar.

      5 Het bedrag van de bestuurlijke boete die ingevolge het eerste en derde lid ten hoogste kan worden opgelegd
      wordt verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
      overtreding opgemaakte rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref2], een
      aan die overtreder voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde
      bestuurlijke boete onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel548
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel57
