  - number: 25j
    text: |-
      1 Een bestuursorgaan bevoordeelt niet een overheidsbedrijf, waarbij hij in de zin van
      [artikel 25g, eerste lid][ref1], is betrokken, boven andere ondernemingen waarmee dat overheidsbedrijf in
      concurrentie treedt en kent evenmin een dergelijk overheidsbedrijf anderszins voordelen toe die verder gaan dan in
      het normale handelsverkeer gebruikelijk is.

      2 Als bevoordeling als bedoeld in het eerste lid wordt in ieder geval ook aangemerkt:

      a. het toestaan van het gebruik door het overheidsbedrijf van de naam en het beeldmerk van de publiekrechtelijke
      rechtspersoon van het bestuursorgaan op een wijze waardoor verwarring bij het publiek is te duchten over de
      herkomst van goederen en diensten;

      b. het leveren van goederen aan, het verrichten van diensten voor en het ter beschikking stellen van middelen aan
      het overheidsbedrijf tegen een vergoeding die lager is dan de integrale kosten.

      3 Het eerste lid is niet van toepassing:

      a. indien de bevoordeling verband houdt met economische activiteiten ter uitoefening van een bijzonder of
      uitsluitend recht in de zin van [artikel 25a, onder c, respectievelijk b][ref2], en reeds voorschriften gelden
      omtrent de voor de desbetreffende activiteiten in rekening te brengen prijzen;

      b. indien naar het oordeel van het bestuursorgaan de bevoordeling kan worden aangemerkt als een steunmaatregel die
      voldoet aan de criteria van artikel 87, eerste lid, van het Verdrag;

      c. op economische activiteiten die worden verricht door een onderneming die belast is met de uitvoering van de
      [Wet sociale werkvoorziening][ref3], voor zover op deze activiteiten [artikel 5 van die wet][ref4] van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25g
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0008903
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel5
