        artikel: 49a
  - number: '35'
    text: |-
      1 Bij een melding worden de bij ministeriële regeling aangewezen gegevens verstrekt.
      [Artikel 4:4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.

      2 Indien niet is voldaan aan het eerste lid of indien de verstrekte gegevens onvoldoende zijn voor de beoordeling
      van een melding, kan de Autoriteit Consument en Markt van de bij de concentratie betrokken partijen, aanvulling van
      de melding verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel44
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:4
  - number: '36'
    text: |-
      Van een ontvangen melding wordt door de Autoriteit Consument en Markt zo spoedig mogelijk mededeling gedaan in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel36
  - number: '37'
    text: |-
      1 De Autoriteit Consument en Markt deelt binnen vier weken na het ontvangen van een melding mede of voor het tot
      stand brengen van de concentratie, waarop die melding betrekking heeft, een vergunning is vereist.

      2 De Autoriteit Consument en Markt kan bepalen dat een vergunning is vereist voor een concentratie waarvan zij
      reden heeft om aan te nemen dat die de daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan op
      significante wijze zou kunnen belemmeren, met name als het resultaat van het in het leven roepen of het versterken
      van een economische machtspositie.

      3 Indien de melding betrekking heeft op een concentratie als bedoeld in [artikel 27, tweede lid][ref1], waarmee
      de coördinatie van het concurrentiegedrag van de totstandbrengende ondernemingen wordt beoogd of totstandgebracht,
      betrekt de Autoriteit Consument en Markt bij haar besluit of een vergunning is vereist, tevens de criteria van
      [artikel 6, eerste en derde lid][ref2].

      4 De mededeling dat voor het totstandbrengen van de concentratie geen vergunning is vereist, kan onder voorwaarden
      worden gedaan, indien uit de terzake van de melding verstrekte gegevens en voorstellen zonder meer blijkt dat de
      in het tweede en derde lid bedoelde gevolgen kunnen worden vermeden indien aan die voorwaarden is voldaan. Voldoen
      partijen niet of niet tijdig aan de voorwaarden, dan is alsnog een vergunning vereist.

      5 Indien niet binnen vier weken toepassing is gegeven aan het eerste lid is voor de concentratie geen
      vergunning vereist. De in de vorige volzin bedoelde termijn vangt aan met ingang van de eerstvolgende dag
      na ontvangst van de melding die niet een zaterdag, zondag of algemeen erkende feestdag is in de zin van de
      [Algemene termijnenwet][ref3].

      6 [Artikel 34, eerste lid][ref4], is niet van toepassing op het tot stand brengen van een concentratie na een
      mededeling dat voor die concentratie geen vergunning is vereist.

      7 Van een mededeling van de Autoriteit Consument en Markt als bedoeld in het eerste lid wordt mededeling gedaan in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002448
      [ref4]: https://wetten.overheid.nl/BWBR0008691#Artikel34
