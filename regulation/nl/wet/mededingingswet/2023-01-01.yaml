  - number: 70a
    text: |-
      1 De Autoriteit Consument en Markt kan ingeval van overtreding van [artikel 25b, eerste of tweede lid][ref1], of
      van [artikel 25e, eerste volzin][ref2], de overtreder:

      a. een bestuurlijke boete opleggen van ten hoogste € 900.000 of, indien dat meer is, van ten hoogste 1% van
      de omzet van de onderneming dan wel, indien de overtreding door een ondernemersvereniging is begaan, van de
      gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken;

      b. een last onder dwangsom opleggen.

      2 De bestuurlijke boete die ingevolge het eerste lid ten hoogste kan worden opgelegd wordt verhoogd met 100%,
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de overtreding opgemaakte
      rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref3], een aan die overtreder
      voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift opgelegde bestuurlijke boete
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25e
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel548
