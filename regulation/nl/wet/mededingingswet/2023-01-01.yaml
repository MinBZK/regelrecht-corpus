  - number: 58a
    text: |-
      1 De last onder dwangsom kan worden opgelegd in de vorm van een corrigerende structurele maatregel als bedoeld in
      artikel 10, eerste lid, van richtlijn (EU) 2019/1, indien die maatregel evenredig is aan de gepleegde overtreding
      en noodzakelijk is om aan de overtreding daadwerkelijk een einde te maken.

      2 Indien er ter correctie van een overtreding meerdere even effectieve corrigerende structurele of
      gedragsmaatregelen als bedoeld in artikel 10, eerste lid, van richtlijn (EU) 2019/1 zijn, wordt de maatregel
      opgelegd die voor de betrokken onderneming of ondernemersvereniging het minst belastend is.

      3 [Artikel 12r, tweede lid, van de Instellingswet Autoriteit Consument en Markt][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12r
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel58a
    references:
