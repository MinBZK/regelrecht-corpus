  - number: 89g
    text: |-
      1 Met het verrichten van een inspectie op grond van een mededingingsverordening door de
      Autoriteit Consument en Markt op verzoek van de Europese Commissie of op verzoek van een
      mededingingsautoriteit van een andere lidstaat van de Europese Unie, zijn belast de krachtens
      [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] aangewezen ambtenaren.

      2 De aangewezen ambtenaren beschikken voor het verrichten van de inspectie over de bevoegdheden die hun ingevolge
      [hoofdstuk 3, paragraaf 1, van de Instellingswet Autoriteit Consument en Markt][ref2] en [hoofdstuk 6][ref3] zijn
      toegekend ter uitoefening van het toezicht op de naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0033043#Paragraaf1
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk6
