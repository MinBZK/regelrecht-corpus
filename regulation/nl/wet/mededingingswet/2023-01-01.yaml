  - number: '29'
    text: |-
      1 De bepalingen van dit hoofdstuk zijn van toepassing op concentraties waarbij de gezamenlijke omzet van de
      betrokken ondernemingen in het voorafgaande kalenderjaar meer bedroeg dan € 150.000.000, waarvan door ten minste
      twee van de betrokken ondernemingen ieder ten minste € 30 000 000 in Nederland is behaald.

      2 De in het eerste lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden verhoogd.

      3 Bij algemene maatregel van bestuur kunnen de in het eerste lid bedoelde bedragen voor een bij die algemene
      maatregel van bestuur te bepalen categorie van ondernemingen voor een periode van ten hoogste vijf jaar worden
      verlaagd. Deze periode kan telkens bij algemene maatregel van bestuur worden verlengd.

      4 In afwijking van het eerste lid zijn voor pensioenfondsen in de zin van de [Pensioenwet][ref1] de bepalingen van
      dit hoofdstuk van toepassing op concentraties waarbij de gezamenlijke waarde van de bruto geboekte premies van de
      betrokken ondernemingen in het voorafgaande kalenderjaar meer bedroeg dan € 500.000.000 en daarvan door ten minste
      twee van de betrokken ondernemingen ieder ten minste € 100.000.000 is ontvangen van Nederlandse ingezetenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020809
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020809
  - number: '30'
    text: |-
      1 De berekening van de omzet, bedoeld in [artikel 29, eerste lid][ref1], geschiedt op de voet van het bepaalde in
      [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.

      2 Wanneer de concentratie tot stand wordt gebracht door middel van de verwerving van de zeggenschap over delen van
      een of meer ondernemingen, welke delen al dan niet eigen rechtspersoonlijkheid bezitten, wordt bij de berekening
      van de omzet, bedoeld in [artikel 29, eerste lid][ref3], ten aanzien van de vervreemder of de vervreemders
      uitsluitend rekening gehouden met de omzet van de te vervreemden delen die voorwerp zijn van de transactie.

      Twee of meer verwervingen als bedoeld in de eerste volzin die binnen een periode van twee jaar plaatsvinden tussen
      dezelfde personen of ondernemingen, worden beschouwd als één concentratie die tot stand gebracht wordt op de dag
      van de laatste transactie.

      3 Onverminderd het bepaalde in het tweede lid worden voor de berekening van de omzet van een betrokken onderneming
      als bedoeld in [artikel 29, eerste lid][ref4], de omzetten van de volgende ondernemingen opgeteld:

      a. de betrokken onderneming;

      b. de ondernemingen waarin de betrokken onderneming rechtstreeks of middellijk:

      1°. meer dan de helft van het kapitaal of de bedrijfsactiva bezit, dan wel

      2°. de bevoegdheid heeft meer dan de helft van de stemrechten uit te oefenen, dan wel

      3°. de bevoegdheid heeft meer dan de helft van de leden van de raad van toezicht of van bestuur, of van de
      krachtens de wet tot vertegenwoordiging bevoegde organen te benoemen, dan wel

      4°. het recht heeft de onderneming te leiden;

      c. ondernemingen die in een betrokken onderneming over de in onderdeel b genoemde rechten of bevoegdheden
      beschikken;

      d. ondernemingen waarin een in onderdeel c bedoelde onderneming over de in onderdeel b genoemde rechten of
      bevoegdheden beschikt;

      e. ondernemingen waarbij ten minste twee ondernemingen als bedoeld in de onderdelen a tot en met d gezamenlijk over
      de in onderdeel b genoemde rechten of bevoegdheden beschikken.

      4 Indien bij de concentratie betrokken ondernemingen gezamenlijk beschikken over de in het derde lid, onderdeel b,
      genoemde rechten of bevoegdheden, wordt voor de berekening van de omzet van de betrokken ondernemingen als bedoeld
      in [artikel 29, eerste lid][ref5]:

      a. geen rekening gehouden met de omzet, die het resultaat is van de verkoop van produkten en het leveren van
      diensten tussen de gemeenschappelijke onderneming en elk van de betrokken ondernemingen of van enige andere met de
      betrokken onderneming verbonden onderneming als bedoeld in het derde lid, onderdelen b tot en met e;

      b. rekening gehouden met de omzet die het resultaat is van de verkoop van produkten en het verlenen van diensten
      tussen de gemeenschappelijke onderneming en derde ondernemingen. Deze omzet wordt aan de ondernemingen toegerekend
      in verhouding tot hun deelnemingen in de gemeenschappelijke onderneming.

      5 Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 29, eerste lid][ref6], worden transacties tussen de in het derde lid bedoelde ondernemingen buiten
      beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel29
