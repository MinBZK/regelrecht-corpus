  - number: 89f
    text: |-
      1 De ambtenaar die bijstand heeft verleend bij een inspectie in een woning of bij een doorzoeking van een andere
      plaats dan een woning, maakt op zijn ambtseed of -belofte een schriftelijk verslag op omtrent de inspectie.

      2 In het verslag vermeldt hij:

      a. zijn naam of nummer en zijn hoedanigheid;

      b. de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;

      c. de beschikking waarbij de Europese Commissie de inspectie heeft gelast;

      d. de plaats van de inspectie en de naam van degene bij wie de inspectie is verricht;

      e. de wijze van binnentreden en het tijdstip waarop de inspectie is begonnen en is beëindigd;

      f. hetgeen tijdens de inspectie is verricht en overigens is voorgevallen;

      g. de namen of nummers en de hoedanigheid van de overige personen die aan de inspectie hebben deelgenomen.

      3 Het verslag wordt uiterlijk op de vierde dag na die waarop de inspectie is beëindigd, toegezonden aan de rechter-
      commissaris die de machtiging heeft gegeven.

      4 Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop de inspectie is beëindigd, aan
      degene bij wie de inspectie is verricht, uitgereikt of toegezonden. Indien het doel van de inspectie daartoe
      noodzaakt, kan deze uitreiking of toezending worden uitgesteld.

      Uitreiking of toezending geschiedt in dat geval, zodra het belang van dit doel het toestaat. Indien het niet
      mogelijk is het afschrift uit te reiken of toe te zenden, houdt de rechter-commissaris of de ambtenaar die de
      bijstand heeft verleend, het afschrift gedurende zes maanden beschikbaar voor degene bij wie de inspectie is
      verricht.

      5 Voor zover het een inspectie in een woning betreft, geldt dit artikel in afwijking van de [artikelen 10][ref1] en
      [11 van de Algemene wet op het binnentreden][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel11
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89f
