        artikel: 24a
  - number: 25h
    text: |-
      1 Dit hoofdstuk is niet van toepassing op:

      a. openbare scholen als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      [artikel 1 van de Wet op de expertisecentra][ref2], en [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref3];

      b. openbare instellingen als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref4];

      c. openbare instellingen als bedoeld in
      [artikel 1.1, onder h, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];

      d. de instellingen, bedoeld in [artikel 1.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6],
      en de organisaties, bedoeld in [artikel 3 van de TNO-wet][ref7] en in
      [artikel 2 van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref8];

      e. publieke media-instellingen als bedoeld in [artikel 1.1 van de Mediawet 2008][ref9].

      2 Dit hoofdstuk is niet van toepassing op het aanbieden van goederen of diensten door bestuursorganen aan andere
      bestuursorganen of aan overheidsbedrijven voor zover deze goederen of diensten zijn bestemd voor de uitvoering van
      een publiekrechtelijke taak.

      3 Dit hoofdstuk is niet van toepassing op bestuursorganen als bedoeld in
      [artikel 1.1, eerste lid, onder b, van de Algemene wet bestuursrecht][ref10] en op bestuursorganen van openbare
      lichamen van beroep en bedrijf die zijn ingesteld op grond van [artikel 134 van de Grondwet][ref11].

      4 Dit hoofdstuk is niet van toepassing indien het economische activiteiten van een bestuursorgaan betreft ten
      aanzien waarvan een maatregel is getroffen die naar het oordeel van het bestuursorgaan kan worden aangemerkt als
      een steunmaatregel die voldoet aan de criteria van artikel 107, eerste lid, van het Verdrag.

      5 Dit hoofdstuk is niet van toepassing op economische activiteiten en op een bevoordeling als bedoeld in
      [artikel 25j][ref12], welke plaatsvinden respectievelijk plaatsvindt in het algemeen belang.

      6 De vaststelling of economische activiteiten of een bevoordeling plaatsvinden respectievelijk plaatsvindt in het
      algemeen belang geschiedt voor provincies, gemeenten en waterschappen door provinciale staten, de gemeenteraad
      respectievelijk het algemeen bestuur en voor het Rijk en voor zelfstandige bestuursorganen als bedoeld in
      [artikel 1, onderdeel a, van de Kaderwet zelfstandige bestuursorganen][ref13] door de minister die het aangaat.


