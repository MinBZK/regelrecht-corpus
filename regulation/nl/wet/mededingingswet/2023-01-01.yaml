        paragraaf: '3'
  - number: '39'
    text: |-
      1 [Artikel 34, eerste lid][ref1], is niet van toepassing in geval van een openbaar overnamebod of een reeks van
      transacties met effecten, gericht op het van meerdere verkopers verkrijgen van een deelname in het kapitaal van een
      onderneming, mits de concentratie onverwijld aan de Autoriteit Consument en Markt wordt gemeld, en de verkrijger de
      aan de deelname in het kapitaal verbonden stemrechten niet uitoefent.

      2 Indien de Autoriteit Consument en Markt ter zake van een melding als bedoeld in het eerste lid mededeelt dat op
      grond van [artikel 37, eerste lid][ref2], een vergunning is vereist, is [artikel 41, eerste lid][ref3], niet van
      toepassing, maar dient de concentratie:

      a. indien niet binnen vier weken na die mededeling een vergunning is aangevraagd, dan wel de aanvraag om een
      vergunning wordt ingetrokken of de vergunning wordt geweigerd, binnen dertien weken ongedaan te worden gemaakt;

      b. indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, binnen dertien
      weken na de verlening daarmee in overeenstemming te worden gebracht.

      3 De Autoriteit Consument en Markt kan, op verzoek van degene die een melding heeft gedaan als bedoeld in
      het eerste lid, bepalen dat, in afwijking van het eerste lid, de in dat lid bedoelde stemrechten mogen worden
      uitgeoefend om de volle waarde van diens belegging te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0008691#Artikel41
