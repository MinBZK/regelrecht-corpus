    text: |-
      De Autoriteit Consument en Markt wordt aangemerkt als de mededingingsautoriteit voor Nederland in de zin van
      [verordening 1/2003](32003R0001) en als bevoegde autoriteit in de zin van [verordening 139/2004](32004R0139) en
      oefent de krachtens de verordeningen op grond van artikel 103 van het Verdrag bestaande bevoegdheid uit om de
      artikelen 101 en 102 van het Verdrag toe te passen, alsmede de krachtens artikel 104 van het Verdrag bestaande
      bevoegdheid om te beslissen over de toelaatbaarheid van mededingingsafspraken en over het misbruik maken van een
      machtspositie op de gemeenschappelijke markt.
