preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is ter vervanging van de Wet economische mededinging
    nieuwe regels vast te stellen omtrent mededingingsafspraken en economische machtsposities, alsmede om regels te
    stellen omtrent toezicht op concentraties van ondernemingen, en daarbij zoveel mogelijk aan te sluiten bij de
    regels betreffende de mededinging krachtens het Verdrag tot oprichting van de Europese Gemeenschap;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken en Klimaat;

      b. Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];

      c.

      d. Verdrag: het Verdrag betreffende de werking van de Europese Unie;

      e. overeenkomst: een overeenkomst in de zin van artikel 101, eerste lid, van het Verdrag;

      f. onderneming: een onderneming in de zin van artikel 101, eerste lid, van het Verdrag;

      g. ondernemersvereniging: een ondernemersvereniging in de zin van artikel 101, eerste lid, van het Verdrag;

      h. onderling afgestemde feitelijke gedragingen: onderling afgestemde feitelijke gedragingen in de zin van artikel
      101, eerste lid, van het Verdrag;

      i. economische machtspositie: positie van een of meer ondernemingen die hen in staat stelt de instandhouding van
      een daadwerkelijke mededinging op de Nederlandse markt of een deel daarvan te verhinderen door hun de mogelijkheid
      te geven zich in belangrijke mate onafhankelijk van hun concurrenten, hun leveranciers, hun afnemers of de
      eindgebruikers te gedragen;

      j.

      k. [verordening 1/2003](32003R0001): [verordening (EG) nr. 1/2003](32003R0001) van de Raad van de Europese Unie
      van 16 december 2002 betreffende de uitvoering van de mededingingsregels van de artikelen 81 en 82 van het Verdrag
      (PbEG 2003, L 1);

      l. [verordening 139/2004](32004R0139): [verordening (EG) nr. 139/2004](32004R0139) van de Raad van de Europese Unie
      van 20 januari 2004 betreffende de controle op concentraties van ondernemingen (PbEG L 24);

      m. mededingingsverordening: verordening genoemd in de onderdelen k en l;

      n. consumentenorganisaties: stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun statuten
      tot taak hebben het behartigen van de collectieve belangen van consumenten;

      o. richtlijn (EU) 2019/1: richtlijn (EU) 2019/1 van het Europees Parlement en de Raad van 11 december 2018 tot
      toekenning van bevoegdheden aan de mededingingsautoriteiten van de lidstaten voor een doeltreffendere handhaving en
      ter waarborging van de goede werking van de interne markt (PbEU 2019, L 11).


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel1
