  - number: '42'
    text: |-
      1 Een aanvraag om vergunning wordt ingediend bij de Autoriteit Consument en Markt.

      2 Bij ministeriële regeling kan worden bepaald welke gegevens bij een aanvraag dienen te worden verstrekt.

      3 Van een ontvangen aanvraag wordt door de Autoriteit Consument en Markt zo spoedig mogelijk mededeling gedaan in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel42
  - number: '44'
    text: |-
      1 De Autoriteit Consument en Markt geeft haar beschikking op de aanvraag binnen dertien weken na ontvangst van
      die aanvraag. Het niet binnen dertien weken geven van een beschikking wordt gelijkgesteld met het verlenen van
      een vergunning.

      2 Indien een aanvraag is ingediend voordat blijkens een mededeling van de Autoriteit Consument en Markt voor
      de desbetreffende concentratie een vergunning is vereist, wordt deze niet in behandeling genomen alvorens die
      mededeling is bekendgemaakt. De in het eerste lid genoemde termijn vangt aan op het moment van die bekendmaking.

      3 Van de beschikking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel44
  - number: '45'
    text: |-
      De Autoriteit Consument en Markt kan een vergunning intrekken indien de verstrekte gegevens zodanig onjuist waren
      dat op de aanvraag anders zou zijn beslist als de juiste gegevens wel bekend zouden zijn geweest.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel45
  - number: '46'
    text: |-
      1 De Autoriteit Consument en Markt kan om gewichtige redenen op verzoek van degene die een vergunning heeft
      aangevraagd, ontheffing verlenen van het in [artikel 41, eerste lid][ref1], gestelde verbod tot op die aanvraag
      onherroepelijk is beslist.

      2 Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.

      3 Indien nadat een ontheffing is verleend als bedoeld in het eerste lid de aanvraag om een vergunning wordt
      ingetrokken of de vergunning wordt geweigerd, dient de concentratie, voor zover deze dan reeds is tot stand
      gebracht, binnen dertien weken ongedaan te worden gemaakt.

      4 Indien de vergunning onder beperkingen wordt verleend of daaraan voorschriften worden verbonden, dient de
      concentratie, voor zover deze dan reeds is tot stand gebracht, binnen dertien weken daarmee in overeenstemming te
      worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel41
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '47'
    text: |-
      1 Onze Minister kan, nadat de Autoriteit Consument en Markt een vergunning voor het tot stand brengen van een
      concentratie heeft geweigerd, op een daartoe strekkende aanvraag besluiten die vergunning te verlenen indien naar
      zijn oordeel gewichtige redenen van algemeen belang die zwaarder wegen dan de te verwachten belemmering van de
      mededinging, daartoe nopen.

      2 Een aanvraag als bedoeld in het eerste lid kan worden gedaan tot vier weken nadat de beschikking van de
      Autoriteit Consument en Markt om een vergunning te weigeren onherroepelijk is geworden.

      3 Indien een aanvraag als bedoeld in het eerste lid is gedaan wordt de behandeling van beroepschriften inzake de
      beschikking van de Autoriteit Consument en Markt opgeschort, totdat op die aanvraag onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel47
  - number: '48'
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens bij een tot Onze Minister gerichte aanvraag om een
      vergunning dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel48
  - number: '49'
    text: |-
      1 Onze Minister geeft zijn beschikking op een aanvraag, in overeenstemming met het gevoelen van de ministerraad,
      binnen twaalf weken na ontvangst van die aanvraag.

      2 [Artikel 44, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel44
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel49
