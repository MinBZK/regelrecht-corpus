      1 De berekening van de omzet, bedoeld in [artikel 7, eerste lid, onder b][ref1], geschiedt op de voet van het
      bepaalde in [artikel 377, zesde lid, van boek 2 van het Burgerlijk Wetboek][ref2] voor de netto-omzet.

      2 Indien een onderneming behoort tot een groep als bedoeld in
      [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref3] worden voor de berekening van de omzet van die
      onderneming de omzetten van alle tot die groep behorende ondernemingen opgeteld. Bij deze berekening worden
      transacties tussen de tot die groep behorende ondernemingen buiten beschouwing gelaten.

      3 Voor de berekening van de gezamenlijke omzet van de betrokken ondernemingen, bedoeld in
      [artikel 7, eerste lid, onder b][ref4], worden de transacties tussen die ondernemingen buiten beschouwing gelaten.


