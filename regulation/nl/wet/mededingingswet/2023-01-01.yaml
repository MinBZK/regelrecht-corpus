    text: |-
      1 Een consumentenorganisatie wordt geacht belanghebbende te zijn bij besluiten genomen op grond van deze wet.

      2 De Autoriteit Consument en Markt kan bij toepassing van
      [artikel 3.11, tweede lid van de Algemene wet bestuursrecht][ref1] in zaken waarbij een consumentenorganisatie
      als bedoeld in het eerste lid belanghebbende is, om gewichtige redenen onderscheid maken tussen de overtreder
      en genoemde consumentenorganisatie bij de beoordeling van de vraag of op de zaak betrekking hebbende stukken of
      gedeelten van stukken ter inzage worden gelegd.


