  - number: '64'
    text: |-
      1 De vervaltermijn, bedoeld in [artikel 5:45 van de Algemene wet bestuursrecht][ref1] wordt telkens gestuit
      door een handeling van de Autoriteit Consument en Markt ter verrichting van een onderzoek of procedure met
      betrekking tot de overtreding, alsmede door een dergelijke handeling van de Europese Commissie of van een
      mededingingsautoriteit van een andere lidstaat van de Europese Unie met betrekking tot een overtreding van de
      artikelen 101 en 102 van het Verdrag.

      2 De stuiting van de vervaltermijn gaat in op de dag waarop tenminste één onderneming of
      ondernemersvereniging die aan de overtreding heeft deelgenomen, dan wel één van degenen, bedoeld in
      [artikel 51, tweede lid, onder 2° van het Wetboek van Strafrecht][ref2], van de handeling schriftelijk in kennis
      wordt gesteld.

      3 De stuiting van de vervaltermijn eindigt op de dag waarop de betrokken mededingingsautoriteit
      haar onderzoek of procedure met betrekking tot de overtreding afsluit door een besluit als
      bedoeld in de [artikelen 56][ref3], [58a][ref4] of [58b][ref5], de [artikelen 12h][ref6] of
      [12j van de Instellingswet Autoriteit Consument en Markt][ref7], de artikelen 10, 12 of 13 van richtlijn (EU)
      2019/1 of de artikelen 7, 9 of 10 van [verordening 1/2003](32003R0001), te nemen of oordeelt dat er geen redenen
      zijn om verder op te treden.

      4 Op het moment van stuiting vangt de vervaltermijn opnieuw aan.

      5 De bevoegdheid, bedoeld in het eerste lid vervalt uiterlijk tien jaren nadat de
      overtreding heeft plaatsgevonden, verlengd met de periode waarin de vervaltermijn ingevolge
      [artikel 5:45, derde lid, van de Algemene wet bestuursrecht][ref8] wordt opgeschort.

      6 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de vervaltermijn, bedoeld in
      [artikel 12r, derde lid, van de Instellingswet Autoriteit Consument en Markt][ref9].


