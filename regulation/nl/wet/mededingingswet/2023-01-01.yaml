  - number: '34'
    text: |-
      1 Het is verboden een concentratie tot stand te brengen voordat het voornemen daartoe aan de Autoriteit Consument
      en Markt is gemeld en vervolgens vier weken zijn verstreken.

      2 Geen melding kan worden gedaan indien een goedkeuring voor een concentratie als bedoeld in
      [artikel 49a, eerste lid, van de Wet marktordening gezondheidszorg][ref1], dan wel een ontheffing als bedoeld in
      artikel 49d van die wet, ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel49a
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel34
