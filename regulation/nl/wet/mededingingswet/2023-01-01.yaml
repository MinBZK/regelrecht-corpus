  - number: 25g
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder overheidsbedrijf:

      a. een onderneming met privaatrechtelijke rechtspersoonlijkheid, niet zijnde een personenvennootschap met
      rechtspersoonlijkheid, waarin een publiekrechtelijke rechtspersoon, al dan niet tezamen met een of meer andere
      publiekrechtelijke rechtspersonen, in staat is het beleid te bepalen;

      b. een onderneming in de vorm van een personenvennootschap, waarin een publiekrechtelijke rechtspersoon deelneemt.

      2 Een publiekrechtelijke rechtspersoon is alleen in staat in een onderneming het beleid te bepalen in de zin van
      het eerste lid, onder a:

      a. indien hij, al dan niet tezamen met een of meer andere publiekrechtelijke rechtspersonen, beschikt over de
      meerderheid van de stemrechten, verbonden aan de door de rechtspersoon van de onderneming uitgegeven aandelen;

      b. indien meer dan de helft van de leden van het bestuur of het toezichthoudend orgaan wordt benoemd door een of
      meer publiekrechtelijke rechtspersonen of door leden of aandeelhouders die een publiekrechtelijke rechtspersoon
      zijn;

      c. indien de onderneming een dochtermaatschappij in de zin van
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] is van een rechtspersoon waarvoor onderdeel a of b van
      toepassing is; of

      d. in andere gevallen, voor zover bij algemene maatregel van bestuur bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel25g
