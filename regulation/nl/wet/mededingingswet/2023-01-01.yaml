  - number: 89gb
    text: |-
      Na een daartoe strekkend verzoek van een mededingingsautoriteit van een andere lidstaat van de Europese Unie stelt
      de Autoriteit Consument en Markt een adressaat in kennis van informatie als bedoeld in artikel 25, onderdelen a, b
      of c, van richtlijn (EU) 2019/1.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89gb
  - number: 89gc
    text: |-
      1 De Autoriteit Consument en Markt legt na een daartoe strekkend verzoek van een mededingingsautoriteit van een
      andere lidstaat van de Europese Unie een definitief besluit tot oplegging van een geldboete als bedoeld in artikel
      13 van richtlijn (EU) 2019/1 of een besluit tot oplegging van een dwangsom als bedoeld in artikel 16 van richtlijn
      (EU) 2019/1 ten uitvoer, voor zover die mededingingsautoriteit na redelijke inspanningen op haar eigen grondgebied
      te hebben geleverd, heeft vastgesteld dat de onderneming of ondernemersvereniging jegens welke de geldboete of
      dwangsom invorderbaar is, in de lidstaat van die mededingingsautoriteit niet over voldoende activa beschikt om
      invordering van de geldboete of dwangsom mogelijk te maken.

      2 In gevallen anders dan bedoeld in het eerste lid, kan de Autoriteit Consument en Markt na een daartoe strekkend
      verzoek van een mededingingsautoriteit van een andere lidstaat van de Europese Unie een definitief besluit tot
      oplegging van een geldboete als bedoeld in artikel 13 van richtlijn (EU) 2019/1 of een besluit tot oplegging van
      een dwangsom als bedoeld in artikel 16 van richtlijn (EU) 2019/1 ten uitvoer leggen.

      3 [Afdeling 4.4.4 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.

      4 De verjaringstermijn voor de tenuitvoerlegging van een besluit als bedoeld in het eerste of tweede lid, wordt
      bepaald overeenkomstig artikel 26, vierde lid, van richtlijn (EU) 2019/1.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.4.4
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89gc
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.4.4
  - number: 89gd
    text: |-
      Een verzoek als bedoeld in de artikelen 25 of 26, eerste of tweede lid, van richtlijn (EU) 2019/1 voldoet aan en
      wordt uitgevoerd overeenkomstig artikel 27, tweede, derde, vierde, vijfde en zesde lid, van richtlijn (EU) 2019/1.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89gd
  - number: 89ge
    text: |-
      1 De Autoriteit Consument en Markt geeft uitvoering aan artikel 27, zevende lid en achtste lid, eerste, derde en
      vierde alinea, van richtlijn (EU) 2019/1.

      2 De Autoriteit Consument en Markt geeft in afwijking van het eerste lid geen uitvoering aan artikel 27, achtste
      lid, eerste alinea, van richtlijn (EU) 2019/1, indien de baten naar verwachting niet opwegen tegen de kosten die de
      Autoriteit Consument en Markt maakt om de in artikel 27 bedoelde kosten te verhalen.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89ge
  - number: 89gf
    text: |-
      De bevoegdheid inzake geschillen ten aanzien van de toepassing van de artikelen 25 of 26, eerste of tweede lid, van
      richtlijn (EU) 2019/1 en het recht dat op die geschillen van toepassing is, wordt bepaald overeenkomstig artikel 28
      van richtlijn (EU) 2019/1.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89gf
  - number: 89gg
    text: |-
      1 Indien de Autoriteit Consument en Markt, na toepassing te hebben gegeven aan artikel 11, derde lid, van
      [verordening 1/2003](32003R0001) concludeert dat er geen gronden zijn om een onderzoek of procedure met betrekking
      tot de overtreding voort te zetten, stelt zij de Europese Commissie hiervan in kennis.

      2 Indien de Autoriteit Consument en Markt een besluit neemt als bedoeld in
      [artikel 56, aanhef en onderdeel b][ref1], of [artikel 58b, eerste lid][ref2], stelt zij het European Competition
      Network hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel58b
