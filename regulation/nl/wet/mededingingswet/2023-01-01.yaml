  - number: 25a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. richtlijn: richtlijn nr. 2006/111/EG van de Commissie van de Europese Gemeenschappen van 16 november 2006 (PbEG
      L 318) betreffende de doorzichtigheid in de financiële betrekkingen tussen lidstaten en openbare bedrijven en de
      financiële doorzichtigheid binnen bepaalde ondernemingen;

      b. uitsluitend recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een
      onderneming wordt verleend, waarbij voor die onderneming het recht wordt voorbehouden om binnen een bepaald
      geografisch gebied een dienst te verrichten of een activiteit uit te oefenen;

      c. bijzonder recht: een recht dat bij wettelijk voorschrift of bij besluit van een bestuursorgaan aan een beperkt
      aantal ondernemingen wordt verleend en waarbij binnen een bepaald geografisch gebied:

      1°. het aantal van deze ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op een
      andere wijze dan volgens objectieve, evenredige en niet-discriminerende criteria tot twee of meer wordt beperkt,

      2°. verscheidene concurrerende ondernemingen die een dienst mogen verrichten of een activiteit mogen uitoefenen op
      een andere wijze dan volgens deze criteria worden aangewezen, of

      3°. aan een of meer ondernemingen op een andere wijze dan volgens deze criteria voordelen worden toegekend waardoor
      enige andere onderneming aanzienlijk wordt belemmerd in de mogelijkheid om dezelfde activiteiten binnen hetzelfde
      geografische gebied onder in wezen gelijkwaardige voorwaarden uit te oefenen;

      d. verschillende activiteiten: enerzijds producten of diensten met betrekking tot welke aan een onderneming een
      bijzonder of uitsluitend recht is verleend, of alle diensten van algemeen economisch belang waarmee een onderneming
      is belast en, anderzijds, elk ander afzonderlijk product met betrekking tot hetwelk of elke andere afzonderlijke
      dienst met betrekking tot welke de onderneming werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel25a
  - number: 25b
    text: |-
      1 Ondernemingen waaraan overeenkomstig artikel 106, eerste lid, van het Verdrag een bijzonder of uitsluitend
      recht is verleend of die overeenkomstig artikel 106, tweede lid, van het Verdrag met het beheer van een dienst van
      algemeen economisch belang zijn belast en met betrekking tot deze dienst in enigerlei vorm compensatie ontvangen,
      en die verschillende activiteiten uitvoeren, houden een zodanige administratie bij dat:

      a. de registratie van de lasten en baten van de verschillende activiteiten gescheiden zijn;

      b. alle lasten en baten, op grond van consequent toegepaste en objectief te rechtvaardigen beginselen inzake
      kostprijsadministratie, correct worden toegerekend;

      c. de beginselen inzake kostprijsadministratie volgens welke de administratie wordt gevoerd, duidelijk zijn
      vastgelegd.

      2 De onderneming bewaart de in het eerste lid, onderdelen a, b en c, bedoelde gegevens gedurende vijf jaar,
      gerekend vanaf het einde van het boekjaar waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel25b
  - number: 25c
    text: |-
      [Artikel 25b, eerste lid][ref1], is niet van toepassing op activiteiten die onder de toepassing vallen van
      specifieke door de Europese Unie vastgestelde bepalingen inzake een gescheiden administratie, andere dan die van
      de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25d
    text: |-
      1 [Artikel 25b, eerste lid][ref1], is voorts niet van toepassing op:

      a. ondernemingen die diensten verrichten welke de handel tussen lidstaten niet op merkbare wijze ongunstig kunnen
      beïnvloeden;

      b. ondernemingen waarvan de totale nettojaaromzet minder dan € 40 miljoen heeft bedragen gedurende de twee
      boekjaren voorafgaande aan het boekjaar waarin de onderneming een bijzonder of uitsluitend recht heeft genoten dat
      overeenkomstig artikel 106, eerste lid, van het Verdrag is verleend of waarin zij is belast met het beheer van een
      dienst van algemeen economisch belang overeenkomstig artikel 106, tweede lid, van het Verdrag;

      c. ondernemingen die voor een redelijke periode met het beheer van een dienst van algemeen economisch belang belast
      zijn overeenkomstig artikel 106, tweede lid, van het Verdrag, indien de overheidssteun in enigerlei vorm, waaronder
      een subsidie, ondersteuning of compensatie, die zij ontvangen, was vastgesteld ingevolge een open, doorzichtige en
      niet-discriminerende procedure.

      2 Voor de toepassing van het eerste lid, onderdeel b, wordt ten aanzien van openbare banken de nettojaaromzet
      vervangen door een balanstotaal van minder dan € 800 miljoen.

      3 Het in het eerste lid, onderdeel b, en het in het tweede lid genoemde bedrag kunnen bij regeling van Onze
      Minister worden gewijzigd indien de wijziging voortvloeit uit een bindend besluit van een orgaan van de Europese
      Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25b
        hoofdstuk: 4a
  - number: 25e
    text: |-
      Indien de Europese Commissie verzoekt om terbeschikkingstelling van gegevens als bedoeld in
      [artikel 25b, eerste lid][ref1], verstrekt de onderneming die dit aangaat, de Autoriteit Consument en Markt op
      diens verzoek binnen de door haar gestelde termijn de desbetreffende gegevens. De Autoriteit Consument en Markt
      doet de gegevens toekomen aan de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25b
