  - number: '38'
    text: |-
      1 Indien niet is voldaan aan [artikel 35, eerste lid][ref1], en de Autoriteit Consument en Markt binnen
      vijf werkdagen na de dag van ontvangst van de melding, degene die de melding heeft gedaan, heeft verzocht
      om toezending van de ontbrekende gegevens of documenten, vangt de in de [artikelen 34, eerste lid][ref2], en
      [37, eerste en vijfde lid][ref3], bedoelde termijn van vier weken aan op de dag waarop die gegevens of documenten
      alsnog zijn verstrekt.

      2 Onverminderd het eerste lid, wordt de in de [artikelen 34, eerste lid][ref4], en
      [37, eerste en vijfde lid][ref5], bedoelde termijn van vier weken opgeschort met ingang van de dag waarop de
      Autoriteit Consument en Markt op grond van [artikel 35, tweede lid][ref6], aanvulling van de melding verlangt tot
      de dag waarop de aanvulling door elk van de partijen van wie aanvulling is gevraagd, is gegeven.

      3 De termijn kan voorts naar aanleiding van een met redenen omkleed verzoek van elk van degenen die de melding doen
      door de Autoriteit Consument en Markt eenmalig worden opgeschort indien dat naar haar oordeel in het belang van de
      behandeling van de melding is.

      4 Een melding geldt als niet gedaan indien de in het tweede lid bedoelde aanvulling van gegevens niet heeft
      plaatsgevonden binnen zes maanden na de datum waarop het laatste verzoek tot aanvulling is gedaan en de termijn
      niet ingevolge het derde lid is opgeschort.


