  - number: 89e
    text: |-
      1 Een machtiging als bedoeld in [artikel 89c, eerste lid][ref1], of [artikel 89d, eerste lid][ref2], is met redenen
      omkleed en ondertekend en vermeldt:

      a. de naam van de rechter-commissaris die de machtiging heeft gegeven;

      b. de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;

      c. de beschikking waarbij de Europese Commissie de inspectie heeft gelast;

      d. de dagtekening.

      2 Indien een inspectie dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden gesteld, zorgt
      de rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.

      3 De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.

      4 Voor zover het een inspectie in een woning betreft, geldt dit artikel in afwijking van
      [artikel 6 van de Algemene wet op het binnentreden][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel89c
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel89d
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel6
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel89e
