      1 Met het verlenen van bijstand bij een inspectie op grond van een
      mededingingsverordening door de Europese Commissie, zijn belast de krachtens
      [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] aangewezen ambtenaren.

      2 [Artikel 5:12 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.

      3 Bij verzet tegen een inspectie door de Europese Commissie, verlenen de aangewezen ambtenaren de nodige bijstand
      om de Europese Commissie in staat te stellen de inspectie te verrichten, zo nodig met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
