  - number: '56'
    text: |-
      Ingeval van overtreding van [artikel 6, eerste lid][ref1], of van [artikel 24, eerste lid][ref2], kan de Autoriteit
      Consument en Markt de overtreder:

      a. een besluit nemen tot vaststelling van die overtreding;

      b. een bestuurlijke boete opleggen;

      c. een last onder dwangsom opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel24
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel56
