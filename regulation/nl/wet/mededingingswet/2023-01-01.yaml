  - number: '26'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt onder zeggenschap verstaan de mogelijkheid om op grond van feitelijke of
      juridische omstandigheden een beslissende invloed uit te oefenen op de activiteiten van een onderneming.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel26
  - number: '27'
    text: |-
      1 Onder een concentratie wordt verstaan:

      a. het fuseren van twee of meer voorheen van elkaar onafhankelijke ondernemingen;

      b. het direct of indirect verkrijgen van zeggenschap over één of meer ondernemingen of delen daarvan door middel
      van de verwerving van participaties in het kapitaal of van vermogensbestanddelen, uit hoofde van een overeenkomst
      of op enige andere wijze, door:

      1°. één of meer natuurlijke personen of rechtspersonen die reeds zeggenschap over ten minste één andere onderneming
      hebben; of

      2°. één of meer andere ondernemingen.

      2 De totstandbrenging van een gemeenschappelijke onderneming die duurzaam alle functies van een zelfstandige
      economische eenheid vervult, is een concentratie in de zin van het eerste lid, onder b.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel27
  - number: '28'
    text: |-
      1 In afwijking van [artikel 27][ref1] wordt niet als concentratie beschouwd:

      a. het door banken, financiële instellingen of verzekeraars als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], tot wier normale werkzaamheden de verhandeling van
      effecten voor eigen rekening of voor rekening van derden behoort, tijdelijk houden van deelnemingen die zij in
      een onderneming hebben verworven ten einde deze deelnemingen weer te verkopen, mits zij de aan deze deelnemingen
      verbonden stemrechten niet uitoefenen om het marktgedrag van deze onderneming te bepalen, of zij deze stemrechten
      slechts uitoefenen om de verkoop van deze deelnemingen voor te bereiden, en deze verkoop plaatsvindt binnen een
      jaar na de verwerving;

      b. het verkrijgen van zeggenschap door:

      1°.

      2°.

      3°. personen als bedoeld in [artikel 1:76, eerste lid, van de Wet op het financieel toezicht][ref3];

      4°. bewindvoerders als bedoeld in [artikel 3:162d van de Wet op het financieel toezicht][ref4];

      5°. personen als bedoeld in [artikel 3:175, negende lid, van de Wet op het financieel toezicht][ref5];

      c. het verwerven van participaties in het kapitaal als bedoeld in [artikel 27, eerste lid, onder b][ref6], met
      inbegrip van participaties in een gemeenschappelijke onderneming als bedoeld in artikel 27, tweede lid, door
      participatiemaatschappijen mits de aan de deelname verbonden stemrechten slechts worden uitgeoefend om de volle
      waarde van deze beleggingen veilig te stellen.

      2 De in het eerste lid, onder a, genoemde termijn kan op verzoek door de Autoriteit Consument en Markt worden
      verlengd wanneer de desbetreffende instellingen of verzekeraars aantonen dat de verkoop binnen de gestelde termijn
      redelijkerwijs niet mogelijk was.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel27
