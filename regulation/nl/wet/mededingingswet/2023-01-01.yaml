  - number: '6'
    text: |-
      1 Verboden zijn overeenkomsten tussen ondernemingen, besluiten van ondernemersverenigingen en onderling afgestemde
      feitelijke gedragingen van ondernemingen, die ertoe strekken of ten gevolge hebben dat de mededinging op de
      Nederlandse markt of een deel daarvan wordt verhinderd, beperkt of vervalst.

      2 De krachtens het eerste lid verboden overeenkomsten en besluiten zijn van rechtswege nietig.

      3 Het eerste lid geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke gedragingen
      die bijdragen tot verbetering van de productie of van de distributie of tot bevordering van de technische of
      economische vooruitgang, mits een billijk aandeel in de daaruit voortvloeiende voordelen de gebruikers ten goede
      komt, en zonder nochtans aan de betrokken ondernemingen

      a. beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of

      b. de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.

      4 Een onderneming of ondernemersvereniging die zich op het derde lid beroept, bewijst dat aan dat lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0008691/2023-01-01#Artikel6
  - number: '7'
    text: |-
      1 [Artikel 6, eerste lid][ref1], geldt niet voor overeenkomsten, besluiten en onderling afgestemde feitelijke
      gedragingen als bedoeld in dat artikel indien:

      a. bij de desbetreffende overeenkomst of onderling afgestemde feitelijke gedraging niet meer dan acht ondernemingen
      betrokken zijn, dan wel bij de desbetreffende ondernemersvereniging niet meer dan acht ondernemingen betrokken
      zijn, en

      b. de gezamenlijke omzet in het voorafgaande kalenderjaar van de bij de desbetreffende overeenkomst of onderling
      afgestemde feitelijke gedraging betrokken ondernemingen dan wel de gezamenlijke omzet van de bij de desbetreffende
      ondernemersvereniging betrokken ondernemingen niet hoger is dan:

      1°. € 5 500 000, indien daarbij uitsluitend ondernemingen zijn betrokken wier activiteiten zich in hoofdzaak
      richten op het leveren van goederen;

      2°. € 1 100 000, in alle andere gevallen.

      2 Onverminderd het eerste lid, geldt [artikel 6, eerste lid][ref2], voorts niet voor overeenkomsten, besluiten
      en onderling afgestemde feitelijke gedragingen als bedoeld in dat artikel voor zover daarbij ondernemingen of
      ondernemersverenigingen betrokken zijn die daadwerkelijke of potentiële concurrenten zijn op een of meer van de
      relevante markten, indien:

      a. het gezamenlijke marktaandeel van de bij de overeenkomst, het besluit of de onderling afgestemde feitelijke
      gedraging betrokken ondernemingen of ondernemersverenigingen op geen van de relevante markten waarop de
      overeenkomst, het besluit of de onderling afgestemde feitelijke gedraging van invloed is, groter is dan 10%, en

      b. de overeenkomst, het besluit of de onderling afgestemde feitelijke gedraging de handel tussen lidstaten niet op
      merkbare wijze ongunstig kan beïnvloeden.

      3 In geval van afzonderlijke overeenkomsten tussen een onderneming of een ondernemersvereniging en twee of
      meer andere ondernemingen, die dezelfde strekking hebben, worden voor de toepassing van het eerste lid die
      overeenkomsten tezamen beschouwd als één overeenkomst.

      4 Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen,
      dat [artikel 6, eerste lid][ref3], niet van toepassing is op in die maatregel omschreven categorieën van
      overeenkomsten, besluiten of gedragingen als bedoeld in dat artikel, die in het algemeen vanuit een oogpunt van
      mededinging van duidelijk ondergeschikte betekenis zijn.

      5 Het in het eerste lid, onder a, genoemde aantal en de in het eerste lid, onder b, genoemde bedragen kunnen bij
      algemene maatregel van bestuur worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel6
