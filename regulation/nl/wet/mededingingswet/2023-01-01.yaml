  - number: '15'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, zo nodig onder voorschriften en beperkingen, dat
      [artikel 6, eerste lid][ref1], niet geldt voor in die maatregel omschreven categorieën van overeenkomsten,
      besluiten en gedragingen als bedoeld in dat artikel, die bijdragen tot verbetering van de produktie of van de
      distributie of tot bevordering van de technische of economische vooruitgang, mits een billijk aandeel in de daaruit
      voortvloeiende voordelen de gebruikers ten goede komt, en zonder nochtans aan de betrokken ondernemingen

      a. beperkingen op te leggen die voor het bereiken van deze doelstellingen niet onmisbaar zijn, of

      b. de mogelijkheid te geven, voor een wezenlijk deel van de betrokken goederen en diensten de mededinging uit te
      schakelen.

      2 In een algemene maatregel van bestuur als bedoeld in het eerste lid kan worden bepaald dat de
      Autoriteit Consument en Markt op een overeenkomst, besluit of gedraging waarvoor krachtens die maatregel
      [artikel 6, eerste lid][ref2], niet geldt, bij beschikking alsnog artikel 6, eerste lid, van toepassing kan
      verklaren, indien wordt voldaan aan de in die algemene maatregel van bestuur genoemde vereisten.

      3 Op de voorbereiding van de beschikking is [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.

      4 De beschikking treedt niet eerder in werking dan zes weken na de datum van haar terinzagelegging overeenkomstig
      [artikel 3:44, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel6
