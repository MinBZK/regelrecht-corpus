  - number: 89ga
    text: |-
      1 Indien de Autoriteit Consument en Markt overeenkomstig artikel 22 van [verordening 1/2003](32003R0001) een
      inspectie of een verhoor namens en voor rekening van een mededingingsautoriteit van een andere lidstaat van
      de Europese Unie verricht, kunnen ambtenaren en andere door die mededingingsautoriteit daartoe aangewezen
      personen onder toezicht van de ambtenaren van de Autoriteit Consument en Markt de inspectie of het verhoor
      bijwonen en tijdens de inspectie of het verhoor bijstand verlenen aan de Autoriteit Consument en Markt wanneer
      zij de bevoegdheden, bedoeld in de [artikelen 5:15 tot en met 5:19 van de Algemene wet bestuursrecht][ref1], de
      [artikelen 12b tot en met 12d van de Instellingswet Autoriteit Consument en Markt][ref2], of [artikel 50][ref3],
      uitoefent.

      2 De Autoriteit Consument en Markt kan namens en voor rekening van een mededingingsautoriteit
      van een andere lidstaat van de Europese Unie de bevoegdheden, bedoeld in de
      [artikelen 5:15 tot en met 5:19 van de Algemene wet bestuursrecht][ref4], de
      [artikelen 12b tot en met 12d Instellingswet Autoriteit Consument en Markt][ref5], of [artikel 50][ref6] uitoefenen
      om vast te stellen of gevolg is gegeven aan onderzoeksmaatregelen of besluiten als bedoeld in de artikelen 6 en 8
      tot en met 12 van richtlijn (EU) 2019/1 van die mededingingsautoriteit.

      3 Artikel 12, tweede en derde lid, van [verordening 1/2003](32003R0001) zijn van overeenkomstige toepassing indien
      de Autoriteit Consument en Markt met het oog op de toepassing van het tweede lid gegevens of inlichtingen verstrekt
      aan of ontvangt van een mededingingsautoriteit van een andere lidstaat van de Europese Unie.


