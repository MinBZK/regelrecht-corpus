    text: |-
      De straffen en maatregelen, gesteld op overtredingen van voorschriften gesteld bij of krachtens de Wet economische
      mededinging, die een economisch delict opleveren en die zijn begaan voor het tijdstip waarop [artikel 94][ref1] in
      werking treedt, blijven van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel94
