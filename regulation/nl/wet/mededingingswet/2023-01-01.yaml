  - number: '31'
    text: |-
      1 Voor de toepassing van [artikel 29, eerste lid][ref1], wordt ten aanzien van banken en financiële instellingen
      als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] de omzet vervangen door de som van de
      volgende, overeenkomstig de regels op grond van [artikel 417 van Boek 2 van het Burgerlijk Wetboek][ref3], op de
      winst- en verliesrekening over het voorafgaande boekjaar opgenomen baten:

      a. rentebaten en soortgelijke baten;

      b. opbrengsten uit waardepapieren;

      c. ontvangen provisie;

      d. resultaat uit financiële transacties;

      e. overige bedrijfsopbrengsten;

      na aftrek van de belasting over de toegevoegde waarde en andere rechtstreeks met de betrokken baten samenhangende
      belastingen.

      2 Voor verzekeraars in de zin van de [Wet op het financieel toezicht][ref4] en premiepensioeninstellingen in de
      zin van de Wet op het financieel toezicht wordt voor de toepassing van [artikel 29, eerste lid][ref5], de omzet
      vervangen door de waarde van de bruto geboekte premies. De in artikel 29, eerste lid, omschreven omzet behaald
      in Nederland dient berekend te worden op basis van de bruto geboekte premies die zijn ontvangen van Nederlandse
      ingezetenen.


