  - number: '6'
    text: |-
      1 Een nieuwe school ontvangt personele en materiële bekostiging over de eerste vijf maanden van het eerste
      schooljaar op basis van de prognose van het aantal leerlingen per 1 oktober volgend op de feitelijke start per
      1 augustus van het eerste schooljaar t (jaar 0). De in de vorige volzin bedoelde bekostiging wordt in december
      van het eerste schooljaar vastgesteld op basis van de voorlopige telling van het werkelijk aantal leerlingen
      op 1 oktober en uiterlijk in de maand december van het tweede schooljaar gewijzigd vastgesteld op basis van het
      definitieve aantal leerlingen dat op 1 oktober in het eerste schooljaar staat ingeschreven bij de school.

      2 In het eerste schooljaar wordt éénmalig een aanvullende bekostiging verstrekt ten bedrage van éénmaal
      de landelijke gemiddelde personeelslast die op 1 augustus van dat schooljaar geldt voor leraren van de
      schoolsoortgroep waartoe de school behoort. Deze aanvullende bekostiging wordt, middels een beschikking van de
      Minister, in een keer in de maand augustus van het eerste schooljaar uitbetaald.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel6
  - number: '7'
    text: |-
      1 Het bevoegd gezag van de nieuwe school kan op grond van [artikel 85a, tweede lid van de W.V.O.][ref1], een
      aanvraag indienen voor een aanvullende bekostiging vanwege leerlingengroei.

      2.De leerlingengroei wordt vastgesteld door het verschil te berekenen tussen het aantal geprognosticeerde
      leerlingen in het lopende schooljaar en het aantal leerlingen op 1 oktober van jaar t-1.

      3 De aanvullende bekostiging wordt vastgesteld door het in het tweede lid berekende aantal leerlingen te
      vermenigvuldigen met een bedrag per leerling. De uitkomst wordt vervolgens vermenigvuldigd met 32% omdat de
      bekostiging betrekking heeft op de laatste vijf maanden van het kalenderjaar. De in de vorige volzin bedoelde
      bekostiging wordt in december van het lopende schooljaar vastgesteld op basis van de voorlopige telling van het
      werkelijk aantal leerlingen op 1 oktober en uiterlijk in de maand december van het daaropvolgende schooljaar
      gewijzigd vastgesteld op basis van het definitieve aantal leerlingen dat op 1 oktober in het voorafgaande
      schooljaar staat ingeschreven bij de school.

      4 De in het eerste lid vermelde aanvraag kan betrekking hebben op het tweede schooljaar of volgende schooljaren
      tot en met het schooljaar waarin de school volgroeid is (tot en met het examen vmbo, havo, vwo, afhankelijk van
      de toegestane schoolsoorten in het kader van de voorzieningenplanning). Op het moment dat de school volgroeid is
      (examenjaar gevuld) vervalt deze uitzonderingspositie.

      5 De aanvraag wordt bij de Minister ingediend en gehonoreerd afhankelijk van een beoordeling van de financiële
      positie van het bevoegd gezag van de nieuwe school aan de hand van de jaarrekening over het voorafgaande
      kalenderjaar. De financiële positie wordt vastgesteld aan de hand van de gebruikelijke kengetallen, zoals
      weerstandsvermogen, liquiditeit etc.


