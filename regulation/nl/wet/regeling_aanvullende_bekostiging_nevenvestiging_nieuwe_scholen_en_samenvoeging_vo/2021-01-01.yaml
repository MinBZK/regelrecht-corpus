  - number: '8'
    text: |-
      1 De aanvullende bekostiging nevenvestiging wordt verstrekt als tegemoetkoming in de uitgaven voor een
      nevenvestiging met spreidingsnoodzaak. De startbekostiging en aanvullende bekostiging nieuwe school wordt verstrekt
      als tegemoetkoming in uitgaven die zijn verbonden aan het starten van een nieuwe school. De aanvullende bekostiging
      bij samenvoeging van scholen of van scholengemeenschappen wordt verstrekt als tegemoetkoming in de uitgaven voor
      een samenvoeging.

      2 Verrekening van eventueel niet-bestede middelen of overschotten vindt niet plaats.

      3 De verklaring van de accountant bij de jaarrekening omvat tevens een oordeel over de rechtmatige besteding van
      deze aanvullende bekostiging.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel8
  - number: '10'
    text: |-
      De regeling [Verlenging startvergoeding en aanvullende bekostiging nieuwe scholen voor voortgezet onderwijs][ref1]
      (Uitleg 2005, 4) en de [Regeling aanvullende personele bekostiging nevenvestigingen met spreidingsnoodzaak VO][ref2]
      worden met ingang van 1 augustus 2008 ingetrokken.


