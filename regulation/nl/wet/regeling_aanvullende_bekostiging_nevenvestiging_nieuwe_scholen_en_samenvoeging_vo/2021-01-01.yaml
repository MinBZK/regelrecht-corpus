  - number: 7a
    text: |-
      1 Het bevoegd gezag van een school of scholengemeenschap, die met ingang van 1 augustus is ontstaan uit
      samenvoeging van twee of meer zelfstandige scholen of scholengemeenschappen, ontvangt het eerste kalenderjaar na
      de samenvoeging aanvullende bekostiging voor personeelskosten, berekend op grond van het derde lid, en aanvullende
      bekostiging voor exploitatiekosten, berekend op grond van het vierde lid.

      2 Het bevoegd gezag, bedoeld in het eerste lid, ontvangt in het tweede, derde, vierde en vijfde kalenderjaar na
      de samenvoeging respectievelijk 80 procent, 60 procent, 40 procent en 20 procent van de aanvullende bekostiging,
      berekend op grond van het derde en vierde lid. De hoogte van de aanvullende bekostiging voor personeelskosten
      wordt jaarlijks aangepast aan de ontwikkelingen van de gemiddelde personeelslast, de hoogte van de aanvullende
      bekostiging voor exploitatiekosten wordt jaarlijks aangepast aan de ontwikkeling van de bekostiging voor
      exploitatiekosten.

      3 De aanvullende bekostiging voor personeelskosten is voor het eerste kalenderjaar na samenvoeging gelijk aan Xp-
      Yp, waarin:

      Xp = de som van de bekostiging voor personeelskosten van alle bij de samenvoeging betrokken scholen, berekend
      op grond van [artikel 84, derde lid][ref1], jo. [artikel 85 van de Wet op het voortgezet onderwijs][ref2] in het
      kalenderjaar na de samenvoeging, wanneer de samenvoeging niet zou hebben plaatsgevonden, en

      Yp = de bekostiging voor personeelskosten van de samengevoegde school, berekend op grond van
      [artikel 84, derde lid][ref3], jo. [artikel 85 van de Wet op het voortgezet onderwijs][ref4], in het kalenderjaar
      na de samenvoeging.

      4 De aanvullende bekostiging voor exploitatiekosten is voor het eerste kalenderjaar na samenvoeging gelijk aan Xm-
      Ym, waarin:

      Xm = de som van de bekostiging voor exploitatiekosten van alle bij de samenvoeging betrokken scholen, berekend
      op grond van [artikel 86, derde lid, onderdeel a en b, van de Wet op het voortgezet onderwijs][ref5] in het
      kalenderjaar na de samenvoeging, wanneer de samenvoeging niet zou hebben plaatsgevonden, en

      Ym = de bekostiging voor exploitatiekosten van de gefuseerde school, berekend op grond van
      [artikel 86, derde lid, onderdeel a en b, van de Wet op het voortgezet onderwijs][ref6], in het kalenderjaar na
      de samenvoeging.

      5 In afwijking van het eerste lid komt een bevoegd gezag niet in aanmerking voor aanvullende bekostiging als op
      1 augustus gelijktijdig met de samenvoeging één of meer van de bij de samenvoeging betrokken scholengemeenschappen
      tevens is betrokken bij een splitsing en er daarbij geen volledige scholengemeenschap wordt opgeheven. Indien
      er wel een volledige scholengemeenschap wordt opgeheven – een scholengemeenschap splitst waarbij alle delen
      van die scholengemeenschap fuseren met een andere school- is de aanvullende bekostiging voor personeels- en
      exploitatiekosten voor het eerste kalenderjaar na samenvoeging gelijk aan Zp+Zm, waarin:

      Zp = de bekostiging voor personeelskosten van de opgeheven scholengemeenschap, berekend op grond van
      [artikel 84, derde lid][ref7], jo. [artikel 85 van de Wet op het voortgezet onderwijs][ref8] in het kalenderjaar na
      opheffing, wanneer de opheffing niet zou hebben plaatsgevonden, en

      Zm = de bekostiging voor exploitatiekosten van de opgeheven scholengemeenschap, berekend op grond van
      [artikel 86, derde lid, onderdeel a en b, van de Wet op het voortgezet onderwijs][ref9] in het kalenderjaar na de
      opheffing, wanneer de opheffing niet zou hebben plaatsgevonden.

      6 De aanvullende bekostiging wordt in dit geval in gelijke delen verdeeld over de uit de samenvoeging resulterende
      scholen. Het tweede lid is van overeenkomstige toepassing op de aanvullende bekostiging op grond van dit lid.

      7 De aanvullende bekostiging wegens samenvoeging vervalt volledig indien een school, die is ontstaan uit een
      samenvoeging als bedoeld in het eerste lid, binnen vijf jaar een splitsing ondergaat. Dit geldt ook voor de
      eventuele aanvullende bekostiging in verband met een eerdere samenvoeging.

      8 De betaling van de aanvullende bekostiging voor personeelskosten en exploitatiekosten vindt plaats in twee
      bedragen per jaar die beide worden uitbetaald voor 1 april van het kalenderjaar waarop de aanvullende bekostiging
      betrekking heeft. Voor scholen of scholengemeenschappen die per 1 augustus 2013 zijn ontstaan uit samenvoeging en
      die op grond van dit artikel in aanmerking komen voor aanvullende bekostiging, vindt de betaling voor het eerste
      en tweede kalenderjaar na samenvoeging plaats voor 1 april 2016. Voor scholen of scholengemeenschappen die per
      1 augustus 2014 zijn ontstaan uit samenvoeging en die op grond van dit artikel in aanmerking komen voor aanvullende
      bekostiging, vindt de betaling voor het eerste kalenderjaar na samenvoeging plaats voor 1 april 2016.


