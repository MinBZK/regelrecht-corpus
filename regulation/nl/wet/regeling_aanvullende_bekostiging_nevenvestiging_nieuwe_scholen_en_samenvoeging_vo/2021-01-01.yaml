  - number: '11'
    text: |-
      Indien het bij koninklijke boodschap van 14 december 2007 ingediende voorstel van wet tot wijziging van onder meer
      de Wet op het voortgezet onderwijs ter modernisering, vereenvoudiging en beperking van de wettelijke regels over
      de voorzieningenplanning bij scholen (Kamerstukken II 2007/08, 31 310, nr. 2) nadat het tot wet is verheven, in
      werking treedt, treedt deze regeling op hetzelfde tijdstip in werking.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling wordt aangehaald als: Regeling aanvullende bekostiging nevenvestiging, nieuwe scholen en samenvoeging
      vo.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel12
