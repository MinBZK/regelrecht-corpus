  - number: '2'
    text: |-
      1 De Minister verstrekt, ter uitvoering van artikel III, achtste lid, van de Wet tot wijziging van de Wet
      op het voortgezet onderwijs ter modernisering, vereenvoudiging en beperking van de wettelijke regels over de
      voorzieningenplanning bij scholen, aan het bevoegd gezag van een school per kalenderjaar aanvullende bekostiging
      voor personeels- en exploitatiekosten ten behoeve van een nevenvestiging met spreidingsnoodzaak die is gevormd voor
      1 augustus 2008.

      2 Er is sprake van een nevenvestiging met spreidingsnoodzaak indien:

      a. de nevenvestiging hemelsbreed 10 kilometer of meer is verwijderd van een vestiging van een school waaraan
      hetzelfde verlangd onderwijs en dezelfde schoolsoort wordt aangeboden, en

      b. aan de nevenvestiging van een school voor praktijkonderwijs 80 leerlingen, bij overige scholen 120 leerlingen of
      meer ingeschreven staan op 1 oktober voorafgaande aan het kalenderjaar waarop de aanvullende bekostiging betrekking
      heeft.

      3 De aanvullende bekostiging als bedoeld in het eerste lid wordt niet meer verstrekt indien het aantal leerlingen
      op 1 oktober voorafgaande aan het kalenderjaar waarop de aanvullende bekostiging betrekking heeft voor het
      praktijkonderwijs minder dan 80 leerlingen, bij de overige scholen minder dan 120 leerlingen bedraagt. Het recht
      herleeft indien er weer wordt voldaan aan het vereiste aantal leerlingen.

      4 Op of na 1 augustus 2008 gevormde nevenvestigingen vallen niet meer binnen de begripsbepaling van
      nevenvestigingen met spreidingsnoodzaak en komen niet in aanmerking voor de in het eerste lid vermelde aanvullende
      bekostiging.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel2
  - number: '3'
    text: |-
      De aanvullende bekostiging bedraagt per nevenvestiging:

      a. éénmaal de landelijke gemiddelde personeelslast onderwijsondersteunend personeel;

      b. éénmaal de landelijke gemiddelde personeelslast voor directiepersoneel van de schoolsoortgroep waartoe de school
      behoort; en

      c. éénmaal aanvullende exploitatiekosten.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel3
  - number: '4'
    text: |-
      De betaling van de aanvullende bekostiging vindt plaats volgens het betaalritme van de reguliere personele en
      materiële bekostiging.
    url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#Artikel4
  - number: '5'
    text: |-
      1 Voorafgaand aan de feitelijke start per 1 augustus van het schooljaar t (jaar 0) ontvangt een nieuwe school
      éénmalig, zoals aangegeven in de tabel, opgenomen in het vijfde lid, een personele bekostiging waarvan de hoogte
      afhankelijk is van de soort school.

      2 Voorafgaand aan de feitelijke start per 1 augustus van het schooljaar t (jaar 0), ontvangt een nieuwe school
      de bekostiging voor het lesmateriaal en eenmalig vier maanden exploitatiekosten op basis van de prognose van
      het aantal leerlingen in het eerste schooljaar. Voor de berekening van deze bekostiging worden de normbedragen
      per leerling voor de leerjaren 1 en 2 van de [Regeling bekostiging exploitatiekosten vo][ref1] gehanteerd. De
      in de vorige volzin bedoelde bekostiging wordt in december van het eerste schooljaar vastgesteld op basis van
      de voorlopige telling van het werkelijk aantal leerlingen op 1 oktober en uiterlijk in de maand december van het
      tweede schooljaar gewijzigd vastgesteld op basis van het definitieve aantal leerlingen dat op 1 oktober in het
      eerste schooljaar staat ingeschreven bij de school.

      3 De startbekostiging, bedoeld in het eerste en tweede lid, wordt verstrekt nadat het bevoegd gezag van de school
      de prognose van het aantal leerlingen op 1 oktober van het eerste schooljaar heeft ingediend bij de Minister.

      4 De in het derde lid vermelde prognose wordt ingediend nadat de goedkeuring voor de start van de nieuwe school is
      verleend in het kader van de voorzieningenplanning. Het bevoegd gezag van de school ontvangt van de Minister een
      beschikking waarin de startbekostiging is vermeld.

