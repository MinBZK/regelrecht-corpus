preamble:
  text: |-
    Gelet op artikel 85a, eerste lid, en artikel 89, eerste lid, van de Wet op het voortgezet onderwijs;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024237/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. Minister: de Minister van Onderwijs, Cultuur en Wetenschap;

      b. nevenvestiging: een vestiging van een school of scholengemeenschap niet zijnde de tijdelijke dan wel
      hoofdvestiging;

      c. school: een school voor voortgezet onderwijs als bedoeld in
      [artikel 1 van de Wet op het voortgezet onderwijs][ref1];

      d. nevenvestiging met spreidingsnoodzaak: een nevenvestiging van een school die voldoet aan de criteria, genoemd
      in [artikel 2][ref2];

      e. verlangd onderwijs: het verlangd onderwijs als bedoeld in
      [artikel 65, eerste lid, van de Wet op het voortgezet onderwijs][ref3];

      f. nieuwe school: een school bedoeld in artikel 2 van de Regeling voorzieningenplanning VO;

      g. samenvoeging: samenvoeging als bedoeld in
      [artikel 71, tweede of derde lid, van de Wet op het voortgezet onderwijs][ref4];

      h. splitsing: splitsing als bedoeld in [artikel 3 van de Regeling voorzieningenplanning voortgezet onderwijs][ref5].


