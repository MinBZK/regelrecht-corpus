preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wegenverkeerswet op een aantal punten van
    uiteenlopende aard te wijzigen, de Wet personenvervoer 2000 te wijzigen ten aanzien van het openbaar-vervoerverbod
    en op enkele punten van technische aard, de Wet advies en overleg verkeer en waterstaat te wijzigen aangezien
    het in verband met het raadplegen van betrokkenen en organisaties bij het beleidsproces wenselijk is een meer op
    maat gesneden vorm van overleg op het terrein van Verkeer en Waterstaat in te richten, de Wet op de economische
    delicten, de Wet luchtvaart, de Binnenvaartwet, de Wet capaciteitsbeheersing binnenvaartvloot, de Wet belastingen
    op milieugrondslag, de Waterwet, de Invoeringswet Waterwet, de Waterschapswet en de Crisis- en herstelwet te
    wijzigen op enkele punten van technische aard, alsmede een abuis in de Telecommunicatiewet te herstellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031614/2013-01-01#ArtikelAanhef
articles:
  - number: XV
    text: |-
      1 Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, met uitzondering van de [artikelen I, onderdelen Aa en E][ref1], en [XI][ref2].

      2 De [artikelen I, onderdelen Aa en E][ref3], en [XI][ref4] treden in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.

      3 [Artikel II, onderdeel Ca][ref5], werkt terug tot en met 1 januari 2011.

      4 [Artikel V, onderdeel A][ref6], werkt terug tot en met 1 juli 2009.

      5 Indien de [Wet algemene bepalingen omgevingsrecht][ref7] eerder in werking treedt dan [artikel XII][ref8] van
      deze wet, werkt artikel XII terug tot en met het tijdstip van inwerkingtreding van de Wet algemene bepalingen
      omgevingsrecht.


