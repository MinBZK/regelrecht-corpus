preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Gaswet en de Elektriciteitswet 1998 te wijzigen
    in verband met de versterking van de werking van de gasmarkt, de verbetering van de energie-infrastructuur, de
    verduurzaming van de energiehuishouding en de evaluatie van deze wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029079/2012-02-08#ArtikelAanhef
articles:
  - number: III
    text: |-
      Voor overeenkomsten betreffende de verkoop van gas die zijn gesloten voor het tijdstip van inwerkingtreding
      van [artikel I, onderdeel T][ref1], geldt [artikel 54a][ref2] zoals dit artikel luidde voor het tijdstip van
      inwerkingtreding van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0029079#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel54a
    url: https://wetten.overheid.nl/BWBR0029079/2012-02-08#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0029079
        artikel: I
      - id: ref2
        bwb_id: BWBR0011440
        artikel: 54a
  - number: IIIa
    text: |-
      Voor uitzonderlijke en aanmerkelijke investeringen waarmee is aangevangen voor het tijdstip van inwerkingtreding
      van [artikel I, onderdeel AB, onder 3][ref1], en [artikel II, onderdeel R, onder 3][ref2], van de Wet van
      2 december 2010 tot wijziging van de Gaswet en de Elektriciteitswet 1998, tot versterking van de werking
      van de gasmarkt, verbetering van de voorzieningszekerheid en houdende regels met betrekking tot de voorrang
      voor duurzame elektriciteit, alsmede enkele andere wijzigingen van deze wetten (Stb. 2010, 810), gelden
      [artikel 81b, tweede lid, van de Gaswet][ref3] en [41b, tweede lid, van de Elektriciteitswet 1998][ref4], zoals zij
      luidden voor het tijdstip van inwerkingtreding van artikel I, onderdeel AB, onder 3, en artikel II, onderdeel R,
      onder 3.


      [ref1]: https://wetten.overheid.nl/BWBR0029079#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0029079#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel81b
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0029079/2012-02-08#ArtikelIIIa
