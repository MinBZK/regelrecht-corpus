  - number: IV
    text: |-
      Indien de [artikelen I, onderdelen Y en AC][ref1] en [II, onderdeel S][ref2], in werking
      treden gedurende de periode, bedoeld in [artikel 81, eerste lid, van de Gaswet][ref3] en
      [41, eerste lid, van de Elektriciteitswet 1998][ref4] dan blijven voor die periode de [artikelen 80][ref5] en
      [81c van de Gaswet][ref6] en [41c van de Elektriciteitswet 1998][ref7] van toepassing zoals die luidden voor dat
      tijdstip.


