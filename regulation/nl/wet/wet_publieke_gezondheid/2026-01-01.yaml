  - number: 6b
    text: |-
      1 Bij algemene maatregel van bestuur wordt een vaccinatieprogramma vastgesteld, waarin wordt opgenomen welke
      groepen voor welke vaccinaties in aanmerking komen. Voor de openbare lichamen Bonaire, Sint Eustatius en Saba kan
      een afwijkend aanbod worden opgenomen.

      2 Onze Minister draagt via het RIVM zorg voor de regie op en de coördinatie van de uitvoering, alsmede de
      registratie, bewaking en evaluatie van het vaccinatieprogramma.

      3 Het college van burgemeester en wethouders draagt mede zorg voor het deel van het vaccinatieprogramma dat daartoe
      bij algemene maatregel van bestuur is aangewezen. Het college draagt ervoor zorg dat deze wordt uitgevoerd door
      de organisatie, of onder verantwoordelijkheid van die organisatie, die voor het college de jeugdgezondheidszorg,
      bedoeld in [artikel 5][ref1], uitvoert.

      4 Het college van burgemeester en wethouders past bij de uitvoering van het vaccinatieprogramma de vaccins toe die
      door of vanwege het RIVM worden verstrekt. De vaccins blijven eigendom van het RIVM tot het moment van toediening.

      5 Het college van burgemeester en wethouders draagt ervoor zorg dat aan het RIVM ten behoeve van de taken van
      het RIVM, bedoeld in het tweede lid, wordt gemeld welke organisatie voor de gemeente uitvoering geeft aan de
      vaccinaties.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de kwalitatieve en programmatische
      uitvoering van het deel van het vaccinatieprogramma, bedoeld in het derde lid. Voor de openbare lichamen Bonaire,
      Sint Eustatius en Saba kunnen voor de programmatische uitvoering afwijkende regels worden gesteld.

      7 De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel6b
