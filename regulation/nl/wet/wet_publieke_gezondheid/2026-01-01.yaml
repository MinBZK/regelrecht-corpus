  - number: 58k
    text: |-
      1 Degene die bevoegd is tot het aan een besloten plaats, niet zijnde een woning, treffen van voorzieningen
      of tot het toelaten tot een besloten plaats van personen, draagt ten aanzien van die besloten plaats
      zorg voor zodanige voorzieningen of toelating dat de daar aanwezige personen de bij of krachtens de
      [artikelen 58d, eerste lid][ref1], en [58f tot en met 58i][ref2] gestelde regels in acht kunnen nemen.

      2 Indien de besloten plaats een ruimte betreft waar een beroep of bedrijf wordt uitgeoefend en Onze Minister van
      oordeel is dat de daar aanwezige personen het bepaalde bij of krachtens de [artikelen 58d, eerste lid][ref3], en
      [58f tot en met 58i][ref4] niet in acht kunnen nemen, kan hij een schriftelijke aanwijzing geven aan degene die
      bevoegd is tot het aan die plaats treffen van voorzieningen of tot het toelaten tot die plaats van personen. Indien
      de besloten plaats een ruimte betreft waar geen beroep of bedrijf wordt uitgeoefend, is de burgemeester dan wel de
      voorzitter van de veiligheidsregio bevoegd deze aanwijzing te geven.

      3 In de aanwijzing geeft Onze Minister onderscheidenlijk de burgemeester dan wel de voorzitter van de
      veiligheidsregio met redenen omkleed aan op welke punten de aanwezige personen de bij of krachtens de
      [artikelen 58d][ref5], en [58f tot en met 58i][ref6] gestelde regels niet in acht kunnen nemen, alsmede de in
      verband daarmee te nemen maatregelen. Een aanwijzing bevat de termijn waarbinnen degene die bevoegd is tot het aan
      die plaats treffen van voorzieningen of tot het toelaten tot die plaats van personen, de maatregelen treft.

      4 In een spoedeisende situatie kan Onze Minister onderscheidenlijk de burgemeester dan wel de voorzitter van
      de veiligheidsregio een bevel geven. Indien het bevel mondeling wordt gegeven, wordt het zo spoedig mogelijk op
      schrift gesteld en bekendgemaakt.

      5 Het tweede tot en met vierde lid zijn niet van toepassing op plaatsen in gebruik ten behoeve van een verkiezing
      of op andere bij ministeriële regeling aangewezen plaatsen onder bij die regeling gestelde voorwaarden of
      beperkingen.


