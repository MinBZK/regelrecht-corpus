  - number: '58'
    text: |-
      1 De inenting van personen of de toediening van profylaxe aan personen ter verkrijging van een internationaal
      geldig certificaat als bedoeld in artikel 36 van de Internationale Gezondheidsregeling, geschiedt onder bij
      regeling van Onze Minister vast te stellen voorwaarden.

      2 De certificaten worden opgesteld volgens het in bijlage 6 van de Internationale Gezondheidsregeling opgenomen
      model.

      3 Bij regeling van Onze Minister worden de organisaties of personen aangewezen waar inentingen tegen gele koorts
      mogen worden verschaft.
