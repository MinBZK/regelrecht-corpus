  - number: 58ca
    text: |-
      1 [Artikel 58c, tweede lid][ref1], kan buiten toepassing blijven:

      a. indien een krachtens paragraaf 8 van dit hoofdstuk vastgestelde ministeriële regeling of een onderdeel daarvan
      niet langer voldoet aan één van de onderdelen van [artikel 58b][ref2], of

      b. indien sprake is van:

      1°. een ernstige ontwrichting van de maatschappij of een directe dreiging daarvan, en

      2°. onverwijld toepassing van een bij of krachtens paragraaf 8 van dit hoofdstuk toegekende bevoegdheid
      noodzakelijk is.

      2 Onze Minister zendt een ministeriële regeling die op grond van het eerste lid is vastgesteld zonder toepassing
      van [artikel 58c, tweede lid][ref3], binnen twee dagen na vaststelling aan beide Kamers der Staten-Generaal,
      voorzien van een motivering waarom het eerste lid is toegepast. De regeling vervalt van rechtswege indien de Tweede
      Kamer der Staten-Generaal binnen een week na de toezending besluit niet in te stemmen met de regeling. Artikel 58c,
      derde lid, is van overeenkomstige toepassing.

      3 De procedure, bedoeld in het eerste lid, onder b, mag uitsluitend binnen acht weken na de eerste toepassing
      daarvan worden gebruikt. Deze periode kan steeds met acht weken worden verlengd of voor een periode van acht weken
      opnieuw aanvangen na de inwerkingtreding van een ministeriële regeling waarin het eerste lid, onder b, weer van
      toepassing wordt verklaard. Die regeling wordt met toepassing van [artikel 58c][ref4] tot stand gebracht.


