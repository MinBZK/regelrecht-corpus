  - number: '25'
    text: |-
      1 De arts die een onderzoek bij een laboratorium aanvraagt, stuurt de volgende gegevens mee: de naam, de
      geboortedatum en het burgerservicenummer van de betrokken persoon.

      2 Onverminderd [artikel 22][ref1] meldt het hoofd van het laboratorium de vaststelling van een verwekker van een
      infectieziekte behorend tot groep A1, A2, B1, B2 of C aan de gemeentelijke gezondheidsdienst van de gemeente waarin
      de arts die het onderzoek bij het laboratorium heeft aangevraagd zijn praktijk heeft en verstrekt het daarbij de
      bij algemene maatregel van bestuur bepaalde gegevens.

      3 In aanvulling op het tweede lid bevat de melding de volgende gegevens: de naam van de arts, alsmede de naam, het
      adres, de geboortedatum, het burgerservicenummer, het telefoonnummer, het e-mailadres en de verblijfplaats van de
      betrokken persoon.

      4 Indien de melding betrekking heeft op een persoon die zijn verblijfplaats heeft in een andere gemeente, geeft
      de gemeentelijke gezondheidsdienst deze melding onverwijld door aan de gemeentelijke gezondheidsdienst van de
      verblijfplaats van de betrokkene.

      5 Het hoofd van het laboratorium zorgt op verzoek van de gemeentelijke gezondheidsdienst ervoor dat nader onderzoek
      wordt gedaan naar de ziekteverwekker en dat de gemeentelijke gezondheidsdienst van het resultaat op de hoogte wordt
      gesteld.

      6 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop en de termijn
      waarbinnen de melding plaatsvindt.

      7 Voor de beveiliging van de gegevensverwerking bij de aanvraag, bedoeld in het eerste lid, en de melding worden
      bij regeling van Onze Minister regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
