  - number: 58y
    text: |-
      1 Onze Minister maakt binnen een redelijke termijn na de aanwijzing van een infectieziekte als behorend tot
      groep A1, aan beide Kamers der Staten-Generaal inzichtelijk hoe de bestrijding van de epidemie van de betreffende
      infectieziekte ter hand wordt genomen. Daarbij betrekt Onze Minister de inzet van instrumenten ter voorkoming van
      verspreiding van de betreffende ziekteverwekker, de mogelijke scenario’s en handelingsperspectieven daarbij en
      de vooruitzichten.

      2 Onze Minister zendt maandelijks aan beide Kamers der Staten-Generaal een met redenen omkleed overzicht van de
      krachtens paragraaf 8 van dit hoofdstuk geldende maatregelen. Daarin worden de beide Kamers tevens geïnformeerd
      over de monitoring van de effecten van de maatregelen in de praktijk en over de verwachtingen ten aanzien van het
      voortduren van de maatregelen.

      3 De burgemeester verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot de uitoefening van bevoegdheden op grond van dit
      hoofdstuk nodig heeft. De gegevens en inlichtingen worden kosteloos verstrekt door tussenkomst van de voorzitter
      van de veiligheidsregio.

      4 Indien de voorzitter van de veiligheidsregio toepassing heeft gegeven aan een bevoegdheid als bedoeld in
      paragraaf 8 van dit hoofdstuk, is hij daarover verantwoording schuldig aan de betrokken gemeenteraden. Hij brengt
      daartoe een verslag uit en beantwoordt de vragen van die raden.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58y
  - number: 58z
    text: |-
      1 Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van:

      a. het bepaalde krachtens de [artikelen 58d, eerste lid][ref1] en [58g, eerste zin][ref2], indien de overtreding
      wordt begaan op een besloten plaats indien deze een ruimte betreft waar een beroep of bedrijf wordt uitgeoefend;

      b. het bepaalde krachtens de [artikelen 58k, tweede lid, eerste zin][ref3], en – indien het een bevel van Onze
      Minister betreft – vierde lid, eerste zin, [58n, derde lid, eerste en vierde zin, en vierde lid, eerste zin][ref4],
      [58o][ref5], [58p, eerste, tweede en vijfde lid][ref6], en [58q][ref7].

      2 Onze Minister is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens [artikel 58f, eerste lid, en derde lid, onder e][ref8], indien de overtreding wordt begaan op een
      besloten plaats indien deze een ruimte betreft waar een beroep of bedrijf wordt uitgeoefend.

      3 De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het opleggen van een last onder
      bestuursdwang ter handhaving van:

      a. het bepaalde bij of krachtens de [artikelen 58e, tweede lid, laatste zin][ref9],
      [58h, eerste en tweede lid][ref10], en [58i][ref11], [58j, tweede en vierde lid][ref12],
      [58k, tweede lid, tweede zin][ref13], en – indien het een bevel van de burgemeester dan wel de
      voorzitter van de veiligheidsregio betreft – vierde lid, eerste zin, [58l][ref14], [58m][ref15] en
      [58s, tweede lid, tweede zin][ref16] en [58x, derde lid, tweede zin][ref17];

      b. het bepaalde krachtens de [artikelen 58d, eerste lid][ref18] en [58g, eerste zin][ref19] indien de overtreding
      wordt begaan op een openbare plaats, een publieke plaats of een besloten plaats indien deze geen ruimte betreft
      waar een beroep of bedrijf wordt uitgeoefend.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het
      opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of krachtens
      [artikel 58f, eerste lid, en derde lid, onder e][ref20], indien de overtreding wordt begaan op een openbare
      plaats, een publieke plaats of een besloten plaats indien deze geen ruimte betreft waar een beroep of bedrijf wordt
      uitgeoefend, of ter handhaving van het bepaalde bij of krachtens de [artikelen 58r, eerste en tweede lid][ref21],
      [58s, eerste lid][ref22], [58u][ref23], en [58w, eerste lid, onder a][ref24].

      5 Dit artikel is niet van toepassing indien de overtreding wordt begaan op publieke of besloten plaatsen in gebruik
      ten behoeve van een verkiezing.

      6 Indien een bevoegdheid, genoemd in het derde of vierde lid, wordt uitgeoefend door de gezaghebber
      in de openbare lichamen Bonaire, Sint Eustatius of Saba, zijn op de uitoefening van die bevoegdheid de
      [artikelen 5:12 tot en met 5:20 van de Algemene wet bestuursrecht][ref25] van overeenkomstige toepassing.


