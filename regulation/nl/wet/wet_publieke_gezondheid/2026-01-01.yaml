  - number: 20b
    text: |-
      1 Zodra het belang van de volksgezondheid niet langer vordert dat een in [artikel 1, onderdeel db][ref1],
      genoemde infectieziekte is aangemerkt als behorend tot groep A1, wordt bij regeling van Onze Minister, in
      overeenstemming met het gevoelen van de ministerraad, bepaald dat deze infectieziekte niet langer als zodanig wordt
      aangemerkt. Indien het belang van de volksgezondheid dat vordert kan deze infectieziekte bij diezelfde regeling
      worden aangemerkt als behorend tot groep A2, B1 of B2.

      2 [Artikel 20, derde lid, eerste zin][ref2], is van overeenkomstige toepassing op een regeling als bedoeld in het
      eerste lid, tweede zin. Na de inwerkingtreding van een krachtens het eerste lid vastgestelde regeling, vindt de
      toepassing van deze wet overeenkomstig die regeling plaats.

      3 Na het tot stand komen van een krachtens het eerste lid vastgestelde regeling wordt onverwijld een
      voorstel van wet tot incorporatie van die regeling aan de Tweede Kamer der Staten-Generaal gezonden.
      [Artikel 20, vijfde lid, tweede en derde zin, en zesde lid][ref3] zijn van overeenkomstige toepassing.


