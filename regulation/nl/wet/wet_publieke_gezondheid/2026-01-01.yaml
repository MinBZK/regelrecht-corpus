  - number: '3'
    text: |-
      1 Onze Minister bevordert de kwaliteit en doelmatigheid van de publieke gezondheidszorg en draagt zorg voor de
      instandhouding en verbetering van de landelijke ondersteuningsstructuur.

      2 Onze Minister bevordert interdepartementale en internationale samenwerking op het gebied van de publieke
      gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verstrekken van niet tot
      een persoon herleidbare systematische informatie door het college van burgemeester en wethouders aan Onze Minister
      inzake de uitvoering van deze wet en kan deze verstrekking verplicht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de jeugdgezondheidszorg.

      2 Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:

      a. het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van jeugdigen en
      van gezondheidsbevorderende en -bedreigende factoren,

      b. het ramen van de behoeften aan zorg,

      c. de vroegtijdige opsporing en preventie van specifieke stoornissen, met uitzondering van het perinatale onderzoek
      op phenylketonurie (PKU), congenitale hypothyroïdie (CHT) en adrenogenitaal syndroom (AGS),

      d. het geven van voorlichting, advies, instructie en begeleiding,

      e. het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.

      3 Het college van burgemeester en wethouders draagt er zorg voor dat bij de uitvoering van de taak, bedoeld in het
      eerste lid, gebruik wordt gemaakt van:

      a. de gegevens uit het register onderwijsdeelnemers, bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref1],

      b. digitale gegevensopslag, onder bij regeling van Onze Minister te stellen eisen aan de daarbij
      te gebruiken software, voor zover het gaat om vastleggen van patiëntgegevens als bedoeld in
      [artikel 7:454 van het Burgerlijk Wetboek][ref2].

      4 Het college van burgemeester en wethouders draagt er zorg voor dat het bestand met de gegevens uit het register
      onderwijsdeelnemers, bedoeld in het derde lid, onderdeel a, uiterlijk één maand na verkrijging wordt vernietigd.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkzaamheden, bedoeld in het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
