  - number: 58v
    text: |-
      1 In het kader van de taak van Onze Minister, bedoeld in [artikel 7, eerste lid][ref1], en ter monitoring van de
      naleving van de verplichting van [artikel 58r, eerste lid][ref2], is Onze Minister bevoegd tot verwerking van de
      krachtens de [artikelen 58u][ref3] of [58w][ref4] verstrekte gegevens van een in [artikel 58r, eerste lid][ref5],
      bedoelde persoon.

      2 Indien Onze Minister op grond van bevindingen in het kader van de monitoring nader onderzoek
      door een toezichthouder naar de naleving van de verplichting tot thuisquarantaine door een in
      [artikel 58r, eerste lid][ref6], bedoelde persoon wenselijk acht, of een in artikel 58r, eerste lid, bedoelde
      persoon telefonisch niet heeft kunnen bereiken, kan Onze Minister een melding doen aan de burgemeester dan wel de
      voorzitter van de veiligheidsregio waar de woon- of verblijfplaats van die persoon is gelegen.

      3 Onze Minister, de burgemeester dan wel de voorzitter van de veiligheidsregio en de toezichthouders zijn bevoegd
      tot het verwerken en onderling uitwisselen van een melding als bedoeld in het tweede lid, en de krachtens de
      [artikelen 58u][ref7] of [58w][ref8] verstrekte gegevens van een in [artikel 58r, eerste lid][ref9], bedoelde
      persoon, voor zover dit noodzakelijk is voor het toezicht op en de handhaving van de naleving van artikel 58r,
      eerste lid.

      4 Onze Minister bewaart de krachtens de [artikelen 58u][ref10] of [58w][ref11] verstrekte gegevens niet langer dan
      de krachtens [artikel 58r, eerste lid][ref12], bij ministeriële regeling bepaalde duur van de thuisquarantaine.


