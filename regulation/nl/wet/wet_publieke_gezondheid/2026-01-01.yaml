  - number: 68c
    text: |-
      1 Ter uitvoering van de bij of krachtens deze wet opgedragen taken draagt het bestuurscollege er in ieder geval
      zorg voor dat het beschikt over ten minste één geneeskundige die is belast met de infectieziektebestrijding.

      2 Bij algemene maatregel van bestuur kunnen eisen worden gesteld met betrekking tot het opleidingsniveau of de
      deskundigheid van de geneeskundige, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel68c
  - number: 68e
    text: |-
      1 Ingeval er een gegrond vermoeden bestaat van besmetting van goederen kan de gezaghebber het brengen op het
      grondgebied van het openbaar lichaam van deze goederen verbieden, dan wel verbieden indien niet wordt voldaan aan
      bij beschikking op te leggen voorschriften. De gezaghebber heft de maatregel op als het gevaar is geweken.

      2 Indien een lijk is besmet met een infectieus of giftig agens of een infectieuze of giftige stof, of een gegrond
      vermoeden daarvoor bestaat, waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, kan de gezaghebber
      maatregelen treffen om dit gevaar af te wenden. Deze maatregelen bestaan uit het afnemen van bloed of andere
      vloeistoffen, het isoleren of het verbranden van het lijk.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel68e
  - number: 68f
    text: |-
      1 Onze Minister kan, in overeenstemming met Onze Minister van Veiligheid en Justitie, een laboratorium aanwijzen
      voor het verrichten van onderzoek ten behoeve van de publieke gezondheid en justitie in de openbare lichamen
      Bonaire, Sint Eustatius en Saba.

      2 De volgende instanties kunnen een beroep doen op de organisatie, bedoeld in het eerste lid: de geneeskundige,
      bedoeld in [artikel 68c, eerste lid][ref1], de inspectie, het RIVM en het openbaar ministerie van Bonaire, Sint
      Eustatius en Saba.

      3 De aanwijzing wordt ingetrokken, indien de organisatie naar het gezamenlijk oordeel van Onze Minister en de
      Minister van Veiligheid en Justitie niet meer in staat blijkt te zijn het laboratoriumonderzoek naar behoren te
      vervullen dan wel een publiek belang dit vereist.

      4 De organisatie, bedoeld in het eerste lid, stelt jaarlijks vóór 1 juli een verslag op van zijn werkzaamheden,
      alsmede de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het afgelopen jaar. Het verslag
      wordt aan Onze Minister gezonden.

      5 De werknemers van de organisatie, bedoeld in het eerste lid, zijn verplicht tot geheimhouding van hetgeen hun bij
      het verrichten van hun werkzaamheden bekend is geworden, behoudens voor zover enig wettelijk voorschrift hen tot
      bekendmaking verplicht of uit de uitvoering van de krachtens deze wet opgelegde taak de noodzaak tot bekendmaking
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68c
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel68f
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68c
        hoofdstuk: VIIa
  - number: 68g
    text: |-
      Bij regeling van Onze Minister kan aan de openbare lichamen Bonaire, Sint Eustatius en Saba een bijzondere
      uitkering worden verstrekt voor de uitvoering van de taken in deze wet, en kunnen regels worden gesteld over:

      a. de vaststelling van de uitkering;

      b. de aan de verlening van de uitkering verbonden verplichtingen;

      c. de betaling en de terugvordering van de uitkering.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel68g
  - number: 68h
    text: |-
      1 Wat betreft het bij of krachtens deze wet voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba bepaalde zijn de ambtenaren van de inspectie belast met het uitoefenen van de in
      [artikel 36, eerste en tweede lid, van de Gezondheidswet][ref1] genoemde taken. Artikel 36, derde lid, van de
      Gezondheidswet is niet van toepassing.

      2 Met de opsporing van de bij of krachtens deze wet in de openbare lichamen Bonaire, Sint Eustatius en Saba
      strafbare gestelde feiten zijn, onverminderd [artikel 184 van het Wetboek van Strafvordering BES][ref2], belast de
      ambtenaren van de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
