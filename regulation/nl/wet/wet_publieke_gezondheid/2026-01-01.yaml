  - number: '19'
    text: Bij algemene maatregel van bestuur worden de infectieziekten behorende tot groep C aangewezen.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel19
  - number: '20'
    text: |-
      1 Indien het belang van de volksgezondheid dat vordert en in overeenstemming met het gevoelen van de ministerraad,
      kan bij regeling van Onze Minister een infectieziekte, niet behorend tot groep A1, A2, B1, B2 of C, dan wel een
      ziektebeeld met een volgens de stand van de wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat
      van besmettelijkheid en ernstig gevaar voor de volksgezondheid, worden aangemerkt als behorend tot groep A1, A2, B1
      of B2.

      2 Indien het belang van de volksgezondheid dat vordert, kan, in overeenstemming met het gevoelen van de
      ministerraad, bij regeling van Onze Minister een infectieziekte behorend tot groep A2 worden aangemerkt als
      behorend tot A1, een infectieziekte behorend tot B1 worden aangemerkt als behorend tot groep A1 of A2, een
      infectieziekte behorend tot groep B2 worden aangemerkt als behorend tot groep A1, A2 of B1, of een infectieziekte
      behorend tot groep C worden aangemerkt als behorend tot groep A1, A2, B1 of B2.

      3 In de regeling, bedoeld in het eerste of tweede lid, wordt bepaald welke bepalingen van deze wet, die gelden voor
      de infectieziekten behorende tot de desbetreffende groep, in dat geval van toepassing zijn. Na de inwerkingtreding
      van een krachtens het eerste of tweede lid vastgestelde regeling, vindt de toepassing van deze wet overeenkomstig
      die regeling plaats.

      4 Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde ministeriële regeling tot
      aanwijzing van een infectieziekte als behorend tot een andere groep dan A1, wordt binnen acht weken een voorstel
      van wet tot incorporatie van die regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien niet binnen deze
      termijn een voorstel van wet wordt ingediend bij de Tweede Kamer der Staten-Generaal of indien het voorstel van wet
      wordt ingetrokken dan wel door een der Kamers der Staten-Generaal wordt verworpen, trekt Onze Minister de regeling
      onverwijld in. Wordt het voorstel tot wet verheven, dan vervalt de regeling van rechtswege op het tijdstip van
      inwerkingtreding van de wet.

      5 Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde ministeriële regeling tot
      aanwijzing van een infectieziekte als behorend tot groep A1, wordt onverwijld een voorstel van wet tot incorporatie
      van die regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het voorstel van wet wordt ingetrokken
      dan wel door een der Kamers der Staten-Generaal wordt verworpen, trekt Onze Minister de regeling onverwijld in.
      Wordt het voorstel tot wet verheven, dan vervalt de regeling van rechtswege op het tijdstip van inwerkingtreding
      van de wet.

      6 Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze
      Minister bepalen dat een op grond van het eerste of tweede lid vastgestelde regeling onmiddellijk
      na bekendmaking in werking treedt. In dat geval kan Onze Minister deze regeling, in afwijking van
      [artikel 5, aanhef en onder a, van de Bekendmakingswet][ref1], op andere dan de daar genoemde wijze bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel20
