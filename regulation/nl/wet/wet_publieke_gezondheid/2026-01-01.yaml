  - number: '33'
    text: |-
      1 De voorzitter van de veiligheidsregio dan wel de burgemeester doet de beschikking tot het onderzoek, bedoeld in
      [artikel 31, vierde lid][ref1], aan de betrokkene uitreiken.

      2 In zijn beschikking geeft de voorzitter van de veiligheidsregio dan wel de burgemeester aan waaruit het onderzoek
      bestaat, welke arts het onderzoek verricht en binnen welke termijn het onderzoek plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel33
    references:
