  - number: 58a
    text: |-
      1 In paragraaf 8 van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *aanbieder van bedrijfsmatig personenvervoer:* iedere natuurlijke persoon of rechtspersoon die bepaalde,
      bij ministeriële regeling krachtens [artikel 58o][ref1] of [58p][ref2] nader aan te wijzen categorieën van
      bedrijfsmatig personenvervoer, aanbiedt, verricht of laat verrichten;
        - *bedrijfsmatig personenvervoer:* bepaalde bij ministeriële regeling krachtens [artikel 58o][ref3] of [58p][ref4]
      nader aan te wijzen categorieën van bedrijfsmatig personenvervoer, niet beperkt tot besloten busvervoer en openbaar
      vervoer als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref5];
        - *besloten plaats:* een andere dan openbare of publieke plaats en een daarbij behorend erf, met inbegrip van
      gebouwen en plaatsen als bedoeld in [artikel 6, tweede lid, van de Grondwet][ref6];
        - *beveiligingsmedewerker:* een persoon belast met beveiligingswerkzaamheden als bedoeld in
      __REF006___________________________________________________________________________________________________________
      __ alsmede een persoon in dienst van een bestuursorgaan als bedoeld in [artikel 5, vijfde lid, van die wet][ref8];
        - *evenement:* elke voor het publiek toegankelijke verrichting van vermaak, alsmede een herdenkingsplechtigheid,
      braderie, optocht op de weg, voorstelling of feest op een andere plaats dan in een woning of op een daarbij
      behorend erf of in een gebouw of op een plaats als bedoeld in [artikel 6, tweede lid, van de Grondwet][ref9],
      wedstrijd, beurs of congres. Onder evenementen worden niet begrepen: betogingen, vergaderingen en godsdienstige en
      levensbeschouwelijke samenkomsten als bedoeld in de [Wet openbare manifestaties][ref10];
        - *hygiënemaatregelen:* maatregelen betreffende de inrichting van ruimten of aldaar te gebruiken voorwerpen
      of materialen, of het treffen van voorzieningen ten behoeve van de reinheid of teneinde de verspreiding van
      ziekteverwekkers zoveel mogelijk tegen te gaan;
        - *justitiële inrichting:* een inrichting als bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref11], inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref12], instelling als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref13] of gesticht als bedoeld in
      [artikel 2 van de Wet beginselen gevangeniswezen BES][ref14];
        - *mantelzorger:* een natuurlijke persoon die rechtstreeks voortvloeiend uit een tussen personen bestaande sociale
      relatie zorg of hulp verleent zonder dat dit beroeps- of bedrijfsmatig geschiedt;
        - *Onze Ministers:* Onze Minister en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties gezamenlijk;
        - *openbare plaats:* een openbare plaats als bedoeld in
      [artikel 1, eerste lid, van de Wet openbare manifestaties][ref15];
        - *ophouden:* gedurende enige tijd ergens verkeren, terwijl er feitelijk gelegenheid is om weg te gaan;
        - *opsporingsambtenaar:* een persoon die bij of krachtens [artikel 141][ref16]
      of [142 van het Wetboek van Strafvordering][ref17] of [artikel 184][ref18] of
      [185 van het Wetboek van Strafvordering BES][ref19] is belast met de opsporing van strafbare feiten;
        - *persoon met een handicap:* een persoon als bedoeld in artikel 1, tweede zin, van het Verdrag inzake de rechten
      van personen met een handicap (Trb. 2007, 169, en 2014, 113);
        - *persoonlijk beschermingsmiddel:* uitrusting die of voorwerp dat bestemd is om te worden gedragen of vastgehouden
      teneinde de eigen of een andere persoon zoveel mogelijk te beschermen tegen ziekteverwekkers;
        - *plaats in gebruik ten behoeve van een verkiezing:* publieke of besloten plaats, of bij ministeriële regeling
      krachtens [artikel 58j, vijfde lid][ref20], of [58k, vijfde lid][ref21], onder eventueel daarbij te stellen
      voorwaarden of beperkingen aangewezen gedeelte van een publieke of besloten plaats, in gebruik ten behoeve van de
      uitvoering van een verkiezing als bedoeld in de [Kieswet][ref22];
        - *publieke plaats:* een voor het publiek openstaand gebouw als
      bedoeld in [artikel 174, eerste lid, van de Gemeentewet][ref23] of
      [artikel 176, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref24], en een daarbij
      behorend erf, of een voor het publiek openstaand lokaal, voertuig of vaartuig, met uitzondering van gebouwen en
      plaatsen als bedoeld in [artikel 6, tweede lid, van de Grondwet][ref25];
        - *testuitslag:* een testuitslag waaruit blijkt of de geteste persoon op het moment van afname van de test al dan
      niet was geïnfecteerd met een ziekteverwekker;
        - *thuisquarantaine:* de bij of krachtens paragraaf 8 van dit hoofdstuk geldende verplichting voor een reiziger om
      in afzondering te verblijven in de eigen woning of in een specifiek aan de reiziger toegewezen verblijfplaats;
        - *toezichthouder:* voor zover in deze wet niet anders is bepaald, de bij of krachtens [artikel 64][ref26],
      [64a][ref27] of [68h, eerste lid][ref28], aangewezen toezichthouder;
        - *veilige afstand:* de afstand, bedoeld in [artikel 58f, tweede lid][ref29];
        - *zorgaanbieder:* een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref30], of als
      bedoeld in [artikel 1, onder j, van de Wet zorginstellingen BES][ref31], jeugdhulpaanbieder
      als bedoeld in [artikel 1.1 van de Jeugdwet][ref32], aanbieder van jeugdzorg als bedoeld in
      [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref33] of aanbieder als
      bedoeld in [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref34];
        - *zorglocatie:* een bouwkundige voorziening of deel van een bouwkundige
      voorziening met het daarbij behorende terrein waar zorg als bedoeld in
      [artikel 1 van de Wet kwaliteit, klachten en geschillen zorg][ref35] wordt verleend, waar jeugdzorg als
      bedoeld in [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref36]
      wordt verleend of waar beschermd wonen of opvang als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref37] plaatsvindt, of accommodatie
      als bedoeld in [artikel 1.1 van de Jeugdwet][ref38];
        - *zorgverlener:* een natuurlijke persoon die beroepsmatig zorg of dienst als omschreven bij
      of krachtens de [Wet langdurige zorg][ref39] of de [Zorgverzekeringswet][ref40] verleent,
      jeugdhulpverlener als bedoeld in [artikel 1.1 van de Jeugdwet][ref41], beroepskracht
      als bedoeld in [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref42],
      natuurlijke persoon die beroepsmatig jeugdzorg als bedoeld in
      [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref43] verleent of
      zorgverlener als bedoeld in artikel 1.1.1 van de Wet algemene verzekering bijzondere ziektekosten BES.

      2 In paragraaf 8 van dit hoofdstuk en de daarop berustende bepalingen wordt mede verstaan onder:

        - *basisregistratie personen:* basisadministratie als bedoeld in de
      [Wet basisadministraties persoonsgegevens BES][ref44];
        - *woning:* een daarbij behorend erf.


