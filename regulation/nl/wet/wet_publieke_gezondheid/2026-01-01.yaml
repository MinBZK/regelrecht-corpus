  - number: 29a
    text: |-
      1 Eenieder die handelingen met poliovirus verricht of heeft verricht, waarvoor de in
      [artikel 12b, eerste lid][ref1], bedoelde vergunningplicht geldt, dient van een blootstelling dan wel potentiële
      blootstelling aan dat virus onverwijld melding te doen aan de inspectie en de arts, bedoeld in [artikel 17][ref2].

      2 Bij ministeriële regeling worden regels gesteld over het bepaalde in het eerste lid, waaronder regels over de bij
      een melding te verstrekken gegevens.

      3 Onze Minister is bevoegd om een bestuurlijke boete op te leggen ter handhaving van het eerste lid. De op te
      leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
