  - number: 64a
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens [paragraaf 8 van hoofdstuk V][ref1],
      zijn voorts belast de bij besluit van Onze Minister aangewezen ambtenaren. Indien de aanwijzing ambtenaren
      betreft, ressorterende onder een ander ministerie dan dat van Onze Minister, wordt het besluit genomen in
      overeenstemming met Onze Minister die het mede aangaat. Indien de aanwijzing ambtenaren betreft die belast
      worden met het toezicht op de naleving in de openbare lichamen Bonaire, Sint Eustatius of Saba, zijn de
      [artikelen 5:12 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing op de
      uitoefening van die taak.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel64a
