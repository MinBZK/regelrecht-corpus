  - number: 58e
    text: |-
      1 In een krachtens paragraaf 8 van dit hoofdstuk vast te stellen ministeriële regeling kan onverminderd
      [artikel 58d][ref1] en de [paragrafen 8.2][ref2] en [8.3][ref3] van dit hoofdstuk, onderscheid worden gemaakt:

      a. binnen en tussen gemeenten en met betrekking tot de openbare lichamen Bonaire, Sint Eustatius en Saba;

      b. tussen personen op basis van leeftijd;

      c. tussen activiteiten;

      d. tussen openbare, publieke en besloten plaatsen, of gedeelten daarvan.

      2 De burgemeester dan wel de voorzitter van de veiligheidsregio kan met het oog op bijzondere omstandigheden
      ontheffing verlenen van:

      a. het bepaalde bij of krachtens [artikel 58h, eerste of tweede lid][ref4], of [58i, eerste of tweede lid][ref5];

      b. de krachtens [artikel 58g][ref6] gestelde regels, indien dat in die regels is bepaald.

      Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden.

      3 Voordat de burgemeester dan wel de voorzitter van de veiligheidsregio een beslissing neemt over de verlening van
      een ontheffing als bedoeld in het tweede lid, vraagt hij advies aan de gemeentelijke gezondheidsdienst.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio verleent geen ontheffing, indien het belang van de
      bestrijding van de epidemie van de betreffende infectieziekte, of de directe dreiging daarvan, zich daartegen naar
      zijn oordeel verzet. Bij de afweging van de betrokken belangen betrekt de burgemeester dan wel de voorzitter van de
      veiligheidsregio in ieder geval:

      a. de aard van de plaats, de aard van de activiteit en het aantal personen waarop de te verlenen ontheffing
      betrekking heeft;

      b. de gevolgen die verlening van de ontheffing zou hebben voor de naleving van de bij of krachtens
      [artikel 58f, tweede lid, en derde lid, onder e][ref7], vastgestelde regels, in en buiten de plaats waarop de te
      verlenen ontheffing betrekking heeft.

      5 In een krachtens paragraaf 8 van dit hoofdstuk vast te stellen ministeriële regeling kan aan de burgemeester dan
      wel de voorzitter van de veiligheidsregio de bevoegdheid worden toegekend om de plaatsen aan te wijzen waar de in
      die regeling gestelde regels van toepassing zijn. Aan de uitoefening van de bevoegdheid kunnen in die ministeriële
      regeling voorwaarden of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58d
