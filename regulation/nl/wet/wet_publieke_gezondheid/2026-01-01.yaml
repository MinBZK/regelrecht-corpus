  - number: 58s
    text: |-
      1 De in [artikel 58r, eerste lid][ref1] bedoelde verplichting, geldt niet in bij ministeriële regeling bepaalde
      gevallen of aangewezen categorieën personen, onder daarbij gestelde voorwaarden of beperkingen. Tot die voorwaarden
      of beperkingen kan behoren de verplichting om te beschikken over een bewijs van vaccinatie tegen de betreffende
      ziekteverwekker, waaruit blijkt dat de betrokkene op het moment van inreizen was gevaccineerd, volgens bij die
      regeling te bepalen minimumeisen, of een bewijs van herstel van een infectie met deze ziekteverwekker, volgens bij
      die regeling bepaalde eisen, en dat bewijs gedurende een bij die regeling te bepalen termijn te bewaren en deze op
      verzoek te tonen aan de toezichthouder.

      2 Bij ministeriële regeling kan worden bepaald dat de burgemeester dan wel de voorzitter van de veiligheidsregio
      met het oog op bijzondere omstandigheden in een individueel geval ontheffing kan verlenen van het bepaalde bij
      of krachtens [artikel 58r, eerste lid][ref2], en [artikel 58u][ref3]. Aan de ontheffing kunnen voorwaarden of
      beperkingen worden verbonden. [Artikel 58e, derde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58r
