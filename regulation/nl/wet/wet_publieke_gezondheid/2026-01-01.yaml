  - number: '65'
    text: |-
      1 In het geval van een besmetting of infectie of bij een gegrond vermoeden daarvan, zijn binnen hun ambtsgebied de
      burgemeester dan wel de voorzitter van de veiligheidsregio, de daartoe door de burgemeester dan wel de voorzitter
      van de veiligheidsregio aangewezen ambtenaren van de gemeentelijke gezondheidsdienst en de daartoe aangewezen
      ambtenaren van de inspectie bevoegd, desgevraagd na het tonen van een legitimatiebewijs, elke plaats te betreden of
      te verlaten, voor zover dat redelijkerwijs voor de vervulling van hun taak op grond van deze wet nodig is. Zonodig
      verschaffen zij zich toegang met behulp van de sterke arm.

      2 Ten behoeve van de uitvoering van [artikel 47a][ref1] zijn de daartoe aangewezen ambtenaren van de Nederlandse
      Voedsel- en Warenautoriteit bevoegd, desgevraagd na het tonen van een legitimatiebewijs, elke plaats te betreden of
      te verlaten, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich
      toegang met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel65
