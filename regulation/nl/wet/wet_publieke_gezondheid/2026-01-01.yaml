  - number: '21'
    text: |-
      1 De arts die bij een door hem onderzocht persoon een ziektebeeld vaststelt met een volgens de stand van de
      wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van besmettelijkheid en ernstig gevaar voor de
      volksgezondheid, meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.

      2 De arts die vaststelt dat een lijk is besmet met een infectieus of giftig agens of een infectieuze of giftige
      stof waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, meldt dit onverwijld aan de gemeentelijke
      gezondheidsdienst.

      3 De arts die een voor zijn praktijk ongewoon aantal gevallen vaststelt van een infectieziekte, niet behorend
      tot groep A1, A2, B1, B2 of C, die een gevaar vormt voor de volksgezondheid, meldt dit binnen 24 uur aan de
      gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel21
  - number: '22'
    text: |-
      1 De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep A1 of A2 vermoedt of
      vaststelt, meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.

      2 De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep B1, B2 of C vaststelt,
      dan wel een vermoeden heeft dat deze persoon lijdt aan difterie, een humane infectie veroorzaakt door een dierlijk
      influenzavirus of rabies, meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst.

      3 De arts die gegronde redenen heeft om bij een persoon een infectieziekte behorend tot groep B1 of B2 te
      vermoeden, meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst, indien die persoon weigert het onderzoek
      te ondergaan dat noodzakelijk is ter vaststelling van die ziekte en daardoor ernstig gevaar voor de volksgezondheid
      door de verspreiding van die infectieziekte kan ontstaan.

      4 Bij regeling van Onze Minister kan vrijstelling worden verleend van de meldingsplicht, bedoeld in het eerste,
      tweede en derde lid, met ingang van een daarbij te bepalen tijdstip en met inachtneming van daarbij te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel22
  - number: '23'
    text: |-
      1 De arts doet de in de [artikelen 21][ref1] en [22][ref2] bedoelde meldingen aan de gemeentelijke
      gezondheidsdienst van de gemeente waarin deze zijn praktijk heeft.

      2 Indien de meldingen, bedoeld in de [artikelen 21, eerste lid][ref3], en [22][ref4], betrekking hebben op een
      persoon die zijn verblijfplaats heeft in een andere gemeente, geeft de gemeentelijke gezondheidsdienst deze melding
      onverwijld door aan de gemeentelijke gezondheidsdienst van de verblijfplaats van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
