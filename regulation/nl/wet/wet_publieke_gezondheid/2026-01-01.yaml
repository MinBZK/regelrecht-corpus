  - number: 12e
    text: |-
      De houder van een vergunning, bedoeld in [artikel 12b, eerste lid][ref1], voldoet aan de krachtens artikel 12b,
      derde lid, gestelde eisen ter zake van het bewaren, bewerken, gebruiken of anderszins verwerken van poliovirus,
      alsmede aan de voorwaarden, voorschriften of beperkingen die aan de vergunning zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12b
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12e
    references:
