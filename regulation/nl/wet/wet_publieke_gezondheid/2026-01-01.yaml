  - number: '2'
    text: |-
      1 Het college van burgemeester en wethouders bevordert de totstandkoming en de continuïteit van en de samenhang
      binnen de publieke gezondheidszorg en de afstemming ervan met de curatieve gezondheidszorg en de geneeskundige
      hulpverlening bij ongevallen en rampen.

      2 Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:

      a. het verwerven van, op epidemiologische analyse gebaseerd, inzicht in de gezondheidssituatie van de bevolking,

      b. het elke vier jaar, voorafgaand aan de opstelling van de nota gemeentelijke gezondheidsbeleid, bedoeld in
      [artikel 13, tweede lid][ref1], op landelijk gelijkvormige wijze verzamelen en analyseren van gegevens over deze
      gezondheidssituatie,

      c. het bewaken van gezondheidsaspecten in bestuurlijke beslissingen,

      d. het bijdragen aan opzet, uitvoering en afstemming van preventieprogramma’s, met inbegrip van programma’s voor
      de gezondheidsbevordering,

      e. het bevorderen van medisch milieukundige zorg,

      f. het bevorderen van technische hygiënezorg,

      g. het bevorderen van psychosociale hulp bij rampen,

      h. het geven van prenatale voorlichting aan aanstaande ouders,

      i. het aanbieden van een vrijwillig prenataal huisbezoek door de organisatie die voor het college van burgemeester
      en wethouders de jeugdgezondheidszorg verricht om hulp en ondersteuning te geven aan zwangere vrouwen en hun
      gezinnen die in een kwetsbare situatie verkeren, voor zover daartoe aanleiding is na toepassing van een adequaat
      signaleringsinstrument, alsmede het in dat kader door het college bepalen van de omvang van deze doelgroep.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkzaamheden, bedoeld in het
      tweede lid, en kunnen met het oog op de in het eerste lid bedoelde taak regels worden gesteld over de verstrekking
      van niet tot een persoon herleidbare gegevens aan het college van burgemeester en wethouders door personen en
      instellingen werkzaam op het terrein van de gezondheidszorg en kan deze verstrekking verplicht worden gesteld.
      Voor zover het de gegevensverstrekking door personen en instellingen aan het college van burgemeester en wethouders
      betreft, bevat deze algemene maatregel van bestuur regels over de bescherming van de persoonlijke levenssfeer en de
      vergoeding van kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel13
