  - number: '8'
    text: |-
      1 Ter uitvoering van [artikel 6, tweede lid][ref1], past het bestuur van de veiligheidsregio de maatregelen toe die
      door Onze Minister worden opgedragen, indien het gaat om de voorbereiding op de bestrijding van:

      a. infectieziekten behorende tot groep A1 of A2, of

      b. een nieuw subtype humaan influenzavirus, waarbij ernstig gevaar voor de volksgezondheid bestaat.

      2 Het bestuur van de veiligheidsregio beschrijft in het crisisplan, bedoeld in
      [artikel 16 van de Wet veiligheidsregio’s][ref2], de organisatie, de taken en bevoegdheden in het kader van de
      bestrijding van en de voorbereiding op de bestrijding van een epidemie van een infectieziekte behorend tot groep A1
      of A2, alsmede de voorbereiding op de bestrijding van een nieuw subtype humaan influenzavirus waarbij ernstig
      gevaar voor de volksgezondheid bestaat.

      3 Het deel van het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref3], dat betrekking heeft
      op bestrijding van en de voorbereiding op de bestrijding van een epidemie van een infectieziekte behorend tot
      groep A1 of A2, alsmede de voorbereiding op de bestrijding van een nieuw subtype humaan influenzavirus waarbij
      ernstig gevaar voor de volksgezondheid bestaat, wordt vastgesteld in overeenstemming met het algemeen bestuur van
      de gemeentelijke gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0027466#Artikel16
