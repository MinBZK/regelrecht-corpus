  - number: 58x
    text: |-
      1 Bij ministeriële regeling kan, na overleg met de gezaghebber, worden bepaald dat op degene die reist
      tussen Bonaire, Sint Eustatius of Saba of die een van deze eilanden inreist en voor inreis heeft verbleven
      in het Europese deel van Nederland of in een door Onze Minister, na overleg met de gezaghebber, aangewezen
      gebied in het buitenland, onder daarbij te stellen voorwaarden of beperkingen, de verplichting, bedoeld in
      [artikel 58r, eerste lid][ref1], rust.

      2 Tenzij bij ministeriële regeling anders is bepaald, zijn de [artikelen 58r tot en met 58w][ref2]
      van overeenkomstige toepassing indien toepassing wordt gegeven aan het eerste lid, met
      dien verstande dat het bepaalde in [artikel 58t, derde lid][ref3], geldt in aanvulling op
      [artikel 429d, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref4].

      3 In de regeling, bedoeld in het eerste lid, kan worden bepaald dat de gezaghebber met het oog op bijzondere
      omstandigheden in een individueel geval ontheffing kan verlenen van het bepaalde bij of krachtens het eerste lid.
      Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden. [Artikel 58e, derde lid][ref5], is van
      overeenkomstige toepassing.


