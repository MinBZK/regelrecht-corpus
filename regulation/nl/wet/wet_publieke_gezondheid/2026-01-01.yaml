  - number: '32'
    text: |-
      1 De burgemeester dan wel de voorzitter van de veiligheidsregio doet de beschikking tot opneming ter isolatie aan
      de betrokkene uitreiken.

      2 In de beschikking geeft de burgemeester dan wel de voorzitter van de veiligheidsregio aan in welk ziekenhuis,
      aangewezen op grond van [artikel 34][ref1], de opneming ter isolatie ten uitvoer wordt gelegd.

      3 Na uitreiking van de beschikking voorziet de burgemeester dan wel de voorzitter van de veiligheidsregio in
      bijstand van de betrokkene door een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.

      4 Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in
      [artikel 31, eerste lid, onder b, of tweede lid, onder b][ref2], is geweken of op minder ingrijpende wijze kan
      worden afgewend, heft de burgemeester dan wel de voorzitter van de veiligheidsregio de opneming ter isolatie
      onverwijld op.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel32
