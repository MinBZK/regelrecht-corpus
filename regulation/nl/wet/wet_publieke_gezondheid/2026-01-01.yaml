    text: |-
      1 Onze Minister is bevoegd om een bestuurlijke boete op te leggen ter handhaving van het bepaalde bij of krachtens
      de [artikelen 12b, eerste lid of vijfde lid][ref1], voor zover het gaat om de naleving van een gegeven bevel,
      [12e][ref2], [12g, vierde lid][ref3], [12h][ref4] of [12i, eerste lid][ref5].

      2 De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld
      voor de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref6].

      3 Overtreding van krachtens [artikel 12b, derde lid][ref7], gestelde eisen die verband houden met de uitvoering
      van Resolutie WHA71.16 van de Wereld Gezondheidsorganisatie, kan krachtens [artikel 12e][ref8] worden bestraft met
      een bestuurlijke sanctie indien deze eisen in de Engelse taal zijn gesteld of bekend gemaakt.


