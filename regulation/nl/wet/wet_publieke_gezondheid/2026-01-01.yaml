        bwb_id: BWBR0024705
        artikel: 12b
        hoofdstuk: II
        paragraaf: '6'
  - number: 12f
    text: |-
      1 Een vergunning vervalt van rechtswege:

      a. zodra de rechtspersoon waaraan de vergunning is verleend, is opgehouden te bestaan;

      b. zodra degene aan wie de vergunning is verleend, is opgehouden de werkzaamheden waarvoor de vergunning is
      verleend te verrichten.

      2 Degene aan wie de vergunning is verleend doet aan Onze Minister melding van een situatie als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12f
  - number: 12g
    text: |-
      1 Onze Minister kan een vergunning intrekken indien:

      a. bij de aanvraag onjuiste of onvolledige gegevens of bescheiden zijn verstrekt, dan wel feiten of omstandigheden
      zijn verzwegen en kennis over de juiste of volledige gegevens dan wel kennis van de betreffende feiten of
      omstandigheden tot een andere beslissing zou hebben geleid;

      b. de houder van de vergunning niet voldoet aan de krachtens [artikel 12b, derde lid][ref1], gestelde eisen of een
      aan de vergunning verbonden voorwaarde, voorschrift of beperking;

      c. de houder van de vergunning naar het oordeel van Onze Minister is opgehouden de werkzaamheden te verrichten
      waarvoor de vergunning is verleend.

      2 Een vergunning kan voor bepaalde tijd worden geschorst indien zich de situatie, bedoeld in het eerste lid,
      onderdeel b, voordoet.

      3 Een beschikking tot schorsing vermeldt de voorwaarden waaraan de houder van de vergunning moet voldoen met het
      oog op opheffing van de schorsing.

      4 Schorsing van de vergunning heeft tot gevolg dat de houder van de vergunning gedurende de schorsing uitsluitend
      bevoegd is tot het bewaren van het poliovirus en niet tot het bewerken, gebruiken of anderszins verwerken daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12b
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12g
    references:
