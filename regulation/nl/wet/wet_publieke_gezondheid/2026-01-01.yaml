  - number: '47'
    text: |-
      1 Indien er een gegrond vermoeden bestaat van een besmetting kan de burgemeester dan wel de voorzitter van
      de veiligheidsregio terreinen, gebouwen, vervoermiddelen of goederen controleren op de aanwezigheid van een
      besmetting, zonodig door het nemen van monsters.

      2 In het geval van een besmetting kan de burgemeester dan wel de voorzitter van de veiligheidsregio:

      a. voorschriften van technisch-hygiënische aard geven,

      b. terreinen, gebouwen, vervoermiddelen of goederen ontsmetten, met inbegrip van de vernietiging van vectoren of
      reservoirs.

      3 In het geval van een besmetting waarbij ernstig gevaar dreigt voor de volksgezondheid, kan de burgemeester dan
      wel de voorzitter van de veiligheidsregio:

      a. gebouwen of terreinen dan wel gedeelten daarvan sluiten,

      b. een verbod uitvaardigen tot het gebruik maken of betreden van vervoermiddelen,

      c. waren vernietigen.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio heft de maatregel op als het gevaar is geweken.

      5 De burgemeester of de voorzitter van de veiligheidsregio kan een last onder bestuursdwang opleggen aan degene die
      geen medewerking verleent aan het uitvoeren van het bepaalde in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel47
  - number: 47a
    text: |-
      1 Ter uitvoering van [artikel 6a][ref1] is Onze Minister bij uitsluiting van de burgemeester bevoegd de volgende
      maatregelen te nemen:

      a. het controleren van terreinen, gebouwen, vervoermiddelen of goederen op de aanwezigheid van een vector of
      reservoir, zo nodig door het nemen van monsters, indien er een aannemelijk risico is op de aanwezigheid van een
      dergelijke vector of reservoir,

      b. het geven van voorschriften van technisch-hygiënische aard bij de aanwezigheid van een vector of reservoir, of
      indien er een aannemelijk risico daarop is,

      c. het vernietigen van vectoren of reservoirs op of in terreinen, gebouwen, vervoermiddelen of goederen.

      2 Onze Minister kan een last onder bestuursdwang opleggen aan degene die geen medewerking verleent aan het
      uitvoeren van het bepaalde in het eerste lid, onderdeel b.


