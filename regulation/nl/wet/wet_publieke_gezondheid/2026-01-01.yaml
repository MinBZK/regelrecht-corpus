  - number: 58w
    text: |-
      1 Met het oog op het toezicht op en de handhaving van de naleving van [artikel 58r, eerste lid][ref1], kan bij
      ministeriële regeling worden bepaald:

      a. dat de in [artikel 58r, eerste lid][ref2], bedoelde persoon die bij inreis gebruik maakt van een papieren
      verklaring als bedoeld in [artikel 58u][ref3], deze verklaring op verzoek verstrekt en aan wie deze verklaring
      wordt verstrekt;

      b. dat degene aan wie krachtens onderdeel a een verklaring wordt verstrekt, deze inneemt en vervolgens doorgeeft
      aan een ander of aan Onze Minister, dan wel vernietigt.

      2 Degene aan wie krachtens het eerste lid een papieren verklaring wordt verstrekt, is bevoegd tot het verwerken van
      die verklaring en de daarop vermelde persoonsgegevens, voor zover dit noodzakelijk is om te voldoen aan de op hem
      krachtens dat lid rustende verplichtingen.

      3 In de regeling bedoeld in het eerste lid, aanhef, kunnen voort regels worden gesteld over de beveiliging tegen
      verlies en onrechtmatige verwerking van persoonsgegevens bij de verwerking van de digitale verklaring als bedoeld
      in [artikel 58u][ref4].


