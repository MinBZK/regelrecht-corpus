  - number: 6a
    text: |-
      1 Voor bij algemene maatregel van bestuur aangewezen vectoren of reservoirs draagt Onze Minister, in afwijking van
      [artikel 6, eerste tot en met vierde lid][ref1], zorg voor maatregelen ter preventie van vestiging van dergelijke
      vectoren of reservoirs, waaronder het nemen van bestrijdingsmaatregelen.

      2 In gevallen waarin een spoedige voorziening krachtens [artikel 47a][ref2] in het belang van de volksgezondheid
      zo dringend geboden is dat de totstandkoming van een algemene maatregel van bestuur als bedoeld in het eerste lid
      niet kan worden afgewacht, kan bij regeling van Onze Minister een vector of reservoir als bedoeld in het eerste lid
      worden aangewezen.

      3 De regeling, bedoeld in het tweede lid, vervalt zes maanden nadat zij in werking is getreden, of, indien binnen
      die termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het
      tijdstip waarop de maatregel in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel6a
