  - number: 58r
    text: |-
      1 Bij regeling kan worden bepaald dat degene die het Europese deel van Nederland inreist en voor inreis heeft
      verbleven in een door Onze Minister aangewezen gebied in het buitenland of, indien door Onze Minister aangewezen,
      in Bonaire, Sint Eustatius of Saba, onverwijld na inreis gedurende een ononderbroken periode van een bij
      ministeriële regeling te bepalen aantal dagen in thuisquarantaine gaat. Hierbij kan onderscheid worden gemaakt
      tussen de aangewezen gebieden.

      2 Bij ministeriële regeling kan worden bepaald in welke gevallen de plicht, bedoeld in het eerste lid, niet of
      niet langer van toepassing is. Daartoe kan behoren de verplichting om te beschikken over een testuitslag waaruit
      blijkt dat de betrokkene op het moment van testen niet was geïnfecteerd met de betreffende ziekteverwekker en die
      gedurende een bij ministeriële regeling te bepalen termijn wordt bewaard.

      3 Bij ministeriële regeling worden nadere eisen gesteld aan de test, bedoeld in het tweede lid, die betrekking
      kunnen hebben op:

      a. de vaststelling van de identiteit van de geteste persoon;

      b. het type test dat is uitgevoerd;

      c. de wijze waarop de testuitslag wordt aangetoond.

      4 Dit artikel laat de toepassing van [artikel 35][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel35
