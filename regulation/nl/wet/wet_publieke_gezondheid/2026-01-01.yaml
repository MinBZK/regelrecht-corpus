  - number: '24'
    text: |-
      1 De melding, bedoeld in de [artikelen 21, eerste lid][ref1], en [22][ref2], bevat de volgende gegevens:

      a. de naam, het adres, het geslacht, de geboortedatum, het burgerservicenummer, het telefoonnummer, het e-mailadres
      en de verblijfplaats van de betrokken persoon,

      b. de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, de vermoedelijke infectiebron, de datum van vermoeden of vaststelling van infectie, de
      wijze van vaststelling van die infectieziekte, en

      c. indien nodig, of de betrokken persoon dan wel een persoon in zijn directe omgeving beroeps- of bedrijfsmatig
      betrokken is bij de behandeling van eet- of drinkwaren of bij de behandeling, verpleging of verzorging van andere
      personen.

      2 De melding, bedoeld in [artikel 21, tweede lid][ref3], bevat de volgende gegevens: de aard van het infectieus of
      giftig agens of de infectieuze of giftige stof en de plaats waar het lijk zich bevindt.

      3 De melding, bedoeld in [artikel 21, derde lid][ref4], bevat de volgende gegevens: de infectieziekte, het
      geslacht, de geboortedatum en de nationaliteit van de betrokken personen.

      4 De arts verstrekt aan de gemeentelijke gezondheidsdienst uitsluitend andere medische gegevens over de betrokken
      persoon indien:

      a. de burgemeester hierom verzoekt krachtens [artikel 30][ref5], of

      b. de betrokken persoon daarvoor toestemming geeft.

      5 Voor de beveiliging van de gegevensverwerking bij de meldingen, bedoeld in de [artikelen 21][ref6] en [22][ref7],
      worden bij regeling van Onze Minister regels gesteld.


