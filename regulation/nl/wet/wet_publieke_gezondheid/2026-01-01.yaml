      1 Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft degene die
      handelt in strijd met opdrachten die krachtens [artikel 53, eerste of tweede lid][ref1], zijn gegeven.

      2 Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft de
      gezagvoerder die handelt in strijd met [artikel 53, derde lid, onder a][ref2].

      3 Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft degene die
      zich onttrekt aan een op grond van de [artikelen 31][ref3] of [35][ref4] ten aanzien van hem genomen maatregel.

      4 Met een gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde categorie wordt gestraft degene die
      handelt in strijd met [artikel 12b, eerste lid][ref5].

      5 De in het eerste, tweede, derde en vierde lid strafbaar gestelde feiten zijn misdrijven.


