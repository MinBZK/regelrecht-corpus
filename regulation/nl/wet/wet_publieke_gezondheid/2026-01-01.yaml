  - number: 58q
    text: |-
      In een ministeriële regeling als bedoeld in [artikel 58p, eerste en tweede lid][ref1], kan in daarbij te bepalen
      gevallen of ten aanzien van daarbij aan te wijzen categorieën personen, en onder daarbij te stellen voorwaarden of
      beperkingen worden bepaald dat een bij of krachtens die artikelleden bepaalde verplichting niet van toepassing is.
      Tot die voorwaarden of beperkingen kan behoren de verplichting voor de reiziger om te beschikken over een bewijs
      van vaccinatie tegen de betreffende ziekteverwekker, waaruit blijkt dat de betrokkene op het moment van inreizen
      was gevaccineerd volgens bij die ministeriële regeling bepaalde minimumeisen of een bewijs van herstel van een
      infectie met deze ziekteverwekker, volgens bij die regeling bepaalde eisen, en dat bewijs te bewaren gedurende een
      bij die regeling te bepalen termijn en deze op verzoek te tonen aan de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
