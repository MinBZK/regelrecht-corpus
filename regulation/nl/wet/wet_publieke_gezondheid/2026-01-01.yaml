  - number: 58t
    text: |-
      1 De in [artikel 58r, eerste lid][ref1], bedoelde persoon kan de burgerlijke rechter schriftelijk verzoeken om
      opheffing van de ten aanzien van hem geldende verplichting om in thuisquarantaine te gaan op de grond dat deze
      verplichting niet op hem van toepassing is.

      2 Het verzoekschrift wordt ingediend bij de voorzieningenrechter van de rechtbank binnen wiens rechtsgebied de
      woonplaats van de indiener van het verzoekschrift is gelegen of binnen wiens rechtsgebied de aan de indiener, ten
      behoeve van de thuisquarantaine toegewezen verblijfplaats is gelegen. Voor de behandeling van het verzoekschrift
      wordt geen griffierecht geheven. [Artikel 46][ref2] is van overeenkomstige toepassing.

      3 In aanvulling op [artikel 278, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] bevat het
      verzoekschrift het e-mailadres en telefoonnummer waarop de verzoeker bereikbaar is en eventuele bewijsstukken die
      het verzoek ondersteunen.

      4 Voordat op het verzoekschrift wordt beslist, hoort de rechter de indiener van het verzoekschrift door middel
      van een tweezijdig elektronisch communicatiemiddel, tenzij de indiener niet beschikbaar was op het door de rechter
      vastgestelde tijdstip waarop het horen plaatsvindt. [Artikel 41, derde lid][ref4], is van toepassing.

      5 De rechter beslist zo spoedig mogelijk op het verzoek, doch uiterlijk binnen drie dagen te rekenen vanaf de dag
      na die van het indienen van het verzoekschrift. Tegen de beslissing van de rechter staat geen voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58r
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel46
