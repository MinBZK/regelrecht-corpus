      1 Met een hechtenis van ten hoogste zeven dagen of geldboete van de eerste categorie wordt gestraft degene die
      handelt in strijd met het bepaalde bij of krachtens:

      a. [artikel 58e, tweede lid, laatste zin][ref1] of [58s, tweede lid, tweede zin][ref2] en
      [58x, derde lid, tweede zin][ref3];

      b. [artikel 58d, eerste lid][ref4], [58g][ref5], [58h, eerste en tweede lid][ref6], [58i][ref7],
      [58j, tweede lid][ref8], [58k, tweede lid][ref9], [58n, derde lid, eerste zin en vierde lid, eerste zin][ref10],
      [58o, eerste en tweede lid][ref11], [58p, eerste en tweede lid][ref12], [58q][ref13], [58s, eerste lid][ref14],
      en [58u][ref15].

      2 Met een geldboete van ten hoogste vijfennegentig euro wordt gestraft degene die handelt in strijd met het
      bepaalde bij of krachtens [artikel 58f, eerste lid][ref16], of in strijd met de voorwaarden of beperkingen,
      bedoeld in [artikel 58f, derde lid, onder e][ref17].

      3 De in dit artikel strafbaar gestelde feiten zijn overtredingen.

      4 In afwijking van het bij en krachtens de [Wet justitiële en strafvorderlijke gegevens][ref18]
      en de [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref19]
      bepaalde worden de gegevens met betrekking tot geldboetes, opgelegd voor overtreding van
      [artikel 58f, eerste lid, en derde lid, onder e][ref20], niet aangemerkt als justitiële gegevens.

      5 In afwijking van [artikel 35 van de Wet justitiële en strafvorderlijke gegevens][ref21] en
      [artikel 22 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag BES][ref22] worden
      de in dit artikel strafbaar gestelde feiten niet betrokken bij het onderzoek naar het gedrag van een natuurlijke
      persoon of rechtspersoon als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref23] of
      __REF003___________________________________________________________________________________________________________
      ________________.

      6 Dit artikel is niet van toepassing indien de overtreding wordt begaan op plaatsen in gebruik ten behoeve van
      een verkiezing.


