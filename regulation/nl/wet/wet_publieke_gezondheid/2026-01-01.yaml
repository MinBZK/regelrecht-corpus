  - number: 12l
    text: |-
      1 Onze Minister stelt, in overleg met Onze Ministers die het mede aangaat, integraal beleid vast ter bevordering
      van suïcidepreventie en draagt zorg voor de coördinatie en uitvoering hiervan.

      2 Het integraal beleid, bedoeld in het eerste lid, wordt elke vier jaar vastgesteld in samenhang met de landelijke
      nota gezondheidsbeleid, bedoeld in [artikel 13, eerste lid][ref1].

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent het bepaalde in het eerste en tweede lid,
      waaronder in ieder geval regels over de inhoud en de wijze van totstandkoming van het vast te stellen beleid.

      4 Onze Minister stuurt jaarlijks een verantwoording over de voortgang van de coördinatie en uitvoering van het
      integraal beleid, bedoeld in het eerste lid, aan de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel13
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12l
    references:
