  - number: '40'
    text: |-
      1 Indien de officier van justitie van oordeel is dat aan de voorwaarden voor de opneming ter isolatie, bedoeld in
      [artikel 31, eerste of tweede lid][ref1] het onderzoek, bedoeld in [artikel 31, vierde lid][ref2], of de maatregel
      van quarantaine, bedoeld in [artikel 35][ref3], is voldaan, doet hij uiterlijk op de dag na de datum van ontvangst
      van de beschikking een verzoek tot een machtiging tot voortzetting van de isolatie, de quarantaine of tot het
      onderzoek.

      2 De officier van justitie deelt aan de betrokkene, de burgemeester dan wel de voorzitter van de veiligheidsregio
      en in voorkomend geval het ziekenhuis, schriftelijk mede dat hij het verzoek heeft gedaan of dat hij heeft besloten
      om geen verzoek te doen.

      3 Het besluit geen verzoek te doen neemt de officier van justitie niet dan nadat hij het advies van de inspecteur-
      generaal van de inspectie heeft ingewonnen.

      4 Met het besluit geen verzoek te doen, vervalt de beschikking tot opneming ter isolatie,
      bedoeld in [artikel 31, eerste of tweede lid][ref4] de beschikking tot het onderzoek, bedoeld in
      [artikel 31, vierde lid][ref5], of de beschikking een persoon te onderwerpen aan de maatregel van quarantaine,
      bedoeld in [artikel 35][ref6], van rechtswege.


