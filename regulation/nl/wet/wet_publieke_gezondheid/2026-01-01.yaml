  - number: 58g
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over hygiënemaatregelen en persoonlijke
      beschermingsmiddelen, met inbegrip van de verplichting tot toepassing of gebruik hiervan. De regels hebben geen
      betrekking op de toepassing of het gebruik in een woning.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58g
  - number: 58h
    text: |-
      1 Bij ministeriële regeling kunnen publieke plaatsen worden aangewezen die:

      a. niet voor publiek mogen worden opengesteld;

      b. slechts onder bij die regeling gestelde voorwaarden of beperkingen voor publiek mogen worden opengesteld.

      2 Tot de voorwaarden of beperkingen, bedoeld in het eerste lid onder b, kan behoren dat ten hoogste een bij die
      regeling vast te stellen aantal personen als publiek aanwezig mag zijn.

      3 De volgende plaatsen worden niet aangewezen als publieke plaatsen die niet voor publiek mogen worden opengesteld.

      a. een plaats in gebruik ten behoeve van een verkiezing;

      b. een plaats die is bestemd voor een vergadering van de Staten-Generaal of van een commissie daaruit;

      c. een plaats die is bestemd voor een vergadering van de gemeenteraad, provinciale staten en het algemeen bestuur
      van een waterschap, of van een door deze organen ingestelde commissie;

      d. een gerechtsgebouw.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58h
  - number: 58i
    text: |-
      1 Bij ministeriële regeling kunnen evenementen worden aangewezen die:

      a. niet mogen worden georganiseerd;

      b. slechts onder bij die regeling gestelde voorwaarden of beperkingen mogen worden georganiseerd.

      2 Tot de voorwaarden of beperkingen, bedoeld in het eerste lid, onder b, kan behoren dat ten hoogste een bij die
      regeling vast te stellen aantal personen als publiek aanwezig mag zijn.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58i
  - number: 58j
    text: |-
      1 Degene die bevoegd is tot het aan een publieke plaats treffen van voorzieningen of tot het openstellen van
      een publieke plaats voor publiek, draagt ten aanzien van die publieke plaats zorg voor zodanige voorzieningen
      of openstelling dat de daar aanwezige personen de bij of krachtens de [artikelen 58d, eerste lid][ref1], en
      [58f tot en met 58i][ref2] gestelde regels in acht kunnen nemen.

      2 Indien de burgemeester dan wel de voorzitter van de veiligheidsregio van oordeel is dat de daar aanwezige
      personen het bepaalde bij of krachtens de [artikelen 58d][ref3], en [58f tot en met 58i][ref4] niet in acht kunnen
      nemen, kan hij een schriftelijke aanwijzing geven aan degene die bevoegd is tot het aan die plaats treffen van
      voorzieningen of tot het openstellen van die plaats voor publiek.

      3 In de aanwijzing geeft de burgemeester dan wel de voorzitter van de veiligheidsregio met redenen omkleed aan op
      welke punten de aanwezige personen de bij of krachtens de [artikelen 58d][ref5], en [58f tot en met 58i][ref6]
      gestelde regels niet in acht kunnen nemen, alsmede de in verband daarmee te nemen maatregelen. Een aanwijzing bevat
      de termijn waarbinnen degene die bevoegd is tot het aan die plaats treffen van voorzieningen of tot het openstellen
      van die plaats voor publiek, de maatregelen treft.

      4 In een spoedeisende situatie kan de burgemeester dan wel de voorzitter van de veiligheidsregio een bevel geven.
      Indien het bevel mondeling wordt gegeven, wordt het zo spoedig mogelijk op schrift gesteld en bekendgemaakt.

      5 Het tweede tot en met vierde lid zijn niet van toepassing op plaatsen in gebruik ten behoeve van een verkiezing.


