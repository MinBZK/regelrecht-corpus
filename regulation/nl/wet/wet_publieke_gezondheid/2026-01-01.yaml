  - number: '60'
    text: |-
      1 De gemeente draagt de kosten van de maatregelen die krachtens [hoofdstuk V][ref1] van deze wet worden genomen.
      Ook draagt de gemeente de kosten van door haar toegekende tegemoetkomingen aan hen, die inkomsten derven door de
      maatregelen, bedoeld in de [artikelen 31][ref2], [35][ref3], [38][ref4] en [47][ref5].

      2 In afwijking van de eerste volzin van het eerste lid draagt het Rijk de kosten van de maatregel, bedoeld in
      [artikel 31][ref6], indien deze wordt toegepast bij een persoon lijdend aan tuberculose.

      3 In afwijking van het eerste lid draagt:

      a. de exploitant van een burgerhaven of burgerluchthaven en de burgerexploitant de kosten van de maatregelen die
      door de burgemeester krachtens [artikel 54][ref7] zijn opgedragen,

      b. de vervoersexploitant de kosten van de maatregelen die door de burgemeester krachtens [artikel 55][ref8] zijn
      opgedragen.

      4 De in [artikel 47, derde lid, onder c][ref9], bedoelde waren worden voor vernietiging door de burgemeester
      gewaardeerd. Het college van burgemeester en wethouders keert aan de eigenaar als schadeloosstelling het bedrag uit
      waarop de goederen zijn gewaardeerd.

      5 Het college van burgemeester en wethouders is bevoegd de kosten verbonden aan de maatregelen, bedoeld in de
      [artikelen 31][ref10], [35][ref11], [38][ref12] en [47][ref13], te verhalen op de natuurlijke- of rechtspersoon ten
      aanzien van wie een maatregel is getroffen, indien die persoon niet tot vrijwillige medewerking bereid is geweest.
      De [artikelen 5.25][ref14] en [5.26 van de Algemene wet bestuursrecht][ref15] zijn van overeenkomstige toepassing.

      6 Onze Minister is bevoegd de kosten verbonden aan de maatregelen, bedoeld in
      [artikel 47a, eerste lid, onder a en c][ref16], te verhalen op de natuurlijke- of rechtspersoon ten aanzien
      van wie een maatregel is getroffen, indien die persoon niet tot vrijwillige medewerking bereid is geweest.
      [Artikel 5.25 van de Algemene wet bestuursrecht][ref17] is van overeenkomstige toepassing.

      7 Onze Minister kan aan de exploitant van een burgerhaven of burgerluchthaven, de burgerexploitant of de
      vervoersexploitant een naar billijkheid te bepalen vergoeding toekennen terzake van buitengewone kosten die door
      de exploitant van een burgerhaven of burgerluchthaven, de burgerexploitant of de vervoersexploitant worden gemaakt
      vanwege de naleving van de maatregelen die krachtens de [artikelen 54][ref18] of [55][ref19] in samenhang met
      [artikel 7, derde lid][ref20], zijn opgedragen.


