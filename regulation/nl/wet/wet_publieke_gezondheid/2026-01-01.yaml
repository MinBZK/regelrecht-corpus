  - number: 58l
    text: |-
      Indien door een gedraging of activiteit in of vanuit een besloten plaats, niet zijnde een woning, een ernstige
      vrees voor de onmiddellijke verspreiding van de betreffende ziekteverwekker ontstaat, kan de burgemeester dan
      wel de voorzitter van de veiligheidsregio de bevelen geven die nodig zijn voor de beëindiging van de gedraging of
      activiteit en de daar aanwezige personen bevelen zich onmiddellijk te verwijderen.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58l
  - number: 58m
    text: |-
      Indien de burgemeester dan wel de voorzitter van de veiligheidsregio van oordeel is dat de omstandigheden
      op een openbare plaats zodanig zijn dat de daar aanwezige personen het bepaalde bij of krachtens de
      [artikelen 58d, eerste lid][ref1], en [58f tot en met 58i][ref2] niet in acht kunnen nemen, of bij ernstige
      vrees voor het ontstaan daarvan, kan hij de bevelen geven die nodig zijn om de naleving van deze artikelen op een
      openbare plaats te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58d
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
