  - number: 6c
    text: |-
      1 Het RIVM heeft, onverminderd het bepaalde bij of krachtens andere wetten, tot taak om namens Onze Minister
      werkzaamheden te verrichten bij de bestrijding van infectieziekten, waaronder het voeren van de landelijke regie
      en het laten verrichten van activiteiten, zo nodig onder bij regeling van Onze Minister te stellen eisen, op het
      terrein van de bestrijding van seksueel overdraagbare aandoeningen in samenhang met seksuele gezondheidszorg.

      2 Het RIVM verwerkt de persoonsgegevens waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15
      van de Algemene verordening gegevensbescherming die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in
      het eerste lid.

      3 Het RIVM verwerkt op grond van het eerste lid slechts persoonsgegevens indien daarop pseudonimisering als bedoeld
      in artikel 4, onderdeel 5 van de Algemene verordening gegevensbescherming, is toegepast en vervolgens onafgebroken
      is gecontinueerd.

      4 Artikel 21, eerste lid, tweede volzin, van de Algemene verordening gegevensbescherming is bij de verwerking door
      het RIVM niet van toepassing.

      5 Voor zover het voor het RIVM noodzakelijk is om voor de taakuitvoering gebruik te maken van een
      referentielaboratorium zijn het tweede tot en met vierde lid van overeenkomstige toepassing op het
      referentielaboratorium.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel6c
  - number: '7'
    text: |-
      1 In de situatie, bedoeld in [artikel 6, vierde en vijfde lid][ref1], geeft Onze Minister leiding aan de
      bestrijding en kan Onze Minister de voorzitter van de veiligheidsregio opdragen hoe de bestrijding ter hand te
      nemen, waaronder begrepen het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref2].

      2 In afwijking van [artikel 6, derde lid][ref3], geeft Onze Minister leiding aan de bestrijding van een
      infectieziekte behorend tot groep B1 of B2, indien de burgemeester van een gemeente die het aangaat daartoe
      verzoekt. Onze Minister kan dan de burgemeester opdragen hoe de bestrijding ter hand te nemen, waaronder begrepen
      het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref4].

      3 Onze Minister kan de burgemeester opdragen om, ter uitvoering van de aanbevelingen, bedoeld in de
      artikelen 15 en 16 van de Internationale Gezondheidsregeling, toepassing te geven aan de maatregelen,
      bedoeld in de [artikelen 51][ref5], [54][ref6] en [55][ref7], alsook om de maatregelen, bedoeld in
      [artikel 22a van de Wet op de lijkbezorging][ref8], toe te passen.

      4 Voordat toepassing wordt gegeven aan het eerste, tweede of derde lid, voert Onze Minister een bestuurlijk
      afstemmingsoverleg waarbij in ieder geval Onze Minister van Infrastructuur en Milieu en de veiligheidsregio’s of
      gemeenten die het aangaat, worden betrokken.

      5 Zodra toepassing wordt gegeven aan het eerste of tweede lid, informeert Onze Minister Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie.

      6 Indien toepassing wordt gegeven aan het eerste, tweede of derde lid, verstrekt de voorzitter van de
      veiligheidsregio of de burgemeester aan Onze Minister, indien deze daarom verzoekt, de gegevens die Onze Minister
      nodig heeft ter uitoefening van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
