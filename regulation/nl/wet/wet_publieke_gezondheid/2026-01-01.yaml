        bwb_id: BWBR0024705
        artikel: '13'
        hoofdstuk: III
  - number: 12m
    text: |-
      Onze Minister draagt er zorg voor dat personen op ieder moment van de dag kosteloos een telefonisch of elektronisch
      gesprek kunnen voeren, dat niet direct tot hen herleidbaar is, over hun eigen gedachten, voorbereidingshandelingen
      of pogingen met betrekking tot suïcide, of over die van iemand in hun omgeving, en advies kunnen krijgen gericht op
      preventie van suïcide.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12m
  - number: '13'
    text: |-
      1 Onze Minister stelt elke vier jaar een landelijke nota gezondheidsbeleid en een landelijk programma voor
      uitvoering van onderzoek vast op het gebied van de publieke gezondheid.

      2 De gemeenteraad stelt binnen twee jaar na openbaarmaking van de nota, bedoeld in het eerste lid, een nota
      gemeentelijk gezondheidsbeleid vast, waarin de raad in ieder geval aangeeft:

      a. wat de gemeentelijke doelstellingen zijn ter uitvoering van de in de [artikelen 2][ref1], [5][ref2], [5a][ref3]
      en [6][ref4] genoemde taken en het beleid, bedoeld in [artikel 12l, eerste lid][ref5],

      b. welke acties in de bestreken periode worden ondernomen ter realisering van deze doelstellingen,

      c. welke resultaten de gemeente in die periode wenst te behalen,

      d. hoe het college van burgemeester en wethouders uitvoering geeft aan de in [artikel 16][ref6] genoemde
      verplichting.

      3 De gemeenteraad neemt bij het vaststellen van de nota gemeentelijk gezondheidsbeleid in ieder geval de landelijke
      prioriteiten in acht, zoals opgenomen in de landelijke nota gezondheidsbeleid.


