  - number: '9'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze
      Minister van Veiligheid en Justitie bepalen dat, in daarbij aangewezen gevallen, een andere burgemeester de taak,
      dan wel een bepaald deel van de taak, bedoeld in [artikel 6, derde lid][ref1], dient te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
