  - number: '11'
    text: |-
      1 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie, kunnen regels worden gesteld over de verdeling
      van vaccins en therapeutische farmaproducten, indien er een beperkte beschikbaarheid is van deze middelen en ten
      behoeve van de bestrijding van een infectieziekte behorend tot groep A1 of A2 prioriteiten moeten worden gesteld
      voor de verdeling ervan.

      2 Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld op de hoogte van de vastgestelde regeling.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister draagt ervoor zorg dat aan de informatieverplichtingen, voortvloeiende uit de Internationale
      Gezondheidsregeling, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12
  - number: 12a
    text: |-
      1 Onze Minister draagt via het RIVM zorg voor de regie op en de coördinatie van de uitvoering, alsmede de
      registratie, bewaking en evaluatie van het bij algemene maatregel van bestuur aangewezen bevolkingsonderzoek,
      waaronder de neonatale hielprikscreening. Voor de openbare lichamen Bonaire, Sint Eustatius en Saba kan een
      afwijkend aanbod worden opgenomen.

      2 Bij de uitvoering van de neonatale hielprikscreening kan de betrokken opvolgend kinderarts, indien dit
      noodzakelijk is vanwege de urgentie van de aansluitende zorg door deze arts, de gegevens betreffende een kind tot
      de leeftijd van zes maanden raadplegen zonder daarvoor toestemming te vragen. De toestemming wordt alsnog gevraagd
      zodra daartoe gelegenheid is.

      3 Bij regeling van Onze Minister kunnen regels worden gesteld over de uitvoering van het bevolkingsonderzoek,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12a
  - number: 12b
    text: |-
      1 Het is eenieder verboden om zonder vergunning van Onze Minister een bij algemene maatregel van bestuur aangewezen
      type poliovirus te bewaren, te bewerken, te gebruiken of anderszins te verwerken.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op:

      a. handelingen door een zorgverlener en daarmee samenhangende handelingen voor zover deze noodzakelijk zijn ten
      behoeve van diagnostiek;

      b. het vervoer van poliovirus;

      c. bij algemene maatregel van bestuur aangewezen handelingen.

      3 Bij of krachtens algemene maatregel van bestuur worden eisen gesteld ter zake van het bewaren, bewerken,
      gebruiken of anderszins verwerken van aangewezen type poliovirus. Deze eisen die verband houden met de uitvoering
      van Resolutie WHA71.16 van de Wereld Gezondheidsorganisatie, kunnen in de Engelse taal worden gesteld en bekend
      worden gemaakt.

      4 Bij algemene maatregel van bestuur kan worden bepaald dat, in afwijking van het eerste lid, zonder vergunning
      handelingen met een aangewezen type poliovirus mogen worden verricht:

      a. door degene die op het moment van inwerkingtreding van een aanwijzing als bedoeld in het eerste lid, reeds
      handelingen met het betreffende type poliovirus verrichtte en binnen een nader bepaalde termijn na aanwijzing van
      dat type poliovirus een aanvraag om een vergunning heeft ingediend;

      b. door degene aan wie eerder een vergunning is verleend en die voor het verstrijken van de geldigheidsduur daarvan
      dan wel voordat zich de situatie voordoet als bedoeld in [artikel 12f, eerste lid, onderdeel a][ref1], een
      aanvraag om verlenging van die vergunning heeft ingediend.

      5 In de gevallen, bedoeld in het vierde lid, mogen de handelingen worden voortgezet totdat op de ingediende
      aanvraag is beslist, behoudens de bevoegdheid van Onze Minister om te bevelen om bepaalde handelingen of
      werkzaamheden op te schorten indien dat noodzakelijk is ter bescherming van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12f
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12b
    references:
      - id: ref1
