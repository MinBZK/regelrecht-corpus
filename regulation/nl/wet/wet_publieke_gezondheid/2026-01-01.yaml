  - number: 58o
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat het aanbieden of verrichten van bepaalde categorieën van
      bedrijfsmatig personenvervoer geheel of gedeeltelijk verboden is.

      2 Bij ministeriële regeling kunnen regels worden gesteld over het aanbieden van, de toegang tot en het gebruik van
      voorzieningen voor bedrijfsmatig personenvervoer binnen Nederland of met een bestemming in Nederland. Hierbij kan
      onderscheid worden gemaakt tussen categorieën van bedrijfsmatig personenvervoer, gebieden van waaruit de reiziger
      vertrekt, waaronder het vertrek vanuit gebieden in het buitenland of het reizen tussen het Europese deel van
      Nederland, Bonaire, Sint Eustatius en Saba, of categorieën van personen voor wie de regels gelden.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel58o
  - number: 58p
    text: |-
      1 In een krachtens [artikel 58o, tweede lid][ref1], vast te stellen ministeriële regeling kan ten aanzien van de
      reiziger die vertrekt vanuit een door Onze Minister aangewezen gebied in het buitenland of die reist tussen het
      Europese deel van Nederland, Bonaire, Sint Eustatius of Saba, worden bepaald dat:

      a. de aanbieder van bedrijfsmatig personenvervoer uitsluitend vervoer aanbiedt, toegang daartoe verschaft of
      gebruik daarvan toestaat, indien de reiziger aan de aanbieder een testuitslag kan tonen waaruit blijkt dat hij op
      het moment van testen niet was geïnfecteerd met de betreffende ziekteverwekker of een verklaring als bedoeld in
      [artikel 58u][ref2], kan tonen, eventueel vergezeld van het voorgeschreven document als bedoeld in dat artikel;

      b. de reiziger bij de toegang tot het vervoermiddel en tijdens het vervoer beschikt over een testuitslag waaruit
      blijkt dat hij op het moment van testen niet was geïnfecteerd met de betreffende ziekteverwekker, de reiziger
      verplicht is deze op verzoek te tonen aan de aanbieder van bedrijfsmatig personenvervoer en verplicht is om de
      testuitslag te bewaren gedurende een bij ministeriële regeling te bepalen termijn en deze op verzoek te tonen aan
      de toezichthouder;

      c. ten aanzien van inreis in Bonaire, Sint Eustatius of Saba, de reiziger direct na aankomst beschikt over
      een testuitslag waaruit blijkt dat hij op het moment van testen niet was geïnfecteerd met de betreffende
      ziekteverwekker, en een verplichting voor de reiziger om de testuitslag te bewaren gedurende een bij ministeriële
      regeling te bepalen termijn en deze op verzoek te tonen aan de toezichthouder.

      2 Bij ministeriële regeling kan worden bepaald dat de reiziger die heeft verbleven in een door Onze Minister
      aangewezen gebied in het buitenland of reist tussen het Europese deel van Nederland, Bonaire, Sint Eustatius of
      Saba, anders dan met gebruikmaking van bedrijfsmatig personenvervoer als bedoeld in het eerste lid, bij inreis in
      Nederland beschikt over een testuitslag waaruit blijkt dat hij op het moment van testen niet was geïnfecteerd met
      de betreffende ziekteverwekker en om die testuitslag te bewaren gedurende een bij ministeriële regeling te bepalen
      termijn en deze op verzoek te tonen aan de toezichthouder.

      3 Bij ministeriële regeling worden nadere eisen gesteld aan de test, bedoeld in het eerste en tweede lid, die
      betrekking kunnen hebben op:

      a. de vaststelling van de identiteit van de geteste persoon;

      b. het type test dat is uitgevoerd;

      c. de wijze waarop de testuitslag wordt aangetoond;

      d. de termijn waarbinnen de test moet zijn uitgevoerd ten opzichte van het moment van inreis in Nederland.

      4 Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba geschiedt de aanwijzing van gebieden, bedoeld in het
      eerste of tweede lid, na overleg met de gezaghebber.

      5 Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba kan de in het tweede lid bedoelde testuitslag in bij
      ministeriële regeling bepaalde gevallen ook worden verkregen direct na het moment van aankomst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58o
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58u
