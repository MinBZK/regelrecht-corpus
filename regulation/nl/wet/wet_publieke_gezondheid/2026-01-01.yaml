  - number: '44'
    text: |-
      1 Indien degene ten aanzien van wie een beschikking is genomen tot opneming ter isolatie als bedoeld in
      [artikel 31, eerste of tweede lid][ref1] tot onderzoek als bedoeld in [artikel 31, derde of vierde lid][ref2], of
      tot onderwerping aan een maatregel van quarantaine als bedoeld in [artikel 35][ref3], nadeel heeft geleden doordat
      de rechter of de officier van justitie een van de bepalingen uit deze paragraaf niet in acht heeft genomen, kent de
      rechter deze op diens verzoek een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.

      2 Het verzoek kan worden ingediend als een zelfstandig verzoek bij het verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van betrokkene, dan wel bij een afzonderlijk verzoekschrift, binnen
      drie maanden te rekenen vanaf de dag waarop betrokkene redelijkerwijs bekend kon zijn met de schending van het
      voorschrift waarop zijn verzoek betrekking heeft.

      3 Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref5] van overeenkomstige toepassing.


