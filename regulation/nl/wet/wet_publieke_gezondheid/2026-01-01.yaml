      1 Een certificaat van sanitaire controle van schepen of een certificaat tot vrijstelling van sanitaire controle van
      schepen als bedoeld in artikel 39 van de Internationale Gezondheidsregeling, wordt op verzoek van de gezagvoerder
      door de burgemeester afgegeven indien het schip vrij is van besmetting.

      2 De certificaten worden opgesteld volgens het in bijlage 3 van de Internationale Gezondheidsregeling opgenomen
      model.

      3 Bij regeling van Onze Minister worden nadere regels gesteld over de afgifte van de certificaten. Voor zover de
      nadere regels gebaseerd zijn op eisen van de Wereld Gezondheidsorganisatie, kunnen deze in de Engelse gesteld en
      bekend worden gemaakt.

      4 Bij regeling van Onze Minister worden de havens aangewezen waarvoor de burgemeester bevoegd is tot afgifte van
      de certificaten.
