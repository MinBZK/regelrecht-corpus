        bwb_id: BWBR0024705
        artikel: 12b
        hoofdstuk: II
        paragraaf: '6'
  - number: 12h
    text: |-
      Indien een vergunning is vervallen of ingetrokken, ontdoet degene aan wie de vergunning was verleend zich van het
      aanwezige poliovirus. Onze Minister kan daartoe een termijn stellen en ter zake aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12h
  - number: 12i
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat eenieder die bij die maatregel aangewezen handelingen
      verricht met bij die maatregel aangewezen typen poliovirus, daarvan melding doet aan Onze Minister.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het bepaalde
      in het eerste lid, waaronder regels over de bij een melding te verstrekken gegevens en over
      de termijn waarbinnen een melding moet worden gedaan. Tevens kan daarbij, in afwijking van
      [artikel 2:15, eerste lid, van de Algemene wet bestuursrecht][ref1], worden bepaald dat de melding uitsluitend op
      elektronische wijze plaatsvindt en kunnen daarbij nadere eisen worden gesteld aan het gebruik van de elektronische
      weg.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel215
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12i
