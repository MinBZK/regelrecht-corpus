  - number: 58f
    text: |-
      1 Degene die zich buiten een woning ophoudt, houdt een veilige afstand tot andere personen.

      2 De veilige afstand wordt vastgesteld bij ministeriële regeling.

      3 De veilige afstand geldt niet:

      a. tussen personen die op hetzelfde adres woonachtig zijn;

      b. voor een opsporingsambtenaar, toezichthouder als bedoeld in
      [artikel 5:11 van de Algemene wet bestuursrecht][ref1], beveiligingsmedewerker, zorgverlener, mantelzorger of
      geestelijke bedienaar of persoon die werkzaam is bij een justitiële inrichting, bij de politie, de brandweer, de
      krijgsmacht, of die eerste hulp biedt bij een het leven of de gezondheid bedreigende situatie, voor zover deze zijn
      taak of het bieden van eerste hulp niet op gepaste wijze kan uitoefenen met inachtneming van de veilige afstand;

      c. voor degene jegens wie een onder b genoemde persoon zijn taak of het bieden van eerste hulp uitoefent;

      d. tussen een persoon met een handicap of persoon tot en met de leeftijd van twaalf jaar en diens begeleider, voor
      zover die persoon zich niet met inachtneming van de veilige afstand jegens zijn begeleider buiten een woning kan
      ophouden; of

      e. voor andere bij ministeriële regeling aangewezen categorieën van personen of aangewezen plaatsen of gevallen,
      onder daarbij te stellen voorwaarden of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel511
