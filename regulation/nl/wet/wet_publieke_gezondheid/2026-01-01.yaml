        artikel: 12f
        hoofdstuk: II
        paragraaf: '6'
  - number: 12c
    text: |-
      1 Onze Minister kan een vergunning verlenen indien zich geen weigeringsgrond als bedoeld in [artikel 12d][ref1]
      voordoet.

      2 Een vergunning is niet overdraagbaar.

      3 Bij algemene maatregel van bestuur worden regels gesteld over de geldigheidsduur van een vergunning.

      4 Een vergunning kan onder voorwaarden worden verleend. Aan een vergunning of verleende vergunning kunnen
      voorschriften of beperkingen worden verbonden. Een voorschrift of beperking kan worden gewijzigd of worden
      ingetrokken.

      5 Bij regeling van Onze Minister worden regels gesteld over de indiening en behandeling van een aanvraag om een
      vergunning, waaronder de termijn waarbinnen op een aanvraag moet worden beslist, en wordt bepaald welke gegevens en
      bescheiden bij de aanvraag worden overlegd.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op een aanvraag om een vergunning
      als bedoeld in dit artikel.

      7 Onze Minister kan de kosten die samenhangen met het in behandeling nemen van de aanvraag ten laste brengen van de
      aanvrager. De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.

      8 Onze Minister informeert het bestuur van de veiligheidsregio die het aangaat, over de verlening van een
      vergunning of de schorsing dan wel intrekking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12d
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 12d
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 12d
    text: |-
      Een vergunning wordt geweigerd, indien:

      a. de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag, waaronder het niet of niet tijdig overleggen van de gevraagde gegevens en bescheiden, bedoeld in
      [artikel 12c, vijfde lid][ref1];

      b. de aanvrager de voor de behandeling van de aanvraag in rekening gebrachte kosten niet of niet tijdig heeft
      voldaan;

      c. de aanvrager niet aannemelijk heeft gemaakt te zullen voldoen aan de eisen, bedoeld in
      [artikel 12b, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel12b
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel12d
