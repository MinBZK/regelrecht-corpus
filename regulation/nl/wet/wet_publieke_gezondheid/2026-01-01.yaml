  - number: '53'
    text: |-
      1 In geval van een melding als bedoeld in [artikel 50][ref1] of indien anderszins blijkt van omstandigheden
      aan boord van een schip of luchtvaartuig dat een internationale reis maakt, die een ernstig gevaar voor de
      volksgezondheid kunnen meebrengen, bepaalt de burgemeester welke maatregelen met betrekking tot de toelating tot
      of de onttrekking aan het vrije verkeer moeten worden genomen als het schip of luchtvaartuig in de burgerhaven
      of burgerluchthaven, dan wel in het voor burgerluchtverkeer bestemde gedeelte van een militaire luchthaven met
      burgermedegebruik, is aangekomen.

      2 In geval van een directe dreiging van een epidemie van een infectieziekte behorend tot groep A1 of A2, kan
      de voorzitter van de veiligheidsregio ten aanzien van een schip of luchtvaartuig dat een internationale reis
      maakt, bepalen welke maatregelen met betrekking tot de toelating tot of de onttrekking aan het vrije verkeer
      moeten worden genomen als het schip of luchtvaartuig in de burgerhaven of burgerluchthaven, dan wel in het voor
      burgerluchtverkeer bestemde gedeelte van een militaire luchthaven met burgermedegebruik, is aangekomen.

      3 In de situatie, bedoeld in het eerste en tweede lid, draagt de gezagvoerder van het schip of luchtvaartuig ervoor
      zorg dat:

      a. na aankomst niemand het schip of luchtvaartuig betreedt of verlaat en er geen vervoermiddelen of goederen
      worden geladen of gelost, tenzij de burgemeester dan wel de voorzitter van de veiligheidsregio daartoe opdracht of
      toestemming geeft, en

      b. op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio een overzicht wordt gegeven van
      de volgende gegevens van de passagiers, voor zover deze gegevens bekend zijn bij de gezagvoerder: naam, adres,
      geslacht, leeftijd en bestemming.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio past de maatregelen niet langer toe dan nodig is om
      het onderzoek uit te voeren om de ernst van het gevaar vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
