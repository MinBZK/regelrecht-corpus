preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter implementatie van de herziene Internationale
    Gezondheidsregeling en om beter voorbereid te zijn op infectieziektecrises, wenselijk is voor de
    infectieziektebestrijding regels te stellen betreffende de organisatie ervan en de informatieverplichtingen en de
    bevoegdheden tot optreden uit te breiden; dat het wenselijk is om deze regels samen met de bestaande bepalingen
    onder te brengen in één wet opdat een samenhangend geheel ontstaat; dat daarom de Wet collectieve preventie
    volksgezondheid, de Infectieziektenwet en de Quarantainewet kunnen worden ingetrokken en worden vervangen door een
    wet voor de publieke gezondheid; dat het daarnaast wenselijk is om in deze wet een bepaling op te nemen omtrent een
    verplichte digitale gegevensopslag bij de uitvoering van de jeugdgezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. *de Internationale Gezondheidsregeling:* de Internationale Gezondheidsregeling met Bijlagen (Trb. 2007, 34);

      b. *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;

      c. *publieke gezondheidszorg:* de gezondheidsbeschermende en gezondheidsbevorderende maatregelen voor de bevolking
      of specifieke groepen daaruit, waaronder begrepen het voorkómen en het vroegtijdig opsporen van ziekten;

      d. *jeugdgezondheidszorg:* de publieke gezondheidszorg, waarbij een landelijk preventief gezondheidszorgpakket
      actief wordt aangeboden aan alle jeugdigen tot 18 jaar;

      da. *ouderengezondheidszorg:* de publieke gezondheidszorg ten behoeve van personen boven de vijfenzestig jaar;

      db. *groep A1:* een krachtens de procedure van [artikel 20][ref1] als zodanig aangemerkte infectieziekte;

      e. *groep A2:* Middle East respiratory syndrome (MERS), pokken, polio, severe acute respiratory syndrome (SARS),
      virale hemorragische koorts;

      f. *groep B1:* een humane infectie veroorzaakt door een dierlijk influenzavirus, difterie, mpox, pest, rabies,
      tuberculose;

      g. *groep B2:* buiktyfus (typhoid fever), cholera, hepatitis A, B en C, kinkhoest, mazelen, paratyfus, rubella,
      shigellose, shiga toxine producerende escherichia (STEC)/enterohemorragische escherichia coli-infectie, invasieve
      groep A streptokokkeninfectie, voedselinfectie, voor zover vastgesteld bij twee of meer patiënten met een
      onderlinge relatie wijzend op voedsel als een bron;

      h. *groep C:* de krachtens [artikel 19][ref2] aangewezen infectieziekten;

      i. *epidemie van een infectieziekte:* een in korte tijd sterke toename van het aantal nieuwe patiënten lijdend aan
      een infectieziekte behorend tot groep A1, A2, B1, B2 of C;

      j. *quarantaine:* verblijf van een persoon die mogelijk besmet is met een infectieziekte behorend tot groep A1
      of A2 in een door de burgemeester aangewezen gebouw, schip of in een aantal aangewezen ruimten daarbinnen, in
      verband met de bestrijding van de gevaren van die ziekte voor de volksgezondheid;

      k. *medisch toezicht:* medisch toezicht op een in quarantaine geplaatste persoon om te bezien of deze met een
      infectieziekte behorend tot groep A1 of A2 is geïnfecteerd en dientengevolge ziekteverschijnselen ontwikkelt;

      l. *besmetting:* de aanwezigheid van een vector, reservoir, infectieus of giftig agens of infectieuze of giftige
      stof op of in een terrein, gebouw, goed of vervoermiddel, waardoor een volksgezondheidsrisico kan ontstaan;

      m. *infectie:* het binnendringen en de ontwikkeling of vermenigvuldiging van een infectieus agens in het lichaam
      van mensen, waardoor een volksgezondheidsrisico kan ontstaan;

      n. *vector:* een insect of ander dier dat een infectieus agens met zich mee kan voeren en over kan dragen tussen
      dieren of mensen waardoor een volksgezondheidsrisico kan ontstaan;

      na. *reservoir:* een dier, plant of substantie waarin een infectieus agens normaliter leeft en wiens aanwezigheid
      een volksgezondheidsrisico zou kunnen vormen;

      o. *lijk;* een lijk in de zin van [artikel 2, eerste lid, onder a, van de Wet op de lijkbezorging][ref3];

      p. *haven:* haven, inclusief de ankergebieden, ligplaatsen, kaden, steigers en, voor wat betreft zeehavens,
      aanvaarroutes vanuit zee, alsmede alle zich in de nabijheid daarvan bevindende bedrijven, opslagplaatsen en overige
      terreinen en gebouwen, die op grond van hun ligging, bestemming of gebruik moeten worden geacht daartoe te behoren;

      q. *luchthaven:* een terrein geheel of gedeeltelijk bestemd voor het opstijgen en het landen van luchtvaartuigen
      met inbegrip van:

      1°. de daarmee verband houdende bewegingen van luchtvaartuigen op de grond,

      2°. de afwikkeling van het in de aanhef en onder 1° bedoelde luchtverkeer, of

      3°. bedrijfsmatige activiteiten die samenhangen met de afwikkeling van het in de aanhef en onder 1° bedoelde
      luchtverkeer;

      r. *burgerexploitant:* burgerexploitant als bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref4];

      s. *gebouw:* elk bouwwerk dat een overdekte geheel of gedeeltelijk met wanden omsloten ruimte vormt, met
      uitzondering van bouwwerken ten behoeve van het belijden van godsdienst of levensovertuiging;

      t. *vervoermiddel:* luchtvaartuig, schip, trein of wegvoertuig;

      u. *goed:* tastbaar product, met inbegrip van planten en met uitzondering van dieren, vervoermiddelen en lijken in
      de zin van [artikel 2, eerste lid, onder a, van de Wet op de lijkbezorging][ref5];

      v. *waar:* eetwaar, waaronder tevens begrepen een kauwpreparaat, drinkwaar alsmede een andere roerende zaak, voor
      zover gebruikt in de sfeer van de particuliere huishouding of van een krachtens de Warenwet daarmee gelijkgestelde
      andere huishouding;

      w. *vervoersexploitant:* een natuurlijke of rechtspersoon die verantwoordelijk is voor een schip of luchtvaartuig
      dat een internationale reis maakt waarbij gebruik wordt gemaakt van een haven of luchthaven, of diens
      vertegenwoordiger;

      x. *laboratorium:* een laboratorium waar van het menselijk lichaam afgescheiden of afgenomen stoffen worden
      onderzocht ten behoeve van de diagnostiek van infectieziekten;

      y. *samenwerkingsverband van registerloodsen:* het voor de desbetreffende scheepvaartweg, bedoeld in
      [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref6], aangewezen samenwerkingsverband van registerloodsen,
      waarin krachtens [artikel 15, eerste lid, onderdeel b, onder 2, van de Loodsenwet][ref7], is voorzien;

      z. *burgerservicenummer:* het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref8];

      aa. *RIVM:* het Rijksinstituut voor volksgezondheid en milieu van het Ministerie van Volksgezondheid, Welzijn en
      Sport, bedoeld in [artikel 1, onderdeel b, van de Wet op het RIVM][ref9];

      ab. *voorzitter van de veiligheidsregio:* de voorzitter van het bestuur van de veiligheidsregio, bedoeld in
      [artikel 11, tweede lid, van de Wet veiligheidsregio’s][ref10];

      ac. *inspectie:* de Inspectie gezondheidszorg en jeugd;

      ad. *referentielaboratorium:* een laboratorium dat naar de laatste stand van de wetenschap gespecialiseerd is in de
      diagnostiek, surveillance en behandeling dan wel bestrijding van een specifieke ziekte of ziekteverwekker;

      ad. *vaccinatie:* actieve immunisatie, daaronder tevens begrepen passieve immunisatie;

      ae. *suïcide:* een handeling waarmee opzettelijk een eind wordt gemaakt aan het eigen leven, niet zijnde een
      zelfdoding waarbij sprake was van hulp bij zelfdoding als bedoeld in de Wet toetsing levensbeëindiging op verzoek
      en hulp bij zelfdoding;

      af. *suïcidepreventie:* alle acties gericht op het voorkomen van suïcides of pogingen daartoe.


