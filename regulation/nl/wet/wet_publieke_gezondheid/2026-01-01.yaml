  - number: 65a
    text: |-
      1 Met de opsporing van de in [artikel 68bis][ref1] strafbaar gestelde feiten
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2] en
      [artikel 184 van het Wetboek van Strafvordering BES][ref3], belast de door Onze Minister in overeenstemming
      met Onze Minister van Justitie en Veiligheid aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft,
      ressorterende onder een ander ministerie dan dat van Onze Minister of van Onze Minister van Justitie en Veiligheid,
      wordt het besluit genomen in overeenstemming met Onze Minister die het mede aangaat.

      2 De aangewezen ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref4] en [184 van het Wetboek van Strafrecht][ref5] dan wel de
      [artikelen 185 tot en met 188][ref6] en [190 van het Wetboek van Strafrecht BES][ref7], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


