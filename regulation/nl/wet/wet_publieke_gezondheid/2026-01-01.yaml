  - number: 58cb
    text: |-
      1 Bij een daartoe afzonderlijk tot stand te brengen ministeriële regeling wordt bepaald of de toepassing van
      een krachtens paragraaf 8 van dit hoofdstuk toegekende bevoegdheid, voor zover in werking gesteld krachtens
      [artikel 20][ref1] of [20a][ref2], wordt verbonden aan een vervaltermijn gelet op de mogelijke gevolgen
      van de toepassing voor de vrije uitoefening van grondrechten en het maatschappelijk welzijn als bedoeld in
      [artikel 58b, onder c en d][ref3]. De in de eerste zin bedoelde ministeriële regeling wordt met toepassing van
      [artikel 58c][ref4] tot stand gebracht.

      2 Een ministeriële regeling als bedoeld in het eerste lid, wordt niet vastgesteld indien de Tweede Kamer of de
      Eerste Kamer der Staten-Generaal binnen de termijn, bedoeld in [artikel 58c, tweede lid, tweede zin][ref5],
      besluit niet in te stemmen met de regeling. Artikel 58c, derde lid, is van overeenkomstige toepassing op een
      besluit van de Eerste Kamer der Staten-Generaal.

      3 Indien voor een ministeriële regeling, dan wel een onderdeel daarvan, ingevolge het eerste lid een vervaltermijn
      geldt, vervalt deze regeling, dan wel het onderdeel, ten hoogste acht weken na de inwerkingtreding. Dit laat
      onverlet dat een regeling of onderdeel daarvan telkens, al dan niet gewijzigd, kan worden vastgesteld. Het tijdstip
      waarop de regeling of het onderdeel vervalt, ligt steeds ten hoogste acht weken na het tijdstip waarop die regeling
      of dat onderdeel zou vervallen.


