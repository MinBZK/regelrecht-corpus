        artikel: '5'
  - number: 20a
    text: |-
      1 Onverminderd de inwerkingstelling van bepalingen, bedoeld in [paragraaf 8, van hoofdstuk V][ref1], bij de
      toepassing van [artikel 20, eerste of tweede lid][ref2], kunnen niet in werking gestelde of met toepassing van
      het tweede lid buiten werking gestelde bepalingen van die paragraaf, indien het belang van de volksgezondheid dit
      vordert en voor zover het betreft een infectieziekte behorend tot groep A1, in overeenstemming met het gevoelen van
      de ministerraad, bij regeling van Onze Minister, in werking worden gesteld.

      2 Zodra het belang van de volksgezondheid niet langer vordert dat krachtens [artikel 20][ref3] of het eerste lid
      in werking gestelde bepalingen, bedoeld in [paragraaf 8, van hoofdstuk V][ref4], in werking zijn, worden deze
      bepalingen in overeenstemming met het gevoelen van de ministerraad, bij regeling van Onze Minister buiten werking
      gesteld.

      3 Na de inwerkingtreding van een krachtens het eerste of tweede lid vastgestelde regeling, vindt de toepassing van
      deze wet overeenkomstig die regeling plaats.

      4 Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde ministeriële regeling wordt
      onverwijld een voorstel van wet tot incorporatie van die regeling aan de Tweede Kamer der Staten-Generaal gezonden.
      [Artikel 20, vijfde lid, tweede en derde zin, en zesde lid][ref5], zijn van overeenkomstige toepassing.


