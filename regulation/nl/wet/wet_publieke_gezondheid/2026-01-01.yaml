  - number: 58d
    text: |-
      1 Bij ministeriële regeling kunnen andere collectieve maatregelen worden genomen voor het in
      [artikel 58b, aanhef][ref1], genoemde doel, indien:

      a. sprake is van een ernstige ontwrichting van de maatschappij of een directe dreiging daarvan;

      b. onverwijld handelen noodzakelijk is, en

      c. een krachtens paragraaf 8 van dit hoofdstuk geldende of vast te stellen ministeriële regeling niet toereikend
      is.

      2 In afwijking van de [artikelen 58c, tweede lid][ref2], en [58ca][ref3], wordt de ministeriële regeling, bedoeld
      in het eerste lid, niet vastgesteld dan nadat deze regeling ten minste 24 uur is voorgelegd aan de Tweede Kamer der
      Staten-Generaal. Indien binnen die termijn de Tweede Kamer der Staten-Generaal besluit niet in te stemmen met deze
      ministeriële regeling, wordt deze niet vastgesteld.

      3 Een na toepassing van het tweede lid vastgestelde ministeriële regeling wordt door Onze Minister onverwijld aan
      beide Kamers der Staten-Generaal gezonden, voorzien van een motivering waarom het tweede lid is toegepast.

      4 Indien het onmogelijk is de termijn van 24 uur, bedoeld in het tweede lid af te wachten, zendt Onze Minister de
      vastgestelde regeling onverwijld aan beide Kamers der Staten-Generaal, voorzien van een motivering waarom hiervan
      sprake is. [Artikel 58ca, tweede lid, tweede zin][ref4], is van toepassing.

      5 De ministeriële regeling bedoeld in het eerste lid, vervalt acht weken na de inwerkingtreding en kan steeds met
      toepassing van [artikel 58c, tweede lid][ref5], worden verlengd met ten hoogste acht weken na het tijdstip waarop
      die regeling zou vervallen.

      6 Na de plaatsing in de Staatscourant van een krachtens het eerste lid vastgestelde ministeriële regeling
      wordt onverwijld een voorstel van wet tot regeling van het betrokken onderwerp aan de Tweede Kamer der Staten-
      Generaal gezonden. Indien het voorstel van wet wordt ingetrokken dan wel door een der Kamers der Staten-Generaal
      wordt verworpen, trekt Onze Minister de regeling onverwijld in, tenzij de regeling ingevolge het vijfde lid
      is vervallen. Wordt het voorstel tot wet verheven, dan vervalt de ministeriële regeling van rechtswege op het
      tijdstip van inwerkingtreding van de wet, tenzij de ministeriële regeling ingevolge het vijfde lid is vervallen of
      wordt gebaseerd op de wet zoals deze dan luidt. Op een intrekkingsregeling als bedoeld in de tweede zin, zijn de
      [artikelen 58c][ref6] en [58ca][ref7] niet van toepassing.

      7 Indien zich in het openbare lichaam Bonaire, Sint Eustatius of Saba een omstandigheid voordoet waarin een
      krachtens paragraaf 8 van dit hoofdstuk, met toepassing van [artikel 58ca][ref8] vast te stellen ministeriële
      regeling niet zodanig tijdig tot stand kan komen als noodzakelijk is voor het in [artikel 58b, aanhef][ref9],
      genoemde doel, kan Onze Minister ter uitvoering van [artikel 7, eerste lid][ref10], de gezaghebber opdragen
      toepassing te geven aan de hem in [artikel 179 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref11]
      toegekende bevoegdheid om algemeen verbindende voorschriften vast te stellen ter bestrijding van een epidemie van
      de betreffende infectieziekte of een directe dreiging daarvan.

      8 Binnen twee weken na de vaststelling van de in het zevende lid bedoelde opdracht wordt een ministeriële regeling
      vastgesteld tot regeling van de in die voorschriften genoemde onderwerpen. Onze Minister zendt de regeling binnen
      twee dagen na vaststelling aan beide Kamers der Staten-Generaal.


