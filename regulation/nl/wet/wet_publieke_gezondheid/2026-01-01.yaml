      1 De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd een bestuurlijke boete op
      te leggen ter handhaving van het bepaalde bij of krachtens [artikel 58r, eerste en tweede lid][ref1],
      [58w, eerste lid, onder a][ref2], en [58x, eerste lid][ref3].

      2 De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt € 339.

      3 Indien de bevoegdheid, genoemd in het eerste lid, wordt uitgeoefend door de gezaghebber in de
      openbare lichamen Bonaire, Sint Eustatius of Saba, zijn op de uitoefening van die bevoegdheid de
      [artikelen 5:12 tot en met 5:20 van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


