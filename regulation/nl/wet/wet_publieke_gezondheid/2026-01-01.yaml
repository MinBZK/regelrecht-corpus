  - number: 58n
    text: |-
      1 Een zorgaanbieder draagt zorg voor een zodanige openstelling, inrichting en zorg, jeugdhulp of maatschappelijke
      ondersteuning dat de aanwezige personen die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning
      betrokken zijn of die geen mantelzorger zijn, de bij of krachtens de [artikelen 58d, eerste lid][ref1], en
      [58f tot en met 58i][ref2] gestelde regels redelijkerwijs in acht kunnen nemen.

      2 Een zorgaanbieder kan, indien dit noodzakelijk is om verspreiding van de betreffende ziekteverwekker naar dan
      wel vanuit een zorglocatie tegen te gaan en de maatregelen die de zorgaanbieder treft op grond van het eerste
      lid onvoldoende zijn om die verspreiding tegen te gaan, beperkingen of andere voorwaarden stellen aan de toegang
      van personen tot een zorglocatie door iemand die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning
      betrokken is of die geen mantelzorger is.

      3 Indien Onze Minister van oordeel is dat personen die niet bij de zorg, jeugdhulp of maatschappelijke
      ondersteuning betrokken zijn of die geen mantelzorger zijn, de in het eerste lid genoemde regels onvoldoende
      in acht kunnen nemen, kan hij de zorgaanbieder een schriftelijke aanwijzing geven. In de aanwijzing geeft Onze
      Minister met redenen omkleed aan op welke punten de aanwezige personen de regels niet in acht kunnen nemen,
      alsmede de in verband daarmee te nemen maatregelen. Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder de
      maatregelen treft. In een spoedeisende situatie kan Onze Minister een bevel geven. Indien het bevel mondeling wordt
      gegeven, wordt het zo spoedig mogelijk op schrift gesteld en bekendgemaakt.

      4 Indien de maatregelen die een zorgaanbieder neemt op grond van het eerste en tweede lid, onvoldoende of
      onevenredig zijn om verspreiding van de betreffende ziekteverwekker naar dan wel vanuit een zorglocatie tegen
      te gaan, kunnen bij ministeriële regeling beperkingen of andere voorwaarden worden gesteld aan het door de
      zorgaanbieder toelaten tot zorglocaties van personen die niet bij de zorg, jeugdhulp of maatschappelijke
      ondersteuning betrokken zijn of die geen mantelzorger zijn, tenzij het belang van de volksgezondheid niet opweegt
      tegen de belangen van de cliënten en patiënten bij die toegang. In de ministeriële regeling kan onderscheid worden
      gemaakt tussen zorglocaties of categorieën daarvan.

      5 Toepassing van een bevoegdheid als bedoeld in het tweede of vierde lid houdt in ieder geval geen beperking in van
      de toegang:

      a. van ten minste één familielid of naaste tot een in de zorglocatie verblijvende persoon, behoudens in geval van
      uitzonderlijke omstandigheden;

      b. van familieleden of naasten tot een in de zorglocatie verblijvende persoon van wie de behandelend arts verwacht
      dat deze op korte termijn zal overlijden;

      c. in verband met het horen van een cliënt als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _ of het horen van betrokkene als bedoeld in de [artikelen 6:1, derde lid][ref4], en
      [7:1, derde lid, van de Wet verplichte geestelijke gezondheidszorg][ref5];

      d. van advocaten en cliëntenvertrouwenspersonen als bedoeld in de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref6], advocaten en
      patiëntenvertrouwenspersonen als bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref7] en
      vertrouwenspersonen als bedoeld in de [Jeugdwet][ref8];

      e. van een geestelijk bedienaar tot een tot zijn geloofsgemeenschap behorende persoon die in de zorglocatie
      verblijft.

      6 De [artikelen 58k][ref9] en [58l][ref10] zijn niet van toepassing.


