  - number: 5a
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de ouderengezondheidszorg.

      2 Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:

      a. het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van ouderen en van
      gezondheidsbevorderende en -bedreigende factoren;

      b. het ramen van de behoeften aan zorg;

      c. de vroegtijdige opsporing en preventie van specifieke stoornissen als comorbiditeit;

      d. het geven van voorlichting, advies, instructie en begeleiding;

      e. het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkzaamheden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024705/2026-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de algemene
      infectieziektebestrijding, waaronder in ieder geval behoort:

      a. het nemen van algemene preventieve maatregelen op dit gebied,

      b. het bestrijden van tuberculose en seksueel overdraagbare aandoeningen, inclusief bron- en contactopsporing,

      c. bron- en contactopsporing bij meldingen als bedoeld in de [artikelen 21][ref1], [22][ref2], [25][ref3] en
      [26][ref4].

      2 Het bestuur van de veiligheidsregio draagt zorg voor de voorbereiding op de bestrijding van een epidemie van een
      infectieziekte behorend tot groep A1 of A2, alsmede op de bestrijding van een nieuw subtype humaan influenzavirus,
      waarbij ernstig gevaar voor de volksgezondheid bestaat.

      3 De burgemeester geeft leiding aan de bestrijding van een epidemie van een infectieziekte, behorend tot groep
      B1, B2 of C, alsook de directe voorbereiding daarop en draagt zorg voor de toepassing van de maatregelen, bedoeld
      in [hoofdstuk V][ref5].

      4 De voorzitter van de veiligheidsregio draagt zorg voor de bestrijding van een epidemie van een infectieziekte
      behorend tot groep A1 of A2, of een directe dreiging daarvan, en is dan ten behoeve van deze bestrijding bij
      uitsluiting bevoegd om toepassing te geven aan de [artikelen 34, vierde lid][ref6], [47][ref7], [51][ref8],
      [54][ref9], [55][ref10] of [56][ref11]. Voor zover het gaat om een infectieziekte behorend tot groep A1 is de
      voorzitter van de veiligheidsregio ten behoeve van deze bestrijding voorts bij uitsluiting bevoegd toepassing te
      geven aan de [artikelen 58e, tweede tot en met vijfde lid][ref12], [58j, tweede tot en met vierde lid][ref13],
      [58k, tweede tot en met vierde lid][ref14], [58l][ref15], [58m][ref16], [58s, tweede lid][ref17],
      [58v, tweede en derde lid][ref18], [58z, derde en vierde lid][ref19], en [58za, eerste lid][ref20].

      5 Indien de bestrijding van de epidemie van een infectieziekte behorend tot groep A1 of een directe
      dreiging daarvan, gelet op de mate van beheersing, niet vereist dat de uitoefening van de bevoegdheden,
      bedoeld in het vierde lid, laatste zin, plaatsvindt door de voorzitter van de veiligheidsregio,
      komen die bevoegdheden na een besluit als bedoeld in het zesde lid en zolang een besluit als bedoeld
      in het zevende lid niet is genomen, bij uitsluiting toe aan de burgemeester. In afwijking van
      [artikel 39, eerste lid, van de Wet veiligheidsregio’s][ref21] is in die situatie ten behoeve van het bepaalde
      in [paragraaf 8, van hoofdstuk V][ref22], voor de bestrijding van de epidemie van een infectieziekte behorend
      tot groep A1 of een directe dreiging daarvan, in plaats van de voorzitter van de veiligheidsregio, de burgemeester
      bevoegd toepassing te geven aan de in [artikel 39, eerste lid, van de Wet veiligheidsregio’s][ref23] genoemde
      artikelen, met uitzondering van de [artikelen 5][ref24] en [7 van de Wet veiligheidsregio’s][ref25].

      6 Onze Minister, in overeenstemming met Onze Minister van Justitie en Veiligheid en Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties, besluit na overleg met de voorzitter van de betrokken veiligheidsregio of sprake is
      van een situatie als bedoeld in het vijfde lid.

      7 Onze Minister kan het in het zesde lid bedoelde besluit, in overeenstemming met Onze Minister van Justitie en
      Veiligheid en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, na overleg met de voorzitter van de
      betrokken veiligheidsregio wijzigen als de in dat lid bedoelde omstandigheid zich niet langer voordoet.

      8 Bij algemene maatregel van bestuur kunnen de taken, bedoeld in het eerste, tweede, derde en vierde lid, nader
      worden uitgewerkt.

      9 Als dienst van algemeen economisch belang in de zin van artikel 106, tweede lid, van het Verdrag betreffende de
      werking van de Europese Unie zijn aangewezen de door het RIVM krachtens [artikel 6c, eerste lid][ref26], aan een
      gemeentelijke gezondheidsdienst opgedragen activiteiten in het kader van het bestrijden van seksueel overdraagbare
      aandoeningen, bedoeld in het eerste lid, onderdeel b.

      10 De gemeentelijke gezondheidsdienst komt uitsluitend compensatie toe voor de activiteiten,
      bedoeld in het zesde lid, in de vorm van een specifieke uitkering als bedoeld in
      [artikel 15a van de Financiële-verhoudingswet][ref27]. Bij ministeriële regeling worden nadere voorschriften
      gegeven omtrent het toepassingsbereik van de activiteiten en de compensatie.


