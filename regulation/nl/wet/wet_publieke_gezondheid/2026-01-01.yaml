    text: |-
      1 De kosten ter verkrijging van een certificaat als bedoeld in [artikel 57, eerste lid][ref1], komen ten laste van
      de gezagvoerder van het desbetreffende schip.

      2 Behoudens in bij regeling van Onze Minister te bepalen gevallen komen de kosten van inenting van
      personen of de toediening van profylaxe aan personen ter verkrijging van een certificaat als bedoeld in
      [artikel 58, eerste lid][ref2], ten laste van de belanghebbende.

      3 Bij regeling van Onze Minister worden de tarieven vastgesteld voor het verkrijgen van de certificaten, bedoeld in
      de [artikelen 57, eerste lid][ref3], en [58, eerste lid][ref4].


