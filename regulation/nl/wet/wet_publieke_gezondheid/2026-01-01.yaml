      1 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt
      gestraft degene die zich onttrekt aan de krachtens de in de [artikelen 38, eerste lid][ref1],
      of [47, tweede of derde lid, onder a of b][ref2], ten aanzien van hem genomen maatregelen, dan wel de in
      [artikel 47, derde lid, onder c][ref3], bedoelde waren onttrekt aan een krachtens dat lid genomen maatregel.

      2 Met hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft het onbevoegd
      betreden van een voor isolatie of quarantaine aangewezen locatie.

      3 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de exploitant
      van een burgerhaven of burgerluchthaven die handelt in strijd met [artikel 49, tweede lid][ref4], of met een
      krachtens [artikel 54][ref5] gegeven opdracht.

      4 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de
      burgerexploitant die handelt in strijd met [artikel 49, derde lid][ref6], of met een krachtens [artikel 54][ref7]
      gegeven opdracht.

      5 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft de
      vervoersexploitant die handelt in strijd met een krachtens [artikel 55][ref8] gegeven opdracht.

      6 De in het eerste tot en met vijfde lid strafbaar gestelde feiten zijn overtredingen.


