  - number: 58b
    text: |-
      De bij of krachtens paragraaf 8 van dit hoofdstuk toegekende bevoegdheden worden, voor zover krachtens
      [artikel 20][ref1] of [20a][ref2] in werking gesteld, slechts toegepast voor de bestrijding van een epidemie van
      een infectieziekte behorend tot groep A1 of een directe dreiging daarvan en voor zover:

      a. de bedreiging van de volksgezondheid dusdanig ernstig is dat afwending van die dreiging noodzakelijk is;

      b. de toepassing van de bevoegdheden gezien de aard van de infectieziekte daadwerkelijk geschikt is voor afwending
      van de dreiging;

      c. de gevolgen voor de vrije uitoefening van grondrechten en het maatschappelijk welzijn, waaronder ten minste de
      sociale, financieel-economische, maatschappelijke en andere gezondheidsbelangen, zo beperkt mogelijk zijn en tevens
      in redelijke verhouding staan tot de gevolgen die zouden intreden indien de bevoegdheden niet worden toegepast; en

      d. geen alternatieven beschikbaar zijn waarmee hetzelfde doel kan worden bereikt en die minder ingrijpend zouden
      zijn voor de vrije uitoefening van grondrechten en het maatschappelijk welzijn.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel20a
