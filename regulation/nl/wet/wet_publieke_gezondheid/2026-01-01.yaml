      1 Indien de gemeenteraad een bijdrage heft voor het verrichten van werkzaamheden in het kader van de publieke
      gezondheidszorg, draagt het college van burgemeester en wethouders ervoor zorg dat dit niet ten koste gaat van het
      bereik van deze werkzaamheden.

      2 Geen bijdrage wordt geheven voor de bij of krachtens de [artikelen 5][ref1], [6][ref2] en [6b][ref3] opgedragen
      taken, behoudens in gevallen bij algemene maatregel van bestuur aangewezen.


