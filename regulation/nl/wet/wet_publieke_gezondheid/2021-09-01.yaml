  - number: 68c.1
    text: |-
      Ter uitvoering van de bij of krachtens deze wet opgedragen taken draagt het bestuurscollege er in ieder geval zorg
      voor dat het beschikt over ten minste één geneeskundige die is belast met de infectieziektebestrijding.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68c
  - number: 68c.2
    text: |-
      Bij algemene maatregel van bestuur kunnen eisen worden gesteld met betrekking tot het opleidingsniveau of de
      deskundigheid van de geneeskundige, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68c
  - number: 68e.1
    text: |-
      Ingeval er een gegrond vermoeden bestaat van besmetting van goederen kan de gezaghebber het brengen op het
      grondgebied van het openbaar lichaam van deze goederen verbieden, dan wel verbieden indien niet wordt voldaan aan
      bij beschikking op te leggen voorschriften. De gezaghebber heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68e
  - number: 68e.2
    text: |-
      Indien een lijk is besmet met een infectueus of giftig agens of een infectueuze of giftige stof, of een gegrond
      vermoeden daarvoor bestaat, waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, kan de gezaghebber
      maatregelen treffen om dit gevaar af te wenden. Deze maatregelen bestaan uit het afnemen van bloed of andere
      vloeistoffen, het isoleren of het verbranden van het lijk.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68e
  - number: 68f.1
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Veiligheid en Justitie, een laboratorium aanwijzen voor
      het verrichten van onderzoek ten behoeve van de publieke gezondheid en justitie in de openbare lichamen Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68f
  - number: 68f.2
    text: |-
      De volgende instanties kunnen een beroep doen op de organisatie, bedoeld in het eerste lid: de geneeskundige,
      bedoeld in [artikel 68c, eerste lid][ref1], de inspectie, het RIVM en het openbaar ministerie van Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68c
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68f
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68c
        hoofdstuk: VIIa
  - number: 68f.3
    text: |-
      De aanwijzing wordt ingetrokken, indien de organisatie naar het gezamenlijk oordeel van Onze Minister en de
      Minister van Veiligheid en Justitie niet meer in staat blijkt te zijn het laboratoriumonderzoek naar behoren te
      vervullen dan wel een publiek belang dit vereist.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68f
  - number: 68f.4
    text: |-
      De organisatie, bedoeld in het eerste lid, stelt jaarlijks vóór 1 juli een verslag op van zijn werkzaamheden,
      alsmede de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het afgelopen jaar. Het verslag
      wordt aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68f
  - number: 68f.5
    text: |-
      De werknemers van de organisatie, bedoeld in het eerste lid, zijn verplicht tot geheimhouding van hetgeen hun bij
      het verrichten van hun werkzaamheden bekend is geworden, behoudens voor zover enig wettelijk voorschrift hen tot
      bekendmaking verplicht of uit de uitvoering van de krachtens deze wet opgelegde taak de noodzaak tot bekendmaking
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68f
  - number: 68g
    text: |-
      Bij regeling van Onze Minister kan aan de openbare lichamen Bonaire, Sint Eustatius en Saba een bijzondere
      uitkering worden verstrekt voor de uitvoering van de taken in deze wet, en kunnen regels worden gesteld over:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68g
  - number: 68g.a
    text: de vaststelling van de uitkering;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68g
  - number: 68g.b
    text: de aan de verlening van de uitkering verbonden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68g
  - number: 68g.c
    text: de betaling en de terugvordering van de uitkering.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68g
  - number: 68h.1
    text: |-
      Wat betreft het bij of krachtens deze wet voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba bepaalde zijn de ambtenaren van de inspectie belast met het uitoefenen van de in
      [artikel 36, eerste en tweede lid, van de Gezondheidswet][ref1] genoemde taken. Artikel 36, derde lid, van de
      Gezondheidswet is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68h
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
  - number: 68h.2
    text: |-
      Met de opsporing van de bij of krachtens deze wet in de openbare lichamen Bonaire, Sint Eustatius en Saba strafbare
      gestelde feiten zijn, onverminderd [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de ambtenaren
      van de inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68h
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 68i
    text: |-
      Voor het toepassen van bestuursdwang in de openbare lichamen Bonaire, Sint Eustatius en Saba op grond van deze wet
      zijn de [artikelen 68j][ref1] en [68k][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68j
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel68k
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68i
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68j
        hoofdstuk: VIIa
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 68k
        hoofdstuk: VIIa
  - number: 68j.1
    text: |-
      Bestuursdwang omvat het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of verrichten van
      hetgeen in strijd met de desbetreffende bepalingen van deze wet is of wordt gedaan, gehouden of nagelaten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68j
  - number: 68j.2
    text: |-
      Een beslissing tot het toepassen van bestuursdwang wordt op schrift gesteld en geldt als een beschikking. De
      beschikking vermeldt welk voorschrift is overtreden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68j
  - number: 68j.3
    text: De beschikking wordt bekendgemaakt aan de overtreder en andere belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68j
  - number: 68j.4
    text: |-
      In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventuele andere rechthebbenden de
      tenuitvoerlegging van bestuursdwang kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te
      treffen. Geen termijn behoeft te worden gegund indien de vereiste spoed zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68j
  - number: 68j.5
    text: |-
      Indien de situatie dermate spoedeisend is dat de beslissing tot toepassing van bestuursdwang niet tevoren op
      schrift kan wordt gezet, wordt zo spoedig mogelijk alsnog voor de opschriftstelling en bekendmaking gezorgd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68j
  - number: 68k.1
    text: |-
      De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.2
    text: De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.3
    text: |-
      Indien de kosten echter geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.4
    text: |-
      Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze kosten
      zijn gemaakt na het tijdstip waarop de termijn bedoeld in [artikel 68j, vierde lid][ref1], is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68j
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68j
        hoofdstuk: VIIa
  - number: 68k.5
    text: |-
      De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.6
    text: |-
      Bij dwangbevel kan van de overtreder de verschuldigde kosten, verhoogd met de op de invordering vallende kosten,
      worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.7
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028496
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
    references:
      - id: ref1
        bwb_id: BWBR0028496
  - number: 68k.8
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.9
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van het openbaar lichaam kan het Gerecht in eerste aanleg van
      Bonaire, Sint Eustatius en Saba de schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
  - number: 68k.10
    text: |-
      De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [artikel 284 van het Burgerlijk Wetboek BES][ref1], uit de opbrengst van
      de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0028496#Artikel284
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68k
    references:
      - id: ref1
        bwb_id: BWBR0028496
        artikel: '284'
  - number: 68ka.1
    text: |-
      Op de bevoegdheid tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens de in [artikel 58u][ref1] genoemde bepalingen zijn de [artikelen 5:5 tot en met 5:10][ref2],
      [5:31d tot en met 5:34][ref3], [5:37][ref4] en [5:38 van de Algemene wet bestuursrecht][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58u
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68ka
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58u
        hoofdstuk: Va
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 68ka.2
    text: |-
      De bevoegdheid tot invordering van een verbeurde dwangsom verjaart door verloop van een jaar na de dag waarop zij
      is verbeurd. Op de invordering is [artikel 68k, zesde tot en met tiende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68k
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68ka
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68k
        hoofdstuk: VIIa
  - number: 68kb.1
    text: |-
      Op de bevoegdheid tot het opleggen van een bestuurlijke boete ter handhaving van het bepaalde bij of
      krachtens de in [artikel 58v][ref1] genoemde bepaling zijn de [artikelen 5:5 tot en met 5:10a][ref2] en
      [5:40 tot en met 5:53 van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58v
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68kb
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58v
        hoofdstuk: Va
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 68kb.2
    text: |-
      De op grond van [artikel 58v, eerste lid][ref1], op te leggen bestuurlijke boete bedraagt USD 218.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58v
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68kb
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58v
        hoofdstuk: Va
        paragraaf: '4'
  - number: 68l.1
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die in
      strijd handelt met [artikel 68e, eerste lid][ref1], of die het in artikel 68e, tweede lid, bedoelde lijk onttrekt
      aan een krachtens dat artikel genomen maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68e
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68e
        hoofdstuk: VIIa
  - number: 68l.2
    text: |-
      Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die
      verwijtbaar de geheimhoudingsplicht, bedoeld in [artikel 68f, vijfde lid][ref1], schendt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68f
        hoofdstuk: VIIa
  - number: 68l.3
    text: |-
      Met een gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk de geheimhoudingsplicht, bedoeld in [artikel 68f, vijfde lid][ref1], schendt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68f
        hoofdstuk: VIIa
  - number: 68l.4
    text: |-
      Geen vervolging wordt ingesteld anders dan op verzoek van degene te wiens aanzien de geheimhoudingsplicht, bedoeld
      in [artikel 68f, vijfde lid][ref1], is geschonden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68f
        hoofdstuk: VIIa
  - number: 68l.5
    text: |-
      De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen. Het in het derde lid strafbaar
      gestelde feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel68l
  - number: '74'
    text: |-
      De [Wet collectieve preventie volksgezondheid][ref1], de [Infectieziektenwet][ref2] en de [Quarantainewet][ref3]
      worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0004760
      [ref2]: https://wetten.overheid.nl/BWBR0009684
      [ref3]: https://wetten.overheid.nl/BWBR0002343
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004760
      - id: ref2
        bwb_id: BWBR0009684
      - id: ref3
        bwb_id: BWBR0002343
  - number: '75'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel75
  - number: '76'
    text: 'Deze wet wordt aangehaald als: Wet publieke gezondheid.'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel76
