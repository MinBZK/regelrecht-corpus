  - number: 58b.1
    text: Dit hoofdstuk is van toepassing op de bestrijding van de epidemie, of een directe dreiging daarvan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
  - number: 58b.2
    text: 'De bij of krachtens dit hoofdstuk toegekende bevoegdheden worden slechts toegepast voor zover die toepassing:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
  - number: 58b.2.a
    text: gelet op de ernst van de bedreiging van de volksgezondheid noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
  - number: 58b.2.b
    text: in overeenstemming is met de uitgangspunten van de democratische rechtsstaat; en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
  - number: 58b.2.c
    text: |-
      gelet op het in het eerste lid genoemde doel de uitoefening van grondrechten zo min mogelijk beperkt en aan dat
      doel evenredig is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
  - number: 58b.3
    text: |-
      Dit hoofdstuk is mede van toepassing in de Nederlandse exclusieve economische zone op een mijnbouwinstallatie
      als bedoeld in [artikel 1, onder o, van de Mijnbouwwet][ref1] en een windpark als bedoeld in
      [artikel 1 van de Wet windenergie op zee][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0036752#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58b
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0036752
        artikel: '1'
  - number: 58c.1
    text: |-
      De vaststelling van een krachtens dit hoofdstuk vast te stellen ministeriële regeling geschiedt door Onze
      Ministers, in overeenstemming met Onze Minister die het mede aangaat en in overeenstemming met het gevoelen van
      de ministerraad.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
  - number: 58c.2
    text: |-
      Een krachtens dit hoofdstuk vastgestelde ministeriële regeling wordt binnen twee dagen nadat zij is vastgesteld aan
      beide Kamers der Staten-Generaal overgelegd. Zij treedt niet eerder in werking dan een week na deze overlegging.
      Indien binnen die termijn de Tweede Kamer besluit niet in te stemmen met de regeling, vervalt deze van rechtswege.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
  - number: 58c.3
    text: |-
      In afwijking van het tweede lid kan een krachtens dit hoofdstuk vastgestelde ministeriële regeling onverwijld
      na die vaststelling en de bekendmaking in werking treden, indien sprake is van een zeer dringende omstandigheid
      waarin ter beperking van gevaar direct moet worden gehandeld. Onze Minister zendt de regeling binnen twee dagen
      na vaststelling aan beide Kamers der Staten-Generaal, voorzien van een gemotiveerde mededeling waarin de dringende
      omstandigheid uiteen wordt gezet. De regeling vervalt van rechtswege indien de Tweede Kamer binnen een week na de
      toezending besluit niet in te stemmen met de regeling.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
  - number: 58c.4
    text: |-
      Een besluit als bedoeld in het tweede lid, derde zin, of derde lid, derde zin, kan worden genomen op voorstel van
      een derde van het grondwettelijk aantal leden van de Tweede Kamer.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
  - number: 58c.5
    text: |-
      [Artikel 1 van de Tijdelijke wet COVID-19 Justitie en Veiligheid][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043413#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0043413
        artikel: '1'
  - number: 58c.6
    text: |-
      Indien naar het oordeel van Onze Ministers en Onze Minister die het mede aangaat een krachtens dit hoofdstuk
      vastgestelde ministeriële regeling of een onderdeel daarvan niet langer noodzakelijk is voor het in
      [artikel 58b, eerste lid][ref1], genoemde doel, wordt die regeling daartoe zo spoedig mogelijk gewijzigd of
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58b
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58c
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58b
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58ca
    text: |-
      Indien zich in het openbare lichaam Bonaire, Sint Eustatius of Saba een omstandigheid voordoet waarin
      een krachtens dit hoofdstuk vast te stellen ministeriële regeling niet zodanig tijdig tot stand
      kan komen als ter bestrijding van de epidemie noodzakelijk is, kan Onze Minister ter uitvoering
      van [artikel 7, eerste lid][ref1], de gezaghebber opdragen toepassing te geven aan de hem in
      [artikel 179 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2] toegekende bevoegdheid om algemeen
      verbindende voorschriften vast te stellen ter bestrijding van de epidemie. Binnen twee weken na de vaststelling
      van die opdracht wordt een ministeriële regeling vastgesteld tot regeling van de in die voorschriften genoemde
      onderwerpen. Onze Minister zendt de regeling binnen twee dagen na vaststelling aan beide Kamers van de Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028142#Artikel179
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ca
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028142
        artikel: '179'
  - number: 58d.1
    text: |-
      Indien de uitoefening van die bevoegdheid leidt tot gevolgen van meer dan plaatselijke betekenis, of ernstige vrees
      voor het ontstaan daarvan, kan Onze Minister, al dan niet op aanbeveling van de voorzitter van de veiligheidsregio,
      besluiten dat de voorzitter van de veiligheidsregio in de betrokken gemeente bij uitsluiting bevoegd is toepassing
      te geven aan:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58d
  - number: 58d.1.a
    text: een bij of krachtens dit hoofdstuk aan de burgemeester toegekende bevoegdheid;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58d
  - number: 58d.1.b
    text: |-
      de in [artikel 125, derde lid, van de Gemeentewet][ref1] aan de burgemeester toegekende bevoegdheid, indien het de
      handhaving van bij of krachtens dit hoofdstuk gestelde regels betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel125
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '125'
  - number: 58d.2
    text: |-
      Zodra een omstandigheid als bedoeld in het eerste lid zich niet langer voordoet, trekt Onze Minister zijn besluit
      in.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58d
  - number: 58d.3
    text: |-
      In afwijking van [artikel 39, eerste lid, van de Wet veiligheidsregio’s][ref1] is voor de bestrijding van de
      epidemie, of een directe dreiging daarvan, in plaats van de voorzitter van de veiligheidsregio, de burgemeester
      bevoegd toepassing te geven aan de in die bepaling genoemde artikelen, met uitzondering van de [artikelen 5][ref2]
      en [7 van de Wet veiligheidsregio’s][ref3] en [artikel 176 van de Gemeentewet][ref4]. Het eerste lid, aanhef en
      onder b, en tweede lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0027466#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005416#Artikel176
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58d
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0027466
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0005416
        artikel: '176'
  - number: 58e.1
    text: 'In een krachtens dit hoofdstuk vast te stellen ministeriële regeling kan in ieder geval onderscheid worden gemaakt:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.1.a
    text: binnen en tussen gemeenten en met betrekking tot de openbare lichamen Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.1.b
    text: |-
      tussen personen, op basis van leeftijd of, indien het een krachtens [paragraaf 2][ref1] van dit hoofdstuk of
      [artikel 58q][ref2] vast te stellen ministeriële regeling betreft, op basis van een resultaat;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58e.1.c
    text: tussen activiteiten;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.1.d
    text: tussen openbare, publieke en besloten plaatsen, of gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.2
    text: 'De burgemeester kan met het oog op bijzondere omstandigheden ontheffing verlenen van:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.2.a
    text: |-
      het bepaalde bij of krachtens [artikel 58g, eerste lid][ref1], [58h, eerste lid][ref2], of [58i][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58g
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58h
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58i
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58g
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58h
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58i
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58e.2.b
    text: |-
      de krachtens [artikel 58j, eerste lid, onder a tot en met e][ref1], gestelde regels, indien dat in die regels is
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58j
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58j
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58e.3
    text: |-
      Voordat de burgemeester een beslissing neemt omtrent de verlening van een ontheffing als bedoeld in het tweede lid,
      onder a of b, vraagt hij advies aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.4
    text: |-
      De burgemeester verleent geen ontheffing, indien het belang van de bestrijding van de epidemie zich daartegen naar
      zijn oordeel verzet. Bij de afweging van de betrokken belangen betrekt de burgemeester in ieder geval:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.4.a
    text: |-
      de aard van de plaats, de aard van de activiteit en het aantal personen waarop de te verlenen ontheffing betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58e.4.b
    text: |-
      de gevolgen die verlening van de ontheffing zou hebben voor de naleving van het bepaalde in
      [artikel 58f, eerste lid][ref1], of van de krachtens artikel 58f, vierde of vijfde lid, vastgestelde regels, in en
      buiten de plaats waarop de te verlenen ontheffing betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58e.5
    text: |-
      In een krachtens dit hoofdstuk vast te stellen ministeriële regeling kan aan de burgemeester de bevoegdheid
      worden toegekend om de plaatsen aan te wijzen waar de in die regeling gestelde regels van toepassing zijn. Aan de
      uitoefening van de bevoegdheid kunnen in die ministeriële regeling voorwaarden en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58e
  - number: 58ea.1
    text: |-
      Bij ministeriële regeling worden regels gesteld ter zake van de aanwijzing van gebieden door Onze Minister, bedoeld
      in de [artikelen 58nb][ref1], [58nh][ref2], [58p][ref3] en [58pa][ref4], waarbij onderscheid kan worden gemaakt
      tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nh
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58pa
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nh
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58pa
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58ea.1.a
    text: |-
      hoogrisicogebieden, zijnde gebieden ter zake waarvan uitsluitend de verplichting van [artikel 58p][ref1] of
      [58pa][ref2] geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58pa
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58pa
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58ea.1.b
    text: |-
      zeer hoogrisicogebieden en uitzonderlijk hoogrisicogebieden, zijnde gebieden ter zake waarvan zowel de verplichting
      van [artikel 58p][ref1] of [58pa][ref2] als de verplichting van [artikel 58nb][ref3] of [58nh][ref4] geldt, maar
      ten aanzien waarvan onderscheid kan worden gemaakt bij de categorieën van personen die van deze verplichtingen
      kunnen worden uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58pa
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58nh
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58pa
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58nh
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ea.2
    text: 'De regels, bedoeld in het eerste lid, behelzen in ieder geval de volgende indicatoren:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
  - number: 58ea.2.a
    text: de incidentie van het virus SARS-CoV-2 in een gebied;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
  - number: 58ea.2.b
    text: de incidentie van zorgwekkende varianten van het virus SARS-CoV-2 in een gebied;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
  - number: 58ea.2.c
    text: het ontbreken van gegevens over de epidemiologische situatie rond het virus SARS-CoV-2 in een gebied.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ea
  - number: 58f.1
    text: Degene die zich buiten een woning ophoudt, houdt een veilige afstand tot andere personen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.2
    text: |-
      De veilige afstand wordt vastgesteld bij algemene maatregel van bestuur, gehoord het RIVM. De voordracht voor de
      algemene maatregel van bestuur wordt niet eerder gedaan dan een week nadat het ontwerp aan beide Kamers van de
      Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.3
    text: 'De veilige afstand geldt niet:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.3.a
    text: tussen personen die op hetzelfde adres woonachtig zijn;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.3.b
    text: |-
      voor een opsporingsambtenaar, toezichthouder, beveiligingsmedewerker, zorgverlener, mantelzorger of geestelijke
      bedienaar of persoon die werkzaam is bij een justitiële inrichting, bij de politie, de brandweer, de krijgsmacht
      of in de kinderopvang of die eerste hulp biedt bij een het leven of de gezondheid bedreigende situatie, voor zover
      deze zijn taak niet op gepaste wijze kan uitoefenen met inachtneming van de veilige afstand;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.3.c
    text: voor degene jegens wie een onder b genoemde persoon zijn taak uitoefent;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.3.d
    text: |-
      tussen een persoon met een handicap of persoon tot en met de leeftijd van twaalf jaar en diens begeleider, voor
      zover die persoon zich niet met inachtneming van de veilige afstand jegens zijn begeleider buiten een woning kan
      ophouden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.4
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het eerste lid onder de in die regeling bepaalde omstandigheden
      niet van toepassing is, indien in die omstandigheden door het treffen van hygiënemaatregelen, het gebruik
      van persoonlijke beschermingsmiddelen of op andere wijze, een beschermingsniveau wordt bereikt dat ten minste
      gelijkwaardig is aan het beschermingsniveau dat bereikt wordt door het houden van de veilige afstand.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.5
    text: |-
      Bij ministeriële regeling kan vrijstelling worden verleend van het eerste lid. Aan een vrijstelling kunnen
      voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
  - number: 58f.6
    text: |-
      Indien naar het oordeel van Onze Ministers gelet op het in [artikel 58b, eerste lid][ref1], genoemde doel de
      veilige afstand kan worden verkleind of op nihil kan worden gesteld, wordt zo spoedig mogelijk een voordracht
      gedaan voor een daartoe vast te stellen algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58b
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58f
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58b
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58g.1
    text: |-
      Bij ministeriële regeling kunnen plaatsen, niet zijnde woningen, worden aangewezen, waar het niet is toegestaan
      zich in groepsverband op te houden met meer dan een bij die regeling vast te stellen aantal personen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2.a
    text: |-
      de personen, bedoeld in [artikel 58f, derde lid, onder a en d][ref1], voor zover zij zich onderling ophouden;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58g.2.b
    text: |-
      een persoon als bedoeld in [artikel 58f, derde lid, onder b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58g.2.c
    text: een persoon die in gemeenschap met anderen zijn godsdienst of levensovertuiging belijdt;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2.d
    text: |-
      een vergadering of betoging als bedoeld in de [Wet openbare manifestaties][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004318
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0004318
  - number: 58g.2.e
    text: |-
      een verkiezing als bedoeld in de [Kieswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 58g.2.f
    text: een vergadering van de Staten-Generaal of van een commissie daaruit;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2.g
    text: |-
      een vergadering van de gemeenteraad, provinciale staten en het algemeen bestuur van een waterschap, of van een door
      deze organen ingestelde commissie;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2.h
    text: |-
      een bijeenkomst van een internationale organisatie, die gevestigd is op het grondgebied van het Koninkrijk, of van
      een verdragspartij van een verdrag waarbij het Koninkrijk partij is;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58g.2.i
    text: |-
      een bijeenkomst die plaatsvindt onder verantwoordelijkheid van een rechter of een officier van justitie in de
      uitoefening van zijn ambt of die dient ter behandeling van een bezwaar of administratief beroep.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58g
  - number: 58h.1
    text: |-
      Bij ministeriële regeling kunnen publieke plaatsen worden aangewezen die niet of slechts onder in die regeling
      gestelde voorwaarden voor publiek mogen worden opengesteld. Tot de voorwaarden kan behoren dat ten hoogste een bij
      die regeling vast te stellen aantal personen als publiek aanwezig mag zijn.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58h.2
    text: 'De volgende plaatsen worden niet aangewezen als publieke plaatsen die niet voor publiek mogen worden opengesteld:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58h.2.a
    text: een stemlokaal;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58h.2.b
    text: een plaats die is bestemd voor een vergadering van de Staten-Generaal of van een commissie daaruit;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58h.2.c
    text: |-
      een plaats die is bestemd voor een vergadering van de gemeenteraad, provinciale staten en het algemeen bestuur van
      een waterschap, of van een door deze organen ingestelde commissie;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58h.2.d
    text: een gerechtsgebouw.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58h
  - number: 58i
    text: |-
      Bij ministeriële regeling kunnen evenementen worden aangewezen die niet of slechts onder voorwaarden mogen worden
      georganiseerd. Tot de voorwaarden kan behoren dat ten hoogste een bij die regeling vast te stellen aantal personen
      aan het evenement mag deelnemen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58i
  - number: 58j.1
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
  - number: 58j.1.a
    text: |-
      hygiënemaatregelen en persoonlijke beschermingsmiddelen, met inbegrip van de verplichting tot toepassing of gebruik
      hiervan. De regels hebben geen betrekking op de toepassing of het gebruik in een woning;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
  - number: 58j.1.b
    text: |-
      de uitoefening van beroepen waarbij het niet mogelijk is ten minste de veilige afstand te houden tot een klant of
      patiënt, met inbegrip van een verbod tot uitoefening daarvan;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
  - number: 58j.1.c
    text: |-
      het gebruik van voorzieningen die voor het publiek toegankelijk zijn, met inbegrip van een verbod tot het gebruik
      daarvan;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
  - number: 58j.1.d
    text: |-
      de bezettingsgraad van de plaatsen waar tegen betaling verblijf wordt aangeboden aan personen die niet als
      ingezetene zijn ingeschreven in de basisregistratie personen met een adres in de gemeente waar dit verblijf wordt
      aangeboden;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
  - number: 58j.1.e
    text: |-
      het gebruik of voor consumptie gereed hebben van alcoholhoudende drank als bedoeld in
      [artikel 1, eerste lid, van de Alcoholwet][ref1] op openbare plaatsen, met inbegrip van een verbod daarop,
      onverminderd het bepaalde bij of krachtens de [Alcoholwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002458
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002458
  - number: 58j.2
    text: |-
      [Artikel 1, eerste lid, van de Wet gedeeltelijk verbod gezichtsbedekkende kleding][ref1] vindt geen toepassing
      voor zover de bij dat artikellid verboden gezichtsbedekking geheel of gedeeltelijk het gevolg is van het dragen van
      persoonlijke beschermingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0041161#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58j
    references:
      - id: ref1
        bwb_id: BWBR0041161
        artikel: '1'
  - number: 58k.1
    text: |-
      Degene die bevoegd is tot het aan een publieke plaats treffen van voorzieningen of tot het openstellen van een
      publieke plaats voor publiek, draagt ten aanzien van die publieke plaats zorg voor zodanige voorzieningen of
      openstelling dat de daar aanwezige personen de bij of krachtens de [artikelen 58f tot en met 58j][ref1] gestelde
      regels in acht kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58k
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58k.2
    text: |-
      Indien de burgemeester van oordeel is dat de daar aanwezige personen het bepaalde bij of krachtens de
      [artikelen 58f tot en met 58j][ref1] niet in acht kunnen nemen, kan hij een schriftelijke aanwijzing geven aan
      degene die bevoegd is tot het aan die plaats treffen van voorzieningen of tot het openstellen van die plaats voor
      publiek.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58k
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58k.3
    text: |-
      In de aanwijzing geeft de burgemeester met redenen omkleed aan op welke punten de aanwezige personen de bij of
      krachtens de [artikelen 58f tot en met 58j][ref1] gestelde regels niet in acht kunnen nemen, alsmede de in verband
      daarmee te nemen maatregelen. Een aanwijzing bevat de termijn waarbinnen degene die bevoegd is tot het aan die
      plaats treffen van voorzieningen of tot het openstellen van die plaats voor publiek, de maatregelen treft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58k
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58k.4
    text: |-
      In een spoedeisende situatie kan de burgemeester een bevel geven. Indien het bevel mondeling wordt gegeven, wordt
      het zo spoedig mogelijk op schrift gesteld en bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58k
  - number: 58l.1
    text: |-
      Degene die bevoegd is tot het aan een besloten plaats, niet zijnde een woning, treffen van voorzieningen
      of tot het toelaten tot een besloten plaats van personen, draagt ten aanzien van die besloten plaats
      zorg voor zodanige voorzieningen of toelating dat de daar aanwezige personen de bij of krachtens de
      [artikelen 58f tot en met 58j][ref1] gestelde regels in acht kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58l.2
    text: |-
      Indien de besloten plaats een ruimte betreft waar een beroep of bedrijf wordt uitgeoefend en Onze Minister van
      oordeel is dat de daar aanwezige personen het bepaalde bij of krachtens de [artikelen 58f tot en met 58j][ref1]
      niet in acht kunnen nemen, kan hij een schriftelijke aanwijzing geven aan degene die bevoegd is tot het aan die
      plaats treffen van voorzieningen of tot het toelaten tot die plaats van personen. Indien de besloten plaats een
      ruimte betreft waar geen beroep of bedrijf wordt uitgeoefend, is de burgemeester bevoegd deze aanwijzing te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58l.3
    text: |-
      In de aanwijzing geeft Onze Minister onderscheidenlijk de burgemeester met redenen omkleed aan op welke punten de
      aanwezige personen de bij of krachtens de [artikelen 58f tot en met 58j][ref1] gestelde regels niet in acht kunnen
      nemen, alsmede de in verband daarmee te nemen maatregelen. Een aanwijzing bevat de termijn waarbinnen degene die
      bevoegd is tot het aan die plaats treffen van voorzieningen of tot het toelaten tot die plaats van personen, de
      maatregelen treft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58l
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58l.4
    text: |-
      In een spoedeisende situatie kan Onze Minister onderscheidenlijk de burgemeester een bevel geven. Indien het bevel
      mondeling wordt gegeven, wordt het zo spoedig mogelijk op schrift gesteld en bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58l
  - number: 58l.5
    text: |-
      Het tweede tot en met vierde lid zijn niet van toepassing op bij ministeriële regeling aangewezen plaatsen onder in
      die regeling gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58l
  - number: 58m
    text: |-
      Indien de burgemeester van oordeel is dat de omstandigheden op een openbare plaats zodanig zijn dat de daar
      aanwezige personen het bepaalde bij of krachtens de [artikelen 58f tot en met 58j][ref1] niet in acht kunnen nemen,
      of bij ernstige vrees voor het ontstaan daarvan, kan hij de bevelen geven die nodig zijn om de naleving van deze
      artikelen op een openbare plaats te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58m
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58n
    text: |-
      Indien door een gedraging of activiteit in of vanuit een besloten plaats, niet zijnde een woning, een ernstige
      vrees voor de onmiddellijke verspreiding van het virus SARS-CoV-2 ontstaat, kan de burgemeester de bevelen geven
      die nodig zijn voor de beëindiging van de gedraging of activiteit en de daar aanwezige personen bevelen zich
      onmiddellijk te verwijderen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58n
  - number: 58nb.1
    text: |-
      Degene die het Europese deel van Nederland inreist en voor inreis heeft verbleven in een door Onze Minister
      aangewezen gebied in het buitenland of, indien door Onze Minister aangewezen, in Bonaire, Sint Eustatius of
      Saba, gaat onverwijld na inreis gedurende een ononderbroken periode van een bij ministeriële regeling te bepalen
      aantal dagen in thuisquarantaine op zijn woonadres of het krachtens [artikel 58ne][ref1] opgegeven adres van een
      verblijfplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nb.2
    text: Het bij ministeriële regeling te bepalen aantal dagen van de thuisquarantaine bedraagt ten hoogste 14 dagen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.3
    text: |-
      In afwijking van het eerste lid, eindigt de periode van thuisquarantaine op het moment dat de betrokkene beschikt
      over een testuitslag waaruit blijkt dat hij zich na het verstrijken van een bij ministeriële regeling te bepalen
      aantal dagen na het moment van inreis heeft laten testen en op het moment van testen niet was geïnfecteerd met
      het virus SARS-CoV-2. De betrokkene bewaart de testuitslag gedurende het resterende aantal dagen van de periode,
      bedoeld in het eerste lid, en toont deze op verzoek aan een toezichthouder.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.4
    text: |-
      Gedurende de periode van thuisquarantaine is de betrokkene in het kader van de op hem
      rustende verplichting tot het verlenen van medewerking aan een toezichthouder, bedoeld in
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], gehouden om bereikbaar te zijn voor een
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 58nb.5
    text: |-
      De verplichting van het eerste lid is niet of niet langer van toepassing ingeval van en voor de duur van een
      noodsituatie als gevolg waarvan de betrokkene genoodzaakt is zich aan thuisquarantaine te onttrekken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.6
    text: |-
      De verplichting van het eerste lid mag uitsluitend worden onderbroken ten behoeve van en voor de duur van het laten
      testen op infectie met het virus SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.7
    text: |-
      Bij ministeriële regeling worden nadere eisen gesteld aan de test, bedoeld in het derde lid, die in elk geval
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.7.a
    text: de vaststelling van de identiteit van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.7.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.7.c
    text: de wijze waarop de testuitslag wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.8
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
  - number: 58nb.9
    text: |-
      Dit artikel laat de toepassing van [artikel 35][ref1] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nb
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: 58nc.1
    text: |-
      De verplichting, bedoeld in [artikel 58nb, eerste lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nc.1.a
    text: |-
      personen die na inreis korter dan een bij ministeriële regeling te bepalen aantal uren in Nederland zullen
      verblijven;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.b
    text: |-
      personen die korter dan een bij ministeriële regeling te bepalen aantal uren in een krachtens
      [artikel 58nb, eerste lid][ref1], aangewezen gebied hebben verbleven of ingeval van een overschrijding van dat
      aantal uren uitsluitend op doorreis waren en in dat verband noodzakelijke tussenstops hebben gemaakt waarbij het
      vervoermiddel slechts kort is verlaten of een overstap hebben gemaakt waarbij de overstapplaats niet is verlaten;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nc.1.c
    text: |-
      personen komend vanuit een krachtens [artikel 58nb, eerste lid][ref1], aangewezen gebied die voorafgaand aan
      de inreis ten minste een bij ministeriële regeling te bepalen aantal dagen aaneengesloten in een niet krachtens
      artikel 58nb, eerste lid, aangewezen gebied hebben verbleven;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nc.1.d
    text: personen tot en met 12 jaar;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.e
    text: personen die reizen in verband met co-ouderschap ten aanzien van een eigen kind;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.f
    text: |-
      personen die reizen in verband met het verlenen van noodzakelijke mantelzorg ten behoeve waarvan zij ten minste
      eenmaal per week de grens moeten passeren;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.g
    text: |-
      personen die inreizen in verband met een bevalling en waarvan aannemelijk is dat deze na de geboorte van het kind
      ingevolge de [artikelen 198, eerste lid][ref1], en [199 van Boek 1 van het Burgerlijk Wetboek][ref2] als ouder in
      familierechtelijke betrekking tot het kind komen te staan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '199'
  - number: 58nc.1.h
    text: |-
      personen die inreizen in verband met het bezoeken van een familielid of naaste van wie de behandelend arts verwacht
      dat deze op korte termijn zal overlijden;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.i
    text: personen die inreizen in verband met het bijwonen van een uitvaart;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.j
    text: personen die inreizen in verband met een noodzakelijke medische behandeling;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.k
    text: |-
      grenswerkers, grensstudenten en grensscholieren die reizen in verband met hun werkzaamheden of het volgen van
      onderwijs en die hiervoor ten minste eenmaal per week de grens moeten passeren;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.l
    text: |-
      personen werkzaam in het transport van goederen en ander transportpersoneel, voor zover noodzakelijk en op het
      moment dat zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.m
    text: |-
      personen die werkzaam zijn in het personenvervoer als zij in de uitoefening van hun functie reizen of als zij van
      of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.n
    text: |-
      zeevarenden op andere schepen dan commerciële jachten en pleziervaartuigen in het bezit van een monsterboekje als
      zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.o
    text: |-
      personen die reizen in verband met het verrichten van urgente, incidentele werkzaamheden in een cruciale sector,
      waarvoor specialistische kennis of expertise is vereist;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.p
    text: |-
      personen die een medisch beroep uitoefenen als zij in de uitoefening van hun functie reizen of als zij van of naar
      hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.q
    text: |-
      personen die noodzakelijke werkzaamheden verrichten ter bestrijding van de epidemie van het virus SARS-CoV-2 als
      zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.r
    text: |-
      journalisten die noodzakelijke beroepsmatige werkzaamheden verrichten, waarbij werken op afstand niet mogelijk is,
      als zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.s
    text: |-
      houders van een door het Ministerie van Buitenlandse Zaken verstrekte diplomatieke identiteitskaart of een door een
      ambassade, consulaat of het Ministerie van Buitenlandse Zaken verstrekte Note Verbale;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.t
    text: houders van diplomatieke paspoorten;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.u
    text: staatshoofden en leden van een buitenlandse regering;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.v
    text: |-
      ambtenaren, leden van een regering of andere personen die zijn uitgenodigd door de Nederlandse overheid, als zij in
      de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.w
    text: |-
      personen die werkzaam zijn bij een internationale of humanitaire organisatie als zij in de uitoefening van hun
      functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.x
    text: |-
      personen die werkzaamheden verrichten gerelateerd aan de gereedstelling of daadwerkelijke inzet van personeel
      ingedeeld bij Defensie, personeel ingedeeld bij Defensie dat een noodzakelijke korte opleiding moet volgen of
      experts noodzakelijk voor het functioneren van de krijgsmacht, als zij in de uitoefening van hun functie reizen of
      als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.y
    text: personen die inreizen omdat zij aanwezig moeten zijn bij een strafproces;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.1.z
    text: |-
      functionarissen die reizen in verband met het uitvoeren van taken in opdracht van Onze Minister van Justitie en
      Veiligheid alsmede de personen die door deze functionarissen worden begeleid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
  - number: 58nc.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de verplichting, bedoeld in [artikel 58nb, eerste lid][ref1],
      voorts niet van toepassing is op personen die voor inreis hebben verbleven in een door Onze Minister aangewezen
      zeer hoogrisicogebied als bedoeld in [artikel 58ea, eerste lid, aanhef en onderdeel b][ref2], indien zij middels
      een bewijs van vaccinatie tegen covid-19 dat voldoet aan bij ministeriële regeling te stellen voorwaarden kunnen
      aantonen dat zij op het moment van inreizen gevaccineerd waren volgens bij die regeling te bepalen minimumeisen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58ea
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58ea
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58nc.3
    text: |-
      Bij ministeriële regeling kunnen categorieën van personen worden aangewezen op wie de verplichting, bedoeld in
      [artikel 58nb, eerste lid][ref1], eveneens niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nc.4
    text: |-
      Bij ministeriële regeling kan voorts worden bepaald dat de burgemeester met het oog op bijzondere omstandigheden in
      een individueel geval ontheffing kan verlenen van het bepaalde bij of krachtens [artikel 58nb, eerste lid][ref1],
      en [artikel 58ne][ref2]. Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden.
      [Artikel 58e, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58e
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58e
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58nd.1
    text: |-
      De in [artikel 58nb, eerste lid][ref1], bedoelde persoon kan de burgerlijke rechter schriftelijk verzoeken om
      opheffing van de ten aanzien van hem geldende verplichting om in thuisquarantaine te gaan op de grond dat deze
      verplichting niet op hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nd.2
    text: |-
      Het verzoekschrift wordt ingediend bij de voorzieningenrechter van de rechtbank binnen wiens rechtsgebied de
      woon- of verblijfplaats, bedoeld in [artikel 58nb, eerste lid][ref1], van de indiener van het verzoekschrift is
      gelegen. Voor de behandeling van het verzoekschrift wordt geen griffierecht geheven. [Artikel 46][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel46
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '46'
        hoofdstuk: V
        paragraaf: '4'
  - number: 58nd.3
    text: |-
      In aanvulling op [artikel 278, eerste lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] bevat het
      verzoekschrift het e-mailadres en telefoonnummer waarop de verzoeker bereikbaar is en eventuele bewijsstukken die
      het verzoek ondersteunen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel278
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nd
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '278'
  - number: 58nd.4
    text: |-
      Voordat op het verzoekschrift wordt beslist, hoort de rechter de indiener van het verzoekschrift door middel van
      een tweezijdig elektronisch communicatiemiddel, tenzij de indiener niet beschikbaar was op het door de rechter
      vastgestelde tijdstip waarop het horen plaatsvindt. [Artikel 41, derde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel41
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '41'
        hoofdstuk: V
        paragraaf: '4'
  - number: 58nd.5
    text: |-
      De rechter beslist zo spoedig mogelijk op het verzoek, doch uiterlijk binnen drie dagen te rekenen vanaf de dag na
      die van het indienen van het verzoekschrift. Tegen de beslissing van de rechter staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nd
  - number: 58ne
    text: |-
      Bij ministeriële regeling kan worden bepaald dat op de in [artikel 58nb, eerste lid][ref1], bedoelde persoon een
      verplichting rust om:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ne
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ne.a
    text: |-
      een papieren of digitale verklaring naar waarheid in te vullen, waarin hij verklaart dat hij na inreis onverwijld
      in thuisquarantaine zal gaan op zijn woonadres of het opgegeven adres van een verblijfplaats, dan wel behoort tot
      een van de categorieën van personen, bedoeld in [artikel 58nc][ref1], en om daarbij de in die regeling te bepalen
      gegevens aan Onze Minister te verstrekken;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ne
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ne.b
    text: |-
      bij inreis te beschikken over een papieren verklaring of een bevestiging van een digitaal ingevulde verklaring als
      bedoeld in onderdeel a, zo nodig vergezeld van het in die regeling voorgeschreven document indien het gaat om een
      persoon die verklaart dat hij behoort tot een van de categorieën van personen, bedoeld in [artikel 58nc][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ne
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ne.c
    text: de verklaring of bevestiging en het eventuele voorgeschreven document op verzoek te tonen aan een toezichthouder;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ne
  - number: 58ne.d
    text: |-
      de verklaring of bevestiging en het eventuele voorgeschreven document te bewaren tot een bij ministeriële regeling
      te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ne
  - number: 58nf.1
    text: |-
      In het kader van de taak van Onze Minister, bedoeld in [artikel 7, eerste lid][ref1], en ter monitoring van de
      naleving van de verplichting van [artikel 58nb, eerste lid][ref2], is Onze Minister bevoegd tot verwerking van
      de krachtens de [artikelen 58ne][ref3] of [58ng][ref4] verstrekte gegevens van een in artikel 58nb, eerste lid,
      bedoelde persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58ng
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58ng
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nf.2
    text: |-
      Indien Onze Minister op grond van bevindingen in het kader van de monitoring nader onderzoek
      door een toezichthouder naar de naleving van de verplichting tot thuisquarantaine door een in
      [artikel 58nb, eerste lid][ref1], bedoelde persoon wenselijk acht, of een in artikel 58nb, eerste lid, bedoelde
      persoon telefonisch niet heeft kunnen bereiken, kan Onze Minister een melding doen aan de burgemeester van de
      gemeente waar de woon- of verblijfplaats van die persoon is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nf.3
    text: |-
      Onze Minister, de burgemeester en de bij of krachtens deze wet aangewezen toezichthouders zijn bevoegd tot
      het verwerken en onderling uitwisselen van een melding als bedoeld in het tweede lid, en de krachtens de
      [artikelen 58ne][ref1] of [58ng][ref2] verstrekte gegevens van een in [artikel 58nb, eerste lid][ref3], bedoelde
      persoon, voor zover dit noodzakelijk is voor het toezicht op en de handhaving van de naleving van artikel 58nb,
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58ng
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58ng
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nf.4
    text: |-
      De krachtens de [artikelen 58ne][ref1] of [58ng][ref2] verstrekte gegevens worden door Onze Minister niet langer
      bewaard dan de krachtens [artikel 58nb, eerste lid][ref3], bij ministeriële regeling bepaalde duur van de
      thuisquarantaine.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58ng
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58ng
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ng.1
    text: |-
      Met het oog op het toezicht op en de handhaving van de naleving van [artikel 58nb, eerste lid][ref1], kan bij
      ministeriële regeling worden bepaald dat:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ng.1.a
    text: |-
      op de in [artikel 58nb, eerste lid][ref1], bedoelde persoon die bij inreis in Nederland gebruik maakt
      van bedrijfsmatig personenvervoer als bedoeld in [artikel 58p][ref2], een verplichting rust om een in
      [artikel 58ne][ref3] bedoelde papieren verklaring op verzoek te verstrekken aan de aanbieder van personenvervoer
      of een toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ng.1.b
    text: |-
      op de in onderdeel a bedoelde aanbieder van bedrijfsmatig personenvervoer een verplichting rust om een aan hem
      krachtens onderdeel a verstrekte verklaring in te nemen en deze verklaring te verstrekken aan de voorzitter van de
      veiligheidsregio of een toezichthouder;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
  - number: 58ng.1.c
    text: |-
      op de voorzitter van de veiligheidsregio een verplichting rust om een aan hem krachtens onderdeel b verstrekte
      verklaring op diens verzoek aan Onze Minister te verstrekken of te vernietigen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
  - number: 58ng.1.d
    text: |-
      op een toezichthouder een verplichting rust om een aan hem krachtens onderdeel a of b verstrekte verklaring op
      diens verzoek aan Onze Minister te verstrekken of de verklaring te vernietigen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
  - number: 58ng.1.e
    text: |-
      op de aanbieder van bedrijfsmatig personenvervoer als bedoeld in [artikel 58p][ref1] waarvan een in
      [artikel 58nb, eerste lid][ref2], bedoelde persoon bij inreis in Nederland gebruik maakt, een verplichting rust
      om de bij de aanbieder beschikbare persoonsidentificerende gegevens en het telefoonnummer van die persoon op diens
      verzoek te verstrekken aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ng.2
    text: |-
      De aanbieder van personenvervoer, de voorzitter van de veiligheidsregio en de toezichthouder zijn bevoegd tot het
      verwerken van de krachtens het eerste lid aan hen verstrekte verklaringen, voor zover dit noodzakelijk is om te
      voldoen aan de op hen krachtens dat lid rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ng
  - number: 58nh.1
    text: |-
      Bij ministeriële regeling kan, na overleg met de gezaghebber, worden bepaald dat op degene die reist tussen
      Bonaire, Sint Eustatius of Saba of die een van deze eilanden inreist en voor inreis heeft verbleven in het
      Europese deel van Nederland of in een door Onze Minister, na overleg met de gezaghebber, aangewezen gebied in het
      buitenland, de verplichting, bedoeld in [artikel 58nb, eerste lid][ref1], rust.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nh
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nh.2
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, zijn de [artikelen 58nb tot en met 58ng][ref1] van
      overeenkomstige toepassing, tenzij bij ministeriële regeling anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nh
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58nh.3
    text: |-
      In de regeling, bedoeld in het eerste lid, kan worden bepaald dat de gezaghebber met het oog op bijzondere
      omstandigheden in een individueel geval ontheffing kan verlenen van het bepaalde bij of krachtens het eerste lid.
      Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden. [Artikel 58e, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58e
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58nh
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58e
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58o.1
    text: |-
      Een zorgaanbieder draagt zorg voor een zodanige openstelling, inrichting en zorg, jeugdhulp of maatschappelijke
      ondersteuning dat de aanwezige personen die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning betrokken
      zijn of die geen mantelzorger zijn, de bij of krachtens de [artikelen 58f tot en met 58j][ref1] gestelde regels
      redelijkerwijs in acht kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58o.2
    text: |-
      Een zorgaanbieder kan, indien dit noodzakelijk is om verspreiding van het virus SARS-CoV-2 naar dan wel vanuit een
      zorglocatie te voorkomen en de maatregelen die de zorgaanbieder treft op grond van het eerste lid onvoldoende zijn
      om die verspreiding te voorkomen, beperkingen of andere voorwaarden stellen aan de toegang van personen tot een
      zorglocatie door iemand die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning betrokken is of die geen
      mantelzorger is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.3
    text: |-
      Indien Onze Minister van oordeel is dat personen die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning
      betrokken zijn of die geen mantelzorger zijn, de in het eerste lid genoemde regels onvoldoende in acht kunnen
      nemen, kan hij de zorgaanbieder een schriftelijke aanwijzing geven. In de aanwijzing geeft Onze Minister met
      redenen omkleed aan op welke punten de aanwezige personen de regels niet in acht kunnen nemen, alsmede de in
      verband daarmee te nemen maatregelen. Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder de maatregelen
      treft. In een spoedeisende situatie kan Onze Minister een bevel geven. Indien het bevel mondeling wordt gegeven,
      wordt het zo spoedig mogelijk op schrift gesteld en bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.4
    text: |-
      Indien de maatregelen die een zorgaanbieder neemt op grond van het eerste en tweede lid, onvoldoende of onevenredig
      zijn om verspreiding van het virus SARS-CoV-2 naar dan wel vanuit een zorglocatie te voorkomen, kunnen bij
      ministeriële regeling beperkingen of andere voorwaarden worden gesteld aan het door de zorgaanbieder toelaten tot
      zorglocaties van personen die niet bij de zorg, jeugdhulp of maatschappelijke ondersteuning betrokken zijn of die
      geen mantelzorger zijn, tenzij het belang van de volksgezondheid niet opweegt tegen de belangen van de cliënten
      en patiënten bij die toegang. In de ministeriële regeling kan onderscheid worden gemaakt tussen zorglocaties of
      categorieën daarvan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.5
    text: 'Beperkingen of andere voorwaarden als bedoeld in het tweede en vierde lid hebben geen betrekking op:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.5.a
    text: |-
      belemmeringen voor de toegang van tenminste één familielid of naaste tot een in de zorglocatie verblijvende
      persoon, behoudens in geval van uitzonderlijke omstandigheden;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.5.b
    text: |-
      toegang van familieleden of naasten tot een in de zorglocatie verblijvende persoon van wie de behandelend arts
      verwacht dat deze op korte termijn zal overlijden;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
  - number: 58o.5.c
    text: |-
      toegang in verband met het horen van een cliënt als bedoeld in
      [artikel 38, eerste lid, van de Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1]
      of het horen van betrokkene als bedoeld in de [artikelen 6:1, derde lid][ref2], en
      [7:1, derde lid, van de Wet verplichte geestelijke gezondheidszorg][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0040632#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0040635#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0040635#Artikel7
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0040632
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0040635
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0040635
        artikel: '7'
  - number: 58o.5.d
    text: |-
      toegang van advocaten en cliëntenvertrouwenspersonen als bedoeld in de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1], en advocaten en
      patiëntenvertrouwenspersonen als bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0040632
      - id: ref2
        bwb_id: BWBR0040635
  - number: 58o.6
    text: |-
      De [artikelen 58l][ref1] en [58n][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58n
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58o
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58l
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58n
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58p.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het aanbieden van bepaalde categorieën van bedrijfsmatig
      personenvervoer geheel of gedeeltelijk verboden is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het aanbieden van, de toegang tot en het gebruik
      van voorzieningen voor bedrijfsmatig personenvervoer binnen Nederland of met een bestemming in Nederland.
      Hierbij kan onderscheid worden gemaakt tussen categorieën van bedrijfsmatig personenvervoer, gebieden van
      waaruit de reiziger vertrekt en categorieën van personen voor wie de regels gelden en kan worden afgeweken van
      [artikel 58f, derde lid, aanhef en onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58p.3
    text: 'Tot de in het tweede lid bedoelde regels kunnen behoren:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.3.a
    text: |-
      een verplichting voor de aanbieder van bedrijfsmatig personenvervoer ervoor zorg te dragen dat aan een reiziger die
      vertrekt vanuit een door Onze Minister aangewezen gebied in het buitenland of reist tussen het Europese deel van
      Nederland, Bonaire, Sint Eustatius of Saba, uitsluitend vervoer wordt aangeboden, toegang daartoe wordt verschaft
      en gebruik daarvan wordt toegestaan, indien de reiziger een testuitslag waaruit blijkt dat hij op het moment van
      testen niet was geïnfecteerd met het virus SARS-CoV-2 of een verklaring als bedoeld in [artikel 58ne][ref1],
      eventueel vergezeld van het voorgeschreven document als bedoeld in dat artikel, kan tonen aan de aanbieder van
      bedrijfsmatig personenvervoer en een toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ne
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ne
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58p.3.b
    text: |-
      een verplichting voor de reiziger die vertrekt vanuit een door Onze Minister aangewezen gebied in het buitenland
      of reist tussen het Europese deel van Nederland, Bonaire, Sint Eustatius of Saba om bij de toegang tot het
      vervoermiddel en tijdens het vervoer te beschikken over een testuitslag waaruit blijkt dat hij op het moment van
      testen niet was geïnfecteerd met het virus SARS-CoV-2, een verplichting voor de reiziger deze op verzoek te tonen
      aan de aanbieder van bedrijfsmatig personenvervoer en een toezichthouder en om de testuitslag te bewaren tot een
      bij ministeriële regeling te bepalen tijdstip;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.3.c
    text: |-
      Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba, een verplichting voor de reiziger die vertrekt vanuit
      een door Onze Minister aangewezen gebied in het buitenland of reist tussen het Europese deel van Nederland,
      Bonaire, Sint Eustatius of Saba om direct na aankomst te beschikken over een testuitslag waaruit blijkt dat hij op
      het moment van testen niet was geïnfecteerd met het virus SARS-CoV-2, en een verplichting voor de reiziger deze op
      verzoek te tonen aan een toezichthouder.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.3a
    text: |-
      In een regeling als bedoeld in het derde lid kan worden bepaald dat de in dat lid bedoelde verplichtingen niet van
      toepassing zijn op personen die voor inreis hebben verbleven in een door Onze Minister aangewezen hoogrisicogebied
      of zeer hoogrisicogebied, en die middels een bewijs van vaccinatie tegen covid-19 dat voldoet aan bij ministeriële
      regeling te stellen voorwaarden kunnen aantonen dat zij op het moment van inreizen gevaccineerd waren volgens bij
      die regeling te bepalen minimumeisen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.4
    text: |-
      In een regeling als bedoeld in het derde lid worden eisen gesteld met betrekking tot de test, die in elk geval
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.4.a
    text: de vaststelling van de identiteit van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.4.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.4.c
    text: de wijze waarop de testuitslag wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.4.d
    text: de termijn waarbinnen de test moet zijn uitgevoerd ten opzichte van het moment van binnenkomst in Nederland.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.5
    text: |-
      Een regeling als bedoeld in het derde lid, onderdeel a, is niet van toepassing op degene die wegens overmacht niet
      kan beschikken over een of meerdere van de in dat onderdeel bedoelde bescheiden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58p.6
    text: |-
      Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba geschiedt de aanwijzing van gebieden, bedoeld in het
      derde lid, na overleg met de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58p
  - number: 58pa.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat op de reiziger die heeft verbleven in een door Onze Minister
      aangewezen gebied in het buitenland of reist tussen het Europese deel van Nederland, Bonaire, Sint Eustatius of
      Saba, anders dan met gebruikmaking van bedrijfsmatig personenvervoer als bedoeld in [artikel 58p][ref1], een
      verplichting rust om bij inreis in Nederland te beschikken over een testuitslag waaruit blijkt dat hij op het
      moment van testen niet was geïnfecteerd met het virus SARS-CoV-2, om die testuitslag op verzoek te tonen aan een
      toezichthouder en om die testuitslag te bewaren tot een bij ministeriële regeling te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58pa.2
    text: |-
      In een regeling als bedoeld in het eerste lid worden eisen gesteld met betrekking tot de test, die in elk geval
      betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.2.a
    text: de vaststelling van de identiteit van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.2.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.2.c
    text: de wijze waarop de testuitslag wordt aangetoond;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.2.d
    text: de termijn waarbinnen de test moet zijn uitgevoerd ten opzichte van het moment van inreis in Nederland.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.3
    text: |-
      In een regeling als bedoeld in het eerste lid kan worden bepaald dat de in dat lid bedoelde verplichtingen niet van
      toepassing zijn op personen die voor inreis hebben verbleven in een door Onze Minister aangewezen hoogrisicogebied
      of zeer hoogrisicogebied, en die middels een bewijs van vaccinatie tegen covid-19 dat voldoet aan bij ministeriële
      regeling te stellen voorwaarden kunnen aantonen dat zij op het moment van inreizen gevaccineerd waren volgens bij
      die regeling te bepalen minimumeisen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.4
    text: |-
      Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba geschiedt de aanwijzing van gebieden, bedoeld in het
      eerste lid, na overleg met de gezaghebber.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58pa.5
    text: |-
      Ten aanzien van inreis in Bonaire, Sint Eustatius of Saba kan de in het eerste lid bedoelde testuitslag in bij
      ministeriële regeling bepaalde gevallen ook worden verkregen direct na het moment van aankomst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58pa
  - number: 58q.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verrichten van onderwijsactiviteiten in onderwijsinstellingen
      geheel of gedeeltelijk verboden is en kunnen beperkingen of andere voorwaarden worden gesteld aan het
      verrichten van onderwijsactiviteiten in onderwijsinstellingen. Daarbij kan onderscheid worden gemaakt tussen
      onderwijsinstellingen of categorieën daarvan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58q
  - number: 58q.2
    text: |-
      Met het toezicht op de naleving van het bepaalde krachtens het eerste lid zijn belast de ambtenaren van de
      inspectie van het onderwijs die zijn belast met het toezicht op de naleving van bij of krachtens een onderwijswet
      als bedoeld in [artikel 1, onderdeel d, onder 1, van de Wet op het onderwijstoezicht][ref1] gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58q
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '1'
  - number: 58r.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verboden is kinderopvang geheel of gedeeltelijk geopend te
      hebben.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
  - number: 58r.2
    text: |-
      In de ministeriële regeling kunnen in ieder geval kindercentra of voorzieningen voor gastouderopvang worden
      uitgezonderd die opvang bieden aan:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
  - number: 58r.2.a
    text: kinderen van ouders die werken in bij ministeriële regeling aangewezen cruciale beroepen of vitale processen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
  - number: 58r.2.b
    text: kinderen in bij die regeling aangewezen leeftijdscategorieën; en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
  - number: 58r.2.c
    text: kinderen voor wie vanwege bijzondere problematiek of een moeilijke thuissituatie maatwerk nodig is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
  - number: 58r.3
    text: |-
      In de ministeriële regeling kan de burgemeester worden opgedragen om locaties aan te wijzen,
      onderwijsinstellingen daaronder begrepen, die tot vierentwintig uur per dag en zeven dagen per week
      opvang bieden aan kinderen als bedoeld in het tweede lid. Op deze locaties zijn de eisen, genoemd in
      [hoofdstuk 1, afdeling 3, paragraaf 2, van de Wet kinderopvang][ref1], van overeenkomstige toepassing. In de
      ministeriële regeling kunnen daarvan eisen worden uitgezonderd.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0017017
        paragraaf: '2'
  - number: 58r.4
    text: |-
      In afwijking van [artikel 58j, eerste lid, onder a][ref1], kunnen bij ministeriële regeling regels worden gesteld
      over hygiënemaatregelen en persoonlijke beschermingsmiddelen, met inbegrip van de verplichting tot toepassing of
      gebruik hiervan, voor zover een kindercentrum, een gastouderbureau of een voorziening voor gastouderopvang in een
      woning is gevestigd. Dit geldt tevens voor opvang in een woning die wordt geboden op grond van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58j
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58j
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58r.5
    text: |-
      De [artikelen 1.61][ref1], [1.62, vierde en vijfde lid,][ref2][1.63 tot en met 1.66][ref3],
      [1.67a][ref4], [1.72][ref5] en [1.80 van de Wet kinderopvang][ref6] zijn van overeenkomstige toepassing
      ten aanzien van de handhaving van de bij of krachtens dit hoofdstuk gestelde regels in de kinderopvang.
      [Artikel 1.81 van die wet][ref7] is van overeenkomstige toepassing, voor zover de houder reeds is geregistreerd
      in het landelijk register kinderopvang. Het tweede, derde en vierde lid van [artikel 58l][ref8] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0017017#Artikel1
      [ref8]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58r
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0017017
        artikel: '1'
      - id: ref4
