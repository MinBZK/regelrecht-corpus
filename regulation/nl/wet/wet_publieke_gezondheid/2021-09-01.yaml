      De [artikelen 5, derde lid, onderdeel a, en vierde lid][ref1], [6a][ref2], [8, derde lid][ref3],
      [14 tot en met 17][ref4], [47a][ref5], [58r, derde lid, tweede en derde zin, en vijfde lid][ref6], alsmede
      [64][ref7] zijn niet van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba. [Artikel 65][ref8]
      is wat betreft de ambtenaren van de inspectie niet van toepassing in de openbare lichamen Bonaire, Sint Eustatius
      en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
      [ref6]: https://wetten.overheid.nl/BWBR0024705#Artikel58r
      [ref7]: https://wetten.overheid.nl/BWBR0024705#Artikel64
      [ref8]: https://wetten.overheid.nl/BWBR0024705#Artikel65
