        artikel: 58l
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ra.1
    text: |-
      In een krachtens [paragraaf 2][ref1] van dit hoofdstuk vast te stellen ministeriële regeling kunnen regels worden
      gesteld met betrekking tot het beschikken over een daarbij te bepalen resultaat voor deelname aan of toegang tot
      daarbij te bepalen activiteiten of voorzieningen op uitsluitend de volgende terreinen:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58ra.1.a
    text: cultuur;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.1.b
    text: evenementen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.1.c
    text: georganiseerde jeugdactiviteiten;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.1.d
    text: horeca; of
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.1.e
    text: sport.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.2
    text: |-
      Regels met betrekking tot het beschikken over vaccinatie tegen het virus SARS-CoV-2 of herstel van een infectie met
      het virus SARS-CoV-2 worden slechts gesteld indien:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.2.a
    text: |-
      op basis van een bewijs van vaccinatie tegen het virus SARS-CoV-2 of een bewijs van herstel van een infectie met
      het virus SARS-CoV-2 kan worden vastgesteld dat een vergelijkbare kans op overdracht van het virus SARS-CoV-2
      bestaat als bij een bewijs van een negatieve testuitslag; en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.2.b
    text: |-
      de mogelijkheid wordt geboden in plaats van een bewijs van vaccinatie tegen het virus SARS-CoV-2 of een bewijs van
      herstel van een infectie met het virus SARS-CoV-2 gebruik te maken van een bewijs van een testuitslag.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.3
    text: |-
      Slechts voor zover dat bij of krachtens algemene maatregel van bestuur is bepaald, kunnen voorts
      in een krachtens [paragraaf 2][ref1] van dit hoofdstuk of [artikel 58q][ref2] vast te stellen
      ministeriële regeling regels als bedoeld in het eerste lid worden gesteld op het terrein van
      beroepsonderwijs als bedoeld in [artikel 1.1.1, onder h, van de Wet educatie en beroepsonderwijs][ref3]
      of [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref4], of hoger onderwijs als bedoeld in
      [artikel 1.1, onder b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0028395
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 58ra.4
    text: |-
      Met betrekking tot een besluit tot vaststelling of wijziging van het beleid bij de toepassing van regels als
      bedoeld in het eerste lid, behoeft, voor zover deze regels betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.4.a
    text: |-
      het beroepsonderwijs, bedoeld in [artikel 1.1.1, onder h, van de Wet educatie en beroepsonderwijs][ref1], het
      bevoegd gezag voorafgaande instemming van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 58ra.4.a.1°
    text: |-
      de studentenraad overeenkomstig hetgeen bij of krachtens die wet is bepaald ten aanzien van de
      instemmingsbevoegdheid, bedoeld in [artikel 8a.2.2 van die wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
  - number: 58ra.4.a.2°
    text: |-
      de ondernemingsraad overeenkomstig hetgeen bij of krachtens de [Wet op de ondernemingsraden][ref1] is bepaald ten
      aanzien van het instemmingsrecht, bedoeld in [artikel 27 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel27
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0002747
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '27'
  - number: 58ra.4.b
    text: |-
      het beroepsonderwijs, bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs BES][ref1], het bevoegd
      gezag voorafgaande instemming van de vertegenwoordiging, bedoeld in [artikel 5.1 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '5'
  - number: 58ra.4.c
    text: |-
      het hoger onderwijs, bedoeld in
      [artikel 1.1, onder b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], het
      instellingsbestuur voorafgaande instemming van de universiteitsraad of medezeggenschapsraad dan wel de gezamenlijke
      vergadering overeenkomstig hetgeen bij of krachtens die wet is bepaald ten aanzien van de instemmingsbevoegdheid
      van die raad of vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 58ra.5
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in het derde lid worden regels gesteld met
      betrekking tot de wijze waarop de onderwijsinstelling:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.5.a
    text: |-
      zorg draagt voor een toegankelijke voorziening waar de student zich kan laten testen op infectie met het virus
      SARS-CoV-2;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.5.b
    text: de toegankelijkheid van het onderwijs waarborgt voor de student die niet over een coronatoegangsbewijs beschikt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.6
    text: |-
      De voordracht voor een algemene maatregel van bestuur als bedoeld in het derde lid wordt gedaan door Onze Ministers
      in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap. De voordracht wordt niet eerder gedaan
      dan een week nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.7
    text: |-
      In een krachtens [paragraaf 2][ref1] van dit hoofdstuk of [artikel 58q][ref2] vast te stellen ministeriële regeling
      kunnen experimenten worden aangewezen die tot doel hebben het vergaren van en aan Onze Minister rapporteren over
      praktijkkennis over de uitvoerbaarheid en effecten van regels als bedoeld in het eerste of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58ra.8
    text: |-
      Ten aanzien van personen die beroeps- of bedrijfsmatig werkzaamheden verrichten worden geen regels als bedoeld in
      het eerste lid gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.9
    text: |-
      Regels als bedoeld in het eerste lid gelden niet voor personen die vanwege een beperking of een ziekte geen test
      kunnen ondergaan of als gevolg van een test ernstig ontregeld raken. Bij ministeriële regeling worden nadere regels
      gesteld over de toepassing van de eerste volzin, in ieder geval met betrekking tot de vaststelling dat een persoon
      vanwege een beperking of ziekte geen test kan worden afgenomen en met betrekking tot de deelname aan of toegang tot
      activiteiten of voorzieningen voor deze personen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58ra.10
    text: |-
      Het is verboden om voor deelname aan of toegang tot activiteiten of voorzieningen in openbare plaatsen of publieke
      plaatsen eisen te stellen met betrekking tot het beschikken over een resultaat, tenzij daarvoor regels als bedoeld
      in het eerste of derde lid zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58ra
  - number: 58rb
    text: |-
      Onverminderd [artikel 58b, tweede lid][ref1], kunnen slechts regels als bedoeld in
      [artikel 58ra, eerste of derde lid][ref2], worden gesteld, indien deze, rekening houdend met de aard van de
      activiteiten of voorzieningen:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58b
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58ra
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rb
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58b
        hoofdstuk: Va
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58ra
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rb.a
    text: in het maatschappelijk belang zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rb
  - number: 58rb.b
    text: |-
      uitvoerbaar en doelmatig zijn, mede gelet op de aanvang en duur van de periode waarin de regels van toepassing zijn
      en de mogelijkheden om een resultaat te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rb
  - number: 58rb.c
    text: |-
      gepaard gaan met voorzorgsmaatregelen om eventuele maatschappelijk ongewenste effecten ervan, waaronder afbreuk aan
      andere maatregelen tegen verspreiding van het virus SARS-CoV-2, vermijdbare achterstanden of ongelijke toegang tot
      activiteiten, voorzieningen of onderwijs te voorkomen, weg te nemen of te verminderen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rb
  - number: 58rc.1
    text: |-
      Voor het beschikken over een testuitslag ten behoeve van deelname aan of toegang tot activiteiten of voorzieningen
      als bedoeld in [artikel 58ra, eerste lid][ref1], of het onderwijs, bedoeld in artikel 58ra, derde lid, biedt Onze
      Minister aan ieder de mogelijkheid om zichzelf te testen of zich te laten testen op infectie met het virus SARS-
      CoV-2, waarbij de kosten van respectievelijk de test of de uitvoering van het testen voor rekening komen van Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ra
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ra
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rc.2
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld, die in elk geval betrekking kunnen hebben op:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
  - number: 58rc.2.a
    text: |-
      de wijze waarop de mogelijkheid, bedoeld in het eerste lid, wordt geboden, waarbij kan worden bepaald dat
      uitsluitend een van beide in dat lid bedoelde vormen van testen wordt geboden;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
  - number: 58rc.2.b
    text: het type test waarmee een persoon zichzelf kan testen of zich kan laten testen;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
  - number: 58rc.2.c
    text: de frequentie waarmee een persoon de mogelijkheid om zichzelf te testen, bedoeld in het eerste lid, wordt geboden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
  - number: 58rc.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voor de uitvoering
      van dit artikel noodzakelijke verwerking van persoonsgegevens, met inbegrip van persoonsgegevens
      over de gezondheid als bedoeld in artikel 9 van de Algemene verordening gegevensbescherming of
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rc
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
  - number: 58rd.1
    text: |-
      In een ministeriële regeling als bedoeld in [artikel 58ra, eerste of derde lid][ref1], worden eisen gesteld met
      betrekking tot de test, de vaccinatie of het herstel om voor een resultaat te worden gebruikt, die voor een test in
      elk geval betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ra
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ra
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rd.1.a
    text: de vaststelling van de identiteit van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
  - number: 58rd.1.b
    text: |-
      het type test dat is uitgevoerd, waarbij onder meer onderscheid gemaakt kan worden tussen zelfafname, zelfafname
      onder begeleiding van een derde of afname door een derde;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
  - number: 58rd.1.c
    text: de testuitslag;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
  - number: 58rd.1.d
    text: de termijn sinds het uitvoeren van de test.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
  - number: 58rd.2
    text: |-
      Tot de regels, bedoeld in [artikel 58ra, eerste of derde lid][ref1], kunnen behoren:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ra
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ra
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rd.2.a
    text: |-
      een verplichting voor personen om het resultaat en een geldig identiteitsdocument als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of [artikel 2 van de Wet identificatieplicht BES][ref2]
      op verzoek te tonen aan degene die bevoegd is, bedoeld in de [artikelen 58k][ref3] en [58l][ref4], of de
      onderwijsinstelling, bedoeld in [artikel 58q][ref5] en aan een toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028575#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58k
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028575
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58k
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58l
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58rd.2.b
    text: |-
      een verplichting voor degene die bevoegd is, bedoeld in de [artikelen 58k][ref1] en [58l][ref2],
      of de onderwijsinstelling, bedoeld in [artikel 58q][ref3], de persoon die geen resultaat of geldig
      identiteitsdocument als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref4] of
      [artikel 2 van de Wet identificatieplicht BES][ref5] kan tonen, de toegang tot of het gebruik van een publieke
      onderscheidenlijk besloten plaats te ontzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58k
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
      [ref4]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rd
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58k
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58l
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0028575
        artikel: '2'
  - number: 58re.1
    text: 'Voor het tonen van het resultaat wordt gebruikt:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.1.a
    text: 'hetzij een elektronisch coronatoegangsbewijs:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.1.a.1°
    text: met een door Onze Minister beschikbaar gestelde applicatie; of
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.1.a.2°
    text: indien dat bij ministeriële regeling is bepaald, op een daarbij aangewezen drager;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.1.b
    text: hetzij een schriftelijk coronatoegangsbewijs.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.2
    text: |-
      Bij ministeriële regeling worden eisen gesteld aan de aangewezen drager en het schriftelijk coronatoegangsbewijs,
      die in elk geval waarborgen dat uitsluitend betrouwbare resultaten getoond worden en waarbij zo min mogelijk
      persoonsgegevens worden verlangd ten behoeve van het verifiëren van de identiteit van de toonder van het
      coronatoegangsbewijs.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.3
    text: |-
      Voor het lezen van het elektronisch of schriftelijk coronatoegangsbewijs wordt een door Onze Minister beschikbaar
      gestelde applicatie gebruikt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.4
    text: |-
      Onze Minister draagt zorg voor de inrichting en het beheer van de applicaties en treft waarborgen om ervoor te
      zorgen dat met de applicaties uitsluitend betrouwbare resultaten getoond worden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.5
    text: |-
      Onze Minister is verwerkingsverantwoordelijke in de zin van artikel 4 van de Algemene verordening
      gegevensbescherming en [artikel 1, tweede lid, onder d, van de Wet bescherming persoonsgegevens BES][ref1] voor de
      verwerking van persoonsgegevens bij het gebruik van de aangewezen drager en de applicaties.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '1'
  - number: 58re.6
    text: |-
      Onze Minister, het RIVM, de uitvoerder van de test, de toediener van het vaccin, de verklaarder van
      het herstel, de geteste persoon, de gevaccineerde persoon, de herstelde persoon, de persoon, bedoeld in
      [artikel 58ra, negende lid][ref1], de personen of organisaties die de in artikel 6ba bedoelde EU-rechtshandelingen
      uitvoeren en de bevoegde of onderwijsinstelling, bedoeld in [artikel 58rd, tweede lid, onder b][ref2], verwerken
      voor het gebruik van de applicatie, de aangewezen drager of het schriftelijk coronatoegangsbewijs bij ministeriële
      regeling te bepalen persoonsgegevens, waaronder persoonsgegevens over de gezondheid als bedoeld in artikel 9 van
      de Algemene verordening gegevensbescherming of [artikel 16 van de Wet bescherming persoonsgegevens BES][ref3],
      die noodzakelijk zijn om te voldoen aan de eisen en waarborgen, bedoeld in het tweede en vierde lid, en
      [artikel 58rd, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58ra
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
      [ref3]: https://wetten.overheid.nl/BWBR0028067#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58ra
        hoofdstuk: Va
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
      - id: ref3
        bwb_id: BWBR0028067
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58re.7
    text: |-
      De applicatie voor het lezen van het elektronisch of schriftelijk coronatoegangsbewijs maakt de persoonsgegevens
      uitsluitend gedurende een bij ministeriële regeling te bepalen aantal seconden zichtbaar en vernietigt de
      persoonsgegevens onmiddellijk daarna.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.8
    text: 'Bij ministeriële regeling kunnen voorwaarden worden gesteld aan:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.8.a
    text: |-
      de aansluiting van de uitvoerder van de test, de toediener van het vaccin of de verklaarder van het herstel op de
      applicatie voor het tonen van het coronatoegangsbewijs;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.8.b
    text: |-
      het gebruik van de applicatie voor het lezen van het coronatoegangsbewijs door de bevoegde of onderwijsinstelling,
      bedoeld in [artikel 58rd, tweede lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58re.8.c
    text: |-
      het gebruik van de aangewezen drager door de uitvoerder van de test, de toediener van het vaccin, de verklaarder
      van het herstel, of de bevoegde of onderwijsinstelling, bedoeld in [artikel 58rd, tweede lid, onder b][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58re.8.d
    text: |-
      het gebruik van de applicatie voor het tonen van het coronatoegangsbewijs of de aangewezen drager door een persoon
      waarop een verplichting als bedoeld in [artikel 58rd, tweede lid, onder a][ref1], rust;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58re.8.e
    text: de beveiliging tegen verlies en onrechtmatige verwerking van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.9
    text: |-
      Onze Minister maakt door middel van de applicatie voor het tonen van het coronatoegangsbewijs ten minste de
      volgende informatie toegankelijk:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58re.9.a
    text: |-
      de wijze waarop bij Onze Minister, het RIVM, de uitvoerder van de test, de toediener van het
      vaccin, de verklaarder van het herstel of de personen of organisaties die de in [artikel 6ba][ref1]
      bedoelde EU-rechtshandelingen uitvoeren een beroep kan worden gedaan op de rechten, bedoeld
      in de artikelen 12 tot en met 23 en 33 van de Algemene verordening gegevensbescherming en de
      [artikelen 25 tot en met 34 van de Wet bescherming persoonsgegevens BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6ba
      [ref2]: https://wetten.overheid.nl/BWBR0028067#Artikel25
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 6ba
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0028067
        artikel: '25'
  - number: 58re.9.b
    text: |-
      de wijze waarop een klacht kan worden ingediend bij de Autoriteit Persoonsgegevens of een verzoek tot het instellen
      van een onderzoek als bedoeld in [artikel 50 van de Wet bescherming persoonsgegevens BES][ref1] kan worden gedaan
      bij de Commissie toezicht bescherming persoonsgegevens BES;


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '50'
  - number: 58re.9.c
    text: |-
      de wijze van verwerking van gegevens in het kader van de applicatie in beknopte en toegankelijke vorm en in
      duidelijke en eenvoudige taal.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58re
  - number: 58rf.1
    text: |-
      Onze Minister kan ontheffing verlenen van het gebruik van de applicatie, bedoeld in
      [artikel 58re, derde lid][ref1], indien het lezen van een coronatoegangsbewijs plaatsvindt als onderdeel van
      een meeromvattend geautomatiseerd systeem voor het controleren van grote aantallen personen voor deelname aan
      activiteiten of toegang tot voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rf.2
    text: |-
      Aan de ontheffing kunnen voorschriften en beperkingen worden verbonden, in ieder geval met betrekking tot de
      inrichting, het beheer en het gebruik van het systeem en de beveiliging tegen verlies en onrechtmatige verwerking
      van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rf
  - number: 58rf.3
    text: |-
      Indien ontheffing wordt verleend, kan Onze Minister tevens bij ministeriële regeling vrijstelling verlenen van
      het bepaalde bij of krachtens [artikel 58re, eerste lid][ref1], indien noodzakelijk om een coronatoegangsbewijs te
      kunnen lezen met het systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rf.4
    text: |-
      Aan de vrijstelling kunnen voorschriften en beperkingen worden verbonden, in ieder geval met betrekking tot
      de eisen aan het coronatoegangsbewijs en de aansluiting van de uitvoerder van de test, de toediener van het
      vaccin of de verklaarder van het herstel op het systeem en de beveiliging tegen verlies en onrechtmatige
      verwerking van persoonsgegevens. De voorschriften en beperkingen kunnen voor de verschillende categorieën van het
      coronatoegangsbewijs verschillen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rf
  - number: 58rf.5
    text: |-
      [Artikel 58re, zesde en zevende lid][ref1], is van overeenkomstige toepassing op de verwerking van persoonsgegevens
      voor de toepassing van het systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rf
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58rg
    text: |-
      [Artikel 446, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] en
      [artikel 446, vijfde lid, van Boek 7 van het Burgerlijk Wetboek BES][ref2] zijn niet van toepassing
      op het laten uitvoeren van een test met het oogmerk te voldoen aan de verplichting, bedoeld in
      [artikel 58rd, tweede lid, onder a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0028751#Artikel446
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58rd
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58rg
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '446'
      - id: ref2
        bwb_id: BWBR0028751
        artikel: '446'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58rd
        hoofdstuk: Va
        paragraaf: 3a
  - number: 58s.1
    text: |-
      Onze Minister zendt maandelijks aan beide Kamers van de Staten-Generaal een met redenen omkleed overzicht van de
      krachtens dit hoofdstuk geldende maatregelen en wordt tevens aangegeven wat de verwachtingen zijn ten aanzien van
      het voortduren van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58s
  - number: 58s.2
    text: |-
      De burgemeester verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot de uitoefening van bevoegdheden op grond van dit
      hoofdstuk nodig heeft. De gegevens en inlichtingen worden kosteloos verstrekt door tussenkomst van de voorzitter
      van de veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58s
  - number: 58s.4
    text: |-
      De burgemeester is aan de gemeenteraad verantwoording schuldig over het door hem krachtens dit hoofdstuk gevoerde
      bestuur en waarborgt de betrokkenheid van de gemeenteraad en het college van burgemeester en wethouders bij dat
      bestuur. De burgemeester verstrekt de wethouders de informatie over de uitoefening van zijn bevoegdheden bij of
      krachtens dit hoofdstuk die zij nodig hebben voor de uitoefening van de taken van het college. Het tweede en derde
      lid van [artikel 180 van de Gemeentewet][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel180
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58s
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '180'
  - number: 58s.5
    text: |-
      Indien de voorzitter van de veiligheidsregio na een besluit als bedoeld in [artikel 58d, eerste lid][ref1],
      toepassing heeft gegeven aan een bevoegdheid als bedoeld in dat lid, is hij daarover verantwoording schuldig aan de
      betrokken gemeenteraden. Hij brengt daartoe een verslag uit en beantwoordt de vragen van die raden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58d
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58s
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58d
        hoofdstuk: Va
        paragraaf: '1'
  - number: 58t
    text: |-
      De Afdeling advisering van de Raad van State wordt gehoord over de krachtens dit
      hoofdstuk geldende maatregelen voorafgaand aan het besluit tot verlenging als bedoeld in
      [artikel VIII, derde lid, van de Tijdelijke wet maatregelen covid-19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044337#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58t
    references:
      - id: ref1
        bwb_id: BWBR0044337
        artikel: VIII
  - number: 58u.1
    text: 'Onze Minister is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
  - number: 58u.1.a
    text: |-
      het bepaalde krachtens [artikel 58j, eerste lid][ref1], indien de overtreding wordt begaan op een besloten plaats
      indien deze een ruimte betreft waar een beroep of bedrijf wordt uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58j
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58j
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58u.1.b
    text: |-
      het bepaalde krachtens de [artikelen 58l, tweede lid, eerste zin][ref1], en – indien het een bevel van Onze
      Minister betreft – vierde lid, [58o, derde en vierde lid][ref2], [58p][ref3] en [58q, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58o
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58l
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58o
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58p
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
  - number: 58u.2
    text: |-
      Onze Minister is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens de [artikelen 58f, eerste en vierde lid, en vijfde lid, tweede zin][ref1], en [58g, eerste lid][ref2],
      indien de overtreding wordt begaan op een besloten plaats indien deze een ruimte betreft waar een beroep of bedrijf
      wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58g
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58g
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58u.3
    text: 'De burgemeester is bevoegd tot het opleggen van een last onder bestuursdwang ter handhaving van:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
  - number: 58u.3.a
    text: |-
      het bepaalde bij of krachtens de [artikelen 58h, eerste lid][ref1], en [58i][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58h
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58i
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58h
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58i
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58u.3.b
    text: |-
      het bepaalde krachtens [artikel 58j][ref1], eerste lid, indien de overtreding wordt begaan op een openbare
      of publieke plaats of een besloten plaats indien deze geen ruimte betreft waar een beroep of bedrijf wordt
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58j
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58j
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58u.4
    text: |-
      De burgemeester is bevoegd tot het opleggen van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens de [artikelen 58f, eerste en vierde lid, en vijfde lid, tweede zin][ref1], en [58g, eerste lid][ref2],
      indien de overtreding wordt begaan op een openbare of publieke plaats of een besloten plaats indien deze geen
      ruimte betreft waar een beroep of bedrijf wordt uitgeoefend, of ter handhaving van het bepaalde bij of krachtens
      [artikel 58nb, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58f
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58g
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58u
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58f
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58g
        hoofdstuk: Va
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58v.1
    text: |-
      De burgemeester is bevoegd een bestuurlijke boete op te leggen ter handhaving van het bepaalde bij of krachtens
      [artikel 58nb, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58v
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
        hoofdstuk: Va
        paragraaf: '2'
  - number: 58v.2
    text: De op grond van het eerste lid op te leggen bestuurlijke boete bedraagt € 339.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58v
  - number: '59.1'
    text: |-
      Indien de gemeenteraad een bijdrage heft voor het verrichten van werkzaamheden in het kader van de publieke
      gezondheidszorg, draagt het college van burgemeester en wethouders ervoor zorg dat dit niet ten koste gaat van het
      bereik van deze werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel59
  - number: '59.2'
    text: |-
      Geen bijdrage wordt geheven voor de bij of krachtens de [artikelen 5][ref1], [6][ref2] en [6b][ref3] opgedragen
      taken, behoudens in gevallen bij algemene maatregel van bestuur aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel6b
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 6b
        hoofdstuk: II
        paragraaf: '4'
  - number: '60.1'
    text: |-
      De gemeente draagt de kosten van de maatregelen die krachtens [hoofdstuk V][ref1] van deze wet worden genomen.
      Ook draagt de gemeente de kosten van door haar toegekende tegemoetkomingen aan hen, die inkomsten derven door de
      maatregelen, bedoeld in de [artikelen 31][ref2], [35][ref3], [38][ref4] en [47][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel47
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '38'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0024705
        artikel: '47'
        hoofdstuk: V
        paragraaf: '5'
  - number: '60.2'
    text: |-
      In afwijking van de eerste volzin van het eerste lid draagt het Rijk de kosten van de maatregel, bedoeld in
      [artikel 31][ref1], indien deze wordt toegepast bij een persoon lijdend aan tuberculose.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '60.3'
    text: 'In afwijking van het eerste lid draagt:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
  - number: 60.3.a
    text: |-
      de exploitant van een burgerhaven of burgerluchthaven en de burgerexploitant de kosten van de maatregelen die door
      de burgemeester krachtens [artikel 54][ref1] zijn opgedragen,


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel54
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
  - number: 60.3.b
    text: |-
      de vervoersexploitant de kosten van de maatregelen die door de burgemeester krachtens [artikel 55][ref1] zijn
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel55
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
  - number: '60.4'
    text: |-
      De in [artikel 47, derde lid, onder c][ref1], bedoelde waren worden voor vernietiging door de burgemeester
      gewaardeerd. Het college van burgemeester en wethouders keert aan de eigenaar als schadeloosstelling het bedrag uit
      waarop de goederen zijn gewaardeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel47
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '47'
        hoofdstuk: V
        paragraaf: '5'
  - number: '60.5'
    text: |-
      Het college van burgemeester en wethouders is bevoegd de kosten verbonden aan de maatregelen, bedoeld in de
      [artikelen 31][ref1], [35][ref2], [38][ref3] en [47][ref4], te verhalen op de natuurlijke- of rechtspersoon ten
      aanzien van wie een maatregel is getroffen, indien die persoon niet tot vrijwillige medewerking bereid is geweest.
      De [artikelen 5.25][ref5] en [5.26 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '38'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '47'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '60.6'
    text: |-
      Onze Minister is bevoegd de kosten verbonden aan de maatregelen, bedoeld in
      [artikel 47a, eerste lid, onder a en c][ref1], te verhalen op de natuurlijke- of rechtspersoon ten aanzien
      van wie een maatregel is getroffen, indien die persoon niet tot vrijwillige medewerking bereid is geweest.
      [Artikel 5.25 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 47a
        hoofdstuk: V
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '60.7'
    text: |-
      Onze Minister kan aan de exploitant van een burgerhaven of burgerluchthaven, de burgerexploitant of de
      vervoersexploitant een naar billijkheid te bepalen vergoeding toekennen terzake van buitengewone kosten die door
      de exploitant van een burgerhaven of burgerluchthaven, de burgerexploitant of de vervoersexploitant worden gemaakt
      vanwege de naleving van de maatregelen die krachtens de [artikelen 54][ref1] of [55][ref2] in samenhang met
      [artikel 7, derde lid][ref3], zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel7
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
  - number: '61'
    text: |-
      De kosten verband houdende met het voorzieningenniveau, bedoeld in [artikel 49, eerste lid][ref1], komen, voor
      zover het een burgerhaven of burgerluchthaven betreft, ten laste van de exploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel49
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '62.1'
    text: |-
      Indien Onze Minister op grond van [artikel 7, eerste of derde lid][ref1], de voorzitter van de veiligheidsregio dan
      wel de burgemeester opdraagt maatregelen te treffen, kan ten behoeve van de bekostiging daarvan een beroep worden
      gedaan op het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel7
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
  - number: '62.2'
    text: Bij algemene maatregel van bestuur worden regels gesteld over het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel62
  - number: '63.1'
    text: |-
      De kosten ter verkrijging van een certificaat als bedoeld in [artikel 57, eerste lid][ref1], komen ten laste van de
      gezagvoerder van het desbetreffende schip.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel57
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '57'
        hoofdstuk: V
        paragraaf: '6'
  - number: '63.2'
    text: |-
      Behoudens in bij regeling van Onze Minister te bepalen gevallen komen de kosten van inenting van
      personen of de toediening van profylaxe aan personen ter verkrijging van een certificaat als bedoeld in
      [artikel 58, eerste lid][ref1], ten laste van de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '58'
        hoofdstuk: V
        paragraaf: '7'
  - number: '63.3'
    text: |-
      Bij regeling van Onze Minister worden de tarieven vastgesteld voor het verkrijgen van de certificaten, bedoeld in
      de [artikelen 57, eerste lid][ref1], en [58, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '57'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '58'
        hoofdstuk: V
        paragraaf: '7'
  - number: '64'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de
      inspectie en de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64
  - number: 64a.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens hoofdstuk Va of onderdelen daarvan, met
      uitzondering van de [artikelen 58q][ref1] en [58r][ref2], zijn voorts belast de bij besluit van Onze Minister
      aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft, ressorterende onder een ander ministerie dan dat
      van Onze Minister, wordt het besluit genomen in overeenstemming met Onze Minister die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58q
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58r
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58q
        hoofdstuk: Va
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58r
        hoofdstuk: Va
        paragraaf: '3'
  - number: 64a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64a
  - number: 64bis.1
    text: |-
      Met het toezicht op de naleving van [artikel 6d, achtste lid][ref1], zijn voorts belast de bij besluit van Onze
      Minister aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft, ressorterende onder een ander ministerie
      dan dat van Onze Minister, wordt het besluit genomen in overeenstemming met Onze Minister die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6d
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64bis
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 6d
        hoofdstuk: II
        paragraaf: '4'
  - number: 64bis.2
    text: |-
      De ambtenaren belast met het toezicht op de naleving van [artikel 6d, achtste lid][ref1], verstrekken elkaar uit
      eigen beweging en desgevraagd de gegevens, waaronder persoonsgegevens over de gezondheid als bedoeld in artikel 9
      van de Algemene verordening gegevensbescherming, die van belang zijn voor de uitoefening van hun toezichthoudende
      taak.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6d
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64bis
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 6d
        hoofdstuk: II
        paragraaf: '4'
  - number: 64bis.3
    text: |-
      Met de opsporing van het in [artikel 67a][ref1] strafbaar gestelde feit
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2] en
      [artikel 184 van het Wetboek van Strafvordering BES][ref3], belast de door Onze Minister in overeenstemming
      met Onze Minister van Justitie en Veiligheid aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft,
      ressorterende onder een ander ministerie dan dat van Onze Minister of van Onze Minister van Justitie en Veiligheid,
      wordt het besluit genomen in overeenstemming met Onze Minister die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel67a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64bis
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 67a
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 64bis.4
    text: |-
      De ambtenaren bedoeld in het tweede lid zijn tevens belast met de opsporing van de feiten, strafbaar
      gesteld in de [artikelen 179 tot en met 182][ref1] en [184 van het Wetboek van Strafrecht][ref2] dan wel de
      [artikelen 185 tot en met 188][ref3] en [190 van het Wetboek van Strafrecht BES][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel190
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64bis
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '190'
  - number: 64bis.5
    text: |-
      Van een besluit als bedoeld in het eerste lid en tweede lid wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel64bis
  - number: '65.1'
    text: |-
      In het geval van een besmetting of infectie of bij een gegrond vermoeden daarvan, zijn binnen hun ambtsgebied de
      burgemeester dan wel de voorzitter van de veiligheidsregio, de daartoe door de burgemeester dan wel de voorzitter
      van de veiligheidsregio aangewezen ambtenaren van de gemeentelijke gezondheidsdienst en de daartoe aangewezen
      ambtenaren van de inspectie bevoegd, desgevraagd na het tonen van een legitimatiebewijs, elke plaats te betreden of
      te verlaten, voor zover dat redelijkerwijs voor de vervulling van hun taak op grond van deze wet nodig is. Zonodig
      verschaffen zij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel65
  - number: '65.2'
    text: |-
      Ten behoeve van de uitvoering van [artikel 47a][ref1] zijn de daartoe aangewezen ambtenaren van de Nederlandse
      Voedsel- en Warenautoriteit bevoegd, desgevraagd na het tonen van een legitimatiebewijs, elke plaats te betreden of
      te verlaten, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zo nodig verschaffen zij zich
      toegang met behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 47a
        hoofdstuk: V
        paragraaf: '5'
  - number: 65a.1
    text: |-
      Met de opsporing van de in [artikel 68bis][ref1] strafbaar gestelde feiten
      zijn, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2] en
      [artikel 184 van het Wetboek van Strafvordering BES][ref3], belast de door Onze Minister in overeenstemming
      met Onze Minister van Justitie en Veiligheid aangewezen ambtenaren. Indien de aanwijzing ambtenaren betreft,
      ressorterende onder een ander ministerie dan dat van Onze Minister of van Onze Minister van Justitie en Veiligheid,
      wordt het besluit genomen in overeenstemming met Onze Minister die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68bis
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 68bis
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 65a.2
    text: |-
      De aangewezen ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref1] en [184 van het Wetboek van Strafrecht][ref2] dan wel de
      [artikelen 185 tot en met 188][ref3] en [190 van het Wetboek van Strafrecht BES][ref4], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel184
      [ref3]: https://wetten.overheid.nl/BWBR0028570#Artikel185
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel190
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '184'
      - id: ref3
        bwb_id: BWBR0028570
        artikel: '185'
      - id: ref4
        bwb_id: BWBR0028570
        artikel: '190'
  - number: 65a.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel65a
  - number: '66.1'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt
      gestraft de arts die handelt in strijd met de [artikelen 21, eerste, tweede of derde lid][ref1],
      [22, eerste, tweede of derde lid][ref2], [24, vierde lid][ref3], of [30][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel30
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '66.2'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft het hoofd van
      een laboratorium dat handelt in strijd met [artikel 25, tweede of vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel25
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: '66.3'
    text: |-
      Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft het hoofd van
      een instelling die handelt in strijd met [artikel 26, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel26
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '26'
        hoofdstuk: V
        paragraaf: '2'
  - number: '66.4'
    text: |-
