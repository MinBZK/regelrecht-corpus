  - number: 58a.2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt mede verstaan onder: - *basisregistratie personen:*
      basisadministratie als bedoeld in de [Wet basisadministraties persoonsgegevens BES][ref1];
        - *woning:* een daarbij behorend erf.


