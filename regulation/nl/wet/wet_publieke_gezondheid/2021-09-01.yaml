---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_publieke_gezondheid
regulatory_layer: WET
publication_date: '2023-04-21'
valid_from: '2021-09-01'
bwb_id: BWBR0024705
url: https://wetten.overheid.nl/BWBR0024705/2021-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter implementatie van de herziene Internationale
    Gezondheidsregeling en om beter voorbereid te zijn op infectieziektecrises, wenselijk is voor de
    infectieziektebestrijding regels te stellen betreffende de organisatie ervan en de informatieverplichtingen en de
    bevoegdheden tot optreden uit te breiden; dat het wenselijk is om deze regels samen met de bestaande bepalingen
    onder te brengen in één wet opdat een samenhangend geheel ontstaat; dat daarom de Wet collectieve preventie
    volksgezondheid, de Infectieziektenwet en de Quarantainewet kunnen worden ingetrokken en worden vervangen door een
    wet voor de publieke gezondheid; dat het daarnaast wenselijk is om in deze wet een bepaling op te nemen omtrent een
    verplichte digitale gegevensopslag bij de uitvoering van de jeugdgezondheidszorg;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.a
    text: '*de Internationale Gezondheidsregeling:* de Internationale Gezondheidsregeling met Bijlagen (Trb. 2007, 34);'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.b
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.c
    text: |-
      *publieke gezondheidszorg:* de gezondheidsbeschermende en gezondheidsbevorderende maatregelen voor de bevolking of
      specifieke groepen daaruit, waaronder begrepen het voorkómen en het vroegtijdig opsporen van ziekten;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.d
    text: |-
      *jeugdgezondheidszorg:* de publieke gezondheidszorg, waarbij een landelijk preventief gezondheidszorgpakket actief
      wordt aangeboden aan alle jeugdigen tot 18 jaar;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.da
    text: '*ouderengezondheidszorg:* de publieke gezondheidszorg ten behoeve van personen boven de vijfenzestig jaar;'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.e
    text: |-
      *groep A:* Middle East respiratory syndrome coronavirus (MERS-CoV), pokken, polio, severe acute respiratory
      syndrome (SARS), virale hemorragische koorts;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.f
    text: '*groep B1:* een humane infectie veroorzaakt door een dierlijk influenzavirus, difterie, pest, rabies, tuberculose;'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.g
    text: |-
      *groep B2:* buiktyfus (typhoid fever), cholera, hepatitis A, B en C, kinkhoest, mazelen, paratyfus, rubella,
      shigellose, shiga toxine producerende escherichia (STEC)/enterohemorragische escherichia coli-infectie, invasieve
      groep A streptokokkeninfectie, voedselinfectie, voor zover vastgesteld bij twee of meer patiënten met een
      onderlinge relatie wijzend op voedsel als een bron;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.h
    text: |-
      *groep C:* de krachtens [artikel 19][ref1] aangewezen infectieziekten;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel19
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '19'
        hoofdstuk: V
        paragraaf: '1'
  - number: 1.i
    text: |-
      *epidemie van een infectieziekte:* een in korte tijd sterke toename van het aantal nieuwe patiënten lijdend aan een
      infectieziekte behorend tot groep A, B1, B2 of C;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.j
    text: |-
      *quarantaine:* verblijf van een persoon die mogelijk besmet is met een infectieziekte behorend tot groep A in een
      door de burgemeester aangewezen gebouw, schip of in een aantal aangewezen ruimten daarbinnen, in verband met de
      bestrijding van de gevaren van die ziekte voor de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.k
    text: |-
      *medisch toezicht:* medisch toezicht op een in quarantaine geplaatste persoon om te bezien of deze met een
      infectieziekte behorend tot groep A is geïnfecteerd en dientengevolge ziekteverschijnselen ontwikkelt;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.l
    text: |-
      *besmetting:* de aanwezigheid van een vector, infectueus of giftig agens of infectueuze of giftige stof op of in
      een terrein, gebouw, goed of vervoermiddel, waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.m
    text: |-
      *infectie:* het binnendringen en de ontwikkeling of vermenigvuldiging van een infectueus agens in het lichaam van
      mensen, waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.n
    text: |-
      *vector:* een insect of ander dier dat normaliter een infectueus agens met zich meevoert waardoor een
      volksgezondheidsrisico kan ontstaan, dan wel een plant of substantie waarin een infectueus agens normaliter leeft
      waardoor een volksgezondheidsrisico kan ontstaan;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.o
    text: |-
      *lijk;* een lijk in de zin van [artikel 2, eerste lid, onder a, van de Wet op de lijkbezorging][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel2
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '2'
  - number: 1.p
    text: |-
      *haven:* haven, inclusief de ankergebieden, ligplaatsen, kaden, steigers en, voor wat betreft zeehavens,
      aanvaarroutes vanuit zee, alsmede alle zich in de nabijheid daarvan bevindende bedrijven, opslagplaatsen en overige
      terreinen en gebouwen, die op grond van hun ligging, bestemming of gebruik moeten worden geacht daartoe te behoren;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.q
    text: |-
      *luchthaven:* een terrein geheel of gedeeltelijk bestemd voor het opstijgen en het landen van luchtvaartuigen met
      inbegrip van:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.q.1°
    text: de daarmee verband houdende bewegingen van luchtvaartuigen op de grond,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.q.2°
    text: de afwikkeling van het in de aanhef en onder 1° bedoelde luchtverkeer, of
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.q.3°
    text: |-
      bedrijfsmatige activiteiten die samenhangen met de afwikkeling van het in de aanhef en onder 1° bedoelde
      luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.r
    text: |-
      *burgerexploitant:* burgerexploitant als bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 1.s
    text: |-
      *gebouw:* elk bouwwerk dat een overdekte geheel of gedeeltelijk met wanden omsloten ruimte vormt, met uitzondering
      van bouwwerken ten behoeve van het belijden van godsdienst of levensovertuiging;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.t
    text: '*vervoermiddel:* luchtvaartuig, schip, trein of wegvoertuig;'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.u
    text: |-
      *goed:* tastbaar product, met inbegrip van planten en met uitzondering van dieren, vervoermiddelen en lijken in de
      zin van [artikel 2, eerste lid, onder a, van de Wet op de lijkbezorging][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel2
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '2'
  - number: 1.v
    text: |-
      *waar:* eetwaar, waaronder tevens begrepen een kauwpreparaat, drinkwaar alsmede een andere roerende zaak, voor
      zover gebruikt in de sfeer van de particuliere huishouding of van een krachtens de Warenwet daarmee gelijkgestelde
      andere huishouding;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.w
    text: |-
      *vervoersexploitant:* een natuurlijke of rechtspersoon die verantwoordelijk is voor een schip of luchtvaartuig
      dat een internationale reis maakt waarbij gebruik wordt gemaakt van een haven of luchthaven, of diens
      vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.x
    text: |-
      *laboratorium:* een laboratorium waar van het menselijk lichaam afgescheiden of afgenomen stoffen worden onderzocht
      ten behoeve van de diagnostiek van infectieziekten;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.y
    text: |-
      *samenwerkingsverband van registerloodsen:* het voor de desbetreffende scheepvaartweg, bedoeld in
      [artikel 10, eerste lid, van de Scheepvaartverkeerswet][ref1], aangewezen samenwerkingsverband van registerloodsen,
      waarin krachtens [artikel 15, eerste lid, onderdeel b, onder 2, van de Loodsenwet][ref2], is voorzien;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel15
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004365
        artikel: '15'
  - number: 1.z
    text: |-
      *burgerservicenummer:* het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 1.aa
    text: |-
      *RIVM:* het Rijksinstituut voor volksgezondheid en milieu van het Ministerie van Volksgezondheid, Welzijn en Sport,
      bedoeld in [artikel 1, onderdeel b, van de Wet op het RIVM][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel1
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '1'
  - number: 1.ab
    text: |-
      *voorzitter van de veiligheidsregio:* de voorzitter van het bestuur van de veiligheidsregio, bedoeld in
      [artikel 11, tweede lid, van de Wet veiligheidsregio’s][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel11
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '11'
  - number: 1.ac
    text: '*inspectie:* de Inspectie gezondheidszorg en jeugd;'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: 1.ac
    text: |-
      *referentielaboratorium:* een laboratorium dat naar de laatste stand van de wetenschap gespecialiseerd is in de
      diagnostiek, surveillance en behandeling dan wel bestrijding van een specifieke ziekte of ziekteverwekker.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel1
  - number: '2.1'
    text: |-
      Het college van burgemeester en wethouders bevordert de totstandkoming en de continuïteit van en de samenhang
      binnen de publieke gezondheidszorg en de afstemming ervan met de curatieve gezondheidszorg en de geneeskundige
      hulpverlening bij ongevallen en rampen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: '2.2'
    text: |-
      Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.a
    text: het verwerven van, op epidemiologische analyse gebaseerd, inzicht in de gezondheidssituatie van de bevolking,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.b
    text: |-
      het elke vier jaar, voorafgaand aan de opstelling van de nota gemeentelijke gezondheidsbeleid, bedoeld in
      [artikel 13, tweede lid][ref1], op landelijk gelijkvormige wijze verzamelen en analyseren van gegevens over deze
      gezondheidssituatie,


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel13
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '13'
        hoofdstuk: III
  - number: 2.2.c
    text: het bewaken van gezondheidsaspecten in bestuurlijke beslissingen,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.d
    text: |-
      het bijdragen aan opzet, uitvoering en afstemming van preventieprogramma’s, met inbegrip van programma’s voor de
      gezondheidsbevordering,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.e
    text: het bevorderen van medisch milieukundige zorg,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.f
    text: het bevorderen van technische hygiënezorg,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.g
    text: het bevorderen van psychosociale hulp bij rampen,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: 2.2.h
    text: het geven van prenatale voorlichting aan aanstaande ouders.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkzaamheden, bedoeld in het
      tweede lid, en kunnen met het oog op de in het eerste lid bedoelde taak regels worden gesteld over de verstrekking
      van niet tot een persoon herleidbare gegevens aan het college van burgemeester en wethouders door personen en
      instellingen werkzaam op het terrein van de gezondheidszorg en kan deze verstrekking verplicht worden gesteld.
      Voor zover het de gegevensverstrekking door personen en instellingen aan het college van burgemeester en wethouders
      betreft, bevat deze algemene maatregel van bestuur regels over de bescherming van de persoonlijke levenssfeer en de
      vergoeding van kosten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister bevordert de kwaliteit en doelmatigheid van de publieke gezondheidszorg en draagt zorg voor de
      instandhouding en verbetering van de landelijke ondersteuningsstructuur.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister bevordert interdepartementale en internationale samenwerking op het gebied van de publieke
      gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het verstrekken van niet tot
      een persoon herleidbare systematische informatie door het college van burgemeester en wethouders aan Onze Minister
      inzake de uitvoering van deze wet en kan deze verstrekking verplicht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel4
  - number: '5.1'
    text: Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de jeugdgezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: '5.2'
    text: |-
      Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.2.a
    text: |-
      het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van jeugdigen en van
      gezondheidsbevorderende en -bedreigende factoren,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.2.b
    text: het ramen van de behoeften aan zorg,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.2.c
    text: |-
      de vroegtijdige opsporing en preventie van specifieke stoornissen, met uitzondering van het perinatale onderzoek op
      phenylketonurie (PKU), congenitale hypothyroïdie (CHT) en adrenogenitaal syndroom (AGS),
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.2.d
    text: het geven van voorlichting, advies, instructie en begeleiding,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.2.e
    text: het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: '5.3'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat bij de uitvoering van de taak, bedoeld in het
      eerste lid, gebruik wordt gemaakt van:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5.3.a
    text: |-
      de gegevens uit het register onderwijsdeelnemers, bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel4
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0042012
        artikel: '4'
  - number: 5.3.b
    text: |-
      digitale gegevensopslag, onder bij regeling van Onze Minister te stellen eisen aan de daarbij
      te gebruiken software, voor zover het gaat om vastleggen van patiëntgegevens als bedoeld in
      [artikel 7:454 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
  - number: '5.4'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat het bestand met de gegevens uit het register
      onderwijsdeelnemers, bedoeld in het derde lid, onderdeel a, uiterlijk één maand na verkrijging wordt vernietigd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: '5.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de werkzaamheden, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5
  - number: 5a.1
    text: Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de ouderengezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2
    text: |-
      Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2.a
    text: |-
      het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van ouderen en van
      gezondheidsbevorderende en -bedreigende factoren;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2.b
    text: het ramen van de behoeften aan zorg;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2.c
    text: de vroegtijdige opsporing en preventie van specifieke stoornissen als comorbiditeit;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2.d
    text: het geven van voorlichting, advies, instructie en begeleiding;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.2.e
    text: het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: 5a.3
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkzaamheden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel5a
  - number: '6.1'
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de algemene
      infectieziektebestrijding, waaronder in ieder geval behoort:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
  - number: 6.1.a
    text: het nemen van algemene preventieve maatregelen op dit gebied,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
  - number: 6.1.b
    text: het bestrijden van tuberculose en seksueel overdraagbare aandoeningen, inclusief bron- en contactopsporing,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
  - number: 6.1.c
    text: |-
      bron- en contactopsporing bij meldingen als bedoeld in de [artikelen 21][ref1], [22][ref2], [25][ref3] en
      [26][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel26
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '26'
        hoofdstuk: V
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Het bestuur van de veiligheidsregio draagt zorg voor de voorbereiding op de bestrijding van een epidemie van een
      infectieziekte behorend tot groep A, alsmede op de bestrijding van een nieuw subtype humaan influenzavirus, waarbij
      ernstig gevaar voor de volksgezondheid bestaat.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
  - number: '6.3'
    text: |-
      De burgemeester geeft leiding aan de bestrijding van een epidemie van een infectieziekte, behorend tot groep B1,
      B2 of C, alsook de directe voorbereiding daarop en draagt zorg voor de toepassing van de maatregelen, bedoeld in
      [hoofdstuk V][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024705
        hoofdstuk: V
  - number: '6.4'
    text: |-
      De voorzitter van de veiligheidsregio draagt zorg voor de bestrijding van een epidemie van een infectieziekte
      behorend tot groep A, of een directe dreiging daarvan, en is dan ten behoeve van deze bestrijding bij uitsluiting
      bevoegd om toepassing te geven aan de [artikelen 34, vierde lid][ref1], [47][ref2], [51][ref3], [54][ref4],
      [55][ref5] of [56][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0024705#Artikel56
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '34'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '47'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0024705
        artikel: '56'
        hoofdstuk: V
        paragraaf: '6'
  - number: '6.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen de taken, bedoeld in het eerste, tweede, derde en vierde lid, nader
      worden uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6
  - number: 6a.1
    text: |-
      Voor bij algemene maatregel van bestuur aangewezen vectoren draagt Onze Minister, in afwijking van
      [artikel 6, eerste tot en met vierde lid][ref1], zorg voor maatregelen ter preventie van vestiging van dergelijke
      vectoren, waaronder het nemen van bestrijdingsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
  - number: 6a.2
    text: |-
      In gevallen waarin een spoedige voorziening krachtens [artikel 47a][ref1] in het belang van de volksgezondheid
      zo dringend geboden is dat de totstandkoming van een algemene maatregel van bestuur als bedoeld in het eerste
      lid niet kan worden afgewacht, kan bij regeling van Onze Minister een vector als bedoeld in het eerste lid worden
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel47a
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 47a
        hoofdstuk: V
        paragraaf: '5'
  - number: 6a.3
    text: |-
      De regeling, bedoeld in het tweede lid, vervalt zes maanden nadat zij in werking is getreden, of, indien binnen die
      termijn een algemene maatregel van bestuur ter vervanging van die regeling in werking is getreden, op het tijdstip
      waarop de maatregel in werking treedt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6a
  - number: 6b.1
    text: |-
      Bij algemene maatregel van bestuur wordt een vaccinatieprogramma vastgesteld, waarin wordt opgenomen welke groepen
      voor welke vaccinaties in aanmerking komen. Voor de openbare lichamen Bonaire, Sint Eustatius en Saba kan een
      afwijkend aanbod worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6b.2
    text: |-
      Onze Minister draagt via het RIVM zorg voor de regie op en de coördinatie van de uitvoering, alsmede de
      registratie, bewaking en evaluatie van het vaccinatieprogramma.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6b.3
    text: |-
      Het college van burgemeester en wethouders draagt mede zorg voor het deel van het vaccinatieprogramma dat daartoe
      bij algemene maatregel van bestuur is aangewezen. Het college draagt ervoor zorg dat deze wordt uitgevoerd door
      de organisatie, of onder verantwoordelijkheid van die organisatie, die voor het college de jeugdgezondheidszorg,
      bedoeld in [artikel 5][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 6b.4
    text: |-
      Het college van burgemeester en wethouders past bij de uitvoering van het vaccinatieprogramma de vaccins toe die
      door of vanwege het RIVM worden verstrekt. De vaccins blijven eigendom van het RIVM tot het moment van toediening.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6b.5
    text: |-
      Het college van burgemeester en wethouders draagt ervoor zorg dat aan het RIVM ten behoeve van de taken van
      het RIVM, bedoeld in het tweede lid, wordt gemeld welke organisatie voor de gemeente uitvoering geeft aan de
      vaccinaties.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6b.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de kwalitatieve en programmatische
      uitvoering van het deel van het vaccinatieprogramma, bedoeld in het derde lid. Voor de openbare lichamen Bonaire,
      Sint Eustatius en Saba kunnen voor de programmatische uitvoering afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6b.7
    text: |-
      De voordracht voor een krachtens het zesde lid vast te stellen algemene maatregel van bestuur wordt niet gedaan dan
      vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6b
  - number: 6ba.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van bindende onderdelen
      van EU-rechtshandelingen die direct of indirect zijn gebaseerd of mede zijn gebaseerd op artikel 21 van het Verdrag
      betreffende de werking van de Europese Unie en die het vrij verkeer van personen gedurende de epidemie van covid-
      19 betreffen. Onder deze regels worden mede verstaan regels over de noodzakelijke verwerking van persoonsgegevens,
      met inbegrip van persoonsgegevens over de gezondheid als bedoeld in artikel 9 van de Algemene verordening
      gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6ba.2
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van de EU-rechtshandelingen, bedoeld in het eerste lid,
      één of meer personen of organisaties worden aangewezen om op bij of krachtens algemene maatregel van bestuur te
      bepalen wijze taken te vervullen die voortvloeien uit deze EU-rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6ba.3
    text: |-
      De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan één week nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6ba.4
    text: |-
      Onze Minister kan indien de onmiddellijke inwerkingtreding nodig is, de in het eerste en tweede lid bedoelde regels
      bij ministeriële regeling stellen voor een termijn van ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6ba.5
    text: Dit artikel vervalt op 1 juli 2022 of op een bij koninklijk besluit te bepalen eerder tijdstip.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6ba.6
    text: |-
      Bij koninklijk besluit kan worden bepaald dat dit artikel op een later tijdstip vervalt. De voordracht voor dit
      koninklijk besluit wordt niet eerder gedaan dan twee weken nadat het ontwerp aan de beide Kamers der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6ba
  - number: 6c.1
    text: |-
      Het RIVM heeft, onverminderd het bepaalde bij of krachtens andere wetten, tot taak om namens Onze Minister
      werkzaamheden te verrichten bij de bestrijding van infectieziekten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6c
  - number: 6c.2
    text: |-
      Het RIVM verwerkt de persoonsgegevens waaronder gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van
      de Algemene verordening gegevensbescherming die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6c
  - number: 6c.3
    text: |-
      Het RIVM verwerkt op grond van het eerste lid slechts persoonsgegevens indien daarop pseudonimisering als bedoeld
      in artikel 4, onderdeel 5 van de Algemene verordening gegevensbescherming, is toegepast en vervolgens onafgebroken
      is gecontinueerd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6c
  - number: 6c.4
    text: |-
      Artikel 21, eerste lid, tweede volzin, van de Algemene verordening gegevensbescherming is bij de verwerking door
      het RIVM niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6c
  - number: 6c.5
    text: |-
      Voor zover het voor het RIVM noodzakelijk is om voor de taakuitvoering gebruik te maken van een
      referentielaboratorium zijn het tweede tot en met vierde lid van overeenkomstige toepassing op het
      referentielaboratorium.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6c
  - number: 6d.1
    text: |-
      In het kader van de taak van Onze Minister, bedoeld in [artikel 3, eerste lid][ref1] en
      [artikel 7, eerste lid][ref2], en voorts ter ondersteuning van de bron- en contactopsporing, bedoeld in
      [artikel 6, eerste lid, onder c][ref3], ter bestrijding van de epidemie van covid-19, veroorzaakt door het virus
      SARS-CoV-2 kan een notificatieapplicatie worden ingezet waarmee vroegtijdig zicht kan worden verkregen op een
      mogelijke infectie met dat virus door bij te houden welke gebruikers in elkaars nabijheid zijn geweest en hen in
      voorkomende gevallen te waarschuwen over een mogelijke infectie met het virus. Voor zover noodzakelijk kunnen Onze
      Minister en de gemeentelijke gezondheidsdiensten bij het beheer en de toepassing van deze notificatieapplicatie
      persoonsgegevens verwerken, waaronder persoonsgegevens over de gezondheid als bedoeld in artikel 9 van de Algemene
      verordening gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel6
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
  - number: 6d.2
    text: 'In het kader van de notificatieapplicatie worden uitsluitend de volgende gegevens verwerkt:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.1
    text: |-
      gepseudonimiseerde codes waarmee de nabijheid van gebruikers wordt bijgehouden en gebruikers in voorkomende
      gevallen worden gewaarschuwd voor een mogelijke infectie met het virus;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.2
    text: het pseudo mac-adres van gebruikers;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.3
    text: de duur van de nabijheid van gebruikers;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.4
    text: de afstand waarbinnen gebruikers in elkaars nabijheid waren;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.5
    text: de weging van het risico dat de betreffende gebruiker mogelijk geïnfecteerd is met het virus;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.6
    text: het ip-adres van gebruikers;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.7
    text: de eerste dag waarop een met het virus geïnfecteerde gebruiker ziekteverschijnselen vertoonde, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.2.8
    text: |-
      een validatiecode die wordt uitgewisseld met de betreffende gemeentelijke gezondheidsdienst zodat wordt gewaarborgd
      dat alleen de notificatieapplicatie van een daadwerkelijk met het virus geïnfecteerde gebruiker andere gebruikers
      kan waarschuwen over een mogelijke infectie met het virus.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.3
    text: 'De in het kader van de notificatieapplicatie verwerkte persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.3.a
    text: |-
      worden niet langer bewaard dan noodzakelijk is om gebruikers in voorkomende gevallen te kunnen waarschuwen over een
      mogelijke infectie met het virus en worden vervolgens onmiddellijk vernietigd;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.3.b
    text: zijn beveiligd tegen verlies en onrechtmatige verwerking, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.3.c
    text: |-
      worden niet voor andere doeleinden gebruikt dan de bestrijding van de epidemie van covid-19, veroorzaakt door het
      virus SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.4
    text: Onze Minister draagt zorg voor de inrichting en het beheer van de notificatieapplicatie.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.5
    text: |-
      Onze Minister is verwerkingsverantwoordelijke in de zin van artikel 4 van de Algemene verordening
      gegevensbescherming voor de verwerking van persoonsgegevens in het kader van de notificatieapplicatie.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.6
    text: |-
      In afwijking van het vijfde lid is voor de toepassing van de artikelen 12 tot en met 23 en 33 van de Algemene
      verordening gegevensbescherming de verwerkingsverantwoordelijke de gemeentelijke gezondheidsdienst van de
      verblijfplaats van betrokkene. De gemeentelijke gezondheidsdienst beslist binnen een maand op een verzoek van
      betrokkene betreffende de uitoefening van zijn rechten op grond van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.7
    text: 'Onze Minister maakt ten minste de volgende informatie toegankelijk voor de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.7.a
    text: |-
      de wijze waarop betrokkene bij de gemeentelijke gezondheidsdienst van zijn verblijfplaats een beroep kan doen op
      zijn rechten op grond van de artikelen 12 tot en met 23 en 33 van de Algemene verordening gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.7.b
    text: de contactgegevens van de gemeentelijke gezondheidsdienst van de verblijfplaats van betrokkene;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.7.c
    text: de wijze waarop betrokkene een klacht kan indienen bij de Autoriteit Persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.7.d
    text: |-
      de wijze van verwerking van gegevens in het kader van de notificatieapplicatie in beknopte en toegankelijke vorm en
      in duidelijke en eenvoudige taal.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.8
    text: |-
      Het is verboden een ander te verplichten tot het gebruik van de notificatieapplicatie dan wel enig ander
      vergelijkbaar digitaal middel. Onder dit verbod valt in ieder geval het gebruik van de applicatie of het middel,
      het delen van informatie daarvan, of het meedelen van het al dan niet hebben ontvangen van notificaties daarvan,
      als voorwaarde te stellen voor de toegang tot een gebouw of voorziening, het uitoefenen van arbeid, het gebruik
      maken van een dienst, de deelname aan enige vorm van intermenselijk contact, of het verkrijgen van enig voordeel.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.9
    text: |-
      De in het kader van de notificatieapplicatie verwerkte gegevens kunnen worden uitgewisseld met andere lidstaten
      van de Europese Unie die een vergelijkbare notificatieapplicatie gebruiken indien deze uitwisseling bijdraagt aan
      het doel vroegtijdig zicht te kunnen verkrijgen op een mogelijke infectie met het virus door bij te houden welke
      gebruikers in elkaars nabijheid zijn geweest en hen in voorkomende gevallen te waarschuwen over een mogelijke
      infectie met het virus.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.10
    text: |-
      Bij algemene maatregel van bestuur wordt in ieder geval de verwerkingsverantwoordelijke aangewezen voor de te
      onderscheiden delen van de gegevensverwerking die met toepassing van het negende lid plaatsvindt. De voordracht
      voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers
      van de Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: 6d.11
    text: |-
      Onze Minister draagt ervoor zorg dat het in het tweede lid, onderdeel 6, bedoelde ip-adres van gebruikers zo snel
      mogelijk wordt gescheiden van de overige gegevens. Teneinde herleidbaarheid uit te sluiten is het verboden dit
      gegeven voorts aan andere gegevens, waaronder de gegevens bedoeld in het tweede lid, te koppelen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel6d
  - number: '7.1'
    text: |-
      In de situatie, bedoeld in [artikel 6, vierde lid][ref1], geeft Onze Minister leiding aan de bestrijding en kan
      Onze Minister de voorzitter van de veiligheidsregio opdragen hoe de bestrijding ter hand te nemen, waaronder
      begrepen het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0024705
        hoofdstuk: V
  - number: '7.2'
    text: |-
      In afwijking van [artikel 6, derde lid][ref1], geeft Onze Minister leiding aan de bestrijding van een
      infectieziekte behorend tot groep B1 of B2, indien de burgemeester van een gemeente die het aangaat daartoe
      verzoekt. Onze Minister kan dan de burgemeester opdragen hoe de bestrijding ter hand te nemen, waaronder begrepen
      het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0024705
        hoofdstuk: V
  - number: '7.3'
    text: |-
      Onze Minister kan de burgemeester opdragen om, ter uitvoering van de aanbevelingen, bedoeld in de
      artikelen 15 en 16 van de Internationale Gezondheidsregeling, toepassing te geven aan de maatregelen,
      bedoeld in de [artikelen 51][ref1], [54][ref2] en [55][ref3], alsook om de maatregelen, bedoeld in
      [artikel 22a van de Wet op de lijkbezorging][ref4], toe te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0005009#Artikel22a
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '51'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0005009
        artikel: 22a
  - number: '7.4'
    text: |-
      Voordat toepassing wordt gegeven aan het eerste, tweede of derde lid, voert Onze Minister een bestuurlijk
      afstemmingsoverleg waarbij in ieder geval Onze Minister van Infrastructuur en Milieu en de veiligheidsregio’s of
      gemeenten die het aangaat, worden betrokken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
  - number: '7.5'
    text: |-
      Zodra toepassing wordt gegeven aan het eerste of tweede lid, informeert Onze Minister Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
  - number: '7.6'
    text: |-
      Indien toepassing wordt gegeven aan het eerste, tweede of derde lid, verstrekt de voorzitter van de
      veiligheidsregio of de burgemeester aan Onze Minister, indien deze daarom verzoekt, de gegevens die Onze Minister
      nodig heeft ter uitoefening van die taak.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel7
  - number: '8.1'
    text: |-
      Ter uitvoering van [artikel 6, tweede lid][ref1], past het bestuur van de veiligheidsregio de maatregelen toe die
      door Onze Minister worden opgedragen, indien het gaat om de voorbereiding op de bestrijding van:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
  - number: 8.1.a
    text: infectieziekten behorende tot groep A, of
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel8
  - number: 8.1.b
    text: een nieuw subtype humaan influenzavirus, waarbij ernstig gevaar voor de volksgezondheid bestaat.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel8
  - number: '8.2'
    text: |-
      Het bestuur van de veiligheidsregio beschrijft in het crisisplan, bedoeld in
      [artikel 16 van de Wet veiligheidsregio’s][ref1], de organisatie, de taken en bevoegdheden in het kader van de
      bestrijding van en de voorbereiding op de bestrijding van een epidemie van een infectieziekte behorend tot groep A,
      alsmede de voorbereiding op de bestrijding van een nieuw subtype humaan influenzavirus waarbij ernstig gevaar voor
      de volksgezondheid bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: '8.3'
    text: |-
      Het deel van het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1], dat betrekking heeft
      op bestrijding van en de voorbereiding op de bestrijding van een epidemie van een infectieziekte behorend tot groep
      A, alsmede de voorbereiding op de bestrijding van een nieuw subtype humaan influenzavirus waarbij ernstig gevaar
      voor de volksgezondheid bestaat, wordt vastgesteld in overeenstemming met het algemeen bestuur van de gemeentelijke
      gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: '9'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze
      Minister van Veiligheid en Justitie bepalen dat, in daarbij aangewezen gevallen, een andere burgemeester de taak,
      dan wel een bepaald deel van de taak, bedoeld in [artikel 6, derde lid][ref1], dient te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
  - number: '10'
    text: |-
      Onverminderd [artikel 7, eerste, tweede en derde lid][ref1], kunnen bij regeling van Onze Minister regels worden
      gesteld betreffende de door de burgemeester te treffen maatregelen ter bestrijding van een epidemie van een
      infectieziekte behorend tot groep B1, B2 of C.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel7
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
  - number: '11.1'
    text: |-
      Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      en Onze Minister van Veiligheid en Justitie, kunnen regels worden gesteld over de verdeling van vaccins en
      therapeutische farmaproducten, indien er een beperkte beschikbaarheid is van deze middelen en ten behoeve van de
      bestrijding van een infectieziekte behorend tot groep A prioriteiten moeten worden gesteld voor de verdeling ervan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel11
  - number: '11.2'
    text: Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld op de hoogte van de vastgestelde regeling.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister draagt ervoor zorg dat aan de informatieverplichtingen, voortvloeiende uit de Internationale
      Gezondheidsregeling, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel12
  - number: 12a.1
    text: |-
      Onze Minister draagt via het RIVM zorg voor de regie op en de coördinatie van de uitvoering, alsmede de
      registratie, bewaking en evaluatie van het bij algemene maatregel van bestuur aangewezen bevolkingsonderzoek,
      waaronder de neonatale hielprikscreening. Voor de openbare lichamen Bonaire, Sint Eustatius en Saba kan een
      afwijkend aanbod worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel12a
  - number: 12a.2
    text: |-
      Bij de uitvoering van de neonatale hielprikscreening kan de betrokken opvolgend kinderarts, indien dit noodzakelijk
      is vanwege de urgentie van de aansluitende zorg door deze arts, de gegevens betreffende een kind tot de leeftijd
      van zes maanden raadplegen zonder daarvoor toestemming te vragen. De toestemming wordt alsnog gevraagd zodra
      daartoe gelegenheid is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel12a
  - number: 12a.3
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de uitvoering van het bevolkingsonderzoek, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel12a
  - number: '13.1'
    text: |-
      Onze Minister stelt elke vier jaar een landelijke nota gezondheidsbeleid en een landelijk programma voor uitvoering
      van onderzoek vast op het gebied van de publieke gezondheid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
  - number: '13.2'
    text: |-
      De gemeenteraad stelt binnen twee jaar na openbaarmaking van de nota, bedoeld in het eerste lid, een nota
      gemeentelijk gezondheidsbeleid vast, waarin de raad in ieder geval aangeeft:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
  - number: 13.2.a
    text: |-
      wat de gemeentelijke doelstellingen zijn ter uitvoering van de in de [artikelen 2][ref1], [5][ref2], [5a][ref3] en
      [6][ref4] genoemde taken,


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel5a
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel6
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 5a
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '6'
        hoofdstuk: II
        paragraaf: '4'
  - number: 13.2.b
    text: welke acties in de bestreken periode worden ondernomen ter realisering van deze doelstellingen,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
  - number: 13.2.c
    text: welke resultaten de gemeente in die periode wenst te behalen,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
  - number: 13.2.d
    text: |-
      hoe het college van burgemeester en wethouders uitvoering geeft aan de in [artikel 16][ref1] genoemde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel16
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '16'
        hoofdstuk: IV
  - number: '13.3'
    text: |-
      De gemeenteraad neemt bij het vaststellen van de nota gemeentelijk gezondheidsbeleid in ieder geval de landelijke
      prioriteiten in acht, zoals opgenomen in de landelijke nota gezondheidsbeleid.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel13
  - number: '14.1'
    text: |-
      Ter uitvoering van bij of krachtens deze wet opgedragen taken dragen de colleges van burgemeester en wethouders
      van gemeenten die behoren tot een regio als bedoeld in de [Wet veiligheidsregio’s][ref1], via het treffen van
      een gemeenschappelijke regeling zorg voor de instelling en instandhouding van een regionale gezondheidsdienst in
      die regio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0027466
  - number: '14.2'
    text: |-
      Bij de regeling, bedoeld in het eerste lid, wordt een openbaar lichaam ingesteld met de aanduiding: gemeentelijke
      gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel14
  - number: '14.3'
    text: |-
      De gemeentelijke gezondheidsdienst staat onder leiding van een directeur publieke gezondheid, die wordt benoemd
      door het algemeen bestuur van de gemeentelijke gezondheidsdienst in overeenstemming met het bestuur van de
      veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel14
  - number: '14.4'
    text: |-
      Met inachtneming van bij algemene maatregel van bestuur te stellen regels, staat het het college
      van burgemeester en wethouders vrij om de uitvoering van de taken of onderdelen van taken, bedoeld
      in de [artikelen 2, tweede lid, onder h][ref1], [5, tweede lid, onder a tot en met d][ref2], en
      [artikel 6b, derde lid][ref3], over te laten of mede over te laten aan een ander dan de gemeentelijke
      gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel6b
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 6b
        hoofdstuk: II
        paragraaf: '4'
  - number: '14.5'
    text: |-
      In afwijking van het eerste lid kan een regionale gezondheidsdienst worden ingesteld en in stand gehouden
      door de colleges van burgemeester en wethouders van de gemeenten in twee of meer regio’s als bedoeld in de
      [Wet veiligheidsregio’s][ref1]. In dat geval geschiedt de benoeming, bedoeld in het derde lid, in overeenstemming
      met de besturen van de betrokken veiligheidsregio’s, en draagt het algemeen bestuur van de gemeentelijke
      gezondheidsdienst ervoor zorg dat in elk der regio’s adequaat wordt voorzien in de operationele leiding van de
      geneeskundige hulpverlening, bedoeld in [artikel 32, tweede lid, van de Wet veiligheidsregio’s][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel32
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0027466
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '32'
  - number: '15.1'
    text: |-
      Het college van burgemeester en wethouders draagt er zorg voor dat de gemeentelijke gezondheidsdienst beschikt over
      deskundigen op de volgende terreinen:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: 15.1.a
    text: sociale geneeskunde,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: 15.1.b
    text: epidemiologie,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: 15.1.c
    text: sociale verpleegkunde,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: 15.1.d
    text: gezondheidsbevordering, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: 15.1.e
    text: gedragswetenschappen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: '15.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het opleidingsniveau of de
      deskundigheid waarover de deskundigen dienen te beschikken. Deze eisen kunnen verschillen naar gelang de taken van
      de gemeentelijke gezondheidsdienst waarvoor de deskundigen worden ingezet.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel15
  - number: '16'
    text: |-
      Voordat besluiten worden genomen die belangrijke gevolgen kunnen hebben voor de publieke gezondheidszorg vraagt het
      college van burgemeester en wethouders advies aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel16
  - number: '17'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder gemeentelijke gezondheidsdienst: een door de directeur
      publieke gezondheid van de gemeentelijke gezondheidsdienst aangewezen arts in dienst van de gemeentelijke
      gezondheidsdienst die gespecialiseerd is in infectieziektebestrijding.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel17
  - number: '18'
    text: |-
      Voordat de burgemeester dan wel de voorzitter van de veiligheidsregio een maatregel als bedoeld in de
      [artikelen 31][ref1], [35][ref2], [38][ref3], [47][ref4], [53][ref5], [54][ref6] of [55][ref7] neemt of intrekt,
      vraagt deze om advies aan de gemeentelijke gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel53
      [ref6]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref7]: https://wetten.overheid.nl/BWBR0024705#Artikel55
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '38'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '47'
        hoofdstuk: V
        paragraaf: '5'
      - id: ref5
        bwb_id: BWBR0024705
        artikel: '53'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref7
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
  - number: '19'
    text: Bij algemene maatregel van bestuur worden de infectieziekten behorende tot groep C aangewezen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel19
  - number: '20.1'
    text: |-
      Indien het belang van de volksgezondheid dat vordert en in overeenstemming met het gevoelen van de ministerraad,
      kan bij regeling van Onze Minister een infectieziekte, niet behorend tot groep A, B1, B2 of C, dan wel een
      ziektebeeld met een volgens de stand van de wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van
      besmettelijkheid en ernstig gevaar voor de volksgezondheid, worden aangemerkt als behorend tot groep A, B1 of B2.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel20
  - number: '20.2'
    text: |-
      Indien het belang van de volksgezondheid dat vordert, kan, in overeenstemming met het gevoelen van de ministerraad,
      bij regeling van Onze Minister een infectieziekte behorend tot groep B1 worden aangemerkt als behorend tot groep
      A, een infectieziekte behorend tot groep B2 worden aangemerkt als behorend tot groep A of B1, of een infectieziekte
      behorend tot groep C worden aangemerkt als behorend tot groep A, B1 of B2.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel20
  - number: '20.3'
    text: |-
      In de regeling, bedoeld in het eerste of tweede lid, wordt bepaald welke bepalingen van deze wet, die gelden voor
      de infectieziekten behorende tot de desbetreffende groep, in dat geval van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel20
  - number: '20.4'
    text: |-
      Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde regeling wordt binnen acht weken
      een voorstel van wet tot incorporatie van die regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het
      voorstel van wet wordt ingetrokken of door een der Kamers der Staten-Generaal wordt verworpen, wordt de regeling
      onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel20
  - number: '20.5'
    text: |-
      Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze
      Minister bepalen dat een op grond van het eerste of tweede lid vastgestelde regeling onmiddellijk
      na bekendmaking in werking treedt. In dat geval kan Onze Minister deze regeling, in afwijking van
      [artikel 5, aanhef en onder a, van de Bekendmakingswet][ref1], op andere dan de daar genoemde wijze bekendmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel5
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '5'
  - number: '21.1'
    text: |-
      De arts die bij een door hem onderzocht persoon een ziektebeeld vaststelt met een volgens de stand van de
      wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van besmettelijkheid en ernstig gevaar voor de
      volksgezondheid, meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel21
  - number: '21.2'
    text: |-
      De arts die vaststelt dat een lijk is besmet met een infectueus of giftig agens of een infectueuze of giftige
      stof waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, meldt dit onverwijld aan de gemeentelijke
      gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel21
  - number: '21.3'
    text: |-
      De arts die een voor zijn praktijk ongewoon aantal gevallen vaststelt van een infectieziekte, niet behorend tot
      groep A, B1, B2 of C, die een gevaar vormt voor de volksgezondheid, meldt dit binnen 24 uur aan de gemeentelijke
      gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel21
  - number: '22.1'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep A vermoedt of vaststelt,
      meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel22
  - number: '22.2'
    text: |-
      De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep B1, B2 of C vaststelt, dan
      wel een vermoeden heeft dat deze persoon lijdt aan difterie, een humane infectie veroorzaakt door een dierlijk
      influenzavirus of rabies, meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel22
  - number: '22.3'
    text: |-
      De arts die gegronde redenen heeft om bij een persoon een infectieziekte behorend tot groep B1 of B2 te vermoeden,
      meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst, indien die persoon weigert het onderzoek te
      ondergaan dat noodzakelijk is ter vaststelling van die ziekte en daardoor ernstig gevaar voor de volksgezondheid
      door de verspreiding van die infectieziekte kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel22
  - number: '22.4'
    text: |-
      Bij regeling van Onze Minister kan vrijstelling worden verleend van de meldingsplicht, bedoeld in het eerste,
      tweede en derde lid, met ingang van een daarbij te bepalen tijdstip en met inachtneming van daarbij te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel22
  - number: '23.1'
    text: |-
      De arts doet de in de [artikelen 21][ref1] en [22][ref2] bedoelde meldingen aan de gemeentelijke gezondheidsdienst
      van de gemeente waarin deze zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '23.2'
    text: |-
      Indien de meldingen, bedoeld in de [artikelen 21, eerste lid][ref1], en [22][ref2], betrekking hebben op een
      persoon die zijn verblijfplaats heeft in een andere gemeente, geeft de gemeentelijke gezondheidsdienst deze melding
      onverwijld door aan de gemeentelijke gezondheidsdienst van de verblijfplaats van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.1'
    text: |-
      De melding, bedoeld in de [artikelen 21, eerste lid][ref1], en [22][ref2], bevat de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: 24.1.a
    text: |-
      de naam, het adres, het geslacht, de geboortedatum, het burgerservicenummer en de verblijfplaats van de betrokken
      persoon,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
  - number: 24.1.b
    text: |-
      de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, de vermoedelijke infectiebron, de datum van vermoeden of vaststelling van infectie, de
      wijze van vaststelling van die infectieziekte, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
  - number: 24.1.c
    text: |-
      indien nodig, of de betrokken persoon dan wel een persoon in zijn directe omgeving beroeps- of bedrijfsmatig
      betrokken is bij de behandeling van eet- of drinkwaren of bij de behandeling, verpleging of verzorging van andere
      personen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
  - number: '24.2'
    text: |-
      De melding, bedoeld in [artikel 21, tweede lid][ref1], bevat de volgende gegevens: de aard van het infectueus of
      giftig agens of de infectueuze of giftige stof en de plaats waar het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.3'
    text: |-
      De melding, bedoeld in [artikel 21, derde lid][ref1], bevat de volgende gegevens: de infectieziekte, het geslacht,
      de geboortedatum en de nationaliteit van de betrokken personen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '24.4'
    text: |-
      De arts verstrekt aan de gemeentelijke gezondheidsdienst uitsluitend andere medische gegevens over de betrokken
      persoon indien:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
  - number: 24.4.a
    text: |-
      de burgemeester hierom verzoekt krachtens [artikel 30][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel30
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: 24.4.b
    text: de betrokken persoon daarvoor toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
  - number: '24.5'
    text: |-
      Voor de beveiliging van de gegevensverwerking bij de meldingen, bedoeld in de [artikelen 21][ref1] en [22][ref2],
      worden bij regeling van Onze Minister regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '25.1'
    text: |-
      De arts die een onderzoek bij een laboratorium aanvraagt, stuurt de volgende gegevens mee: de naam, de
      geboortedatum en het burgerservicenummer van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '25.2'
    text: |-
      Onverminderd [artikel 22][ref1] meldt het hoofd van het laboratorium de vaststelling van een verwekker van een
      infectieziekte behorend tot groep A, B1, B2 of C aan de gemeentelijke gezondheidsdienst van de gemeente waarin de
      arts die het onderzoek bij het laboratorium heeft aangevraagd zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '25.3'
    text: |-
      De melding bevat de volgende gegevens: de naam van de arts, de naam, de geboortedatum en het burgerservicenummer
      van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de melding betrekking heeft op een persoon die zijn verblijfplaats heeft in een andere gemeente, geeft
      de gemeentelijke gezondheidsdienst deze melding onverwijld door aan de gemeentelijke gezondheidsdienst van de
      verblijfplaats van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '25.5'
    text: |-
      Het hoofd van het laboratorium zorgt op verzoek van de gemeentelijke gezondheidsdienst ervoor dat nader onderzoek
      wordt gedaan naar de ziekteverwekker en dat de gemeentelijke gezondheidsdienst van het resultaat op de hoogte wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '25.6'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de wijze waarop en de termijn waarbinnen
      de melding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '25.7'
    text: |-
      Voor de beveiliging van de gegevensverwerking bij de aanvraag, bedoeld in het eerste lid, en de melding worden bij
      regeling van Onze Minister regels gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel25
  - number: '26.1'
    text: |-
      Het hoofd van een instelling waar voor infectieziekten kwetsbare populaties verblijven of samenkomen voor een of
      meer dagdelen per etmaal, stelt de gemeentelijke gezondheidsdienst van de gemeente waarin de instelling gelegen
      is, op de hoogte van het optreden van een ongewoon aantal zieken met maag- en darmaandoeningen, geelzucht,
      huidaandoeningen of andere ernstige aandoeningen van vermoedelijk infectueuze aard in de desbetreffende populatie
      of bij het begeleidend of verzorgend personeel.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel26
  - number: '26.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop en de termijn waarbinnen de
      berichtgeving plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel26
  - number: '27.1'
    text: |-
      De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 22, eerste lid][ref1], onverwijld door aan de voorzitter van de veiligheidsregio en de burgemeester van de
      gemeente waarin de betrokken persoon zijn woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.2'
    text: |-
      De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 21, eerste lid][ref1], onverwijld door aan de burgemeester van de gemeente waarin de betrokken persoon
      zijn woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.3'
    text: |-
      De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 21, tweede lid][ref1], onverwijld door aan de burgemeester van de gemeente waarin het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.4'
    text: |-
      De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in [artikel 21, derde lid][ref1],
      zo spoedig mogelijk mee aan de burgemeester van de gemeente waarin de arts zijn praktijk heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.5'
    text: |-
      De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in
      [artikel 22, tweede en derde lid][ref1], zo spoedig mogelijk mee aan de burgemeester van de gemeente waarin de
      betrokken persoon zijn woon- of verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.6'
    text: |-
      De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in [artikel 26][ref1] binnen een
      redelijke termijn mee aan de burgemeester van de gemeente waarin de instelling is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel26
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '26'
        hoofdstuk: V
        paragraaf: '2'
  - number: '27.7'
    text: |-
      De gemeentelijke gezondheidsdienst verstrekt de burgemeester dan wel de voorzitter van de veiligheidsregio de
      gegevens, bedoeld in [artikel 24, eerste, tweede en derde lid][ref1], die deze nodig heeft voor de uitoefening van
      de hem bij deze wet toegekende bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel24
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
  - number: '28.1'
    text: |-
      De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in de
      [artikelen 21, eerste en tweede lid][ref1], en [22, eerste lid][ref2], onverwijld door aan het RIVM.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '28.2'
    text: |-
      De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in de
      [artikelen 21, derde lid][ref1], en [22, tweede en derde lid][ref2], binnen 24 uur door aan het RIVM.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: '28.3'
    text: |-
      De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in de [artikelen 21, eerste lid][ref1], en
      [22][ref2] de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: 28.3.a
    text: |-
      de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, eventuele ziekenhuisopname, de vermoedelijke infectiebron, zonodig met inbegrip van de
      daaruit voortkomende gevallen, de datum van vermoeden of vaststelling van infectie,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
  - number: 28.3.b
    text: |-
      het geslacht, de geboortemaand en het geboortejaar van de betrokken persoon, alsmede de eerste drie cijfers van de
      postcode van diens adres, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
  - number: 28.3.c
    text: |-
      de uitslag van het nader onderzoek, bedoeld in [artikel 25, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel25
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
  - number: '28.4'
    text: |-
      De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in [artikel 21, tweede lid][ref1], de
      volgende gegevens: de aard van het infectueus of giftig agens of de infectueuze of giftige stof en de plaats waar
      het lijk zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '28.5'
    text: |-
      De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in [artikel 21, derde lid][ref1], de
      volgende gegevens: de infectieziekte, het geslacht, de geboortedatum en de nationaliteit van de betrokken personen,
      alsmede de woonplaats van de arts die de melding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '21'
        hoofdstuk: V
        paragraaf: '2'
  - number: '29.1'
    text: |-
      De gemeentelijke gezondheidsdienst neemt de persoonsgegevens, die ingevolge de [artikelen 24][ref1], [25][ref2], en
      [30][ref3] zijn verkregen, op in een door hem gehouden registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel30
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '24'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '25'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '30'
        hoofdstuk: V
        paragraaf: '3'
  - number: '29.2'
    text: De gemeentelijke gezondheidsdienst bewaart deze gegevens ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel29
  - number: '30'
    text: |-
      Op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio verstrekt de behandelend arts van een
      persoon die naar het oordeel van de burgemeester dan wel de voorzitter van de veiligheidsregio een gevaar oplevert
      voor de overbrenging van een infectieziekte behorend tot groep A, B1 of B2 aan de gemeentelijke gezondheidsdienst
      zo spoedig mogelijk de hem bekende nadere medische en epidemiologische gegevens die noodzakelijk zijn om de aard en
      de omvang van het gevaar van verspreiding van de infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel30
  - number: '31.1'
    text: |-
      De voorzitter van de veiligheidsregio kan een persoon onverwijld ter isolatie in een ziekenhuis doen opnemen,
      indien:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.1.a
    text: |-
      de betrokkene lijdt aan een infectieziekte behorend tot groep A, dan wel de voorzitter van de veiligheidsregio
      gegronde redenen heeft om aan te nemen dat de betrokkene daaraan lijdt,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.1.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.1.c
    text: dit gevaar niet op andere wijze effectief kan worden afgewend, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.1.d
    text: de betrokkene niet tot opneming ter isolatie bereid is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: '31.2'
    text: 'De burgemeester kan een persoon onverwijld ter isolatie in een ziekenhuis doen opnemen, indien:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.2.a
    text: |-
      ten aanzien van de betrokkene de melding ingevolge [artikel 22, derde lid][ref1], heeft plaatsgevonden, of de
      betrokkene lijdt aan een infectieziekte behorend tot groep B1,


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '22'
        hoofdstuk: V
        paragraaf: '2'
  - number: 31.2.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.2.c
    text: dit gevaar niet op andere wijze effectief kan worden afgewend, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.2.d
    text: de betrokkene niet tot opneming ter isolatie bereid is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: '31.3'
    text: |-
      De voorzitter van de veiligheidsregio dan wel de burgemeester kan een ter isolatie opgenomen persoon door een arts
      doen onderzoeken, indien:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.3.a
    text: ten gevolge van de infectieziekte onmiddellijk gevaar dreigt voor de gezondheid van derden,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.3.b
    text: de aard en de omvang van dit gevaar niet op andere wijze dan door onderzoek kunnen worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.3.c
    text: de uitkomst van het onderzoek noodzakelijk is om dit gevaar effectief te kunnen afwenden, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: 31.3.d
    text: de betrokkene niet bereid is het onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: '31.4'
    text: |-
      De voorzitter van de veiligheidsregio dan wel de burgemeester kan een ter isolatie opgenomen persoon door een
      arts in het lichaam doen onderzoeken indien aan de voorwaarden, bedoeld in het derde lid, is voldaan en de rechter
      daartoe een machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: '31.5'
    text: |-
      Het onderzoek, bedoeld in het derde en vierde lid, omvat niet meer dan nodig is ter afwending van het gevaar voor
      derden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel31
  - number: '32.1'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio doet de beschikking tot opneming ter isolatie aan de
      betrokkene uitreiken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel32
  - number: '32.2'
    text: |-
      In de beschikking geeft de burgemeester dan wel de voorzitter van de veiligheidsregio aan in welk ziekenhuis,
      aangewezen op grond van [artikel 34][ref1], de opneming ter isolatie ten uitvoer wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel34
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '34'
        hoofdstuk: V
        paragraaf: '3'
  - number: '32.3'
    text: |-
      Na uitreiking van de beschikking voorziet de burgemeester dan wel de voorzitter van de veiligheidsregio in bijstand
      van de betrokkene door een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel32
  - number: '32.4'
    text: |-
      Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in
      [artikel 31, eerste lid, onder b, of tweede lid, onder b][ref1], is geweken of op minder ingrijpende wijze kan
      worden afgewend, heft de burgemeester dan wel de voorzitter van de veiligheidsregio de opneming ter isolatie
      onverwijld op.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '33.1'
    text: |-
      De voorzitter van de veiligheidsregio dan wel de burgemeester doet de beschikking tot het onderzoek, bedoeld in
      [artikel 31, vierde lid][ref1], aan de betrokkene uitreiken.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '33.2'
    text: |-
      In zijn beschikking geeft de voorzitter van de veiligheidsregio dan wel de burgemeester aan waaruit het onderzoek
      bestaat, welke arts het onderzoek verricht en binnen welke termijn het onderzoek plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel33
  - number: '34.1'
    text: |-
      De opneming ter isolatie wordt ten uitvoer gelegd in een gesloten afdeling van een door Onze Minister aangewezen
      ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel34
  - number: '34.2'
    text: Het ziekenhuis neemt de betrokkene onverwijld op.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel34
  - number: '34.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen eisen worden gesteld waaraan de opneming ter isolatie en het onderzoek
      moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel34
  - number: '34.4'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het opleggen van een last onder
      bestuursdwang ter handhaving van het bepaalde in het eerste, tweede en derde lid, indien de omstandigheden
      onmiddellijk ingrijpen noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel34
  - number: '35.1'
    text: |-
      De voorzitter van de veiligheidsregio kan een persoon onverwijld doen onderwerpen aan de maatregel van quarantaine
      om de verspreiding van infectieziekten behorend tot groep A tegen te gaan, indien:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: 35.1.a
    text: |-
      er redenen zijn om aan te nemen dat die persoon recentelijk een dusdanig contact met een lijder of een
      vermoedelijke lijder aan een infectieziekte behorend tot groep A heeft gehad, dat deze persoon mogelijk met
      dezelfde ziekte is geïnfecteerd,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: 35.1.b
    text: ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: 35.1.c
    text: die persoon niet tot vrijwillige onderwerping aan die maatregel bereid is.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: '35.2'
    text: |-
      De voorzitter van de veiligheidsregio kan toestaan dat de quarantaine onder zonodig te stellen voorwaarden
      plaatsvindt in de woning van de af te zonderen persoon.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: '35.3'
    text: |-
      Tijdens de quarantaine wordt medisch toezicht verricht. Het toezicht wordt verricht onder medische
      verantwoordelijkheid van een door de gemeentelijke gezondheidsdienst aangewezen geneeskundige.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: '35.4'
    text: |-
      De quarantaine en het medisch toezicht vinden plaats onder zodanige voorwaarden en omstandigheden en gedurende
      een zodanige periode als noodzakelijk is om het gevaar, bedoeld in het eerste lid, onder b, af te wenden. Zodra
      redelijkerwijs kan worden aangenomen dat dit gevaar is geweken of op minder ingrijpende wijze kan worden afgewend,
      heft de voorzitter van de veiligheidsregio de maatregel onverwijld op.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
  - number: '35.5'
    text: |-
      [Artikel 31, derde en vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '36.1'
    text: |-
      De voorzitter van de veiligheidsregio doet de beschikking tot onderwerping aan de maatregel van quarantaine aan de
      betrokkene uitreiken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: '36.2'
    text: 'In de beschikking geeft de voorzitter van de veiligheidsregio aan:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: 36.2.a
    text: hoe en waar de maatregel ten uitvoer wordt gelegd,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: 36.2.b
    text: waarop bij het medisch toezicht in ieder geval wordt gelet, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: 36.2.c
    text: aan welke regels betrokkene zich heeft te houden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: '36.3'
    text: |-
      Na uitreiking van de beschikking voorziet de voorzitter van de veiligheidsregio in bijstand van de betrokkene door
      een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel36
  - number: '37'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio draagt de tenuitvoerlegging van de maatregelen,
      bedoeld in de [artikelen 31][ref1] en [35][ref2] op aan de gemeentelijke gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '38.1'
    text: |-
      De voorzitter van de veiligheidsregio kan een persoon die gevaar oplevert voor de verspreiding van een
      infectieziekte behorend tot groep A het verbod opleggen om beroeps- of bedrijfsmatig werkzaamheden te verrichten,
      die een ernstig risico inhouden voor de verspreiding van die infectieziekte.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel38
  - number: '38.2'
    text: |-
      De burgemeester kan een persoon die gevaar oplevert voor de verspreiding van een infectieziekte behorend tot groep
      B1 of B2 het verbod opleggen om beroeps- of bedrijfsmatig werkzaamheden te verrichten, die een ernstig risico
      inhouden voor de verspreiding van die infectieziekte.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel38
  - number: '38.3'
    text: |-
      Voordat de maatregel wordt genomen, hoort de burgemeester dan wel de voorzitter van de veiligheidsregio de
      werkgever van de betrokkene, tenzij betrokkene hiertegen bezwaar maakt.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel38
  - number: '38.4'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio heft de maatregel op als het gevaar is geweken of op
      minder ingrijpende wijze kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel38
  - number: '39.1'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio stelt de officier van justitie terstond op de
      hoogte van de beschikking tot opneming ter isolatie, bedoeld in [artikel 31, eerste of tweede lid][ref1] van de
      beschikking tot het onderzoek, bedoeld in [artikel 31, vierde lid][ref2], en van de beschikking een persoon te
      onderwerpen aan de maatregel van quarantaine, bedoeld in [artikel 35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '39.2'
    text: |-
      Zo spoedig mogelijk nadat de beschikking is gegeven, maar in elk geval niet later dan de volgende dag, zendt
      de burgemeester dan wel de voorzitter van de veiligheidsregio de officier van justitie een afschrift van de
      beschikking.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel39
  - number: '39.3'
    text: |-
      Ingeval van een beschikking tot opneming ter isolatie als bedoeld in [artikel 31, eerste of tweede lid][ref1] en
      van een beschikking tot het onderzoek als bedoeld in [artikel 31, vierde lid][ref2], is de rechtbank van de plaats
      waar het aangewezen ziekenhuis is gelegen bevoegd. Ingeval van een beschikking een persoon te onderwerpen aan de
      maatregel van quarantaine, bedoeld in [artikel 35][ref3], is de rechtbank van de verblijfplaats van betrokkene
      bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '40.1'
    text: |-
      Indien de officier van justitie van oordeel is dat aan de voorwaarden voor de opneming ter isolatie, bedoeld in
      [artikel 31, eerste of tweede lid][ref1] het onderzoek, bedoeld in [artikel 31, vierde lid][ref2], of de maatregel
      van quarantaine, bedoeld in [artikel 35][ref3], is voldaan, doet hij uiterlijk op de dag na de datum van ontvangst
      van de beschikking een verzoek tot een machtiging tot voortzetting van de isolatie, de quarantaine of tot het
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '40.2'
    text: |-
      De officier van justitie deelt aan de betrokkene, de burgemeester dan wel de voorzitter van de veiligheidsregio en
      in voorkomend geval het ziekenhuis, schriftelijk mede dat hij het verzoek heeft gedaan of dat hij heeft besloten om
      geen verzoek te doen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel40
  - number: '40.3'
    text: |-
      Het besluit geen verzoek te doen neemt de officier van justitie niet dan nadat hij het advies van de inspecteur-
      generaal van de inspectie heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel40
  - number: '40.4'
    text: |-
      Met het besluit geen verzoek te doen, vervalt de beschikking tot opneming ter isolatie, bedoeld
      in [artikel 31, eerste of tweede lid][ref1] de beschikking tot het onderzoek, bedoeld in
      [artikel 31, vierde lid][ref2], of de beschikking een persoon te onderwerpen aan de maatregel van quarantaine,
      bedoeld in [artikel 35][ref3], van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '41.1'
    text: |-
      Voordat op het verzoek van de officier van justitie wordt besloten, hoort de rechter degene ten aanzien van wie de
      maatregel is gevorderd.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '41.2'
    text: De rechter hoort de betrokkene op zijn verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '41.3'
    text: De rechter kan zich laten voorlichten, getuigen en deskundigen oproepen en onderzoek door deskundigen bevelen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '41.4'
    text: De rechter stelt de raadsman in de gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '41.5'
    text: De rechter beslist binnen drie dagen, te rekenen vanaf de dag na die van het instellen van de vordering.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '41.6'
    text: Tegen de beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel41
  - number: '42.1'
    text: |-
      De ter isolatie opgenomen persoon of de in quarantaine geplaatste persoon kan de rechter verzoeken de maatregel op
      te heffen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel42
  - number: '42.2'
    text: |-
      [Artikel 41, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel41
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '41'
        hoofdstuk: V
        paragraaf: '4'
  - number: '42.3'
    text: |-
      De rechter kan het verzoek zonder toepassing van [artikel 41][ref1] afwijzen, indien geen nieuwe feiten of
      omstandigheden worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel41
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '41'
        hoofdstuk: V
        paragraaf: '4'
  - number: '43.1'
    text: |-
      Degene ten aanzien van wie een beschikking tot opneming ter isolatie als bedoeld in
      [artikel 31, eerste of tweede lid][ref1] tot onderzoek als bedoeld in [artikel 31, derde of vierde lid][ref2],
      of tot onderwerping aan een maatregel van quarantaine als bedoeld in [artikel 35][ref3] is
      genomen, kan de rechter bij een zelfstandig verzoek bij een verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van de betrokkene, dan wel, indien de officier van justitie geen
      verzoek als bedoeld in [artikel 40, eerste lid][ref5], doet, bij een afzonderlijk verzoekschrift, verzoeken een
      naar billijkheid vast te stellen schadevergoeding toe te kennen op de grond dat de beschikking van de burgemeester
      dan wel de voorzitter van de veiligheidsregio onrechtmatig was.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel282
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel40
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '282'
      - id: ref5
        bwb_id: BWBR0024705
        artikel: '40'
        hoofdstuk: V
        paragraaf: '4'
  - number: '43.2'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '44.1'
    text: |-
      Indien degene ten aanzien van wie een beschikking is genomen tot opneming ter isolatie als bedoeld in
      [artikel 31, eerste of tweede lid][ref1] tot onderzoek als bedoeld in [artikel 31, derde of vierde lid][ref2], of
      tot onderwerping aan een maatregel van quarantaine als bedoeld in [artikel 35][ref3], nadeel heeft geleden doordat
      de rechter of de officier van justitie een van de bepalingen uit deze paragraaf niet in acht heeft genomen, kent de
      rechter deze op diens verzoek een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '44.2'
    text: |-
      Het verzoek kan worden ingediend als een zelfstandig verzoek bij het verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van betrokkene, dan wel bij een afzonderlijk verzoekschrift, binnen
      drie maanden te rekenen vanaf de dag waarop betrokkene redelijkerwijs bekend kon zijn met de schending van het
      voorschrift waarop zijn verzoek betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '44.3'
    text: |-
      Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '282'
  - number: '45'
    text: |-
      De [Algemene termijnenwet][ref1] is van toepassing op de termijnen gesteld in de [artikelen 39, tweede lid][ref2],
      [40, eerste lid][ref3], en [41, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002448
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel41
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002448
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '39'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '40'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0024705
        artikel: '41'
        hoofdstuk: V
        paragraaf: '4'
  - number: '46'
    text: |-
      Ingeval een verzoekschrift als bedoeld in [artikel 42, eerste lid][ref1], of [artikel 43, eerste lid][ref2], wordt
      ingediend, dan wel een van de daartoe bevoegde personen beroep instelt, behoeft de indiening van het verzoekschrift
      niet bij procureur te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel43
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '42'
        hoofdstuk: V
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '43'
        hoofdstuk: V
        paragraaf: '4'
  - number: '47.1'
    text: |-
      Indien er een gegrond vermoeden bestaat van een besmetting kan de burgemeester dan wel de voorzitter van
      de veiligheidsregio terreinen, gebouwen, vervoermiddelen of goederen controleren op de aanwezigheid van een
      besmetting, zonodig door het nemen van monsters.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: '47.2'
    text: 'In het geval van een besmetting kan de burgemeester dan wel de voorzitter van de veiligheidsregio:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47.2.a
    text: voorschriften van technisch-hygiënische aard geven,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47.2.b
    text: terreinen, gebouwen, vervoermiddelen of goederen ontsmetten, met inbegrip van de vernietiging van vectoren.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: '47.3'
    text: |-
      In het geval van een besmetting waarbij ernstig gevaar dreigt voor de volksgezondheid, kan de burgemeester dan wel
      de voorzitter van de veiligheidsregio:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47.3.a
    text: gebouwen of terreinen dan wel gedeelten daarvan sluiten,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47.3.b
    text: een verbod uitvaardigen tot het gebruik maken of betreden van vervoermiddelen,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47.3.c
    text: waren vernietigen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: '47.4'
    text: De burgemeester dan wel de voorzitter van de veiligheidsregio heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: '47.5'
    text: |-
      De burgemeester of de voorzitter van de veiligheidsregio kan een last onder bestuursdwang opleggen aan degene die
      geen medewerking verleent aan het uitvoeren van het bepaalde in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47
  - number: 47a.1
    text: |-
      Ter uitvoering van [artikel 6a][ref1] is Onze Minister bij uitsluiting van de burgemeester bevoegd de volgende
      maatregelen te nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6a
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 6a
        hoofdstuk: II
        paragraaf: '4'
  - number: 47a.1.a
    text: |-
      het controleren van terreinen, gebouwen, vervoermiddelen of goederen op de aanwezigheid van een vector, zo nodig
      door het nemen van monsters, indien er een aannemelijk risico is op de aanwezigheid van een dergelijke vector,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47a
  - number: 47a.1.b
    text: |-
      het geven van voorschriften van technisch-hygiënische aard bij de aanwezigheid van een vector, of indien er een
      aannemelijk risico daarop is,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47a
  - number: 47a.1.c
    text: het vernietigen van vectoren op of in terreinen, gebouwen, vervoermiddelen of goederen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47a
  - number: 47a.2
    text: |-
      Onze Minister kan een last onder bestuursdwang opleggen aan degene die geen medewerking verleent aan het uitvoeren
      van het bepaalde in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel47a
  - number: '48.1'
    text: |-
      Bij regeling van Onze Minister worden de havens en luchthavens aangewezen waarop de eisen van deze paragraaf
      van toepassing zijn. De havens of luchthavens kunnen per categorie worden aangewezen voor toepassing van
      [artikel 49][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel49
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '48.2'
    text: |-
      Een burgerhaven of burgerluchthaven wordt aangewezen in overeenstemming met Onze Minister van Infrastructuur en
      Milieu.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel48
  - number: '48.3'
    text: Een militaire haven of militaire luchthaven wordt aangewezen in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel48
  - number: '49.1'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald over welke voorzieningen, bedoeld in artikel 20, eerste lid, en
      bijlage 1 van de Internationale Gezondheidsregeling, de havens of luchthavens beschikken, alsmede aan welke eisen
      deze voorzieningen voldoen. Deze voorzieningen en eisen kunnen per categorie haven of luchthaven verschillen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel49
  - number: '49.2'
    text: |-
      Voor zover het een burgerhaven of burgerluchthaven betreft draagt de exploitant daarvan zorg voor de naleving van
      het krachtens het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel49
  - number: '49.3'
    text: |-
      Voor zover het betreft burgerluchtverkeer op een militaire luchthaven met burgermedegebruik door tussenkomst van
      een burgerexploitant, draagt de burgerexploitant zorg voor de naleving van het krachtens het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel49
  - number: '50.1'
    text: |-
      De gezagvoerder van een schip dat een internationale reis maakt, die een haven wil aandoen en wetenschap heeft
      of een ernstig vermoeden heeft dat er aan boord van zijn schip één of meer ziektegevallen zijn die wijzen op een
      ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren, zorgt ervoor dat de
      verkeersleiding van de haven en de aan boord komende loods hiervan zo spoedig mogelijk doch voor aankomst op de
      hoogte worden gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel50
  - number: '50.2'
    text: |-
      De gezagvoerder van een luchtvaartuig dat een internationale reis maakt, die een luchthaven wil aandoen en
      wetenschap heeft of een ernstig vermoeden heeft dat er aan boord van zijn luchtvaartuig één of meer ziektegevallen
      zijn die wijzen op een ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren,
      zorgt ervoor dat de luchtverkeersleiding van de luchthaven hiervan zo spoedig mogelijk doch voor aankomst op de
      hoogte wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel50
  - number: '50.3'
    text: |-
      De verkeersleiding van de burgerhaven geeft een melding onverwijld door aan Onze Minister van Infrastructuur en
      Milieu, het samenwerkingsverband van registerloodsen en de exploitant van de burgerhaven. De luchtverkeersleiding
      van de burgerluchthaven geeft een melding onverwijld door aan Onze Minister van Infrastructuur en Milieu en de
      exploitant van de burgerluchthaven.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel50
  - number: '50.4'
    text: |-
      De exploitant van de burgerhaven of burgerluchthaven geeft een melding onverwijld door aan de gemeentelijke
      gezondheidsdienst. De gemeentelijke gezondheidsdienst geeft een melding onverwijld door aan de burgemeester en
      het RIVM.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel50
  - number: '50.5'
    text: |-
      De verkeersleiding van de militaire haven of de luchtverkeersleiding van de militaire luchthaven geeft een melding
      onverwijld door aan de gemeentelijke gezondheidsdienst en het RIVM. De gemeentelijke gezondheidsdienst geeft een
      melding onverwijld door aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel50
  - number: '51.1'
    text: |-
      Onverminderd [artikel 50][ref1] verstrekt de gezagvoerder van een schip dat een internationale reis maakt op
      verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio bij aankomst in de burgerhaven de
      maritieme gezondheidsverklaring, bedoeld in artikel 37 van de Internationale Gezondheidsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '50'
        hoofdstuk: V
        paragraaf: '6'
  - number: '51.2'
    text: |-
      Onverminderd [artikel 50][ref1] verstrekt de gezagvoerder van een luchtvaartuig dat een internationale reis maakt
      op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio bij aankomst in de burgerluchthaven,
      dan wel in het voor burgerluchtverkeer bestemde gedeelte van een militaire luchthaven met burgermedegebruik, het
      gezondheidsgedeelte van de algemene verklaring voor luchtvaartuigen, bedoeld in artikel 38 van de Internationale
      Gezondheidsregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '50'
        hoofdstuk: V
        paragraaf: '6'
  - number: '51.3'
    text: |-
      Indien de gezondheidsverklaring, bedoeld in het eerste of tweede lid, daartoe naar het oordeel van de burgemeester
      dan wel de voorzitter van de veiligheidsregio aanleiding geeft, verstrekt de gezagvoerder op verzoek van de
      burgemeester dan wel de voorzitter van de veiligheidsregio aanvullende gegevens over de gezondheidstoestand aan
      boord.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel51
  - number: '52'
    text: |-
      In geval van een melding als bedoeld in [artikel 50][ref1] of indien anderszins blijkt van omstandigheden aan boord
      van een schip of luchtvaartuig dat een internationale reis maakt, die een ernstig gevaar voor de volksgezondheid
      kunnen meebrengen, kan Onze Minister van Infrastructuur en Milieu, na overleg met Onze Minister, bepalen in welke
      burgerhaven of burgerluchthaven het schip of luchtvaartuig aankomt, alsook, na overleg met het samenwerkingsverband
      van registerloodsen, hoe de loodsdienstverlening aan het schip plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '50'
        hoofdstuk: V
        paragraaf: '6'
  - number: '53.1'
    text: |-
      In geval van een melding als bedoeld in [artikel 50][ref1] of indien anderszins blijkt van omstandigheden aan boord
      van een schip of luchtvaartuig dat een internationale reis maakt, die een ernstig gevaar voor de volksgezondheid
      kunnen meebrengen, bepaalt de burgemeester welke maatregelen met betrekking tot de toelating tot of de onttrekking
      aan het vrije verkeer moeten worden genomen als het schip of luchtvaartuig in de burgerhaven of burgerluchthaven,
      dan wel in het voor burgerluchtverkeer bestemde gedeelte van een militaire luchthaven met burgermedegebruik, is
      aangekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '50'
        hoofdstuk: V
        paragraaf: '6'
  - number: '53.2'
    text: |-
      In geval van een directe dreiging van een epidemie van een infectieziekte behorend tot groep A, kan de voorzitter
      van de veiligheidsregio ten aanzien van een schip of luchtvaartuig dat een internationale reis maakt, bepalen welke
      maatregelen met betrekking tot de toelating tot of de onttrekking aan het vrije verkeer moeten worden genomen als
      het schip of luchtvaartuig in de burgerhaven of burgerluchthaven, dan wel in het voor burgerluchtverkeer bestemde
      gedeelte van een militaire luchthaven met burgermedegebruik, is aangekomen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
  - number: '53.3'
    text: |-
      In de situatie, bedoeld in het eerste en tweede lid, draagt de gezagvoerder van het schip of luchtvaartuig ervoor
      zorg dat:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
  - number: 53.3.a
    text: |-
      na aankomst niemand het schip of luchtvaartuig betreedt of verlaat en er geen vervoermiddelen of goederen worden
      geladen of gelost, tenzij de burgemeester dan wel de voorzitter van de veiligheidsregio daartoe opdracht of
      toestemming geeft, en
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
  - number: 53.3.b
    text: |-
      op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio een overzicht wordt gegeven van
      de volgende gegevens van de passagiers, voor zover deze gegevens bekend zijn bij de gezagvoerder: naam, adres,
      geslacht, leeftijd en bestemming.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
  - number: '53.4'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio past de maatregelen niet langer toe dan nodig is om
      het onderzoek uit te voeren om de ernst van het gevaar vast te stellen.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel53
  - number: '54'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio kan de exploitant van een burgerhaven of
      burgerluchthaven dan wel de burgerexploitant opdragen om:
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel54
  - number: 54.a
    text: |-
      voorlichting aan reizigers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel54
  - number: 54.b
    text: |-
      medewerking te verlenen aan door de burgemeester dan wel de voorzitter van de veiligheidsregio te nemen maatregelen
      van onderzoek van vertrekkende of aankomende reizigers naar de aanwezigheid van een ziekte van infectueuze aard die
      een ernstig gevaar voor de volksgezondheid kan opleveren,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel54
  - number: 54.c
    text: |-
      ter voorkoming van een besmetting voorschriften van technisch-hygiënische aard uit te voeren, indien er een gegrond
      risico is op een besmetting,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel54
  - number: 54.d
    text: ter bestrijding van een besmetting gebouwen of terreinen dan wel gedeelten daarvan te sluiten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel54
  - number: '55'
    text: 'De burgemeester dan wel de voorzitter van de veiligheidsregio kan de vervoersexploitant opdragen om:'
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel55
  - number: 55.a
    text: |-
      voorlichting aan passagiers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel55
  - number: 55.b
    text: |-
      ter voorkoming van een besmetting maatregelen van technisch-hygiënische aard uit te voeren voor een schip of
      luchtvaartuig en de hierin aanwezige goederen, indien er een gegrond risico is op een besmetting,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel55
  - number: 55.c
    text: een schip of luchtvaartuig en de hierin aanwezige goederen te controleren op de aanwezigheid van een besmetting,
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel55
  - number: 55.d
    text: |-
      ter bestrijding van een besmetting een schip of luchtvaartuig en de hierin aanwezige goederen te ontsmetten, met
      inbegrip van de vernietiging van vectoren.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel55
  - number: '56'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het opleggen van een last onder
      bestuursdwang ter handhaving van hetgeen op grond van de [artikelen 53, eerste en tweede lid][ref1], [54][ref2] en
      [55][ref3] is opgedragen, indien de omstandigheden onmiddellijk ingrijpen noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel55
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '53'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '54'
        hoofdstuk: V
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: '55'
        hoofdstuk: V
        paragraaf: '6'
  - number: '57.1'
    text: |-
      Een certificaat van sanitaire controle van schepen of een certificaat tot vrijstelling van sanitaire controle van
      schepen als bedoeld in artikel 39 van de Internationale Gezondheidsregeling, wordt op verzoek van de gezagvoerder
      door de burgemeester afgegeven indien het schip vrij is van besmetting.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel57
  - number: '57.2'
    text: |-
      De certificaten worden opgesteld volgens het in bijlage 3 van de Internationale Gezondheidsregeling opgenomen
      model.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel57
  - number: '57.3'
    text: Bij regeling van Onze Minister worden nadere regels gesteld over de afgifte van de certificaten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel57
  - number: '57.4'
    text: |-
      Bij regeling van Onze Minister worden de havens aangewezen waarvoor de burgemeester bevoegd is tot afgifte van
      de certificaten.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel57
  - number: '58.1'
    text: |-
      De inenting van personen of de toediening van profylaxe aan personen ter verkrijging van een internationaal geldig
      certificaat als bedoeld in artikel 36 van de Internationale Gezondheidsregeling, geschiedt onder bij regeling van
      Onze Minister vast te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58
  - number: '58.2'
    text: |-
      De certificaten worden opgesteld volgens het in bijlage 6 van de Internationale Gezondheidsregeling opgenomen
      model.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58
  - number: '58.3'
    text: |-
      Bij regeling van Onze Minister worden de organisaties of personen aangewezen waar inentingen tegen gele koorts
      mogen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0024705/2021-09-01#Artikel58
  - number: 58a.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *besloten plaats:* een andere dan
      openbare of publieke plaats en een daarbij behorend erf, met inbegrip van gebouwen en plaatsen als bedoeld in
      [artikel 6, tweede lid, van de Grondwet][ref1];
        - *beveiligingsmedewerker:* een persoon belast met beveiligingswerkzaamheden als bedoeld in
      __REF001___________________________________________________________________________________________________________
      _ alsmede een persoon in dienst van een bestuursorgaan als bedoeld in [artikel 5, vijfde lid, van die wet][ref3];
        - *coronatoegangsbewijs:* bewijs van een testuitslag, een bewijs van vaccinatie tegen het virus SARS-CoV-2 of een
      bewijs van herstel van een infectie met het virus SARS-CoV-2;
        - *epidemie:* de epidemie van covid-19, veroorzaakt door het virus SARS-CoV-2;
        - *evenement:* elke voor het publiek toegankelijke verrichting van vermaak, alsmede een herdenkingsplechtigheid,
      braderie, optocht op de weg, voorstelling of feest op een andere plaats dan in een woning of op een daarbij
      behorend erf of in een gebouw of op een plaats als bedoeld in [artikel 6, tweede lid, van de Grondwet][ref4],
      wedstrijd, beurs of congres. Onder evenementen worden niet begrepen betogingen, vergaderingen en godsdienstige en
      levensbeschouwelijke samenkomsten als bedoeld in de [Wet openbare manifestaties][ref5];
        - *groepsverband:* een aantal min of meer bijeen horende personen, waarbij kennelijk sprake is van een zekere
      samenhang of omstandigheid waardoor die personen bij elkaar zijn;
        - *hygiënemaatregelen:* maatregelen betreffende de inrichting van ruimten of aldaar te gebruiken voorwerpen of
      materialen, of het treffen van voorzieningen ten behoeve van de reinheid teneinde besmetting met of overdracht van
      het virus SARS-CoV-2 zoveel mogelijk te voorkomen;
        - *justitiële inrichting:* een inrichting als bedoeld in
      [artikel 1, onder b, van de Penitentiaire beginselenwet][ref6], inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref7], instelling als bedoeld in
      [artikel 1, onder b, van de Beginselenwet verpleging ter beschikking gestelden][ref8] of gesticht als bedoeld in
      [artikel 2 van de Wet beginselen gevangeniswezen BES][ref9];
        - *kinderopvang:* een kindercentrum of voorziening voor gastouderopvang als bedoeld in
      [artikel 1.1, eerste lid, van de Wet kinderopvang][ref10];
        - *mantelzorger:* een natuurlijke persoon die rechtstreeks voortvloeiend uit een tussen personen bestaande sociale
      relatie zorg of hulp verleent zonder dat dit beroeps- of bedrijfsmatig geschiedt;
        - *onderwijsinstelling:* een school, instelling of exameninstelling in de zin van een onderwijswet als bedoeld
      in [artikel 1, onder d, van de Wet op het onderwijstoezicht][ref11], daaronder begrepen een niet bekostigde
      instelling;
        - *Onze Ministers:* Onze Minister, Onze Minister van Justitie en Veiligheid en Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties gezamenlijk;
        - *openbare plaats:* een openbare plaats als bedoeld in
      [artikel 1, eerste lid, van de Wet openbare manifestaties][ref12];
        - *ophouden:* gedurende enige tijd ergens verkeren, terwijl er feitelijk gelegenheid is om te gaan;
        - *opsporingsambtenaar:* een persoon die bij of krachtens [artikel 141][ref13]
      of [142 van het Wetboek van Strafvordering][ref14] of [artikel 184][ref15] of
      [185 van het Wetboek van Strafvordering BES][ref16] is belast met de opsporing van strafbare feiten;
        - *persoon met een handicap:* een persoon als bedoeld in artikel 1, tweede zin, van het Verdrag inzake de rechten
      van personen met een handicap (Trb. 2007, 169, en 2014, 113);
        - *persoonlijke beschermingsmiddelen:* uitrusting die bestemd is om te worden gedragen of vastgehouden teneinde de
      eigen of een andere persoon zoveel mogelijk te beschermen tegen overdracht van het virus SARS-CoV-2;
        - *publieke plaats:* een voor het publiek openstaand gebouw als
      bedoeld in [artikel 174, eerste lid, van de Gemeentewet][ref17] of
      [artikel 176, eerste lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref18], en een daarbij
      behorend erf, of een voor het publiek openstaand lokaal, voertuig of vaartuig, met uitzondering van gebouwen en
      plaatsen als bedoeld in [artikel 6, tweede lid, van de Grondwet][ref19];
        - *resultaat:* testuitslag, vaccinatie tegen het virus SARS-CoV-2 of herstel van een infectie met het virus SARS-
      CoV-2;
        - *testuitslag:* testuitslag waaruit blijkt of de geteste persoon op het moment van afname van de test was
      geïnfecteerd met het virus SARS-CoV-2;
        - *thuisquarantaine:* de krachtens [artikel 58nb][ref20] of [58nh][ref21] geldende verplichting voor een reiziger
      om op een bepaalde locatie te verblijven in verband met de bestrijding van de epidemie;
        - *veilige afstand:* de afstand, bedoeld in [artikel 58f, tweede lid][ref22];
        - *zorgaanbieder:* een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, van de Wet kwaliteit, klachten en geschillen zorg][ref23], of als
      bedoeld in [artikel 1, onder j, van de Wet zorginstellingen BES][ref24], jeugdhulpaanbieder
      als bedoeld in [artikel 1.1 van de Jeugdwet][ref25], aanbieder van jeugdzorg als bedoeld in
      [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref26] of aanbieder als
      bedoeld in [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref27];
        - *zorglocatie:* een bouwkundige voorziening of deel van een bouwkundige
      voorziening met het daarbij behorende terrein waar zorg als bedoeld in
      [artikel 1 van de Wet kwaliteit, klachten en geschillen zorg][ref28] wordt verleend, waar jeugdzorg als
      bedoeld in [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref29]
      wordt verleend of waar beschermd wonen of opvang als bedoeld in
      [artikel 1.1.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref30] plaatsvindt of accommodatie als
      bedoeld in [artikel 1.1 van de Jeugdwet][ref31];
        - *zorgverlener:* een natuurlijke persoon die beroepsmatig zorg of dienst als omschreven bij
      of krachtens de [Wet langdurige zorg][ref32] of de [Zorgverzekeringswet][ref33] verleent,
      jeugdhulpverlener als bedoeld in [artikel 1.1 van de Jeugdwet][ref34], beroepskracht als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref35], natuurlijke persoon die beroepsmatig jeugdzorg
      als bedoeld in [artikel 18.4.7a van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref36]
      verleent of zorgverlener als bedoeld in artikel 1.1.1 van de Wet algemene verzekering bijzondere ziektekosten BES.


