  - number: 68b
    text: |-
      De [artikelen 5, derde lid, onderdeel a, en vierde lid][ref1], [6a][ref2], [8, derde lid][ref3],
      [14 tot en met 17][ref4], [47a][ref5], alsmede [64][ref6] zijn niet van toepassing in de openbare lichamen Bonaire,
      Sint Eustatius en Saba. [Artikel 65][ref7] is wat betreft de ambtenaren van de inspectie niet van toepassing in de
      openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel8
