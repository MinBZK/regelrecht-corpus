  - number: '30'
    text: |-
      Op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio verstrekt de behandelend arts van een
      persoon die naar het oordeel van de burgemeester dan wel de voorzitter van de veiligheidsregio een gevaar oplevert
      voor de overbrenging van een infectieziekte behorend tot groep A, B1 of B2 aan de gemeentelijke gezondheidsdienst
      zo spoedig mogelijk de hem bekende nadere medische en epidemiologische gegevens die noodzakelijk zijn om de aard en
      de omvang van het gevaar van verspreiding van de infectieziekte vast te stellen.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel30
  - number: '31'
    text: |-
      1 De voorzitter van de veiligheidsregio kan een persoon onverwijld ter isolatie in een ziekenhuis doen opnemen,
      indien:

      a. de betrokkene lijdt aan een infectieziekte behorend tot groep A, dan wel de voorzitter van de veiligheidsregio
      gegronde redenen heeft om aan te nemen dat de betrokkene daaraan lijdt,

      b. ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte,

      c. dit gevaar niet op andere wijze effectief kan worden afgewend, en

      d. de betrokkene niet tot opneming ter isolatie bereid is.

      2 De burgemeester kan een persoon onverwijld ter isolatie in een ziekenhuis doen opnemen, indien:

      a. ten aanzien van de betrokkene de melding ingevolge [artikel 22, derde lid][ref1], heeft plaatsgevonden, of de
      betrokkene lijdt aan een infectieziekte behorend tot groep B1,

      b. ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte,

      c. dit gevaar niet op andere wijze effectief kan worden afgewend, en

      d. de betrokkene niet tot opneming ter isolatie bereid is.

      3 De voorzitter van de veiligheidsregio dan wel de burgemeester kan een ter isolatie opgenomen persoon door een
      arts doen onderzoeken, indien:

      a. ten gevolge van de infectieziekte onmiddellijk gevaar dreigt voor de gezondheid van derden,

      b. de aard en de omvang van dit gevaar niet op andere wijze dan door onderzoek kunnen worden vastgesteld,

      c. de uitkomst van het onderzoek noodzakelijk is om dit gevaar effectief te kunnen afwenden, en

      d. de betrokkene niet bereid is het onderzoek te ondergaan.

      4 De voorzitter van de veiligheidsregio dan wel de burgemeester kan een ter isolatie opgenomen persoon door een
      arts in het lichaam doen onderzoeken indien aan de voorwaarden, bedoeld in het derde lid, is voldaan en de rechter
      daartoe een machtiging heeft verleend.

      5 Het onderzoek, bedoeld in het derde en vierde lid, omvat niet meer dan nodig is ter afwending van het gevaar
      voor derden.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel22
