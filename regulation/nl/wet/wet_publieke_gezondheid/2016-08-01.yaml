  - number: '14'
    text: |-
      1 Ter uitvoering van bij of krachtens deze wet opgedragen taken dragen de colleges van burgemeester en wethouders
      van gemeenten die behoren tot een regio als bedoeld in de [Wet veiligheidsregio’s][ref1], via het treffen van
      een gemeenschappelijke regeling zorg voor de instelling en instandhouding van een regionale gezondheidsdienst in
      die regio.

      2 Bij de regeling, bedoeld in het eerste lid, wordt een openbaar lichaam ingesteld met de aanduiding: gemeentelijke
      gezondheidsdienst.

      3 De gemeentelijke gezondheidsdienst staat onder leiding van een directeur publieke gezondheid, die wordt benoemd
      door het algemeen bestuur van de gemeentelijke gezondheidsdienst in overeenstemming met het bestuur van de
      veiligheidsregio.

      4 Met inachtneming van bij algemene maatregel van bestuur te stellen regels, staat het het college van
      burgemeester en wethouders vrij om de uitvoering van de taken of onderdelen van taken, bedoeld in de
      [artikelen 2, tweede lid, onder h][ref2], en [5, tweede lid, onder a tot en met d][ref3], over te laten of mede
      over te laten aan een ander dan de gemeentelijke gezondheidsdienst.

      5 In afwijking van het eerste lid kan een regionale gezondheidsdienst worden ingesteld en in stand gehouden
      door de colleges van burgemeester en wethouders van de gemeenten in twee of meer regio’s als bedoeld in de
      [Wet veiligheidsregio’s][ref4]. In dat geval geschiedt de benoeming, bedoeld in het derde lid, in overeenstemming
      met de besturen van de betrokken veiligheidsregio’s, en draagt het algemeen bestuur van de gemeentelijke
      gezondheidsdienst ervoor zorg dat in elk der regio’s adequaat wordt voorzien in de operationele leiding van de
      geneeskundige hulpverlening, bedoeld in [artikel 32, tweede lid, van de Wet veiligheidsregio’s][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0027466
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0027466
