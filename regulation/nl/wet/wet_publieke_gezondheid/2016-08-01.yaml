  - number: 5a
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de ouderengezondheidszorg.

      2 Ter uitvoering van de in het eerste lid bedoelde taak draagt het college van burgemeester en wethouders in ieder
      geval zorg voor:

      a. het op systematische wijze volgen en signaleren van ontwikkelingen in de gezondheidstoestand van ouderen en van
      gezondheidsbevorderende en -bedreigende factoren;

      b. het ramen van de behoeften aan zorg;

      c. de vroegtijdige opsporing en preventie van specifieke stoornissen als comorbiditeit;

      d. het geven van voorlichting, advies, instructie en begeleiding;

      e. het formuleren van maatregelen ter beïnvloeding van gezondheidsbedreigingen.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkzaamheden, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel5a
  - number: '6'
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor de uitvoering van de algemene
      infectieziektebestrijding, waaronder in ieder geval behoort:

      a. het nemen van algemene preventieve maatregelen op dit gebied,

      b. het bestrijden van tuberculose en seksueel overdraagbare aandoeningen, inclusief bron- en contactopsporing,

      c. bron- en contactopsporing bij meldingen als bedoeld in de [artikelen 21][ref1], [22][ref2], [25][ref3] en
      [26][ref4].

      2 Het bestuur van de veiligheidsregio draagt zorg voor de voorbereiding op de bestrijding van een epidemie van een
      infectieziekte behorend tot groep A, alsmede op de bestrijding van een nieuw subtype humaan influenzavirus, waarbij
      ernstig gevaar voor de volksgezondheid bestaat.

      3 De burgemeester geeft leiding aan de bestrijding van een epidemie van een infectieziekte, behorend tot groep
      B1, B2 of C, alsook de directe voorbereiding daarop en draagt zorg voor de toepassing van de maatregelen, bedoeld
      in [hoofdstuk V][ref5].

      4 De voorzitter van de veiligheidsregio draagt zorg voor de bestrijding van een epidemie van een infectieziekte
      behorend tot groep A, of een directe dreiging daarvan, en is dan ten behoeve van deze bestrijding bij uitsluiting
      bevoegd om toepassing te geven aan de [artikelen 34, vierde lid][ref6], [47][ref7], [51][ref8], [54][ref9],
      [55][ref10] of [56][ref11].

      5 Bij algemene maatregel van bestuur kunnen de taken, bedoeld in het eerste, tweede, derde en vierde lid, nader
      worden uitgewerkt.


