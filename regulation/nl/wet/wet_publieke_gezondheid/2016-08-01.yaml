        artikel: '7'
        hoofdstuk: II
        paragraaf: '4'
  - number: '11'
    text: |-
      1 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie, kunnen regels worden gesteld over de verdeling
      van vaccins en therapeutische farmaproducten, indien er een beperkte beschikbaarheid is van deze middelen en ten
      behoeve van de bestrijding van een infectieziekte behorend tot groep A prioriteiten moeten worden gesteld voor de
      verdeling ervan.

      2 Onze Minister stelt de beide Kamers der Staten-Generaal onverwijld op de hoogte van de vastgestelde regeling.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister draagt ervoor zorg dat aan de informatieverplichtingen, voortvloeiende uit de Internationale
      Gezondheidsregeling, wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister stelt elke vier jaar een landelijke nota gezondheidsbeleid en een landelijk programma voor
      uitvoering van onderzoek vast op het gebied van de publieke gezondheid.

      2 De gemeenteraad stelt binnen twee jaar na openbaarmaking van de nota, bedoeld in het eerste lid, een nota
      gemeentelijk gezondheidsbeleid vast, waarin de raad in ieder geval aangeeft:

      a. wat de gemeentelijke doelstellingen zijn ter uitvoering van de in de [artikelen 2][ref1], [5][ref2], [5a][ref3]
      en [6][ref4] genoemde taken,

      b. welke acties in de bestreken periode worden ondernomen ter realisering van deze doelstellingen,

      c. welke resultaten de gemeente in die periode wenst te behalen,

      d. hoe het college van burgemeester en wethouders uitvoering geeft aan de in [artikel 16][ref5] genoemde
      verplichting.

      3 De gemeenteraad neemt bij het vaststellen van de nota gemeentelijk gezondheidsbeleid in ieder geval de landelijke
      prioriteiten in acht, zoals opgenomen in de landelijke nota gezondheidsbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel5
