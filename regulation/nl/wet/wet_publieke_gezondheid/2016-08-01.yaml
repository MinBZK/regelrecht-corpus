        bwb_id: BWBR0024705
        artikel: 68j
        hoofdstuk: Va
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 68k
        hoofdstuk: Va
  - number: 68j
    text: |-
      1 Bestuursdwang omvat het doen wegnemen, ontruimen, beletten, in de vorige toestand herstellen of verrichten van
      hetgeen in strijd met de desbetreffende bepalingen van deze wet is of wordt gedaan, gehouden of nagelaten.

      2 Een beslissing tot het toepassen van bestuursdwang wordt op schrift gesteld en geldt als een beschikking. De
      beschikking vermeldt welk voorschrift is overtreden.

      3 De beschikking wordt bekendgemaakt aan de overtreder en andere belanghebbenden.

      4 In de beschikking wordt een termijn gesteld waarbinnen de overtreder en eventuele andere rechthebbenden de
      tenuitvoerlegging van bestuursdwang kunnen voorkomen door zelf de in de beschikking vermelde maatregelen te
      treffen. Geen termijn behoeft te worden gegund indien de vereiste spoed zich daartegen verzet.

      5 Indien de situatie dermate spoedeisend is dat de beslissing tot toepassing van bestuursdwang niet tevoren op
      schrift kan wordt gezet, wordt zo spoedig mogelijk alsnog voor de opschriftstelling en bekendmaking gezorgd.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel68j
  - number: 68k
    text: |-
      1 De overtreder is de kosten verbonden aan de toepassing van bestuursdwang verschuldigd, tenzij de kosten
      redelijkerwijze niet of niet geheel te zijnen laste behoren te komen.

      2 De beschikking vermeldt dat de toepassing van bestuursdwang op kosten van de overtreder plaatsvindt.

      3 Indien de kosten echter geheel of gedeeltelijk niet ten laste van de overtreder zullen worden gebracht, wordt dat
      in de beschikking vermeld.

      4 Onder de kosten worden begrepen de kosten verbonden aan de voorbereiding van bestuursdwang, voor zover deze
      kosten zijn gemaakt na het tijdstip waarop de termijn bedoeld in [artikel 68j, vierde lid][ref1], is verstreken.

      5 De kosten zijn ook verschuldigd indien de bestuursdwang door opheffing van de onrechtmatige situatie niet of niet
      volledig is uitgevoerd.

      6 Bij dwangbevel kan van de overtreder de verschuldigde kosten, verhoogd met de op de invordering vallende kosten,
      worden ingevorderd.

      7 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale
      titel op in de zin van het [Wetboek van Burgerlijke Rechtsvordering BES][ref2].

      8 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van het
      openbaar lichaam.

      9 Het verzet schorst de tenuitvoerlegging. Op verzoek van het openbaar lichaam kan het Gerecht in eerste aanleg van
      Bonaire, Sint Eustatius en Saba de schorsing van de tenuitvoerlegging opheffen.

      10 De kosten verbonden aan de toepassing van bestuursdwang zijn bevoorrecht op de zaak ten aanzien waarvan zij zijn
      besteed en worden na de kosten, bedoeld in [artikel 284 van het Burgerlijk Wetboek BES][ref3], uit de opbrengst van
      de zaak betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68j
      [ref2]: https://wetten.overheid.nl/BWBR0028496
      [ref3]: https://wetten.overheid.nl/BWBR0028496#Artikel284
