  - number: '32'
    text: |-
      1 De burgemeester dan wel de voorzitter van de veiligheidsregio doet de beschikking tot opneming ter isolatie aan
      de betrokkene uitreiken.

      2 In de beschikking geeft de burgemeester dan wel de voorzitter van de veiligheidsregio aan in welk ziekenhuis,
      aangewezen op grond van [artikel 34][ref1], de opneming ter isolatie ten uitvoer wordt gelegd.

      3 Na uitreiking van de beschikking voorziet de burgemeester dan wel de voorzitter van de veiligheidsregio in
      bijstand van de betrokkene door een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.

      4 Wanneer redelijkerwijs kan worden aangenomen dat het gevaar, bedoeld in
      [artikel 31, eerste lid, onder b, of tweede lid, onder b][ref2], is geweken of op minder ingrijpende wijze kan
      worden afgewend, heft de burgemeester dan wel de voorzitter van de veiligheidsregio de opneming ter isolatie
      onverwijld op.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '34'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '33'
    text: |-
      1 De voorzitter van de veiligheidsregio dan wel de burgemeester doet de beschikking tot het onderzoek, bedoeld in
      [artikel 31, vierde lid][ref1], aan de betrokkene uitreiken.

      2 In zijn beschikking geeft de voorzitter van de veiligheidsregio dan wel de burgemeester aan waaruit het onderzoek
      bestaat, welke arts het onderzoek verricht en binnen welke termijn het onderzoek plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '34'
    text: |-
      1 De opneming ter isolatie wordt ten uitvoer gelegd in een gesloten afdeling van een door Onze Minister aangewezen
      ziekenhuis.

      2 Het ziekenhuis neemt de betrokkene onverwijld op.

      3 Bij algemene maatregel van bestuur kunnen eisen worden gesteld waaraan de opneming ter isolatie en het onderzoek
      moeten voldoen.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het opleggen van een last onder
      bestuursdwang ter handhaving van het bepaalde in het eerste, tweede en derde lid, indien de omstandigheden
      onmiddellijk ingrijpen noodzakelijk maken.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel34
  - number: '35'
    text: |-
      1 De voorzitter van de veiligheidsregio kan een persoon onverwijld doen onderwerpen aan de maatregel van
      quarantaine om de verspreiding van infectieziekten behorend tot groep A tegen te gaan, indien:

      a. er redenen zijn om aan te nemen dat die persoon recentelijk een dusdanig contact met een lijder of een
      vermoedelijke lijder aan een infectieziekte behorend tot groep A heeft gehad, dat deze persoon mogelijk met
      dezelfde ziekte is geïnfecteerd,

      b. ernstig gevaar voor de volksgezondheid bestaat door verspreiding van die infectieziekte, en

      c. die persoon niet tot vrijwillige onderwerping aan die maatregel bereid is.

      2 De voorzitter van de veiligheidsregio kan toestaan dat de quarantaine onder zonodig te stellen voorwaarden
      plaatsvindt in de woning van de af te zonderen persoon.

      3 Tijdens de quarantaine wordt medisch toezicht verricht. Het toezicht wordt verricht onder medische
      verantwoordelijkheid van een door de gemeentelijke gezondheidsdienst aangewezen geneeskundige.

      4 De quarantaine en het medisch toezicht vinden plaats onder zodanige voorwaarden en omstandigheden en gedurende
      een zodanige periode als noodzakelijk is om het gevaar, bedoeld in het eerste lid, onder b, af te wenden. Zodra
      redelijkerwijs kan worden aangenomen dat dit gevaar is geweken of op minder ingrijpende wijze kan worden afgewend,
      heft de voorzitter van de veiligheidsregio de maatregel onverwijld op.

      5 [Artikel 31, derde en vijfde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
  - number: '36'
    text: |-
      1 De voorzitter van de veiligheidsregio doet de beschikking tot onderwerping aan de maatregel van quarantaine aan
      de betrokkene uitreiken.

      2 In de beschikking geeft de voorzitter van de veiligheidsregio aan:

      a. hoe en waar de maatregel ten uitvoer wordt gelegd,

      b. waarop bij het medisch toezicht in ieder geval wordt gelet, en

      c. aan welke regels betrokkene zich heeft te houden.

      3 Na uitreiking van de beschikking voorziet de voorzitter van de veiligheidsregio in bijstand van de betrokkene
      door een raadsman, tenzij de betrokkene daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel36
  - number: '37'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio draagt de tenuitvoerlegging van de maatregelen,
      bedoeld in de [artikelen 31][ref1] en [35][ref2] op aan de gemeentelijke gezondheidsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '31'
        hoofdstuk: V
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: '35'
        hoofdstuk: V
        paragraaf: '3'
  - number: '38'
    text: |-
      1 De voorzitter van de veiligheidsregio kan een persoon die gevaar oplevert voor de verspreiding van een
      infectieziekte behorend tot groep A het verbod opleggen om beroeps- of bedrijfsmatig werkzaamheden te verrichten,
      die een ernstig risico inhouden voor de verspreiding van die infectieziekte.

      2 De burgemeester kan een persoon die gevaar oplevert voor de verspreiding van een infectieziekte behorend tot
      groep B1 of B2 het verbod opleggen om beroeps- of bedrijfsmatig werkzaamheden te verrichten, die een ernstig risico
      inhouden voor de verspreiding van die infectieziekte.

      3 Voordat de maatregel wordt genomen, hoort de burgemeester dan wel de voorzitter van de veiligheidsregio de
      werkgever van de betrokkene, tenzij betrokkene hiertegen bezwaar maakt.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio heft de maatregel op als het gevaar is geweken of
      op minder ingrijpende wijze kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel38
  - number: '39'
    text: |-
      1 De burgemeester dan wel de voorzitter van de veiligheidsregio stelt de officier van justitie terstond op de
      hoogte van de beschikking tot opneming ter isolatie, bedoeld in [artikel 31, eerste of tweede lid][ref1] van de
      beschikking tot het onderzoek, bedoeld in [artikel 31, vierde lid][ref2], en van de beschikking een persoon te
      onderwerpen aan de maatregel van quarantaine, bedoeld in [artikel 35][ref3].

      2 Zo spoedig mogelijk nadat de beschikking is gegeven, maar in elk geval niet later dan de volgende dag, zendt
      de burgemeester dan wel de voorzitter van de veiligheidsregio de officier van justitie een afschrift van de
      beschikking.

      3 Ingeval van een beschikking tot opneming ter isolatie als bedoeld in [artikel 31, eerste of tweede lid][ref4] en
      van een beschikking tot het onderzoek als bedoeld in [artikel 31, vierde lid][ref5], is de rechtbank van de plaats
      waar het aangewezen ziekenhuis is gelegen bevoegd. Ingeval van een beschikking een persoon te onderwerpen aan de
      maatregel van quarantaine, bedoeld in [artikel 35][ref6], is de rechtbank van de verblijfplaats van betrokkene
      bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0024705#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0024705#Artikel35
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel39
