  - number: '41'
    text: |-
      1 Voordat op het verzoek van de officier van justitie wordt besloten, hoort de rechter degene ten aanzien van wie
      de maatregel is gevorderd.

      2 De rechter hoort de betrokkene op zijn verblijfplaats.

      3 De rechter kan zich laten voorlichten, getuigen en deskundigen oproepen en onderzoek door deskundigen bevelen.

      4 De rechter stelt de raadsman in de gelegenheid zijn zienswijze kenbaar te maken.

      5 De rechter beslist binnen drie dagen, te rekenen vanaf de dag na die van het instellen van de vordering.

      6 Tegen de beschikking staat geen voorziening open.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel41
  - number: '42'
    text: |-
      1 De ter isolatie opgenomen persoon of de in quarantaine geplaatste persoon kan de rechter verzoeken de maatregel
      op te heffen.

      2 [Artikel 41, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.

      3 De rechter kan het verzoek zonder toepassing van [artikel 41][ref2] afwijzen, indien geen nieuwe feiten of
      omstandigheden worden aangevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel41
