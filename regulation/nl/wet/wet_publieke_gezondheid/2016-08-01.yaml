  - number: '26'
    text: |-
      1 Het hoofd van een instelling waar voor infectieziekten kwetsbare populaties verblijven of samenkomen voor
      een of meer dagdelen per etmaal, stelt de gemeentelijke gezondheidsdienst van de gemeente waarin de instelling
      gelegen is, op de hoogte van het optreden van een ongewoon aantal zieken met maag- en darmaandoeningen, geelzucht,
      huidaandoeningen of andere ernstige aandoeningen van vermoedelijk infectueuze aard in de desbetreffende populatie
      of bij het begeleidend of verzorgend personeel.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de wijze waarop en de termijn waarbinnen
      de berichtgeving plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel26
  - number: '27'
    text: |-
      1 De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 22, eerste lid][ref1], onverwijld door aan de voorzitter van de veiligheidsregio en de burgemeester van de
      gemeente waarin de betrokken persoon zijn woon- of verblijfplaats heeft.

      2 De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 21, eerste lid][ref2], onverwijld door aan de burgemeester van de gemeente waarin de betrokken persoon
      zijn woon- of verblijfplaats heeft.

      3 De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in
      [artikel 21, tweede lid][ref3], onverwijld door aan de burgemeester van de gemeente waarin het lijk zich bevindt.

      4 De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in
      [artikel 21, derde lid][ref4], zo spoedig mogelijk mee aan de burgemeester van de gemeente waarin de arts zijn
      praktijk heeft.

      5 De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in
      [artikel 22, tweede en derde lid][ref5], zo spoedig mogelijk mee aan de burgemeester van de gemeente waarin de
      betrokken persoon zijn woon- of verblijfplaats heeft.

      6 De gemeentelijke gezondheidsdienst deelt de ontvangst van een melding als bedoeld in [artikel 26][ref6] binnen
      een redelijke termijn mee aan de burgemeester van de gemeente waarin de instelling is gelegen.

      7 De gemeentelijke gezondheidsdienst verstrekt de burgemeester dan wel de voorzitter van de veiligheidsregio de
      gegevens, bedoeld in [artikel 24, eerste, tweede en derde lid][ref7], die deze nodig heeft voor de uitoefening van
      de hem bij deze wet toegekende bevoegdheden.


