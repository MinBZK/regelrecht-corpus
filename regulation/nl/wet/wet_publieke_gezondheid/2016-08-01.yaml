  - number: 68a
    text: |-
      Tenzij in dit hoofdstuk anders is bepaald, is het bepaalde bij of krachtens deze wet mede van toepassing in de
      openbare lichamen Bonaire, Sint Eustatius en Saba, met dien verstande dat telkens in die bepalingen wordt gelezen
      voor:

        - *«de gemeente»:* het openbare lichaam Bonaire, Sint Eustatius of Saba;
        - *«gemeenteraad»:* eilandsraad;
        - *«college van burgemeester en wethouders» en «bestuur van de veiligheidsregio»:* bestuurscollege;
        - *«burgemeester» en «voorzitter van de veiligheidsregio»:* gezaghebber;
        - *«gemeentelijke gezondheidsdienst»:* de in [artikel 68c, eerste lid][ref1], bedoelde geneeskundige;
        - *«nota gemeentelijk gezondheidsbeleid»:* nota gezondheidsbeleid;
        - *«samenwerkingsverband van registerloodsen»:* een loods als bedoeld in
      [artikel 1, eerste lid, onder a, van de Loodsenwet 2001 BES][ref2];
        - *«lijk»:* een lijk als bedoeld in de [Begrafeniswet BES][ref3];
        - *«goed»:* tastbaar product, met inbegrip van planten en met uitzondering van dieren, vervoermiddelen en lijken
      als bedoeld in de [Begrafeniswet BES][ref4];
        - *«waar»:* waar alsmede eet- en drinkwaar als bedoeld in [artikel 1, onderdelen b en c, van de Warenwet BES][ref5];
        - *«last onder bestuursdwang»:* bestuursdwang als bedoeld in [artikel 58j, eerste lid][ref6];
        - *«burgerservicenummer»:* het nummer van een geldig identiteitsdocument als bedoeld in
      [artikel 2 van de Wet identificatieplicht BES][ref7];
        - *«ziekenhuis»:* zorginstelling als bedoeld in [artikel 1, onder k, van de Wet zorginstellingen BES][ref8];
        - *«verweerschrift als bedoeld in artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering»:* een
      verweerschrift als bedoeld in [artikel 429h, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering BES][ref9];
        - *«crisisplan, bedoeld in artikel 16 van de Wet veiligheidsregio’s»:* rampen- en crisisplan, bedoeld in
      [artikel 44 van de Veiligheidswet BES][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel68c
