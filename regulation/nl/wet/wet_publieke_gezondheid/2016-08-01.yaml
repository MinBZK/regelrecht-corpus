  - number: '57'
    text: |-
      1 Een certificaat van sanitaire controle van schepen of een certificaat tot vrijstelling van sanitaire controle van
      schepen als bedoeld in artikel 39 van de Internationale Gezondheidsregeling, wordt op verzoek van de gezagvoerder
      door de burgemeester afgegeven indien het schip vrij is van besmetting.

      2 De certificaten worden opgesteld volgens het in bijlage 3 van de Internationale Gezondheidsregeling opgenomen
      model.

      3 Bij regeling van Onze Minister worden nadere regels gesteld over de afgifte van de certificaten.

      4 Bij regeling van Onze Minister worden de havens aangewezen waarvoor de burgemeester bevoegd is tot afgifte van
      de certificaten.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel57
  - number: '58'
    text: |-
      1 De inenting van personen of de toediening van profylaxe aan personen ter verkrijging van een internationaal
      geldig certificaat als bedoeld in artikel 36 van de Internationale Gezondheidsregeling, geschiedt onder bij
      regeling van Onze Minister vast te stellen voorwaarden.

      2 De certificaten worden opgesteld volgens het in bijlage 6 van de Internationale Gezondheidsregeling opgenomen
      model.

      3 Bij regeling van Onze Minister worden de organisaties of personen aangewezen waar inentingen tegen gele koorts
      mogen worden verschaft.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel58
  - number: '59'
    text: |-
      1 Indien de gemeenteraad een bijdrage heft voor het verrichten van werkzaamheden in het kader van de publieke
      gezondheidszorg, draagt het college van burgemeester en wethouders ervoor zorg dat dit niet ten koste gaat van het
      bereik van deze werkzaamheden.

      2 Geen bijdrage wordt geheven voor de bij of krachtens de [artikelen 5][ref1] en [6][ref2] opgedragen taken,
      behoudens in gevallen bij algemene maatregel van bestuur aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel5
