  - number: '47'
    text: |-
      1 Indien er een gegrond vermoeden bestaat van een besmetting kan de burgemeester dan wel de voorzitter van de
      veiligheidsregio gebouwen, vervoermiddelen, goederen en waren controleren op de aanwezigheid van een besmetting,
      zonodig door het nemen van monsters.

      2 In het geval van een besmetting kan de burgemeester dan wel de voorzitter van de veiligheidsregio:

      a. voorschriften van technisch-hygiënische aard geven,

      b. gebouwen, vervoermiddelen of goederen ontsmetten, met inbegrip van de vernietiging van vectoren.

      3 In het geval van een besmetting waarbij ernstig gevaar dreigt voor de volksgezondheid, kan de burgemeester dan
      wel de voorzitter van de veiligheidsregio:

      a. gebouwen of terreinen dan wel gedeelten daarvan sluiten,

      b. een verbod uitvaardigen tot het gebruik maken of betreden van vervoermiddelen,

      c. waren vernietigen.

      4 De burgemeester dan wel de voorzitter van de veiligheidsregio heft de maatregel op als het gevaar is geweken.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel47
  - number: '48'
    text: |-
      1 Bij regeling van Onze Minister worden de havens en luchthavens aangewezen waarop de eisen van deze paragraaf
      van toepassing zijn. De havens of luchthavens kunnen per categorie worden aangewezen voor toepassing van
      [artikel 49][ref1].

      2 Een burgerhaven of burgerluchthaven wordt aangewezen in overeenstemming met Onze Minister van Infrastructuur
      en Milieu.

      3 Een militaire haven of militaire luchthaven wordt aangewezen in overeenstemming met Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel49
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '49'
        hoofdstuk: V
        paragraaf: '6'
  - number: '49'
    text: |-
      1 Bij algemene maatregel van bestuur wordt bepaald over welke voorzieningen, bedoeld in artikel 20, eerste lid, en
      bijlage 1 van de Internationale Gezondheidsregeling, de havens of luchthavens beschikken, alsmede aan welke eisen
      deze voorzieningen voldoen. Deze voorzieningen en eisen kunnen per categorie haven of luchthaven verschillen.

      2 Voor zover het een burgerhaven of burgerluchthaven betreft draagt de exploitant daarvan zorg voor de naleving van
      het krachtens het eerste lid bepaalde.

      3 Voor zover het betreft burgerluchtverkeer op een militaire luchthaven met burgermedegebruik door tussenkomst van
      een burgerexploitant, draagt de burgerexploitant zorg voor de naleving van het krachtens het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel49
  - number: '50'
    text: |-
      1 De gezagvoerder van een schip dat een internationale reis maakt, die een haven wil aandoen en wetenschap heeft
      of een ernstig vermoeden heeft dat er aan boord van zijn schip één of meer ziektegevallen zijn die wijzen op een
      ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren, zorgt ervoor dat de
      verkeersleiding van de haven en de aan boord komende loods hiervan zo spoedig mogelijk doch voor aankomst op de
      hoogte worden gesteld.

      2 De gezagvoerder van een luchtvaartuig dat een internationale reis maakt, die een luchthaven wil aandoen en
      wetenschap heeft of een ernstig vermoeden heeft dat er aan boord van zijn luchtvaartuig één of meer ziektegevallen
      zijn die wijzen op een ziekte van infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren,
      zorgt ervoor dat de luchtverkeersleiding van de luchthaven hiervan zo spoedig mogelijk doch voor aankomst op de
      hoogte wordt gesteld.

      3 De verkeersleiding van de burgerhaven geeft een melding onverwijld door aan Onze Minister van Infrastructuur en
      Milieu, het samenwerkingsverband van registerloodsen en de exploitant van de burgerhaven. De luchtverkeersleiding
      van de burgerluchthaven geeft een melding onverwijld door aan Onze Minister van Infrastructuur en Milieu en de
      exploitant van de burgerluchthaven.

      4 De exploitant van de burgerhaven of burgerluchthaven geeft een melding onverwijld door aan de gemeentelijke
      gezondheidsdienst. De gemeentelijke gezondheidsdienst geeft een melding onverwijld door aan de burgemeester en
      het RIVM.

      5 De verkeersleiding van de militaire haven of de luchtverkeersleiding van de militaire luchthaven geeft een
      melding onverwijld door aan de gemeentelijke gezondheidsdienst en het RIVM. De gemeentelijke gezondheidsdienst
      geeft een melding onverwijld door aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel50
  - number: '51'
    text: |-
      1 Onverminderd [artikel 50][ref1] verstrekt de gezagvoerder van een schip dat een internationale reis maakt
      op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio bij aankomst in de burgerhaven de
      maritieme gezondheidsverklaring, bedoeld in artikel 37 van de Internationale Gezondheidsregeling.

      2 Onverminderd [artikel 50][ref2] verstrekt de gezagvoerder van een luchtvaartuig dat een internationale reis maakt
      op verzoek van de burgemeester dan wel de voorzitter van de veiligheidsregio bij aankomst in de burgerluchthaven,
      dan wel in het voor burgerluchtverkeer bestemde gedeelte van een militaire luchthaven met burgermedegebruik, het
      gezondheidsgedeelte van de algemene verklaring voor luchtvaartuigen, bedoeld in artikel 38 van de Internationale
      Gezondheidsregeling.

      3 Indien de gezondheidsverklaring, bedoeld in het eerste of tweede lid, daartoe naar het oordeel van de
      burgemeester dan wel de voorzitter van de veiligheidsregio aanleiding geeft, verstrekt de gezagvoerder op verzoek
      van de burgemeester dan wel de voorzitter van de veiligheidsregio aanvullende gegevens over de gezondheidstoestand
      aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel50
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel51
