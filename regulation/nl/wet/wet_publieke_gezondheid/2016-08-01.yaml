        hoofdstuk: II
        paragraaf: '4'
  - number: '10'
    text: |-
      Onverminderd [artikel 7, eerste, tweede en derde lid][ref1], kunnen bij regeling van Onze Minister regels worden
      gesteld betreffende de door de burgemeester te treffen maatregelen ter bestrijding van een epidemie van een
      infectieziekte behorend tot groep B1, B2 of C.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel7
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel10
