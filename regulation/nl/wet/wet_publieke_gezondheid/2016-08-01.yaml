  - number: '7'
    text: |-
      1 In de situatie, bedoeld in [artikel 6, vierde lid][ref1], geeft Onze Minister leiding aan de bestrijding en
      kan Onze Minister de voorzitter van de veiligheidsregio opdragen hoe de bestrijding ter hand te nemen, waaronder
      begrepen het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref2].

      2 In afwijking van [artikel 6, derde lid][ref3], geeft Onze Minister leiding aan de bestrijding van een
      infectieziekte behorend tot groep B1 of B2, indien de burgemeester van een gemeente die het aangaat daartoe
      verzoekt. Onze Minister kan dan de burgemeester opdragen hoe de bestrijding ter hand te nemen, waaronder begrepen
      het opdragen tot het toepassen van de maatregelen, bedoeld in [hoofdstuk V][ref4].

      3 Onze Minister kan de burgemeester opdragen om, ter uitvoering van de aanbevelingen, bedoeld in de
      artikelen 15 en 16 van de Internationale Gezondheidsregeling, toepassing te geven aan de maatregelen,
      bedoeld in de [artikelen 51][ref5], [54][ref6] en [55][ref7], alsook om de maatregelen, bedoeld in
      [artikel 22a van de Wet op de lijkbezorging][ref8], toe te passen.

      4 Voordat toepassing wordt gegeven aan het eerste, tweede of derde lid, voert Onze Minister een bestuurlijk
      afstemmingsoverleg waarbij in ieder geval Onze Minister van Infrastructuur en Milieu en de veiligheidsregio’s of
      gemeenten die het aangaat, worden betrokken.

      5 Zodra toepassing wordt gegeven aan het eerste of tweede lid, informeert Onze Minister Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Veiligheid en Justitie.

      6 Indien toepassing wordt gegeven aan het eerste, tweede of derde lid, verstrekt de voorzitter van de
      veiligheidsregio of de burgemeester aan Onze Minister, indien deze daarom verzoekt, de gegevens die Onze Minister
      nodig heeft ter uitoefening van die taak.


