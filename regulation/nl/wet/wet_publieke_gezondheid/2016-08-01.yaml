  - number: 68b
    text: |-
      De [artikelen 5, derde lid, onderdeel a, en vierde lid][ref1], [8, derde lid][ref2], [14 tot en met 17][ref3],
      alsmede [64][ref4] zijn niet van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
      [Artikel 65][ref5] is wat betreft de ambtenaren van het Staatstoezicht op de volksgezondheid niet van toepassing in
      de openbare lichamen Bonaire, Sint Eustatius en Saba.


