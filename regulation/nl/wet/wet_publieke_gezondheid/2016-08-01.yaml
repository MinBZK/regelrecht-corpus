  - number: 68l
    text: |-
      1 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die in
      strijd handelt met [artikel 68e, eerste lid][ref1], of die het in artikel 68e, tweede lid, bedoelde lijk onttrekt
      aan een krachtens dat artikel genomen maatregel.

      2 Met een hechtenis van ten hoogste zes maanden of geldboete van de derde categorie wordt gestraft degene die
      verwijtbaar de geheimhoudingsplicht, bedoeld in [artikel 68f, vijfde lid][ref2], schendt.

      3 Met een gevangenisstraf van ten hoogste twee jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk de geheimhoudingsplicht, bedoeld in [artikel 68f, vijfde lid][ref3], schendt.

      4 Geen vervolging wordt ingesteld anders dan op verzoek van degene te wiens aanzien de geheimhoudingsplicht,
      bedoeld in [artikel 68f, vijfde lid][ref4], is geschonden.

      5 De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen. Het in het derde lid strafbaar
      gestelde feit is een misdrijf.


