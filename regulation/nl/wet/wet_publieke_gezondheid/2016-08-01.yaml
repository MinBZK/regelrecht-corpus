  - number: '19'
    text: Bij algemene maatregel van bestuur worden de infectieziekten behorende tot groep C aangewezen.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel19
  - number: '20'
    text: |-
      1 Indien het belang van de volksgezondheid dat vordert en in overeenstemming met het gevoelen van de ministerraad,
      kan bij regeling van Onze Minister een infectieziekte, niet behorend tot groep A, B1, B2 of C, dan wel een
      ziektebeeld met een volgens de stand van de wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van
      besmettelijkheid en ernstig gevaar voor de volksgezondheid, worden aangemerkt als behorend tot groep A, B1 of B2.

      2 Indien het belang van de volksgezondheid dat vordert, kan, in overeenstemming met het gevoelen van de
      ministerraad, bij regeling van Onze Minister een infectieziekte behorend tot groep B1 worden aangemerkt als
      behorend tot groep A, een infectieziekte behorend tot groep B2 worden aangemerkt als behorend tot groep A of B1, of
      een infectieziekte behorend tot groep C worden aangemerkt als behorend tot groep A, B1 of B2.

      3 In de regeling, bedoeld in het eerste of tweede lid, wordt bepaald welke bepalingen van deze wet, die gelden voor
      de infectieziekten behorende tot de desbetreffende groep, in dat geval van toepassing zijn.

      4 Na het tot stand komen van een krachtens het eerste of tweede lid vastgestelde regeling wordt binnen acht weken
      een voorstel van wet tot incorporatie van die regeling aan de Tweede Kamer der Staten-Generaal gezonden. Indien het
      voorstel van wet wordt ingetrokken of door een der Kamers der Staten-Generaal wordt verworpen, wordt de regeling
      onverwijld ingetrokken.

      5 Indien naar het oordeel van Onze Minister een onverwijlde voorziening noodzakelijk is, kan Onze
      Minister bepalen dat een op grond van het eerste of tweede lid vastgestelde regeling onmiddellijk
      na bekendmaking in werking treedt. In dat geval kan Onze Minister deze regeling, in afwijking van
      [artikel 4, eerste lid, onder a, van de Bekendmakingswet][ref1], op andere dan de daar genoemde wijze bekend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '21'
    text: |-
      1 De arts die bij een door hem onderzocht persoon een ziektebeeld vaststelt met een volgens de stand van de
      wetenschap onbekende oorzaak, waarbij een gegrond vermoeden bestaat van besmettelijkheid en ernstig gevaar voor de
      volksgezondheid, meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.

      2 De arts die vaststelt dat een lijk is besmet met een infectueus of giftig agens of een infectueuze of giftige
      stof waardoor een ernstig gevaar voor de volksgezondheid kan ontstaan, meldt dit onverwijld aan de gemeentelijke
      gezondheidsdienst.

      3 De arts die een voor zijn praktijk ongewoon aantal gevallen vaststelt van een infectieziekte, niet behorend tot
      groep A, B1, B2 of C, die een gevaar vormt voor de volksgezondheid, meldt dit binnen 24 uur aan de gemeentelijke
      gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel21
  - number: '22'
    text: |-
      1 De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep A vermoedt of vaststelt,
      meldt dit onverwijld aan de gemeentelijke gezondheidsdienst.

      2 De arts die bij een door hem onderzocht persoon een infectieziekte behorend tot groep B1, B2 of C vaststelt,
      dan wel een vermoeden heeft dat deze persoon lijdt aan difterie, een humane infectie veroorzaakt door een dierlijk
      influenzavirus of rabies, meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst.

      3 De arts die gegronde redenen heeft om bij een persoon een infectieziekte behorend tot groep B1 of B2 te
      vermoeden, meldt dit binnen 24 uur aan de gemeentelijke gezondheidsdienst, indien die persoon weigert het onderzoek
      te ondergaan dat noodzakelijk is ter vaststelling van die ziekte en daardoor ernstig gevaar voor de volksgezondheid
      door de verspreiding van die infectieziekte kan ontstaan.

      4 Bij regeling van Onze Minister kan vrijstelling worden verleend van de meldingsplicht, bedoeld in het eerste,
      tweede en derde lid, met ingang van een daarbij te bepalen tijdstip en met inachtneming van daarbij te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel22
  - number: '23'
    text: |-
      1 De arts doet de in de [artikelen 21][ref1] en [22][ref2] bedoelde meldingen aan de gemeentelijke
      gezondheidsdienst van de gemeente waarin deze zijn praktijk heeft.

      2 Indien de meldingen, bedoeld in de [artikelen 21, eerste lid][ref3], en [22][ref4], betrekking hebben op een
      persoon die zijn verblijfplaats heeft in een andere gemeente, geeft de gemeentelijke gezondheidsdienst deze melding
      onverwijld door aan de gemeentelijke gezondheidsdienst van de verblijfplaats van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0024705#Artikel22
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel23
