  - number: '64'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel64
  - number: '65'
    text: |-
      In het geval van een besmetting of infectie of bij een gegrond vermoeden daarvan, zijn binnen hun ambtsgebied
      de burgemeester dan wel de voorzitter van de veiligheidsregio, de daartoe door de burgemeester dan wel de
      voorzitter van de veiligheidsregio aangewezen ambtenaren van de gemeentelijke gezondheidsdienst en de daartoe
      aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid bevoegd, desgevraagd na het tonen van een
      legitimatiebewijs, elke plaats te betreden of te verlaten, voor zover dat redelijkerwijs voor de vervulling van hun
      taak op grond van deze wet nodig is. Zonodig verschaffen zij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel65
  - number: '66'
    text: |-
      1 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt
      gestraft de arts die handelt in strijd met de [artikelen 21, eerste, tweede of derde lid][ref1],
      [22, eerste, tweede of derde lid][ref2], [24, vierde lid][ref3], of [30][ref4].

      2 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft het hoofd van
      een laboratorium dat handelt in strijd met [artikel 25, tweede of vijfde lid][ref5].

      3 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft het hoofd van
      een instelling die handelt in strijd met [artikel 26, eerste lid][ref6].

      4 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft de
      gezagvoerder die handelt in strijd met [artikel 50, eerste of tweede lid][ref7], of die weigert te voldoen aan een
      verzoek als bedoeld in de [artikelen 51][ref8] en [53, derde lid, onder b][ref9].

      5 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft de exploitant
      van een burgerhaven of burgerluchthaven die handelt in strijd met [artikel 50, vierde lid][ref10].

      6 Met een hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft degene die
      handelt in strijd met het bepaalde bij of krachtens [artikel 58, eerste en derde lid][ref11].

      7 De in het eerste tot en met zesde lid strafbaar gestelde feiten zijn overtredingen.


