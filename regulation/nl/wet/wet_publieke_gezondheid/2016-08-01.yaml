  - number: '28'
    text: |-
      1 De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in de
      [artikelen 21, eerste en tweede lid][ref1], en [22, eerste lid][ref2], onverwijld door aan het RIVM.

      2 De gemeentelijke gezondheidsdienst geeft de ontvangst van een melding als bedoeld in de
      [artikelen 21, derde lid][ref3], en [22, tweede en derde lid][ref4], binnen 24 uur door aan het RIVM.

      3 De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in de [artikelen 21, eerste lid][ref5],
      en [22][ref6] de volgende gegevens:

      a. de infectieziekte dan wel een beschrijving van het ziektebeeld, de eerste ziektedag, de vaccinatietoestand, het
      gebruik van chemoprofylaxe, eventuele ziekenhuisopname, de vermoedelijke infectiebron, zonodig met inbegrip van de
      daaruit voortkomende gevallen, de datum van vermoeden of vaststelling van infectie,

      b. het geslacht, de geboortemaand en het geboortejaar van de betrokken persoon, alsmede de eerste drie cijfers van
      de postcode van diens adres, en

      c. de uitslag van het nader onderzoek, bedoeld in [artikel 25, vijfde lid][ref7].

      4 De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in [artikel 21, tweede lid][ref8], de
      volgende gegevens: de aard van het infectueus of giftig agens of de infectueuze of giftige stof en de plaats waar
      het lijk zich bevindt.

      5 De gemeentelijke gezondheidsdienst verstrekt bij een melding als bedoeld in [artikel 21, derde lid][ref9], de
      volgende gegevens: de infectieziekte, het geslacht, de geboortedatum en de nationaliteit van de betrokken personen,
      alsmede de woonplaats van de arts die de melding heeft gedaan.


