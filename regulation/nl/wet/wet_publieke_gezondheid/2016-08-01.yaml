        artikel: '50'
        hoofdstuk: V
        paragraaf: '6'
  - number: '54'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio kan de exploitant van een burgerhaven of
      burgerluchthaven dan wel de burgerexploitant opdragen om:

      a. voorlichting aan reizigers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,

      b. medewerking te verlenen aan door de burgemeester dan wel de voorzitter van de veiligheidsregio te nemen
      maatregelen van onderzoek van vertrekkende of aankomende reizigers naar de aanwezigheid van een ziekte van
      infectueuze aard die een ernstig gevaar voor de volksgezondheid kan opleveren,

      c. ter voorkoming van een besmetting voorschriften van technisch-hygiënische aard uit te voeren, indien er een
      gegrond risico is op een besmetting,

      d. ter bestrijding van een besmetting gebouwen of terreinen dan wel gedeelten daarvan te sluiten.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel54
  - number: '55'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio kan de vervoersexploitant opdragen om:

      a. voorlichting aan passagiers te geven over het nemen van maatregelen ter voorkoming van een infectie of van een
      besmetting van de bagage,

      b. ter voorkoming van een besmetting maatregelen van technisch-hygiënische aard uit te voeren voor een schip of
      luchtvaartuig en de hierin aanwezige goederen, indien er een gegrond risico is op een besmetting,

      c. een schip of luchtvaartuig en de hierin aanwezige goederen te controleren op de aanwezigheid van een besmetting,

      d. ter bestrijding van een besmetting een schip of luchtvaartuig en de hierin aanwezige goederen te ontsmetten, met
      inbegrip van de vernietiging van vectoren.
    url: https://wetten.overheid.nl/BWBR0024705/2016-08-01#Artikel55
  - number: '56'
    text: |-
      De burgemeester dan wel de voorzitter van de veiligheidsregio is bevoegd tot het opleggen van een last onder
      bestuursdwang ter handhaving van hetgeen op grond van de [artikelen 53, eerste en tweede lid][ref1], [54][ref2] en
      [55][ref3] is opgedragen, indien de omstandigheden onmiddellijk ingrijpen noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel54
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel55
