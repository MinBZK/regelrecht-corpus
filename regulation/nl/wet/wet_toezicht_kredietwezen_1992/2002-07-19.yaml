  - number: '42.1'
    text: |-
      Artikel 28 is van overeenkomstige toepassing op een bijkantoor in Nederland van een in een Staat, die niet een Lid-
      Staat is, gevestigde kredietinstelling die een vergunning als bedoeld in artikel 38, eerste lid heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel42
  - number: '42.2'
    text: |-
      [Artikel 30e][ref1] is van overeenkomstige toepassing op een bijkantoor in Nederland van een in een Staat, die niet
      een Lid-Staat is, gevestigde kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref2],
      die een vergunning als bedoeld in [artikel 38, eerste lid][ref3], heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel30e
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel38
