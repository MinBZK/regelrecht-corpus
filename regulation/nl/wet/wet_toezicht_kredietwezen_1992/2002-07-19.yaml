        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '1'
  - number: '41.2'
    text: |-
      De [artikelen 30b][ref1] en [30c][ref2] zijn van overeenkomstige toepassing op een bijkantoor
      in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref3], die een vergunning als bedoeld in
      [artikel 38, eerste lid][ref4], heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel30c
