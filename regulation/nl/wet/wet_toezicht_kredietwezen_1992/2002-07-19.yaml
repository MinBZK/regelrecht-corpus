        artikel: '186'
  - number: '76.10'
    text: |-
      In afwijking van de laatste zin van het zevende lid kan op geverifieerde vorderingen welke opeisbaar worden op of
      na de datum van de beschikking als bedoeld in artikel 71, eerste of tweede lid, voor zover artikel 75, eerste lid,
      niet reeds op deze vorderingen werd toegepast, een uitkering eerst worden gedaan zodra deze vorderingen opeisbaar
      zijn geworden. Tot dat tijdstip wordt een bedrag aan liquide middelen afgezonderd tot ten minste het beloop van het
      totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen zullen kunnen worden uitgekeerd,
      dan wel wordt deze uitkering op andere wijze zeker gesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
  - number: '77'
    text: |-
      Nadat de rechtbank een verklaring als bedoeld in artikel 71, eerste of tweede lid, heeft gegeven dan wel verlengd,
      kan zij in afwijking van het bepaalde in [artikel 1 van de Faillissementswet][ref1] een kredietinstelling dan wel
      een bijkantoor slechts in staat van faillissement verklaren, indien een naar goed koopmansgebruik opgemaakte balans
      van de kredietinstelling dan wel het bijkantoor een tekort aanwijst, ongeacht of de kredietinstelling dan wel het
      bijkantoor verkeert in een toestand van te hebben opgehouden te betalen. De faillietverklaring vindt plaats, de
      Bank gehoord, op verzoek van de bewindvoerders, op de vordering van het Openbaar Ministerie of ambtshalve onder
      intrekking van bedoelde verklaring. Alsdan zomede indien de faillietverklaring wordt uitgesproken binnen een maand
      na het intrekken van de verklaring, gelden de volgende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '1'
  - number: 77.a
    text: |-
      het tijdstip, waarop de termijnen, in de [artikelen 43][ref1] en [45 van de Faillissementswet][ref2] vermeld,
      aanvangen, wordt berekend vanaf het geven van de verklaring, bedoeld in artikel 71, eerste of tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel45
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '43'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '45'
  - number: 77.b
    text: boedelschulden, na het geven van de verklaring ontstaan, zullen ook in het faillissement als boedelschulden gelden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77
  - number: 77.c
    text: |-
      de intrekking van de verklaring en de faillietverklaring worden door de bewindvoerders bekendgemaakt in de
      *Staatscourant* en in een of meer door de rechtbank aan te wijzen nieuwsbladen; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77
  - number: 77.d
    text: |-
      overigens is, voor zover niet reeds ingevolge artikel 76 tot volledige uitvoering gekomen, het bepaalde in
      [titel I van de Faillissementswet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 77a
    text: |-
      Indien een faillietverklaring wordt uitgesproken met toepassing van artikel 77 dan wel binnen vier weken
      na het einde van de bijzondere voorziening, geldt dat het tijdstip waarop de termijnen vermeld in de
      [artikelen 138, zesde lid][ref1], en [248, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref2] aanvangen, wordt
      berekend vanaf de aanvang van de bijzondere voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel248
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '138'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '248'
  - number: '78'
    text: |-
      De rechtbank kan op verzoek van de bewindvoerders of ambtshalve de verklaring, bedoeld in artikel 71, eerste of
      tweede lid, intrekken. Artikel 71, zesde en achtste lid, is alsdan van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel78
  - number: '79'
    text: |-
      Door de bekendmaking, bedoeld in artikel 75, vierde of zevende lid, artikel 77, onder *c*, of artikel 78, vervallen
      van rechtswege de bevoegdheden, welke de bewindvoerders ingevolge de verklaring, bedoeld in artikel 71, eerste of
      tweede lid, hadden verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel79
  - number: '80'
    text: |-
      Tegen beschikkingen van de rechtbank ingevolge de artikelen 71, eerste of tweede lid, en 75, eerste en tweede lid,
      staat geen hoger beroep open. Beroep in cassatie tegen deze beschikkingen moet worden ingesteld binnen veertien
      dagen na de dag van uitspraak. De behandeling heeft in raadkamer plaats en geschiedt met de grootste spoed. Het
      arrest wordt op een openbare terechtzitting uitgesproken en de zakelijke inhoud ervan wordt door de bewindvoerders
      in de *Staatscourant* en in een of meer daarbij aan te wijzen nieuwsbladen bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel80
  - number: '81.1'
    text: Onze minister kan bepalen dat
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
  - number: 81.1.a
    text: |-
      in afwijking van het bepaalde in de [artikelen 8][ref1] en [9][ref2], de Bank de behandeling van door
      dochtermaatschappijen van in een bepaalde Staat, die niet een Lid-Staat is, gevestigde ondernemingen of
      instellingen gevraagde vergunningen als bedoeld in [artikel 6][ref3] voor een bepaalde termijn opschort, met
      dienovereenkomstige opschorting van de termijn als bedoeld in [artikel 8, derde lid][ref4], dan wel dat de Bank
      slechts een door Onze minister te bepalen aantal door dochtermaatschappijen van in een bepaalde Staat, die niet een
      Lid-Staat is, gevestigde ondernemingen of instellingen gevraagde vergunningen als bedoeld in [artikel 6][ref5] zal
      verlenen; en


