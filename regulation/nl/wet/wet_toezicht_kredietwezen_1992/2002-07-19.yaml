  - number: 90c.2
    text: |-
      De bestuurlijke boete komt toe aan de Staat indien deze door de Minister van Financiën is opgelegd, of aan de Bank
      indien deze door haar is opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90c
  - number: 90c.3
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90c
  - number: 90c.4
    text: |-
      Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het opleggen van een bestuurlijke
      boete worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze
      wet jegens Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen. Het
      [vierde en vijfde lid van artikel 90b][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel90b
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90c
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 90b
        hoofdstuk: XIII_B
  - number: 90d.1
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90d
  - number: 90d.2
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90d
  - number: 90d.3
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90d
  - number: 90d.4
    text: |-
      Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, kan het bedrag van de boete lager
      stellen dan in de bijlage is bepaald, indien het bedrag van de boete in een bepaald geval op grond van bijzondere
      omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90d
  - number: 90d.5
    text: |-
      In afwijking van het eerste lid worden de bedragen van de boetes terzake van overtreding van de afzonderlijke
      regels, gesteld bij de algemene maatregelen van bestuur, bedoeld in de artikelen 85a en 85b, bepaald op de wijze
      als voorzien in die algemene maatregel van bestuur. Het eerste tot en met vierde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90d
  - number: 90e
    text: |-
      Degene jegens wie door Onze Minister, dan wel door de Bank voor zover zij bevoegd is een boete op te leggen, een
      handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem wegens een overtreding
      een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan
      in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90e
  - number: 90f.1
    text: |-
      Indien Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, voornemens is een boete
      op te leggen, geeft hij, dan wel de Bank, de betrokkene daarvan kennis onder vermelding van de gronden waarop het
      voornemen berust.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90f
  - number: 90f.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister, dan wel de Bank
      voor zover zij bevoegd is een boete op te leggen, de betrokkene in de gelegenheid om naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd, tenzij het een overtreding betreft
      die in de bijlage, bedoeld in artikel 90d, is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 90g.1
    text: Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90g
  - number: 90g.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90g
  - number: 90g.2.a
    text: het feit terzake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90g
  - number: 90g.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90g
  - number: 90g.2.c
    text: de termijn, bedoeld in artikel 90i, eerste lid, waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90g
  - number: 90h.1
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90h
  - number: 90h.2
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van artikel 90f, tweede lid, is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90h
  - number: 90i.1
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking van de
      beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van artikel 90f, tweede lid,
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.3
    text: |-
      Indien de boete niet tijdig is betaald, stuurt Onze Minister, dan wel de Bank indien zij de boete heeft opgelegd,
      schriftelijk een aanmaning om binnen twee weken de boete, verhoogd met de kosten van de aanmaning, alsnog te
      betalen. De aanmaning bevat de aanzegging, dat de boete, voor zover deze niet binnen de gestelde termijn wordt
      betaald, overeenkomstig het derde lid zal worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.4
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister, dan wel de Bank indien zij de boete heeft opgelegd, de boete,
      verhoogd met de kosten van de aanmaning en van de invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.5
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.6
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat,
      dan wel de Bank indien zij de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90i.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90i
  - number: 90j.1
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 90j.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in artikel 90c vervalt, indien Onze
      Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, ter zake van die overtreding reeds een
      boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90j
  - number: 90k.1
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90k
  - number: 90k.2
    text: |-
      De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90k
  - number: 90l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90l
  - number: 90m.1
    text: |-
      Met het oog op de belangen van crediteuren, kunnen Onze Minister en de Bank, onverminderd artikel 64, eerste en
      tweede lid, het feit terzake waarvan de last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden
      voorschrift, alsmede de naam, het adres en de woonplaats van degene aan wie de last onder dwangsom of de
      bestuurlijke boete is opgelegd, ter openbare kennis brengen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90m
  - number: 90m.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90m
  - number: '112.1'
    text: |-
      De vergunning die, op het tijdstip waarop deze wet in werking treedt, op grond van artikel 2 van de
      Wet toezicht kredietwezen (*Stb.* 1978, 255) is verleend dan wel op grond van artikel 62 van die wet of
      [artikel 7 van de Postbankwet][ref1] (*Stb.* 1985, 510) wordt geacht te zijn verleend aan een in Nederland
      gevestigde kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2], wordt geacht
      aan die kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] te zijn verleend op
      grond van artikel 6.


      [ref1]: https://wetten.overheid.nl/BWBR0003842#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003842
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '112.2'
    text: |-
      De vergunning die, op het tijdstip waarop deze wet in werking treedt, op grond van artikel 2 van de Wet
      toezicht kredietwezen is verleend dan wel op grond van artikel 62 van die wet wordt geacht te zijn verleend
      aan een buiten de Unie dan wel in een Lid-Staat ten aanzien waarvan Onze minister op dat tijdstip een
      maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, gevestigde onderneming of instelling die
      het bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] door
      middel van een bijkantoor in Nederland uitoefent, wordt geacht aan die kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] te zijn verleend op grond van artikel 38, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '112.3'
    text: |-
      De in een andere Lid-Staat, niet zijnde een Lid-Staat ten aanzien waarvan Onze minister een maatregel
      als bedoeld in artikel 33, eerste lid, heeft genomen, gevestigde onderneming of instelling die, op
      het tijdstip waarop deze wet in werking treedt, het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] door middel van een bijkantoor in Nederland uitoefent en die
      daarvoor een vergunning als bedoeld in artikel 2 van de Wet toezicht kredietwezen heeft verkregen dan wel op grond
      van artikel 62 van die wet geacht wordt te hebben verkregen, wordt geacht te hebben voldaan aan artikel 31, eerste
      lid, onder *b* en *c*.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 112a.1
    text: |-
      Een onderneming of instelling die op het tijdstip dat dit artikel in werking treedt, in Nederland het bedrijf
      van kredietinstelling, bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, uitoefent, wordt geacht over een
      vergunning als bedoeld in artikel 6 te beschikken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112a
  - number: 112a.2
    text: |-
      Een in een andere Lid-Staat gevestigde onderneming of instelling die op het tijdstip waarop dit artikel in
      werking treedt, in Nederland door middel van een bijkantoor dan wel het verrichten van diensten het bedrijf van
      kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, uitoefent, wordt geacht te hebben
      voldaan aan artikel 31, eerste lid, onderscheidenlijk artikel 32a.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112a
  - number: 112a.3
    text: |-
      Een onderneming of instelling als bedoeld in het eerste of tweede lid, meldt zich binnen één maand na het tijdstip
      waarop dit artikel in werking treedt bij de Bank en verstrekt binnen zes maanden na het tijdstip waarop dit
      artikel in werking treedt aan de Bank alle gegevens die de Bank nodig heeft om te beoordelen of de onderneming of
      instelling voldoet aan deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112a
  - number: 112a.4
    text: |-
      Indien de Bank op grond van de gegevens waarvan zij ingevolge het derde lid kennis heeft genomen, van oordeel is
      dat de onderneming of instelling niet voldoet aan het bepaalde bij of krachtens deze wet zijn het eerste en het
      tweede lid niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112a
  - number: 112a.5
    text: |-
      Indien een onderneming of instelling als bedoeld in het eerste en het tweede lid, niet binnen zes maanden na het
      tijdstip waarop dit artikel in werking treedt, heeft voldaan aan het bepaalde in het derde lid zijn het eerste en
      het tweede lid niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112a
  - number: 112b.1
    text: |-
      Indien een Lid-Staat [richtlijn nr. 2000/46/EG](32000L0046) van het Europees Parlement en de Raad van de Europese
      Gemeenschappen van 18 september 2000 betreffende de toegang tot, de uitoefening van en het bedrijfseconomisch
      toezicht op de werkzaamheden van instellingen voor elektronisch geld (Pb EG L 275) en [richtlijn nr. 2000/28/
      EG](32000L0028) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 18 september 2000 tot
      wijziging van [Richtlijn 2000/12/EG](32000L0012) betreffende de toegang tot en de uitoefening van de werkzaamheden
      van kredietinstellingen (Pb EG L 275) niet of onvolledig heeft uitgevoerd, kan Onze minister, de Bank gehoord,
      bepalen dat voor in die Lid-Staat gevestigde ondernemingen en instellingen het tweede en derde lid gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112b
  - number: 112b.2
    text: |-
      Op een onderneming of instelling als bedoeld in het eerste lid, zijn, met betrekking tot het uitoefenen van het
      bedrijf van kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, door middel van een
      bijkantoor in Nederland, in plaats van artikel 31, eerste lid, de artikelen 38 tot en met 44 van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112b
  - number: 112b.3
    text: |-
      Op een onderneming of instelling als bedoeld in het eerste lid, is, met betrekking tot het uitoefenen van het
      bedrijf van kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, door middel van het
      verrichten van diensten in Nederland, in plaats van artikel 32a, artikel 82a van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112b
  - number: 112b.4
    text: |-
      Met ingang van het tijdstip waarop de maatregel, bedoeld in het eerste lid, ten aanzien van een Lid-Staat wordt
      ingetrokken, wordt de in die Lid-Staat gevestigde onderneming of instelling die op dat tijdstip het bedrijf van
      kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, door middel van een bijkantoor
      in Nederland uitoefent en die daarvoor een vergunning als bedoeld in artikel 38, eerste lid, heeft verkregen,
      geacht te hebben voldaan aan artikel 31, eerste lid, onder b en c. De aan deze onderneming of instelling verleende
      vergunning als bedoeld in artikel 38, eerste lid, vervalt op dat tijdstip van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112b
  - number: 112b.5
    text: |-
      Met ingang van het tijdstip waarop de maatregel, bedoeld in het eerste lid, ten aanzien van een Lid-Staat wordt
      ingetrokken, wordt de in die Lid-Staat gevestigde onderneming of instelling die op dat tijdstip het bedrijf van
      kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, door middel van het verrichten
      van diensten in Nederland uitoefent en die daarvoor een ontheffing als bedoeld in artikel 82a, tweede lid, heeft
      verkregen, geacht te hebben voldaan aan artikel 32a. De aan deze onderneming of instelling verleende ontheffing als
      bedoeld in artikel 82a, tweede lid, vervalt op dat tijdstip van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel112b
  - number: '113'
    text: |-
      Een ontheffing die is verleend op grond van artikel 8 van de Wet toezicht kredietwezen wordt, voor zover deze
      ontheffing strekt, beschouwd als een ontheffing als bedoeld in artikel 12 tot een jaar na het tijdstip van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel113
  - number: '114.1'
    text: |-
      Een verklaring van geen bezwaar die is verleend op grond van artikel 25 van de Wet toezicht kredietwezen en die
      op het tijdstip waarop deze wet in werking treedt niet is vervallen of ingetrokken, wordt geacht te zijn verleend
      op grond van artikel 26 voor de in de artikelen 23 en 24 genoemde handelingen die overeenkomen met de handelingen
      waarvoor de verklaring van geen bezwaar was verleend, met dien verstande dat voor zover die verklaring van geen
      bezwaar betrekking heeft op het verwerven of vergroten van een deelneming of het uitoefenen van zeggenschap die
      tevens wordt geacht te zijn verleend voor het houden van een gekwalificeerde deelneming.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel114
  - number: '114.2'
    text: |-
      Ten aanzien van handelingen waarop het eerste lid niet van toepassing is en waarvoor ingevolge de artikelen 23
      of 24 een verklaring van geen bezwaar is vereist en waarop artikel 25 van de Wet toezicht kredietwezen niet van
      toepassing was, blijven de verboden als bedoeld in de artikelen 23 en 24 buiten toepassing tot de eerste dag van de
      negende kalendermaand na het tijdstip van inwerkingtreding van de artikelen 23 en 24.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel114
  - number: '114.3'
    text: |-
      Ten aanzien van een gekwalificeerde deelneming die reeds werd gehouden op 1 januari 1979 en waarvoor ingevolge
      de artikelen 23 onderscheidenlijk 24 een verklaring van geen bezwaar vereist is, wordt de kredietinstelling als
      bedoeld in artikel 23, eerste lid, onderscheidenlijk de natuurlijke persoon of rechtspersoon als bedoeld in artikel
      24, eerste lid, geacht te beschikken over een verklaring van geen bezwaar als bedoeld in artikel 23, eerste lid,
      onderscheidenlijk artikel 24, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel114
  - number: '115.1'
    text: |-
      Een ontheffing die is verleend op grond van artikel 42 van de Wet toezicht kredietwezen wordt geacht te zijn
      verleend op grond van artikel 82.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel115
  - number: '115.2'
    text: |-
      In afwijking van het eerste lid wordt de in een andere Lid-Staat gevestigde onderneming of instelling
      die, op het tijdstip waarop deze wet in werking treedt, het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] uitoefent en al dan niet op termijn opvorderbare gelden
      ter beschikking verkrijgt door middel van het verrichten van diensten in Nederland en die daarvoor een ontheffing
      als bedoeld in artikel 42 van de Wet toezicht kredietwezen heeft verkregen en die van de toezichthoudende
      autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van kredietinstelling als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] benodigde vergunning heeft verkregen, geacht te hebben
      voldaan aan artikel 32, eerste lid, onder *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '116'
    text: |-
      Een ontheffing die is verleend op grond van artikel 43 van de Wet toezicht kredietwezen aan een onderneming of
      instelling die niet ingevolge artikel 52, tweede lid, is geregistreerd, wordt geacht te zijn verleend op grond van
      artikel 83.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel116
  - number: '117'
    text: |-
      Het koninklijk besluit van 10 april 1986 (*Stb.* 189) tot verbindend verklaring van de herziene collectieve
      garantieregeling op grond van artikel 44 van de Wet toezicht kredietwezen geldt als het koninklijk besluit als
      bedoeld in artikel 84, tweede lid. De verwijzingen in deze herziene collectieve garantieregeling naar bepalingen in
      de Wet toezicht kredietwezen worden gelezen als verwijzingen naar de overeenkomstige bepalingen in deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel117
  - number: '120'
    text: |-
      Indien het bij koninklijke boodschap van 27 juni 1991 ingediende wetsvoorstel houdende bepalingen voor de
      jaarrekening van banken, nadat het tot wet is verheven, in werking treedt, wordt, indien artikel VI, eerste lid,
      van die wet wordt toegepast, het totale bedrag van de onderwaardering alsmede dat van de terugnemingen gemeld aan
      de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel120
  - number: '122'
    text: De wet van 13 april 1978, *Stb.* 255, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel122
  - number: '123'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel123
  - number: '124'
    text: 'Deze wet kan worden aangehaald als: Wet toezicht kredietwezen 1992.'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel124
