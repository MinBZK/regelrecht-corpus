  - number: 81.1.c
    text: |-
      in afwijking van het bepaalde in [artikel 30d][ref1] de beslissing van de Bank, nadat zij door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen in kennis is gesteld overeenkomstig
      [artikel 30d, eerste lid][ref2], voor een bepaalde termijn wordt opgeschort, met dienovereenkomstige opschorting
      van de termijn als bedoeld in [artikel 30d, derde lid][ref3], dan wel dat de Bank, nadat zij door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen in kennis is gesteld overeenkomstig
      [artikel 30d, eerste lid][ref4], slechts in een door Onze minister te bepalen aantal gevallen meedeelt dat geen
      bezwaar bestaat tegen het voornemen; en.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel30d
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel30d
