  - number: 81.1.b
    text: |-
      in afwijking van het bepaalde in de [artikelen 24][ref1] en [26][ref2] de behandeling van door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen gevraagde verklaringen van geen bezwaar
      als bedoeld in [artikel 24, eerste lid][ref3], voor een bepaalde termijn worden opgeschort, met dienovereenkomstige
      opschorting van de termijn als bedoeld in [artikel 26, derde lid][ref4], dan wel dat slechts een door Onze minister
      te bepalen aantal door in een bepaalde Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen
      gevraagde verklaringen van geen bezwaar als bedoeld in [artikel 24, eerste lid][ref5], zullen worden verleend; en


