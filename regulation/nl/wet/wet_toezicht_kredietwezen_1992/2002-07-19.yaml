        afdeling: '1'
  - number: '43'
    text: |-
      Een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling die
      een vergunning als bedoeld in artikel 38, eerste lid, heeft verkregen, voert voor zijn bedrijf hier te lande een
      afzonderlijke boekhouding, die zodanig is dat de Bank de haar bij deze wet opgelegde taak kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel43
  - number: '44'
    text: |-
      Een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling die een
      vergunning als bedoeld in artikel 38, eerste lid heeft verkregen, is verplicht jaarlijks binnen zes maanden na
      afloop van het boekjaar van de kredietinstelling waarvan het onderdeel uitmaakt, de boekhoudbescheiden, aangewezen
      krachtens de [Handelsregisterwet 1996][ref1], bij de Bank in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: '45.1'
    text: |-
      Op aanvraag van een financiële instelling die dochtermaatschappij is van één of meer kredietinstellingen die een
      vergunning bedoeld in artikel 6 heeft of hebben verkregen, en die haar bedrijf door middel van een bijkantoor dan
      wel het verrichten van diensten in een andere Lid-Staat uitoefent dan wel voornemens is uit te oefenen, kan de Bank
      aan die financiële instelling een verklaring van ondertoezichtstelling verlenen en daarbij het bij of krachtens de
      artikelen 11, 20, 22, 24, 26 en 27 bepaalde van overeenkomstige toepassing verklaren op die financiële instelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: '45.2'
    text: |-
      De aanvraag bevat, ten behoeve van de beslissing omtrent het verlenen van een verklaring van ondertoezichtstelling
      als bedoeld in artikel 46, gegevens omtrent:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: 45.2.a
    text: |-
      de identiteit van de kredietinstelling of kredietinstellingen waarvan de financiële instelling dochtermaatschappij
      is;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: 45.2.b
    text: een programma van werkzaamheden welke de financiële instelling verricht dan wel voornemens is te verrichten; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: 45.2.c
    text: de voorziene administratieve organisatie - met inbegrip van de financiële administratie en de interne controle.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: '45.3'
    text: De Bank beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel45
  - number: '46'
    text: 'De Bank verleent de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, slechts indien:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel46
  - number: 46.a
    text: |-
      de financiële instelling aantoont, dat het haar, voor zover op haar werkzaamheden andere wettelijke voorschriften
      van toepassing zijn, is toegestaan deze werkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel46
  - number: 46.b
    text: |-
      de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, ten minste 90 procent van de
      stemrechten in de financiële instelling bezit of bezitten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel46
  - number: 46.c
    text: |-
      de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, met instemming van de Bank de
      verplichtingen van de financiële instelling garandeert of garanderen; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel46
  - number: 46.d
    text: |-
      de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, naar het oordeel van de Bank
      mede zorgdraagt of zorgdragen voor een gezonde bedrijfsvoering bij de financiële instelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel46
  - number: '47'
    text: 'De Bank kan een verklaring van ondertoezichtstelling intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.a
    text: de financiële instelling daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.b
    text: |-
      de onderneming of instelling, aan welke de verklaring van ondertoezichtstelling is verleend, opgehouden heeft een
      financiële instelling te zijn;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.c
    text: de financiële instelling niet meer voldoet aan het bepaalde in artikel 46, onder *a*;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.d
    text: |-
      met betrekking tot de financiële instelling niet meer wordt voldaan aan het in artikel 46, onder *b*, *c* of *d*
      bepaalde of het in de artikelen 24, 26 of 27, eerste lid, bepaalde niet wordt nageleefd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.e
    text: de financiële instelling het bij of krachtens de artikelen 11, 20, 22 of 27, tweede lid, bepaalde niet naleeft; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: 47.f
    text: |-
      de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van ondertoezichtstelling zodanig
      onjuist of onvolledig blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van
      het verzoek de juiste omstandigheden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel47
  - number: '48.1'
    text: |-
      Een financiële instelling, die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid,
      heeft verkregen en die het bedrijf, dat zij in Nederland uitoefent, uitoefent dan wel voornemens is uit te oefenen
      door middel van een bijkantoor in een andere Lid-Staat, dient de Bank daarvan schriftelijk kennis te geven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '48.2'
    text: 'De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: 48.2.a
    text: de Lid-Staat waarin de financiële instelling het bijkantoor heeft gevestigd dan wel voornemens is te vestigen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: 48.2.b
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie - met inbegrip van de financiële administratie en de interne controle - ten behoeve van
      het bijkantoor zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: 48.2.c
    text: het adres van het bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: 48.2.d
    text: de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '48.3'
    text: |-
      De Bank doet binnen dertien weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van die gegevens alsmede van gegevens omtrent de omvang van het eigen
      vermogen van de financiële instelling en de solvabiliteitsratio op geconsolideerde basis van de kredietinstelling
      of kredietinstellingen als bedoeld in artikel 45, eerste lid, aan de toezichthoudende autoriteit van de Lid-Staat
      als bedoeld in het tweede lid, onder *a*. De Bank stelt de financiële instelling schriftelijk van het doen van deze
      mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '48.4'
    text: |-
      Indien de Bank van oordeel is dat de financiële instelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor als bedoeld in het eerste lid verricht dan wel voornemens is te verrichten, redelijkerwijs niet zal
      kunnen voldoen aan de richtlijnen als bedoeld in de artikelen 20 en 22, doet zij, in afwijking van het derde lid,
      geen mededeling aan de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De
      Bank stelt de financiële instelling hiervan, binnen dertien weken na ontvangst van de kennisgeving als bedoeld in
      het eerste lid en de gegevens als bedoeld in het tweede lid, in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '48.5'
    text: |-
      Indien zich een wijziging van de gegevens als bedoeld in het tweede lid, onder *b*, *c* of *d*, voordoet of indien
      het voornemen bestaat om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het eerste
      lid te staken, stelt de financiële instelling de Bank en de toezichthoudende autoriteit van de andere Lid-Staat
      daarvan ten minste vier weken voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '48.6'
    text: |-
      Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van oordeel
      is dat de financiële instelling, gezien de werkzaamheden die zij door middel van het bijkantoor als bedoeld in het
      eerste lid verricht, redelijkerwijs niet langer zal kunnen voldoen aan de richtlijnen als bedoeld in de artikelen
      20 en 22, trekt zij de mededeling als bedoeld in het derde lid in. De Bank stelt de toezichthoudende autoriteit van
      de andere Lid-Staat en de financiële instelling schriftelijk van het intrekken van de mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel48
  - number: '49.1'
    text: |-
      Een financiële instelling, die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid,
      heeft verkregen en die het bedrijf, dat zij in Nederland uitoefent, door middel van het verrichten van diensten in
      een andere Lid-Staat voor de eerste maal na de verkrijging van de verklaring van ondertoezichtstelling als bedoeld
      in artikel 45, eerste lid, in die Lid-Staat uitoefent dan wel voornemens is uit te oefenen, dient de Bank daarvan
      schriftelijk kennis te geven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel49
  - number: '49.2'
    text: 'De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel49
  - number: 49.2.a
    text: de Lid-Staat waarin de financiële instelling de werkzaamheden voornemens is te verrichten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel49
  - number: 49.2.b
    text: de werkzaamheden welke de financiële instelling voornemens is te verrichten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel49
  - number: '49.3'
    text: |-
      De Bank doet binnen vier weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van de gegevens als bedoeld in het tweede lid, onder *b*, aan de
      toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de financiële
      instelling schriftelijk van het doen van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel49
  - number: '50.1'
    text: |-
      Een financiële instelling die in een andere Lid-Staat, niet-zijnde een Lid-Staat ten aanzien waarvan Onze minister
      een maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, is gevestigd en die in die Lid-Staat een met
      de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, vergelijkbare verklaring heeft
      verkregen, is het, onverminderd de toepasselijkheid van andere op haar werkzaamheden betrekking hebbende wettelijke
      voorschriften, slechts toegestaan om, voor zover het werkzaamheden genoemd in bijlage I van de Richtlijn betreft,
      uitsluitend de werkzaamheden vermeld in het programma van werkzaamheden als bedoeld onder *a*, (1), door middel van
      een bijkantoor in Nederland te verrichten, indien
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a
    text: 'de Bank een kennisgeving heeft ontvangen van de toezichthoudende autoriteit van de andere Lid-Staat, welke bevat:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a.(1)
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het bijkantoor
      zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a.(2)
    text: het adres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a.(3)
    text: de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a.(4)
    text: de omvang van het eigen vermogen van de financiële instelling; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.a.(5)
    text: |-
      de solvabiliteitsratio op geconsolideerde basis van de kredietinstelling of kredietinstellingen waarvan de
      financiële instelling dochtermaatschappij is; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: 50.1.b
    text: |-
      de Bank de ontvangst van de kennisgeving bedoeld onder a aan de financiële instelling heeft medegedeeld dan wel er
      acht weken zijn verstreken vanaf het tijdstip waarop de Bank de kennisgeving als bedoeld onder *a* heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: '50.2'
    text: |-
      De in een andere Lid-Staat gevestigde financiële instelling als bedoeld in het eerste lid dient de Bank en de
      toezichthoudende autoriteit van die andere Lid-Staat ten minste vier weken van te voren in kennis te stellen van
      elke wijziging van de gegevens als bedoeld in het eerste lid, onder *a*, sub (1), (2) of (3) of, in voorkomend
      geval, van het voornemen om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het
      eerste lid te staken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel50
  - number: '51'
    text: |-
      Een financiële instelling die in een andere Lid-Staat, niet-zijnde een Lid-Staat ten aanzien waarvan Onze minister
      een maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, is gevestigd en die in die Lid-Staat een met
      de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, vergelijkbare verklaring heeft
      verkregen, is het, onverminderd de toepasselijkheid van andere op haar werkzaamheden betrekking hebbende wettelijke
      voorschriften, slechts toegestaan om, voor zover het werkzaamheden genoemd in bijlage I van de Richtlijn betreft,
      uitsluitend de in de kennisgeving vermelde werkzaamheden door middel van het verrichten van diensten in Nederland
      te verrichten, indien de financiële instelling een kennisgeving heeft gezonden aan de toezichthoudende autoriteit
      van die andere Lid-Staat, welke bevat een opgave van de voorgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel51
  - number: '52.1'
    text: Er is een register dat door de zorg van de Bank wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '52.2'
    text: |-
      De Bank draagt zorg voor de inschrijving van iedere kredietinstelling: a. die een vergunning als bedoeld in artikel
      6 heeft verkregen; b. die een vergunning als bedoeld in artikel 38, eerste lid heeft verkregen; c. die krachtens
      artikel 31 in Nederland het bedrijf van kredietinstelling mag uitoefenen; d. die krachtens artikel 32 of 32a in
      Nederland haar werkzaamheden door middel van het verlenen van diensten mag verrichten; en van iedere financiële
      instelling: e. die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft verkregen;
      f. die krachtens artikel 50 werkzaamheden in Nederland mag verrichten; en g. die krachtens artikel 51 werkzaamheden
      in Nederland mag verrichten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '52.3'
    text: |-
      De Bank draagt zorg voor de doorhaling van een inschrijving van iedere kredietinstelling: a. waarvan de vergunning
      als bedoeld in artikel 6 is ingetrokken; b. waarvan de vergunning als bedoeld in artikel 38, eerste lid is
      ingetrokken; c. die niet langer krachtens artikel 31 in Nederland het bedrijf van kredietinstelling mag uitoefenen;
      d. die niet langer krachtens artikel 32 of 32a in Nederland haar werkzaamheden door middel van het verlenen van
      diensten mag verrichten; en van iedere financiële instelling: e. waarvan de verklaring van ondertoezichtstelling
      als bedoeld in artikel 45, eerste lid, is ingetrokken; f. die niet langer krachtens artikel 50 werkzaamheden in
      Nederland mag verrichten; en g. die niet langer krachtens artikel 51 werkzaamheden in Nederland mag verrichten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '52.4'
    text: |-
      Van de inschrijving dan wel de doorhaling van een inschrijving in het register van een kredietinstelling of
      financiële instelling wordt door de zorg van de Bank binnen twee weken na de dag, waarop deze heeft plaats gehad,
      mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '52.5'
    text: |-
      In de maand januari van elk jaar wordt door de zorg van de Bank een afschrift van het register naar de stand per 31
      december van het voorafgaande jaar in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '52.6'
    text: Een afschrift van het register ligt voor een ieder kosteloos ter inzage ten kantore van de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel52
  - number: '53'
    text: |-
      De Bank is bevoegd bij iedere onderneming of instelling, van welke zij vermoedt, dat zij een kredietinstelling
      in de zin van artikel 1 is of dat zij handelt in strijd met de bij of krachtens deze wet gestelde regels, alle
      inlichtingen in te winnen of te doen inwinnen, die redelijkerwijs geacht kunnen worden nodig te zijn om dit te
      beoordelen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel53
  - number: '54'
    text: |-
      De Bank is bevoegd bij een kredietinstelling die ingevolge artikel 52 tweede lid, onder *a*, *b* of *c*, is
      geregistreerd, alle inlichtingen in te winnen of te doen inwinnen, die zij meent nodig te hebben voor de juiste
      uitoefening van de taak, haar bij deze wet opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel54
  - number: '55.1'
    text: |-
      Een kredietinstelling die ingevolge artikel 52, tweede lid, onder a of b is geregistreerd, dient bij de Bank
      periodiek binnen de daartoe vastgestelde termijnen staten, al dan niet tevens op geconsolideerde basis, inzake
      haar bedrijf in, die de Bank nodig heeft voor de juiste uitoefening van de taak, haar bij artikel 2 van deze wet
      opgelegd. Op verzoek van de Bank dient een kredietinstelling die ingevolge artikel 52, tweede lid, onder c is
      geregistreerd, deze staten, al dan niet periodiek, binnen de daartoe vastgestelde termijn bij de Bank in.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.2'
    text: |-
      De vorm, waarin de in het eerste lid bedoelde staten moeten worden opgemaakt, de benaming en omschrijving van
      de posten welke zij moeten bevatten, de achtereenvolgende tijdstippen waarop zij betrekking moeten hebben, de
      termijnen, binnen welke zij moeten worden ingediend en de te hanteren grondslagen van de waardering van de posten
      worden door de Bank bepaald en kunnen voor onderscheiden groepen van kredietinstellingen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.3'
    text: |-
      Indien de Bank zulks in het belang van een doelmatig toezicht noodzakelijk acht, kan zij een kredietinstelling
      opdragen staten als bedoeld in het eerste lid, bij haar in te dienen die betrekking hebben op tijdstippen met een
      kortere tussenpoos of op kortere termijnen dan ingevolge het tweede lid is bepaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.4'
    text: |-
      De verplichtingen als omschreven in het eerste lid gelden niet voor zover aan een kredietinstelling een ontheffing
      als bedoeld in de artikelen 20, vierde lid, 21, vierde lid, of 30b, derde lid is verleend.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.5'
    text: |-
      De staten als bedoeld in het eerste lid moeten periodiek zijn voorzien van een
      verklaring omtrent de getrouwheid, ondertekend door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De kredietinstelling is verplicht bij de
      opdracht tot het onderzoek de accountant schriftelijk te machtigen desgevraagd of ingevolge een daartoe strekkende
      overeenkomst tussen de kredietinstelling, de accountant en de Bank aan de Bank alle inlichtingen te verstrekken,
      die redelijkerwijze geacht kunnen worden nodig te zijn voor de juiste uitvoering van de taak, bij deze wet aan
      de Bank opgelegd. De Bank stelt de kredietinstelling in de gelegenheid aanwezig te zijn bij het verstrekken van
      inlichtingen door de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '55.6'
    text: |-
      De accountant, bedoeld in het vijfde lid, meldt de Bank zo spoedig mogelijk elke omstandigheid waarvan hij bij de
      uitvoering van zijn werkzaamheden als bedoeld in het vijfde lid kennis heeft gekregen en die:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: 55.6.a
    text: in strijd is met de eisen die voor het verkrijgen van een vergunning als bedoeld in artikel 6 of 38 zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: 55.6.b
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: 55.6.c
    text: het voortbestaan van de kredietinstelling bedreigt; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: 55.6.d
    text: leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.7'
    text: |-
      Op de accountant die naast zijn werkzaamheden voor de kredietinstelling ook werkzaamheden uitvoert voor een andere
      onderneming of instelling, is de meldingsplicht, bedoeld in het zesde lid, van overeenkomstige toepassing indien
      de kredietinstelling dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere
      onderneming of instelling dochtermaatschappij is van de kredietinstelling. Voor de toepassing van de eerste volzin
      wordt onder dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in artikel 24*a* van Boek 2 van
      het Burgerlijk Wetboek, met dien verstande dat een kredietinstelling tevens dochtermaatschappij kan zijn van een
      natuurlijk persoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.8'
    text: |-
      De accountant die op grond van het zesde of zevende lid tot een melding aan de Bank is overgegaan, is niet
      aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle
      feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '55.9'
    text: |-
      De Bank kan geheel of gedeeltelijk ontheffing verlenen van de verplichting als omschreven in het eerste lid en aan
      deze ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel55
  - number: '56.1'
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] die ingevolge artikel
      52, tweede lid, onder *a* of *b*, is geregistreerd, is verplicht de Bank onverwijld in kennis te stellen van het
      geheel of gedeeltelijk niet voldoen aan de richtlijnen als bedoeld in de artikelen 20, 21 of 22.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '56.2'
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] die ingevolge artikel
      52, tweede lid, onder *c*, is geregistreerd, is verplicht de Bank onverwijld in kennis te stellen van het geheel of
      gedeeltelijk niet voldoen aan de richtlijnen als bedoeld in artikel 21.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '56.3'
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die ingevolge
      [artikel 52, tweede lid, onder a of b][ref2], is geregistreerd, is verplicht de Bank onverwijld in kennis te
      stellen van het geheel of gedeeltelijk niet voldoen aan de richtlijnen als bedoeld in de [artikelen 30b][ref3]
      of [30c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel30b
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel30c
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0005792
        artikel: 30b
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: 30c
        hoofdstuk: II
        afdeling: '4'
  - number: 56a
    text: |-
      De Bank is bevoegd de personen als bedoeld in artikel 9, eerste lid, onder *b*, *c*, *d* en *e*, op te roepen.
      Deze personen zijn verplicht op die oproeping te verschijnen. De oproeping geschiedt op een door de Bank te bepalen
      wijze. De personen zijn verplicht alle gevraagde inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel56a
  - number: '57'
    text: De Bank is bevoegd bij
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: 57.a
    text: |-
      iedere onderneming of instelling die, overeenkomstig het bepaalde ingevolge artikel 20, derde lid, onder *d*,
      binnen de reikwijdte van de consolidatie valt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: 57.b
    text: |-
      iedere dochtermaatschappij van een kredietinstelling die ingevolge artikel 52, tweede lid, onder *a* of *b*, is
      geregistreerd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: 57.c
    text: |-
      iedere houder van een verklaring van geen bezwaar als bedoeld in artikel 24, eerste lid, waarvan de betrokken
      kredietinstelling dochtermaatschappij is;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: 57.d
    text: |-
      iedere onderneming of instelling die, overeenkomstig het bepaalde ingevolge artikel 25, tweede lid, onder *c*,
      binnen de reikwijdte van de consolidatie valt; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: 57.e
    text: |-
      iedere dochtermaatschappij van een houder van een verklaring van geen bezwaar als bedoeld in artikel 24, eerste
      lid, waarvan tevens de betrokken kredietinstelling dochtermaatschappij is;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel57
  - number: '58.1'
    text: |-
      Een onderneming of instelling als bedoeld in artikel 57, onder *a* of *d*, dient een zodanige boekhouding te
      voeren, dat zij de Bank de inlichtingen als bedoeld in artikel 57 kan verschaffen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel58
  - number: '58.2'
    text: |-
      Indien de Bank van oordeel is dat een onderneming of instelling niet aan het bepaalde in het eerste lid voldoet,
      kan zij aan die onderneming of instelling een voorschrift met betrekking tot het voeren van haar boekhouding geven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel58
  - number: '59'
    text: |-
      De artikelen 54, 55 en 57 zijn van overeenkomstige toepassing met betrekking tot een financiële instelling die een
      verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel59
  - number: '60.1'
    text: |-
      Ingeval een onderneming of instelling als bedoeld in artikel 57 in een andere Lid-Staat is gevestigd, kan de Bank,
      ten behoeve van het toezicht:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: 60.1.a
    text: |-
      de bevoegde instantie in de andere Lid-Staat verzoeken zich ter plaatse van de juistheid van de aan de Bank
      verstrekte inlichtingen te overtuigen; dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: 60.1.b
    text: |-
      zich, na daartoe van de bevoegde instantie in de andere Lid-Staat toestemming te hebben verkregen, ter plaatse van
      de juistheid van de aan de Bank verstrekte inlichtingen overtuigen of te doen overtuigen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: '60.2'
    text: |-
      Ingeval van een bijkantoor als bedoeld in artikel 16, eerste lid, of artikel 48, eerste lid, kan de Bank, ten
      behoeve van het toezicht:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: 60.2.a
    text: |-
      de toezichthoudende autoriteit van de andere Lid-Staat verzoeken zich ter plaatse van de juistheid van de aan de
      Bank verstrekte inlichtingen te overtuigen; dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: 60.2.b
    text: |-
      zich, na daaromtrent de toezichthoudende autoriteit van de andere Lid-Staat in kennis te hebben gesteld, ter
      plaatse van de juistheid van de aan de Bank verstrekte inlichtingen overtuigen of te doen overtuigen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel60
  - number: '61.1'
    text: |-
      Ingeval, in overeenstemming met de Richtlijn, ten behoeve van het toezicht op kredietinstellingen in een
      andere Lid-Staat door dan wel omtrent een in Nederland gevestigde onderneming of instelling inlichtingen aan de
      toezichthoudende autoriteiten van die Lid-Staat zijn verstrekt, zal de Bank na daartoe door de toezichthoudende
      autoriteit van de desbetreffende Lid-Staat te zijn verzocht:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: 61.1.a
    text: |-
      zich ter plaatse van de juistheid van de aan de toezichthoudende autoriteit van de andere Lid-Staat verstrekte
      inlichtingen overtuigen; dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: 61.1.b
    text: |-
      de toezichthoudende autoriteit van de andere Lid-Staat toestaan zich ter plaatse van de juistheid van de aan haar
      verstrekte inlichtingen te overtuigen of te doen overtuigen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: '61.2'
    text: |-
      Ingeval van een bijkantoor als bedoeld in artikel 31, eerste lid, of artikel 50, eerste lid, zal, ten behoeve van
      het toezicht in de andere Lid-Staat:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: 61.2.a
    text: |-
      de Bank zich, op verzoek van de toezichthoudende autoriteit van de andere Lid-Staat, ter plaatse van de juistheid
      van de aan die toezichthoudende autoriteit verstrekte inlichtingen overtuigen; dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: 61.2.b
    text: |-
      de toezichthoudende autoriteit van de andere Lid-Staat, wanneer deze daaromtrent de Bank in kennis heeft gesteld,
      zich ter plaatse van de juistheid van de aan haar verstrekte inlichtingen overtuigen of te doen overtuigen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel61
  - number: '62.1'
    text: |-
      Iedere onderneming of instelling is verplicht de inlichtingen, die krachtens de artikelen 53, 54, 55, 57, 59 of 61
      bij haar worden ingewonnen, binnen een door of namens de Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel62
  - number: '62.2'
    text: |-
      Iedere onderneming of instelling is verplicht de Bank, of degene die in opdracht van de Bank inlichtingen als
      bedoeld in het eerste lid bij haar inwint, desgevorderd in de gelegenheid te stellen zich van de juistheid van de
      verstrekte inlichtingen te overtuigen aan de hand van zakelijke gegevens en bescheiden en daarbij zoveel mogelijk
      behulpzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel62
  - number: '62.3'
    text: |-
      Een derde, die de in het tweede lid bedoelde zakelijke gegevens en bescheiden onder zich heeft, is desgevorderd
      verplicht deze daartoe over te leggen dan wel toegankelijk te maken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel62
  - number: '62.4'
    text: |-
      Het bepaalde in het eerste tot en met derde lid is van overeenkomstige toepassing ingeval een toezichthoudende
      autoriteit van een andere Lid-Staat zich krachtens artikel 61 van de juistheid van de aan haar verstrekte
      inlichtingen overtuigt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel62
  - number: '63'
    text: |-
      De bij of krachtens deze wet te verschaffen inlichtingen en opgaven moeten tijdig, naar waarheid en op niet
      misleidende wijze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel63
  - number: '64.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke ondernemingen
      of instellingen zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een instantie als bedoeld in
      de artikelen 65, eerste lid, of 65*a*, eerste lid, zijn ontvangen, worden niet gepubliceerd en zijn geheim.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel64
  - number: '64.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie als
      bedoeld in de artikelen 65, eerste lid, of 65*a*, eerste lid, ontvangen, of van gegevens of inlichtingen, bij het
      onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken of daaraan verder of
      anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel64
  - number: '64.3'
    text: |-
      Het in het eerste en tweede lid bepaalde laat, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1] welke betrekking hebben
      op het als getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of inlichtingen
      verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '64.4'
    text: |-
      Het in het eerste en tweede lid bepaalde laat evenzo, ten aanzien van degene op wie het tweede lid van toepassing
      is, onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en
      van [artikel 66 van de Faillissementswet][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een kredietinstelling die in staat van faillissement is verklaard of op grond van
      een rechterlijke uitspraak is ontbonden. Het in de vorige volzin bepaalde geldt niet voor gegevens of inlichtingen
      die betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging de
      desbetreffende kredietinstelling in staat te stellen haar bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: '64.5'
    text: |-
      In afwijking van het eerste en tweede lid is de Bank bevoegd met gebruikmaking van gegevens of inlichtingen
      verkregen bij de vervulling van haar ingevolge deze wet opgedragen taak, mededelingen te doen mits deze niet kunnen
      worden herleid tot afzonderlijke ondernemingen of instellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister onderscheidenlijk de Bank is, in afwijking van artikel 64, eerste en tweede lid, bevoegd om gegevens
      of inlichtingen verkregen bij de vervulling van de hem onderscheidenlijk haar ingevolge deze wet opgedragen taak,
      te verstrekken aan Nederlandse of buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van
      overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op natuurlijke
      personen en rechtspersonen die op die markten werkzaam zijn, tenzij:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: '65.2'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die de gegevens of inlichtingen op grond
      van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.2.a
    text: voor zover het beoogde gebruik niet in strijd is met het eerste lid; dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.2.b
    text: |-
      voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65.2.c
    text: |-
      pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65
  - number: 65a.1
    text: |-
      Onze minister onderscheidenlijk de Bank is, in afwijking van artikel 64, eerste en tweede lid, bevoegd om gegevens
      of inlichtingen verkregen bij de vervulling van de hem onderscheidenlijk haar ingevolge deze wet opgedragen
      taak, te verstrekken aan een rechter-commissaris voor zover die belast is met het toezicht uit hoofde van
      [artikel 64 van de Faillissementswet][ref1] op de curator die betrokken is bij het beheer en de vereffening van de
      failliete boedel van een kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel64
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '64'
  - number: 65a.2
    text: 'Onze minister onderscheidenlijk de Bank verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65a
  - number: 65a.2.a
    text: |-
      indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65a
  - number: 65a.2.b
    text: |-
      indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van
      Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële
      markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze instanties niet
      instemmen met het verstrekken van de gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65a
  - number: 65a.3
    text: |-
      Artikel 64, eerste tot en met vierde lid, is van overeenkomstige toepassing met betrekking tot de op grond van het
      eerste lid verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel65a
  - number: '66.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, is Onze Minister onderscheidenlijk de
      Bank bevoegd ten behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag
      of die met Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die
      Staat belast is met de uitvoering van wettelijke regelingen inzake het toezicht op het kredietwezen, inlichtingen
      te vragen aan of een onderzoek in te stellen of te doen instellen bij een ieder die ingevolge deze wet onder zijn
      respectievelijk haar toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over
      gegevens of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen als
      hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66
  - number: '66.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, is verplicht deze gegevens
      of inlichtingen binnen een door Onze minister onderscheidenlijk de Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66
  - number: '66.3'
    text: |-
      Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, dient aan de persoon die het onderzoek
      verricht alle medewerking te verlenen die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      zakelijke gegevens en bescheiden voor zover deze op de uitoefening van zijn beroep of bedrijf betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66
  - number: 66a.1
    text: |-
      Onze Minister onderscheidenlijk de Bank kan toestaan dat een functionaris van een buitenlandse instantie als
      bedoeld in artikel 66, eerste lid, deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66a
  - number: 66a.2
    text: |-
      De verplichting, omschreven in het derde lid van artikel 66, geldt eveneens jegens de in het eerste lid bedoelde
      functionaris.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66a
  - number: 66a.3
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel66a
  - number: '67.1'
    text: |-
      De Bank doet van iedere verlening en van iedere intrekking van een vergunning als bedoeld in [artikel 6][ref1]
      met betrekking tot een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2],
      onverwijld mededeling aan de toezichthoudende autoriteiten van de andere Lid-Staten en aan de Commissie van de
      Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '67.2'
    text: |-
      De Bank doet van iedere verlening en van iedere intrekking van een verklaring van ondertoezichtstelling als bedoeld
      in artikel 45, eerste lid, onverwijld mededeling aan de toezichthoudende autoriteiten van de andere Lid-Staten en
      aan de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel67
  - number: 67a.1
    text: |-
      De Bank werkt samen met de autoriteiten die ingevolge de [Wet toezicht beleggingsinstellingen][ref1],
      de [Wet toezicht effectenverkeer 1995][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3]
      onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref4], belast zijn met het toezicht op
      beleggingsinstellingen, effecteninstellingen, natura-uitvaartverzekeraars onderscheidenlijk verzekeraars, met het
      oog op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake van bij ministeriële regeling aan te
      wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht ingevolge een van de eerdergenoemde
      wetten betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809
      [ref2]: https://wetten.overheid.nl/BWBR0007657
      [ref3]: https://wetten.overheid.nl/BWBR0007477
      [ref4]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0004809
      - id: ref2
        bwb_id: BWBR0007657
      - id: ref3
        bwb_id: BWBR0007477
      - id: ref4
        bwb_id: BWBR0006509
  - number: 67a.2
    text: |-
      De Bank voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de onderwerpen, bedoeld in het
      eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde autoriteiten te sluiten
      overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van regelgeving en beleid, en
      in voorkomende gevallen over uitvoering van toezicht. De Bank draagt er zorg voor dat zij of een van de overige in
      het eerste lid bedoelde autoriteiten een afschrift van de gesloten overeenkomsten zendt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel67a
  - number: 67a.3
    text: |-
      Binnen zes maanden na afloop van elk kalenderjaar draagt de Bank in samenwerking met de overige in het eerste lid
      bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en waarin melding wordt gemaakt
      van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel67a
  - number: '68.1'
    text: |-
      De Bank werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op
      kredietinstellingen die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht verzekeringsbedrijf 1993][ref1], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2],
      de [Wet toezicht beleggingsinstellingen][ref3] (*Stb.* 1990, 380) onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref4] belast zijn met het toezicht op verzekeraars, beleggingsinstellingen
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0007477
      [ref3]: https://wetten.overheid.nl/BWBR0004809
      [ref4]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0007477
      - id: ref3
        bwb_id: BWBR0004809
      - id: ref4
        bwb_id: BWBR0007657
  - number: '68.2'
    text: |-
      De Bank pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel68
  - number: '68.3'
    text: |-
      De Bank werkt, in de gevallen bedoeld in het eerste lid, waar nodig samen op basis van een of meer daartoe met
      een autoriteit als bedoeld in het eerste lid overeen te komen regelingen. Deze regelingen betreffen in elk geval
      afspraken over het stellen van gemeenschappelijke eisen, het coördineren van werkzaamheden uit hoofde van ieders
      uitoefening van het toezicht en het uitwisselen van gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel68
  - number: '68.4'
    text: |-
      De Bank verstrekt aan een autoriteit als bedoeld in het eerste lid danwel de autoriteit die belast is met de
      uitvoering van de [Wet inzake de geldtransactiekantoren](onbekend) de gegevens of inlichtingen die zij verkregen
      heeft bij de vervulling van de haar ingevolge deze wet opgedragen taak en die betrekking hebben op de deskundigheid
      van personen als bedoeld in artikel 9, eerste lid, onder *b* en *d*, onderscheidenlijk de voornemens of
      antecedenten van personen als bedoeld in artikel 9, eerste lid, onder *c* en *e*, voor zover de Bank van oordeel
      is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die andere
      autoriteit wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel68
  - number: '68.5'
    text: |-
      De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in artikel 65, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel68
  - number: '69'
    text: |-
      Een kredietinstelling die in Nederland is gevestigd dan wel een bijkantoor in Nederland van een in een Staat,
      die niet een Lid-Staat is, gevestigde kredietinstelling, welke tot algehele of gedeeltelijke liquidatie van
      haar bedrijf dan wel tot ontbinding heeft besloten, is verplicht aan de Bank mededeling te doen van de wijze
      waarop de liquidatie onderscheidenlijk de ontbinding zal plaatsvinden ten minste dertien weken, voordat aan
      het besluit uitvoering wordt gegeven; de Bank kan deze termijn verkorten. De Bank wordt aangemerkt als een
      belanghebbende in de zin van [artikel 23, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Ingeval
      een kredietinstelling als bedoeld in de eerste volzin besluit tot ontbinding en geen rechtspersoonlijkheid
      bezit, is het bepaalde in de [artikelen 19, vierde lid][ref2], [23, eerste en tweede lid][ref3], [23][ref4],
      en [23c, van Boek 2 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing. Voor de toepassing van
      de [artikelen 23, eerste lid][ref6], en [23][ref7], gelden de beherende vennoten als bestuurders en geldt de
      vennootschapsovereenkomst als statuten.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel23a
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel23c
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel23
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel23a
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 23a
      - id: ref5
        bwb_id: BWBR0003045
        artikel: 23c
      - id: ref6
        bwb_id: BWBR0003045
        artikel: '23'
      - id: ref7
        bwb_id: BWBR0003045
        artikel: 23a
  - number: '70.1'
    text: |-
      Op een verzoek of vordering tot faillietverklaring van een kredietinstelling die in Nederland is gevestigd dan wel
      een bijkantoor in Nederland van een buiten Nederland gevestigde kredietinstelling - een eigen aangifte daaronder
      begrepen - wordt niet beslist, dan nadat de rechtbank de Bank in de gelegenheid heeft gesteld haar gevoelens
      daaromtrent kenbaar te maken. Indien het verzoek of de vordering betrekking heeft op een bijkantoor van een in
      een andere Lid-Staat gevestigde kredietinstelling, raadpleegt de Bank alvorens haar gevoelens kenbaar te maken de
      toezichthoudende autoriteit van die andere Lid-Staat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel70
  - number: '70.2'
    text: |-
      De wettelijke bepalingen inzake surséance van betaling zijn op een kredietinstelling dan wel een bijkantoor als
      bedoeld in het eerste lid, eerste volzin, niet van toepassing. De schuldsaneringsregeling natuurlijke personen kan
      niet van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel70
  - number: '71.1'
    text: |-
      Ingeval de solvabiliteit of de liquiditeit van een kredietinstelling die een vergunning als bedoeld in
      artikel 6 heeft verkregen dan wel van een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde
      kredietinstelling die krachtens artikel 31 in Nederland het bedrijf van kredietinstelling mag uitoefenen dan wel
      van een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling die
      een vergunning als bedoeld in artikel 38, eerste lid heeft verkregen, tekenen van een gevaarlijke ontwikkeling
      vertoont en redelijkerwijs in die ontwikkeling geen verbetering te voorzien is, kan de rechtbank, binnen wier
      rechtsgebied de kredietinstelling dan wel het bijkantoor is gevestigd, op verzoek van de Bank verklaren, dat
      de kredietinstelling dan wel het bijkantoor verkeert in een toestand, welke in het belang van de gezamenlijke
      schuldeisers bijzondere voorziening behoeft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.2'
    text: |-
      Ingeval de solvabiliteit of de liquiditeit van een kredietinstelling waarop het verbod van artikel 6 van toepassing
      is dan wel van een bijkantoor in Nederland van een buiten Nederland gevestigde kredietinstelling waarop het verbod
      van artikel 31 of artikel 38, eerste lid van toepassing is, naar het oordeel van de Bank zodanig is dat te voorzien
      is dat de kredietinstelling dan wel het bijkantoor zijn verplichtingen ter zake van de door hem verkregen gelden
      niet of slechts ten dele kan nakomen, kan de rechtbank, binnen wier rechtsgebied de kredietinstelling dan wel het
      bijkantoor is gevestigd, op verzoek van de Bank verklaren dat de kredietinstelling dan wel het bijkantoor verkeert
      in een toestand, welke in het belang van de gezamenlijke schuldeisers bijzondere voorziening behoeft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.3'
    text: De Bank zendt een afschrift van het verzoekschrift aan de betrokken kredietinstelling dan wel bijkantoor.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.4'
    text: De rechtbank behandelt het verzoek met de meeste spoed.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.5'
    text: |-
      De rechtbank is bevoegd inzage te nemen of te doen nemen door deskundigen, daartoe door haar aangewezen, van
      zakelijke gegevens en bescheiden van de betrokken kredietinstelling dan wel bijkantoor. De artikelen 53 en 62,
      eerste tot en met derde lid, zijn daarbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.6'
    text: |-
      De rechtbank geeft geen beschikking dan nadat de kredietinstelling dan wel het bijkantoor en de Bank zijn gehoord,
      althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.7'
    text: |-
      Indien het verzoek wordt toegewezen, bevat de beschikking van de rechtbank de benoeming van een of meer
      bewindvoerders; de Bank kan voor de benoeming voordrachten doen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.8'
    text: |-
      Indien het verzoek wordt toegewezen, wordt de beschikking op een openbare terechtzitting uitgesproken en wordt
      een uittreksel ervan onverwijld door de bewindvoerders bekend gemaakt in de *Staatscourant* en in een of meer door
      de rechtbank aan te wijzen nieuwsbladen. Het uittreksel vermeldt naam en woonplaats van de kredietinstelling dan
      wel het bijkantoor en de woonplaats of het kantoor van de bewindvoerders alsmede de datum van de beschikking. De
      beschikking is uitvoerbaar bij voorraad, terugwerkend tot aan het begin van de dag waarop zij is uitgesproken,
      niettegenstaande enige daartegen gerichte voorziening.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.9'
    text: |-
      In afwijking van de laatste volzin van het achtste lid, werkt de beschikking, bedoeld in het eerste of tweede lid,
      niet terug ten aanzien van een door een kredietinstelling vóór het tijdstip waarop de rechtbank de beschikking
      heeft gegeven, gegeven overboekingsopdracht, opdracht tot verrekening of enige uit een dergelijke opdracht
      voortvloeiende betaling, levering, verrekening of andere rechtshandeling die benodigd is om de opdracht volledig
      uit te voeren in een systeem als bedoeld in [artikel 212a, onder b van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '71.10'
    text: |-
      De laatste volzin van het achtste lid en artikel 72, eerste lid, kunnen niet aan derden worden tegengeworpen
      ten aanzien van een door een kredietinstelling, na het tijdstip waarop de rechtbank de in het eerste of het
      tweede lid, bedoelde beschikking heeft gegeven, gegeven overboekingsopdracht, opdracht tot verrekening of
      enige uit een dergelijke opdracht voortvloeiende betaling, levering, verrekening of andere rechtshandeling
      die benodigd is om de opdracht volledig uit te voeren, indien de opdracht in een systeem als bedoeld in
      [artikel 212a, onder b van de Faillissementswet][ref1], wordt uitgevoerd op de dag waarop de rechtbank de
      beschikking heeft gegeven en de centrale tegenpartij, de afwikkelende instantie of het verrekeningsinstituut,
      bedoeld in [artikel 212a van de Faillissementswet][ref2], kan aantonen dat deze ten tijde van de uitvoering van de
      opdracht niet op de hoogte was of op de hoogte behoorde te zijn van de door de rechtbank gegeven beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '71.11'
    text: |-
      Het negende en het tiende lid zijn van overeenkomstige toepassing op een goederenrechtelijk
      zekerheidsrecht dat door een kredietinstelling in verband met deelname aan een systeem als bedoeld in
      [artikel 212a, onder b, van de Faillissementswet][ref1], is gevestigd ten behoeve van een centrale bank als bedoeld
      in [artikel 212a, onder h, van de Faillissementswet][ref2] of ten behoeve van een instelling die deelneemt aan
      het systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '71.12'
    text: De rechtbank vermeldt op de beschikking het tijdstip waarop de beschikking is gegeven tot op de minuut nauwkeurig.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.13'
    text: |-
      De griffier van de rechtbank stelt de Bank terstond in kennis van de beschikking. De Bank stelt daarna terstond
      de door Onze minister op grond van [artikel 212d van de Faillissementswet][ref1] aangewezen systemen, alsmede de
      bevoegde autoriteiten van de overige lidstaten van de Europese Unie en van de andere staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, in kennis van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212d
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212d
  - number: '71.14'
    text: |-
      Wanneer het verzoek aanhangig is tegelijk met een verzoek of vordering tot faillietverklaring - eigen aangifte
      daaronder begrepen -, wordt de behandeling van het verzoek of de vordering tot faillietverklaring geschorst, totdat
      op het eerstgenoemde verzoek is beschikt. Wordt een verklaring als bedoeld in het eerste of tweede lid, gegeven,
      dan vervalt het verzoek of de vordering tot faillietverklaring van rechtswege.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '71.15'
    text: |-
      Bij een beschikking als bedoeld in het eerste of tweede lid, bepaalt de rechtbank de duur op ten hoogste
      anderhalf jaar. Voor het verstrijken van de gestelde termijn kan de Bank eenmaal of meermalen verlenging van de
      geldigheidsduur voor ten hoogste anderhalf jaar verzoeken. Het verzoek wordt behandeld op dezelfde wijze als een
      verzoek tot uitspreken van de verklaring. Zolang bij afloop van de geldigheidsduur van de verklaring op een verzoek
      tot verlenging nog niet is beschikt, blijft de verklaring gehandhaafd. Indien het verzoek tot verlenging wordt
      toegewezen, is het zevende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel71
  - number: '72.1'
    text: |-
      De bewindvoerders oefenen bij uitsluiting alle bevoegdheden van de organen van de kredietinstelling dan wel het
      bijkantoor uit.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.2'
    text: De bewindvoerders waken voor de belangen der gezamenlijke schuldeisers.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.3'
    text: |-
      De organen van de kredietinstelling dan wel het bijkantoor zijn verplicht alle door de bewindvoerders gevraagde
      medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.4'
    text: |-
      Indien meer dan een bewindvoerder is benoemd, wordt voor de geldigheid van hun handelingen toestemming van de
      meerderheid of bij staking van stemmen een beslissing van de voorzieningenrechter van de rechtbank vereist. De
      bewindvoerder, aan wie bij de beschikking van de rechtbank, bedoeld in artikel 71, zevende lid, een bepaalde
      werkkring is aangewezen, is binnen de grenzen daarvan zelfstandig tot handelen bevoegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.5'
    text: |-
      De rechtbank kan te allen tijde een bewindvoerder, na hem en de Bank gehoord, althans behoorlijk opgeroepen te
      hebben, ontslaan en door een ander vervangen, of hem een of meer bewindvoerders toevoegen, een en ander op verzoek
      van hemzelf, de andere bewindvoerders, de Bank of een of meer schuldeisers dan wel ambtshalve.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.6'
    text: |-
      De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden alsmede
      na beëindiging daarvan zo spoedig mogelijk verslag omtrent hun werkzaamheden uit aan de rechtbank.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '72.7'
    text: |-
      Het loon van de deskundigen, aangewezen ingevolge artikel 71, vijfde lid, alsook het loon en de verschotten van de
      bewindvoerders worden bepaald door de rechtbank en vormen een boedelschuld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel72
  - number: '73.1'
    text: |-
      De rechtbank is bevoegd bij of na een verklaring als bedoeld in artikel 71, eerste of tweede lid, op verzoek van
      de Bank dan wel op verzoek van de bewindvoerders of van een of meer schuldeisers of ambtshalve, de Bank gehoord,
      zodanige regelingen te treffen, als zij ter beveiliging van de belangen der schuldeisers van de kredietinstelling
      dan wel het bijkantoor nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel73
  - number: '73.2'
    text: |-
      Op verzoek van de bewindvoerders benoemt de rechtbank een van haar leden tot rechter-commissaris die toezicht
      houdt op de vereffening welke plaats heeft ingevolge artikel 76. Met betrekking tot beschikkingen van de
      rechter-commissaris, gegeven ter uitvoering van het in de eerste zin bepaalde, zijn de [artikelen 66][ref1]
      en [67, eerste lid, van de Faillissementswet][ref2] van overeenkomstige toepassing. Het tweede lid van artikel
      67 van die wet is van overeenkomstige toepassing voor zover de daarin opgesomde artikelen in artikel 76 van
      overeenkomstige toepassing zijn verklaard. Hetgeen in de genoemde artikelen is bepaald met betrekking tot
      de curator onderscheidenlijk de gefailleerde is van toepassing op de bewindvoerders onderscheidenlijk de
      kredietinstelling dan wel het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel67
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '67'
  - number: '74.1'
    text: |-
      Een verklaring als bedoeld in artikel 71, eerste of tweede lid, heeft ten gevolge, dat de kredietinstelling
      dan wel het bijkantoor niet kan worden genoodzaakt tot nakoming van haar verplichtingen; aangevangen executies
      worden geschorst; gelegde beslagen vervallen. [Artikel 36 van de Faillissementswet][ref1] is van overeenkomstige
      toepassing op de in de eerste volzin bedoelde verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel36
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '36'
  - number: '74.2'
    text: |-
      Onverminderd het bepaalde in artikel 76 geldt het bij het eerste lid bepaalde niet ten aanzien van vorderingen
      welke voortvloeien uit handelingen, met de kredietinstelling dan wel het bijkantoor na de verklaring verricht, noch
      voor vorderingen als bedoeld in [artikel 232 van de Faillissementswet][ref1], en wel voor zover zulks het geval is.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel232
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '232'
  - number: '74.3'
    text: |-
      Overigens zijn de [artikelen 234–241a van de Faillissementswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel234
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '234'
  - number: '75.1'
    text: |-
      De rechtbank kan de bewindvoerders machtigen over te gaan tot overdracht van de verbintenissen van de
      kredietinstelling dan wel het bijkantoor, welke hij in de uitoefening van zijn bedrijf als kredietinstelling
      tot het ter beschikking verkrijgen van gelden heeft aangegaan, of van een deel daarvan, dan wel tot gehele of
      gedeeltelijke liquidatie van het bedrijf van de kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.2'
    text: |-
      Indien bij overdracht van verbintenissen als bedoeld in het eerste lid, de bedingen in de overeenkomsten, waaruit
      die verbintenissen voortvloeien, worden gewijzigd, hebben de bewindvoerders daartoe de bijzondere machtiging van
      de rechtbank nodig met dien verstande, dat de bedingen in de overeenkomsten, waaruit vorderingen voortvloeien als
      bedoeld in artikel 74, tweede lid, daarbij niet kunnen worden gewijzigd. De wijziging laat onverlet de uitkeringen
      die overeenkomstig artikel 76 zijn gedaan voor de dag van de indiening van het verzoek om de machtiging als bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.3'
    text: |-
      Met betrekking tot de beschikkingen, bedoeld in het eerste en tweede lid, is het bepaalde in artikel 71, zesde en
      achtste lid, eerste en tweede volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.4'
    text: |-
      Zodra overdracht van verbintenissen heeft plaatsgevonden, maken bewindvoerders de overdracht en, ingeval de
      bedingen in de overeenkomsten zijn gewijzigd, deze wijzigingen openbaar door bekendmaking in de *Staatscourant* en
      in ten minste drie door de rechtbank aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.5'
    text: |-
      De overdracht en de wijzigingen van de bedingen in de overeenkomsten worden alsdan van kracht ten aanzien van
      alle belanghebbenden met ingang van de dag, volgende op die van de dagtekening van de *Staatscourant*, waarin de
      bekendmaking is geplaatst.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.6'
    text: |-
      Gedurende de liquidatie, bedoeld in het eerste lid, regelt de rechtbank naar behoefte de bijzonderheden en
      gevolgen van de liquidatie, waaronder begrepen verkorting van de geldingsduur van lopende overeenkomsten, nadat zij
      daaromtrent het advies van de bewindvoerders en de Bank heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '75.7'
    text: |-
      Zodra de liquidatie is beëindigd, doen de bewindvoerders daarvan mededeling in de *Staatscourant* en in een of meer
      door de rechtbank aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel75
  - number: '76.1'
    text: |-
      De bewindvoerders kunnen uitkeringen doen op de vorderingen waarop artikel 74, eerste lid, van toepassing is, voor
      zover dit gelet op de liquiditeitspositie van de kredietinstelling dan wel het bijkantoor verantwoord is te achten
      en mits is voldaan aan de volgende leden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
  - number: '76.2'
    text: |-
      De bewindvoerders maken een staat op waaruit blijken de aard en het bedrag van de baten en schulden van de
      kredietinstelling dan wel het bijkantoor, de namen en woonplaatsen van de schuldeisers alsmede het bedrag der
      vorderingen van iedere schuldeiser. Een door de bewindvoerders gewaarmerkt afschrift van deze staat wordt ter
      kosteloze inzage van een ieder ter griffie van de rechtbank nedergelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
  - number: '76.3'
    text: |-
      Op verzoek van de bewindvoerders bepaalt de rechter-commissaris de dag waarop uiterlijk de vorderingen moeten
      worden ingediend, en voorts dag, uur en plaats, waarop de verificatievergadering zal worden gehouden. De
      bewindvoerders geven van deze beschikkingen onmiddellijk aan alle bekende schuldeisers schriftelijk kennis en
      doen daarvan aankondiging in een of meer door de rechter-commissaris aan te wijzen nieuwsbladen. Vanaf de dag
      waarop deze aankondiging heeft plaatsgevonden vallen de vorderingen die bevoorrecht zijn hetzij op zekere bepaalde
      goederen van de kredietinstelling dan wel het bijkantoor hetzij op al zijn goederen onder de werking van artikel
      74, eerste lid. De [artikelen 110][ref1] tot en met [113 van de Faillissementswet][ref2] zijn van overeenkomstige
      toepassing, met dien verstande dat hetgeen is bepaald met betrekking tot de curator onderscheidenlijk de
      gefailleerde van toepassing is op de bewindvoerders onderscheidenlijk de kredietinstelling dan wel het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel110
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel113
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '110'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '113'
  - number: '76.4'
    text: |-
      Een afschrift van de lijst van voorlopig erkende schuldvorderingen en van de lijst van betwiste vorderingen wordt
      door de bewindvoerders ter griffie van de rechtbank nedergelegd om aldaar gedurende veertien dagen voorafgaande
      aan de verificatievergadering kosteloos voor een ieder ter inzage te liggen. De bewindvoerders geven alle bekende
      schuldeisers voor het begin van deze periode schriftelijk van de nederlegging bericht waarbij zij een nadere
      oproeping tot de verificatievergadering voegen. Voorts doen de bewindvoerders van de nederlegging mededeling in een
      of meer door de rechter-commissaris aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
  - number: '76.5'
    text: |-
      Met betrekking tot de verificatie zijn de [artikelen 59][ref1], [119][ref2] tot en met [122][ref3], [123][ref4]
      tot en met [127][ref5], [129][ref6], [132][ref7] tot en met [137][ref8], [260][ref9], eerste lid, [261][ref10]
      en het eerste en derde lid van [artikel 262 van de Faillissementswet][ref11] van overeenkomstige toepassing.
      Daarbij zijn de bepalingen met betrekking tot de curator onderscheidenlijk de gefailleerde van toepassing
      op de bewindvoerders onderscheidenlijk de kredietinstelling dan wel het bijkantoor. In afwijking van de in
      [artikel 127, eerste lid, van de Faillissementswet][ref12] genoemde termijn geldt de termijn die ingevolge het
      derde lid van dit artikel voor de indiening van vorderingen is bepaald. De vorderingen welke opeisbaar worden op of
      na de datum van de beschikking als bedoeld in artikel 71, eerste of tweede lid, worden geverifieerd voor de waarde
      welke zij hebben op het tijdstip waarop deze vorderingen opeisbaar worden, met dien verstande dat dit ten aanzien
      van vorderingen welke vallen onder de werking van artikel 75, eerste lid, slechts geldt voor zover deze bepaling
      niet reeds op deze vorderingen is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel122
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel123
