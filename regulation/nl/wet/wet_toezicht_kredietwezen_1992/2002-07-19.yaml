        paragraaf: '2'
  - number: 89a.2
    text: |-
      De Bank verstrekt Onze Minister desgevraagd de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor zover deze betrekking
      hebben op het kredietwezen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel89a
  - number: '90.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '90.2'
    text: |-
      Ingeval beroep wordt ingesteld tegen besluiten, genomen ter uitvoering van de artikelen 14, 26, eerste lid, 28, 29,
      30e, 35 of 90a, eerste lid, zal de terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt alsdan
      medegedeeld aan de verzoeker en de Bank onderscheidenlijk Onze minister.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90
  - number: 90a.1
    text: |-
      Onze minister is bevoegd aan de Bank de gegevens of inlichtingen te vragen die naar zijn oordeel nodig zijn voor
      een onderzoek naar de toereikendheid van deze wet of de wijze waarop de Bank deze wet uitvoert of heeft uitgevoerd,
      indien dat ter wille van het bedrijfseconomisch toezicht nodig blijkt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.2
    text: |-
      De Bank is verplicht aan Onze minister de in het eerste lid bedoelde gegevens of inlichtingen te verstrekken.
      Indien Onze minister de Bank vraagt bepaalde gegevens of inlichtingen te verstrekken die onder artikel 64, eerste
      en tweede lid, vallen, is de Bank niet verplicht deze gegevens of inlichtingen te verstrekken, indien:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.2.a
    text: |-
      deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke kredietinstelling die een vergunning als bedoeld in artikel 6 of artikel 38 heeft verkregen of een
      financiële instelling die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft
      verkregen of waarvan die vergunning onderscheidenlijk die verklaring is ingetrokken of vervallen, en ten aanzien
      waarvan overeenkomstig artikel 71 de noodregeling is uitgesproken of die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.2.b
    text: |-
      deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      kredietinstelling of financiële instelling in staat te stellen haar bedrijf voort te zetten; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.2.c
    text: |-
      deze zijn ontvangen van een instantie als bedoeld in artikel 65, eerste lid, of zijn verkregen naar aanleiding van
      een verificatie bij een in een andere staat gelegen bijkantoor van een in Nederland gevestigde instelling, tenzij
      de uitdrukkelijke instemming is verkregen van die instantie onderscheidenlijk van de toezichthoudende autoriteit
      van de staat waar de verificatie ter plaatse is verricht.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.3
    text: |-
      Onze minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.4
    text: |-
      Onze minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen uitsluitend
      gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de Bank deze wet
      uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.5
    text: |-
      Onze minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. Artikel 64 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.6
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
  - number: 90a.7
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90a
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: 90b.1
    text: |-
      Onze Minister of de Bank kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 4, eerste lid][ref1], [6, eerste, tweede en derde lid][ref2],
      [7][ref3], [7a, eerste en tweede lid][ref4], [10, eerste tot en met vijfde lid][ref5],
      [11, eerste en vijfde lid][ref6], [12, tweede lid][ref7], [14, eerste, tweede en zesde lid][ref8],
      [15, vijfde lid][ref9], [16, zesde en achtste lid][ref10], [16a, zesde lid][ref11],
      [19, eerste lid, derde lid, tweede volzin, en vijfde lid, tweede volzin][ref12],
      [23, eerste, derde, vierde en vijfde lid][ref13], [24, eerste, derde, vierde en zesde lid][ref14],
      [25, eerste lid][ref15], [25a, tweede en derde lid][ref16], [26, zevende lid][ref17],
      [28, tweede lid en vijfde lid, onder a][ref18], [29, tweede lid][ref19],
      [30, eerste lid en tweede lid, eerste volzin][ref20], [30d, eerste, tweede en vierde lid][ref21],
      [31, eerste lid, onder a, tweede, vierde en vijfde lid][ref22],
      [32, eerste lid, onder a, tweede, derde en vierde lid][ref23], [32a onder a][ref24], [36][ref25], [37][ref26],
      [38, eerste, tweede, derde en vierde lid][ref27], [38a, eerste, tweede en derde lid][ref28], [43][ref29],
      [44][ref30], [50, eerste lid][ref31], [51][ref32], [55, eerste, tweede, derde en vijfde lid][ref33],
      [56a][ref34], [58, eerste en tweede lid][ref35], [62, eerste, tweede en derde lid][ref36], [63][ref37],
      [66, tweede en derde lid][ref38], [66a, tweede lid][ref39], [72, derde lid][ref40], [81, vijfde lid][ref41],
      [82, eerste en vierde lid][ref42], [83, eerste en vierde lid][ref43], [84, tweede, derde en vierde lid][ref44],
      [85][ref45], [85a, eerste lid][ref46], en [85b, eerste en tweede lid][ref47], voor zover zij zijn belast met de
      uitvoering van het toezicht ter zake van die artikelen.


