preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de Tweede Richtlijn van de
    Raad van de Europese Gemeenschappen van 15 december 1989 tot coördinatie van de wettelijke en bestuursrechtelijke
    bepalingen betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen, alsmede tot
    wijziging van Richtlijn 77/780/EEG (89/646/EEG) alsmede aan de Richtlijn van de Raad van de Europese Gemeenschappen
    van 6 april 1992 inzake het toezicht op kredietinstellingen op geconsolideerde basis (92/30/EEG), en dat het
    naar aanleiding daarvan alsmede in verband met het aanbrengen van enige andere aanpassingen van de Wet toezicht
    kredietwezen (Stb. 1978, 255) wenselijk is de bepalingen inzake het toezicht op het kredietwezen opnieuw vast te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.a
    text: 'kredietinstelling:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.a.1°
    text: |-
      een onderneming of instelling die haar bedrijf maakt van het ter beschikking verkrijgen van, al dan niet op
      termijn, opvorderbare gelden en van het voor eigen rekening verrichten van kredietuitzettingen of beleggingen;
      dan wel
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.a.2°
    text: |-
      een onderneming of instelling, anders dan bedoeld onder 1°, die gelden ter beschikking krijgt in ruil waarvoor
      elektronisch geld wordt uitgegeven waarmee betalingen kunnen worden verricht ook aan anderen dan de onderneming of
      instelling die het elektronisch geld uitgeeft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.b
    text: |-
      centrale kredietinstelling: een kredietinstelling als bedoeld in onderdeel a, onder 1°, die met betrekking tot een
      groep kredietinstellingen een mede beleidsbepalend karakter draagt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.c
    text: |-
      financiële instelling: een onderneming of instelling, niet zijnde een kredietinstelling, die in hoofdzaak haar
      bedrijf maakt van het verrichten van één of meer van de werkzaamheden genoemd onder 2 tot en met 12 in bijlage I
      van de Richtlijn dan wel van het verwerven of het houden van deelnemingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.d
    text: |-
      representatieve organisatie: een organisatie, die met betrekking tot de uitvoering van deze wet door Onze minister,
      de Bank gehoord, als representatieve organisatie voor een groep van ondernemingen en instellingen is aangewezen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.e
    text: 'Onze minister: Onze minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.f
    text: 'Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.g
    text: |-
      toezichthoudende autoriteit: de instantie waaraan in enige Staat ingevolge een wettelijke regeling het toezicht op
      het kredietwezen is opgedragen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.h
    text: 'de Unie: de Europese Unie;'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.i
    text: |-
      Lid-Staat: een staat die lid is van de Unie alsmede een staat, niet zijnde een lid-staat van de Unie, die partij is
      bij de overeenkomst betreffende de Europese Economische Ruimte (*Trb.*1992, 132);
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.j
    text: |-
      de Richtlijn: [Richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie
      van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG
      L 126);
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.k
    text: |-
      bijkantoor: één of meer onderdelen zonder rechtspersoonlijkheid van een kredietinstelling of een financiële
      instelling die in een andere Staat is gevestigd dan die waarin de kredietinstelling of de financiële instelling
      gevestigd is;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.l
    text: |-
      verrichten van diensten: het in een Staat, zonder gebruikmaking van een bijkantoor in die Staat, verrichten dan
      wel aanbieden van werkzaamheden genoemd in bijlage I van de Richtlijn door een kredietinstelling of een financiële
      instelling die in een andere Staat is gevestigd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.m
    text: |-
      gekwalificeerde deelneming: een rechtstreeks of middellijk belang van meer dan 5 procent van het geplaatste
      aandelenkapitaal van een onderneming of instelling, of het rechtstreeks of middellijk kunnen uitoefenen van
      meer dan 5 procent van de stemrechten in een onderneming of instelling, of het rechtstreeks of middellijk kunnen
      uitoefenen van een daarmee vergelijkbare zeggenschap in een onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.n
    text: |-
      dochtermaatschappij: een onderneming of instelling als omschreven in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 1.1.o
    text: |-
      groep: een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande dat
      indien een natuurlijk persoon, rechtspersoon of vennootschap:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.1.o.1°
    text: |-
      via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1.1.o.2°
    text: |-
      in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], dan wel, voor zover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 1.1.p
    text: 'elektronisch geld: een geldswaarde die is opgeslagen op een elektronische drager.'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: '1.2'
    text: De Bank wordt niet beschouwd als kredietinstelling in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1
  - number: 1a
    text: |-
      Op een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], waaraan een
      vergunning als bedoeld in [artikel 6][ref2] is verleend, is het bepaalde in de [artikelen 45 tot en met 51][ref3]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel45
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '45'
        hoofdstuk: V
        paragraaf: '1'
  - number: '2.1'
    text: 'De Bank oefent toezicht uit:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
  - number: 2.1.b
    text: |-
      in het belang van hun solvabiliteit op de in Nederland gevestigde kredietinstellingen en op de bijkantoren in
      Nederland van in een Staat, die niet een Lid-Staat is, gevestigde kredietinstellingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
  - number: 2.1.c
    text: |-
      in het belang van hun liquiditeit op de in Nederland gevestigde kredietinstellingen en op de
      bijkantoren in Nederland van niet in Nederland gevestigde kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.d
    text: |-
      in het belang van hun solvabiliteit op de in Nederland gevestigde financiële instellingen die een verklaring van
      ondertoezichtstelling als bedoeld in artikel 45 hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
  - number: '2.2'
    text: |-
      De Bank werkt bij de uitoefening van toezicht op in één van de Lid-Staten gevestigde kredietinstellingen samen met
      de betrokken toezichthoudende autoriteiten van de andere Lid-Staten. De Bank pleegt daartoe in voorkomende gevallen
      overleg met deze toezichthoudende autoriteiten van de andere Lid-Staten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
  - number: '2.3'
    text: |-
      De Bank kan voor zover noodzakelijk ten behoeve van de uitoefening van toezicht op een bijkantoor in Nederland van
      een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling de betrokken toezichthoudende autoriteit
      raadplegen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel2
  - number: '3.1'
    text: |-
      Onze minister onderscheidenlijk de Bank maakt van de in artikel 81, onderscheidenlijk de artikelen 11 en 20 gegeven
      bevoegdheden mede gebruik om uitvoering te geven aan richtlijnen van het Europees Parlement en de Raad van de
      Europese Unie betreffende het toezicht op kredietinstellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel3
  - number: '3.2'
    text: |-
      Onze minister kan aan de Bank voorschriften geven ter implementatie van richtlijnen van het Europees Parlement en
      de Raad van de Europese Unie betreffende het toezicht op kredietinstellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel3
  - number: '4.1'
    text: |-
      Bij koninklijk besluit kan, op advies van de Bank en nadat daarover het advies van de betrokken instantie is
      ingewonnen, worden bepaald, dat een bij een centrale kredietinstelling aangesloten groep van kredietinstellingen
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] van het toezicht door de Bank, voorzover
      dit toezicht strekt in het belang van de solvabiliteit, liquiditeit en administratieve organisatie van die
      instellingen, is vrijgesteld, voorzover deze centrale kredietinstelling krachtens haar statuten en de statuten van
      de bij haar aangesloten kredietinstellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] of
      krachtens een overeenkomst met de bij haar aangesloten kredietinstellingen als bedoeld in [artikel 1, eerste lid,
      onderdeel a, onder 1°](onbekend) dit toezicht op voldoende wijze uitoefent op deze instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '4.2'
    text: De centrale kredietinstelling richt zich bij het toezicht naar de aanwijzingen van de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel4
  - number: '5.1'
    text: |-
      De bepalingen van deze wet vinden ten aanzien van een buiten Nederland gevestigde onderneming of instelling, die
      door middel van een bijkantoor in Nederland het bedrijf van kredietinstelling uitoefent, slechts toepassing voor
      zover het haar in of vanuit Nederland uitgeoefende bedrijf betreft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel5
  - number: '5.2'
    text: |-
      De Bank kan ten aanzien van een in een Staat, die niet een Lid-Staat is, gevestigde onderneming of instelling,
      die door middel van een bijkantoor in Nederland het bedrijf van kredietinstelling uitoefent, bepalen, dat tot
      haar in of vanuit Nederland uitgeoefende bedrijf van kredietinstelling mede worden gerekend alle of bepaalde
      rechtsverhoudingen van die kredietinstelling rechtstreeks of middellijk met natuurlijke personen en rechtspersonen,
      welke in Nederland gevestigd zijn of aldaar hun bedrijf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel5
  - number: '5.3'
    text: |-
      De Bank kan voor de toepassing van de artikelen 16 en 17 en 31 tot en met 37 een kredietinstelling beschouwen als
      een bijkantoor, indien naar het oordeel van de Bank met betrekking tot die kredietinstelling voldaan wordt aan
      voorwaarden als omschreven in artikel 12, onder *a* tot en met *e*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel5
  - number: '6.1'
    text: |-
      Het is een in Nederland gevestigde onderneming of instelling verboden het bedrijf van kredietinstelling uit te
      oefenen, behoudens voor zover zij daartoe van de Bank een vergunning heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel6
  - number: '6.2'
    text: |-
      Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel6
  - number: '6.3'
    text: |-
      De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel6
  - number: '7'
    text: |-
      Het is een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die een
      vergunning als bedoeld in artikel 6 heeft verkregen, in verband met het ingevolge deze wet uitgeoefende toezicht
      toegestaan ten minste de werkzaamheden genoemd in bijlage I van de Richtlijn te verrichten, tenzij in de vergunning
      uitdrukkelijk anders is bepaald en onverminderd de toepasselijkheid van andere op deze werkzaamheden betrekking
      hebbende wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 7a.1
    text: |-
      Het is een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die een
      vergunning als bedoeld in [artikel 6][ref2] heeft verkregen, niet toegestaan naast het ter beschikking krijgen van
      gelden in ruil waarvoor elektronisch geld wordt uitgegeven andere dan de volgende werkzaamheden te verrichten:


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel6
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 7a.1.a
    text: het verrichten van met de uitgifte van elektronisch geld samenhangende diensten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
  - number: 7a.1.b
    text: |-
      het uitgeven en beheren van andere betaalmiddelen, met uitsluiting van de werkzaamheden bedoeld onder punt 2 van
      bijlage I van de Richtlijn;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
  - number: 7a.1.c
    text: het vastleggen van informatie op een elektronische drager ten behoeve van andere ondernemingen of instellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
  - number: 7a.2
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], houdt uitsluitend een
      deelneming in een andere onderneming of instelling, indien die onderneming of instelling werkzaamheden verricht,
      die samenhangen met de bedrijfsvoering van de kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 7a.3
    text: |-
      Onder een deelneming als bedoeld in het tweede lid wordt verstaan een rechtstreeks of middellijk belang van 20
      procent of meer van het geplaatste aandelenkapitaal van een onderneming, of het rechtstreeks of middellijk kunnen
      uitoefenen van 20 procent of meer van de stemrechten in een onderneming.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel7a
  - number: '8.1'
    text: |-
      Een in Nederland gevestigde onderneming of instelling, die voornemens is het bedrijf van kredietinstelling uit te
      oefenen, vraagt bij de Bank een vergunning aan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: '8.2'
    text: |-
      De aanvraag bevat, ten behoeve van de beslissing omtrent het verlenen van een vergunning als bedoeld in artikel 9,
      gegevens omtrent:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.a
    text: |-
      het aantal, de identiteit en de antecedenten van de personen die het dagelijks beleid van de onderneming of
      instelling bepalen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.b
    text: |-
      het aantal, de identiteit en de antecedenten van de leden van de raad van commissarissen van de onderneming of
      instelling dan wel van het orgaan van de onderneming of instelling dat een met die van een raad van commissarissen
      vergelijkbare taak heeft;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.c
    text: |-
      de identiteit en de antecedenten van de personen die het dagelijks beleid bepalen van de groep waartoe de
      onderneming of instelling behoort en tevens uit dien hoofde het dagelijks beleid van de onderneming of instelling
      mede bepalen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.d
    text: |-
      de identiteit en de antecedenten van de personen die het beleid bepalen of mede bepalen van de groep waartoe
      de onderneming of instelling behoort en tevens uit dien hoofde het beleid van de onderneming of instelling mede
      bepalen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.e
    text: |-
      de identiteit van degenen die een gekwalificeerde deelneming houden in de onderneming of instelling, alsmede de
      omvang van de desbetreffende gekwalificeerde deelneming;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.f
    text: |-
      een jaarrekening of openingsbalans, welke moet zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend
      door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 8.2.g
    text: een programma van werkzaamheden welke de onderneming of instelling voornemens is te verrichten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.h
    text: de voorziene administratieve organisatie - met inbegrip van de financiële administratie en de interne controle;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.i
    text: de formele en de feitelijke zeggenschapsstructuur van de groep waartoe de onderneming of instelling behoort; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: 8.2.j
    text: |-
      indien de onderneming of instelling een dochtermaatschappij of bijkantoor van een niet in Nederland
      gevestigde kredietinstelling betreft: een verklaring van de toezichthoudende autoriteit van de Staat waar die
      kredietinstelling gevestigd is waaruit blijkt dat deze autoriteit de vestiging van een dochtermaatschappij of
      bijkantoor in Nederland heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: '8.3'
    text: De Bank beslist binnen dertien weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel8
  - number: '9.1'
    text: 'De Bank verleent de vergunning, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.a
    text: de onderneming of instelling niet voldoet aan het bij of krachtens de artikelen 10 en 11 bepaalde;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.b
    text: |-
      de Bank van oordeel is dat de deskundigheid van één of meer personen, die het dagelijks beleid van de onderneming
      of instelling bepalen, onvoldoende is in verband met de uitoefening van het bedrijf van kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.c
    text: |-
      de Bank op grond van de voornemens of de antecedenten van oordeel is, dat, met het oog op de belangen van de
      crediteuren of toekomstige crediteuren van de onderneming of instelling, de betrouwbaarheid van één of meer
      personen, die het beleid van de onderneming of instelling bepalen of mede bepalen, niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.d
    text: |-
      de Bank van oordeel is dat de deskundigheid van één of meer personen die het dagelijks beleid bepalen van de
      groep waartoe de onderneming of instelling behoort, voor zover zij tevens uit dien hoofde dagelijks beleid van
      de onderneming of instelling mede bepalen, onvoldoende is in verband met de uitoefening van het bedrijf van
      kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.e
    text: |-
      de Bank op grond van de voornemens of de antecedenten van oordeel is, dat, met het oog op de belangen van de
      crediteuren of toekomstige crediteuren van de onderneming of instelling, de betrouwbaarheid van een of meer
      personen, die het beleid bepalen of mede bepalen van de groep waartoe de onderneming of instelling behoort, en
      tevens uit dien hoofde het beleid van de onderneming of instelling mede bepalen, niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.f
    text: |-
      de Bank, onverminderd het bepaalde in artikel 24, van oordeel is, dat ingevolge een gekwalificeerde deelneming in
      de onderneming of instelling van een invloed op de onderneming of instelling sprake is of zou kunnen zijn, die in
      strijd is met een gezond bankbeleid;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.g
    text: |-
      de verklaring als bedoeld in artikel 8, tweede lid, onder *f*, een verklaring is die een andere inhoud heeft dan
      dat de jaarrekening of openingsbalans een getrouw beeld geeft van de grootte en de samenstelling van het vermogen
      van de onderneming of instelling; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: 9.1.h
    text: |-
      de Bank op grond van gegevens als omschreven in artikel 8, tweede lid, onder *f*, *g* of *h*, van oordeel is dat
      de onderneming of instelling niet in staat zal zijn om haar voornemens ten uitvoer te leggen dan wel om aan de aan
      haar uit hoofde van het toezicht te stellen eisen te voldoen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: '9.2'
    text: |-
      De Bank kan weigeren de vergunning te verlenen indien zij gronden heeft om aan te nemen dat de onderneming of
      instelling de vergunning heeft aangevraagd om zich te onttrekken aan de wet- of regelgeving inzake het toezicht op
      het kredietwezen in een andere Lid-Staat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: '9.3'
    text: |-
      De Bank kan weigeren de vergunning te verlenen indien zij van oordeel is dat de groep waartoe de onderneming of
      instelling behoort een formele of feitelijke zeggenschapsstructuur heeft die in zodanige mate ondoorzichtig is, dat
      deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de onderneming of instelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: '9.4'
    text: |-
      De Bank kan tevens weigeren de vergunning te verlenen indien de onderneming of instelling tot een groep behoort
      en het adequaat uitoefenen van toezicht op die onderneming onderscheidenlijk instelling, naar het oordeel van
      de Bank, wordt belemmerd door het recht van een Staat, die niet een Lid-Staat is, dat van toepassing is op een
      groepsmaatschappij of natuurlijke persoon die tot de groep behoort.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: '9.5'
    text: |-
      Indien de onderneming of instelling een dochtermaatschappij of bijkantoor van een niet in Nederland gevestigde
      kredietinstelling is kan de Bank weigeren de vergunning te verlenen indien zij van oordeel is, dat de
      toezichthoudende autoriteit van de Staat waar de buitenlandse kredietinstelling gevestigd is geen of onvoldoende
      geconsolideerd toezicht uitoefent.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel9
  - number: '10.1'
    text: Het dagelijks beleid van een kredietinstelling dient door ten minste twee personen te worden bepaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel10
  - number: '10.2'
    text: |-
      De personen die het dagelijks beleid van een kredietinstelling bepalen, verrichten hun werkzaamheden in verband
      daarmee vanuit Nederland.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel10
  - number: '10.3'
    text: |-
      Een kredietinstelling, die een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid
      is, dient een ten minste uit drie leden bestaande raad van commissarissen te hebben als bedoeld in de artikelen 140
      onderscheidenlijk 250 van Boek 2 van het Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel10
  - number: '10.4'
    text: |-
      Een kredietinstelling, die niet een naamloze vennootschap of een besloten vennootschap met beperkte
      aansprakelijkheid is, dient een ten minste uit drie leden bestaand orgaan te hebben dat een met die van een raad
      van commissarissen vergelijkbare taak heeft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel10
  - number: '10.5'
    text: |-
      De Bank kan aan een kredietinstelling, die niet is een naamloze vennootschap of een besloten vennootschap met
      beperkte aansprakelijkheid waarop artikel 158 of artikel 268 van Boek 2 van het Burgerlijk Wetboek van toepassing
      is, geheel of gedeeltelijk ontheffing van het in het derde of vierde lid bepaalde verlenen en aan deze ontheffing
      voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel10
  - number: '11.1'
    text: Een kredietinstelling dient te beschikken over een minimum bedrag aan eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel11
  - number: '11.2'
    text: Het bedrag bedoeld in het eerste lid wordt door de Bank bepaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel11
  - number: '11.3'
    text: |-
      Het bedrag bedoeld in het eerste lid kan voor onderscheiden groepen kredietinstellingen verschillend worden
      bepaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel11
  - number: '11.4'
    text: |-
      Bij de vaststelling van het bedrag bedoeld in het eerste lid wordt bepaald wat daarbij voor de onderscheiden
      rechtsvormen onder eigen vermogen wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel11
  - number: '11.5'
    text: |-
      De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling, voor een door
      de Bank te bepalen termijn, geheel of gedeeltelijk ontheffing verlenen van hetgeen zij op basis van het tweede en
      derde lid heeft bepaald. De Bank kan aan de ontheffing beperkingen stellen en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel11
  - number: '12.1'
    text: |-
      De Bank kan ten aanzien van een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] besluiten dat de artikelen 8, tweede lid, met uitzondering
      van onderdeel *e*, 9 eerste lid, met uitzondering van onderdeel *f*, of derde lid, 10, 11, 13, 14, 15, eerste
      lid, onderdeel *c*, onderdeel *d* - behoudens voor zover dit onderdeel betrekking heeft op artikel 9, eerste lid,
      onderdeel *f* - of onderdeel *g*, dan wel 30 geheel of gedeeltelijk buiten toepassing blijven, mits


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 12.1.a
    text: de kredietinstelling is aangesloten bij een centrale kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: 12.1.b
    text: |-
      de centrale kredietinstelling erop toeziet dat de aangesloten kredietinstelling de richtlijnen en algemene
      voorschriften als bedoeld in de artikelen 20, 21 en 22 naleeft;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: 12.1.c
    text: |-
      de centrale kredietinstelling en de bij haar aangesloten kredietinstellingen hoofdelijk instaan voor elkaars
      verplichtingen dan wel de verplichtingen van de aangesloten kredietinstelling door de centrale kredietinstelling
      worden gegarandeerd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: 12.1.d
    text: |-
      de centrale kredietinstelling naar het oordeel van de Bank voldoende bevoegd is instructies te geven aan de
      aangesloten kredietinstelling; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: 12.1.e
    text: |-
      het ingevolge artikel 20 uitgeoefende toezicht op de centrale kredietinstelling en de aangesloten kredietinstelling
      op geconsolideerde basis wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: '12.2'
    text: De Bank kan aan haar beslissing als bedoeld in het eerste lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel12
  - number: '13.1'
    text: |-
      Een wijziging van de gegevens bedoeld in artikel 8, tweede lid, onder a, b, c, of d, wordt, voor zover het aantal
      of de identiteit van de daar genoemde personen betreft, vooraf aan de Bank gemeld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel13
  - number: '13.2'
    text: |-
      Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd, indien de Bank het voornemen daartoe afwijst
      binnen 6 weken na ontvangst van de melding, bedoeld in het eerste lid, of, indien de Bank om nadere gegevens of
      inlichtingen heeft verzocht, binnen 6 weken na de ontvangst van die gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel13
  - number: '13.3'
    text: |-
      Indien zich een wijziging van de antecedenten bedoeld in artikel 8, tweede lid, onder a, b, c, of d, voordoet,
      stelt de kredietinstelling de Bank daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel13
  - number: '14.1'
    text: 'De Bank kan, indien:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: 14.1.a
    text: |-
      de kredietinstelling niet voldoet aan het bij of krachtens de [artikelen 7a][ref1], [10][ref2], [11][ref3] of
      [30][ref4] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel30
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 7a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '30'
        hoofdstuk: II
        paragraaf: '8'
        afdeling: '3'
  - number: 14.1.b
    text: |-
      zich bij de kredietinstelling een omstandigheid als bedoeld in artikel 9, eerste lid, onder *b*, *c*, *d* of *e*,
      voordoet; onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: 14.1.c
    text: |-
      de verklaring als bedoeld in artikel 30, tweede lid, een verklaring is die een andere inhoud heeft dan dat de
      jaarrekening als bedoeld in artikel 30, eerste lid, een getrouw beeld geeft van de grootte en de samenstelling van
      het vermogen van de kredietinstelling en van het resultaat over het desbetreffende boekjaar; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: '14.2'
    text: |-
      Onze minister kan, indien de kredietinstelling niet voldoet aan het bij of krachtens [artikel 85a][ref1]
      of [85b][ref2] bepaalde, de bevoegde organen van de kredietinstelling een aanwijzing geven om ten aanzien van met
      name aan te geven punten een bepaalde gedragslijn te volgen, teneinde te bereiken dat, binnen een in de aanwijzing
      te bepalen termijn, wordt voldaan aan het bij of krachtens [artikel 85a][ref3] of [85b][ref4] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel85b
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel85a
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel85b
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 85a
        hoofdstuk: XII
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: 85b
        hoofdstuk: XII
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: 85a
        hoofdstuk: XII
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: 85b
        hoofdstuk: XII
        paragraaf: '6'
  - number: '14.3'
    text: |-
      Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het geven van een aanwijzing worden
      overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze wet jegens Onze
      minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: '14.4'
    text: |-
      Een overdracht als bedoeld in het derde lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      vereisten voldoet:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: 14.4.a
    text: hij dient in staat te zijn de in het tweede lid bedoelde bevoegdheid naar behoren uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: 14.4.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke uitoefening van de in het tweede lid bedoelde bevoegdheid is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: '14.5'
    text: Aan de overdracht, bedoeld in het derde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
  - number: '14.6'
    text: |-
      De Bank kan, indien zich bij een kredietinstelling een omstandigheid als bedoeld in artikel 9, eerste lid, onder
      d of e voordoet, aan de personen die via een formele of feitelijke zeggenschapsstructuur het beleid van de groep
      waartoe deze kredietinstelling behoort bepalen, de aanwijzing geven dat één of meer personen die het beleid of
      het dagelijks beleid van deze groep bepalen niet uit dien hoofde tevens het beleid of het dagelijks beleid van de
      kredietinstelling mogen mede bepalen, teneinde te bereiken dat, binnen een door de Bank te bepalen termijn, zich
      bij een kredietinstelling een omstandigheid als bedoeld in [artikel 9, eerste lid, onder d of e][ref1] niet meer
      voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel9
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
  - number: 14a
    text: |-
      Indien een accountant naar het oordeel van de Bank niet of niet meer de nodige waarborgen biedt dat deze de
      toevertrouwde taak met betrekking tot de kredietinstelling naar behoren zal vervullen, kan de Bank bepalen
      dat hij niet bevoegd is de in deze wet bedoelde verklaringen omtrent de getrouwheid met betrekking tot die
      kredietinstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel14a
  - number: '15.1'
    text: 'De Bank kan een vergunning intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.a
    text: de kredietinstelling daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.b
    text: de onderneming of instelling, aan welke de vergunning is verleend, opgehouden heeft kredietinstelling te zijn;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.c
    text: |-
      de kredietinstelling niet voldoet aan het bij of krachtens de [artikelen 7a][ref1], [10][ref2], [11][ref3] of
      [30][ref4] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel30
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 7a
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '30'
        hoofdstuk: II
        paragraaf: '8'
        afdeling: '3'
  - number: 15.1.d
    text: |-
      zich bij de kredietinstelling een omstandigheid als bedoeld in artikel 9, eerste lid, onder b, c, d, e of f, derde,
      vierde of vijfde lid, voordoet;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.e
    text: |-
      de verklaring als bedoeld in artikel 30, tweede lid, een verklaring is die een andere inhoud heeft dan dat de
      jaarrekening als bedoeld in artikel 30, eerste lid, een getrouw beeld geeft van de grootte en de samenstelling van
      het vermogen van de kredietinstelling en van het resultaat over het desbetreffende boekjaar;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.f
    text: |-
      de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning dan wel zijn verkregen in het kader
      van artikel 2, tweede lid, zodanig onjuist of onvolledig blijken dat op het verzoek om verlening van een vergunning
      een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste omstandigheden volledig
      bekend waren geweest; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: 15.1.g
    text: |-
      de kredietinstelling niet voldoet aan het bepaalde in de regeling bedoeld in artikel 84, tweede tot en met vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '15.2'
    text: De Bank beslist binnen dertien weken na de ontvangst van het verzoek als bedoeld in het eerste lid, onder *a*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '15.3'
    text: |-
      Een beschikking tot intrekking van de vergunning op de gronden bedoeld in het eerste lid treedt eerst in werking
      wanneer zij onherroepelijk is geworden. Van de beschikking wordt mededeling gedaan in de *Staatscourant*, zodra zij
      onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '15.4'
    text: |-
      Met ingang van de datum waarop een beschikking als bedoeld in het eerste lid onherroepelijk is geworden, is het
      verbod als bedoeld in artikel 82, eerste lid, op de onderneming of instelling van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '15.5'
    text: |-
      De onderneming of instelling is vanaf de datum als bedoeld in het vierde lid gehouden alle lopende overeenkomsten
      betreffende bedrijfsmatig van het publiek verkregen gelden, die al dan niet op termijn opvorderbaar zijn, zo
      spoedig mogelijk op te zeggen en binnen een door de Bank te bepalen termijn af te wikkelen. De Bank is bevoegd deze
      termijn te verlengen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '15.6'
    text: |-
      Onverminderd het bepaalde in het vierde en vijfde lid wordt de onderneming of instelling gedurende de
      afwikkelingstermijn voor de toepassing van deze wet gelijkgesteld met een kredietinstelling, die een vergunning als
      bedoeld in artikel 6 heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel15
  - number: '16.1'
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die een vergunning als
      bedoeld in artikel 6 heeft verkregen en die voornemens is één of meerdere van de werkzaamheden genoemd in bijlage
      I van de Richtlijn uit te oefenen door middel van een bijkantoor in een andere Lid-Staat, dient, alvorens daartoe
      over te gaan, de Bank van haar voornemen schriftelijk kennis te geven. Het is de kredietinstelling verboden om aan
      haar voornemen gevolg te geven zolang de mededeling als bedoeld in het derde lid niet is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '16.2'
    text: 'De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: 16.2.a
    text: de Lid-Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: 16.2.b
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie - met inbegrip van de financiële administratie en de interne controle - ten behoeve van
      het bijkantoor zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: 16.2.c
    text: het adres van het bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: 16.2.d
    text: de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.3'
    text: |-
      De Bank doet binnen dertien weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de
      gegevens als bedoeld in het tweede lid, mededeling van die gegevens, van de omvang van het eigen vermogen en
      de solvabiliteitsratio van de kredietinstelling alsmede omtrent de toepasselijkheid van de ingevolge artikel
      84 tot stand gekomen garantieregeling op de verplichtingen van het bijkantoor van de kredietinstelling aan
      de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de
      kredietinstelling schriftelijk van het doen van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.4'
    text: |-
      Indien de Bank van oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor als bedoeld in het eerste lid voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen aan
      de richtlijnen als bedoeld in de artikelen 20, 21 en 22, doet zij, in afwijking van het derde lid, geen mededeling
      aan de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de
      kredietinstelling hiervan, binnen dertien weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en
      de gegevens als bedoeld in het tweede lid, in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.5'
    text: |-
      Indien zich een wijziging van de gegevens als bedoeld in het tweede lid, onder *b* tot en met *d*, dan wel
      met betrekking tot de toepasselijkheid van de ingevolge artikel 84 tot stand gekomen garantieregeling op de
      verplichtingen van het bijkantoor van de kredietinstelling voordoet of indien het voornemen bestaat om het
      verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het eerste lid te staken, stelt de
      kredietinstelling de Bank en de toezichthoudende autoriteit van de andere Lid-Staat daarvan ten minste vier weken
      voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.6'
    text: |-
      Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van oordeel is
      dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het bijkantoor als bedoeld in het eerste
      lid verricht, redelijkerwijs niet langer zal kunnen voldoen aan de richtlijnen als bedoeld in de artikelen 20, 21
      en 22, kan zij aan de kredietinstelling ter zake een aanwijzing geven om binnen een door haar te bepalen termijn
      ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.7'
    text: |-
      Indien de Bank niet binnen de door haar in de aanwijzing bepaalde termijn een haar bevredigend antwoord van de
      kredietinstelling heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is
      gegeven, trekt zij de mededeling als bedoeld in het derde lid in. De Bank stelt de toezichthoudende autoriteit van
      de andere Lid-Staat en de kredietinstelling schriftelijk van het intrekken van de mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: '16.8'
    text: |-
      Zodra de mededeling als bedoeld in het derde lid is ingetrokken, is het de kredietinstelling verboden nog langer
      werkzaamheden te verrichten door middel van het bijkantoor als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16
  - number: 16a.1
    text: |-
      Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die een vergunning als
      bedoeld in artikel 6 heeft verkregen en die voornemens is door middel van een bijkantoor in een andere Lid-Staat
      gelden ter beschikking te krijgen in ruil waarvoor elektronisch geld wordt uitgegeven, geeft, alvorens daartoe over
      te gaan, de Bank van haar voornemen schriftelijk kennis. Het is de kredietinstelling verboden om aan haar voornemen
      gevolg te geven zolang de mededeling, bedoeld in het derde lid, niet is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 16a.2
    text: 'De kennisgeving, bedoeld in het eerste lid, geschiedt onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.2.a
    text: de Lid-Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.2.b
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie – met inbegrip van de financiële administratie en de interne controle – ten behoeve van
      het bijkantoor zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.2.c
    text: het adres van het bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.2.d
    text: de identiteit van de personen die het dagelijks beleid van het bijkantoor zullen bepalen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.3
    text: |-
      De Bank doet binnen dertien weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, en de
      gegevens bedoeld in het tweede lid, mededeling van die gegevens, van de omvang van het eigen vermogen en de
      solvabiliteitsratio van de kredietinstelling aan de toezichthoudende autoriteit van de Lid-Staat bedoeld in het
      tweede lid, onder a. De Bank stelt de kredietinstelling schriftelijk van het doen van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.4
    text: |-
      Indien de Bank van oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor, bedoeld in het eerste lid, voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen aan de
      richtlijnen, bedoeld in de [artikelen 30b][ref1] en [30c][ref2], doet zij, in afwijking van het derde lid, geen
      mededeling aan de toezichthoudende autoriteit van de Lid-Staat, bedoeld in het tweede lid, onder a. De Bank stelt
      de kredietinstelling hiervan binnen dertien weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, en
      de gegevens, bedoeld in het tweede lid, onder a, in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel30c
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 30b
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: 30c
        hoofdstuk: II
        afdeling: '4'
  - number: 16a.5
    text: |-
      Indien zich een wijziging voordoet van de gegevens, bedoeld in het tweede lid, onder b tot en met d, of indien het
      voornemen bestaat om het verrichten van werkzaamheden door middel van het bijkantoor, bedoeld in het eerste lid,
      te staken, stelt de kredietinstelling de Bank en de toezichthoudende autoriteit van de andere Lid-Staat daarvan ten
      minste vier weken voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
  - number: 16a.6
    text: |-
      Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van
      oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het bijkantoor, bedoeld
      in het eerste lid, verricht, redelijkerwijs niet langer zal kunnen voldoen aan de richtlijnen, bedoeld in de
      [artikelen 30b][ref1] en [30c][ref2], kan zij aan de kredietinstelling ter zake een aanwijzing geven om binnen een
      door haar te bepalen termijn ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel30c
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 30b
        hoofdstuk: II
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: 30c
        hoofdstuk: II
        afdeling: '4'
  - number: 16a.7
    text: |-
      [Artikel 16, zevende en achtste lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel16
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '16'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '2'
  - number: 16b.1
    text: |-
      Een kredietinstelling, die een vergunning als bedoeld in artikel 6 heeft verkregen en die voornemens is één of
      meerdere van de werkzaamheden genoemd in bijlage I van de Richtlijn uit te oefenen door middel van een bijkantoor
      in een Staat, die niet een Lid-Staat is, geeft, alvorens daartoe over te gaan, de Bank van haar voornemen
      schriftelijk kennis. Het is de kredietinstelling verboden om aan haar voornemen gevolg te geven zolang de Bank niet
      van haar instemming blijk heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.2
    text: 'De kennisgeving als bedoeld in het eerste lid geschiedt onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.2.a
    text: de Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.2.b
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie – met inbegrip van de financiële administratie en de interne controle – ten behoeve van
      het bijkantoor zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.2.c
    text: het adres van het bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.2.d
    text: de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: 16b.3
    text: |-
      De Bank beslist binnen 6 weken na ontvangst van de kennisgeving bedoeld in het eerste lid op het verzoek tot
      instemming.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel16b
  - number: '17.1'
    text: |-
      Een kredietinstelling, die een vergunning als bedoeld in artikel 6 heeft verkregen en die voornemens is één van de
      werkzaamheden genoemd in bijlage I van de Richtlijn door middel van het verrichten van diensten in een andere Lid-
      Staat voor de eerste maal in die Lid-Staat uit te oefenen, geeft, alvorens daartoe over te gaan, de Bank steeds van
      haar voornemen schriftelijk kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel17
  - number: '17.2'
    text: 'De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel17
  - number: 17.2.a
    text: de Lid-Staat waarin de kredietinstelling voornemens is de werkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel17
  - number: 17.2.b
    text: de werkzaamheden welke de kredietinstelling voornemens is te verrichten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel17
  - number: '17.3'
    text: |-
      De Bank doet binnen vier weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van de gegevens als bedoeld in het tweede lid, onder *b*, aan
      de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de
      kredietinstelling schriftelijk van het doen van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel17
  - number: '18'
    text: |-
      De artikelen 19 tot en met 30, met uitzondering van 25 en 25a, hebben betrekking op iedere kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] die een vergunning als bedoeld in artikel 6 heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '20.1'
    text: |-
      De Bank kan, al dan niet tevens op geconsolideerde basis, aan de kredietinstellingen richtlijnen voor hun
      bedrijfsvoering geven in het belang van de solvabiliteit van die instellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: '20.2'
    text: |-
      De richtlijnen worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve
      organisaties. Het overleg over wijziging van de richtlijnen kan worden geopend door de Bank dan wel door de
      betrokken representatieve organisatie. De richtlijnen kunnen voor onderscheiden groepen van kredietinstellingen
      verschillend zijn. Aan een centrale kredietinstelling kunnen ook richtlijnen worden gegeven, die betrekking hebben
      op de collectiviteit van de bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan
      niet tezamen met de centrale kredietinstelling zelf.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: '20.3'
    text: 'De richtlijnen kunnen uitsluitend inhouden:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a
    text: bepalingen inzake het eigen vermogen, dat ten minste dient te worden aangehouden in verhouding tot
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a.(1)
    text: de naar risicograad gewogen kredietuitzettingen, beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a.(2)
    text: de naar risicograad gewogen verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a.(3)
    text: de rente-, wisselkoers- en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a.(4)
    text: de deelnemingen in andere ondernemingen of instellingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.a.(5)
    text: |-
      de onder (1), (2), (3) of (4) vallende afzonderlijke posten, voor zover zij een bepaald percentage van het eigen
      vermogen te boven gaan;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.b
    text: het verbod, de beperking of het aan voorschriften binden van
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.b.(1)
    text: de kredietuitzettingen, beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.b.(2)
    text: de verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.b.(3)
    text: de rente-, wisselkoers- en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.b.(4)
    text: de deelnemingen in andere ondernemingen of instellingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.c
    text: bepalingen inzake de omvang, al dan niet in verhouding tot het eigen vermogen, van
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.c.(1)
    text: de kredietuitzettingen, beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.c.(2)
    text: de verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.c.(3)
    text: de rente-, wisselkoers- en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.c.(4)
    text: de deelnemingen in andere ondernemingen of instellingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: 20.3.d
    text: bepalingen inzake de reikwijdte van consolidatie.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: '20.4'
    text: |-
      De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de richtlijnen verlenen, mits de
      solvabiliteit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende is gewaarborgd. De Bank
      kan aan de ontheffing beperkingen stellen en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: '20.5'
    text: In de richtlijnen wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent richtlijnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel20
  - number: '21.1'
    text: |-
      De Bank kan aan de kredietinstellingen richtlijnen voor hun bedrijfsvoering geven in het belang van de liquiditeit
      van die instellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: '21.2'
    text: |-
      De richtlijnen worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve
      organisaties. Het overleg over wijziging van de richtlijnen kan worden geopend door de Bank dan wel door de
      betrokken representatieve organisatie. De richtlijnen kunnen voor onderscheiden groepen van kredietinstellingen
      verschillend zijn. Aan een centrale kredietinstelling kunnen ook richtlijnen worden gegeven, die betrekking hebben
      op de collectiviteit van de bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan
      niet tezamen met de centrale kredietinstelling zelf.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: '21.3'
    text: |-
      De richtlijnen kunnen uitsluitend inhouden bepalingen inzake de minimale omvang der liquide middelen of onderdelen
      daarvan in verhouding tot
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: 21.3.(1)
    text: de ter beschikking verkregen gelden of bepaalde onderdelen van die gelden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: 21.3.(2)
    text: |-
      de van elke crediteur afzonderlijk ter beschikking verkregen gelden, voor zover deze een bepaald percentage van het
      totaal der ter beschikking verkregen gelden te boven gaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: '21.4'
    text: |-
      De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de richtlijnen verlenen, mits de
      liquiditeit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende is gewaarborgd. De Bank kan
      aan de ontheffing beperkingen stellen en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: '21.5'
    text: In de richtlijnen wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent richtlijnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel21
  - number: '22.1'
    text: |-
      De Bank kan aan de kredietinstellingen aanbevelingen en algemene richtlijnen voor hun bedrijfsvoering geven met
      betrekking tot de administratieve organisatie - met inbegrip van de financiële administratie en de interne controle
      alsmede met het oog op het voorkomen van belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel22
  - number: '22.2'
    text: |-
      De aanbevelingen en algemene richtlijnen worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken
      representatieve organisaties. Het overleg over wijziging van de aanbevelingen en algemene richtlijnen kan
      worden geopend door de Bank dan wel door de betrokken representatieve organisatie. De aanbevelingen en algemene
      richtlijnen kunnen voor onderscheiden groepen van kredietinstellingen verschillend zijn. Aan een centrale
      kredietinstelling kunnen ook aanbevelingen en algemene richtlijnen worden gegeven, die betrekking hebben op de
      collectiviteit van de bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan niet
      tezamen met de centrale kredietinstelling zelf.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel22
  - number: '22.3'
    text: |-
      De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling geheel of
      gedeeltelijk ontheffing van de algemene richtlijnen verlenen. De Bank kan aan de ontheffing beperkingen stellen en
      voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel22
  - number: '22.4'
    text: |-
      In de aanbevelingen en algemene richtlijnen wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent de
      aanbevelingen en algemene richtlijnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel22
  - number: '22.5'
    text: De aanbevelingen worden bekendgemaakt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel22
  - number: '23.1'
    text: 'Het is een kredietinstelling verboden, anders dan na verkregen verklaring van geen bezwaar:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.1.a
    text: |-
      haar eigen vermogen door terugbetaling van kapitaal of uitkering van reserves te verminderen dan
      wel een uitkering te doen uit de post omvattende de dekking voor algemene bankrisico's bedoeld in
      [artikel 424 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel424
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '424'
  - number: 23.1.b
    text: |-
      een gekwalificeerde deelneming in een andere onderneming of instelling te houden, te verwerven dan wel te
      vergroten, indien deze deelneming 10 procent of meer bedraagt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.1.c
    text: de activa en passiva van een andere onderneming of instelling geheel of voor een belangrijk deel over te nemen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.1.d
    text: een fusie aan te gaan met een andere onderneming of instelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.1.e
    text: over te gaan tot financiële of vennootschappelijke reorganisatie;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.1.f
    text: een beherend vennoot tot de kredietinstelling te doen toetreden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: '23.2'
    text: 'Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.2.a
    text: |-
      de Bank van oordeel is dat de handeling in strijd zou zijn of zou kunnen komen met de voor de kredietinstelling
      geldende richtlijnen als bedoeld in artikel 20, derde lid, onder *a*, (4) en (5), onder *b*, (4) en onder *c*,
      (4); of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.2.b
    text: |-
      de Bank van oordeel is dat de handeling anderszins in strijd zou zijn of zou kunnen komen met een gezond
      bankbeleid; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.2.c
    text: |-
      de Bank van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van het
      kredietwezen; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: 23.2.d
    text: |-
      Onze minister van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van
      het kredietwezen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: '23.3'
    text: |-
      Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van de
      overwegingen als bedoeld in het tweede lid, onder *a, b* en *c*, onderscheidenlijk het tweede lid, onder *d*,
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: '23.4'
    text: |-
      Ingeval een handeling als bedoeld in het eerste lid is verricht, zonder dat voor die handeling een verklaring van
      geen bezwaar is verkregen of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is
      de in overtreding zijnde kredietinstelling gehouden binnen een door Onze minister dan wel vanwege Onze minister
      door de Bank te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen alsnog in acht te
      nemen. Deze verplichting vervalt op het tijdstip waarop en voor zover voor de desbetreffende handeling alsnog een
      verklaring van geen bezwaar wordt afgegeven dan wel de niet in acht genomen beperkingen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: '23.5'
    text: |-
      Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze minister dan wel vanwege Onze minister de Bank een termijn vaststellen waarbinnen de in
      overtreding zijnde kredietinstelling de niet nagekomen voorschriften alsnog moet vervullen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel23
  - number: '24.1'
    text: |-
      Het is iedere natuurlijke persoon of rechtspersoon verboden, anders dan na verkregen verklaring van geen bezwaar,
      een gekwalificeerde deelneming in een kredietinstelling te houden, te verwerven of te vergroten dan wel enige
      zeggenschap verbonden aan een gekwalificeerde deelneming in een kredietinstelling uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '24.2'
    text: 'Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: 24.2.a
    text: |-
      de Bank van oordeel is, dat de handeling zou leiden of zou kunnen leiden tot een invloed op de betrokken
      kredietinstelling die in strijd is met een gezond bankbeleid;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: 24.2.b
    text: |-
      de Bank van oordeel is, dat de handeling ertoe zou leiden of zou kunnen leiden dat de betrokken kredietinstelling
      behoort of zou gaan behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige
      mate ondoorzichtig is dat deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de
      kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: 24.2.c
    text: |-
      de Bank van oordeel is, dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van het
      kredietwezen; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: 24.2.d
    text: |-
      Onze minister van oordeel is, dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van
      het kredietwezen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '24.3'
    text: |-
      Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van de
      overwegingen als bedoeld in het tweede lid, onder *a* tot en met *c*, onderscheidenlijk het tweede lid, onder *d*,
      beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '24.4'
    text: |-
      Ingeval het houden, het verwerven of het vergroten van een gekwalificeerde deelneming in een kredietinstelling als
      bedoeld in het eerste lid is verricht, zonder dat voor die handeling een verklaring van geen bezwaar is verkregen
      of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is de in overtreding zijnde
      natuurlijke persoon of rechtspersoon gehouden binnen een door Onze minister dan wel vanwege Onze minister door
      de Bank te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen alsnog in acht te
      nemen. Deze verplichting vervalt op het tijdstip waarop en voor zover voor de desbetreffende handeling alsnog een
      verklaring van geen bezwaar wordt verleend dan wel de niet in acht genomen beperkingen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '24.5'
    text: |-
      Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een kredietinstelling
      als bedoeld in het eerste lid geschiedt, zonder dat voor het houden, het verwerven of het vergroten van de
      gekwalificeerde deelneming dan wel voor het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde
      deelneming in een kredietinstelling als bedoeld in het eerste lid een verklaring van geen bezwaar is verkregen
      dan wel de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen, is een mede door de
      uitgeoefende zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering
      van Onze minister dan wel vanwege Onze minister van de Bank. Het besluit wordt in dat geval door de rechtbank,
      binnen wier rechtsgebied de kredietinstelling gevestigd is, vernietigd indien het besluit zonder dat de
      desbetreffende zeggenschap zou zijn uitgeoefend, anders zou hebben geluid dan wel niet zou zijn genomen, tenzij
      voor het tijdstip van de uitspraak alsnog een verklaring van geen bezwaar wordt verleend dan wel de niet in acht
      genomen beperkingen worden ingetrokken. De rechtbank regelt voor zover nodig de gevolgen van de vernietiging.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '24.6'
    text: |-
      Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze minister dan wel vanwege Onze minister de Bank een termijn vaststellen waarbinnen de in
      overtreding zijnde natuurlijke persoon dan wel rechtspersoon de niet nagekomen voorschriften alsnog moet vervullen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel24
  - number: '25.1'
    text: |-
      De Bank kan, ter uitvoering van bepalingen in richtlijnen van het Europees Parlement en de Raad van de Europese
      Unie betreffende het toezicht op geconsolideerde basis op kredietinstellingen, aan houders van een verklaring van
      geen bezwaar als bedoeld in artikel 24, eerste lid, die financiële instelling zijn waarvan de dochtermaatschappijen
      uitsluitend of hoofdzakelijk kredietinstellingen als bedoeld in artikel 1, eerste lid, onderdeel a, onder 1°,
      of financiële instellingen zijn en waarvan ten minste één dochtermaatschappij een kredietinstelling als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] is die een vergunning als bedoeld in artikel 6 heeft
      verkregen, algemene voorschriften geven om te voorkomen dat de handeling waarvoor de verklaring van geen bezwaar
      is verleend, zou leiden of zou kunnen leiden tot een invloed op laatstbedoelde kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] die in strijd is met een gezond bankbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '25.2'
    text: 'De algemene voorschriften kunnen uitsluitend inhouden bepalingen inzake:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: 25.2.a
    text: |-
      de omvang van het eigen vermogen van de houder als bedoeld in het eerste lid in verhouding tot de financiële
      risico’s van die houder en op geconsolideerde basis van de groep waarvan die houder aan het hoofd staat;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: 25.2.b
    text: de omvang, al dan niet in verhouding tot het eigen vermogen, van de financiële risico’s als bedoeld onder *a*;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: 25.2.c
    text: de reikwijdte van consolidatie; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: 25.2.d
    text: |-
      de door de houder als bedoeld in het eerste lid te verstrekken inlichtingen alsmede de vorm waarin deze
      inlichtingen dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: '25.3'
    text: |-
      In de algemene voorschriften wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent algemene
      voorschriften worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: '25.4'
    text: |-
      De Bank kan voor een houder als bedoeld in het eerste lid ontheffing van de algemene voorschriften verlenen, mits
      die houder, in overeenstemming met de Richtlijn, door een toezichthoudende autoriteit van een andere Lid-Staat bij
      het toezicht op kredietinstellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], wordt
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '25.5'
    text: |-
      Met betrekking tot de algemene voorschriften zijn de artikelen 24, zesde lid, en 26, zesde lid, aanhef en onder
      *d*, van overeenkomstige toepassing, met dien verstande dat de termijn als bedoeld in artikel 24, zesde lid, door
      de Bank wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25
  - number: 25a.1
    text: |-
      Voor het geval van een houder van een verklaring van geen bezwaar als bedoeld in artikel 24, eerste
      lid, die aan het hoofd staat van een groep waartoe een of meer kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], en een of meer verzekeraars als bedoeld in
      [artikel 1, eerste lid, onderdeel ][ref2] of [artikel 1, onderdeel ][ref3] behoren en waartoe ten minste één
      kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref4] behoort die een vergunning
      als bedoeld in artikel 6 heeft verkregen, kan de Bank, in overeenstemming met de autoriteit die ingevolge de
      [Wet toezicht verzekeringsbedrijf 1993][ref5] en de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref6] belast
      is met het toezicht op verzekeraars, op grond van de overwegingen als bedoeld in artikel 24, tweede lid, onderdelen
      *a* en *b*, voorschriften formuleren.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007477#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006509
      [ref6]: https://wetten.overheid.nl/BWBR0007477
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007477
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0006509
      - id: ref6
        bwb_id: BWBR0007477
  - number: 25a.2
    text: |-
      De voorschriften worden overeenkomstig artikel 24, derde lid, door Onze minister aan een verklaring van geen
      bezwaar als bedoeld in het eerste lid verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25a
  - number: 25a.3
    text: |-
      Indien de voorschriften worden gewijzigd, kan Onze minister, de Bank gehoord, dan wel in door Onze minister
      bepaalde gevallen vanwege Onze minister de Bank, de gewijzigde voorschriften verbinden aan de verklaring van geen
      bezwaar die aan een houder als bedoeld in het eerste lid is verleend.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25a
  - number: 25a.4
    text: De voorschriften worden bekendgemaakt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel25a
  - number: '26.1'
    text: |-
      Op een aanvraag tot het verkrijgen van een verklaring van geen bezwaar als bedoeld in artikel 23, eerste lid, of
      artikel 24, eerste lid, wordt beslist door Onze minister, de Bank gehoord, dan wel in door Onze minister bepaalde
      gevallen vanwege Onze minister door de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.2'
    text: |-
      De aanvraag wordt ingediend bij de Bank. De Bank zendt de aanvraag, vergezeld van haar advies, aan Onze minister
      behoudens in de gevallen waarin zij vanwege Onze minister beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.3'
    text: Op de aanvraag wordt binnen dertien weken beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.4'
    text: |-
      Van de verleende verklaring van geen bezwaar als bedoeld in artikel 24, eerste lid, wordt door de zorg van de Bank
      aan de betrokken kredietinstelling mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.5'
    text: |-
      Van de afgifte van een verklaring van geen bezwaar wordt door Onze minister dan wel vanwege Onze minister door de
      Bank mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze minister of de Bank van oordeel is, dat
      publicatie zou leiden of zou kunnen leiden tot onevenredige bevoordeling of benadeling van belanghebbenden bij de
      beschikking of derden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.6'
    text: |-
      Een verklaring van geen bezwaar kan door Onze minister, de Bank gehoord, dan wel in door Onze minister bepaalde
      gevallen vanwege Onze minister door de Bank worden gewijzigd of ingetrokken:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.6.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.6.b
    text: |-
      indien aan de houder een verklaring van geen bezwaar wordt verleend die betrekking heeft op handelingen waarvoor de
      in te trekken verklaring van geen bezwaar was verleend;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.6.c
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.6.d
    text: |-
      indien niet alsnog binnen de termijn als bedoeld in artikel 23, vijfde lid, respectievelijk artikel 24, zesde lid,
      aan alle bij de verklaring van geen bezwaar gestelde voorschriften wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.7'
    text: |-
      Indien zich met betrekking tot een verleende verklaring van geen bezwaar omstandigheden voordoen of feiten bekend
      worden welke
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.7.a
    text: |-
      naar het oordeel van de Bank tot strijd met een gezond bankbeleid respectievelijk tot een invloed op de betrokken
      kredietinstelling die in strijd is met een gezond bankbeleid leiden of zouden kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.7.b
    text: |-
      naar het oordeel van de Bank ertoe leiden of zouden kunnen leiden dat de betrokken kredietinstelling zou gaan
      behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige mate ondoorzichtig is
      dat deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de kredietinstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: 26.7.c
    text: |-
      naar het oordeel van de Bank of Onze minister tot een ongewenste ontwikkeling van het kredietwezen leiden of zouden
      kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.8'
    text: |-
      Van de wijziging of de intrekking van een verklaring van geen bezwaar als bedoeld in artikel 24, eerste lid, wordt
      door de zorg van de Bank aan de betrokken kredietinstelling mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '26.9'
    text: |-
      Van de wijziging of de intrekking van een verklaring van geen bezwaar wordt door Onze minister dan wel vanwege
      Onze minister door de Bank mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze minister of de Bank
      van oordeel is, dat publicatie zou leiden of zou kunnen leiden tot onevenredige bevoordeling of benadeling van
      belanghebbenden bij de beschikking of derden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel26
  - number: '27.1'
    text: |-
      Iedere natuurlijke persoon of rechtspersoon wiens gekwalificeerde deelneming in een kredietinstelling zodanig
      wijzigt, dat de omvang van deze deelneming onder de 5, 10, 20, 33 of 50 procent daalt of, dat de kredietinstelling
      ophoudt een dochtermaatschappij te zijn, stelt de Bank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel27
  - number: '27.2'
    text: |-
      Een kredietinstelling stelt, voor zover haar bekend, de Bank in de maand juli van elk jaar in kennis van
      de identiteit van iedere natuurlijke persoon of rechtspersoon die een gekwalificeerde deelneming in deze
      kredietinstelling houdt. Tevens stelt een kredietinstelling, zodra zulks haar bekend wordt, de Bank in kennis van
      iedere verwerving, afstoting of wijziging van een gekwalificeerde deelneming in deze kredietinstelling waardoor de
      omvang van deze deelneming boven onderscheidenlijk onder de 5, 20, 33 of 50 procent stijgt onderscheidenlijk daalt
      of waardoor de kredietinstelling een dochtermaatschappij wordt onderscheidenlijk ophoudt een dochtermaatschappij
      te zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel27
  - number: '27.3'
    text: |-
      De Bank stelt Onze minister eens per jaar in kennis van de gegevens waarover zij ingevolge het eerste en het tweede
      lid beschikt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel27
  - number: '28.1'
    text: |-
      Indien de Bank constateert, dat een kredietinstelling de richtlijnen als bedoeld in de artikelen 20, 21 of 22
      niet naleeft, of andere tekenen ontwaart van een ontwikkeling, die naar haar oordeel de solvabiliteit of de
      liquiditeit van de kredietinstelling in gevaar brengt of zou kunnen brengen, vestigt zij daarop de aandacht van
      die kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: '28.2'
    text: |-
      Zo nodig doet de Bank de mededeling, bedoeld in het eerste lid, vergezeld gaan van een aanwijzing om ten aanzien
      van met name aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: '28.3'
    text: |-
      Indien de Bank niet binnen twee weken na bekendmaking van de aanwijzing een haar bevredigend antwoord van de
      kredietinstelling heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is
      gegeven, kan de Bank
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.3.a
    text: |-
      de kredietinstelling aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de kredietinstelling
      hun bevoegdheden slechts mogen uitoefenen na goedkeuring door een of meer door de Bank aangewezen personen en met
      inachtneming van de opdrachten van deze personen, welke aanzegging terstond van kracht wordt;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.3.b
    text: |-
      de kredietinstelling aanzeggen, dat de Bank zal overgaan tot publicatie van de aanwijzing, bedoeld in het tweede
      lid, bij welke publicatie, wanneer de kredietinstelling zulks verlangt, tevens de correspondentie openbaar wordt
      gemaakt, die naar aanleiding van de aanwijzing tussen de Bank en de kredietinstelling is gevoerd;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.3.c
    text: |-
      met de voorzitter van de representatieve organisatie van de groep kredietinstellingen, waartoe de kredietinstelling
      behoort, dienaangaande in overleg treden, wanneer de Bank zulks in het belang van crediteuren acht. De voorzitter
      kan zich bij dit overleg doen bijstaan door ten hoogste twee functionarissen van zijn organisatie, tenzij de Bank
      zulks niet wenselijk acht. De Bank doet de kredietinstelling mededeling van het overleg.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: '28.4'
    text: |-
      Indien de Bank bij een kredietinstelling tekenen ontwaart van een ontwikkeling, die naar haar oordeel de
      solvabiliteit of de liquiditeit van de kredietinstelling in gevaar brengt en onverwijld ingrijpen noodzakelijk
      maakt, kan zij zonder toepassing van de eerste twee leden onmiddellijk uitvoering geven aan de onderdelen *a* en
      *c* van het derde lid [Artikel 4:11 van de Algemene wet bestuursrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '28.5'
    text: 'Met betrekking tot een aanzegging als bedoeld in het derde lid, onder *a*, is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.a
    text: |-
      de organen van de kredietinstelling zijn verplicht de door de Bank aangewezen personen alle medewerking te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.b
    text: |-
      de Bank kan de betrokken organen van de kredietinstelling toestaan bepaalde handelingen zonder machtiging te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.c
    text: |-
      de door de Bank aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na bekendmaking
      van de aanzegging, bedoeld in het derde lid, onder *a*, behoudens de bevoegdheid van de Bank om deze termijn
      telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.d
    text: de Bank kan te allen tijde de door haar aangewezen personen door andere vervangen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.e
    text: |-
      voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in het derde
      lid, onder *a*, zijn degenen, die deel uit maken van het orgaan van de kredietinstelling dat deze handelingen
      verrichtte, persoonlijk aansprakelijk tegenover de kredietinstelling; de kredietinstelling kan de ongeldigheid van
      deze handelingen inroepen, indien de wederpartij wist, dat de vereiste goedkeuring ontbrak of daarvan niet onkundig
      kon zijn;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: 28.5.f
    text: |-
      zodra de Bank van oordeel is dat de solvabiliteit en de liquiditeit van de kredietinstelling niet langer gevaar
      lopen, beslist zij dat de betrokken organen van de kredietinstelling hun bevoegdheden weer onbeperkt kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: '28.6'
    text: |-
      Het besluit tot publicatie van een aanwijzing als bedoeld in het derde lid, onder *b*, wordt eerst van kracht,
      wanneer het onherroepelijk is geworden. Indien de kredietinstelling na de publicatie alsnog voldoet aan de
      aanwijzing dan wel indien de Bank de aanwijzing intrekt, zal de Bank hiervan op dezelfde wijze als bij de
      voorafgaande publicatie kennis geven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel28
  - number: '29.1'
    text: |-
      Indien de Bank door de toezichthoudende autoriteit van een andere Lid-Staat ervan in kennis is gesteld dat een
      bijkantoor in die Lid-Staat van een in Nederland gevestigde kredietinstelling de voor die kredietinstelling in
      die andere Lid-Staat op het bijkantoor van toepassing zijnde regels betreffende het toezicht niet of niet volledig
      naleeft, vestigt zij daarop de aandacht van die kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel29
  - number: '29.2'
    text: |-
      Zo nodig doet de Bank de mededeling als bedoeld in het eerste lid, vergezeld gaan van een, zo nodig na overleg
      met de toezichthoudende autoriteit als bedoeld in het eerste lid opgestelde, aanwijzing om binnen een door haar te
      bepalen termijn ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel29
  - number: '29.3'
    text: |-
      Indien de Bank niet binnen de door haar in de aanwijzing bepaalde termijn een haar bevredigend antwoord van de
      kredietinstelling heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing is gevolg
      gegeven, trekt zij de mededeling als bedoeld in artikel 16, derde lid, in. De Bank stelt de toezichthoudende
      autoriteit van de andere Lid-Staat en de kredietinstelling schriftelijk van het intrekken van de mededeling in
      kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel29
  - number: '30.1'
    text: |-
      Iedere kredietinstelling is verplicht jaarlijks binnen zes maanden na afloop van het boekjaar ten minste
      haar jaarrekening als bedoeld in artikel 361, eerste lid, van Boek 2 van het Burgerlijk Wetboek bij de Bank
      in te dienen. De jaarrekening moet worden ingediend in de vorm waarin zij overeenkomstig de statuten of de
      vennootschapsakte is goedgekeurd of bij gebreke van goedkeuring is vastgesteld, dan wel, bij gebreke van
      vaststelling, in de vorm waarin zij is opgemaakt. Daarop wordt vermeld of zij al dan niet is vastgesteld en
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: '30.2'
    text: |-
      De jaarrekening moet zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend door een accountant
      als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De kredietinstelling is
      verplicht bij de opdracht tot het onderzoek de accountant schriftelijk te machtigen desgevraagd of ingevolge een
      daartoe strekkende overeenkomst tussen de kredietinstelling, de accountant en de Bank aan de Bank alle inlichtingen
      te verstrekken, die redelijkerwijze geacht kunnen worden nodig te zijn voor de juiste uitvoering van de taak,
      bij deze wet aan de Bank opgelegd. De Bank stelt de kredietinstelling in de gelegenheid aanwezig te zijn bij het
      verstrekken van inlichtingen door de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '30.3'
    text: |-
      De Bank kan een kredietinstelling geheel of gedeeltelijk ontheffing van het in het eerste of tweede lid bepaalde
      verlenen en aan deze ontheffing voorschriften verbinden, onverminderd het bepaalde in titel 9 van Boek 2 van het
      Burgerlijk Wetboek.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: '30.4'
    text: |-
      De accountant, bedoeld in het tweede lid, meldt de Bank zo spoedig mogelijk elke omstandigheid waarvan hij bij de
      uitvoering van zijn werkzaamheden als bedoeld in het tweede lid kennis heeft gekregen en die:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: 30.4.a
    text: in strijd is met de eisen die voor het verkrijgen van een vergunning als bedoeld in artikel 6 zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: 30.4.b
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: 30.4.c
    text: het voortbestaan van de kredietinstelling bedreigt; of
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: 30.4.d
    text: leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: '30.5'
    text: |-
      Op de accountant die naast zijn werkzaamheden voor de kredietinstelling ook werkzaamheden uitvoert voor een andere
      onderneming of instelling, is de meldingsplicht, bedoeld in het vierde lid, van overeenkomstige toepassing indien
      de kredietinstelling dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere
      onderneming of instelling dochtermaatschappij is van de kredietinstelling. Voor de toepassing van de eerste volzin
      wordt onder dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in artikel 24*a* van Boek 2 van
      het Burgerlijk Wetboek, met dien verstande dat een kredietinstelling tevens dochtermaatschappij kan zijn van een
      natuurlijk persoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: '30.6'
    text: |-
      De accountant die op grond van het vierde of vijfde lid tot een melding aan de Bank is overgegaan, is niet
      aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle
      feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30
  - number: 30a
    text: |-
      De artikelen 30b tot en met 30f hebben betrekking op iedere kredietinstelling, bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die een vergunning als bedoeld in [artikel 6][ref2] heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel6
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: 30b.1
    text: |-
      De Bank kan, al dan niet tevens op geconsolideerde basis, aan de kredietinstellingen richtlijnen voor hun
      bedrijfsvoering geven in het belang van de liquiditeit en de solvabiliteit van die instellingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.2
    text: |-
      De richtlijnen worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve
      organisaties. Het overleg over wijziging van de richtlijnen kan worden geopend door de Bank dan wel door
      de betrokken representatieve organisatie. De richtlijnen kunnen voor de verschillende categorieën van
      kredietinstellingen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3
    text: 'De richtlijnen kunnen uitsluitend inhouden:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.a
    text: |-
      bepalingen inzake het eigen vermogen dat ten minste dient te worden aangehouden in verhouding tot de financiële
      verplichtingen die met uitgegeven elektronisch geld verband houden;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.b
    text: 'de beperking ten aanzien van of het aan voorschriften binden van:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.b.1°
    text: de beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.b.2°
    text: de verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.b.3°
    text: de rente-, wisselkoers- en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.3.c
    text: |-
      bepalingen inzake de minimale omvang van de liquide middelen of onderdelen daarvan in verhouding tot de ter
      beschikking verkregen gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.4
    text: |-
      De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de richtlijnen verlenen, indien de
      liquiditeit en de solvabiliteit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende zijn
      gewaarborgd. De Bank kan aan de ontheffing beperkingen stellen en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30b.5
    text: In de richtlijnen wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent richtlijnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30b
  - number: 30c.1
    text: |-
      De Bank kan aan de kredietinstellingen aanbevelingen en algemene richtlijnen voor hun bedrijfsvoering geven met
      betrekking tot de administratieve organisatie, met inbegrip van de financiële administratie en de interne controle,
      alsmede met het oog op het voorkomen van belangenconflicten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30c
  - number: 30c.2
    text: |-
      De aanbevelingen en algemene richtlijnen worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken
      representatieve organisaties. Het overleg over wijziging van de aanbevelingen en algemene richtlijnen kan
      worden geopend door de Bank dan wel door de betrokken representatieve organisatie. De aanbevelingen en algemene
      richtlijnen kunnen voor de verschillende categorieën van kredietinstellingen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30c
  - number: 30c.3
    text: |-
      De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling geheel of
      gedeeltelijk ontheffing van de algemene richtlijnen verlenen. De Bank kan aan de ontheffing beperkingen stellen en
      voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30c
  - number: 30c.4
    text: |-
      In de aanbevelingen en algemene richtlijnen wordt bepaald, wat wordt verstaan onder de begrippen waaromtrent de
      aanbevelingen en algemene richtlijnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30c
  - number: 30c.5
    text: De aanbevelingen worden bekendgemaakt door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30c
  - number: 30d.1
    text: |-
      Iedere natuurlijke persoon of rechtspersoon die voornemens is een gekwalificeerde deelneming van 10 procent of
      meer in een kredietinstelling te houden, te verwerven of zodanig te vergroten dat daardoor de omvang van deze
      deelneming de 20, 33, of 50 procent overschrijdt of de kredietinstelling een dochtermaatschappij wordt, dan wel
      enige zeggenschap verbonden aan een gekwalificeerde deelneming in een kredietinstelling uit te oefenen, stelt,
      alvorens daartoe over te gaan, de Bank van het voornemen schriftelijk in kennis. Het is de natuurlijke persoon of
      rechtspersoon verboden om aan dit voornemen gevolg te geven zolang de mededeling, bedoeld in het derde lid niet
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30d
  - number: 30d.2
    text: |-
      Iedere natuurlijke persoon of rechtspersoon wiens gekwalificeerde deelneming zodanig wijzigt dat de omvang van de
      deelneming onder de 10, 20, 33, of 50 procent daalt, of dat de kredietinstelling ophoudt een dochtermaatschappij te
      zijn, stelt de Bank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30d
  - number: 30d.3
    text: |-
      Indien de Bank van oordeel is dat het voornemen bedoeld in het eerste lid niet zou leiden of zou kunnen leiden tot
      een invloed op de betrokken kredietinstelling die in strijd is met een gezond bankbeleid deelt zij de natuurlijke
      persoon of rechtspersoon binnen acht weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, mede dat
      geen bezwaar bestaat tegen het voornemen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30d
  - number: 30d.4
    text: |-
      Een kredietinstelling stelt, voor zover haar bekend, de Bank in de maand juli van elk jaar in kennis van
      de identiteit van iedere natuurlijke persoon of rechtspersoon die een gekwalificeerde deelneming in deze
      kredietinstelling houdt. Tevens stelt een kredietinstelling, zodra zulks haar bekend wordt, de Bank in kennis van
      iedere verwerving, afstoting of wijziging van een gekwalificeerde deelneming in deze kredietinstelling waardoor de
      omvang van deze deelneming boven onderscheidenlijk onder 10, 20, 33 of 50 procent stijgt onderscheidenlijk daalt
      of waardoor de kredietinstelling een dochtermaatschappij wordt onderscheidenlijk ophoudt een dochtermaatschappij
      te zijn.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30d
  - number: 30d.5
    text: |-
      Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een kredietinstelling
      als bedoeld in het eerste lid geschiedt, zonder dat voor het houden, het verwerven of het vergroten van de
      gekwalificeerde deelneming de mededeling, bedoeld in het derde lid, is gedaan, is een mede door de uitgeoefende
      zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering van de Bank.
      Het besluit wordt in dat geval door de rechtbank, binnen wier rechtsgebied de kredietinstelling gevestigd is,
      vernietigd, indien het besluit zonder dat de desbetreffende zeggenschap zou zijn uitgeoefend, anders zou hebben
      geluid dan wel niet zou zijn genomen. De rechtbank regelt voor zover nodig de gevolgen van de vernietiging.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30d
  - number: 30e.1
    text: |-
      Indien de Bank constateert dat een kredietinstelling de richtlijnen, bedoeld in de artikelen 30b en 30c, niet
      naleeft, of andere tekenen ontwaart van een ontwikkeling die naar haar oordeel de liquiditeit of de solvabiliteit
      van de kredietinstelling in gevaar brengt of zou kunnen brengen, vestigt zij daarop de aandacht van die
      kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30e
  - number: 30e.2
    text: |-
      [Artikel 28, tweede lid, derde lid, onder a en b, en vierde tot en met zesde lid][ref1], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel28
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30e
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '28'
        hoofdstuk: II
        paragraaf: '7'
        afdeling: '3'
  - number: 30f
    text: |-
      De [artikelen 29][ref1] en 30 zijn van overeenkomstige toepassing met betrekking tot kredietinstellingen, bedoeld
      in deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel29
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel30f
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '29'
        hoofdstuk: II
        paragraaf: '7'
        afdeling: '3'
  - number: '31.1'
    text: |-
      Het is een in een andere Lid-Staat gevestigde onderneming of instelling verboden het bedrijf van kredietinstelling
      door middel van een bijkantoor in Nederland uit te oefenen, tenzij
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.a
    text: |-
      zij van de toezichthoudende autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van
      kredietinstelling benodigde vergunning heeft verkregen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b
    text: 'de Bank een kennisgeving heeft ontvangen van de toezichthoudende autoriteit van de andere Lid-Staat, welke bevat:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b.(1)
    text: |-
      een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het bijkantoor
      zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b.(2)
    text: het adres van het bijkantoor;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b.(3)
    text: de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b.(4)
    text: de omvang van het eigen vermogen en de solvabiliteitsratio van de kredietinstelling; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.b.(5)
    text: |-
      gegevens omtrent de toepasselijkheid van een garantieregeling in de andere Lid-Staat op de verplichtingen van het
      bijkantoor; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: 31.1.c
    text: |-
      de Bank de ontvangst van de kennisgeving als bedoeld onder *b* aan de onderneming of instelling heeft medegedeeld
      dan wel er acht weken zijn verstreken vanaf het tijdstip waarop de Bank de kennisgeving als bedoeld onder *b* heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: '31.2'
    text: |-
      Het is de in een andere Lid-Staat gevestigde kredietinstelling die krachtens het eerste lid het bedrijf van
      kredietinstelling door middel van een bijkantoor in Nederland mag uitoefenen, echter niet toegestaan werkzaamheden
      genoemd in bijlage I van de Richtlijn te verrichten, indien het verrichten van die werkzaamheden door de vergunning
      bedoeld in het eerste lid, onder *a*, wordt uitgesloten dan wel de kennisgeving als bedoeld in het eerste lid,
      onder *b*, het verrichten van die werkzaamheden niet vermeldt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: '31.3'
    text: |-
      De in de andere Lid-Staat gevestigde kredietinstelling als bedoeld in het eerste lid dient de Bank en de
      toezichthoudende autoriteit van die andere Lid-Staat ten minste vier weken van te voren in kennis te stellen van
      elke wijziging van de gegevens als bedoeld in het eerste lid, onder *b*, sub (1), (2), (3) of (5) of, in voorkomend
      geval, van het voornemen om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het
      eerste lid te staken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: '31.4'
    text: |-
      Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: '31.5'
    text: |-
      De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel31
  - number: '32.1'
    text: |-
      Het is een in een andere Lid-Staat gevestigde onderneming of instelling die het bedrijf van kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] uitoefent, verboden al dan niet op termijn
      opvorderbare gelden van het publiek ter beschikking te verkrijgen door middel van het verrichten van diensten in
      Nederland, tenzij


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 32.1.a
    text: |-
      zij van de toezichthoudende autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van
      kredietinstelling benodigde vergunning heeft verkregen; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
  - number: 32.1.b
    text: |-
      zij een kennisgeving heeft gezonden aan de toezichthoudende autoriteit van de andere Lid-Staat, welke bevat een
      opgave van de voorgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
  - number: '32.2'
    text: |-
      Het is de in een andere Lid-Staat gevestigde kredietinstelling die krachtens het eerste lid opvorderbare gelden
      van het publiek ter beschikking te verkrijgen door middel van het verrichten van diensten in Nederland, echter
      niet toegestaan werkzaamheden genoemd in bijlage I van de Richtlijn te verrichten, indien het verrichten van die
      werkzaamheden door de vergunning bedoeld in het eerste lid, onder *a*, wordt uitgesloten dan wel de kennisgeving
      als bedoeld in het eerste lid, onder *b*, het verrichten van die werkzaamheden niet vermeldt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
  - number: '32.3'
    text: |-
      Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
  - number: '32.4'
    text: |-
      De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32
  - number: 32a
    text: |-
      Het is een in een andere Lid-Staat gevestigde onderneming of instelling die het bedrijf van kredietinstelling,
      bedoeld in [artikel 1, onderdeel a, onder 2°][ref1], uitoefent, verboden door middel van het verrichten van
      diensten in Nederland gelden ter beschikking te krijgen in ruil waarvoor elektronisch geld wordt uitgegeven,
      tenzij;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 32a.a
    text: |-
      zij van de toezichthoudende autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van
      kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, benodigde vergunning heeft
      verkregen; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32a
  - number: 32a.b
    text: |-
      zij een kennisgeving heeft gezonden aan de toezichthoudende autoriteit van de andere Lid-Staat, welke een opgave
      van de voorgenomen werkzaamheden bevat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel32a
  - number: '33.1'
    text: |-
      Indien een Lid-Staat de Richtlijn niet of onvolledig heeft uitgevoerd, kan Onze minister, de Bank gehoord, bepalen
      dat voor in die Lid-Staat gevestigde ondernemingen en instellingen het tweede en derde lid gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel33
  - number: '33.2'
    text: |-
      Op een onderneming of instelling als bedoeld in het eerste lid, zijn, met betrekking tot het uitoefenen van het
      bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] door middel van
      een bijkantoor in Nederland, in plaats van artikel 31, de artikelen 38 tot en met 44 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '33.3'
    text: |-
      Op een onderneming of instelling als bedoeld in het eerste lid, is, met betrekking tot het ter beschikking
      verkrijgen van, al dan niet op termijn, opvorderbare gelden door middel van het verrichten van diensten in
      Nederland, in plaats van artikel 32, artikel 82 van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel33
  - number: '33.4'
    text: |-
      Met ingang van het tijdstip waarop de maatregel als bedoeld in het eerste lid ten aanzien van een Lid-Staat
      wordt ingetrokken, wordt de in die Lid-Staat gevestigde onderneming of instelling die op dat tijdstip het bedrijf
      van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] door middel van een
      bijkantoor in Nederland uitoefent en die daarvoor een vergunning als bedoeld in artikel 38, eerste lid heeft
      verkregen, geacht te hebben voldaan aan artikel 31, eerste lid, onder *b* en *c*; de aan deze onderneming of
      instelling verleende vergunning als bedoeld in artikel 38, eerste lid vervalt op dat tijdstip van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '34'
    text: |-
      De artikelen 19 en 21 zijn van overeenkomstige toepassing op een bijkantoor in Nederland van een in een andere
      Lid-Staat gevestigde kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], dat
      overeenkomstig artikel 31 het bedrijf van kredietinstelling uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '35.1'
    text: |-
      Indien de Bank constateert, dat een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde
      kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], dat overeenkomstig
      artikel 31 het bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2]
      uitoefent, de richtlijnen als bedoeld in artikel 21 niet naleeft, of andere tekenen ontwaart van een ontwikkeling,
      die naar haar oordeel de liquiditeit van het bijkantoor in gevaar brengt of zou kunnen brengen, is artikel 28,
      eerste en tweede lid, van overeenkomstige toepassing met betrekking tot de liquiditeit van het bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '35.2'
    text: |-
      Indien de Bank niet binnen twee weken na bekendmaking van de aanwijzing als bedoeld in artikel 28, tweede lid,
      een haar bevredigend antwoord heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing
      gevolg is gegeven, kan de Bank de toezichthoudende autoriteit van de Lid-Staat waar de kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] gevestigd is, daarvan in kennis stellen en die
      toezichthoudende autoriteit verzoeken te bewerkstelligen dat alsnog binnen een door de Bank te stellen termijn aan
      de aanwijzing gevolg wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '35.3'
    text: |-
      Indien de Bank niet binnen de laatstbedoelde door haar gestelde termijn een haar bevredigend antwoord heeft
      ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is gegeven, is, nadat de Bank
      de toezichthoudende autoriteit van die andere Lid-Staat daarvan in kennis heeft gesteld, artikel 28, derde, vijfde
      en zesde lid, van overeenkomstige toepassing met betrekking tot de liquiditeit van het bijkantoor.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
  - number: '35.4'
    text: |-
      Indien de Bank bij een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde kredietinstelling als
      bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], dat overeenkomstig artikel 31 het bedrijf van
      kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] uitoefent, tekenen ontwaart
      van een ontwikkeling die naar haar oordeel de liquiditeit van het bijkantoor in gevaar brengt en onverwijld
      ingrijpen noodzakelijk maakt, kan de Bank, niettegenstaande het bepaalde in het eerste tot en met derde lid,
      met overeenkomstige toepassing van artikel 28, derde tot en met zesde lid, met betrekking tot het bijkantoor
      maatregelen treffen die zij onontbeerlijk acht voor de bescherming van de belangen van de crediteuren van het
      bijkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '35.5'
    text: |-
      De Bank kan, met overeenkomstige toepassing van artikel 28, derde tot en met zesde lid, met
      betrekking tot het bijkantoor tevens maatregelen treffen, ingeval zij daartoe een verzoek heeft
      gekregen van de toezichthoudende autoriteit van de Lid-Staat waar de kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '35.6'
    text: |-
      De Bank doet van de maatregelen als bedoeld in het vierde en vijfde lid onverwijld mededeling aan de
      toezichthoudende autoriteit van de andere Lid-Staat en aan de Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel35
  - number: '36'
    text: |-
      Een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde
      [kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 1°][ref1], dat overeenkomstig artikel
      31 het bedrijf van kredietinstelling uitoefent, dient voor zijn bedrijf hier te lande ten minste een zodanige
      boekhouding te voeren, dat de Bank de haar bij deze wet opgelegde taak kan uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '37'
    text: |-
      Een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde kredietinstelling als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], dat overeenkomstig artikel 31 het bedrijf van
      kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] uitoefent, is
      verplicht jaarlijks binnen zes maanden na afloop van het boekjaar van de kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] waarvan het onderdeel uitmaakt, de boekhoudbescheiden,
      aangewezen krachtens de [Handelsregisterwet 1996][ref4] bij de Bank in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007893
  - number: '38.1'
    text: |-
      Het is een in een Staat, die niet een Lid-Staat is, gevestigde onderneming of instelling verboden het bedrijf van
      kredietinstelling door middel van een bijkantoor in Nederland uit te oefenen, behoudens voor zover zij daartoe van
      de Bank een vergunning heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38
  - number: '38.2'
    text: |-
      Het is een kredietinstelling, die een vergunning als bedoeld in het eerste lid heeft verkregen, in verband
      met het ingevolge deze wet uitgeoefende toezicht toegestaan ten minste de werkzaamheden genoemd in bijlage
      I van de Richtlijn te verrichten, tenzij in de vergunning uitdrukkelijk anders is bepaald en onverminderd de
      toepasselijkheid van andere op deze werkzaamheden betrekking hebbende wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38
  - number: '38.3'
    text: |-
      Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38
  - number: '38.4'
    text: |-
      De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38
  - number: 38a.1
    text: |-
      Het is een in een Staat, die niet een Lid-Staat is, gevestigde onderneming of instelling verboden door middel van
      het verrichten van diensten in Nederland gelden ter beschikking te krijgen in ruil waarvoor elektronisch geld wordt
      uitgegeven, waarmee betalingen kunnen worden verricht ook aan anderen dan de onderneming of instelling die het
      elektronisch geld uitgeeft.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38a
  - number: 38a.2
    text: |-
      Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38a
  - number: 38a.3
    text: |-
      De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel38a
  - number: '39'
    text: |-
      De artikelen 8, eerste lid, tweede lid, onder a, b, e, f, g, h en j, derde lid, 9, eerste lid, onder a, b, c,
      f, g en h, tweede lid, vijfde lid, 10, eerste lid, 11, 13, 14 en 15 zijn van overeenkomstige toepassing op het
      bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling als bedoeld
      in artikel 38, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel39
  - number: '40'
    text: |-
      Niettegenstaande het bepaalde in artikel 9 en onverminderd het bepaalde in artikel 15 weigert de Bank een door een
      onderneming of instelling gevraagde vergunning als bedoeld in artikel 38, eerste lid of trekt zij een verleende
      vergunning als bedoeld in artikel 38, eerste lid in, indien de onderneming of instelling in de Staat waar zij is
      gevestigd niet een voor de uitoefening van het bedrijf van kredietinstelling benodigde vergunning bezit, dan wel
      uit de overgelegde informatie blijkt dat deze onderneming of instelling, gelet op haar solvabiliteit, liquiditeit
      of haar organisatie en structuur, redelijkerwijs niet in staat is het bedrijf van kredietinstelling uit te oefenen
      of te controleren.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel40
  - number: '41.1'
    text: |-
      De [artikelen 20 tot en met 23][ref1] en [26][ref2] zijn van overeenkomstige toepassing op een
      bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref3], die een vergunning als bedoeld in
      [artikel 38, eerste lid][ref4], heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel38
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel41
