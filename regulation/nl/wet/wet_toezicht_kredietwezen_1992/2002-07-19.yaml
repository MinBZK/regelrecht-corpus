  - number: '76.6'
    text: |-
      De bestuurders van de kredietinstelling dan wel het bijkantoor wonen de verificatievergadering bij teneinde aldaar
      alle inlichtingen over de oorzaken van de in artikel 71, eerste of tweede lid, bedoelde toestand en de staat van de
      boedel te geven die hen door de rechter-commissaris worden gevraagd. De schuldeisers kunnen de rechter-commissaris
      verzoeken omtrent bepaalde door hen op te geven punten inlichtingen aan de bestuurders te vragen. De vragen aan
      de bestuurders gesteld en de door hen gegeven antwoorden worden in het proces-verbaal opgetekend. In afwijking
      van het bepaalde in [artikel 121, vierde lid, van de Faillissementswet][ref1] levert het proces-verbaal van de
      verificatievergadering ten aanzien van de verbintenissen van de kredietinstelling dan wel het bijkantoor welke
      ingevolge artikel 75 worden overgedragen slechts kracht van gewijsde op voor zover de desbetreffende bedingen niet
      worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel121
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '121'
  - number: '76.7'
    text: |-
      Na de verificatie van de schuldvorderingen maken de bewindvoerders een uitdelingslijst op. Zij onderwerpen die
      aan de goedkeuring van de rechter-commissaris. De lijst houdt in een staat van ontvangsten en uitgaven, daaronder
      begrepen het loon van de bewindvoerders, de namen van de schuldeisers, en voorts het geverifieerde bedrag van
      ieders vordering en de daarop te ontvangen uitkering. De [artikelen 180][ref1], tweede lid, [181][ref2] en
      [182, eerste lid, van de Faillissementswet][ref3] zijn van overeenkomstige toepassing. Onverminderd het bepaalde in
      het tiende lid is artikel 233 van die wet eveneens van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel181
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel182
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '181'
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '182'
  - number: '76.8'
    text: |-
      Bij het opmaken van de uitdelingslijst wordt met betrekking tot de vorderingen die zijn betwist of waarvan de
      voorrang is betwist of die voorwaardelijk zijn toegelaten een bedrag aan liquide middelen afgezonderd tot ten
      minste het beloop van het totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen zullen
      kunnen worden uitgekeerd, dan wel wordt deze uitkering op andere wijze zeker gesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
  - number: '76.9'
    text: |-
      De door de rechter-commissaris goedgekeurde uitdelingslijst wordt door de bewindvoerders ter griffie van
      de rechtbank nedergelegd om aldaar gedurende veertien dagen kosteloos voor de schuldeisers ter inzage te
      liggen. De bewindvoerders doen van de nederlegging mededeling in een of meer door de rechter-commissaris aan
      te wijzen nieuwsbladen. Voorts geven de bewindvoerders aan ieder der erkende en voorwaardelijk toegelaten
      schuldeisers schriftelijk van de nederlegging kennis, onder vermelding van het voor hem uitgetrokken bedrag.
      De [artikelen 184][ref1] tot en met [186][ref2], [187][ref3], eerste, tweede en derde lid, [189][ref4] en
      [191 van de Faillissementswet][ref5] zijn van overeenkomstige toepassing, met dien verstande dat hetgeen daarin is
      bepaald met betrekking tot de curator van toepassing is op de bewindvoerders en dat in afwijking van de in artikel
      184 bedoelde termijn geldt de in de eerste zin van dit lid genoemde termijn. Indien ten gevolge van het krachtens
      [artikel 184][ref6] dan wel [artikel 186 van de Faillissementswet][ref7] gedane verzet een verificatiegeschil
      ontstaat, wordt ten aanzien van de vorderingen waarop dit verzet betrekking heeft, het achtste lid van dit artikel
      overeenkomstig toegepast, en kan vervolgens, nadat voor zoveel nodig tevens dienovereenkomstig wijziging van de
      overige in de ter inzage neergelegde lijst opgenomen uitkeringsbedragen heeft plaats gehad, met inachtneming van
      het overigens in dit artikel bepaalde, tot uitkering worden overgegaan. Indien het gedane verzet niet tot een
      verificatiegeschil leidt, kan met inachtneming van het bij de beschikking op het verzet bepaalde tot uitkering
      worden overgegaan zodra die beschikking in kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel186
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel187
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel189
      [ref5]: https://wetten.overheid.nl/BWBR0001860#Artikel191
      [ref6]: https://wetten.overheid.nl/BWBR0001860#Artikel184
      [ref7]: https://wetten.overheid.nl/BWBR0001860#Artikel186
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel76
    references:
