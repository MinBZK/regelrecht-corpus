  - number: '81.2'
    text: |-
      Het eerste lid is niet van toepassing indien de bedoelde dochtermaatschappijen onderscheidenlijk gekwalificeerde
      deelnemingen tevens dochtermaatschappijen onderscheidenlijk gekwalificeerde deelnemingen zijn van in één
      van de Lid-Staten gevestigde ondernemingen of instellingen die een voor het uitoefenen van het bedrijf van
      kredietinstelling benodigde vergunning hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
  - number: '81.3'
    text: |-
      De Bank doet onverwijld mededeling aan Onze minister van iedere aanvraag van een vergunning als bedoeld in het
      eerste lid, onder a, van iedere aanvraag van een verklaring van geen bezwaar als bedoeld in het eerste lid, onder
      b, en van iedere inkennisstelling als bedoeld in het eerste lid, onder c.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
  - number: '81.4'
    text: |-
      Onze minister kan bepalen dat, in afwijking van het bepaalde in [artikel 9][ref1], de Bank voor bijkantoren in
      Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstellingen gevraagde vergunningen
      als bedoeld in [artikel 38, eerste lid][ref2] weigert dan wel slechts verleent onder het stellen van beperkingen en
      het verbinden van voorschriften met inachtneming van door Onze minister te stellen richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel38
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '1'
  - number: '81.5'
    text: |-
      Indien een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling
      als bedoeld in het tweede lid die een vergunning als bedoeld in [artikel 38, eerste lid][ref1] onder het stellen
      van beperkingen dan wel het verbinden van voorschriften heeft verkregen, een handeling verricht zonder dat alle bij
      die vergunning gestelde beperkingen respectievelijk alle aan de vergunning verbonden voorschriften zijn nagekomen,
      is die kredietinstelling gehouden binnen een door de Bank te stellen termijn de verrichte handeling ongedaan te
      maken of aan de niet nagekomen beperkingen alsnog te voldoen respectievelijk de niet nagekomen voorschriften alsnog
      te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel38
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '1'
  - number: '81.6'
    text: |-
      Een vergunning als bedoeld in [artikel 38, eerste lid][ref1] kan door de Bank worden ingetrokken indien
      niet binnen de door de Bank gestelde termijn aan het bepaalde in het vijfde lid is voldaan. Alsdan is
      [artikel 15 tweede tot en met zesde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel15
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '15'
        hoofdstuk: II
        paragraaf: '5'
        afdeling: '1'
  - number: '82.1'
    text: |-
      Het is een ieder verboden bedrijfsmatig al dan niet op termijn opvorderbare gelden van het publiek aan te trekken,
      ter beschikking te verkrijgen of ter beschikking te hebben dan wel in enigerlei vorm te bemiddelen ter zake van
      het bedrijfsmatig van het publiek aantrekken of ter beschikking verkrijgen van al dan niet op termijn opvorderbare
      gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: '82.2'
    text: 'De in het eerste lid genoemde verboden zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: 82.2.a
    text: |-
      ondernemingen en instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], welke ingevolge
      [artikel 52, tweede lid, onder ][ref2], zijn geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
        hoofdstuk: VII
  - number: 82.2.b
    text: de Bank;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: 82.2.c
    text: de Lid-Staten, alsmede de regionale of locale overheden van de Lid-Staten; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: 82.2.d
    text: internationaal publiekrechtelijke instellingen waarin of waaraan één of meer Lid-Staten deelnemen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: '82.3'
    text: |-
      Onze minister kan vrijstelling of, op verzoek en de Bank gehoord, ontheffing verlenen van de in het eerste lid
      genoemde verboden, indien de belangen die deze wet beoogt te beschermen, naar zijn oordeel anderszins voldoende
      worden beschermd. Een ontheffing kan worden geweigerd, indien naar het oordeel van Onze Minister de betrouwbaarheid
      van één of meer personen die het beleid van de betrokken onderneming of instelling bepalen of mede bepalen, of die
      het beleid bepalen of mede bepalen van de groep waartoe de betrokken onderneming of instelling behoort en tevens
      uit dien hoofde het beleid van de onderneming of instelling mede bepalen, niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: '82.4'
    text: Aan een vrijstelling of ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel82
  - number: '83.1'
    text: |-
      Aan ondernemingen en instellingen, die niet ingevolge artikel 52, tweede lid, zijn geregistreerd, is het verboden
      het woord "bank" of vertalingen of vormen daarvan te bezigen in hun naam of bij de uitoefening van hun bedrijf,
      tenzij zulks in zodanige samenhang geschiedt, dat daaruit duidelijk blijkt, dat de desbetreffende onderneming of
      instelling niet werkzaam is op financiële markten.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: '83.2'
    text: 'Het in het eerste lid genoemde verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: 83.2.a
    text: de Bank;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: 83.2.b
    text: de representatieve organisaties; en
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: 83.2.c
    text: |-
      iedere in een andere Lid-Staat gevestigde onderneming of instelling die van de toezichthoudende autoriteit van
      die andere Lid-Staat een voor de uitoefening van het bedrijf van kredietinstelling benodigde vergunning heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: '83.3'
    text: |-
      Onze minister kan vrijstelling of, op verzoek en de Bank gehoord, ontheffing verlenen van het in het eerste lid
      genoemde verbod.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: '83.4'
    text: Aan een vrijstelling of ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel83
  - number: '84.1'
    text: |-
      De Bank pleegt overleg met de betrokken representatieve organisaties over de invoering van een
      regeling omtrent een garantie voor nader te bepalen schuldvorderingen van natuurlijke personen,
      rechtspersonen en vennootschappen tot een nader te bepalen maximum op kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die ingevolge artikel 52, tweede lid, onder *a*, zijn
      geregistreerd, tegen het risico, dat een zodanige onderneming of instelling haar verplichtingen met betrekking tot
      die schuldvorderingen niet nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '84.2'
    text: |-
      Bij koninklijk besluit kan, indien het overleg bedoeld in het eerste lid leidt tot overeenstemming tussen de
      Bank en alle betrokken representatieve organisaties, worden bepaald, dat de kredietinstellingen bedoeld in het
      eerste lid alsmede de instellingen die gebruik maken van de vrijstelling bedoeld in artikel 12 van [richtlijn
      94/19/EG](31994L0019) van het Europees Parlement en de Raad van de Europese Unie van 30 mei 1994 inzake de
      depositogarantiestelsels (*PbEG* L 135) verplicht zijn aan de uitvoering van die regeling mede te werken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
  - number: '84.3'
    text: |-
      Onze Minister kan besluiten dat een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die ingevolge artikel 52, tweede lid, onder *b*,
      is geregistreerd, verplicht is aan de uitvoering van de regeling bedoeld in het eerste lid mee te werken,
      indien de Bank van oordeel is dat voor de schuldvorderingen op die kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] geen garantieregeling van toepassing is, welke gelijkwaardig
      is aan de dekking bedoeld in artikel 6, eerste lid, van [richtlijn 94/19/EG](31994L0019) van het Europees Parlement
      en de Raad van de Europese Unie van 30 mei 1994 inzake de depositogarantiestelsels (*PbEG* L 135).


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '84.4'
    text: |-
      Bij koninklijk besluit kan, indien het overleg bedoeld in het eerste lid niet binnen een door Onze minister te
      bepalen termijn leidt tot overeenstemming, dan wel indien de regeling, waaromtrent overeenstemming is bereikt, niet
      de instemming van Onze minister heeft, een regeling als bedoeld in het eerste lid worden ingevoerd, nadat de Bank,
      de Bankraad en de betrokken representatieve organisaties in de gelegenheid zijn gesteld hun gevoelen omtrent de
      inhoud van de in te voeren regeling kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
  - number: '84.5'
    text: |-
      Binnen twee maanden, nadat een regeling krachtens het vierde lid is ingevoerd, wordt door Ons een voorstel aan de
      Staten-Generaal gedaan om deze regeling bij de wet te bekrachtigen. Indien het voorstel door een van beide Kamers
      der Staten-Generaal wordt verworpen, wordt deze regeling terstond ingetrokken. Van de intrekking wordt mededeling
      gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
  - number: '84.6'
    text: |-
      Het bepaalde in het eerste, tweede en derde, onderscheidenlijk vierde en vijfde lid is mede van toepassing op
      wijziging en intrekking van een garantieregeling, tot stand gekomen met inachtneming van die bepalingen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel84
  - number: '85'
    text: |-
      Bij koninklijk besluit kunnen, nadat de Bank daarover advies heeft uitgebracht, aan kredietinstellingen als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] die ingevolge artikel 52, tweede lid, onder *a* of *b*,
      zijn geregistreerd voorschriften worden gegeven omtrent de rente en de overige voorwaarden die zij met betrekking
      tot de direct opvraagbare tegoeden van natuurlijke personen, verenigingen en stichtingen in acht moeten nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 85a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot aan het publiek te
      verstrekken informatie door kredietinstellingen en financiële instellingen die zijn geregistreerd ingevolge artikel
      52, tweede lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.2
    text: |-
      Onze minister kan, op aanvraag, bepalen dat een kredietinstelling of een financiële instelling niet behoeft te
      voldoen aan alle in het eerste lid bedoelde regels indien de kredietinstelling of de financiële instelling aantoont
      dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt te bereiken
      anderszins voldoende zijn bereikt. Onze minister kan een besluit als bedoeld in de vorige volzin wijzigen of
      intrekken indien naar zijn oordeel de omstandigheden waaronder het besluit is genomen zodanig zijn gewijzigd dat de
      doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.3
    text: |-
      Onze minister is belast met het toezicht op de naleving van het bij of krachtens dit artikel bepaalde. De
      [artikelen 53][ref1] en [54][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel54
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '53'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '54'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '1'
  - number: 85a.4
    text: |-
      Taken en bevoegdheden die Onze minister op grond van dit artikel heeft, kunnen bij algemene maatregel van bestuur
      worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van dit artikel jegens
      Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.5
    text: |-
      Een overdracht als bedoeld in het vierde lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      vereisten voldoet:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.5.a
    text: hij dient in staat te zijn de in het vierde lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.5.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het vierde lid bedoelde taken en bevoegdheden zo veel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85a.6
    text: Aan de overdracht, bedoeld in het vierde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85a
  - number: 85b.1
    text: |-
      Het door een kredietinstelling uitgegeven elektronisch geld vertegenwoordigt een waarde die ten minste gelijk is
      aan de waarde van de voor de uitgifte ontvangen gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.2
    text: |-
      Een kredietinstelling wisselt, op verzoek van een houder van elektronisch geld het elektronisch geld om door middel
      van uitbetaling van het elektronische geld in munten of bankbiljetten of door storting op een rekening, waarbij
      uitsluitend de voor de omwisseling noodzakelijke kosten mogen worden berekend.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de omwisseling,
      bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.4
    text: |-
      Onze minister is belast met het toezicht op de naleving van het bij of krachtens dit artikel bepaalde. De
      [artikelen 53][ref1] en [54][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel54
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '53'
        hoofdstuk: VIII
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '54'
        hoofdstuk: VIII
        paragraaf: '2'
        afdeling: '1'
  - number: 85b.5
    text: |-
      Taken en bevoegdheden die Onze minister op grond van dit artikel heeft, kunnen bij algemene maatregel van bestuur
      worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van dit artikel jegens
      Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.6
    text: |-
      Een overdracht als bedoeld in het vijfde lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      vereisten voldoet:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.6.a
    text: hij dient in staat te zijn de in het vijfde lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.6.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het vijfde lid bedoelde taken en bevoegdheden zo veel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: 85b.7
    text: Aan de overdracht, bedoeld in het vijfde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel85b
  - number: '86'
    text: |-
      Kosten, die zijn verbonden aan de uitvoering van deze wet en de krachtens deze wet genomen besluiten, kunnen
      overeenkomstig door Onze minister goed te keuren regelen op de betrokken ondernemingen en instellingen worden
      verhaald.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel86
  - number: '87.1'
    text: |-
      De Bank doet periodiek in de *Staatscourant* mededeling van de voornaamste gegevens, voorkomende in de stukken en
      staten, bedoeld in de artikelen 30, 37, 44 en 55.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel87
  - number: '87.2'
    text: |-
      Zonder schriftelijke toestemming van de hierbij betrokkenen worden gegevens met betrekking tot afzonderlijke
      ondernemingen en instellingen niet gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel87
  - number: '88'
    text: |-
      De Bank brengt jaarlijks aan Onze minister verslag uit over de uitvoering van deze wet en van de krachtens deze
      wet genomen besluiten. Dit verslag wordt door de zorg van de Bank gepubliceerd, behoudens het gedeelte van het
      verslag, handelende over de uitvoering van de artikelen 10, vijfde lid, 11, vijfde lid, 14, 28, 29, 30, derde lid,
      30e, 35 en 42, met dien verstande dat zonder schriftelijke toestemming van de bij het te publiceren gedeelte van
      het verslag betrokkenen gegevens met betrekking tot afzonderlijke ondernemingen en instellingen niet gepubliceerd
      worden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel88
  - number: 89a.1
    text: |-
      Indien onze minister de Bank advies vraagt over een vrijstelling als bedoeld in de [artikelen 6, tweede lid][ref1],
      [31, vierde lid][ref2], [32, derde lid][ref3], [38, derde lid][ref4], [38a, tweede lid][ref5], 82, derde lid,
      of [83, derde lid][ref6], is de Bank verplicht het advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel38a
      [ref6]: https://wetten.overheid.nl/BWBR0005792#Artikel83
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel89a
    references:
