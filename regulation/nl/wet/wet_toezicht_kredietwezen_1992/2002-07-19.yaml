      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 90b.3
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90b.4
    text: |-
      Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het opleggen van een last onder
      dwangsom worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze wet
      jegens Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90b.5
    text: |-
      Een overdracht als bedoeld in het vierde lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      vereisten voldoet:
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90b.5.a
    text: hij dient in staat te zijn de in het vierde lid bedoelde bevoegdheid naar behoren uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90b.5.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke uitoefening van de in het vierde lid bedoelde bevoegdheid is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90b.6
    text: Aan de overdracht, bedoeld in het vierde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005792/2002-07-19#Artikel90b
  - number: 90c.1
    text: |-
      Onze Minister of de Bank kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften,
      gesteld bij of krachtens de [artikelen 4, eerste lid][ref1], [6, eerste, tweede en derde lid][ref2],
      [7][ref3], [7a, eerste en tweede lid][ref4], [10, eerste tot en met vijfde lid][ref5],
      [11, eerste en vijfde lid][ref6], [12, tweede lid][ref7], [13][ref8], [14, eerste, tweede en zesde lid][ref9],
      [15, vijfde lid][ref10], [16, eerste, tweede, vijfde, zesde en achtste lid][ref11],
      [16a, eerste, tweede, vijfde, en zesde lid][ref12], [16b, eerste lid][ref13], [17, eerste en tweede lid][ref14],
      [19, eerste lid, derde lid, tweede volzin, en vijfde lid, tweede volzin][ref15],
      [23, eerste, derde, vierde en vijfde lid][ref16], [24, eerste, derde, vierde en zesde lid][ref17],
      [25, eerste lid][ref18], [25a, tweede en derde lid][ref19], [26, zevende lid][ref20],
      [27, eerste en tweede lid][ref21], [28, tweede lid en vijfde lid, onder a][ref22],
      [29, tweede lid][ref23], [30, eerste lid, tweede lid, eerste volzin, vierde en vijfde lid][ref24],
      [30d, eerste, tweede en vierde lid][ref25], [31, eerste lid, onder a, tweede, vierde en vijfde lid][ref26],
      [32, eerste lid, onder a, onder b, tweede, derde en vierde lid][ref27], [32a, onder a en onder b][ref28],
      [36][ref29], [37][ref30], [38, eerste, tweede, derde en vierde lid][ref31],
      [38a, eerste, tweede en derde lid][ref32], [43][ref33], [44][ref34], [48, eerste, tweede en vijfde lid][ref35],
      [49, eerste en tweede lid][ref36], [50, eerste en tweede lid][ref37], [51][ref38],
      [55, eerste, tweede, derde, vijfde, zesde en zevende lid][ref39], [56, eerste, tweede en derde lid][ref40],
      [56a][ref41], [58, eerste en tweede lid][ref42], [62, eerste, tweede en derde lid][ref43], [63][ref44],
