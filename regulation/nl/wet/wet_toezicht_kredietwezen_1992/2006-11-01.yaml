  - number: 16c
    text: |-
      1 Een kredietinstelling meldt een wijziging van de gegevens, bedoeld in
      [artikel 16b, tweede lid, onderdelen b tot en met e][ref1], ten minste een maand tevoren schriftelijk aan de Bank.

      2 De kredietinstelling doet de in het eerste lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Bank zulks verlangt.

      3 Indien de kredietinstelling voldoet aan het krachtens [artikel 20][ref2] onderscheidenlijk [30b][ref3] gestelde
      en de Bank geen bedenkingen heeft tegen de wijziging maakt zij dit aan de kredietinstelling bekend.

      4 Indien het voornemen bestaat om de bedrijfsuitoefening vanuit het bijkantoor te staken, stelt de
      kredietinstelling de Bank daarvan ten minste een maand tevoren schriftelijk in kennis. Zodra de kredietinstelling
      haar voornemen uitvoert, meldt zij dit onverwijld aan de Bank.


