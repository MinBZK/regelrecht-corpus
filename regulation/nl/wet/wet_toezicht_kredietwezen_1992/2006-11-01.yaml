  - number: 90d
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete
      voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, kan het bedrag van de boete
      lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in een bepaald geval op grond van
      bijzondere omstandigheden onevenredig hoog is.

      5 In afwijking van het eerste lid worden de bedragen van de boetes terzake van overtreding van de afzonderlijke
      regels, gesteld bij de algemene maatregelen van bestuur, bedoeld in de [artikelen 22a][ref1], [30ca][ref2],
      [57][ref3], [85a][ref4] en [85b][ref5], bepaald op de wijze als voorzien in die algemene maatregel van bestuur. Het
      eerste tot en met vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel30ca
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel85a
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel85b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90d
