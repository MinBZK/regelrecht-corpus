    text: |-
      1 [Artikel 52 van de Faillissementswet][ref1] is van overeenkomstige toepassing.

      2 In afwijking van het eerste lid, bevrijdt voldoening na de bekendmaking van de vaststelling van de noodregeling
      van een kredietinstelling die geen natuurlijk persoon is tegenover de boedel indien degene die haar deed, bewijst
      dat hij niet bekend was met de vaststelling van de noodregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel52
