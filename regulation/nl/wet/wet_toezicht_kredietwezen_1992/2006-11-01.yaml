      1 Iedere natuurlijke persoon of rechtspersoon stelt de Bank vooraf in kennis van een zodanige wijziging van diens
      gekwalificeerde deelneming in een kredietinstelling waardoor de omvang van deze deelneming:

      a. boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor de kredietinstelling een
      dochtermaatschappij wordt; of

      b. onder de 10, 20, 33, 50, 95 of 100 procent daalt dan wel waardoor de kredietinstelling ophoudt een
      dochtermaatschappij te zijn.

      2 Een kredietinstelling stelt, voor zover haar bekend, de Bank in de maand juli van elk jaar in kennis van
      de identiteit van iedere natuurlijke persoon of rechtspersoon die een gekwalificeerde deelneming in deze
      kredietinstelling houdt. Tevens stelt de kredietinstelling, zodra zulks haar bekend wordt, de Bank in kennis van
      iedere verwerving, afstoting of wijziging van een gekwalificeerde deelneming in deze instelling waardoor de omvang
      van deze deelneming:

      a. boven de 20, 33, 50 of 95 procent stijgt, 100 procent wordt dan wel waardoor de kredietinstelling een
      dochtermaatschappij wordt; of

      b. onder de 10, 20, 33, 50, 95 of 100 procent daalt dan wel waardoor de kredietinstelling ophoudt een
      dochtermaatschappij te zijn.

      3 De Bank stelt Onze minister eens per jaar in kennis van de gegevens waarover zij ingevolge het eerste en het
      tweede lid beschikt.

      4 De Bank stelt de Stichting Autoriteit Financiële Markten onverwijld in kennis van een gekwalificeerde
      deelneming onder vermelding van de omvang van die deelneming waarvoor een verklaring van geen
      bezwaar als bedoeld in [artikel 23][ref1] is verleend en waarop de vrijstelling, bedoeld in
      [artikel 16, tweede lid, van de Wet toezicht effectenverkeer 1995][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel16
