  - number: '28'
    text: |-
      1 Indien de Bank constateert dat een kredietinstelling de regels, bedoeld in de [artikelen 20][ref1], [21][ref2],
      [22][ref3] of [22a][ref4], niet naleeft, of indien de Bank andere tekenen ontwaart van een ontwikkeling die
      naar haar oordeel de solvabiliteit of de liquiditeit van de kredietinstelling, de integere bedrijfsvoering van
      de kredietinstelling dan wel de belangen van de crediteuren of toekomstige crediteuren van de kredietinstelling
      anderszins in gevaar brengt of zou kunnen brengen, vestigt zij daarop de aandacht van die kredietinstelling.

      2 Zo nodig doet de Bank de mededeling, bedoeld in het eerste lid, vergezeld gaan van een aanwijzing om ten aanzien
      van met name aan te geven punten een bepaalde gedragslijn te volgen.

      3 Indien de Bank niet binnen twee weken na bekendmaking van de aanwijzing een haar bevredigend antwoord van de
      kredietinstelling heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is
      gegeven, kan de Bank

      a. de kredietinstelling aanzeggen, dat vanaf een bepaald tijdstip alle of bepaalde organen van de kredietinstelling
      hun bevoegdheden slechts mogen uitoefenen na goedkeuring door een of meer door de Bank aangewezen personen en met
      inachtneming van de opdrachten van deze personen, welke aanzegging terstond van kracht wordt;

      b. de kredietinstelling aanzeggen, dat de Bank zal overgaan tot publicatie van de aanwijzing, bedoeld in het tweede
      lid, bij welke publicatie, wanneer de kredietinstelling zulks verlangt, tevens de correspondentie openbaar wordt
      gemaakt, die naar aanleiding van de aanwijzing tussen de Bank en de kredietinstelling is gevoerd;

      c. met de voorzitter van de representatieve organisatie van de groep kredietinstellingen, waartoe de
      kredietinstelling behoort, dienaangaande in overleg treden, wanneer de Bank zulks in het belang van crediteuren
      acht. De voorzitter kan zich bij dit overleg doen bijstaan door ten hoogste twee functionarissen van zijn
      organisatie, tenzij de Bank zulks niet wenselijk acht. De Bank doet de kredietinstelling mededeling van het
      overleg.

      4 Indien de Bank bij een kredietinstelling tekenen ontwaart van een ontwikkeling die naar haar oordeel onverwijld
      ingrijpen noodzakelijk maakt met het oog op de solvabiliteit of de liquiditeit van de kredietinstelling, met
      het oog op de integere bedrijfsvoering van de kredietinstelling, dan wel met het oog op andere belangen van de
      crediteuren of toekomstige crediteuren van de kredietinstelling, kan zij zonder toepassing van de eerste twee leden
      onmiddellijk uitvoering geven aan de onderdelen a en c van het derde lid.

      5 Met betrekking tot een aanzegging als bedoeld in het derde lid, onder *a*, is het volgende van toepassing:

      a. de organen van de kredietinstelling zijn verplicht de door de Bank aangewezen personen alle medewerking te
      verlenen;

      b. de Bank kan de betrokken organen van de kredietinstelling toestaan bepaalde handelingen zonder machtiging te
      verrichten;

      c. de door de Bank aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste twee jaren na
      bekendmaking van de aanzegging, bedoeld in het derde lid, onder *a*, behoudens de bevoegdheid van de Bank om deze
      termijn telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht;

      d. de Bank kan te allen tijde de door haar aangewezen personen door andere vervangen;

      e. voor schade ten gevolge van handelingen, welke zijn verricht in strijd met een aanzegging als bedoeld in het
      derde lid, onder *a*, zijn degenen, die deel uit maken van het orgaan van de kredietinstelling dat deze handelingen
      verrichtte, persoonlijk aansprakelijk tegenover de kredietinstelling; de kredietinstelling kan de ongeldigheid van
      deze handelingen inroepen, indien de wederpartij wist, dat de vereiste goedkeuring ontbrak of daarvan niet onkundig
      kon zijn;

      f. zodra de Bank van oordeel is dat de solvabiliteit of de liquiditeit van de kredietinstelling, de integere
      bedrijfsvoering van de kredietinstelling of andere belangen van de crediteuren of toekomstige crediteuren van de
      kredietinstelling niet langer gevaar lopen, trekt zij de aanwijzing, bedoeld in het tweede lid, onderscheidenlijk
      de aanzegging, bedoeld in het derde lid, onder a, in.

      6 Het besluit tot publicatie van een aanwijzing als bedoeld in het derde lid, onder *b*, wordt eerst van
      kracht, wanneer het onherroepelijk is geworden. Indien de kredietinstelling na de publicatie alsnog voldoet aan
      de aanwijzing dan wel indien de Bank de aanwijzing intrekt, zal de Bank hiervan op dezelfde wijze als bij de
      voorafgaande publicatie kennis geven.

      7 Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering met
      uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel22a
      [ref5]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
