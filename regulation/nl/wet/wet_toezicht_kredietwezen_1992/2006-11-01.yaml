  - number: 80a
    text: |-
      1 Een in een andere Lid-Staat van herkomst dan Nederland genomen beslissing tot vaststelling van een
      saneringsmaatregel wordt van rechtswege erkend.

      2 De beslissing heeft rechtsgevolgen binnen Nederland vanaf het tijdstip dat zij rechtsgevolgen heeft in de Lid-
      Staat van herkomst.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80a
  - number: 80b
    text: |-
      De beslissing tot vaststelling van een saneringsmaatregel, de saneringsmaatregel zelf en de rechtsgevolgen van
      de saneringsmaatregel worden beheerst door het recht van de Lid-Staat waar de saneringsmaatregel is vastgesteld,
      tenzij de wet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80b
  - number: 80c
    text: |-
      1 De beslissing tot vaststelling van een saneringsmaatregel laat onverlet het goederenrechtelijke recht van
      een schuldeiser of een derde op een goed of goederen, zowel bepaalde goederen als gehelen met een wisselende
      samenstelling van onbepaalde goederen, die toebehoren aan de kredietinstelling en die zich op het tijdstip waarop
      de beslissing tot vaststelling van de saneringsmaatregel rechtsgevolgen heeft, bevinden op het grondgebied van een
      andere Lid-Staat dan de Lid-Staat van herkomst.

      2 Voor de toepassing van het eerste lid wordt onder goederenrechtelijk recht in ieder geval verstaan:

      a. het recht een goed te gelde te maken of te laten maken en te worden voldaan uit de opbrengst van of de inkomsten
      uit het goed, in het bijzonder op grond van een recht van pand of recht van hypotheek;

      b. het uitsluitende recht een vordering te innen, in het bijzonder op grond van een pandrecht op de vordering of op
      grond van een cessie tot zekerheid van de vordering;

      c. het recht om een goed van een ieder die het zonder recht houdt op te eisen, van dat goed afgifte te verlangen of
      van dat goed een ongestoord genot te verlangen;

      d. het goederenrechtelijke recht om van een goed de vruchten te trekken.

      3 Voor de toepassing van het eerste lid wordt met een goederenrechtelijk recht gelijkgesteld het in een openbaar
      register ingeschreven recht tot verkrijging van een goederenrechtelijk recht als bedoeld in het eerste lid dat aan
      derden kan worden tegengeworpen.

      4 Voor de toepassing van dit artikel is de Lid-Staat waar een goed zich bevindt:

      a. met betrekking tot registergoederen en rechten op registergoederen: de Lid-Staat onder het gezag waarvan het
      desbetreffende register wordt gehouden;

      b. met betrekking tot zaken, voor zover niet vallend onder onderdeel a: de Lid-Staat op het grondgebied waarvan de
      zaak zich bevindt;

      c. met betrekking tot schuldvorderingen: de Lid-Staat op het grondgebied waarvan de derde-schuldenaar is gevestigd.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80c
  - number: 80d
    text: |-
      1 Ingeval de kredietinstelling een zaak heeft gekocht, laat de beslissing tot vaststelling van een
      saneringsmaatregel onverlet de op een eigendomsvoorbehoud berustende rechten van de verkoper, indien de zaak
      waarop het eigendomsvoorbehoud betrekking heeft zich op het tijdstip waarop de beslissing tot vaststelling van de
      saneringsmaatregel rechtsgevolgen heeft, bevindt op het grondgebied van een andere Lid-Staat dan de Lid-Staat van
      herkomst.

      2 Ingeval de kredietinstelling een zaak heeft verkocht, is de beslissing tot vaststelling van een
      saneringsmaatregel geen grond voor ontbinding of beëindiging van de overeenkomst tot verkoop, en belet de
      saneringsmaatregel de koper niet de eigendom van de gekochte zaak te verkrijgen, indien de zaak zich op het
      tijdstip waarop de beslissing tot vaststelling van de saneringsmaatregel gevolgen heeft, bevindt op het grondgebied
      van een andere Lid-Staat dan de Lid-Staat van herkomst.

      3 [Artikel 80c, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80c
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80c
        hoofdstuk: X
        afdeling: '2'
  - number: 80e
    text: |-
      Indien degene die zowel schuldeiser als schuldenaar is van de kredietinstelling bevoegd is zijn schuld te
      verrekenen met de vordering op de kredietinstelling op grond van het recht dat van toepassing is op de vordering
      van de kredietinstelling, laat de beslissing tot vaststelling van de saneringsmaatregel de bedoelde bevoegdheid
      onverlet.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80e
  - number: 80f
    text: |-
      De [artikelen 80c tot en met 80e][ref1] staan er niet aan in de weg dat een vordering wordt ingesteld tot
      nietigheid, vernietiging of het niet kunnen worden tegengeworpen van een rechtshandeling wegens de benadeling van
      het geheel van schuldeisers welke van die rechtshandeling het gevolg is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80c
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80c
        hoofdstuk: X
        afdeling: '2'
  - number: 80g
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van een saneringsmaatregel voor arbeidsovereenkomsten en
      andere rechtsverhoudingen ter zake van het verrichten van arbeid uitsluitend beheerst door het recht van de Lid-
      Staat dat op die overeenkomst of rechtsverhouding van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80g
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80h
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van een saneringsmaatregel voor een overeenkomst die het
      recht geeft op het genot of de verkrijging van een onroerende zaak uitsluitend beheerst door het recht van Lid-
      Staat op het grondgebied waarvan de onroerende zaak is gelegen. Dit recht bepaalt of een zaak roerend dan wel
      onroerend is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80h
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80i
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van een saneringsmaatregel voor de rechten van de
      kredietinstelling op een registergoed beheerst door het recht van de Lid-Staat onder het gezag waarvan het register
      wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80i
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80j
    text: |-
      In afwijking van [artikel 80b][ref1] worden, onverminderd [artikel 80p][ref2], de gevolgen van een
      saneringsmaatregel voor de rechten en verplichtingen van deelnemers aan een gereglementeerde markt als bedoeld in
      artikel 1, onder 13, van [richtlijn nr. 93/22/EEG](31993L0022) van de Raad van de Europese Gemeenschappen van 10
      mei 1993 betreffende het verrichten van diensten op het gebied van beleggingen in effecten (PbEG L 141) uitsluitend
      beheerst door het recht dat op die markt van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel80p
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80j
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: 80p
        hoofdstuk: X
        afdeling: '2'
  - number: 80k
    text: |-
      In afwijking van [artikel 80b][ref1] wordt de rechtsgeldigheid van een rechtshandeling, onder bezwarende titel
      aangegaan door de kredietinstelling na het tijdstip tot vaststelling van een saneringsmaatregel, waarmee zij
      beschikt over een registergoed, financiële instrumenten of rechten op financiële instrumenten waarvan het
      bestaan of de overdracht inschrijving in een wettelijk voorgeschreven register of op een wettelijk voorgeschreven
      rekening veronderstelt, of die zijn geplaatst in een door het recht van een Lid-Staat beheerst gecentraliseerd
      effectendepot, beheerst door het recht van de Lid-Staat onder het gezag waarvan het register, de rekening of het
      depot wordt gehouden dan wel, indien het een onroerende zaak betreft, door het recht van de Lid-Staat waar de
      onroerende zaak is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80k
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80l
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van de saneringsmaatregel voor een aanhangige
      rechtsvordering betreffende een goed waarover de kredietinstelling het beheer en de beschikking heeft verloren,
      uitsluitend beheerst door het recht van de Lid-Staat waar het rechtsgeding aanhangig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80l
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80m
    text: |-
      [Artikel 80b][ref1] is niet van toepassing op regels betreffende de nietigheid, de vernietigbaarheid van
      voor het geheel van schuldeisers nadelige rechtshandelingen en evenmin op de regels die bepalen of dergelijke
      rechtshandelingen kunnen worden tegengeworpen, indien degene die voordeel heeft gehad bij die rechtshandeling
      bewijst dat:

      a. die rechtshandeling wordt beheerst door het recht van een andere Lid-Staat dan de Lid-Staat van herkomst; en

      b. dat recht in het gegeven geval niet voorziet in de mogelijkheid dat die rechtshandeling wordt aangetast
      onderscheidenlijk niet kan worden tegengeworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80m
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80n
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van een saneringsmaatregel voor een overeenkomst tot
      verrekening als bedoeld in [artikel 212a, onderdeel m, van de Faillissementswet][ref2] uitsluitend beheerst door
      het recht dat van toepassing is op die overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80n
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 212a
  - number: 80o
    text: |-
      In afwijking van [artikel 80b][ref1] worden, onverminderd [artikel 80p][ref2], de gevolgen van een
      saneringsmaatregel voor een overeenkomst waarbij de ene partij, de koper, zich verbindt tot een latere overdracht
      van een gelijke hoeveelheid activa van dezelfde soort aan de verkoper, uitsluitend beheerst door het recht van de
      Lid-Staat dat van toepassing is op die overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel80p
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80o
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: 80p
        hoofdstuk: X
        afdeling: '2'
  - number: 80p
    text: |-
      In afwijking van [artikel 80b][ref1] worden de gevolgen van een saneringsmaatregel voor het uitoefenen van rechten
      op financiële instrumenten waarvan het bestaan of de overdracht inschrijving in een register, op een rekening of
      in een in een Lid-Staat bijgehouden of gesitueerd gecentraliseerd effectendepot veronderstelt, uitsluitend beheerst
      door het recht van de Lid-Staat waar het register, de rekening of het gecentraliseerde effectendepot waar deze
      rechten zijn ingeschreven, wordt bijgehouden of is gesitueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel80b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80p
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 80b
        hoofdstuk: X
        afdeling: '2'
  - number: 80q
    text: |-
      1 Behoudens de bevoegdheid tot het aanwenden van een dwangmaatregel en de bevoegdheid tot het doen van een
      uitspraak in een geding of een geschil heeft de bewindvoerder uit een andere Lid-Staat van herkomst dan Nederland
      in Nederland de bevoegdheden die hij in de Lid-Staat van herkomst heeft. De wijze van uitoefenen van deze
      bevoegdheden in Nederland wordt beheerst door het Nederlandse recht.

      2 De bewindvoerders kunnen personen aanwijzen om hen te vertegenwoordigen of anderszins bij te staan.

      3 Indien personen zijn aangewezen om de bewindvoerder te vertegenwoordigen of anderszins bij te staan, kunnen
      zij de bevoegdheden die zij hebben op grond van het recht van die Lid-Staat uitoefenen op het grondgebied van
      Nederland.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80q
  - number: 80r
    text: |-
      1 Voor het bewijs van aanwijzing van de bewindvoerder uit een andere Lid-Staat dan Nederland volstaat een voor
      eensluidend gewaarmerkt afschrift van het aanwijzingsbesluit of van ieder ander door de bevoegde instanties van de
      Lid-Staat gegeven schriftelijke verklaring.

      2 De bewindvoerder uit een andere Lid-Staat dan Nederland toont op verlangen van een ieder tegenover wie hij zijn
      bevoegdheden wenst uit te oefenen een vertaling in de Nederlandse taal van het afschrift.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80r
  - number: 80s
    text: |-
      1 Op verzoek van een bewindvoerder uit een andere Lid-Staat dan Nederland worden de gegevens met betrekking tot
      een saneringsmaatregel, vastgesteld in een andere lid-staat dan Nederland, door de griffier van de rechtbank te 's-
      Gravenhage ingeschreven in het register, bedoeld in [artikel 19, eerste lid, van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel19
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel80s
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '19'
  - number: '81'
    text: |-
      1 Onze minister kan bepalen dat

      a. in afwijking van het bepaalde in de [artikelen 8][ref1] en [9][ref2], de Bank de behandeling van door
      dochtermaatschappijen van in een bepaalde Staat, die niet een Lid-Staat is, gevestigde ondernemingen of
      instellingen gevraagde vergunningen als bedoeld in [artikel 6][ref3] voor een bepaalde termijn opschort, met
      dienovereenkomstige opschorting van de termijn als bedoeld in [artikel 8, derde lid][ref4], dan wel dat de Bank
      slechts een door Onze minister te bepalen aantal door dochtermaatschappijen van in een bepaalde Staat, die niet een
      Lid-Staat is, gevestigde ondernemingen of instellingen gevraagde vergunningen als bedoeld in [artikel 6][ref5] zal
      verlenen; en

      b. in afwijking van het bepaalde in de [artikelen 24][ref6] en [26][ref7] de behandeling van door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen gevraagde verklaringen van geen bezwaar
      als bedoeld in [artikel 24, eerste lid][ref8], voor een bepaalde termijn worden opgeschort, met dienovereenkomstige
      opschorting van de termijn als bedoeld in [artikel 26, vierde lid][ref9], dan wel dat slechts een door Onze
      minister te bepalen aantal door in een bepaalde Staat, die niet een Lid-Staat is, gevestigde ondernemingen of
      instellingen gevraagde verklaringen van geen bezwaar als bedoeld in [artikel 24, eerste lid][ref10], zullen worden
      verleend; en

      c. in afwijking van het bepaalde in [artikel 30d][ref11] de beslissing van de Bank, nadat zij door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen in kennis is gesteld overeenkomstig
      [artikel 30d, eerste lid][ref12], voor een bepaalde termijn wordt opgeschort, met dienovereenkomstige opschorting
      van de termijn als bedoeld in [artikel 30d, derde lid][ref13], dan wel dat de Bank, nadat zij door in een bepaalde
      Staat, die niet een Lid-Staat is, gevestigde ondernemingen of instellingen in kennis is gesteld overeenkomstig
      [artikel 30d, eerste lid][ref14], slechts in een door Onze minister te bepalen aantal gevallen meedeelt dat geen
      bezwaar bestaat tegen het voornemen; en.

      d. in afwijking van het bepaalde in de [artikelen 31][ref15] onderscheidenlijk [32][ref16] dan wel [32a][ref17] het
      bepaalde in de [artikelen 38 tot en met 44][ref18] onderscheidenlijk [82][ref19] van toepassing is op in een Staat,
      niet zijnde een Staat die lid is van de Unie, die partij is bij de overeenkomst betreffende de Europese Economische
      Ruimte gevestigde ondernemingen of instellingen die een voor de uitoefening van het bedrijf van kredietinstelling
      benodigde vergunning verkrijgen en die dochtermaatschappij zijn van in een bepaalde Staat, die niet een Lid-Staat
      is, gevestigde ondernemingen of instellingen.

      2 Het eerste lid is niet van toepassing indien de bedoelde dochtermaatschappijen onderscheidenlijk gekwalificeerde
      deelnemingen tevens dochtermaatschappijen onderscheidenlijk gekwalificeerde deelnemingen zijn van in één
      van de Lid-Staten gevestigde ondernemingen of instellingen die een voor het uitoefenen van het bedrijf van
      kredietinstelling benodigde vergunning hebben verkregen.

      3 De Bank doet onverwijld mededeling aan Onze minister van iedere aanvraag van een vergunning als bedoeld in het
      eerste lid, onder a, van iedere aanvraag van een verklaring van geen bezwaar als bedoeld in het eerste lid, onder
      b, en van iedere inkennisstelling als bedoeld in het eerste lid, onder c.

      4 Onze minister kan bepalen dat, in afwijking van het bepaalde in [artikel 9][ref20], de Bank voor bijkantoren in
      Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstellingen gevraagde vergunningen
      als bedoeld in [artikel 38, eerste lid][ref21] weigert dan wel slechts verleent onder het stellen van beperkingen
      en het verbinden van voorschriften met inachtneming van door Onze minister te stellen richtlijnen.

      5 Indien een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling
      als bedoeld in het tweede lid die een vergunning als bedoeld in [artikel 38, eerste lid][ref22] onder het stellen
      van beperkingen dan wel het verbinden van voorschriften heeft verkregen, een handeling verricht zonder dat alle bij
      die vergunning gestelde beperkingen respectievelijk alle aan de vergunning verbonden voorschriften zijn nagekomen,
      is die kredietinstelling gehouden binnen een door de Bank te stellen termijn de verrichte handeling ongedaan te
      maken of aan de niet nagekomen beperkingen alsnog te voldoen respectievelijk de niet nagekomen voorschriften alsnog
      te vervullen.

      6 Een vergunning als bedoeld in [artikel 38, eerste lid][ref23] kan door de Bank worden ingetrokken indien
      niet binnen de door de Bank gestelde termijn aan het bepaalde in het vijfde lid is voldaan. Alsdan is
      [artikel 15 tweede tot en met zesde lid][ref24], van overeenkomstige toepassing.


