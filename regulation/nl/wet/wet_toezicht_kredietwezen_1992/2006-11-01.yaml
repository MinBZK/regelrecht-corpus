  - number: 76c
    text: |-
      Indien een machtiging als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel b of c][ref1], is gegeven,
      stellen de bewindvoerders alle bekende schuldeisers regelmatig op passende wijze in kennis van in ieder geval het
      verloop van de noodregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel75
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel76c
