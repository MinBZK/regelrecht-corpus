  - number: 65b
    text: |-
      In afwijking van [artikel 64][ref1] kunnen in een noodregeling als bedoeld in [hoofdstuk X][ref2] gegevens
      of inlichtingen die geen betrekking hebben op derden die betrokken zijn bij pogingen de kredietinstelling
      in staat te stellen haar bedrijf voort te zetten, door de bewindvoerder worden opgenomen in de
      verslagen, bedoeld in [artikel 72, zesde lid][ref3], indien een machtiging is verleend als bedoeld in
      [artikel 75, eerste lid, aanhef en onderdeel b][ref4], of, indien een machtiging is verleend als bedoeld in
      [artikel 75, eerste lid en aanhef, onderdeel c][ref5], activa van de kredietinstelling te gelde zijn gemaakt met
      het oogmerk de opbrengst te verdelen onder de schuldeisers, aandeelhouders of leden.


