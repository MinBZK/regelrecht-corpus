      1 Op aanvraag van een financiële instelling die dochtermaatschappij is van één of meer kredietinstellingen die
      een vergunning bedoeld in [artikel 6][ref1] heeft of hebben verkregen, en die haar bedrijf door middel van een
      bijkantoor dan wel het verrichten van diensten in een andere Lid-Staat uitoefent dan wel voornemens is uit te
      oefenen, kan de Bank aan die financiële instelling een verklaring van ondertoezichtstelling verlenen en daarbij het
      bij of krachtens de [artikelen 11][ref2], [20][ref3], [22][ref4], [22a][ref5], [24][ref6], [26][ref7] en [27][ref8]
      bepaalde van overeenkomstige toepassing verklaren op die financiële instelling.

      2 De aanvraag bevat, ten behoeve van de beslissing omtrent het verlenen van een verklaring van
      ondertoezichtstelling als bedoeld in [artikel 46][ref9], gegevens omtrent:

      a. de identiteit van de kredietinstelling of kredietinstellingen waarvan de financiële instelling
      dochtermaatschappij is;

      b. een programma van werkzaamheden welke de financiële instelling verricht dan wel voornemens is te verrichten;

      c. de voorziene administratieve organisatie - met inbegrip van de financiële administratie en de interne controle
      en

      d. de voorgenomen maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      met uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref10].

      3 De Bank beslist binnen dertien weken na ontvangst van de aanvraag.


