  - number: '85'
    text: |-
      Bij koninklijk besluit kunnen, nadat de Bank daarover advies heeft uitgebracht, aan kredietinstellingen als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] die ingevolge artikel 52, tweede lid, onder *a* of *b*,
      zijn geregistreerd voorschriften worden gegeven omtrent de rente en de overige voorwaarden die zij met betrekking
      tot de direct opvraagbare tegoeden van natuurlijke personen, verenigingen en stichtingen in acht moeten nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
