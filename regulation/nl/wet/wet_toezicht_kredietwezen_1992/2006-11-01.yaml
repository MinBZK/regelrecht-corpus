  - number: '69'
    text: |-
      1 Een kredietinstelling die in Nederland is gevestigd dan wel een bijkantoor in Nederland van een in een Staat,
      die niet een Lid-Staat is, gevestigde kredietinstelling, welke tot algehele of gedeeltelijke liquidatie van haar
      bedrijf dan wel tot ontbinding heeft besloten, is verplicht de Bank te raadplegen en aan de Bank mededeling te
      doen van de wijze waarop de liquidatie onderscheidenlijk de ontbinding zal plaatsvinden ten minste dertien weken,
      voordat aan het besluit uitvoering wordt gegeven; de Bank kan deze termijn verkorten. De Bank wordt aangemerkt
      als een belanghebbende in de zin van [artikel 23, tweede lid, van Boek 2 van het Burgerlijk Wetboek][ref1].
      Ingeval een kredietinstelling als bedoeld in de eerste volzin besluit tot ontbinding en geen rechtspersoonlijkheid
      bezit, is het bepaalde in de [artikelen 19, vierde lid][ref2], [23, eerste en tweede lid][ref3], [23][ref4],
      en [23c, van Boek 2 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing. Voor de toepassing van
      de [artikelen 23, eerste lid][ref6], en [23][ref7], gelden de beherende vennoten als bestuurders en geldt de
      vennootschapsovereenkomst als statuten.

      2 Het eerste lid is niet van toepassing op:

      a. een kredietinstelling, die op grond van [artikel 6, tweede lid][ref8], is vrijgesteld onderscheidenlijk op grond
      van [artikel 6, derde lid][ref9], is ontheven van het verbod van [artikel 6, eerste lid][ref10];

      b. een kredietinstelling, die op grond van [artikel 31, vierde lid][ref11], is vrijgesteld onderscheidenlijk op
      grond van [artikel 31, vijfde lid][ref12], is ontheven van het verbod van [artikel 31, eerste lid][ref13];

      c. een kredietinstelling die op grond van [artikel 38, derde lid][ref14], is vrijgesteld onderscheidenlijk op grond
      van [artikel 38, vierde lid][ref15], is ontheven van het verbod van [artikel 38, eerste lid][ref16].


