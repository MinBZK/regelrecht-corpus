    text: |-
      Bij of krachtens de in de artikelen [22a][ref1] en [30ca][ref2] bedoelde algemene maatregel van bestuur kan
      worden voorgeschreven dat kredietinstellingen bepaalde gegevens ter zake van de integere bedrijfsvoering
      aan de Bank melden. Onder integere bedrijfsvoering wordt in dit artikel verstaan de bedrijfsvoering
      met uitzondering van het deel dat wordt geregeld door de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref3].


