  - number: 90e
    text: |-
      Degene jegens wie door Onze Minister, dan wel door de Bank voor zover zij bevoegd is een boete op te leggen, een
      handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan verbinden dat hem wegens een overtreding
      een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan
      in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90e
  - number: 90f
    text: |-
      1 Indien Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, voornemens is een boete
      op te leggen, geeft hij, dan wel de Bank, de betrokkene daarvan kennis onder vermelding van de gronden waarop het
      voornemen berust.

      2 In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister, dan wel de Bank
      voor zover zij bevoegd is een boete op te leggen, de betrokkene in de gelegenheid om naar keuze schriftelijk of
      mondeling zijn zienswijze naar voren te brengen voordat de boete wordt opgelegd, tenzij het een overtreding betreft
      die in de bijlage, bedoeld in artikel 90d, is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: 90g
    text: |-
      1 Onze Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, legt de boete op bij
      beschikking.

      2 De beschikking vermeldt in ieder geval:

      a. het feit terzake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;

      b. het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en

      c. de termijn, bedoeld in artikel 90i, eerste lid, waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90g
  - number: 90h
    text: |-
      1 De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.

      2 In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van artikel 90f, tweede lid, is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90h
  - number: 90i
    text: |-
      1 De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.

      2 De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 90f, tweede lid][ref1], is aangewezen.

      3 Indien de boete niet tijdig is betaald, stuurt Onze Minister, dan wel de Bank indien zij de boete heeft opgelegd,
      schriftelijk een aanmaning om binnen twee weken de boete, verhoogd met de kosten van de aanmaning, alsnog te
      betalen. De aanmaning bevat de aanzegging, dat de boete, voor zover deze niet binnen de gestelde termijn wordt
      betaald, overeenkomstig het vierde lid zal worden ingevorderd.

      4 Bij gebreke van tijdige betaling kan Onze Minister, dan wel de Bank indien zij de boete heeft opgelegd, de boete,
      verhoogd met de kosten van de aanmaning en van de invordering, bij dwangbevel invorderen.

      5 Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale
      titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].

      6 Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      staat, dan wel de Bank indien zij de boete heeft opgelegd.

      7 Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.

      8 Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel90f
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90i
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: 90f
        hoofdstuk: XIII_B
      - id: ref2
        bwb_id: BWBR0001827
  - number: 90j
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].

      2 Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in artikel 90c vervalt, indien Onze
      Minister, dan wel de Bank voor zover zij bevoegd is een boete op te leggen, ter zake van die overtreding reeds een
      boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 90k
    text: |-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.

      2 De termijn, bedoeld in het eerste lid, wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90k
  - number: 90l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90l
  - number: 90m
    text: |-
      1 Met het oog op de belangen van crediteuren, kunnen Onze Minister en de Bank, onverminderd
      [artikel 64, eerste en tweede lid][ref1], het feit terzake waarvan de last onder dwangsom of de bestuurlijke boete
      is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de woonplaats van degene aan wie de last
      onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.

      3 Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het ter openbare kennis brengen
      worden overgedragen aan een of meer rechtspersonen. Het [vijfde en zesde lid van artikel 90b][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel90b
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90m
