  - number: '116'
    text: |-
      Een ontheffing die is verleend op grond van artikel 43 van de Wet toezicht kredietwezen aan een onderneming of
      instelling die niet ingevolge artikel 52, tweede lid, is geregistreerd, wordt geacht te zijn verleend op grond van
      artikel 83.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel116
  - number: '117'
    text: |-
      Het koninklijk besluit van 10 april 1986 (*Stb.* 189) tot verbindend verklaring van de herziene collectieve
      garantieregeling op grond van artikel 44 van de Wet toezicht kredietwezen geldt als het koninklijk besluit als
      bedoeld in artikel 84, tweede lid. De verwijzingen in deze herziene collectieve garantieregeling naar bepalingen in
      de Wet toezicht kredietwezen worden gelezen als verwijzingen naar de overeenkomstige bepalingen in deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel117
  - number: '120'
    text: |-
      Indien het bij koninklijke boodschap van 27 juni 1991 ingediende wetsvoorstel houdende bepalingen voor de
      jaarrekening van banken, nadat het tot wet is verheven, in werking treedt, wordt, indien artikel VI, eerste lid,
      van die wet wordt toegepast, het totale bedrag van de onderwaardering alsmede dat van de terugnemingen gemeld aan
      de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel120
  - number: '122'
    text: De wet van 13 april 1978, *Stb.* 255, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel122
  - number: '123'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel123
  - number: '124'
    text: 'Deze wet kan worden aangehaald als: Wet toezicht kredietwezen 1992.'
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel124
