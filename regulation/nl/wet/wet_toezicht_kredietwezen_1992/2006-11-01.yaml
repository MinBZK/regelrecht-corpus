  - number: '2'
    text: |-
      1 De Bank oefent toezicht uit:

      a.

      b. in het belang van hun solvabiliteit op de in Nederland gevestigde kredietinstellingen en op de bijkantoren in
      Nederland van in een Staat, die niet een Lid-Staat is, gevestigde kredietinstellingen;

      c. in het belang van hun liquiditeit op de in Nederland gevestigde kredietinstellingen en op
      de bijkantoren in Nederland van niet in Nederland gevestigde kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1]; en

      d. in het belang van hun solvabiliteit op de in Nederland gevestigde financiële instellingen die een verklaring van
      ondertoezichtstelling als bedoeld in artikel 45 hebben verkregen.

      2 De Bank werkt bij de uitoefening van toezicht op in één van de Lid-Staten gevestigde kredietinstellingen samen
      met de betrokken toezichthoudende autoriteiten van de andere Lid-Staten. De Bank pleegt daartoe in voorkomende
      gevallen overleg met deze toezichthoudende autoriteiten van de andere Lid-Staten.

      3 De Bank kan voor zover noodzakelijk ten behoeve van de uitoefening van toezicht op een bijkantoor in Nederland
      van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling de betrokken toezichthoudende
      autoriteit raadplegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
