  - number: 90n
    text: |-
      1 De Bank kan, in afwijking van [artikel 64][ref1], teneinde de naleving van deze wet te bevorderen ter openbare
      kennis brengen:

        - haar weigering om een aangevraagde vergunning, ontheffing of verklaring van geen bezwaar te verlenen, wanneer
      deze weigering niet meer in beroep kan worden getroffen en de aanvrager handelt als was hem de vergunning,
      ontheffing of verklaring van geen bezwaar verleend;
        - het feit dat een onderneming of instelling waarop naar haar oordeel het verbod, bedoeld in [artikel 6][ref2] of
      [artikel 38][ref3] van toepassing is, niet over een vergunning beschikt;
        - het feit dat een in een andere Lid-Staat gevestigde onderneming of instelling in strijd met [artikel 31][ref4]
      door middel van een bijkantoor in Nederland het bedrijf van kredietinstelling uitoefent;
        - het feit dat een in een andere Lid-Staat gevestigde onderneming of instelling die het bedrijf van
      kredietinstelling uitoefent in strijd met [artikel 32][ref5] onderscheidenlijk [artikel 32a][ref6] door middel van
      het verrichten van diensten in Nederland al dan niet op termijn opvorderbare gelden van het publiek ter beschikking
      verkrijgt dan wel gelden ter beschikking krijgt in ruil waarvoor elektronisch geld wordt uitgegeven;
        - het feit dat een onderneming of instelling handelt in strijd met [artikel 38a][ref7];
        - het feit dat een onderneming of instelling handelt in strijd met [artikel 82][ref8];
        - het feit dat het woord «bank» of vertalingen of vormen daarvan worden gebezigd in strijd met [artikel 83][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel64
