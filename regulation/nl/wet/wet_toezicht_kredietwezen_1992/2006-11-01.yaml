  - number: '26'
    text: |-
      1 Op een aanvraag tot het verkrijgen van een verklaring van geen bezwaar als bedoeld in artikel 23, eerste lid, of
      artikel 24, eerste lid, wordt beslist door Onze minister, de Bank gehoord, dan wel in door Onze minister bepaalde
      gevallen vanwege Onze minister door de Bank.

      2 Indien een verklaring van geen bezwaar wordt verleend:

      a. kan de aanvrager tevens toestemming worden verleend tot het vergroten van zijn gekwalificeerde deelneming,
      waarbij als bovengrens 20, 33, 50 of 100 procent kan gelden;

      b. kan deze, voor zover het een verklaring van geen bezwaar als bedoeld in [artikel 23, eerste lid][ref1], betreft,
      betrekking hebben op:

      1°. door de aanvrager via een dochtermaatschappij verworven en nog te verwerven middellijke deelnemingen;

      2°. door de aanvrager verworven dan wel nog te verwerven middellijke deelnemingen, niet zijnde deelnemingen als
      bedoeld onder 1°, voor zover deze deelnemingen buiten de invloedssfeer van de aanvrager zijn verworven dan wel
      worden verworven;

      c. voor een deelneming in een kredietinstelling, kan op verzoek van de aanvrager worden bepaald dat de
      verleende verklaring van geen bezwaar betrekking geldt voor alle groepsmaatschappijen gezamenlijk, onverminderd
      [artikel 23][ref2].

      3 De aanvraag wordt ingediend bij de Bank. De Bank zendt de aanvraag, vergezeld van haar advies, aan Onze minister
      behoudens in de gevallen waarin zij vanwege Onze minister beslist.

      4 Op de aanvraag wordt binnen dertien weken beslist.

      5 Van de verleende verklaring van geen bezwaar als bedoeld in artikel 24, eerste lid, wordt door de zorg van de
      Bank aan de betrokken kredietinstelling mededeling gedaan.

      6 Van de afgifte van een verklaring van geen bezwaar wordt door Onze minister dan wel vanwege Onze minister door
      de Bank mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze minister of de Bank van oordeel is, dat
      publicatie zou leiden of zou kunnen leiden tot onevenredige bevoordeling of benadeling van belanghebbenden bij de
      beschikking of derden.

      7 Een verklaring van geen bezwaar kan door Onze minister, de Bank gehoord, dan wel in door Onze minister bepaalde
      gevallen vanwege Onze minister door de Bank worden gewijzigd of ingetrokken:

      a. op verzoek van de houder;

      b. indien aan de houder een verklaring van geen bezwaar wordt verleend die betrekking heeft op handelingen waarvoor
      de in te trekken verklaring van geen bezwaar was verleend;

      c. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van geen bezwaar zodanig
      onjuist of onvolledig blijken dat op de aanvraag een andere beslissing zou zijn genomen als bij de beoordeling van
      de aanvraag de juiste omstandigheden volledig bekend waren geweest;

      d. indien niet alsnog binnen de termijn als bedoeld in artikel 23, vijfde lid, respectievelijk artikel 24, zesde
      lid, aan alle bij de verklaring van geen bezwaar gestelde voorschriften wordt voldaan.

      8 Indien zich met betrekking tot een verleende verklaring van geen bezwaar omstandigheden voordoen of feiten bekend
      worden welke

      a. naar het oordeel van de Bank tot strijd met een gezond bankbeleid respectievelijk tot een invloed op de
      betrokken kredietinstelling die in strijd is met een gezond bankbeleid leiden of zouden kunnen leiden;

      b. naar het oordeel van de Bank ertoe leiden of zouden kunnen leiden dat de betrokken kredietinstelling zou gaan
      behoren tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in zodanige mate ondoorzichtig is
      dat deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de kredietinstelling;

      c. naar het oordeel van de Bank ertoe leiden of zouden kunnen leiden dat de naleving van de in [artikel 22a][ref3]
      bedoelde regels onvoldoende is gewaarborgd; of

      d. naar het oordeel van de Bank of Onze minister tot een ongewenste ontwikkeling van de financiële sector leiden of
      zouden kunnen leiden;

      en derhalve zo zij voor het tijdstip waarop de verklaring van geen bezwaar werd verleend zich hadden voorgedaan,
      of bekend waren geweest, een verklaring van geen bezwaar zou zijn geweigerd dan wel de verklaring van geen bezwaar
      onder het stellen van beperkingen of het verbinden van voorschriften zou zijn verleend, kan Onze minister, de Bank
      gehoord, dan wel in door Onze minister bepaalde gevallen vanwege Onze minister de Bank aan de verklaring van geen
      bezwaar nadere beperkingen stellen en nadere voorschriften verbinden of de verklaring van geen bezwaar intrekken.

      9 Van de wijziging of de intrekking van een verklaring van geen bezwaar als bedoeld in artikel 24, eerste lid,
      wordt door de zorg van de Bank aan de betrokken kredietinstelling mededeling gedaan.

      10 Indien de omvang van een deelneming waarvoor een verklaring van geen bezwaar is afgegeven onder de 10 procent
      daalt, vervalt de afgegeven verklaring van geen bezwaar van rechtswege.

      11 Van de wijziging of de intrekking van een verklaring van geen bezwaar wordt door Onze minister dan wel vanwege
      Onze minister door de Bank mededeling gedaan in de *Staatscourant*, behoudens voor zover Onze minister of de Bank
      van oordeel is, dat publicatie zou leiden of zou kunnen leiden tot onevenredige bevoordeling of benadeling van
      belanghebbenden bij de beschikking of derden.


