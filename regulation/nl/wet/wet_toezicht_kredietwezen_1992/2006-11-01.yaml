  - number: '80'
    text: |-
      Tegen beschikkingen van de rechtbank ingevolge de [artikelen 71, eerste of tweede lid][ref1], en
      [75, eerste en tweede lid][ref2], staat geen hoger beroep open. Beroep in cassatie tegen deze beschikkingen
      moet worden ingesteld binnen veertien dagen na de dag van uitspraak. De behandeling heeft in raadkamer plaats
      en geschiedt met de grootste spoed. Het arrest wordt op een openbare terechtzitting uitgesproken en de zakelijke
      inhoud ervan wordt door de bewindvoerders in de Staatscourant, het Publicatieblad van de Europese Unie, alsmede in
      twee Nederlandse dagbladen en twee landelijke dagbladen van iedere Lid-Staat van ontvangst bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel75
