  - number: '113'
    text: |-
      Een ontheffing die is verleend op grond van artikel 8 van de Wet toezicht kredietwezen wordt, voor zover deze
      ontheffing strekt, beschouwd als een ontheffing als bedoeld in artikel 12 tot een jaar na het tijdstip van
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel113
  - number: '114'
    text: |-
      1 Een verklaring van geen bezwaar die is verleend op grond van artikel 25 van de Wet toezicht kredietwezen en die
      op het tijdstip waarop deze wet in werking treedt niet is vervallen of ingetrokken, wordt geacht te zijn verleend
      op grond van artikel 26 voor de in de artikelen 23 en 24 genoemde handelingen die overeenkomen met de handelingen
      waarvoor de verklaring van geen bezwaar was verleend, met dien verstande dat voor zover die verklaring van geen
      bezwaar betrekking heeft op het verwerven of vergroten van een deelneming of het uitoefenen van zeggenschap die
      tevens wordt geacht te zijn verleend voor het houden van een gekwalificeerde deelneming.

      2 Ten aanzien van handelingen waarop het eerste lid niet van toepassing is en waarvoor ingevolge de artikelen 23
      of 24 een verklaring van geen bezwaar is vereist en waarop artikel 25 van de Wet toezicht kredietwezen niet van
      toepassing was, blijven de verboden als bedoeld in de artikelen 23 en 24 buiten toepassing tot de eerste dag van de
      negende kalendermaand na het tijdstip van inwerkingtreding van de artikelen 23 en 24.

      3 Ten aanzien van een gekwalificeerde deelneming die reeds werd gehouden op 1 januari 1979 en waarvoor ingevolge
      de artikelen 23 onderscheidenlijk 24 een verklaring van geen bezwaar vereist is, wordt de kredietinstelling als
      bedoeld in artikel 23, eerste lid, onderscheidenlijk de natuurlijke persoon of rechtspersoon als bedoeld in artikel
      24, eerste lid, geacht te beschikken over een verklaring van geen bezwaar als bedoeld in artikel 23, eerste lid,
      onderscheidenlijk artikel 24, eerste lid.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel114
  - number: '115'
    text: |-
      1 Een ontheffing die is verleend op grond van artikel 42 van de Wet toezicht kredietwezen wordt geacht te zijn
      verleend op grond van artikel 82.

      2 In afwijking van het eerste lid wordt de in een andere Lid-Staat gevestigde onderneming of instelling
      die, op het tijdstip waarop deze wet in werking treedt, het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] uitoefent en al dan niet op termijn opvorderbare gelden
      ter beschikking verkrijgt door middel van het verrichten van diensten in Nederland en die daarvoor een ontheffing
      als bedoeld in artikel 42 van de Wet toezicht kredietwezen heeft verkregen en die van de toezichthoudende
      autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van kredietinstelling als bedoeld
      in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2] benodigde vergunning heeft verkregen, geacht te hebben
      voldaan aan artikel 32, eerste lid, onder *b*.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel115
