  - number: 90u
    text: |-
      1 De bevoegdheid om op grond van [artikel 90n][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel90n
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90u
