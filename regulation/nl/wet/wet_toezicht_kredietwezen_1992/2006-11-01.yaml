  - number: 14a
    text: |-
      Indien een accountant naar het oordeel van de Bank niet of niet meer de nodige waarborgen biedt dat deze de
      toevertrouwde taak met betrekking tot de kredietinstelling naar behoren zal vervullen, kan de Bank bepalen
      dat hij niet bevoegd is de in deze wet bedoelde verklaringen omtrent de getrouwheid met betrekking tot die
      kredietinstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel14a
  - number: '15'
    text: |-
      1 De Bank kan een vergunning intrekken, indien:

      a. de kredietinstelling daarom verzoekt;

      b. de onderneming of instelling, aan welke de vergunning is verleend, opgehouden heeft kredietinstelling te zijn;

      c. de kredietinstelling niet voldoet aan het bij of krachtens de [artikelen 7a][ref1], [10][ref2], [11][ref3] of
      [30][ref4] bepaalde;

      d. zich bij de kredietinstelling een omstandigheid als bedoeld in
      [artikel 9, eerste lid, onder b, c, d, e of f, derde, vierde of vijfde lid][ref5], voordoet;

      e. de verklaring als bedoeld in [artikel 30, tweede lid][ref6], een verklaring is die een andere inhoud heeft dan
      dat de jaarrekening als bedoeld in [artikel 30, eerste lid][ref7], een getrouw beeld geeft van de grootte en de
      samenstelling van het vermogen van de kredietinstelling en van het resultaat over het desbetreffende boekjaar;

      f. de kredietinstelling niet voldoet aan het bij of krachtens de [artikelen 20][ref8], [21][ref9], [22][ref10] of
      [22a][ref11] dan wel de [artikelen 30b][ref12], [30c][ref13] of [30ca][ref14] bepaalde;

      g. de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning dan wel zijn verkregen in het
      kader van [artikel 2, tweede lid][ref15], zodanig onjuist of onvolledig blijken dat op het verzoek om verlening
      van een vergunning een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;

      h. de kredietinstelling, bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref16], niet voldoet aan het
      bepaalde in de regeling bedoeld in [artikel 84, tweede tot en met vierde lid][ref17], of aan het bepaalde in de
      regeling bedoeld in [artikel 28a, tweede tot en met vierde lid, van de Wet toezicht effectenverkeer 1995][ref18];
      of

      i. indien de kredietinstelling dan wel het orgaan, aan wie de aanwijzing is gegeven of de aanzegging is gedaan,
      niet of niet genoegzaam uitvoering heeft gegeven aan een aanwijzing of een aanzegging op grond van deze wet gegeven
      onderscheidenlijk gedaan.

      2 De Bank beslist binnen dertien weken na de ontvangst van het verzoek als bedoeld in het eerste lid, onder *a*.

      3 Een beschikking tot intrekking van de vergunning op de gronden bedoeld in het eerste lid treedt eerst in werking
      wanneer zij onherroepelijk is geworden. Van de beschikking wordt mededeling gedaan in de *Staatscourant*, zodra zij
      onherroepelijk is geworden.

      4 Met ingang van de datum waarop een beschikking als bedoeld in het eerste lid onherroepelijk is geworden, is het
      verbod als bedoeld in artikel 82, eerste lid, op de onderneming of instelling van toepassing.

      5 De onderneming of instelling is vanaf de datum als bedoeld in het vierde lid gehouden alle lopende overeenkomsten
      betreffende bedrijfsmatig van het publiek verkregen gelden, die al dan niet op termijn opvorderbaar zijn, zo
      spoedig mogelijk op te zeggen en binnen een door de Bank te bepalen termijn af te wikkelen. De Bank is bevoegd deze
      termijn te verlengen.

      6 Onverminderd het bepaalde in het vierde en vijfde lid wordt de onderneming of instelling gedurende de
      afwikkelingstermijn voor de toepassing van deze wet gelijkgesteld met een kredietinstelling, die een vergunning als
      bedoeld in artikel 6 heeft verkregen.


