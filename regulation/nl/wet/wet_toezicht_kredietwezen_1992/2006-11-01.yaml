  - number: '35'
    text: |-
      1 Indien de Bank constateert, dat een bijkantoor in Nederland van een in een andere Lid-Staat
      gevestigde kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1],
      dat overeenkomstig [artikel 31][ref2] het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] uitoefent, de regels als bedoeld in [artikel 21][ref4] niet
      naleeft, of andere tekenen ontwaart van een ontwikkeling, die naar haar oordeel de liquiditeit van het bijkantoor
      in gevaar brengt of zou kunnen brengen, is [artikel 28, eerste en tweede lid][ref5], van overeenkomstige toepassing
      met betrekking tot de liquiditeit van het bijkantoor.

      2 Indien de Bank niet binnen twee weken na bekendmaking van de aanwijzing als bedoeld in
      [artikel 28, tweede lid][ref6], een haar bevredigend antwoord heeft ontvangen of indien naar haar oordeel niet of
      onvoldoende aan haar aanwijzing gevolg is gegeven, kan de Bank de toezichthoudende autoriteit van de Lid-Staat waar
      de kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref7] gevestigd is, daarvan in
      kennis stellen en die toezichthoudende autoriteit verzoeken te bewerkstelligen dat alsnog binnen een door de Bank
      te stellen termijn aan de aanwijzing gevolg wordt gegeven.

      3 Indien de Bank niet binnen de laatstbedoelde door haar gestelde termijn een haar bevredigend antwoord
      heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is gegeven,
      is, nadat de Bank de toezichthoudende autoriteit van die andere Lid-Staat daarvan in kennis heeft gesteld,
      [artikel 28, derde, vijfde en zesde lid][ref8], van overeenkomstige toepassing met betrekking tot de liquiditeit
      van het bijkantoor.

      4 Indien de Bank bij een bijkantoor in Nederland van een in een andere Lid-Staat gevestigde kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref9], dat overeenkomstig [artikel 31][ref10] het
      bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref11] uitoefent,
      tekenen ontwaart van een ontwikkeling die naar haar oordeel de liquiditeit van het bijkantoor in gevaar brengt en
      onverwijld ingrijpen noodzakelijk maakt, kan de Bank, niettegenstaande het bepaalde in het eerste tot en met derde
      lid, met overeenkomstige toepassing van [artikel 28, derde tot en met zesde lid][ref12], met betrekking tot het
      bijkantoor maatregelen treffen die zij onontbeerlijk acht voor de bescherming van de belangen van de crediteuren
      van het bijkantoor.

      5 De Bank kan, met overeenkomstige toepassing van [artikel 28, derde tot en met zevende lid][ref13],
      met betrekking tot het bijkantoor tevens maatregelen treffen, ingeval zij daartoe een verzoek heeft
      gekregen van de toezichthoudende autoriteit van de Lid-Staat waar de kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref14] gevestigd is.

      6 De Bank doet van de maatregelen als bedoeld in het vierde en vijfde lid onverwijld mededeling aan de
      toezichthoudende autoriteit van de andere Lid-Staat en aan de Commissie van de Europese Gemeenschappen.


