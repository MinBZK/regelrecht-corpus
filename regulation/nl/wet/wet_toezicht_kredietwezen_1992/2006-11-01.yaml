  - number: '65'
    text: |-
      1 Onze Minister onderscheidenlijk de Bank is, in afwijking van artikel 64, eerste en tweede lid, bevoegd om
      gegevens of inlichtingen verkregen bij de vervulling van de hem onderscheidenlijk haar ingevolge deze wet
      opgedragen taak, te verstrekken aan Nederlandse of buitenlandse overheidsinstanties dan wel aan Nederlandse of
      buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, tenzij:

      a. het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;

      b. het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële
      markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;

      c. de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare
      orde;

      d. de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;

      e. de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen
      die deze wet beoogt te beschermen; of

      f. onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.

      2 Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn,
      verstrekt Onze Minister onderscheidenlijk de Bank deze niet aan een Nederlandse of buitenlandse instantie als
      bedoeld in het eerste lid, tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen
      uitdrukkelijk heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft
      ingestemd met het gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.

      3 Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die de gegevens of inlichtingen op
      grond van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel
      dan waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:

      a. voor zover het beoogde gebruik niet in strijd is met het eerste of tweede lid; dan wel

      b. voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede

      c. pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel65
  - number: 65a
    text: |-
      1 Onze minister onderscheidenlijk de Bank is, in afwijking van [artikel 64, eerste en tweede lid][ref1], bevoegd om
      gegevens of inlichtingen die geen betrekking hebben op derden die betrokken zijn bij pogingen de kredietinstelling
      in staat te stellen zijn bedrijf voort te zetten verkregen bij de vervulling van de hem onderscheidenlijk haar
      ingevolge deze wet opgedragen taak, te verstrekken aan een rechter-commissaris voor zover die is belast met
      het toezicht uit hoofde van [artikel 76d][ref2] in een noodregeling als bedoeld in [hoofdstuk X][ref3], indien
      een machtiging is verleend als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel a][ref4], of, indien
      een machtiging is verleend als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel c][ref5], zo lang de
      bewindvoerder nog niet activa te gelde heeft gemaakt met het oogmerk deze te verdelen onder de schuldeisers,
      aandeelhouders of leden.

      2 Onze minister onderscheidenlijk de Bank verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:

      a. indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;

      b. indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan
      wel van Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht
      op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze
      instanties niet instemmen met het verstrekken van de gegevens of inlichtingen.

      3 Artikel 64, eerste tot en met vierde lid, is van overeenkomstige toepassing met betrekking tot de op grond van
      het eerste lid verstrekte gegevens.


