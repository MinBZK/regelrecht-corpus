      het geheel of gedeeltelijk niet voldoen aan de regels, bedoeld in [artikel 21][ref9].

      3 Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref10], die ingevolge
