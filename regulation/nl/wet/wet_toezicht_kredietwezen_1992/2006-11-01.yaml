  - number: '71'
    text: |-
      1 Ingeval de solvabiliteit of de liquiditeit van een kredietinstelling die een vergunning als bedoeld in
      [artikel 6][ref1] heeft verkregen dan wel van een bijkantoor in Nederland van een in een Staat, die niet een Lid-
      Staat is, gevestigde kredietinstelling die een vergunning als bedoeld in [artikel 38, eerste lid][ref2], heeft
      verkregen, tekenen van een gevaarlijke ontwikkeling vertoont en redelijkerwijs in die ontwikkeling geen verbetering
      te voorzien is, kan de rechtbank, binnen wier rechtsgebied de kredietinstelling dan wel het bijkantoor is
      gevestigd, op verzoek van de Bank verklaren, dat de kredietinstelling verkeert in een toestand welke in het belang
      van de gezamenlijke schuldeisers bijzondere voorziening behoeft.

      2 Ingeval de solvabiliteit of de liquiditeit van een kredietinstelling waarop het verbod van [artikel 6][ref3]
      van toepassing is, een kredietinstelling die in een andere Lid-Staat is gevestigd met bijkantoor in Nederland
      en die niet voldoet aan het bepaalde in [artikel 31, eerste lid, onder a][ref4], dan wel een kredietinstelling
      die is gevestigd in een Staat die niet een Lid-Staat is met bijkantoor in Nederland en waarop het verbod van
      [artikel 38, eerste lid][ref5], van toepassing is, naar het oordeel van de Bank zodanig is dat te voorzien is
      dat de kredietinstelling haar verplichtingen ter zake van de door haar verkregen gelden niet of slechts ten dele
      kan nakomen, kan de rechtbank, binnen wier rechtsgebied de kredietinstelling dan wel het bijkantoor is gevestigd,
      op verzoek van de Bank verklaren dat de kredietinstelling verkeert in een toestand, welke in het belang van de
      gezamenlijke schuldeisers bijzondere voorziening behoeft.

      3 De Bank zendt een afschrift van het verzoekschrift aan de betrokken kredietinstelling en, in voorkomend geval,
      het bijkantoor en geeft kennis van de inhoud van het verzoekschrift aan:

      a. indien het een in Nederland gevestigde kredietinstelling betreft, de toezichthoudende autoriteiten van de Lid-
      Staten van ontvangst;

      b. indien het een buiten de Unie gevestigde kredietinstelling betreft, de toezichthoudende autoriteiten van de
      andere Lid-Staten waarheen zij diensten verricht vanuit een bijkantoor in Nederland.

      4 De rechtbank behandelt het verzoek met de meeste spoed.

      5 De rechtbank is bevoegd inzage te nemen of te doen nemen door deskundigen, daartoe door haar aangewezen, van
      zakelijke gegevens en bescheiden van de betrokken kredietinstelling dan wel bijkantoor. De [artikelen 53][ref6] en
      [62, eerste tot en met derde lid][ref7], zijn daarbij van overeenkomstige toepassing.

      6 De rechtbank geeft geen beschikking dan nadat de kredietinstelling dan wel het bijkantoor en de Bank zijn
      gehoord, althans behoorlijk opgeroepen.

      7 Indien het verzoek wordt toegewezen, bevat de beschikking van de rechtbank de benoeming van een van haar leden
      of van de leden van een andere rechtbank tot rechter-commissaris en de benoeming van een of meer bewindvoerders. De
      Bank kan voor de benoeming van de bewindvoerder of bewindvoerders voordrachten doen.

      8 Indien het verzoek wordt toegewezen, wordt de beschikking op een openbare terechtzitting uitgesproken en wordt
      een uittreksel ervan onverwijld door de bewindvoerders bekendgemaakt in de Staatscourant, het Publicatieblad
      van de Europese Unie, alsmede in twee Nederlandse dagbladen en twee landelijke dagbladen van iedere Lid-Staat
      van ontvangst. Het uittreksel vermeldt naam en woonplaats van de kredietinstelling en, indien aanwezig, het
      bijkantoor in Nederland van een buiten de Unie gevestigde kredietinstelling, en de woonplaats of het kantoor van
      de bewindvoerders alsmede de datum van de beschikking. In de bekendmaking in het Publicatieblad van de Europese
      Unie en de twee landelijke dagbladen van iedere Lid-Staat wordt daarenboven vermeld dat op de noodregeling,
      behoudens uitzonderingen, Nederlands recht van toepassing is, alsmede de uiterste datum waarop tegen de beslissing
      beroep in cassatie bij de Hoge Raad kan worden ingesteld met vermelding van het volledige adres van de Hoge Raad,
      het onderwerp van de beslissing en de rechtsgrondslag. De publicatie in de landelijke dagbladen geschiedt in de
      officiële taal of talen van de betrokken lidstaat. De beschikking is uitvoerbaar bij voorraad, terugwerkend tot aan
      het begin van de dag waarop zij is uitgesproken, niettegenstaande enige daartegen gerichte voorziening.

      9 In afwijking van de laatste volzin van het achtste lid, werkt de beschikking, bedoeld in het eerste of het tweede
      lid, niet terug ten aanzien van een door een kredietinstelling voor het tijdstip waarop de rechtbank de beschikking
      heeft gegeven:

      a. gegeven overboekingsopdracht, opdracht tot verrekening, of enige uit een dergelijke opdracht voortvloeiende
      betaling, levering, verrekening of andere rechtshandeling die benodigd is om de opdracht volledig uit te voeren in
      een systeem als bedoeld in [artikel 212a, onderdeel b van de Faillissementswet][ref8];

      b. gesloten financiëlezekerheidsovereenkomst als bedoeld in [artikel 51 van Boek 7 van het Burgerlijk Wetboek][ref9]
      of een overdracht of vestiging van een pandrecht op grond daarvan, of enige uit een dergelijke overeenkomst
      voortvloeiende betaling, levering, verrekening of andere rechtshandeling die benodigd is om die overeenkomst
      volledig uit te voeren.

      10 De laatste volzin van het achtste lid en [artikel 72, eerste lid][ref10], kunnen niet aan derden worden
      tegengeworpen ten aanzien van een door een kredietinstelling, na het tijdstip waarop de rechtbank de in het eerste
      of het tweede lid bedoelde beschikking heeft gegeven:

      a. gegeven overboekingsopdracht, opdracht tot verrekening, of enige uit een dergelijke opdracht voortvloeiende
      betaling, levering, verrekening of andere rechtshandeling die benodigd is om de opdracht volledig uit te voeren,
      indien de opdracht in een systeem als bedoeld in [artikel 212a, onder b, van de Faillissementswet][ref11], wordt
      uitgevoerd op de dag waarop de rechtbank de beschikking heeft gegeven en de centrale tegenpartij, de afwikkelende
      instantie of het verrekeningsinstituut, bedoeld in [artikel 212a van de Faillissementswet][ref12], kan aantonen dat
      deze ten tijde van de uitvoering van de opdracht niet op de hoogte was of op de hoogte behoorde te zijn van de door
      de rechtbank gegeven beschikking;

      b. gesloten financiëlezekerheidsovereenkomst als bedoeld in
      [artikel 51 van Boek 7 van het Burgerlijk Wetboek][ref13], of enige uit een dergelijke overeenkomst voortvloeiende
      betaling, levering, verrekening of andere rechtshandeling die benodigd is om die overeenkomst volledig uit te
      voeren, indien de zekerheidsnemer kan aantonen dat deze ten tijde van het sluiten van die overeenkomst niet op de
      hoogte was of op de hoogte behoorde te zijn van de door de rechtbank gegeven beschikking.

      11 De laatste volzin van het achtste lid en [artikel 72, eerste lid][ref14], kunnen niet aan derden worden
      tegengeworpen ten aanzien van een door een kredietinstelling, na het tijdstip waarop de rechtbank de in het eerste
      of het tweede lid, bedoelde beschikking heeft gegeven, gegeven overboekingsopdracht, opdracht tot verrekening
      of enige uit een dergelijke opdracht voortvloeiende betaling, levering, verrekening of andere rechtshandeling
      die benodigd is om de opdracht volledig uit te voeren, indien de opdracht in een systeem als bedoeld in
      [artikel 212a, onder b van de Faillissementswet][ref15], wordt uitgevoerd op de dag waarop de rechtbank de
      beschikking heeft gegeven en de centrale tegenpartij, de afwikkelende instantie of het verrekeningsinstituut,
      bedoeld in [artikel 212a van de Faillissementswet][ref16], kan aantonen dat deze ten tijde van de uitvoering van de
      opdracht niet op de hoogte was of op de hoogte behoorde te zijn van de door de rechtbank gegeven beschikking.

      12 Het negende en het elfde lid zijn van overeenkomstige toepassing op de toekenning en op de uitoefening van een
      bevoegdheid als bedoeld in het tiende lid.

      13 De griffier van de rechtbank stelt de Bank onverwijld in kennis van de inhoud van de beschikking alsmede van de
      mogelijke gevolgen daarvan in het desbetreffende geval. De Bank stelt daarna onverwijld de door Onze minister op
      grond van [artikel 212d van de Faillissementswet][ref17] aangewezen systemen, alsmede de bevoegde autoriteiten van
      de overige Lid-Staten in kennis van de beschikking, alsmede van de mogelijke gevolgen daarvan in het desbetreffende
      geval.

      14 De bewindvoerders geven van de beschikking, bedoeld in het zevende lid, onmiddellijk aan alle bekende
      schuldeisers schriftelijk kennis.

      15 Wanneer het verzoek aanhangig is tegelijk met een verzoek of vordering tot faillietverklaring - eigen aangifte
      daaronder begrepen -, wordt de behandeling van het verzoek of de vordering tot faillietverklaring geschorst, totdat
      op het eerstgenoemde verzoek is beschikt. Wordt een verklaring als bedoeld in het eerste of tweede lid, gegeven,
      dan vervalt het verzoek of de vordering tot faillietverklaring van rechtswege.

      16 Bij een beschikking als bedoeld in het eerste of tweede lid, bepaalt de rechtbank de duur op ten hoogste
      anderhalf jaar. Voor het verstrijken van de gestelde termijn kan de Bank eenmaal of meermalen verlenging van de
      geldigheidsduur voor ten hoogste anderhalf jaar verzoeken. Het verzoek wordt behandeld op dezelfde wijze als een
      verzoek tot uitspreken van de verklaring. Zolang bij afloop van de geldigheidsduur van de verklaring op een verzoek
      tot verlenging nog niet is beschikt, blijft de verklaring gehandhaafd. Indien het verzoek tot verlenging wordt
      toegewezen, is het zevende lid van toepassing.

      16 De bewindvoerders kunnen verzoeken dat de noodregel wordt ingeschreven in een openbaar register in een andere
      Lid-Staat.

      17 De kosten van inschrijving op de voet van het zestiende lid zijn boedelschuld.


