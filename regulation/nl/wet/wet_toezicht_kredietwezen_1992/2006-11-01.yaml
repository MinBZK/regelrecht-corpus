      Een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling die
      een vergunning als bedoeld in artikel 38, eerste lid, heeft verkregen, voert voor zijn bedrijf hier te lande een
      afzonderlijke boekhouding, die zodanig is dat de Bank de haar bij deze wet opgelegde taak kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel43
  - number: '44'
    text: |-
      Een bijkantoor in Nederland van een in een Staat, die niet een Lid-Staat is, gevestigde kredietinstelling die een
      vergunning als bedoeld in artikel 38, eerste lid heeft verkregen, is verplicht jaarlijks binnen zes maanden na
      afloop van het boekjaar van de kredietinstelling waarvan het onderdeel uitmaakt, de boekhoudbescheiden, aangewezen
      krachtens de [Handelsregisterwet 1996][ref1], bij de Bank in te dienen.


