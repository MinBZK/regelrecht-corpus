  - number: '23'
    text: |-
      1 Het is een kredietinstelling verboden, anders dan na verkregen verklaring van geen bezwaar:

      a. haar eigen vermogen door terugbetaling van kapitaal of uitkering van reserves te verminderen dan
      wel een uitkering te doen uit de post omvattende de dekking voor algemene bankrisico's als bedoeld in
      [artikel 424 van Boek 2 van het Burgerlijk Wetboek][ref1];

      b. een gekwalificeerde deelneming in een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2], een financiële instelling als
      bedoeld in [artikel 1, eerste lid, onderdeel c][ref3], een effecteninstelling als bedoeld in
      [artikel 1, onderdeel d, van de Wet toezicht effectenverkeer 1995][ref4], een verzekeraar als bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref5] dan wel in een verzekeraar
      als bedoeld in [artikel 1, eerste lid, onderdeel h, van de Wet toezicht verzekeringsbedrijf 1993][ref6],
      te verwerven of te vergroten, indien het balanstotaal van die kredietinstelling, financiële instelling,
      effecteninstelling of verzekeraar ten tijde van de verwerving onderscheidenlijk de vergroting, meer bedraagt dan
      één procent van het geconsolideerde balanstotaal van de kredietinstelling;

      c. een gekwalificeerde deelneming in een onderneming of instelling, met uitzondering van de ondernemingen of
      instellingen, bedoeld in onderdeel b, te verwerven dan wel te vergroten, indien het bedrag dat wordt betaald voor
      de verwerving van die deelneming onderscheidenlijk voor de vergroting van die deelneming tezamen met de bedragen
      die voor de verwerving en voor eerdere vergrotingen van die deelnemingen zijn betaald, meer bedraagt dan één
      procent van het geconsolideerde aanwezige eigen vermogen van de kredietinstelling;

      d. de activa en passiva van een andere onderneming of instelling geheel of voor een belangrijk deel over te nemen;

      e. een fusie aan te gaan met een andere onderneming of instelling;

      f. over te gaan tot financiële of vennootschappelijke reorganisatie;

      g. een beherend vennoot tot de kredietinstelling te doen toetreden.

      2 Een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid wordt verleend, tenzij:

      a. de Bank van oordeel is dat de handeling in strijd zou zijn of zou kunnen komen met de voor de kredietinstelling
      geldende regels als bedoeld in artikel 20, derde lid, onder *a*, (4) en (5), onder *b*, (4) en onder *c*, (4);

      b. de Bank van oordeel is dat de handeling anderszins in strijd zou zijn of zou kunnen komen met een gezond
      bankbeleid;

      c. de Bank van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling van de
      financiële sector;

      d. de Bank van oordeel is dat de naleving van de in [artikel 22a][ref7] bedoelde regels onvoldoende is gewaarborgd;
      of

      e. Onze minister van oordeel is dat de handeling zou leiden of zou kunnen leiden tot een ongewenste ontwikkeling
      van de financiële sector.

      3 Aan een verklaring van geen bezwaar voor een handeling als bedoeld in het eerste lid kunnen op grond van
      de overwegingen als bedoeld in het tweede lid, onder a, b, c en d, onderscheidenlijk het tweede lid, onder e,
      beperkingen worden gesteld en voorschriften worden verbonden.

      4 Ingeval een handeling als bedoeld in het eerste lid is verricht, zonder dat voor die handeling een verklaring
      van geen bezwaar is verkregen of de bij de verklaring van geen bezwaar gestelde beperkingen in acht zijn genomen,
      is de in overtreding zijnde kredietinstelling gehouden binnen een door Onze minister dan wel vanwege Onze minister
      door de Bank te bepalen termijn de verrichte handeling ongedaan te maken dan wel de beperkingen alsnog in acht te
      nemen. Deze verplichting vervalt op het tijdstip waarop en voor zover voor de desbetreffende handeling alsnog een
      verklaring van geen bezwaar wordt afgegeven dan wel de niet in acht genomen beperkingen worden ingetrokken.

      5 Ingeval aan de verklaring van geen bezwaar als bedoeld in het eerste lid verbonden voorschriften niet worden
      nagekomen, kan Onze minister dan wel vanwege Onze minister de Bank een termijn vaststellen waarbinnen de in
      overtreding zijnde kredietinstelling de niet nagekomen voorschriften alsnog moet vervullen.

      6 Het in het eerste lid vervatte verbod is niet van toepassing op een gekwalificeerde deelneming in een
      vennootschap wier activa op het moment dat de kredietinstelling de gekwalificeerde deelneming verwerft voor meer
      dan 90 procent uit liquide middelen bestaan. Bij of krachtens algemene maatregel van bestuur worden regels gesteld
      met betrekking tot liquide middelen.


