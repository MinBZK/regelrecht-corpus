  - number: 7a
    text: |-
      1 Het is een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die een
      vergunning als bedoeld in [artikel 6][ref2] heeft verkregen, niet toegestaan naast het ter beschikking krijgen van
      gelden in ruil waarvoor elektronisch geld wordt uitgegeven andere dan de volgende werkzaamheden te verrichten:

      a. het verrichten van met de uitgifte van elektronisch geld samenhangende diensten;

      b. het uitgeven en beheren van andere betaalmiddelen, met uitsluiting van de werkzaamheden bedoeld onder punt 2 van
      bijlage I van de Richtlijn;

      c. het vastleggen van informatie op een elektronische drager ten behoeve van andere ondernemingen of instellingen.

      2 Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref3], houdt uitsluitend een
      deelneming in een andere onderneming of instelling, indien die onderneming of instelling werkzaamheden verricht,
      die samenhangen met de bedrijfsvoering van de kredietinstelling.

      3 Onder een deelneming als bedoeld in het tweede lid wordt verstaan een rechtstreeks of middellijk belang van 20
      procent of meer van het geplaatste aandelenkapitaal van een onderneming, of het rechtstreeks of middellijk kunnen
      uitoefenen van 20 procent of meer van de stemrechten in een onderneming.


