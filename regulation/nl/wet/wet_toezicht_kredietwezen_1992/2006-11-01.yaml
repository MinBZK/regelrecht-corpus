        bwb_id: BWBR0005792
        artikel: '31'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '1'
  - number: '72'
    text: |-
      1 De bewindvoerders oefenen bij uitsluiting alle bevoegdheden van de organen van de kredietinstelling uit.

      2 De bewindvoerders waken voor de belangen der gezamenlijke schuldeisers.

      3 De organen van de kredietinstelling zijn verplicht alle door de bewindvoerders gevraagde medewerking te verlenen.

      4 Indien meer dan een bewindvoerder is benoemd, wordt voor de geldigheid van hun handelingen toestemming van
      de meerderheid of bij staking van stemmen een beslissing van de voorzieningenrechter van de rechtbank vereist.
      De bewindvoerder, aan wie bij de beschikking van de rechtbank, bedoeld in artikel 71, zevende lid, een bepaalde
      werkkring is aangewezen, is binnen de grenzen daarvan zelfstandig tot handelen bevoegd.

      5 De rechtbank kan te allen tijde een bewindvoerder, na hem en de Bank gehoord, althans behoorlijk opgeroepen te
      hebben, ontslaan en door een ander vervangen, of hem een of meer bewindvoerders toevoegen, een en ander op verzoek
      van hemzelf, de andere bewindvoerders, de Bank of een of meer schuldeisers dan wel ambtshalve.

      6 De bewindvoerders brengen tijdens de uitoefening van hun bevoegdheden telkens na verloop van drie maanden alsmede
      na beëindiging daarvan zo spoedig mogelijk verslag omtrent hun werkzaamheden uit aan de rechtbank.

      7 Het loon van de deskundigen, aangewezen ingevolge artikel 71, vijfde lid, alsook het loon en de verschotten van
      de bewindvoerders worden bepaald door de rechtbank en vormen een boedelschuld.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel72
  - number: '73'
    text: |-
      1 De rechtbank is bevoegd bij of na een verklaring als bedoeld in [artikel 71, eerste of tweede lid][ref1], op
      verzoek van de Bank dan wel op verzoek van de bewindvoerders of van een of meer schuldeisers of ambtshalve, de
      Bank gehoord, zodanige regelingen te treffen, als zij ter beveiliging van de belangen der schuldeisers van de
      kredietinstelling nodig oordeelt.

      2 Met betrekking tot beschikkingen van de rechter-commissaris, gegeven ter uitvoering van het
      toezicht op de overdracht onderscheidenlijk de liquidatie, zijn de [artikelen 66][ref2] en
      [67, eerste lid, van de Faillissementswet][ref3] van overeenkomstige toepassing. Het tweede lid van
      [artikel 67 van die wet][ref4] is van overeenkomstige toepassing voor zover de daarin opgesomde artikelen
      in [artikel 76][ref5] van overeenkomstige toepassing zijn verklaard. Hetgeen in de genoemde artikelen is
      bepaald met betrekking tot de curator onderscheidenlijk de gefailleerde is van toepassing op de bewindvoerders
      onderscheidenlijk de kredietinstelling.


