  - number: 112a
    text: |-
      1 Een onderneming of instelling die op het tijdstip dat dit artikel in werking treedt, in Nederland het bedrijf
      van kredietinstelling, bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, uitoefent, wordt geacht over een
      vergunning als bedoeld in artikel 6 te beschikken.

      2 Een in een andere Lid-Staat gevestigde onderneming of instelling die op het tijdstip waarop dit artikel in
      werking treedt, in Nederland door middel van een bijkantoor dan wel het verrichten van diensten het bedrijf van
      kredietinstelling als bedoeld in artikel 1, eerste lid, onderdeel a, onder 2°, uitoefent, wordt geacht te hebben
      voldaan aan artikel 31, eerste lid, onderscheidenlijk artikel 32a.

      3 Een onderneming of instelling als bedoeld in het eerste of tweede lid, meldt zich binnen één maand na het
      tijdstip waarop dit artikel in werking treedt bij de Bank en verstrekt binnen zes maanden na het tijdstip waarop
      dit artikel in werking treedt aan de Bank alle gegevens die de Bank nodig heeft om te beoordelen of de onderneming
      of instelling voldoet aan deze wet.

      4 Indien de Bank op grond van de gegevens waarvan zij ingevolge het derde lid kennis heeft genomen, van oordeel
      is dat de onderneming of instelling niet voldoet aan het bepaalde bij of krachtens deze wet zijn het eerste en het
      tweede lid niet langer van toepassing.

      5 Indien een onderneming of instelling als bedoeld in het eerste en het tweede lid, niet binnen zes maanden na het
      tijdstip waarop dit artikel in werking treedt, heeft voldaan aan het bepaalde in het derde lid zijn het eerste en
      het tweede lid niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel112a
  - number: 112b
    text: |-
      1 Indien een Lid-Staat [richtlijn nr. 2000/46/EG](32000L0046) van het Europees Parlement en de Raad van de Europese
      Unie van 18 september 2000 betreffende de toegang tot, de uitoefening van en het bedrijfseconomische toezicht op
      de werkzaamheden van instellingen voor elektronisch geld (PbEG L 275) en [richtlijn nr. 2000/28/EG](32000L0028)
      van het Europees Parlement en de Raad van de Europese Unie van 18 september 2000 tot wijziging van [richtlijn nr.
      2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende
      de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 275) niet of onvolledig
      heeft uitgevoerd, kan Onze minister, de Bank gehoord, bepalen dat voor in die Lid-Staat gevestigde ondernemingen of
      instellingen het tweede en derde lid gelden.

      2 Op een onderneming of instelling als bedoeld in het eerste lid, zijn, met betrekking tot het uitoefenen van het
      bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], door middel van
      een bijkantoor in Nederland, in plaats van artikel 31, eerste lid, de artikelen 38 tot en met 44 van toepassing.

      3 Op een onderneming of instelling als bedoeld in het eerste lid, is, met betrekking tot het uitoefenen van het
      bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref2], door middel van
      het verrichten van diensten in Nederland, in plaats van [artikel 32a][ref3], [artikel 38a][ref4] van toepassing.

      4 Met ingang van het tijdstip waarop de maatregel, bedoeld in het eerste lid, ten aanzien van een Lid-Staat
      wordt ingetrokken, wordt de in die Lid-Staat gevestigde onderneming of instelling die op dat tijdstip het bedrijf
      van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref5], door middel van een
      bijkantoor in Nederland uitoefent en die daarvoor een vergunning als bedoeld in [artikel 38, eerste lid][ref6],
      heeft verkregen, geacht te hebben voldaan aan [artikel 31, eerste lid, onder b en c][ref7]. De aan deze onderneming
      of instelling verleende vergunning als bedoeld in [artikel 38, eerste lid][ref8], vervalt op dat tijdstip van
      rechtswege.

      5 Met ingang van het tijdstip waarop de maatregel, bedoeld in het eerste lid, ten aanzien van een Lid-
      Staat wordt ingetrokken, wordt de in die Lid-Staat gevestigde onderneming of instelling die op dat tijdstip
      het bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref9], door
      middel van het verrichten van diensten in Nederland uitoefent en die daarvoor een ontheffing als bedoeld in
      [artikel 38a, derde lid][ref10], heeft verkregen, geacht te hebben voldaan aan [artikel 32a][ref11]. De aan deze
      onderneming of instelling verleende ontheffing als bedoeld in artikel [artikel 38a, derde lid][ref12], vervalt op
      dat tijdstip van rechtswege.


