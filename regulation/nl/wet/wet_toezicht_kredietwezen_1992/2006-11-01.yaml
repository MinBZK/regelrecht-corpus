  - number: '67'
    text: |-
      1 De Bank doet van iedere verlening en van iedere intrekking van een vergunning als bedoeld in [artikel 6][ref1]
      met betrekking tot een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2],
      onverwijld mededeling aan de toezichthoudende autoriteiten van de andere Lid-Staten en aan de Commissie van de
      Europese Gemeenschappen.

      2 De Bank doet van iedere verlening en van iedere intrekking van een verklaring van ondertoezichtstelling als
      bedoeld in artikel 45, eerste lid, onverwijld mededeling aan de toezichthoudende autoriteiten van de andere Lid-
      Staten en aan de Commissie van de Europese Gemeenschappen.


