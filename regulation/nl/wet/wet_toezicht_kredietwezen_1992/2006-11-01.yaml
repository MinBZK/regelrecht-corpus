  - number: '78'
    text: |-
      De rechtbank kan op verzoek van de bewindvoerders of ambtshalve de verklaring, bedoeld in artikel 71, eerste of
      tweede lid, intrekken. Artikel 71, zesde en achtste lid, is alsdan van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel78
  - number: '79'
    text: |-
      Door de bekendmaking, bedoeld in [artikel 75, vierde lid][ref1], indien deze bekendmaking betrekking had op
      alle verbintenissen van de kredietinstelling, [artikel 75, zevende lid][ref2], of [artikel 78][ref3] dan wel
      [artikel 212o, eerste lid, van de Faillissementswet][ref4], vervallen van rechtswege de bevoegdheden, welke de
      bewindvoerders ingevolge de verklaring, bedoeld in [artikel 71, eerste of tweede lid][ref5], hadden verkregen.


