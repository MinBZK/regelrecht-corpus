  - number: '48'
    text: |-
      1 Een financiële instelling, die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid,
      heeft verkregen en die het bedrijf, dat zij in Nederland uitoefent, uitoefent dan wel voornemens is uit te oefenen
      door middel van een bijkantoor in een andere Lid-Staat, dient de Bank daarvan schriftelijk kennis te geven.

      2 De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:

      a. de Lid-Staat waarin de financiële instelling het bijkantoor heeft gevestigd dan wel voornemens is te vestigen;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie - met inbegrip van de financiële administratie en de interne controle - ten behoeve van
      het bijkantoor zijn vermeld;

      c. het adres van het bijkantoor; en

      d. de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.

      3 De Bank doet binnen dertien weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van die gegevens alsmede van gegevens omtrent de omvang van het eigen
      vermogen van de financiële instelling en de solvabiliteitsratio op geconsolideerde basis van de kredietinstelling
      of kredietinstellingen als bedoeld in artikel 45, eerste lid, aan de toezichthoudende autoriteit van de Lid-Staat
      als bedoeld in het tweede lid, onder *a*. De Bank stelt de financiële instelling schriftelijk van het doen van deze
      mededeling in kennis.

      4 Indien de Bank van oordeel is dat de financiële instelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor, bedoeld in het eerste lid, verricht dan wel voornemens is te verrichten, redelijkerwijs niet zal kunnen
      voldoen aan de regels, bedoeld in de [artikelen 20][ref1], [22][ref2] en [22a][ref3], doet zij, in afwijking van
      het derde lid, geen mededeling aan de toezichthoudende autoriteit van de Lid-Staat, bedoeld in het tweede lid,
      onder a. De Bank stelt de financiële instelling hiervan, binnen dertien weken na ontvangst van de kennisgeving,
      bedoeld in het eerste lid en de gegevens, bedoeld in het tweede lid, in kennis.

      5 Indien zich een wijziging van de gegevens als bedoeld in het tweede lid, onder *b*, *c* of *d*, voordoet of
      indien het voornemen bestaat om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in
      het eerste lid te staken, stelt de financiële instelling de Bank en de toezichthoudende autoriteit van de andere
      Lid-Staat daarvan ten minste vier weken voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk
      in kennis.

      6 Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van
      oordeel is dat de financiële instelling, gezien de werkzaamheden die zij door middel van het bijkantoor als
      bedoeld in het eerste lid verricht, redelijkerwijs niet langer zal kunnen voldoen aan de regels als bedoeld in de
      [artikelen 20][ref4], [22][ref5] en [22a][ref6], trekt zij de mededeling, bedoeld in het derde lid, in. De Bank
      stelt de toezichthoudende autoriteit van de andere Lid-Staat en de financiële instelling schriftelijk van het
      intrekken van de mededeling in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel22a
