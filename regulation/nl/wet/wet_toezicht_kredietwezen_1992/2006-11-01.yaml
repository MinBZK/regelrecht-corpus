  - number: 16b
    text: |-
      1 Een kredietinstelling, die een vergunning als bedoeld in artikel 6 heeft verkregen en die voornemens is één of
      meerdere van de werkzaamheden genoemd in bijlage I van de Richtlijn uit te oefenen door middel van een bijkantoor
      in een Staat, die niet een Lid-Staat is, geeft, alvorens daartoe over te gaan, de Bank van haar voornemen
      schriftelijk kennis. Het is de kredietinstelling verboden om aan haar voornemen gevolg te geven zolang de Bank niet
      van haar instemming blijk heeft gegeven.

      2 De kennisgeving als bedoeld in het eerste lid geschiedt onder opgave van:

      a. de Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie – met inbegrip van de financiële administratie en de interne controle – ten behoeve van
      het bijkantoor zijn vermeld;

      c. de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering, met
      uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1];

      d. het adres van het bijkantoor; en

      e. de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.

      3 De kredietinstelling doet de in het tweede lid bedoelde gegevens vergezeld gaan van een vertaling voor zover de
      Bank zulks verlangt.

      4 Indien de Bank van oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor, bedoeld in het eerste lid, voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen
      aan de regels, bedoeld in de [artikelen 20][ref2], [21][ref3], [22][ref4] en [22a][ref5], onderscheidenlijk
      de [artikelen 30b][ref6], [30c][ref7] en [30ca][ref8], onthoudt de Bank haar instemming met de opening van het
      bijkantoor.

      5 De Bank beslist binnen 6 weken na ontvangst van de kennisgeving bedoeld in het eerste lid op het verzoek tot
      instemming.


