      1 Een onderneming of instelling als bedoeld in [artikel 54, eerste lid, onder b][ref1], dient een zodanige
      boekhouding te voeren, dat zij de Bank de inlichtingen, bedoeld in [artikel 54][ref2], kan verschaffen.

      2 Indien de Bank van oordeel is dat een onderneming of instelling niet aan het bepaalde in het eerste lid voldoet,
      kan zij aan die onderneming of instelling een voorschrift met betrekking tot het voeren van haar boekhouding geven.


