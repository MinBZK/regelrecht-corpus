  - number: '75'
    text: |-
      1 De rechtbank kan de bewindvoerders machtigen tot:

      a. overdracht van de verbintenissen van de kredietinstelling welke zij in de uitoefening van haar bedrijf als
      kredietinstelling tot het ter beschikking krijgen van gelden heeft aangegaan, of van een deel daarvan;

      b. gehele of gedeeltelijke liquidatie van het bedrijf van de kredietinstelling; of

      c. zowel overdracht als bedoeld in onderdeel a als liquidatie als bedoeld in onderdeel b.

      2 Indien bij overdracht van verbintenissen als bedoeld in het eerste lid, aanhef en onderdeel a of c, de bedingen
      in de overeenkomsten, waaruit die verbintenissen voortvloeien, worden gewijzigd, hebben de bewindvoerders daartoe
      de bijzondere machtiging van de rechtbank nodig met dien verstande, dat de bedingen in de overeenkomsten, waaruit
      vorderingen voortvloeien als bedoeld in [artikel 74, tweede lid][ref1], daarbij niet kunnen worden gewijzigd.
      De wijziging laat onverlet de uitkeringen die overeenkomstig [artikel 76][ref2] zijn gedaan voor de dag van de
      indiening van het verzoek om de machtiging als bedoeld in het eerste lid.

      3 Met betrekking tot de beschikkingen, bedoeld in het eerste en tweede lid, is het bepaalde in
      [artikel 71, zesde en achtste lid, eerste en tweede volzin][ref3], van overeenkomstige toepassing.

      4 Zodra overdracht van verbintenissen heeft plaatsgevonden, maken bewindvoerders de overdracht en, ingeval de
      bedingen in de overeenkomsten zijn gewijzigd, deze wijzigingen openbaar door bekendmaking in de Staatscourant, het
      Publicatieblad van de Europese Unie, alsmede in twee Nederlandse dagbladen en twee landelijke dagbladen van iedere
      Lid-Staat van ontvangst.

      5 De overdracht en de wijzigingen van de bedingen in de overeenkomsten worden alsdan van kracht ten aanzien van
      alle belanghebbenden met ingang van de dag, volgende op die van de dagtekening van de *Staatscourant*, waarin de
      bekendmaking is geplaatst.

      6 Gedurende de liquidatie, bedoeld in het eerste lid, aanhef en onderdeel b of c, regelt de rechtbank naar behoefte
      de bijzonderheden en gevolgen van de liquidatie, waaronder begrepen verkorting van de geldingsduur van lopende
      overeenkomsten, nadat zij daaromtrent het advies van de bewindvoerders en de Bank heeft ingewonnen.

      7 Zodra de liquidatie is beëindigd, doen de bewindvoerders daarvan mededeling in de Staatscourant, het
      Publicatieblad van de Europese Unie, alsmede in een of meer door de rechtbank aan te wijzen dagbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel76
