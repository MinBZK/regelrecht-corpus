  - number: '13'
    text: |-
      1 Een wijziging van de gegevens bedoeld in artikel 8, tweede lid, onder a, b, c, of d, wordt, voor zover het aantal
      of de identiteit van de daar genoemde personen betreft, vooraf aan de Bank gemeld.

      2 Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd, indien de Bank het voornemen daartoe afwijst
      binnen 6 weken na ontvangst van de melding, bedoeld in het eerste lid, of, indien de Bank om nadere gegevens of
      inlichtingen heeft verzocht, binnen 6 weken na de ontvangst van die gegevens of inlichtingen.

      3 Indien zich een wijziging van de antecedenten bedoeld in artikel 8, tweede lid, onder a, b, c, of d, voordoet,
      stelt de kredietinstelling de Bank daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel13
  - number: '14'
    text: |-
      1 De Bank kan, indien:

      a. de kredietinstelling niet voldoet aan het bij of krachtens de [artikelen 7a][ref1], [10][ref2], [11][ref3] of
      [30][ref4] bepaalde;

      b. zich bij de kredietinstelling een omstandigheid als bedoeld in artikel 9, eerste lid, onder *b*, *c*, *d* of
      *e*, voordoet; onderscheidenlijk

      c. de verklaring als bedoeld in artikel 30, tweede lid, een verklaring is die een andere inhoud heeft dan dat de
      jaarrekening als bedoeld in artikel 30, eerste lid, een getrouw beeld geeft van de grootte en de samenstelling van
      het vermogen van de kredietinstelling en van het resultaat over het desbetreffende boekjaar;.

      de bevoegde organen van de kredietinstelling een aanwijzing geven om ten aanzien van met name aan te geven punten
      een bepaalde gedragslijn te volgen, teneinde te bereiken dat, binnen een door de Bank te bepalen termijn, wordt
      voldaan aan het bij of krachtens de [artikelen 7a][ref5], [10][ref6], [11][ref7] of [30][ref8] bepaalde, zich bij
      de kredietinstelling een omstandigheid als bedoeld in artikel 9, eerste lid, onder *b*, *c*, *d* of *e*, niet meer
      voordoet , onderscheidenlijk de verklaring, bedoeld in artikel 30, tweede lid, betreffende de jaarrekening over
      een door de Bank te bepalen boekjaar wordt gegeven die inhoudt dat de jaarrekening een getrouw beeld geeft van de
      grootte en de samenstelling van het vermogen van de kredietinstelling en van het resultaat over het desbetreffende
      boekjaar.

      2 Onze minister kan, indien de kredietinstelling niet voldoet aan het bij of krachtens [artikel 85a][ref9] of
      [85b][ref10] bepaalde, de bevoegde organen van de kredietinstelling een aanwijzing geven om ten aanzien van met
      name aan te geven punten een bepaalde gedragslijn te volgen, teneinde te bereiken dat, binnen een in de aanwijzing
      te bepalen termijn, wordt voldaan aan het bij of krachtens [artikel 85a][ref11] of [85b][ref12] bepaalde.

      3 Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het geven van een aanwijzing worden
      overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze wet jegens Onze
      minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.

      4 Een overdracht als bedoeld in het derde lid vindt slechts plaats indien de betrokken rechtspersoon aan de
      volgende vereisten voldoet:

      a. hij dient in staat te zijn de in het tweede lid bedoelde bevoegdheid naar behoren uit te oefenen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke uitoefening van de in het tweede lid bedoelde bevoegdheid is gewaarborgd.

      5 Aan de overdracht, bedoeld in het derde lid, kunnen beperkingen worden gesteld en voorschriften worden verbonden.

      6 Indien een kredietinstelling tot een groep behoort en de deskundigheid of betrouwbaarheid van de in
      [artikel 8, tweede lid, onder c en d][ref13], bedoelde personen naar het oordeel van de Bank niet langer buiten
      twijfel staat, kan de Bank aan de personen of instellingen die via een formele of feitelijke zeggenschapsstructuur
      het beleid bepalen van de groep waartoe de kredietinstelling behoort, de aanwijzing geven dat de eerstgenoemde
      personen het beleid of het dagelijks beleid van die kredietinstelling niet meer kunnen mede bepalen.

      7 De personen en instellingen tot wie de aanwijzing is gericht, volgen deze binnen de door de Bank gestelde termijn
      op.

      8 De personen en instellingen tot wie de aanwijzing is gericht, informeren de Bank binnen de door de haar gestelde
      termijn over de maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.

      9 De kredietinstelling geeft geen gevolg aan algemene of bijzondere instructies van personen op wie een aanwijzing
      van de Bank als bedoeld in het tweede lid betrekking heeft.


