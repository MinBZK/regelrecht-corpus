  - number: 76a
    text: |-
      1 De bewindvoerders geven van een machtiging als bedoeld in
      [artikel 75, eerste lid, aanhef en onderdeel b of c][ref1], onmiddellijk aan alle bekende schuldeisers kennis.

      2 Elke schuldeiser kan in geval van een machtiging als bedoeld
      [artikel 75, eerste lid, aanhef en onderdelen b en c][ref2], zijn vordering en schriftelijke opmerkingen
      betreffende zijn vordering indienen bij de bewindvoerders.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel75
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel76a
