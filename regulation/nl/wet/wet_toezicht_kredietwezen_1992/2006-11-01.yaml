  - number: '9'
    text: |-
      1 De Bank verleent de vergunning, tenzij:

      a. de onderneming of instelling niet voldoet aan het bij of krachtens de artikelen 10 en 11 bepaalde;

      b. de Bank van oordeel is dat de deskundigheid van één of meer personen, die het dagelijks beleid van
      de onderneming of instelling bepalen, onvoldoende is in verband met de uitoefening van het bedrijf van
      kredietinstelling;

      c. de Bank op grond van de voornemens of de antecedenten van oordeel is, dat, met het oog op de belangen van
      de crediteuren of toekomstige crediteuren van de onderneming of instelling, de betrouwbaarheid van één of meer
      personen, die het beleid van de onderneming of instelling bepalen of mede bepalen, niet buiten twijfel staat.

      d. de Bank van oordeel is dat de deskundigheid van één of meer personen die het dagelijks beleid bepalen van
      de groep waartoe de onderneming of instelling behoort, voor zover zij tevens uit dien hoofde dagelijks beleid
      van de onderneming of instelling mede bepalen, onvoldoende is in verband met de uitoefening van het bedrijf van
      kredietinstelling;

      e. de Bank op grond van de voornemens of de antecedenten van oordeel is, dat, met het oog op de belangen van
      de crediteuren of toekomstige crediteuren van de onderneming of instelling, de betrouwbaarheid van een of meer
      personen, die het beleid bepalen of mede bepalen van de groep waartoe de onderneming of instelling behoort, en
      tevens uit dien hoofde het beleid van de onderneming of instelling mede bepalen, niet buiten twijfel staat.

      f. de Bank, onverminderd het bepaalde in artikel 24, van oordeel is, dat ingevolge een gekwalificeerde deelneming
      in de onderneming of instelling van een invloed op de onderneming of instelling sprake is of zou kunnen zijn, die
      in strijd is met een gezond bankbeleid;

      g. de verklaring als bedoeld in artikel 8, tweede lid, onder *f*, een verklaring is die een andere inhoud heeft dan
      dat de jaarrekening of openingsbalans een getrouw beeld geeft van de grootte en de samenstelling van het vermogen
      van de onderneming of instelling; of

      h. de Bank op grond van gegevens als omschreven in [artikel 8, tweede lid, onder f, g, h of i][ref1], van oordeel
      is dat de onderneming of instelling niet in staat zal zijn om haar voornemens ten uitvoer te leggen dan wel om aan
      de aan haar uit hoofde van het toezicht te stellen eisen te voldoen.

      2 De Bank kan weigeren de vergunning te verlenen indien zij gronden heeft om aan te nemen dat de onderneming of
      instelling de vergunning heeft aangevraagd om zich te onttrekken aan de wet- of regelgeving inzake het toezicht op
      het kredietwezen in een andere Lid-Staat.

      3 De Bank kan weigeren de vergunning te verlenen indien zij van oordeel is dat de groep waartoe de onderneming of
      instelling behoort een formele of feitelijke zeggenschapsstructuur heeft die in zodanige mate ondoorzichtig is, dat
      deze een belemmering zou vormen voor het adequaat uitoefenen van toezicht op de onderneming of instelling.

      4 De Bank kan tevens weigeren de vergunning te verlenen indien de onderneming of instelling tot een groep behoort
      en het adequaat uitoefenen van toezicht op die onderneming onderscheidenlijk instelling, naar het oordeel van
      de Bank, wordt belemmerd door het recht van een Staat, die niet een Lid-Staat is, dat van toepassing is op een
      groepsmaatschappij of natuurlijke persoon die tot de groep behoort.

      5 Indien de onderneming of instelling een dochtermaatschappij of bijkantoor van een niet in Nederland
      gevestigde kredietinstelling is kan de Bank weigeren de vergunning te verlenen indien zij van oordeel is, dat de
      toezichthoudende autoriteit van de Staat waar de buitenlandse kredietinstelling gevestigd is geen of onvoldoende
      geconsolideerd toezicht uitoefent.


