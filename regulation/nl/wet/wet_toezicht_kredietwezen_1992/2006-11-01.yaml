      Dit hoofdstuk is niet van toepassing op:

      a. een kredietinstelling, die op grond van [artikel 6, tweede lid][ref1], is vrijgesteld onderscheidenlijk op grond
      van [artikel 6, derde lid][ref2], is ontheven van het verbod van [artikel 6, eerste lid][ref3];

      b. een kredietinstelling, die op grond van [artikel 31, vierde lid][ref4], is vrijgesteld onderscheidenlijk op
      grond van [artikel 31, vijfde lid][ref5], is ontheven van het verbod van [artikel 31, eerste lid][ref6];

      c. een kredietinstelling die op grond van [artikel 38, derde lid][ref7], is vrijgesteld onderscheidenlijk op grond
      van [artikel 38, vierde lid][ref8], is ontheven van het verbod van [artikel 38, eerste lid][ref9].


