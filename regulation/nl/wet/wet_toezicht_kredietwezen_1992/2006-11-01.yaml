  - number: '5'
    text: |-
      1 De bepalingen van deze wet vinden ten aanzien van een buiten Nederland gevestigde onderneming of instelling, die
      door middel van een bijkantoor in Nederland het bedrijf van kredietinstelling uitoefent, slechts toepassing voor
      zover het haar in of vanuit Nederland uitgeoefende bedrijf betreft.

      2 De Bank kan ten aanzien van een in een Staat, die niet een Lid-Staat is, gevestigde onderneming of instelling,
      die door middel van een bijkantoor in Nederland het bedrijf van kredietinstelling uitoefent, bepalen, dat tot
      haar in of vanuit Nederland uitgeoefende bedrijf van kredietinstelling mede worden gerekend alle of bepaalde
      rechtsverhoudingen van die kredietinstelling rechtstreeks of middellijk met natuurlijke personen en rechtspersonen,
      welke in Nederland gevestigd zijn of aldaar hun bedrijf uitoefenen.

      3 De Bank kan voor de toepassing van de artikelen 16 en 17 en 31 tot en met 37 een kredietinstelling beschouwen
      als een bijkantoor, indien naar het oordeel van de Bank met betrekking tot die kredietinstelling voldaan wordt aan
      voorwaarden als omschreven in artikel 12, onder *a* tot en met *e*.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel5
  - number: '6'
    text: |-
      1 Het is een in Nederland gevestigde onderneming of instelling verboden het bedrijf van kredietinstelling uit te
      oefenen, behoudens voor zover zij daartoe van de Bank een vergunning heeft verkregen.

      2 Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.

      3 De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel6
  - number: '7'
    text: |-
      Het is een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die een
      vergunning als bedoeld in artikel 6 heeft verkregen, in verband met het ingevolge deze wet uitgeoefende toezicht
      toegestaan ten minste de werkzaamheden genoemd in bijlage I van de Richtlijn te verrichten, tenzij in de vergunning
      uitdrukkelijk anders is bepaald en onverminderd de toepasselijkheid van andere op deze werkzaamheden betrekking
      hebbende wettelijke voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
