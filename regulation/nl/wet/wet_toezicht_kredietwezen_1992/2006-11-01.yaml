  - number: '74'
    text: |-
      1 Een verklaring als bedoeld in [artikel 71, eerste of tweede lid][ref1], heeft ten gevolge, dat
      de kredietinstelling niet kan worden genoodzaakt tot nakoming van haar verplichtingen; aangevangen
      executies worden geschorst; gelegde beslagen vervallen. [Artikel 36 van de Faillissementswet][ref2]
      is van overeenkomstige toepassing op de in de eerste volzin bedoelde verplichtingen. Voorts zijn de
      [artikelen 63a tot en met 63c van de Faillissementswet][ref3] van overeenkomstige toepassing, waarbij
      de aldaar genoemde bevoegdheden van de rechter-commissaris worden uitgeoefend door de rechtbank, indien
      niet op de voet van [artikel 73, tweede lid][ref4], een rechter-commissaris is benoemd. Hetgeen in de
      [artikelen 63a tot en met 63c van de Faillissementswet][ref5] is bepaald met betrekking tot de curator
      onderscheidenlijk de gefailleerde is van toepassing op de bewindvoerders onderscheidenlijk de kredietinstelling.

      2 Onverminderd het bepaalde in [artikel 76][ref6] geldt het bij het eerste lid bepaalde niet ten aanzien
      van vorderingen welke voortvloeien uit handelingen, met de kredietinstelling dan wel het bijkantoor na de
      verklaring verricht, noch voor vorderingen als bedoeld in [artikel 232 van de Faillissementswet][ref7],
      noch voor vorderingen tot nakoming van financiëlezekerheidsovereenkomsten als bedoeld in
      [artikel 51 van Boek 7 van het Burgerlijk Wetboek][ref8].

      3 Overigens zijn de [artikelen 234 tot en met 241e van de Faillissementswet][ref9] van overeenkomstige toepassing.


