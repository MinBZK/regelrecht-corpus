        afdeling: '1'
  - number: 76e
    text: |-
      1 Indien een machtiging als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel b][ref1], is verleend, trekt de
      Bank de vergunning in op het tijdstip waarop die machtiging is verleend, of zo spoedig mogelijk daarna, voor zover
      de kredietinstelling onmiddellijk voorafgaand aan dat tijdstip nog een vergunning heeft.

      2 Indien een machtiging als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel c][ref2], is verleend,
      trekt de Bank de vergunning in op het tijdstip waarop tijdens de noodregeling voor de eerste keer activa van
      de kredietinstelling te gelde worden gemaakt met het oogmerk de opbrengst te verdelen onder de schuldeisers,
      aandeelhouders of leden, of zo spoedig mogelijk na bedoeld tijdstip, voor zover de kredietinstelling onmiddellijk
      voorafgaand aan het voor de eerste keer te gelde maken nog een vergunning heeft. De bewindvoerder stelt de Bank in
      kennis van het voor de eerste keer te gelde maken van de activa, zo mogelijk voorafgaand aan het te gelde maken, of
      anders onverwijld daarna, tenzij de vergunning reeds is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel75
