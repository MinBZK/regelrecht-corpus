      1 Een kredietinstelling, die een vergunning als bedoeld in artikel 6 heeft verkregen en die voornemens is één van
      de werkzaamheden genoemd in bijlage I van de Richtlijn door middel van het verrichten van diensten in een andere
      Lid-Staat voor de eerste maal in die Lid-Staat uit te oefenen, geeft, alvorens daartoe over te gaan, de Bank steeds
      van haar voornemen schriftelijk kennis.

      2 De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:

      a. de Lid-Staat waarin de kredietinstelling voornemens is de werkzaamheden te verrichten;

      b. de werkzaamheden welke de kredietinstelling voornemens is te verrichten.

      3 De Bank doet binnen vier weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van de gegevens als bedoeld in het tweede lid, onder *b*, aan
      de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de
      kredietinstelling schriftelijk van het doen van deze mededeling in kennis.
