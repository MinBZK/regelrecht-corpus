        artikel: '52'
        hoofdstuk: VII
  - number: '84'
    text: |-
      1 De Bank pleegt overleg met de betrokken representatieve organisaties over de invoering van een
      regeling omtrent een garantie voor nader te bepalen schuldvorderingen van natuurlijke personen,
      rechtspersonen en vennootschappen tot een nader te bepalen maximum op kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die ingevolge artikel 52, tweede lid, onder *a*, zijn
      geregistreerd, tegen het risico, dat een zodanige onderneming of instelling haar verplichtingen met betrekking tot
      die schuldvorderingen niet nakomt.

      2 Bij koninklijk besluit kan, indien het overleg bedoeld in het eerste lid leidt tot overeenstemming tussen de
      Bank en alle betrokken representatieve organisaties, worden bepaald, dat de kredietinstellingen bedoeld in het
      eerste lid alsmede de instellingen die gebruik maken van de vrijstelling bedoeld in artikel 12 van [richtlijn
      94/19/EG](31994L0019) van het Europees Parlement en de Raad van de Europese Unie van 30 mei 1994 inzake de
      depositogarantiestelsels (*PbEG* L 135) verplicht zijn aan de uitvoering van die regeling mede te werken.

      3 Onze Minister kan besluiten dat een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref2], die ingevolge artikel 52, tweede lid, onder *b*,
      is geregistreerd, verplicht is aan de uitvoering van de regeling bedoeld in het eerste lid mee te werken,
      indien de Bank van oordeel is dat voor de schuldvorderingen op die kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] geen garantieregeling van toepassing is, welke gelijkwaardig
      is aan de dekking bedoeld in artikel 6, eerste lid, van [richtlijn 94/19/EG](31994L0019) van het Europees Parlement
      en de Raad van de Europese Unie van 30 mei 1994 inzake de depositogarantiestelsels (*PbEG* L 135).

      4 Bij koninklijk besluit kan, indien het overleg bedoeld in het eerste lid niet binnen een door Onze minister te
      bepalen termijn leidt tot overeenstemming, dan wel indien de regeling, waaromtrent overeenstemming is bereikt, niet
      de instemming van Onze minister heeft, een regeling als bedoeld in het eerste lid worden ingevoerd, nadat de Bank,
      de Bankraad en de betrokken representatieve organisaties in de gelegenheid zijn gesteld hun gevoelen omtrent de
      inhoud van de in te voeren regeling kenbaar te maken.

      5 Binnen twee maanden, nadat een regeling krachtens het vierde lid is ingevoerd, wordt door Ons een voorstel aan de
      Staten-Generaal gedaan om deze regeling bij de wet te bekrachtigen. Indien het voorstel door een van beide Kamers
      der Staten-Generaal wordt verworpen, wordt deze regeling terstond ingetrokken. Van de intrekking wordt mededeling
      gedaan in de *Staatscourant*.

      6 Het bepaalde in het eerste, tweede en derde, onderscheidenlijk vierde en vijfde lid is mede van toepassing op
      wijziging en intrekking van een garantieregeling, tot stand gekomen met inachtneming van die bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel1
