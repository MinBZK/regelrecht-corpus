  - number: '112'
    text: |-
      1 De vergunning die, op het tijdstip waarop deze wet in werking treedt, op grond van artikel 2 van de
      Wet toezicht kredietwezen (*Stb.* 1978, 255) is verleend dan wel op grond van artikel 62 van die wet of
      [artikel 7 van de Postbankwet][ref1] (*Stb.* 1985, 510) wordt geacht te zijn verleend aan een in Nederland
      gevestigde kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref2], wordt geacht
      aan die kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] te zijn verleend op
      grond van artikel 6.

      2 De vergunning die, op het tijdstip waarop deze wet in werking treedt, op grond van artikel 2 van de Wet
      toezicht kredietwezen is verleend dan wel op grond van artikel 62 van die wet wordt geacht te zijn verleend
      aan een buiten de Unie dan wel in een Lid-Staat ten aanzien waarvan Onze minister op dat tijdstip een
      maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, gevestigde onderneming of instelling die
      het bedrijf van kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref4] door
      middel van een bijkantoor in Nederland uitoefent, wordt geacht aan die kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref5] te zijn verleend op grond van artikel 38, eerste lid.

      3 De in een andere Lid-Staat, niet zijnde een Lid-Staat ten aanzien waarvan Onze minister een maatregel
      als bedoeld in artikel 33, eerste lid, heeft genomen, gevestigde onderneming of instelling die, op
      het tijdstip waarop deze wet in werking treedt, het bedrijf van kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref6] door middel van een bijkantoor in Nederland uitoefent en die
      daarvoor een vergunning als bedoeld in artikel 2 van de Wet toezicht kredietwezen heeft verkregen dan wel op grond
      van artikel 62 van die wet geacht wordt te hebben verkregen, wordt geacht te hebben voldaan aan artikel 31, eerste
      lid, onder *b* en *c*.


