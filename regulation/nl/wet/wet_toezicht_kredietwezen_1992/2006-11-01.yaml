      1 In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd

      2 Ingeval beroep wordt ingesteld tegen besluiten, genomen ter uitvoering van de artikelen 14, 26, eerste lid,
      28, 29, 30e, 35 of 90a, eerste lid, zal de terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt
      alsdan medegedeeld aan de verzoeker en de Bank onderscheidenlijk Onze minister.


