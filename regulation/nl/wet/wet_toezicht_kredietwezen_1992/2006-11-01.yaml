  - number: 90a
    text: |-
      1 Onze minister is bevoegd aan de Bank de gegevens of inlichtingen te vragen die naar zijn oordeel nodig zijn voor
      een onderzoek naar de toereikendheid van deze wet of de wijze waarop de Bank deze wet uitvoert of heeft uitgevoerd,
      indien dat ter wille van het bedrijfseconomisch toezicht nodig blijkt.

      2 De Bank is verplicht aan Onze minister de in het eerste lid bedoelde gegevens of inlichtingen te verstrekken.
      Indien Onze minister de Bank vraagt bepaalde gegevens of inlichtingen te verstrekken die onder artikel 64, eerste
      en tweede lid, vallen, is de Bank niet verplicht deze gegevens of inlichtingen te verstrekken, indien:

      a. deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke kredietinstelling die een vergunning als bedoeld in artikel 6 of artikel 38 heeft verkregen of een
      financiële instelling die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft
      verkregen of waarvan die vergunning onderscheidenlijk die verklaring is ingetrokken of vervallen, en ten aanzien
      waarvan overeenkomstig artikel 71 de noodregeling is uitgesproken of die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden;

      b. deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      kredietinstelling of financiële instelling in staat te stellen haar bedrijf voort te zetten; of

      c. deze zijn ontvangen van een instantie als bedoeld in artikel 65, eerste lid, of zijn verkregen naar aanleiding
      van een verificatie bij een in een andere staat gelegen bijkantoor van een in Nederland gevestigde instelling,
      tenzij de uitdrukkelijke instemming is verkregen van die instantie onderscheidenlijk van de toezichthoudende
      autoriteit van de staat waar de verificatie ter plaatse is verricht.

      3 Onze minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.

      4 Onze minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      Bank deze wet uitvoert of heeft uitgevoerd.

      5 Onze minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. Artikel 64 is van toepassing.

      6 Niettegenstaande het vierde en vijfde lid kan Onze minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.

      7 De [Wet openbaarheid van bestuur][ref1], de [Wet Nationale ombudsman][ref2] en
      [titel 9.2 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze minister of de in zijn opdracht werkende derde onder zich heeft.


