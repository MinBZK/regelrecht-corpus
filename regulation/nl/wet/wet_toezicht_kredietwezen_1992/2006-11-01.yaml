  - number: '62'
    text: |-
      1 De onderneming of instelling waar bij of namens de Bank op grond van de [artikelen 53][ref1] of [54][ref2],
      eerste lid, inlichtingen worden ingewonnen, verstrekt deze binnen de door de Bank te stellen termijn.

      2 Iedere onderneming of instelling is verplicht de Bank desgevorderd in de gelegenheid te stellen zich van de
      juistheid van de verstrekte inlichtingen te overtuigen aan de hand van zakelijke gegevens en bescheiden en daarbij
      zoveel mogelijk behulpzaam te zijn.

      3 Een derde, die de in het tweede lid bedoelde zakelijke gegevens en bescheiden onder zich heeft, is desgevorderd
      verplicht deze daartoe over te leggen dan wel toegankelijk te maken.

      4 Het bepaalde in het eerste tot en met derde lid is van overeenkomstige toepassing ingeval een toezichthoudende
      autoriteit van een andere Lid-Staat zich krachtens [artikel 61][ref3] van de juistheid van de aan haar verstrekte
      inlichtingen overtuigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel54
