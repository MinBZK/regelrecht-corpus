  - number: '46'
    text: |-
      De Bank verleent de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, slechts indien:

      a. de financiële instelling aantoont, dat het haar, voor zover op haar werkzaamheden andere wettelijke
      voorschriften van toepassing zijn, is toegestaan deze werkzaamheden te verrichten;

      b. de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, ten minste 90 procent van de
      stemrechten in de financiële instelling bezit of bezitten;

      c. de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, met instemming van de Bank de
      verplichtingen van de financiële instelling garandeert of garanderen; en

      d. de kredietinstelling of kredietinstellingen als bedoeld in artikel 45, eerste lid, naar het oordeel van de Bank
      mede zorgdraagt of zorgdragen voor een gezonde bedrijfsvoering bij de financiële instelling.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel46
  - number: '47'
    text: |-
      De Bank kan een verklaring van ondertoezichtstelling intrekken, indien:

      a. de financiële instelling daarom verzoekt;

      b. de onderneming of instelling, aan welke de verklaring van ondertoezichtstelling is verleend, opgehouden heeft
      een financiële instelling te zijn;

      c. de financiële instelling niet meer voldoet aan het bepaalde in artikel 46, onder *a*;

      d. met betrekking tot de financiële instelling niet meer wordt voldaan aan het in artikel 46, onder *b*, *c* of *d*
      bepaalde of het in de artikelen 24, 26 of 27, eerste lid, bepaalde niet wordt nageleefd;

      e. de financiële instelling het bij of krachtens de [artikelen 11][ref1], [20][ref2], [22][ref3], [22a][ref4] en
      [27, tweede lid][ref5], bepaalde niet naleeft; of

      f. de gegevens of bescheiden die zijn verstrekt ter verkrijging van de verklaring van ondertoezichtstelling zodanig
      onjuist of onvolledig blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van
      het verzoek de juiste omstandigheden volledig bekend waren geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel11
