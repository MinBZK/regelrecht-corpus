  - number: 30d
    text: |-
      1 Iedere natuurlijke persoon of rechtspersoon die voornemens is een gekwalificeerde deelneming van 10 procent
      of meer in een kredietinstelling te houden, te verwerven of zodanig te vergroten dat daardoor de omvang van deze
      deelneming de 20, 33, of 50 procent overschrijdt of de kredietinstelling een dochtermaatschappij wordt, dan wel
      enige zeggenschap verbonden aan een gekwalificeerde deelneming in een kredietinstelling uit te oefenen, stelt,
      alvorens daartoe over te gaan, de Bank van het voornemen schriftelijk in kennis. Het is de natuurlijke persoon of
      rechtspersoon verboden om aan dit voornemen gevolg te geven zolang de mededeling, bedoeld in het derde lid niet
      is gedaan.

      2 Iedere natuurlijke persoon of rechtspersoon wiens gekwalificeerde deelneming zodanig wijzigt dat de omvang van de
      deelneming onder de 10, 20, 33, of 50 procent daalt, of dat de kredietinstelling ophoudt een dochtermaatschappij te
      zijn, stelt de Bank daarvan in kennis.

      3 Indien de Bank van oordeel is dat het voornemen bedoeld in het eerste lid niet zou leiden of zou kunnen leiden
      tot een invloed op de betrokken kredietinstelling die in strijd is met een gezond bankbeleid, dan wel indien
      de Bank van oordeel is dat het voornemen bedoeld in het eerste lid niet ertoe leidt of zou kunnen leiden dat
      de naleving van de in [artikel 30ca][ref1] bedoelde regels onvoldoende is gewaarborgd, deelt zij de natuurlijke
      persoon of rechtspersoon binnen acht weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, mede dat
      geen bezwaar bestaat tegen het voornemen.

      4 Een kredietinstelling stelt, voor zover haar bekend, de Bank in de maand juli van elk jaar in kennis van
      de identiteit van iedere natuurlijke persoon of rechtspersoon die een gekwalificeerde deelneming in deze
      kredietinstelling houdt. Tevens stelt een kredietinstelling, zodra zulks haar bekend wordt, de Bank in kennis van
      iedere verwerving, afstoting of wijziging van een gekwalificeerde deelneming in deze kredietinstelling waardoor de
      omvang van deze deelneming boven onderscheidenlijk onder 10, 20, 33 of 50 procent stijgt onderscheidenlijk daalt
      of waardoor de kredietinstelling een dochtermaatschappij wordt onderscheidenlijk ophoudt een dochtermaatschappij
      te zijn.

      5 Ingeval het uitoefenen van enige zeggenschap verbonden aan een gekwalificeerde deelneming in een
      kredietinstelling als bedoeld in het eerste lid geschiedt, zonder dat voor het houden, het verwerven of het
      vergroten van de gekwalificeerde deelneming de mededeling, bedoeld in het derde lid, is gedaan, is een mede door
      de uitgeoefende zeggenschap tot stand gekomen besluit vernietigbaar. Het besluit kan worden vernietigd op vordering
      van de Bank. Het besluit wordt in dat geval door de rechtbank, binnen wier rechtsgebied de kredietinstelling
      gevestigd is, vernietigd, indien het besluit zonder dat de desbetreffende zeggenschap zou zijn uitgeoefend,
      anders zou hebben geluid dan wel niet zou zijn genomen. De rechtbank regelt voor zover nodig de gevolgen van de
      vernietiging.


