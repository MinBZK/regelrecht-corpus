      [25, eerste lid][ref19], [25a, tweede en derde lid][ref20], [26, achtste lid][ref21],
      [28, tweede lid en vijfde lid, onder a][ref22], [29, tweede lid][ref23], [30, eerste en tweede lid][ref24],
      [30b, eerste lid][ref25], [30c, eerste lid][ref26], [30ca, eerste lid][ref27],
      [30d, eerste, tweede en vierde lid][ref28], [31, eerste lid, onder a, tweede, vierde en vijfde lid][ref29],
      [32, eerste lid, onder a, tweede, derde en vierde lid][ref30], [32a onder a][ref31], [36][ref32], [37][ref33],
      [38, eerste, tweede, derde en vierde lid][ref34], [38a, eerste, tweede en derde lid][ref35], [43][ref36],
      [44][ref37], [50, eerste lid][ref38], [51][ref39],[ 54, tweede lid][ref40], voor zover het betreft het
      voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref41] en het voorschrift inzage te verlenen in
      zakelijke gegevens en bescheiden, [55, eerste, tweede, derde en vijfde lid][ref42], [56a][ref43], [57][ref44],
      [58, eerste en tweede lid][ref45], [61, derde lid, eerste volzin][ref46], [62, eerste, tweede en derde lid][ref47],
      [63][ref48], [66, tweede lid][ref49], [66a, tweede lid][ref50], [72, derde lid][ref51], [81, vijfde lid][ref52],
      [82, eerste en zevende lid][ref53], [83, eerste en vierde lid][ref54], [84, tweede, derde en vierde lid][ref55],
      [85][ref56], [85a, eerste lid][ref57], en [85b, eerste lid][ref58], voor zover zij zijn belast met de uitvoering
      van het toezicht ter zake van die artikelen.

      2 De [artikelen 5:32, tweede tot en met vijfde lid][ref59], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref60] zijn van toepassing.

      3 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid, bedoeld in het eerste lid.

      4 Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het opleggen van een last onder
      dwangsom worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze wet
      jegens Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.

      5 Een overdracht als bedoeld in het vierde lid vindt slechts plaats indien de betrokken rechtspersoon aan de
      volgende vereisten voldoet:

      a. hij dient in staat te zijn de in het vierde lid bedoelde bevoegdheid naar behoren uit te oefenen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke uitoefening van de in het vierde lid bedoelde bevoegdheid is gewaarborgd.

      6 Aan de overdracht, bedoeld in het vierde lid, kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.


