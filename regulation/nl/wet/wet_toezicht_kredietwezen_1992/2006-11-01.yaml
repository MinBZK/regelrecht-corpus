      [artikel 1, eerste lid, onderdeel a, onder 1°][ref3] waarvan het onderdeel uitmaakt, de boekhoudbescheiden,
      aangewezen krachtens de [Handelsregisterwet 1996][ref4] bij de Bank in te dienen.


