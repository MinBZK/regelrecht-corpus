    text: |-
      1 Onze Minister of de Bank kan een last onder dwangsom opleggen ter zake van overtreding
      van voorschriften, gesteld bij of krachtens de [artikelen 4, eerste lid][ref1],
      [6, eerste, tweede en derde lid][ref2], [7][ref3], [7a, eerste en tweede lid][ref4],
      [7b][ref5], [10, eerste tot en met vijfde lid][ref6], [11, eerste en vijfde lid][ref7],
      [12, tweede lid][ref8], [14, eerste, tweede, zevende, achtste en negende lid][ref9],
