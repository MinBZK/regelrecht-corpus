preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is uitvoering te geven aan de Tweede Richtlijn van de
    Raad van de Europese Gemeenschappen van 15 december 1989 tot coördinatie van de wettelijke en bestuursrechtelijke
    bepalingen betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen, alsmede tot
    wijziging van Richtlijn 77/780/EEG (89/646/EEG) alsmede aan de Richtlijn van de Raad van de Europese Gemeenschappen
    van 6 april 1992 inzake het toezicht op kredietinstellingen op geconsolideerde basis (92/30/EEG), en dat het
    naar aanleiding daarvan alsmede in verband met het aanbrengen van enige andere aanpassingen van de Wet toezicht
    kredietwezen (Stb. 1978, 255) wenselijk is de bepalingen inzake het toezicht op het kredietwezen opnieuw vast te
    stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. kredietinstelling:

      1°. een onderneming of instelling die haar bedrijf maakt van het ter beschikking verkrijgen van, al dan niet op
      termijn, opvorderbare gelden en van het voor eigen rekening verrichten van kredietuitzettingen of beleggingen;
      dan wel

      2°. een onderneming of instelling, anders dan bedoeld onder 1°, die gelden ter beschikking krijgt in ruil waarvoor
      elektronisch geld wordt uitgegeven waarmee betalingen kunnen worden verricht ook aan anderen dan de onderneming of
      instelling die het elektronisch geld uitgeeft.

      b. centrale kredietinstelling: een kredietinstelling als bedoeld in onderdeel a, onder 1°, die met betrekking tot
      een groep kredietinstellingen een mede beleidsbepalend karakter draagt;

      c. financiële instelling: een onderneming of instelling, niet zijnde een kredietinstelling, die in hoofdzaak haar
      bedrijf maakt van het verrichten van één of meer van de werkzaamheden genoemd onder 2 tot en met 12 in bijlage I
      van de Richtlijn dan wel van het verwerven of het houden van deelnemingen;

      d. representatieve organisatie: een organisatie, die met betrekking tot de uitvoering van deze wet door Onze
      minister, de Bank gehoord, als representatieve organisatie voor een groep van ondernemingen en instellingen is
      aangewezen;

      e. Onze minister: Onze minister van Financiën;

      f. Bank: De Nederlandsche Bank N.V.;

      g. toezichthoudende autoriteit: de instantie waaraan in enige Staat ingevolge een wettelijke regeling het toezicht
      op het kredietwezen is opgedragen;

      h. de Unie: de Europese Unie;

      i. Lid-Staat: een staat die lid is van de Unie alsmede een staat, niet zijnde een lid-staat van de Unie, die partij
      is bij de overeenkomst betreffende de Europese Economische Ruimte (*Trb.*1992, 132);

      j. de Richtlijn: [Richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad van de Europese Unie
      van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van kredietinstellingen (PbEG
      L 126);

      k. bijkantoor: één of meer onderdelen zonder rechtspersoonlijkheid van een kredietinstelling of een financiële
      instelling die in een andere Staat is gevestigd dan die waarin de kredietinstelling of de financiële instelling
      gevestigd is;

      l. verrichten van diensten: het in een Staat, zonder gebruikmaking van een bijkantoor in die Staat, verrichten dan
      wel aanbieden van werkzaamheden genoemd in bijlage I van de Richtlijn door een kredietinstelling of een financiële
      instelling die in een andere Staat is gevestigd;

      m. gekwalificeerde deelneming: een rechtstreeks of middellijk belang van ten minste 10 procent van het
      geplaatste aandelenkapitaal van een onderneming of instelling, of het rechtstreeks of middellijk kunnen
      uitoefenen van ten minste 10 procent van de stemrechten in een onderneming of instelling, of het rechtstreeks
      of middellijk kunnen uitoefenen van een daarmee vergelijkbare zeggenschap in een onderneming of instelling;
      bij het bepalen van het aantal stemrechten, dat iemand in een onderneming of instelling heeft, worden tot
      diens stemrechten mede gerekend de stemrechten waarover hij beschikt of geacht wordt te beschikken op grond van
      [artikel 13 van de Wet melding zeggenschap en kapitaalbelang in effectenuitgevende instellingen][ref1];

      n. dochtermaatschappij: een onderneming of instelling als omschreven in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref2];

      o. groep: een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref3], met dien verstande
      dat indien een natuurlijk persoon, rechtspersoon of vennootschap:

      1°. via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of

      2°. in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref4], dan wel, voor zover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie,

      die natuurlijke persoon, rechtspersoon of vennootschap tezamen met die andere natuurlijke persoon, rechtspersoon of
      vennootschap dan wel natuurlijke personen, rechtspersonen of vennootschappen wordt aangemerkt als groep;

      p. elektronisch geld: een geldswaarde die is opgeslagen op een elektronische drager of een geldswaarde die op
      afstand is opgeslagen in een centrale rekeningadministratie;

      q. Lid-Staat van herkomst: ingeval een kredietinstelling een rechtspersoon is, de Lid-Staat waar een
      kredietinstelling haar zetel heeft, dan wel, ingeval de kredietinstelling niet een rechtspersoon is, de Lid-Staat
      waar zij haar hoofdbestuur heeft;

      r. Lid-Staat van ontvangst: de Lid-Staat waar een kredietinstelling een bijkantoor heeft of waarheen zij diensten
      verricht;

      s. bevoegde instanties: de administratieve of rechterlijke instanties die bevoegd zijn ter zake van
      saneringsmaatregelen;

      t. saneringsmaatregel: de noodregeling, bedoeld in [hoofdstuk X][ref5], of een maatregel, genomen in een andere
      Lid-Staat dan Nederland, die enigerlei optreden van de aldaar bevoegde instanties behelst en bestemd is om de
      financiële positie van een kredietinstelling in stand te houden of te herstellen, en van dien aard is dat de
      maatregel bestaande rechten van derden kunnen aantasten;

      u. bewindvoerder: de bewindvoerder, bedoeld in [artikel 71, zevende lid][ref6], of een ander persoon of orgaan,
      aangewezen door de bevoegde instanties in een andere Lid-Staat dan Nederland om de saneringsmaatregelen uit te
      voeren;

      v. financiële instrumenten: instrumenten als bedoeld in deel B van de bijlage bij [richtlijn nr. 93/22/EEG]
      (31993L0022) van de Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op
      het gebied van beleggingen in effecten (PbEG L 147).

      2 De Bank wordt niet beschouwd als kredietinstelling in de zin van deze wet.


