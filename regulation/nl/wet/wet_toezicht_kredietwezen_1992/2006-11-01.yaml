  - number: '83'
    text: |-
      1 Aan ondernemingen en instellingen, die niet ingevolge [artikel 52, tweede lid][ref1], zijn geregistreerd, is
      het verboden het woord "bank" of vertalingen of vormen daarvan te bezigen in hun naam of bij de uitoefening van
      hun bedrijf, tenzij zulks in zodanige samenhang geschiedt, dat daaruit duidelijk blijkt, dat de desbetreffende
      onderneming of instelling niet werkzaam is op financiële markten.

      2 Het in het eerste lid genoemde verbod is niet van toepassing op:

      a. de Bank;

      b. de representatieve organisaties; en

      c. iedere in een andere Lid-Staat gevestigde onderneming of instelling die van de toezichthoudende autoriteit
      van die andere Lid-Staat een voor de uitoefening van het bedrijf van kredietinstelling benodigde vergunning heeft
      verkregen.

      3 Onze Minister kan vrijstelling verlenen van het in het eerste lid genoemde verbod. Onze Minister kan aan de
      vrijstelling beperkingen stellen of voorschriften verbinden.

      4 De Bank kan ontheffing verlenen van het in het eerste lid genoemde verbod. De Bank kan aan de ontheffing
      beperkingen stellen of voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel83
