    text: |-
      1 Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], die een vergunning
      als bedoeld in artikel 6 heeft verkregen en die voornemens is één of meerdere van de werkzaamheden genoemd in
      bijlage I van de Richtlijn uit te oefenen door middel van een bijkantoor in een andere Lid-Staat, dient, alvorens
      daartoe over te gaan, de Bank van haar voornemen schriftelijk kennis te geven. Het is de kredietinstelling verboden
      om aan haar voornemen gevolg te geven zolang de mededeling als bedoeld in het derde lid niet is gedaan.

      2 De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:

      a. de Lid-Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie - met inbegrip van de financiële administratie en de interne controle - ten behoeve van
      het bijkantoor zijn vermeld;

      c. de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering, met
      uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2];

      d. het adres van het bijkantoor; en

      e. de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen.

      3 De Bank doet binnen dertien weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de
      gegevens als bedoeld in het tweede lid, mededeling van die gegevens, van de omvang van het eigen vermogen en
      de solvabiliteitsratio van de kredietinstelling alsmede omtrent de toepasselijkheid van de ingevolge artikel
      84 tot stand gekomen garantieregeling op de verplichtingen van het bijkantoor van de kredietinstelling aan
      de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de
      kredietinstelling schriftelijk van het doen van deze mededeling in kennis.

      4 Indien de Bank van oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor als bedoeld in het eerste lid voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen aan de
      regels, bedoeld in de [artikelen 20][ref3], [21][ref4], [22][ref5] en [22a][ref6], doet zij, in afwijking van het
      derde lid, geen mededeling aan de toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder
      *a*. De Bank stelt de kredietinstelling hiervan, binnen dertien weken na ontvangst van de kennisgeving als bedoeld
      in het eerste lid en de gegevens als bedoeld in het tweede lid, in kennis.

      5 Indien zich een wijziging van de gegevens als bedoeld in het tweede lid, onder *b* tot en met *d*, dan wel
      met betrekking tot de toepasselijkheid van de ingevolge artikel 84 tot stand gekomen garantieregeling op de
      verplichtingen van het bijkantoor van de kredietinstelling voordoet of indien het voornemen bestaat om het
      verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het eerste lid te staken, stelt de
      kredietinstelling de Bank en de toezichthoudende autoriteit van de andere Lid-Staat daarvan ten minste vier weken
      voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk in kennis.

      6 Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van
      oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het bijkantoor als
      bedoeld in het eerste lid verricht, redelijkerwijs niet langer zal kunnen voldoen aan de regels, bedoeld in
      de [artikelen 20][ref7], [21][ref8], [22][ref9] en [22a][ref10], kan zij aan de kredietinstelling ter zake een
      aanwijzing geven om binnen een door haar te bepalen termijn ten aanzien van met name aan te geven punten een
      bepaalde gedragslijn te volgen.

      7 Indien de Bank niet binnen de door haar in de aanwijzing bepaalde termijn een haar bevredigend antwoord van de
      kredietinstelling heeft ontvangen of indien naar haar oordeel niet of onvoldoende aan haar aanwijzing gevolg is
      gegeven, trekt zij de mededeling als bedoeld in het derde lid in. De Bank stelt de toezichthoudende autoriteit van
      de andere Lid-Staat en de kredietinstelling schriftelijk van het intrekken van de mededeling in kennis.

      8 Zodra de mededeling als bedoeld in het derde lid is ingetrokken, is het de kredietinstelling verboden nog langer
      werkzaamheden te verrichten door middel van het bijkantoor als bedoeld in het eerste lid.


