  - number: '20'
    text: |-
      1 De Bank kan aan de kredietinstellingen regels stellen, al dan niet tevens op geconsolideerde basis, in het belang
      van hun solvabiliteit.

      2 De regels worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve organisaties.
      Het overleg over wijziging van de regels kan worden geopend door de Bank dan wel door de betrokken representatieve
      organisatie. De regels kunnen voor onderscheiden groepen van kredietinstellingen verschillend zijn. Aan een
      centrale kredietinstelling kunnen ook regels worden gegeven, die betrekking hebben op de collectiviteit van de
      bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan niet tezamen met de centrale
      kredietinstelling zelf.

      3 De regels kunnen uitsluitend inhouden:

      a. bepalingen inzake het eigen vermogen, dat ten minste dient te worden aangehouden in verhouding tot

      (1). de naar risicograad gewogen kredietuitzettingen, beleggingen en overige activa;

      (2). de naar risicograad gewogen verplichtingen buiten de balanstelling;

      (3). de rente-, wisselkoers- en andere marktrisico's;

      (4). de deelnemingen in andere ondernemingen of instellingen;

      (5). de onder (1), (2), (3) of (4) vallende afzonderlijke posten, voor zover zij een bepaald percentage van het
      eigen vermogen te boven gaan;

      b. het verbod, de beperking of het aan voorschriften binden van

      (1). de kredietuitzettingen, beleggingen en overige activa;

      (2). de verplichtingen buiten de balanstelling;

      (3). de rente-, wisselkoers- en andere marktrisico's;

      (4). de deelnemingen in andere ondernemingen of instellingen;

      c. bepalingen inzake de omvang, al dan niet in verhouding tot het eigen vermogen, van

      (1). de kredietuitzettingen, beleggingen en overige activa;

      (2). de verplichtingen buiten de balanstelling;

      (3). de rente-, wisselkoers- en andere marktrisico's;

      (4). de deelnemingen in andere ondernemingen of instellingen;

      d. bepalingen inzake de reikwijdte van consolidatie.

      4 De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de regels verlenen, mits de
      solvabiliteit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende is gewaarborgd. De Bank
      kan aan de ontheffing beperkingen stellen en voorschriften verbinden.

      5 In de regels wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel20
  - number: '21'
    text: |-
      1 De Bank kan aan de kredietinstellingen regels stellen in het belang van hun liquiditeit.

      2 De regels worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve organisaties.
      Het overleg over wijziging van de regels kan worden geopend door de Bank dan wel door de betrokken representatieve
      organisatie. De regels kunnen voor onderscheiden groepen van kredietinstellingen verschillend zijn. Aan een
      centrale kredietinstelling kunnen ook regels worden gegeven, die betrekking hebben op de collectiviteit van de
      bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan niet tezamen met de centrale
      kredietinstelling zelf.

      3 De regels kunnen uitsluitend inhouden bepalingen inzake de minimale omvang der liquide middelen of onderdelen
      daarvan in verhouding tot

      (1). de ter beschikking verkregen gelden of bepaalde onderdelen van die gelden;

      (2). de van elke crediteur afzonderlijk ter beschikking verkregen gelden, voor zover deze een bepaald percentage
      van het totaal der ter beschikking verkregen gelden te boven gaan.

      4 De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de regels verlenen, mits de
      liquiditeit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende is gewaarborgd. De Bank kan
      aan de ontheffing beperkingen stellen en voorschriften verbinden.

      5 In de regels wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel21
  - number: '22'
    text: |-
      1 De Bank kan aan de kredietinstellingen regels stellen met betrekking tot de administratieve organisatie – met
      inbegrip van de financiële administratie – en de interne controle.

      2 De regels worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve organisaties.
      Het overleg over wijziging van de regels kan worden geopend door de Bank dan wel door de betrokken representatieve
      organisatie. De regels kunnen voor onderscheiden groepen van kredietinstellingen verschillend zijn. Aan een
      centrale kredietinstelling kunnen ook regels worden gegeven, die betrekking hebben op de collectiviteit van de
      bij de betrokken centrale kredietinstelling aangesloten kredietinstellingen, al dan niet tezamen met de centrale
      kredietinstelling zelf.

      3 De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling geheel of
      gedeeltelijk ontheffing van de regels verlenen. De Bank kan aan de ontheffing beperkingen stellen en voorschriften
      verbinden.

      4 In de regels wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent de aanbevelingen en regels worden
      gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel22
  - number: 22a
    text: |-
      Met het oog op een integere bedrijfsvoering worden bij of krachtens algemene maatregel van bestuur aan de
      kredietinstellingen regels gesteld ter zake van:

      a. het tegengaan van verstrengeling van tegenstrijdige belangen;

      b. het voorkomen van betrokkenheid van de kredietinstelling en van haar werknemers bij strafbare feiten die het
      vertrouwen in de kredietinstelling of in de financiële markten in het algemeen schaden;

      c. het voorkomen van betrokkenheid van de kredietinstelling en van haar werknemers bij handelingen die anderszins
      in het maatschappelijk verkeer zodanig onaanvaardbaar zijn, dat deze het vertrouwen in de kredietinstelling of in
      de financiële markten in het algemeen schaden;

      d. het vaststellen van de identiteit, de aard en de achtergrond van de cliënten van de kredietinstelling;

      e. andere bij algemene maatregel van bestuur te noemen onderwerpen.

      Tot deze regels behoren niet de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
