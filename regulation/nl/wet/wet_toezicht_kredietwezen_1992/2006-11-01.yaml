        artikel: 90n
        hoofdstuk: XIIIC
  - number: 90v
    text: |-
      De werkzaamheden in verband met het op grond van [artikel 90n][ref1] ter openbare kennis brengen van een feit
      worden verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan
      voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel90n
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel90v
