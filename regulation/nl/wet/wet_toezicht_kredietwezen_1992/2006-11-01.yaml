  - number: '49'
    text: |-
      1 Een financiële instelling, die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid,
      heeft verkregen en die het bedrijf, dat zij in Nederland uitoefent, door middel van het verrichten van diensten in
      een andere Lid-Staat voor de eerste maal na de verkrijging van de verklaring van ondertoezichtstelling als bedoeld
      in artikel 45, eerste lid, in die Lid-Staat uitoefent dan wel voornemens is uit te oefenen, dient de Bank daarvan
      schriftelijk kennis te geven.

      2 De kennisgeving als bedoeld in het eerste lid dient te geschieden onder opgave van:

      a. de Lid-Staat waarin de financiële instelling de werkzaamheden voornemens is te verrichten;

      b. de werkzaamheden welke de financiële instelling voornemens is te verrichten.

      3 De Bank doet binnen vier weken na ontvangst van de kennisgeving als bedoeld in het eerste lid en de gegevens
      als bedoeld in het tweede lid, mededeling van de gegevens als bedoeld in het tweede lid, onder *b*, aan de
      toezichthoudende autoriteit van de Lid-Staat als bedoeld in het tweede lid, onder *a*. De Bank stelt de financiële
      instelling schriftelijk van het doen van deze mededeling in kennis.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel49
  - number: '50'
    text: |-
      1 Een financiële instelling die in een andere Lid-Staat, niet-zijnde een Lid-Staat ten aanzien waarvan Onze
      minister een maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, is gevestigd en die in die Lid-Staat
      een met de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, vergelijkbare verklaring
      heeft verkregen, is het, onverminderd de toepasselijkheid van andere op haar werkzaamheden betrekking hebbende
      wettelijke voorschriften, slechts toegestaan om, voor zover het werkzaamheden genoemd in bijlage I van de Richtlijn
      betreft, uitsluitend de werkzaamheden vermeld in het programma van werkzaamheden als bedoeld onder *a*, (1), door
      middel van een bijkantoor in Nederland te verrichten, indien

      a. de Bank een kennisgeving heeft ontvangen van de toezichthoudende autoriteit van de andere Lid-Staat, welke
      bevat:

      (1). een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het
      bijkantoor zijn vermeld;

      (2). het adres van het bijkantoor;

      (3). de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen;

      (4). de omvang van het eigen vermogen van de financiële instelling; en

      (5). de solvabiliteitsratio op geconsolideerde basis van de kredietinstelling of kredietinstellingen waarvan de
      financiële instelling dochtermaatschappij is; en

      b. de Bank de ontvangst van de kennisgeving bedoeld onder a aan de financiële instelling heeft medegedeeld dan
      wel er acht weken zijn verstreken vanaf het tijdstip waarop de Bank de kennisgeving als bedoeld onder *a* heeft
      ontvangen.

      2 De in een andere Lid-Staat gevestigde financiële instelling als bedoeld in het eerste lid dient de Bank en de
      toezichthoudende autoriteit van die andere Lid-Staat ten minste vier weken van te voren in kennis te stellen van
      elke wijziging van de gegevens als bedoeld in het eerste lid, onder *a*, sub (1), (2) of (3) of, in voorkomend
      geval, van het voornemen om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het
      eerste lid te staken.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel50
  - number: '51'
    text: |-
      Een financiële instelling die in een andere Lid-Staat, niet-zijnde een Lid-Staat ten aanzien waarvan Onze minister
      een maatregel als bedoeld in artikel 33, eerste lid, heeft genomen, is gevestigd en die in die Lid-Staat een met
      de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, vergelijkbare verklaring heeft
      verkregen, is het, onverminderd de toepasselijkheid van andere op haar werkzaamheden betrekking hebbende wettelijke
      voorschriften, slechts toegestaan om, voor zover het werkzaamheden genoemd in bijlage I van de Richtlijn betreft,
      uitsluitend de in de kennisgeving vermelde werkzaamheden door middel van het verrichten van diensten in Nederland
      te verrichten, indien de financiële instelling een kennisgeving heeft gezonden aan de toezichthoudende autoriteit
      van die andere Lid-Staat, welke bevat een opgave van de voorgenomen werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel51
  - number: '52'
    text: |-
      1 Er is een register dat door de zorg van de Bank wordt gehouden.

      2 De Bank draagt zorg voor de inschrijving van iedere kredietinstelling:

      a. die een vergunning als bedoeld in artikel 6 heeft verkregen;

      b. die een vergunning als bedoeld in artikel 38, eerste lid heeft verkregen;

      c. die krachtens artikel 31 in Nederland het bedrijf van kredietinstelling mag uitoefenen;

      d. die krachtens artikel 32 of 32a in Nederland haar werkzaamheden door middel van het verlenen van diensten mag
      verrichten;

      en van iedere financiële instelling:

      e. die een verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft verkregen;

      f. die krachtens artikel 50 werkzaamheden in Nederland mag verrichten; en

      g. die krachtens artikel 51 werkzaamheden in Nederland mag verrichten.

      3 De Bank draagt zorg voor de doorhaling van een inschrijving van iedere kredietinstelling:

      a. waarvan de vergunning als bedoeld in artikel 6 is ingetrokken;

      b. waarvan de vergunning als bedoeld in artikel 38, eerste lid is ingetrokken;

      c. die niet langer krachtens artikel 31 in Nederland het bedrijf van kredietinstelling mag uitoefenen;

      d. die niet langer krachtens artikel 32 of 32a in Nederland haar werkzaamheden door middel van het verlenen van
      diensten mag verrichten;

      en van iedere financiële instelling:

      e. waarvan de verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, is ingetrokken;

      f. die niet langer krachtens artikel 50 werkzaamheden in Nederland mag verrichten; en

      g. die niet langer krachtens artikel 51 werkzaamheden in Nederland mag verrichten.

      4 Van de inschrijving dan wel de doorhaling van een inschrijving in het register van een kredietinstelling of
      financiële instelling wordt door de zorg van de Bank binnen twee weken na de dag, waarop deze heeft plaats gehad,
      mededeling gedaan in de *Staatscourant*.

      5 In de maand januari van elk jaar wordt door de zorg van de Bank een afschrift van het register naar de stand per
      31 december van het voorafgaande jaar in de *Staatscourant* geplaatst.

      6 Een afschrift van het register ligt voor een ieder kosteloos ter inzage ten kantore van de Bank.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel52
  - number: '53'
    text: |-
      De Bank kan bij iedere onderneming of instelling ten aanzien waarvan kan worden vermoed dat deze handelt in strijd
      met de bij of krachtens deze wet gestelde regels, alle inlichtingen inwinnen of doen inwinnen die redelijkerwijs
      nodig zijn om dit te beoordelen.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel53
  - number: '54'
    text: |-
      1 De Bank kan bij:

        - iedere kredietinstelling die ingevolge [artikel 52, tweede lid, onder a, b, of c][ref1], is geregistreerd;
        - iedere onderneming of instelling die, overeenkomstig het bepaalde ingevolge
      [artikel 20, derde lid, onder d][ref2], dan wel overeenkomstig het bepaalde ingevolge
      [artikel 25, tweede lid, onder c][ref3], binnen de reikwijdte van de consolidatie valt;
        - iedere onderneming of instelling die met een onder a genoemde kredietinstelling in een groep is verbonden;
        - iedere onderneming of instelling die een gekwalificeerde deelneming houdt als bedoeld in
      [artikel 24, eerste lid][ref4], en [artikel 30d, eerste lid][ref5],

      alle inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de uitoefening van de taken en
      bevoegdheden die zij op grond van deze wet heeft en teneinde na te gaan of de bij of krachtens deze wet gestelde
      bepalingen worden nageleefd.

      2 Ten aanzien van personen die door de Bank zijn belast met het inwinnen van inlichtingen of met de
      uitoefening van andere taken en bevoegdheden die de Bank heeft op grond van het bij of krachtens deze
      wet bepaalde, zijn de [artikelen 5:12][ref6], [5:13][ref7], [5:15][ref8], [5:16][ref9], [5:17][ref10] en
      [5:20 van de Algemene wet bestuursrecht][ref11] van overeenkomstige toepassing, met dien verstande dat indien
      een onderzoek als bedoeld in [artikel 66, eerste lid][ref12], wordt ingesteld, degene bij wie het onderzoek wordt
      ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in
      zakelijke gegevens en bescheiden.


