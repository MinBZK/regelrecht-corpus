  - number: 76d
    text: |-
      De rechter-commissaris houdt toezicht op de in [artikel 75, eerste lid][ref1], bedoelde overdracht
      onderscheidenlijk liquidatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel75
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel76d
