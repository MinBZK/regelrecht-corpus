  - number: '59'
    text: |-
      De artikelen 54, 55 en 57 zijn van overeenkomstige toepassing met betrekking tot een financiële instelling die een
      verklaring van ondertoezichtstelling als bedoeld in artikel 45, eerste lid, heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel59
  - number: '60'
    text: |-
      1 Ingeval een onderneming of instelling als bedoeld in [artikel 54, eerste lid][ref1], in een andere Lid-Staat is
      gevestigd, kan de Bank, ten behoeve van het toezicht:

      a. de bevoegde instantie in de andere Lid-Staat verzoeken zich ter plaatse van de juistheid van de aan de Bank
      verstrekte inlichtingen te overtuigen; dan wel

      b. zich, na daartoe van de bevoegde instantie in de andere Lid-Staat toestemming te hebben verkregen, ter plaatse
      van de juistheid van de aan de Bank verstrekte inlichtingen overtuigen of te doen overtuigen.

      2 Ingeval van een bijkantoor als bedoeld in [artikel 16, eerste lid][ref2], of [artikel 48, eerste lid][ref3], kan
      de Bank, ten behoeve van het toezicht:

      a. de toezichthoudende autoriteit van de andere Lid-Staat verzoeken zich ter plaatse van de juistheid van de aan de
      Bank verstrekte inlichtingen te overtuigen; dan wel

      b. zich, na daaromtrent de toezichthoudende autoriteit van de andere Lid-Staat in kennis te hebben gesteld, ter
      plaatse van de juistheid van de aan de Bank verstrekte inlichtingen overtuigen of te doen overtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel48
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel60
