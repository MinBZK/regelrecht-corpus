      van de bevoegdheid bedoeld in het eerste lid.

      4 Bij algemene maatregel van bestuur kan de bevoegdheid van Onze minister tot het opleggen van een bestuurlijke
      boete worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van deze
      wet jegens Onze minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen. Het
      [vijfde en zesde lid van artikel 90b][ref68] zijn van overeenkomstige toepassing.


