  - number: '61'
    text: |-
      1 Ingeval, in overeenstemming met de Richtlijn, ten behoeve van het toezicht op kredietinstellingen in een
      andere Lid-Staat door dan wel omtrent een in Nederland gevestigde onderneming of instelling inlichtingen aan de
      toezichthoudende autoriteiten van die Lid-Staat zijn verstrekt, zal de Bank na daartoe door de toezichthoudende
      autoriteit van de desbetreffende Lid-Staat te zijn verzocht:

      a. zich ter plaatse van de juistheid van de aan de toezichthoudende autoriteit van de andere Lid-Staat verstrekte
      inlichtingen overtuigen; dan wel

      b. de toezichthoudende autoriteit van de andere Lid-Staat toestaan zich ter plaatse van de juistheid van de aan
      haar verstrekte inlichtingen te overtuigen of te doen overtuigen.

      2 Ingeval van een bijkantoor als bedoeld in [artikel 31, eerste lid][ref1], of [artikel 50, eerste lid][ref2], zal,
      ten behoeve van het toezicht in de andere Lid-Staat:

      a. de Bank zich, op verzoek van de toezichthoudende autoriteit van de andere Lid-Staat, ter plaatse van de
      juistheid van de aan die toezichthoudende autoriteit verstrekte inlichtingen overtuigen; dan wel

      b. de toezichthoudende autoriteit van de andere Lid-Staat, wanneer deze daaromtrent de Bank in kennis heeft
      gesteld, zich ter plaatse van de juistheid van de aan haar verstrekte inlichtingen overtuigen of te doen
      overtuigen.

      3 Degene bij wie de juistheid van inlichtingen wordt geverifieerd als bedoeld in het tweede lid, onderdeel b,
      verleent aan de in het tweede lid, onderdeel b, bedoelde toezichthoudende autoriteit en diens functionarissen alle
      medewerking die nodig is voor een goede uitvoering van die verificatie, met dien verstande dat degene bij wie het
      onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen
      van inzage in zakelijke gegevens en bescheiden. De Bank kan aan die verificatie deelnemen of door personen, door
      haar bij uitdrukkelijke en bijzondere machtiging aangewezen, doen deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel50
