  - number: 81b
    text: |-
      1 Indien een kredietinstelling die is gevestigd in een Staat die geen Lid-Staat is een bijkantoor heeft in
      Nederland en een of meer bijkantoren in andere Lid-Staten, trachten zowel de rechtbank als de Bank hun optreden te
      coördineren met de bevoegde instanties onderscheidenlijk de toezichthoudende autoriteiten van die andere lidstaten.

      2 In het in het eerste lid bedoelde geval trachten de in Nederland benoemde bewindvoerders hun optreden te
      coördineren met de bewindvoerders in de andere Lid-Staten waarin aan de kredietinstelling een vergunning is
      verleend.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel81b
  - number: '82'
    text: |-
      1 Het is een ieder verboden bedrijfsmatig al dan niet op termijn opvorderbare gelden van het publiek aan te
      trekken, ter beschikking te verkrijgen of ter beschikking te hebben dan wel in enigerlei vorm te bemiddelen ter
      zake van het bedrijfsmatig van het publiek aantrekken of ter beschikking verkrijgen van al dan niet op termijn
      opvorderbare gelden.

      2 De in het eerste lid genoemde verboden zijn niet van toepassing op:

      a. ondernemingen en instellingen als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1], welke
      ingevolge [artikel 52, tweede lid, onder a, b, c of d][ref2], zijn geregistreerd;

      b. de Bank;

      c. de Lid-Staten, alsmede de regionale of locale overheden van de Lid-Staten; en

      d. internationaal publiekrechtelijke instellingen waarin of waaraan één of meer Lid-Staten deelnemen.

      3 Bij ministeriële regeling kan vrijstelling worden verleend van de in het eerste lid genoemde verboden, indien
      de belangen die deze wet beoogt te beschermen naar het oordeel van Onze minister anderszins voldoende worden
      beschermd. Aan een vrijstelling kunnen beperkingen worden gesteld en voorschriften worden verbonden.

      4 De Bank kan ontheffing verlenen van de in het eerste lid genoemde verboden, indien de belangen die deze wet
      beoogt te beschermen naar haar oordeel anderszins voldoende worden beschermd. Bij of krachtens algemene maatregel
      van bestuur kunnen regels worden gesteld ten aanzien van het verlenen van de ontheffing. Daarbij kunnen regels
      worden gesteld waaraan de houder van een ontheffing dient te voldoen. Aan een ontheffing kunnen beperkingen worden
      gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel82
