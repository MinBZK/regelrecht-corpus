  - number: 30b
    text: |-
      1 De Bank kan aan de kredietinstellingen regels stellen, al dan niet tevens op geconsolideerde basis, in het belang
      van hun solvabiliteit en liquiditeit.

      2 De regels worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve organisaties.
      Het overleg over wijziging van de regels kan worden geopend door de Bank dan wel door de betrokken representatieve
      organisatie. De regels kunnen voor de verschillende categorieën van kredietinstellingen verschillend zijn.

      3 De regels kunnen uitsluitend inhouden:

      a. bepalingen inzake het eigen vermogen dat ten minste dient te worden aangehouden in verhouding tot de financiële
      verplichtingen die met uitgegeven elektronisch geld verband houden;

      b. de beperking ten aanzien van of het aan voorschriften binden van:

      1°. de beleggingen en overige activa;

      2°. de verplichtingen buiten de balanstelling;

      3°. de rente-, wisselkoers- en andere marktrisico's;

      c. bepalingen inzake de minimale omvang van de liquide middelen of onderdelen daarvan in verhouding tot de ter
      beschikking verkregen gelden.

      4 De Bank kan aan een kredietinstelling geheel of gedeeltelijk ontheffing van de regels verlenen, indien de
      liquiditeit en de solvabiliteit van die kredietinstelling naar het oordeel van de Bank anderszins voldoende zijn
      gewaarborgd. De Bank kan aan de ontheffing beperkingen stellen en voorschriften verbinden.

      5 In de regels wordt bepaald, wat wordt verstaan onder de begrippen, waaromtrent regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel30b
  - number: 30c
    text: |-
      1 De Bank kan aan de kredietinstellingen regels stellen met betrekking tot de administratieve organisatie – met
      inbegrip van de financiële administratie – en de interne controle.

      2 De regels worden slechts gegeven of gewijzigd na overleg met de daarbij betrokken representatieve organisaties.
      Het overleg over wijziging van de regels kan worden geopend door de Bank dan wel door de betrokken representatieve
      organisatie. De regels kunnen voor de verschillende categorieën van kredietinstellingen verschillend zijn.

      3 De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling geheel of
      gedeeltelijk ontheffing van de regels verlenen. De Bank kan aan de ontheffing beperkingen stellen en voorschriften
      verbinden.

      4 In de regels wordt bepaald, wat wordt verstaan onder de begrippen waaromtrent de regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel30c
  - number: 30ca
    text: |-
      Met het oog op een integere bedrijfsvoering worden bij of krachtens algemene maatregel van bestuur aan de
      kredietinstellingen regels gesteld ter zake van:

      a. het tegengaan van verstrengeling van tegenstrijdige belangen;

      b. het voorkomen van betrokkenheid van de kredietinstelling en van haar werknemers bij strafbare feiten die het
      vertrouwen in de kredietinstelling of in de financiële markten in het algemeen schaden;

      c. het voorkomen van betrokkenheid van de kredietinstelling en van haar werknemers bij handelingen die anderszins
      in het maatschappelijk verkeer zodanig onaanvaardbaar zijn, dat deze het vertrouwen in de kredietinstelling of in
      de financiële markten in het algemeen schaden;

      d. het vaststellen van de identiteit, de aard en de achtergrond van de cliënten van de kredietinstelling;

      e. andere bij algemene maatregel van bestuur te noemen onderwerpen.

      Tot deze regels behoren niet de effectentypische gedragsregels, bedoeld in artikel
      [18a van de Wet toezicht effectenverkeer 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
