  - number: '68'
    text: |-
      1 De Bank werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op
      kredietinstellingen die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht verzekeringsbedrijf 1993][ref1], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref2],
      de [Wet toezicht beleggingsinstellingen][ref3] (*Stb.* 1990, 380) onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref4] belast zijn met het toezicht op verzekeraars, beleggingsinstellingen
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep behoren.

      2 De Bank pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in
      het eerste lid.

      3 De Bank werkt, in de gevallen bedoeld in het eerste lid, waar nodig samen op basis van een of meer daartoe met
      een autoriteit als bedoeld in het eerste lid overeen te komen regelingen. Deze regelingen betreffen in elk geval
      afspraken over het stellen van gemeenschappelijke eisen, het coördineren van werkzaamheden uit hoofde van ieders
      uitoefening van het toezicht en het uitwisselen van gegevens en inlichtingen.

      4 De Bank verstrekt aan een autoriteit als bedoeld in het eerste lid danwel de autoriteit die belast is met de
      uitvoering van de [Wet inzake de geldtransactiekantoren](onbekend) of de [Wet toezicht trustkantoren][ref5] de
      gegevens of inlichtingen die zij verkregen heeft bij de vervulling van de haar ingevolge deze wet opgedragen taak
      en die betrekking hebben op de deskundigheid van personen als bedoeld in [artikel 9, eerste lid, onder ][ref6],
      onderscheidenlijk de voornemens of antecedenten van personen als bedoeld in [artikel 9, eerste lid, onder ][ref7],
      voor zover de Bank van oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het
      toezicht dat door die andere autoriteit wordt uitgeoefend.

      5 De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 65, eerste lid][ref8].


