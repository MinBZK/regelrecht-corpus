  - number: '10'
    text: |-
      1 Het dagelijks beleid van een kredietinstelling dient door ten minste twee personen te worden bepaald.

      2 De personen die het dagelijks beleid van een kredietinstelling bepalen, verrichten hun werkzaamheden in verband
      daarmee vanuit Nederland.

      3 Een kredietinstelling, die een naamloze vennootschap of een besloten vennootschap met beperkte aansprakelijkheid
      is, dient een ten minste uit drie leden bestaande raad van commissarissen te hebben als bedoeld in de artikelen 140
      onderscheidenlijk 250 van Boek 2 van het Burgerlijk Wetboek.

      4 Een kredietinstelling, die niet een naamloze vennootschap of een besloten vennootschap met beperkte
      aansprakelijkheid is, dient een ten minste uit drie leden bestaand orgaan te hebben dat een met die van een raad
      van commissarissen vergelijkbare taak heeft.

      5 De Bank kan aan een kredietinstelling, die niet is een naamloze vennootschap of een besloten vennootschap met
      beperkte aansprakelijkheid waarop artikel 158 of artikel 268 van Boek 2 van het Burgerlijk Wetboek van toepassing
      is, geheel of gedeeltelijk ontheffing van het in het derde of vierde lid bepaalde verlenen en aan deze ontheffing
      voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel10
  - number: '11'
    text: |-
      1 Een kredietinstelling dient te beschikken over een minimum bedrag aan eigen vermogen.

      2 Het bedrag bedoeld in het eerste lid wordt door de Bank bepaald.

      3 Het bedrag bedoeld in het eerste lid kan voor onderscheiden groepen kredietinstellingen verschillend worden
      bepaald.

      4 Bij de vaststelling van het bedrag bedoeld in het eerste lid wordt bepaald wat daarbij voor de onderscheiden
      rechtsvormen onder eigen vermogen wordt verstaan.

      5 De Bank kan in bijzondere gevallen of onder bijzondere omstandigheden aan een kredietinstelling, voor een door
      de Bank te bepalen termijn, geheel of gedeeltelijk ontheffing verlenen van hetgeen zij op basis van het tweede en
      derde lid heeft bepaald. De Bank kan aan de ontheffing beperkingen stellen en voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel11
  - number: '12'
    text: |-
      1 De Bank kan ten aanzien van een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] besluiten dat de artikelen 8, tweede lid, met uitzondering
      van onderdeel *e*, 9 eerste lid, met uitzondering van onderdeel *f*, of derde lid, 10, 11, 13, 14, 15, eerste
      lid, onderdeel *c*, onderdeel *d* - behoudens voor zover dit onderdeel betrekking heeft op artikel 9, eerste lid,
      onderdeel *f* - of onderdeel *g*, dan wel 30 geheel of gedeeltelijk buiten toepassing blijven, mits

      a. de kredietinstelling is aangesloten bij een centrale kredietinstelling;

      b. de centrale kredietinstelling erop toeziet dat de aangesloten kredietinstelling de regels als bedoeld in de
      [artikelen 20][ref2], [21][ref3], [22][ref4] en [22a][ref5] naleeft;

      c. de centrale kredietinstelling en de bij haar aangesloten kredietinstellingen hoofdelijk instaan voor elkaars
      verplichtingen dan wel de verplichtingen van de aangesloten kredietinstelling door de centrale kredietinstelling
      worden gegarandeerd;

      d. de centrale kredietinstelling naar het oordeel van de Bank voldoende bevoegd is instructies te geven aan de
      aangesloten kredietinstelling; en

      e. het ingevolge artikel 20 uitgeoefende toezicht op de centrale kredietinstelling en de aangesloten
      kredietinstelling op geconsolideerde basis wordt uitgeoefend.

      2 De Bank kan aan haar beslissing als bedoeld in het eerste lid voorschriften verbinden.


