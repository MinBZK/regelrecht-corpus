  - number: 75b
    text: |-
      Ten aanzien van een kredietinstelling die is gevestigd in een Staat die niet een Lid-Staat is, hebben de
      machtigingen betrekking op het vanuit haar bijkantoren in Nederland uitgeoefende bedrijf van kredietinstelling.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel75b
  - number: '76'
    text: |-
      1 De bewindvoerders kunnen uitkeringen doen op de vorderingen waarop [artikel 74, eerste lid][ref1], van toepassing
      is, voor zover dit gelet op de liquiditeitspositie van de kredietinstelling verantwoord is te achten en mits is
      voldaan aan de volgende leden.

      2 De bewindvoerders maken een staat op waaruit blijken de aard en het bedrag van de baten en schulden van de
      kredietinstelling, de namen en woonplaatsen van de schuldeisers alsmede het bedrag der vorderingen van iedere
      schuldeiser. Een door de bewindvoerders gewaarmerkt afschrift van deze staat wordt ter kosteloze inzage van een
      ieder ter griffie van de rechtbank nedergelegd.

      3 Op verzoek van de bewindvoerders bepaalt de rechter-commissaris de dag waarop uiterlijk de vorderingen moeten
      worden ingediend, en voorts dag, uur en plaats waarop de verificatievergadering zal worden gehouden. Nadat
      de rechter-commissaris op het verzoek, bedoeld in de eerste volzin, heeft beslist, geven de bewindvoerders
      daarvan onmiddellijk aan alle bekende schuldeisers schriftelijk kennis. Deze kennisgeving betreft in ieder geval
      tevens de gevolgen van het indienen van een vordering na het verstrijken van de termijn, bedoeld in de eerste
      volzin, de mededeling dat de vordering bij de bewindvoerders moet worden ingediend, met, in het voorkomende
      geval, de opgave dat op een voorrecht of goederenrechtelijk recht aanspraak wordt gemaakt. De bewindvoerders
      doen tevens aankondiging van de beschikkingen in de Staatscourant, het Publicatieblad van de Europese Unie,
      alsmede in twee Nederlandse dagbladen en twee landelijke dagbladen van iedere Lid-Staat van ontvangst. Vanaf
      de dag waarop de eerste aankondiging heeft plaatsgevonden vallen de vorderingen die bevoorrecht zijn hetzij
      op zekere bepaalde goederen van de kredietinstelling of, in geval van een bijkantoor in Nederland van een in
      een Staat die niet een Lid-Staat is gevestigde kredietinstelling, op goederen in Nederland, hetzij op al zijn
      goederen onderscheidenlijk de goederen in Nederland, onder de werking van [artikel 74, eerste lid][ref2]. De
      [artikelen 110 tot en met 113 Faillissementswet][ref3] zijn van overeenkomstige toepassing, met dien verstande
      dat hetgeen is bepaald met betrekking tot de curator onderscheidenlijk de gefailleerde van toepassing is op de
      bewindvoerders onderscheidenlijk de kredietinstelling dan wel, in geval van een bijkantoor van een in een Staat die
      niet een Lid-Staat is gevestigde kredietinstelling, het bijkantoor.

      4 Een afschrift van de lijst van voorlopig erkende schuldvorderingen en van de lijst van betwiste vorderingen wordt
      door de bewindvoerders ter griffie van de rechtbank nedergelegd om aldaar gedurende veertien dagen voorafgaande
      aan de verificatievergadering kosteloos voor een ieder ter inzage te liggen. De bewindvoerders geven alle bekende
      schuldeisers voor het begin van deze periode schriftelijk van de nederlegging bericht waarbij zij een nadere
      oproeping tot de verificatievergadering voegen. Voorts doen de bewindvoerders van de nederlegging mededeling in
      het Publicatieblad van de Europese Unie, alsmede in ten minste twee door de rechter-commissaris aan te wijzen
      Nederlandse dagbladen en twee landelijke dagbladen van iedere Lid-Staat van ontvangst.

      5 Met betrekking tot de verificatie zijn de [artikelen 59][ref4], [119][ref5] tot en met [122][ref6],
      [123][ref7] tot en met [127][ref8], [129][ref9], [132][ref10] tot en met [137][ref11], [260][ref12],
      eerste lid, [261][ref13] en het eerste en derde lid van [artikel 262 van de Faillissementswet][ref14] van
      overeenkomstige toepassing. Daarbij zijn de bepalingen met betrekking tot de curator onderscheidenlijk de
      gefailleerde van toepassing op de bewindvoerders onderscheidenlijk de kredietinstelling. In afwijking van de in
      [artikel 127, eerste lid, van de Faillissementswet][ref15] genoemde termijn geldt de termijn die ingevolge het
      derde lid van dit artikel voor de indiening van vorderingen is bepaald. De vorderingen welke opeisbaar worden op of
      na de datum van de beschikking als bedoeld in [artikel 71, eerste of tweede lid][ref16], worden geverifieerd voor
      de waarde welke zij hebben op het tijdstip waarop deze vorderingen opeisbaar worden, met dien verstande dat dit ten
      aanzien van vorderingen welke vallen onder de werking van [artikel 75, eerste lid][ref17], slechts geldt voor zover
      deze bepaling niet reeds op deze vorderingen is toegepast.

      6 De bestuurders van een kredietinstelling dan wel degenen die de feitelijke leiding hebben over het
      bijkantoor wonen de verificatievergadering bij teneinde daar alle inlichtingen over de oorzaken van de
      in [artikel 71, eerste of tweede lid][ref18], bedoelde toestand en de staat van de boedel te geven die
      hun door de rechter-commissaris worden gevraagd. De schuldeisers kunnen de rechter-commissaris verzoeken
      omtrent bepaalde door hen op te geven punten inlichtingen aan de bestuurders dan wel de feitelijke
      leidinggevenden te vragen. De vragen aan de bestuurders dan wel de feitelijke leidinggevenden gesteld en
      de door hen gegeven antwoorden worden in het proces-verbaal opgetekend. In afwijking van het bepaalde in
      [artikel 121, vierde lid, van de Faillissementswet][ref19] levert het proces-verbaal van de verificatievergadering
      ten aanzien van de verbintenissen van de kredietinstelling welke ingevolge [artikel 75][ref20] worden overgedragen
      slechts kracht van gewijsde op voor zover de desbetreffende bedingen niet worden gewijzigd.

      7 Na de verificatie van de schuldvorderingen maken de bewindvoerders een uitdelingslijst op. Zij onderwerpen die
      aan de goedkeuring van de rechter-commissaris. De lijst houdt in een staat van ontvangsten en uitgaven, daaronder
      begrepen het loon van de bewindvoerders, de namen van de schuldeisers, en voorts het geverifieerde bedrag van
      ieders vordering en de daarop te ontvangen uitkering. De [artikelen 180][ref21], tweede lid, [181][ref22] en
      [182, eerste lid, van de Faillissementswet][ref23] zijn van overeenkomstige toepassing. Onverminderd het bepaalde
      in het tiende lid is [artikel 233 van die wet][ref24] eveneens van overeenkomstige toepassing.

      8 Bij het opmaken van de uitdelingslijst wordt met betrekking tot de vorderingen die zijn betwist of waarvan de
      voorrang is betwist of die voorwaardelijk zijn toegelaten een bedrag aan liquide middelen afgezonderd tot ten
      minste het beloop van het totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen zullen
      kunnen worden uitgekeerd, dan wel wordt deze uitkering op andere wijze zeker gesteld.

      9 De door de rechter-commissaris goedgekeurde uitdelingslijst wordt door de bewindvoerders ter griffie van de
      rechtbank nedergelegd om aldaar gedurende veertien dagen kosteloos voor de schuldeisers ter inzage te liggen. De
      bewindvoerders doen van de nederlegging mededeling in de Staatscourant, het Publicatieblad van de Europese Unie,
      alsmede in twee Nederlandse dagbladen en twee landelijke dagbladen van iedere Lid-Staat van ontvangst. Voorts
      geven de bewindvoerders aan ieder der erkende en voorwaardelijk toegelaten schuldeisers schriftelijk van de
      nederlegging kennis, onder vermelding van het voor hem uitgetrokken bedrag. De [artikelen 184][ref25] tot en met
      [186][ref26], [187][ref27], eerste, tweede en derde lid, [189][ref28] en [191 van de Faillissementswet][ref29]
      zijn van overeenkomstige toepassing, met dien verstande dat hetgeen daarin is bepaald met betrekking tot de
      curator van toepassing is op de bewindvoerders en dat in afwijking van de in artikel 184 bedoelde termijn geldt
      de in de eerste zin van dit lid genoemde termijn. Indien ten gevolge van het krachtens [artikel 184][ref30] dan
      wel [artikel 186 van de Faillissementswet][ref31] gedane verzet een verificatiegeschil ontstaat, wordt ten aanzien
      van de vorderingen waarop dit verzet betrekking heeft, het achtste lid van dit artikel overeenkomstig toegepast,
      en kan vervolgens, nadat voor zoveel nodig tevens dienovereenkomstig wijziging van de overige in de ter inzage
      neergelegde lijst opgenomen uitkeringsbedragen heeft plaats gehad, met inachtneming van het overigens in dit
      artikel bepaalde, tot uitkering worden overgegaan. Indien het gedane verzet niet tot een verificatiegeschil leidt,
      kan met inachtneming van het bij de beschikking op het verzet bepaalde tot uitkering worden overgegaan zodra die
      beschikking in kracht van gewijsde is gegaan.

      10 In afwijking van de laatste zin van het zevende lid kan op geverifieerde vorderingen welke opeisbaar worden
      op of na de datum van de beschikking als bedoeld in [artikel 71, eerste of tweede lid][ref32], voor zover
      [artikel 75, eerste lid][ref33], niet reeds op deze vorderingen werd toegepast, een uitkering eerst worden gedaan
      zodra deze vorderingen opeisbaar zijn geworden. Tot dat tijdstip wordt een bedrag aan liquide middelen afgezonderd
      tot ten minste het beloop van het totaal van de bedragen die bij de toepassing van dit artikel op deze vorderingen
      zullen kunnen worden uitgekeerd, dan wel wordt deze uitkering op andere wijze zeker gesteld.


