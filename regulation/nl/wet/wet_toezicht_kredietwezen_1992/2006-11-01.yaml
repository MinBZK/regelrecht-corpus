  - number: '86'
    text: |-
      Kosten, die zijn verbonden aan de uitvoering van deze wet en de krachtens deze wet genomen besluiten, kunnen
      overeenkomstig door Onze minister goed te keuren regelen op de betrokken ondernemingen en instellingen worden
      verhaald.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel86
  - number: '87'
    text: |-
      1 De Bank doet periodiek in de *Staatscourant* mededeling van de voornaamste gegevens, voorkomende in de stukken en
      staten, bedoeld in de artikelen 30, 37, 44 en 55.

      2 Zonder schriftelijke toestemming van de hierbij betrokkenen worden gegevens met betrekking tot afzonderlijke
      ondernemingen en instellingen niet gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel87
  - number: '88'
    text: |-
      De Bank brengt jaarlijks aan Onze minister verslag uit over de uitvoering van deze wet en van de krachtens deze
      wet genomen besluiten. Dit verslag wordt door de zorg van de Bank gepubliceerd, behoudens het gedeelte van het
      verslag, handelende over de uitvoering van de artikelen 10, vijfde lid, 11, vijfde lid, 14, 28, 29, 30, derde lid,
      30e, 35 en 42, met dien verstande dat zonder schriftelijke toestemming van de bij het te publiceren gedeelte van
      het verslag betrokkenen gegevens met betrekking tot afzonderlijke ondernemingen en instellingen niet gepubliceerd
      worden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel88
  - number: 89a
    text: |-
      1 Indien onze minister de Bank advies vraagt over een vrijstelling als bedoeld in de
      [artikelen 6, tweede lid][ref1], [31, vierde lid][ref2], [32, derde lid][ref3], [38, derde lid][ref4],
      [38a, tweede lid][ref5], 82, derde lid, of [83, derde lid][ref6], is de Bank verplicht het advies uit te brengen.

      2 De Bank verstrekt Onze Minister desgevraagd de inlichtingen die nodig zijn voor de beoordeling van de
      uitvoerbaarheid van voorgenomen wettelijke voorschriften en algemene beleidsvoornemens, voor zover deze betrekking
      hebben op het kredietwezen.


