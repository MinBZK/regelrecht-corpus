  - number: 16a
    text: |-
      1 Een kredietinstelling als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 2°][ref1], die een vergunning
      als bedoeld in artikel 6 heeft verkregen en die voornemens is door middel van een bijkantoor in een andere Lid-
      Staat gelden ter beschikking te krijgen in ruil waarvoor elektronisch geld wordt uitgegeven, geeft, alvorens
      daartoe over te gaan, de Bank van haar voornemen schriftelijk kennis. Het is de kredietinstelling verboden om aan
      haar voornemen gevolg te geven zolang de mededeling, bedoeld in het derde lid, niet is gedaan.

      2 De kennisgeving, bedoeld in het eerste lid, geschiedt onder opgave van:

      a. de Lid-Staat waarin de kredietinstelling voornemens is het bijkantoor te vestigen;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden van het bijkantoor en de voorziene
      administratieve organisatie – met inbegrip van de financiële administratie en de interne controle – ten behoeve van
      het bijkantoor zijn vermeld;

      c. de maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering, met
      uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2];

      d. het adres van het bijkantoor; en

      e. de identiteit van de personen die het dagelijks beleid van het bijkantoor zullen bepalen.

      3 De Bank doet binnen dertien weken na ontvangst van de kennisgeving, bedoeld in het eerste lid, en de
      gegevens bedoeld in het tweede lid, mededeling van die gegevens, van de omvang van het eigen vermogen en de
      solvabiliteitsratio van de kredietinstelling aan de toezichthoudende autoriteit van de Lid-Staat bedoeld in het
      tweede lid, onder a. De Bank stelt de kredietinstelling schriftelijk van het doen van deze mededeling in kennis.

      4 Indien de Bank van oordeel is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het
      bijkantoor, bedoeld in het eerste lid, voornemens is te verrichten, redelijkerwijs niet zal kunnen voldoen aan de
      regels, bedoeld in de [artikelen 30b][ref3], [30c][ref4] en [30ca][ref5], doet zij, in afwijking van het derde lid,
      geen mededeling aan de toezichthoudende autoriteit van de Lid-Staat, bedoeld in het tweede lid, onder a. De Bank
      stelt de kredietinstelling hiervan binnen dertien weken na ontvangst van de kennisgeving, bedoeld in het eerste
      lid, en de gegevens, bedoeld in het tweede lid, onder a, in kennis.

      5 Indien zich een wijziging voordoet van de gegevens, bedoeld in het tweede lid, onder b tot en met d, of indien
      het voornemen bestaat om het verrichten van werkzaamheden door middel van het bijkantoor, bedoeld in het eerste
      lid, te staken, stelt de kredietinstelling de Bank en de toezichthoudende autoriteit van de andere Lid-Staat
      daarvan ten minste vier weken voor de wijziging ingaat of het voornemen wordt uitgevoerd, schriftelijk in kennis.

      6 Indien de Bank, op grond van de gegevens waarvan zij ingevolge het vijfde lid kennis heeft genomen, van oordeel
      is dat de kredietinstelling, gezien de werkzaamheden die zij door middel van het bijkantoor, bedoeld in het eerste
      lid, verricht, redelijkerwijs niet langer zal kunnen voldoen aan de regels, bedoeld in de [artikelen 30b][ref6],
      [30c][ref7] en [30ca][ref8], kan zij aan de kredietinstelling ter zake een aanwijzing geven om binnen een door haar
      te bepalen termijn ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.

      7 [Artikel 16, zevende en achtste lid][ref9], zijn van overeenkomstige toepassing.


