  - number: '66'
    text: |-
      1 Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, is Onze Minister onderscheidenlijk de
      Bank bevoegd ten behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag
      of die met Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die
      Staat belast is met de uitvoering van wettelijke regelingen inzake het toezicht op het kredietwezen, inlichtingen
      te vragen aan of een onderzoek in te stellen of te doen instellen bij een ieder die ingevolge deze wet onder zijn
      respectievelijk haar toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over
      gegevens of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen als
      hiervoor bedoeld.

      2 Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, is verplicht deze gegevens
      of inlichtingen binnen een door Onze minister onderscheidenlijk de Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel66
  - number: 66a
    text: |-
      1 Onze Minister onderscheidenlijk de Bank kan toestaan dat een functionaris van een buitenlandse instantie als
      bedoeld in [artikel 66, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.

      2 Degene bij wie een onderzoek als bedoeld in [artikel 66, eerste lid][ref2], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.

      3 De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel66
