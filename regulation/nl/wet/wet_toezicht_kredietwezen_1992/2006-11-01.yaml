  - number: 85b
    text: |-
      1 Een kredietinstelling wisselt, op verzoek van een houder van elektronisch geld het elektronisch geld om door
      middel van uitbetaling van het elektronische geld in munten of bankbiljetten of door storting op een rekening,
      waarbij uitsluitend de voor de omwisseling noodzakelijke kosten mogen worden berekend.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de omwisseling,
      bedoeld in het eerste lid.

      3 Onze Minister is belast met het toezicht op de naleving van het bij of krachtens dit artikel bepaalde. De
      [artikelen 53][ref1] en [54][ref2] zijn van overeenkomstige toepassing.

      4 Taken en bevoegdheden die Onze Minister op grond van dit artikel heeft, kunnen bij algemene maatregel van bestuur
      worden overgedragen aan een of meer rechtspersonen. Alsdan gelden de verplichtingen op grond van dit artikel jegens
      Onze Minister als verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.

      5 Een overdracht als bedoeld in het vierde lid vindt slechts plaats indien de betrokken rechtspersoon aan de
      volgende vereisten voldoet:

      a. hij dient in staat te zijn de in het vierde lid bedoelde taken en bevoegdheden naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon dat een
      onafhankelijke vervulling van de in het vierde lid bedoelde taken en bevoegdheden zo veel mogelijk is gewaarborgd.

      6 Aan de overdracht, bedoeld in het vierde lid, kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel54
