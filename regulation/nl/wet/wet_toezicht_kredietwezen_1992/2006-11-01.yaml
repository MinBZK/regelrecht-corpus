  - number: 7b
    text: |-
      Het door een kredietinstelling uitgegeven elektronisch geld vertegenwoordigt een waarde die ten hoogste gelijk is
      aan de waarde van de voor de uitgifte ontvangen gelden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel7b
  - number: '8'
    text: |-
      1 Een in Nederland gevestigde onderneming of instelling, die voornemens is het bedrijf van kredietinstelling uit te
      oefenen, vraagt bij de Bank een vergunning aan.

      2 De aanvraag bevat, ten behoeve van de beslissing omtrent het verlenen van een vergunning als bedoeld in artikel
      9, gegevens omtrent:

      a. het aantal, de identiteit en de antecedenten van de personen die het dagelijks beleid van de onderneming of
      instelling bepalen;

      b. het aantal, de identiteit en de antecedenten van de leden van de raad van commissarissen van de onderneming of
      instelling dan wel van het orgaan van de onderneming of instelling dat een met die van een raad van commissarissen
      vergelijkbare taak heeft;

      c. de identiteit en de antecedenten van de personen die het dagelijks beleid bepalen van de groep waartoe de
      onderneming of instelling behoort en tevens uit dien hoofde het dagelijks beleid van de onderneming of instelling
      mede bepalen;

      d. de identiteit en de antecedenten van de personen die het beleid bepalen of mede bepalen van de groep waartoe
      de onderneming of instelling behoort en tevens uit dien hoofde het beleid van de onderneming of instelling mede
      bepalen;

      e. de identiteit van degenen die een gekwalificeerde deelneming houden in de onderneming of instelling, alsmede de
      omvang van de desbetreffende gekwalificeerde deelneming;

      f. een jaarrekening of openingsbalans, welke moet zijn voorzien van een
      verklaring omtrent de getrouwheid, ondertekend door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];

      g. een programma van werkzaamheden welke de onderneming of instelling voornemens is te verrichten;

      h. de voorziene administratieve organisatie - met inbegrip van de financiële administratie en de interne controle;

      i. de voorgenomen maatregelen, gericht op het bevorderen en handhaven van een integere bedrijfsvoering,
      met uitzondering van de maatregelen ter naleving van de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2];

      j. de formele en de feitelijke zeggenschapsstructuur van de groep waartoe de onderneming of instelling behoort; en

      k. indien de onderneming of instelling een dochtermaatschappij of bijkantoor van een niet in Nederland
      gevestigde kredietinstelling betreft: een verklaring van de toezichthoudende autoriteit van de Staat waar die
      kredietinstelling gevestigd is waaruit blijkt dat deze autoriteit de vestiging van een dochtermaatschappij of
      bijkantoor in Nederland heeft goedgekeurd.

      3 De Bank beslist binnen dertien weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
