  - number: 81a
    text: |-
      1 Indien de verklaring, bedoeld in [artikel 71, eerste of tweede lid][ref1], betrekking heeft op een
      kredietinstelling die is gevestigd in een Staat die geen Lid-Staat is en geen machtiging als bedoeld in
      [artikel 75, eerste lid, aanhef en onderdeel b of c][ref2], is gegeven, stelt de griffier van de rechtbank de
      Bank onverwijld in kennis van de inhoud van de beschikking, alsmede van de mogelijke gevolgen daarvan in het
      desbetreffende geval. De Bank stelt daarna onverwijld de bevoegde autoriteiten van de andere Lid-Staten waar de
      kredietinstelling een bijkantoor heeft in kennis van de beschikking, alsmede van de mogelijke gevolgen daarvan in
      het desbetreffende geval. De Bank stelt de bevoegde autoriteiten van de andere Lid-Staten van de Unie in kennis van
      de beschikking en van de beëindiging van de noodregeling, bedoeld in [hoofdstuk X][ref3].

      2 Indien een machtiging is gegeven als bedoeld in [artikel 75, eerste lid, aanhef en onderdeel b][ref4],
      betreffende een kredietinstelling die is gevestigd in een Staat die geen Lid-Staat is en de
      bewindvoerder overgaat tot liquidatie, alsmede indien een machtiging is gegeven als bedoeld in
      [artikel 75, eerste lid, aanhef en onderdeel c][ref5], stelt de griffier van de rechtbank de Bank onverwijld in
      kennis van de inhoud van de beschikking, alsmede van de mogelijke gevolgen daarvan in het desbetreffende geval.
      De Bank stelt daarna onverwijld de bevoegde autoriteiten van de andere Lid-Staten waar de kredietinstelling een
      bijkantoor heeft in kennis van de beschikking, alsmede van de mogelijke gevolgen daarvan in het desbetreffende
      geval. De Bank stelt de bevoegde autoriteiten van de andere Lid-Staten in kennis van de beschikking en van de
      beëindiging van de noodregeling.

      3 Indien een vergunning als bedoeld in [artikel 31][ref6] overeenkomstig [artikel 76e, eerste of tweede lid][ref7],
      wordt ingetrokken, stelt de Bank de bevoegde autoriteiten van de andere Lid-Staten waar de kredietinstelling een
      bijkantoor heeft in kennis van die intrekking.


