  - number: '31'
    text: |-
      1 Het is een in een andere Lid-Staat gevestigde onderneming of instelling verboden het bedrijf van
      kredietinstelling door middel van een bijkantoor in Nederland uit te oefenen, tenzij

      a. zij van de toezichthoudende autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van
      kredietinstelling benodigde vergunning heeft verkregen;

      b. de Bank een kennisgeving heeft ontvangen van de toezichthoudende autoriteit van de andere Lid-Staat, welke
      bevat:

      (1). een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van het
      bijkantoor zijn vermeld;

      (2). het adres van het bijkantoor;

      (3). de identiteit van de personen, die het dagelijks beleid van het bijkantoor zullen bepalen;

      (4). de omvang van het eigen vermogen en de solvabiliteitsratio van de kredietinstelling; en

      (5). gegevens omtrent de toepasselijkheid van een garantieregeling in de andere Lid-Staat op de verplichtingen van
      het bijkantoor; en

      c. de Bank de ontvangst van de kennisgeving als bedoeld onder *b* aan de onderneming of instelling heeft
      medegedeeld dan wel er acht weken zijn verstreken vanaf het tijdstip waarop de Bank de kennisgeving als bedoeld
      onder *b* heeft ontvangen.

      2 Het is de in een andere Lid-Staat gevestigde kredietinstelling die krachtens het eerste lid het bedrijf van
      kredietinstelling door middel van een bijkantoor in Nederland mag uitoefenen, echter niet toegestaan werkzaamheden
      genoemd in bijlage I van de Richtlijn te verrichten, indien het verrichten van die werkzaamheden door de vergunning
      bedoeld in het eerste lid, onder *a*, wordt uitgesloten dan wel de kennisgeving als bedoeld in het eerste lid,
      onder *b*, het verrichten van die werkzaamheden niet vermeldt.

      3 De in de andere Lid-Staat gevestigde kredietinstelling als bedoeld in het eerste lid dient de Bank en de
      toezichthoudende autoriteit van die andere Lid-Staat ten minste vier weken van te voren in kennis te stellen van
      elke wijziging van de gegevens als bedoeld in het eerste lid, onder *b*, sub (1), (2), (3) of (5) of, in voorkomend
      geval, van het voornemen om het verrichten van werkzaamheden door middel van het bijkantoor als bedoeld in het
      eerste lid te staken.

      4 Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.

      5 De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0005792/2006-11-01#Artikel31
  - number: '32'
    text: |-
      1 Het is een in een andere Lid-Staat gevestigde onderneming of instelling die het bedrijf van kredietinstelling
      als bedoeld in [artikel 1, eerste lid, onderdeel a, onder 1°][ref1] uitoefent, verboden al dan niet op termijn
      opvorderbare gelden van het publiek ter beschikking te verkrijgen door middel van het verrichten van diensten in
      Nederland, tenzij

      a. zij van de toezichthoudende autoriteit van de andere Lid-Staat een voor de uitoefening van het bedrijf van
      kredietinstelling benodigde vergunning heeft verkregen; en

      b. zij een kennisgeving heeft gezonden aan de toezichthoudende autoriteit van de andere Lid-Staat, welke bevat een
      opgave van de voorgenomen werkzaamheden.

      2 Het is de in een andere Lid-Staat gevestigde kredietinstelling die krachtens het eerste lid opvorderbare gelden
      van het publiek ter beschikking te verkrijgen door middel van het verrichten van diensten in Nederland, echter
      niet toegestaan werkzaamheden genoemd in bijlage I van de Richtlijn te verrichten, indien het verrichten van die
      werkzaamheden door de vergunning bedoeld in het eerste lid, onder *a*, wordt uitgesloten dan wel de kennisgeving
      als bedoeld in het eerste lid, onder *b*, het verrichten van die werkzaamheden niet vermeldt.

      3 Onze minister kan ondernemingen of instellingen die behoren tot een onderscheiden categorie ondernemingen of
      instellingen vrijstelling verlenen van het in het eerste lid vervatte verbod, indien het karakter van het bedrijf
      van die ondernemingen of instellingen dat rechtvaardigt, mits zulks naar zijn oordeel niet in strijd is met de
      belangen die deze wet beoogt te beschermen. Onze minister kan aan de vrijstelling voorschriften verbinden.

      4 De Bank kan een onderneming of instelling ontheffing verlenen van het in het eerste lid vervatte verbod, indien
      het karakter van het bedrijf van die onderneming of instelling dat rechtvaardigt, mits zulks naar haar oordeel
      niet in strijd is met de belangen die deze wet beoogt te beschermen. De Bank kan aan haar beschikking voorschriften
      verbinden.


