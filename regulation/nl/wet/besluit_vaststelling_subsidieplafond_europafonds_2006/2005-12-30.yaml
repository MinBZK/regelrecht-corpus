  - number: '2'
    text: |-
      Voor subsidieverlening op grond van de [artikelen 2.10.3][ref1] en
      [2.10.4 van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref2] in het kader van het Europafonds geldt
      voor de periode 1 januari 2006 tot en met 31 december 2006 het beleidsvoornemen, vermeld in de bijlage bij dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.3
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.4
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 2.10.3
      - id: ref2
        bwb_id: BWBR0010173
        artikel: 2.10.4
  - number: '3'
    text: |-
      De verdeling van het subsidieplafond vindt plaats op grond van twee beoordelingsrondes, overeenkomstig de maatstaven
      die in het beleidsvoornemen zijn neergelegd, met dien verstande dat aanvragen die het beste voldoen aan die
      maatstaven het eerst voor subsidieverlening in aanmerking komen, binnen het raam van een evenwichtige spreiding als
      bedoeld in [artikel 1.1.8, derde lid, onder d, van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel1.1.8
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010173
        artikel: 1.1.8
  - number: '4'
    text: |-
      Het subsidieplafond voor de eerste beoordelingsronde bedraagt € 1.000.000,–. Aanvragen kunnen worden ingediend
      vanaf het tijdstip van inwerkingtreding van dit besluit tot en met 31 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel4
  - number: '5'
    text: |-
      Het subsidieplafond voor de tweede beoordelingsronde bedraagt € 1.500.000,–. Aanvragen kunnen worden ingediend
      vanaf 15 maart 2006 tot en met 30 april 2006.
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel5
  - number: '6'
    text: |-
      Binnen zes weken na sluiting van de indieningstermijn worden de besluiten op de aanvraag bekend gemaakt. Indien het
      aantal ingediende aanvragen daar aanleiding toe geeft kan deze termijn worden verlengd.
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin het
      geplaatst wordt.
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel7
