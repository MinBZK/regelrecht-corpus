articles:
  - number: '1'
    text: |-
      Voor subsidieverlening op grond van de [artikelen 2.10.3][ref1] en
      [2.10.4 van de Subsidieregeling Ministerie van Buitenlandse Zaken][ref2] in het kader van het Europafonds geldt
      voor de periode van 1 januari 2006 tot en met 31 december 2006 een subsidieplafond van € 2.500.000,– .


      [ref1]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.3
      [ref2]: https://wetten.overheid.nl/BWBR0010173#Artikel2.10.4
    url: https://wetten.overheid.nl/BWBR0019368/2005-12-30#Artikel1
