  - number: '16'
    text: |-
      De minister kan per categorie als bedoeld in [artikel 2][ref1] een of meer aanvraagperioden per jaar vaststellen.
      Hij geeft hiervan kennis in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '17'
    text: |-
      1 Een aanvraag tot subsidieverlening uit hoofde van deze regeling wordt ingediend bij de directeur van de Dienst
      Landelijk Gebied met gebruikmaking van een daartoe bestemd aanvraagformulier dat verkrijgbaar is bij de directeur
      van de Dienst Landelijk Gebied.

      2 In de aanvraag tot subsidieverlening worden in ieder geval vermeld:

      a. inhoud, ligging, doelstellingen en activiteiten van het desbetreffende project;

      b. een gespecificeerde begroting van het desbetreffende project;

      c. de wijze waarop het desbetreffende project wordt gefinancierd en uitgevoerd met de daarbij behorende planningen;

      d. of de ten behoeve van het project verschuldigde omzetbelasting al dan niet verrekenbaar is;

      e. de wijze waarop de te realiseren werken duurzaam in stand zullen worden gehouden; en

      f. voor zover het een project als bedoeld in [artikel 2, onderdeel g][ref1], betreft, de wijze waarop het
      desbetreffende project bijdraagt aan de verbetering of de instandhouding van de landschappelijke kwaliteit van het
      Groene Hart.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '19'
    text: |-
      De stuurgroep maakt binnen twee maanden na afloop van de desbetreffende aanvraagperiode een rangschikking van de
      aanvragen tot subsidieverlening die voor subsidieverlening in aanmerking komen, waarbij aanvragen:

      a. hoger worden gerangschikt naarmate ze naar het oordeel van de stuurgroep meer voldoen aan het in
      [artikel 4, vierde lid][ref1], bedoelde criterium en

      b. die in gelijke mate voldoen aan het in [artikel 4, vierde lid][ref2], bedoelde criterium, hoger worden
      gerangschikt naarmate ze eerder zijn ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009476#Artikel4
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009476
        artikel: '4'
        paragraaf: '2'
  - number: '20'
    text: |-
      De minister geeft, gezien de rangschikking, bedoeld in [artikel 19][ref1], binnen vier maanden na afloop van de
      desbetreffende aanvraagperiode een beschikking omtrent subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel19
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '19'
        paragraaf: '4'
  - number: '21'
    text: |-
      De subsidieontvanger is verplicht:

      a. het project uit te voeren op basis van openbare of niet-openbare aanbesteding, overeenkomstig de Beleidsregels
      aanbesteding van werken 2004, indien de subsidiabele kosten voor de uitvoering van werken meer bedragen dan €
      45.378,–;

      b. indien overeenkomstig onderdeel a, is aanbesteed, binnen een maand na de gunning aan de directeur van de Dienst
      Landelijk Gebied melding te doen van de aanbestedingssom.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel21
  - number: '22'
    text: |-
      1 Binnen twee maanden na afloop van de uitvoering van het project dient de subsidieontvanger een aanvraag tot
      subsidievaststelling in bij de directeur.

      2 De aanvraag tot subsidieverlening bij projecten waarvoor een subsidie is verleend groter dan € 90.756,04
      vergezeld van een verklaring van een registeraccountant of een Accountant-Administratieconsulent als bedoeld in
      artikel 2:393, eerste lid, van het Burgerlijk Wetboek waaruit blijkt dat is voldaan aan bij of krachtens deze
      regeling gestelde voorwaarden en verplichtingen.

      3 De goedkeurende accountantsverklaring wordt opgesteld overeenkomstig de in [bijlage 1][ref1] opgenomen model-
      accountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0009476
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009476
  - number: '23'
    text: |-
      Zolang de subsidie niet is vastgesteld kan de minister de subsidieverlening ten nadele van de subsidieontvanger
      wijzigen indien de som waartegen de werken die op grond van [artikel 21, onderdeel a][ref1], zijn aanbesteed lager
      is dan de bij de subsidieverlening geraamde aanbestedingssom.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel21
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '21'
        paragraaf: '5'
  - number: '24'
    text: |-
      1 De minister kan op aanvraag voorschotten verstrekken.

      2 Een aanvraag tot verlening van een voorschot gaat vergezeld van een overzicht van de liquiditeitsbehoefte.

      3 De hoogte van het voorschot bedraagt ten hoogste 80% van het bedrag vermeld in de beschikking tot
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel24
  - number: '25'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel25
  - number: '26'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidiëring kwaliteit Groene Hart.'
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel26
