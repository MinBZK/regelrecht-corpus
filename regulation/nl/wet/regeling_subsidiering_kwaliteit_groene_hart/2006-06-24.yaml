  - number: '15'
    text: |-
      1 De subsidie bedraagt ten hoogste het volgende percentage van de subsidiabele kosten voor een project in de
      categorie:

      a. bruggen of tunnels, bedoeld in [artikel 2, onderdeel a][ref1], indien het betreft de aanleg over respectievelijk
      onder:

      1e: een rijksspoorweg, rijkswaterweg of rijksweg, 90%;

      2e: een provinciale (water)weg, 75%;

      3e: overige (water)wegen, 50%;

      b. recreatieve verbindingen en voorzieningen, bedoeld in [artikel 2, onderdeel b][ref2], 50%;

      c. recreatief te gebruiken groen-, natuur- of landschapselementen, bedoeld in [artikel 2, onderdeel c][ref3],
      indien het betreft een project als bedoeld in [artikel 10][ref4]: 50%;.

      1e: onderdeel a, 30% indien het betreft een kleinschalig landschapselement op bedrijfsniveau of 75% voor overige
      kleinschalige landschapselementen;

      2e: onderdeel b, 25% indien het betreft een gebouwd kleinschalig landschapselement of 50% voor overige
      kleinschalige landschapselementen;

      3e: onderdeel c, 50%;

      d. hydrologische systemen, bedoeld in [artikel 2, onderdeel d][ref5], 50%;

      e. visievorming, bedoeld in [artikel 2, onderdeel f][ref6], 50%;

      f. bezoekerscentra, bedoeld in [artikel 2, onderdeel h][ref7], 50%;

      g. marketing en promotie, bedoeld in [artikel 2, onderdeel i][ref8]: 50%.

      2 De subsidie bedraagt voor een project in de categorie lozingen, bedoeld in [artikel 2, onderdeel e][ref9], indien
      het betreft een project als bedoeld in [artikel 12][ref10]:

      a. onderdeel a, ten hoogste 10% van de subsidiabele kosten;

      b. onderdeel b, € 3.403,35 per woning of recreatie- of agrarisch bedrijfsgebouw, onverminderd
      [artikel 6, tweede lid][ref11];

      c. onderdeel c,€ 3.403,35 per aansluiting, onverminderd [artikel 6, tweede lid][ref12];.

      d. onderdeel d, € 5.672,25 per voorziening.

      3 De subsidie bedraagt voor een project in de categorie agrarische structuurversterking, bedoeld in
      [artikel 2, onderdeel g][ref13], indien het betreft een project als bedoeld in [artikel 13a][ref14]:

      a. 40% voorzover de subsidiabele kosten investeringen op landbouwbedrijven betreffen als bedoeld in artikel 7 van
      de [verordening (EG) nr. 1257/1999](31999R1257), en

      b. 50% voor de overige kosten.


