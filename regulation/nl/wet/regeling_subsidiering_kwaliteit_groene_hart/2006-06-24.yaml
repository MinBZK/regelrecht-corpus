  - number: '7'
    text: |-
      1 Subsidie wordt uitsluitend verstrekt voor projecten:

      a. die binnen drie jaar na de subsidieverlening en uiterlijk op 31 december 2010 zijn uitgevoerd;

      b. waarvan binnen een jaar na de subsidieverlening een aanvang is gemaakt met de uitvoering van het project;

      c. waarvan de duurzame instandhouding van de werken die worden gerealiseerd is geregeld;

      d. indien het betreft een project in een categorie als bedoeld in [artikel 2, onderdeel a, b, c, d, of f][ref1],
      waarvan de subsidiabele kosten hoger zijn dan € 45.378,02 indien de subsidie-aanvrager een publiekrechtelijke
      rechtspersoon is, of hoger zijn dan € 4.537,80 voor overige subsidie-aanvragers;

      e. indien het betreft een project in de categorie, bedoeld in [artikel 2, onderdeel g][ref2], waarvan de
      subsidiabele kosten hoger zijn dan € 2.268,90;.

      f. die niet in strijd zijn met het rijksbeleid voor het Groene Hart;

      g. waarvan de financiering gedekt is, en

      h. die, indien het betreft een project in een categorie als bedoeld in [artikel 2, onderdeel a, b, c, d of f][ref3],
      niet uitsluitend of nagenoeg uitsluitend ten goede komen aan individuele bedrijven.

      2 De minister kan op aanvraag van de subsidieontvanger de termijn, bedoeld in het eerste lid, onderdeel a, met twee
      jaar verlengen voor projecten als bedoeld in [artikel 2, onderdeel a of onderdeel b][ref4], met dien verstande dat
      het project uiterlijk op 31 december 2012 zal zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0009476#Artikel2
