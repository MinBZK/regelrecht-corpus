  - number: 13a
    text: |-
      1 Subsidie voor een project in de categorie agrarische structuurversterking, bedoeld in
      [artikel 2, onderdeel g][ref1], wordt uitsluitend verstrekt indien het betreft:

      a. de verbetering van de bereikbaarheid en de bewerking van landbouwgronden in het Groene Hart in relatie tot de
      relatief hoge grondwaterstand, of

      b. de verbreding van activiteiten op landbouwbedrijven.

      2 Subsidie voor projecten als bedoeld in het eerste lid, onderdeel a, wordt uitsluitend verstrekt indien:

      a. voor de landbouwgronden waarop het project van toepassing is, een zomerpeilbesluit van het waterschap binnen het
      werkgebied waarvan de landbouwgronden zijn gelegen, van gemiddeld 60 centimeter of minder beneden maaiveld geldt,

      b. de projecten niet tot gevolg hebben dat de grondwaterstand van de betrokken landbouwgronden wordt verlaagd,

      c. de projecten niet uitsluitend vervangingsinvesteringen betreffen, en

      d. voorzover van toepassing, de projecten passen binnen een vastgesteld landinrichtingsplan als bedoeld in
      [artikel 81, eerste lid, van de Landinrichtingswet][ref2].

      3 Subsidie voor projecten als bedoeld in het eerste lid, onderdeel b, wordt uitsluitend verstrekt indien het
      betreft investeringen ten behoeve van:

      a. de inrichting van verblijfs- of dagrecreatie op landbouwbedrijven, waarbij de recreatievoorziening past binnen
      een toeristisch-recreatieve route in het Groene Hart;

      b. de opzet van een afzetstructuur van streekeigen producten, afkomstig uit het Groene Hart, of

      c. de inrichting van landbouwbedrijven in het Groene Hart tot landbouwbedrijven waarop landbouw wordt gecombineerd
      met kinderopvang of zorg voor jongeren, ouderen, verslaafden, delinquenten, gehandicapten of psychiatrische
      patiënten.

      4 Subsidies voor projecten als bedoeld in het derde lid, wordt uitsluitend verstrekt indien de aanvrager
      samenwerkt met een of meer andere natuurlijke of rechtspersonen, met dien verstande dat de samenwerking in
      het kader van projecten als bedoeld in het derde lid, onderdeel c, geschiedt met een of meer op grond van
      [artikel 5 van de Wet toelating zorginstellingen][ref3] toegelaten instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003793#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel5
