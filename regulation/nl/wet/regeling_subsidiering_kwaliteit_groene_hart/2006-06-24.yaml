preamble:
  text: |-
    Gelet op de artikelen 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. landbouw: akkerbouw, weidebouw, veehouderij, pluimveehouderij, tuinbouw – daaronder begrepen fruitteelt en het
      kweken van bomen, bloemen en bloembollen – en elke andere vorm van bodemcultuur met uitzondering van bosbouw;

      c. landbouwbedrijf: geheel of gedeelte van productie-eenheden in Nederland bestaande uit grond en een of meer
      bedrijfsgebouwen of gedeelten daarvan, uitsluitend of in hoofdzaak dienende ter uitoefening van de landbouw;

      d. Groene Hart: Groene Hart zoals aangegeven op PKB-kaart 9 Randstad op pagina 152 van de Nota Ruimte (Kamerstukken
      II 2003/04, 29 435, nr. 2);

      e. bezoekerscentrum: voor het publiek vrij toegankelijke accommodatie, waar voorlichting of onderricht wordt
      gegeven over natuur, milieu, recreatie en landschap;

      f. [verordening (EG) nr. 1257/1999](31999R1257): verordening (EG) nr. 1257/1999 van de Raad van de Europese Unie
      van 17 mei 1999 betreffende steun voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor
      de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen (Pb EG L 160/80);

      g. Dienst Landelijk Gebied: Dienst Landelijk Gebied van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;

      h. Stuurgroep: Stuurgroep Groene Hart.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel1
  - number: '2'
    text: |-
      De minister kan ter verhoging van de kwaliteit van de natuur, de recreatie, het milieu en het landschap alsmede ter
      versterking van de duurzame landbouw en ter verbreding van de inkomensvorming op landbouwbedrijven in het Groene
      Hart op aanvraag subsidie verstrekken voor de uitvoering van projecten in de volgende categorieën:

      a. bruggen en tunnels;

      b. recreatieve verbindingen en voorzieningen;

      c. recreatief te gebruiken groen-, natuur- of landschapselementen;

      d. hydrologische systemen;

      e. lozingen;

      f. visievorming;

      g. agrarische structuurversterking;

      h. bezoekerscentra, of

      i. marketing en promotie.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel2
  - number: '3'
    text: |-
      Subsidieverlening op grond van deze regeling geschiedt uitsluitend aan natuurlijke of rechtspersonen die
      verantwoordelijk zijn voor de uitvoering van het project ten behoeve waarvan uit hoofde van deze regeling subsidie
      wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel3
  - number: '4'
    text: |-
      1 De minister stelt voor ieder jaar of iedere aanvraagperiode als bedoeld in [artikel 16][ref1], een
      subsidieplafond vast voor op grond van deze regeling te verstrekken subsidies.

      2 Onverminderd het eerste lid, kan de minister afzonderlijke subsidieplafonds vaststellen voor de in
      [artikel 2][ref2] onderscheiden categorieën.

      3 Besluiten tot vaststelling als bedoeld in het eerste of tweede lid, worden in de Staatscourant bekendgemaakt.

      4 De minister voorziet in een gelijktijdige beslissing op aanvragen tot subsidieverlening ingediend in een
      aanvraagperiode als bedoeld in [artikel 16][ref3] op basis van een vergelijking van hun geschiktheid om bij te
      dragen aan de doelstellingen van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009476#Artikel16
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel4
