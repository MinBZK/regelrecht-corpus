  - number: '8'
    text: |-
      Subsidie voor een project in de categorie bruggen en tunnels, bedoeld in [artikel 2, onderdeel a][ref1], wordt
      uitsluitend verstrekt voorzover het betreft de aanleg van een brug of tunnel die:

      a. een ten tijde van de inwerkingtreding van deze regeling bestaande barrière, veroorzaakt door een spoorweg,
      waterweg of weg, opheft;

      b. voor recreatieve gebruikers de bereikbaarheid van het Groene Hart vanuit omliggende gebieden of de
      toegankelijkheid binnen het Groene Hart vergroot;

      c. ten behoeve van langzaam verkeer is, en

      d. openbaar toegankelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '9'
    text: |-
      Subsidie voor een project in de categorie recreatieve verbindingen en voorzieningen, bedoeld in
      [artikel 2, onderdeel b][ref1], wordt uitsluitend verstrekt indien het betreft de aanleg:

      a. of verbetering van een fiets-, wandel-, ruiter- of waterverbinding die de bereikbaarheid van het Groene Hart
      vanuit omliggende gebieden of de toegankelijkheid binnen het Groene Hart vergroot en openbaar toegankelijk is, of

      b. van een recreatieve voorziening in het Groene Hart die het gebruik van een bestaande of nog aan te leggen
      recreatieve verbinding wezenlijk verbetert en die openbaar toegankelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '10'
    text: |-
      Subsidie voor een project in de categorie recreatief te gebruiken groen-, natuur- of landschapselementen, bedoeld
      in [artikel 2, onderdeel c][ref1], wordt uitsluitend verstrekt indien het betreft de aanleg van een recreatief te
      gebruiken groen-, natuur- of landschapselement in het Groene Hart en:

      a. gericht is op het behoud en de versterking van de karakteristieke landschapsvormen;

      b. gericht is op het herstel van cultuurhistorische waarden; of

      c. bijdraagt aan een goed bereikbaar recreatief aanbod vanuit de om en in het Groene Hart gelegen stedelijke
      gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '11'
    text: |-
      Subsidie voor een project in de categorie hydrologische systemen, bedoeld in [artikel 2, onderdeel d][ref1], wordt
      uitsluitend verstrekt indien het uitgevoerd wordt in het Groene Hart en het betreft:

      a. het herstel van een hydrologisch systeem op gebiedsniveau in het Groene Hart voorzover het de kwaliteit of
      kwantiteit van water waarvan de recreatie- of natuurfunctie kwetsbaar is, verhoogt, of

      b. het vasthouden van gebiedseigen water.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Subsidie voor een project in de categorie lozingen, bedoeld in [artikel 2, onderdeel e][ref1], wordt uitsluitend
      verstrekt indien het uitgevoerd wordt in het Groene Hart en het betreft:

      a. het voorkomen van ongezuiverde lozingen veroorzaakt door overstroming van een riolering;

      b. het opheffen van ongezuiverde lozingen van een woning of recreatie- of agrarisch bedrijfsgebouw bestaande ten
      tijde van de inwerkingtreding van deze regeling door middel van een individueel systeem;

      c. de aanleg van een aansluiting van een gemeentelijke riolering ten behoeve van een woning of recreatie- of
      agrarisch bedrijfsgebouw bestaande ten tijde van de inwerkingtreding van deze regeling en gelegen buiten de
      bebouwde kom, of

      d. de aanleg op het land van een voorziening ten behoeve van de recreatievaart, voor de milieutechnisch
      verantwoorde inzameling van vervuild water afkomstig van recreatievaartuigen.

      2 Subsidie voor projecten als bedoeld in het eerste lid, onderdeel a, b of c, wordt uitsluitend verstrekt voorzover
      het project wordt uitgevoerd in een gebied waarvan de recreatie- of natuurfunctie kwetsbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '13'
    text: |-
      Subsidie voor een project in de categorie visievorming, bedoeld in [artikel 2, onderdeel f][ref1], wordt
      uitsluitend verstrekt indien het betreft het vormen van een visie ter voorbereiding van en ter vergroting van het
      draagvlak voor een aantal projecten die:

      a. passen binnen een of meer van de categorieën, bedoeld in [artikel 2, onderdelen a tot en met e en g][ref2], en.

      b. elkaar onderling versterken.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel13
