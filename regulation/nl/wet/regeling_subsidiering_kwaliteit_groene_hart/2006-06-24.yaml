  - number: 13b
    text: |-
      Subsidie voor een project in de categorie bezoekerscentra wordt uitsluitend verstrekt indien:

      a. voorlichting of onderricht wordt gegeven over recreatie, waterbeheer, landschapshistorie, cultuurlandschap en
      agrarisch gebruik in relatie tot het in [artikel 2, eerste volzin][ref1], genoemde doel;

      b. het bezoekerscentrum een regionale functie heeft;

      c. de beheers- en exploitatiekosten voor drie jaar zijn gegarandeerd;

      d. goed bereikbaar is;

      e. een voorlichtingsruimte heeft van tenminste 100 m²;

      f. ten minste op vier dagen per week geopend is voor een totaal van gemiddeld ten minste 24 uur per week en

      g. geen onderdeel is van een landbouwbedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: 13c
    text: |-
      Subsidie voor een project in de categorie marketing en promotie, bedoeld in [artikel 2, onderdeel i][ref1], wordt
      uitsluitend verstrekt indien het betreft een marketing promotieproject ter vergroting van het draagvlak voor
      projecten die zich richten op de promotie of marketing van het Groene Hart als één geheel.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0009476
        artikel: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Als subsidiabele kosten worden niet in aanmerking genomen:

      a. kosten van beheer en onderhoud;

      b. kosten van voorbereiding en directievoering door bestuursorganen;

      c. kosten van voorbereiding en directievoering door andere dan bestuursorganen voorzover hoger dan 25% van de
      subsidiabele kosten;

      d. kosten die gelet op de aard, ligging of functie van de voorziening niet noodzakelijk zijn;

      e. kosten van werkzaamheden die tot de reguliere taken van organisaties behoren, tenzij het betreft een project als
      bedoeld in [artikel 12, eerste lid, onderdeel c][ref1];

      f. kosten van de verklaring, bedoeld in [artikel 22, derde lid][ref2];

      g. verrekenbare omzetbelasting, en

      h. h. kosten van de aankoop van grond, voorzover het een project in de categorie agrarische structuurversterking,
      bedoeld in [artikel 2, onderdeel g][ref3], betreft.

      i. kosten van organisatie van de in [artikel 13a, vierde lid][ref4], bedoelde samenwerkende personen.

      2 2. Als subsidiabele kosten voor de categorie bezoekerscentra, als bedoeld in [artikel 2, onderdeel h][ref5],
      worden alleen in aanmerking genomen:

        - de inrichtingskosten samenhangend met de aanschaf van roerende zaken voor voorlichting en onderricht;
        - de aanschaf van expositiemateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel12
