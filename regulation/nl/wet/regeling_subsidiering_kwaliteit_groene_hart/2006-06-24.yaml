  - number: '5'
    text: |-
      Geen subsidie wordt verstrekt indien met de uitvoering van het project een aanvang is gemaakt alvorens de ontvangst
      van de aanvraag tot subsidieverlening schriftelijk is bevestigd. Onder het maken van een aanvang wordt in ieder
      geval verstaan het aangaan van verplichtingen.
    url: https://wetten.overheid.nl/BWBR0009476/2006-06-24#Artikel5
  - number: '6'
    text: |-
      1 Geen subsidie wordt verstrekt voorzover daardoor uit ’s-rijks kas wordt bijgedragen in de kosten van het project:

      a. voor meer dan 90% indien het betreft een project in de categorie, bedoeld in [artikel 2, onderdeel a][ref1], of
      meer dan 75% voor de categorieën, bedoeld in [artikel 2, onderdelen b tot en met g][ref2], of

      b. via de begroting van de minister voor een hoger percentage of bedrag dan genoemd in [artikel 15][ref3].

      2 In afwijking van het eerste lid wordt voor de projecten als bedoeld in [artikel 2, onderdelen e en g][ref4],
      geen subsidie verstrekt voor meer dan 40% van de subsidiabele kosten indien de subsidiabele kosten investeringen in
      landbouwbedrijven betreffen als bedoeld in artikel 7 van de [verordening (EG) nr. 1257/1999](31999R1257).


      [ref1]: https://wetten.overheid.nl/BWBR0009476#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009476#Artikel2
