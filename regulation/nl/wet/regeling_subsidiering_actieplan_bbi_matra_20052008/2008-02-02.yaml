---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_subsidiering_actieplan_bbi_matra_20052008
regulatory_layer: WET
publication_date: '2008-01-31'
valid_from: '2008-02-02'
bwb_id: BWBR0018423
url: https://wetten.overheid.nl/BWBR0018423/2008-02-02
preamble:
  text: |-
    Handelende in overeenstemming met de Staatssecretaris van Buitenlandse Zaken;

    Gelet op artikel 2 en 4 van de Kaderwet LNV-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.a
    text: 'Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.b
    text: 'Actieplan: Actieplan BBI-Matra 2005–2008;'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.c
    text: |-
      kandidaat-lidstaten: Europese staten die op grond van [artikel 49 van het Verdrag betreffende de Europese Unie]
      (onbekend) een verzoek hebben ingediend om lid te worden van de Europese Unie, welk verzoek door de Raad van de
      Europese Unie in behandeling is genomen;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.d
    text: 'oosterbuurlanden: Russische Federatie, Oekraïne, Wit-Rusland, Moldavië, Georgië en Armenië;'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.e
    text: 'doellanden: kandidaat-lidstaten, de oosterbuurlanden, Servië, Montenegro, Kroatië en Marokko;'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: 1.f
    text: |-
      project: geheel van activiteiten gericht op concrete resultaten ter verwezenlijking van de in deze regeling
      omschreven subsidiedoelstellingen alsmede gericht op samenwerking, communicatie en kennisoverdracht.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel1
  - number: '2'
    text: |-
      Op de voet van deze regeling kan de minister op aanvraag subsidie verstrekken in de kosten van projecten die een
      bijdrage leveren aan de uitvoering van het Actieplan.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel2
  - number: '3'
    text: |-
      Voor subsidie komen in aanmerking in Nederland gevestigde privaatrechtelijke rechtspersonen en rechtspersonen
      naar Nederlands publiekrecht, waarvan de doelstelling past binnen het doel van de subsidieverstrekking en die naar
      het oordeel van de Minister voldoende kunnen aantonen dat zij in één of meer van de doellanden samenwerken met en
      ondersteuning bieden aan lokale organisaties.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel3
  - number: '4'
    text: |-
      Aanvragen voor subsidie kunnen worden ingediend voor projecten met de volgende thematische invalshoeken, bedoeld in
      het Actieplan:
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: 4.a
    text: het bijdragen aan de totstandkoming van een Pan-Europees ecologisch netwerk;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: 4.b
    text: |-
      het versterken van de ecologische relatie tussen Nederland en de doellanden, in het bijzonder op het gebied van
      trekvogels;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: 4.c
    text: |-
      het stimuleren van ecologisch verantwoord ondernemen met inbegrip van de integratie van biodiversiteit in
      economische sectoren als landbouw, bosbouw, visserij, vervoer, recreatie en toerisme;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: 4.d
    text: |-
      het bijdragen aan maatschappelijke transformatie door het investeren in netwerken van non-gouvermentele
      organisaties en gouvermentele organisaties op het gebied van biodiversiteit;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: 4.e
    text: het bijdragen aan de Europese eenwording of het Europees Nabuurschap.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel4
  - number: '5.1'
    text: 'Voor subsidie komen uitsluitend in aanmerking projecten die:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: 5.1.a
    text: gericht zijn op de doellanden of regio’s binnen de doellanden;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: 5.1.b
    text: |-
      aantoonbaar gesteund worden door de voor het project relevante overheid in het land of de landen waar het
      betreffende project wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: 5.1.c
    text: |-
      in overeenstemming zijn met het algemene buitenlands beleid, met het algemene internationale natuur- en
      milieubeleid en met het beleid dat Nederland voert ten opzichte van de betreffende regio of het betreffende land;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: 5.1.d
    text: in de kandidaat-lidstaten in overeenstemming zijn met het toetredingsbeleid van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: '5.2'
    text: |-
      Een project dat betrekking heeft op Wit-Rusland komt uitsluitend voor subsidie in aanmerking indien in het kader
      van het project niet wordt samengewerkt met de centrale overheid van dat land.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel5
  - number: '6'
    text: 'Geen subsidie wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: 6.a
    text: |-
      projecten met de uitvoering waarvan een aanvang is gemaakt alvorens de ontvangst van de aanvraag tot
      subsidieverlening schriftelijk aan de aanvrager is bevestigd;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: 6.b
    text: projecten die een looptijd hebben van meer dan drie jaar;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: 6.c
    text: de leverantie van uitsluitend materialen of goederen;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: 6.d
    text: infrastructurele of bouwactiviteiten;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: 6.e
    text: studiebeurzen of louter wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel6
  - number: '7.1'
    text: 'Subsidie kan worden verstrekt voor de volgende met het project verband houdende kosten:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.a
    text: kosten van materialen of hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.b
    text: kosten voor de verwerving en inrichting van terreinen;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.c
    text: loonkosten van het betrokken personeel in dienst van de subsidieontvanger;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.d
    text: kosten voor de uitvoering door derden;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.e
    text: plankosten en andere voorbereidingskosten tot een maximum van 25% van de subsidiabele kosten;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.f
    text: reis- en verblijfkosten;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.g
    text: kosten voor tolken en vertalers;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: 7.1.h
    text: kosten voor de voor de vaststelling van de subsidie benodigde accountantsverklaring tot een maximum van € 2500,–.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: '7.2'
    text: |-
      De subsidie kan worden verhoogd met een opslag voor algemene kosten, van ten hoogste 7,5% van de in het eerste lid
      genoemde kosten.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 7, eerste lid][ref1], kan subsidie worden verstrekt op basis van een door de minister
      goed te keuren dagtarief.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel7
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '7'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      Ingeval subsidie wordt verleend op basis van een dagtarief, is [artikel 7, tweede lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel7
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '7'
        paragraaf: '1'
  - number: '9'
    text: |-
      De subsidie bedraagt 100% van de overeenkomstig [artikel 7][ref1] dan wel [8][ref2] berekende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018423#Artikel8
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018423
        artikel: '8'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Indien voor een project uit anderen hoofde ten laste van ’s Rijks kas subsidies worden verstrekt, wordt slechts een
      zodanig bedrag op grond van deze regeling verstrekt, dat de som van de subsidies het in [artikel 9][ref1] genoemde
      percentage niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel9
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '9'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Indien voor een project subsidies door een ander bestuursorgaan dan de minister of financiële middelen door niet-
      bestuursorganen worden verstrekt, wordt slechts een zodanig bedrag op grond van deze regeling verstrekt, dat de som
      van de subsidies of de financiële middelen niet meer bedraagt dan 100% van de totale kosten van het project.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel10
  - number: '11.1'
    text: 'Het subsidieplafond bedraagt voor het jaar 2008: € 2.550.500,–.'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel11
  - number: '11.2'
    text: |-
      In het jaar 2008 komen projecten waarvan de aangevraagde subsidie meer bedraagt dan € 220.000 niet voor subsidie
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel11
  - number: '12'
    text: De aanvraagperiode wordt voor het jaar 2008 vastgesteld op de periode 4 februari tot en met 17 maart 2008.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel12
  - number: '13.1'
    text: |-
      Een aanvraag tot subsidieverlening wordt in de Nederlandse of de Engelse taal gericht aan de minister en ingediend
      bij Dienst Regelingen op een daartoe door de directeur van Dienst Regelingen vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: '13.2'
    text: 'Een aanvraag tot subsidieverlening gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.2.a
    text: |-
      een verklaring, afgegeven door de overheid, bedoeld in [artikel 5, eerste lid, onderdeel b][ref1], waaruit blijkt
      dat het project door haar wordt ondersteund; en


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel5
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '5'
        paragraaf: '1'
  - number: 13.2.b
    text: een projectplan.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: '13.3'
    text: 'Het projectplan, bedoeld in het tweede lid, onderdeel b, bevat in ieder geval het volgende:'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.a
    text: |-
      de thematische invalshoeken, genoemd in [artikel 4][ref1], waarop het project betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel4
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '4'
        paragraaf: '1'
  - number: 13.3.b
    text: |-
      een beschrijving van het project, waarin is opgenomen een probleemanalyse, het doel en de noodzaak van het project,
      alsmede de noodzaak van de kosten;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.c
    text: |-
      een sluitende begroting voor het project, alsmede een toelichting daarop; indien het een meerjarig project betreft
      dient de begroting een meerjarenbegroting te zijn met een liquiditeitsplanning per jaar;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.d
    text: een overzicht van door derden toegezegde bijdragen aan het project;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.e
    text: de realisatietermijn;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.f
    text: de criteria die gehanteerd worden om de resultaten van het project te toetsen;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: 13.3.g
    text: |-
      een communicatieplan waarin wordt aangegeven: - op welke wijze met de belanghebbenden bij het project wordt
      gecommuniceerd over de inhoud, de voortgang en de resultaten, en
        - op welke wijze een breder publiek wordt geïnformeerd over de resultaten en mogelijke gevolgen van het project.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: '13.4'
    text: Het projectplan wordt in de Nederlandse of de Engelse taal opgesteld.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel13
  - number: '14.1'
    text: |-
      De minister rangschikt de aanvragen die voor subsidie in aanmerking komen zodanig dat een project of een programma
      hoger gerangschikt wordt naarmate het:
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: 14.1.a
    text: |-
      meer bijdraagt aan de verwezenlijking van de doelstelling, genoemd in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel2
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '2'
        paragraaf: '1'
  - number: 14.1.b
    text: |-
      meer aansluit bij de in [artikel 4][ref1] genoemde thematische invalshoeken;


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel4
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '4'
        paragraaf: '1'
  - number: 14.1.c
    text: |-
      meerdere van de volgende kenmerken heeft: - het hebben van doorwerking in die zin dat het project breed kan worden
      toegepast en een blijvend effect heeft in de ontvangende regio;
        - het hebben van brede bestuurlijke steun in de ontvangende regio;
        - het bijdragen aan de formulering of aan de uitvoering van biodiversiteitsbeleid in de betreffende regio;
        - het maximaal ten goede komen aan het ontvangende land en daarbij tevens rekening houden met de inbreng en de
      belangen van Nederland;
        - het hebben van een gunstige kosten-baten verhouding;
        - het ontvangen van medefinanciering door andere organisaties dan LNV;
        - het project verschilt van projecten waaraan in een voorafgaande aanvraagperiode reeds subsidie is verleend;
        - ingeval het een project betreft in de Russische Federatie of Oekraïne, het bijdragen aan de gezamenlijke door
      Nederland en de Russische Federatie respectievelijk Oekraïne opgestelde werkplannen in het kader van de Memoranda
      of Understanding op het gebied van respectievelijk milieu bescherming en natuur, met uitzondering van het onderwerp
      waterkwaliteitsbeheer in het gezamenlijke werkplan met de Russische Federatie.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: '14.2'
    text: |-
      De minister houdt bij de rangschikking van de aanvragen rekening met een evenwichtige verdeling van de middelen
      over de thematische invalshoeken, genoemd in [artikel 4][ref1], over de doellanden en over projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel4
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '4'
        paragraaf: '1'
  - number: '14.3'
    text: |-
      Voor de aanvraagperioden in de jaren 2007 en 2008 worden projecten met de volgende thematische invalhoeken of in de
      volgende doellanden hoger gerangschikt:
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: 14.3.a
    text: projecten ter ondersteuning van nationale beleidsontwikkeling op het gebied van ecologische netwerken;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: 14.3.b
    text: projecten ter ondersteuning van de totstandkoming van mariene beschermde gebieden;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: 14.3.c
    text: |-
      projecten ter stimulering van de integratie van biodiversiteit in de sectoren landbouw, bosbouw, visserij en
      recreatie en toerisme.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: '14.4'
    text: De minister maakt het in het derde lid genoemde besluit bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel14
  - number: '15.1'
    text: |-
      De minister geeft een beschikking omtrent subsidieverlening binnen vijf maanden na afloop van de desbetreffende
      aanvraagperiode.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel15
  - number: '15.2'
    text: De beschikking tot subsidieverlening vermeldt het bedrag waarop de subsidie ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel15
  - number: '16'
    text: |-
      Subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '17'
    text: |-
      De subsidieontvanger voert een administratie die zodanig is ingericht dat daaruit te allen tijde op een eenvoudige
      wijze alle kosten van het project kunnen worden afgelezen, gespecificeerd overeenkomstig de in [artikel 7][ref1]
      onderscheiden kostenposten.


      [ref1]: https://wetten.overheid.nl/BWBR0018423#Artikel7
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018423
        artikel: '7'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      De subsidieontvanger voert het project of programma uit overeenkomstig het projectplan, behoudens door de minister
      goedgekeurde wijzigingen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18
  - number: '18.2'
    text: |-
      Ter verkrijging van goedkeuring, als bedoeld in het eerste lid, wordt een daartoe strekkend verzoek gericht aan de
      minister en ingediend bij Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18
  - number: '18.3'
    text: |-
      Goedkeuring, als bedoeld in het eerste en tweede lid, wordt niet verleend voor zover het wijzigingen ten aanzien
      van de doelstelling betreft.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18
  - number: '18.4'
    text: |-
      De minister deelt de subsidieontvanger mede of en in welke mate de wijzigingen van het project of programma
      gevolgen heeft voor de verleende subsidie of voor de bij de verlening van de subsidie vastgestelde verplichtingen.
      De wijzigingen hebben geen verhoging tot gevolg van het bedrag waarop de subsidie overeenkomstig de beschikking tot
      subsidieverlening ten hoogste kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18
  - number: 18a
    text: |-
      Ingeval een project langer dan een jaar duurt, informeert de subsidieontvanger de Minister telkens nadat een jaar
      is verstreken binnen drie maanden over de voortgang van het project door middel van een verslag, dat ten minste
      bevat:
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18a
  - number: 18a.a
    text: |-
      een beschrijving van de activiteiten die tot dan toe in het kader van het project zijn verricht en de activiteiten
      die gepland staan voor het komende jaar;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18a
  - number: 18a.b
    text: |-
      een beschrijving van de mate waarin de activiteiten hebben bijgedragen aan de doelstellingen, omschreven in het
      projectplan;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18a
  - number: 18a.c
    text: |-
      een financiële rapportage over de betalingen en kosten die tot dan toe in het kader van het project zijn verricht
      respectievelijk gemaakt en een financiële planning voor het resterende termijn van het project.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel18a
  - number: '19'
    text: |-
      De subsidieontvanger is verplicht om binnen een periode van twaalf maanden na dagtekening van de beschikking tot
      subsidieverlening te beginnen met de uitvoering van het project en het project uiterlijk 1 juli 2011 af te ronden.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel19
  - number: '20.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], is de
      subsidieontvanger een vergoeding voor vermogensvorming verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '20.2'
    text: |-
      Bij de bepaling van de hoogte van de vergoeding, bedoeld in het eerste lid, wordt uitgegaan van de waarde van
      de met de subsidie verkregen eigendommen en andere vermogensbestanddelen op het tijdstip waarop de financiële
      vergoeding verschuldigd wordt met dien verstande dat, in geval van ontvangst van schadevergoeding voor verlies
      of beschadiging van eigendommen, wordt uitgegaan van het bedrag dat de instelling als schadevergoeding ontvangt.
      Indien het een onroerend goed betreft, geschiedt de waardebepaling door een door de minister aan te wijzen
      onafhankelijke deskundige.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel20
  - number: '20.3'
    text: |-
      Toepassing van het eerste lid blijft achterwege, indien het project, na toestemming door de minister, door
      een andere rechtspersoon wordt voortgezet en de activa om niet aan die andere rechtspersoon in eigendom zijn
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel20
  - number: '20.4'
    text: |-
      Toepassing van het eerste lid blijft eveneens achterwege, indien bij de subsidievaststelling ten genoegen van de
      minister wordt aangetoond dat de met het project ontwikkelde activiteiten na de subsidievaststelling tenminste drie
      jaar worden voortgezet door de subsidieontvanger of, na toestemming door de minister, door een andere rechtspersoon
      en de activa om niet aan die andere rechtspersoon in eigendom zijn overgedragen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel20
  - number: '20.5'
    text: |-
      Ter verkrijging van de toestemming, bedoeld in het derde en vierde lid, wordt een daartoe strekkend verzoek gericht
      aan de minister en ingediend bij Dienst Regelingen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel20
  - number: '21.1'
    text: |-
      De minister kan de subsidieontvanger voorschotten verstrekken van ten hoogste 80% van het bedrag vermeld in de
      beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel21
  - number: '21.2'
    text: |-
      Ingeval subsidie is verleend voor meerdere aaneengesloten jaren, kan per jaar één voorschot worden verstrekt, met
      dien verstande dat het in het eerste lid genoemde percentage naar rato wordt verdeeld over de onderscheiden jaren.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel21
  - number: '21.3'
    text: Een verzoek om een voorschot wordt uiterlijk 30 juni van het desbetreffende jaar ingediend.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel21
  - number: '21.4'
    text: De minister kan de subsidieontvanger verzoeken een overzicht van de liquiditeitsbehoefte te overleggen.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel21
  - number: '22.1'
    text: |-
      Een aanvraag tot subsidievaststelling wordt in de Nederlandse of de Engelse taal gericht aan de minister en binnen
      vier maanden na afloop van het project ingediend bij Dienst Regelingen op een daartoe door de directeur van Dienst
      Regelingen vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde aanvraag vergezeld van een eindrapportage. Deze rapportage, opgesteld in de
      Nederlandse of de Engelse taal, bestaat ten minste uit een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: 22.2.a
    text: de activiteiten die in het kader van het project zijn verricht;
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: 22.2.b
    text: de mate waarin deze activiteiten hebben bijgedragen aan de in het projectplan omschreven doelstellingen; en
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: 22.2.c
    text: het financiële verloop van het project.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: '22.3'
    text: |-
      Indien de totale subsidiabele kosten meer bedragen dan € 22.500,– gaat de aanvraag tot
      subsidievaststelling vergezeld van een verklaring van een accountant, als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit blijkt dat voldaan is aan de bij of
      krachtens deze regeling gestelde voorwaarden en verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '22.4'
    text: |-
      De accountant, bedoeld in het derde lid, controleert de aanvraag tot subsidievaststelling met inachtneming van het
      in [bijlage 2][ref1] bij deze regeling opgenomen controleprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0018423
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018423
  - number: '22.5'
    text: |-
      De goedkeurende accountantsverklaring wordt opgesteld overeenkomstig de in [bijlage 1][ref1] bij deze regeling
      opgenomen modelaccountantsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0018423
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018423
  - number: '22.6'
    text: |-
      De minister kan de Accountantsdienst van het Ministerie van Landbouw, Natuur en Voedselkwaliteit een review laten
      uitvoeren op de door de accountant van de subsidieontvanger verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel22
  - number: '23'
    text: |-
      Binnen vijf jaar na inwerkingtreding van deze regeling publiceert de minister een verslag over de doeltreffendheid
      en de effecten van de subsidie in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel23
  - number: '24.1'
    text: |-
      Het [Besluit natuurbeheer Midden- en Oost-Europa 2001][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0012533
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012533
  - number: '24.2'
    text: |-
      Het in het eerste lid bedoelde [besluit][ref1] blijft van toepassing op op grond daarvan verstrekte subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0012533
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012533
  - number: '25'
    text: |-
      Op projecten en programma’s waarvoor voor 23 februari 2007 subsidie
      is verleend, zijn niet van toepassing de wijzigingen van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________ alsmede wijziging van de [Regeling diverse subsidieplafonds en aanvraagperioden LNV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021341
      [ref2]: https://wetten.overheid.nl/BWBR0016764
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0021341
      - id: ref2
        bwb_id: BWBR0016764
  - number: '27'
    text: 'Deze regeling wordt aangehaald als: Regeling subsidiëring Actieplan BBI-Matra 2005–2008.'
    url: https://wetten.overheid.nl/BWBR0018423/2008-02-02#Artikel27
