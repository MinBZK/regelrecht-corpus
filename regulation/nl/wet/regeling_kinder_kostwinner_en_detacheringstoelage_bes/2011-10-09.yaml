    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel3
  - number: '4'
    text: |-
      Het genot van kindertoelage vangt aan met ingang van de eerste dag van de maand volgende op die, waarin het recht
      op kindertoelage is ontstaan en eindigt met ingang van de eerste van de maand, volgende op die, waarin het recht op
      kindertoelage verloren is gegaan.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel4
  - number: '5'
    text: |-
      1 De kindertoelage wordt aan de ambtenaar uitbetaald tegelijk met zijn bezoldiging.

      2 De kindertoelage kan, indien gegrond vermoeden bestaat, dat zij niet ten goede komt of zal komen aan het kind ten
      behoeve waarvan zij is toegekend, aan een ander dan aan de ambtenaar betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel5
  - number: 5a
    text: |-
      1 Indien beide ouders ambtenaar zijn, heeft slechts de ouder, tot wiens huisgezin het kind behoort, recht op het
      genot van de kindertoelage.

      2 Onverminderd het bepaalde in het vorige lid wordt bij de vaststelling van de kindertoelage rekening gehouden met
      de ouder, die de hoogste bezoldiging geniet.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel5a
  - number: '6'
    text: |-
      1 De kostwinnerstoelage bedraagt per jaar het verschil tussen de bezoldiging, welke de ambtenaar zou genieten,
      indien hij gehuwd is of gehuwd is geweest, of, als het een vrouwelijke ambtenaar betreft, indien zij gehuwd is
      geweest en niet is hertrouwd en de bezoldiging, welke hij geniet.

      2 Zij kan worden genoten door de ambtenaar, die als enig kostwinner in de zin van het [volgende artikel][ref1]
      wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0028783#Artikel7
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028783
        artikel: '7'
        paragraaf: '3'
  - number: '7'
    text: |-
      Als enig kostwinner wordt aangemerkt:

      a. de ambtenaar die krachtens de in [artikel 17 lid 1 van de Wet materieel ambtenarenrecht BES][ref1] bedoelde
      regelen als ongehuwd wordt aangemerkt en op wie een wettelijke alimentatieplicht rust anders dan ten aanzien van
      een natuurlijk kind of natuurlijke kinderen dan wel die voorziet in het levensonderhoud van broeder of zuster, die
      hetzij jonger is dan 18 jaar dan wel ouder dan 50 jaar, hetzij wegens ziels- of lichaamsgebreken blijvend niet in
      staat is in zijn of haar eigen levensonderhoud te voorzien;

      b. de gehuwde vrouwelijke ambtenaar, wier echtgenoot wegens ziels- of lichaamsgebreken blijvend niet in staat is in
      het levensonderhoud van zich en zijn gezin te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '17'
  - number: '8'
    text: |-
      Het genot van kostwinnerstoelage vangt aan met ingang van de dag van toekenning en eindigt in ieder geval met
      ingang van de eerste dag, van de maand volgende op die, waarin de omstandigheden, welke tot toekenning aanleiding
      hebben gegeven, hebben opgehouden te bestaan.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel8
  - number: '9'
    text: |-
      Geen kostwinnerstoelage wordt toegekend, wanneer degene ten aanzien van wie de ambtenaar als enig kostwinner is
      aangemerkt uit andere hoofde inkomsten geniet of redelijkerwijs zou kunnen genieten, welke gelijk zijn aan of meer
      bedragen dan het bedrag bedoeld in [artikel 6 lid 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028783#Artikel6
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028783
        artikel: '6'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 De inkomsten, welke degene ten aanzien van wie de ambtenaar als enig kostwinner is aangemerkt, uit andere hoofde
      geniet of gaat genieten dan wel redelijkerwijs zou kunnen genieten, worden op de kostwinnerstoelage, welke wordt of
      is toegekend, in mindering gebracht.

      2 Voor de berekening van het bedrag van de vermindering worden de inkomsten, over een tijdvak van 6 maanden
      afgerond naar beneden tot het naaste bedrag in dollars, dat een veelvoud is van zes, vergeleken met de
      kostwinnerstoelage over hetzelfde tijdvak.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel10
  - number: '11'
    text: |-
      1 De kostwinnerstoelage wordt aan de ambtenaar uitbetaald tegelijk met zijn bezoldiging.

      2 De kostwinnerstoelage kan, indien gegrond vermoeden bestaat, dat zij niet ten goede komt of zal komen aan degene
      ten behoeve van wie zij is toegekend aan een ander dan aan de ambtenaar betaalbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel11
  - number: '12'
    text: |-
      De ambtenaar, aan wie een kostwinnerstoelage is toegekend, is gehouden het bevoegd gezag, uit eigen beweging en
      desgevraagd onverwijld schriftelijk in kennis te stellen van alles wat op de grootte van het bedrag van de toelage
      van invloed kan zijn, met uitzondering van wijzigingen in zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel12
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel13
  - number: '14'
    text: |-
      1 De ambtenaar, die tijdelijk buiten zijn standplaats te werk wordt gesteld, wordt ter bestrijding van de daaruit
      voortvloeiende onvermijdelijke uitgaven in het genot gesteld van een detacheringstoelage.

      2 De toelage wordt van geval tot geval en als regel voor een tijdvak van ten hoogste drie maanden vastgesteld, mede
      aan de hand van de door de ambtenaar verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel14
  - number: '15'
    text: |-
      De ambtenaren, die op grond van wettelijke regelingen, welke vervallen bij de inwerkingtreding van deze regeling,
      toelagen genieten als bedoeld in de voorgaande artikelen worden voor het verdere genot dier toelagen geacht
      die toelagen te genieten op grond van toekenning krachtens de onderscheiden artikelen van deze regeling en met
      inachtneming overigens van de onderscheiden bepalingen van deze regeling.
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel15
  - number: 15a
    text: |-
      Deze regeling berust op [artikel 31, onder a, van de Rechtspositiebesluit ambtenaren BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel31
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '31'
