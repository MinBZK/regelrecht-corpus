        artikel: '17'
  - number: '2'
    text: |-
      De toelagen, bedoeld in de [paragrafen 2][ref1] en [4][ref2] worden aan de ambtenaar toegekend door het gezag, dat
      bevoegd is de bezoldiging aan de ambtenaar toe te kennen of in de toegekende bezoldiging wijziging te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0028783#Paragraaf2
      [ref2]: https://wetten.overheid.nl/BWBR0028783#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel2
    references:
