    text: |-
      In deze regeling wordt verstaan onder:

      a. *ambtenaar:* ambtenaar in dienst van de staat;

      b. *bezoldiging:* bezoldiging bedoeld in [artikel 17 van de Wet materieel ambtenarenrecht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel17
    url: https://wetten.overheid.nl/BWBR0028783/2011-10-09#Artikel1
    references:
