---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_rivm
regulatory_layer: WET
publication_date: '2020-09-04'
valid_from: '2024-01-01'
bwb_id: BWBR0008289
url: https://wetten.overheid.nl/BWBR0008289/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijk te regelen dat het Rijksinstituut voor
    volksgezondheid en milieu zijn taken ten behoeve van de beleidsontwikkeling en het toezicht op het terrein van de
    volksgezondheid en het terrein van het milieu zelfstandig uitoefent;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel1
  - number: 1.b
    text: |-
      RIVM: het rijksinstituut, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel2
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      de directeur-generaal: de directeur-generaal van het RIVM, genoemd in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel2
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: Er is een Rijksinstituut voor volksgezondheid en milieu, dat ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel2
  - number: '2.2'
    text: De leiding van het RIVM berust bij de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel2
  - number: '3.1'
    text: 'Het RIVM heeft, onverminderd het bepaalde bij of krachtens andere wetten, tot taak:'
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: 3.1.a
    text: |-
      monitoring, surveillance en onderzoek te verrichten dat is gericht op ondersteuning van de beleidsontwikkeling,
      de beleidsuitvoering, de bewaking van de veiligheid en de uitoefening van toezicht op het gebied van de
      volksgezondheid en het milieu;
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: 3.1.b
    text: periodiek te rapporteren over de toestand en de toekomstige ontwikkeling van de volksgezondheid en het milieu;
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: 3.1.c
    text: |-
      de landelijke aansturing en begeleiding uit te voeren van preventieprogramma’s die bij besluit van Onze Minister
      zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: 3.1.d
    text: |-
      deel te nemen aan internationale samenwerkingsverbanden en onderzoek en daarbij inhoudelijk coördinerend op te
      treden wanneer dit voor de uitvoering van de taken, bedoeld in de onderdelen a tot en met c, wenselijk is;
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: 3.1.e
    text: andere door Onze Minister op te dragen werkzaamheden uit te voeren.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het RIVM kan in overeenstemming met Onze Minister andere taken dan die, bedoeld in het eerste lid, onderdeel a,
      alsmede andere werkzaamheden dan die, bedoeld in het eerste lid, onderdeel e, verrichten indien dat uit oogpunt van
      algemeen belang nuttig is te achten. De kosten van zodanig onderzoek of zodanige werkzaamheden brengt het RIVM in
      rekening bij degene, in wiens opdracht het onderzoek of de werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voor zover noodzakelijk voor de uitvoering van de in het eerste lid, onderdeel e, bedoelde taak, is het RIVM
      bevoegd tot verwerking van gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming en is het RIVM verwerkingsverantwoordelijke als bedoeld in artikel 4 van de
      Algemene verordening gegevensbescherming. Deze gegevens worden alleen verwerkt door personen die uit hoofde van
      ambt, beroep of wettelijk voorschrift dan wel krachtens een overeenkomst tot geheimhouding zijn verplicht.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel3
  - number: '4'
    text: |-
      De directeur-generaal stelt periodiek een meerjarenprogramma voor onderzoek, innovatie en expertiseontwikkeling op
      dat hij noodzakelijk acht voor het verwerven van inzichten en de ontwikkeling van methoden om de taken, bedoeld in
      [artikel 3, eerste lid][ref1], adequaat te kunnen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      Onze Minister geeft aan de directeur-generaal geen aanwijzingen met betrekking tot de methoden, volgens welke de
      onderzoeken, bedoeld in [artikel 3][ref1], worden uitgevoerd en de resultaten daarvan worden gerapporteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      Onze Minister zendt rapporten als bedoeld in [artikel 3, eerste lid, onder b][ref1], en meerjarenbeleidsplannen aan
      de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Er is een commissie van toezicht die tot taak heeft het wetenschappelijk niveau van het RIVM en de
      onafhankelijkheid van het onderzoek, bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], te bewaken. De
      commissie rapporteert hierover jaarlijks aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: Onverminderd het vierde lid bestaat de commissie van toezicht uit ten hoogste zeven leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel7
  - number: '7.3'
    text: |-
      De leden worden door Onze Minister in overeenstemming met Onze Ministers van Landbouw, Natuur en Voedselkwaliteit
      en Infrastructuur en Waterstaat benoemd voor een periode van vier jaar. De leden kunnen worden herbenoemd voor
      eenzelfde periode. De voorzitter en één ander lid worden benoemd op de voordracht van de Koninklijke Nederlandse
      Akademie van Wetenschappen.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel7
  - number: '7.4'
    text: |-
      Indien dat voor een specifieke onderzoeksopdracht wenselijk is, kan Onze Minister na overleg met Onze Ministers die
      het mede aangaat, op verzoek van de voorzitter voor de duur van het onderzoek één of meer leden aan de commissie
      toevoegen met deskundigheid op een specifiek terrein van wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel7
  - number: '8'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel8
  - number: '9'
    text: 'Deze wet wordt aangehaald als: Wet op het RIVM.'
    url: https://wetten.overheid.nl/BWBR0008289/2024-01-01#Artikel9
