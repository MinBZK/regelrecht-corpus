preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is wettelijk te regelen dat het Rijksinstituut voor
    volksgezondheid en milieu zijn taken ten behoeve van de beleidsontwikkeling en het toezicht op het terrein van de
    volksgezondheid en het terrein van het milieu zelfstandig uitoefent;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel1
  - number: 1.b
    text: |-
      RIVM: het rijksinstituut, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel2
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      de directeur-generaal: de directeur-generaal van het RIVM, genoemd in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel2
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.d
    text: |-
      meerjaren-activiteitenprogramma: een programma als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel4
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '4'
        hoofdstuk: '2'
  - number: '2.1'
    text: Er is een Rijksinstituut voor volksgezondheid en milieu, dat ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel2
  - number: '2.2'
    text: |-
      De leiding van het RIVM berust bij de directeur-generaal van het RIVM. De directeur-generaal wordt door Onze
      Minister in overeenstemming met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van
      Landbouw, Natuur en Voedselkwaliteit benoemd.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel2
  - number: '3.1'
    text: 'Het RIVM heeft, onverminderd het bepaalde bij of krachtens andere wetten, tot taak:'
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel3
  - number: 3.1.a
    text: |-
      onderzoek te verrichten, dat is gericht op ondersteuning van de beleidsontwikkeling en de uitoefening van toezicht
      op het terrein van de volksgezondheid, het terrein van het milieu en het terrein van natuur, bos en landschap;
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel3
  - number: 3.1.b
    text: periodiek te rapporteren over de toestand en de toekomstige ontwikkeling van de volksgezondheid en het milieu;
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel3
  - number: 3.1.c
    text: andere door Onze Minister op te dragen werkzaamheden uit te voeren.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het RIVM kan ander onderzoek dan dat, bedoeld in het eerste lid, onder *a*, alsmede andere werkzaamheden dan die,
      bedoeld in het eerste lid, onder *c*, verrichten indien dat uit een oogpunt van algemeen belang nuttig is te achten
      en dit onderzoek of die werkzaamheden zijn opgenomen in een meerjaren-activiteitenprogramma. De kosten van zodanig
      onderzoek of zodanige werkzaamheden brengt het RIVM in rekening bij degene, in wiens opdracht het onderzoek of de
      werkzaamheden worden verricht.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel3
  - number: '4.1'
    text: |-
      De directeur-generaal stelt jaarlijks, na overleg met Onze Minister, een meerjaren-activiteitenprogramma op, waarin
      zijn opgenomen alle activiteiten op het terrein van de volksgezondheid, die het RIVM voornemens is in de komende
      jaren uit te voeren. Het meerjaren-activiteitenprogramma en wijzigingen daarin behoeven de goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      De directeur-generaal stelt jaarlijks, na overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, een meerjaren-activiteitenprogramma op, waarin zijn opgenomen alle activiteiten op het terrein van
      het milieu, die het RIVM voornemens is in de komende jaren uit te voeren. Het meerjaren-activiteitenprogramma en
      wijzigingen daarin behoeven de goedkeuring van Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel4
  - number: '4.3'
    text: |-
      De directeur-generaal stelt jaarlijks, na overleg met Onze Minister van Landbouw, Natuur en Voedselkwaliteit,
      een meerjarenactiviteitenprogramma op, waarin zijn opgenomen de activiteiten op het terrein van natuur, bos en
      landschap die het RIVM en de andere betrokken instellingen in het kader van de opstelling van de rapporten, bedoeld
      in [artikel 1.9 van de Wet natuurbescherming][ref1], voornemens zijn in de komende jaren uit te voeren. Het
      meerjarenprogramma en wijzigingen daarin behoeven de goedkeuring van Onze Minister en Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '1'
  - number: '4.4'
    text: |-
      De directeur-generaal stelt jaarlijks, na overleg met Onze Minister en Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuur en Voedselkwaliteit, een meerjaren-
      activiteitenprogramma op van onderzoek dat hij noodzakelijk acht voor het verwerven van inzichten die nodig zijn om
      de in [artikel 3, eerste lid, onder ][ref1], genoemde taken adequaat te kunnen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      Onze Minister geeft aan de directeur-generaal geen aanwijzingen met betrekking tot de methoden, volgens welke de
      in de meerjaren-activiteitenprogramma’s opgenomen onderzoeken worden uitgevoerd en de resultaten daarvan worden
      gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel5
  - number: '6'
    text: |-
      De directeur-generaal zendt jaarlijks voor 1 juni aan Onze Minister en Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuur en Voedselkwaliteit een verslag van de werkzaamheden
      van het RIVM in het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister en Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuur
      en Voedselkwaliteit zenden rapporten als bedoeld in [artikel 3, eerste lid, onder b][ref1], alsmede de meerjaren-
      activiteitenprogramma's, bedoeld in [artikel 4][ref2], en het verslag, bedoeld in [artikel 6][ref3], aan de Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008289#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008289#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008289#Artikel6
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008289
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008289
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008289
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.1'
    text: Er is een Commissie van toezicht die tot taak heeft het wetenschappelijk niveau van het RIVM te bewaken.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel8
  - number: '8.2'
    text: 'De Commissie van toezicht bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel8
  - number: 8.2.a
    text: |-
      twee door Onze Minister in overeenstemming met Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer en van Landbouw, Natuur en Voedselkwaliteit op voordracht van de Koninklijke Nederlandse Academie van
      Wetenschappen telkens voor vier jaren te benoemen leden, waaronder de voorzitter, en
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel8
  - number: 8.2.b
    text: |-
      telkens één lid, aan te wijzen door de directie van het Centraal Planbureau, de directeur van het Sociaal en
      Cultureel Planbureau, het hoofd van de Rijksplanologische Dienst en de directeur-generaal voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister en Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuur
      en Voedselkwaliteit kunnen daarnaast telkens voor vier jaren personen, die deskundig zijn op het terrein van het
      wetenschappelijk onderzoek op het gebied van de volksgezondheid, het milieu of natuur, bos of landschap, tot lid
      van de commissie benoemen.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel8
  - number: '10'
    text: |-
      Het koninklijke besluit van 30 december 1983, houdende instelling van het Rijksinstituut voor Volksgezondheid en
      Milieuhygiëne (*Stb*. 728) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel10
  - number: '11'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel11
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Wet op het RIVM.'
    url: https://wetten.overheid.nl/BWBR0008289/2017-01-01#Artikel12
