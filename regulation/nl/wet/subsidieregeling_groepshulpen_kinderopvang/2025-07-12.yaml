preamble:
  text: |-
    Gelet op de artikelen 2, aanhef en onderdeel f, 3, eerste lid, en 5 van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvrager:* een houder, als bedoeld in de [wet Kinderopvang][ref1], van
      een geregistreerd kindercentrum, die subsidie aanvraagt op grond van deze regeling;
        - *deeltijdpercentage:* het aantal in de arbeidsovereenkomst opgenomen contracturen met een maximum van 36
      contracturen, gedeeld door 36;
        - *de-minimisverklaring:* verklaring als bedoeld in artikel 7, vierde lid, van de [Verordening (EU) nr. 2023/2831]
      (32023R2831) van de Commissie van 13 december 2023 betreffende de toepassing van de artikelen 107 en 108 van het
      Verdrag betreffende de werking van de Europese Unie op de-minimissteun (PbEU L 2023/ 2831);
        - *geregistreerd kindercentrum:* een geregistreerd kindercentrum als bedoeld in de [Wet kinderopvang][ref2];
        - *groepshulp:* een persoon die op grond van een arbeidsovereenkomst een groepsondersteunende functie in een
      geregistreerd kindercentrum van de aanvrager vervult als bedoeld in de Cao Kinderopvang 2023–2024;
        - *minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *RVO:* Rijksdienst voor Ondernemend Nederland van het Ministerie van Economische Zaken en Klimaat.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel1
