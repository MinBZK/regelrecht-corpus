      [Kaderregeling subsidies OCW, SZW en VWS][ref1] van toepassing, met uitzondering van de [artikelen 3.1][ref2],
      [3.2, tweede lid][ref3], [7.1][ref4], [7.2][ref5] en [7.3][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037603
      [ref2]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037603#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037603#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0037603#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0037603#Artikel7
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel2
