  - number: '3'
    text: |-
      Het doel van deze regeling is de inzet en doorontwikkeling van groepshulpen met een arbeidsovereenkomst te
      stimuleren, door het verstrekken van een tegemoetkoming in de loonkosten van groepshulpen bij geregistreerde
      kindercentra.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel3
  - number: '4.1'
    text: 'Subsidie op grond van deze regeling wordt slechts verstrekt indien aan alle onderstaande voorwaarden is voldaan:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.a
    text: |-
      aan de aanvrager is ook subsidie verstrekt op grond van de [Subsidieregeling praktijkleren in de derde leerweg][ref1]
      of op grond van de [Subsidieregeling praktijkleren][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046007
      [ref2]: https://wetten.overheid.nl/BWBR0034144
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0046007
      - id: ref2
        bwb_id: BWBR0034144
  - number: 4.1.b
    text: |-
      de subsidie, bedoeld in onderdeel a, is verstrekt voor de groepshulp voor wie subsidie op grond van deze regeling
      wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.c
    text: 'de groepshulp voor wie subsidie wordt aangevraagd:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.c.1°
    text: |-
      volgt scholing of heeft scholing gevolgd via praktijkleren in het mbo als bedoeld in
      [artikel 1 van de Subsidieregeling praktijkleren in de derde leerweg][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0046007#Artikel1
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0046007
        artikel: '1'
  - number: 4.1.c.2°
    text: |-
      heeft deelgenomen aan een gerealiseerde praktijkleerplaats voor een mbo-student in het kader van een
      beroepsopleiding als bedoeld in [artikel 4 van de Subsidieregeling praktijkleren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034144#Artikel4
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0034144
        artikel: '4'
  - number: 4.1.d
    text: |-
      de scholing via praktijkleren in het mbo of de gerealiseerde praktijkleerplaats, bedoeld in onderdeel c, is gestart
      tussen 1 augustus 2023 en 31 oktober 2026;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.e
    text: |-
      de groepshulp is ten minste 12 maanden werkzaam of werkzaam geweest bij een geregistreerd kindercentrum van de
      aanvrager, op grond van een arbeidsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.f
    text: |-
      de arbeidsovereenkomst heeft een geldigheid van ten minste 12 maanden en een startdatum van 1 augustus 2023 of
      later;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.g
    text: voor de groepshulp is niet al eerder subsidie op grond van deze regeling toegekend;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.h
    text: |-
      de loonkosten van de groepshulp zijn of worden niet deels of geheel gefinancierd uit hoofde van een andere
      regeling; en
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.1.i
    text: |-
      de aanvrager ontvangt door de subsidieverstrekking niet meer steun dan geoorloofd is op grond van artikel 3,
      tweede lid, van de [Verordening (EU) nr. 2023/2831](32023R2831) van de Commissie van 13 december 2023 betreffende
      de toepassing van de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-
      minimissteun (PbEU L 2023/2831).
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: '4.2'
    text: |-
      De scholing via praktijkleren in het mbo of de gerealiseerde praktijkleerplaats, bedoeld in het eerste lid,
      onderdeel c, bestaat uit:
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.2.a
    text: |-
      een beroepsopleiding op mbo-1 niveau als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref1] of een onderdeel daarvan
      waarvoor een certificaat als bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref2] of een
      verklaring als bedoeld in [artikel 7.4.6a van de Wet educatie en beroepsonderwijs][ref3] kan worden verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.2.b
    text: |-
      een beroepsopleiding op mbo-2 niveau als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel b, van de Wet educatie en beroepsonderwijs][ref1] of een onderdeel daarvan
      waarvoor een certificaat als bedoeld in [artikel 7.2.3 van de Wet educatie en beroepsonderwijs][ref2] of een
      verklaring als bedoeld in [artikel 7.4.6a van de Wet educatie en beroepsonderwijs][ref3] kan worden verkregen; of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 4.2.c
    text: 'een van de volgende mbo-3 niveau certificaten:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.2.c.1°
    text: C0123 Ontwikkeling en spelen stimuleren in de kinderopvang;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.2.c.2°
    text: C0125 Pedagogisch klimaat in de kinderopvang; of
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: 4.2.c.3°
    text: C0126 Professioneel samenwerken en communiceren in de kinderopvang.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel4
  - number: '5.1'
    text: 'Een subsidieaanvraag kan bij de minister worden ingediend in de volgende aanvraagtijdvakken:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
  - number: 5.1.a
    text: van de eerste maandag van november 2024, 09:00 uur, tot en met de laatste vrijdag van november 2024, 17:00 uur;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
  - number: 5.1.b
    text: van de eerste maandag van november 2025, 09:00 uur, tot en met de laatste vrijdag van november 2025, 17:00 uur; en
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
  - number: 5.1.c
    text: van de eerste maandag van november 2026, 09:00 uur, tot en met de laatste vrijdag van november 2026, 17:00 uur.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
  - number: '5.2'
    text: |-
      In geval het indienen van een subsidieaanvraag op of kort voor de sluitingsdatum van een aanvraagtijdvak
      langere tijd niet mogelijk is aan de kant van het elektronisch loket, bedoeld in [artikel 8, eerste lid][ref1],
      kan de minister met inachtneming van een redelijke termijn een nieuw tijdstip voor uiterste indiening van een
      subsidieaanvraag bepalen. De minister maakt dit tijdstip bekend op [www.rvo.nl](http://www.rvo.nl).


      [ref1]: https://wetten.overheid.nl/BWBR0049599#Artikel8
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0049599
        artikel: '8'
        paragraaf: '2'
  - number: '5.3'
    text: |-
      Alleen volledige subsidieaanvragen worden in behandeling genomen. Indien een subsidieaanvraag onvolledig is en
      de aanvrager op grond van [artikel 4:5 van de Algemene wet bestuursrecht][ref1] in de gelegenheid is gesteld zijn
      subsidieaanvraag aan te vullen, geldt als datum van ontvangst de datum waarop de volledige aanvraag is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6'
    text: 'Het subsidieplafond bedraagt:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel6
  - number: 6.a
    text: € 1.590.000 voor het aanvraagtijdvak in 2024;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel6
  - number: 6.b
    text: € 1.735.000 voor het aanvraagtijdvak in 2025;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel6
  - number: 6.c
    text: € 1.775.000 voor het aanvraagtijdvak in 2026.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel6
  - number: '7.1'
    text: 'Iedere aanvrager ontvangt per aanvraagtijdvak subsidie voor maximaal:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: 7.1.a
    text: twee groepshulpen in het aanvraagtijdvak in 2024;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: 7.1.b
    text: tien groepshulpen in de aanvraagtijdvakken in 2025 en 2026.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: '7.2'
    text: |-
      De subsidie betreft een tegemoetkoming in de loonkosten van de groepshulp naar rato van het aantal contracturen dat
      de groepshulp op basis van de arbeidsovereenkomst per week werkzaam is, met een maximum van 36 contracturen.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: '7.3'
    text: |-
      Indien het subsidieplafond niet wordt overschreden, bedraagt de subsidie per groepshulp het maximumbedrag van
      € 10.056 vermenigvuldigd met het deeltijdpercentage van de groepshulp.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: '7.4'
    text: |-
      Indien het subsidieplafond wordt overschreden, bedraagt de subsidie per groepshulp: het beschikbare budget in
      het aanvraagtijdvak, gedeeld door het in dat tijdvak totaal aangevraagde bedrag, vermenigvuldigd met € 10.056 en
      vermenigvuldigd met het deeltijdpercentage van de groepshulp.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel7
  - number: '8.1'
    text: |-
      De aanvrager dient de subsidieaanvraag in via de website [www.rvo.nl/groepshulpen-kinderopvang](http://www.rvo.nl/
      groepshulpen-kinderopvang) door middel van een elektronisch aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel8
  - number: '8.2'
    text: |-
      De aanvrager voegt bij de subsidieaanvraag een verklaring waaruit blijkt dat er sprake is van een groepshulp
      met een arbeidsovereenkomst met een geldigheid van ten minste 12 maanden en een startdatum van 1 augustus 2023
      of later, op grond waarvan de groepshulp ten minste 12 maanden werkzaam is of is geweest bij een geregistreerd
      kindercentrum van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel8
  - number: '8.3'
    text: |-
      Op verzoek van de minister overlegt de aanvrager een afschrift van de arbeidsovereenkomst, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel8
  - number: '8.4'
    text: |-
      De aanvrager geeft bij de subsidieaanvraag aan dat de loonkosten van de groepshulp niet deels of geheel uit hoofde
      van een andere regeling zijn of worden gefinancierd.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel8
  - number: '8.5'
    text: De aanvrager voegt bij de subsidieaanvraag een de-minimisverklaring toe.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel8
  - number: '9.1'
    text: De minister stelt de subsidie vast zonder voorafgaande verlening.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel9
  - number: '9.2'
    text: |-
      Subsidie kan worden vastgesteld voor activiteiten die zijn verricht of zullen worden verricht tussen 1 augustus
      2023 en 30 november 2027.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel9
  - number: '10'
    text: |-
      De subsidie kan in ieder geval geheel of gedeeltelijk worden geweigerd, indien de subsidieaanvraag niet voldoet aan
      de daaraan in of op grond van de [Kaderwet SZW-subsidies][ref1] of deze regeling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008754
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008754
  - number: '11'
    text: |-
      De minister beslist binnen 13 weken na sluiting van het aanvraagtijdvak op aanvragen voor het betreffende
      aanvraagtijdvak.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel11
  - number: '12'
    text: |-
      Aan de verstrekking van de subsidie is de verplichting verbonden dat de subsidieontvanger de arbeidsovereenkomst,
      bedoeld in [artikel 4, onderdeel f,][ref1] gedurende vijf jaren bewaart na datum van het vaststellingsbesluit. Deze
      overeenkomst kan door de minister steekproefsgewijs worden opgevraagd met het oog op het toezicht op de naleving
      van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0049599#Artikel4
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0049599
        artikel: '4'
        paragraaf: '1'
  - number: '13.1'
    text: 'Aan de directeur-generaal RVO wordt mandaat verleend tot:'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
  - number: 13.1.a
    text: het voorbereiden en nemen van besluiten namens de minister op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
  - number: 13.1.b
    text: |-
      het nemen van besluiten namens de minister op grond van de [Wet open overheid][ref1] over informatie die verband
      houdt met deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 13.1.c
    text: het beslissen op bezwaarschriften tegen besluiten als bedoeld in de onderdelen a en b; en
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
  - number: 13.1.d
    text: |-
      het in rechte op te treden en tegen rechterlijke uitspraken hoger beroep in te stellen, dan wel af te zien van
      hoger beroep.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
  - number: '13.2'
    text: |-
      De directeur-generaal RVO kan met betrekking tot zijn bevoegdheden, bedoeld in het eerste lid, ondermandaat
      verlenen aan één of meer onder hem ressorterende medewerkers.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel13
  - number: '14.1'
    text: |-
      De minister is verwerkingsverantwoordelijke als bedoeld in artikel 4 van de Algemene verordening
      gegevensbescherming voor de verwerking van persoonsgegevens op basis van deze regeling.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel14
  - number: '14.2'
    text: |-
      RVO is verwerker voor de verwerking van persoonsgegevens ter uitvoering van de gemandateerde taken, bedoeld in
      [artikel 13][ref1] en [artikel 16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0049599#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0049599#Artikel16
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0049599
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0049599
        artikel: '16'
        paragraaf: '4'
  - number: '15'
    text: |-
      Medewerkers van het Ministerie van Economische Zaken en Klimaat zijn belast met het toezicht op de naleving van
      deze regeling, voor zover zij werkzaamheden verrichten ten behoeve van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel15
  - number: '16.1'
    text: De minister draagt zorg voor de evaluatie van de doeltreffendheid en doelmatigheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel16
  - number: '16.2'
    text: |-
      De subsidieaanvrager werkt mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister
      inlichtingen te verschaffen die van belang zijn voor de evaluatie van de doeltreffendheid en doelmatigheid van deze
      regeling en de ontwikkeling van het beleid van de minister. De subsidieaanvrager verstrekt in dat kader de daartoe
      benodigde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel16
  - number: '17.1'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst en vervalt met ingang van 1 januari 2027.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel17
  - number: '17.2'
    text: |-
      In afwijking van het eerste lid blijft deze regeling van toepassing op de afwikkeling van verleende of aangevraagde
      subsidies op grond van deze regeling.
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel17
  - number: '18'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling groepshulpen kinderopvang.'
    url: https://wetten.overheid.nl/BWBR0049599/2025-07-12#Artikel18
