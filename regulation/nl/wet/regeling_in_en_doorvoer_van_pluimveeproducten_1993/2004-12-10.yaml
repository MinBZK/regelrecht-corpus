  - number: 1a
    text: |-
      Deze regeling is niet van toepassing op vleesproducten als bedoeld in artikel 1 van [verordening (EG) nr. 745/2004]
      (32004R0745) van de Commissie van de Europese Gemeenschappen van 16 april 2004 tot vaststelling van maatregelen
      betreffende de invoer van producten van dierlijke oorsprong voor persoonlijke consumptie (PbEU L 122), voor
      zover door reizigers in de Europese Gemeenschap binnengebracht of aan particulieren in de Europese Gemeenschap
      toegezonden.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel1a
  - number: '2.1'
    text: De in- en doorvoer van pluimveeproducten is verboden.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel2
  - number: '2.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing op de in het eerste lid bedoelde producten, die als proviand
      voor personeel en passagiers wordt onderscheidenlijk worden meegenomen in grensoverschrijdende vervoermiddelen,
      tijdens beroepsmatig vervoer.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel2
  - number: '3.1'
    text: |-
      Het verbod, gesteld in [artikel 2, eerste lid][ref1], is niet van toepassing op de in- en doorvoer van:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '2'
        paragraaf: '2'
  - number: 3.1.a
    text: |-
      vleesproducten van pluimvee afkomstig uit een lid-staat of Noorwegen, die voldoen aan de artikelen 3 en
      4 van [richtlijn 77/99/EEG](31977L0099) en ten bewijze daarvan vergezeld gaan van een handelsdocument,
      bedoeld in artikel 3, onderdeel A, onder 9, van [richtlijn 77/99/EEG](31977L0099), mits wordt voldaan aan de
      [artikelen 4 tot en met 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
  - number: 3.1.b
    text: |-
      vleesproducten van pluimvee afkomstig uit een derde land of gedeelte van een derde land niet zijnde Noorwegen, mits
      wordt voldaan aan [verordening 136/2004/EG](32004R0136) en de [artikelen 8 tot en met 14][ref1], die:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel8
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '8'
        paragraaf: '5'
  - number: 3.1.b.1º
    text: |-
      afkomstig zijn uit een derde land of gedeelde van een derde land dat voor de betrokken diersoort waarvan het vlees
      afkomstig is, staat vermeld op de lijst, opgenomen in de bijlagen I en II van beschikking 97/222/EEG;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.1.b.2º
    text: |-
      vergezeld gaan een gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in de bijlage
      bij beschikking 97/221/EG, en voldoet aan de voorwaarden en eisen die in voornoemde beschikking en in vorenbedoeld
      certificaat zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.1.b.3º
    text: |-
      voorts vergezeld gaan van een gezondheidscertificaat waarvan het model overeenstemt met het model, vastgesteld in
      de bijlage bij beschikking 97/41/EG, en voldoet aan de voorwaarden en eisen die in voornoemde beschikking en in
      vorenbedoeld certificaat zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.1.b.4º
    text: |-
      afkomstig zijn uit een inrichting die, zodra deze is vastgesteld en in werking getreden, voorkomt op de voor de
      betrokken vleesproducten uit het betrokken land van herkomst geldende voorlopige lijst van inrichtingen als bedoeld
      in beschikking 95/408/EG van de Raad van de Europese Unie van 22 juni 1995 tot vaststelling van voorschriften voor
      het opstellen voor een overgangsperiode van voorlopige lijsten van inrichtingen in derde landen waaruit de lid-
      staten bepaalde producten van dierlijke oorsprong, visserijproducten en levende tweekleppige weekdieren mogen
      invoeren (PbEG L 243), die alsdan ter inzage ligt in de bibliotheek van het Ministerie van Landbouw, Natuurbeheer
      en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling van voornoemde lijst is voorzien in
      overgangsbepalingen de vleesproducten met inachtneming van die bepalingen afkomstig mogen zijn uit een inrichting
      die voldoet aan de voorschriften van hoofdstuk 1 van bijlage II van [richtlijn 92/118/EEG](31992L0118), en
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.1.b.5º
    text: |-
      niet afkomstig zijn van pluimvee waaraan stoffen of producten zijn toegediend die ingevolge artikel 3, onderdeel
      a, van [richtlijn 96/22/EG](31996L0022) van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende
      het gebruik, in de veehouderij, van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten en tot
      intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG
      L 125), niet aan pluimvee mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: '3.2'
    text: |-
      Het verbod, gesteld in [artikel 2, eerste lid][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '2'
        paragraaf: '2'
  - number: 3.2.a
    text: |-
      de in- en doorvoer van andere producten van dierlijke oorsprong, afkomstig van pluimvee alsmede van oorsprong
      en herkomst uit een lid-staat of Noorwegen, die voldoen aan het bepaalde in artikel 6 van [richtlijn
      77/99/EEG](31977L0099) en ten bewijze daarvan vergezeld gaan van het handelsdocument, bedoeld in artikel
      6, eerste lid, vierde gedachtenstreepje van die richtlijn, mits wordt voldaan aan het bepaalde in de
      [artikelen 4 tot en met 7][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
  - number: 3.2.b
    text: |-
      de in- en doorvoer van andere producten van dierlijke oorsprong, afkomstig van pluimvee, alsmede van oorsprong en
      herkomst uit een derde land of gedeelte van een derde land als bedoeld in het tweede lid, onderdeel b, onder 1,
      die voldoen aan, voor zover van toepassing, artikel 6 van [richtlijn 77/99/EEG](31977L0099) en ten bewijze daarvan
      vergezeld gaan van een certificaat dat is opgesteld in de Nederlandse, Franse, Engelse of Duitse taal, dat uit
      één vel bestaat en dat is ingericht overeenkomstig een door de Minister vastgesteld model, mits wordt voldaan aan
      [verordening 136/2004/EG](32004R0136) en de [artikelen 8 tot en met 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel8
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '8'
        paragraaf: '5'
  - number: '3.3'
    text: |-
      Zolang de voorschriften voor het vanuit derde landen op het grondgebied van de Europese Gemeenschap brengen
      van pluimveeproducten niet of slechts gedeeltelijk ingevolge de regelgeving van de Europese Gemeenschap zijn
      vastgesteld, is, indien deze producten zijn bestemd voor een lid-staat, tevens voldaan aan de voorschriften die
      door de lid-staat van bestemming ter zake van de invoer van die producten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van hetgeen in dit artikel is bepaald ten aanzien van de voor de vleesproducten of andere producten
      van dierlijke oorsprong uit derde landen voorgeschreven gezondheidscertificaten, mag een partij afkomstig uit
      Nieuw- Zeeland eveneens vergezeld gaan van een op de partij betrekking hebbend(e):
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.4.a
    text: |-
      dier- en volksgezondheidscertificaat zoals dat op 31 december 1996 voor het betrokken product was voorgeschreven,
      of
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.4.b
    text: |-
      met ingang van de datum van inwerkingtreding van de Overeenkomst van 17 december 1996 tussen de Europese
      Gemeenschap en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten
      (PbEG 1997, L 57), een gezondheidscertificaat zoals dat ingevolge de regelgeving van de Europese Gemeenschap
      ter uitvoering van die Overeenkomst is vastgesteld en dat een verklaring als bedoeld in bijlage VII van die
      Overeenkomst bevat, met dien verstande dat zolang de voorschriften voor vleesproducten van pluimvee niet, dan wel
      enkel op het gebied van de volks- of diergezondheid als gelijkwaardig zijn erkend, een dier- en, onderscheidenlijk
      of, volksgezondheidscertificaat als bedoeld in het eerste lid, onderdeel b, onder 1 en 2, is bijgevoegd.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: '3.5'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel a, en het tweede lid, aanhef en onderdeel a, is het verbod,
      gesteld in [artikel 2, eerste lid][ref1], tot en met 30 april 2005 evenmin van toepassing op de in- en doorvoer van
      vleesproducten van pluimvee, onderscheidenlijk andere producten van dierlijke oorsprong, afkomstig van pluimvee,
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '2'
        paragraaf: '2'
  - number: 3.5.a
    text: afkomstig zijn uit Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië of Slowakije;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.5.b
    text: vóór 1 mei 2004 zijn verkregen in een inrichting die erkend was voor uitvoer naar de Europese Gemeenschap, en
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: 3.5.c
    text: voorzien zijn van het keurmerk, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG,
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel3
  - number: '4.1'
    text: |-
      De partij pluimveeproducten, afkomstig uit lid-staten, voldoet, tot en met de ontvangst door de handelaar, aan
      de voorwaarden, gesteld in [artikel 3][ref1], voor zover deze betrekking hebben op de invoer van de betrokken
      pluimveeproducten uit lid-staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: '4.2'
    text: |-
      De handelaar is ingeschreven in een register dat wordt bijgehouden door de Minister aangewezen dienst, terwijl die
      registratie niet is getroffen door een beslissing als bedoeld in [artikel 5, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel5
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '5'
        paragraaf: '4'
  - number: '4.3'
    text: |-
      Krachtens de regelgeving van de Europese Gemeenschappen zijn geen maatregelen genomen, houdende instelling van een
      verbod om de betreffende partij producten uit de betrokken lid-staat in te voeren of houdende de machtiging tot
      instelling van een verbod om de betreffende partij pluimveeproducten in Nederland in te voeren, noch is de lid-
      staat van verzending ingevolge die regelgeving gehouden de afgifte van de certificaten of vervoersdocumenten, zulks
      in verband met de invoer in Nederland, op te schorten.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel4
  - number: '4.4'
    text: |-
      Ingevolge de regelgeving van de lid-staat van verzending is er geen verbod om de betrokken partij pluimveeproducten
      op het grondgebied van die lid-staat in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel4
  - number: '4.5'
    text: |-
      Ten aanzien van de betrokken partij pluimveeproducten is, in voorkomend geval, voldaan aan de ingevolge artikel 9
      van [richtlijn 89/662/EEG](31989L0662) vastgestelde regelgeving van de Europese Gemeenschap of van de lid-staat van
      verzending zelf, in geval van een uitbraak van een epidemische dierziekte in de lid-staat van verzending.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel4
  - number: '5.1'
    text: |-
      De handelaar die overeenkomstig het bepaalde in [artikel 4, tweede lid][ref1], is geregistreerd:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
  - number: 5.1.a
    text: |-
      geeft van elke aanvoer van een partij pluimveeproducten, bedoeld in [artikel 4, eerste lid][ref1], tussen 08.00 uur
      en 17.00 uur en ten laatste op de dag, niet zijnde een zaterdag, zondag of algemeen erkende feestdag, voorafgaande
      aan de dag van aankomst op de plaats waar de handelaar de partij producten ontvangt, kennis aan de VWA, onder
      opgave van de plaats van ontvangst, het vermoedelijke tijdstip van aankomst alsmede van de hoeveelheid en de soort
      pluimveeproducten;


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
  - number: 5.1.b
    text: |-
      volgt de instructies van de officiële dierenarts in verband met een veterinairrechtelijke controle op en
      biedt desgevraagd de aangevoerde partij pluimveeproducten aan de officiële dierenarts ten onderzoek aan en
      overlegt desgevraagd de in [artikel 3][ref1] bedoelde, voor de invoer van de betrokken producten uit lid-staten
      voorgeschreven, documenten en geeft alle medewerking en verstrekt alle inlichtingen die voor deze controle
      noodzakelijk worden geacht;


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: 5.1.c
    text: |-
      voert een administratie waarin ten minste de leveringen van pluimveeproducten en de eventuele verdere bestemming
      van de pluimveeproducten zijn vermeld en waarin alle op de partijen pluimveeproducten betrekking hebbende
      bescheiden, en met name de in onderdeel b bedoelde documenten, zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
  - number: 5.1.d
    text: bewaart de vorenbedoelde administratie gedurende ten minste drie jaren;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
  - number: 5.1.e
    text: |-
      gaat voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke partij
      pluimveeproducten, na of aan de voorwaarden, gesteld in [artikel 3][ref1], voor zover deze betrekking hebben op de
      invoer van de betrokken pluimveeproducten uit lid-staten, is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: 5.1.f
    text: |-
      meldt onmiddellijk nalatigheden en onregelmatigheden met betrekking tot een levering van een partij
      pluimveeproducten aan de officiële dierenarts;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
  - number: 5.1.g
    text: |-
      verleent aan de officiële dierenarts alle medewerking en verstrekt hem alle inlichtingen, die in verband met de
      controle op de naleving van het in dit artikel bepaalde noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
  - number: '5.2'
    text: |-
      Indien een handelaar zijn in het eerste lid bedoelde verplichtingen niet nakomt, kan de Minister beslissen dat
      zijn in [artikel 4, tweede lid][ref1], bedoelde registratie wordt doorgehaald dan wel niet wordt erkend. Doorhaling
      dan wel niet-erkenning geschiedt niet dan na voorafgaande schriftelijke waarschuwing en na het verstrijken van een
      daarbij te stellen termijn, waarbinnen aan de vorenbedoelde voorschriften moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
  - number: '6'
    text: |-
      Bij het vervoer op Nederlands grondgebied in het kader van doorvoer van een uit de lid-staten afkomstige partij
      pluimveeproducten, naar een lid-staat voldoet de partij pluimveeproducten aan de op de doorvoer van die producten
      afkomstig uit lid-staten betrekking hebbende voorwaarden, gesteld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: '7.1'
    text: |-
      Indien bij de controle, bedoeld in [artikel 5, eerste lid, onderdelen b en e][ref1], of bij de controle tijdens
      het vervoer van een partij pluimveeproducten in het kader van de invoer of de doorvoer van deze partij wordt
      vermoed of geconstateerd dat er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in artikel 7,
      eerste lid, onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of de producten afkomstig zijn
      uit een met een epidemische dierziekte besmet gebied, kan de officiële dierenarts, indien hij de aanwezigheid
      van verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, besluiten dat de partij overeenkomstig
      zijn aanwijzingen in tijdelijke afzondering wordt geplaatst, dan wel worden de maatregelen, bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref2], eerste alinea, van voornoemde richtlijn uitgevoerd, al naar gelang de
      Minister daaromtrent heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005907#Artikel7
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '5'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005907
        artikel: '7'
        paragraaf: '4'
  - number: '7.2'
    text: |-
      Indien bij de controle, bedoeld in [artikel 5, eerste lid, onderdelen b en e][ref1], of bij de controle tijdens
      het vervoer van een partij pluimveeproducten in het kader van de invoer of de doorvoer van deze partij wordt
      vermoed of geconstateerd dat niet wordt voldaan aan de voorschriften van de onderhavige regeling dan wel aan de
      van toepassing zijnde communautaire voorschriften, kan de Minister, indien hij vermoedt dat niet wordt voldaan aan
      de vorenbedoelde voorschriften, besluiten dat de partij overeenkomstig zijn aanwijzingen in tijdelijke afzondering
      wordt geplaatst, dan wel worden de maatregelen, bedoeld in artikel 7, eerste lid, onderdeel b, van [richtlijn
      89/662/EEG](31989L0662) uitgevoerd, al naar gelang de Minister daaromtrent overeenkomstig de keuze van de afzender
      of diens gemachtigde heeft besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel5
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '5'
        paragraaf: '4'
  - number: '7.3'
    text: |-
      Een besluit als bedoeld in het eerste en tweede lid, wordt ter kennis gebracht van de afzender of diens gemachtigde
      met vermelding van de redenen. Desgevraagd geschiedt die kennisgeving schriftelijk, met vermelding van datum en uur
      waarop het besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel7
  - number: '7.4'
    text: |-
      Een besluit als bedoeld in het eerste en tweede lid laat onverlet het recht van de afzender van de
      pluimveeproducten om, overeenkomstig het bepaalde in [artikel 8, tweede lid][ref1], vierde alinea, van [richtlijn
      89/662/EEG](31989L0662), binnen een maand na de kennisgeving, bedoeld in het derde lid, het advies van een
      veterinair deskundige in te winnen, met dien verstande evenwel, dat de Minister te allen tijde kan beslissen om
      de maatregelen, bedoeld in het eerste lid, onmiddellijk uit te voeren, indien zulks noodzakelijk is om redenen
      van gezondheidsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel8
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '8'
        paragraaf: '5'
  - number: '7.5'
    text: |-
      De kosten, die uit de in het eerste of het tweede lid bedoelde maatregelen voortvloeien komen voor rekening van
      de afzender van de partij pluimveeproducten of diens gemachtigde, onderscheidenlijk van de ontvanger van de partij
      pluimveeproducten of diens gemachtigde.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel7
  - number: '8.1'
    text: |-
      Noch krachtens artikel artikel 22, eerste lid, eerste gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078), noch
      krachtens andere regelgeving van de Europese Gemeenschappen zijn maatregelen genomen houdende instelling van een
      verbod om de betrokken pluimveeproducten in de Europese Gemeenschappen dan wel in Nederland in te voeren.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van de betrokken partij pluimveeproducten is, in voorkomend geval, voldaan aan de op grond van artikel
      22, eerste lid, tweede en derde gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078) dan wel op grond van andere
      regelgeving van de Europese Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel8
  - number: '9.1'
    text: |-
      De partij pluimveeproducten, afkomstig uit een derde land, die rechtstreeks uit dat derde land in Nederland wordt
      in- of doorgevoerd, wordt aangevoerd via een inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: '9.2'
    text: |-
      De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 2 van [verordening
      136/2004/EG](32004R0136).
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: '9.3'
    text: |-
      Bij de aankomst op de inspectiepost wordt de officiële dierenarts door de belanghebbende bij de lading, indien op
      grond van [artikel 3][ref1] voor de in- en doorvoer van betrokken pluimveeproducten afkomstig uit derde landen een
      document is voorgeschreven, het betreffende document ter beschikking gesteld, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: 9.3.a
    text: |-
      indien de partij is bestemd voor een lid-staat tevens een door of namens de bevoegde autoriteit van die lid staat
      geautoriseerde verklaring ter beschikking wordt gesteld waarin de terzake van invoer in deze lid-staat gestelde
      veterinairrechtelijke eisen zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: 9.3.b
    text: |-
      indien de partij is bestemd voor een derde land en indien opslag op het grondgebied van de Europese Gemeenschappen
      in een douane-entrepot of ruimte voor tijdelijke opslag is voorzien, uit dat document, dan wel, indien op grond van
      [artikel 3][ref1] geen document is vereist, uit een apart document blijkt dat is voldaan aan de voorschriften voor
      invoer in Nederland onderscheidenlijk de betreffende lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: '9.4'
    text: |-
      De partij producten wordt door de belanghebbende bij de lading bij aankomst op de inspectiepost ter onderzoek
      aangeboden aan de officiële dierenarts.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: '9.5'
    text: |-
      De in het derde lid bedoeld documenten zijn originelen waarvan de geldigheidsduur niet is verstreken. Zij zijn,
      voorzover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap opgesteld en afgegeven,
      volledig ingevuld, gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: '9.6'
    text: |-
      Op de in het eerste lid bedoelde partij producten zijn de [artikelen 2.17, zesde tot en met twaalfde lid][ref1],
      en [2.17a tot en met 2.23m van de Regeling keuring en handel dierlijke producten][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '9.7'
    text: |-
      Voor de toepassing van de in het zesde lid bedoelde artikelen wordt voor ‘keuringsdierenarts’ gelezen: officiële
      dierenarts..
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel9
  - number: '10.1'
    text: |-
      Terzake van een partij pluimveeproducten die zich aan boord bevindt van een vliegtuig of schip dat bij vervoer
      tussen twee derde landen op Nederlands grondgebied landt of aanlegt, overlegt de vervoerder aan de officiële
      dierenarts desgevraagd het document, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel3
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '3'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      Indien de in het eerste lid bedoelde partij van het ene vliegtuig of schip in het andere wordt overgeladen, stelt
      de vervoerder de in dat lid bedoelde officiële dierenarts hiervan in kennis en overlegt hij hem desgevraagd het
      document, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel10
  - number: '10.3'
    text: |-
      Indien de in het eerste lid bedoelde partij tijdelijk wordt uitgeladen en opgeslagen op de desbetreffende
      luchthaven of haven, in afwachting van verzending naar een vooraf bepaald derde land, overlegt de vervoerder aan de
      officiële dierenarts, het in het eerste lid bedoelde document en biedt hij de partij aan hem ten onderzoek aan.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel10
  - number: '10.4'
    text: |-
      In de in dit artikel bedoelde gevallen gaat de desbetreffende partij bij verzending naar het derde land vergezeld
      van het originele document, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel10
  - number: '12.1'
    text: |-
      De partij pluimveeproducten, afkomstig uit een derde land, welke via het grondgebied van een lid-staat naar
      Nederland is verzonden, gaat vergezeld van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van
      [richtlijn 97/78/EG](31997L0078) en van een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in
      [verordening 282/2004/EG](32004R0282).
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel12
  - number: '12.2'
    text: |-
      Het bepaalde in [artikel 4, tweede en derde lid][ref1], en [artikel 5][ref2] en [7][ref3] is in geval van een
      invoer als bedoeld in het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005907#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005907#Artikel7
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005907
        artikel: '5'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0005907
        artikel: '7'
        paragraaf: '4'
  - number: '13.1'
    text: |-
      Bij de in- of doorvoer van een partij pluimveeproducten die door een derde land zijn geweigerd en vanuit het
      grondgebied van de Europese Gemeenschap naar het betrokken derde land zijn verzonden, wordt voldaan aan:
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel13
  - number: 13.1.a
    text: |-
      [artikel 9, eerste, tweede en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel9
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '9'
        paragraaf: '5'
  - number: 13.1.b
    text: artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078).
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel13
  - number: '13.2'
    text: |-
      Op de in het eerste lid bedoelde partij producten zijn de
      [artikelen 2.17, achtste en twaalfde lid][ref1], [2.18a][ref2], [2.19, eerste lid][ref3], en
      [2.22, eerste, tweede, vijfde en zesde lid, van de Regeling keuring en handel dierlijke producten][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0006727#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006727
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0006727
        artikel: '2'
  - number: '13.3'
    text: |-
      Indien de in het eerste lid bedoelde partij producten naar het derde land is verzonden vanuit een lid-staat, heeft
      de Minister vooraf toestemming verleend voor het binnenbrengen van de producten en heeft de bevoegde autoriteit
      van de lid-staat die het in artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078) bedoelde
      certificaat heeft afgegeven met de terugname van de partij ingestemd..
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel13
  - number: '14.1'
    text: |-
      Indien wordt vermoed of geconstateerd dat in de partij verwekkers van ziekten, zoönosen of andere aandoeningen
      aanwezig zijn of dat de partij afkomstig is uit een met een epidemische dierziekte besmet gebied, kan de Minister
      besluiten dat de partij overeenkomstig zijn aanwijzingen in tijdelijke afzondering wordt geplaatst, dan wel worden,
      zonder vergoeding van Staatswege en:
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: 14.1.a
    text: |-
      voor rekening van de verzender of diens gemachtigde, al naar gelang de Minister daaromtrent heeft besloten en met
      inachtneming van diens aanwijzingen, de partij vernietigd, of
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: 14.1.b
    text: |-
      voor rekening van de afnemer, al naar gelang de Minister daaromtrent heeft besloten en met inachtneming van diens
      aanwijzingen, voor andere doeleinden gebruikt dan waarvoor ze zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: '14.2'
    text: |-
      Indien aan de hand van de op grond van deze regeling uitgevoerde controles wordt vastgesteld dat een voor
      Nederland of een lidstaat bestemd product niet voldoet aan de op grond van deze regeling voor dat product gestelde
      voorschriften of dat een onregelmatigheid is begaan, besluit de Minister in overleg met de belanghebbende bij de
      lading:
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: 14.2.a
    text: |-
      dat het product in ieder geval binnen 60 dagen nadat is geconstateerd dat niet aan de onderhavige regeling wordt
      voldaan vanuit de grensinspectiepost met hetzelfde vervoermiddel wordt teruggezonden naar een derde land indien
      veterinairrechtelijke of gezondheidsredenen zich daar niet tegen verzetten;
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: 14.2.b
    text: |-
      indien terugzending als bedoeld in onderdeel a onmogelijk is of de in dat onderdeel bedoelde termijn is verstreken,
      dat de partij wordt vernietigd overeenkomstig het bepaalde in artikel 17, tweede lid, onderdeel b, van [richtlijn
      97/78/EG](31997L0078);
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: 14.2.c
    text: dat de partij voor andere doeleinden dan de menselijke consumptie wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: '14.3'
    text: |-
      Indien een partij in Nederland is gebracht zonder dat, voorzover van toepassing, die partij is onderworpen aan de
      in [artikel 9][ref1] bedoelde controles, besluit de Minister dat de partij overeenkomstig het tweede lid, onderdeel
      b, wordt vernietigd of wordt teruggezonden naar een derde land indien veterinairrechtelijke of gezondheidsredenen
      zich daar niet tegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel9
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '9'
        paragraaf: '5'
  - number: '14.4'
    text: |-
      In afwachting van de terugzending of de vernietiging van een partij als bedoeld in het eerste, tweede en derde lid
      wordt de partij onder toezicht van de officiële dierenarts in tijdelijke afzondering geplaatst en opgeslagen.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: '14.5'
    text: |-
      Alle kosten die in verband met de in dit artikel bedoelde maatregelen worden gemaakt, komen ten laste van de
      belanghebbende bij de lading.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel14
  - number: '15.1'
    text: |-
      Voorzover dit niet reeds voortvloeit uit het bepaalde in [artikel 2, tweede lid][ref1], geldt het bepaalde in de
      [artikelen 4 tot en met 13][ref2] niet voor een partij pluimveeproducten als bedoeld in artikel 16, eerste lid,
      van [richtlijn 97/78/EG](31997L0078), met dien verstande dat onder commerciële monsters als bedoeld in artikel
      16, eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078) wordt verstaand handelsmonsters als bedoeld in
      [artikel 1.1, eerste lid, van de Regeling keuring en handel dierlijke producten][ref3], en, mits met inachtneming
      van artikel 8 van [verordening 136/2004/EG](32004R0136), wordt voldaan aan artikel 16, eerste lid, van [richtlijn
      97/78/EG](31997L0078).


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005907#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006727#Artikel1
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005907
        artikel: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006727
        artikel: '1'
  - number: '15.2'
    text: |-
      Pluimveeproducten als bedoeld in artikel 16, eerste lid, onderdelen e en f, van [richtlijn 97/78/EG](31997L0078)
      worden aangevoerd via een inspectiepost.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel15
  - number: '15.3'
    text: |-
      Tenzij met de Minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer als
      bedoeld in het tweede lid ten minste 24 uur voor de aankomst schriftelijk kennis aan de VWA, onder opgave van het
      vermoedelijke tijdstip van aankomst, van de hoeveelheid, van de herkomst en van de soort producten.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel15
  - number: 15a
    text: De minister is de bevoegde autoriteit, bedoeld in artikel 10 van [verordening 136/2004/EG](32004R0136).
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel15a
  - number: '17.1'
    text: |-
      De minister van Landbouw, Natuurbeheer en Visserij kan ontheffing verlenen van het bepaalde in
      [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '2'
        paragraaf: '2'
  - number: '17.2'
    text: Aan een ontheffing als bedoeld in het eerste lid, kunnen voorschriften en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel17
  - number: '18'
    text: |-
      Een wijziging van een of meer onderdelen van de in [artikel 1][ref1] genoemde richtlijnen treedt voor de toepassing
      van de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel1
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005907
        artikel: '1'
        paragraaf: '1'
  - number: 18a
    text: |-
      De [artikelen 4][ref1] tot en met [15][ref2] berusten op de [artikelen 10][ref3], [11][ref4]
      en [13 van de Gezondheids- en welzijnswet voor dieren][ref5] en op de [artikelen 2][ref6] en
