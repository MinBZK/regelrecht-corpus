preamble:
  text: |-
    In overleg met de staatssecretaris van Financiën;

    Gelet op Richtlijn 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt
    (PbEG L 395) alsmede op Richtlijn 90/675/EEG van de Raad van de Europese Gemeenschappen van 10 december 1990 tot
    vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten uit derde landen die
    in de Gemeenschap worden binnengebracht (PbEG L 373);

    Gelet op Beschikking 92/571/EEG van de Commissie van de Europese Gemeenschappen van 15 december 1992 tot
    vaststelling van nieuwe overgangsmaatregelen om de overgang naar de bij Richtlijn 90/675/EEG van de Raad
    vastgestelde regeling inzake veterinaire controles te vergemakkelijken (PbEG L 367), op Beschikking nr. 93/13/EEG
    van de Commissie van de Europese Gemeenschappen van 22 december 1992, tot vaststelling van de procedures voor de
    veterinaire controles in de inspectieposten aan de grens van de Gemeenschap bij het binnenbrengen van producten uit
    derde landen (PbEG 1993, L 9), alsmede op Beschikking nr. 93/14/EEG van de Commissie van de Europese Gemeenschappen
    van 23 december 1992 tot vaststelling van uitvoeringsbepalingen inzake de veterinaire controles van producten uit
    derde landen in vrije entrepots, vrije zones en douane-entrepots, alsmede tijdens het vervoer van een derde land
    naar een ander derde land via de Gemeenschap (PbEG 1993, L 9);

    Gelet op de artikelen 2 en 3, eerste lid, van de Vogelziektenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *richtlijn 77/99/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 21 december 1976 inzake gezondheidsvraagstukken op
      het gebied van het intracommunautaire handelsverkeer in vleesproducten (PbEG 1977, L 26 en PbEG 1992, 57);




              *richtlijn 88/657/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen
      voor de productie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen
      en tot wijziging van de [richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462)
      (PbEG L 382);




              *richtlijn 89/662/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395);




              *richtlijn 97/78/EG:*


              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen in de
      Gemeenschap worden binnen gebracht (PbEG 1998, L 24);




              *verordening 136/2004/EG:*


              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);




              *inspectiepost:*


              op Nederlands grondgebied gelegen inspectiepost aan de grens die voldoet aan de bij of krachtens artikel
      6 van [richtlijn 97/78/EG](31997L0078) gestelde voorschriften en uit dien hoofde overeenkomstig dat artikel is
      aangewezen en erkend voor de controle van bepaalde soorten producten;.



             Minister:

              Minister van Landbouw, Natuurbeheer en Visserij;




              *officiële dierenarts:*


              de door de bevoegde autoriteit van het betrokken land aangewezen dierenarts;




              *lid-staat:*


              lid-staat van de Europese Unie, niet zijnde Nederland;




              *derde land:*


              land, niet zijnde Nederland en niet zijnde een lid-staat;




              *erkende inspectiepost:*


              op Nederlands grondgebied gelegen inspectiepost die is aangewezen en erkend overeenkomstig het bepaalde in
      artikel 9 van [richtlijn 90/675/EEG](31990L0675);




              *douane-entrepot:*


              opslagruimte als bedoeld in [verordening (EEG) nr. 2503/88](31988R2503) van de Raad van de Europese
      Gemeenschappen van 25 juli 1988 betreffende de douane-entrepots (PbEG L 225);




              *vrij entrepot:*


              opslagruimte als bedoeld in artikel 1, vierde lid, onder b, van [verordening (EEG) nr. 2504/88](31988R2504)
      van de Raad van de Europese Gemeenschappen van 25 juli 1988 betreffende de vrije zones en de vrije entrepots (PbEG
      L 225);




              *ruimte voor tijdelijke opslag:*


              opslagruimte als bedoeld in [verordening (EEG) nr. 4151/88](31988R4151) van de Raad van de Europese
      Gemeenschappen van 21 december 1988 tot vaststelling van de bepalingen die van toepassing zijn op goederen die het
      douanegebied van de Gemeenschap worden binnengebracht (PbEG L 367);




              *partij:*


              hoeveelheid pluimveeproducten van dezelfde aard waarvoor, voor zover van toepassing, eenzelfde certificaat
      of document geldt, die met hetzelfde vervoermiddel wordt vervoerd en afkomstig is uit hetzelfde land of gedeelte
      van een land;




              *handelaar:*


              elke natuurlijke persoon of rechtspersoon, zijnde de eerste ontvanger op Nederlands grondgebied van een
      partij pluimveeproducten afkomstig uit een lid-staat;




              *belanghebbende bij de lading:*


              belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, onderdeel e, van [richtlijn 97/78/EG]
      (31997L0078);.




              *pluimvee:*


              kippen, kalkoenen, parelhoenders, eenden en ganzen, alsmede vogels als bedoeld in artikel 2, derde lid,
      van [richtlijn nr. 91/495/EEG](31991L0495) van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake
      gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de productie en het in de handel brengen van
      konijnevlees en vlees van gekweekt wild (PbEG L 268).



             pluimveeproducten:

              vleesproducten of andere producten van dierlijke oorsprong, afkomstig van pluimvee.




              *vers vlees van pluimvee:*


              alle delen van pluimvee, met inbegrip van vacuüm of in ‘controlled atmosphere’ verpakt vlees, die naar hun
      aard geschikt zijn voor menselijke consumptie en die geen behandeling ter bevordering van de houdbaarheid dan wel
      slechts een koelbehandeling hebben ondergaan;




              *vleesproducten:*


              producten als bedoeld in artikel 2, onder deel a, aanhef, van [richtlijn 77/99/EEG](31977L0099), niet
      zijnde vlees onderscheidenlijk producten als bedoeld in [artikel 2, onderdeel a, sub i][ref1] en ii, van die
      richtlijn;




              *andere producten van dierlijke oorsprong:*


              producten als bedoeld in artikel 2, onderdeel b, van [richtlijn 77/99/EEG](31977L0099);




              *richtlijn 92/118/EEG:*


              Richtlijn van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van de
      veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
      producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als bedoeld
      in bijlage A, hoofdstuk I, van [Richtlijn 89/662/EEG](31989L0662), en wat ziekteverwekkers betreft, van [Richtlijn
      90/425/EEG](31990L0425) (PbEG 1993, L 62);




              *beschikking 91/449/EEG:*


              Beschikking van de Commissie van de Europese Gemeenschappen van 26 juli 1991 tot vaststelling van het model
      van de gezondheidsertificaten voor uit derde landen ingevoerde vleesproducten (PbEG L 240);




              *beschikking 94/85/EG:*


              Beschikking van de Commissie van de Europese Gemeenschappen van 16 februari 1994 tot vaststelling van een
      lijst van derde landen waaruit de Lid-Staten de invoer van vers vlees van pluimvee toestaan (PbEG L 44);




              *beschikking 95/357/EG:*


              beschikking van de Commissie van de Europese Gemeenschappen van 26 juli 1995 tot vaststelling van de lijst
      van inspectieposten aan de grens die zijn erkend voor de veterinaire controles van producten en dieren uit derde
      landen, tot vaststelling van uitvoeringsbepalingen inzake de door de veterinaire deskundigen van de Commissie te
      verrichten controles en tot intrekking van Beschikking 94/24/EG (PbEG L 211);




              *beschikking 96/105/EG:*


              beschikking van de Commissie van de Europese Gemeenschappen van 29 januari 1996 inzake nieuwe
      overgangsmaatregelen om de overgang naar de bij [Richtlijn 90/675/EEG](31990L0675) van de Raad vastgestelde
      regeling inzake veterinaire controles te vergemakkelijken (PbEG L 24);.




              *beschikking 97/41/EG:*


              beschikking van de Commissie van de Europese Gemeenschappen van 18 december 1996 tot vaststelling van de
      gezondheidsvoorschriften en het gezondheidscertificaat voor de invoer uit derde landen van vleesproducten die zijn
      verkregen met vlees van pluimvee, vlees van gekweekt wild vlees van vrij wild en konijnenvlees (PbEG L 17);




              *beschikking 2003/812/EG:*


              beschikking (EG) nr. 2003/812 van de Commissie van de Europese Gemeenschappen van 17 november 2003 tot
      vaststelling van lijsten van derde landen waaruit de lidstaten de invoer van bepaalde producten voor menselijke
      consumptie als bedoeld in [Richtlijn 92/118/EEG](31992L0118) van de Raad toestaan (PbEU L 305);




              *beschikking 2004/280/EG:*


              Beschikking (EG) nr. 2004/280 van de Commissie van de Europese Gemeenschappen van 19 maart 2004 tot
      vaststelling van overgangsmaatregelen voor het in de handel brengen van bepaalde producten van dierlijke oorsprong,
      verkregen in Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië en Slowakije (PbEU
      L 87).


      [ref1]: https://wetten.overheid.nl/BWBR0005907#Artikel2
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel1
    references:
