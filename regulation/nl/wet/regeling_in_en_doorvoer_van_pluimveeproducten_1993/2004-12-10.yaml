  - number: '19.1'
    text: De Regeling in-, door- en vervoer van pluimvee en pluimveeprodukten 1987 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel19
  - number: '19.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel19
  - number: '19.3'
    text: |-
      Deze regeling kan worden aangehaald als de [Regeling in en doorvoer van pluimveeproducten 1993][ref1]. Deze
      regeling zal met de toelichting in de Staatscourant worden geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005907
    url: https://wetten.overheid.nl/BWBR0005907/2004-12-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005907
