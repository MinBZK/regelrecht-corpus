  - number: '6.2'
    text: Deze regeling treedt in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel6.2
  - number: '6.3'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling ADL-assistentie.'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel6.3
