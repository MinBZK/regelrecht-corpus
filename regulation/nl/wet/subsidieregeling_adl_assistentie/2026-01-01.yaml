articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *accountant:* accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *ADL-aanbieder:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid die ADL-assistentie verleent;
        - *ADL-assistentie:* gedurende het gehele etmaal direct oproepbare assistentie bij algemene dagelijkse
      levensverrichtingen in en om de ADL-woning, waaronder alarmopvolging bij een noodoproep;
        - *ADL-cluster:* cluster als bedoeld in [artikel 1.3, eerste lid, onderdeel a][ref2];
        - *ADL-eenheid:* ruimte in de omgeving van de ADL-woningen van waaruit de ADL-assistent wordt opgeroepen;
        - *ADL-woning:* woning die deel uitmaakt van een aantal bij elkaar horende rolstoeldoorgankelijke woningen;
        - *Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2;
        - *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref3];
        - *minister:* minister van Volksgezondheid, Welzijn en Sport;
        - *oordeel van het CIZ:* besluit als bedoeld in [artikel 5.2.1 van het Besluit langdurige zorg][ref4] waaruit
      blijkt dat de verzekerde in aanmerking komt voor ADL-assistentie;
        - *verzekerde:* persoon die overeenkomstig de [wet][ref5] is verzekerd;
        - *wet:* [Wet langdurige zorg][ref6];
        - *zorg:* zorg in de zin van de [wet][ref7].


