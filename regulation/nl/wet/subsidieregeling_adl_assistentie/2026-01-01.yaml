  - number: 5b.2.3
    text: Een aanvraag na de datum, bedoeld in het tweede lid, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5b.2
  - number: 5b.2.4
    text: Voor een aanvraag van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5b.2
  - number: 5b.2.5
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5b.2
