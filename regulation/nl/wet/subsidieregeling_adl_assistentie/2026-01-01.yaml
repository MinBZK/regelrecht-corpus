  - number: 1.2.1
    text: |-
      Het Zorginstituut kan aan een ADL-aanbieder een subsidie verstrekken ten behoeve van het verlenen van ADL-
      assistentie aan verzekerden die:
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.2
  - number: 1.2.1.a
    text: woonachtig zijn in een ADL-woning,
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.2
  - number: 1.2.1.b
    text: ten tijde van het verkrijgen van de ADL-assistentie beschikken over een oordeel van het CIZ en
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.2
  - number: 1.2.1.c
    text: in en om de ADL-woning uitsluitend ADL-assistentie ontvangen van de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Ten behoeve van een verzekerde als bedoeld in het eerste lid die een indicatiebesluit als bedoeld in
      [artikel 3.2.3 van de wet][ref1] ontvangt, wordt de subsidie voor het verlenen van ADL-assistentie ten hoogste
      gedurende een redelijke termijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
  - number: 1.3.1
    text: 'Voor subsidie komt in aanmerking ADL-assistentie in en om een ADL-woning die aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.1.a
    text: |-
      de ADL-woning maakt deel uit van een cluster van ten minste vijftien en ten hoogste vierentwintig ADL-woningen en
      een ADL-eenheid;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.1.b
    text: |-
      de loopafstand tussen de ADL-woningen en de ADL-eenheid is niet groter dan 150 meter en de loopafstand tussen de
      twee verst uit elkaar gelegen ADL-woningen is niet meer dan 200 meter;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.1.c
    text: het ADL-cluster maakt deel uit van een wooncomplex van ten minste vijftig woningen;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.1.d
    text: |-
      de ADL-woningen zijn in de totale woonbebouwing geïntegreerd, grenzen zo weinig mogelijk aan elkaar en zijn van
      buitenaf niet of nagenoeg niet als ADL-woning herkenbaar;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.1.e
    text: |-
      de ADL-woning en de ADL-eenheid zijn rolstoeldoorgankelijk voor een rolstoel van 0,85 meter breed, 1,2 meter lang
      en 2,3 meter hoog met een draaicirkel van 1,8 meter.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Indien voor de bouw van de ADL-woning een subsidie is verstrekt op grond van de [Regeling subsidies AWBZ][ref1],
      voldoet de ADL-woning in afwijking van het eerste lid aan de eisen die aan die subsidie verbonden waren.


      [ref1]: https://wetten.overheid.nl/BWBR0019161
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0019161
  - number: 1.3.3
    text: |-
      Voor subsidie komen in aanmerking de extra gemaakte personele en materiële kosten, bedoeld in
      [artikel 4 van de Beleidsregel SARS-CoV-2 virus extra kosten Wlz 2022][ref1] die in de periode van 1 januari 2022
      tot en met 31 december 2022 gemaakt zijn als gevolg van Covid-19, ten behoeve van het verlenen van ADL-assistentie
      in en om een ADL-woning die voldoet aan de eisen, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046530#Artikel4
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0046530
        artikel: '4'
  - number: 1.3.4
    text: |-
      Het Zorginstituut verhoogt op aanvraag de voor 2022 op grond van [artikel 5.5][ref1] vastgestelde subsidie met
      0,37% voor de extra gemaakte energiekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel5
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '5'
        hoofdstuk: '5'
  - number: 1.4.1
    text: |-
      ADL-assistentie in een sociale huurwoning komt slechts voor subsidie in aanmerking indien de ADL-aanbieder een
      schriftelijke overeenkomst heeft gesloten met de rechtspersoon die het ADL-cluster beheert en de ADL-woningen
      verhuurt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.4
  - number: 1.4.2
    text: 'In de overeenkomst is bepaald dat de ADL-woningen uitsluitend worden verhuurd aan verzekerden die:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.4
  - number: 1.4.2.a
    text: beschikken over een oordeel van het CIZ en
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.4
  - number: 1.4.2.b
    text: ADL-assistentie in en om de woning uitsluitend ontvangen van de ADL-aanbieder.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.4
  - number: '1.5'
    text: De subsidie wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.5
  - number: 1.6.1
    text: Het subsidieplafond voor het verstrekken van de subsidies bedraagt voor het jaar 2026 € 149.887.000.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
  - number: 1.6.2
    text: |-
      Het bedrag van de subsidie die voor het jaar 2026 ten hoogste wordt verleend aan een subsidieontvanger wordt
      berekend overeenkomstig de formule (A / B) x € 149.887.000 waarbij wordt verstaan onder: A: de som van:
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
  - number: 1.6.2.1°
    text: |-
      het totaal aantal uren ADL-assistentie vermeld in de beschikking tot verlening van de subsidie op grond van deze
      regeling voor het jaar 2025 en
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
  - number: 1.6.2.2°
    text: |-
      een raming van het aantal in 2026 te verlenen uren ADL-assistentie in en om een ADL-woning waarop de beschikking,
      bedoeld onder 1°, niet van toepassing is en waarmee het aantal ADL-woningen waar de subsidieontvanger ADL-
      assistentie aanbiedt is toegenomen;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
  - number: 1.6.3
    text: |-
      De raming, bedoeld in het tweede lid, onderdeel A, onder 2°, wordt gebaseerd op het aantal ADL-woningen en een
      berekening van de behoefte aan ADL-assistentie in en om die woningen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
  - number: 1.6.4
    text: |-
      De subsidie die aan een subsidieontvanger voor het jaar 2026 ten hoogste wordt verleend bedraagt niet meer dan het
      aantal uren ADL-assistentie, bedoeld in het tweede lid, onderdeel A, vermenigvuldigd met het uurtarief, bedoeld
      in [artikel 5.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel5
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '5'
        hoofdstuk: '5'
  - number: 1.7.1
    text: |-
      De [hoofdstukken 2 tot en met 5][ref1] zijn, met uitzondering van [artikel 4.5][ref2], niet van toepassing op de
      verstrekking van subsidies als bedoeld in [artikel 1.3, derde en vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0035951#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0035951
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0035951
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.7.2
    text: |-
      [Hoofdstuk 5A][ref1] is uitsluitend van toepassing op de verstrekking van subsidies als bedoeld in
      [artikel 1.3, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Hoofdstuk5a
      [ref2]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0035951
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 1.7.3
    text: |-
      [Hoofdstuk 5B][ref1] is uitsluitend van toepassing op de verstrekking van subsidies als bedoeld in
      [artikel 1.3, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Hoofdstuk5b
      [ref2]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0035951
        hoofdstuk: 5b
      - id: ref2
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.1.1
    text: De subsidie wordt op aanvraag verstrekt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Een aanvraag tot verlening van de subsidie wordt ontvangen uiterlijk vier weken voor de aanvang van het jaar
      waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.1
  - number: 2.1.3
    text: Een aanvraag die na de termijn, bedoeld in het vorige lid, wordt ontvangen wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.1
  - number: '2.2'
    text: 'De aanvrager doet in de aanvraag tot verlening van de subsidie opgave van:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.2
  - number: 2.2.a
    text: |-
      het totaal aantal uren ADL-assistentie bedoeld in [artikel 1.6, tweede lid, onderdeel A, onder 1°][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.2.b
    text: |-
      de raming bedoeld in [artikel 1.6, tweede lid, onderdeel A, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.3.1
    text: Voor een aanvraag tot verlening van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.3
  - number: 2.3.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.3
  - number: 2.4.1
    text: 'De aanvraag tot verlening van de subsidie gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.4.1.a
    text: |-
      stukken ter onderbouwing van de raming bedoeld in [artikel 1.6, tweede lid, onderdeel A, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.4.1.b
    text: |-
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.4.1.c
    text: |-
      indien de aanvraag is ondertekend door een of meer andere personen dan de personen die op grond van de statuten
      bevoegd zijn de aanvrager te vertegenwoordigen: een afschrift van de volmacht voor het ondertekenen van de
      aanvraag;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.4.1.d
    text: een afschrift van de inschrijving van de aanvrager in het Handelsregister;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.4.1.e
    text: |-
      de laatst opgemaakte jaarrekening dan wel de balans en de staat van baten en lasten en de toelichting daarop of,
      indien deze bescheiden ontbreken dan wel op verzoek van het Zorginstituut, een verslag over de financiële positie
      van de aanvrager op het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      De stukken, bedoeld in het eerste lid, onderdelen b tot en met e, kunnen achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit mag gaan dat deze gegevens bij het Zorginstituut bekend zijn.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Indien de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag of indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of
      de voorbereiding van de beschikking stelt het Zorginstituut de subsidieaanvrager in de gelegenheid de aanvraag tot
      verlening van de subsidie binnen drie weken aan te vullen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Het Zorginstituut besluit de aanvraag niet te behandelen indien de aanvraag binnen de termijn, bedoeld in het
      eerste lid, niet of niet voldoende is aangevuld.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel2.5
  - number: '3.1'
    text: |-
      Het Zorginstituut besluit voor de aanvang van het jaar waarvoor de subsidie wordt aangevraagd over de verlening van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Het Zorginstituut vermeldt in het besluit tot verlening van de subsidie in ieder geval het maximum bedrag dat aan
      subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel3.2
  - number: 4.1.1
    text: |-
      Het Zorginstituut verleent bij het besluit tot verlening van de subsidie ambtshalve tevens de volgende
      voorschotten: in januari 8%, februari 8%, maart 8%, april 7%, mei 16%, juni 7%, juli 8%, augustus 8%, september 7%,
      oktober 8%, november 8% en december 7% van het bedrag van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.1
  - number: 4.1.2
    text: Op verzoek van de subsidieontvanger kan het Zorginstituut van de percentages, genoemd in het eerste lid, afwijken.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.1
  - number: '4.2'
    text: 'De subsidieontvanger verleent ADL-assistentie aan elke verzekerde die:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.2
  - number: 4.2.a
    text: woonachtig is in een ADL-woning behorend tot een cluster waar de subsidieontvanger ADL-assistentie aanbiedt en
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.2
  - number: 4.2.b
    text: beschikt over een oordeel van het CIZ.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      De subsidieontvanger legt binnen acht weken na aanvang van het verlenen van de ADL-assistentie in overleg met de
      verzekerde een dossier aan waarin in ieder geval zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: 4.3.1.a
    text: een omschrijving van het doel van de ADL-assistentie;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: 4.3.1.b
    text: de wijze waarop de ADL-assistentie voorziet in de behoeften van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: 4.3.1.c
    text: een beschrijving van eventuele risico's van de ADL-assistentie;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: 4.3.1.d
    text: |-
      toetsbare afspraken over de ADL-assistentie, onder meer met betrekking tot het beperken van de risico's, bedoeld in
      onderdeel c.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: 4.3.2
    text: In overleg met de verzekerde evalueert en actualiseert de subsidieontvanger jaarlijks het dossier.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.3
  - number: '4.4'
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.4
  - number: 4.4.a
    text: de doelstellingen van de gesubsidieerde activiteiten op doelmatige wijze worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.4
  - number: 4.4.b
    text: de uitvoering van de gesubsidieerde activiteiten op verantwoorde wijze wordt bestuurd en
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.4
  - number: 4.4.c
    text: de voor de uitvoering van de gesubsidieerde activiteiten benodigde middelen op verantwoorde wijze worden beheerd.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.4
  - number: 4.5.1
    text: 'De subsidieontvanger houdt een zodanig ingerichte administratie bij dat daarin altijd kan worden nagegaan:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.5.1.a
    text: het totaal aantal verleende uren ADL-assistentie;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.5.1.b
    text: |-
      het aantal verleende uren ADL-assistentie per verzekerde gedurende de periode dat deze verzekerde beschikt over het
      oordeel van het CIZ en woonachtig is in een ADL-woning;
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.5.1.c
    text: de voor de vaststelling van de subsidie van belang zijnde rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.5.2
    text: De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.5.3
    text: De administratie en de daartoe behorende bescheiden worden gedurende tien jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.5
  - number: 4.6.1
    text: 'De subsidieontvanger meldt meteen aan het Zorginstituut als:'
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.6
  - number: 4.6.1.a
    text: |-
      het tijdens de periode waarvoor de subsidie is verleend aannemelijk is geworden dat de activiteiten waarvoor de
      subsidie is verleend niet, niet tijdig of niet geheel zullen worden verricht,
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.6
  - number: 4.6.1.b
    text: het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan of
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.6
  - number: 4.6.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.6
  - number: 4.6.2
    text: |-
      De melding wordt schriftelijk gedaan. De melding wordt voorzien van een toelichting. Bij de melding worden de
      relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens het Zorginstituut ingesteld onderzoek dat erop is gericht het Zorginstituut
      inlichtingen te verschaffen die van belang zijn voor het nemen van een besluit over het verstrekken van de
      subsidie. De subsidieontvanger verplicht zijn accountant tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.7
  - number: 4.7.2
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen te
      verschaffen voor de ontwikkeling van het beleid van de minister.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      Indien de activiteiten waarvoor de subsidie is verstrekt geheel of gedeeltelijk worden beëindigd of indien de
      subsidie wordt beëindigd, verstrekt de subsidieontvanger aan het Zorginstituut op diens verzoek alle gegevens,
      bescheiden, informatie en medewerking die redelijkerwijs verlangd kan worden of kunnen worden voor de continuïteit
      van de activiteiten waarvoor de subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      Het Zorginstituut kan bij de verlening van de subsidie verplichtingen opleggen als bedoeld in
      [artikel 4:38 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5.1.1
    text: |-
      De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het jaar waarvoor de subsidie is verleend een
      aanvraag in tot vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.1
  - number: 5.1.2
    text: Het Zorginstituut kan ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.1
  - number: 5.2.1
    text: Voor een aanvraag tot vaststelling van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.2
  - number: 5.2.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.2
  - number: 5.3.1
    text: |-
      De subsidieontvanger doet in de aanvraag tot vaststelling van de subsidie opgave van het totaal aantal uren ADL-
      assistentie dat is verleend in het jaar waarvoor de subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.3
  - number: 5.3.2
    text: |-
      De subsidieontvanger toont in de aanvraag tot vaststelling aan dat voldaan is aan de verplichtingen die verbonden
      zijn aan de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.3
  - number: 5.4.1
    text: |-
      De aanvraag tot vaststelling gaat vergezeld van een assurancerapport van een accountant dat is opgesteld
      overeenkomstig een door het Zorginstituut vastgesteld model met inachtneming van een door het Zorginstituut
      vastgesteld protocol.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Op verzoek van het Zorginstituut legt de subsidieontvanger in aanvulling op de aanvraag tot vaststelling van de
      subsidie een jaarrekening over.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      De subsidie ten behoeve van het jaar 2026 wordt vastgesteld op het totaal aantal in dat jaar door de
      subsidieontvanger verleende uren ADL-assistentie vermenigvuldigd met € 96,01 tot ten hoogste het maximum bedrag van
      de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt het Zorginstituut
      een besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5.6
  - number: 5a.1.1
    text: |-
      Het subsidieplafond voor het verstrekken van subsidie als bedoeld in [artikel 1.3, derde lid][ref1], bedraagt
      € 3.700.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.1.2
    text: |-
      Indien het totaal van de te verstrekken subsidiebedragen hoger is dan het subsidieplafond, verdeelt het
      Zorginstituut het ingevolge het subsidieplafond beschikbare bedrag evenredig over ingediende aanvragen voor zover
      deze voor subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.1
  - number: 5a.2.1
    text: De subsidie wordt op aanvraag verstrekt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5a.2.2
    text: |-
      De aanvraag van de subsidie, bedoeld in [artikel 1.3, derde lid][ref1], wordt uiterlijk 1 juli 2023 ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.2.3
    text: Een aanvraag na 1 juli 2023 wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5a.2.4
    text: |-
      De aanvrager doet in de aanvraag van de subsidie, bedoeld in [artikel 1.3, derde lid][ref1], opgave van de gemaakte
      personele en materiële kosten, bedoeld in artikel 1.3 derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0035951
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.2.5
    text: Voor een aanvraag van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5a.2.6
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5a.2.7
    text: |-
      De aanvraag gaat vergezeld van een assurancerapport van een accountant dat is opgesteld overeenkomstig een door het
      Zorginstituut vastgesteld model met inachtneming van een door het Zorginstituut vastgesteld protocol.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5a.2.8
    text: De subsidie wordt vastgesteld zonder voorafgaande beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0035951/2026-01-01#Artikel5a.2
  - number: 5b.1
    text: |-
      Het subsidieplafond voor het verstrekken van subsidies als bedoeld in [artikel 1.3, vierde lid][ref1], bedraagt
      € 409.000.


      [ref1]: https://wetten.overheid.nl/BWBR0035951#Artikel1
