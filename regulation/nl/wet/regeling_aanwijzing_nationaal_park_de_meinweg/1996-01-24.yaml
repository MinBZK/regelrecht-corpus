preamble:
  text: |-
    Gezien het advies van de Voorlopige Commissie Nationale Parken van 11 februari 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
             nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II 1992–1993, 22 880, nr. 5,
      p. 99).


      [ref1]: https://wetten.overheid.nl/BWBR0007423#Artikel3
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007423
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het natuurgebied De Meinweg, zoals aangegeven op de kaart die als bijlage
      behoort bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park De Meinweg.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park De Meinweg.
      Daartoe behoort onder meer:

      a. het opstellen en actualiseren van het beheers- en inrichtingsplan;

      b. het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park De Meinweg beschikbare
      middelen in het kader van een jaarlijks voor te stellen activiteitenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van het door de minister goed te keuren bestedingsprogramma, het opstellen van
      projectplannen, controle op de besteding van gelden en coördinatie van de uitvoering van projecten binnen het kader
      van het beheers- en inrichtingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park De Meinweg.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park De
      Meinweg van maart 1993, zoals goedgekeurd bij brief van 15 augustus 1994 (NBLF.946348).
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. zeven door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1º. de provincie Limburg;

      2º. het gewest Midden-Limburg;

      3º. de gemeente Roerdalen;

      4º. het waterschap Roer en Overmaas;

      5º. Staatsbosbeheer;

      6º. N.V. Nederlandse Spoorwegen;

      7º. N.V. Waterleiding Maatschappij Limburg;

      c. één lid als vertegenwoordiger van de kleine particuliere eigenaren, door de minister te benoemen op voordracht
      van het overlegorgaan;

      d. de Directeur van de Directie Zuid van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel6
  - number: '7'
    text: |-
      1 Het secretariaat van het overlegorgaan berust bij een door de provincie Limburg te benoemen ambtenaar van die
      provincie.

      2 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      3 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel7
  - number: '8'
    text: |-
      Indien in het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel8
  - number: '9'
    text: De Beschikking aanwijzing nationaal park in oprichting De Meinweg wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel9
  - number: '10'
    text: Deze regeling treedt in werking met ingang van 8 juni 1995.
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park De Meinweg.'
    url: https://wetten.overheid.nl/BWBR0007423/1996-01-24#Artikel11
