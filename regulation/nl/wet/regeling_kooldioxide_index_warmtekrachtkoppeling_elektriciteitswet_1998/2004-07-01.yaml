  - number: IV
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 juli 2004, met uitzondering van [artikel III][ref1], dat in
      werking treedt met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst.

      2 Op elektriciteit die door middel van een installatie voor warmtekrachtkoppeling voor 1
      juli 2004 is opgewekt, zijn de [artikelen 1, eerste lid, onderdelen d, e en f][ref2], en
      [6 van de Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref3] zoals deze luidden voor 1 juli
      2004 van toepassing.


