preamble:
  text: |-
    Gelet op de artikelen 1, zesde lid, en 31, achtste lid, van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015948/2004-07-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Een producent die vóór 1 juli 2004 beschikt over een WKK-certificatenrekening als bedoeld in
      [artikel 5, eerste lid, van de Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref1], overlegt
      uiterlijk op 15 juli 2004 aan de netbeheerder een aanvullende verklaring met gebruikmaking van het origineel van
      een ondertekend formulier dat is opgenomen in de bij deze regeling behorende [bijlage A][ref2].

      2 Een producent als bedoeld in het eerste lid, die een WKK-installatie instandhoudt met een andere krachtbron dan
      uitsluitend een of meerdere gasmotoren, draagt er zorg voor dat hij beschikt over een meetprotocol, dat voldoet aan
      de WKK-meetvoorwaarden, opgenomen in de bij deze regeling behorende bijlage 1, en dat uiterlijk op 30 juni 2004 is
      goedgekeurd door een gecertificeerd meetbedrijf.

      3 De netbeheerder stelt vast dat de gegevens, opgenomen in de in het eerste lid bedoelde verklaring, betrekking
      hebben op de desbetreffende WKK-installatie en, voor zover van toepassing, of er sprake is van een toepasselijk
      meetprotocol, dat is goedgekeurd door een gecertificeerd meetbedrijf. De netbeheerder deelt het resultaat van deze
      vaststelling binnen vier weken na ontvangst van de verklaring en het meetprotocol mee aan de producent en aan de
      netbeheerder van het landelijk hoogspanningsnet.

      4 In afwijking van
      [artikel 6a, eerste lid, van de Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref3] wordt de
      tabel met de waarden ter bepaling van de kooldioxide-index ten aanzien van een WKK-installatie met als krachtbron
      uitsluitend een of meerdere gasmotoren, ten behoeve van het kalenderjaar 2004 uiterlijk op 29 februari 2004 door de
      Minister van Economische Zaken vastgesteld en in de Staatscourant gepubliceerd.

      5 In afwijking van
      [artikel 6a, vierde lid, van de Regeling certificaten warmtekrachtkoppeling Elektriciteitswet 1998][ref4] zijn
      de waarden van KRW en KRE ten behoeve van het kalenderjaar 2004 opgenomen in de bij deze regeling behorende
      [bijlage B][ref5].


