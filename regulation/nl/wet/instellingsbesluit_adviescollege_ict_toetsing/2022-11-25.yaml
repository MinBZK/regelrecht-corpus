  - number: '2'
    text: |-
      1 Er is een Adviescollege ICT-toetsing.

      2 Het Adviescollege heeft ten behoeve van de algehele verbetering van de beheersing van ICT-projecten en
      informatiesystemen tot taak:

      a. op schriftelijk verzoek van de minister die het aangaat of een van beide kamers der Staten-Generaal, dan wel uit
      eigen beweging aan de minister die het aangaat advies uit te brengen over:

      1⁰. de risico’s en slaagkans van een voorgenomen ICT-project en geeft daarbij een oordeel over de mate van
      beheersbaarheid, en

      2⁰. de doeltreffendheid en doelmatigheid van het onderhoud en beheer van een informatiesysteem, waaronder ook de
      vernieuwing van een informatiesysteem kan worden begrepen;

      b. op verzoek van de minister die het aangaat of een van beide kamers der Staten-Generaal, dan wel uit eigen
      beweging aan de minister die het aangaat mede vanuit de kennis en ervaringen die bij de advisering over ICT-
      projecten en informatiesystemen zijn opgedaan advies uit te brengen ter bevordering van de eenheid, kwaliteit en
      efficiëntie van de informatiesystemen, en

      c. het voorzien in kennisoverdracht en kennisbevordering bij de ministeries, publiekrechtelijk zelfstandig
      bestuursorgaan als bedoeld in [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref1], de politie en de Raad
      voor de rechtspraak vanuit de kennis en ervaringen die bij de advisering over ICT-projecten en informatiesystemen
      zijn opgedaan.

      3 Het Adviescollege brengt geen advies uit eigen beweging als bedoeld in het tweede lid, onderdelen a en b, uit aan
      de politie en de Raad voor de rechtspraak.

      4 Het Adviescollege brengt een advies over een ICT-project of het onderhoud en beheer van een informatiesysteem van
      de politie op een verzoek van de minister van Justitie en Veiligheid als bedoeld in het tweede lid, onderdelen a en
      b, rechtstreeks uit aan de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref2], en zendt een afschrift
      van het advies aan de minister van Justitie en Veiligheid.

      5 Het Adviescollege bepaalt zelf welke verzoeken om advies in behandeling worden genomen.

      6 Het Adviescollege kan een naschrift uitbrengen aan de minister die het aangaat over de maatregelen die zijn
      voorgesteld ter opvolging van een advies.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel27
