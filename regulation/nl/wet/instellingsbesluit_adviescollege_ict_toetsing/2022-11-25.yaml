        artikel: '2'
  - number: '4'
    text: |-
      1 De minister die het aangaat verzoekt voor aanvang van een ICT-project het Adviescollege om advies over de
      risico’s en slaagkans van het ICT-project.

      2 De minister die het aangaat, verstrekt aan het Adviescollege desgevraagd de door het Adviescollege gewenste
      inlichtingen aangaande zijn ICT-projecten en het onderhoud en beheer aan informatiesystemen waarover advies wordt
      uitgebracht.

      3 Een advies van het Adviescollege als bedoeld in [artikel 2, tweede lid, onderdeel a][ref1], wordt door de
      minister die het aangaat binnen vier weken na ontvangst ervan aan de beide kamers der Staten-Generaal gezonden.

      4 Ingeval een advies van het Adviescollege als bedoeld in [artikel 2, tweede lid, onderdeel a][ref2], niet wordt
      opgevolgd, deelt de minister die het aangaat, in overeenstemming met het gevoelen van de ministerraad, dat met
      redenen omkleed mede aan de beide kamers der Staten-Generaal.

      5 Het derde en vierde lid is niet van toepassing op ICT-projecten van de Raad voor de rechtspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0044438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044438#Artikel2
