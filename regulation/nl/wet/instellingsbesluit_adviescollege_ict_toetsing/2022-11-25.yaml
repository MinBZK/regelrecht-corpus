  - number: '3'
    text: |-
      1 Het Adviescollege maakt een advies als bedoeld in [artikel 2, tweede lid, onderdeel a][ref1], aan een minister
      die het aangaat vier weken na aanbieding openbaar.

      2 De adviezen, bedoeld in [artikel 2, tweede lid, onderdeel b][ref2], worden eenmaal per half jaar openbaar
      gemaakt.

      3 Indien een advies wordt uitgebracht aan een van beide kamers der Staten-Generaal, zendt het Adviescollege
      tegelijkertijd een afschrift van het advies aan de minister die het aangaat.

      4 Van een voornemen tot een advies uit eigen beweging als bedoeld in
      [artikel 2, tweede lid, onderdelen a en b][ref3], stelt het Adviescollege de minister die het aangaat en de beide
      kamers der Staten-Generaal onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0044438#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0044438#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044438#Artikel2
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel3
