  - number: '5'
    text: |-
      De minister die het aangaat kan het Adviescollege verzoeken om nader advies over de risico’s en slaagkans van een
      ICT-project dat is gestart.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel5
  - number: '6'
    text: |-
      1 Het Adviescollege bestaat uit een voorzitter en ten hoogste vier andere leden.

      2 De voorzitter en de andere leden hebben zitting op persoonlijke titel en oefenen hun functie uit zonder last
      of ruggespraak.

      3 De voorzitter en de andere leden worden, in overeenstemming met het gevoelen van de ministerraad, door de
      minister benoemd.

      4 De benoeming geschiedt voor de duur van ten hoogste twee jaar.

      5 De voorzitter en overige leden kunnen op eigen verzoek of wegens ongeschiktheid, onbekwaamheid of op andere
      zwaarwegende gronden worden geschorst en ontslagen door de minister.

      6 Het Adviescollege kan voor de uitvoering of voorbereiding van bepaalde adviezen commissies instellen.

      7 Indien in voorkomend geval uit feiten of omstandigheden blijkt dat de voorzitter of een van de andere leden van
      het Adviescollege zelf direct of indirect betrokkenheid heeft bij een adviesaanvraag dan zullen zij zich onverwijld
      laten vervangen door hun plaatsvervanger en zich weerhouden van enige bemoeienis ten aanzien van de adviesaanvraag.

      8 Ambtenaren of andere personen die werkzaam zijn onder verantwoordelijkheid van een minister, een publiekrechtelijk
      zelfstandig bestuursorgaan als bedoeld in [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref1], de Raad
      voor de rechtspraak of de politie worden niet benoemd tot voorzitter of lid van het Adviescollege.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel4
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '4'
  - number: '7'
    text: |-
      1 De minister voorziet in een ambtelijk secretariaat van het Adviescollege.

      2 Het ambtelijk secretariaat heeft aan het hoofd een secretaris-directeur.

      3 Het secretariaat is voor de uitvoering van zijn taak uitsluitend verantwoording schuldig aan het Adviescollege.

      4 Indien ambtenaren, in dienst van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties, tot secretaris-
      directeur of medewerker van het secretariaat worden benoemd, zijn zij tegenover anderen dan het Adviescollege
      verplicht tot geheimhouding van hetgeen hen in het verband van de werkzaamheden van het Adviescollege bekend is
      geworden.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel7
  - number: '8'
    text: |-
      1 Het Adviescollege:

      a. stelt zijn eigen werkwijze vast in een reglement van orde, en

      b. stelt een integriteitscode op waarin in ieder geval aandacht wordt besteed aan de wijze waarop wordt omgegaan
      met een situatie als bedoeld in [artikel 6, zevende lid][ref1].

      2 Het Adviescollege kan zich voor het inwinnen van inlichtingen wenden tot daartoe door de minister die het aangaat
      aangewezen ambtenaren.

      3 Het Adviescollege kan zich door andere personen doen bijstaan voor zover dat voor de vervulling van haar taak
      nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0044438#Artikel6
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0044438
        artikel: '6'
  - number: '9'
    text: |-
      De minister geeft geen afzonderlijke aanwijzingen met betrekking tot de werkwijze en de inhoud van de adviezen en
      de keuze door het Adviescollege van het ICT-project of informatiesysteem waarover wordt geadviseerd.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel9
  - number: '10'
    text: |-
      1 Aan de voorzitter wordt een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld
      op schaal 18 van de collectieve arbeidsovereenkomst die is overeengekomen voor de ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties en
      de arbeidsduurfactor op 0,28 fte.

      2 Aan de andere leden wordt een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld
      op schaal 18 van de collectieve arbeidsovereenkomst die is overeengekomen voor de ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn bij het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties en
      de arbeidsduurfactor op 0,22 fte.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel10
  - number: '11'
    text: |-
      1 De minister stelt aan het Adviescollege voor de uitoefening van haar taken, bedoeld in [artikel 2][ref1], voor de
      duur van dit besluit een vast taakbudget van € 5.400.000 per jaar beschikbaar.

      2 De minister draagt zorg voor de huisvesting van het Adviescollege en de daarbij behorende automatisering.


      [ref1]: https://wetten.overheid.nl/BWBR0044438#Artikel2
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0044438
        artikel: '2'
  - number: '12'
    text: |-
      1 Het Adviescollege kan slechts adviezen vaststellen indien ten minste de helft van de leden aanwezig zijn.

      2 Bij het staken van de stemmen wordt de besluitvorming aangehouden tot de volgende vergadering, tenzij de
      advisering niet uitgesteld kan worden of de vergadering voltallig is. In deze gevallen is de stem van de voorzitter
      doorslaggevend. Van die omstandigheid wordt in het advies melding gemaakt.

      3 Een lid neemt geen deel aan de beraadslaging of besluitvorming over een advies waarbij hij persoonlijk is
      betrokken. Het Adviescollege kan dit lid laten vervangen.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel12
  - number: '13'
    text: |-
      1 Het Adviescollege brengt jaarlijks voor 1 april aan de minister verslag uit van zijn werkzaamheden in het
      voorafgaande kalenderjaar.

      2 Het verslag wordt door de minister aan de beide kamers der Staten-Generaal gezonden.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel13
  - number: '14'
    text: |-
      Het Adviescollege verstrekt desgevraagd aan de minister de voor de uitoefening van zijn taak benodigde
      inlichtingen. De minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel14
  - number: '15'
    text: |-
      1 Het beheer van bescheiden betreffende de werkzaamheden van het Adviescollege geschiedt op eenzelfde wijze als bij
      het ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het tijdelijk Bureau ICT-toetsing draagt zo spoedig mogelijk na beëindiging van zijn werkzaamheden of, zo
      de omstandigheden daartoe aanleiding geven, zoveel eerder, de bescheiden betreffende die werkzaamheden over
      aan het archief van het directoraat-generaal Overheidsorganisatie van het ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel15
  - number: '16'
    text: Dit besluit is niet van toepassing op de wapensystemen van het ministerie van Defensie.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel16
  - number: '17'
    text: |-
      1 Dit besluit treedt in werking met ingang van 31 december 2020.

      2 Dit besluit vervalt indien het bij koninklijke boodschap van 9 september 2022 ingediende voorstel van wet
      houdende regels omtrent de instelling van een adviescollege voor de algehele verbetering en beheersing van ICT-
      projecten en informatiesystemen bij de centrale overheid (Wet Adviescollege ICT-toetsing) (Kamerstukken ) tot wet
      is of wordt verheven en die wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel17
  - number: '18'
    text: 'Dit besluit wordt aangehaald als: Instellingsbesluit Adviescollege ICT-toetsing.'
    url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#Artikel18
