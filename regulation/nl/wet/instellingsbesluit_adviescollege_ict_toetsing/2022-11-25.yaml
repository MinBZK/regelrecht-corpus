preamble:
  text: |-
    Handelende in overeenstemming met het gevoelen van de ministerraad;

    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit organisatie, bedrijfsvoering en informatiesystemen
    rijksdienst en artikel 2, eerste lid, van de Wet vergoedingen adviescolleges en commissies;

    besluit
  url: https://wetten.overheid.nl/BWBR0044438/2022-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. *minister die het aangaat:* minister die verantwoordelijk is voor het ICT-project of het informatiesysteem
      waarop het advies betrekking heeft;

      c. *Adviescollege:* Adviescollege ICT-toetsing, bedoeld in [artikel 2][ref1];

      d. *ICT-project:* een project of programma, dan wel projecten of programma’s die samenhang
      hebben, met een ICT-component van ten minste € 5.000.000 over de gehele looptijd van het project
      of programma van een ministerie, een publiekrechtelijk zelfstandig bestuursorgaan als bedoeld in
      [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref2], de politie of de Raad voor de rechtspraak;

      e. *informatiesysteem:* informatiesysteem, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______ van een ministerie, een publiekrechtelijk zelfstandig bestuursorgaan als bedoeld in
      [artikel 4 van de Kaderwet zelfstandige bestuursorganen][ref4], de politie of de Raad voor de rechtspraak;

      f. *vernieuwing van een informatiesysteem:* het veranderen van de functionaliteit van een informatiesysteem, en de
      daarbij behorende vernieuwing van de middelen voor de informatievoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0044438#Artikel2
