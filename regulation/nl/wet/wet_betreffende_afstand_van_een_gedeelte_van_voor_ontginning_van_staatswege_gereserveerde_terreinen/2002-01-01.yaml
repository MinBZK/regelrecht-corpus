publication_date: '2002-11-14'
valid_from: '2002-01-01'
bwb_id: BWBR0001916
url: https://wetten.overheid.nl/BWBR0001916/2002-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is om in het algemeen belang het recht tot ontginning
    van steenkolen binnen bepaalde terreinen, behoorende tot het Staatsmijnveld in Zuid-Limburg, toe te kennen
    aan derden, zoomede de terreinen, ten aanzien waarvan bij de wetten van 24 Juni 1901 (Staatsblad n°. 170), 13
    Februari 1911 (Staatsblad n°. 68) en 23 September 1912 (Staatsblad n°. 307) is bepaald, dat de ontginning van
    steenkolenmijnen daarbinnen zal geschieden van Staatswege en waarvoor niet krachtens deze wet het recht tot
    ontginning van steenkolen aan derden zal worden toegekend, samen te voegen en nader te omschrijven, en ten slotte
    de grenzen te wijzigen tusschen de mijnvelden "Oranje-Nassau" en "Carl" en tusschen de mijnvelden "Laura" en
    "Vereeniging";

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001916/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In afwijking van het bepaalde bij artikel 1 van de wet van 24 Juni 1901 (*Staatsblad* n°. 170) en artikel 1 van
      de wet van 13 Februari 1911 (*Staatsblad* n°. 68) kan door Ons het recht tot de ontginning van steenkolen binnen de
      terreinen, op de bij deze wet behoorende kaart met de letters A en B aangeduid, worden toegekend aan derden.

      2 Dit recht zal worden toegekend door het verleenen van concessie als in de wet van 21 April 1810 (*Bulletin
      des Lois* n°. 285) bepaald, en met alle gevolgen, daaraan door die wet verbonden, met dien verstande, dat de
      formaliteiten, welke ingevolge die wet aan het verleenen van concessie behooren vooraf te gaan, niet behoeven te
      worden vervuld.

      De artikelen 1 tot en met 8 van de wet van 27 April 1904 (*Staatsblad* n°. 73), gewijzigd bij de wetten van 29 Juni
      1912 (*Staatsblad* n°. 202), 16 December 1916 (*Staatsblad* n°. 552) en 26 Maart 1920 (*Staatsblad* n°. 156), zijn
      niet van toepassing op de vorenbedoelde concessiën.

      3 De rechtverkrijgenden zullen voor het onttrekken aan de ontginning van Staatswege van de terreinen, in het eerste
      lid bedoeld, ten behoeve van het Staatsmijnbedrijf in Limburg eene vergoeding aan 's Rijks schatkist uitkeeren,
      berekend naar den maatstaf van € 1 361,34 per hectare.
    url: https://wetten.overheid.nl/BWBR0001916/2002-01-01#Artikel1
  - number: '3'
    text: |-
      De grenzen tusschen de mijnvelden "Oranje-Nassau", waarvoor concessie werd verleend bij Koninklijk besluit van
      2 Mei 1893 n°. 45, gewijzigd bij besluit van 29 October 1906 n°. 55, en "Carl", waarvoor concessie werd verleend
      bij Koninklijk besluit van 28 April 1879 n°. 6, gewijzigd bij besluit van 29 October 1906 n°. 55, en de grenzen
      tusschen de mijnvelden "Laura", waarvoor concessie werd verleend bij Koninklijk besluit van 9 September 1876
      n°. 24, gewijzigd bij besluiten van 20 April 1904 n°. 38 en 29 October 1906 n°. 55, en "Vereeniging", waarvoor
      concessie werd verleend bij Koninklijk besluit van 18 Februari 1877 n°. 24, gewijzigd bij besluiten van 20 April
      1904 n°. 38 en 29 October 1906 n°. 55, kunnen door Ons, den Raad van State gehoord, worden gewijzigd, voor zoover
      noodig zonder inachtneming van de formaliteiten, daartoe voorgeschreven door de wet van 21 April 1810 (*Bulletin
      des Lois* n°. 285).
    url: https://wetten.overheid.nl/BWBR0001916/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Door Ons kan, den Raad van State gehoord, voor het terrein, op de bij deze wet behoorende kaart met de letter C.
      aangeduid, een concessie voor de ontginning van steenkolen worden verleend, waarop de artikelen 1 tot en met 8 van
      de wet van 27 April 1904 (*Staatsblad* n°. 73), gewijzigd bij de wetten van 29 Juni 1912 (*Staatsblad* n°. 202), 16
      December 1916 (*Staatsblad* n°. 552) en 26 Maart 1920 (*Staatsblad* n°. 156), niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0001916/2002-01-01#Artikel4
