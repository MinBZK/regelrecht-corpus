  - number: 25a
    text: |-
      Op de plaatsing van een verdachte in een inrichting op grond van
      [artikel 175 van het Wetboek van Strafvordering BES][ref1] is [artikel 25, eerste tot en met vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel175
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel25
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '175'
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '25'
        paragraaf: III
  - number: '26'
    text: |-
      Een krankzinnige, die krachtens eene rechterlijke machtiging in een gesticht is opgenomen, kan zonder nadere
      machtiging naar een ander gesticht worden overgebracht binnen den termijn bij de laatst verleende machtiging
      gesteld. Ingeval van overbrenging worden de den krankzinnige betreffende stukken door het bestuur van het eene
      gesticht gezonden aan dat van het andere.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel26
  - number: '27'
    text: |-
      Door den geneeskundige of, zoo er meer zijn, door den eerste geneeskundige van een gesticht, kan in overleg met
      het bestuur aan een ieder die daarin is opgenomen, met toestemming van hem, die de opneming heeft verzocht, verlof
      worden verleend om het gesticht voor een bepaalden tijd te verlaten. Ingeval de verpleegde onder ouderlijk gezag,
      voogdij of curateele staat, is daartoe de toestemming van hem, die het ouderlijk gezag uitoefent, van den voogd
      of van den curator noodig. Deze bepaling geldt niet, wanneer het verlof voor vier en twintig uren of korter wordt
      verleend. Het ingaan van het verlof en de terugkeer in het gesticht worden op het in [Artikel 19][ref1] vermeld
      register aangeteekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel19
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '19'
        paragraaf: III
  - number: '28'
    text: |-
      Ontslag wordt verleend door het bestuur van het gesticht: 1°. wanneer de verpleegde geene blijk van krankzinnigheid
      heeft gegeven of hij van zijne krankzinnigheid genoegzaam is hersteld; van het verleend ontslag wordt door den
      geneeskundige eene schriftelijke verklaring afgegeven aan den persoon of de autoriteit, die het verzoek tot
      opneming heeft gedaan; 2°. op bevel van den Procureur-generaal; 3°. op rechterlijk bevel. Ontslag kan worden
      verleend door het genoemde bestuur: a. op verzoek van hem, op wiens aanvraag de opneming geschied is, of,
      bij ontstentenis van dezen op verzoek van een ander bloedverwant of aangehuwde of den echtgenoot, bedoeld bij
      [Artikel 13][ref1], en in beide gevallen wanneer de verpleegde onder vaderlijke macht, voogdij of curateele
      staat met de toestemming van de in het tweede lid van [Artikel 27][ref2] genoemde personen; b. wanneer de bij
      de overeenkomst krachtens welke de lijder in het gesticht is opgenomen, vastgestelde verpleegkosten of kosten
      buiten de verpleging niet op de bepaalde of overeengekomen wijze worden voldaan en de schuldenaar zonder gevolg
      is in gebreke gesteld om te betalen. De Procureur-generaal kan, in overleg met den inspecteur, bij gebrek aan
      plaatsruimte in de inrichting als bedoeld in [artikel 1][ref3], zoodanige lijders doen ontslaan, die volgens een
      vooraf in te winnen schriftelijk advies van den geneeskundige van het gesticht, of, indien er meer zijn, van den
      eersten geneeskundige, als ongeneeslijk zijn aan te merken en wier ontslag geen gevaar oplevert voor verstoring der
      openbare orde of voor ongelukken. Het ontslag wordt op het in [Artikel 19][ref4] vermelde register aangeteekend.
      De terugkeer in de maatschappij wordt door den genoemde geneeskundige van het gesticht geregeld in overleg met
      hem op wiens aanvraag de opneming is geschied, of, bij ontstentenis van dezen met iemand dergenen, die bevoegd
      waren de opneming te vragen. Bij het ontslag van hem, die op eigen verzoek in het gesticht is opgenomen, wordt het
      in de vorige zinsnede vermeld overleg niet vereischt. Zijn de in de eerste zinsnede van het vorige lid bedoelde
      personen niet bekend of onthouden zij hunne medewerking, zoo kan de hulp van den Gezaghebber van het openbaar
      lichaam, waarop het gesticht gelegen is, tot de opzending van de ontslagene naar zijn woonplaats worden ingeroepen.
      Hetzelfde geldt bij het ontslag van hen, die op eigen verzoek in het gesticht zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0028223#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028223#Artikel19
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '27'
        paragraaf: IV
      - id: ref3
        bwb_id: BWBR0028223
        artikel: '1'
        paragraaf: I
      - id: ref4
        bwb_id: BWBR0028223
        artikel: '19'
        paragraaf: III
  - number: '29'
    text: |-
      In ieder der gevallen, bedoeld bij [Artikel 28, eerste lid, sub 2, en tweede lid, sub a en b][ref1], beoordeelt
      de geneeskundige, of zoo er meer zijn, de eerste geneeskundige van het gesticht vooraf of het ontslag kan plaats
      hebben, zonder gevaar voor stoornis van de openbare orde of voor ongelukken. Blijkt het tegendeel, dan maakt hij
      daaromtrent eene schriftelijke verklaring op en zendt die in het geval van [Artikel 28, tweede lid, sub a][ref2],
      met het verzoek, in dat van Artikel 28, tweede lid, sub b, met het exploit van ingebrekestelling aan den
      Procureur-generaal. De Procureur-generaal vraagt onmiddellijk na ontvangst dezer stukken de beslissing van het
      Gemeenschappelijk Hof, dat op zijn requisitoir of het ontslag beveelt na zich verzekerd te hebben, dat de noodige
      maatregelen genomen zijn om het gevaar voor stoornis van de openbare orde of voor ongelukken te verhoeden, of
      bepaalt dat het ontslag als gevaarlijk niet binnen den termijn der laatste machtiging zal geschieden, of, bij
      het verstrijken van dien termijn, in de hiervoor omschreven vormen machtiging verleent tot verder verblijf van
      den krankzinnige in een gesticht. Zoolang het Gemeenschappelijk Hof beraadslaagt wordt het gevraagde ontslag niet
      verleend. Het Gemeenschappelijk Hof kan vóór het nemen eener beslissing een nader onderzoek bevelen. Het tweede lid
      en de volgende zinsneden van [Artikel 23][ref3] zijn daarbij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0028223#Artikel23
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '28'
        paragraaf: IV
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '28'
        paragraaf: IV
      - id: ref3
        bwb_id: BWBR0028223
        artikel: '23'
        paragraaf: III
  - number: '30'
    text: |-
      Bevindt de Procureur-generaal, dat een verpleegde in een krankzinnigengesticht op onwettige wijze is opgenomen
      of gehouden, zoo beveelt hij diens onmiddellijk ontslag, tenzij dit niet zonder gevaar voor stoornis van de
      openbare orde of voor ongelukken kan geschieden. Zoo het bestaan van dat gevaar blijkt uit eene met redenen
      omkleede verklaring van den geneeskundige van het gesticht, of, indien er meer zijn, van den eersten geneeskundige,
      requireert de Procureur-generaal in de hiervoren omschreven vormen de machtiging van het Gemeenschappelijk
      Hof tot verder verblijf van den krankzinnige in een gesticht. Treft de Procureur-generaal in een gesticht een
      verpleegde aan, die, ofschoon daarin op grond van een rechterlijke machtiging verblijvende, naar zijn oordeel
      niet meer krankzinnig is, dan kan hij diens ontslag alleen bevelen zoo de geneeskundige, of, zoo er meer zijn, de
      eerste geneeskundige van het gesticht daarmede instemt. Bij gemis van die instemming vraagt de Procureur-generaal
      de beslissing van het Gemeenschappelijk Hof, dat vooraf den geneeskundige, of, zoo er meer zijn, den eersten
      geneeskundige van het gesticht hoort en een nader onderzoek kan bevelen; het tweede lid en de volgende zinsneden
      van [Artikel 23][ref1] zijn daarbij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel23
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '23'
        paragraaf: III
  - number: '31'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel31
  - number: 31bis
    text: |-
      De opbrengst van den arbeid der verpleegden in de inrichting, bedoeld in [artikel 1, derde lid][ref1] blijft onder
      bewaring van den Directeur der inrichting, die haar voor ten hoogste de helft ten behoeve van den verpleegde kan
      aanwenden.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel1
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel31bis
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '1'
        paragraaf: I
  - number: '32'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel32
  - number: '33'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel33
  - number: '34'
    text: |-
      Van een ondercuratelestelling, instelling van een bewind als bedoeld in
      [titel 19 van Boek 1 van het Burgerlijke Wetboek BES][ref1] of instelling van een mentorschap, alsmede van de
      benoeming van een curator, bewindvoerder of mentor wordt binnen drie dagen na de dagteekening der stukken, waarbij
      zij plaats hebben, door de Griffier van het Gemeenschappelijk Hof bij brief kennis gegeven aan het bestuur van het
      gesticht, waarin de krankzinnige wordt verpleegd. Die brief wordt bij het in [Artikel 19][ref2] vermeld register
      bewaard, nadat daarin van den zakelijken inhoud aanteekening is gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0028743
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel19
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0028743
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '19'
        paragraaf: III
  - number: '35'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie wordt gestraft hij, die een
      krankzinnigengesticht opricht zonder vergunning van Onze Minister, of daarin krankzinnigen blijft verplegen,
      nadat de vergunning is ingetrokken. Met dezelfde straf wordt gestraft hij, aan wiens schuld te wijten is, dat
      iemand zonder de vereischte machtiging in een gesticht voor krankzinnigen is op genomen of dat een verpleegde
      niet wordt ontslagen wiens ontslag krachtens eene der bepalingen van de [artt. 23 tot en met 25][ref1] en
      [28 tot en met 30][ref2] behoort te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel28
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '23'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '28'
        paragraaf: IV
  - number: '36'
    text: 'Met geldboete van de eerste categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.A
    text: 'de bestuurder van een krankzinnigengesticht, die:'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.A.1°
    text: |-
      nalaat de vereischte kennisgeving aangaande de opneming, verplaatsing, verlof, ontslag of overlijden van een
      krankzinnige te doen aan het bevoegd gezag met inachtneming van de wettelijke voorschriften;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.A.2°
    text: bij de opneming van krankzinnigen nalaat zich te doen overleggen de bij deze wet gevorderde stukken;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.A.3°
    text: nalaat de in deze wet genoemde registers te houden overeenkomstig de in deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.B
    text: |-
      hij die nalaat aan het bevoegd gezag te doen de in [artikel 6, eerste lid][ref1], dezer wet voorgeschreven
      aangiften;


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel6
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '6'
        paragraaf: II
  - number: 36.C
    text: |-
      de geneeskundige, die nalaat aan het bevoegd gezag te doen de in [artikel 6, vierde lid][ref1], dezer wet
      voorgeschreven kennisgeving;


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel6
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '6'
        paragraaf: II
  - number: 36.D
    text: |-
      de geneeskundige verbonden aan een krankzinnigengesticht, die nalaat de in deze wet genoemde registers,
      aanteekeningen of verklaringen te houden of op te maken of te verzenden overeenkomstig de in deze wet gegeven
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: 36.E
    text: |-
      met geldboete van de eerste categorie wordt gestraft hij, die in een der gevallen in deze wet vermeld, wettelijk
      als bloedverwant, aangehuwde, echtgenoot, voogd, curator of deskundige opgeroepen, zonder geldige reden van
      verschooning wegblijft.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel36
  - number: '37'
    text: De feiten, bij deze wet strafbaar gesteld, worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37
  - number: 37A.1
    text: |-
      De kosten, voortvloeiende uit de overbrenging van onvermogende krankzinnigen naar en hun verpleging in gestichten
      voor krankzinnigen, worden voldaan uit de kas van het openbaar lichaam waar de verpleegden woonplaats hadden ten
      tijde van de opneming in de inrichting.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37A
  - number: 37A.2
    text: |-
      Onder woonplaats in het vorige lid bedoeld wordt verstaan het openbaar lichaam in welks bevolkingsregister de
      verpleegde staat ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37A
  - number: 37A.3
    text: |-
      Minderjarigen worden geacht woonplaats te hebben in het openbaar lichaam in welks bevolkingsregister hun ouders of
      voogden staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37A
  - number: 37A.4
    text: |-
      Indien vaststelling van de woonplaats overeenkomstig het tweede lid niet mogelijk is, geldt als woonplaats de
      plaats van het werkelijk verblijf.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37A
  - number: 37A.5
    text: |-
      Indien de woonplaats niet is aan te wijzen conform het bepaalde in het tweede of vierde lid, komen de kosten in het
      eerste lid bedoeld ten laste van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel37A
  - number: '38'
    text: |-
      Door de openbare lichamen worden, bij gebreke van tijdige betaling op andere wijzen, als voorschot voldaan de
      kosten voortvloeiende uit: 1°. het bij sluiting van een krankzinnigengesticht op last van Onze Minister overbrengen
      van krankzinnigen naar andere gestichten volgens [Artikel 4][ref1] en hunne opneming en verpleging daarvan; 2°.
      de overbrenging naar en de opneming en verpleging in een gesticht van krankzinnigen omtrent wie het onzeker is
      door wien de kosten moeten worden gedragen of wier plaatsing of verdere verpleging ingevolge deze wet geschiedt
      op requisitoir van den Procureur-generaal; 3°. het vervoer en de verpleging, waar ook, van krankzinnigen op bevel
      van den Gezaghebber in bewaring gesteld overeenkomstig [Artikel 15][ref2]. Deze kosten worden door de openbare
      lichamen verhaald: a. op de bestuurders der gestichten, indien de uitgaaf het gevolg is van de nalatigheid of
      verzuim hunnerzijds; en anders: b. op de inkomsten en bezittingen van den verpleegde, en voor zoover deze daartoe
      toereikend zijn; c. op zijne bloed- en aanverwanten, die naar [artikel 468 van het Burgerlijk Wetboek BES][ref3]
      tot zijn onderhoud verplicht zijn; d. op het openbaar lichaam dat volgens [Artikel 37A][ref4] de verplegingskosten
      van de krankzinnigen heeft te voldoen. De kosten van verpleging in een inrichting als bedoeld in [artikel 1][ref5]
      worden aan de personen of de openbare lichamen sub b, c en d genoemd in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel4
