      [ref4]: https://wetten.overheid.nl/BWBR0028223#Artikel37A
      [ref5]: https://wetten.overheid.nl/BWBR0028223#Artikel1
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel38
