  - number: '20'
    text: |-
      Bij elke plaatsing van een krankzinnige in een gesticht geeft de betrokken Gezaghebber daarvan onverwijld
      kennis aan de personen in [Artikel 13][ref1] vermeld. De Gezaghebber zendt een afschrift van zijn bevel en de
      geneeskundige verklaring op grond waarvan het bevel is gegeven, ten spoedigste aan de Procureur-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
  - number: '21.1'
    text: |-
      Gedurende de eerste vier weken na iemands opneming houdt de geneeskundige van het gesticht, die den opgenomene
      behandelt, in een daartoe bestemd register, waarvan het model bij of krachtens algemene maatregel van bestuur wordt
      vastgesteld, dagelijks aanteekening van zijne bevinding.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel21
  - number: '21.2'
    text: |-
      Na den afloop der eerste vier weken geschiedt gelijke aanteekening gedurende een half jaar, ten minste wekelijks en
      daarna ten minste maandelijks.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel21
  - number: '22'
    text: |-
      Binnen vijf weken na iemands opneming wordt door den Procureur-generaal een afschrift van de in
      [artikel 21, eerste lid][ref1], bedoelde aantekeningen met een requisitoir om den opgenomene gedurende een
      bepaalden tijd, dien van één jaar niet te boven gaande, in een krankzinnigengesticht te doen verblijven, ingediend
      aan het Gemeenschappelijk Hof. Het requisitoir gaat vergezeld van eene met redenen omkleede verklaring van den
      geneesheer van het gesticht, of, indien er meer zijn, van den eersten geneeskundige omtrent het noodzakelijke of
      wenschelijke eener verdere verpleging in een krankzinnigengesticht.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel21
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '21'
        paragraaf: III
  - number: '23'
    text: |-
      Over het requisitoir kan door het Gemeenschappelijk Hof worden beschikt op de in [Artikel 22][ref1] vermelde
      bescheiden. Het Gemeenschappelijk Hof kan echter nader bewijs door getuigen of andere middelen gelasten en zelfs
      het verhoor van den verpleegde bevelen. Wordt het verhoor van den verpleegde bevolen, dan geschiedt dit in het
      gesticht al of niet in tegenwoordigheid van een der daaraan verbonden geneeskundigen. Het Gemeenschappelijk Hof
      kan verhoor opdragen aan een daartoe te benoemen Rechter Commissaris. Dit verhoor geschiedt zooveel mogelijk
      in het bijzijn van den Procureur-generaal. Bij gelegenheid van het verhoor van den verpleegde kunnen tevens
      de geneeskundigen en andere personen, die zich in het gesticht bevinden, als getuigen worden gehoord, zonder
      voorafgaande oproeping. Hangende het onderzoek blijft de verpleegde in het gesticht. Bij afwijzende beschikking op
      het requisitoir van den Procureur-generaal gelast het Gemeenschappelijk Hof tevens, dat de persoon, wiens verdere
      verblijf in een krankzinnigengesticht is verzocht, onmiddellijk uit het gesticht worde ontslagen. De beschikking
      van het Gemeenschappelijk Hof wordt gesteld op het requisitoir.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel22
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '22'
        paragraaf: III
  - number: '24'
    text: |-
      Ten hoogste één maand en ten minste veertien dagen vóór het verstrijken van den tijd, waarvoor het
      Gemeenschappelijk Hof iemands verblijf in een krankzinnigengesticht heeft vergund, wordt door den geneeskundige
      van het gesticht of, indien er meer zijn door den eerste geneeskundige aan den Procureur-generaal aan afschrift
      gezonden van de in [artikel 21][ref1] bedoelde aanteekeningen, vergezeld van zijne met redenen omkleede verklaring
      omtrent de noodzakelijke of wenschelijke eener verdere verpleging in een krankzinnigengesticht. De Procureur-
      generaal dient hierop, zoo daartoe termen zijn, uiterlijk acht dagen na de ontvangst van de in het eerste
      lid genoemde bescheiden en onder overlegging daarvan aan het Gemeenschappelijk Hof een requisitoir in tot het
      verleenen eener nieuwe machtiging voor ten hoogste één jaar. Op dit requisitoir wordt beschikt overeenkomstig de
      voorschriften van [Artikel 23][ref2]. Telkens bij het verstrijken van den termijn der laatst verleende machtiging
      kan op gelijke wijze een nieuwe machtiging worden verleend voor ten hoogste één jaar. De verpleegde, te wiens
      aanzien machtiging tot verlengd verblijft in een gesticht is verzocht, blijft daarin hangende het onderzoek van het
      Gemeenschappelijk Hof. Bij weigering der machtiging gelast het Gemeenschappelijk Hof tevens, dat de persoon, wiens
      verder verblijf in een krankzinnigengesticht is gerequireerd, onmiddellijk uit het gesticht worde ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel23
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '21'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '23'
        paragraaf: III
  - number: '25'
    text: |-
      De plaatsing van een verdachte in een gesticht op grond van
      [artikel 360 van het Wetboek van Strafvordering BES][ref1] geschiedt zonder nadere formaliteiten, alleen op grond
      van de beschikking van de president van het Gemeenschappelijk Hof of van de rechter in eerste aanleg. De kosten
      van overbrenging naar het gesticht en van verpleging gedurende den tijd der observatie komen voor rekening van de
      openbare lichamen, tenzij dit door of voor den beklaagde anders verlangd wordt. Bij de opneming doet de President
      van het Gemeenschappelijk Hof of de betrokken rechter in eersten aanleg aan den geneeskundige, of, zoo er meer
      zijn, aan den eersten geneeskundige, van het gesticht, alle bescheiden en inlichtingen toekomen, welke dienen
      kunnen om deze bij zijn oordeel over het geval voor te lichten. Genoemde geneeskundige zendt zoo spoedig mogelijk
      door tusschenkomst van den Procureur-generaal zijn met redenen omkleed rapport over de al of niet krankzinnigheid
      van den beklaagde aan den President van het Gemeenschappelijk Hof of aan den betrokken rechter in eersten aanleg.
      Zoo het rapport de verklaring inhoudt, dat de opgenomene aan krankzinnigheid lijdende is, wordt door den Procureur-
      generaal zijne definitieve plaatsing in een krankzinnigengesticht gerequireerd, overeenkomstig de voorschriften der
      [artt. 22][ref2] en [23][ref3] van deze wet. Houdt het rapport de verklaring in, dat de opgenomene niet krankzinnig
      is, dan geeft de President van het Gemeenschappelijk Hof of de betrokken rechter in eersten aanleg last tot
      onmiddellijk ontslag uit het gesticht, met bevel dat de beklaagde weder ter beschikking der Justitie worde gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel360
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0028223#Artikel23
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel25
    references:
      - id: ref1
