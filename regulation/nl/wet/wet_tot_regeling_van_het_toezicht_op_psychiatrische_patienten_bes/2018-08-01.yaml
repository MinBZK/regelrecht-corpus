$id: wet_tot_regeling_van_het_toezicht_op_psychiatrische_patienten_bes
regulatory_layer: WET
publication_date: '2023-09-13'
valid_from: '2018-08-01'
bwb_id: BWBR0028223
url: https://wetten.overheid.nl/BWBR0028223/2018-08-01
articles:
  - number: '1'
    text: 'In de artikelen van deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.a
    text: |-
      *Gemeenschappelijk Hof:* Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint Maarten en van Bonaire, Sint
      Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.b
    text: '*inspecteur:* de bevoegde inspecteur van de Inspectie gezondheidszorg en jeugd;'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.c
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.d
    text: '*openbare lichamen:* openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.e
    text: '*Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1.f
    text: '*Rijksvertegenwoordiger:* Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1
  - number: 1a.1
    text: |-
      Onze Minister wijst ten behoeve van de openbare lichamen ten minste één instelling aan die uitsluitend is ingericht
      als krankzinnigengesticht, bestemd voor de medische en verpleegkundige verzorging van psychiatrische patiënten.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1a
  - number: 1a.2
    text: |-
      Indien en zodra noch door een openbaar lichaam noch van particuliere zijde een op de medische en verpleegkundige
      verzorging van psychiatrische patiënten uit de openbare lichamen gerichte instelling in stand wordt gehouden,
      voorziet de Rijksvertegenwoordiger ten laste van de openbare lichamen in de oprichting en het beheer van een
      krankzinnigengesticht, dat ten minste toegankelijk is voor die categorie of categorieën van patiënten, waaraan geen
      bestaand krankzinnigengesticht toegang verschaft.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1a
  - number: 1a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden geregeld naast het algemene toezicht, bedoeld in
      [artikel 6][ref1], het bijzondere toezicht op, het bestuur van, de voorwaarden voor de opneming en verpleging,
      waaronder de verpleeggelden, in een krankzinnigengesticht, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel6
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '6'
        paragraaf: II
  - number: '2.1'
    text: |-
      Tot oprichting van een particulier krankzinnigengesticht is de vergunning van Onze Minister vereist. Deze kan
      daaraan zodanige voorwaarden, waaronder de maximaal in rekening te brengen verpleeggelden, verbinden als hij in het
      belang van een deugdelijke uitvoering van deze wet noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel2
  - number: '2.2'
    text: |-
      Als particulier krankzinnigengesticht wordt beschouwd elke inrichting, waarin iemand meer dan drie krankzinnigen,
      die niet tot zijn gezin behoren, verpleegt.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel2
  - number: '2.3'
    text: Een particulier krankzinnigengesticht is uitsluitend tot verpleging van krankzinnigen bestemd.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel2
  - number: '3.1'
    text: |-
      Onder het bestuur of de bestuurder en onder de eerste geneeskundige van een particulierkrankzinnigengesticht,
      bedoeld in [artikel 2][ref1], wordt in het bij of krachtens deze wet bepaalde verstaan het orgaan of lid van het
      orgaan van het gesticht dat onderscheidenlijk de aan het gesticht verbonden geneeskundige die ingevolge de op het
      gesticht toepasselijke bepalingen met de betreffende bestuurlijke of geneeskundige aangelegenheid belast is of tot
      de behartiging daarvan het meest aangewezen is.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel2
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '2'
        paragraaf: I
  - number: '3.2'
    text: Aan een particulier krankzinnigengesticht moet tenminste één bevoegde geneeskundige zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel3
  - number: '4'
    text: |-
      Indien een particulier krankzinnigengesticht zonder vergunning van Onze Minister is opgericht, wordt het op diens
      last gesloten. Indien zulk een krankzinnigengesticht niet voldoet aan de voorschriften van deze wet en aan de
      voorwaarden, aan deze vergunning tot oprichting verbonden, zal de vergunning door Onze Minister ingetrokken en het
      gesticht op diens last gesloten worden, indien niet alsnog binnen een door hem vast te stellen termijn naar behoren
      aan de voorschriften en de voorwaarden dezer wet wordt voldaan. Het besluit tot sluiting van een gesticht wordt
      met redenen omkleed en in de Staatscourant bekendgemaakt. Bij sluiting van een gesticht worden de daarin verpleegde
      krankzinnigen op kosten van hen, voor wier rekening zij verpleegd worden, binnen een door Onze Minister te stellen
      termijn, door de zorg van de inspecteur, overgebracht naar andere krankzinnigengestichten.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel4
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de plaatsen tot voorlopige opneming van krankzinnigen
      aangewezen en worden voorschriften vastgesteld waaraan die plaatsen moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel5
  - number: '6.1'
    text: |-
      Hij die een krankzinnige verpleegt, is gehouden daarvan binnen tweemaal vierentwintig uur na aanvang van de
      verpleging aangifte te doen aan de Gezaghebber.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel6
  - number: '6.2'
    text: |-
      De Gezaghebber geeft van een aangifte als bedoeld in het eerste lid, onverwijld kennis aan de Procureur-Generaal en
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel6
  - number: '6.3'
    text: |-
      Verpleging vangt aan, zodra een geneeskundige, die bevoegd is om in de openbare lichamen de geneeskunst uit te
      oefenen, het verzorgend personeel kennis geeft van de aard van de ziekte van de verpleegde.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel6
  - number: '6.4'
    text: De geneeskundige, bedoeld in het derde lid, stelt de Gezaghebber onverwijld van zijn diagnose in kennis.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel6
  - number: '7.1'
    text: |-
      Onverminderd het elders in de artikelen van deze wet bepaalde, zijn de ambtenaren van de Inspectie gezondheidszorg
      en jeugd belast met het toezicht op de naleving van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.2'
    text: |-
      De krachtens de eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: 7.2.a
    text: vrijelijk alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: 7.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: 7.2.c
    text: goederen aan opneming en onderzoek te onderwerpen en deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: 7.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: 7.2.e
    text: |-
      woningen, waar krankzinnigen worden verpleegd of een zodanige verpleging wordt vermoed, zonder de uitdrukkelijke
      toestemming van de bewoner binnen te treden.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.3'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.4'
    text: |-
      Op het binnentreden in woningen als bedoeld in het tweede lid, onderdeel e, is
      [titel X van het Derde boek van het Wetboek van Strafvordering BES][ref1] van overeenkomstige toepassing, met
      uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3], [157, tweede en derde lid][ref4],
      [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met dien verstande dat de machtiging
      wordt verleend door de Gezaghebber.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '7.5'
    text: |-
      In de krankzinnigengestichten wordt te allen tijde vrije toegang verleend aan de Procureur-Generaal, de
      desbetreffende inspecteur en de Gezaghebber van het betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de krachtens het eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.7'
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '7.8'
    text: |-
      Zij, die krankzinnigen verplegen of die een krankzinnigengesticht besturen, alsmede de daaraan verbonden
      geneeskundigen, geven aan de Procureur-Generaal, de inspecteur en aan de Gezaghebber van het betrokken openbaar
      lichaam de verlangde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel7
  - number: '8'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel8
  - number: '9'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel9
  - number: '10.1'
    text: |-
      Van elke toepassing van een dwangmiddel op een verpleegde in een krankzinnigengesticht wordt dagelijks aanteekening
      gehouden in een register, ingericht naar een bij of krachtens algemene maatregel van bestuur vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel10
  - number: '10.2'
    text: |-
      Dit register wordt, behalve aan de inspecteur, op verlangen voorgelegd aan de Procureur-Generaal en de Gezaghebber
      van het betrokken openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel10
  - number: '11'
    text: |-
      De inspecteur of een Gezaghebber bevindende, dat een krankzinnige buiten een krankzinnigengesticht wordt
      verwaarloosd, of in een niet voor de verpleging van krankzinnigen doelmatige woning wordt verpleegd, geeft hiervan
      onmiddellijk kennis aan den Procureur-generaal.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel11
  - number: '12'
    text: |-
      Bij hunne op onbepaalde tijden, doch althans eenmaal in de drie maanden, aan de krankzinnigengestichten te
      brengen bezoeken verzekeren de Procureur-generaal, de inspecteur of de betrokken Gezaghebber zich dat niemand
      wederrechtelijk daarin geplaatst of teruggehouden wordt en dat de verpleegden behoorlijk worden behandeld. Het
      bestuur van het gesticht zendt aan de Procureur-generaal binnen tweemaal vier en twintig uren eene schriftelijke
      kennisgeving van elke opneming, verplaatsing, verlof, ontslag of overlijden van een verpleegde, met vermelding
      van de redenen van de verplaatsing, het verlof of het ontslag en met opgave van den persoon, die de aanvraag mocht
      hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel12
  - number: '13'
    text: |-
      Ieder meerderjarig bloedverwant of aangehuwde in de rechte linie onbepaald en in de zijlinie tot den derden graad
      ingesloten, alsmede de echtgenoot, voogd of curator van een krankzinnige, zijn bevoegd om aan den Gezaghebber van
      het openbaar lichaam waar de krankzinnige woont, machtiging te verzoeken om den krankzinnige voorloopig in een
      gesticht te doen plaatsen in het belang der openbare orde of in dat van den lijder. Weigert de Gezaghebber dan
      kunnen de verzoekers zich wenden tot het Gemeenschappelijk Hof.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel13
  - number: '14'
    text: |-
      De Gezaghebber, of krachtens opdracht van de Gezaghebber, de ambtenaar van politie die is aangesteld voor de
      uitvoering van de politietaak, kan bij ontstentenis van de in [artikel 13][ref1] vermelde personen de voorlopige
      plaatsing in een gesticht ambtshalve bij bevelschrift gelasten. Hij is, indien de in [Artikel 13][ref2] vermelde
      personen van hunne bevoegdheid geen gebruik maken, daartoe verplicht, wanneer hij de plaatsing van den krankzinnige
      onder verzekerd toezicht, in het belang der openbare orde of ter voorkoming van ongelukken, noodzakelijk acht, of
      wanneer het hem gebleken is, dat een krankzinnige verwaarloosd wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel13
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
  - number: '15'
    text: |-
      In spoedeischende gevallen kunnen de Gezaghebbers krankzinnigen, die zich binnen hun ressort bevinden, in bewaring
      doen stellen. De Gezaghebbers geven hiervan zoo spoedig mogelijk kennis aan den Procureur-generaal, met bijvoeging
      van de bescheiden, waaruit de krankzinnigheid blijkt. Deze bewaring vindt plaats in een krachtens [artikel 5][ref1]
      aangewezen plaats tot voorloopige opneming. De duur van het in bewaring stellen mag nooit langer zijn dan strikt
      noodzakelijk. Zoo spoedig mogelijk worden de noodige maatregelen genomen voor de voorloopige plaatsing in een
      gesticht.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel5
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '5'
        paragraaf: I
  - number: '16'
    text: |-
      Een meerderjarige die het op grond van zijn toestand wenselijk acht zich te doen verplegen in een
      krankzinnigengesticht, kan schriftelijk verzoeken daarin opgenomen te worden. Degene die op eigen verzoek in een
      krankzinnigengesticht is opgenomen, zal uiterlijk vierentwintig uren na een daartoe strekkend verzoek zijnerzijds
      uit de inrichting worden ontslagen. De [artikelen 13][ref1], [14][ref2] en [15][ref3] zijn niet van toepassing op
      de in dit artikel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028223#Artikel15
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '14'
        paragraaf: III
      - id: ref3
        bwb_id: BWBR0028223
        artikel: '15'
        paragraaf: III
  - number: '17'
    text: |-
      Bij het in [artikel 13][ref1] bedoelde verzoek moet worden overgelegd eene uiterlijk drie dagen vóór het
      verzoek opgemaakte, onderteekende en met redenen omkleede verklaring van een geneeskundige, als bedoeld in
      [artikel 6][ref2], waaruit blijkt, dat de persoon voor wien plaatsing in een gesticht verlangd wordt, in een
      toestand van krankzinnigheid verkeert. Bij de verzoeken kunnen bovendien omstandigheden vermeld en bescheiden
      overgelegd worden, waaruit de staat van krankzinnigheid nader blijkt. De Gezaghebbers geven in den regel ambtshalve
      geen bevel tot voorlopige plaatsing in een gesticht af, dan na ontvangst van eene verklaring van een geneeskundige
      als in dit artikel bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028223#Artikel6
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
      - id: ref2
        bwb_id: BWBR0028223
        artikel: '6'
        paragraaf: II
  - number: '18'
    text: |-
      De betrokken Gezaghebber is bevoegd, alvorens op het verzoek bedoeld in [Artikel 13][ref1] te beschikken, den
      persoon, wiens plaatsing verzocht is, zijne bloedverwanten of aangehuwden, zijn echtgenoot, voogd of curator
      daarover te hooren, wat eerstgenoemde betreft zoo noodig in tegenwoordigheid van een geneeskundige door den
      Gezaghebber zelven aan te wijzen. Wanneer de te hooren persoon niet ter plaatse aanwezig is, kan de betrokken
      Gezaghebber het verhoor aan den Gezaghebber van het openbaar lichaam, waar de woon- of verblijfplaats van den
      persoon gelegen is, opdragen. Het bevel van den Gezaghebber kan, na een daarin te bepalen termijn van ten hoogste
      zes maanden, niet meer ten uitvoer gelegd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel13
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '13'
        paragraaf: III
  - number: '19'
    text: |-
      De opneming van een krankzinnige in een gesticht geschiedt tegen overlegging van een gewaarmerkt afschrift van
      het in [artikel 14][ref1] bedoeld bevelschrift. Ingeval de rechter oordelende in strafzaken, met toepassing
      van het tweede lid van [artikel 39 van het Wetboek van Strafrecht BES][ref2], heeft bevolen, dat iemand in een
      krankzinnigengesticht zal worden geplaatst, geschiedt de opneming van zoodanigen persoon tegen overlegging van een
      uittreksel uit de onherroepelijk geworden uitspraak, die de plaatsing beveelt. Dit uittreksel en de expeditie van
      de in de [artt. 23][ref3], [24][ref4], [29][ref5] en [30][ref6] bedoelde rechterlijke beschikkingen moeten aan het
      bestuur van het gesticht worden overgelegd; zij worden vermeld in en bewaard bij een register, ingericht naar een
      bij of krachtens algemene maatregel van bestuur vast te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0028223#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0028223#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0028223#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0028223#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0028223#Artikel30
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028223
        artikel: '14'
        paragraaf: III
      - id: ref2
