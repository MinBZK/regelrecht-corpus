  - number: '39'
    text: |-
      Het verhaal geschiedt uit kracht van een bevelschrift van ten uitvoerlegging van den President van het
      Gemeenschappelijk Hof, gesteld op de daartoe aan dien ambtenaar over te leggen behoorlijk gesplitste en zooveel
      mogelijk door bewijsstukken gerechtvaardigde staten van kosten.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel39
  - number: '40'
    text: |-
      De stukken vereischt tot de opneming, het verblijf, de verplaatsing, het verlof en het ontslag van personen in en
      uit krankzinnigengestichten zijn vrij van zegel.
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel40
  - number: '41'
    text: 'Deze wet wordt aangehaald als: Wet tot regeling van het toezicht op krankzinnigen BES.'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel41
  - number: '42'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028223/2018-08-01#Artikel42
