preamble:
  text: |-
    Gelet op artikel 12 van verordening (EG) nr. 2792/1999 van de Raad van de Europese Unie van 17 december 1999
    tot vaststelling van de uitvoeringsbepalingen en voorwaarden voor de structurele acties van de Gemeenschap in de
    visserijsector (PbEG L 337);

    Gelet op artikel 2 en artikel 4 van de Kaderwet LNV-subsidies;

    Gezien de goedkeuring van de Commissie van de Europese Gemeenschappen bij beschikking C(2002) 1714 van 24 juni
    2002;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. vissersvaartuig: vaartuig dat gebruikt wordt voor de uitoefening van de bedrijfsmatige visserij en dat
      overeenkomstig [artikel 1, tweede lid, van de Uitvoeringswet Visserijverdrag 1967][ref1] als Nederlands geldt en
      dat overeenkomstig het bij of krachtens het [Besluit registratie vissersvaartuigen 1998][ref2] staat geregistreerd;

      c. visser: natuurlijke persoon die zijn hoofdberoep uitoefent aan boord van een in bedrijf zijnd vissersvaartuig;

      d. Dienst Regelingen: Dienst Regelingen van het Ministerie van Landbouw, Natuur en Voedselkwaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009353
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel1
    references:
