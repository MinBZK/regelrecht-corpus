        artikel: '2'
      - id: ref4
        bwb_id: BWBR0016104
        artikel: '2'
  - number: '7'
    text: |-
      De ontvanger van een subsidie als bedoeld in [artikel 2][ref1] is verplicht ten genoegen van de minister aan te
      tonen dat hij zijn werkzaamheden als visser niet heeft hervat. Daartoe verstrekt hij aan de Dienst Regelingen
      jaarlijks vóór 31 maart op een daartoe bestemd formulier een overzicht betreffende het voorafgaande kalenderjaar
      van zijn inkomsten uit werk en woning of sociale zekerheidsuitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0016104#Artikel2
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016104
        artikel: '2'
  - number: '8'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4:57 van de Algemene wet bestuursrecht][ref1] of aan
      [artikel 6 van de Kaderwet LNV-subsidies][ref2] kunnen terug te vorderen bedragen worden vermeerderd met de
      wettelijke rente over de periode vanaf de terugvordering tot aan het moment van algehele voldoening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel457
      [ref2]: https://wetten.overheid.nl/BWBR0009194#Artikel6
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:57
      - id: ref2
        bwb_id: BWBR0009194
        artikel: '6'
  - number: '9'
    text: |-
      De minister bepaalt bij een in de Staatscourant bekend te maken besluit per aanvraagperiode in hoeveel gedeelten
      het subsidiebedrag wordt betaald. Indien het subsidiebedrag in gedeelten wordt betaald, stelt de minister vast op
      welke wijze de gedeelten worden berekend en op welke tijdstippen zij worden betaald.
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel9
  - number: '10'
    text: |-
      Een aanvraag tot verstrekking van een subsidie op grond van deze regeling wordt afgewezen indien de aanvrager reeds
      eerder een bijdrage of subsidie op grond van deze regeling, de Vergoedingsregeling voor uittreding van vissers uit
      de visserij 2002 of de Vergoedingsregeling voor uittreding van vissers uit de visserij is verstrekt.
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Vergoedingsregeling voor uittreding van vissers uit de visserij 2003.'
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel12
