        bwb_id: BWBR0009353
  - number: '2'
    text: |-
      De minister kan op aanvraag subsidie verstrekken aan een visser voor de beëindiging van zijn beroepsactiviteit ten
      gevolge van zijn vervroegde uittreding uit de zeevisserij.
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel2
  - number: '3'
    text: |-
      Een subsidie als bedoeld in [artikel 2][ref1] wordt slechts verstrekt aan de aanvrager:

      a. die zijn arbeids- of maatschapsovereenkomst beëindigt met het oog op zijn vervroegde uittreding uit de
      zeevisserij;

      b. die op de ontvangstdatum van de volledige aanvraag of binnen drie maanden na die datum, de leeftijd van ten
      minste 55 jaar heeft bereikt, maar nog niet de leeftijd van 65 jaar;

      c. die zijn arbeids- of maatschapsovereenkomst heeft beëindigd na het bereiken van de 55-jarige leeftijd;

      d. die ten minste tien jaar zijn beroepsactiviteit als visser heeft uitgeoefend;

      e. die zonder onderbreking ten minste 12 maanden voorafgaand aan de periode, bedoeld in artikel 4, eerste lid,
      werkzaam is geweest op een vissersvaartuig dat wordt gebruikt voor de zeevisserij;

      f. die met de in onderdeel e bedoelde werkzaamheden in de betrokken periode de helft van zijn in artikel 3.1 van de
      Wet inkomstenbelasting 2001 bedoelde inkomen uit werk en woning heeft verdiend, en

      g. in voorkomend geval:

      1°. ten aanzien van wie de maatschapsovereenkomst bepaalt dat de eigenaar van het vissersvaartuig niet gehouden is
      een bijdrage aan de visser te verstrekken wanneer hij het vissersvaartuig uit de maatschap terugtrekt, of

      2°. ten aanzien van wie uit de maatschapsovereenkomst voortvloeit dat de visser geen invloed heeft op de beslissing
      van de eigenaar van het vissersvaartuig dit uit de maatschap terug te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0016104#Artikel2
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016104
        artikel: '2'
  - number: '4'
    text: |-
      1 De minister maakt in de Staatscourant de periode bekend waarin een aanvraag voor subsidieverstrekking als bedoeld
      in [artikel 2][ref1] kan worden ingediend.

      2 De minister stelt voor de aanvraagperiode, bedoeld in het eerste lid, een subsidieplafond vast voor de op
      grond van de regeling te verstrekken subsidies. Het besluit tot vaststelling van het subsidieplafond wordt in de
      Staatscourant bekend gemaakt.

      3 De minister verdeelt de beschikbare bedragen in volgorde van ontvangst van de aanvragen, met dien verstande dat
      wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de
      aanvraag aan te vullen, de dag waarop de aanvraag volledig is, als datum van ontvangst geldt.

      4 Indien door toewijzing van aanvragen met dezelfde datum van ontvangst het subsidieplafond zou worden
      overschreden, geschiedt toewijzing aan de hand van een rangschikking van de aanvragen, waarbij telkenmale de hoogst
      gerangschikte aanvraag het eerst voor toewijzing in aanmerking komt. De rangschikking vindt plaats volgens loting
      die geschiedt door een door de minister aan te wijzen notaris.

      5 Voor de toepassing van het vierde lid komen uitsluitend aanvragen in aanmerking ten aanzien waarvan als datum van
      ontvangst geldt de dag waarop het subsidieplafond zou worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0016104#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016104
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '5'
    text: |-
      De subsidie, bedoeld in [artikel 2][ref1], bedraagt € 200,– voor iedere kalendermaand gedurende de periode die
      aanvangt op de eerste dag van de maand waarin de arbeids- of maatschapsovereenkomst wordt beëindigd en die eindigt
      op de eerste dag van de maand waarin de 65-jarige leeftijd wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0016104#Artikel2
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016104
        artikel: '2'
  - number: '6'
    text: |-
      1 De aanvraag tot subsidieverstrekking als bedoeld in [artikel 2][ref1] wordt ingediend bij de Dienst Regelingen op
      een daartoe bestemd formulier.

      2 De aanvraag gaat vergezeld van:

      a. een kopie van de arbeids- of maatschapsovereenkomst, waaruit in elk geval blijkt de naam van de werkgever
      onderscheidenlijk de maat-eigenaar en het letterteken en nummer van het vissersvaartuig waarop de aanvrager
      werkzaam is;

      b. een kopie van het paspoort of het identiteitsbewijs van de aanvrager;

      c. bescheiden waaruit blijkt dat de aanvrager heeft voldaan aan de vereisten, bedoeld in
      [artikel 3, onderdelen d, e en f][ref2].

      3 De minister beslist op de aanvraag en geeft binnen acht weken na ontvangst van alle ingevolge het vorig lid
      vereiste gegevens een beschikking tot subsidieverlening.

      4 De ontvanger van de subsidie, bedoeld in [artikel 2][ref3], toont binnen een termijn van drie maanden na
      ontvangst van de beschikking tot subsidieverlening ten genoegen van de minister aan dat hij zijn werkzaamheden als
      visser definitief heeft beëindigd.

      5 Binnen acht weken na ontvangst van de gegevens, bedoeld in het vierde lid, stelt de minister de subsidie, bedoeld
      in [artikel 2][ref4], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0016104#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016104#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0016104#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0016104#Artikel2
    url: https://wetten.overheid.nl/BWBR0016104/2005-01-01#Artikel6
    references:
      - id: ref1
