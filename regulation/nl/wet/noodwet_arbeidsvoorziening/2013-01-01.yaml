  - number: '55'
    text: |-
      Opzettelijke overtreding van het bij of krachtens [artikel 25, eerste of derde lid][ref1], of
      [32, eerste of tweede lid][ref2], bepaalde wordt gestraft met gevangenisstraf van ten hoogste één jaar of geldboete
      van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel32
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '25'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '32'
        hoofdstuk: II
        paragraaf: '4'
  - number: '56'
    text: |-
      Met gevangenisstraf van ten hoogste één jaar of geldboete van de derde categorie wordt gestraft hij die, krachtens
      [artikel 13][ref1] als werknemer onmisbaar verklaard of krachtens [artikel 24][ref2] als burgerdienstplichtige
      opgeroepen:


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: 56.a
    text: |-
      opzettelijk of ondanks waarschuwing roekeloos zichzelf, anderen of de eigendom van degene, in wiens dienst of voor
      wie, dan wel bij wie hij in deze hoedanigheid arbeid moet verrichten, onderscheidenlijk een scholing moet volgen,
      aan ernstig gevaar blootstelt, dan wel
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel56
  - number: 56.b
    text: |-
      opzettelijk en grovelijk de plichten veronachtzaamt, welke voor hem uit zijn rechtsbetrekking met de onder *a*
      bedoelde persoon voortvloeien.
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel56
  - number: '57.1'
    text: |-
      De feiten, strafbaar gesteld bij de [artikelen 53][ref1] en [54][ref2], zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel54
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '53'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '54'
        hoofdstuk: VI
  - number: '57.2'
    text: |-
      De feiten, strafbaar gesteld bij de [artikelen 55][ref1] en [56][ref2], zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel56
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '55'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '56'
        hoofdstuk: VI
  - number: '58'
    text: |-
      De voorgaande strafbepalingen zijn mede van toepassing op de Nederlander of de inwoner van Nederland, die een
      strafbaar feit begaat buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel58
  - number: '60.1'
    text: |-
      Met het opsporen van de feiten, bij deze wet strafbaar gesteld, zijn behalve de ambtenaren, aangewezen bij
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de krachtens [artikel 43][ref2] aangewezen
      ambtenaren, voor zover zij door Onze Minister van Justitie daartoe zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel43
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '43'
        hoofdstuk: IV
  - number: '60.2'
    text: |-
      Bij het opsporen van een bij deze wet strafbaar gesteld feit hebben de in het eerste lid bedoelde ambtenaren
      toegang tot elke plaats, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel60
  - number: '63'
    text: 'Deze wet kan worden aangehaald als: Noodwet Arbeidsvoorziening.'
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel63
  - number: '64'
    text: |-
      Deze wet treedt, met uitzondering van [hoofdstuk II][ref1], in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002759/2013-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002759
        hoofdstuk: II
