---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: noodwet_arbeidsvoorziening
regulatory_layer: WET
publication_date: '2014-06-24'
valid_from: '2014-01-06'
bwb_id: BWBR0002759
url: https://wetten.overheid.nl/BWBR0002759/2014-01-06
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is voor het geval van oorlog, oorlogsgevaar, daaraan
    verwante of daarmede verband houdende buitengewone omstandigheden regelen te stellen met betrekking tot de arbeid
    ten behoeve van de volkshuishouding, de landsverdediging en de overheidsdienst;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.b
    text: |-
      het Hoofd Arbeidsvoorziening: de door Onze Minister daartoe aangewezen functionaris van het Uitvoeringsinstituut
      werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.c
    text: 'werknemer:'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.c.1°
    text: degene, die in dienst van een ander arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.c.2°
    text: |-
      degene, die in de zelfstandige uitoefening van een beroep of bedrijf persoonlijk arbeid voor een ander verricht
        - tenzij hij dergelijke arbeid in de regel voor meer dan twee anderen verricht of zich daarbij door meer dan twee
      personen, niet zijnde zijn echtgenoot of geregistreerde partner of een bij hem inwonend bloed- of aanverwant of
      pleegkind, laat bijstaan, of deze arbeid voor hem slechts een bijkomstige werkzaamheid is;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.d
    text: |-
      *werkgever:* de natuurlijke of rechtspersoon, in wiens dienst dan wel voor wie de onder *c*, onderscheidenlijk sub
      1° en sub 2°, bedoelde werknemer arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.e
    text: '*arbeidsverhouding:* de rechtsbetrekking tussen een werknemer en diens werkgever;'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: 1.f
    text: |-
      inwoner van Nederland: degene, die als ingezetene in de basisregistratie personen is ingeschreven of behoort te
      zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel1
  - number: '2.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en [8, eerste lid, van de Coördinatiewet][ref2]
      uitzonderingstoestanden kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit,
      op voordracht van Onze Minister-President, één of meer van de paragrafen van [hoofdstuk II][ref3] van deze wet in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002759
        hoofdstuk: II
  - number: '2.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde paragrafen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
  - number: '2.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de paragrafen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
  - number: '2.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de paragrafen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
  - number: '2.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
  - number: '2.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel2
  - number: '3.1'
    text: |-
      Er is een Raad voor de Buitengewone Arbeidsvoorziening. De voorzitter, de overige leden en de secretaris worden op
      voordracht van Onze Minister door Ons benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel3
  - number: '3.2'
    text: |-
      De Raad heeft tot taak Onze bij de uitvoering van deze wet betrokken Ministers, al dan niet uit eigen beweging,
      van advies te dienen omtrent algemene vraagstukken van arbeidsvoorziening, welke zich kunnen voordoen in geval van
      buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel3
  - number: '3.3'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent de samenstelling en de werkwijze van de Raad.
      In de Raad hebben in ieder geval zitting een of meer leden, te benoemen op gezamenlijke aanbeveling van door
      Ons aangewezen algemeen erkende centrale organisaties van werkgevers, en een gelijk aantal leden, te benoemen op
      gezamenlijke aanbeveling van door Ons aangewezen algemeen erkende centrale organisaties van werknemers. De Raad kan
      commissies, waarin ook personen buiten de Raad zitting kunnen hebben, instellen ter voorbereiding van door hem uit
      te brengen adviezen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel3
  - number: '5.1'
    text: |-
      Het Hoofd Arbeidsvoorziening oefent de hem bij of krachtens deze wet toegekende bevoegdheden uit met inachtneming
      van de door Onze Minister in overeenstemming met het gevoelen van de Raad van Ministers gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel5
  - number: '5.2'
    text: |-
      De door Onze Minister als Hoofd Arbeidsvoorziening aangewezen functionarissen van het Uitvoeringsinstituut
      werknemersverzekeringen, zijn in die hoedanigheid ondergeschikt aan Onze Minister. De de Raad van bestuur
      van het Uitvoeringsinstituut werknemersverzekeringen verleent aan Onze Minister de medewerking die hij
      in deze verhouding behoeft. Bij regelen als bedoeld in het eerste lid en instructies als bedoeld in
      [artikel 10:22, eerste lid, van de Algemene wet bestuursrecht][ref1] kan van het bepaalde bij of krachtens de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] worden afgeweken, voor zover zulks in het belang van
      een goede uitvoering van deze wet nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0013060
  - number: '5.3'
    text: Regelen, gesteld krachtens het eerste lid, worden in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel5
  - number: '6'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die, zolang de verbinding tussen Onze
      Minister en enig gebied verbroken is, in dat gebied met inachtneming van de bij de maatregel gestelde regelen de
      bij de [artikelen 7][ref1] en [10][ref2] aan Onze Minister toegekende bevoegdheden uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel10
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Onze Minister kan bepalen, dat arbeidsverhoudingen in het algemeen, dan wel dat arbeidsverhoudingen, behorende tot
      bij zijn beschikking aangewezen categorieën, of dat arbeidsverhoudingen, waarbij bij zijn beschikking aangewezen
      personen partij zijn, niet mogen worden beëindigd zonder vergunning van het Hoofd Arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel7
  - number: '7.2'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel7
  - number: '7.3'
    text: Een krachtens het eerste lid vastgestelde besluit van algemene strekking wordt ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel7
  - number: '8'
    text: |-
      Indien een arbeidsverhouding door één der partijen is beëindigd in strijd met een krachtens
      [artikel 7, eerste lid][ref1], gesteld verbod of met een voorschrift, verbonden aan een krachtens dat lid verleende
      vergunning, kan de wederpartij gedurende zes maanden de nietigheid der beëindiging inroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel7
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.1'
    text: |-
      De [artikelen 7][ref1] en [8][ref2] gelden niet ten aanzien van dienstbetrekkingen van personen, die
      overheidswerknemer zijn in de zin van [artikel 2 van de Wet privatisering ABP][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007791
        artikel: '2'
  - number: '9.2'
    text: |-
      Ten aanzien van zodanige dienstbetrekkingen kunnen regelen van overeenkomstige strekking worden gesteld bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel9
  - number: '9.3'
    text: |-
      Bij een algemene maatregel van bestuur als in het tweede lid bedoeld kunnen omtrent het vragen van voorziening
      tegen beschikkingen, krachtens die maatregel genomen, en de rechtsgang ter zake, regelen worden gesteld in
      afwijking van [hoofdstuk III][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002759#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002759
        hoofdstuk: III
  - number: '9.4'
    text: |-
      De voordracht tot een algemene maatregel van bestuur als in het tweede lid bedoeld wordt Ons gedaan door Onze
      Minister, tezamen met Onze Ministers, wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister kan bepalen, dat arbeidsverhoudingen in het algemeen, dan wel dat arbeidsverhoudingen, behorende tot
      bij zijn beschikking aangewezen categorieën, of dat arbeidsverhoudingen, waarbij bij zijn beschikking aangewezen
      personen partij zijn, niet mogen worden aangegaan zonder vergunning van het Hoofd Arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel10
  - number: '10.2'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel10
  - number: '10.3'
    text: Een krachtens het eerste lid vastgestelde besluit van algemene strekking wordt ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel10
  - number: '11.1'
    text: |-
      Het is zowel de werkgever als de werknemer verboden een arbeidsverhouding, aangegaan in strijd met een krachtens
      [artikel 10, eerste lid][ref1], gesteld verbod of met een voorschrift, verbonden aan een krachtens dat lid
      verleende vergunning, te laten voortduren.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel10
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Ten aanzien van het beëindigen van zodanige arbeidsverhouding geldt een krachtens [artikel 7][ref1] gesteld verbod
      niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel7
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11.3'
    text: |-
      De werkgever is verplicht van de beëindiging van zodanige arbeidsverhouding onverwijld aan het Hoofd
      Arbeidsvoorziening schriftelijk mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel11
  - number: '12.1'
    text: |-
      De [artikelen 10][ref1] en [11][ref2] gelden niet ten aanzien van dienstbetrekkingen van personen als in
      [artikel 9][ref3] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Ten aanzien van zodanige dienstbetrekkingen kunnen regelen van overeenkomstige strekking worden gesteld bij
      algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel12
  - number: '12.3'
    text: |-
      [Artikel 9, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13.1'
    text: |-
      Het Hoofd Arbeidsvoorziening kan een werknemer op diens verzoek in diens arbeidsverhouding onmisbaar verklaren voor
      het verrichten van bij zijn beschikking aangewezen arbeid.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel13
  - number: '13.2'
    text: Van een krachtens het eerste lid tot de werknemer gerichte beschikking wordt mededeling gedaan aan diens werkgever.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel13
  - number: '14.1'
    text: |-
      Het is voor de duur der onmisbaarheid zowel aan de werknemer als aan diens werkgever verboden de arbeidsverhouding
      te beëindigen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel14
  - number: '14.2'
    text: |-
      Indien een arbeidsverhouding door één der partijen is beëindigd in strijd met het eerste lid, kan de wederpartij
      gedurende zes maanden de nietigheid der beëindiging inroepen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel14
  - number: '15.1'
    text: |-
      De werkgever is verplicht de onmisbaar verklaarde werknemer voor zover mogelijk de arbeid te laten verrichten,
      waarvoor deze onmisbaar is verklaard.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel15
  - number: '15.2'
    text: De onmisbaar verklaarde werknemer is verplicht de arbeid, die hem door de werkgever is opgedragen, te verrichten.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel15
  - number: '16.1'
    text: |-
      Het Hoofd Arbeidsvoorziening kan de onmisbaarverklaring van een werknemer te allen tijde, hetzij ambtshalve, hetzij
      op verzoek van de werknemer of van diens werkgever, intrekken.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel16
  - number: '16.2'
    text: Van een krachtens het eerste lid tot de werknemer gerichte beschikking wordt mededeling gedaan aan diens werkgever.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel16
  - number: '17.1'
    text: |-
      Op verzoek van een werknemer of van diens werkgever kan het Hoofd Arbeidsvoorziening, beide partijen gehoord, in
      verband met het aangaan door die werknemer van een arbeidsverhouding met een andere werkgever, waarin hij onmisbaar
      wordt verklaard, bepalen, dat, zolang de nieuwe arbeidsverhouding voortduurt, de bestaande arbeidsverhouding
      geschorst is, doch door partijen niet kan worden beëindigd zonder vergunning van het Hoofd Arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
  - number: '17.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de gevolgen van de schorsing voor de
      rechten en verplichtingen uit de betrokken arbeidsverhouding.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
  - number: '17.3'
    text: |-
      Een vergunning als in het eerste lid bedoeld kan onder beperkingen worden verleend. Aan zodanige vergunning kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
  - number: '17.4'
    text: |-
      [Artikel 8][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel8
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '17.5'
    text: |-
      In geval van toepassing van het eerste lid neemt bij het eindigen van de onmisbaarheid de nieuwe arbeidsverhouding
      van rechtswege een einde, tenzij de oorspronkelijke arbeidsverhouding reeds is beëindigd.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
  - number: '17.6'
    text: Van een krachtens het eerste lid tot de werknemer gerichte beschikking wordt mededeling gedaan aan diens werkgever.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel17
  - number: '19.1'
    text: |-
      Aan een persoon als in [artikel 9][ref1] bedoeld kan in verband met het aangaan van een arbeidsverhouding, waarin
      hij onmisbaar wordt verklaard, in zijn bestaande dienstbetrekking voor de duur van zijn onmisbaarheid verlof worden
      verleend. Bij algemene maatregel van bestuur worden hieromtrent nadere regelen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '19.2'
    text: |-
      In geval van toepassing van het eerste lid neemt bij het eindigen van de onmisbaarheid de arbeidsverhouding, waarin
      de betrokkene onmisbaar was verklaard, van rechtswege een einde.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel19
  - number: '19.3'
    text: |-
      De voordracht tot een algemene maatregel van bestuur als in het eerste lid bedoeld wordt Ons gedaan door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties, tezamen met Onze Minister en met Onze Ministers, wie het
      mede aangaat.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel19
  - number: '20.1'
    text: |-
      Een beding als bedoeld in [artikel 653 van Boek 7 van het Burgerlijk Wetboek][ref1] is niet van kracht ten aanzien
      van het werkzaam zijn als onmisbaar verklaarde werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel653
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '653'
  - number: '20.2'
    text: |-
      Indien het beding voor een bepaalde tijd is gemaakt, wordt de tijd, als onmisbaar verklaarde werknemer bij een
      derde doorgebracht, voor de berekening van deze termijn medegeteld.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel20
  - number: '21.1'
    text: |-
      De voorgaande artikelen van deze paragraaf gelden niet met betrekking tot de onmisbaarheid van personen in een
      dienstbetrekking als in [artikel 9][ref1] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde onmisbaarheid kunnen regelen van overeenkomstige strekking worden
      gesteld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel21
  - number: '21.3'
    text: |-
      [Artikel 9, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Burgerdienstplicht rust op alle Nederlanders en inwoners van Nederland, die de leeftijd van achttien jaar, maar
      nog niet de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      hebben bereikt, met uitzondering van de Nederlanders, woonachtig in Aruba, Curaçao, Sint Maarten of in de openbare
      lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '22.2'
    text: 'Van burgerdienstplicht vrijgesteld zijn:'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel22
  - number: 22.2.a
    text: |-
      degenen, die krachtens [artikel 13, eerste lid][ref1], onmisbaar verklaard zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel13
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: 22.2.b
    text: |-
      degenen, die ingevolge een overeenkomst met een andere mogendheid of met een volkenrechtelijke organisatie niet tot
      burgerdienstplicht gehouden zijn;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel22
  - number: 22.2.c
    text: |-
      de personen, behorende tot bij algemene maatregel van bestuur daartoe aangewezen categorieën of krachtens zodanige
      maatregel daartoe aangewezen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel22
  - number: '23.1'
    text: 'Het Hoofd Arbeidsvoorziening kan een burgerdienstplichtige bestemmen voor:'
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: 23.1.a
    text: bij zijn beschikking aangewezen arbeid in loondienst;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: 23.1.b
    text: een tegen het genot van een toelage te volgen scholing, bij zijn beschikking aangewezen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: '23.2'
    text: |-
      Bij toepassing van het eerste lid houdt het Hoofd Arbeidsvoorziening voor zover mogelijk rekening met het beroep,
      de geschiktheid en de redelijke wensen van de burgerdienstplichtige.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: '23.3'
    text: |-
      Het Hoofd Arbeidsvoorziening kan de bestemming te allen tijde, hetzij ambtshalve, hetzij op verzoek van de
      burgerdienstplichtige, intrekken.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: '23.4'
    text: |-
      De burgerdienstplichtige is verplicht van zijn bestemming en van de intrekking van zijn bestemming binnen driemaal
      vierentwintig uur mededeling te doen aan degene, die ten tijde van de bestemming, onderscheidenlijk de intrekking,
      zijn werkgever is.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel23
  - number: '24.1'
    text: |-
      Het Hoofd Arbeidsvoorziening kan een burgerdienstplichtige oproepen tot het verrichten van werkzaamheden
      overeenkomstig diens bestemming.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel24
  - number: '24.2'
    text: |-
      Een beschikking krachtens het eerste lid bevat een aanwijzing van de natuurlijke of rechtspersoon, in wiens
      dienst de arbeid moet worden verricht of bij wie de scholing moet worden gevolgd, alsmede van de plaats en tijd
      van aanvang der werkzaamheden. Zo mogelijk vermeldt zij voorts de waarschijnlijke beloning of toelage en de
      waarschijnlijke duur van de uit de oproeping voortvloeiende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel24
  - number: '24.3'
    text: |-
      De burgerdienstplichtige kan niet worden verplicht tot het verrichten van werkzaamheden op plaatsen buiten
      Nederland.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel24
  - number: '24.4'
    text: |-
      Van een krachtens het eerste lid tot de burgerdienstplichtige gerichte beschikking wordt mededeling gedaan aan de
      overeenkomstig het tweede lid aangewezen persoon.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel24
  - number: '24.5'
    text: |-
      De burgerdienstplichtige is verplicht van de oproeping binnen driemaal vierentwintig uur mededeling te doen aan
      degene, die ten tijde van de oproeping zijn werkgever is.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel24
  - number: '25.1'
    text: |-
      De opgeroepen burgerdienstplichtige is verplicht te verschijnen ter plaatse en ten tijde, overeenkomstig
      [artikel 24, tweede lid][ref1], aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '25.2'
    text: |-
      De overeenkomstig [artikel 24, tweede lid][ref1], aangewezen persoon is verplicht onverwijld aan het Hoofd
      Arbeidsvoorziening mede te delen, of de opgeroepene al dan niet is verschenen overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '25.3'
    text: |-
      De opgeroepen burgerdienstplichtige, die niet is verschenen overeenkomstig het eerste lid, is verplicht ter
      plaatse, overeenkomstig [artikel 24, tweede lid][ref1], aangewezen, alsnog zodra mogelijk te verschijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '26.1'
    text: |-
      De overeenkomstig [artikel 24, tweede lid][ref1], aangewezen persoon is verplicht de burgerdienstplichtige voor
      zover mogelijk de werkzaamheden te laten verrichten, waarvoor deze is opgeroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '26.2'
    text: |-
      De burgerdienstplichtige is verplicht de werkzaamheden, die hem door de overeenkomstig
      [artikel 24, tweede lid][ref1], aangewezen persoon zijn opgedragen, te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '27.1'
    text: |-
      Te rekenen van de dag, waarop een voor arbeid in loondienst opgeroepen burgerdienstplichtige aan zijn
      verschijningsplicht overeenkomstig [artikel 25, eerste of derde lid][ref1], heeft voldaan, bestaat tussen hem en
      degene, in wiens dienst de arbeid moet worden verricht, een rechtsbetrekking, die voor de toepassing van wettelijke
      voorschriften geacht wordt een rechtsbetrekking uit arbeidsovereenkomst te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel25
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '25'
        hoofdstuk: II
        paragraaf: '4'
  - number: '27.2'
    text: |-
      De inhoud van de rechtsbetrekking is zoveel mogelijk gelijk aan de wettelijk geoorloofde inhoud van
      rechtsbetrekkingen uit arbeidsovereenkomsten voor soortgelijke arbeid bij de betrokken onderneming of instelling
      of, bij ontbreken van zodanige arbeidsovereenkomsten, aan de wettelijk geoorloofde inhoud van rechtsbetrekkingen
      uit arbeidsovereenkomsten voor soortgelijke arbeid bij vergelijkbare ondernemingen of instellingen. Bij of
      krachtens algemene maatregel van bestuur kunnen daaromtrent nadere regelen worden gesteld. Partijen bij de
      rechtsbetrekking zijn bevoegd gezamenlijk haar inhoud nader vast te stellen. Op verzoek van de meest gerede partij
      geschiedt de nadere vaststelling door het Hoofd Arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel27
  - number: '27.3'
    text: |-
      De rechtsbetrekking kan door partijen niet worden beëindigd. Zij neemt van rechtswege een einde, zodra
      [artikel 31, eerste lid][ref1], ten aanzien van de burgerdienstplichtige is toegepast of de betrokkene heeft
      opgehouden burgerdienstplichtig te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel31
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '31'
        hoofdstuk: II
        paragraaf: '4'
  - number: '27.4'
    text: |-
      Regelen, gesteld krachtens een algemene maatregel van bestuur op grond van het tweede lid, worden ter openbare
      kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel27
  - number: '28.1'
    text: |-
      Te rekenen van de dag, waarop een voor scholing opgeroepen burgerdienstplichtige aan zijn verschijningsplicht
      overeenkomstig [artikel 25, eerste of derde lid][ref1], heeft voldaan, bestaat tussen hem en degene, bij wie de
      scholing moet worden gevolgd, een rechtsbetrekking als uit een overeenkomst waarbij partijen zich jegens elkaar
      verbinden enerzijds een scholing te volgen en anderzijds die scholing te geven met betaling van een toelage.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel25
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '25'
        hoofdstuk: II
        paragraaf: '4'
  - number: '28.2'
    text: |-
      Omtrent de inhoud van rechtsbetrekkingen als in het eerste lid bedoeld worden bij of krachtens algemene maatregel
      van bestuur regelen gesteld. Het Hoofd Arbeidsvoorziening kan in afzonderlijke gevallen de inhoud van de
      rechtsbetrekking nader vaststellen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel28
  - number: '28.3'
    text: |-
      Onze Minister kan, met inachtneming van de bij algemene maatregel van bestuur daaromtrent gestelde regelen, aan
      degene, bij wie de scholing moet worden gevolgd, een vergoeding ten laste van de Staat toekennen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel28
  - number: '28.4'
    text: |-
      [Artikel 27, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel27
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '27'
        hoofdstuk: II
        paragraaf: '4'
  - number: '28.5'
    text: |-
      Regelen, gesteld krachtens een algemene maatregel van bestuur op grond van het tweede lid, worden ter openbare
      kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel28
  - number: '29.1'
    text: |-
      Zolang een opgeroepen burgerdienstplichtige door het voldoen aan de ingevolge de oproeping op hem rustende
      verplichtingen verhinderd is te voldoen aan de verplichtingen, welke op hem als werknemer in een bestaande
      arbeidsverhouding rusten, is deze arbeidsverhouding geschorst, doch kan zij door partijen niet worden beëindigd
      zonder vergunning van het Hoofd Arbeidsvoorziening.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel29
  - number: '29.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de gevolgen van de schorsing voor de
      rechten en verplichtingen uit zodanige arbeidsverhouding.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel29
  - number: '29.3'
    text: |-
      Een vergunning als in het eerste lid bedoeld kan onder beperkingen worden verleend. Aan zodanige vergunning kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel29
  - number: '29.4'
    text: |-
      [Artikel 8][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel8
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '30.1'
    text: |-
      Aan een opgeroepen burgerdienstplichtige, die een persoon is als in [artikel 9][ref1] bedoeld, wordt voor de tijd,
      gedurende welke hij door het voldoen aan de ingevolge de oproeping op hem rustende verplichtingen verhinderd is
      zijn bestaande dienstbetrekking te vervullen, in die betrekking verlof verleend. Bij algemene maatregel van bestuur
      worden hieromtrent nadere regelen gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel9
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '9'
        hoofdstuk: II
        paragraaf: '1'
  - number: '30.2'
    text: |-
      [Artikel 19, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel19
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
  - number: '31.1'
    text: |-
      Het Hoofd Arbeidsvoorziening kan een opgeroepen burgerdienstplichtige van de ingevolge de oproeping op hem
      rustende verplichtingen te allen tijde, hetzij ambtshalve, hetzij op verzoek van de burgerdienstplichtige of van de
      overeenkomstig [artikel 24, tweede lid][ref1], aangewezen persoon, ontslaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '31.2'
    text: |-
      Van een krachtens het eerste lid tot de burgerdienstplichtige gerichte beschikking wordt mededeling gedaan aan de
      overeenkomstig [artikel 24, tweede lid][ref1], aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '31.3'
    text: |-
      De burgerdienstplichtige is verplicht van de intrekking van de oproeping binnen driemaal vierentwintig uur
      mededeling te doen aan de in [artikel 24, vijfde lid][ref1], bedoelde persoon, zo deze nog zijn werkgever is.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '32.1'
    text: |-
      Onze Minister kan bepalen, dat het burgerdienstplichtigen verboden is het land te verlaten zonder door hem
      verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel32
  - number: '32.2'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel32
  - number: '32.3'
    text: |-
      Een krachtens het eerste lid gesteld verbod geldt mede voor degenen, die op grond van
      [artikel 22, tweede lid, onder ][ref1], van burgerdienstplicht vrijgesteld zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel22
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '22'
        hoofdstuk: II
        paragraaf: '4'
  - number: '32.4'
    text: Een besluit omtrent het in het eerste lid bedoelde verbod wordt ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister kan in bij algemene maatregel van bestuur daartoe aangewezen gevallen met inachtneming van de bij
      zodanige maatregel gestelde regelen aan een burgerdienstplichtige de verplichting opleggen tot huisvesting in een
      bij zijn beschikking aangewezen verblijfplaats.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel33
  - number: '33.2'
    text: |-
      Binnen drie maanden na het in werking treden van een algemene maatregel van bestuur als in het eerste lid bedoeld
      doen Wij een voorstel van wet aan de Staten-Generaal tot vervanging daarvan. De vervanging geschiedt in de vorm van
      vaststelling van de regeling, al dan niet gewijzigd, bij de wet. Wordt het voorstel ingetrokken of verworpen, dan
      vervallen de algemene maatregel van bestuur en de krachtens deze genomen maatregelen met ingang van de veertiende
      dag na die, waarop de intrekking of verwerping heeft plaats gehad.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel33
  - number: '33.3'
    text: Onze Minister kan regelen stellen omtrent de orde in de verblijfplaatsen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel33
  - number: '33.4'
    text: Een krachtens het derde lid vastgestelde besluit wordt ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel33
  - number: '34.1'
    text: |-
      Onze Minister kan ten aanzien van ondernemingen, die behoren tot bij zijn beschikking aangewezen categorieën dan
      wel bij zijn beschikking afzonderlijk zijn aangewezen, vrijstelling onderscheidenlijk ontheffing verlenen van
      verplichtingen en verboden, gesteld bij of krachtens wettelijke voorschriften ter zake van de beperking van de
      arbeidsduur en van de veiligheid en de hygiëne bij de arbeid.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel34
  - number: '34.2'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan ten aanzien van ondernemingen die
      behoren tot bij zijn beschikking aangewezen categorieën dan wel bij zijn beschikking afzonderlijk zijn aangewezen,
      vrijstelling onderscheidenlijk ontheffing verlenen van verplichtingen en verboden, gesteld bij of krachtens
      wettelijke voorschriften ter zake van het tegengaan van gevaar, schade en hinder, teweeggebracht door inrichtingen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel34
  - number: '34.3'
    text: |-
      Een vrijstelling of ontheffing kan onder beperkingen, alsmede voorwaardelijk worden verleend; zij kan te allen
      tijde worden ingetrokken. Indien een vrijstelling of ontheffing voorwaardelijk is verleend, geldt zij slechts voor
      zover de gestelde voorwaarden worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel34
  - number: '34.4'
    text: Een krachtens het eerste lid vastgesteld besluit omtrent vrijstelling wordt ter openbare kennis gebracht.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel34
  - number: '36'
    text: |-
      In afwijking van [artikel 6:4, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt een bezwaarschrift tegen
      een besluit van Onze Minister of Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer ingediend
      bij het Hoofd Arbeidsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '38.1'
    text: |-
      Op een ingekomen bezwaarschrift, gericht tegen een beschikking van het Hoofd Arbeidsvoorziening, neemt deze, zo hij
      terstond de aangevoerde bezwaren gegrond acht, zo spoedig mogelijk een beslissing.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel38
  - number: '38.2'
    text: |-
      Indien het Hoofd Arbeidsvoorziening niet terstond de aangevoerde bezwaren gegrond acht, brengt hij het
      bezwaarschrift onverwijld ter kennis van de in [artikel 4, tweede lid][ref1], bedoelde commissie. Deze brengt zo
      spoedig mogelijk advies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel4
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '4'
        hoofdstuk: I
  - number: '38.3'
    text: |-
      Indien het Hoofd Arbeidsvoorziening zich met het door de commissie uitgebrachte advies kan verenigen, neemt hij zo
      spoedig mogelijk dienovereenkomstig een beslissing.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel38
  - number: '38.4'
    text: |-
      Indien het Hoofd Arbeidsvoorziening zich met het door de commissie uitgebrachte advies niet kan verenigen, doet hij
      het bezwaarschrift, tezamen met dat advies en zijn oordeel ter zake, onverwijld aan Onze Minister toekomen. Onze
      Minister neemt zo spoedig mogelijk een beslissing.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel38
  - number: '39'
    text: |-
      Een bezwaarschrift, gericht tegen een beschikking van Onze Minister of Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, wordt door het Hoofd Arbeidsvoorziening onverwijld ter kennis van de in
      [artikel 4, tweede lid][ref1], bedoelde commissie gebracht. Deze brengt zo spoedig mogelijk advies uit.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel4
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '4'
        hoofdstuk: I
  - number: '41.1'
    text: |-
      Een door Onze Minister of Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer genomen
      beslissing wordt aan het Hoofd Arbeidsvoorziening medegedeeld.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel41
  - number: '41.2'
    text: |-
      Voordat een advies als bedoeld in [artikel 38, tweede lid][ref1], of [39][ref2] wordt uitgebracht, hoort de in
      [artikel 4, tweede lid][ref3], bedoelde commissie zo mogelijk de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002759#Artikel4
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '38'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '39'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002759
        artikel: '4'
        hoofdstuk: I
  - number: '42'
    text: |-
      Het Hoofd Arbeidsvoorziening is bevoegd personen op te roepen om voor hem of voor door hem daarbij aangewezen
      personen te verschijnen:
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel42
  - number: 42.a
    text: |-
      tot het geven van inlichtingen, die naar zijn redelijk oordeel in het belang van de uitvoering van deze wet nodig
      zijn;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel42
  - number: 42.b
    text: |-
      tot het overleggen van bescheiden, waarvan raadpleging naar zijn redelijk oordeel in het belang van de uitvoering
      van deze wet nodig is;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel42
  - number: 42.c
    text: |-
      voor zover het personen betreft, die de leeftijd van achttien jaar, maar nog niet de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], hebben bereikt: tot het ondergaan van een
      onderzoek naar hun geschiktheid voor het verrichten van werkzaamheden ingevolge [hoofdstuk II, paragraaf 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '4'
  - number: '43.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren. Zij zijn tevens belast met het inwinnen van gegevens in het belang van de
      uitvoering van deze wet. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door plaatsing in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel43
  - number: '43.2'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden zonder
      toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel43
  - number: '44.1'
    text: |-
      Ieder, die krachtens [artikel 42][ref1] is opgeroepen, is verplicht ter plaatse en ten tijde, bij de oproeping
      aangewezen, te verschijnen en desverlangd de in dat artikel, onder *a*-*c*, bedoelde medewerking te verlenen. De
      verstrekking van de in dat artikel bedoelde inlichtingen dient volledig en naar waarheid te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel42
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '42'
        hoofdstuk: IV
  - number: '44.2'
    text: |-
      Het Hoofd Arbeidsvoorziening is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      [artikel 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel42
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '42'
        hoofdstuk: IV
  - number: '47.1'
    text: |-
      Indien door een besluit als bedoeld in [artikel 2, derde en vierde lid][ref1], van
      deze wet dan wel bij een besluit als bedoeld in de [artikelen 7, tweede lid][ref2], en
      [8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref3], de werking van [paragraaf 1][ref4]
      of [2 van hoofdstuk II][ref5] wordt beëindigd, kan bij dat besluit worden bepaald, dat ten aanzien van de
      arbeidsverhoudingen, waarvoor krachtens die paragraaf maatregelen van kracht zijn, het bij en krachtens die
      paragraaf bepaalde gedurende een bij dat besluit vast te stellen tijd van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
      [ref5]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.2'
    text: |-
      Indien door een besluit, als bedoeld in [artikel 2, derde en vierde lid][ref1], van
      deze wet dan wel bij een besluit als bedoeld in de [artikelen 7, tweede lid][ref2], en
      [8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref3], de werking van [paragraaf 3][ref4] of
      [4 van hoofdstuk II][ref5] wordt beëindigd, kan bij dat besluit worden bepaald, dat ten aanzien van degenen die op
      grond van die paragraaf tot onmisbaar werknemer zijn verklaard, onderscheidenlijk een krachtens [artikel 24][ref6]
      opgeroepen burgerdienstplichtige zijn, het bij en krachtens die paragraaf bepaalde gedurende een bij dat besluit
      vast te stellen tijd van toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
      [ref5]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
      [ref6]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '47.3'
    text: |-
      Indien door een besluit als bedoeld in [artikel 2, derde en vierde lid][ref1], van deze wet dan wel bij een besluit
      als bedoeld in de [artikelen 7, tweede lid, en 8, tweede lid, van de Coördinatiewet uitzonderingstoestanden][ref2],
      de werking van paragraaf 5 van hoofdstuk II wordt beëindigd, kan bij dat besluit met betrekking tot, op grond
      van die paragraaf verleende, van kracht zijnde vrijstellingen en ontheffingen worden bepaald, dat deze te hunnen
      aanzien gedurende een bij dat besluit vast te stellen tijd van toepassing blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel7
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '7'
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent voorzieningen bij ziekte, ongeval,
      invaliditeit en overlijden, verband houdende met het volgen van een scholing op grond van een oproeping krachtens
      [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel24
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
  - number: '49'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel49
  - number: '50.1'
    text: |-
      Het bij of krachtens deze wet bepaalde is, voor zover het betrekking heeft op werknemers of op
      burgerdienstplichtigen, niet van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: 50.1.a
    text: |-
      de leden van de Hoge Colleges van Staat, Onze Ministers, de Staatssecretarissen en de leden van de rechterlijke
      macht met rechtspraak belast;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: 50.1.b
    text: de leden van provinciale staten en van gemeenteraden;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: 50.1.c
    text: degenen, die in werkelijke militaire dienst zijn of in militaire dienst opgeroepen zijn;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: 50.1.d
    text: |-
      degenen die onder verantwoordelijkheid van het met betrekking tot de bestrijding van rampen en zware
      ongevallen bevoegd gezag, hetzij in het verband van de organisatie waarbij zij zijn aangesteld,
      hetzij op verzoek of op bevel van dat bevoegd gezag, in buitengewone omstandigheden als bedoeld in
      [paragraaf 12 van de Wet veiligheidsregio’s][ref1] dienen deel te nemen aan het bestrijden van een ramp of een
      zwaar ongeval als bedoeld in [artikel 1 van genoemde wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Paragraaf12
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel1
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0027466
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0027466
        artikel: '1'
  - number: 50.1.e
    text: bekleders van een geestelijk ambt of diegenen die een opleiding tot een dergelijk ambt volgen;
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: 50.1.f
    text: degenen, die bij algemene maatregel van bestuur daartoe aangewezen openbare ambten bekleden.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: '50.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld ter nadere bepaling van de in het eerste
      lid, onder *e*, bedoelde categorie van personen.
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel50
  - number: '51'
    text: |-
      Degenen, die werkzaamheden moeten verrichten ingevolge een vordering op grond van
      [artikel 24 van de Inkwartieringswet][ref1] (*Stb.* 1953, 305), een opdracht op grond van
      [artikel 61 van de Luchtvaartwet][ref2] (*Stb.* 1958, 47), dan wel een oproeping op grond van
      [artikel 29 van de Oorlogswet voor Nederland][ref3] (*Stb.* 1964, 337) of artikel 1, onder 6°, van de
      Bevoegdhedenwet (*Stb.* 1902, 54), zijn, zolang bedoelde verplichting duurt, van de verplichtingen, welke ingevolge
      het bij of krachtens deze wet bepaalde op hen rusten, ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002111#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0007983#Artikel29
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002111
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '61'
      - id: ref3
        bwb_id: BWBR0007983
        artikel: '29'
  - number: '52'
    text: |-
      Zolang [paragraaf 3][ref1] of [4 van hoofdstuk II][ref2] in werking is, geschieden de oproepingen krachtens artikel
      1, onder 6°, van de Bevoegdhedenwet zo mogelijk na overleg met het Hoofd Arbeidsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002759#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002759
        hoofdstuk: II
        paragraaf: '4'
  - number: '53'
    text: |-
      Een gedraging die in strijd is met het bij of krachtens [artikel 11, derde lid][ref1], [23, vierde lid][ref2],
      [24, vijfde lid][ref3], [25, tweede lid][ref4], [31, derde lid][ref5], [33, eerste of derde lid][ref6], bepaalde,
      alsmede een gedraging die in strijd is met het krachtens [artikel 49][ref7] bepaalde, voor zover zij daarbij is
      aangeduid als strafbaar feit, wordt gestraft met hechtenis van ten hoogste één maand of geldboete van de tweede
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002759#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002759#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002759#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0002759#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0002759#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002759#Artikel33
      [ref7]: https://wetten.overheid.nl/BWBR0002759#Artikel49
    url: https://wetten.overheid.nl/BWBR0002759/2014-01-06#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002759
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002759
        artikel: '23'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0002759
        artikel: '24'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0002759
        artikel: '25'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002759
        artikel: '31'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002759
        artikel: '33'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0002759
        artikel: '49'
        hoofdstuk: V
  - number: '54'
    text: |-
      Een gedraging die in strijd is met het bij of krachtens [artikel 7, eerste of tweede lid][ref1],
      [10, eerste of tweede lid][ref2], [11, eerste lid][ref3], [14, eerste lid][ref4], [15, eerste of tweede lid][ref5],
      [25, eerste of derde lid][ref6], [26, eerste of tweede lid][ref7], of [32, eerste of tweede lid][ref8], bepaalde,
      alsmede een gedraging die in strijd is met het krachtens [artikel 9, tweede lid][ref9], [12, tweede lid][ref10],
      of [21, tweede lid][ref11], bepaalde, voor zover zij daarbij is aangeduid als strafbaar feit, wordt gestraft met
      hechtenis van ten hoogste drie maanden of geldboete van de derde categorie.


