        bwb_id: BWBR0004770
        artikel: '59'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '62'
  - number: 126a.1.b
    text: regels worden gesteld die overeenkomen met die in de in onderdeel *a* genoemde artikelen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel126a
  - number: 126a.2
    text: |-
      De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede van de belasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel126a
  - number: '127.1'
    text: |-
      Het uitnodigen tot het doen van aangifte, bedoeld in [artikel 6 van de Algemene wet][ref1], geschiedt door het
      uitreiken van een aangiftebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '6'
  - number: '127.2'
    text: |-
      Het doen van aangifte, bedoeld in [artikel 8 van de Algemene wet][ref1], geschiedt door het inleveren of toezenden
      van het uitgereikte aangiftebiljet met de daarbij gevraagde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '8'
  - number: '127.3'
    text: |-
      In afwijking in zoverre van de vorige leden kan de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde
      ambtenaar van het waterschap vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een
      verzoek om uitreiking van een aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 127.3.a
    text: |-
      worden de door de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap gevraagde
      bescheiden overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 127.3.b
    text: |-
      kan de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap vorderen dat een van
      de mondelinge aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte geacht
      wordt niet te zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '127.4'
    text: |-
      Indien het derde lid toepassing vindt, kan de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar
      van het waterschap voor de termijnen, genoemd in [artikel 9, eerste en derde lid, eerste volzin][ref2],
      [artikel 10, tweede lid][ref3], en [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref4] of voor de
      kortere termijn, bedoeld in [artikel 128, eerste of tweede lid][ref5], kortere termijnen in de plaats stellen en is
      [artikel 12 van de Algemene wet][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel128
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel12
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0005108
        artikel: '128'
        hoofdstuk: XVIII
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '12'
  - number: '127.5'
    text: Bij de belastingverordening kan van het eerste en tweede lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel127
  - number: '128.1'
    text: |-
      Met betrekking tot de bij wege van aanslag geheven waterschapsbelastingen kan in de belastingverordening voor de in
      [artikel 9, eerste en derde lid, van de Algemene wet][ref1] genoemde termijn van ten minste een maand een kortere
      termijn in de plaats worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: '128.2'
    text: |-
      Met betrekking tot de bij wege van voldoening op aangifte geheven waterschapsbelastingen kan in de
      belastingverordening voor de termijn van een maand, genoemd in [artikel 10, tweede lid][ref1], en
      [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref2], een kortere termijn in de plaats worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '19'
  - number: 128a.1
    text: |-
      De besluiten, bedoeld in [artikel 18, vierde lid, onderdeel a][ref1], en
      [20, vierde lid, van de Wet verontreiniging oppervlaktewateren][ref2], worden voor de in
      [artikel 18, eerste lid, van die wet][ref3], bedoelde waterschapsbelasting, genomen door de in
      [artikel 123, derde lid, onderdeel b][ref4], bedoelde ambtenaar van het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 128a.2
    text: |-
      Een ambtenaar als bedoeld in [artikel 123, derde lid, onderdeel d][ref1], is voor zover dit voor de heffing van
      de in [artikel 18, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref2], bedoelde waterschapsbelasting
      redelijkerwijs nodig is, bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel18
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '18'
  - number: 128a.2.a
    text: |-
      elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering van
      een woonruimte zonder toestemming van de gebruiker of de gebruikers te betreden;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128a
  - number: 128a.2.b
    text: |-
      monsters te nemen van het afvalwater dat wordt afgevoerd in de zin van
      [artikel 17, onderdeel i, van de Wet verontreiniging oppervlaktewateren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel17
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel128a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '17'
  - number: '129.1'
    text: |-
      De in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap is bevoegd voor eenzelfde
      belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op verschillende
      belastingen, op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '129.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel129
  - number: '131'
    text: |-
      Indien bezwaar wordt gemaakt zowel tegen een belastingaanslag in de omslag ter zake van een gebouwde of ongebouwde
      onroerende zaak als tegen een op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] gegeven
      beschikking welke ten grondslag heeft gelegen aan die belastingaanslag, vangt, ingeval feiten en omstandigheden
      in het geding zijn die van belang zijn zowel voor de heffing van de omslag ter zake van een gebouwde of ongebouwde
      onroerende zaak als voor de vaststelling van de waarde op de voet van genoemd [hoofdstuk IV][ref2], de termijn
      waarbinnen de in [artikel 123, derde lid, onderdeel b,][ref3] bedoelde ambtenaar van het waterschap uitspraak doet
      op het eerstbedoelde bezwaar aan, in afwijking in zoverre van [artikel 25, eerste lid, van de Algemene wet][ref4],
      op het tijdstip waarop de op de voet van genoemd [hoofdstuk IV][ref5] gegeven beschikking onherroepelijk is komen
      vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '25'
      - id: ref5
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '132.1'
    text: |-
      Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven en
      op dat tijdstip nog geen aanslagbiljet is uitgereikt of ter post is bezorgd, binnen zes weken na de dagtekening van
      het aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen
      bij de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '132.2'
    text: Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel132
  - number: '132.3'
    text: |-
      De in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap beslist op de aanvraag bij
      voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '133'
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Ministers van Verkeer en Waterstaat en van
      Financiën, het internationale gebruik daartoe noodzaakt, wordt vrijstelling van waterschapsbelastingen verleend.
      Onze genoemde Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel133
  - number: '134'
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf kan door de in
      [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap ook een in die verordening
      voorziene vrijstelling ambtshalve worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '136'
    text: |-
      Op overtreding van een in de belastingverordening voorkomende bepaling betreffende heffing en invordering kan,
      voor zover die overtreding is aangemerkt als strafbaar feit, uitsluitend een geldboete worden gesteld en wel een
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel136
  - number: '138.1'
    text: |-
      Bij de invordering van waterschapsbelastingen blijven van de [Invorderingswet 1990][ref1] buiten toepassing
      de [artikelen 5][ref2], [20][ref3], [21][ref4], [59][ref5], [62][ref6] en [69][ref7]. Bij de invordering van
      waterschapsbelastingen die niet bij wege van aanslag of bij wege van voldoening op aangifte worden geheven, blijven
      bovendien buiten toepassing de [artikelen 7, derde lid][ref8], en [8, eerste lid, van die wet][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel69
      [ref8]: https://wetten.overheid.nl/BWBR0004770#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0004770#Artikel8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '5'
