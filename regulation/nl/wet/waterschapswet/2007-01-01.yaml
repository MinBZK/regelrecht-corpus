      - id: ref9
        bwb_id: BWBR0004770
        artikel: '8'
  - number: '138.2'
    text: |-
      Met betrekking tot waterschapsbelastingen die niet bij wege van aanslag of bij wege van voldoening op aangifte
      worden geheven, kan in de belastingverordening worden bepaald dat een andere ambtenaar van het waterschap dan
      de met de invordering van waterschapsbelastingen belaste ambtenaar van het waterschap mede wordt belast met de
      invordering van die belastingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel138
  - number: '138.3'
    text: |-
      Voor waterschapsbelastingen ter zake van onroerende zaken, voor zover deze worden geheven van de eigenaar of van
      de genothebbende krachtens een beperkt recht, heeft het waterschap een voorrecht op de onroerende zaken waarop de
      aanslag in een zodanige belasting betrekking heeft, en op de beperkte rechten waaraan die zaken zijn onderworpen.
      Het voorrecht gaat boven hypotheek en boven alle andere voorrechten, met uitzondering van het voorrecht van
      [artikel 288 onder a][ref1], alsmede dat van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref2], voor zover
      de daar bedoelde kosten na de vaststelling van de aanslag zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel288
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel284
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel138
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '288'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '284'
  - number: '139.1'
    text: |-
      De belastingverordening kan van [artikel 9 van de Invorderingswet 1990][ref1] afwijkende voorschriften inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '9'
  - number: '139.2'
    text: |-
      De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel139
  - number: '141'
    text: |-
      De verrekening van aan de belastingschuldige uit te betalen en van hem te innen bedragen ter zake van
      waterschapsbelastingen op de voet van [artikel 24 van de Invorderingswet 1990][ref1] is ook mogelijk
      ingeval de in [artikel 9 van de Invorderingswet 1990][ref2] gestelde termijn, dan wel de krachtens
      [artikel 139, eerste lid][ref3], gestelde termijn nog niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel139
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '139'
        hoofdstuk: XVIII
  - number: '142.1'
    text: |-
      Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel142
  - number: '142.2'
    text: |-
      Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de met
      de invordering van waterschapsbelastingen belaste ambtenaar van het waterschap de belastingaanslag op de gehele
      onroerende zaak verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de
      rechten van de overige belastingplichtigen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel142
  - number: '142.3'
    text: |-
      De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt met
      zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel142
  - number: '142.4'
    text: |-
      Tegen een met toepassing van het eerste lid vastgestelde belastingaanslag kan mede beroep bij de
      rechtbank worden ingesteld door de belastingplichtige wiens naam niet op het aanslagbiljet staat vermeld.
      [Artikel 26a, derde lid, van de Algemene wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 26a
  - number: '142.5'
    text: Van het derde lid kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel142
  - number: '143'
    text: |-
      Voor de toepassing van [artikel 66 van de Invorderingswet 1990][ref1] met betrekking tot waterschapsbelastingen
      blijven de [artikelen 76][ref2], [80, tweede, derde en vierde lid][ref3], [82][ref4], [84][ref5], [86][ref6] en
      [87 van de Algemene wet][ref7] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '84'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: '86'
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '87'
  - number: '144.1'
    text: |-
      De in [artikel 26 van de Invorderingswet 1990][ref1] bedoelde kwijtschelding wordt met betrekking tot
      waterschapsbelastingen verleend door de in [artikel 123, derde lid, onderdeel c][ref2], bedoelde ambtenaar van
      het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '144.2'
    text: |-
      Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens
      [artikel 26 van de Invorderingswet 1990][ref1] door Onze Minister van Financiën bij ministeriële regeling gestelde
      regels van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel144
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '26'
  - number: '144.3'
    text: |-
      Het algemeen bestuur kan bepalen dat, in afwijking van de in het tweede lid bedoelde regels, in het geheel geen dan
      wel gedeeltelijk kwijtschelding wordt verleend.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel144
  - number: '144.4'
    text: |-
      Met inachtneming van door Onze Minister van Verkeer en Waterstaat, in overeenstemming met Onze Minister van
      Financiën, te stellen regels kan het algemeen bestuur met betrekking tot de wijze waarop de kosten van bestaan
      in aanmerking worden genomen afwijkende regels stellen die er toe leiden dat in ruimere mate kwijtschelding wordt
      verleend.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel144
  - number: '144.5'
    text: |-
      Het dagelijks bestuur kan de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit
      ontheft de ambtenaar van het waterschap, belast met de invordering van waterschapsbelastingen van de verplichting
      verdere pogingen tot invordering te doen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel144
  - number: '145'
    text: |-
      Indien inzake een waterschapsbelasting exploot moet worden gedaan, een akte van vervolging betekend of een
      dwangbevel ten uitvoer gelegd in het gebied van een ander waterschap dan dat waaraan de belasting verschuldigd
      is, is daartoe naast de belastingdeurwaarder van laatstbedoeld waterschap mede de belastingdeurwaarder van het
      eerstbedoelde waterschap bevoegd en desgevraagd verplicht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel145
  - number: '146'
    text: |-
      De eigenaar of degene, die krachtens een ander beperkt recht het genot heeft van in het gebied van een waterschap
      gelegen onroerende zaak en die binnen Nederland geen bekende woon- of verblijfplaats heeft, is verplicht aan het
      dagelijks bestuur van dat waterschap een adres binnen Nederland op te geven, waar de voor hem bestemde stukken
      betreffende waterschapsbelastingen of betreffende de in [artikel 67][ref1] bedoelde kosten van bestuursdwang worden
      bezorgd of betekend. Indien hij hiermede in gebreke blijft, geschiedt de betekening van een dwangbevel aan de
      persoon of in het parket van de ambtenaar van het openbaar ministerie bij de rechtbank binnen welker rechtsgebied
      de onroerende zaak geheel of gedeeltelijk ligt. De deurwaarder of de belastingdeurwaarder zendt, zo mogelijk, een
      tweede afschrift onverwijld per aangetekende brief aan de woonplaats of het werkelijk verblijf van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel67
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '67'
        hoofdstuk: IX
        paragraaf: '4'
  - number: '147'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het kader van dit hoofdstuk passende nadere regelen worden gesteld ter
      aanvulling van de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel147
  - number: '148'
    text: |-
      Buiten de bij de wet aangewezen besluiten, zijn, voorzover zulks bij reglement is bepaald, aan de goedkeuring
      van gedeputeerde staten slechts onderworpen de besluiten van het waterschapsbestuur die betrekking hebben
      op de regeling van de waterbeheersing en de beslissingen van dat bestuur tot de aanleg en verbetering van
      waterstaatswerken door het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel148
  - number: '149'
    text: De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel149
  - number: '151.1'
    text: |-
      In afwijking van [artikel 8:2, onderdeel ][ref1] kan beroep worden ingesteld tegen een besluit van gedeputeerde
      staten inzake goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '151.2'
    text: |-
      [Artikel 73, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de
      terinzagelegging geschiedt gelijktijdig met de bekendmaking van het besluit, voor de tijd van zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '151.3'
    text: |-
      Het eerste lid is niet van toepassing ten aanzien van het besluit van gedeputeerde staten,
      inhoudende de goedkeuring van een verordening als bedoeld in [artikel 119, eerste lid][ref1], en
      [artikel 120, zevende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel120
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel151
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '119'
        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '120'
        hoofdstuk: XVII
  - number: '153.1'
    text: 'Belanghebbenden kunnen administratief beroep instellen bij gedeputeerde staten enkel tegen:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel153
  - number: 153.1.a
    text: |-
      de in [artikel 148][ref1] bedoelde, niet aan goedkeuring van gedeputeerde staten onderworpen, besluiten omtrent de
      regeling van de waterbeheersing of tot de aanleg of verbetering van waterstaatswerken;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel148
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '148'
        hoofdstuk: XIX
  - number: 153.1.b
    text: |-
      de in [artikel 78, tweede lid][ref1], bedoelde besluiten betreffende de legger;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel78
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '78'
        hoofdstuk: X
  - number: 153.1.c
    text: |-
      de in [artikel 80, eerste lid][ref1], bedoelde besluiten betreffende de vaststelling of wijziging van een keur.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel80
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '80'
        hoofdstuk: X
  - number: '153.2'
    text: |-
      [Artikel 73, tweede en vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat de
      terinzagelegging geschiedt gelijktijdig met de bekendmaking van het besluit, voor de tijd van zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel153
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '155'
    text: |-
      In afwijking van [artikel 8:2, onderdeel a, van de Algemene wet bestuursrecht][ref1] kan beroep worden ingesteld
      tegen een besluit van gedeputeerde staten ingevolge [artikel 153, eerste lid, onderdeel a of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel153
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '153'
        hoofdstuk: XX
  - number: '156.1'
    text: |-
      Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het waterschapsbestuur kan
      door gedeputeerde staten worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel156
  - number: '156.2'
    text: |-
      Ten aanzien van vernietiging van een niet-schriftelijke beslissing gericht op enig rechtsgevolg zijn de
      [afdelingen 10.2.2][ref1] en [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '158.1'
    text: |-
      Indien een besluit naar het oordeel van de voorzitter voor vernietiging in aanmerking komt, doet hij daarvan twee
      dagen nadat het te zijner kennis is gekomen mededeling aan gedeputeerde staten. Hij geeft hiervan tegelijkertijd
      kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat met de uitvoering van het besluit is
      belast.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel158
  - number: '158.2'
    text: |-
      Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van gedeputeerde staten mededeling is ontvangen dat voor schorsing of vernietiging geen redenen bestaan.
      Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de voorzitter is geschorst of
      vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel158
  - number: '161'
    text: |-
      Indien een bekend gemaakt besluit is vernietigd of indien het niet is vernietigd binnen de tijd
      waarvoor het is geschorst, wordt hiervan door het waterschapsbestuur openbaar kennis gegeven.
      [Artikel 73, tweede en vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de
      terinzagelegging geschiedt voor de tijd van vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '162.1'
    text: |-
      In afwijking van [artikel 8:4, onderdeel a, van de Algemene wet bestuursrecht][ref1] kan een belanghebbende
      tegen een besluit van gedeputeerde staten als bedoeld in [artikel 156, eerste lid][ref2], beroep instellen bij de
      Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel156
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '156'
        hoofdstuk: XXI
  - number: '162.2'
    text: |-
      In afwijking van [artikel 6:2 van de Algemene wet bestuursrecht][ref1] kan geen beroep worden ingesteld tegen de
      weigering om de vernietiging te bevorderen en tegen het niet tijdig nemen van een besluit tot vernietiging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '163'
    text: |-
      Het waterschapsbestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het
      besluit tot vernietiging wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel163
  - number: '164.1'
    text: |-
      Een besluit tot het instellen en reglementeren van een waterschap, waarvan het gebied in twee of meer provincies
      is gelegen, bevat een regeling omtrent de uitoefening van het toezicht ingevolge deze Titel hetzij van enige andere
      vorm van toezicht. Wordt bij dat besluit aan de colleges van gedeputeerde staten de gemeenschappelijke uitoefening
      van het toezicht opgedragen, dan worden daarbij tevens regels gesteld omtrent de gemeenschappelijke voorbereiding
      van de ter uitoefening van dat toezicht te nemen besluiten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel164
  - number: '164.2'
    text: |-
      Indien de colleges van gedeputeerde staten niet tot overeenstemming kunnen komen over het te nemen besluit binnen
      de voor de uitoefening van het toezicht geldende termijn, dan wel, indien geen termijn geldt, binnen redelijke
      termijn, delen zij dit schriftelijk mede aan Onze Minister van Verkeer en Waterstaat. In dat geval wordt op de
      voordracht van deze minister, gedaan na overleg met die colleges, het besluit genomen bij koninklijk besluit, de
      Raad van State gehoord. [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '165'
    text: De Keurenwet (*Stb.* 1895, 139) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel165
  - number: '166.1'
    text: De Bevoegdhedenwet waterschappen (*Stb.* 1978, 285) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel166
  - number: '166.2'
    text: |-
      Hoofdstuk IV van de Bevoegdhedenwet waterschappen blijft van toepassing ten aanzien van de belastingjaren waarvoor
      bij of krachtens reglement of andere provinciale verordening dan wel bij belastingverordening van het waterschap
      regels omtrent waterschapsbelastingen gelden waarin naar bepalingen van dat Hoofdstuk wordt verwezen, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel166
  - number: 166.2.a
    text: 'in artikel 13 van dat Hoofdstuk voor "48, 49, 49*a*, 53*a*, 56" wordt gelezen: "48, 52, 53, 54, 55";'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel166
  - number: 166.2.b
    text: 'in artikel 25, eerste lid, van dat Hoofdstuk voor "60" wordt gelezen: "62", en'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel166
  - number: 166.2.c
    text: |-
      met betrekking tot waterschapsbelastingen die worden geheven met toepassing van dat Hoofdstuk, alsmede de
      onderdelen *a* en *b*, bij algemene maatregel van bestuur regels kunnen worden gesteld met overeenkomstige
      toepassing van artikel 126*a*.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel166
  - number: '167.2'
    text: |-
      In afwijking van het eerste lid onder letter *c* zijn de
      [artikelen 19 tot en met 21 van de Waterstaatswet 1900][ref1] van toepassing op besluiten van gedeputeerde staten
      als bedoeld in die artikelen, die zijn genomen vóór de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel19
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '19'
  - number: '167.3'
    text: |-
      In afwijking van het eerste lid onder letter *d* zijn de [artikelen 22-32 van de Waterstaatswet 1900][ref1] van
      toepassing op verzoeken om vernietiging die voor de datum van inwerkingtreding van deze wet zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel22
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '22'
  - number: '168'
    text: |-
      Ten aanzien van de leden van het algemeen bestuur en het dagelijks bestuur die hun functie bekleden op de datum
      van inwerkingtreding van deze wet, zijn tot hun periodieke aftreden de artikelen 31, derde lid en 47 niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel168
  - number: '169.1'
    text: |-
      Op de dag vóór de datum van inwerkingtreding van deze wet geldende besluiten ten aanzien van onderwerpen waarin
      deze wet voorziet, blijven van kracht, ook voorzover zij niet in overeenstemming zijn met bepalingen bij of
      krachtens deze wet. Zij kunnen overeenkomstig deze wet worden gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel169
  - number: '169.2'
    text: |-
      De bepalingen in reglementen of andere provinciale verordeningen, die onderwerpen regelen die ingevolge de
      [artikelen 111][ref1] en [119, eerste lid][ref2], worden geregeld bij verordening van het waterschap, blijven van
      kracht tot de datum van inwerkingtreding van laatstbedoelde verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel119
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '111'
        hoofdstuk: XVI
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '119'
        hoofdstuk: XVII
  - number: 170a
    text: |-
      De [artikelen 149][ref1] en [150][ref2] zijn niet van toepassing op aan voorafgaand toezicht onderworpen besluiten
      die zijn genomen vóór de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel150
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel170a
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '149'
        hoofdstuk: XIX
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '150'
        hoofdstuk: XIX
  - number: '171'
    text: |-
      De reglementen voor de waterschappen en andere provinciale verordeningen die betrekking hebben op de waterschappen
      worden binnen drie jaar na de inwerkingtreding van deze wet met het bij of krachtens deze wet bepaalde in
      overeenstemming gebracht. Bepalingen in die reglementen en verordeningen die niet in overeenstemming zijn met
      bepalingen bij of krachtens deze wet, vervallen na verloop van drie jaar na de inwerkingtreding van deze wet,
      tenzij zij tevoren met het bij of krachtens deze wet bepaalde in overeenstemming zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel171
  - number: '172'
    text: |-
      Op termijnen gesteld in een verordening van het waterschap zijn de
      [artikelen 1 tot en met 4 van de Algemene Termijnenwet][ref1] (*Stb.* 1964, 314) van overeenkomstige toepassing,
      tenzij in het reglement anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel1
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel172
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '1'
  - number: '177'
    text: |-
      Het keizerlijk decreet van 21 oktober 1811, relatif à la classification des routes et des péages qui s'y
      perçoivent, et à d’autres objets de cette nature, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel177
  - number: '179.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de onderscheidene artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel179
  - number: '179.2'
    text: |-
      Voor de bekendmaking van deze wet stelt Onze Minister van Verkeer en Waterstaat de nummering van de artikelen,
      paragrafen, hoofdstukken en titels van deze wet zo nodig opnieuw vast en brengt de in deze wet voorkomende
      aanhalingen van de artikelen, paragrafen, hoofdstukken en titels met de nieuwe nummering in overeenstemming.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel179
  - number: '180'
    text: Deze wet kan worden aangehaald als Waterschapswet.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel180
