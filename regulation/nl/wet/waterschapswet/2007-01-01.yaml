---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: waterschapswet
regulatory_layer: WET
publication_date: '2026-01-22'
valid_from: '2007-01-01'
bwb_id: BWBR0005108
url: https://wetten.overheid.nl/BWBR0005108/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 133 van de Grondwet regels moeten worden gesteld
    volgens welke de opheffing en instelling geschiedt van waterschappen en volgens welke de taken en inrichting van
    waterschappen en de samenstelling van hun besturen worden geregeld;

    dat voorts ingevolge diezelfde grondwetsbepaling de verordenende en andere bevoegdheden van de besturen van
    waterschappen, de openbaarheid van hun vergaderingen, alsmede het toezicht op deze besturen moet worden geregeld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: Waterschappen zijn openbare lichamen welke de waterstaatkundige verzorging van een bepaald gebied ten doel hebben.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel1
  - number: '1.2'
    text: |-
      De taken die tot dat doel aan waterschappen zijn of worden opgedragen betreffen de zorg voor hetzij de waterkering
      hetzij de waterhuishouding hetzij beide. Aan waterschappen, die met tenminste een van zulke taken zijn belast, kan
      daarnaast de zorg voor een of meer andere waterstaatsaangelegenheden zijn of worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel1
  - number: '2.1'
    text: |-
      De bevoegdheid tot het opheffen en het instellen van waterschappen, tot regeling van hun gebied, taken,
      inrichting, samenstelling van hun bestuur en categorieën van omslagplichtigen en tot de verdere reglementering
      van waterschappen behoort aan provinciale staten, behoudens het bepaalde in de [artikelen 7][ref1], [8][ref2] en
      [9][ref3]. De uitoefening van deze bevoegdheid geschiedt bij provinciale verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel9
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '9'
        hoofdstuk: II
  - number: '2.2'
    text: |-
      Voor de uitoefening van de in het eerste lid bedoelde bevoegdheid geldt dat taken, als bedoeld in
      [artikel 1, tweede lid, eerste volzin][ref1], aan waterschappen worden opgedragen, tenzij dit niet verenigbaar is
      met het belang van een goede organisatie van de waterstaatkundige verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel1
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '1'
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Indien naar het oordeel van gedeputeerde staten gronden aanwezig zijn om het opheffen of instellen van een
      waterschap, de vaststelling van een reglement voor een waterschap of een wijziging van een dergelijk reglement te
      overwegen, treden zij voor de bepaling van hun standpunt in overleg met het dagelijks bestuur van het waterschap of
      de waterschappen die het betreft, alvorens zij toepassing geven aan [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '4'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Gedeputeerde staten handelen dienovereenkomstig indien zij hun standpunt moeten bepalen ten aanzien van ofwel een
      soortgelijk voorstel van het algemeen bestuur van een waterschap ofwel een voornemen van Onze Minister van Verkeer
      en Waterstaat ingevolge [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '8'
        hoofdstuk: II
  - number: '4.1'
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 2, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat daaraan toepassing
      wordt gegeven door gedeputeerde staten. Gedeputeerde staten stellen het ontwerp van het besluit op na overleg met
      het dagelijks bestuur van het waterschap of de waterschappen die het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '4.2'
    text: |-
      Gedeputeerde staten voegen bij hun voorstel aan provinciale staten tot vaststelling van het besluit zowel het
      ontwerp-besluit als de naar voren gebrachte zienswijzen, of een samenvatting daarvan, vergezeld van hun standpunt
      inzake die zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Gedeputeerde staten zenden het door provinciale staten vastgestelde besluit, met de in het tweede lid bedoelde
      stukken, binnen vier weken aan Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een besluit van provinciale staten tot het opheffen of instellen van een waterschap dan wel tot vaststelling of
      wijziging van het reglement voor een waterschap behoeft de goedkeuring van Onze Minister van Verkeer en Waterstaat.
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het in het eerste lid omschreven goedkeuringsvereiste voor een besluit tot vaststelling of wijziging van het
      reglement betreft alleen de regeling bij dat besluit van de taak en het gebied van het waterschap, van de
      samenstelling van zijn bestuur en van de aanwijzing van categorieën van omslagplichtigen, met inbegrip van
      eventuele uitgangspunten van de kostentoedeling.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      Tegen een besluit van Onze Minister inzake de goedkeuring van een besluit van provinciale staten tot opheffing van
      een waterschap of het wijzigen van de taak of het gebied van een waterschap kan een belanghebbende beroep instellen
      bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5
  - number: 5a.1
    text: |-
      Bij of krachtens reglement worden in verband met de vaststelling of wijziging van de taak van een waterschap
      de waterstaatswerken aangewezen die op een daarbij bepaalde datum in beheer overgaan van de provincie, van een
      gemeente of van een onder toepassing van de Wet gemeenschappelijke regelingen ingesteld openbaar lichaam naar het
      waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5a
  - number: 5a.2
    text: |-
      De oude en de nieuwe beheerder gaan, tenzij anders overeengekomen, binnen twee jaar na de in het eerste lid
      bedoelde datum over tot onvoorwaardelijke levering onderscheidenlijk aanvaarding van de desbetreffende onroerende
      goederen, voorzover deze daarvan niet bij of krachtens reglement zijn uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5a
  - number: 5a.3
    text: |-
      De oude en de nieuwe beheerder stellen, tenzij anders overeengekomen, binnen zes maanden na de in het eerste lid
      bedoelde datum gezamenlijk vast, of in verband met de overgang van rechten en verplichtingen een verrekening nodig
      is en tot welk bedrag. Bij gebreke van overeenstemming binnen die termijn beslissen, de oude en de nieuwe beheerder
      gehoord, gedeputeerde staten, dan wel – indien de provincie de oude beheerder is – Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Indien provinciale staten besluiten een waterschap op te heffen en het gebied daarvan te doen overgaan naar een
      bestaand of gelijktijdig ingesteld waterschap, gaan de rechten en verplichtingen van het op te heffen waterschap op
      de datum van opheffing over naar het waterschap waarnaar zijn gebied overgaat, zonder dat daarvoor een nadere akte
      wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5b
  - number: 5b.2
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij een opgeheven waterschap als bedoeld in het eerste lid betrokken
      is, worden met ingang van de datum van opheffing voortgezet door en tegen het waterschap waarnaar zijn gebied is
      overgegaan. Ten aanzien van de rechtsgedingen is de [elfde afdeling van de tweede titel van het eerste boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5b
  - number: 5b.3
    text: |-
      Indien ingevolge het eerste lid onroerende zaken overgaan, doen gedeputeerde staten de overgang onverwijld
      inschrijven in de openbare registers als bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek]
      (onbekend). [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek](onbekend) is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5b
  - number: 5b.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing, indien provinciale staten besluiten een
      gedeelte van het gebied van een waterschap te doen overgaan naar dat van een ander waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel5b
  - number: '6'
    text: |-
      Het opheffen of instellen van een waterschap dan wel het vaststellen van een reglement van een waterschap, waarvan
      het gebied in twee of meer provincies is gelegen, geschiedt bij gemeenschappelijk besluit van provinciale staten
      van de desbetreffende provincies. Hetzelfde geldt voor het wijzigen van dat reglement, tenzij deze colleges bij
      reglement het vaststellen van wijzigingen die naar hun oordeel van beperkte strekking zijn opdragen aan één van
      hen. De [artikelen 3][ref1] en [4, eerste tot en met vijfde lid][ref2], zijn van overeenkomstige toepassing. Aan
      deze artikelen wordt toepassing gegeven door een commissie uit het midden van de desbetreffende colleges, tenzij
      deze colleges besluiten deze toepassing aan één van hen op te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '4'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Indien de besturen van twee of meer provincies niet of niet binnen redelijke termijn tot overeenstemming komen
      over de opheffing of instelling van een waterschap voor de waterstaatkundige verzorging van een in hun provincies
      gelegen gebied, dan wel over de vaststelling of wijziging van een reglement voor een dergelijk waterschap, omdat
      zij van mening verschillen over hetzij de noodzaak hetzij de inhoud van het te nemen besluit, kan daarin bij
      algemene maatregel van bestuur worden voorzien. [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '7.2'
    text: |-
      Alvorens een voordracht tot die algemene maatregel van bestuur te doen, geeft Onze Minister van Verkeer
      en Waterstaat overeenkomstige toepassing aan [artikel 4, eerste tot en met vierde lid][ref1], en hoort hij
      gedeputeerde staten van de desbetreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '4'
        hoofdstuk: II
  - number: '7.3'
    text: |-
      [Artikel 4 van de Waterstaatswet 1900][ref1] (*Stb.* 176) is op het in het eerste lid bedoelde geval niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '4'
  - number: '8.1'
    text: |-
      Indien het belang van een goede organisatie van de waterstaatkundige verzorging van een gebied, dat in een of meer
      provincies is gelegen, het opheffen of het instellen van een waterschap dan wel de vaststelling of wijziging van
      het reglement voor een waterschap vordert en provinciale staten van de provincie of provincies daarvoor niet de
      nodige besluiten nemen, kunnen zij bij koninklijk besluit, de Raad van State gehoord, worden uitgenodigd om daartoe
      over te gaan binnen een in dat besluit te stellen termijn. [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '8.2'
    text: |-
      Indien Onze Minister van Verkeer en Waterstaat het voornemen heeft een besluit als bedoeld in het eerste lid te
      bevorderen, geeft hij hiervan kennis aan gedeputeerde staten der provincie of provincies wier gebied het betreft,
      onder mededeling van de overwegingen waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel8
  - number: '8.3'
    text: |-
      Binnen twaalf weken nadat de in het tweede lid bedoelde kennisgeving is geschied, vindt overleg plaats tussen Onze
      Minister van Verkeer en Waterstaat en het college of de colleges van gedeputeerde staten van de desbetreffende
      provincie of provincies.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien aan een uitnodiging als bedoeld in [artikel 8, eerste lid][ref1], niet binnen de gestelde termijn gevolg is
      gegeven, kan, behoudens verlenging van die termijn, bij algemene maatregel van bestuur overeenkomstig de strekking
      van de uitnodiging een waterschap worden opgeheven of ingesteld alsmede het reglement voor een waterschap worden
      vastgesteld of gewijzigd. [Artikel 18][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '9.2'
    text: |-
      Alvorens een voordracht tot die algemene maatregel van bestuur te doen, geeft Onze Minister van Verkeer
      en Waterstaat overeenkomstige toepassing aan [artikel 4, eerste tot en met vierde lid][ref1], en hoort hij
      gedeputeerde staten van de desbetreffende provincie of provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '4'
        hoofdstuk: II
  - number: '9.3'
    text: |-
      De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum waarop deze in het
      *Staatsblad* is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel9
  - number: '10'
    text: |-
      Het bestuur van een waterschap bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter,
      onverminderd hetgeen het reglement bepaalt over de benaming van die onderscheidene bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het algemeen bestuur is samengesteld uit vertegenwoordigers van categorieën van belanghebbenden bij de uitoefening
      van de taken van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: '11.2'
    text: 'Als categorieën van belanghebbenden komen voor vertegenwoordiging in het algemeen bestuur alleen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: 11.2.a
    text: degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: 11.2.b
    text: |-
      degenen die krachtens een door de grondkamer goedgekeurde pachtovereenkomst het gebruik hebben van ongebouwde
      onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: 11.2.c
    text: degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van gebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: 11.2.d
    text: |-
      de ingezetenen, onder wie worden verstaan degenen die hun werkelijke woonplaats hebben in het gebied van het
      waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: 11.2.e
    text: |-
      degenen die krachtens eigendom, bezit, beperkt recht of persoonlijk recht gebouwde onroerende zaken in gebruik
      hebben als bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel11
  - number: '12'
    text: |-
      In geval de zorg voor het kwaliteitsbeheer van oppervlaktewater in een gebied afzonderlijk is of wordt
      opgedragen aan één waterschap, kan in het belang van de eenheid van het waterhuishoudkundig beheer bij reglement
      worden bepaald dat in het algemeen bestuur, naast de vertegenwoordigers van belanghebbenden in de zin van
      [artikel 11][ref1], zitting hebben vertegenwoordigers van het waterschap of van de waterschappen die met de overige
      zorg voor de waterhuishouding in het gebied van eerstbedoeld waterschap zijn belast. De [artikelen 14][ref2] en
      [15, eerste lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel15
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '13.1'
    text: |-
      Voor de aanwijzing van de categorieën van belanghebbenden die in het algemeen bestuur zijn vertegenwoordigd,
      en voor de bepaling van het aantal vertegenwoordigers van elke categorie, worden ten aanzien van elk der in
      [artikel 11, tweede lid][ref1], genoemde categorieën in aanmerking genomen de aard en de omvang van het belang
      of de belangen die deze heeft bij de behartiging van de taken van het waterschap, zomede het door deze te betalen
      aandeel in de kosten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.2'
    text: |-
      Bij reglement kan aan daarbij aan te wijzen belanghebbenden de bevoegdheid worden toegekend om van het aantal
      vertegenwoordigers van de categorie waartoe zij behoren er een of meer te benoemen. Een aldus benoemd lid wordt
      voor de toepassing van de [artikelen 14][ref1] en [15, eerste lid][ref2], aangemerkt als een gekozen lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel15
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '14.1'
    text: De leden van het algemeen bestuur worden gekozen voor vier jaren.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel14
  - number: '14.2'
    text: Zij treden tegelijk af. De aftredenden zijn dadelijk herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het eerste lid kan bij reglement de zittingsduur worden gesteld op een ten hoogste twee jaren
      kortere of langere duur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel14
  - number: '14.4'
    text: |-
      Degene die lid is geworden ter vervulling van een buiten de gewone termijn van aftreding opengevallen plaats treedt
      af op het tijdstip waarop degene in wiens plaats deze is getreden, had moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Bij reglement kan worden bepaald dat voor ieder van de leden van het algemeen bestuur gelijktijdig een
      plaatsvervangend lid wordt gekozen, dan wel, indien het betreft een benoemd lid, wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      [Artikel 14][ref1] en de [artikelen 16 tot en met 28][ref2] zijn van overeenkomstige toepassing op de verkiezing
      van plaatsvervangende leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel16
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 15a
    text: |-
      Indien ter vervulling van een door ontslag of overlijden van een lid van het algemeen bestuur opengevallen plaats
      niet een daartoe gekozen plaatsvervangend lid beschikbaar is, komen daarvoor in aanmerking degenen die bij de
      verkiezing voor de vertegenwoordigers van de desbetreffende categorie van belanghebbenden kandidaat waren voor de
      verkiezing tot lid, en wel in volgorde van de aantallen behaalde stemmen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel15a
  - number: '16.1'
    text: |-
      De kandidaatstelling voor de verkiezing van de leden van het algemeen bestuur geschiedt per categorie van
      belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel16
  - number: '16.2'
    text: Niemand kan kandidaat worden gesteld voor meer dan één categorie van belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel16
  - number: '16.3'
    text: |-
      Elke opgave waarbij de kandidaatstelling geschiedt bevat de naam van één kandidaat, alsmede bij toepassing van
      [artikel 15, eerste lid][ref1], van diens plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel15
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '16.4'
    text: |-
      De opgave moet zijn ondertekend door tenminste een bij reglement te bepalen aantal personen die bevoegd zijn tot
      kandidaatstelling voor vertegenwoordigers van de desbetreffende categorie van belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel16
  - number: '16.5'
    text: Niemand mag per categorie van belanghebbenden meer dan één opgave ondertekenen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien voor een categorie van belanghebbenden minder kandidaten zijn gesteld dan het aantal vacatures bedraagt,
      stelt het algemeen bestuur zoveel kandidaten als nodig is om in alle vacatures te voorzien.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien voor een categorie van belanghebbenden evenveel kandidaten zijn gesteld als het aantal vacatures bedraagt,
      worden alle kandidaten als gekozen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel17
  - number: '18.1'
    text: |-
      Bevoegd tot kandidaatstelling zijn degenen die behoren tot de desbetreffende categorie van belanghebbenden
      en als zodanig belastingplichtig zijn aan het waterschap, met dien verstande dat voor de categorie bedoeld in
      [artikel 11, tweede lid, onderdeel ][ref1], bevoegd zijn degenen die blijkens de gemeentelijke basisadministratie
      persoonsgegevens behoudens tegenbewijs kunnen worden geacht werkelijk woonplaats te hebben in het gebied van het
      waterschap en die op de dag der kandidaatstelling de leeftijd van achttien jaren hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Ten aanzien van de uitoefening van de in het eerste lid omschreven bevoegdheid zijn de
      [artikelen 26 tot en met 28][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel26
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '19.1'
    text: |-
      Stemgerechtigd voor de verkiezing van de vertegenwoordigers van de categorie van belanghebbenden, bedoeld in
      [artikel 11, tweede lid, onderdeel a, onderscheidenlijk onderdeel b][ref1], zijn degenen die behoren tot de
      desbetreffende categorie, als zodanig belastingplichtig zijn aan het waterschap en op de dag der kandidaatstelling
      opgenomen zijn in het in het [artikel 29][ref2] bedoelde register.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel29
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '19.2'
    text: |-
      Bij reglement kan worden bepaald dat voor het bezit van het stemrecht tevens is vereist dat de belastingplicht aan
      het waterschap ten minste een daarbij te bepalen bedrag betreft, dan wel dat het een ongebouwde onroerende zaak van
      ten minste een daarbij te bepalen oppervlakte betreft.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel19
  - number: '20.1'
    text: |-
      Stemgerechtigd voor de verkiezing van de vertegenwoordigers van de categorie van belanghebbenden, bedoeld
      in [artikel 11, tweede lid, onderdeel ][ref1], zijn degenen die behoren tot die categorie, als zodanig
      belastingplichtig zijn aan het waterschap en op de dag der kandidaatstelling opgenomen zijn in het in
      [artikel 29][ref2] bedoelde register. Bij reglement kan worden bepaald dat voor het bezit van het stemrecht
      tevens is vereist dat de belastingplicht aan het waterschap ten minste een daarbij te bepalen bedrag betreft.
      [Artikel 19, tweede lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel19
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '20.2'
    text: |-
      Bij reglement kan in afwijking van het eerste lid worden bepaald dat stemgerechtigd zijn de leden van de raden der
      gemeenten waartoe het gebied van het waterschap behoort.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel20
  - number: '21.1'
    text: |-
      Stemgerechtigd voor de verkiezing van de vertegenwoordigers van de categorie van belanghebbenden, bedoeld
      in [artikel 11, tweede lid, onderdeel ][ref1], zijn degenen die blijkens de gemeentelijke basisadministratie
      persoonsgegevens behoudens tegenbewijs kunnen worden geacht op de dag van de kandidaatstelling werkelijk woonplaats
      te hebben in het gebied van het waterschap en de leeftijd van achttien jaren hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Bij reglement kan in afwijking van het eerste lid worden bepaald dat stemgerechtigd zijn de leden van de raden der
      gemeenten waartoe het gebied van het waterschap behoort.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel21
  - number: '22.1'
    text: |-
      Stemgerechtigd voor de verkiezing van de vertegenwoordigers van de categorie van belanghebbenden, bedoeld in
      [artikel 11, tweede lid, onderdeel ][ref1], zijn de leden van de voor het gebied van het waterschap bevoegde Kamer
      of Kamers van Koophandel en Fabrieken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '22.2'
    text: |-
      Indien binnen het gebied van een waterschap meer dan een Kamer van Koophandel en Fabrieken bevoegd is, en de
      verhouding tussen het aantal leden van een der Kamers en het belang van deze bij de behartiging van de taken
      door het waterschap daartoe aanleiding geeft, kan bij reglement aan gedeputeerde staten worden opgedragen om met
      inachtneming van die verhouding de waarde vast te stellen van de stem van een lid van die Kamer.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel22
  - number: '23'
    text: |-
      Indien het gebied van een waterschap tevens het gebied is van een of meer andere waterschappen waaraan een andere
      taak is opgedragen, kan bij reglement in afwijking van het bepaalde in de [artikelen 19 tot en met 22][ref1]
      worden bepaald dat voor de verkiezing van vertegenwoordigers van de onderscheidene categorieën van belanghebbenden,
      bedoeld in [artikel 11, tweede lid][ref2], stemgerechtigd zijn degenen die als zodanige vertegenwoordigers zijn
      gekozen in het bestuur van laatstbedoelde waterschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '24.1'
    text: |-
      Ten aanzien van onroerende zaken die zijn onderworpen aan het recht van beklemming, van erfpacht, van opstal of van
      vruchtgebruik is niet de eigenaar maar de genothebbende van het betreffende beperkt recht stemgerechtigd. Niettemin
      is voor wat betreft het recht van opstal de eigenaar stemgerechtigd indien dat recht uitsluitend is gevestigd ten
      behoeve van de aanleg of het onderhoud, dan wel ten behoeve van de aanleg en het onderhoud, van ondergrondse dan
      wel bovengrondse leidingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel24
  - number: '24.2'
    text: |-
      Indien de onroerende zaak is onderworpen aan meer van die beperkte rechten, heeft voor het bezit van het stemrecht
      de vruchtgebruiker voorrang boven zowel de opstaller als de erfpachter dan wel de beklemde meier en heeft de
      opstaller voorrang boven de erfpachter dan wel de beklemde meier.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel24
  - number: '25.1'
    text: |-
      Een stemgerechtigde bezit voor iedere categorie van belanghebbenden waarvoor hij die hoedanigheid heeft telkens
      één stem, behoudens het bepaalde in onderscheidenlijk het tweede lid van dit artikel en het tweede lid van
      [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel22
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Indien de verhouding tussen het aantal raadsleden en het aantal ingezetenen van een gemeente dat tevens ingezetene
      is van het waterschap daartoe aanleiding geeft, kan bij het reglement aan gedeputeerde staten worden opgedragen om
      met inachtneming van die verhouding de waarde vast te stellen van de stem van een raadslid.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel25
  - number: '25.3'
    text: De stemming op de kandidaten is geheim.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel25
  - number: '26.1'
    text: |-
      Niet bevoegd tot uitoefening van het stemrecht zijn zij die bij onherroepelijke rechterlijke uitspraak van het
      kiesrecht zijn ontzet.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
  - number: '26.2'
    text: |-
      Niet bevoegd tot uitoefening van het stemrecht in de zin van [artikel 21][ref1] zijn zij die blijkens de
      gemeentelijke basisadministratie krachtens onherroepelijke rechterlijke uitspraak wegens een geestelijke stoornis
      onbekwaam zijn rechtshandelingen te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel21
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '26.3'
    text: 'De bevoegdheid tot de uitoefening van het stemrecht van hen:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
  - number: 26.3.a
    text: die op de dag van de stemming minderjarig zijn,
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
  - number: 26.3.b
    text: |-
      die bij onherroepelijke rechterlijke uitspraak tot onder curatelestelling de beschikking of het beheer over hun
      goederen hebben verloren,
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
  - number: 26.3.c
    text: die afwezig zijn en wier goederen deswege bij onherroepelijke rechterlijke uitspraak onder bewind zijn gesteld,
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel26
  - number: '27.1'
    text: |-
      Indien met betrekking tot een onroerende zaak in de kadastrale registratie de eigendom dan wel een beperkt recht
      staat vermeld op naam van meer personen of van een vennootschap zonder rechtspersoonlijkheid, kan het stemrecht
      worden uitgeoefend door elk van de deelgnoten of mede-vennoten, met dien verstande dat slechts eenmaal stem kan
      worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel27
  - number: '27.2'
    text: |-
      Hetzelfde geldt ten aanzien van het stemrecht wegens ongebouwde onroerende zaken, indien de op de voet van
      [artikel 29][ref1] geregistreerde overeenkomst op naam staat van meer dan een persoonlijk gerechtigde of van een
      vennootschap zonder rechtspersoonlijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel29
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '28.1'
    text: |-
      Indien met betrekking tot een onroerende zaak de in de huwelijkse gemeenschap vallende eigendom of beperkt recht
      staat vermeld op naam van één der echtgenoten kan in diens plaats de andere echtgenoot het stemrecht uitoefenen.
      Ten aanzien van zodanige goederen die op beider naam zijn gesteld zijn elk van beide echtgenoten bevoegd tot
      uitoefening van het stemrecht, met dien verstande dat slechts eenmaal stem kan worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel28
  - number: '28.2'
    text: 'Voor de toepassing van het vorige lid wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel28
  - number: 28.2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel28
  - number: 28.2.b
    text: 'huwelijkse gemeenschap: gemeenschap van een geregistreerd partnerschap.'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel28
  - number: '29'
    text: |-
      Het dagelijks bestuur houdt een register bij waarin, met inachtneming van het bepaalde in de [artikelen 19][ref1]
      en [20][ref2] worden opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel20
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '19'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 29.a
    text: |-
      zij, die blijkens de kadastrale registratie, bedoeld in [artikel 48 van de Kadasterwet][ref1], behoren tot de
      categorie van belanghebbenden, bedoeld in [artikel 11, tweede lid, onderdeel ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.b
    text: |-
      zij, die blijkens de door de grondkamer aan het geheel of gedeeltelijk in het rechtsgebied van de grondkamer
      gelegen waterschap verstrekte gegevens, als pachter met een door de grondkamer goedgekeurde pachtovereenkomst
      behoren tot de categorie van belanghebbenden, bedoeld in [artikel 11, tweede lid, onderdeel ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.c
    text: |-
      zij, die blijkens de kadastrale registratie, bedoeld in [artikel 48 van de Kadasterwet][ref1], behoren tot de
      categorie van belanghebbenden, bedoeld in [artikel 11, tweede lid onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '30.1'
    text: |-
      Het dagelijks bestuur verstrekt op verzoek aan een ieder kosteloos inlichtingen uit het register waaruit deze
      kan opmaken of hij zelf daarin al dan niet behoorlijk is opgenomen. Een uittreksel uit het register wordt tegen
      betaling van kosten verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30
  - number: '30.2'
    text: |-
      Een ieder is bevoegd het dagelijks bestuur verbetering van het register te verzoeken op grond
      dat hijzelf in strijd met deze wet daarin al dan niet of niet behoorlijk is opgenomen. De
      [artikelen D 5, D 6 en D 7 van de Kieswet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelD_5
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: D_5
  - number: 30a.1
    text: |-
      Tegen bij provinciale verordening aangewezen besluiten, die met toepassing van die verordening worden genomen
      met het oog op de verkiezing van de leden van het algemeen bestuur en die naar hun aard noodzaken tot een
      spoedige behandeling van de daartegen ingestelde beroepen kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30a
  - number: 30a.2
    text: |-
      [Artikel 7:1][ref1] en [titel 8.3 van de Algemene wet bestuursrecht][ref2] blijven buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
  - number: 30a.3
    text: |-
      In afwijking van [artikel 8:41, tweede lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 30a.4
    text: |-
      De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3. van de Algemene wet bestuursrecht][ref1].
      [Afdeling 8.2.4.][ref2] blijft buiten toepassing. Aan het dagelijks bestuur wordt terstond een afschrift van het
      beroepschrift gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.3
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 8.2.4
  - number: 30a.5
    text: |-
      Bij provinciale verordening kan in afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] de termijn
      voor het indienen van de in het eerste lid bedoelde beroepschriften worden bekort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 30b
    text: |-
      Bij algemene maatregel van bestuur wordt een kiesreglement vastgesteld. [Artikel 30a][ref1] is van overeenkomstige
      toepassing op die algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel30a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 30a
        hoofdstuk: IV
        paragraaf: '2'
  - number: '31.1'
    text: |-
      Voor het lidmaatschap van het algemeen bestuur is alleen vereist dat men de leeftijd van achttien jaren heeft
      bereikt en niet krachtens [artikel B 5, eerste lid, van de Kieswet][ref1] van het kiesrecht is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '31.2'
    text: 'Een lid van het algemeen bestuur is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel31
  - number: 31.2.a
    text: ambtenaar door of vanwege het waterschapsbestuur aangesteld of daaraan ondergeschikt;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel31
  - number: 31.2.b
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51b
        hoofdstuk: VIA
        paragraaf: '1'
  - number: '31.3'
    text: |-
      Zodra een lid van het algemeen bestuur blijkt niet te voldoen aan een der in het eerste lid bedoelde vereisten
      of blijkt een in het tweede lid bedoelde betrekking te vervullen, houdt deze op lid te zijn. In dat geval is
      [artikel X 5 van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_5
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_5
  - number: '32.1'
    text: |-
      De leden van het algemeen bestuur maken openbaar welke andere functies dan het lidmaatschap van het algemeen
      bestuur zij vervullen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel32
  - number: '32.2'
    text: |-
      Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op de
      secretarie van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel32
  - number: 32a
    text: |-
      De leden van het algemeen bestuur die geen lid zijn van het dagelijks bestuur ontvangen een vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de kosten. Deze vergoeding en tegemoetkoming worden door het algemeen
      bestuur bij verordening vastgesteld naar bij of krachtens algemene maatregel van bestuur te stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel32a
  - number: '33.1'
    text: 'Een lid van het algemeen bestuur mag enkel niet werkzaam zijn:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.1.a
    text: |-
      als advocaat, procureur of adviseur ten behoeve van de wederpartij van het waterschap of ten behoeve van het
      waterschapsbestuur in geschillen;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.1.b
    text: als gemachtigde ten behoeve van de wederpartij van het waterschap in geschillen;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.1.c
    text: |-
      als gevolmachtigde of adviseur ten behoeve van derden tot het aangaan van overeenkomsten als bedoeld in het tweede
      lid met het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: '33.2'
    text: |-
      Een lid van het algemeen bestuur mag niet, tenzij door gedeputeerde staten ontheffing is verleend, rechtstreeks of
      middellijk een overeenkomst aangaan betreffende:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.1e
    text: het aannemen van werk ten behoeve van het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.2e
    text: het buiten dienstbetrekking tegen beloning doen van verrichtingen ten behoeve van het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.3e
    text: het doen van leveranties aan het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.4e
    text: het verhuren van niet-registergoederen aan het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.5e
    text: het verwerven van betwiste vorderingen ten laste van het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.6e
    text: het onderhands verwerven van onroerende zaken of beperkte rechten waaraan die zijn onderworpen van het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: 33.2.7e
    text: het onderhands huren of pachten van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
  - number: '33.3'
    text: |-
      Ten aanzien van een lid dat handelt in strijd met het bepaalde in het eerste of tweede lid is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '34'
    text: |-
      Alvorens hun functie te kunnen uitoefenen leggen de leden van het algemeen bestuur in de vergadering, in handen van
      de voorzitter, de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot lid van het algemeen
      bestuur te worden gekozen of benoemd, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, aan
      iemand enige gift of gunst heb gedaan of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen
      of te laten, rechtstreeks noch middellijk van iemand enig geschenk of enige belofte heb aangenomen of zal aannemen.
      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als lid van het algemeen bestuur naar eer en geweten zal vervullen. Zo waarlijk helpe mij God almachtig
      (Dat verklaar en beloof ik)".


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '35.1'
    text: De vergadering van het algemeen bestuur wordt in het openbaar gehouden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel35
  - number: '35.2'
    text: |-
      De deuren worden gesloten, wanneer tenminste een vijfde van het aantal leden dat de presentielijst heeft
      ondertekend daarom verzoekt of de voorzitter het nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel35
  - number: '35.3'
    text: Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel35
  - number: '35.4'
    text: |-
      Van een vergadering met gesloten deuren wordt een afzonderlijk verslag gemaakt dat niet openbaar wordt gemaakt
      tenzij het algemeen bestuur anders beslist.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel35
  - number: '36'
    text: 'In een besloten vergadering kan niet worden beraadslaagd of besloten over:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel36
  - number: 36.a
    text: de toelating van nieuwe leden;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel36
  - number: 36.b
    text: de vaststelling en wijziging van de begroting en de vaststelling van de rekening;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel36
  - number: 36.c
    text: de invoering, wijziging en afschaffing van een waterschapsbelasting; en
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel36
  - number: 36.d
    text: de benoeming en het ontslag van leden van het dagelijks bestuur met uitzondering van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel36
  - number: '37.1'
    text: |-
      Het algemeen bestuur kan op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1],
      geheimhouding opleggen omtrent het in een besloten vergadering behandelde en omtrent de inhoud van stukken die aan
      de vergadering worden overgelegd. Geheimhouding omtrent het in een besloten vergadering behandelde wordt tijdens
      die vergadering opgelegd. De geheimhouding wordt zowel door hen die bij de behandeling tegenwoordig waren, als
      door hen die op andere wijze van het behandelde of van de stukken kennis nemen, in acht genomen totdat het algemeen
      bestuur haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '37.2'
    text: |-
      Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door het dagelijks bestuur, de voorzitter, een commissie van het waterschap en het bestuur
      van een afdeling, ieder ten aanzien van stukken die zij aan het algemeen bestuur of aan de leden van dit bestuur
      overleggen. Daarvan wordt op de stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '37.3'
    text: |-
      De krachtens het tweede lid aan het algemeen bestuur opgelegde verplichting tot geheimhouding vervalt, indien de
      oplegging niet door het algemeen bestuur in zijn eerstvolgende vergadering die blijkens de presentielijst door meer
      dan de helft van het aantal zitting hebbende leden is bezocht, wordt bekrachtigd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel37
  - number: '37.4'
    text: |-
      De krachtens het tweede lid aan de leden van het algemeen bestuur opgelegde verplichting tot geheimhouding wordt
      door hen in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel, indien het stuk waaromtrent
      geheimhouding is opgelegd aan het algemeen bestuur is voorgelegd, totdat het algemeen bestuur haar opheft. Het
      algemeen bestuur kan deze beslissing alleen nemen in een vergadering die blijkens de presentielijst door meer dan
      de helft van het aantal zitting hebbende leden is bezocht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel37
  - number: '38'
    text: De leden van het algemeen bestuur stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel38
  - number: '39'
    text: |-
      Zij die behoren tot het algemeen bestuur van het waterschap en anderen die deelnemen aan de beraadslaging kunnen
      niet in rechte worden vervolgd of aangesproken voor hetgeen zij in de vergadering van het algemeen bestuur hebben
      gezegd of schriftelijk aan het algemeen bestuur hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel39
  - number: '40.1'
    text: |-
      Het dagelijks bestuur bestaat uit de voorzitter en een door het algemeen bestuur te bepalen aantal andere leden.
      De samenstelling van het dagelijks bestuur geschiedt zoveel mogelijk naar de wijze waarop de onderscheidene
      categorieën van belanghebbenden zijn vertegenwoordigd in het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel40
  - number: '40.2'
    text: Bij reglement kan worden bepaald welk aantal leden het dagelijks bestuur ten minste en ten hoogste telt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel40
  - number: '41.1'
    text: De leden van het dagelijks bestuur, met uitzondering van de voorzitter, worden door het algemeen bestuur benoemd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel41
  - number: '41.2'
    text: De benoeming vindt plaats uit de leden van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel41
  - number: '41.3'
    text: |-
      Gedeputeerde staten kunnen, indien het reglement dat bepaalt, ontheffing verlenen van het bepaalde in het tweede
      lid. Geen ontheffing wordt verleend indien het de ombudsman of een lid van de ombudscommissie betreft als bedoeld
      in [artikel 51b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51b
        hoofdstuk: VIA
        paragraaf: '1'
  - number: '41.4'
    text: |-
      De zittingsduur van het dagelijks bestuur is vier jaar. Bij toepassing van [artikel 14, derde lid][ref1], is de
      zittingsduur dienovereenkomstig korter of langer. De leden van het dagelijks bestuur, met uitzondering van de
      voorzitter, treden af tegelijk met het optreden van de leden van het nieuwe algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel14
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '41.5'
    text: |-
      Niettemin kan het algemeen bestuur een of meer leden van het dagelijks bestuur, met uitzondering van de voorzitter,
      ontslag verlenen, indien deze het vertrouwen van het algemeen bestuur niet meer bezitten. Op het ontslagbesluit
      zijn de [artikelen 4:8][ref1] en [7:1 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '42.1'
    text: |-
      De vergaderingen van het dagelijks bestuur worden met gesloten deuren gehouden, voor zover het dagelijks bestuur
      niet anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel42
  - number: '42.2'
    text: |-
      Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van het
      dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel42
  - number: '43.1'
    text: |-
      Het dagelijks bestuur kan op grond van een belang, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], geheimhouding opleggen omtrent het in een besloten
      vergadering behandelde en omtrent de inhoud van de stukken die aan de vergadering worden overgelegd. Geheimhouding
      omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De geheimhouding wordt
      zowel door hen die bij de behandeling aanwezig waren als door hen die op andere wijze van het behandelde of van de
      stukken kennis nemen, in acht genomen totdat het dagelijks bestuur haar opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '43.2'
    text: |-
      Op grond van een belang genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref1], kan de geheimhouding
      eveneens worden opgelegd door de voorzitter, een commissie van het waterschap of een afdelingsbestuur, ieder ten
      aanzien van de stukken die zij aan het dagelijks bestuur of de leden van dit bestuur overleggen. Daarvan wordt op
      de stukken melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '43.3'
    text: |-
      Indien het dagelijks bestuur zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt tot
      het algemeen bestuur heeft gericht, wordt de geheimhouding in acht genomen totdat het algemeen bestuur haar opheft.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel43
  - number: '44.1'
    text: |-
      De leden van het dagelijks bestuur genieten ten laste van het Waterschap een bezoldiging en een tegemoetkoming in
      de kosten van de uitoefening van hun werkzaamheden, volgens bij algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel44
  - number: '44.2'
    text: |-
      Op de leden van het dagelijks bestuur die niet overheidswerknemer in de zin van de [Wet privatisering ABP][ref1]
      zijn, is de [vijfde afdeling van de Algemene pensioenwet politieke ambtsdragers](onbekend) van overeenkomstige
      toepassing. Voor die toepassing wordt voor gedeputeerde staten, provinciale staten en provincie respectievelijk
      gelezen: dagelijks bestuur van een waterschap, algemeen bestuur van een waterschap en waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007791
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007791
  - number: '45'
    text: |-
      Ten aanzien van de leden van het dagelijks bestuur zijn de [artikelen 38][ref1] en [39][ref2] van overeenkomstige
      toepassing. Bovendien zijn de [artikelen 31][ref3], [33][ref4] en [34][ref5] van overeenkomstige toepassing
      ten aanzien van de leden van het dagelijks bestuur die zijn benoemd met gebruik van een op grond van
      [artikel 41, derde lid][ref6], verleende ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0005108#Artikel41
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '38'
        hoofdstuk: IV
        paragraaf: '3'
      - id: ref2
