        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
  - number: '46.1'
    text: |-
      De voorzitter van het waterschap wordt benoemd en herbenoemd bij koninklijk besluit. Hij kan bij koninklijk besluit
      worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel46
  - number: '46.2'
    text: De benoeming geschiedt voor de tijd van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel46
  - number: '46.3'
    text: |-
      Voor de benoeming maakt het algemeen bestuur een aanbeveling op. Bij de aanbeveling zijn de naar het oordeel van
      het algemeen bestuur voor de geschiktheid van belang zijnde overwegingen gevoegd. Het algemeen bestuur zendt de
      aanbeveling aan gedeputeerde staten, die deze vergezeld van hun beschouwingen zenden aan Onze Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel46
  - number: '46.4'
    text: |-
      Indien Onze Minister van Verkeer en Waterstaat van oordeel is dat de op de aanbeveling geplaatste persoon of
      personen ongeschikt zijn, verzoekt hij om een nieuwe aanbeveling.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel46
  - number: '46.5'
    text: |-
      Een voordracht van een niet op de aanbeveling geplaatste persoon geschiedt niet alvorens het algemeen bestuur en
      gedeputeerde staten zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel46
  - number: '47.1'
    text: 'De voorzitter is niet tevens:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel47
  - number: 47.1.a
    text: |-
      lid van het algemeen bestuur van het waterschap waarvan hij voorzitter is, noch, behoudens bij koninklijk besluit
      verleende ontheffing, burgemeester of wethouder van een in een gebied van het waterschap gelegen gemeente;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel47
  - number: 47.1.b
    text: |-
      ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51b
        hoofdstuk: VIA
        paragraaf: '1'
  - number: '47.2'
    text: Voor de benoembaarheid tot voorzitter is het Nederlanderschap vereist.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel47
  - number: '48.1'
    text: |-
      De voorzitter vervult geen andere functies waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van zijn ambt of op handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel48
  - number: '48.2'
    text: |-
      De voorzitter maakt openbaar welke andere functies hij anders dan uit hoofde van zijn ambt vervult.
      [Artikel 32, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel32
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '32'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '49.1'
    text: |-
      Voorzover dit niet bij de wet is geschied, worden voor de voorzitter bij algemene maatregel van bestuur regels
      vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: 49.1.a
    text: benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie, en ontslag;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: 49.1.b
    text: uitkering bij ontslag;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: 49.1.c
    text: aanspraken in geval van ziekte;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: 49.1.d
    text: andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: '49.2'
    text: |-
      Bij de in het eerste lid bedoelde regels kunnen financiële voorzieningen worden getroffen die ten laste van het
      waterschap komen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel49
  - number: '50'
    text: |-
      Alvorens zijn ambt te aanvaarden legt de voorzitter in handen van de commissaris van de Koning dan wel, indien het
      een interprovinciaal waterschap betreft, van Onze daartoe in het reglement aangewezen commissaris van de Koning,
      de volgende eed (verklaring en belofte) af: "Ik zweer (verklaar) dat ik, om tot voorzitter benoemd te worden,
      rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, aan iemand enige gift of gunst heb gedaan
      of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch
      middellijk van iemand enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (beloof) dat ik
      getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn plichten als voorzitter naar
      eer en geweten zal vervullen. Zo waarlijk helpe mij God almachtig! (Dat verklaar en beloof ik!)".


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '51'
    text: |-
      Het ambt van voorzitter ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51
  - number: 51a.1
    text: |-
      Bij verhindering of ontstentenis van de voorzitter en – indien in de aanwijzing daarvan is voorzien bij het
      reglement – van de plaatsvervangend voorzitter wordt het ambt van voorzitter waargenomen door een, door het
      dagelijks bestuur aan te wijzen, ander lid van dat bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51a
  - number: 51a.2
    text: |-
      Bij verhindering of ontstentenis van alle leden van het dagelijks bestuur wordt het ambt waargenomen door het
      oudste lid in jaren van het algemeen bestuur, tenzij het algemeen bestuur een ander lid met de waarneming belast.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51a
  - number: 51a.3
    text: |-
      Bij verhindering of ontstentenis van de voorzitter op de dag met ingang waarvan het zittende algemeen bestuur is
      afgetreden, wordt het ambt waargenomen door een, door de afgetreden leden van het dagelijks bestuur aan te wijzen,
      afgetreden lid van het dagelijks bestuur, of, bij ontstentenis van alle afgetreden leden van het dagelijks bestuur,
      door het oudste afgetreden lid in jaren van het algemeen bestuur, een en ander tot in de waarneming overeenkomstig
      het eerste en tweede lid is voorzien.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51a
  - number: 51b.1
    text: |-
      Met inachtneming van het bepaalde in dit hoofdstuk kan het algemeen bestuur de behandeling van verzoekschriften
      als bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1] opdragen aan een ombudsman of
      ombudscommissie voor het waterschap, dan wel een gezamenlijke ombudsman of ombudscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 51b.2
    text: |-
      Een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51b
  - number: 51b.3
    text: |-
      De instelling van een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van
      enig jaar worden beëindigd. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot beëindiging van
      de instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51b
  - number: 51c.1
    text: |-
      Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudsman voor het waterschap,
      benoemt het deze voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.2
    text: |-
      Het algemeen bestuur benoemt een plaatsvervangend ombudsman. Deze paragraaf is op de plaatsvervangend ombudsman van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3
    text: 'De ombudsman wordt door het algemeen bestuur ontslagen:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3.a
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3.b
    text: wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3.c
    text: |-
      bij de aanvaarding van een betrekking als bedoeld in [artikel 51d, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51d
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51d
        hoofdstuk: VIA
        paragraaf: '2'
  - number: 51c.3.d
    text: |-
      wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij zulk
      een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3.e
    text: |-
      indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van faillissement
      is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij
      surseance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.3.f
    text: indien hij naar het oordeel van provinciale staten ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.4
    text: 'Het algemeen bestuur stelt de ombudsman op non-activiteit indien hij:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.4.a
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.4.b
    text: |-
      bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51c.4.c
    text: |-
      onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft verkregen of wegens schulden is
      gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51c
  - number: 51d.1
    text: |-
      De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling van
      zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51d
  - number: 51d.2
    text: |-
      [Artikel 32][ref1] is van overeenkomstige toepassing op de ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel32
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '32'
        hoofdstuk: IV
        paragraaf: '3'
  - number: 51e
    text: |-
      Alvorens zijn functie te kunnen uitoefenen, legt de ombudsman in de vergadering van het algemeen bestuur, in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af: «Ik zweer (verklaar) dat ik, om tot ombudsman
      benoemd te worden, rechtstreeks noch middellijk, onder welke naam of welk voorwendsel ook, enige gift of gunst heb
      gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks
      noch middellijk enig geschenk of enige belofte heb aangenomen of zal aannemen. Ik zweer (verklaar en beloof) dat
      ik getrouw zal zijn aan de Grondwet, dat ik de wetten zal nakomen en dat ik mijn plichten als ombudsman naar eer en
      geweten zal vervullen. Zo waarlijk helpe mij God almachtig!» («Dat verklaar en beloof ik!»)
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51e
  - number: 51f.1
    text: |-
      Op voordracht van de ombudsman benoemt het dagelijks bestuur het personeel van de ombudsman dat nodig is voor een
      goede uitoefening van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51f
  - number: 51f.2
    text: |-
      De ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het algemeen,
      noch voor een enkel geval.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51f
  - number: 51f.3
    text: |-
      Het personeel van de ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens gedraging de
      ombudsman een onderzoek kan instellen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51f
  - number: 51f.4
    text: |-
      Het personeel van de ombudsman is ter zake van de werkzaamheden die het voor de ombudsman verricht, uitsluitend aan
      hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51f
  - number: 51g
    text: De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51g
  - number: 51h
    text: |-
      De ombudsman ontvangt een bij verordening van het algemeen bestuur vastgestelde vergoeding voor zijn werkzaamheden
      en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51h
  - number: 51i.1
    text: |-
      Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudscommissie voor het
      waterschap, stelt het algemeen bestuur het aantal leden van de ombudscommissie vast.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51i
  - number: 51i.2
    text: Het algemeen bestuur benoemt de leden van de ombudscommissie voor de duur van zes jaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51i
  - number: 51i.3
    text: Het algemeen bestuur benoemt uit de leden de voorzitter en de plaatsvervangend voorzitter van de ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51i
  - number: 51j.1
    text: De ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51j
  - number: 51j.2
    text: |-
      Op de ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 51c, derde en vierde lid][ref1], [51d][ref2],
      [51e][ref3], [51f][ref4] en [51h][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51c
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel51d
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51e
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel51f
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel51h
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51j
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51c
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: 51d
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 51e
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0005108
        artikel: 51f
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005108
        artikel: 51h
        hoofdstuk: VIA
        paragraaf: '2'
  - number: 51k.1
    text: |-
      Het algemeen bestuur kan voor de behandeling van verzoekschriften een gezamenlijke ombudsman of een gezamenlijke
      ombudscommissie instellen met de raad of raden van een of meer andere gemeenten, dan wel met provinciale staten van
      een of meer provincies, dan wel met het algemeen bestuur van een of meer waterschappen, dan wel met het algemeen
      bestuur van een of meer openbare lichamen of gemeenschappelijke organen ingesteld bij gemeenschappelijke regeling.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51k
  - number: 51k.2
    text: |-
      De ombudsman of de ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de vertegenwoordigende
      organen van de deelnemende rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51k
  - number: 51k.3
    text: |-
      Op de ombudsman en op ieder afzonderlijk lid van de ombudscommissie zijn de [artikelen 51c tot en met 51f][ref1],
      [ 51h][ref2] en [51i][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51c
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel51h
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51i
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51k
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51c
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: 51h
        hoofdstuk: VIA
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 51i
        hoofdstuk: VIA
        paragraaf: '3'
  - number: 51l
    text: |-
      Indien het algemeen bestuur een ombudsman of een ombudscommissie instelt met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], zijn de in die wet ten aanzien van gemeenschappelijke organen opgenomen
      bepalingen slechts van toepassing voor zover de aard van de aan de ombudsman of de ombudscommissie opgedragen taken
      zich daartegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel51l
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '52.1'
    text: |-
      Bij of krachtens het reglement kunnen, ter behartiging van taken die het waterschap zijn opgedragen, binnen het
      gebied van het waterschap afdelingen worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel52
  - number: '52.2'
    text: |-
      De taken van die afdelingen en de samenstelling en inrichting van haar besturen worden geregeld bij of krachtens
      het reglement.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel52
  - number: '52.3'
    text: |-
      De [artikelen 31 tot en met 39][ref1] zijn van overeenkomstige toepassing ten aanzien van de leden van het
      afdelingsbestuur en zijn vergaderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel31
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '31'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '53'
    text: De secretaris van het waterschap wordt door het algemeen bestuur benoemd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel53
  - number: '54.1'
    text: De bevoegdheid tot schorsing of ontslag van de secretaris berust bij het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel54
  - number: '54.2'
    text: |-
      In spoedeisende gevallen kan het dagelijks bestuur tot schorsing overgaan. Het doet daarvan terstond mededeling
      aan het algemeen bestuur. De schorsing vervalt indien het algemeen bestuur haar niet in een binnen acht weken na de
      datum van het schorsingsbesluit gehouden vergadering bekrachtigt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel54
  - number: '55'
    text: |-
      De secretaris staat het algemeen bestuur, het dagelijks bestuur en de voorzitter ter zijde bij de uitoefening van
      hun taak. Hij is aanwezig in de vergadering van het algemeen bestuur en van het dagelijks bestuur. Hij ondertekent
      de stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan, mede.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel55
  - number: '56.1'
    text: |-
      Het waterschapsbestuur is bevoegd tot regeling en bestuur ter behartiging van de taken die het waterschap in het
      reglement zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel56
  - number: '56.2'
    text: |-
      Regeling en bestuur kunnen van het waterschapsbestuur worden gevorderd bij wet, bij algemene maatregel van bestuur
      of bij provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel56
  - number: '57'
    text: |-
      Onze Minister wie het aangaat en provinciale staten onderscheidenlijk gedeputeerde staten doen het
      waterschapsbestuur desgevraagd mededeling van hun standpunten en voornemens met betrekking tot aangelegenheden
      die voor het waterschap van belang zijn, tenzij het openbaar belang zich daartegen verzet, en bieden het
      waterschapsbestuur desgevraagd de gelegenheid tot overleg over die aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel57
  - number: '58.1'
    text: |-
      Over al hetgeen het waterschap betreft, dient het waterschapsbestuur Onze Ministers en provinciale staten
      onderscheidenlijk gedeputeerde staten desgevraagd van bericht en raad. Dit geschiedt door het dagelijks bestuur van
      het waterschap, tenzij het uitdrukkelijk van het algemeen bestuur wordt verlangd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel58
  - number: '58.2'
    text: |-
      Het verzoek om bericht en raad door een van Onze Ministers geschiedt, evenals in dat geval het dienen van bericht
      en raad, door tussenkomst van gedeputeerde staten, tenzij het enkel het verschaffen van feitelijke inlichtingen
      betreft.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel58
  - number: '59.1'
    text: |-
      Ten aanzien van onderwerpen waarin door een wet, een algemene maatregel van bestuur of een provinciale verordening
      is voorzien, is het waterschapsbestuur bevoegd tot het maken van verordeningen voorzover deze verordeningen met die
      hogere regelingen niet in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel59
  - number: '59.2'
    text: |-
      De bepalingen van verordeningen in het onderwerp waarvan, nadat deze zijn vastgesteld, wordt voorzien door een wet,
      een algemene maatregel van bestuur of een provinciale verordening, houden van rechtswege op te gelden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel59
  - number: '60.1'
    text: |-
      Wanneer het algemeen bestuur of, indien aan het bestuur van een afdeling bevoegdheden van het algemeen bestuur of
      van het dagelijks bestuur zijn toegekend, dat bestuur de door een wet, een algemene maatregel van bestuur of een
      provinciale verordening gevorderde beslissingen niet of niet naar behoren neemt, voorziet het dagelijks bestuur
      daarin.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel60
  - number: '60.2'
    text: |-
      Wanneer het dagelijks bestuur de gevorderde beslissingen niet of niet naar behoren neemt, voorzien gedeputeerde
      staten daarin namens het dagelijks bestuur en ten laste van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel60
  - number: '60.3'
    text: |-
      Spoedeisende gevallen uitgezonderd, vindt het tweede lid geen toepassing dan nadat het dagelijks bestuur in de
      gelegenheid is gesteld binnen een door gedeputeerde staten gestelde termijn alsnog de gevorderde besluiten te
      nemen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel60
  - number: '61.1'
    text: Het waterschapsbestuur is bevoegd tot toepassing van bestuursdwang.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel61
  - number: '61.2'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt uitgeoefend door het dagelijks bestuur, indien toepassing van
      bestuursdwang dient tot handhaving van regels welke het waterschapsbestuur uitvoert.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel61
  - number: '61.3'
    text: |-
      De bevoegdheid tot toepassing van bestuursdwang wordt evenwel uitgeoefend door de voorzitter indien deze met
      gebruikmaking van de in [artikel 96][ref1] omschreven bevoegdheid maatregelen neemt in gevallen van dringend of
      dreigend gevaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel96
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '96'
        hoofdstuk: XII
  - number: '61.4'
    text: |-
      Indien aan de voorzitter of aan het bestuur van een afdeling bevoegdheden zijn toegekend of overgedragen, bezitten
      zij de bevoegdheid tot toepassing van bestuursdwang en de bevoegdheid tot het geven van een machtiging tot het
      binnentreden van een woning slechts indien ook die bevoegdheid uitdrukkelijk is toegekend of overgedragen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel61
  - number: '68'
    text: |-
      In het in [artikel 5:26 van de Algemene wet bestuursrecht][ref1] bedoelde geding op het verzet tegen het dwangbevel
      bezitten leggers, waarin onderhoudsplichtigen zijn aangewezen, behoudens tegenbewijs kracht van bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '70.1'
    text: |-
      In het in [artikel 60, tweede lid][ref1], omschreven geval vindt de toepassing van bestuursdwang plaats door
      gedeputeerde staten namens het waterschapsbestuur en ten laste van het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel60
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '60'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '70.2'
    text: Het waterschap heeft voor het bedrag van de te zijnen laste gebrachte kosten verhaal op de overtreder.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel70
  - number: '70.3'
    text: |-
      [Artikel 5:26 van de Algemene wet bestuursrecht][ref1] en [artikel 68][ref2] zijn alsdan van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel68
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '68'
        hoofdstuk: IX
        paragraaf: '4'
  - number: '73.1'
    text: |-
      Besluiten van het waterschapsbestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer
      zij zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel73
  - number: '73.2'
    text: |-
      Bekendmaking geschiedt door plaatsing in een vanwege het waterschapsbestuur tegen betaling van kosten algemeen
      verkrijgbaar gestelde publicatie en door het doen van mededeling daarvan in een plaatselijk verschijnend dag- of
      nieuwsblad.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel73
  - number: '73.3'
    text: |-
      Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt tevens de dagtekening vermeld van
      het besluit waarbij de goedkeuring is verleend of wordt mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '73.4'
    text: |-
      Besluiten als bedoeld in het eerste lid worden tegelijk met de bekendmaking voor een ieder ter inzage gelegd voor
      de tijd van twaalf weken, op de secretarie van het waterschap of op een andere door het waterschapsbestuur te
      bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel73
  - number: '74'
    text: |-
      De bekend gemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel74
  - number: '75.1'
    text: |-
      In afwijking van [artikel 74][ref1] treden besluiten tot vaststelling of wijziging van een keur niet eerder in
      werking dan nadat de in [artikel 6:7 van de Algemene wet bestuursrecht][ref2] bedoelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '74'
        hoofdstuk: IX
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '75.2'
    text: |-
      De besluiten tot vaststelling of wijziging van de keur worden medegedeeld aan de rechtbank en het gerechtshof onder
      wier rechtsmacht het waterschap valt, aan het parket van die colleges, alsmede aan de colleges van burgemeester en
      wethouders der gemeenten in het gebied waarvan de keur toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel75
  - number: '76'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende regels inhouden, zijn de
      [artikelen 73 tot en met 75][ref1] van overeenkomstige toepassing, met dien verstande dat de in
      [artikel 73, tweede lid][ref2], voorgeschreven mededeling geschiedt binnen één week.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '77'
    text: |-
      De in [artikel 56][ref1] omschreven bevoegdheid tot regeling en bestuur berust bij het algemeen bestuur voor zover
      deze niet bij of krachtens reglement dan wel bij wet of bij algemene maatregel van bestuur is toegekend aan het
      dagelijks bestuur, aan de voorzitter of aan het bestuur van een afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel56
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '56'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '78.1'
    text: |-
      Het algemeen bestuur maakt de verordeningen die het nodig oordeelt voor de behartiging van de taken die het
      waterschap zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel78
  - number: '78.2'
    text: |-
      Tevens stelt het algemeen bestuur vast de legger waarin onderhoudsplichtigen of onderhoudsverplichtingen worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel78
  - number: '79.1'
    text: |-
      Het algemeen bestuur stelt een verordening vast waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en belanghebbenden bij de voorbereiding van de door dat bestuur te nemen besluiten worden betrokken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel79
  - number: '79.2'
    text: |-
      De in het eerste lid bedoelde inspraak wordt verleend door toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], voorzover in de verordening niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '80.1'
    text: |-
      Onverminderd het bepaalde bij een ingevolge [artikel 79, eerste lid][ref1], vastgestelde verordening, wordt
      het ontwerp van het besluit tot vaststelling of wijziging van een keur tegelijk met de terinzagelegging daarvan
      toegezonden aan de besturen van de gemeenten in het gebied waarvan de keur van toepassing zal zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel79
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '79'
        hoofdstuk: X
  - number: '80.2'
    text: |-
      Het besluit tot vaststelling of wijziging van een keur wordt binnen vier weken aan gedeputeerde staten toegezonden,
      met de naar voren gebrachte bedenkingen en het standpunt daaromtrent van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel80
  - number: '81.1'
    text: |-
      Op overtreding van een keur kan als straf worden gesteld hechtenis van ten hoogste drie maanden of geldboete van de
      tweede categorie als bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref1], al dan niet met openbaarmaking
      van de rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '81.2'
    text: De in het eerste lid bedoelde strafbare feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel81
  - number: '81.3'
    text: |-
      Indien tijdens het plegen van de overtreding nog geen jaar is verlopen, sedert een vroegere veroordeling van de
      schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis tot het dubbele van het gestelde
      maximum worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel81
  - number: '82'
    text: Het algemeen bestuur regelt de bezoldiging van de ambtenaren van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel82
  - number: '83.1'
    text: |-
      Het algemeen bestuur kan aan het dagelijks bestuur en aan het bestuur van een afdeling bevoegdheden van het
      algemeen bestuur overdragen, tenzij de aard van de bevoegdheid zich tegen overdracht verzet.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: '83.2'
    text: 'Het algemeen bestuur kan het dagelijks bestuur niet overdragen de bevoegdheid tot:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: 83.2.a
    text: het vaststellen of wijzigen van de begroting;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: 83.2.b
    text: |-
      het vaststellen van de rekening, als bedoeld in [artikel 106][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel106
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '106'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: 83.2.c
    text: |-
      het vaststellen van regels als bedoeld in de [artikelen 108][ref1] en [109][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel109
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '108'
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '109'
        hoofdstuk: XV
  - number: 83.2.d
    text: het heffen van belastingen of rechten;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: 83.2.e
    text: het vaststellen van verordeningen, behoudens het bepaalde in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: 83.2.f
    text: het vaststellen van peilbesluiten;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: 83.2.g
    text: het vaststellen van plannen krachtens bijzondere wetten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: '83.3'
    text: |-
      Het algemeen bestuur kan aan het bestuur van een afdeling niet overdragen de in het tweede lid onder a tot en met e
      omschreven bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: '83.4'
    text: |-
      De bevoegdheid tot het maken van keuren kan het algemeen bestuur slechts overdragen voorzover het betreft de
      vaststelling van nadere regels met betrekking tot bepaalde door het algemeen bestuur in zijn verordeningen
      aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: '83.5'
    text: |-
      De voorschriften met betrekking tot de bevoegdheid van het algemeen bestuur, de uitoefening daarvan en het toezicht
      daarop zijn ten aanzien van de met toepassing van het eerste lid overgedragen bevoegdheden van overeenkomstige
      toepassing, met uitzondering van die betreffende vergaderingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel83
  - number: '84.1'
    text: Het dagelijks bestuur is belast met de dagelijkse aangelegenheden van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel84
  - number: '84.2'
    text: |-
      Het dagelijks bestuur is belast met de voorbereiding van al hetgeen in de vergadering van het algemeen bestuur ter
      overweging en beslissing moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel84
  - number: '84.3'
    text: |-
      Het dagelijks bestuur is belast met de uitvoering van de beslissingen van het algemeen bestuur, tenzij bij het
      reglement de voorzitter hiermede is belast.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel84
  - number: '85.1'
    text: |-
      Met de opsporing van de overtreding van bij keuren strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de bij besluit van het dagelijks bestuur aangewezen
      ambtenaren van het waterschap. Indien bij provinciale verordening het toezicht op de naleving van het bij
      of krachtens die verordening bepaalde is opgedragen aan het dagelijks bestuur, zijn met de opsporing van de
      overtreding daarvan, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2], belast de bij besluit van
      dat bestuur aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '85.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren van het waterschap zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179][ref1] tot en met [182][ref2] en [184 van het Wetboek van Strafrecht][ref3],
      voor zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '85.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren van het waterschap kunnen binnen vier weken nadat proces-verbaal is
      opgemaakt met de betrokkene in schikking treden.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel85
  - number: '85.4'
    text: |-
      De opbrengst van de bij wege van schikking vastgestelde en dienovereenkomstig betaalde bedragen komt ten bate van
      het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel85
  - number: '85.5'
    text: De betaling van het bij schikking bepaalde doet het recht tot strafvordering vervallen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel85
  - number: '86.1'
    text: |-
      Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel86
  - number: '86.2'
    text: |-
      Het dagelijks bestuur is bevoegd, tenzij het algemeen bestuur daaromtrent in voorkomende gevallen een
      beslissing heeft genomen, tot het procederen in kort geding en tot voeging in strafzaken als bedoeld in
      [artikel 51a van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
  - number: '86.3'
    text: |-
      Het dagelijks bestuur is bevoegd, indien ingevolge wettelijk voorschrift aan het waterschap of aan het
      waterschapsbestuur hetzij een recht van beroep hetzij een recht bezwaar te maken toekomt, om spoedshalve beroep in
      te stellen of bezwaar te maken alsmede, voor zover de voorschriften dat toelaten, om schorsing van het aangevochten
      besluit of om een voorlopige voorziening ter zake te verzoeken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel86
  - number: '86.4'
    text: |-
      Tenzij bij reglement anders is bepaald, wordt het ingestelde beroep of het gemaakte bezwaar ingetrokken, indien het
      algemeen bestuur de beslissing van het dagelijks bestuur tot het instellen van beroep of het maken van bezwaar niet
      hetzij in zijn eerstvolgende vergadering, hetzij binnen drie maanden bekrachtigt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel86
  - number: '87.1'
    text: |-
      Het algemeen bestuur kan overeenkomstig het voorstel van het dagelijks bestuur, aan het bestuur van een afdeling
      bevoegdheden van het dagelijks bestuur overdragen voor zover dit bij het reglement is bepaald en de aard van de
      bevoegdheid zich niet tegen overdracht verzet. De bevoegdheid tot het geven van een betalingsopdracht kan alleen
      uitdrukkelijk worden toegekend.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel87
  - number: '87.2'
    text: |-
      De [artikelen 73, tweede lid][ref1], en [83, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel83
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '83'
        hoofdstuk: X
  - number: '88'
    text: Het dagelijks bestuur kan mandaat verlenen aan een of meer leden van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel88
  - number: '89.1'
    text: |-
      De leden van het dagelijks bestuur zijn, tezamen en ieder afzonderlijk, aan het algemeen bestuur verantwoording
      verschuldigd voor het door het dagelijks bestuur gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel89
  - number: '89.2'
    text: |-
      Zij geven het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen voorzover
      het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel89
  - number: '94.1'
    text: De voorzitter bevordert een goede behartiging van de taken van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel94
  - number: '94.2'
    text: |-
      Hij heeft de leiding van de vergaderingen van het algemeen en van het dagelijks bestuur. In de vergadering van het
      algemeen bestuur heeft hij raadgevende stem.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel94
  - number: '94.3'
    text: Hij ondertekent alle stukken welke van het algemeen en het dagelijks bestuur uitgaan.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel94
  - number: '95'
    text: |-
      De voorzitter vertegenwoordigt het waterschap in en buiten rechte. Indien de voorzitter aan een ander machtiging
      verleent tot vertegenwoordiging, behoeft deze machtiging de instemming van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel95
  - number: '96.1'
    text: |-
      Wanneer de omstandigheden geen voorafgaande bijeenroeping van het algemeen bestuur of van het dagelijks bestuur
      gedogen, is de voorzitter bevoegd bij omstandigheden waaronder de veiligheid van een of meer waterstaatswerken,
      of anderszins de goede staat daarvan, in onmiddellijk en ernstig gevaar is of dreigt te komen, al die maatregelen
      te treffen waartoe die besturen bevoegd zijn, zolang deze toestand voortduurt en totdat deze besturen van hun
      bevoegdheid gebruik maken.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel96
  - number: '96.2'
    text: Hij geeft daarvan onverwijld kennis aan het desbetreffende bestuur alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel96
  - number: '97.1'
    text: De voorzitter is het algemeen bestuur verantwoording verschuldigd voor het door hem gevoerde bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel97
  - number: '97.2'
    text: |-
      Hij geeft het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen voorzover
      het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel97
  - number: '98'
    text: |-
      Het waterschap draagt de kosten die zijn verbonden aan de behartiging van de taken die het waterschap in het
      reglement zijn opgedragen. Evenwel worden, voorzover de behartiging van die taken redelijkerwijs moet worden geacht
      het belang van het gebied van het waterschap te boven te gaan op grond dat deze tevens in belangrijke mate is de
      behartiging van een nationaal of provinciaal belang, aan het waterschap bijdragen verleend ten laste van de kas van
      het Rijk onderscheidenlijk die van de desbetreffende provincie of provincies.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel98
  - number: '99.1'
    text: |-
      Voor alle aan het waterschap opgedragen taken brengt het algemeen bestuur jaarlijks op de begroting de bedragen
      die het daarvoor beschikbaar stelt, alsmede de door het waterschap te heffen belastingen, de van het rijk en de
      provincie te ontvangen bijdragen en andere financiële middelen die naar verwachting kunnen worden aangewend.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel99
  - number: '99.2'
    text: De begroting bevat mede een bedrag voor onvoorziene uitgaven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel99
  - number: '99.3'
    text: |-
      De begroting moet in evenwicht zijn. Hiervan kan worden afgeweken indien aannemelijk is dat het evenwicht in de
      eerstkomende jaren zal zijn tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel99
  - number: '99.4'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel99
  - number: '100.1'
    text: |-
      Het dagelijks bestuur biedt jaarlijks tijdig voor de in het vierde lid bedoelde vaststelling, het algemeen bestuur
      een ontwerp van de begroting aan, met een nota betreffende de financiële toestand van het waterschap en, behoudens
      in geval van ontheffing door gedeputeerde staten, een meerjarenraming voor tenminste vier op het begrotingsjaar
      volgende jaren.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel100
  - number: '100.2'
    text: |-
      De in het eerste lid bedoelde stukken liggen, zodra zij aan het algemeen bestuur zijn aangeboden, voor een ieder
      ter inzage op de secretarie van het waterschap of op een andere door het waterschapsbestuur te bepalen plaats. Zij
      worden algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel100
  - number: '100.3'
    text: |-
      De terinzagelegging en verkrijgbaarstelling worden bekend gemaakt. De beraadslaging in het algemeen bestuur over de
      ontwerpbegroting vindt niet plaats binnen twee weken na de datum van de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel100
  - number: '100.4'
    text: Het algemeen bestuur stelt de begroting vast vóór 1 december van het jaar dat voorafgaat aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel100
  - number: '101.1'
    text: |-
      Het besluit tot vaststelling of wijziging van de begroting wordt gedeputeerde staten toegezonden binnen twee weken
      na de vaststelling daarvan, met de in [artikel 100, eerste lid][ref1], genoemde stukken alsmede met eventuele
      bedenkingen en het standpunt daaromtrent van het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel100
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '100'
        hoofdstuk: XIV
        paragraaf: '1'
  - number: '101.2'
    text: |-
      Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar worden
      genomen en worden binnen twee weken na de vaststelling daarvan toegezonden aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel101
  - number: '101.3'
    text: |-
      [Artikel 100, tweede lid][ref1], alsmede, behoudens in gevallen van dringende spoed,
      [artikel 100, derde lid, tweede volzin][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel100
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '100'
        hoofdstuk: XIV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '100'
        hoofdstuk: XIV
        paragraaf: '1'
  - number: '102'
    text: |-
      De begroting, de begrotingswijzigingen en de meerjarenraming worden ingericht overeenkomstig bij of krachtens
      algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel102
  - number: '103'
    text: 'Verplichte uitgaven van het waterschap zijn:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel103
  - number: 103.a
    text: de renten en aflossingen van door het waterschap aangegane geldleningen en alle overige opeisbare schulden;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel103
  - number: 103.b
    text: de uitgaven, bij of krachtens de wet aan het waterschap opgelegd;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel103
  - number: 103.c
    text: |-
      de uitgaven, voortvloeiende uit de van het waterschapsbestuur gevorderde medewerking tot uitvoering van wetten,
      algemene maatregelen van bestuur en provinciale verordeningen, voorzover die uitgaven niet ten laste van anderen
      zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel103
  - number: '104.1'
    text: Indien het algemeen bestuur weigert verplichte uitgaven op de begroting te brengen doen gedeputeerde staten dit.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel104
  - number: '104.2'
    text: |-
      Indien het algemeen bestuur weigert in de dekking van de in het eerste lid bedoelde uitgaven te voorzien,
      verminderen gedeputeerde staten daartoe hetzij het bedrag voor onvoorziene uitgaven hetzij de niet verplichte
      uitgaven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel104
  - number: '104.3'
    text: |-
      Gedeputeerde staten dragen zonodig aan de voor de administratie en het beheer bevoegde ambtenaar de betaling op
      ten laste van het waterschap van hetgeen met toepassing van het eerste lid als verplichte uitgaaf op de begroting
      is gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel104
  - number: '105.1'
    text: |-
      Het dagelijks bestuur legt aan het algemeen bestuur over elk begrotingsjaar verantwoording af van het gevoerde
      financiële beheer, onder overlegging van de rekening. [Artikel 102][ref1] is van overeenkomstige toepassing op de
      inrichting van de rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel102
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '102'
        hoofdstuk: XIV
        paragraaf: '1'
  - number: '105.2'
    text: |-
      Het dagelijks bestuur voegt daarbij een verslag als bedoeld in [artikel 109, tweede lid][ref1],
      alsmede een door het dagelijks bestuur opgemaakt verslag ter verantwoording van het financieel beheer.
      [Artikel 100, tweede en derde lid][ref2], is van overeenkomstige toepassing op de rekening en de in dit lid
      bedoelde stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel109
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel100
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '109'
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '100'
        hoofdstuk: XIV
        paragraaf: '1'
  - number: '106.1'
    text: |-
      Het algemeen bestuur stelt de rekening vast vóór 1 september van het jaar volgend op het begrotingsjaar, behoudens
      ontheffing van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel106
  - number: '106.2'
    text: |-
      Het algemeen bestuur kan uitgaven die te kwader trouw zijn geboekt op een post waarmee zij niet overeenstemmen of
      die anderszins niet rechtmatig zijn gedaan, buiten de rekening laten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel106
  - number: '106.3'
    text: |-
      De leden van het dagelijks bestuur nemen niet deel aan stemmingen over besluiten als bedoeld in het eerste en
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel106
  - number: '106.4'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden ontlast de vastgestelde rekening de leden van het dagelijks
      bestuur ten aanzien van het daarin verantwoorde financiële beheer.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel106
  - number: '107.1'
    text: |-
      Het dagelijks bestuur zendt de rekening vergezeld van de in [artikel 105, tweede lid][ref1], bedoelde stukken en
      eventuele bedenkingen en het standpunt daaromtrent van het algemeen bestuur, binnen twee weken na de vaststelling
      door het algemeen bestuur, aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel105
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '105'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: '107.2'
    text: |-
      Indien [artikel 106, tweede lid][ref1], is toegepast wordt het desbetreffende besluit meegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel106
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '106'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: '107.3'
    text: |-
      Indien uitgaven niet in de vastgestelde rekening zijn opgenomen, zijn de leden van het orgaan dat voor de uitgaaf
      verantwoordelijk is daarvoor persoonlijk aansprakelijk jegens het waterschap, tenzij blijkt dat zij aan het besluit
      niet hebben meegewerkt.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel107
  - number: '107.4'
    text: |-
      Gelijke aansprakelijkheid bestaat voor zover zij te kwader trouw hebben meegewerkt aan het niet of niet tijdig
      innen van vorderingen of andere aan het waterschap toekomende gelden dan wel aan het verlenen van kwijtscheldingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel107
  - number: '107.5'
    text: |-
      Het dagelijks bestuur stelt, zo dikwijls daartoe termen zijn, een rechtsvordering in tot betaling van de krachtens
      het derde en vierde lid verschuldigde gelden, zonder dat daartoe een nadere beslissing is vereist. Indien binnen
      een door de Commissaris van de Koning gestelde termijn geen rechtsvordering is ingesteld, gaat deze daartoe over
      namens en ten laste van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel107
  - number: '108.1'
    text: |-
      Het algemeen bestuur stelt bij verordening regels vast met betrekking tot de organisatie van de administratie
      en van het beheer van vermogenswaarden. Deze regels dienen te waarborgen dat aan de eisen van doelmatigheid en
      controle wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: '108.2'
    text: De verordening wordt binnen twee weken na de vaststelling toegezonden aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: '108.3'
    text: |-
      De administratie en het beheer, bedoeld in het eerste lid, worden verricht door ingevolge die verordening aan te
      wijzen ambtenaren. De secretaris kan niet worden aangewezen, behoudens ontheffing van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: '108.4'
    text: |-
      De regels, bedoeld in het eerste lid, voorzien in een financieringsstatuut, waarin in ieder geval regels zijn
      opgenomen ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: 108.4.a
    text: de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: 108.4.b
    text: |-
      de administratieve organisatie van de financieringsfunctie, waaronder begrepen taken en bevoegdheden, de
      verantwoordingsrelaties en de bijbehorende informatievoorziening.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: '108.5'
    text: |-
      Gedeputeerde staten kunnen te allen tijde een onderzoek instellen naar de wijze waarop de administratie en het
      beheer, bedoeld in het eerste lid, worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel108
  - number: '109.1'
    text: |-
      Het algemeen bestuur stelt bij verordening regels vast met betrekking tot de controle op de administratie en
      op het beheer van vermogensvoorwaarden. De regels dienen onder meer te waarborgen dat de rechtmatigheid en de
      doelmatigheid van de administratie en het beheer worden getoetst.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel109
  - number: '109.2'
    text: |-
      De regels, bedoeld in het eerste lid, voorzien onder meer in de aanwijzing van een of meer accountants als bedoeld
      in [artikel 2:393 van het Burgerlijk Wetboek](onbekend) belast met het onderzoek van de rekening alsmede met het
      ter zake uitbrengen van een verslag, dat behalve de verklaring bij de rekening bevindingen bevat over de vraag of
      de administratie en het beheer voldoen aan de eisen van rechtmatigheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel109
  - number: '110'
    text: |-
      Het algemeen bestuur besluit tot het invoeren, wijzigen of afschaffen van een waterschapsbelasting door het
      vaststellen van een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel110
  - number: '111'
    text: |-
      De belastingverordening vermeldt in de daartoe leidende gevallen de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, en hetgeen
      overigens voor de heffing en de invordering van belang is, alsmede het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel111
  - number: '113.1'
    text: |-
      Behalve de belastingen of rechten waarvan de heffing krachtens bijzondere wetten geschiedt, worden door het
      waterschap geen andere belastingen en rechten geheven dan de precariobelasting, bedoeld in [artikel 114][ref1], de
      rechten, bedoeld in [artikel 115][ref2], en de omslagen, bedoeld in [artikel 116][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '114'
        hoofdstuk: XVI
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '115'
        hoofdstuk: XVI
      - id: ref3
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '113.2'
    text: |-
      Met omslagen worden gelijkgesteld bijdragen die op grond van het reglement in de plaats treden van het voldoen
      aan de in de legger, bedoeld in [artikel 78, tweede lid][ref1], opgenomen verplichtingen tot onderhoud van
      waterstaatswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel78
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '78'
        hoofdstuk: X
  - number: '114'
    text: |-
      Het waterschap kan een precariobelasting heffen voor het hebben van voorwerpen onder, op of boven grond of water
      van het waterschap, voor de openbare dienst bestemd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel114
  - number: '115.1'
    text: 'Het waterschap kan alleen rechten heffen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
  - number: 115.1.a
    text: |-
      het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde bezittingen van het waterschap of van
      voor de openbare dienst bestemde werken of inrichtingen die bij het waterschap in beheer of in onderhoud zijn;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
  - number: 115.1.b
    text: |-
      het genot van door of vanwege het bestuur van het waterschap verstrekte diensten, tenzij deze bestaan in het
      tijdelijk ter beschikking van particulieren stellen van personeel van het waterschap;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
  - number: 115.1.c
    text: het behandelen van verzoeken tot het verlenen van vergunningen of ontheffingen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
  - number: '115.2'
    text: |-
      Voor de toepassing van dit hoofdstuk en van [hoofdstuk XVIII][ref1] worden de in het eerste lid bedoelde rechten
      aangemerkt als waterschapsbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: '115.3'
    text: |-
      In verordeningen op grond waarvan rechten als bedoeld in het eerste lid worden geheven, worden de tarieven zodanig
      vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel115
  - number: '116'
    text: |-
      Ter bestrijding van kosten die zijn verbonden aan de behartiging van taken die het waterschap zijn opgedragen
      kunnen enkel omslagen worden geheven van hen die:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: 116.a
    text: krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: 116.b
    text: |-
      krachtens eigendom, bezit, beperkt recht of krachtens een door de grondkamer goedgekeurde pachtovereenkomst het
      gebruik hebben van ongebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: 116.c
    text: krachtens eigendom, bezit of beperkt recht het genot hebben van gebouwde onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: 116.d
    text: ingezetenen zijn;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: 116.e
    text: |-
      krachtens eigendom, bezit, beperkt recht of persoonlijk recht het gebruik hebben van gebouwde onroerende zaken
      als bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel116
  - number: '117.1'
    text: |-
      Voor de omslagen, bedoeld in [artikel 116, onderdelen ][ref1], wordt aangemerkt als één gebouwde onroerende zaak:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: 117.1.a
    text: een gebouwd eigendom;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.1.b
    text: |-
      een gedeelte van een gebouwd eigendom dat blijkens zijn indeling is bestemd om als een afzonderlijk geheel te
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.1.c
    text: |-
      een samenstel van twee of meer van de in onderdeel *a* bedoelde gebouwde eigendommen of van in onderdeel *b*
      bedoelde gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden
      beoordeeld, bij elkaar behoren;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.1.d
    text: |-
      het binnen het gebied van een gemeente gelegen deel van een in onderdeel a bedoeld eigendom, van een in onderdeel
      *b* bedoeld gedeelte of van een in onderdeel *c* bedoeld samenstel;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.1.e
    text: |-
      het binnen het gebied van het waterschap gelegen deel van een in onderdeel *a* bedoeld eigendom, van een in
      onderdeel *b* bedoeld gedeelte, van een in onderdeel *c* bedoeld samenstel of van een in onderdeel *d* bedoeld
      deel.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: '117.2'
    text: |-
      Voor de toepassing van het eerste lid maken de ongebouwde eigendommen voorzover die dienstbaar zijn aan een
      gebouwd eigendom, aan een gedeelte van een gebouwd eigendom of aan een samenstel van gebouwde eigendommen, als
      bedoeld in onderdeel *a*, onderscheidenlijk onderdeel *b* of onderdeel *c*, van dat lid, deel uit van de gebouwde
      onroerende zaak, met uitzondering van de ongebouwde eigendommen, voor zover de waarde daarvan bij de waardebepaling
      op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] op basis van het bepaalde krachtens
      [artikel 18, derde lid, van die wet][ref2] buiten aanmerking wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
  - number: '117.3'
    text: |-
      Voor de omslagen, bedoeld in [artikel 116, onderdelen ][ref1], wordt aangemerkt als één ongebouwde onroerende zaak:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: 117.3.a
    text: een ongebouwd eigendom dat niet dienstbaar is aan een gebouwd eigendom of een gedeelte daarvan;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.3.b
    text: |-
      een ongebouwd eigendom, voor zover de waarde daarvan bij de waardebepaling op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] op basis van het bepaalde krachtens
      [artikel 18, derde lid, van die wet][ref2] buiten aanmerking wordt gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
  - number: 117.3.c
    text: |-
      het binnen het gebied van het waterschap gelegen deel van een in onderdeel *a* of in onderdeel *b* bedoeld
      eigendom.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: '117.4'
    text: |-
      In afwijking van het derde lid kan, indien de belastingverordening zulks bepaalt, worden aangemerkt als één
      ongebouwde onroerende zaak:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.4.a
    text: |-
      een samenstel van twee of meer ongebouwde eigendommen die bij dezelfde belastingplichtige in gebruik zijn en die,
      naar de omstandigheden beoordeeld, bij elkaar behoren;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: 117.4.b
    text: |-
      een kadastraal perceel of gedeelte daarvan, met dien verstande dat hetgeen wordt aangemerkt als een gebouwde
      onroerende zaak niet in aanmerking wordt genomen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
  - number: '117.5'
    text: |-
      Voor de omslagen, bedoeld in [artikel 116][ref1], worden openbare land- en waterwegen en banen voor openbaar
      vervoer per rail, één en ander met inbegrip van kunstwerken, alsmede waterverdedigingswerken die worden beheerd
      door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen van
      zodanige werken die dienen als woning, als ongebouwde eigendommen aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '118.1'
    text: |-
      Voor de toepassing van [artikel 116, onderdelen ][ref1], wordt als genothebbende van een ongebouwde danwel een
      gebouwde onroerende zaak krachtens eigendom, bezit of beperkt recht aangemerkt degene die bij het begin van het
      kalenderjaar als zodanig in de desbetreffende kadastrale registratie is vermeld, tenzij blijkt dat hij op dat
      tijdstip geen genothebbende krachtens eigendom, bezit of beperkt recht is.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '118.2'
    text: |-
      Voor de toepassing van [artikel 116, onderdeel ][ref1], wordt als gebruiker van een ongebouwde onroerende zaak
      krachtens eigendom, bezit of beperkt recht, dan wel krachtens pachtovereenkomst, aangemerkt degene die bij het
      begin van het kalenderjaar als genothebbende krachtens eigendom, bezit of beperkt recht zelf het gebruik heeft,
      onderscheidenlijk het gebruik heeft krachtens een door de grondkamer goedgekeurde pachtovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '118.3'
    text: |-
      Voor de toepassing van [artikel 116, onderdeel d,][ref1] wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: 118.3.a
    text: |-
      als ingezetene degene die blijkens de gemeentelijke basisadministratie persoonsgegevens bij het begin van het
      belastingjaar woonplaats heeft in het gebied van het waterschap en die aldaar gebruik heeft van woonruimte, met
      dien verstande dat gebruik van woonruimte door de leden van een gezamenlijke huishouding wordt aangemerkt als
      gebruik door een door de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap aan
      te wijzen lid van dat huishouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 118.3.b
    text: |-
      woonruimte: een ruimte die blijkens zijn inrichting bestemd is om als afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
  - number: '118.4'
    text: |-
      Voor de toepassing van [artikel 116, onderdeel ][ref1], wordt als gebruiker van bedrijfsruimte aangemerkt degene
      die bij het begin van het kalenderjaar in het gebied van het waterschap het gebruik heeft van een gebouwde
      onroerende zaak of van een gedeelte daarvan als bedrijfsruimte, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: 118.4.a
    text: |-
      gebruik door degene aan wie een deel van een gebouwde onroerende zaak in gebruik is gegeven, wordt aangemerkt
      als gebruik door degene die dat deel in gebruik heeft gegeven, waarbij deze bevoegd is de omslag als zodanig te
      verhalen op degene aan wie deze het deel in gebruik heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
  - number: 118.4.b
    text: |-
      het ter beschikking stellen van een gebouwde onroerende zaak voor volgtijdig gebruik wordt aangemerkt als gebruik
      door degene die die zaak ter beschikking heeft gesteld, waarbij deze bevoegd is de omslag als zodanig te verhalen
      op degene aan wie deze de zaak ter beschikking heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
  - number: '118.5'
    text: |-
      Voor de toepassing van [artikel 116, onderdelen ][ref1], wordt, ingeval van verschillende soorten van genot
      krachtens beperkt recht alleen het genot van het beperkte recht waaraan ingevolge [artikel 24][ref2] stemrecht is
      verbonden, in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel24
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '118.6'
    text: |-
      Indien van een ongebouwde onroerende zaak niet blijkt dat het gebruik daarvan een gebruik is in de zin van
      [artikel 116, onderdeel ][ref1], wordt voor de toepassing van die bepaling degene die van die onroerende zaak het
      genot heeft krachtens eigendom, bezit of beperkt recht aangemerkt als tevens zijnde degene die het gebruik heeft
      krachtens eigendom, bezit of beperkt recht.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '119.1'
    text: |-
      Het algemeen bestuur stelt ten behoeve van de in [artikel 116][ref1] bedoelde omslagen een verordening vast,
      waarin, zoveel mogelijk naar onderscheid van de taken die het waterschap ter behartiging zijn opgedragen, voor elk
      van de categorieën van belanghebbenden die in dat bestuur zijn vertegenwoordigd, de toedeling van het kostendeel
      is opgenomen. Bij die verordening kan worden bepaald dat, in afwijking van de vorige volzin, kosten van heffing
      en invordering van waterschapsbelastingen en kosten van de verkiezing van de leden van het algemeen bestuur
      rechtstreeks worden toegerekend aan de betrokken categorieën van belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '119.2'
    text: |-
      Indien aan de categorieën van belanghebbenden, bedoeld in [artikel 11, tweede lid, onderdelen ][ref1], kosten
      worden toegedeeld voor eenzelfde taak, kan alleen een gezamenlijk kostendeel worden opgenomen, onverminderd het
      bepaalde in [artikel 116, onderdelen ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '119.3'
    text: |-
      Bij reglement kan worden omschreven welke uitgangspunten bij de toedeling van kostendelen in elk geval in acht
      dienen te worden genomen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
  - number: '119.4'
    text: |-
      De in het eerste lid bedoelde verordening behoeft de goedkeuring van gedeputeerde staten. Het besluit tot
      vaststelling van de verordening wordt binnen vier weken na de vaststelling toegezonden aan gedeputeerde staten, met
      de naar voren gebrachte bedenkingen en het standpunt daaromtrent van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
  - number: '119.5'
    text: De in het eerste lid bedoelde verordening wordt tenminste eenmaal in de vijf jaren herzien.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
  - number: '119.6'
    text: |-
      Bij de toepassing van de voorgaande leden worden in aanmerking genomen de aard en de omvang van het belang of
      de belangen van de onderscheidene categorieën van belanghebbenden bij de behartiging van de taken waarmee het
      waterschap is belast.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel119
  - number: '120.1'
    text: Voor de omslagen ter zake van ongebouwde onroerende zaken geldt als heffingsmaatstaf de oppervlakte.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
  - number: '120.2'
    text: |-
      Voor de omslagen ter zake van gebouwde onroerende zaken is, indien de gebouwde onroerende zaak tevens een
      onroerende zaak is als bedoeld in [hoofdstuk III van de Wet waardering onroerende zaken][ref1], de heffingsmaatstaf
      de op de voet van [hoofdstuk IV van die wet][ref2] voor de onroerende zaak vastgestelde waarde voor het
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '120.3'
    text: |-
      In afwijking in zoverre van het tweede lid wordt bij de bepaling van de heffingsmaatstaf voor de omslagen
      ter zake van gebouwde onroerende zaken de waarde van onroerende zaken of onderdelen daarvan als bedoeld in
      [artikel 220d, eerste lid, onderdelen c, h en j, van de Gemeentewet][ref1] en van waterbeheersingswerken die worden
      beheerd door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen
      die dienen als woning, buiten aanmerking gelaten, voor zover dit niet reeds is geschied bij de bepaling van de in
      het tweede lid bedoelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220d
  - number: '120.4'
    text: |-
      Bij de toepassing van het derde lid is het bepaalde bij of krachtens de [artikelen 17][ref1], [18][ref2] en
      [20, tweede lid, van de Wet waardering onroerende zaken][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0007119
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
  - number: '120.5'
    text: |-
      Voor de omslagen ter zake van gebouwde onroerende zaken die deel uitmaken van een onroerende zaak als bedoeld in
      [hoofdstuk III van de Wet waardering onroerende zaken][ref1] wordt de heffingsmaatstaf gesteld op het gedeelte van
      de op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] vastgestelde waarde dat kan worden
      toegekend aan de gebouwde onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0007119
        hoofdstuk: IV
  - number: '120.6'
    text: |-
      Indien het tweede of vijfde lid geen toepassing kan vinden door het ontbreken van een op de voet van
      [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] vastgestelde waarde, wordt de heffingsmaatstaf
      van die gebouwde onroerende zaak bepaald met toepassing van het derde en vierde lid en met overeenkomstige
      toepassing van het vijfde lid alsmede van het bepaalde bij of krachtens de [artikelen 16 tot en met 18][ref2] en
      [20, tweede lid, van de Wet waardering onroerende zaken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0007119#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel20
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0007119
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007119
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0007119
        artikel: '20'
  - number: '120.7'
    text: |-
      Met betrekking tot de bepaling van de heffingsmaatstaf, bedoeld in het eerste of tweede lid, kan het algemeen
      bestuur een verordening vaststellen, waarin omslagklassen voor onroerende zaken worden ingesteld om te voorkomen
      dat verschillen in hoedanigheid of ligging leiden tot onevenredig voor- of nadeel voor de omslagplichtigen.
      Voorzover zodanige verschillen leiden tot een verschil in belang van meer dan 50% of van minder dan 25% wordt dat
      verschil in elk geval aangemerkt als onevenredig onderscheidenlijk niet onevenredig. Op de in de eerste volzin
      bedoelde verordening is [artikel 119, vierde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel119
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '119'
        hoofdstuk: XVII
  - number: '120.8'
    text: Het tarief per eenheid van de heffingsmaatstaf is gelijk.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel120
  - number: '121'
    text: |-
      De omslag bedoeld in [artikel 116, onderdeel ][ref1], wordt vastgesteld op een gelijk bedrag per woonruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '122.1'
    text: Het bedrag aan omslag wordt per aanslag niet afgerond.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel122
  - number: '122.2'
    text: Aanslagen die een bij de belastingverordening te bepalen bedrag niet te boven gaan worden niet opgelegd.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel122
  - number: '122.3'
    text: |-
      Voor de toepassing van het eerste en het tweede lid wordt het totaal van de op één aanslagbiljet verenigde
      aanslagen aangemerkt als één aanslag.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel122
  - number: '123.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: 123.1.a
    text: |-
      waterschapsbelastingen: de belastingen die het waterschap heft, bedoeld in [artikel 113][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel113
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '113'
        hoofdstuk: XVI
  - number: 123.1.b
    text: |-
      Algemene wet: [Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 123.1.c
    text: 'heffing op andere wijze : heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op aangifte.'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: '123.2'
    text: |-
      Onverminderd het overigens in dit hoofdstuk bepaalde geschieden de heffing en de invordering van
      waterschapsbelastingen met toepassing van de Algemene wet, de [Invorderingswet 1990][ref1] en de
      [Kostenwet invordering rijksbelastingen][ref2] als waren die belastingen rijksbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
  - number: '123.3'
    text: |-
      Onverminderd het overigens in dit hoofdstuk bepaalde, gelden de bevoegdheden en verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref1], de [Invorderingswet 1990][ref2] en de
      [Kostenwet invordering rijksbelastingen][ref3] genoemde functionarissen, met betrekking tot de
      waterschapsbelastingen voor de daarachter genoemde colleges of functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0002645
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0002645
  - number: 123.3.a
    text: 'Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het dagelijks bestuur;'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: 123.3.b
    text: 'de inspecteur: de daartoe aangewezen ambtenaar van het waterschap;'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: 123.3.c
    text: |-
      de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de ambtenaar van het waterschap, belast met de
      invordering van waterschapsbelastingen;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: 123.3.d
    text: |-
      de ambtenaren van de rijksbelastingdienst: de ambtenaren van het waterschap, belast met de heffing of de
      invordering van waterschapsbelastingen;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: 123.3.e
    text: |-
      belastingdeurwaarder: de daartoe door het dagelijks bestuur aangewezen ambtenaar van het waterschap,
      dan wel een als belastingdeurwaarder van het waterschap aangewezen gerechtsdeurwaarder, bedoeld in de
      [Gerechtsdeurwaarderswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012197
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0012197
  - number: 123.3.f
    text: 'de Tweede Kamer der Staten-Generaal of de Tweede Kamer: het algemeen bestuur.'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
  - number: '123.4'
    text: |-
      Onverminderd het overigens in dit hoofdstuk bepaalde wordt met betrekking tot waterschapsbelastingen in de
      [Algemene wet][ref1] en in de [Invorderingswet 1990][ref2] voor algemene maatregel van bestuur en voor ministeriële
      regeling gelezen: besluit van het dagelijks bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '123.5'
    text: |-
      Met betrekking tot waterschapsbelastingen wordt in de [artikelen 27l][ref1], [27n][ref2], [27p][ref3] en
      [29b van de Algemene wet][ref4] voor «de Staat» gelezen: het waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel27l
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel27n
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel27p
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel29b
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 27l
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 27n
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 27p
      - id: ref4
        bwb_id: BWBR0002320
        artikel: 29b
  - number: '124.1'
    text: |-
      Het dagelijks bestuur kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      [artikel 8, eerste lid, van de Invorderingswet 1990][ref1], voor de in [artikel 123, derde lid, onderdeel c][ref2],
      bedoelde ambtenaar van het waterschap, een andere ambtenaar van het waterschap in de plaats treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '124.2'
    text: |-
      De dagelijkse besturen van twee of meer waterschappen kunnen met betrekking tot een of meer waterschapsbelastingen
      bepalen dat het dagelijks bestuur van één van die waterschappen voor de uitvoering van enige wettelijke bepaling
      betreffende de heffing of invordering van waterschapsbelastingen in de plaats treedt van het andere dagelijks
      bestuur onderscheidenlijk van die andere dagelijkse besturen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
  - number: '124.3'
    text: |-
      De dagelijkse besturen van twee of meer waterschappen kunnen met betrekking tot een of meer waterschapsbelastingen
      bepalen dat daartoe aangewezen ambtenaren van één van die waterschappen worden aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
  - number: 124.3.a
    text: |-
      de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van die waterschappen voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.3.b
    text: |-
      de in [artikel 123, derde lid, onderdeel c][ref1], bedoelde ambtenaar van die waterschappen voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.3.c
    text: |-
      de in [artikel 123, derde lid, onderdeel d][ref1], bedoelde ambtenaren van die waterschappen voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.3.d
    text: |-
      de in [artikel 123, derde lid, onderdeel e][ref1], bedoelde ambtenaar van die waterschappen voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '124.4'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het waterschap waarvan
      de ambtenaar belast met de invordering van waterschapsbelastingen op grond van het derde lid, onderdeel *b*, wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
  - number: '124.5'
    text: |-
      Indien voor de heffing of de invordering van een of meer waterschapsbelastingen een gemeenschappelijke regeling is
      getroffen en bij die regeling een openbaar lichaam is ingesteld, kan bij of krachtens die regeling worden bepaald
      dat een daartoe aangewezen ambtenaar van dat openbaar lichaam wordt aangewezen als:
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
  - number: 124.5.a
    text: |-
      de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.5.b
    text: |-
      de in [artikel 123, derde lid, onderdeel c][ref1], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.5.c
    text: |-
      de in [artikel 123, derde lid, onderdeel d][ref1], bedoelde ambtenaren van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van waterschapsbelastingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: 124.5.d
    text: |-
      de in [artikel 123, derde lid, onderdeel e][ref1], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '124.6'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      waarvan een ambtenaar op grond van het vijfde lid, onderdeel *b*, wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel124
  - number: '125'
    text: |-
      Waterschapsbelastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op andere
      wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125
  - number: 125a.1
    text: |-
      Indien de waterschapsbelastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke wijze
      deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het dagelijks bestuur omtrent de uitvoering van een en ander nadere
      regels geeft.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125a
  - number: 125a.2
    text: |-
      De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1] en de
      [Invorderingswet 1990][ref2] aangemerkt als bij wege van aanslag geheven belastingen, met dien verstande dat wordt
      verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: 125a.2.a
    text: |-
      de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125a
  - number: 125a.2.b
    text: 'het aanslagbiljet: de kennisgeving van het in onderdeel *a*bedoelde bedrag;'
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125a
  - number: 125a.2.c
    text: |-
      de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.
    url: https://wetten.overheid.nl/BWBR0005108/2007-01-01#Artikel125a
  - number: '126'
    text: |-
      Bij de heffing van waterschapsbelastingen blijven van de [Algemene wet][ref1] buiten toepassing
      de [artikelen 2, vierde lid][ref2], [3][ref3], [37 tot en met 39][ref4], [47a][ref5], [48][ref6],
      [52][ref7], [53][ref8], [54][ref9], [55][ref10], [62][ref11], [71][ref12], [76][ref13],
      [80, tweede, derde en vierde lid][ref14], [82][ref15], [84][ref16], [86][ref17], [87][ref18] en
      [90 tot en met 95][ref19]. Bij de heffing van waterschapsbelastingen die op andere wijze worden geheven, blijven
      bovendien de [artikelen 5][ref20], [6 tot en met 9][ref21], [11, tweede lid][ref22], en [12 van die wet][ref23]
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel3
