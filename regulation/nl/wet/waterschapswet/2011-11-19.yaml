  - number: 109a
    text: |-
      1 Het dagelijks bestuur verricht periodiek onderzoek naar de doelmatigheid en de doeltreffendheid van het door hem
      gevoerde bestuur. Het algemeen bestuur kan bij verordening hierover regels stellen.

      2 Het dagelijks bestuur brengt schriftelijk verslag uit aan het algemeen bestuur van de resultaten van de
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel109a
  - number: 109b
    text: |-
      Het dagelijks bestuur zendt de verordeningen, bedoeld in de [artikelen 108][ref1], [109][ref2] en [109a][ref3],
      binnen twee weken na vaststelling door het algemeen bestuur aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel109
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel109a
