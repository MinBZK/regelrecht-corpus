      In afwijking van [artikel 16][ref1], worden de leden van het algemeen bestuur van een in te stellen waterschap
      gekozen door degenen die op de dag van kandidaatstelling volgens de gemeentelijke basisadministratie
      persoonsgegevens woonachtig zijn in het gebied van het in te stellen waterschap en uiterlijk op de laatste dag van
      de stemmingsperiode achttien jaar of ouder zijn.


