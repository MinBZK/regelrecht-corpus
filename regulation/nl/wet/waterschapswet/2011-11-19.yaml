  - number: '125'
    text: |-
      Waterschapsbelastingen kunnen worden geheven bij wege van aanslag, bij wege van voldoening op aangifte of op andere
      wijze, doch niet bij wege van afdracht op aangifte.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel125
  - number: 125a
    text: |-
      1 Indien de waterschapsbelastingen op andere wijze worden geheven, bepaalt de belastingverordening op welke
      wijze deze worden geheven en de wijze waarop de belastingschuld aan de belastingplichtige wordt bekendgemaakt. De
      belastingverordening kan daarnaast bepalen dat het dagelijks bestuur omtrent de uitvoering van een en ander nadere
      regels geeft.

      2 De op andere wijze geheven belastingen worden voor de toepassing van de [Algemene wet][ref1] en de
      [Invorderingswet 1990][ref2] aangemerkt als bij wege van aanslag geheven belastingen, met dien verstande dat wordt
      verstaan onder:

      a. de aanslag, de voorlopige aanslag, de navorderingsaanslag: het gevorderde, onderscheidenlijk het voorlopig
      gevorderde, het nagevorderde bedrag;

      b. het aanslagbiljet: de kennisgeving van het in onderdeel *a*bedoelde bedrag;

      c. de dagtekening van het aanslagbiljet: de dagtekening van de schriftelijke kennisgeving van het in onderdeel *a*
      bedoelde bedrag, of bij gebreke van een schriftelijke kennisgeving, de datum waarop het bedrag op andere wijze ter
      kennis van de belastingplichtige is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel125a
    references:
