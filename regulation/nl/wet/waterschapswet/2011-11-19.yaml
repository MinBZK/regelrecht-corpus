  - number: '114'
    text: |-
      Het waterschap kan een precariobelasting heffen voor het hebben van voorwerpen onder, op of boven grond of water
      van het waterschap, voor de openbare dienst bestemd.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel114
  - number: '115'
    text: |-
      1 Het waterschap kan alleen rechten heffen ter zake van:

      a. het gebruik overeenkomstig de bestemming van voor de openbare dienst bestemde bezittingen van het waterschap of
      van voor de openbare dienst bestemde werken of inrichtingen die bij het waterschap in beheer of in onderhoud zijn;

      b. het genot van door of vanwege het bestuur van het waterschap verstrekte diensten;

      c. het behandelen van verzoeken tot het verlenen van vergunningen of ontheffingen.

      2 Voor de toepassing van dit hoofdstuk en van [hoofdstuk XVIII][ref1] worden de in het eerste lid bedoelde rechten
      aangemerkt als waterschapsbelastingen.

      3 In verordeningen op grond waarvan rechten als bedoeld in het eerste lid worden geheven, worden de tarieven
      zodanig vastgesteld dat de geraamde baten van de rechten niet uitgaan boven de geraamde lasten ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIII
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0005108
        hoofdstuk: XVIII
  - number: 115a
    text: |-
      1 Een aanslag die een bij de belastingverordening te bepalen bedrag niet te boven gaat, wordt niet opgelegd.

      2 Voor de toepassing van het eerste lid wordt het totaal van de op één aanslagbiljet verenigde aanslagen aangemerkt
      als één aanslag.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel115a
  - number: '116'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. ingezetene: degene die blijkens de gemeentelijke basisadministratie persoonsgegevens bij het begin van het
      kalenderjaar woonplaats heeft in het gebied van het waterschap en die aldaar gebruik heeft van woonruimte, met dien
      verstande dat gebruik van woonruimte door de leden van een gezamenlijke huishouding wordt aangemerkt als gebruik
      door een lid van dat huishouden, dat wordt aangewezen door de in [artikel 123, derde lid, onderdeel b][ref1],
      bedoelde ambtenaar van het waterschap;

      b. woonruimte: een ruimte die blijkens zijn inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven;

      c. natuurterreinen: ongebouwde onroerende zaken waarvan de inrichting en het beheer geheel of nagenoeg geheel en
      duurzaam zijn afgestemd op het behoud of de ontwikkeling van natuur. Onder natuurterreinen worden mede verstaan
      bossen en open wateren met een oppervlakte van ten minste één hectare.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '117'
    text: |-
      1 Ter bestrijding van kosten die zijn verbonden aan de zorg voor het watersysteem wordt onder de naam
      watersysteemheffing een heffing geheven van hen die:

      a. ingezetenen zijn;

      b. krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken, niet zijnde
      natuurterreinen;

      c. krachtens eigendom, bezit of beperkt recht het genot hebben van natuurterreinen;

      d. krachtens eigendom, bezit of beperkt recht het genot hebben van gebouwde onroerende zaken.

      2 Uit de opbrengsten van de watersysteemheffing worden tevens de op grond van [artikel 7.24 van de Waterwet][ref1]
      verschuldigde bijdragen bekostigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.24
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7.24'
  - number: '118'
    text: |-
      1 Als één gebouwde onroerende zaak als bedoeld in [artikel 117, onderdeel d][ref1], wordt aangemerkt:

      a. een gebouwd eigendom;

      b. een gedeelte van een gebouwd eigendom dat blijkens zijn indeling is bestemd om als een afzonderlijk geheel te
      worden gebruikt;

      c. een samenstel van twee of meer van de in onderdeel a bedoelde gebouwde eigendommen of van in onderdeel b
      bedoelde gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden
      beoordeeld, bij elkaar behoren;

      d. het binnen het gebied van een gemeente gelegen deel van een in onderdeel a bedoeld eigendom, van een in
      onderdeel b bedoeld gedeelte of van een in onderdeel c bedoeld samenstel;

      e. het binnen het gebied van het waterschap gelegen deel van een in onderdeel a bedoeld eigendom, van een in
      onderdeel b bedoeld gedeelte, van een in onderdeel c bedoeld samenstel of van een in onderdeel d bedoeld deel.

      2 Voor de toepassing van het eerste lid maken de ongebouwde eigendommen voorzover die een samenstel vormen met
      een gebouwd eigendom als bedoeld in het eerste lid, onderdeel a tot en met e, deel uit van de gebouwde onroerende
      zaak, met uitzondering van de ongebouwde eigendommen, voorzover de waarde daarvan bij de waardebepaling op
      de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] op basis van het bepaalde krachtens
      [18, derde lid, van die wet][ref3] buiten aanmerking wordt gelaten.

      3 Als één ongebouwde onroerende zaak als bedoeld in [artikel 117, onderdeel b][ref4], wordt aangemerkt een
      kadastraal perceel of gedeelte daarvan, met dien verstande dat buiten aanmerking wordt gelaten:

      a. hetgeen ingevolge het eerste en tweede lid wordt aangemerkt als een gebouwde onroerende zaak;

      b. een natuurterrein.

      4 Als één natuurterrein wordt aangemerkt een kadastraal perceel of gedeelte daarvan, met dien verstande dat buiten
      aanmerking wordt gelaten:

      a. hetgeen ingevolge het eerste en tweede lid wordt aangemerkt als een gebouwde onroerende zaak;

      b. hetgeen ingevolge het derde lid wordt aangemerkt als een ongebouwde onroerende zaak.

      5 Voor de heffing, bedoeld in [artikel 117][ref5], worden openbare land- en waterwegen en banen voor openbaar
      vervoer per rail, één en ander met inbegrip van kunstwerken, alsmede waterverdedigingswerken die worden beheerd
      door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen van
      zodanige werken die dienen als woning, aangemerkt als ongebouwde eigendommen, niet zijnde natuurterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel117
