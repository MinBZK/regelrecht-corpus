  - number: '42'
    text: |-
      1 De vergaderingen van het dagelijks bestuur worden met gesloten deuren gehouden, voor zover het dagelijks bestuur
      niet anders heeft bepaald.

      2 Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel42
  - number: '43'
    text: |-
      1 Het dagelijks bestuur kan op grond van een belang, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], geheimhouding opleggen omtrent het in een besloten
      vergadering behandelde en omtrent de inhoud van de stukken die aan de vergadering worden overgelegd. Geheimhouding
      omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De geheimhouding wordt
      zowel door hen die bij de behandeling aanwezig waren als door hen die op andere wijze van het behandelde of van de
      stukken kennis nemen, in acht genomen totdat het dagelijks bestuur haar opheft.

      2 Op grond van een belang genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref2], kan de geheimhouding
      eveneens worden opgelegd door de voorzitter of een commissie van het waterschap, ieder ten aanzien van de stukken
      die zij aan het dagelijks bestuur of de leden van dit bestuur overleggen. Daarvan wordt op de stukken melding
      gemaakt.

      3 Indien het dagelijks bestuur zich ter zake van het behandelde waarvoor een verplichting tot geheimhouding geldt
      tot het algemeen bestuur heeft gericht, wordt de geheimhouding in acht genomen totdat het algemeen bestuur haar
      opheft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
