        paragraaf: '1'
  - number: '14'
    text: |-
      1 De vertegenwoordigers van de categorie van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdeel b][ref1], worden benoemd door de daartoe bij reglement aangewezen organisatie
      of organisaties. Indien meer dan één organisatie wordt aangewezen wordt bij reglement bepaald op welke wijze de
      aangewezen organisaties tot een benoeming komen.

      2 De vertegenwoordigers van de categorie van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdeel c][ref2], worden benoemd door een krachtens
      [artikel 67 van de Wet op de bedrijfsorganisatie][ref3] ingesteld bedrijfslichaam voor de bosbouw, het bosbeheer en
      de houtteelt.

      3 De vertegenwoordigers van de categorie van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdeel d][ref4], worden benoemd door de in het gebied van het waterschap bevoegde
      Kamer van Koophandel en Fabrieken. Indien binnen het gebied van een waterschap meer dan één Kamer van Koophandel en
      Fabrieken bevoegd zijn, wordt bij reglement bepaald op welke wijze de Kamers tot een benoeming komen.

      4 De organisaties, bedoeld in de voorgaande leden, voorzien tijdig in een regeling omtrent de selectie en de
      benoeming van de vertegenwoordiger of vertegenwoordigers van de desbetreffende categorie van belanghebbenden en
      zenden de regeling ter kennisneming aan het waterschapsbestuur. Het waterschapsbestuur maakt de regelingen bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel12
