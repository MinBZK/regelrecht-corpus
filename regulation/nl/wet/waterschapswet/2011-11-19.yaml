preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 133 van de Grondwet regels moeten worden gesteld
    volgens welke de opheffing en instelling geschiedt van waterschappen en volgens welke de taken en inrichting van
    waterschappen en de samenstelling van hun besturen worden geregeld;

    dat voorts ingevolge diezelfde grondwetsbepaling de verordenende en andere bevoegdheden van de besturen van
    waterschappen, de openbaarheid van hun vergaderingen, alsmede het toezicht op deze besturen moet worden geregeld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Waterschappen zijn openbare lichamen welke de waterstaatkundige verzorging van een bepaald gebied ten doel
      hebben.

      2 De taken die tot dat doel aan waterschappen zijn of worden opgedragen betreffen de zorg voor het watersysteem en
      de zorg voor het zuiveren van afvalwater op de voet van [artikel 3.4 van de Waterwet][ref1]. Daarnaast kan de zorg
      voor een of meer andere waterstaatsaangelegenheden zijn of worden opgedragen.

      3 De zorg voor het watersysteem, bedoeld in het tweede lid, omvat mede het voorkomen van schade aan
      waterstaatswerken veroorzaakt door muskus- en beverratten, bedoeld in [artikel 3.2A van de Waterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel3.2a
