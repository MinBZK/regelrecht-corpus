        bwb_id: BWBR0005108
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '41'
    text: |-
      1 De leden van het dagelijks bestuur, met uitzondering van de voorzitter, worden door het algemeen bestuur benoemd.

      2 De benoeming vindt plaats uit de leden van het algemeen bestuur.

      3 Gedeputeerde staten kunnen, indien het reglement dat bepaalt, ontheffing verlenen van het bepaalde in het tweede
      lid. Geen ontheffing wordt verleend indien het de ombudsman of een lid van de ombudscommissie betreft als bedoeld
      in [artikel 51b, eerste lid][ref1].

      4 De zittingsduur van het dagelijks bestuur is vier jaar. Bij toepassing van [artikel 27, eerste lid][ref2], is
      de zittingsduur dienovereenkomstig korter of langer. De leden van het dagelijks bestuur, met uitzondering van de
      voorzitter, treden af tegelijk met het optreden van de leden van het nieuwe algemeen bestuur.

      5 Niettemin kan het algemeen bestuur een of meer leden van het dagelijks bestuur, met uitzondering van de
      voorzitter, ontslag verlenen, indien deze het vertrouwen van het algemeen bestuur niet meer bezitten. Op het
      ontslagbesluit zijn de [artikelen 4:8][ref3] en [7:1 van de Algemene wet bestuursrecht][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel71
