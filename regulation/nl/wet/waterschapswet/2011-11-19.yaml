  - number: '86'
    text: |-
      1 Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.

      2 Het dagelijks bestuur is bevoegd, tenzij het algemeen bestuur daaromtrent in voorkomende gevallen een
      beslissing heeft genomen, tot het procederen in kort geding en tot voeging in strafzaken als bedoeld in
      [artikel 51a van het Wetboek van Strafvordering][ref1].

      3 Het dagelijks bestuur is bevoegd, indien ingevolge wettelijk voorschrift aan het waterschap of aan het
      waterschapsbestuur hetzij een recht van beroep hetzij een recht bezwaar te maken toekomt, om spoedshalve beroep in
      te stellen of bezwaar te maken alsmede, voor zover de voorschriften dat toelaten, om schorsing van het aangevochten
      besluit of om een voorlopige voorziening ter zake te verzoeken.

      4 Tenzij bij reglement anders is bepaald, wordt het ingestelde beroep of het gemaakte bezwaar ingetrokken, indien
      het algemeen bestuur de beslissing van het dagelijks bestuur tot het instellen van beroep of het maken van bezwaar
      niet hetzij in zijn eerstvolgende vergadering, hetzij binnen drie maanden bekrachtigt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51a
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51a
  - number: '88'
    text: Het dagelijks bestuur kan mandaat verlenen aan een of meer leden van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel88
  - number: '89'
    text: |-
      1 De leden van het dagelijks bestuur zijn, tezamen en ieder afzonderlijk, aan het algemeen bestuur verantwoording
      verschuldigd voor het door het dagelijks bestuur gevoerde bestuur.

      2 Zij geven het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen
      voorzover het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel89
  - number: '94'
    text: |-
      1 De voorzitter bevordert een goede behartiging van de taken van het waterschap.

      2 Hij heeft de leiding van de vergaderingen van het algemeen en van het dagelijks bestuur. In de vergadering van
      het algemeen bestuur heeft hij raadgevende stem.

      3 Hij ondertekent alle stukken welke van het algemeen en het dagelijks bestuur uitgaan.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel94
  - number: '95'
    text: |-
      De voorzitter vertegenwoordigt het waterschap in en buiten rechte. Indien de voorzitter aan een ander machtiging
      verleent tot vertegenwoordiging, behoeft deze machtiging de instemming van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel95
  - number: '96'
    text: |-
      1 Wanneer de omstandigheden geen voorafgaande bijeenroeping van het algemeen bestuur of van het dagelijks bestuur
      gedogen, is de voorzitter bevoegd bij omstandigheden waaronder de veiligheid van een of meer waterstaatswerken,
      of anderszins de goede staat daarvan, in onmiddellijk en ernstig gevaar is of dreigt te komen, al die maatregelen
      te treffen waartoe die besturen bevoegd zijn, zolang deze toestand voortduurt en totdat deze besturen van hun
      bevoegdheid gebruik maken.

      2 Hij geeft daarvan onverwijld kennis aan het desbetreffende bestuur alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel96
  - number: '97'
    text: |-
      1 De voorzitter is het algemeen bestuur verantwoording verschuldigd voor het door hem gevoerde bestuur.

      2 Hij geeft het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen
      voorzover het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel97
  - number: '98'
    text: |-
      Het waterschap draagt de kosten die zijn verbonden aan de behartiging van de taken die het waterschap in het
      reglement zijn opgedragen. Evenwel worden, voorzover de behartiging van die taken redelijkerwijs moet worden geacht
      het belang van het gebied van het waterschap te boven te gaan op grond dat deze tevens in belangrijke mate is de
      behartiging van een nationaal of provinciaal belang, aan het waterschap bijdragen verleend ten laste van de kas van
      het Rijk onderscheidenlijk die van de desbetreffende provincie of provincies.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel98
  - number: 98a
    text: |-
      1 De begroting, de begrotingswijzigingen, de meerjarenraming, de jaarrekening en het jaarverslag worden ingericht
      overeenkomstig bij of krachtens algemene maatregel van bestuur te geven regels.

      2 Bij of krachtens de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen tevens regels worden
      gesteld ten aanzien van:

      a. door het dagelijks bestuur vast te stellen documenten ten behoeve van de uitvoering van de begroting en de
      jaarrekening;

      b. door het dagelijks bestuur aan derden te verstrekken informatie op basis van de begroting en de jaarrekening en
      de controle van deze informatie. In overeenstemming met Onze Minister van Economische Zaken kan worden bepaald dat
      deze informatie wordt verstrekt aan het Centraal Bureau voor de Statistiek.

      3 Indien de informatie, bedoeld in het tweede lid onder b, niet of niet tijdig wordt verstrekt, dan wel de
      kwaliteit van de informatie tekort schiet, geven gedeputeerde staten een aanwijzing aan het dagelijks bestuur om
      alsnog informatie van voldoende kwaliteit te verstrekken.

      4 Indien het dagelijks bestuur nalaat de aanwijzing, bedoeld in het derde lid, op te volgen zorgen gedeputeerde
      staten dat de benodigde informatie alsnog wordt verstrekt. De kosten daarvan komen voor rekening van het
      waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel98a
  - number: '99'
    text: |-
      1 Voor alle aan het waterschap opgedragen taken brengt het algemeen bestuur jaarlijks op de begroting de bedragen
      die het daarvoor beschikbaar stelt, alsmede de door het waterschap te heffen belastingen, de van het rijk en de
      provincie te ontvangen bijdragen en andere financiële middelen die naar verwachting kunnen worden aangewend.

      2 De begroting bevat mede een bedrag voor onvoorziene uitgaven.

      3 De begroting moet in evenwicht zijn. Hiervan kan worden afgeweken indien aannemelijk is dat het evenwicht in de
      begroting in de eerstvolgende jaren tot stand zal zijn gebracht.

      4 Ten laste van het waterschap kunnen slechts lasten en daarmee overeenstemmende balansmutaties worden genomen tot
      de bedragen die hiervoor op de begroting zijn gebracht.

      5 Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel99
  - number: '100'
    text: |-
      1 Het dagelijks bestuur biedt jaarlijks, tijdig voor de in [artikel 101, eerste lid][ref1], bedoelde vaststelling,
      het algemeen bestuur een ontwerp aan voor de begroting met toelichting van het waterschap en een meerjarenraming
      met toelichting voor ten minste drie op het begrotingsjaar volgende jaren.

      2 De ontwerp-begroting en de overige in het eerste lid bedoelde stukken liggen, zodra zij aan het algemeen
      bestuur zijn aangeboden, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de terinzagelegging en de
      verkrijgbaarstelling wordt openbaar kennis gegeven.

      3 Het algemeen bestuur beraadslaagt over de ontwerp-begroting niet eerder dan twee weken na de openbare
      kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel101
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '101'
        hoofdstuk: XIV
        paragraaf: '1'
  - number: '101'
    text: |-
      1 Het algemeen bestuur stelt de begroting vast in het jaar voorafgaande aan dat waarvoor zij dient.

      2 Het dagelijks bestuur zendt de door het algemeen bestuur vastgestelde begroting vergezeld van de in
      [artikel 100, eerste lid][ref1], bedoelde stukken, binnen twee weken na de vaststelling, doch in ieder geval vóór
      1 december van het jaar voorafgaande aan dat waarvoor de begroting dient, aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel100
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel101
    references:
      - id: ref1
