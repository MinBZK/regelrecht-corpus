        hoofdstuk: XV
  - number: '110'
    text: |-
      Het algemeen bestuur besluit tot het invoeren, wijzigen of afschaffen van een waterschapsbelasting door het
      vaststellen van een belastingverordening.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel110
  - number: '111'
    text: |-
      De belastingverordening vermeldt in de daartoe leidende gevallen de belastingplichtige, het voorwerp van de
      belasting, het belastbare feit, de heffingsmaatstaf, het tarief, het tijdstip van ingang van de heffing, en hetgeen
      overigens voor de heffing en de invordering van belang is, alsmede het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel111
  - number: '113'
    text: |-
      Behalve de belastingen of rechten waarvan de heffing krachtens bijzondere wetten geschiedt, worden door het
      waterschap geen andere belastingen en rechten geheven dan de precariobelasting, bedoeld in [artikel 114][ref1],
      de rechten, bedoeld in [artikel 115][ref2], en de heffingen, bedoeld in de [artikelen 117][ref3], [122a][ref4]
      en [122d][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel115
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel122a
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel122d
