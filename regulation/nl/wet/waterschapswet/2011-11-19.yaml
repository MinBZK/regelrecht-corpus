  - number: '31'
    text: |-
      1 Voor het lidmaatschap van het algemeen bestuur is vereist dat men ingezetene is, de leeftijd van achttien jaren
      heeft bereikt en niet krachtens [artikel B 5, eerste lid, van de Kieswet][ref1] van het kiesrecht is uitgesloten.
      Het vereiste van ingezetenschap geldt niet voor de vertegenwoordigers van de categorie belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdeel c][ref2].

      2 Een lid van het algemeen bestuur is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref3];

      g. commissaris van de Koning;

      h. lid van provinciale staten;

      i. gedeputeerde;

      j. secretaris van de provincie;

      k. griffier van de provincie;

      l. burgemeester;

      m. wethouder;

      n. lid van het dagelijks bestuur van een deelgemeente;

      o. ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref4];

      p. ambtenaar, door of vanwege het waterschapsbestuur aangesteld of daaraan ondergeschikt;

      q. ambtenaar, door of vanwege de provincie aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in
      het kader van het toezicht op het waterschap;

      r. lid van het algemeen bestuur of van het dagelijks bestuur van een ander waterschap.

      3 Zodra een lid van het algemeen bestuur blijkt niet te voldoen aan een der in het eerste lid bedoelde vereisten
      of blijkt een in het tweede lid bedoelde betrekking te vervullen, houdt deze op lid te zijn. In dat geval is
      [artikel X 5 van de Kieswet][ref5] van overeenkomstige toepassing.


