  - number: '46'
    text: |-
      1 De voorzitter van het waterschap wordt benoemd en herbenoemd bij koninklijk besluit. Hij kan bij koninklijk
      besluit worden geschorst en ontslagen.

      2 De benoeming geschiedt voor de tijd van zes jaar.

      3 Voor de benoeming maakt het algemeen bestuur een aanbeveling op. Bij de aanbeveling zijn de naar het oordeel van
      het algemeen bestuur voor de geschiktheid van belang zijnde overwegingen gevoegd. Het algemeen bestuur zendt de
      aanbeveling aan gedeputeerde staten, die deze vergezeld van hun beschouwingen zenden aan Onze Minister van Verkeer
      en Waterstaat.

      4 Indien Onze Minister van Verkeer en Waterstaat van oordeel is dat de op de aanbeveling geplaatste persoon of
      personen ongeschikt zijn, verzoekt hij om een nieuwe aanbeveling.

      5 Een voordracht van een niet op de aanbeveling geplaatste persoon geschiedt niet alvorens het algemeen bestuur en
      gedeputeerde staten zijn gehoord.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel46
  - number: '47'
    text: |-
      1 De voorzitter is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. commissaris van de Koning;

      h. lid van provinciale staten;

      i. gedeputeerde;

      j. secretaris van de provincie;

      k. griffier van de provincie;

      l. lid van het algemeen bestuur van een waterschap;

      m. burgemeester;

      n. wethouder;

      o. lid van het dagelijks bestuur van een deelgemeente;

      p. ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref2];

      q. ambtenaar, door of vanwege het waterschapsbestuur aangesteld of daaraan ondergeschikt;

      r. ambtenaar, door of vanwege de provincie aangesteld, tot wiens taak behoort het verrichten van werkzaamheden in
      het kader van het toezicht op het waterschap.

      2 Voor de benoembaarheid tot voorzitter is het Nederlanderschap vereist.

      3 [Artikel 33, eerste lid][ref3], is van overeenkomstige toepassing op de voorzitter.


