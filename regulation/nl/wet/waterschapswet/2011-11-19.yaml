  - number: 122c
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. zuiveringtechnisch werk: een werk voor het zuiveren van afvalwater of het transport van afvalwater, niet zijnde
      een riolering;

      b. riolering: een voorziening voor de inzameling en het transport van afvalwater, in beheer bij een gemeente;

      c. afvoeren: het brengen van stoffen op een riolering of op een zuiveringtechnisch werk;

      d. stoffen: afvalstoffen, verontreinigende of schadelijke stoffen;

      e. afvalwater: afvalwater als bedoeld in [artikel 3.4 van de Waterwet][ref1];

      f. drinkwater: water als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Waterleidingwet][ref2];

      g. waterleidingbedrijf: een bedrijf als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Waterleidingwet][ref3];

      h. woonruimte: een ruimte als bedoeld in [artikel 116, onder b][ref4];

      i. bedrijfsruimte: een naar zijn aard en inrichting als afzonderlijk geheel te beschouwen ruimte of terrein, niet
      zijnde een woonruimte, een zuiveringtechnisch werk of een riolering;

      j. ingenomen water: geleverd drink- en industriewater, onttrokken grond- en oppervlaktewater en opgevangen
      regenwater.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0002246#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002246#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel116
