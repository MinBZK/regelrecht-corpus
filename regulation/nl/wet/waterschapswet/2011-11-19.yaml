  - number: '70'
    text: |-
      1 In het in [artikel 60, tweede lid][ref1], omschreven geval vindt de oplegging van een last onder bestuursdwang
      plaats door gedeputeerde staten namens het waterschapsbestuur en ten laste van het waterschap.

      2 Het waterschap heeft voor het bedrag van de te zijnen laste gebrachte kosten verhaal op de overtreder.

      3 De [artikelen 4:116][ref2], [4:118 tot en met 4:124][ref3] en [5:10 van de Algemene wet bestuursrecht][ref4] en
      [artikel 68][ref5] zijn alsdan van toepassing.


