  - number: '68'
    text: |-
      In geschillen als bedoeld in [artikel 438 van het Wetboek van Burgerlijke Rechtsvordering][ref1] over het
      dwangbevel bezitten leggers, waarin onderhoudsplichtigen zijn aangewezen, behoudens tegenbewijs, kracht van bewijs.


