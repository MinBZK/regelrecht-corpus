      toepassing. Bovendien zijn de [artikelen 31][ref2], [33][ref3] en [34][ref4] van overeenkomstige toepassing
      ten aanzien van de leden van het dagelijks bestuur die zijn benoemd met gebruik van een op grond van
      [artikel 41, derde lid][ref5], verleende ontheffing.


