  - number: '5'
    text: |-
      1 Een besluit van provinciale staten tot het opheffen of instellen van een waterschap dan wel tot vaststelling
      of wijziging van de taak of het gebied van een waterschap behoeft de goedkeuring van Onze Minister van Verkeer en
      Waterstaat. De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.

      2 Tegen een besluit van Onze Minister inzake de goedkeuring van een besluit van provinciale staten tot opheffing
      van een waterschap of het wijzigen van de taak of het gebied van een waterschap kan een belanghebbende beroep
      instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel5
  - number: 5a
    text: |-
      1 Bij of krachtens reglement worden in verband met de vaststelling of wijziging van de taak van een waterschap
      de waterstaatswerken aangewezen die op een daarbij bepaalde datum in beheer overgaan van de provincie, van een
      gemeente of van een onder toepassing van de Wet gemeenschappelijke regelingen ingesteld openbaar lichaam naar het
      waterschap.

      2 De oude en de nieuwe beheerder gaan, tenzij anders overeengekomen, binnen twee jaar na de in het eerste lid
      bedoelde datum over tot onvoorwaardelijke levering onderscheidenlijk aanvaarding van de desbetreffende onroerende
      goederen, voorzover deze daarvan niet bij of krachtens reglement zijn uitgezonderd.

      3 De oude en de nieuwe beheerder stellen, tenzij anders overeengekomen, binnen zes maanden na de in het eerste lid
      bedoelde datum gezamenlijk vast, of in verband met de overgang van rechten en verplichtingen een verrekening nodig
      is en tot welk bedrag. Bij gebreke van overeenstemming binnen die termijn beslissen, de oude en de nieuwe beheerder
      gehoord, gedeputeerde staten, dan wel – indien de provincie de oude beheerder is – Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel5a
  - number: 5b
    text: |-
      1 Indien provinciale staten besluiten een waterschap op te heffen en het gebied daarvan te doen overgaan naar een
      bestaand of gelijktijdig ingesteld waterschap, gaan de rechten en verplichtingen van het op te heffen waterschap op
      de datum van opheffing over naar het waterschap waarnaar zijn gebied overgaat, zonder dat daarvoor een nadere akte
      wordt gevorderd.

      2 Wettelijke procedures en rechtsgedingen waarbij een opgeheven waterschap als bedoeld in het eerste lid betrokken
      is, worden met ingang van de datum van opheffing voortgezet door en tegen het waterschap waarnaar zijn gebied is
      overgegaan. Ten aanzien van de rechtsgedingen is de [elfde afdeling van de tweede titel van het eerste boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend) van overeenkomstige toepassing.

      3 Indien ingevolge het eerste lid onroerende zaken overgaan, doen gedeputeerde staten de overgang onverwijld
      inschrijven in de openbare registers als bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek]
      (onbekend). [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek](onbekend) is niet van toepassing.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing, indien provinciale staten besluiten een
      gedeelte van het gebied van een waterschap te doen overgaan naar dat van een ander waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel5b
  - number: '6'
    text: |-
      Het opheffen of instellen van een waterschap dan wel het vaststellen van een reglement van een waterschap, waarvan
      het gebied in twee of meer provincies is gelegen, geschiedt bij gemeenschappelijk besluit van provinciale staten
      van de desbetreffende provincies. Hetzelfde geldt voor het wijzigen van dat reglement, tenzij deze colleges bij
      reglement het vaststellen van wijzigingen die naar hun oordeel van beperkte strekking zijn opdragen aan één van
      hen. De [artikelen 3][ref1] en [4, eerste tot en met vijfde lid][ref2], zijn van overeenkomstige toepassing. Aan
      deze artikelen wordt toepassing gegeven door een commissie uit het midden van de desbetreffende colleges, tenzij
      deze colleges besluiten deze toepassing aan één van hen op te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel4
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '4'
        hoofdstuk: II
  - number: '7'
    text: |-
      1 Indien de besturen van twee of meer provincies niet of niet binnen redelijke termijn tot overeenstemming komen
      over de opheffing of instelling van een waterschap voor de waterstaatkundige verzorging van een in hun provincies
      gelegen gebied, dan wel over de vaststelling of wijziging van een reglement voor een dergelijk waterschap,
      omdat zij van mening verschillen over hetzij de noodzaak hetzij de inhoud van het te nemen besluit, kan daarin
      bij algemene maatregel van bestuur worden voorzien. [Artikel 27d van de Wet op de Raad van State][ref1] is van
      overeenkomstige toepassing.

      2 Alvorens een voordracht tot die algemene maatregel van bestuur te doen, geeft Onze Minister van Verkeer en
      Waterstaat overeenkomstige toepassing aan [artikel 4, eerste en tweede lid][ref2], en hoort hij gedeputeerde staten
      van de desbetreffende provincies.

      3 [Artikel 4 van de Waterstaatswet 1900][ref3] (*Stb.* 176) is op het in het eerste lid bedoelde geval niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0001867#Artikel4
