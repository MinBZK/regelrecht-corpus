  - number: '73'
    text: |-
      1 Besluiten van het waterschapsbestuur die algemeen verbindende voorschriften inhouden, verbinden niet dan wanneer
      zij zijn bekendgemaakt.

      2 De bekendmaking geschiedt:

      a. door plaatsing in het op een algemeen toegankelijke wijze uit te geven waterschapsblad;

      b. bij gebreke van een waterschapsblad, door terinzagelegging voor de tijd van twaalf weken op de secretarie van
      het waterschap of op een andere door het waterschapsbestuur te bepalen plaats en door het doen van mededeling
      daarvan in een plaatselijk verschijnend dag-, nieuws- of huis-aan-huisblad.

      3 Het waterschapsblad kan elektronisch worden uitgegeven. Na de uitgifte blijft het waterschapsblad elektronisch op
      een algemeen toegankelijke wijze beschikbaar. Indien elektronische uitgifte geheel of gedeeltelijk onmogelijk is,
      voorziet het waterschapsbestuur in een vervangende uitgave. Bij of krachtens algemene maatregel van bestuur worden
      omtrent het bepaalde in de eerste en tweede volzin nadere regels gesteld.

      4 Voor het inzien van een overeenkomstig het tweede lid bekendgemaakt besluit worden geen kosten in rekening
      gebracht.

      5 Bij de bekendmaking van een besluit dat aan goedkeuring is onderworpen, wordt tevens de dagtekening vermeld
      van het besluit waarbij de goedkeuring is verleend of wordt mededeling gedaan van de omstandigheid dat ingevolge
      [artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] een besluit tot goedkeuring wordt geacht te
      zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:31
  - number: 73a
    text: |-
      1 De teksten van besluiten van het waterschapsbestuur die algemeen verbindende voorschriften inhouden, zijn in
      geconsolideerde vorm voor een ieder beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen
      algemeen toegankelijk elektronisch medium.

      2 Een geconsolideerde tekst van een besluit die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien het besluit na de beschikbaarstelling is gewijzigd of ingetrokken.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de wijze waarop de in het
      eerste lid bedoelde teksten beschikbaar worden gesteld.

      4 Bij of krachtens algemene maatregel van bestuur kunnen categorieën van besluiten worden aangewezen, waarop het
      eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel73a
  - number: 73b
    text: |-
      Een ieder kan op verzoek een papieren afschrift verkrijgen van de besluiten van het waterschapsbestuur die algemeen
      verbindende voorschriften inhouden. Het afschrift wordt verstrekt tegen ten hoogste de kosten van het maken van
      het afschrift.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel73b
  - number: '74'
    text: |-
      De bekend gemaakte besluiten treden in werking met ingang van de achtste dag na die van de bekendmaking, tenzij in
      deze besluiten daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel74
  - number: '75'
    text: |-
      De besluiten tot vaststelling of wijziging van de keur worden medegedeeld aan de rechtbank en het gerechtshof onder
      wier rechtsmacht het waterschap valt, aan het parket van die colleges, alsmede aan de colleges van burgemeester en
      wethouders der gemeenten in het gebied waarvan de keur toepassing kan vinden.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel75
  - number: '76'
    text: |-
      Met betrekking tot de intrekking van besluiten die algemeen verbindende voorschriften inhouden, zijn
      de [artikelen 73 tot en met 75][ref1] van overeenkomstige toepassing, met dien verstande dat de in
      [artikel 73, tweede lid, onderdeel b][ref2], voorgeschreven mededeling geschiedt binnen één week.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel76
