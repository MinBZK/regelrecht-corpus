    text: |-
      1 De voorzitter vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op de goede vervulling
      van zijn ambt of op handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.

      2 De voorzitter meldt zijn voornemen tot aanvaarding van een nevenfunctie, anders dan uit hoofde van zijn
      voorzitterschap, aan het algemeen bestuur.

      3 De voorzitter maakt nevenfuncties, anders dan uit hoofde van zijn ambt, en de inkomsten uit die functies
      openbaar. Openbaarmaking geschiedt door terinzagelegging op de secretarie van het waterschap uiterlijk op
      1 april na het kalenderjaar waarin de inkomsten zijn genoten. Onder inkomsten als bedoeld in de eerste volzin
      wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1], verminderd met de
      eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].

      4 De voorzitter geniet geen vergoedingen, onder welke benaming ook, voor werkzaamheden, verricht in nevenfuncties
      die hij vervult uit hoofde van zijn ambt, ongeacht of die vergoedingen ten laste van het waterschap komen. Indien
      deze vergoedingen worden uitgekeerd, worden zij gestort in de kas van het waterschap.

      5 Tot vergoedingen als bedoeld in het vierde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties
      die de voorzitter neerlegt bij beëindiging van het ambt.

      6 Andere inkomsten dan die bedoeld in het vierde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref3].

      7 Op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden bij algemene maatregel van
      bestuur regels gesteld over de wijze waarop de voorzitter gegevens over de inkomsten, bedoeld in het zesde lid,
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0004939#Artikel3
