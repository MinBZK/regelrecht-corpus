  - number: '8'
    text: |-
      1 Indien het belang van een goede organisatie van de waterstaatkundige verzorging van een gebied, dat in een of
      meer provincies is gelegen, het opheffen of het instellen van een waterschap dan wel de vaststelling of wijziging
      van het reglement voor een waterschap vordert en provinciale staten van de provincie of provincies daarvoor niet de
      nodige besluiten nemen, kunnen zij bij koninklijk besluit, de Raad van State gehoord, worden uitgenodigd om daartoe
      over te gaan binnen een in dat besluit te stellen termijn. [Artikel 27d van de Wet op de Raad van State][ref1] is
      van overeenkomstige toepassing.

      2 Indien Onze Minister van Verkeer en Waterstaat het voornemen heeft een besluit als bedoeld in het eerste lid te
      bevorderen, geeft hij hiervan kennis aan gedeputeerde staten der provincie of provincies wier gebied het betreft,
      onder mededeling van de overwegingen waarop het voornemen berust.

      3 Binnen twaalf weken nadat de in het tweede lid bedoelde kennisgeving is geschied, vindt overleg plaats tussen
      Onze Minister van Verkeer en Waterstaat en het college of de colleges van gedeputeerde staten van de desbetreffende
      provincie of provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel8
    references:
      - id: ref1
