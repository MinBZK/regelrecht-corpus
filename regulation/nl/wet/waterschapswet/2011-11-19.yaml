      1 Voorzover dit niet bij de wet is geschied, worden voor de voorzitter op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bij algemene maatregel van bestuur regels gesteld betreffende:

      a. benoeming, schorsing, tijdelijk niet uitoefenen van zijn functie, en ontslag;

      b. aanspraken in geval van ziekte;

      c. andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.

      2 Bij de in het eerste lid bedoelde regels kunnen financiële voorzieningen worden getroffen die ten laste van het
      waterschap komen.

      3 Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de voorzitter als zodanig geen inkomsten, in
      welke vorm ook, ten laste van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel49
  - number: '50'
    text: |-
      1 Alvorens zijn ambt te aanvaarden legt de voorzitter in handen van de commissaris van de Koning dan wel, indien
      het een interprovinciaal waterschap betreft, van Onze daartoe in het reglement aangewezen commissaris van de
      Koning, de volgende eed (verklaring en belofte) af:

      "Ik zweer (verklaar) dat ik, om tot voorzitter benoemd te worden, rechtstreeks noch middellijk, onder welke naam of
      welk voorwendsel ook, aan iemand enige gift of gunst heb gedaan of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk van
      iemand enig geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als voorzitter naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig!

      (Dat verklaar en beloof ik!)".

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta foarsitter beneamd te wurden, streekrjocht noch midlik, ûnder wat namme of wat
      ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as
      foarsitter yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '51'
    text: |-
      Het ambt van voorzitter ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51
  - number: 51a
    text: |-
      1 Bij verhindering of ontstentenis van de voorzitter en – indien in de aanwijzing daarvan is voorzien bij het
      reglement – van de plaatsvervangend voorzitter wordt het ambt van voorzitter waargenomen door een, door het
      dagelijks bestuur aan te wijzen, ander lid van dat bestuur.

      2 Bij verhindering of ontstentenis van alle leden van het dagelijks bestuur wordt het ambt waargenomen door het
      oudste lid in jaren van het algemeen bestuur, tenzij het algemeen bestuur een ander lid met de waarneming belast.

      3 Bij verhindering of ontstentenis van de voorzitter op de dag met ingang waarvan het zittende algemeen bestuur is
      afgetreden, wordt het ambt waargenomen door een, door de afgetreden leden van het dagelijks bestuur aan te wijzen,
      afgetreden lid van het dagelijks bestuur, of, bij ontstentenis van alle afgetreden leden van het dagelijks bestuur,
      door het oudste afgetreden lid in jaren van het algemeen bestuur, een en ander tot in de waarneming overeenkomstig
      het eerste en tweede lid is voorzien.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51a
  - number: 51b
    text: |-
      1 Met inachtneming van het bepaalde in dit hoofdstuk kan het algemeen bestuur de behandeling van verzoekschriften
      als bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1] opdragen aan een ombudsman of
      ombudscommissie voor het waterschap, dan wel een gezamenlijke ombudsman of ombudscommissie.

      2 Een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.

      3 De instelling van een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van
      enig jaar worden beëindigd. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot beëindiging van
      de instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel918
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:18
  - number: 51c
    text: |-
      1 Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudsman voor het waterschap,
      benoemt het deze voor de duur van zes jaar.

      2 Het algemeen bestuur benoemt een plaatsvervangend ombudsman. Deze paragraaf is op de plaatsvervangend ombudsman
      van overeenkomstige toepassing.

      3 De ombudsman wordt door het algemeen bestuur ontslagen:

      a. op eigen verzoek;

      b. wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;

      c. bij de aanvaarding van een betrekking als bedoeld in [artikel 51d, eerste lid][ref1];

      d. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      e. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;

      f. indien hij naar het oordeel van provinciale staten ernstig nadeel toebrengt aan het in hem gestelde vertrouwen.

      4 Het algemeen bestuur stelt de ombudsman op non-activiteit indien hij:

      a. zich in voorlopige hechtenis bevindt;

      b. bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51d
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51c
