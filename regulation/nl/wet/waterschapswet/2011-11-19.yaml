  - number: '29'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in [artikel 19, tweede lid][ref1], kan worden bepaald dat bij
      een besluit tot instelling van een waterschap kan worden afgeweken van bij die maatregel gestelde termijnen.

      2 Bij een besluit tot instelling van een waterschap kan worden afgeweken van de krachtens
      [artikel 20, tweede lid][ref2], gestelde stemmingsperiode, met dien verstande dat de stemming voor de datum van
      instelling van het nieuwe waterschap plaatsvindt.

      3 De zittingsperiode van de leden van het algemeen bestuur van het in te stellen waterschap eindigt tegelijk met de
      zittingsperiode van de leden van de algemene besturen van de overige waterschappen die zitting hebben op de datum
      van instelling van het waterschap.

      4 Indien de zittingsperiode van de leden van het algemeen bestuur ingevolge het derde lid eindigt binnen twee jaren
      en acht dagen na de instelling van het waterschap vinden de verkiezingen niet plaats in dat waterschap en eindigt
      de zittingsperiode van dat algemeen bestuur in afwijking van dat lid tegelijk met de zittingsperiode van de leden
      van de algemene besturen van de overige waterschappen die volgt op de eerste verkiezingen voor de waterschappen na
      de datum van instelling.

      5 De benoeming van de leden en de plaatsvervangende leden van het stembureau geschiedt, in afwijking van het
      bepaalde in [artikel 18, derde lid][ref3], voor een periode die eindigt op hetzelfde tijdstip als de eerste
      zittingsperiode van de nieuw gekozen algemene besturen van de waterschappen.


