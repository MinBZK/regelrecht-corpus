    text: |-
      1 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref1] kan het algemeen bestuur in
      de in [artikel 120, eerste lid][ref2], genoemde verordening de heffing maximaal 75% lager vaststellen
      voor buitendijks gelegen onroerende zaken en voor onroerende zaken die blijkens de legger, bedoeld in
      [artikel 78, tweede lid][ref3], als waterberging worden gebruikt.

      2 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref4] kan het algemeen bestuur in de in
      [artikel 120, eerste lid][ref5], genoemde verordening de heffing maximaal 100% hoger vaststellen voor onroerende
      zaken gelegen in bemalen gebieden.

      3 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref6] kan het algemeen
      bestuur in de in [artikel 120, eerste lid][ref7], genoemde verordening de heffing maximaal 100%
      hoger vaststellen voor onroerende zaken die in hoofdzaak bestaan uit glasopstanden als bedoeld in
      [artikel 220d, eerste lid, onderdeel b, van de Gemeentewet][ref8] en voor verharde openbare wegen.

      4 De afwijkingen als bedoeld in het eerste, tweede en derde lid kunnen naast elkaar worden toegepast.


