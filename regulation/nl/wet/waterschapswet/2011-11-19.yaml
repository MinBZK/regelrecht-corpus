        paragraaf: '1'
  - number: '103'
    text: |-
      1 Het dagelijks bestuur legt aan het algemeen bestuur over elk begrotingsjaar verantwoording af over het door hem
      gevoerde bestuur, onder overlegging van de jaarrekening en het jaarverslag.

      2 Het dagelijks bestuur voegt daarbij de verslagen, bedoeld in [artikel 109a, tweede lid][ref1].

      3 De in het eerste en tweede lid, alsmede de in [artikel 109, derde en vierde lid][ref2], bedoelde stukken liggen,
      zodra zij aan het algemeen bestuur zijn overgelegd, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de
      terinzage legging en de verkrijgbaarstelling wordt openbaar kennis gegeven. Het algemeen bestuur beraadslaagt over
      de jaarrekening en het jaarverslag niet eerder dan twee weken na de openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel109
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 109a
        hoofdstuk: XV
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '109'
        hoofdstuk: XV
  - number: '104'
    text: |-
      1 Het algemeen bestuur stelt de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De
      jaarrekening betreft alle baten en lasten van het waterschap.

      2 Indien het algemeen bestuur tot het standpunt komt dat onrechtmatige totstandkoming van in de jaarrekening
      opgenomen baten, lasten of balansmutaties aan de vaststelling van de jaarrekening in de weg staat, brengt hij dit
      terstond ter kennis van het dagelijks bestuur met vermelding van de gerezen bedenkingen.

      3 Het dagelijks bestuur zendt het algemeen bestuur binnen twee maanden na ontvangst van het standpunt, bedoeld in
      het tweede lid, een voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij het algemeen bestuur
      gerezen bedenkingen.

      4 Indien het dagelijks bestuur een voorstel voor een indemniteitsbesluit heeft gedaan, stelt het algemeen bestuur
      de jaarrekening niet vast dan nadat hij heeft besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel104
  - number: '105'
    text: |-
      De leden van het dagelijks bestuur nemen niet deel aan stemmingen over besluiten als bedoeld in het
      [eerste, tweede en vierde lid van artikel 104][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel104
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '104'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: '106'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van het
      dagelijks bestuur ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel106
  - number: '107'
    text: |-
      Het dagelijks bestuur zendt de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in
      [artikel 103][ref1] bedoelde stukken binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het
      jaar, volgend op het begrotingsjaar, aan gedeputeerde staten. Het dagelijks bestuur voegt daarbij, indien van
      toepassing, het besluit van het algemeen bestuur over een voorstel voor een indemniteitsbesluit met de reactie,
      bedoeld in [artikel 104, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel104
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '103'
        hoofdstuk: XIV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '104'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: 107a
    text: |-
      Indien het algemeen bestuur de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststelt,
      zendt het dagelijks bestuur de jaarrekening, vergezeld van de overige in [artikel 103][ref1] bedoelde stukken,
      respectievelijk het indemniteitsbesluit ter vaststelling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel103
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel107a
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '103'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: '108'
    text: |-
      1 Het algemeen bestuur stelt bij verordening de uitgangspunten voor het financiële beleid, alsmede voor het
      financiële beheer en voor de inrichting van de financiële organisatie vast. Deze verordening waarborgt dat aan de
      eisen van rechtmatigheid, verantwoording en controle wordt voldaan.

      2 De verordening bevat in ieder geval:

      a. regels voor waardering en afschrijving van activa;

      b. grondslagen voor de berekening van de door het waterschapsbestuur in rekening te brengen prijzen en van tarieven
      voor rechten als bedoeld in [artikel 115, eerste lid][ref1];

      c. regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '115'
        hoofdstuk: XVI
  - number: '109'
    text: |-
      1 Het algemeen bestuur stelt bij verordening regels vast voor de controle op het financiële beheer en op de
      inrichting van de financiële organisatie. Deze verordening waarborgt dat de rechtmatigheid van het financiële
      beheer en van de inrichting van de financiële organisatie wordt getoetst.

      2 Het algemeen bestuur wijst één of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 103][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van bevindingen.

      3 De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:

      a. de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en samenstelling van het
      vermogen;

      b. de baten en lasten, alsmede de balansmutaties rechtmatig tot stand zijn gekomen;

      c. de jaarrekening is opgesteld in overeenstemming met de bij of krachtens algemene maatregel van bestuur te
      stellen regels, bedoeld in [artikel 98a][ref3], en

      d. het jaarverslag met de jaarrekening verenigbaar is.

      4 Het verslag van bevindingen bevat in ieder geval bevindingen over:

      a. de vraag of de inrichting van het financiële beheer en van de financiële organisatie een getrouwe en rechtmatige
      verantwoording mogelijk maken, en

      b. onrechtmatigheden in de jaarrekening.

      5 De accountant zendt de accountantsverklaring en het verslag van bevindingen aan het algemeen bestuur en een
      afschrift daarvan aan het dagelijks bestuur.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel98a
