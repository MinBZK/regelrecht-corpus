  - number: '16'
    text: |-
      De leden van het algemeen bestuur worden gekozen door degenen die op de dag van de kandidaatstelling ingezetenen
      zijn van het waterschap en uiterlijk op de laatste dag van de stemmingsperiode achttien jaar of ouder zijn.
      [Artikel B 5, eerste lid, van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_5
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: B_5
  - number: '17'
    text: |-
      1 Indien een waarborging van evenwichtige vertegenwoordiging van de binnen een waterschap bestaande belangen
      daartoe aanleiding geeft, kan bij reglement het waterschapsgebied worden ingedeeld in kiesdistricten, onder
      vaststelling van het aantal zetels per kiesdistrict.

      2 In het geval als bedoeld in het eerste lid, vindt de kandidaatstelling en stemming plaats per kiesdistrict.

      3 Voor de verkiezing binnen een kiesdistrict zijn stemgerechtigd de ingezetenen die volgens de gemeentelijke
      basisadministratie persoonsgegevens woonachtig zijn in het kiesdistrict en uiterlijk op de laatste dag van de
      stemmingsperiode achttien jaar of ouder zijn.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel17
  - number: '18'
    text: |-
      1 Voor de verkiezing van de leden van het algemeen bestuur stelt het dagelijks bestuur een stembureau in, bestaande
      uit vijf leden van wie er één voorzitter en één plaatsvervangend voorzitter is.

      2 De voorzitter van het waterschap is voorzitter van het stembureau. De plaatsvervangend voorzitter en de andere
      leden, alsmede drie plaatsvervangende leden worden door het dagelijks bestuur benoemd en ontslagen.

      3 De in het tweede lid bedoelde benoemingen geschieden voor vier kalenderjaren. Degene die ter vervulling van een
      opengevallen plaats is benoemd, treedt af op het tijdstip waarop degene in wiens plaats hij is benoemd, zou hebben
      moeten aftreden.

      4 Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden omtrent de taken en werkwijze van het
      stembureau.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel18
  - number: '19'
    text: |-
      1 De kandidaatstelling geschiedt door een belangengroepering waarvan de aanduiding is geregistreerd bij het
      stembureau. De belangengroepering is een vereniging met volledige rechtsbevoegdheid of een stichting.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:

      a. de in het eerste lid bedoelde registratie;

      b. het tijdstip van de kandidaatstelling;

      c. de kandidatenlijsten;

      d. het onderzoek, de nummering en de openbaarmaking van de kandidatenlijsten door het stembureau.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat voor de registratie van de in het eerste lid bedoelde
      aanduiding en voor de inlevering van de kandidatenlijst een waarborgsom moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel19
  - number: '20'
    text: |-
      1 De verkiezingen worden gehouden bij geheime stemming.

      2 De stemming vindt plaats in een bij algemene maatregel van bestuur vastgestelde periode.

      3 Het uitbrengen van de stem geschiedt per brief of, voorzover het waterschap de kiesgerechtigde daartoe in de
      gelegenheid stelt, met behulp van informatie- en communicatietechnologie.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:

      a. het stemmen per brief;

      b. het stemmen met behulp van informatie- en communicatietechnologie;

      c. de stemopneming;

      d. de vaststelling en bekendmaking van de verkiezingsuitslag.

      5 Bij de vaststelling van de verkiezingsuitslag zijn gekozen die kandidaten die een aantal stemmen hebben verkregen
      groter dan 25% van de kiesdeler, voor zover aan de lijst voldoende zetels zijn toegewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel20
  - number: '21'
    text: |-
      1 Tegen bij algemene maatregel van bestuur aangewezen besluiten, die met toepassing van die maatregel worden
      genomen met het oog op de verkiezing van de leden van het algemeen bestuur en die naar hun aard noodzaken tot een
      spoedige behandeling van de daartegen ingestelde beroepen kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.

      2 [Artikel 7:1][ref1] en [titel 8.3 van de Algemene wet bestuursrecht][ref2] blijven buiten toepassing.

      3 In afwijking van [artikel 8:41, tweede lid, van de Algemene wet bestuursrecht][ref3] bedraagt de termijn binnen
      welke de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken. De voorzitter
      van de Afdeling kan een kortere termijn stellen.

      4 De Afdeling behandelt de zaak met toepassing van [afdeling 8.2.3. van de Algemene wet bestuursrecht][ref4].
      [Afdeling 8.2.4.][ref5] blijft buiten toepassing. Aan het dagelijks bestuur wordt terstond een afschrift van het
      beroepschrift gezonden.

      5 Bij algemene maatregel van bestuur kan in afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref6] de
      termijn voor het indienen van de in het eerste lid bedoelde beroepschriften worden bekort.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel71
