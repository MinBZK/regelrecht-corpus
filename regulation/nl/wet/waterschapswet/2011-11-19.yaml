  - number: '32'
    text: |-
      1 De leden van het algemeen bestuur maken openbaar welke andere functies dan het lidmaatschap van het algemeen
      bestuur zij vervullen.

      2 Openbaarmaking geschiedt door terinzagelegging van een opgave van de in het eerste lid bedoelde functies op de
      secretarie van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel32
  - number: 32a
    text: |-
      1 De leden van het algemeen bestuur die geen lid zijn van het dagelijks bestuur ontvangen een vergoeding voor
      hun werkzaamheden en een tegemoetkoming in de kosten. Deze vergoeding en tegemoetkoming worden door het algemeen
      bestuur bij verordening vastgesteld naar bij of krachtens algemene maatregel van bestuur te stellen nadere regels.
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties doet de voordracht voor deze algemene maatregel van
      bestuur. Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van het algemeen bestuur als
      zodanig geen andere vergoedingen en tegemoetkomingen ten laste van het waterschap.

      2 Voordelen ten laste van het waterschap, anders dan in de vorm van vergoedingen en tegemoetkomingen, genieten
      zij slechts voor zover het algemeen bestuur dit bij verordening bepaalt. De verordening behoeft de goedkeuring van
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel32a
  - number: '33'
    text: |-
      1 Een lid van het algemeen bestuur mag niet:

      a. als advocaat of adviseur in geschillen werkzaam zijn ten behoeve van het waterschap of het waterschapsbestuur
      dan wel ten behoeve van de wederpartij van het waterschap of het waterschapsbestuur;

      b. als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van het waterschap of het
      waterschapsbestuur;

      c. als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het waterschap aangaan van:

      1°. overeenkomsten als bedoeld in onderdeel d;

      2°. overeenkomsten tot het leveren van onroerende zaken aan het waterschap;

      d. rechtstreeks of middellijk een overeenkomst aangaan betreffende:

      1°. het aannemen van werk ten behoeve van het waterschap;

      2°. het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van het waterschap;

      3°. het leveren van roerende zaken anders dan om niet aan het waterschap;

      4°. het verhuren van roerende zaken aan het waterschap;

      5°. het verwerven van betwiste vorderingen ten laste van het waterschap;

      6°. het van het waterschap onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;

      7°. het onderhands huren of pachten van het waterschap.

      2 Van het eerste lid, aanhef en onderdeel d, kunnen gedeputeerde staten ontheffing verlenen.

      3 Het algemeen bestuur stelt voor zijn leden, voor de leden van het dagelijks bestuur en voor de voorzitter een
      gedragscode vast.

      4 Ten aanzien van een lid dat handelt in strijd met het bepaalde in het eerste lid, is
      [artikel X 8, eerste tot en met vijfde lid, van de Kieswet][ref1] van overeenkomstige toepassing, met dien
      verstande dat wordt gelezen voor:

      a. burgemeester en wethouders: het dagelijks bestuur;

      b. de raad: het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelX_8
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: X_8
  - number: '34'
    text: |-
      1 Alvorens hun functie te kunnen uitoefenen leggen de leden van het algemeen bestuur in de vergadering, in handen
      van de voorzitter, de volgende eed (verklaring en belofte) af:

      "Ik zweer (verklaar) dat ik, om tot lid van het algemeen bestuur te worden gekozen of benoemd, rechtstreeks noch
      middellijk, onder welke naam of welk voorwendsel ook, aan iemand enige gift of gunst heb gedaan of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk van
      iemand enig geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als lid van het algemeen bestuur naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig (Dat verklaar en beloof ik)".

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta lid fan it algemien bestjoer beneamd te wurden, streekrjocht noch midlik, ûnder
      wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as lid
      fan it algemien bestjoer yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '35'
    text: |-
      1 De vergadering van het algemeen bestuur wordt in het openbaar gehouden.

      2 De deuren worden gesloten, wanneer tenminste een vijfde van het aantal leden dat de presentielijst heeft
      ondertekend daarom verzoekt of de voorzitter het nodig oordeelt.

      3 Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.

      4 Van een vergadering met gesloten deuren wordt een afzonderlijk verslag gemaakt dat niet openbaar wordt gemaakt
      tenzij het algemeen bestuur anders beslist.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel35
  - number: '36'
    text: |-
      In een besloten vergadering kan niet worden beraadslaagd of besloten over:

      a. de toelating van nieuwe leden;

      b. de vaststelling en wijziging van de begroting en de vaststelling van de rekening;

      c. de invoering, wijziging en afschaffing van een waterschapsbelasting; en

      d. de benoeming en het ontslag van leden van het dagelijks bestuur met uitzondering van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel36
  - number: '37'
    text: |-
      1 Het algemeen bestuur kan op grond van een belang, genoemd in
      [artikel 10 van de Wet openbaarheid van bestuur][ref1], geheimhouding opleggen omtrent het in een besloten
      vergadering behandelde en omtrent de inhoud van stukken die aan de vergadering worden overgelegd. Geheimhouding
      omtrent het in een besloten vergadering behandelde wordt tijdens die vergadering opgelegd. De geheimhouding wordt
      zowel door hen die bij de behandeling tegenwoordig waren, als door hen die op andere wijze van het behandelde of
      van de stukken kennis nemen, in acht genomen totdat het algemeen bestuur haar opheft.

      2 Op grond van een belang, genoemd in [artikel 10 van de Wet openbaarheid van bestuur][ref2], kan de geheimhouding
      eveneens worden opgelegd door het dagelijks bestuur, de voorzitter en een commissie van het waterschap, ieder ten
      aanzien van stukken die zij aan het algemeen bestuur of aan de leden van dit bestuur overleggen. Daarvan wordt op
      de stukken melding gemaakt.

      3 De krachtens het tweede lid aan het algemeen bestuur opgelegde verplichting tot geheimhouding vervalt, indien de
      oplegging niet door het algemeen bestuur in zijn eerstvolgende vergadering die blijkens de presentielijst door meer
      dan de helft van het aantal zitting hebbende leden is bezocht, wordt bekrachtigd.

      4 De krachtens het tweede lid aan de leden van het algemeen bestuur opgelegde verplichting tot geheimhouding wordt
      door hen in acht genomen totdat het orgaan dat de verplichting heeft opgelegd, dan wel, indien het stuk waaromtrent
      geheimhouding is opgelegd aan het algemeen bestuur is voorgelegd, totdat het algemeen bestuur haar opheft. Het
      algemeen bestuur kan deze beslissing alleen nemen in een vergadering die blijkens de presentielijst door meer dan
      de helft van het aantal zitting hebbende leden is bezocht.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005252#Artikel10
