  - number: '23'
    text: |-
      1 De zittingsduur van het algemeen bestuur is vier jaar.

      2 De leden van het algemeen bestuur treden tegelijk af met ingang van de donderdag in de periode van 2 tot en met
      8 januari.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel23
  - number: '24'
    text: |-
      1 Het algemeen bestuur beslist of degene die is gekozen dan wel is benoemd als lid wordt toegelaten.

      2 Toelating tot het algemeen bestuur van de in het eerste lid bedoelde persoon kan slechts worden geweigerd
      indien die persoon niet aan de vereisten voor het lidmaatschap voldoet of een met het lidmaatschap onverenigbare
      functie vervult, dan wel, voorzover dat bij algemene maatregel van bestuur is bepaald, indien sprake is van
      onregelmatigheden bij de voordracht of de verkiezing zelf.

      3 Bij algemene maatregel van bestuur worden regels gesteld omtrent de toelating tot het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel24
  - number: '25'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de beëindiging van het lidmaatschap van het algemeen bestuur;

      b. de opvolging in opengevallen plaatsen in het algemeen bestuur;
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel25
  - number: '26'
    text: |-
      Voor de toepassing van deze paragraaf wordt aan de instelling van een nieuw waterschap gelijkgesteld de overgang
      van een aanmerkelijk gedeelte van het gebied van een waterschap naar dat van een ander waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel26
  - number: '27'
    text: |-
      1 In afwijking van [artikel 23][ref1] kan bij het besluit tot opheffing of instelling van een waterschap de
      zittingsduur van het zittende algemeen bestuur worden verkort, dan wel verlengd met ten hoogste twee jaren indien
      dit wenselijk is met het oog op het instellen van een nieuw waterschap.

      2 In het geval als bedoeld in het eerste lid, treden de op de dag, voorafgaande aan de datum van instelling van
      het waterschap, zitting hebbende leden van het algemeen bestuur van de betrokken waterschappen met ingang van die
      datum af.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel23
