  - number: '3'
    text: |-
      1 Indien naar het oordeel van gedeputeerde staten gronden aanwezig zijn om het opheffen of instellen van een
      waterschap, de vaststelling van een reglement voor een waterschap of een wijziging van een dergelijk reglement te
      overwegen, treden zij voor de bepaling van hun standpunt in overleg met het dagelijks bestuur van het waterschap of
      de waterschappen die het betreft, alvorens zij toepassing geven aan [artikel 4, eerste lid][ref1].

      2 Gedeputeerde staten handelen dienovereenkomstig indien zij hun standpunt moeten bepalen ten aanzien van ofwel een
      soortgelijk voorstel van het algemeen bestuur van een waterschap ofwel een voornemen van Onze Minister van Verkeer
      en Waterstaat ingevolge [artikel 8, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel8
