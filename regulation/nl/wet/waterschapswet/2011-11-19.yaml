  - number: '121'
    text: |-
      1 Voor de heffing geldt als heffingsmaatstaf:

      a. ter zake van ingezetenen als bedoeld in [artikel 117, onderdeel a][ref1]: de woonruimte, waarbij het tarief
      wordt gesteld op een gelijk bedrag per woonruimte;

      b. ter zake van ongebouwde onroerende zaken als bedoeld in [artikel 117, onderdeel b][ref2]: de oppervlakte,
      waarbij het tarief wordt gesteld op een gelijk bedrag per hectare;

      c. ter zake van ongebouwde onroerende zaken als bedoeld in [artikel 117, onderdeel c][ref3]: de oppervlakte,
      waarbij het tarief wordt gesteld op een gelijk bedrag per hectare;

      d. ter zake van gebouwde onroerende zaken als bedoeld in [artikel 117, onderdeel d][ref4]: de waarde die voor de
      onroerende zaak wordt bepaald op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref5] voor het
      kalenderjaar, waarbij het tarief wordt gesteld op een vast percentage van de waarde.

      2 In afwijking in zoverre van het eerste lid, onderdeel d, wordt bij de bepaling van de heffingsmaatstaf voor de
      heffing ter zake van gebouwde onroerende zaken de waarde van onroerende zaken of onderdelen daarvan als bedoeld in
      [artikel 220d, eerste lid, onderdelen c, h en j, van de Gemeentewet][ref6] en van waterbeheersingswerken die worden
      beheerd door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen
      die dienen als woning, buiten aanmerking gelaten, voor zover dit niet reeds is geschied bij de bepaling van de in
      het eerste lid, onderdeel d, bedoelde waarde.

      3 Bij de toepassing van het tweede lid is het bepaalde bij of krachtens de [artikelen 17][ref7], [18][ref8] en
      [20, tweede lid, van de Wet waardering onroerende zaken][ref9] van overeenkomstige toepassing.


