  - number: '53'
    text: De secretaris van het waterschap wordt door het algemeen bestuur benoemd.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel53
  - number: '54'
    text: |-
      1 De bevoegdheid tot schorsing of ontslag van de secretaris berust bij het algemeen bestuur.

      2 In spoedeisende gevallen kan het dagelijks bestuur tot schorsing overgaan. Het doet daarvan terstond mededeling
      aan het algemeen bestuur. De schorsing vervalt indien het algemeen bestuur haar niet in een binnen acht weken na de
      datum van het schorsingsbesluit gehouden vergadering bekrachtigt.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel54
  - number: '55'
    text: |-
      De secretaris staat het algemeen bestuur, het dagelijks bestuur en de voorzitter ter zijde bij de uitoefening van
      hun taak. Hij is aanwezig in de vergadering van het algemeen bestuur en van het dagelijks bestuur. Hij ondertekent
      de stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan, mede.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel55
  - number: 55a
    text: |-
      1 Het dagelijks bestuur regelt de vervanging van de secretaris.

      2 De [artikelen 54][ref1] en [55][ref2] zijn van overeenkomstige toepassing op degene die de secretaris vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel55
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel55a
