  - number: 126a
    text: |-
      1 Met betrekking tot waterschapsbelastingen kunnen bij algemene maatregel van bestuur:

      a. regels worden gesteld waarbij de [artikelen 48][ref1], [52][ref2], [53, eerste en vierde lid][ref3], [54][ref4]
      of [55 van de Algemene wet][ref5], alsmede de [artikelen 59][ref6] of [62 van de Invorderingswet 1990][ref7] geheel
      of gedeeltelijk van toepassing worden verklaard, dan wel

      b. regels worden gesteld die overeenkomen met die in de in onderdeel *a* genoemde artikelen.

      2 De in het eerste lid bedoelde regels bevatten in elk geval een omschrijving van degene op wie de verplichting
      rust, alsmede van de belasting ten behoeve waarvan de verplichting geldt. Voorts vermelden deze regels naar gelang
      de aard van de verplichting een omschrijving van de aard van de te verstrekken gegevens en inlichtingen, van de
      aard van de gegevens welke uit de administratie dienen te blijken of van het doel waarvoor het voor raadpleging
      beschikbaar stellen van gegevensdragers kan geschieden.


