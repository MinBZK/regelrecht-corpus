  - number: '127'
    text: |-
      1 Het uitnodigen tot het doen van aangifte, bedoeld in [artikel 6 van de Algemene wet][ref1], geschiedt door het
      uitreiken van een aangiftebiljet.

      2 Het doen van aangifte, bedoeld in [artikel 8 van de Algemene wet][ref2], geschiedt door het inleveren of
      toezenden van het uitgereikte aangiftebiljet met de daarbij gevraagde bescheiden.

      3 In afwijking in zoverre van de vorige leden kan de in [artikel 123, derde lid, onderdeel b][ref3], bedoelde
      ambtenaar van het waterschap vorderen dat een verplichting tot het doen van aangifte of tot het indienen van een
      verzoek om uitreiking van een aangiftebiljet wordt nagekomen door het mondeling doen van aangifte. Daarbij:

      a. worden de door de in [artikel 123, derde lid, onderdeel b][ref4], bedoelde ambtenaar van het waterschap
      gevraagde bescheiden overgelegd;

      b. kan de in [artikel 123, derde lid, onderdeel b][ref5], bedoelde ambtenaar van het waterschap vorderen dat een
      van de mondelinge aangifte opgemaakt relaas door de aangever wordt ondertekend, bij gebreke waarvan de aangifte
      geacht wordt niet te zijn gedaan.

      4 Indien het derde lid toepassing vindt, kan de in [artikel 123, derde lid, onderdeel b][ref6], bedoelde
      ambtenaar van het waterschap voor de termijnen, genoemd in [artikel 9, eerste en derde lid, eerste volzin][ref7],
      [artikel 10, tweede lid][ref8], en [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref9] of voor de
      kortere termijn, bedoeld in [artikel 128, eerste of tweede lid][ref10], kortere termijnen in de plaats stellen en
      is [artikel 12 van de Algemene wet][ref11] niet van toepassing.

      5 Bij de belastingverordening kan van het eerste en tweede lid worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel6
