  - number: '10'
    text: |-
      Het bestuur van een waterschap bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter,
      onverminderd hetgeen het reglement bepaalt over de benaming van die onderscheidene bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel10
  - number: '11'
    text: |-
      1 In dit hoofdstuk en de daarop berustende bepalingen wordt onder ingezetenen verstaan: zij die hun werkelijke
      woonplaats in het waterschap hebben.

      2 Zij die volgens de gemeentelijke basisadministratie woonachtig zijn in het gebied van het waterschap worden,
      behoudens bewijs van het tegendeel, geacht werkelijke woonplaats te hebben in dat waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel11
  - number: '12'
    text: |-
      1 Het algemeen bestuur is samengesteld uit vertegenwoordigers van categorieën van belanghebbenden bij de
      uitoefening van de taken van het waterschap.

      2 In het algemeen bestuur zijn de volgende categorieën van belanghebbenden vertegenwoordigd:

      a. de ingezetenen;

      b. degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken, niet
      zijnde natuurterreinen als bedoeld in [artikel 116, onder c][ref1];

      c. degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van natuurterreinen als bedoeld in
      [artikel 116, onder c][ref2];

      d. degenen die krachtens eigendom, bezit, beperkt recht of persoonlijk recht gebouwde onroerende zaken in gebruik
      hebben als bedrijfsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '116'
        hoofdstuk: XVII
  - number: '13'
    text: |-
      1 Het algemeen bestuur bestaat uit een bij reglement vastgesteld aantal leden van ten minste achttien en ten
      hoogste dertig leden.

      2 Voor de bepaling van het aantal vertegenwoordigers van elk van de in [artikel 12][ref1] bedoelde categorieën
      wordt in aanmerking genomen de aard en de omvang van het belang of de belangen die de categorie heeft bij de
      uitoefening van de taken van het waterschap.

      3 Het totaal aantal vertegenwoordigers van de in [artikel 12, tweede lid, onderdelen b, c en d][ref2], bedoelde
      categorieën bedraagt ten minste zeven en ten hoogste negen, met dien verstande dat het totaal aantal ten hoogste
      acht is, indien het algemeen bestuur uit achttien leden bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel12
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel13
