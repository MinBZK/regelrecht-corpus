  - number: 128a
    text: |-
      1 Een besluit als bedoeld in [artikel 7.2, derde lid, aanhef en onder a, van de Waterwet][ref1] wordt genomen door
      de in [artikel 123, derde lid, onderdeel b][ref2], bedoelde ambtenaar van het waterschap.

      2 Een ambtenaar als bedoeld in [artikel 123, derde lid, onderdeel d][ref3], is voor zover dit voor de heffing van
      de in [artikel 7.2 van de Waterwet][ref4] bedoelde waterschapsbelasting redelijkerwijs nodig is, bevoegd:

      a. elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering
      van een woning zonder toestemming van de bewoner te betreden;

      b. monsters te nemen van het afvalwater dat wordt geloosd in de zin van [artikel 7.1 van de Waterwet][ref5].


