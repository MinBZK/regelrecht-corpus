  - number: '128'
    text: |-
      1 Met betrekking tot de bij wege van aanslag geheven waterschapsbelastingen kan in de belastingverordening voor
      de in [artikel 9, eerste en derde lid, van de Algemene wet][ref1] genoemde termijn van ten minste een maand een
      kortere termijn in de plaats worden gesteld.

      2 Met betrekking tot de bij wege van voldoening op aangifte geheven waterschapsbelastingen kan in
      de belastingverordening voor de termijn van een maand, genoemd in [artikel 10, tweede lid][ref2], en
      [artikel 19, eerste, derde en vierde lid, van de Algemene wet][ref3], een kortere termijn in de plaats worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
