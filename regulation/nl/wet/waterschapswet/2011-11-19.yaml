  - number: 122e
    text: |-
      Voor de heffing geldt als grondslag de hoeveelheid en de hoedanigheid van de stoffen die in een kalenderjaar worden
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel122e
  - number: 122f
    text: |-
      1 Voor de heffing geldt als heffingsmaatstaf de vervuilingswaarde van de stoffen die in een kalenderjaar worden
      afgevoerd, waarbij de vervuilingswaarde wordt uitgedrukt in vervuilingseenheden.

      2 Eén vervuilingseenheid vertegenwoordigt met betrekking tot:

      a. het zuurstofverbruik het jaarlijks verbruik van 54,8 kilogram zuurstof;

      b. de gewichtshoeveelheden van de groep van stoffen chroom, koper, lood, nikkel, zilver en zink 1,00 kilogram;

      c. de gewichtshoeveelheden van de groep van stoffen arseen, kwik en cadmium 0,100 kilogram;

      d. de gewichtshoeveelheden van de stof chloride 650 kilogram;

      e. de gewichtshoeveelheden van de stof sulfaat 650 kilogram;

      f. de gewichtshoeveelheden van de stof fosfor 20,0 kilogram.

      3 Het algemeen bestuur kan bij verordening bepalen dat:

      a. de gewichtshoeveelheden met betrekking tot één of meer van de in het tweede lid, onderdelen b tot en met f
      bedoelde stoffen niet worden onderworpen aan de heffing;

      b. het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van één of meer van de in het tweede
      lid, onderdelen b tot en met f bedoelde stoffen:

      1°. tot minimaal nihil wordt verminderd op een door hem vast te stellen wijze;

      2°. op nihil wordt gesteld indien dit aantal, na toepassing van het bepaalde krachtens de onderdelen a en b, niet
      uitgaat boven een door hem vast te stellen aantal vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel122f
  - number: 122g
    text: |-
      1 Het aantal vervuilingseenheden wordt berekend met behulp van door meting, bemonstering en analyse verkregen
      gegevens, overeenkomstig bij algemene maatregel van bestuur te stellen regels.

      2 Bij de maatregel kan worden bepaald dat ter uitvoering van die maatregel nadere regels worden gesteld bij
      verordening van het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel122g
  - number: 122h
    text: |-
      1 In afwijking van [artikel 122g][ref1] wordt de vervuilingswaarde van de stoffen die vanuit een woonruimte worden
      afgevoerd gesteld op drie vervuilingseenheden. De vervuilingswaarde van de stoffen die vanuit een door één persoon
      gebruikte woonruimte worden afgevoerd bedraagt één vervuilingseenheid.

      2 In afwijking van het eerste lid kan bij verordening van het algemeen bestuur worden bepaald dat
      de vervuilingswaarde van de stoffen geheel of gedeeltelijk wordt bepaald aan de hand van de door het
      waterleidingbedrijf geleverde hoeveelheid drinkwater.

      3 De heffing met betrekking tot de in het tweede lid bedoelde woonruimten wordt geheven over het tijdvak van
      12 maanden zoals dat door het betrokken waterleidingbedrijf bij de levering van drinkwater ten behoeve van die
      woonruimten wordt gehanteerd.

      4 Indien het in het derde lid bedoelde tijdvak in twee kalenderjaren is gelegen worden de voor de kalenderjaren
      geldende tarieven per vervuilingseenheid naar tijdsevenredigheid toegepast.

      5 Het eerste lid is niet van toepassing op de voor recreatiedoeleinden bestemde woonruimten die zich bevinden op
      een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de vorige volzin bedoelde
      woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een bedrijfsruimte.

      6 Indien in de loop van een kalenderjaar het gebruik van een woonruimte, waarvan de heffing is bepaald op basis
      van het eerste lid, aanvangt of eindigt, wordt de gebruiker voor een evenredig gedeelte van de op basis van dit lid
      bepaalde aantal vervuilingseenheden aan de heffing onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel122h
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122g
        hoofdstuk: XVIIb
  - number: 122i
    text: |-
      1 In afwijking van [artikel 122g][ref1] wordt de vervuilingswaarde van de stoffen, die vanuit een bedrijfsruimte
      worden afgevoerd, gesteld op drie vervuilingseenheden indien door de heffingplichtige aannemelijk is gemaakt dat
      die vervuilingswaarde minder dan vijf vervuilingseenheden bedraagt en op één vervuilingseenheid indien door de
      heffingplichtige aannemelijk is gemaakt dat die één vervuilingseenheid of minder bedraagt.

      2 In afwijking van [artikel 122g][ref2] wordt de vervuilingswaarde van de stoffen die worden afgevoerd vanuit
      een bedrijfsruimte of een onderdeel van een bedrijfsruimte bestemd om in het kader van de uitoefening van een
      beroep of een bedrijf onder een permanente opstand van glas of kunststof gewassen te telen, gesteld op drie
      vervuilingseenheden per hectare vloeroppervlak waarop onder glas of kunststof wordt geteeld en per deel van een
      hectare vloeroppervlak een evenredig deel van drie vervuilingseenheden.

      3 Indien in de loop van het kalenderjaar het gebruik van een in het tweede lid bedoelde bedrijfsruimte of onderdeel
      van een bedrijfsruimte dan wel van een deel daarvan door de gebruiker aanvangt of eindigt, wordt hij in dat
      kalenderjaar voor die bedrijfsruimte, voor een evenredig gedeelte aan de heffing onderworpen.

      4 Een vervuilingswaarde voor de bedrijfsruimte of het onderdeel van de bedrijfsruimte, berekend op basis van het
      tweede of derde lid van minder dan vijf vervuilingseenheden, wordt op drie vervuilingseenheden, en van één of
      minder dan één vervuilingseenheid op één vervuilingseenheid gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel122i
