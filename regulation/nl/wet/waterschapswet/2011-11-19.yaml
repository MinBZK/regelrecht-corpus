        hoofdstuk: XVII
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '117'
        hoofdstuk: XVII
  - number: '120'
    text: |-
      1 Het algemeen bestuur stelt ten behoeve van de in [artikel 117][ref1] bedoelde heffing een verordening vast,
      waarin voor elk van de categorieën van heffingplichtigen de toedeling van het kostendeel is opgenomen. Bij die
      verordening kan worden bepaald dat kosten van heffing en invordering van de watersysteemheffing en kosten van de
      verkiezing van de leden van het algemeen bestuur rechtstreeks worden toegerekend aan de betrokken categorieën van
      heffingplichtigen.

      2 De toedeling van het kostendeel voor de categorie, bedoeld in [artikel 117, onderdeel a][ref2], wordt bepaald aan
      de hand van de gemiddelde inwonerdichtheid per vierkante kilometer in het gebied van het waterschap. Het door het
      waterschap bij verordening, als bedoeld onder het eerste lid, te bepalen kostenaandeel bedraagt:

      a. minimaal 20% en maximaal 30% wanneer het aantal inwoners per vierkante kilometer niet meer bedraagt dan 500;

      b. minimaal 31% en maximaal 40% wanneer het aantal inwoners per vierkante kilometer meer bedraagt dan 500, maar
      niet meer dan 1000;

      c. minimaal 41% en maximaal 50% wanneer het aantal inwoners per vierkante kilometer meer bedraagt dan 1000.

      3 Het algemeen bestuur kan de in het tweede lid genoemde maximale percentages verhogen tot 40, onderscheidenlijk 50
      en 60 %.

      4 De toedeling van het kostendeel voor de categorieën, bedoeld in [artikel 117, onderdelen b tot en met d][ref3],
      wordt bepaald op basis van de waarde van de onroerende zaken in het economische verkeer. Bij of krachtens algemene
      maatregel van bestuur worden hiertoe nadere regels gesteld.

      5 De in het eerste lid bedoelde verordening behoeft de goedkeuring van gedeputeerde staten. Het besluit tot
      vaststelling van de verordening wordt binnen vier weken na de vaststelling door het algemeen bestuur toegezonden
      aan gedeputeerde staten, met de naar voren gebrachte bedenkingen en overwegingen daaromtrent van het algemeen
      bestuur.

      6 De in het eerste lid bedoelde verordening wordt ten minste eenmaal in de vijf jaren herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel117
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel120
    references:
      - id: ref1
