  - number: '84'
    text: |-
      1 Het dagelijks bestuur is belast met de dagelijkse aangelegenheden van het waterschap.

      2 Het dagelijks bestuur is belast met de voorbereiding van al hetgeen in de vergadering van het algemeen bestuur
      ter overweging en beslissing moet worden gebracht.

      3 Het dagelijks bestuur is belast met de uitvoering van de beslissingen van het algemeen bestuur, tenzij bij het
      reglement de voorzitter hiermede is belast.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel84
  - number: '85'
    text: |-
      1 Met de opsporing van de overtreding van bij keuren strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de bij besluit van het dagelijks bestuur aangewezen
      ambtenaren van het waterschap. Indien bij provinciale verordening het toezicht op de naleving van het bij
      of krachtens die verordening bepaalde is opgedragen aan het dagelijks bestuur, zijn met de opsporing van de
      overtreding daarvan, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref2], belast de bij besluit van
      dat bestuur aangewezen ambtenaren.

      2 De in het eerste lid bedoelde ambtenaren van het waterschap zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179][ref3] tot en met [182][ref4] en [184 van het Wetboek van Strafrecht][ref5],
      voor zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      3 De in het eerste lid bedoelde ambtenaren van het waterschap kunnen binnen vier weken nadat proces-verbaal is
      opgemaakt met de betrokkene in schikking treden.

      4 De opbrengst van de bij wege van schikking vastgestelde en dienovereenkomstig betaalde bedragen komt ten bate van
      het waterschap.

      5 De betaling van het bij schikking bepaalde doet het recht tot strafvordering vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel85
