  - number: '78'
    text: |-
      1 Het algemeen bestuur maakt de verordeningen die het nodig oordeelt voor de behartiging van de taken die het
      waterschap zijn opgedragen.

      2 Tevens stelt het algemeen bestuur vast de legger waarin onderhoudsplichtigen of onderhoudsverplichtingen worden
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel78
  - number: '79'
    text: |-
      1 Het algemeen bestuur stelt een verordening vast waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en belanghebbenden bij de voorbereiding van het beleid van dat bestuur worden betrokken.

      2 De in het eerste lid bedoelde inspraak wordt verleend door toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], voorzover in de verordening niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '80'
    text: |-
      1 Onverminderd het bepaalde bij een ingevolge [artikel 79, eerste lid][ref1], vastgestelde verordening, wordt
      het ontwerp van het besluit tot vaststelling of wijziging van een keur tegelijk met de terinzagelegging daarvan
      toegezonden aan de besturen van de gemeenten in het gebied waarvan de keur van toepassing zal zijn.

      2 Het besluit tot vaststelling of wijziging van een keur wordt binnen vier weken aan gedeputeerde staten
      toegezonden, met de naar voren gebrachte bedenkingen en het standpunt daaromtrent van het algemeen bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel79
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '79'
        hoofdstuk: X
  - number: '81'
    text: |-
      1 Op overtreding van een keur kan als straf worden gesteld hechtenis van ten hoogste drie maanden of geldboete
      van de tweede categorie als bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref1], al dan niet met
      openbaarmaking van de rechterlijke uitspraak.

      2 De in het eerste lid bedoelde strafbare feiten zijn overtredingen.

      3 Indien tijdens het plegen van de overtreding nog geen jaar is verlopen, sedert een vroegere veroordeling van de
      schuldige wegens gelijke overtreding onherroepelijk is geworden, kan hechtenis tot het dubbele van het gestelde
      maximum worden opgelegd. Onder vroegere veroordeling wordt mede verstaan een vroegere veroordeling door een
      strafrechter in een andere lidstaat van de Europese Unie wegens soortgelijke feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '82'
    text: Het algemeen bestuur regelt de bezoldiging van de ambtenaren van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel82
  - number: '83'
    text: |-
      1 Het algemeen bestuur kan aan het dagelijks bestuur bevoegdheden van het algemeen bestuur overdragen, tenzij de
      aard van de bevoegdheid zich tegen overdracht verzet.

      2 Het algemeen bestuur kan het dagelijks bestuur niet overdragen de bevoegdheid tot:

      a. het vaststellen of wijzigen van de begroting;

      b. het vaststellen van de rekening, als bedoeld in [artikel 106][ref1];

      c. het vaststellen van regels als bedoeld in de [artikelen 108][ref2] en [109][ref3];

      d. het heffen van belastingen of rechten;

      e. het vaststellen van verordeningen, behoudens het bepaalde in het derde lid;

      f. het vaststellen van peilbesluiten;

      g. het vaststellen van plannen krachtens bijzondere wetten.

      3 De bevoegdheid tot het maken van keuren kan het algemeen bestuur slechts overdragen voorzover het betreft
      de vaststelling van nadere regels met betrekking tot bepaalde door het algemeen bestuur in zijn verordeningen
      aangewezen onderwerpen.

      4 De voorschriften met betrekking tot de bevoegdheid van het algemeen bestuur, de uitoefening daarvan en
      het toezicht daarop zijn ten aanzien van de met toepassing van het eerste lid overgedragen bevoegdheden van
      overeenkomstige toepassing, met uitzondering van die betreffende vergaderingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel109
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel83
