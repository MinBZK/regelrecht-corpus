        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: '77'
    text: |-
      De in [artikel 56][ref1] omschreven bevoegdheid tot regeling en bestuur berust bij het algemeen bestuur voor zover
      deze niet bij of krachtens reglement dan wel bij wet of bij algemene maatregel van bestuur is toegekend aan het
      dagelijks bestuur of aan de voorzitter.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel56
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel77
