  - number: '119'
    text: |-
      1 Heffingsplichtig in de zin van [artikel 117, onderdelen b, c en d][ref1], zijn degenen die bij het begin van het
      kalenderjaar als rechthebbende in de basisregistratie kadaster is vermeld, tenzij blijkt dat hij op dat tijdstip
      geen rechthebbende krachtens eigendom, bezit of beperkt recht is.

      2 Voor de toepassing van [artikel 117, onderdelen b, c en d][ref2], is heffingplichtig de:

      a. beperkt gerechtigde en niet de eigenaar, ingeval de onroerende zaak is onderworpen aan het recht van beklemming,
      van erfpacht, van opstal of van vruchtgebruik;

      b. eigenaar voor wat betreft het recht van opstal, indien dat recht uitsluitend is gevestigd ten behoeve van de
      aanleg of het onderhoud, dan wel ten behoeve van de aanleg en het onderhoud, van ondergrondse dan wel bovengrondse
      leidingen.

      3 Indien de onroerende zaak is onderworpen aan beperkte rechten als bedoeld in het tweede lid, heeft voor de
      heffingplicht:

      a. de vruchtgebruiker voorrang boven zowel de opstaller als de erfpachter, onderscheidenlijk de beklemde meier;

      b. de opstaller voorrang boven de erfpachter, onderscheidenlijk de beklemde meier.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel117
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel119
    references:
      - id: ref1
