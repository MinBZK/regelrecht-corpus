  - number: 122a
    text: |-
      1 Ter bestrijding van kosten die zijn verbonden aan de behartiging van de taak ter zake van het wegenbeheer kan,
      binnen het gebied waar deze taak wordt uitgevoerd, onder de naam wegenheffing een heffing worden geheven.

      2 De wegenheffing kan worden geheven van hen die:

      a. ingezetenen zijn;

      b. krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken, niet zijnde
      natuurterreinen;

      c. krachtens eigendom, bezit of beperkt recht het genot hebben van natuurterreinen;

      d. krachtens eigendom, bezit of beperkt recht het genot hebben van gebouwde onroerende zaken.

      3 Op het tweede lid is [artikel 116][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
