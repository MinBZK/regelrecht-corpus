        paragraaf: '5'
  - number: 51e
    text: |-
      1 Alvorens zijn functie te kunnen uitoefenen, legt de ombudsman in de vergadering van het algemeen bestuur, in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot ombudsman benoemd te worden, rechtstreeks noch middellijk, onder welke naam of
      welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (verklaar en beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat
      ik mijn plichten als ombudsman naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig!»

      («Dat verklaar en beloof ik!»)

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta ombudsman beneamd te wurden, streekrjocht noch midlik, ûnder wat namme of wat
      ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as
      ombudsman yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 51f
    text: |-
      1 Op voordracht van de ombudsman benoemt het dagelijks bestuur het personeel van de ombudsman dat nodig is voor een
      goede uitoefening van zijn werkzaamheden.

      2 De ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het algemeen,
      noch voor een enkel geval.

      3 Het personeel van de ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens gedraging de
      ombudsman een onderzoek kan instellen.

      4 Het personeel van de ombudsman is ter zake van de werkzaamheden die het voor de ombudsman verricht, uitsluitend
      aan hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51f
  - number: 51g
    text: De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51g
  - number: 51h
    text: |-
      De ombudsman ontvangt een bij verordening van het algemeen bestuur vastgestelde vergoeding voor zijn werkzaamheden
      en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51h
  - number: 51i
    text: |-
      1 Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudscommissie voor het
      waterschap, stelt het algemeen bestuur het aantal leden van de ombudscommissie vast.

      2 Het algemeen bestuur benoemt de leden van de ombudscommissie voor de duur van zes jaar.

      3 Het algemeen bestuur benoemt uit de leden de voorzitter en de plaatsvervangend voorzitter van de ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel51i
  - number: 51j
    text: |-
      1 De ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.

      2 Op de ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 51c, derde en vierde lid][ref1],
      [51d][ref2], [51e][ref3], [51f][ref4] en [51h][ref5] van overeenkomstige toepassing.


