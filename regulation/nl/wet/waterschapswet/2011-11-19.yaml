  - number: '140'
    text: |-
      Met betrekking tot het doen van een vordering als bedoeld in
      [artikel 19, vierde lid, van de Invorderingswet 1990][ref1] zijn de krachtens het tiende lid van dat artikel door
      Onze minister van Financiën gestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0005108/2011-11-19#Artikel140
