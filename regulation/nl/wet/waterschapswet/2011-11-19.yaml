  - number: '28'
    text: |-
      1 Bij het besluit tot instelling van een waterschap wordt het waterschap aangewezen dat met de voorbereiding van de
      verkiezingen belast is.

      2 De in [artikel 18, eerste lid][ref1], bedoelde bevoegdheid, onderscheidenlijk de in
      [artikel 24, eerste lid][ref2], bedoelde bevoegdheden berusten bij het dagelijks bestuur, onderscheidenlijk het
      algemeen bestuur van het ingevolge het eerste lid aangewezen waterschap.

      3 Voorzover ingevolge enig wettelijk voorschrift medewerking moet worden verleend door het algemeen bestuur, door
      het dagelijks bestuur of door de voorzitter van het waterschap, geschiedt dit door het algemeen bestuur, door het
      dagelijks bestuur of door de voorzitter van het ingevolge het eerste lid aangewezen waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel24
