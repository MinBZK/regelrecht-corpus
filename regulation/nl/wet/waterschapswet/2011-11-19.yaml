  - number: '139'
    text: |-
      1 De belastingverordening kan van [artikel 9 van de Invorderingswet 1990][ref1] afwijkende voorschriften inhouden.

      2 De belastingverordening kan bepalen dat het verschuldigde bedrag moet worden betaald gelijktijdig met en op
      dezelfde wijze als de voldoening van een andere vordering aan de schuldeiser van die andere vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel9
