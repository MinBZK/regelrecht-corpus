  - number: 122j
    text: |-
      Het aantal vervuilingseenheden in een kalenderjaar kan geheel of gedeeltelijk door middel van schatting worden
      vastgesteld indien door de heffingplichtige:

      a. de meting, bemonstering en analyse niet of niet geheel is geschied in overeenstemming met de in
      [artikel 122g][ref1] bedoelde regels;

      b. het aantal vervuilingseenheden niet is berekend met behulp van meting, bemonstering en analyse en bepaling
      van de vervuilingswaarde op basis van [artikel 122h, eerste lid][ref2], [122i, eerste of tweede lid][ref3], of
      [122k, eerste lid of vierde lid][ref4], niet mogelijk is;

      c. het aantal vervuilingseenheden niet is berekend met behulp van meting, bemonstering, bepaling van de
      vervuilingswaarde op basis van [artikel 122k, vierde lid][ref5], wel mogelijk is, maar door de heffingplichtige
      gedurende het heffingsjaar geen verzoek als bedoeld in [dat artikel][ref6] is gedaan.


