      1 Voor zover dit niet bij de wet is geschied, worden voor de voorzitter op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties bij of krachtens algemene maatregel van bestuur regels gesteld
      betreffende:

      a. benoeming, herbenoeming, schorsing, tijdelijk niet uitoefenen van zijn functie en ontslag;

      b. aanspraken in geval van ziekte;

      c. andere aangelegenheden, zijn rechtspositie betreffende, die regeling behoeven.

      2 Bij de in het eerste lid bedoelde regels kunnen voorzieningen worden getroffen die ten laste van het waterschap
      komen.

      3 Buiten hetgeen hem bij of krachtens de wet is toegekend, geniet de voorzitter als zodanig geen inkomsten, in
      welke vorm ook, ten laste van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel49
  - number: '50'
    text: |-
      1 Alvorens zijn ambt te aanvaarden legt de voorzitter in handen van de commissaris van de Koning dan wel, indien
      het een interprovinciaal waterschap betreft, van Onze daartoe in het reglement aangewezen commissaris van de
      Koning, de volgende eed (verklaring en belofte) af:

      "Ik zweer (verklaar) dat ik, om tot voorzitter benoemd te worden, rechtstreeks noch middellijk, onder welke naam of
      welk voorwendsel ook, aan iemand enige gift of gunst heb gedaan of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk van
      iemand enig geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als voorzitter naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig!

      (Dat verklaar en beloof ik!)".

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta foarsitter beneamd te wurden, streekrjocht noch midlik, ûnder wat namme of wat
      ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as
      foarsitter yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel50
