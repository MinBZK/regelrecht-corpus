  - number: 122c
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      − *afvalwater:* stedelijk afvalwater als bedoeld in de [Omgevingswet][ref1];

      − *afvoeren:* brengen van stoffen op een openbaar vuilwaterriool of op een systeem als bedoeld in
      [artikel 2.16, derde lid, van de Omgevingswet][ref2] dat wordt beheerd door of namens het waterschap;

      − *bedrijfsruimte:* naar zijn aard en inrichting als afzonderlijk geheel te beschouwen ruimte of terrein, niet
      zijnde een woonruimte, een zuiveringtechnisch werk of een openbaar vuilwaterriool;

      − *drinkwater:* drinkwater als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref3];

      − *drinkwaterbedrijf:* drinkwaterbedrijf als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref4];

      − *hernieuwbare energie:* hernieuwbare energie als bedoeld in [artikel 116][ref5];

      − *ingenomen water:* geleverd drink- en industriewater en warm tapwater, onttrokken grond- en oppervlaktewater en
      opgevangen hemelwater;

      − *openbaar vuilwaterriool:* openbaar vuilwaterriool als bedoeld in de [Omgevingswet][ref6];

      − *primair energiegebruik:* primair energiegebruik als bedoeld in [artikel 116][ref7];

      − *stoffen:* afvalstoffen, verontreinigende of schadelijke stoffen;

      − *warm tapwater:* warm tapwater als bedoeld in [artikel 1, eerste lid, van de Drinkwaterwet][ref8];

      − *woonruimte:* woonruimte als bedoeld in [artikel 116][ref9];

      − *zuiveringtechnisch werk:* werk voor het zuiveren van afvalwater of het transport van afvalwater, niet zijnde een
      openbaar vuilwaterriool.


