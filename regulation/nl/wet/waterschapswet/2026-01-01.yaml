  - number: '103'
    text: |-
      1 Het dagelijks bestuur legt aan het algemeen bestuur over elk begrotingsjaar verantwoording af over het door hem
      gevoerde bestuur, onder overlegging van de jaarrekening en het jaarverslag.

      2 Het dagelijks bestuur voegt daarbij de verslagen, bedoeld in [artikel 109a, tweede lid][ref1].

      3 De in het eerste en tweede lid, alsmede de in [artikel 109, derde en vierde lid][ref2], bedoelde stukken liggen,
      zodra zij aan het algemeen bestuur zijn overgelegd, voor een ieder ter inzage en zijn algemeen verkrijgbaar. Van de
      terinzage legging en de verkrijgbaarstelling wordt openbaar kennis gegeven. Het algemeen bestuur beraadslaagt over
      de jaarrekening en het jaarverslag niet eerder dan twee weken na de openbare kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel109a
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel109
