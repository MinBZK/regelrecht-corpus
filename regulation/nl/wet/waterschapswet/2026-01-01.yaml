  - number: '9'
    text: |-
      1 Indien aan een uitnodiging als bedoeld in [artikel 8, eerste lid][ref1], niet binnen de gestelde termijn gevolg
      is gegeven, kan, behoudens verlenging van die termijn, bij algemene maatregel van bestuur overeenkomstig de
      strekking van de uitnodiging een waterschap worden opgeheven of ingesteld alsmede het reglement voor een waterschap
      worden vastgesteld of gewijzigd. [Artikel 27d van de Wet op de Raad van State][ref2] is van overeenkomstige
      toepassing.

      2 Alvorens een voordracht tot die algemene maatregel van bestuur te doen, geeft Onze Minister van Infrastructuur en
      Waterstaat overeenkomstige toepassing aan [artikel 4][ref3] en hoort hij gedeputeerde staten van de desbetreffende
      provincie of provincies.

      3 De algemene maatregel van bestuur treedt niet eerder in werking dan acht weken na de datum waarop deze in het
      *Staatsblad* is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide Kamers der Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel8
