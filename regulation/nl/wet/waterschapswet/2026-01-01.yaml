  - number: '122'
    text: |-
      1 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref1] kan het algemeen bestuur in
      de in [artikel 120, eerste lid][ref2], genoemde verordening de heffing maximaal 75% lager vaststellen
      voor buitendijks gelegen onroerende zaken en voor onroerende zaken die blijkens de legger, bedoeld in
      [artikel 2.39 van de Omgevingswet][ref3] als waterberging worden gebruikt.

      2 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref4] kan het algemeen bestuur in de in
      [artikel 120, eerste lid][ref5], genoemde verordening de heffing maximaal 100% hoger vaststellen voor onroerende
      zaken gelegen in bemalen gebieden.

      3 In afwijking van [artikel 121, eerste lid, onderdelen b, c, en d][ref6] kan het algemeen bestuur in de in
      [artikel 120, eerste lid][ref7], genoemde verordening de heffing:

      a. maximaal 100% hoger vaststellen voor onroerende zaken die in hoofdzaak bestaan uit glasopstanden als bedoeld in
      [artikel 220d, eerste lid, onderdeel b, van de Gemeentewet][ref8];

      b. maximaal 100% hoger vaststellen voor verharde openbare wegen;

      c. maximaal 100% hoger vaststellen voor ongebouwde onroerende zaken die zijn gelegen in een bepaald gedeelte
      van het gebied van het waterschap waarin door of vanwege het algemeen bestuur van het waterschap een
      wateraanvoerproject tot stand wordt of is gebracht.

      4 De afwijkingen als bedoeld in het eerste, tweede en derde lid kunnen naast elkaar worden toegepast.

      5 Het algemeen bestuur geeft pas toepassing aan het derde lid, onderdeel c, nadat:

      a. door tenminste één belanghebbende een verzoek is ingediend voor een wateraanvoerproject;

      b. de potentiële heffingplichtigen in de gelegenheid zijn gesteld binnen een redelijke termijn schriftelijk of
      elektronisch kenbaar te maken of zij het wateraanvoerproject wenselijk achten;

      c. ten minste de helft van de potentiële heffingplichtigen zich voor of tegen het wateraanvoerproject heeft
      uitgesproken; en

      d. ten minste twee derde deel daarvan zich vóór het wateraanvoerproject heeft uitgesproken.

      6 Potentieel heffingplichtige is degene die op het moment dat uitvoering wordt gegeven aan het vijfde lid,
      onderdeel b, in de basisregistratie kadaster als rechthebbende is vermeld, tenzij blijkt dat hij op dat tijdstip
      geen rechthebbende krachtens eigendom, bezit of beperkt recht is.

      7 De heffing bedoeld in het derde lid, onderdeel c, kan voor de betrokken ongebouwde onroerende zaken op een
      verschillend of een gelijk percentage worden vastgesteld. Bij het vaststellen van een verschillend percentage
      kan het belang van de ongebouwde onroerende zaak bij het wateraanvoerproject vanwege onder meer de ligging en de
      bestemming in aanmerking worden genomen.


