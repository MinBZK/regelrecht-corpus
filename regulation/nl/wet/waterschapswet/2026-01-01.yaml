  - number: 51ao
    text: |-
      In de regeling waarbij de gemeenschappelijke rekenkamer wordt ingesteld, worden ten minste regels gesteld over:

      a. het op verzoek van de voorzitter of het enige lid van de rekenkamer in dienst nemen van de ambtenaren die nodig
      zijn voor een goede uitoefening van de werkzaamheden van de rekenkamer;

      b. de vergoeding die de leden van de rekenkamer voor hun werkzaamheden ontvangen en de tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51ao
  - number: 51b
    text: |-
      1 Met inachtneming van het bepaalde in dit hoofdstuk kan het algemeen bestuur de behandeling van verzoekschriften
      als bedoeld in [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref1] opdragen aan een ombudsman of
      ombudscommissie voor het waterschap, dan wel een gezamenlijke ombudsman of ombudscommissie.

      2 Een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van enig jaar worden
      ingesteld. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot instelling aan de Nationale
      ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling ingaat.

      3 De instelling van een ombudsman of ombudscommissie als bedoeld in het eerste lid kan slechts per 1 januari van
      enig jaar worden beëindigd. Indien het algemeen bestuur hiertoe besluit, zendt het het besluit tot beëindiging van
      de instelling aan de Nationale ombudsman voor 1 juli van het jaar voorafgaand aan het jaar waarin de instelling
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel918
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 9:18
  - number: 51c
    text: |-
      1 Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudsman voor het waterschap,
      benoemt het deze voor de duur van zes jaar.

      2 Het algemeen bestuur benoemt een plaatsvervangend ombudsman. Deze paragraaf is op de plaatsvervangend ombudsman
      van overeenkomstige toepassing.

      3 De ombudsman wordt door het algemeen bestuur ontslagen:

      a. op eigen verzoek;

      b. wanneer hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen;

      c. bij de aanvaarding van een betrekking als bedoeld in [artikel 51d, eerste lid][ref1];

      d. wanneer hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      e. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, hij surseance van betaling heeft verkregen of wegens schulden is gegijzeld;

      f. indien hij naar het oordeel van het algemeen bestuur ernstig nadeel toebrengt aan het in hem gestelde
      vertrouwen.

      4 Het algemeen bestuur stelt de ombudsman op non-activiteit indien hij:

      a. zich in voorlopige hechtenis bevindt;

      b. bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de
      schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft
      verkregen of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51d
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51c
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 51d
        hoofdstuk: VIA
        paragraaf: '2'
  - number: 51d
    text: |-
      1 De ombudsman vervult geen betrekkingen waarvan de uitoefening ongewenst is met het oog op een goede vervulling
      van zijn ambt of op de handhaving van zijn onpartijdigheid en onafhankelijkheid of van het vertrouwen daarin.

      2 [Artikel 32][ref1] is van overeenkomstige toepassing op de ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel32
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51d
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '32'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 51e
    text: |-
      1 Alvorens zijn functie te kunnen uitoefenen, legt de ombudsman in de vergadering van het algemeen bestuur, in
      handen van de voorzitter, de volgende eed (verklaring en belofte) af:

      «Ik zweer (verklaar) dat ik, om tot ombudsman benoemd te worden, rechtstreeks noch middellijk, onder welke naam of
      welk voorwendsel ook, enige gift of gunst heb gegeven of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk enig
      geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (verklaar en beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat
      ik mijn plichten als ombudsman naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig!»

      («Dat verklaar en beloof ik!»)

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta ombudsman beneamd te wurden, streekrjocht noch midlik, ûnder wat namme of wat
      ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as
      ombudsman yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51e
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 51f
    text: |-
      1 Op voordracht van de ombudsman besluit het dagelijks bestuur tot het aangaan van arbeidsovereenkomsten met het
      personeel van de ombudsman dat nodig is voor een goede uitoefening van zijn werkzaamheden.

      2 De ombudsman ontvangt ter zake van de uitoefening van zijn werkzaamheden geen instructies, noch in het algemeen,
      noch voor een enkel geval.

      3 Het personeel van de ombudsman verricht geen werkzaamheden voor een bestuursorgaan naar wiens gedraging de
      ombudsman een onderzoek kan instellen.

      4 Het personeel van de ombudsman is ter zake van de werkzaamheden die het voor de ombudsman verricht, uitsluitend
      aan hem verantwoording schuldig.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51f
  - number: 51g
    text: De ombudsman zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51g
  - number: 51h
    text: |-
      De ombudsman ontvangt een bij verordening van het algemeen bestuur vastgestelde vergoeding voor zijn werkzaamheden
      en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51h
  - number: 51i
    text: |-
      1 Indien het algemeen bestuur de behandeling van verzoekschriften opdraagt aan een ombudscommissie voor het
      waterschap, stelt het algemeen bestuur het aantal leden van de ombudscommissie vast.

      2 Het algemeen bestuur benoemt de leden van de ombudscommissie voor de duur van zes jaar.

      3 Het algemeen bestuur benoemt uit de leden de voorzitter en de plaatsvervangend voorzitter van de ombudscommissie.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51i
  - number: 51j
    text: |-
      1 De ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan het algemeen bestuur.

      2 Op de ombudscommissie en op ieder lid afzonderlijk zijn de [artikelen 51c, derde en vierde lid][ref1],
      [51d][ref2], [51e][ref3], [51f][ref4] en [51h][ref5] van overeenkomstige toepassing.


