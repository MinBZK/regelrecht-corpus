  - number: '23'
    text: |-
      1 De organisatie benoemt een vervanger voor de plaats die is opengevallen als gevolg van een tijdelijk ontslag
      als bedoeld in de [artikelen 21][ref1] en [22][ref2]. De [artikelen 17 tot en met 19][ref3] zijn van toepassing
      op de benoeming en toelating, met dien verstande dat in afwijking van [artikel 18, eerste lid][ref4], de benoeming
      uiterlijk op de tiende dag na de dagtekening van de kennisgeving van benoeming wordt aanvaard.

      2 Degene die als vervanger is benoemd, houdt op lid te zijn met ingang van de dag waarop zestien weken zijn
      verstreken sinds de dag van ingang van het tijdelijk ontslag, onverminderd de mogelijkheid dat het vervangende
      lidmaatschap ingevolge deze wet op een eerder tijdstip eindigt.

      3 Indien de vervanger van het lid van het algemeen bestuur aan wie tijdelijk ontslag is verleend wegens
      zwangerschap en bevalling of ziekte, voortijdig ontslag neemt, dan wel wordt benoemd tot lid van het algemeen
      bestuur voor een plaats die is opengevallen anders dan als gevolg van een tijdelijk ontslag, benoemt de voorzitter
      van de organisatie een nieuwe tijdelijke vervanger voor de resterende periode van het tijdelijk ontslag.

      4 [Artikel 20, zesde lid][ref5], is niet van toepassing op een vervanger.


