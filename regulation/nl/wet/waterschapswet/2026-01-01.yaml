  - number: '10'
    text: |-
      1 Het bestuur van een waterschap bestaat uit een algemeen bestuur, een dagelijks bestuur en een voorzitter,
      onverminderd hetgeen het reglement bepaalt over de benaming van die onderscheidene bestuursorganen.

      2 De voorzitter is voorzitter van het algemeen bestuur en het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel10
  - number: '12'
    text: |-
      1 Het algemeen bestuur is samengesteld uit vertegenwoordigers van categorieën van belanghebbenden bij de
      uitoefening van de taken van het waterschap.

      2 In het algemeen bestuur zijn de volgende categorieën van belanghebbenden vertegenwoordigd:

      a. de ingezetenen;

      b. degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken, niet
      zijnde natuurterreinen als bedoeld in [artikel 116][ref1];

      c. degenen die krachtens eigendom, bezit of beperkt recht het genot hebben van natuurterreinen als bedoeld in
      [artikel 116][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel116
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel12
