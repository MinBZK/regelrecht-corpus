  - number: '117'
    text: |-
      1 Ter bestrijding van kosten die zijn verbonden aan het beheer van watersystemen wordt onder de naam
      watersysteemheffing een heffing geheven van hen die:

      a. ingezetenen zijn;

      b. krachtens eigendom, bezit of beperkt recht het genot hebben van ongebouwde onroerende zaken, niet zijnde
      natuurterreinen;

      c. krachtens eigendom, bezit of beperkt recht het genot hebben van natuurterreinen;

      d. krachtens eigendom, bezit of beperkt recht het genot hebben van gebouwde onroerende zaken.

      2 Uit de opbrengsten van de watersysteemheffing worden tevens de op grond van [artikel 7.24 van de Waterwet][ref1]
      verschuldigde bijdragen bekostigd.

      3 Voorts kan de opbrengst van de watersysteemheffing tevens worden besteed aan de bekostiging van maatregelen
      voor het opwekken van hernieuwbare energie ter compensatie van de uitstoot van broeikasgassen, die vrijkomen als
      gevolg van het beheer van watersystemen en die in redelijkheid niet te vermijden zijn. De hoeveelheid op te wekken
      hernieuwbare energie mag niet hoger zijn dan tweemaal het primaire energiegebruik van het betreffende waterschap
      benodigd voor het beheer van watersystemen.

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop het primaire energiegebruik wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel7.24
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '7.24'
  - number: '118'
    text: |-
      1 Als één gebouwde onroerende zaak als bedoeld in [artikel 117, eerste lid, onderdeel d][ref1], wordt aangemerkt:

      a. een gebouwd eigendom;

      b. een gedeelte van een gebouwd eigendom dat blijkens zijn indeling is bestemd om als een afzonderlijk geheel te
      worden gebruikt;

      c. een samenstel van twee of meer van de in onderdeel a bedoelde gebouwde eigendommen of van in onderdeel b
      bedoelde gedeelten daarvan die bij dezelfde belastingplichtige in gebruik zijn en die, naar de omstandigheden
      beoordeeld, bij elkaar behoren;

      d. het binnen het gebied van een gemeente gelegen deel van een in onderdeel a bedoeld eigendom, van een in
      onderdeel b bedoeld gedeelte of van een in onderdeel c bedoeld samenstel;

      e. het binnen het gebied van het waterschap gelegen deel van een in onderdeel a bedoeld eigendom, van een in
      onderdeel b bedoeld gedeelte, van een in onderdeel c bedoeld samenstel of van een in onderdeel d bedoeld deel.

      2 Voor de toepassing van het eerste lid maken de ongebouwde eigendommen voorzover die een samenstel vormen met
      een gebouwd eigendom als bedoeld in het eerste lid, onderdeel a tot en met e, deel uit van de gebouwde onroerende
      zaak, met uitzondering van de ongebouwde eigendommen, voorzover de waarde daarvan bij de waardebepaling op
      de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref2] op basis van het bepaalde krachtens
      [artikel 18, vierde lid, van die wet][ref3] buiten aanmerking wordt gelaten.

      3 Als één ongebouwde onroerende zaak als bedoeld in [artikel 117, eerste lid, onderdeel b][ref4], wordt aangemerkt
      een kadastraal perceel of gedeelte daarvan, met dien verstande dat buiten aanmerking wordt gelaten:

      a. hetgeen ingevolge het eerste en tweede lid wordt aangemerkt als een gebouwde onroerende zaak;

      b. een natuurterrein.

      4 Als één natuurterrein wordt aangemerkt een kadastraal perceel of gedeelte daarvan, met dien verstande dat buiten
      aanmerking wordt gelaten:

      a. hetgeen ingevolge het eerste en tweede lid wordt aangemerkt als een gebouwde onroerende zaak;

      b. hetgeen ingevolge het derde lid wordt aangemerkt als een ongebouwde onroerende zaak.

      5 Voor de heffing, bedoeld in [artikel 117][ref5], worden openbare land- en waterwegen en banen voor openbaar
      vervoer per rail, één en ander met inbegrip van kunstwerken, alsmede waterverdedigingswerken die worden beheerd
      door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen van
      zodanige werken die dienen als woning, aangemerkt als ongebouwde eigendommen, niet zijnde natuurterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0007119#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0007119#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref5]: https://wetten.overheid.nl/BWBR0005108#Artikel117
