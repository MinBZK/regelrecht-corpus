        artikel: '139'
        hoofdstuk: XVIII
  - number: '142'
    text: |-
      1 Indien ter zake van hetzelfde voorwerp van de belasting of hetzelfde belastbare feit twee of meer personen
      belastingplichtig zijn, kan de belastingaanslag ten name van een van hen worden gesteld.

      2 Indien de belastingplicht, bedoeld in het eerste lid, voortvloeit uit het genot van een onroerende zaak krachtens
      eigendom, bezit of beperkt recht en de aanslag ten name van één van de belastingplichtigen is gesteld, kan de met
      de invordering van waterschapsbelastingen belaste ambtenaar van het waterschap de belastingaanslag op de gehele
      onroerende zaak verhalen ten name van degene te wiens name de aanslag is gesteld, zonder rekening te houden met de
      rechten van de overige belastingplichtigen.

      3 De belastingschuldige die de belastingaanslag heeft voldaan kan hetgeen hij meer heeft voldaan dan overeenkomt
      met zijn belastingplicht verhalen op de overige belastingplichtigen naar evenredigheid van ieders belastingplicht.

      4 Tegen een met toepassing van het eerste lid vastgestelde belastingaanslag kan mede beroep bij de
      rechtbank worden ingesteld door de belastingplichtige wiens naam niet op het aanslagbiljet staat vermeld.
      [Artikel 26a, derde lid, van de Algemene wet][ref1] is van overeenkomstige toepassing.

      5 Van het derde lid kan bij overeenkomst worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel26a
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel142
    references:
