  - number: '29'
    text: |-
      1 Bij een besluit tot instelling van een waterschap als bedoeld in [artikel 2, eerste lid][ref1], wordt bepaald
      dat een algemeen bestuur wordt aangesteld voor het in te stellen waterschap. Op de samenstelling van dit algemeen
      bestuur zijn de [artikelen 12][ref2], [13][ref3] en [14][ref4] van toepassing, met dien verstande dat in de
      artikelen 13, eerste lid, en 14, eerste lid, voor «bij reglement» wordt gelezen: bij het besluit tot instelling van
      het waterschap.

      2 De verdeling van het aantal zetels van het algemeen bestuur, bedoeld in het eerste lid, bestemd voor
      vertegenwoordigers van de categorie van belanghebbenden, bedoeld in [artikel 12, tweede lid, onderdeel a][ref5],
      vindt plaats naar rato van het aantal kiesgerechtigde ingezetenen bij de laatstgehouden verkiezingen in
      elk op te heffen waterschap. De zetels worden toegewezen op grond van de uitslag van deze verkiezingen. De
      [artikelen P 2 tot en met P 19a van de Kieswet][ref6] zijn hierop van toepassing.

      3 Het in het eerste lid bedoelde algemeen bestuur treedt af bij het eindigen van de zittingsperiode, bedoeld in
      [artikel C 4 van de Kieswet][ref7] dan wel bij het opheffen van het desbetreffende waterschap, indien dit eerder
      plaatsvindt.

      4 De commissaris van de Koning benoemt uiterlijk één maand voor de beoogde datum van instelling van het waterschap
      een waarnemend voorzitter. Deze voorzitter treedt af op het tijdstip dat een voorzitter wordt benoemd bij
      koninklijk besluit, bedoeld in [artikel 46, eerste lid][ref8].


