  - number: '144'
    text: |-
      1 De in de [artikelen 26][ref1] en [26a van de Invorderingswet 1990](onbekend) bedoelde kwijtschelding wordt met
      betrekking tot waterschapsbelastingen verleend door de in [artikel 123, derde lid, onderdeel c][ref2], bedoelde
      ambtenaar van het waterschap.

      2 Met betrekking tot het verlenen van gehele of gedeeltelijke kwijtschelding zijn de krachtens
      [artikel 26 van de Invorderingswet 1990][ref3] door Onze Minister van Financiën bij ministeriële regeling gestelde
      regels van toepassing.

      3 Het algemeen bestuur kan bepalen dat, in afwijking van de in het tweede lid bedoelde regels, in het geheel geen
      dan wel gedeeltelijk kwijtschelding wordt verleend.

      4 Met inachtneming van door Onze Minister van Infrastructuur en Waterstaat, in overeenstemming met Onze Minister
      van Financiën, te stellen regels kan het algemeen bestuur met betrekking tot de wijze waarop de kosten van bestaan
      en de wijze waarop het vermogen in aanmerking worden genomen afwijkende regels stellen die er toe leiden dat in
      ruimere mate kwijtschelding wordt verleend.

      5 Het dagelijks bestuur kan de belasting geheel of gedeeltelijk oninbaar verklaren. Het daartoe strekkende besluit
      ontheft de ambtenaar van het waterschap, belast met de invordering van waterschapsbelastingen van de verplichting
      verdere pogingen tot invordering te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel144
