  - number: '114'
    text: |-
      1 Het waterschap kan een precariobelasting heffen voor het hebben van voorwerpen onder, op of boven grond of water
      van het waterschap, voor de openbare dienst bestemd.

      2 Geen belasting wordt geheven ter zake van:

      a. de infrastructuur nodig voor de productie en distributie van drinkwater als bedoeld in
      [artikel 7, eerste lid, onder b][ref1], in samenhang met [artikel 1, eerste lid, van de Drinkwaterwet][ref2];

      b. een systeem dat wordt beheerd door een transmissie- of distributiesysteembeheerder als bedoeld in
      [artikel 1.1 van de Energiewet][ref3]; of

      c. werken als bedoeld in [artikel 38 van de Warmtewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0033729#Artikel38
