  - number: '131'
    text: |-
      Indien bezwaar wordt gemaakt zowel tegen een belastingaanslag in de heffing ter zake van een gebouwde of ongebouwde
      onroerende zaak als tegen een op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref1] gegeven
      beschikking welke ten grondslag heeft gelegen aan die belastingaanslag, vangt, ingeval feiten en omstandigheden
      in het geding zijn die van belang zijn zowel voor de heffing ter zake van een gebouwde of ongebouwde onroerende
      zaak als voor de vaststelling van de waarde op de voet van genoemd [hoofdstuk IV][ref2], de termijn waarbinnen
      de in [artikel 123, derde lid, onderdeel b,][ref3] bedoelde ambtenaar van het waterschap uitspraak doet op het
      eerstbedoelde bezwaar aan, in afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref4], op
      het tijdstip waarop de op de voet van genoemd [hoofdstuk IV][ref5] gegeven beschikking onherroepelijk is komen vast
      te staan.


