  - number: 31b
    text: |-
      Ter vervulling van een tussentijds opengevallen plaats is niet benoembaar tot lid van het algemeen bestuur hij
      die na de laatstgehouden periodieke verkiezing van de leden in het algemeen bestuur, behorende bij de categorie
      van belanghebbenden, bedoeld in [artikel 12, tweede lid, onderdeel a][ref1], wegens handelen in strijd met
      [artikel 33][ref2] van het lidmaatschap van het algemeen bestuur is vervallen verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel33
