    text: |-
      1 De voorzitter van het waterschap wordt benoemd en herbenoemd bij koninklijk besluit. Hij kan bij koninklijk
      besluit worden geschorst en ontslagen.

      2 De benoeming geschiedt voor de tijd van zes jaar.

      3 Voor de benoeming maakt het algemeen bestuur een aanbeveling op. Indien bij de totstandkoming van de benoeming
      wordt gestemd, geschiedt deze stemming geheim. Bij de aanbeveling zijn de naar het oordeel van het algemeen
      bestuur voor de geschiktheid van belang zijnde overwegingen gevoegd. Het algemeen bestuur zendt de aanbeveling
      aan gedeputeerde staten, die deze vergezeld van hun beschouwingen zenden aan Onze Minister van Infrastructuur en
      Waterstaat.

      4 Indien Onze Minister van Infrastructuur en Waterstaat van oordeel is dat de op de aanbeveling geplaatste persoon
      of personen ongeschikt zijn, verzoekt hij om een nieuwe aanbeveling.

      5 Een voordracht van een niet op de aanbeveling geplaatste persoon geschiedt niet alvorens het algemeen bestuur en
      gedeputeerde staten zijn gehoord.

      6 De rijksbelastingdienst verstrekt Onze Minister van Infrastructuur en Waterstaat de benodigde gegevens inzake
      bestuurlijke boeten als bedoeld in [hoofdstuk VIIIA van de Algemene wet inzake rijksbelastingen][ref1] en inzake
      strafbeschikkingen als bedoeld in [artikel 76 van die wet][ref2], voor zover deze boeten en beschikkingen zijn
      opgelegd dan wel hadden kunnen worden opgelegd ter zake van feiten die zijn gebleken na de termijn om deze op te
      leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel76
