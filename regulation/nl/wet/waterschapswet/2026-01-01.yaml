  - number: 51am
    text: |-
      1 De [artikelen 51ab tot en met 51af][ref1], [51ah][ref2], [51ai][ref3] en
      [51aj, eerste, derde, en vierde lid][ref4], zijn van overeenkomstige toepassing op de gemeenschappelijke
      rekenkamer, met dien verstande dat in de [artikelen 51ab tot en met 51ad][ref5], 51ai, tweede lid, en 51aj, eerste
      lid, voor «het algemeen bestuur» telkens wordt gelezen «de algemene besturen van de deelnemende waterschappen
      gezamenlijk» of, indien de rekenkamer mede is ingesteld door provincies of gemeenten, «provinciale staten, de raden
      en de algemene besturen van de deelnemende provincies, gemeenten en waterschappen gezamenlijk».

      2 [Artikel 51ag][ref6] is op de gemeenschappelijke rekenkamer van toepassing, met dien verstande dat voor «het
      algemeen bestuur» wordt gelezen «het algemeen bestuur van het waterschap die daartoe in de regeling waarbij
      de gemeenschappelijke rekenkamer is ingesteld, is aangewezen» of, indien de rekenkamer mede is ingesteld door
      provincies of gemeenten, «provinciale staten van de provincie, de raad van de gemeente of het algemeen bestuur
      van het waterschap die daartoe in de regeling waarbij de gemeenschappelijke regeling is ingesteld zijn of is
      aangewezen».


