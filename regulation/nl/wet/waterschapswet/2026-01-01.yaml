  - number: '26'
    text: |-
      1 Voor de toepassing van deze paragraaf wordt aan de instelling van een nieuw waterschap gelijkgesteld de overgang
      van een aanmerkelijk gedeelte van het gebied van een waterschap naar dat van een ander waterschap.

      2 Voor de toepassing van deze paragraaf wordt aan de opheffing van een waterschap gelijkgesteld de overgang van een
      aanmerkelijk gedeelte van het gebied van dat waterschap naar een ander waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel26
  - number: '28'
    text: |-
      1 Bij het besluit tot instelling van een waterschap wordt het waterschap aangewezen dat met de voorbereiding van
      die instelling belast is.

      2 De in [artikel E 13, eerste en derde lid, van de Kieswet][ref1] bedoelde bevoegdheid, onderscheidenlijk
      de in de [artikelen V 4, eerste lid][ref2], en [V 4a, eerste lid, van de Kieswet][ref3] en
      [artikel 19, eerste lid][ref4], bedoelde bevoegdheden berusten bij het dagelijks bestuur, onderscheidenlijk het
      algemeen bestuur van het ingevolge het eerste lid aangewezen waterschap.

      3 Voorzover ingevolge enig wettelijk voorschrift medewerking moet worden verleend door het algemeen bestuur, door
      het dagelijks bestuur of door de voorzitter van het waterschap, geschiedt dit door het algemeen bestuur, door het
      dagelijks bestuur of door de voorzitter van het ingevolge het eerste lid aangewezen waterschap.


