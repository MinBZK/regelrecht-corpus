  - number: 122k
    text: |-
      1 Indien de heffingplichtige aannemelijk maakt dat het aantal vervuilingseenheden met betrekking tot het
      zuurstofverbruik in een kalenderjaar voor een bedrijfsruimte of een onderdeel daarvan, die hij gebruikt, 1000
      of minder bedraagt, en dat dit aantal aan de hand van de hoeveelheid ten behoeve van die bedrijfsruimte of
      dat onderdeel van die bedrijfsruimte ingenomen water bepaald kan worden, wordt dat aantal in afwijking van
      [artikel 122g][ref1] vastgesteld volgens de formule: A x B, waarbij,

      A = het aantal m3 in het kalenderjaar ten behoeve van de bedrijfsruimte of het onderdeel van de bedrijfsruimte
      ingenomen water;

      B = de afvalwatercoëfficiënt behorende bij klasse acht van de in het derde lid opgenomen tabel of indien de
      heffingplichtige of de in [artikel 123, derde lid, onderdeel b][ref2], bedoelde ambtenaar van het waterschap doet
      blijken dat een andere klasse dan acht van toepassing is, de afvalwatercoëfficiënt behorende bij een andere klasse
      van de in het derde lid opgenomen tabel met de klassegrenzen waarbinnen de vervuilingswaarde met betrekking tot
      het zuurstofverbruik per m3 ten behoeve van de bedrijfsruimte of van het onderdeel van de bedrijfsruimte ingenomen
      water is gelegen.

      2 Bij algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de vervuilingswaarde met
      betrekking tot het zuurstofverbruik per m3 ten behoeve van de bedrijfsruimte of het onderdeel van de bedrijfsruimte
