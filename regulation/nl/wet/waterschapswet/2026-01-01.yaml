        artikel: '2.16'
  - number: '2'
    text: |-
      1 De bevoegdheid tot het opheffen en het instellen van waterschappen, tot regeling van hun gebied, taken,
      inrichting, samenstelling van hun bestuur en tot de verdere reglementering van waterschappen behoort aan
      provinciale staten, behoudens het elders in deze wet bepaalde. De uitoefening van deze bevoegdheid geschiedt bij
      provinciale verordening.

      2 Voor de uitoefening van de in het eerste lid bedoelde bevoegdheid geldt dat taken, als bedoeld in
      [artikel 1, tweede lid, eerste volzin][ref1], aan waterschappen worden opgedragen, tenzij dit niet verenigbaar is
      met het belang van een goede organisatie van de waterstaatkundige verzorging.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel1
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel2
    references:
