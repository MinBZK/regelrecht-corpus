  - number: 115a
    text: |-
      1 Een aanslag die een bij de belastingverordening te bepalen bedrag niet te boven gaat, wordt niet opgelegd.

      2 Voor de toepassing van het eerste lid wordt het totaal van de op één aanslagbiljet verenigde aanslagen aangemerkt
      als één aanslag.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel115a
  - number: '116'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      − *hernieuwbare energie:* energie uit hernieuwbare bronnen als bedoeld in artikel 2, onderdeel 1, van [Richtlijn
      (EU) 2018/2001](32018L2001) van het Europees Parlement en de Raad van 11 december 2018 ter bevordering van het
      gebruik van energie uit hernieuwbare bronnen (PbEU 2018, L 328);

      − *ingezetene:* degene die blijkens de basisregistratie personen bij het begin van het kalenderjaar woonplaats
      heeft in het gebied van het waterschap en die aldaar gebruik heeft van woonruimte, met dien verstande dat gebruik
      van woonruimte door de leden van een gezamenlijke huishouding wordt aangemerkt als gebruik door een lid van dat
      huishouden, dat wordt aangewezen door de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van
      het waterschap;

      − *natuurterreinen:* ongebouwde onroerende zaken waarvan de inrichting en het beheer geheel of nagenoeg geheel en
      duurzaam zijn afgestemd op het behoud of de ontwikkeling van natuur. Onder natuurterreinen worden mede verstaan
      bossen en open wateren met een oppervlakte van ten minste één hectare;

      − *onroerende zaken die in hoofdzaak tot woning dienen:* onroerende zaken als bedoeld in
      [artikel 220a, tweede lid, van de Gemeentewet][ref2];

      − *primair energiegebruik:* totale energetische waarde van de verbruikte primaire energiedragers, waarbij
      de energetische waarde van de secundaire energiedragers elektriciteit en warmte wordt teruggerekend naar de
      stookwaarde van de primaire energiedragers;

      − *woonruimte:* ruimte die blijkens zijn inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel220a
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel116
