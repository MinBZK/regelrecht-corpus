  - number: '133'
    text: |-
      In de gevallen waarin het volkenrecht dan wel, naar het oordeel van Onze Minister van Infrastructuur en
      Waterstaat en Onze Minister van Financiën, het internationale gebruik daartoe noodzaakt, wordt vrijstelling van
      waterschapsbelastingen verleend. Onze genoemde Ministers kunnen gezamenlijk ter zake nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel133
  - number: '134'
    text: |-
      Naast een in de belastingverordening voorziene vermindering, ontheffing of teruggaaf kan door de in
      [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap ook een in die verordening
      voorziene vrijstelling ambtshalve worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
        hoofdstuk: XVIII
  - number: '136'
    text: |-
      Op overtreding van een in de belastingverordening voorkomende bepaling betreffende heffing en invordering kan,
      voor zover die overtreding is aangemerkt als strafbaar feit, uitsluitend een geldboete worden gesteld en wel een
      geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel136
  - number: '138'
    text: |-
      1 Bij de invordering van waterschapsbelastingen blijven van de [Invorderingswet 1990][ref1] buiten toepassing de
      [artikelen 5][ref2], [7c][ref3], [20][ref4], [21][ref5], [59][ref6], [62][ref7] en [69][ref8]. Bij de invordering
      van waterschapsbelastingen die niet bij wege van aanslag of bij wege van voldoening op aangifte worden geheven,
      blijft bovendien [artikel 8, eerste lid, van die wet][ref9], buiten toepassing.

      2 Met betrekking tot waterschapsbelastingen die niet bij wege van aanslag of bij wege van voldoening op aangifte
      worden geheven, kan in de belastingverordening worden bepaald dat een andere ambtenaar van het waterschap dan
      de met de invordering van waterschapsbelastingen belaste ambtenaar van het waterschap mede wordt belast met de
      invordering van die belastingen.

      3 Voor waterschapsbelastingen ter zake van onroerende zaken, voor zover deze worden geheven van de eigenaar of van
      de genothebbende krachtens een beperkt recht, heeft het waterschap een voorrecht op de onroerende zaken waarop de
      aanslag in een zodanige belasting betrekking heeft, en op de beperkte rechten waaraan die zaken zijn onderworpen.
      Het voorrecht gaat boven hypotheek en boven alle andere voorrechten, met uitzondering van het voorrecht van
      [artikel 288 onder a][ref10], alsmede dat van [artikel 284 van Boek 3 van het Burgerlijk Wetboek][ref11], voor
      zover de daar bedoelde kosten na de vaststelling van de aanslag zijn gemaakt.


