  - number: '31'
    text: |-
      1 Voor het lidmaatschap van het algemeen bestuur is vereist dat men ingezetene is, de leeftijd van achttien jaren
      heeft bereikt en niet krachtens [artikel B 5, eerste lid, van de Kieswet][ref1] van het kiesrecht is uitgesloten.
      Het vereiste van ingezetenschap geldt niet voor de vertegenwoordigers van de categorie belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdeel c][ref2].

      2 Een lid van het algemeen bestuur is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref3];

      g. commissaris van de Koning;

      h. lid van provinciale staten;

      i. gedeputeerde;

      j. secretaris van de provincie;

      k. griffier van de provincie;

      l. burgemeester;

      m. wethouder;

      n. ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref4];

      o. ambtenaar, in dienst van het waterschap of uit anderen hoofde aan het waterschapsbestuur ondergeschikt of
      werkzaam ten behoeve van dat waterschap;

      p. ambtenaar, in dienst van de provincie, tot wiens taak behoort het verrichten van werkzaamheden in het kader van
      het toezicht op het waterschap;

      q. lid van het algemeen bestuur of van het dagelijks bestuur van een ander waterschap.

      3 Zodra een lid dat vertegenwoordiger is van een van de categorieën van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdelen b en c][ref5], niet blijkt te voldoen aan een van de in het eerste lid bedoelde
      vereisten of een in het tweede lid bedoelde betrekking blijkt te vervullen, houdt deze op lid te zijn. In dat geval
      is [artikel X 4a van de Kieswet][ref6] van overeenkomstige toepassing.


