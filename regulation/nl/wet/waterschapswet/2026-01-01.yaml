  - number: '32'
    text: |-
      1 De leden van het algemeen bestuur maken openbaar welke andere functies dan het lidmaatschap van het algemeen
      bestuur zij vervullen.

      2 Openbaarmaking vindt plaats terstond na benoeming tot lid van het algemeen bestuur of aanvaarding van een andere
      functie als bedoeld in het eerste lid en geschiedt zowel op elektronische wijze als door terinzagelegging van een
      opgave van de andere functies op de secretarie van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel32
  - number: 32a
    text: |-
      1 De leden van het algemeen bestuur die geen lid zijn van het dagelijks bestuur ontvangen een bij verordening van
      het algemeen bestuur vast te stellen vergoeding voor hun werkzaamheden en een tegemoetkoming in de kosten.

      2 Het algemeen bestuur kan bij verordening regels stellen over de tegemoetkoming in of vergoeding van bijzondere
      kosten en over andere voorzieningen die verband houden met de vervulling van het lidmaatschap van het algemeen
      bestuur.

      3 Buiten hetgeen hun bij of krachtens de wet is toegekend, ontvangen de leden van het algemeen bestuur als zodanig
      geen andere vergoedingen en tegemoetkomingen ten laste van het waterschap. Voordelen ten laste van het waterschap,
      anders dan in de vorm van vergoedingen en tegemoetkomingen, genieten zij slechts voor zover dat is bepaald bij
      of krachtens de wet dan wel bij verordening van het algemeen bestuur. De verordening behoeft de goedkeuring van
      gedeputeerde staten.

      4 De verordeningen, bedoeld in het eerste en tweede lid, worden vastgesteld overeenkomstig bij of krachtens
      algemene maatregel van bestuur te stellen regels. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties doet
      de voordracht voor deze algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel32a
  - number: '33'
    text: |-
      1 Een lid van het algemeen bestuur mag niet:

      a. als advocaat of adviseur in geschillen werkzaam zijn ten behoeve van het waterschap of het waterschapsbestuur
      dan wel ten behoeve van de wederpartij van het waterschap of het waterschapsbestuur;

      b. als gemachtigde in geschillen werkzaam zijn ten behoeve van de wederpartij van het waterschap of het
      waterschapsbestuur;

      c. als vertegenwoordiger of adviseur werkzaam zijn ten behoeve van derden tot het met het waterschap aangaan van:

      1°. overeenkomsten als bedoeld in onderdeel d;

      2°. overeenkomsten tot het leveren van onroerende zaken aan het waterschap;

      d. rechtstreeks of middellijk een overeenkomst aangaan betreffende:

      1°. het aannemen van werk ten behoeve van het waterschap;

      2°. het buiten dienstbetrekking tegen beloning verrichten van werkzaamheden ten behoeve van het waterschap;

      3°. het leveren van roerende zaken anders dan om niet aan het waterschap;

      4°. het verhuren van roerende zaken aan het waterschap;

      5°. het verwerven van betwiste vorderingen ten laste van het waterschap;

      6°. het van het waterschap onderhands verwerven van onroerende zaken of beperkte rechten waaraan deze zijn
      onderworpen;

      7°. het onderhands huren of pachten van het waterschap.

      2 Van het eerste lid, aanhef en onderdeel d, kunnen gedeputeerde staten ontheffing verlenen.

      3 Het algemeen bestuur stelt voor zijn leden, voor de leden van het dagelijks bestuur en voor de voorzitter een
      gedragscode vast.

      4 Ten aanzien van een lid dat vertegenwoordiger is van de categorieën van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdelen b en c][ref1], dat handelt in strijd met het bepaalde in het eerste lid,
      zijn de [artikelen X 7a, eerste tot en met vijfde lid][ref2], en [X 9 van de Kieswet][ref3], van overeenkomstige
      toepassing.


