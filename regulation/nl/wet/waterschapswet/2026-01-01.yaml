  - number: '21'
    text: |-
      1 De voorzitter van het algemeen bestuur verleent aan een lid van dat bestuur op diens verzoek tijdelijk ontslag
      wegens zwangerschap en bevalling op de in het verzoek vermelde dag die ligt tussen ten hoogste zes en ten minste
      vier weken voor de vermoedelijke datum van de bevalling, zoals die blijkt uit een door het lid overgelegde
      verklaring van een arts of verloskundige.

      2 De voorzitter van het algemeen bestuur verleent aan een lid van dat bestuur op diens verzoek tijdelijk ontslag,
      indien het lid wegens ziekte niet in staat is het lidmaatschap uit te oefenen en blijkens de verklaring van een
      arts aannemelijk is dat hij de uitoefening van het lidmaatschap niet binnen acht weken zal kunnen hervatten. Het
      tijdelijk ontslag gaat in op de dag na de bekendmaking van de beslissing op het verzoek.

      3 Het lidmaatschap van het lid aan wie tijdelijk ontslag als bedoeld in het eerste lid of tweede lid is verleend,
      herleeft van rechtswege met ingang van de dag waarop zestien weken zijn verstreken sinds de dag van ingang van het
      tijdelijk ontslag.

      4 Aan een lid van het algemeen bestuur wordt ten hoogste drie maal per zittingsperiode tijdelijk ontslag als
      bedoeld in het eerste of het tweede lid verleend.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel21
  - number: '22'
    text: |-
      1 De voorzitter van het algemeen bestuur beslist op een verzoek tot tijdelijk ontslag als bedoeld in
      [artikel 21, eerste of tweede lid][ref1], zo spoedig mogelijk, doch uiterlijk op de veertiende dag na indiening van
      het verzoek.

      2 De beslissing op het verzoek tot tijdelijk ontslag geschiedt in overeenstemming met de verklaring van de arts of
      verloskundige, bedoeld in [artikel 21, eerste of tweede lid][ref2].

      3 Een beslissing tot tijdelijk ontslag bevat de dag van ingang van het ontslag.

      4 De voorzitter van het algemeen bestuur geeft van een beslissing tot tijdelijk ontslag onmiddellijk kennis aan
      de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel21
