        artikel: 44a
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '44'
        hoofdstuk: V
        paragraaf: '2'
  - number: 44k
    text: |-
      1 Een lid van het dagelijks bestuur vervult geen nevenfuncties waarvan de uitoefening ongewenst is met het oog op
      een goede vervulling van zijn functie als lid van het dagelijks bestuur van een waterschap.

      2 Een lid van het dagelijks bestuur meldt zijn voornemen tot aanvaarding van een nevenfunctie aan het algemeen
      bestuur.

      3 Een lid van het dagelijks bestuur maakt zijn nevenfuncties openbaar. De openbaarmaking vindt plaats terstond na
      benoeming tot lid van het dagelijks bestuur of aanvaarding van een nevenfunctie en geschiedt zowel op elektronische
      wijze als door terinzagelegging op de secretarie van het waterschap.

      4 Een lid van het dagelijks bestuur dat zijn ambt niet in deeltijd vervult, maakt tevens de inkomsten uit
      nevenfuncties openbaar. Openbaarmaking geschiedt zowel op elektronische wijze als door terinzagelegging op de
      secretarie van het waterschap uiterlijk op 1 april na het kalenderjaar waarin de inkomsten zijn genoten.

      5 Onder inkomsten wordt verstaan: loon in de zin van [artikel 9 van de Wet op de loonbelasting 1964][ref1],
      verminderd met de eindheffingsbestanddelen bedoeld in [artikel 31 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
