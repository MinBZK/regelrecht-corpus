        paragraaf: '2'
  - number: 44b
    text: Onverschuldigd betaalde bezoldiging kan worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44b
  - number: 44c
    text: |-
      1 Met de bezoldiging kan worden verrekend hetgeen het lid van het dagelijks bestuur zelf als zodanig aan het
      waterschap verschuldigd is.

      2 Verrekening als bedoeld in het eerste lid kan plaatshebben ondanks gelegd beslag of toegepaste korting als
      bedoeld in [artikel 44d, eerste lid][ref1].

      3 Verrekening als bedoeld in het eerste lid is slechts in zoverre geldig als een beslag op die bezoldiging
      geldig zou zijn, met dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding is
      verschuldigd eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel44d
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44c
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 44d
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 44d
    text: |-
      1 Op de bezoldiging kan ten behoeve van een schuldeiser van het lid van het dagelijks bestuur een korting worden
      toegepast, mits het lid van het dagelijks bestuur de vordering van de schuldeiser erkent dan wel het bestaan van de
      vordering blijkt uit een in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een authentieke akte.

      2 Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.

      3 Beslag, faillissement, surseance van betaling en toepassing ten aanzien van het lid van het dagelijks bestuur van
      de schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44d
  - number: 44e
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      worden, onverminderd [artikel 44c, tweede lid][ref2], en [artikel 44d, derde lid][ref3], verrekening en korting
      gelijkgesteld met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel44c
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel44d
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44e
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0005108
        artikel: 44c
        hoofdstuk: V
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005108
        artikel: 44d
        hoofdstuk: V
        paragraaf: '2'
  - number: 44f
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging,
      geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang heeft boven
      de anderen.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44f
  - number: 44g
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor het lid van het dagelijks bestuur enig recht op zijn
      bezoldiging aan een derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.

      2 Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is
      verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44g
  - number: 44h
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlasten het waterschap, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon
      worden ingetrokken, toen het waterschap van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44h
  - number: 44i
    text: |-
      Beslag omvat in deze wet ook de invordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44i
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 44j
    text: |-
      Met bezoldiging worden in de [artikelen 44a tot en met 44h][ref1] gelijkgesteld de bedragen – onder
      de benaming van uitkering of welke benaming ook – waarop het lid van het dagelijks bestuur krachtens
      [artikel 44, eerste lid, eerste zin][ref2], aanspraak heeft of waarop zijn nagelaten betrekkingen uit hoofde van
      zijn overlijden krachtens artikel 44, eerste lid, aanspraak hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel44a
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel44
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44j
