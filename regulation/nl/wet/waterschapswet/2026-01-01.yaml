  - number: '120'
    text: |-
      1 Het algemeen bestuur stelt ten behoeve van de in [artikel 117][ref1] bedoelde heffing een verordening vast,
      waarin voor elk van de categorieën van heffingplichtigen de toedeling van het kostendeel is opgenomen. Bij die
      verordening kan worden bepaald dat kosten van heffing en invordering van de watersysteemheffing en kosten van de
      verkiezing van de leden van het algemeen bestuur rechtstreeks worden toegerekend aan de betrokken categorieën van
      heffingplichtigen.

      2 De toedeling van het kostendeel voor de categorie, bedoeld in [artikel 117, eerste lid, onderdeel a][ref2], wordt
      bepaald aan de hand van de gemiddelde inwonerdichtheid per vierkante kilometer in het gebied van het waterschap.
      Het door het waterschap bij verordening, als bedoeld onder het eerste lid, te bepalen kostenaandeel bedraagt:

      a. minimaal 20% en maximaal 30% wanneer het aantal inwoners per vierkante kilometer niet meer bedraagt dan 500;

      b. minimaal 31% en maximaal 40% wanneer het aantal inwoners per vierkante kilometer meer bedraagt dan 500, maar
      niet meer dan 1000;

      c. minimaal 41% en maximaal 50% wanneer het aantal inwoners per vierkante kilometer meer bedraagt dan 1000.

      3 Het algemeen bestuur kan de in het tweede lid genoemde maximale percentages aan de hand van gebiedskenmerken van
      het waterschap verhogen tot 40, onderscheidenlijk 50 en 60 %.

      4 Het kostendeel voor de categorie, bedoeld in [artikel 117, eerste lid, onderdeel b][ref3], wordt vastgesteld in
      procenten volgens de formule:

      0,0029317*(A0,7414854)

      waarbij A staat voor het aantal hectaren ongebouwde onroerende zaken, niet zijnde natuurterreinen, per 1000
      inwoners in het gebied van het waterschap.

      5 Het kostendeel voor de categorie, bedoeld in [artikel 117, eerste lid, onderdeel c][ref4], wordt vastgesteld in
      procenten volgens de formule:

      0,0000224*(B1,1938609)

      waarbij B staat voor het aantal hectaren natuurterrein per 1000 inwoners in het gebied van het waterschap.

      6 Het kostendeel voor de categorie, bedoeld in [artikel 117, eerste lid, onderdeel d][ref5], is het kostendeel
      uitgedrukt in procenten dat resteert na bepaling van de kostendelen van de categorieën, bedoeld in artikel 117,
      eerste lid, onderdelen a tot en met c.

      7 Het algemeen bestuur kan de in het vierde en vijfde lid bedoelde kostendelen aan de hand van gebiedskenmerken van
      het waterschap verhogen of verlagen met maximaal:

      a. 30% per kostendeel bij verordening als bedoeld in het eerste lid; of

      b. 50% per kostendeel, volgens percentages die bij algemene maatregel van bestuur per gebiedskenmerk kunnen worden
      vastgesteld.

      8 De in het eerste lid bedoelde verordening wordt ten minste eenmaal in de vijf jaren herzien.

      9 De voordracht voor een krachtens het zevende lid, onderdeel b, vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten Generaal is overgelegd.


