  - number: '119'
    text: |-
      1 Heffingplichtig in de zin van [artikel 117, eerste lid, onderdelen b, c en d][ref1], is degene die bij het begin
      van het kalenderjaar als rechthebbende in de basisregistratie kadaster is vermeld, tenzij blijkt dat hij op dat
      tijdstip geen rechthebbende krachtens eigendom, bezit of beperkt recht is.

      2 Voor de toepassing van [artikel 117, eerste lid, onderdelen b, c en d][ref2], is heffingplichtig de:

      a. beperkt gerechtigde en niet de eigenaar, ingeval de onroerende zaak is onderworpen aan het recht van beklemming,
      van erfpacht, van opstal, van vruchtgebruik, van gebruik of van bewoning;

      b. eigenaar voor wat betreft het recht van opstal, indien dat recht uitsluitend is gevestigd ten behoeve van de
      aanleg of het onderhoud, dan wel ten behoeve van de aanleg en het onderhoud, van ondergrondse dan wel bovengrondse
      leidingen.

      3 Indien de onroerende zaak is onderworpen aan beperkte rechten als bedoeld in het tweede lid, heeft voor de
      heffingplicht:

      a. de vruchtgebruiker, de gebruiker of bewoner voorrang boven zowel de opstaller als de erfpachter,
      onderscheidenlijk de beklemde meier;

      b. de opstaller voorrang boven de erfpachter, onderscheidenlijk de beklemde meier.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel117
