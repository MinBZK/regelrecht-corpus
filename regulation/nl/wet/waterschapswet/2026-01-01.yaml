  - number: 41a
    text: |-
      1 Het dagelijks bestuur verleent aan een lid van dat bestuur op diens verzoek verlof wegens zwangerschap en
      bevalling. Het verlof gaat in op de in het verzoek vermelde dag die ligt tussen ten hoogste zes en ten minste vier
      weken voor de vermoedelijke datum van de bevalling die blijkt uit een bij het verzoek gevoegde verklaring van een
      arts of verloskundige.

      2 Het dagelijks bestuur verleent aan een lid van dat bestuur op diens verzoek verlof wegens ziekte, indien uit
      een bij het verzoek gevoegde verklaring van een arts blijkt dat niet aannemelijk is dat hij de uitoefening van het
      lidmaatschap binnen acht weken zal kunnen hervatten.

      3 In het geval een lid van het dagelijks bestuur vanwege ziekte niet in staat is zelf het verzoek te doen, kan de
      voorzitter namens het lid het verzoek doen indien de continuïteit van het waterschapsbestuur dringend vereist dat
      in vervanging van de het lid wordt voorzien.

      4 Het verlof eindigt op de dag waarop zestien weken zijn verstreken sinds de dag waarop het verlof is ingegaan.

      5 Aan een lid van het dagelijks bestuur wordt gedurende de zittingsperiode ten hoogste drie maal verlof verleend.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel41a
  - number: 41b
    text: |-
      1 Het dagelijks bestuur beslist zo spoedig mogelijk op een verzoek tot verlof, doch uiterlijk op de veertiende dag
      na indiening van het verzoek.

      2 De beslissing geschiedt in overeenstemming met de verklaring van de arts of verloskundige en bevat de dag waarop
      het verlof ingaat.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel41b
  - number: 41c
    text: |-
      1 Het algemeen bestuur kan een vervanger benoemen voor het lid van het dagelijks bestuur dat met verlof is gegaan.
      [Artikel 40][ref1] is niet van toepassing.

      2 De vervanger is van rechtswege ontslagen met ingang van de dag waarop zestien weken zijn verstreken sinds de dag
      waarop het verlof is ingegaan.

      3 Indien de vervanger voor het einde van het verlof ontslag neemt of door het algemeen bestuur wordt ontslagen, kan
      het algemeen bestuur voor de resterende duur van het verlof een vervanger benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel40
