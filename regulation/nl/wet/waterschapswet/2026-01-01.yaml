  - number: '19'
    text: |-
      1 Het algemeen bestuur onderzoekt de kennisgeving, bedoeld in [artikel 17][ref1], onmiddellijk en beslist
      of de benoemde als lid van dat algemeen bestuur wordt toegelaten. Daarbij gaat het na of de benoemde
      voldoet aan de vereisten voor het lidmaatschap, genoemd in de [artikelen 31, eerste en tweede lid][ref2], en
      [33, eerste en tweede lid][ref3], en of de benoeming, bedoeld in [artikel 14][ref4], overeenkomstig de wet en het
      reglement is uitgevoerd.

      2 Indien het algemeen bestuur besluit tot niet-toelating van een benoemde, geeft de voorzitter van het algemeen
      bestuur daarvan kennis aan de organisatie en de benoemde.

      3 Uiterlijk op de dertigste dag nadat deze kennisgeving is ontvangen, wordt door de organisatie opnieuw een
      vertegenwoordiger benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel31
