    text: |-
      1 De in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap is bevoegd voor
      eenzelfde belastingplichtige bestemde belastingaanslagen van dezelfde soort die betrekking kunnen hebben op
      verschillende belastingen, op één aanslagbiljet te verenigen.

      2 Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.


