  - number: '14'
    text: |-
      1 De vertegenwoordigers van de categorieën van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdelen b en c][ref1], worden benoemd door de daartoe bij reglement aangewezen
      organisaties. Indien voor een categorie meer dan één organisatie wordt aangewezen wordt bij reglement bepaald op
      welke wijze de aangewezen organisaties tot een benoeming komen.

      2 De organisaties, bedoeld in het eerste lid, voorzien tijdig in een regeling omtrent de selectie en de benoeming
      van de vertegenwoordiger of vertegenwoordigers van de desbetreffende categorie van belanghebbenden en zenden de
      regeling ter kennisneming aan het waterschapsbestuur. Het waterschapsbestuur maakt de regelingen bekend.


