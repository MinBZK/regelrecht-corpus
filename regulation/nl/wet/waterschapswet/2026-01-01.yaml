  - number: 122l
    text: |-
      Nadere regels met betrekking tot de zuiveringsheffing kunnen worden gesteld bij verordening van het algemeen
      bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel122l
  - number: '123'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. waterschapsbelastingen: de belastingen die het waterschap heft, bedoeld in [artikel 113][ref1];

      b. Algemene wet: [Algemene wet inzake rijksbelastingen][ref2];

      c. heffing op andere wijze : heffing op andere wijze dan bij wege van aanslag of bij wege van voldoening op
      aangifte.

      2 Onverminderd het overigens in dit hoofdstuk bepaalde geschieden de heffing en de invordering van
      waterschapsbelastingen met toepassing van de Algemene wet, de [Invorderingswet 1990][ref3] en de
      [Kostenwet invordering rijksbelastingen][ref4] als waren die belastingen rijksbelastingen.

      3 Onverminderd het overigens in dit hoofdstuk bepaalde, gelden de bevoegdheden en verplichtingen
      van de hierna vermelde, in de [Algemene wet][ref5], de [Invorderingswet 1990][ref6] en de
      [Kostenwet invordering rijksbelastingen][ref7] genoemde functionarissen, met betrekking tot de
      waterschapsbelastingen voor de daarachter genoemde colleges of functionarissen:

      a. Onze Minister van Financiën, het bestuur van ’s Rijksbelastingen en de directeur: het dagelijks bestuur;

      b. de inspecteur: de daartoe aangewezen ambtenaar van het waterschap;

      c. de ontvanger of een inzake rijksbelastingen bevoegde ontvanger: de ambtenaar van het waterschap, belast met de
      invordering van waterschapsbelastingen;

      d. de ambtenaren van de rijksbelastingdienst: de ambtenaren van het waterschap, belast met de heffing of de
      invordering van waterschapsbelastingen;

      e. belastingdeurwaarder: de daartoe door het dagelijks bestuur aangewezen ambtenaar van het waterschap,
      dan wel een als belastingdeurwaarder van het waterschap aangewezen gerechtsdeurwaarder, bedoeld in de
      [Gerechtsdeurwaarderswet][ref8];

      f. de Tweede Kamer der Staten-Generaal of de Tweede Kamer: het algemeen bestuur.

      4 Onverminderd het overigens in dit hoofdstuk bepaalde wordt met betrekking tot waterschapsbelastingen in
      de [Algemene wet][ref9] en in de [Invorderingswet 1990][ref10] voor algemene maatregel van bestuur en voor
      ministeriële regeling gelezen: besluit van het dagelijks bestuur.

      5 Met betrekking tot waterschapsbelastingen wordt in [artikel 24 van de Invorderingswet 1990][ref11] voor «de
      Staat» gelezen: het waterschap.

      6 Indien een Commissiebesluit als bedoeld in [artikel 1 van de Wet terugvordering staatssteun][ref12] verplicht
      tot terugvordering van staatssteun en die staatssteun voortvloeit uit een waterschapsbelasting als bedoeld in
      [hoofdstuk XVI][ref13] van deze wet, wordt deze staatssteun op dezelfde wijze teruggevorderd als staatssteun die
      voortvloeit uit de toepassing van een belastingwet als bedoeld in [artikel 20a van de Algemene wet][ref14].


