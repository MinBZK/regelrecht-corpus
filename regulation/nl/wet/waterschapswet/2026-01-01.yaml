  - number: 97d
    text: |-
      1 De rekenkamer legt haar bevindingen en haar oordeel vast in rapporten, met dien verstande dat hierin niet worden
      opgenomen gegevens en bevindingen die naar hun aard vertrouwelijk zijn.

      2 Voordat de rekenkamer een rapport als bedoeld in het eerste lid, vaststelt, stelt zij in elk geval het
      onderzochte orgaan in de gelegenheid binnen redelijke termijn te reageren op haar bevindingen en voorlopige
      conclusies.

      3 Na de vaststelling van het rapport, deelt de rekenkamer aan het algemeen bestuur, het dagelijks bestuur en,
      indien van toepassing, aan de betrokken instelling, de opmerkingen en bedenkingen mee die zij naar aanleiding van
      haar bevindingen van belang acht. Aan het algemeen bestuur of het dagelijks bestuur kan zij ter zake voorstellen
      doen. Mededelingen aan het algemeen bestuur, die gegevens of bevindingen bevatten die naar hun aard vertrouwelijk
      zijn, kan de rekenkamer ter vertrouwelijke kennisneming verstrekken.

      4 De rekenkamer stelt elk jaar voor 1 april een verslag op van haar werkzaamheden over het voorgaande jaar.

      5 De rekenkamer zendt een afschrift van haar rapporten en haar verslag aan het algemeen bestuur en het dagelijks
      bestuur. Indien zij met toepassing van [artikel 97a][ref1] een onderzoek heeft ingesteld, zendt de rekenkamer
      tevens een afschrift van het rapport aan de betrokken instelling. Indien de rekenkamer een onderzoek heeft
      ingesteld bij een vennootschap als bedoeld in [artikel 97c, eerste lid, onderdeel c][ref2], zendt zij tevens een
      afschrift ter kennisneming van het rapport aan de colleges van de andere deelnemende gemeenten, de gedeputeerde
      staten van de deelnemende provincies, de dagelijks besturen van de deelnemende waterschappen of Onze Minister die
      het aangaat in het geval van deelneming van de Staat.

      6 De rapporten en de verslagen van de rekenkamer zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel97a
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel97c
