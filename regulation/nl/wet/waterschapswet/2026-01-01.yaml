preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge artikel 133 van de Grondwet regels moeten worden gesteld
    volgens welke de opheffing en instelling geschiedt van waterschappen en volgens welke de taken en inrichting van
    waterschappen en de samenstelling van hun besturen worden geregeld;

    dat voorts ingevolge diezelfde grondwetsbepaling de verordenende en andere bevoegdheden van de besturen van
    waterschappen, de openbaarheid van hun vergaderingen, alsmede het toezicht op deze besturen moet worden geregeld;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Waterschappen zijn openbare lichamen welke de waterstaatkundige verzorging van een bepaald gebied ten doel
      hebben.

      2 De taken die tot dat doel aan waterschappen zijn of worden opgedragen betreffen het beheer van
      watersystemen, de zuivering van stedelijk afvalwater op de voet van [artikel 2.17 van de Omgevingswet][ref1]
      en de zuivering van stedelijk afvalwater dat wordt afgevoerd op een systeem als bedoeld in
      [artikel 2.16, derde lid, van de Omgevingswet][ref2] dat wordt beheerd door of namens het waterschap. Daarnaast kan
      de zorg voor een of meer andere waterstaatsaangelegenheden zijn of worden opgedragen.

      3 Het beheer van watersystemen, bedoeld in het tweede lid, omvat mede het voorkomen van schade aan
      waterstaatswerken veroorzaakt door muskus- en beverratten.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2.16
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel1
