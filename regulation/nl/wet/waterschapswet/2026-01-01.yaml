  - number: '53'
    text: |-
      1 Het algemeen bestuur wijst de secretaris van het waterschap aan. De aanwijzing eindigt van rechtswege met ingang
      van de datum dat de uitoefening van de functie van secretaris geen onderdeel meer uitmaakt van de werkzaamheden van
      de betreffende ambtenaar.

      2 Het algemeen bestuur is bevoegd te besluiten tot het aangaan, wijzigen en beëindigen van de arbeidsovereenkomst
      met de secretaris van het waterschap.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel53
  - number: '54'
    text: |-
      In spoedeisende gevallen kan het dagelijks bestuur de secretaris op non-actief stellen. Het doet daarvan
      terstond mededeling aan het algemeen bestuur. De op non-actiefstelling vervalt indien het algemeen bestuur niet
      in een binnen acht weken na de datum van de op non-actiefstelling gehouden vergadering instemt met de op non-
      actiefstelling.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel54
  - number: '55'
    text: |-
      De secretaris staat het algemeen bestuur, het dagelijks bestuur en de voorzitter ter zijde bij de uitoefening van
      hun taak. Hij is aanwezig in de vergadering van het algemeen bestuur en van het dagelijks bestuur. Hij ondertekent
      de stukken die van het algemeen bestuur en het dagelijks bestuur uitgaan, mede.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel55
  - number: 55a
    text: |-
      1 Het dagelijks bestuur regelt de vervanging van de secretaris.

      2 De [artikelen 54][ref1] en [55][ref2] zijn van overeenkomstige toepassing op degene die de secretaris vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel55
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '54'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '55'
        hoofdstuk: VIII
  - number: 55b
    text: |-
      Het algemeen bestuur, het dagelijks bestuur, de voorzitter en een commissie van het waterschap kunnen op grond van
      een belang, genoemd in [artikel 5.1, eerste en tweede lid, van de Wet open overheid][ref1], een verplichting tot
      geheimhouding opleggen ten aanzien van informatie die bij dat orgaan berust.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: 55c
    text: |-
      1 Het algemeen bestuur kan informatie ten aanzien waarvan krachtens [artikel 35, vierde lid][ref1], een
      verplichting tot geheimhouding geldt of hij een verplichting tot geheimhouding heeft opgelegd, verstrekken aan het
      dagelijks bestuur, de voorzitter en een commissie van het waterschap.

      2 Het dagelijks bestuur kan informatie ten aanzien waarvan hij een verplichting tot geheimhouding heeft opgelegd,
      verstrekken aan het algemeen bestuur en een commissie van het waterschap.

      3 De voorzitter kan informatie ten aanzien waarvan hij een verplichting tot geheimhouding heeft opgelegd,
      verstrekken aan het algemeen bestuur, het dagelijks bestuur en een commissie van het waterschap.

      4 Een commissie van het waterschap kan informatie ten aanzien waarvan hij een verplichting tot geheimhouding heeft
      opgelegd, verstrekken aan het algemeen bestuur, het dagelijks bestuur en de voorzitter.

      5 Indien het dagelijks bestuur, de voorzitter of een commissie overeenkomstig het tweede, derde of vierde lid
      informatie verstrekt aan het algemeen bestuur, kan het algemeen bestuur die informatie verstrekken aan anderen. Het
      algemeen bestuur kan regels stellen over het verstrekken van informatie ten aanzien waarvan een verplichting tot
      geheimhouding is opgelegd door het dagelijks bestuur, de voorzitter of een commissie en die tevens aan het algemeen
      bestuur is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel35
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel55c
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '35'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 55d
    text: |-
      1 Een verplichting tot geheimhouding wordt vermeld op het stuk ten aanzien waarvan de geheimhouding geldt. Indien
      de geheimhouding geldt ten aanzien van informatie anders dan in schriftelijke vorm, wordt de verplichting op een
      passende wijze kenbaar gemaakt.

      2 Een verplichting tot geheimhouding wordt in acht genomen door allen die van de informatie kennis dragen.

      3 Een verplichting tot geheimhouding duurt voort totdat het orgaan dat de verplichting heeft opgelegd haar opheft.
      Indien de verplichting tot geheimhouding is opgelegd door een commissie, kan die verplichting tevens worden
      opgeheven door het orgaan dat de commissie heeft ingesteld.

      4 Indien informatie ten aanzien waarvan een verplichting tot geheimhouding geldt aan het algemeen bestuur is
      verstrekt, duurt die verplichting in afwijking van het derde lid voort totdat het algemeen bestuur haar opheft.

      5 Een lid van het algemeen bestuur dat in strijd handelt met het tweede lid kan bij besluit van het algemeen
      bestuur ten hoogste drie maanden worden uitgesloten van het ontvangen van informatie ten aanzien waarvan een
      verplichting tot geheimhouding geldt.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel55d
  - number: '56'
    text: |-
      1 Het waterschapsbestuur is bevoegd tot regeling en bestuur ter behartiging van de taken die het waterschap in het
      reglement zijn opgedragen.

      2 Regeling en bestuur kunnen van het waterschapsbestuur worden gevorderd bij wet, bij algemene maatregel van
      bestuur of bij provinciale verordening.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel56
  - number: '57'
    text: |-
      Onze Minister wie het aangaat en provinciale staten onderscheidenlijk gedeputeerde staten doen het
      waterschapsbestuur desgevraagd mededeling van hun standpunten en voornemens met betrekking tot aangelegenheden
      die voor het waterschap van belang zijn, tenzij het openbaar belang zich daartegen verzet, en bieden het
      waterschapsbestuur desgevraagd de gelegenheid tot overleg over die aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel57
  - number: '58'
    text: |-
      1 Over al hetgeen het waterschap betreft, dient het waterschapsbestuur Onze Ministers en provinciale staten
      onderscheidenlijk gedeputeerde staten desgevraagd van bericht en raad. Dit geschiedt door het dagelijks bestuur van
      het waterschap, tenzij het uitdrukkelijk van het algemeen bestuur wordt verlangd.

      2 Het verzoek om bericht en raad door een van Onze Ministers geschiedt, evenals in dat geval het dienen van bericht
      en raad, door tussenkomst van gedeputeerde staten, tenzij het enkel het verschaffen van feitelijke inlichtingen
      betreft.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel58
  - number: '59'
    text: |-
      1 Ten aanzien van onderwerpen waarin door een wet, een algemene maatregel van bestuur of een provinciale
      verordening is voorzien, is het waterschapsbestuur bevoegd tot het maken van verordeningen voorzover deze
      verordeningen met die hogere regelingen niet in strijd zijn.

      2 De bepalingen van verordeningen in het onderwerp waarvan, nadat deze zijn vastgesteld, wordt voorzien door een
      wet, een algemene maatregel van bestuur of een provinciale verordening, houden van rechtswege op te gelden.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel59
  - number: '60'
    text: |-
      1 Wanneer het algemeen bestuur de door een wet, een algemene maatregel van bestuur of een provinciale verordening
      gevorderde beslissingen niet of niet naar behoren neemt, voorziet het dagelijks bestuur daarin.

      2 Wanneer het dagelijks bestuur de gevorderde beslissingen niet of niet naar behoren neemt, voorzien gedeputeerde
      staten daarin namens het dagelijks bestuur en ten laste van het waterschap.

      3 Spoedeisende gevallen uitgezonderd, vindt het tweede lid geen toepassing dan nadat het dagelijks bestuur in
      de gelegenheid is gesteld binnen een door gedeputeerde staten gestelde termijn alsnog de gevorderde besluiten te
      nemen.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel60
  - number: '61'
    text: |-
      1 Het waterschapsbestuur is bevoegd tot oplegging van een last onder bestuursdwang.

      2 De bevoegdheid tot oplegging van een last onder bestuursdwang wordt uitgeoefend door het dagelijks bestuur,
      indien oplegging van een last onder bestuursdwang dient tot handhaving van regels welke het waterschapsbestuur
      uitvoert.

      3 De bevoegdheid tot oplegging van een last onder bestuursdwang wordt evenwel uitgeoefend door de voorzitter
      indien deze met gebruikmaking van de in [artikel 96][ref1] omschreven bevoegdheid maatregelen neemt in gevallen van
      dringend of dreigend gevaar.

      4 Indien aan de voorzitter bevoegdheden zijn toegekend of overgedragen, bezit hij de bevoegdheid tot oplegging van
      een last onder bestuursdwang en de bevoegdheid tot het geven van een machtiging tot het binnentreden van een woning
      slechts indien ook die bevoegdheid uitdrukkelijk is toegekend of overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel96
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '96'
        hoofdstuk: XII
  - number: '68'
    text: |-
      In geschillen als bedoeld in [artikel 438 van het Wetboek van Burgerlijke Rechtsvordering][ref1] over het
      dwangbevel bezitten leggers, waarin onderhoudsplichtigen zijn aangewezen, behoudens tegenbewijs, kracht van bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel438
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel68
