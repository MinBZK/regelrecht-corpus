  - number: '121'
    text: |-
      1 Voor de heffing geldt als heffingsmaatstaf:

      a. ter zake van ingezetenen als bedoeld in [artikel 117, eerste lid, onderdeel a][ref1]: de woonruimte, waarbij het
      tarief wordt gesteld op een gelijk bedrag per woonruimte;

      b. ter zake van ongebouwde onroerende zaken als bedoeld in [artikel 117, eerste lid, onderdeel b][ref2]: de
      oppervlakte, waarbij het tarief wordt gesteld op een gelijk bedrag per hectare;

      c. ter zake van ongebouwde onroerende zaken als bedoeld in [artikel 117, eerste lid, onderdeel c][ref3]: de
      oppervlakte, waarbij het tarief wordt gesteld op een gelijk bedrag per hectare;

      d. ter zake van gebouwde onroerende zaken als bedoeld in [artikel 117, eerste lid, onderdeel d][ref4]: de waarde
      die voor de onroerende zaak wordt bepaald op de voet van [hoofdstuk IV van de Wet waardering onroerende zaken][ref5]
      voor het kalenderjaar, waarbij het tarief wordt gesteld op een percentage van de waarde dat voor onroerende zaken
      die niet in hoofdzaak tot woning dienen en onroerende zaken die in hoofdzaak tot woning dienen verschilt.

      2 Bij het bepalen van het tarief voor gebouwde onroerende zaken als bedoeld in
      [artikel 117, eerste lid, onderdeel d][ref6], is de verhouding tussen het percentage van de waarde van onroerende
      zaken die niet in hoofdzaak tot woning dienen en het percentage van de waarde van onroerende zaken die in hoofdzaak
      tot woning dienen gelijk aan de verhouding tussen de waardeontwikkeling van onroerende zaken gelegen in het
      waterschap die in hoofdzaak tot woning dienen en de waardeontwikkeling van onroerende zaken in het waterschap die
      niet in hoofdzaak tot woning dienen ten opzichte van de waarde twee jaar voorafgaand aan inwerkingtreding van dit
      lid.

      3 In afwijking in zoverre van het eerste lid, onderdeel d, wordt bij de bepaling van de heffingsmaatstaf voor de
      heffing ter zake van gebouwde onroerende zaken de waarde van onroerende zaken of onderdelen daarvan als bedoeld in
      [artikel 220d, eerste lid, onderdelen c, h en j, van de Gemeentewet][ref7] en van waterbeheersingswerken die worden
      beheerd door organen, instellingen of diensten van publiekrechtelijke rechtspersonen, met uitzondering van de delen
      die dienen als woning, buiten aanmerking gelaten, voor zover dit niet reeds is geschied bij de bepaling van de in
      het eerste lid, onderdeel d, bedoelde waarde.

      4 Bij de toepassing van het derde lid is het bepaalde bij of krachtens de [artikelen 17][ref8], [18][ref9] en
      [20, tweede lid, van de Wet waardering onroerende zaken][ref10] van overeenkomstige toepassing.


