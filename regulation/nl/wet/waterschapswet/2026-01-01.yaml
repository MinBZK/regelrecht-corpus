  - number: '42'
    text: |-
      1 De vergaderingen van het dagelijks bestuur worden met gesloten deuren gehouden, voor zover het dagelijks bestuur
      niet anders heeft bepaald.

      2 Het reglement van orde voor de vergaderingen kan regels geven omtrent de openbaarheid van de vergaderingen van
      het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel42
  - number: '44'
    text: |-
      1 De leden van het dagelijks bestuur genieten ten laste van het waterschap een bezoldiging en een tegemoetkoming
      in de kosten van de uitoefening van hun werkzaamheden volgens bij of krachtens algemene maatregel van bestuur
      te stellen regels. Daarbij kunnen tevens regels worden gesteld betreffende tegemoetkoming in of vergoeding van
      bijzondere kosten en andere voorzieningen die verband houden met het ambt van lid van het dagelijks bestuur. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties doet de voordracht voor deze algemene maatregel van bestuur.

      2 Buiten hetgeen hen bij of krachtens de wet is toegekend, genieten de leden van het dagelijks bestuur als zodanig
      geen inkomsten, in welke vorm ook, ten laste van het waterschap.

      3 De leden van het dagelijks bestuur genieten geen vergoedingen, in welke vorm ook, voor werkzaamheden, verricht
      in nevenfuncties die zij vervullen uit hoofde van het lidmaatschap van het dagelijks bestuur ongeacht of die
      vergoedingen ten laste van het waterschap komen of niet. Indien deze vergoedingen worden uitgekeerd, worden zij
      gestort in de waterschapskas.

      4 Tot vergoedingen als bedoeld in het derde lid, behoren inkomsten, onder welke benaming ook, uit nevenfuncties die
      het lid van het dagelijks bestuur neerlegt bij beëindiging van het ambt.

      5 Andere inkomsten dan die bedoeld in het derde lid worden met de bezoldiging verrekend overeenkomstig
      [artikel 3 van de Wet schadeloosstelling leden Tweede Kamer][ref1]. De rijksbelastingdienst verstrekt Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties ten behoeve van de verrekening de benodigde gegevens.

      6 Indien het lid van het dagelijks bestuur zijn ambt in deeltijd vervult, vindt geen verrekening plaats van de
      inkomsten, bedoeld in het vijfde lid.

      7 Op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties worden bij algemene maatregel van
      bestuur regels gesteld over de wijze waarop het lid van het dagelijks bestuur gegevens over de inkomsten, bedoeld
      in het zesde lid, verstrekt, en de gevolgen van het niet verstrekken van deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004939#Artikel3
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44
