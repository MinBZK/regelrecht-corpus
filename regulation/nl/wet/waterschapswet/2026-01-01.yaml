  - number: 51k
    text: |-
      1 Het algemeen bestuur kan voor de behandeling van verzoekschriften een gezamenlijke ombudsman of een gezamenlijke
      ombudscommissie instellen met de raad of raden van een of meer andere gemeenten, dan wel met provinciale staten van
      een of meer provincies, dan wel met het algemeen bestuur van een of meer waterschappen, dan wel met het algemeen
      bestuur van een of meer openbare lichamen of gemeenschappelijke organen ingesteld bij gemeenschappelijke regeling.

      2 De ombudsman of de ombudscommissie zendt jaarlijks een verslag van zijn werkzaamheden aan de vertegenwoordigende
      organen van de deelnemende rechtspersonen.

      3 Op de ombudsman en op ieder afzonderlijk lid van de ombudscommissie zijn de [artikelen 51c tot en met 51f][ref1],
      [ 51h][ref2] en [51i][ref3] van overeenkomstige toepassing.


