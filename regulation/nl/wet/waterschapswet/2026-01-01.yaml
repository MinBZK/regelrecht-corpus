  - number: '145'
    text: |-
      Indien inzake een waterschapsbelasting exploot moet worden gedaan, een akte van vervolging betekend of een
      dwangbevel ten uitvoer gelegd in het gebied van een ander waterschap dan dat waaraan de belasting verschuldigd
      is, is daartoe naast de belastingdeurwaarder van laatstbedoeld waterschap mede de belastingdeurwaarder van het
      eerstbedoelde waterschap bevoegd en desgevraagd verplicht.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel145
  - number: '146'
    text: |-
      De eigenaar of degene, die krachtens een ander beperkt recht het genot heeft van in het gebied van een waterschap
      gelegen onroerende zaak en die binnen Nederland geen bekende woon- of verblijfplaats heeft, is verplicht aan het
      dagelijks bestuur van dat waterschap een adres binnen Nederland op te geven, waar de voor hem bestemde stukken
      betreffende waterschapsbelastingen of betreffende de in [artikel 5:25 van de Algemene wet bestuursrecht][ref1]
      bedoelde kosten van bestuursdwang worden bezorgd of betekend. Indien hij hiermede in gebreke blijft, geschiedt
      de betekening van een dwangbevel aan de persoon of in het parket van de ambtenaar van het openbaar ministerie
      bij de rechtbank binnen welker rechtsgebied de onroerende zaak geheel of gedeeltelijk ligt. De deurwaarder of de
      belastingdeurwaarder zendt, zo mogelijk, een tweede afschrift onverwijld per aangetekende brief aan de woonplaats
      of het werkelijk verblijf van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel525
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:25
  - number: '147'
    text: |-
      Bij algemene maatregel van bestuur kunnen in het kader van dit hoofdstuk passende nadere regelen worden gesteld ter
      aanvulling van de in dit hoofdstuk geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel147
  - number: '156'
    text: |-
      1 Een besluit dan wel een niet-schriftelijke beslissing gericht op enig rechtsgevolg van het waterschapsbestuur kan
      door gedeputeerde staten worden vernietigd.

      2 Ten aanzien van vernietiging van een niet-schriftelijke beslissing gericht op enig rechtsgevolg zijn de
      [afdelingen 10.2.2][ref1] en [10.2.3 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling10.2.3
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 10.2.2
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 10.2.3
  - number: '158'
    text: |-
      1 Indien een besluit naar het oordeel van de voorzitter voor vernietiging in aanmerking komt, doet hij daarvan twee
      dagen nadat het te zijner kennis is gekomen mededeling aan gedeputeerde staten. Hij geeft hiervan tegelijkertijd
      kennis aan het orgaan dat het besluit nam, en zo nodig aan het orgaan dat met de uitvoering van het besluit is
      belast.

      2 Het besluit ten aanzien waarvan het eerste lid toepassing heeft gevonden, wordt niet of niet verder uitgevoerd,
      voordat van gedeputeerde staten mededeling is ontvangen dat voor schorsing of vernietiging geen redenen bestaan.
      Indien het besluit niet binnen vier weken na de dagtekening van de mededeling van de voorzitter is geschorst of
      vernietigd, wordt het uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel158
  - number: '161'
    text: |-
      Indien een bekendgemaakt besluit is vernietigd of indien het niet is vernietigd binnen de tijd waarvoor het is
      geschorst, wordt hiervan door het waterschapsbestuur kennisgegeven in het waterschapsblad.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel161
  - number: '162'
    text: |-
      In afwijking van [artikel 8.4, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1],
      kan een belanghebbende beroep instellen tegen een besluit van gedeputeerde staten als bedoeld in
      [artikel 156, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel156
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel162
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:4
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '156'
        hoofdstuk: XXI
  - number: '163'
    text: |-
      Het waterschapsbestuur neemt opnieuw een besluit omtrent het onderwerp van het vernietigde besluit, waarbij met het
      besluit tot vernietiging wordt rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel163
  - number: '164'
    text: |-
      1 Een besluit tot het instellen en reglementeren van een waterschap, waarvan het gebied in twee of meer provincies
      is gelegen, bevat een regeling omtrent de uitoefening van het toezicht ingevolge deze Titel hetzij van enige andere
      vorm van toezicht. Wordt bij dat besluit aan de colleges van gedeputeerde staten de gemeenschappelijke uitoefening
      van het toezicht opgedragen, dan worden daarbij tevens regels gesteld omtrent de gemeenschappelijke voorbereiding
      van de ter uitoefening van dat toezicht te nemen besluiten.

      2 Indien de colleges van gedeputeerde staten niet tot overeenstemming kunnen komen over het te nemen besluit binnen
      de voor de uitoefening van het toezicht geldende termijn, dan wel, indien geen termijn geldt, binnen redelijke
      termijn, delen zij dit schriftelijk mede aan Onze Minister van Infrastructuur en Waterstaat. In dat geval wordt op
      de voordracht van deze minister, gedaan na overleg met die colleges, het besluit genomen bij koninklijk besluit, de
      Raad van State gehoord. [Artikel 27d van de Wet op de Raad van State][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel164
    references:
