  - number: 51ah
    text: |-
      [Artikel 33, eerste en tweede lid][ref1], is van overeenkomstige toepassing op de leden van de rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel33
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51ah
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '33'
        hoofdstuk: IV
        paragraaf: '5'
  - number: 51ai
    text: |-
      1 De rekenkamer stelt een reglement van orde voor haar werkzaamheden vast en, indien zij uit twee of meer personen
      bestaat, tevens voor haar vergaderingen.

      2 De rekenkamer zendt het reglement ter kennisneming aan het algemeen bestuur en maakt het bekend op de in
      [artikel 73, tweede lid][ref1], bedoelde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel73
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51ai
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '73'
        hoofdstuk: IX
        paragraaf: '5'
  - number: 51aj
    text: |-
      1 Het algemeen bestuur stelt, na overleg met de rekenkamer, de rekenkamer de nodige middelen ter beschikking voor
      een goede uitoefening van haar werkzaamheden.

      2 Op voordracht van de voorzitter of het enige lid van de rekenkamer besluit het dagelijks bestuur tot het aangaan
      van arbeidsovereenkomsten met zoveel ambtenaren van de rekenkamer als nodig zijn voor een goede uitoefening van
      haar werkzaamheden.

      3 De ambtenaren die werkzaamheden verrichten voor de rekenkamer, verrichten niet tevens werkzaamheden voor een
      ander orgaan van het waterschap met uitzondering van ambtenaren die uitsluitend werkzaam zijn voor het algemeen
      bestuur.

      4 De ambtenaren die werkzaamheden verrichten voor de rekenkamer, zijn ter zake van die werkzaamheden uitsluitend
      verantwoording schuldig aan de rekenkamer.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51aj
  - number: 51ak
    text: |-
      De leden van de rekenkamer ontvangen een bij verordening van het algemeen bestuur vastgestelde vergoeding voor hun
      werkzaamheden en een tegemoetkoming in de kosten.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51ak
  - number: 51al
    text: |-
      In afwijking van [artikel 51aa][ref1] kan het algemeen bestuur met het algemeen bestuur of de
      algemene besturen van een of meer andere waterschappen met toepassing van de [artikelen 50][ref2], en
      [8, tweede lid, van de Wet gemeenschappelijke regelingen][ref3] of met provinciale staten van één of
      meer provincies of de raad of raden van één of meer gemeenten, al dan niet met het algemeen bestuur of de
      algemene besturen van een of meer andere waterschappen tezamen, met toepassing van de [artikelen 51][ref4]
      en [52, eerste lid][ref5], juncto artikel 8, tweede lid, van de Wet gemeenschappelijke regelingen, een
      gemeenschappelijke rekenkamer instellen. De artikelen [10, tweede en derde lid][ref6], [10a][ref7], [11][ref8],
      [15][ref9], [16][ref10], [17][ref11], [20, derde lid][ref12], [21][ref13], [22][ref14], [23][ref15], [30][ref16] en
      [54 van die wet][ref17] zijn niet van toepassing.


