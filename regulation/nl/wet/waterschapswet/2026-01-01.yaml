  - number: '35'
    text: |-
      1 De vergadering van het algemeen bestuur wordt in het openbaar gehouden.

      2 De deuren worden gesloten, wanneer ten minste een vijfde van het aantal leden dat de presentielijst heeft
      ondertekend daarom verzoekt of de voorzitter het nodig oordeelt.

      3 Het algemeen bestuur beslist vervolgens of met gesloten deuren zal worden vergaderd.

      4 Indien met gesloten deuren wordt vergaderd, geldt een verplichting tot geheimhouding omtrent informatie die in
      die vergadering ter kennis van de aanwezigen komt. De verplichting duurt voort, totdat het algemeen bestuur haar
      opheft.

      5 Van een vergadering met gesloten deuren wordt een afzonderlijk verslag gemaakt dat niet openbaar wordt gemaakt
      tenzij het algemeen bestuur besluit de verplichting, bedoeld in het vierde lid, op te heffen.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel35
  - number: '36'
    text: |-
      In een besloten vergadering kan niet worden beraadslaagd of besloten over:

      a. de toelating van nieuwe leden;

      b. de vaststelling en wijziging van de begroting en de vaststelling van de rekening;

      c. de invoering, wijziging en afschaffing van een waterschapsbelasting; en

      d. de benoeming en het ontslag van leden van het dagelijks bestuur met uitzondering van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel36
  - number: '38'
    text: De leden van het algemeen bestuur stemmen zonder last.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel38
  - number: 38a
    text: |-
      1 Een lid van het algemeen bestuur neemt niet deel aan de beraadslaging en stemming over:

      a. een aangelegenheid die hem rechtstreeks of middellijk persoonlijk aangaat of waarbij hij als vertegenwoordiger
      is betrokken;

      b. de vaststelling of goedkeuring der rekening van een lichaam waaraan hij rekenplichtig is of tot welks bestuur
      hij behoort.

      2 Op de beraadslaging en stemming, bedoeld in het eerste lid, is
      [artikel 2:4 van de Algemene wet bestuursrecht][ref1] niet van toepassing.

      3 Bij een schriftelijke stemming wordt onder het deelnemen aan de stemming verstaan het inleveren van een
      stembriefje.

      4 Een benoeming gaat iemand persoonlijk aan, wanneer hij behoort tot de personen tot wie de keuze door een
      voordracht of bij een herstemming is beperkt.

      5 Het eerste lid is niet van toepassing bij het besluit betreffende de toelating van de na periodieke verkiezing
      gekozen en benoemde leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel24
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:4
  - number: 38b
    text: |-
      1 Een stemming is alleen geldig, indien meer dan de helft van het aantal leden dat zitting heeft en zich niet van
      deelneming aan de stemming moet onthouden, daaraan heeft deelgenomen.

      2 Het eerste lid is niet van toepassing:

      a. ingeval opnieuw wordt gestemd over een voorstel of over een benoeming, voordracht of aanbeveling van een of meer
      personen ten aanzien van wie in een vorige vergadering een stemming op grond van dat lid niet geldig was;

      b. voorzover het betreft onderwerpen die in een daaraan voorafgaande niet geopende vergadering aan de orde waren
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel38b
  - number: 38c
    text: |-
      1 Voor het tot stand komen van een beslissing bij stemming wordt de volstrekte meerderheid vereist van hen die een
      stem hebben uitgebracht.

      2 Bij een schriftelijke stemming wordt onder het uitbrengen van een stem verstaan het inleveren van een behoorlijk
      ingevuld stembriefje.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel38c
  - number: '39'
    text: |-
      Zij die behoren tot het algemeen bestuur van het waterschap en anderen die deelnemen aan de beraadslaging kunnen
      niet in rechte worden vervolgd of aangesproken voor hetgeen zij in de vergadering van het algemeen bestuur hebben
      gezegd of schriftelijk aan het algemeen bestuur hebben overgelegd.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel39
  - number: '40'
    text: |-
      1 Het dagelijks bestuur bestaat uit de voorzitter en een door het algemeen bestuur te bepalen aantal andere leden.

      2 Bij reglement kan worden bepaald welk aantal leden het dagelijks bestuur ten minste en ten hoogste telt.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel40
  - number: '41'
    text: |-
      1 De leden van het dagelijks bestuur, met uitzondering van de voorzitter, worden door het algemeen bestuur
      benoemd. Bij de benoeming zijn de beoogde leden in het bezit van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1], die niet ouder is dan drie maanden.

      2 De benoeming vindt plaats uit de leden van het algemeen bestuur. Indien bij de benoeming sprake is van een
      stemming, geschiedt deze stemming geheim.

      3 Gedeputeerde staten kunnen, indien het reglement dat bepaalt, ontheffing verlenen van het bepaalde in het tweede
      lid. Geen ontheffing wordt verleend indien het de ombudsman of een lid van de ombudscommissie betreft als bedoeld
      in [artikel 51b, eerste lid][ref2].

      4 De leden van het dagelijks bestuur treden in ieder geval na de stemming, bedoeld in
      [artikel J 6a van de Kieswet][ref3], af:

      a. op het moment dat ten minste de helft van het door het algemeen bestuur te benoemen aantal leden van het
      dagelijks bestuur is benoemd en deze benoemingen zijn aanvaard; en

      b. binnen drie maanden na het begin van de zittingsduur van het algemeen bestuur.

      5 Het algemeen bestuur kan een of meer leden van het dagelijks bestuur, met uitzondering van de voorzitter,
      ontslag verlenen, indien deze het vertrouwen van het algemeen bestuur niet meer bezitten. Op het ontslagbesluit is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref4] niet van toepassing.

      6 Indien het aantal leden van het dagelijks bestuur dat in functie is, minder bedraagt dan de helft van het door
      het algemeen bestuur vastgestelde aantal leden, treedt de voorzitter in de plaats van het dagelijks bestuur totdat
      dit aantal de hierbedoelde helft heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
