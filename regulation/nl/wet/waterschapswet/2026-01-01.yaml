        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005108
        artikel: '104'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: 107a
    text: |-
      Indien het algemeen bestuur de jaarrekening dan wel een indemniteitsbesluit niet of niet naar behoren vaststelt,
      zendt het dagelijks bestuur de jaarrekening, vergezeld van de overige in [artikel 103][ref1] bedoelde stukken,
      respectievelijk het indemniteitsbesluit ter vaststelling aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel103
