        artikel: 122g
        hoofdstuk: XVIIb
  - number: 122i
    text: |-
      1 In afwijking van [artikel 122g][ref1] wordt de vervuilingswaarde van de stoffen, die vanuit een bedrijfsruimte
      worden afgevoerd, gesteld op drie vervuilingseenheden indien door de heffingplichtige aannemelijk is gemaakt dat
      die vervuilingswaarde minder dan vijf vervuilingseenheden bedraagt en op één vervuilingseenheid indien door de
      heffingplichtige aannemelijk is gemaakt dat die één vervuilingseenheid of minder bedraagt.

      2 In afwijking van [artikel 122g][ref2] wordt de vervuilingswaarde van de stoffen die worden afgevoerd vanuit
      een bedrijfsruimte of een onderdeel van een bedrijfsruimte bestemd om in het kader van de uitoefening van een
      beroep of een bedrijf onder een permanente opstand van glas of kunststof gewassen te telen, gesteld op drie
      vervuilingseenheden per hectare vloeroppervlak waarop onder glas of kunststof wordt geteeld en per deel van een
      hectare vloeroppervlak een evenredig deel van drie vervuilingseenheden.

      3 Indien in de loop van het kalenderjaar het gebruik van een in het tweede lid bedoelde bedrijfsruimte of onderdeel
      van een bedrijfsruimte dan wel van een deel daarvan door de gebruiker aanvangt of eindigt, wordt hij in dat
      kalenderjaar voor die bedrijfsruimte, voor een evenredig gedeelte aan de heffing onderworpen.

      4 Een vervuilingswaarde voor de bedrijfsruimte of het onderdeel van de bedrijfsruimte, berekend op basis van het
      tweede of derde lid van minder dan vijf vervuilingseenheden, wordt op drie vervuilingseenheden, en van één of
      minder dan één vervuilingseenheid op één vervuilingseenheid gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
