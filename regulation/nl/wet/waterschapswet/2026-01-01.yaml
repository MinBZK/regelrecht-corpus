  - number: '126'
    text: |-
      1 Bij de heffing van waterschapsbelastingen blijven van de [Algemene wet][ref1] buiten toepassing de
      [artikelen 2, vierde lid][ref2], [3][ref3], [3a][ref4], [37 tot en met 39][ref5], [47a][ref6], [48][ref7],
      [52][ref8], [53][ref9], [54][ref10], [55][ref11], [62][ref12], [66a][ref13], [66b][ref14], [71][ref15],
      [76][ref16], [80, tweede, derde en vierde lid][ref17], [82][ref18], [84][ref19], [86][ref20], [87][ref21] en
      [90 tot en met 95][ref22]. Bij de heffing van waterschapsbelastingen die op andere wijze worden geheven, blijven
      bovendien de [artikelen 5][ref23], [6 tot en met 9][ref24], [11, tweede lid][ref25], en [12 van die wet][ref26]
      buiten toepassing.

      2 Op een bezwaarschrift dat niet is ingediend in de laatste zes weken van een kalenderjaar, doet de in
      [artikel 123, derde lid, onderdeel b][ref27], bedoelde ambtenaar van het waterschap, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref28], uitspraak in het kalenderjaar waarin het
      bezwaarschrift is ontvangen.


