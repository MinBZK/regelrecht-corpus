  - number: '13'
    text: |-
      1 Het algemeen bestuur bestaat uit een bij reglement vastgesteld aantal leden van ten minste achttien en ten
      hoogste dertig leden.

      2 Het totaal aantal vertegenwoordigers van de in [artikel 12, tweede lid, onderdelen b en c][ref1], bedoelde
      categorieën, bedraagt twee per categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel12
