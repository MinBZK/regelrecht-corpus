  - number: '20'
    text: |-
      1 Indien door de toepassing van de [artikelen 31, derde lid][ref1], of [33, vierde lid][ref2], onherroepelijk is
      vastgesteld dat een lid van het algemeen bestuur opgehouden is lid te zijn, geeft de voorzitter van het algemeen
      bestuur hiervan onmiddellijk kennis aan de organisatie.

      2 Een overeenkomstige kennisgeving vindt plaats, indien door het overlijden van een lid een plaats in het algemeen
      bestuur is opengevallen.

      3 Een tot het algemeen bestuur toegelaten lid kan te allen tijde zijn ontslag nemen. Op een ingediend ontslag kan
      niet worden teruggekomen. Ontslagneming met terugwerkende kracht is niet mogelijk.

      4 Het lid bericht zijn ontslagname schriftelijk aan de voorzitter van het algemeen bestuur. Deze geeft hiervan
      onverwijld kennis aan de organisatie.

      5 Na de kennisgeving van de voorzitter van het algemeen bestuur, bedoeld in het eerste, tweede en vierde
      lid, wordt door de organisatie een daarvoor in aanmerking komende nieuwe vertegenwoordiger benoemd. De
      [artikelen 17 tot en met 19][ref3] zijn op deze benoeming en toelating van toepassing.

      6 Leden van het algemeen bestuur die hun ontslag hebben ingezonden, behouden, ook indien zij ontslag hebben genomen
      met ingang van een bepaald tijdstip, hun lidmaatschap, totdat de toelating van hun opvolgers onherroepelijk is
      geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel17
