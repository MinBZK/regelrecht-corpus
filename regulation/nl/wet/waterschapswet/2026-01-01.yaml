    text: |-
      Het ambt van voorzitter ontheft van alle bij of krachtens de wet opgelegde verplichtingen tot het verrichten van
      persoonlijke diensten.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51
  - number: 51a
    text: |-
      1 Bij verhindering of ontstentenis van de voorzitter en – indien in de aanwijzing daarvan is voorzien bij het
      reglement – van de plaatsvervangend voorzitter wordt het ambt van voorzitter waargenomen door een, door het
      dagelijks bestuur aan te wijzen, ander lid van dat bestuur.

      2 Bij verhindering of ontstentenis van alle leden van het dagelijks bestuur wordt het ambt waargenomen door het
      oudste lid in jaren van het algemeen bestuur, tenzij het algemeen bestuur een ander lid met de waarneming belast.

      3 Bij verhindering of ontstentenis van de voorzitter op de dag met ingang waarvan het zittende algemeen bestuur is
      afgetreden, wordt het ambt waargenomen door een, door de afgetreden leden van het dagelijks bestuur aan te wijzen,
      afgetreden lid van het dagelijks bestuur, of, bij ontstentenis van alle afgetreden leden van het dagelijks bestuur,
      door het oudste afgetreden lid in jaren van het algemeen bestuur, een en ander tot in de waarneming overeenkomstig
      het eerste en tweede lid is voorzien.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51a
  - number: 51aa
    text: Het algemeen bestuur stelt een rekenkamer in.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51aa
  - number: 51ab
    text: Het algemeen bestuur stelt het aantal leden van de rekenkamer vast.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51ab
  - number: 51ac
    text: |-
      1 Het algemeen bestuur benoemt de leden van de rekenkamer voor de duur van zes jaar.

      2 Indien de rekenkamer uit twee of meer leden bestaat, benoemt het algemeen bestuur uit de leden de voorzitter.

      3 Het algemeen bestuur kan plaatsvervangende leden benoemen. Indien de rekenkamer uit één lid bestaat, benoemt
      het algemeen bestuur in ieder geval een plaatsvervangend lid. [Paragraaf 1][ref1] van [hoofdstuk VIOA][ref2] is op
      plaatsvervangende leden van overeenkomstige toepassing.

      4 Het algemeen bestuur kan een lid herbenoemen.

      5 Voorafgaand aan de benoemingen, bedoeld in het eerste tot en met het vierde lid, pleegt het algemeen bestuur
      overleg met de rekenkamer.

      6 Een lid van de rekenkamer wordt door het algemeen bestuur ontslagen:

      a. op eigen verzoek;

      b. bij de aanvaarding van een functie die onverenigbaar is met het lidmaatschap;

      c. indien hij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij
      zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      d. indien hij bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat van
      faillissement is verklaard, surséance van betaling heeft verkregen of wegens schulden is gegijzeld; of

      e. indien hij naar het oordeel van het algemeen bestuur ernstig nadeel toebrengt aan het in hem gestelde
      vertrouwen.

      7 Een lid van de rekenkamer kan door het algemeen bestuur worden ontslagen:

      a. indien hij door ziekte of gebreken blijvend ongeschikt is zijn functie te vervullen; of

      b. indien hij handelt in strijd met [artikel 51ah][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukVI0a
      [ref2]: https://wetten.overheid.nl/BWBR0005108#HoofdstukVI0a
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel51ah
