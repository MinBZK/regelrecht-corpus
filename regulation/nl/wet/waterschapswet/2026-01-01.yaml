  - number: 51an
    text: |-
      Indien het algemeen bestuur of de algemene besturen met provinciale staten van een of meer provincies of
      de raad of de raden van een of meer gemeenten een gemeenschappelijke rekenkamer instelt, is, onverminderd
      [artikel 51am, eerste lid][ref1], juncto [artikel 51af][ref2], een lid van de rekenkamer niet tevens:

      a. lid van provinciale staten van een deelnemende provincie of de raad van een deelnemende gemeente;

      b. ambtenaar, in dienst van een deelnemende provincie of gemeente of uit anderen hoofde aan het bestuur van een
      deelnemende provincie of gemeente ondergeschikt;

      c. ambtenaar, in dienst van de Staat, tot wiens taak het behoort het verrichten van werkzaamheden in het kader van
      het toezicht op de provincie of gemeente; of

      d. functionaris, krachtens de wet of algemene maatregel van bestuur geroepen om het provinciebestuur of het bestuur
      van de gemeente van advies te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51am
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel51af
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel51an
