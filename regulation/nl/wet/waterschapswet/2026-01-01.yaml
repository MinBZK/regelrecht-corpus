  - number: 122d
    text: |-
      1 Ter bestrijding van kosten die zijn verbonden aan de behartiging van de taak inzake het zuiveren van afvalwater,
      wordt onder de naam zuiveringsheffing een heffing ingesteld ter zake van afvoeren.

      2 Aan de heffing worden onderworpen:

      a. ter zake van afvoeren vanuit een bedrijfsruimte of woonruimte: degene die het gebruik heeft van die ruimte;

      b. ter zake van het afvoeren anders dan bedoeld onder a: degene die afvoert.

      3 Voor de toepassing van het tweede lid, onderdeel a, is heffingplichtig:

      a. in geval van gebruik van een woonruimte door de leden van een huishouden: degene die door de in
      [artikel 123, derde lid, onderdeel d][ref1], bedoelde ambtenaar van het waterschap is aangewezen;

      b. in geval van gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven: degene die dat
      deel in gebruik heeft gegeven, met dien verstande dat degene die het deel in gebruik heeft gegeven, bevoegd is de
      heffing als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;

      c. in geval van het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik: degene
      die die ruimte ter beschikking heeft gesteld, met dien verstande dat degene die de ruimte ter beschikking heeft
      gesteld, bevoegd is de heffing als zodanig te verhalen op degene aan wie de ruimte ter beschikking is gesteld.

      4 Indien stoffen met behulp van een openbaar vuilwaterriool worden afgevoerd, is degene bij wie dat openbaar
      vuilwaterriool in beheer is, slechts voor die stoffen die de beheerder zelf op het openbaar vuilwaterriool heeft
      gebracht aan een heffing onderworpen.

      5 De opbrengst van de heffing kan tevens worden besteed:

      a. aan het verstrekken van subsidies ter tegemoetkoming in de kosten van het voorbereiden en uitvoeren van
      maatregelen die verband houden met het zuiveren van afvalwater aan diegenen die tot het treffen van die maatregelen
      zijn gehouden;

      b. aan het verstrekken van subsidies aan heffingplichtigen tot behoud van het gebruik van zuiveringtechnische
      werken teneinde een stijging van het tarief van de heffing zoveel mogelijk te voorkomen;

      c. aan het doen van uitgaven ter beperking van de afvoer van hemelwater op een zuiveringtechnisch werk of op een
      openbaar vuilwaterriool;

      d. aan de bekostiging van maatregelen voor het opwekken van hernieuwbare energie ter compensatie van de uitstoot
      van broeikasgassen, die vrijkomen als gevolg van de zuivering van afvalwater en die in redelijkheid niet te
      vermijden zijn. De hoeveelheid op te wekken hernieuwbare energie mag niet hoger zijn dan driemaal het primaire
      energiegebruik van het betreffende waterschap benodigd voor de zuivering van afvalwater.

      6 Voor de zuivering van ander afvalwater dan bedoeld in [artikel 1, tweede lid][ref2], kan een waterschap een
      overeenkomst sluiten met degene die zich van dit afvalwater ontdoet.

      7 Bij ministeriële regeling worden regels gesteld over de wijze waarop het primaire energiegebruik wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel1
