  - number: '132'
    text: |-
      1 Degene die ingevolge de belastingverordening aanspraak kan maken op een gehele of gedeeltelijke vrijstelling,
      vermindering, ontheffing of teruggaaf kan binnen zes weken nadat de omstandigheid welke die aanspraak deed
      ontstaan, zich heeft voorgedaan, of, voor zover het een belasting betreft die bij wege van aanslag wordt geheven en
      op dat tijdstip nog geen aanslagbiljet is uitgereikt of ter post is bezorgd, binnen zes weken na de dagtekening van
      het aanslagbiljet, een aanvraag tot het verkrijgen van vrijstelling, vermindering, ontheffing of teruggaaf indienen
      bij de in [artikel 123, derde lid, onderdeel b][ref1], bedoelde ambtenaar van het waterschap.

      2 Het eerste lid vindt overeenkomstige toepassing ingeval de belasting op andere wijze wordt geheven.

      3 De in [artikel 123, derde lid, onderdeel b][ref2], bedoelde ambtenaar van het waterschap beslist op de aanvraag
      bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel123
