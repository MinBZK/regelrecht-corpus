        artikel: '3'
  - number: 44a
    text: |-
      1 Op de bezoldiging is, voor zover in deze wet niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.

      2 Kostenvergoedingen krachtens [artikel 44, eerste lid, tweede zin][ref1], zijn niet vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel44
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel44a
