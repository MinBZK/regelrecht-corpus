  - number: '124'
    text: |-
      1 Het dagelijks bestuur kan bepalen dat voor de toezending of uitreiking van aanslagbiljetten ingevolge
      [artikel 8, eerste lid, van de Invorderingswet 1990][ref1], voor de in [artikel 123, derde lid, onderdeel c][ref2],
      bedoelde ambtenaar van het waterschap, een andere ambtenaar van het waterschap in de plaats treedt.

      2 De dagelijkse besturen van twee of meer waterschappen kunnen met betrekking tot een of meer
      waterschapsbelastingen bepalen dat het dagelijks bestuur van één van die waterschappen voor de uitvoering van enige
      wettelijke bepaling betreffende de heffing of invordering van waterschapsbelastingen in de plaats treedt van het
      andere dagelijks bestuur onderscheidenlijk van die andere dagelijkse besturen.

      3 De dagelijkse besturen van twee of meer waterschappen kunnen met betrekking tot een of meer
      waterschapsbelastingen bepalen dat daartoe aangewezen ambtenaren van één van die waterschappen worden aangewezen
      als:

      a. de in [artikel 123, derde lid, onderdeel b][ref3], bedoelde ambtenaar van die waterschappen voor de uitvoering
      van enige wettelijke bepaling betreffende de heffing van waterschapsbelastingen;

      b. de in [artikel 123, derde lid, onderdeel c][ref4], bedoelde ambtenaar van die waterschappen voor de uitvoering
      van enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen;

      c. de in [artikel 123, derde lid, onderdeel d][ref5], bedoelde ambtenaren van die waterschappen voor de uitvoering
      van enige wettelijke bepaling betreffende de heffing of de invordering van waterschapsbelastingen;

      d. de in [artikel 123, derde lid, onderdeel e][ref6], bedoelde ambtenaar van die waterschappen voor de uitvoering
      van enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen.

      4 Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het waterschap waarvan
      de ambtenaar belast met de invordering van waterschapsbelastingen op grond van het derde lid, onderdeel *b*, wordt
      aangewezen.

      5 Indien voor de heffing of de invordering van een of meer waterschapsbelastingen een gemeenschappelijke regeling
      is getroffen en bij die regeling een openbaar lichaam of een bedrijfsvoeringsorganisatie is ingesteld, kan bij
      of krachtens die regeling worden bepaald dat een daartoe aangewezen ambtenaar van dat openbaar lichaam of die
      bedrijfsvoeringsorganisatie wordt aangewezen als:

      a. de in [artikel 123, derde lid, onderdeel b][ref7], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing van waterschapsbelastingen;

      b. de in [artikel 123, derde lid, onderdeel c][ref8], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen;

      c. de in [artikel 123, derde lid, onderdeel d][ref9], bedoelde ambtenaren van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de heffing of de invordering van waterschapsbelastingen;

      d. de in [artikel 123, derde lid, onderdeel e][ref10], bedoelde ambtenaar van het waterschap voor de uitvoering van
      enige wettelijke bepaling betreffende de invordering van waterschapsbelastingen.

      6 Het eerste lid is van overeenkomstige toepassing ten aanzien van het dagelijks bestuur van het openbaar lichaam
      of het bestuur van de bedrijfsvoeringsorganisatie waarvan een ambtenaar op grond van het vijfde lid, onderdeel *b*,
      wordt aangewezen.


