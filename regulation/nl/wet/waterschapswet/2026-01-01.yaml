  - number: 109c
    text: |-
      Gedeputeerde staten kunnen te allen tijde een onderzoek instellen naar het beheer en de inrichting van de
      financiële organisatie, bedoeld in [artikel 108, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel108
