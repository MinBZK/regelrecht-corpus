  - number: '166'
    text: |-
      1 Het bij of krachtens [artikel 122k][ref1] bepaalde, zoals dat luidde
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________________________________________________________________________
      (Stb. 2025, 63) blijft gedurende ten hoogste tien jaar van toepassing op de heffingplichtige
      voor wie de vervuilingswaarde per m3 ingenomen water is bepaald aan de hand van
      [artikel 2 van het Besluit vervuilingswaarde ingenomen water 2009][ref3], zoals dat artikel luidde onmiddellijk
      voorafgaand aan voornoemd tijdstip, voor zover deze vervuilingswaarde per m3 ingenomen water niet behoorde binnen
      de klassegrens die leidt tot een afvalwatercoëfficiënt behorende bij klasse acht.

      2 Voor de in het eerste lid bedoelde heffingplichtige stelt de ambtenaar van het waterschap, bedoeld in
      [artikel 123, derde lid, onderdeel b][ref4], binnen tien jaar na het in het eerste lid bedoelde tijdstip een
      individuele afvalwatercoëfficiënt vast. Na deze vaststelling is op de desbetreffende heffingplichtige dit artikel
      niet meer van toepassing.

      3 Dit artikel is tevens niet langer van toepassing indien binnen de in het eerste lid bedoelde periode van
      ten hoogste tien jaar de in het tweede lid bedoelde vaststelling van de afvalwatercoëfficiënt nog niet heeft
      plaatsgevonden en door verandering in de bedrijfsomstandigheden vaststelling van een nieuwe afvalwatercoëfficiënt
      nodig is.


