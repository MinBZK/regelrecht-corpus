    text: |-
      1 De voorzitter van het algemeen bestuur doet een afschrift van een benoemingsbesluit toekomen aan het algemeen
      bestuur en geeft van de benoeming kennis in het waterschapsblad.

      2 Het lidmaatschap van de benoemde vangt aan zodra het besluit omtrent zijn toelating aan hem bekend is gemaakt.
