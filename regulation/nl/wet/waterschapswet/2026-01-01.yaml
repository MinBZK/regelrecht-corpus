  - number: 122b
    text: |-
      1 Het algemeen bestuur stelt ten behoeve van de in [artikel 122a][ref1] bedoelde heffing een verordening vast,
      waarin voor elk van de categorieën van heffingplichtigen de toedeling van het kostendeel is opgenomen.

      2 Bij reglement wordt bepaald aan welke regels de toedeling van het kostendeel, bedoeld in het eerste lid, voldoet.
      Daarbij kunnen de [artikelen 118 tot en met 121][ref2] van overeenkomstige toepassing worden verklaard.

      3 De heffing, bedoeld in [artikel 122a][ref3], kan onderdeel uitmaken van de in [artikel 117][ref4] bedoelde
      heffing.


