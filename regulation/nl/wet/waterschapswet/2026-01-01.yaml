        hoofdstuk: XVIII
  - number: 122h
    text: |-
      1 In afwijking van [artikel 122g][ref1] wordt de vervuilingswaarde van de stoffen die vanuit een woonruimte worden
      afgevoerd gesteld op drie vervuilingseenheden. De vervuilingswaarde van de stoffen die vanuit een door één persoon
      gebruikte woonruimte worden afgevoerd bedraagt één vervuilingseenheid.

      2 In afwijking van het eerste lid kan bij verordening van het algemeen bestuur worden bepaald dat de
      vervuilingswaarde van de stoffen geheel of gedeeltelijk wordt bepaald aan de hand van de door het drinkwaterbedrijf
      geleverde hoeveelheid drinkwater en door de betrokken leverancier geleverde hoeveelheid warm tapwater.

      3 De heffing met betrekking tot de in het tweede lid bedoelde woonruimten wordt geheven over het tijdvak van
      12 maanden zoals dat door het betrokken drinkwaterbedrijf bij de levering van drinkwater of door de berokken
      leverancier bij de levering van warm tapwater ten behoeve van die woonruimten wordt gehanteerd.

      4 Indien het in het derde lid bedoelde tijdvak in twee kalenderjaren is gelegen worden de voor de kalenderjaren
      geldende tarieven per vervuilingseenheid naar tijdsevenredigheid toegepast.

      5 Het eerste lid is niet van toepassing op de voor recreatiedoeleinden bestemde woonruimten die zich bevinden op
      een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de vorige volzin bedoelde
      woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een bedrijfsruimte.

      6 Indien in de loop van een kalenderjaar het gebruik van een woonruimte, waarvan de heffing is bepaald op basis
      van het eerste lid, aanvangt of eindigt, wordt de gebruiker voor een evenredig gedeelte van de op basis van dit lid
      bepaalde aantal vervuilingseenheden aan de heffing onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122g
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel122h
    references:
