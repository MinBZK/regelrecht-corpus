      1 Besluiten tot wijziging van de begroting kunnen tot uiterlijk het eind van het desbetreffende begrotingsjaar
      worden genomen.

      2 De [artikelen 100, tweede lid][ref1], en [101, tweede lid][ref2], alsmede, behoudens in gevallen van dringende
      spoed, [artikel 100, derde lid][ref3], zijn van overeenkomstige toepassing.


