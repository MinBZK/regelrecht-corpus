  - number: '104'
    text: |-
      1 Het algemeen bestuur stelt de jaarrekening en het jaarverslag vast in het jaar volgend op het begrotingsjaar. De
      jaarrekening betreft alle baten en lasten van het waterschap.

      2 Indien het algemeen bestuur tot het standpunt komt dat onrechtmatige totstandkoming van in de jaarrekening
      opgenomen baten, lasten of balansmutaties aan de vaststelling van de jaarrekening in de weg staat, brengt hij dit
      terstond ter kennis van het dagelijks bestuur met vermelding van de gerezen bedenkingen.

      3 Het dagelijks bestuur zendt het algemeen bestuur binnen twee maanden na ontvangst van het standpunt, bedoeld in
      het tweede lid, een voorstel voor een indemniteitsbesluit, vergezeld van een reactie op de bij het algemeen bestuur
      gerezen bedenkingen.

      4 Indien het dagelijks bestuur een voorstel voor een indemniteitsbesluit heeft gedaan, stelt het algemeen bestuur
      de jaarrekening niet vast dan nadat hij heeft besloten over het voorstel.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel104
  - number: '105'
    text: |-
      De leden van het dagelijks bestuur nemen niet deel aan stemmingen over besluiten als bedoeld in het
      [eerste, tweede en vierde lid van artikel 104][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel104
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel105
