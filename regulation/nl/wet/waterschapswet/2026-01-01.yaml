      - id: ref1
        bwb_id: BWBR0005108
        artikel: '104'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: '106'
    text: |-
      Behoudens later in rechte gebleken onregelmatigheden, ontlast de vaststelling van de jaarrekening de leden van het
      dagelijks bestuur ten aanzien van het daarin verantwoorde financieel beheer.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel106
  - number: '107'
    text: |-
      Het dagelijks bestuur zendt de vastgestelde jaarrekening en het jaarverslag, vergezeld van de overige in
      [artikel 103][ref1] bedoelde stukken binnen twee weken na vaststelling, maar in ieder geval vóór 15 juli van het
      jaar, volgend op het begrotingsjaar, aan gedeputeerde staten. Het dagelijks bestuur voegt daarbij, indien van
      toepassing, het besluit van het algemeen bestuur over een voorstel voor een indemniteitsbesluit met de reactie,
      bedoeld in [artikel 104, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel104
