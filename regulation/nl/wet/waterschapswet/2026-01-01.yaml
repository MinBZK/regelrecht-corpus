  - number: '4'
    text: |-
      1 Op de voorbereiding van een besluit als bedoeld in [artikel 2, eerste lid][ref1], is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing, met dien verstande dat daaraan toepassing
      wordt gegeven door gedeputeerde staten. Gedeputeerde staten stellen het ontwerp van het besluit op na overleg met
      het dagelijks bestuur van het waterschap of de waterschappen die het betreft.

      2 Gedeputeerde staten voegen bij hun voorstel aan provinciale staten tot vaststelling van het besluit zowel het
      ontwerp-besluit als de naar voren gebrachte zienswijzen, of een samenvatting daarvan, vergezeld van hun standpunt
      inzake die zienswijzen.

      3 Gedeputeerde staten zenden het door provinciale staten vastgestelde besluit, met de in het tweede lid bedoelde
      stukken, binnen vier weken aan Onze Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel4
