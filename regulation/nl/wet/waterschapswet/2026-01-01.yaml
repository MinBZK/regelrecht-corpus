      1 De voorzitter is niet tevens:

      a. minister;

      b. staatssecretaris;

      c. lid van de Raad van State;

      d. lid van de Algemene Rekenkamer;

      e. Nationale ombudsman;

      f. substituut-ombudsman als bedoeld in [artikel 9, eerste lid, van de Wet Nationale ombudsman][ref1];

      g. commissaris van de Koning;

      h. lid van provinciale staten;

      i. gedeputeerde;

      j. secretaris van de provincie;

      k. griffier van de provincie;

      l. lid van het algemeen bestuur van een waterschap;

      m. burgemeester;

      n. wethouder;

      o. ombudsman of lid van de ombudscommissie als bedoeld in [artikel 51b, eerste lid][ref2];

      p. ambtenaar, in dienst van het waterschap of uit anderen hoofde aan het waterschapsbestuur ondergeschikt;

      q. ambtenaar, in dienst van de provincie, tot wiens taak behoort het verrichten van werkzaamheden in het kader van
      het toezicht op het waterschap.

      2 Voor de benoembaarheid tot voorzitter is het Nederlanderschap vereist.

      3 [Artikel 33, eerste en tweede lid][ref3], is van overeenkomstige toepassing op de voorzitter met dien verstande
      dat de ontheffing, bedoeld in het tweede lid van dat artikel, wordt verleend door de commissaris van de Koning.


      [ref1]: https://wetten.overheid.nl/BWBR0003372#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel51b
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel33
