  - number: 122e
    text: |-
      Voor de heffing geldt als grondslag de hoeveelheid en de hoedanigheid van de stoffen die in een kalenderjaar worden
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel122e
  - number: 122f
    text: |-
      1 Voor de heffing geldt als heffingsmaatstaf de vervuilingswaarde van de stoffen die in een kalenderjaar worden
      afgevoerd, waarbij de vervuilingswaarde wordt uitgedrukt in vervuilingseenheden.

      2 Eén vervuilingseenheid vertegenwoordigt met betrekking tot:

      a. zuurstofverbruik: het jaarlijks verbruik van 54,8 kilogram zuurstof;

      b. gewichtshoeveelheden van de groep van stoffen chroom, koper, lood, nikkel, zilver en zink: 1,00 kilogram;

      c. gewichtshoeveelheden van de groep van stoffen arseen, kwik en cadmium: 0,100 kilogram;

      d. gewichtshoeveelheden van de stof chloride: 650 kilogram;

      e. gewichtshoeveelheden van de stof sulfaat: 650 kilogram;

      f. gewichtshoeveelheden van de stof fosfor: 20,0 kilogram.

      3 Het algemeen bestuur kan bij verordening met betrekking tot één of meer van de in het tweede lid, onderdelen b
      tot en met f, genoemde stoffen:

      a. de gewichtshoeveelheid die één vervuilingseenheid vertegenwoordigt, hoger vaststellen dan in het tweede lid
      is bepaald;

      b. bepalen dat:

      1°. zij niet worden onderworpen aan de heffing;

      2°. een bepaald aantal vervuilingseenheden niet wordt onderworpen aan de heffing;

      3°. vervuilingseenheden niet worden onderworpen aan de heffing, indien het aantal daarvan, na toepassing van de
      onderdelen a en b, onder 1° en 2°, niet uitgaat boven een bepaald aantal vervuilingseenheden; of

      4°. zij niet of niet geheel worden onderworpen aan de heffing als de stof in een bepaalde concentratie aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel122f
  - number: 122g
    text: |-
      1 Het aantal vervuilingseenheden wordt berekend met behulp van gegevens verkregen door middel van door de
      heffingplichtige, gedurende elk etmaal van het kalenderjaar ondernomen meting, bemonstering en analyse,
      overeenkomstig door het algemeen bestuur bij belastingverordening te stellen regels.

      2 Op aanvraag van de heffingplichtige staat de ambtenaar van het waterschap, bedoeld in
      [artikel 123, derde lid, onderdeel b][ref1], onder nader te stellen voorwaarden toe dat van de frequentie van
      meting, bemonstering en analyse, bedoeld in het eerste lid, wordt afgeweken indien de heffingplichtige aannemelijk
      maakt dat voor de berekening van de vervuilingswaarde met gegevens over meting, bemonstering en analyse van een
      beperkt aantal etmalen kan worden volstaan. Dit besluit wordt genomen bij voor bezwaar vatbare beschikking.

      3 De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden afgevoerd, geschiedt op
      basis van de som van het chemisch zuurstofverbruik door omzetting van de totale hoeveelheid organische koolstof
      in de stoffen en het zuurstofverbruik door omzetting van de totale hoeveelheid stikstof verminderd met de nitriet-
      stikstof en de nitraat- stikstof in de stoffen. Hierbij wordt het chemisch zuurstofverbruik gesteld op driemaal het
      totale gehalte aan organische koolstof in de afgevoerde stoffen.

      4 In afwijking van het derde lid, tweede volzin, wordt de verhouding tussen het chemisch zuurstofverbruik en het
      totale gehalte aan organische koolstof in de afgevoerde stoffen vastgesteld op lager dan drie onderscheidenlijk
      hoger dan drie, indien de heffingplichtige op zijn kosten onderscheidenlijk de ambtenaar van het waterschap,
      bedoeld in [artikel 123, derde lid, onderdeel b][ref2], op kosten van het waterschap overeenkomstig door het
      algemeen bestuur bij belastingverordening te stellen nadere regels doet blijken dat deze verhouding lager
      is dan tweeënhalf onderscheidenlijk hoger is dan drieënhalf. Indien blijkt dat die verhouding lager is dan
      tweeënhalf of hoger is dan drieënhalf wordt de verhouding tussen het chemisch zuurstofverbruik en het totale
      gehalte aan organische koolstof in de afgevoerde stoffen gedeeld door tweeënhalf onderscheidenlijk drieënhalf en
      vermenigvuldigd met drie.

      5 Indien de uitkomst van de methode tot bepaling van het chemisch zuurstofverbruik in belangrijke mate is
      beïnvloed door biologisch niet of nagenoeg niet afbreekbare stoffen, wordt op die uitkomst een correctie toegepast,
      overeenkomstig door het algemeen bestuur bij belastingverordening te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel123
