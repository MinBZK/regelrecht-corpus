  - number: 128a
    text: |-
      Een ambtenaar als bedoeld in [artikel 123, derde lid, onderdeel d][ref1], is voor zover dit voor de heffing van
      de in [artikel 122d, eerste lid][ref2], van deze wet of [artikel 7.2, tweede lid, van de Waterwet][ref3] bedoelde
      waterschapsbelasting redelijkerwijs nodig is, bevoegd:

      a. elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, zonder
      toestemming van de bewoner te betreden met uitzondering van een woning;

      b. monsters te nemen van het afvalwater dat wordt afgevoerd in de zin van [artikel 122c][ref4], van deze wet of
      wordt geloosd in de zin van [artikel 7.1 van de Waterwet][ref5].


