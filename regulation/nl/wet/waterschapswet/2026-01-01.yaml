  - number: '34'
    text: |-
      1 Alvorens hun functie te kunnen uitoefenen leggen de leden van het algemeen bestuur in de vergadering, in handen
      van de voorzitter, de volgende eed (verklaring en belofte) af:

      "Ik zweer (verklaar) dat ik, om tot lid van het algemeen bestuur te worden gekozen of benoemd, rechtstreeks noch
      middellijk, onder welke naam of welk voorwendsel ook, aan iemand enige gift of gunst heb gedaan of beloofd.

      Ik zweer (verklaar en beloof) dat ik, om iets in dit ambt te doen of te laten, rechtstreeks noch middellijk van
      iemand enig geschenk of enige belofte heb aangenomen of zal aannemen.

      Ik zweer (beloof) dat ik getrouw zal zijn aan de [Grondwet][ref1], dat ik de wetten zal nakomen en dat ik mijn
      plichten als lid van het algemeen bestuur naar eer en geweten zal vervullen.

      Zo waarlijk helpe mij God almachtig (Dat verklaar en beloof ik)".

      2 Wanneer de eed (verklaring en belofte), bedoeld in het eerste lid, in de Friese taal wordt afgelegd, luidt de
      tekst van de eed (verklaring en belofte) als volgt:

      «Ik swar (ferklearje) dat ik, om ta lid fan it algemien bestjoer beneamd te wurden, streekrjocht noch midlik, ûnder
      wat namme of wat ferlechje ek, hokker jefte of geunst dan ek jûn of ûnthjitten haw.

      Ik swar (ferklearje en ûnthjit) dat ik, om eat yn dit amt te dwaan of te litten, streekrjocht noch midlik hokker
      geskink of hokker ûnthjit dan ek oannommen haw of oannimme sil.

      Ik swar (ûnthjit) dat ik trou wêze sil oan 'e Grûnwet, dat ik de wetten neikomme sil en dat ik myn plichten as lid
      fan it algemien bestjoer yn alle oprjochtens ferfolje sil.

      Sa wier helpe my God Almachtich!»

      («Dat ferklearje en ûnthjit ik!»).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel34
    references:
      - id: ref1
