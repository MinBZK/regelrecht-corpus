  - number: '17'
    text: |-
      De organisatie geeft de benoemde schriftelijk kennis van zijn benoeming. De organisatie geeft tegelijkertijd
      schriftelijk kennis van de benoeming aan het algemeen bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel17
  - number: '18'
    text: |-
      1 De benoemde deelt uiterlijk op de tiende dag na de dagtekening van de kennisgeving, bedoeld in
      [artikel 17][ref1], het algemeen bestuur schriftelijk mede dat hij de benoeming aanvaardt. Bij een benoeming
      die plaatsvindt na de eerste samenkomst van het nieuwe algemeen bestuur, deelt de benoemde uiterlijk op de
      achtentwintigste dag na de dagtekening van de kennisgeving, schriftelijk aan het algemeen bestuur mede dat hij de
      benoeming aanvaardt.

      2 Tegelijk met de mededeling dat hij de benoeming aanvaardt, overlegt de benoemde, een door hem ondertekend
      overzicht met de door hem beklede openbare betrekkingen.

      3 Tenzij de benoemde op het tijdstip van benoeming reeds lid was van het algemeen bestuur, legt hij tevens een
      gewaarmerkt afschrift over uit de basisregistratie personen, waaruit zijn woonplaats en datum en plaats van de
      geboorte blijken.

      4 Indien de benoemde geen onderdaan is van een lidstaat van de Europese Unie, legt hij een gewaarmerkt afschrift
      van gegevens uit de basisregistratie personen over, waaruit blijkt of hij voldoet aan de vereisten, bedoeld in
      [artikel B 3, tweede lid, aanhef en onderdeel a, van de Kieswet][ref2].

      5 Indien de benoemde de benoeming niet aanvaardt, doet hij daarvan binnen de in het eerste lid genoemde termijn bij
      brief mededeling aan de voorzitter van het algemeen bestuur. Deze geeft hiervan kennis aan de organisatie.

      6 Is binnen de desbetreffende vereiste termijn, bedoeld in het eerste lid, de mededeling niet gedaan, dan wordt hij
      geacht de benoeming niet te aanvaarden.

      7 Zolang nog niet tot toelating van de benoemde is besloten, kan hij bij brief aan het algemeen bestuur mededelen
      dat hij op de aanneming van de benoeming terugkomt. Deze mededeling geldt als niet-aanvaarding.

      8 De voorzitter van het algemeen bestuur deelt aan de organisatie mee dat de benoemde de benoeming heeft aanvaard
      dan wel dat hij dat niet heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004627#ArtikelB_3
