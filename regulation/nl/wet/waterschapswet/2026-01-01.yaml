  - number: '86'
    text: |-
      1 Het dagelijks bestuur neemt, ook alvorens is besloten tot het voeren van een rechtsgeding, alle conservatoire
      maatregelen en doet wat nodig is ter voorkoming van verjaring of verlies van recht of bezit.

      2 Het dagelijks bestuur is bevoegd, tenzij het algemeen bestuur daaromtrent in voorkomende gevallen een
      beslissing heeft genomen, tot het procederen in kort geding en tot voeging in strafzaken als bedoeld in
      [artikel 51f van het Wetboek van Strafvordering][ref1].

      3 Het dagelijks bestuur is bevoegd, indien ingevolge wettelijk voorschrift aan het waterschap of aan het
      waterschapsbestuur hetzij een recht van beroep hetzij een recht bezwaar te maken toekomt, om spoedshalve beroep in
      te stellen of bezwaar te maken alsmede, voor zover de voorschriften dat toelaten, om schorsing van het aangevochten
      besluit of om een voorlopige voorziening ter zake te verzoeken.

      4 Tenzij bij reglement anders is bepaald, wordt het ingestelde beroep of het gemaakte bezwaar ingetrokken, indien
      het algemeen bestuur de beslissing van het dagelijks bestuur tot het instellen van beroep of het maken van bezwaar
      niet hetzij in zijn eerstvolgende vergadering, hetzij binnen drie maanden bekrachtigt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51f
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51f
  - number: '88'
    text: Het dagelijks bestuur kan mandaat verlenen aan een of meer leden van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel88
  - number: '89'
    text: |-
      1 De leden van het dagelijks bestuur zijn, tezamen en ieder afzonderlijk, aan het algemeen bestuur verantwoording
      verschuldigd voor het door het dagelijks bestuur gevoerde bestuur.

      2 Zij geven het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen
      voorzover het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel89
  - number: '94'
    text: |-
      1 De voorzitter bevordert een goede behartiging van de taken van het waterschap.

      2 De voorzitter bevordert de bestuurlijke integriteit van het waterschap.

      3 In de vergadering van het algemeen bestuur heeft de voorzitter een raadgevende stem.

      4 Hij ondertekent alle stukken welke van het algemeen en het dagelijks bestuur uitgaan.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel94
  - number: '95'
    text: |-
      De voorzitter vertegenwoordigt het waterschap in en buiten rechte. Indien de voorzitter aan een ander machtiging
      verleent tot vertegenwoordiging, behoeft deze machtiging de instemming van het dagelijks bestuur.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel95
  - number: '96'
    text: |-
      1 Wanneer de omstandigheden geen voorafgaande bijeenroeping van het algemeen bestuur of van het dagelijks bestuur
      gedogen, is de voorzitter bevoegd bij omstandigheden waaronder de veiligheid van een of meer waterstaatswerken,
      of anderszins de goede staat daarvan, in onmiddellijk en ernstig gevaar is of dreigt te komen, al die maatregelen
      te treffen waartoe die besturen bevoegd zijn, zolang deze toestand voortduurt en totdat deze besturen van hun
      bevoegdheid gebruik maken.

      2 Hij geeft daarvan onverwijld kennis aan het desbetreffende bestuur alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel96
  - number: '97'
    text: |-
      1 De voorzitter is het algemeen bestuur verantwoording verschuldigd voor het door hem gevoerde bestuur.

      2 Hij geeft het algemeen bestuur mondeling of schriftelijk de door een of meer leden gevraagde inlichtingen
      voorzover het verstrekken daarvan niet in strijd is met het openbaar belang.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel97
  - number: 97a
    text: |-
      1 De rekenkamer onderzoekt de doelmatigheid, de doeltreffendheid en de rechtmatigheid van het door het
      waterschapsbestuur gevoerde beleid. Een door de rekenkamer ingesteld onderzoek naar de rechtmatigheid van
      het door het waterschapsbestuur gevoerde beleid bevat geen controle van de jaarrekening als bedoeld in
      [artikel 103, tweede lid][ref1].

      2 Op verzoek van het algemeen bestuur kan de rekenkamer een onderzoek instellen.

      3 Bij het uitvoeren van haar taken kan de rekenkamer gebruik maken van de resultaten van door anderen verrichte
      controles, onverminderd haar bevoegdheid tot het verrichten van onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel103
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel97a
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '103'
        hoofdstuk: XIV
        paragraaf: '2'
  - number: 97b
    text: |-
      1 De rekenkamer is bevoegd alle documenten die berusten bij het waterschapsbestuur te onderzoeken voor zover zij
      dat ter vervulling van haar taak nodig acht.

      2 Het waterschapsbestuur verstrekt desgevraagd alle inlichtingen die de rekenkamer ter vervulling van haar taak
      nodig acht.

      3 Indien de zorg voor een administratie aan een derde is uitbesteed, is het eerste lid van overeenkomstige
      toepassing op de administratie van de betrokken derde dan wel van degene die de administratie in opdracht van die
      derde voert.
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel97b
  - number: 97c
    text: |-
      1 De rekenkamer heeft de volgende bevoegdheden ten aanzien van de volgende instellingen en over de volgende
      periode:

      a. openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref1], waaraan het waterschap deelneemt, over de jaren dat het waterschap
      deelneemt in de regeling;

      b. naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan het waterschap
      meer dan 50% van het geplaatste aandelenkapitaal houdt en naamloze vennootschappen en besloten vennootschappen met
      beperkte aansprakelijkheid, waarin de eerstgenoemde naamloze en besloten vennootschappen middellijk of onmiddellijk
      meer dan 50% van het geplaatste aandelenkapitaal houden, over de jaren dat het waterschap het geplaatste
      aandelenkapitaal houdt;

      c. naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan het waterschap samen
      met een of meer andere waterschappen, gemeenten, een of meer provincies of de Staat meer dan 50% van het geplaatste
      aandelenkapitaal houdt en naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid,
      waarin de eerstgenoemde naamloze en besloten vennootschappen middellijk of onmiddellijk meer dan 50% van het
      geplaatste aandelenkapitaal houden, over de jaren dat de gemeente het geplaatste aandelenkapitaal houdt;

      d. rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die
      een beroep of bedrijf uitoefenen waaraan het waterschap of een of meer derden voor rekening en risico van
      het waterschap rechtstreeks of middellijk een subsidie, lening of garantie heeft verstrekt ten laste van de
      waterschapsbegroting, over de jaren waarop deze subsidie, lening of garantie betrekking heeft;

      e. rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een
      beroep of bedrijf uitoefenen die goederen en diensten leveren die betrekking hebben op de uitvoering van een
      publieke taak waarvan de betaling ten laste van de waterschapsbegroting komt en waarbij het waterschap zich het
      recht heeft voorbehouden bij de betreffende rechtspersoon, vennootschap of natuurlijke persoon controles uit te
      voeren ten aanzien van de geleverde goederen of diensten, over de jaren waarin de betaling ten laste komt van de
      gemeentebegroting.

      2 De rekenkamer maakt bij het onderzoek ten aanzien van de in het eerste lid genoemde instellingen zoveel mogelijk
      gebruik van door anderen verrichte controles.

      3 De rekenkamer is bevoegd bij de betrokken instelling nadere inlichtingen in te winnen over de jaarrekeningen,
      daarop betrekking hebbende rapporten van hen die deze jaarrekeningen hebben gecontroleerd en overige documenten met
      betrekking tot die instelling die bij het waterschapsbestuur berusten. Indien een of meer documenten ontbreken, kan
      de rekenkamer van de betrokken instelling de overlegging daarvan vorderen.

      4 De rekenkamer kan, indien de documenten, bedoeld in het derde lid, daartoe aanleiding geven, bij de betrokken
      instelling dan wel bij de derde die de administratie in opdracht van de instelling voert, een onderzoek instellen,
      waaronder een onderzoek naar het gevoerde beleid van de instelling, bedoeld in het eerste lid, onderdeel a. De
      rekenkamer stelt het algemeen bestuur en het dagelijks bestuur en indien een onderzoek wordt ingesteld naar het
      gevoerde beleid van een instelling als bedoeld in het eerste lid, onderdeel a, de rekenkamers van de deelnemende
      gemeenten, provincies en waterschappen aan deze instelling van haar voornemen een dergelijk onderzoek in te stellen
      in kennis.

      5 Indien de rekenkamer voornemens is onderzoek in te stellen bij een in het eerste lid, onderdeel c genoemde
      instelling, stelt zij, onverminderd het vierde lid, de colleges van de andere deelnemende gemeenten, de
      gedeputeerde staten van de deelnemende provincies, de dagelijks besturen van de deelnemende waterschappen of Onze
      Minister die het aangaat in het geval van deelneming van de Staat van haar voornemen een dergelijk onderzoek in te
      stellen in kennis.

      6 Dit artikel is niet van toepassing op financiële ondernemingen en elektronischgeldinstellingen als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel97c
