      1 De vertegenwoordigers van de categorieën van belanghebbenden, bedoeld in
      [artikel 12, tweede lid, onderdelen b en c][ref1], worden benoemd voor vier jaren.

      2 Zij treden tegelijk af met ingang van de woensdag in de periode van 29 maart tot en met 4 april.

      3 Degene die ter vervulling van een opengevallen plaats is benoemd tot lid, treedt af op het tijdstip waarop
      degenen in wiens plaats hij is benoemd, zou hebben moeten aftreden.


