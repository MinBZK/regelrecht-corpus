  - number: '108'
    text: |-
      1 Het algemeen bestuur stelt bij verordening de uitgangspunten voor het financiële beleid, alsmede voor het
      financiële beheer en voor de inrichting van de financiële organisatie vast. Deze verordening waarborgt dat aan de
      eisen van rechtmatigheid, verantwoording en controle wordt voldaan.

      2 De verordening bevat in ieder geval:

      a. regels voor waardering en afschrijving van activa;

      b. grondslagen voor de berekening van de door het waterschapsbestuur in rekening te brengen prijzen en van tarieven
      voor rechten als bedoeld in [artikel 115, eerste lid][ref1];

      c. regels inzake de algemene doelstellingen en de te hanteren richtlijnen en limieten van de financieringsfunctie.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel115
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '115'
        hoofdstuk: XVI
  - number: '109'
    text: |-
      1 Het algemeen bestuur stelt bij verordening regels vast voor de controle op het financiële beheer en op de
      inrichting van de financiële organisatie. Deze verordening waarborgt dat de rechtmatigheid van het financiële
      beheer en van de inrichting van de financiële organisatie wordt getoetst.

      2 Het algemeen bestuur wijst één of meer accountants aan als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], belast met de controle van de in
      [artikel 103][ref2] bedoelde jaarrekening en het daarbij verstrekken van een accountantsverklaring en het
      uitbrengen van een verslag van bevindingen.

      3 De accountantsverklaring geeft op grond van de uitgevoerde controle aan of:

      a. de jaarrekening een getrouw beeld geeft van zowel de baten en lasten als de grootte en samenstelling van het
      vermogen;

      b. de jaarrekening is opgesteld in overeenstemming met de bij of krachtens algemene maatregel van bestuur te
      stellen regels, bedoeld in [artikel 98a][ref3], en

      c. het jaarverslag met de jaarrekening verenigbaar is.

      4 Het verslag van bevindingen bevat in ieder geval bevindingen over de vraag of de inrichting van het financiële
      beheer en van de financiële organisatie een getrouwe en rechtmatige verantwoording mogelijk maken.

      5 De accountant zendt de accountantsverklaring en het verslag van bevindingen aan het algemeen bestuur en een
      afschrift daarvan aan het dagelijks bestuur.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de reikwijdte van en de
      verslaglegging omtrent de accountantscontrole, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0005108#Artikel98a
    url: https://wetten.overheid.nl/BWBR0005108/2026-01-01#Artikel109
