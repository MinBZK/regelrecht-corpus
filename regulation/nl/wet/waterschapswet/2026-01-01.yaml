  - number: 51ad
    text: |-
      1 Het algemeen bestuur stelt een lid van de rekenkamer op non-activiteit indien:

      a. hij zich in voorlopige hechtenis bevindt;

      b. hij bij een nog niet onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem
      bij zulk een uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;

      c. hij onder curatele is gesteld, in staat van faillissement is verklaard, surséance van betaling heeft verkregen
      of wegens schulden is gegijzeld ingevolge een nog niet onherroepelijk geworden rechterlijke uitspraak.

      2 Het algemeen bestuur kan een lid van de rekenkamer op non-activiteit stellen, indien tegen hem een
      gerechtelijk onderzoek ter zake van een misdrijf wordt ingesteld of indien er een ander ernstig vermoeden
      is van het bestaan van feiten en omstandigheden die tot ontslag, anders dan op gronden vermeld in
      [artikel 51ac, zesde lid, onder a, en zevende lid, onder a][ref1], zouden kunnen leiden.

      3 Het algemeen bestuur beëindigt de non-activiteit zodra de grond voor de maatregel is vervallen, met dien
      verstande dat in een geval als bedoeld in het tweede lid de non-activiteit in ieder geval eindigt na zes maanden.
      In dat geval kan het algemeen bestuur de maatregel telkens voor ten hoogste drie maanden verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel51ac
