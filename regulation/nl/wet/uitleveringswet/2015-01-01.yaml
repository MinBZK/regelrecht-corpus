preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 6 april 1875, Stb. 66, "tot regeling der
    algemeene voorwaarden op welke, ten aanzien van de uitlevering van vreemdelingen, verdragen met vreemde Mogendheden
    kunnen worden gesloten", te vervangen door nieuwe, bij de ontwikkeling van het internationale recht aangepaste,
    wettelijke regelen betreffende uitlevering en andere vormen van internationale rechtshulp in strafzaken, zulks mede
    ter nadere uitvoering van artikel 4, tweede lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder: *Onze Minister:* Onze Minister van Justitie; *uitlevering:* verwijdering van
      een persoon uit Nederland met het doel hem ter beschikking te stellen van de autoriteiten van een andere Staat
      ten behoeve van hetzij een in die Staat tegen hem gericht strafrechtelijk onderzoek, hetzij de tenuitvoerlegging
      van een hem in die Staat opgelegde straf of maatregel; *vreemdeling:* ieder die de Nederlandse nationaliteit niet
      bezit en niet op grond van een wettelijke bepaling als Nederlander wordt behandeld; *opgeëiste persoon:* degene
      wiens uitlevering door een vreemde Mogendheid is verzocht; *verzoekende staat:* Mogendheid waarvan het verzoek tot
      uitlevering is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel1
  - number: '1.2'
    text: |-
      In deze wet wordt mede verstaan onder: - *Nederlands recht of recht van Nederland:* het recht van Bonaire, Sint
      Eustatius en Saba;
        - *Nederlands strafrecht:* het strafrecht van Bonaire, Sint Eustatius en Saba;
        - *Nederlandse wet:* een wet die van kracht is in de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *Nederlandse rechter:* de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *Nederlands grondgebied of Nederlands gebied:* het grondgebied van de openbare lichamen Bonaire, Sint Eustatius
      en Saba;
        - *in Nederland:* in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onder officier van justitie, hulpofficier van justitie en opsporingsambtenaar wordt uitsluitend voor de toepassing
      van de [artikelen 13 tot en met 14][ref1], [16a][ref2], [17][ref3] en de [artikelen 21][ref4] en [22a][ref5]
      en [50a][ref6] mede verstaan de officier van justitie van het openbaar ministerie van Bonaire, Sint Eustatius
      en Saba, de hulpofficier van justitie, bedoeld in artikel 191 van het Wetboek van Strafvordering BES, en de
      opsporingsambtenaar, bedoeld in artikel 184 van dat wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002559#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002559#Artikel22a
      [ref6]: https://wetten.overheid.nl/BWBR0002559#Artikel50a
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel1
