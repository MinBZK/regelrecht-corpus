  - number: '31.8'
    text: |-
      Indien de uitspraak van de rechtbank geheel of gedeeltelijk wordt vernietigd doet de Hoge Raad wat de rechtbank
      had behoren te doen. Tenzij de Hoge Raad de zaak zelf kan afdoen zonder in een nieuw onderzoek naar de feiten te
      treden, gelast hij tegen een door hem te bepalen tijdstip de oproeping van de opgeëiste persoon, zo nodig onder
      bijvoeging van een bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel31
  - number: '31.9'
    text: De Hoge Raad zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van zijn arrest toe.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel31
  - number: '32'
    text: |-
      Zodra de rechterlijke uitspraak betreffende het verzoek tot uitlevering in kracht van gewijsde is gegaan, zendt de
      griffier van het gerecht dat de zaak het laatst heeft behandeld, dat verzoek met de daarbij behorende stukken terug
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel32
  - number: '33.1'
    text: |-
      Nadat Onze Minister de stukken overeenkomstig [artikel 32][ref1] heeft terugontvangen, beslist hij zo spoedig
      mogelijk op het verzoek tot uitlevering.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel32
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '32'
        hoofdstuk: III
        afdeling: B
  - number: '33.2'
    text: |-
      Voorzover de uitlevering bij rechterlijk gewijsde ontoelaatbaar is verklaard, wordt op het verzoek afwijzend
      beschikt.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
  - number: '33.3'
    text: |-
      Is de uitlevering alleen wegens ongenoegzaamheid van de overgelegde stukken ontoelaatbaar verklaard, dan kan Onze
      Minister zijn beslissing aanhouden. Hetzelfde geldt, indien de uitlevering wel toelaatbaar is verklaard, doch Onze
      Minister nadere stukken nodig acht voor een verantwoorde beslissing zijnerzijds.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
  - number: '33.4'
    text: |-
      In geval van aanhouding van zijn beslissing biedt Onze Minister de autoriteiten van de verzoekende staat
      gelegenheid om, binnen een door hem te stellen redelijke termijn, nadere stukken over te leggen.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
  - number: '33.5'
    text: |-
      Worden de gevraagde nadere stukken niet binnen de daarvoor gestelde termijn overgelegd, dan beschikt Onze Minister
      afwijzend op het verzoek tot uitlevering.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
  - number: '33.6'
    text: |-
      De beslissing van Onze Minister op een verzoek tot uitlevering wordt ter kennis van de verzoekende staat gebracht
      langs diplomatieke weg, tenzij bij verdrag in een andere weg is voorzien.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel33
  - number: '34.1'
    text: |-
      Wanneer Onze Minister binnen de daarvoor gestelde termijn nadere stukken ontvangt, kan hij het dossier van de zaak
      opnieuw toezenden aan de officier van justitie bij de rechtbank die het verzoek tot uitlevering heeft behandeld.
      Alsdan vinden de [artikelen 23-26][ref1], [28][ref2]-[32][ref3] en [33, eerste en tweede lid][ref4], wederom
      toepassing. Indien de uitlevering door de Hoge Raad wegens ongenoegzaamheid der stukken ontoelaatbaar is verklaard
      kan Onze Minister het dossier met de nadere stukken ook rechtstreeks aan de Procureur-Generaal bij de Hoge Raad
      toezenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0002559#Artikel33
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '28'
        hoofdstuk: III
        afdeling: B
      - id: ref3
        bwb_id: BWBR0002559
        artikel: '32'
        hoofdstuk: III
        afdeling: B
      - id: ref4
        bwb_id: BWBR0002559
        artikel: '33'
        hoofdstuk: III
        afdeling: C
  - number: '34.2'
    text: |-
      Voor zover de nadere stukken daartoe aanleiding geven, wordt de uitlevering alsnog door de rechter toelaatbaar
      verklaard.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel34
  - number: '35.1'
    text: |-
      Indien twee of meer staten de uitlevering van dezelfde persoon hebben gevraagd, houdt Onze Minister bij de
      beslissing op hun verzoeken - voor zover deze ontvankelijk en voor inwilliging vatbaar zijn - rekening met het
      belang van een goede rechtsbedeling en voorts in het bijzonder met:
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: 35.1.a
    text: de meerdere of mindere ernst van de verschillende feiten waarvoor de uitlevering is gevraagd;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: 35.1.b
    text: de plaats of plaatsen waar de feiten zijn begaan;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: 35.1.c
    text: de tijdstippen waarop de verzoeken tot uitlevering zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: 35.1.d
    text: de nationaliteit van de opgeëiste persoon;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: 35.1.e
    text: |-
      de mogelijkheid dat de opgeëiste persoon, nadat hij naar het grondgebied van een van de verzoekende staten is
      verwijderd, vervolgens door de autoriteiten van die staat ter beschikking wordt gesteld van de autoriteiten van een
      andere verzoekende staat.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
  - number: '35.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing als de uitvaardigende justitiële autoriteit van een lidstaat van
      de Europese Unie de overlevering, bedoeld in [artikel 1 van de Overleveringswet][ref1], en een andere staat de
      uitlevering van dezelfde persoon hebben gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0016664#Artikel1
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016664
        artikel: '1'
  - number: '36'
    text: |-
      Van zijn beslissing op het verzoek tot uitlevering, alsmede van de aanhouding daarvan overeenkomstig
      [artikel 33, derde lid][ref1], geeft Onze Minister onverwijld kennis aan de officier van justitie bij de rechtbank
      die het verzoek heeft behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel33
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '33'
        hoofdstuk: III
        afdeling: C
  - number: '37.1'
    text: |-
      Een krachtens [artikel 27][ref1] bevolen vrijheidsbeneming wordt - behoudens de mogelijkheid van verdere
      vrijheidsbeneming uit anderen hoofde - beëindigd, zodra:


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel27
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '27'
        hoofdstuk: III
        afdeling: B
  - number: 37.1.a
    text: |-
      zulks door de rechtbank of door de officier van justitie, ambtshalve of op verzoek van de gedetineerde of diens
      raadsman, dan wel door de Hoge Raad bij zijn beslissing op een beroep in cassatie wordt gelast;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel37
  - number: 37.1.b
    text: |-
      zij dertig dagen heeft geduurd, tenzij de rechtbank inmiddels, op vordering van de officier van justitie, deze
      termijn heeft verlengd.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel37
  - number: '37.2'
    text: |-
      De officier van justitie gelast de beëindiging van de vrijheidsbeneming in elk geval zodra hij kennis heeft
      gekregen van een afwijzende beslissing van Onze Minister op het verzoek tot uitlevering.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel37
  - number: '38.1'
    text: |-
      Verlenging van de in [artikel 37, eerste lid, onder ][ref1], bedoelde termijn kan telkens voor ten hoogste dertig
      dagen geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel37
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '37'
        hoofdstuk: III
        afdeling: D
  - number: '38.2'
    text: De gedetineerde wordt in de gelegenheid gesteld op de vordering tot verlenging te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
  - number: '38.3'
    text: 'Verlenging kan alleen geschieden in gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
  - number: 38.3.a
    text: |-
      de rechterlijke uitspraak omtrent het verzoek tot uitlevering nog niet, of minder dan dertig dagen tevoren, in
      kracht van gewijsde is gegaan;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
  - number: 38.3.b
    text: |-
      Onze Minister zijn beslissing overeenkomstig [artikel 33, derde lid][ref1], heeft aangehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel33
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '33'
        hoofdstuk: III
        afdeling: C
  - number: 38.3.c
    text: |-
      de uitlevering mede door een derde staat is gevraagd, en Onze Minister nog niet op het verzoek van die staat heeft
      beschikt;
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
  - number: 38.3.d
    text: de uitlevering inmiddels wel is toegestaan, maar nog niet heeft kunnen plaatshebben.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel38
  - number: '39.1'
    text: |-
      Na gehele of gedeeltelijke inwilliging van het verzoek tot uitlevering wordt de opgeëiste persoon zo spoedig
      mogelijk ter beschikking van de autoriteiten van de verzoekende staat gesteld, zulks op een door Onze Minister, na
      overleg met die autoriteiten, te bepalen tijd en plaats.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel39
  - number: '39.2'
    text: |-
      De beslissing omtrent de tijd en de plaats van de uitlevering kan worden aangehouden, indien en zolang tegen de
      opgeëiste persoon een strafrechtelijke vervolging in Nederland gaande is, of een door een Nederlandse rechter tegen
      hem gewezen strafvonnis nog geheel of ten dele voor tenuitvoerlegging vatbaar is.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel39
  - number: '39.3'
    text: |-
      In gevallen als voorzien in het vorige lid kan Onze Minister, zo hij daarvoor termen aanwezig acht, bepalen dat de
      opgeëiste persoon, ten behoeve van diens berechting op het grondgebied van de verzoekende staat, reeds aanstonds
      voorlopig ter beschikking van de autoriteiten van die staat zal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel39
  - number: '39.4'
    text: |-
      Ondergaat de opgeëiste persoon, te wiens aanzien het vorige lid wordt toegepast, een vrijheidsstraf, dan komt de
      tijd gedurende welke hij ter beschikking van de autoriteiten van de verzoekende staat is, in mindering op zijn
      straftijd.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel39
  - number: '40.1'
    text: |-
      Indien zulks voor de toepassing van [artikel 39, eerste of derde lid][ref1], noodzakelijk is, wordt de opgeëiste
      persoon op bevel van de daartoe door Onze Minister aangeschreven officier van justitie aangehouden voor ten hoogste
      drie dagen. Indien de uitlevering niet binnen de termijn van drie dagen heeft kunnen plaatsvinden, kan het bevel
      tot aanhouding door de officier van justitie eenmaal voor ten hoogste drie dagen worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel39
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '39'
        hoofdstuk: III
        afdeling: D
  - number: '40.2'
    text: |-
      Na verlenging van de in het eerste lid bedoelde termijn door de officier van justitie, kan deze uitsluitend op
      vordering van de officier van justitie door de rechtbank worden verlengd. [Artikel 38, eerste en tweede lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel38
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '38'
        hoofdstuk: III
        afdeling: D
  - number: '40.3'
    text: |-
      Een verlenging als bedoeld in het tweede lid kan alleen geschieden wanneer de uitlevering door bijzondere
      omstandigheden niet binnen de termijn van 6 dagen heeft kunnen plaatshebben.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel40
  - number: '41.1'
    text: |-
      De voortvluchtige wiens voorlopige aanhouding of uitlevering vanwege een andere staat is verzocht, kan - uiterlijk
      op de dag voorafgaande aan die welke overeenkomstig [artikel 24][ref1] is bepaald voor zijn verhoor door de
      rechtbank - verklaren dat hij instemt met onmiddellijke uitlevering.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel24
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '24'
        hoofdstuk: III
        afdeling: B
  - number: '41.2'
    text: |-
      Voorzover bij verdrag niet anders is bepaald, kan een verklaring overeenkomstig het vorige lid alleen worden
      afgelegd ten overstaan van een rechter-commissaris, belast met de behandeling van strafzaken.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
  - number: '41.3'
    text: |-
      De rechter-commissaris is bevoegd de identiteit van de voortvluchtige vast te stellen op de wijze, bedoeld
      in [artikel 27a, eerste lid, eerste volzin, en tweede lid, van het Wetboek van Strafvordering][ref1].
      [Artikel 29a, tweede lid, van dat wetboek][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel27a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel29a
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 27a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 29a
  - number: '41.4'
    text: |-
      De voortvluchtige kan zich bij het afleggen van de verklaring doen bijstaan door een raadsman. Hierop wordt, zo
      hij zonder raadsman verschijnt, zijn aandacht gevestigd door de autoriteit bevoegd tot het in ontvangst nemen van
      de verklaring.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
  - number: '41.5'
    text: |-
      Voordat hij de verklaring aflegt, wordt de voortvluchtige op de mogelijke gevolgen daarvan opmerkzaam gemaakt. Van
      de verklaring wordt proces-verbaal opgemaakt. Indien ten aanzien van de voortvluchtige toepassing is gegeven aan
      [artikel 16a, tweede lid][ref1], of [artikel 22a, tweede lid][ref2], vindt toezending steeds plaats aan de officier
      van justitie bij het arrondissementsparket te Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel22a
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: 16a
        hoofdstuk: III
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002559
        artikel: 22a
        hoofdstuk: III
        afdeling: B
  - number: '41.6'
    text: |-
      De autoriteit ten overstaan van wie de verklaring is afgelegd, zendt het proces-verbaal daarvan aan de officier
      van justitie die krachtens deze wet bij het verzoek tot voorlopige aanhouding, dan wel het verzoek tot uitlevering
      is betrokken.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel41
  - number: '42.1'
    text: |-
      Nadat een verklaring overeenkomstig [artikel 41][ref1] is afgelegd, kan de officier van justitie beslissen dat
      de voortvluchtige ter beschikking zal worden gesteld van de autoriteiten van de staat waarvan het verzoek tot
      voorlopige aanhouding, of het verzoek tot uitlevering, is uitgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel41
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '41'
        hoofdstuk: III
        afdeling: E
  - number: '42.2'
    text: 'Het vorige lid blijft buiten toepassing:'
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel42
  - number: 42.2.a
    text: |-
      indien voor het feit of de feiten, in verband waarmede de voorlopige aanhouding of de uitlevering is gevraagd,
      ingevolge een der bepalingen van de [artikelen 2][ref1] en [9][ref2] geen uitlevering kan worden toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel9
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '9'
        hoofdstuk: II
  - number: 42.2.b
    text: |-
      indien blijkt dat tegen de voortvluchtige in Nederland een strafrechtelijke vervolging gaande is, of dat tegen hem
      door een Nederlandse rechter een nog geheel of ten dele voor tenuitvoerlegging vatbaar strafvonnis is gewezen.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel42
  - number: '42.3'
    text: |-
      Van elke beslissing, genomen krachtens het eerste lid van dit artikel, geeft de officier van justitie onverwijld
      kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel42
  - number: '43.1'
    text: |-
      Indien de officier van justitie overeenkomstig [artikel 42][ref1] heeft beslist, dat de voortvluchtige ter
      beschikking zal worden gesteld van de autoriteiten van de andere staat, blijft [artikel 23][ref2] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '42'
        hoofdstuk: III
        afdeling: E
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '43.2'
    text: |-
      Is de in [artikel 23][ref1] bedoelde vordering reeds bij de rechtbank ingediend, dan wordt deze onverwijld
      ingetrokken. De griffier van de rechtbank stelt alsdan het verzoek tot uitlevering, met de daarbij behorende
      stukken, weder in handen van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '43.3'
    text: Van het intrekken van de vordering geeft de officier van justitie kennis aan de opgeëiste persoon.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel43
  - number: '44.1'
    text: |-
      Na de dag waarop hij de in [artikel 41][ref1] bedoelde verklaring heeft afgelegd, kan de voortvluchtige nog slechts
      gedurende ten hoogste twintig dagen in bewaring of in verzekering gesteld blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel41
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '41'
        hoofdstuk: III
        afdeling: E
  - number: '44.2'
    text: |-
      Het vorige lid blijft buiten toepassing, indien de officier van justitie heeft beslist dat aan de verklaring
      geen gevolg zal worden gegeven en het verzoek tot uitlevering, met de daarbij behorende stukken, overeenkomstig
      [artikel 23, eerste lid][ref1], aan de rechtbank is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '44.3'
    text: |-
      De in het eerste lid van dit artikel gestelde termijn kan, op vordering van de officier van justitie, door de
      rechtbank worden verlengd.[ Artikel 38, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel38
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '38'
        hoofdstuk: III
        afdeling: D
  - number: '44.4'
    text: |-
      Verlenging kan alleen geschieden wanneer de uitlevering door bijzondere omstandigheden niet binnen de termijn van
      twintig dagen heeft kunnen plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel44
  - number: '45.1'
    text: |-
      In geval van toepassing van [artikel 42, eerste lid][ref1], bepaalt de officier van justitie, na overleg met de
      bevoegde buitenlandse autoriteiten, onverwijld de tijd en de plaats waarop de uitlevering zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel42
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '42'
        hoofdstuk: III
        afdeling: E
  - number: '45.2'
    text: |-
      De officier van justitie kan, zo nodig, met het oog op de uitlevering krachtens de bepalingen van deze afdeling, de
      aanhouding van de voortvluchtige bevelen. Artikel 40, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel45
  - number: '45.3'
    text: |-
      In geval van uitlevering krachtens de bepalingen van deze afdeling is [artikel 12][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel12
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '12'
        hoofdstuk: II
  - number: '46.1'
    text: |-
      Voorwerpen, aangetroffen in het bezit van degene wiens uitlevering of voorlopige aanhouding krachtens een
      verdrag is gevraagd, kunnen op verzoek van de bevoegde buitenlandse autoriteiten in beslag worden genomen. De
      inbeslagneming geschiedt door of op last van de officier of hulpofficier van justitie, bevoegd tot het geven van
      een bevel tot aanhouding of voorlopige aanhouding.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel46
  - number: '46.2'
    text: |-
      Bij de in [artikel 23][ref1] bedoelde vordering legt de officier van justitie een lijst van de in beslag genomen
      voorwerpen aan de rechtbank voor.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '47.1'
    text: |-
      De rechtbank beslist bij haar uitspraak omtrent het verzoek tot uitlevering tevens over de afgifte, dan wel de
      teruggave, van de in beslag genomen voorwerpen. Afgifte van die voorwerpen aan de autoriteiten van de verzoekende
      staat kan alleen worden bevolen voor het geval van inwilliging van het verzoek tot uitlevering.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel47
  - number: '47.2'
    text: |-
      Met het oog op mogelijke rechten van derden kan de rechtbank ten aanzien van bepaalde voorwerpen beslissen, dat
      afgifte aan de autoriteiten van de verzoekende staat slechts mag geschieden onder het beding, dat die voorwerpen
      onmiddellijk zullen worden teruggezonden nadat daarvan het voor de strafvordering nodige gebruik zal zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel47
  - number: '47.3'
    text: |-
      Het bepaalde bij en krachtens de [artikelen 116 tot en met 119][ref1], [552a][ref2] en
      [552c tot en met 552e van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing. In plaats van
      het volgens die bepalingen bevoegde gerecht treedt de rechtbank tot welke de in [artikel 23, eerste lid][ref4],
      van deze wet bedoelde vordering is gericht, dan wel - zo die vordering niet is gedaan - de rechtbank van het
      arrondissement waarin de voorwerpen in beslag genomen zijn. Zijn de voorwerpen in de openbare lichamen Bonaire,
      Sint Eustatius en Saba in beslag genomen, dan is de rechtbank Amsterdam bij uitsluiting bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel552a
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel552c
      [ref4]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '116'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 552a
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 552c
      - id: ref4
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '47.4'
    text: |-
      In geval van uitlevering overeenkomstig de bepalingen van [afdeling E van hoofdstuk III][ref1] beslist de officier
      van justitie over de afgifte, dan wel de teruggave, van de in beslag genomen voorwerpen, behoudens de bevoegdheden
      van de rechtbank krachtens het vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002559
        hoofdstuk: III
        afdeling: E
  - number: '48.1'
    text: |-
      Vreemdelingen die, ten behoeve van een strafrechtelijk onderzoek of de tenuitvoerlegging van een strafvonnis, door
      de autoriteiten van een vreemde staat ter beschikking van de autoriteiten van een andere staat worden gesteld,
      kunnen met toestemming van Onze Minister over Nederlands grondgebied worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel48
  - number: '48.2'
    text: Toestemming voor vervoer over land wordt niet gegeven dan krachtens een verdrag.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel48
  - number: '48.3'
    text: |-
      De toestemming van Onze Minister is niet vereist voor vervoer door de lucht waarbij geen landing op Nederlands
      gebied wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel48
  - number: '48.4'
    text: |-
      In geval van een niet voorziene landing op Nederlands gebied kan de vreemdeling, op verzoek van de hem begeleidende
      buitenlandse ambtenaren, voorlopig worden aangehouden krachtens een bevel van een ter plaatse bevoegde officier of
      hulpofficier van justitie. De [artikelen 14][ref1] en [16a, eerste lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel16a
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '14'
        hoofdstuk: III
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002559
        artikel: 16a
        hoofdstuk: III
        afdeling: A
  - number: '48.5'
    text: |-
      Het vervoer van de voorlopig aangehouden vreemdeling kan worden voortgezet, zodra Onze Minister daartoe alsnog
      toestemming verleent. Is de toestemming na afloop van de termijn van inverzekeringstelling nog niet verleend, of
      binnen die termijn geweigerd, dan wordt de vreemdeling terstond in vrijheid gesteld, behoudens de mogelijkheid van
      verdere vrijheidsbeneming uit anderen hoofde.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel48
  - number: '49'
    text: |-
      De ingevolge [artikel 48][ref1] vereiste toestemming wordt niet gegeven in gevallen waarin, zo het een verzoek tot
      uitlevering betrof, dat verzoek zou moeten worden afgewezen op grond van het bepaalde in de [artikelen 8-10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel8
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '48'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '8'
        hoofdstuk: II
  - number: '50.1'
    text: |-
      Voor zover bij verdrag niet anders is bepaald, wordt bij vervoer te land, overeenkomstig [artikel 48][ref1], de
      bewaking van de vreemdeling opgedragen aan Nederlandse ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel48
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '48'
        hoofdstuk: IV
  - number: '50.2'
    text: |-
      Indien het ten gevolge van bijzondere omstandigheden niet mogelijk is het vervoer door Nederland, Bonaire,
      Sint Eustatius of Saba zonder onderbreking voort te zetten, kan de vreemdeling, in afwachting van een passende
      gelegenheid tot vertrek naar elders, zo nodig worden opgenomen in een huis van bewaring, zulks op vertoon van een
      stuk waaruit blijkt van de door Onze Minister verleende toestemming tot het vervoer.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel50
  - number: 50a.1
    text: |-
      In de gevallen dat een persoon, die in het buitenland rechtens van zijn vrijheid is beroofd, tijdelijk ter
      beschikking wordt gesteld van de Nederlandse justitie en die van Bonaire, Sint Eustatius en Saba voor het
      afleggen van een verklaring als getuige of voor confrontatie wordt hij gedurende zijn verblijf hier te lande
      op bevel van het bevoegde lid van het openbaar ministerie in verzekering gesteld. De [artikelen 54][ref1] en
      [56, eerste lid][ref2] zijn, voor zoveel nodig, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel56
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '54'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '56'
        hoofdstuk: V
  - number: 50a.2
    text: |-
      De inverzekeringstelling wordt opgeheven zodra het bevoegde lid van het openbaar ministerie bericht ontvangt, dat
      de gronden voor vrijheidsberoving in het buitenland niet langer bestaan.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel50a
  - number: '51.1'
    text: |-
      In gevallen waarin zulks bij een verdrag is bepaald, kan Onze Minister toestaan dat personen die in Nederland
      rechtens van hun vrijheid zijn beroofd, tijdelijk ter beschikking worden gesteld van de autoriteiten van een andere
      staat voor het afleggen van een verklaring als getuige, of voor confrontatie.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel51
  - number: '51.2'
    text: |-
      Voor zover het verdrag niet anders bepaalt, is de instemming van de tijdelijk ter beschikking te stellen persoon
      vereist.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel51
  - number: '51.3'
    text: |-
      Onze Minister staat de tijdelijke terbeschikkingstelling niet toe, indien deze is verzocht ten behoeve van een op
      het grondgebied van een andere staat ingesteld strafrechtelijk onderzoek, dat betrekking heeft op feiten, waarvoor
      krachtens [artikel 9][ref1] of [10][ref2] geen uitlevering mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel10
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '10'
        hoofdstuk: II
  - number: '51.4'
    text: |-
      Ondergaat de betrokkene in Nederland een vrijheidsstraf, dan komt de tijd gedurende welke hij ter beschikking van
      de autoriteiten van de andere staat is, in mindering op zijn straftijd.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel51
  - number: 51a.1
    text: |-
      Voor de in het tweede lid genoemde feiten, strafbaar te stellen ingevolge de in dat lid genoemde verdragen, kan
      worden uitgeleverd aan Staten die Partij zijn bij het desbetreffende verdrag.
    url: https://wetten.overheid.nl/BWBR0002559/2015-01-01#Artikel51a
  - number: 51a.2
    text: |-
      Het eerste lid heeft betrekking op: - het misdrijf van [artikel 385a van het Wetboek van Strafrecht][ref1] dan
      wel het misdrijf van [artikel 399a van het Wetboek van Strafrecht BES][ref2], voorzover het feit valt onder de
      omschrijvingen van het op 16 december 1970 te ’s-Gravenhage tot stand gekomen Verdrag tot bestrijding van het
      wederrechtelijk in zijn macht brengen van luchtvaartuigen (Trb. 1971, 50);
        - de misdrijven van de [artikelen 162][ref3], [162a][ref4], [166][ref5], [168][ref6], [385b][ref7] , [385c][ref8]
      en [385d van het Wetboek van Strafrecht][ref9] dan wel de misdrijven van de [artikelen 168][ref10], [168a][ref11],
      [172][ref12], [174][ref13], [399b][ref14], [399c][ref15] en [399d van het Wetboek van Strafrecht BES][ref16],
      voorzover het feit valt onder de omschrijving van het op 23 september 1971 te Montreal tot stand gekomen
      Verdrag tot bestrijding van wederrechtelijke gedragingen tegen de veiligheid van de burgerluchtvaart (Trb. 1971,
      218), onderscheidenlijk van het op 24 februari 1988 te Montreal tot stand gekomen Protocol tot bestrijding van
      wederrechtelijke daden van geweld op luchthavens voor de internationale burgerluchtvaart (Trb. 1988, 88);
        - de misdrijven, strafbaar gesteld in de [artikelen 10, tweede, derde, vierde en vijfde lid][ref17],
      [10a, eerste lid][ref18], en [11, tweede en derde lid, van de Opiumwet][ref19], dan wel de misdrijven, strafbaar
      gesteld in de [artikelen 11, eerste en tweede lid][ref20], en [11a van de Opiumwet 1960 BES][ref21], voorzover het
      feit valt onder de omschrijvingen van het eerste lid van artikel 36 van het Enkelvoudig Verdrag inzake verdovende
      middelen, 1961, zoals gewijzigd ingevolge artikel 14 van het op 25 maart 1972 te Genève tot stand gekomen Protocol
      tot wijziging van dat Enkelvoudig Verdrag (Trb. 1980, 184);
        - de misdrijven van de [artikelen 92][ref22], [108–110][ref23], [115–117b][ref24] en
      [285 van het Wetboek van Strafrecht][ref25] dan wel de misdrijven van de [artikelen 97][ref26],
      [114 tot en met 118][ref27], [123 tot en met 124c][ref28] en [298 van het Wetboek van Strafrecht BES][ref29],
      voor zover het feit is gepleegd tegen een internationaal beschermd persoon of diens beschermde goederen en valt
      onder de omschrijvingen van het op 14 december 1973 te New York tot stand gekomen Verdrag inzake de voorkoming en
      bestraffing van misdrijven tegen internationaal beschermde personen, met inbegrip van diplomaten (Trb. 1981, 69);
        - het misdrijf van [artikel 282a van het Wetboek van Strafrecht][ref30] dan wel het misdrijf van
      [artikel 295ao van het Wetboek van Strafrecht BES][ref31], voor zover het feit valt onder de omschrijving van het
      op 17 december 1979 te New York tot stand gekomen Internationaal Verdrag tegen het nemen van gijzelaars (Trb. 1981,
      53);
        - de misdrijven van de [artikelen 157][ref32], [161quater][ref33], [173a][ref34], [225][ref35],
      [284a][ref36], [285][ref37], [310-312][ref38], [317][ref39], [318][ref40], [321][ref41], [322][ref42]
      en [326 van het Wetboek van Strafrecht][ref43] en de misdrijven, gevormd door het handelen in strijd
      met het bij of krachtens de [artikelen 15][ref44], [19][ref45], [21][ref46], [26][ref47], [38][ref48] en
      [76a van de Kernenergiewet][ref49] bepaalde, dan wel de misdrijven van de [artikelen 163][ref50], [167c][ref51],
      [179a][ref52], [230][ref53], [297a][ref54], [298][ref55], [323 tot en met 325][ref56], [330][ref57], [331][ref58],
      [334][ref59], [335][ref60] en [339 van het Wetboek van Strafrecht BES][ref61], voorzover het feit valt onder de
      omschrijvingen van het op 3 maart 1980 te Wenen/New York tot stand gekomen Verdrag inzake de fysieke beveiliging
      van kernmateriaal (Trb. 1981, 7), zoals gewijzigd bij de op 8 juli 2005 te Wenen tot stand gekomen wijziging van
      dat verdrag (Trb. 2006, 81);
        - de misdrijven van de [artikelen 140][ref62], [157][ref63], [161quater][ref64], [166][ref65], [168][ref66],
      [173a][ref67], [189][ref68], [285][ref69], [287][ref70], [288][ref71], [289][ref72], [302][ref73], [303][ref74],
      [350][ref75], [352][ref76], [354][ref77], [385 a, vierde lid][ref78], [385b, tweede lid][ref79], [385c][ref80] en
      [413, van het Wetboek van Strafrecht][ref81], de [artikelen 79][ref82] en [80 van de Kernenergiewet][ref83], de
      [artikelen 2, eerste en derde lid][ref84], [3][ref85] en [4 van de Uitvoeringswet verdrag biologische wapens][ref86]
      in samenhang met [artikel 1 van de Wet op de economische delicten][ref87], en de [artikelen 2][ref88] en
      [3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref89] in samenhang met artikel 1 van de Wet
      op de economische delicten dan wel de misdrijven van de [artikelen 146][ref90], [163][ref91], [167c][ref92],
      [172][ref93], [174][ref94], [179a][ref95], [195][ref96], [298][ref97], [300][ref98], [301][ref99], [302][ref100],
      [315][ref101], [316][ref102], [366][ref103], [370][ref104], [372][ref105], [399a, vierde lid][ref106],
      [399b, tweede lid][ref107], [399c][ref108] en [428 van het Wetboek van Strafrecht BES][ref109], voor zover het
      feit valt onder de omschrijvingen van het op 10 maart 1988 te Rome tot stand gekomen Verdrag tot bestrijding van
      wederrechtelijke gedragingen gericht tegen de veiligheid van de zeevaart (Trb. 1989, 17), zoals gewijzigd bij
      het Protocol van 2005 bij dat Verdrag (Trb. 2006, 223), en het op 10 maart 1988 tot stand gekomen Protocol tot
      bestrijding van wederrechtelijke gedragingen gericht tegen de veiligheid van vaste platforms op het continentale
      plat (Trb. 1989, 18), zoals gewijzigd bij het Protocol van 2005 bij dat Protocol (Trb. 2006, 224);
        - de misdrijven strafbaar gesteld in de [artikelen 10, tweede, derde, vierde en vijfde lid][ref110],
      [10a, eerste lid][ref111], [11, tweede tot en met vierde lid][ref112], en [11a, van de Opiumwet][ref113] alsmede
      de misdrijven van de [artikelen 131][ref114], [140][ref115], [189, eerste lid, aanhef en onder 3°][ref116],
      [416 tot en met 417bis][ref117] en [420bis tot en met 420quater van het Wetboek van Strafrecht][ref118]
      dan wel de misdrijven strafbaar gesteld in de [artikelen 11, eerste en tweede lid][ref119], en
