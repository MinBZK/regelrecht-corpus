  - number: 51a.3
    text: |-
      Uitlevering krachtens het eerste lid geschiedt met inachtneming van de bepalingen van deze wet en voorts -
      voorzover geen ander uitleveringsverdrag van toepassing is - van de bepalingen van het Europees Verdrag betreffende
      uitlevering van 13 december 1957 (*Trb.* 1965, 9).
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel51a
  - number: '52'
    text: |-
      Krachtens deze wet gegeven bevelen tot inverzekeringstelling of bewaring, dan wel tot verlenging van een termijn
      van vrijheidsbeneming, worden gedagtekend en ondertekend. De grond voor uitvaardiging wordt in het bevel vermeld.
      Aan degene op wie het bevel betrekking heeft, wordt onverwijld een afschrift daarvan uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel52
  - number: '53.1'
    text: De bevelen tot vrijheidsbeneming, gegeven krachtens deze wet, zijn dadelijk uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel53
  - number: '53.2'
    text: |-
      Bevoegd tot het ten uitvoer leggen van bevelen tot aanhouding, voorlopige aanhouding of gevangenneming zijn de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] genoemde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '53.3'
    text: |-
      Op de tenuitvoerlegging van bevelen tot vrijheidsbeneming en de last daartoe zijn de
      [artikelen 564-568 van het Wetboek van Strafvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel564
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '564'
  - number: '54'
    text: |-
      Personen die krachtens deze wet in verzekering of in bewaring zijn gesteld, of wier gevangenneming of
      gevangenhouding is bevolen, worden behandeld als verdachten die krachtens het [Wetboek van Strafvordering][ref1]
      aan een overeenkomstige maatregel zijn onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '55.1'
    text: |-
      Het bij en krachtens [artikel 40 van het Wetboek van Strafvordering][ref1] bepaalde is van overeenkomstige
      toepassing ten aanzien van een krachtens deze wet in verzekering gestelde voortvluchtige.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel40
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '40'
  - number: '55.2'
    text: |-
      Indien een persoon overeenkomstig deze wet van zijn vrijheid wordt beroofd - anders dan uit kracht van een bevel
      tot aanhouding of voorlopige aanhouding, dan wel tot inverzekeringstelling of tot verlenging van de termijn daarvan
        - geeft de voorzitter van de rechtbank in het arrondissement waarin hij zich bevindt een last tot toevoeging aan
      het bureau rechtsbijstandvoorziening. De officier van justitie geeft de voorzitter onverwijld schriftelijk kennis,
      dat toevoeging moet plaats hebben.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel55
  - number: 55a
    text: |-
      Op de bevelen tot bewaring en gevangenhouding, krachtens deze wet gegeven, is
      [artikel 66a van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel66a
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 66a
  - number: '56.1'
    text: |-
      In gevallen waarin krachtens deze wet een beslissing omtrent de vrijheidsbeneming kan of moet worden genomen,
      kan worden bevolen dat die vrijheidsbeneming voorwaardelijk wordt opgeschort of geschorst totdat de officier van
      justitie overeenkomstig [artikel 36][ref1] in kennis is gesteld van de beslissing van Onze Minister waarbij de
      uitlevering is toegestaan. De te stellen voorwaarden mogen alleen strekken ter voorkoming van vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel36
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '36'
        hoofdstuk: III
        afdeling: C
  - number: '56.2'
    text: |-
      Op bevelen krachtens het vorige lid gegeven door de rechtbank, dan wel door de rechter-commissaris, zijn de
      [artikelen 80][ref1] - met uitzondering van het tweede lid - en [81-88 van het Wetboek van Strafvordering][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel81
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '80'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '81'
  - number: '57'
    text: |-
      Op bevelen tot beëindiging van vrijheidsbeneming, krachtens deze wet gegeven, en op de
      tenuitvoerlegging van zodanige bevelen zijn de [artikelen 73][ref1], [79][ref2], [569][ref3] en
      [570 van het Wetboek van Strafvordering][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel569
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel570
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '569'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '570'
  - number: '58'
    text: |-
      De termijnen, genoemd in de [artikelen 16, onder ][ref1], [37, eerste lid onder ][ref2], [40, derde lid][ref3], en
      [44, eerste lid][ref4], lopen niet gedurende de tijd dat de betrokkene zich aan de verdere tenuitvoerlegging van de
      in die artikelen bedoelde bevelen heeft onttrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel40
      [ref4]: https://wetten.overheid.nl/BWBR0002559#Artikel44
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '16'
        hoofdstuk: III
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '37'
        hoofdstuk: III
        afdeling: D
      - id: ref3
        bwb_id: BWBR0002559
        artikel: '40'
        hoofdstuk: III
        afdeling: D
      - id: ref4
        bwb_id: BWBR0002559
        artikel: '44'
        hoofdstuk: III
        afdeling: E
  - number: '59.1'
    text: |-
      In gevallen waarin de uitlevering bij rechterlijk gewijsde ontoelaatbaar is verklaard, kan de rechtbank die de
      zaak heeft behandeld, op verzoek van de opgeëiste persoon, hem een vergoeding ten laste van de Staat toekennen
      voor de schade die hij heeft geleden ten gevolge van vrijheidsbeneming, bevolen krachtens deze wet. Onder schade
      is begrepen het nadeel dat niet in vermogensschade bestaat. De [artikelen 89][ref1], derde, vierde en zesde lid, en
      [90][ref2], [91][ref3], en [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '93'
  - number: '59.2'
    text: |-
      In gevallen als bedoeld in het vorige lid vinden de [artikelen 591][ref1] en [591][ref2] overeenkomstige toepassing
      op vergoeding van kosten en schaden voor de opgeëiste persoon of diens erfgenamen. In plaats van het in die
      artikelen bedoelde gerecht treedt de rechtbank die het verzoek tot uitlevering heeft behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel591
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel591a
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '591'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: 591a
  - number: '60'
    text: |-
      Op betekeningen, kennisgevingen en oproepingen, gedaan krachtens deze wet, zijn de artikelen 585-590 van het
      [Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '61.1'
    text: 'De bepalingen van de voorgaande hoofdstukken zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel61
  - number: 61.1.a
    text: |-
      rechtshulp voorzien in de [Wet overlevering inzake oorlogsmisdrijven][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002134
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002134
  - number: 61.1.b
    text: overlevering van gedeserteerde schepelingen aan autoriteiten van de staat waartoe zij behoren;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel61
  - number: 61.1.c
    text: |-
      overlevering van leden van een vreemde krijgsmacht, en van personen die met hen zijn gelijkgesteld, aan de bevoegde
      militaire autoriteiten, voor zover die overlevering geschiedt krachtens een overeenkomst met een of meer staten
      waarmede Nederland bondgenootschappelijke betrekkingen onderhoudt.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel61
  - number: '62.1'
    text: |-
      Ingetrokken wordt de wet van 6 april 1875, *Stb.* 66, tot regeling der algemeene voorwaarden, op welke, ten aanzien
      van de uitlevering van vreemdelingen, verdragen met vreemde Mogendheden kunnen worden gesloten.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel62
  - number: '62.2'
    text: |-
      De in het vorige lid genoemde wet blijft van toepassing op de behandeling van een verzoek tot uitlevering, en op
      de in verband daarmede te nemen beslissingen, in gevallen waarin de stukken betreffende dat verzoek reeds vóór het
      tijdstip van het in werking treden van deze wet aan de rechtbank om advies zijn toegezonden.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel62
  - number: '62.3'
    text: |-
      De artikelen 16, tweede en derde lid, en 17 van de ingetrokken wet blijven van toepassing op de behandeling van
      een verzoekschrift als bedoeld in artikel 16, eerste lid, van die wet, en op de daarop door de Hoge Raad te nemen
      beslissing, in gevallen waarin dat verzoekschrift reeds vóór het tijdstip van het in werking treden van deze wet
      bij de Hoge Raad is ingekomen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel62
  - number: '62.4'
    text: |-
      Beslist de Hoge Raad dat de verzoeker Nederlander is, dan wordt een inmiddels overeenkomstig deze wet door de
      rechtbank aangevangen behandeling van een verzoek tot diens uitlevering onmiddellijk beëindigd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel62
  - number: '62.5'
    text: |-
      Een vreemdeling die op het tijdstip van het in werking treden van deze wet is gedetineerd ingevolge een bevel
      gegeven krachtens artikel 9 of artikel 12 van de ingetrokken wet, wordt - zo de stukken betreffende het verzoek
      tot zijn uitlevering op dat tijdstip nog niet aan de rechtbank zijn toegezonden - daarna beschouwd en behandeld als
      iemand die krachtens [artikel 22][ref1], onderscheidenlijk [artikel 21, derde lid][ref2], van deze wet in bewaring
      wordt gehouden of in verzekering is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel21
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '22'
        hoofdstuk: III
        afdeling: B
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '21'
        hoofdstuk: III
        afdeling: B
  - number: '63'
    text: 'Deze wet kan worden aangehaald onder de titel: Uitleveringswet.'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel63
