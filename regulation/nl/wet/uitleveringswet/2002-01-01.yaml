---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitleveringswet
regulatory_layer: WET
publication_date: '2009-12-10'
valid_from: '2002-01-01'
bwb_id: BWBR0002559
url: https://wetten.overheid.nl/BWBR0002559/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 6 april 1875, Stb. 66, "tot regeling der
    algemeene voorwaarden op welke, ten aanzien van de uitlevering van vreemdelingen, verdragen met vreemde Mogendheden
    kunnen worden gesloten", te vervangen door nieuwe, bij de ontwikkeling van het internationale recht aangepaste,
    wettelijke regelen betreffende uitlevering en andere vormen van internationale rechtshulp in strafzaken, zulks mede
    ter nadere uitvoering van artikel 4, tweede lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: *Onze Minister:* Onze Minister van Justitie; *uitlevering:* verwijdering van
      een persoon uit Nederland met het doel hem ter beschikking te stellen van de autoriteiten van een andere Staat
      ten behoeve van hetzij een in die Staat tegen hem gericht strafrechtelijk onderzoek, hetzij de tenuitvoerlegging
      van een hem in die Staat opgelegde straf of maatregel; *vreemdeling:* ieder die de Nederlandse nationaliteit niet
      bezit en niet op grond van een wettelijke bepaling als Nederlander wordt behandeld; *opgeëiste persoon:* degene
      wiens uitlevering door een vreemde Mogendheid is verzocht; *verzoekende staat:* Mogendheid waarvan het verzoek tot
      uitlevering is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel1
  - number: '2'
    text: Uitlevering geschiedt niet dan krachtens een verdrag.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Wanneer een van deze wet afwijkend verdrag aan de goedkeuring van de Staten-Generaal wordt onderworpen, doen Wij
      tevens een voorstel tot aanpassing van deze wet.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel3
  - number: '4.1'
    text: Nederlanders worden niet uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is niet van toepassing indien de uitlevering van een Nederlander is gevraagd ten behoeve van een
      tegen hem gericht strafrechtelijk onderzoek en naar het oordeel van Onze Minister is gewaarborgd dat, zo hij ter
      zake van de feiten waarvoor zijn uitlevering kan worden toegestaan in de verzoekende Staat tot onvoorwaardelijke
      vrijheidsstraf wordt veroordeeld, hij deze straf in Nederland zal mogen ondergaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel4
  - number: '5.1'
    text: 'Uitlevering kan alleen worden toegestaan ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel5
  - number: 5.1.a
    text: |-
      een door autoriteiten van de verzoekende staat ingesteld strafrechtelijk onderzoek ter zake van het vermoeden dat
      de opgeëiste persoon zich schuldig heeft gemaakt aan een feit waarvoor, zowel naar het recht van de verzoekende
      staat als naar dat van Nederland, een vrijheidsstraf van een jaar, of van langere duur, kan worden opgelegd;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel5
  - number: 5.1.b
    text: |-
      de tenuitvoerlegging van een vrijheidsstraf van vier maanden, of van langere duur, door de opgeëiste persoon op het
      grondgebied van de verzoekende staat te ondergaan wegens een feit als onder *a* bedoeld.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Voor de toepassing van het voorgaande lid wordt onder een naar Nederlands recht strafbaar feit mede verstaan een
      feit waardoor inbreuk is gemaakt op de rechtsorde van de verzoekende staat, terwijl krachtens de Nederlandse wet
      een zelfde inbreuk op de Nederlandse rechtsorde strafbaar is.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      Indien, in het geval bedoeld in het eerste lid, onder *b*, de veroordeling tot vrijheidsstraf bij verstek heeft
      plaatsgevonden, kan de uitlevering slechts worden toegestaan, indien de opgeëiste persoon in voldoende mate in de
      gelegenheid is geweest of alsnog zal worden gesteld om zijn verdediging te voeren.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Het in [artikel 5, eerste lid, onder a][ref1], gestelde minimum van een jaar is niet van toepassing op uitlevering
      naar lidstaten van de Europese Unie, voorzover een tussen Nederland en deze lidstaten geldend verdrag in een ander
      minimum voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel5
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Het in [artikel 5, eerste lid, onder b][ref1], gestelde minimum van vier maanden is niet van toepassing op
      uitlevering naar België en Luxemburg.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel5
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: 'Voor de toepassing van deze wet worden gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel7
  - number: 7.a
    text: |-
      met *vrijheidsstraffen:* door de rechter naast of in plaats van een straf op te leggen maatregelen strekkende tot
      vrijheidsbeneming;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel7
  - number: 7.b
    text: |-
      met *vrijheidsstraffen van langere duur dan een jaar:* vrijheidsstraffen - met inbegrip van maatregelen als bedoeld
      onder *a* - voor de duur van het leven of voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel7
  - number: '8'
    text: |-
      Indien, naar het recht van de verzoekende staat, de doodstraf is gesteld op het feit waarvoor de uitlevering is
      gevraagd, wordt de opgeëiste persoon niet uitgeleverd, tenzij naar het oordeel van Onze Minister voldoende is
      gewaarborgd dat die straf, zo een veroordeling daartoe mocht volgen, niet ten uitvoer zal worden gelegd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel8
  - number: '9.1'
    text: 'Uitlevering van de opgeëiste persoon wordt niet toegestaan voor een feit terzake waarvan:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.a
    text: ten tijde van de beslissing op het verzoek tot uitlevering een strafvervolging in Nederland tegen hem gaande is;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.b
    text: |-
      hij in Nederland is vervolgd, indien hernieuwde vervolging is uitgesloten op grond van
      [artikel 255, eerste en tweede lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel255
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '255'
  - number: 9.1.c
    text: |-
      hij bij gewijsde van de Nederlandse rechter is vrijgesproken of ontslagen van rechtsvervolging, dan wel te zijnen
      aanzien een overeenkomstige onherroepelijke beslissing door een andere rechter is genomen;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.d
    text: 'hij bij rechterlijk gewijsde is veroordeeld, in gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.d.1
    text: de opgelegde straf of maatregel reeds is ondergaan, of
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.d.2
    text: die straf of maatregel niet voor onmiddellijke tenuitvoerlegging of verdere tenuitvoerlegging vatbaar is, of
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.d.3
    text: de veroordeling een schuldigverklaring zonder oplegging van straf of maatregel inhoudt, dan wel
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.d.4
    text: |-
      het gewijsde afkomstig is van de Nederlandse rechter en niet bij verdrag voor zodanig geval de bevoegdheid tot
      uitlevering is voorbehouden;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: 9.1.e
    text: |-
      naar Nederlands recht wegens verjaring geen vervolging, of, zo de uitlevering is gevraagd ten behoeve van de
      tenuitvoerlegging van een straf of maatregel, geen bestraffing meer kan plaatshebben.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het bepaalde in het vorige lid, aanhef en onder *a*, lijdt uitzondering in gevallen waarin Onze Minister bij zijn
      beslissing tot inwilliging van het verzoek tot uitlevering tevens opdracht geeft de vervolging te staken.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het bepaalde in het eerste lid, aanhef en onder *b*, lijdt uitzondering in gevallen waarin
      de vervolging in Nederland is gestaakt, hetzij omdat de Nederlandse strafwet op grond van de
      [artikelen 2-8 van het Wetboek van Strafrecht][ref1] niet van toepassing bleek te zijn, hetzij omdat aan berechting
      in het buitenland de voorkeur werd gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel2
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '2'
  - number: '9.4'
    text: |-
      Het eerste lid, aanhef en onder e, lijdt uitzondering voorzover krachtens het toepasselijke verdrag uitlevering
      niet kan worden geweigerd uitsluitend op grond van het feit dat het recht tot strafvervolging of het recht tot
      tenuitvoerlegging van die straf of maatregel naar het recht van de aangezochte staat is verjaard.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Uitlevering wordt niet toegestaan in gevallen waarin naar het oordeel van Onze Minister een gegrond vermoeden
      bestaat, dat bij inwilliging van het verzoek de opgeëiste persoon zal worden vervolgd, gestraft of op andere wijze
      getroffen in verband met zijn godsdienstige, levensbeschouwelijke of politieke overtuiging, zijn nationaliteit,
      zijn ras of de groep van de bevolking waartoe hij behoort.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Uitlevering wordt niet toegestaan in gevallen waarin naar het oordeel van Onze Minister de gevolgen daarvan voor
      de opgeëiste persoon van bijzondere hardheid zouden zijn in verband met diens jeugdige leeftijd, hoge ouderdom of
      slechte gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Uitlevering wordt niet toegestaan voor strafbare feiten van politieke aard, met inbegrip van daarmede samenhangende
      feiten.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      De aanslag tegen het leven of de vrijheid van een Staatshoofd of van een lid van het regerende Huis wordt niet
      beschouwd als een strafbaar feit van politieke aard in de zin van het gestelde in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Het eerste lid is niet van toepassing op uitlevering wegens een van de strafbare feiten, omschreven in de artikelen
      1 en 2 van het Europees Verdrag tot bestrijding van terrorisme (*Trb.* 1977, 63), artikel 2 van het Verdrag
      inzake de bestrijding van terroristische bomaanslagen (*Trb.* 1998, 84) en artikel 2 van het Internationaal
      Verdrag ter bestrijding van de financiering van terrorisme (*Trb.* 2000, 12), aan een staat die gehouden is in een
      overeenkomstig geval uitlevering aan Nederland niet te weigeren wegens de politieke aard van het feit.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Militaire delicten die niet tevens misdrijven naar algemeen Nederlands strafrecht zijn, en fiscale delicten kunnen
      geen aanleiding geven tot uitlevering, tenzij bij verdrag uitdrukkelijk anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel11
  - number: '11.5'
    text: |-
      Het in het vorige lid omtrent militaire delicten bepaalde is niet van toepassing op uitlevering naar België of
      Luxemburg.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Uitlevering wordt niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon alleen met uitdrukkelijke
      toestemming van Onze Minister zal worden vervolgd, gestraft, of op enige andere wijze in zijn persoonlijke
      vrijheid beperkt, terzake van feiten die vóór het tijdstip van zijn uitlevering zijn begaan en waarvoor hij niet
      is uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: '12.2'
    text: 'Onze Minister kan de in het vorige lid bedoelde toestemming geven ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: 12.2.a
    text: |-
      strafbare feiten waarvoor de opgeëiste persoon, krachtens het toepasselijke verdrag, aan de staat van wie het
      verzoek om toestemming is uitgegaan had kunnen worden uitgeleverd;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: 12.2.b
    text: |-
      andere feiten, voor zover deze zowel naar het recht van de staat van wie het verzoek om toestemming is uitgegaan
      als naar dat van Nederland strafbaar zijn en de mogelijkheid van uitlevering daarvoor niet krachtens de
      [artikelen 8-11][ref1] van deze wet is uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel8
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '8'
        hoofdstuk: II
  - number: '12.3'
    text: |-
      Uitlevering wordt voorts niet toegestaan dan onder het algemene beding, dat de opgeëiste persoon alleen met
      uitdrukkelijke toestemming van Onze Minister ter beschikking zal worden gesteld van de autoriteiten van een derde
      staat, terzake van feiten die vóór het tijdstip van zijn uitlevering zijn begaan. De toestemming kan worden gegeven
      ten aanzien van strafbare feiten waarvoor de opgeëiste persoon door Nederland aan de derde staat had kunnen worden
      uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      De beslissing van Onze Minister op een verzoek om toestemming als bedoeld in het eerste en het derde lid wordt ter
      kennis van de staat van wie dat verzoek is uitgegaan gebracht langs diplomatieke weg, tenzij bij verdrag in een
      andere weg is voorzien.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: '12.5'
    text: |-
      Voor zover zulks bij verdrag is bepaald is de in het eerste en het derde lid bedoelde toestemming niet vereist
      indien de opgeëiste persoon, na het tijdstip van zijn uitlevering, gedurende een tijdvak van ten minste dertig
      dagen de gelegenheid heeft gehad het grondgebied van de staat van wie het verzoek om toestemming is uitgegaan te
      verlaten.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: '12.6'
    text: |-
      Ten aanzien van de lidstaten van de Europese Unie kan bij verdrag worden voorzien in uitzonderingen voor andere dan
      de in het vijfde lid bedoelde gevallen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Voor zover een verdrag daarin voorziet, kan - in de gevallen omschreven in het volgende lid - op verzoek van de
      daartoe bevoegde autoriteit van een andere staat de voorlopige aanhouding worden bevolen van een zich in Nederland
      bevindende voortvluchtige, indien gegronde redenen bestaan voor de verwachting dat te zijnen aanzien op korte
      termijn vanwege die staat een voor inwilliging vatbaar verzoek tot uitlevering zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
  - number: '13.2'
    text: 'De voorlopige aanhouding kan worden bevolen wanneer zij is verzocht:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
  - number: 13.2.a
    text: |-
      in verband met een strafrechtelijk onderzoek ter zake van het vermoeden dat de voortvluchtige zich heeft schuldig
      gemaakt aan een feit waarvoor naar Nederlands recht voorlopige hechtenis mogelijk is;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
  - number: 13.2.b
    text: |-
      met het oog op de tenuitvoerlegging van een vrijheidsstraf of van een maatregel als bedoeld in
      [artikel 7 onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel7
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '7'
        hoofdstuk: II
  - number: 13.2.c
    text: |-
      in andere dan de onder *a* en *b* voorziene gevallen, indien de voortvluchtige geen vaste woon- of verblijfplaats
      in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien gegronde redenen bestaan voor de verwachting dat ten aanzien van een voortvluchtige die door de gezagvoerder
      van een luchtvaartuig na de landing in Nederland op grond van artikel 9, eerste lid, van het Verdrag inzake
      strafbare feiten en bepaalde andere handelingen begaan aan boord van luchtvaartuigen (*Trb.* 1964, nr. 115) is
      overgedragen, of die ervan wordt verdacht aan boord van het luchtvaartuig waarmee hij in Nederland is aangekomen
      een handeling als bedoeld in artikel 11, eerste lid, van dat Verdrag te hebben begaan, op korte termijn vanwege een
      der in artikel 13, vijfde lid, van het Verdrag genoemde staten een voor inwilliging vatbaar verzoek tot voorlopige
      aanhouding zal worden gedaan, kan de voorlopige aanhouding van die voortvluchtige worden bevolen, als ware zij
      reeds verzocht.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13
  - number: 13a
    text: |-
      Een vreemdeling die op grond van het [vierde lid van artikel 54 van het Wetboek van Strafvordering][ref1] is
      aangehouden, kan op bevel van een officier of hulpofficier van justitie worden opgehouden, indien gegronde redenen
      bestaan voor de verwachting dat te zijnen aanzien onverwijld een verzoek om voorlopige aanhouding als bedoeld
      in [artikel 13][ref2] zal worden gedaan. [Artikel 61, tweede lid, van het Wetboek][ref3] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel61
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '13'
        hoofdstuk: III
        afdeling: A
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '61'
  - number: '14.1'
    text: |-
      Iedere officier en hulpofficier van justitie is bevoegd de voorlopige aanhouding van een voortvluchtige
      overeenkomstig [artikel 13][ref1] te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel13
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '13'
        hoofdstuk: III
        afdeling: A
  - number: '14.2'
    text: |-
      Kan het optreden van de officier van justitie en de hulpofficier niet worden afgewacht, dan is elke
      opsporingsambtenaar bevoegd de voortvluchtige aan te houden, onder de verplichting zorg te dragen dat hij
      onverwijld voor de officier van justitie of de hulpofficieren wordt geleid.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel14
  - number: '14.3'
    text: |-
      Na de voortvluchtige te hebben gehoord, kan de officier of hulpofficier van justitie bevelen dat hij gedurende
      drie dagen, te rekenen van het tijdstip van de voorlopige aanhouding, in verzekering gesteld zal blijven. De
      hulpofficier geeft van zijn bevel ten spoedigste schriftelijk kennis aan de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel14
  - number: '14.4'
    text: De termijn van inverzekeringstelling kan door de officier van justitie éénmaal met drie dagen worden verlengd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel14
  - number: '14.5'
    text: |-
      De voortvluchtige kan te allen tijde door de officier van justitie in vrijheid worden gesteld. Zolang de termijn
      van inverzekeringstelling nog niet is verlengd, komt deze bevoegdheid mede toe aan de hulpofficier die het bevel
      tot de voorlopige aanhouding heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      De rechter-commissaris, belast met de behandeling van strafzaken, in de rechtbank van het arrondissement waarin een
      voortvluchtige overeenkomstig [artikel 14][ref1] in verzekering is gesteld, kan, op vordering van de officier van
      justitie bij die rechtbank, de bewaring van de voortvluchtige bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel14
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '14'
        hoofdstuk: III
        afdeling: A
  - number: '15.2'
    text: Alvorens een bevel ingevolge het vorige lid te geven, hoort de rechter-commissaris zo mogelijk de voortvluchtige.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      Een voortvluchtige wiens bewaring overeenkomstig [artikel 15][ref1] is bevolen, wordt - behoudens de mogelijkheid
      van verdere vrijheidsbeneming uit anderen hoofde - in vrijheid gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel15
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '15'
        hoofdstuk: III
        afdeling: A
  - number: 16.1.a
    text: |-
      zodra zulks door de rechtbank, de rechter-commissaris of de officier van justitie, ambtshalve of op verzoek van de
      voortvluchtige of diens raadsman, wordt gelast;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel16
  - number: 16.1.b
    text: |-
      zodra de termijn is verstreken binnen welke, volgens het toepasselijke verdrag, de voorlopige aanhouding moet
      worden gevolgd door een verzoek tot uitlevering, en zodanig verzoek niet inmiddels is gedaan;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel16
  - number: 16.1.c
    text: zodra de bewaring twintig dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      In gevallen waarin [artikel 13, derde lid][ref1], toepassing vindt, worden de in het vorige lid, onder *b* en *c,*
      genoemde tijdvakken, na afloop waarvan de voortvluchtige in vrijheid moet worden gesteld, met vier dagen verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel13
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '13'
        hoofdstuk: III
        afdeling: A
  - number: '17'
    text: |-
      Van elke beslissing, genomen krachtens een der bepalingen van de [artikelen 13-16][ref1], wordt onverwijld kennis
      gegeven aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel13
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '13'
        hoofdstuk: III
        afdeling: A
  - number: '18.1'
    text: |-
      Een verzoek tot uitlevering kan slechts in overweging worden genomen, indien het voldoet aan de vereisten
      omschreven in de navolgende leden van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het verzoek moet schriftelijk worden gedaan, hetzij langs diplomatieke weg, hetzij - voor zover het toepasselijke
      verdrag daarin voorziet - rechtstreeks door toezending aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: '18.3'
    text: 'Het verzoek moet vergezeld gaan van:'
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: 18.3.a
    text: |-
      het origineel of een authentiek afschrift hetzij van een, voor tenuitvoerlegging vatbaar, tegen de opgeëiste
      persoon gewezen strafvonnis, hetzij van een door de daartoe bevoegde autoriteit van de verzoekende staat gegeven
      bevel tot zijn aanhouding, of van een stuk dat dezelfde rechtskracht heeft, een en ander opgemaakt in de vorm
      voorgeschreven door het recht van die staat, en betrekking hebbende op de feiten waarvoor de uitlevering wordt
      gevraagd;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: 18.3.b
    text: |-
      een uiteenzetting van de feiten waarvoor de uitlevering wordt gevraagd, met een zo nauwkeurig mogelijke vermelding
      van de tijd en de plaats waarop deze zijn begaan;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: 18.3.c
    text: |-
      de tekst van de toepasselijke rechtsvoorschriften of, voorzover ongeschreven recht van toepassing is, een voor de
      beoordeling van het verzoek voldoende verklaring omtrent de inhoud van dat recht;
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: 18.3.d
    text: |-
      de gegevens die nodig zijn voor het vaststellen van de identiteit van de opgeëiste persoon en - in geval van
      mogelijke twijfel daaromtrent - van zijn nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien de overgelegde stukken naar het oordeel van Onze Minister niet voldoen aan de vereisten omschreven in
      [artikel 18][ref1], of aan nadere vereisten gesteld in het toepasselijke verdrag, biedt hij de autoriteiten van de
      verzoekende staat gelegenheid tot aanvulling of verbetering, binnen een door hem te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel18
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '18'
        hoofdstuk: III
        afdeling: B
  - number: '19.2'
    text: |-
      In spoedeisende gevallen en voorzover een verdrag daarin voorziet kan de officier van justitie of de procureur-
      generaal bij de Hoge Raad, indien naar zijn oordeel, dat van de rechtbank of de Hoge Raad de overgelegde stukken
      niet voldoen aan de vereisten omschreven in [artikel 18][ref1] of aan nadere vereisten gesteld in het toepasselijke
      verdrag welke ter beoordeling van de rechtbank of de Hoge Raad zijn, de door de verzoekende staat daartoe
      aangewezen autoriteiten gelegenheid bieden tot aanvulling of verbetering, binnen een door hem gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel18
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '18'
        hoofdstuk: III
        afdeling: B
  - number: '20.1'
    text: |-
      Tenzij Onze Minister reeds aanstonds van oordeel is dat het verzoek tot uitlevering moet worden afgewezen, stelt
      hij het verzoek met de daarbij behorende stukken - voor zover nodig na gelegenheid te hebben geboden tot aanvulling
      of verbetering overeenkomstig [artikel 19][ref1] - in handen van de officier van justitie bij de rechtbank van het
      arrondissement waarin de opgeëiste persoon zich bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel19
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '19'
        hoofdstuk: III
        afdeling: B
  - number: '20.2'
    text: |-
      Wanneer een verzoek tot voorlopige aanhouding is voorafgegaan, worden de stukken toegezonden aan de officier van
      justitie die in verband met dat verzoek reeds bij de zaak betrokken is geweest.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel20
  - number: '20.3'
    text: |-
      Indien tegen de opgeëiste persoon in Nederland een strafvervolging gaande is, in verband waarmede hij voorlopig
      van zijn vrijheid is beroofd, of indien die persoon een in Nederland opgelegde vrijheidsstraf ondergaat, kunnen, in
      afwijking van het voorgaande, de stukken worden toegezonden aan de officier van justitie die met de vervolging is
      belast of belast is geweest.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel20
  - number: '20.4'
    text: |-
      Is voorshands niet bekend in welk arrondissement de opgeëiste persoon zich bevindt, dan zendt Onze Minister de
      stukken toe aan de officier van justitie te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      De officier van justitie die het verzoek tot uitlevering heeft ontvangen, kan de aanhouding van de opgeëiste
      persoon bevelen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      De opgeëiste persoon wiens aanhouding overeenkomstig het vorige lid is bevolen, wordt binnen vierentwintig uren na
      zijn aanhouding voor de officier van justitie of, bij diens afwezigheid, voor een hulpofficier van justitie geleid.
      Na verhoor door een hulpofficier wordt de aangehouden persoon zo spoedig mogelijk alsnog voor de officier van
      justitie geleid.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel21
  - number: '21.3'
    text: |-
      Na de opgeëiste persoon te hebben gehoord, kan de officier van justitie bevelen dat deze in verzekering gesteld zal
      blijven tot het tijdstip waarop de rechtbank over zijn gevangenhouding beslist.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel21
  - number: '21.4'
    text: |-
      Het bevel tot inverzekeringstelling kan te allen tijde zowel door de rechtbank als door de officier van justitie,
      ambtshalve of op verzoek van de opgeëiste persoon of diens raadsman, worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      Wanneer de opgeëiste persoon, op de dag waarop de officier van justitie het verzoek tot uitlevering ontvangt,
      reeds krachtens [artikel 14][ref1], onderscheidenlijk [artikel 15][ref2] in verzekering of in bewaring is
      gesteld, kan de vrijheidsbeneming - met afwijking van [artikel 14, derde en vierde lid][ref3], onderscheidenlijk
      [artikel 16, aanhef en onder ][ref4] - op bevel van de officier van justitie worden voortgezet tot het tijdstip
      waarop de rechtbank over de gevangenhouding beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002559#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002559#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002559#Artikel16
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '14'
        hoofdstuk: III
        afdeling: A
      - id: ref2
        bwb_id: BWBR0002559
        artikel: '15'
        hoofdstuk: III
        afdeling: A
      - id: ref3
        bwb_id: BWBR0002559
        artikel: '14'
        hoofdstuk: III
        afdeling: A
      - id: ref4
        bwb_id: BWBR0002559
        artikel: '16'
        hoofdstuk: III
        afdeling: A
  - number: '22.2'
    text: |-
      Van zijn in het vorige lid bedoelde bevel geeft de officier van justitie onverwijld kennis aan de rechter-
      commissaris die de bewaring krachtens [artikel 15][ref1] heeft bevolen.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel15
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '15'
        hoofdstuk: III
        afdeling: A
  - number: '23.1'
    text: |-
      Uiterlijk op de derde dag na die waarop hij het verzoek tot uitlevering heeft ontvangen, vordert de officier van
      justitie schriftelijk, dat de rechtbank het verzoek in behandeling zal nemen. Hij legt daarbij de stukken aan de
      rechtbank over.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Een afschrift van de krachtens het vorige lid vereiste vordering wordt aan de opgeëiste persoon betekend. Daarbij
      wordt hem mededeling gedaan van de feiten waarvoor zijn uitlevering is gevraagd, met vermelding van de tijden en
      de plaatsen waarop deze zijn begaan, een en ander zoals bij het verzoek tot uitlevering omschreven, alsmede van de
      staat die het verzoek heeft gedaan. Het voorgaande geldt eveneens in het geval dat de officier van justitie naar
      aanleiding van een naderhand ontvangen verzoek zijn vordering heeft aangevuld of gewijzigd. Van de ontvangst van
      aanvullende stukken, die in het dossier worden gevoegd, wordt de opgeëiste persoon mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel23
  - number: '23.3'
    text: |-
      Nadat de stukken aan de rechtbank zijn overgelegd, mag de kennisneming daarvan aan de opgeëiste persoon en diens
      raadsman niet worden onthouden. Het bepaalde bij en krachtens [artikel 34 van het Wetboek van Strafvordering][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel34
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '34'
  - number: '24.1'
    text: |-
      Dadelijk na de ontvangst van de in [artikel 23][ref1] bedoelde vordering bepaalt de voorzitter van de rechtbank,
      zoveel mogelijk bij voorrang, het tijdstip waarop de opgeëiste persoon door de rechtbank zal worden gehoord. Hij
      kan daarbij diens medebrenging bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel23
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '23'
        hoofdstuk: III
        afdeling: B
  - number: '24.2'
    text: |-
      De griffier van de rechtbank doet onverwijld aan de officier van justitie en aan de opgeëiste persoon mededeling
      van het voor het verhoor bepaalde tijdstip. Die mededeling - alsmede, zo een bevel tot medebrenging is gegeven, een
      afschrift van dat bevel - wordt aan de opgeëiste persoon betekend.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien niet blijkt dat de opgeëiste persoon reeds een raadsman heeft, geeft de voorzitter aan het bureau
      rechtsbijstandvoorziening last tot toevoeging van een raadsman.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het verhoor van de opgeëiste persoon geschiedt in het openbaar, tenzij deze een behandeling van de zaak met
      gesloten deuren verlangt, of de rechtbank om gewichtige, in het proces-verbaal der zitting te vermelden, redenen
      sluiting der deuren beveelt.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel25
  - number: '25.2'
    text: Het verhoor heeft plaats in tegenwoordigheid van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel25
  - number: '25.3'
    text: Bij zijn verhoor kan de opgeëiste persoon zich door zijn raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel25
  - number: '25.4'
    text: |-
      Is de opgeëiste persoon niet verschenen en de rechtbank zijn aanwezigheid bij het verhoor wenselijk acht, dan
      gelast de rechtbank tegen een door haar te bepalen tijdstip diens dagvaarding, zo nodig onder bijvoeging van een
      bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel25
  - number: '26.1'
    text: |-
      De rechtbank onderzoekt de identiteit van de opgeëiste persoon, alsmede de ontvankelijkheid van het verzoek tot
      uitlevering en de mogelijkheid van inwilliging daarvan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      De officier van justitie geeft ter zitting van de rechtbank zijn opvatting over de toelaatbaarheid van de verzochte
      uitlevering en legt een schriftelijke samenvatting daaromtrent aan de rechtbank over. De opgeëiste persoon en
      diens raadsman worden eveneens in de gelegenheid gesteld tot het maken van terzake dienende opmerkingen omtrent het
      verzoek tot uitlevering en de in verband daarmede te nemen beslissingen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel26
  - number: '26.3'
    text: |-
      Beweert de opgeëiste persoon dat hij onverwijld kan aantonen niet schuldig te zijn aan de feiten waarvoor zijn
      uitlevering is gevraagd, dan onderzoekt de rechtbank die bewering.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel26
  - number: '26.4'
    text: |-
      Indien de rechtbank zulks met het oog op het door haar krachtens het eerste of derde lid van dit artikel in te
      stellen onderzoek noodzakelijk acht, gelast zij - zo nodig onder bijvoeging van een bevel tot medebrenging - tegen
      een door haar te bepalen tijdstip de dagvaarding of schriftelijke oproeping van getuigen of deskundigen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      Op vordering van de officier van justitie kan de rechtbank ter zitting de gevangenneming van de opgeëiste persoon
      bevelen.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      Voordat het onderzoek ter zitting wordt gesloten, beslist de rechtbank ambtshalve omtrent de gevangenhouding van de
      opgeëiste persoon, zo deze in bewaring of in verzekering is gesteld.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel27
  - number: '28.1'
    text: |-
      Zo spoedig mogelijk na de sluiting van het onderzoek ter zitting doet de rechtbank uitspraak omtrent het verzoek
      tot uitlevering. De uitspraak wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bevindt de rechtbank hetzij dat de door de verzoekende staat overgelegde stukken niet voldoen aan de vereisten
      omschreven in [artikel 18][ref1], of aan nadere vereisten gesteld in het toepasselijke verdrag, hetzij dat het
      verzoek tot uitlevering niet voor inwilliging vatbaar is, hetzij dat ten aanzien van de opgeëiste persoon geen
      sprake kan zijn van een vermoeden van schuld aan de feiten waarvoor zijn uitlevering is gevraagd, dan verklaart zij
      bij haar uitspraak de uitlevering ontoelaatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel18
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '18'
        hoofdstuk: III
        afdeling: B
  - number: '28.3'
    text: |-
      In andere dan de in het vorige lid voorziene gevallen verklaart de rechtbank bij haar uitspraak de uitlevering
      toelaatbaar, zulks met vermelding van de toepasselijke wets- en verdragsbepalingen, alsmede van het feit of de
      feiten waarvoor de uitlevering kan worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel28
  - number: '28.4'
    text: |-
      Wordt de uitlevering toelaatbaar verklaard niettegenstaande een bewering van de opgeëiste persoon overeenkomstig
      [artikel 26, derde lid][ref1], dan vermeldt de uitspraak hetgeen de rechtbank te dien aanzien heeft bevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002559#Artikel26
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002559
        artikel: '26'
        hoofdstuk: III
        afdeling: B
  - number: '29.1'
    text: |-
      De [artikelen 37 tot en met 39][ref1], [45 tot en met 49][ref2], [50, eerste lid][ref3],
      [260, eerste lid][ref4], [268][ref5], [269, vijfde lid][ref6], [271][ref7], [272][ref8], [273, derde lid][ref9],
      [274 tot en met 277][ref10], [279 tot en met 280, tweede en derde lid][ref11], [281][ref12],
      [286][ref13], [288, vierde lid][ref14], [289, eerste en derde lid][ref15], [290 tot en met 301][ref16],
      [318 tot en met 322][ref17], [324 tot en met 331][ref18], [345, eerste en derde lid][ref19], [346][ref20], [357]
      (onbekend) en [362 tot en met 365 van het Wetboek van Strafvordering][ref21] vinden overeenkomstige toepassing.
      Voor zover die bepalingen betrekking hebben op de verdachte, zijn zij van overeenkomstige toepassing op de
      opgeëiste persoon.


