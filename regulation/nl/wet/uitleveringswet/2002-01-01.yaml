  - number: '29.2'
    text: |-
      De in het eerste lid genoemde artikelen vinden geen toepassing voor zover deze betrekking hebben op een getuige
      wiens identiteit niet of slechts ten dele blijkt.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel29
  - number: '30.1'
    text: |-
      De uitspraak van de rechtbank wordt aan de opgeëiste persoon die bij de voorlezing daarvan niet tegenwoordig is
      geweest, betekend. Daarbij wordt hem kennis gegeven van het rechtsmiddel dat tegen de uitspraak openstaat, en van
      de termijn binnen welke dat rechtsmiddel kan worden aangewend.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      De rechtbank zendt aan Onze Minister onverwijld een gewaarmerkt afschrift van haar uitspraak toe. Indien de
      uitlevering toelaatbaar is verklaard, doet zij het afschrift vergezeld gaan van haar advies omtrent het aan het
      verzoek tot uitlevering te geven gevolg. Een afschrift van het advies wordt door de griffier aan de opgeëiste
      persoon en diens raadsman ter hand gesteld of toegezonden.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel30
  - number: '31.1'
    text: |-
      Tegen de uitspraak van de rechtbank betreffende het verzoek tot uitlevering kan zowel door de officier van justitie
      als door de opgeëiste persoon beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
  - number: '31.2'
    text: |-
      Van verklaringen waarbij afstand wordt gedaan van het recht om beroep in cassatie in te stellen, of waarbij een
      zodanig beroep wordt ingetrokken, geeft de griffier van de rechtbank onverwijld kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
  - number: '31.3'
    text: |-
      De officier van justitie is, op straffe van niet-ontvankelijkheid, verplicht om binnen een maand nadat hij beroep
      in cassatie heeft ingesteld, bij de Hoge Raad een schriftuur in te dienen, houdende zijn middelen van cassatie.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
  - number: '31.4'
    text: |-
      De opgeëiste persoon die cassatieberoep heeft ingesteld, is op straffe van niet-ontvankelijkheid verplicht om vóór
      de dienende dag bij de Hoge Raad door zijn raadsman een schriftuur te doen indienen, houdende zijn middelen van
      cassatie.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
  - number: '31.5'
    text: |-
      De voorzitter bepaalt na overleg met de procureur-generaal de rechtsdag. De procureur-generaal doet de dag voor
      de behandeling van het beroep bepaald ten minste acht dagen vóór de rechtsdag aanzeggen aan de opgeëiste persoon.
      Deze termijn kan, met toestemming van de opgeëiste persoon, worden bekort indien van die toestemming blijkt op
      overeenkomstige wijze als bepaald in [artikel 265, tweede lid, van het Wetboek van Strafvordering][ref1]. Bij
      gebreke van tijdige aanzegging wordt door de Hoge Raad de aanzegging van een nieuwe rechtsdag bevolen, tenzij voor
      de opgeëiste persoon een raadsman is verschenen. In dat laatste geval kan op diens verzoek uitstel worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel265
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '265'
  - number: '31.6'
    text: |-
      In de gevallen waarin op de zitting de behandeling van het beroep voor een bepaalde tijd wordt uitgesteld of
      geschorst, heeft geen nieuwe aanzegging aan de opgeëiste persoon plaats.
    url: https://wetten.overheid.nl/BWBR0002559/2002-01-01#Artikel31
  - number: '31.7'
    text: |-
      De [artikelen 431][ref1], [432][ref2], [434, eerste lid][ref3], [438][ref4], [439][ref5], [440, eerste lid][ref6],
      [442][ref7], [443][ref8], [444][ref9], [449, eerste lid][ref10], [450][ref11], [451][ref12], [451a][ref13],
      [452][ref14], [453][ref15], [454, eerste, tweede en derde lid][ref16], [455, eerste lid][ref17], en
      [456 van het Wetboek van Strafvordering][ref18] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel431
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel432
