preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, om in het belang van elektriciteits- en gasbesparing,
    regels te stellen ter uitvoering van richtlijn 2006/32/EG van het Europees Parlement en de Raad van de Europese
    Unie van 5 april 2006 betreffende energie-efficiëntie bij het eindgebruik en energiediensten en houdende intrekking
    van richtlijn 93/76/EEG van de Raad (PbEU L 114) en regels te stellen die de geliberaliseerde elektriciteits- en
    gasmarkt nader ordenen met het oog op een verbetering van de werking van de elektriciteits- en gasmarkt voor met
    name kleinverbruikers;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029721/2015-01-01#ArtikelAanhef
articles:
  - number: V
    text: |-
      Tot de inwerkingtreding van het in [artikel I, onderdeel W][ref1], van deze wet voorgestelde
      [artikel 95cb, eerste lid][ref2], of het in [artikel II, onderdeel L][ref3], van deze wet voorgestelde
      [artikel 44b, eerste lid][ref4], betaalt een netbeheerder die met betrekking tot afnemers als bedoeld in
      [artikel 95a, eerste lid, van de Elektriciteitswet 1998][ref5] of [artikel 43, eerste lid, van de Gaswet][ref6], de
      facturering en inning van de aan de netbeheerder verschuldigde bedragen laat verrichten door anderen en aan een of
      meer van hen hiervoor direct of indirect een vergoeding betaalt, aan elk van hen een gelijke vergoeding.


