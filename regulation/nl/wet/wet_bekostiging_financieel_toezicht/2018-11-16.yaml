  - number: '9'
    text: |-
      1 De toezichthouder organiseert tweemaal per jaar overleg met een daarvoor in aanmerking komende representatieve
      vertegenwoordiging van de onder zijn toezicht staande personen. De toezichthouder kan tevens daarvoor in aanmerking
      komende cliëntenorganisaties toelaten tot het overleg. Ambtenaren kunnen namens Onze Ministers het overleg
      bijwonen.

      2 De toezichthouder maakt het verslag van het overleg binnen een redelijke termijn na het overleg openbaar.
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel9
  - number: '11'
    text: |-
      1 De toezichthouder brengt de kosten van het toezicht, uitgezonderd de kosten van zijn betrokkenheid bij de in
      [artikel 1, onderdeel c, onder 6° en 15°][ref1] bedoelde wetten en de kosten, bedoeld in artikel 1, onderdeel f,
      subonderdeel 3°, in rekening bij:

      a. personen die bij hem een aanvraag of melding hebben gedaan als gevolg waarvan de toezichthouder overgaat tot het
      verrichten van een eenmalige toezichthandeling zoals vastgelegd in [bijlage I][ref2];

      b. personen die behoren tot een van de toezichtcategorieën, genoemd in [bijlage II][ref3], [III][ref4] of
      [IV][ref5].

      2 Tot de in rekening te brengen kosten, bedoeld in het eerste lid, behoren mede de kosten die de toezichthouder
      maakt ter voorbereiding op een taak voordat deze aan hem werd opgedragen en de kosten die aan de toezichthouder
      zijn doorberekend.


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel1
