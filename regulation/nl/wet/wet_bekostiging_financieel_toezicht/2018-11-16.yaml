  - number: '8'
    text: |-
      1 Het door de Nederlandsche Bank ingevolge [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] op te
      stellen jaarverslag maakt deel uit van de verantwoording, bedoeld in [artikel 5, tweede lid][ref2].

      2 De toezichthouder houdt het jaarverslag dan wel de verantwoording gedurende ten minste vijf jaren op
      elektronische wijze ter inzage.

      3 Bij ministeriële regeling van Onze Ministers gezamenlijk kunnen nadere regels worden gesteld voor de inrichting
      van het jaarverslag dan wel de verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0031659#Artikel5
