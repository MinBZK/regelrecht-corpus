  - number: '13'
    text: |-
      1 De toezichthouder brengt jaarlijks een bedrag in rekening aan de personen die behoren tot de in
      [bijlage II][ref1], [III][ref2] en [IV][ref3] opgenomen toezichtcategorieën.

      2 De kosten die aan de in [bijlage II][ref4], onderdeel «Toezichthouder: Autoriteit Financiële Markten» opgenomen
      toezichtcategorieën worden doorberekend, zijn gelijk aan de som van:

      a. het totaal van de overige kosten zoals opgenomen in de voor het desbetreffende jaar vastgestelde en goedgekeurde
      begroting van de Autoriteit Financiële Markten, en

      b. het exploitatiesaldo, bedoeld in [artikel 7, eerste lid][ref5], over het jaar dat voorafgaat aan het jaar waarop
      de in onderdeel a bedoelde begroting betrekking heeft, verminderd met:

      1°. het deel van het exploitatiesaldo, bedoeld in [artikel 7, vijfde lid, onderdeel a][ref6];

      2°. de aan de Staat toekomende opbrengsten, bedoeld in [artikel 7, vijfde lid, onderdeel b][ref7].

      3 De kosten die aan de in [bijlage II][ref8], onderdeel «Toezichthouder: de Nederlandsche Bank» opgenomen
      toezichtcategorieën, worden doorberekend, zijn in enig jaar gelijk aan de som van:

      a. het totaal van de overige kosten bedoeld in [artikel 2, derde lid, onderdeel a][ref9], zoals opgenomen in de
      voor het desbetreffende jaar vastgestelde en goedgekeurde begroting van de Nederlandsche Bank, verminderd met

      b. het deel van de opbrengsten uit dwangsommen of bestuurlijke boetes dat overeenkomstig
      [artikel 7, vierde lid][ref10], is toegerekend aan de in [bijlage II][ref11] opgenomen toezichtcategorie, en
      verminderd of verhoogd met

      c. het deel van het exploitatiesaldo, bedoeld in [artikel 7, zesde lid, onderdeel a][ref12].

      4 De kosten die aan de in [bijlage III][ref13], onderdeel «Toezichthouder: de Nederlandsche Bank» opgenomen
      toezichtcategorieën, worden doorberekend, zijn in enig jaar gelijk aan de som van:

      a. het totaal van de overige kosten bedoeld in [artikel 2, derde lid, onderdeel b][ref14], zoals opgenomen in de
      voor het desbetreffende jaar vastgestelde en goedgekeurde begroting van de Nederlandsche Bank, verminderd met

      b. het deel van de opbrengsten uit dwangsommen of bestuurlijke boetes dat overeenkomstig
      [artikel 7, vierde lid][ref15], is toegerekend aan de in [bijlage III][ref16] opgenomen toezichtcategorie, en
      verminderd of verhoogd met

      c. het deel van het exploitatiesaldo, bedoeld in [artikel 7, zesde lid, onderdeel b][ref17].

      5 De kosten die aan de in [bijlage IV][ref18], onderdeel «Toezichthouder: de Nederlandsche Bank» opgenomen
      toezichtcategorieën, worden doorberekend, zijn in enig jaar gelijk aan de som van:

      a. het totaal van de overige kosten, bedoeld in [artikel 2, derde lid, onderdeel c][ref19], zoals opgenomen in de
      voor het desbetreffende jaar vastgestelde en goedgekeurde begroting van de Nederlandsche Bank, verminderd met

      b. het deel van de opbrengsten uit dwangsommen of bestuurlijke boetes dat overeenkomstig
      [artikel 7, vierde lid][ref20], is toegerekend aan de in [bijlage IV][ref21] opgenomen toezichtcategorie, en
      verminderd of verhoogd met

      c. het deel van het exploitatiesaldo, bedoeld in [artikel 7, zesde lid, onderdeel c][ref22].

      6 Het deel van het exploitatiesaldo, bedoeld in [artikel 7, zesde lid, onderdeel d][ref23], brengt de
      toezichthouder in rekening op een of meer van de wijzen die zijn vastgelegd in artikel 22, zesde lid, van
      verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van 15 juli 2014 betreffende de afwikkeling van
      kredietinstellingen en bepaalde beleggingsondernemingen (PbEU 2014, L 225).

      7 De kosten, bedoeld in het tweede tot en met vijfde lid, worden aan de hand van de procentuele aandelen, zoals
      vastgesteld in [bijlage II][ref24], [III][ref25] en [IV][ref26], toegerekend aan de toezichtcategorieën, bedoeld in
      het eerste lid.

      8 De hoogte van een jaarlijks in rekening te brengen bedrag, bedoeld in het eerste lid, wordt bepaald aan de hand
      van de maatstaven zoals vastgelegd in [bijlage II][ref27], [III][ref28] en [IV][ref29].

      9 Uiterlijk per 1 juni van ieder jaar worden, op voorstel van de toezichthouder, bij ministeriële regeling van
      Onze Ministers gezamenlijk, voor iedere te onderscheiden toezichtcategorie de bandbreedtes en tarieven vastgesteld.
      Bij de vaststelling van de bandbreedtes en de tarieven wordt rekening gehouden met het bedrag dat op grond van het
      tweede tot en met het vijfde en zevende lid is toegerekend aan de desbetreffende categorie.

      10 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het
      eerste lid.


