  - number: '4'
    text: |-
      Bij ministeriële regeling van Onze Ministers gezamenlijk kunnen regels worden gesteld voor de inrichting van de
      begroting.
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel4
  - number: '5'
    text: |-
      1 De Autoriteit Financiële Markten stelt de jaarrekening, bedoeld in
      [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref1], jaarlijks voor 15 maart op.

      2 De Nederlandsche Bank stelt jaarlijks voor 15 maart een verantwoording op, waarin met betrekking
      tot het toezicht rekening en verantwoording wordt afgelegd van het financieel beheer en van de
      geleverde prestaties over het verstreken boekjaar. De [artikelen 34, tweede en derde lid][ref2], en
      [35, tweede tot en met vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref3] zijn van overeenkomstige
      toepassing.

      3 In afwijking van [artikel 35, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref4] gaat de
      jaarrekening van de Autoriteit Financiële Markten vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-
      Administratieconsulent ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld
      in [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref5], die niet werkzaam is bij of
      verbonden is aan een accountantsorganisatie.

      4 De toezichthouder zendt de jaarrekening of verantwoording na goedkeuring door de Raad van toezicht,
      onderscheidenlijk de Raad van commissarissen, onverwijld aan Onze Ministers.


