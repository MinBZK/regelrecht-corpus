        artikel: '28'
  - number: 1a
    text: |-
      Tot de betrokkenheid van de Nederlandsche Bank bij de uitvoering van taken ingevolge de in
      [artikel 1, onderdeel c][ref1], genoemde wetten en de in dat onderdeel bedoelde EU-rechtshandelingen, wordt voor de
      toepassing van deze wet niet gerekend:

      a. het toezicht door de Nederlandsche Bank ten aanzien van afwikkelondernemingen als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2];

      b. de uitvoering en handhaving, bedoeld in [artikel 1:24, derde lid, van de Wet op het financieel toezicht][ref3],
      van regels gesteld bij of krachtens:

      1° verordening (EU) nr. 260/2012 van het Europees Parlement en de Raad van 14 maart 2012 tot vaststelling van
      technische en bedrijfsmatige vereisten voor overmakingen en automatische afschrijvingen in euro en tot wijziging
      van Verordening (EG) nr. 924/2009 (PbEU 2012 L 94);

      2° de titels III, IV en V van verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad van 4 juli 2012
      betreffende otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU 2012, L 201).


