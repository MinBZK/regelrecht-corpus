    text: |-
      1 Het in [artikel 13, eerste lid][ref1], bedoelde bedrag is evenredig met de overeenkomstig het tweede tot en met
      het vijfde lid te bepalen periode dat de betrokkene in het desbetreffende jaar deel uitmaakt van een van de in
      [bijlage II][ref2], [III][ref3] of [IV][ref4] opgenomen toezichtcategorieën.

      2 Met uitzondering van de toezichtcategorieën «Effectenuitgevende instellingen: markt» en «Effectenuitgevende
      instellingen: verslaggeving» is de periode, bedoeld in het eerste lid, gelijk aan de tijdsduur dat die persoon over
      een door de toezichthouder afgegeven vergunning of verklaring van ondertoezichtstelling beschikt dan wel dat die
      persoon op grond van een wettelijke verplichting bij de toezichthouder is geregistreerd.

      3 Voor een persoon die behoort tot de in [bijlage II][ref5] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: markt» is de periode, bedoeld in het eerste lid, gelijk aan de
      tijdsduur waarin zijn effecten zijn toegelaten tot de handel op een gereglementeerde markt, bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref6], of op een met een gereglementeerde markt vergelijkbaar
      systeem uit een staat die geen lidstaat is als bedoeld in artikel 1:1 van de Wet op het financieel toezicht.

      4 Voor een persoon die op enig moment in een jaar behoort tot de in [bijlage II][ref7] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: verslaggeving» is de periode, bedoeld in het eerste lid, gelijk aan een heel
      kalenderjaar.

      5 Een persoon behoort in enig kalenderjaar tot de in [bijlage II][ref8] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: verslaggeving», indien:

      a. in dat jaar zijn jaarrekening is vastgesteld en tevens door hem uitgegeven effecten zijn toegelaten tot de
      handel op een gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref9] of de
      handel op een met een gereglementeerde markt vergelijkbaar systeem uit een staat die geen lidstaat is als bedoeld
      in artikel 1:1 van de Wet op het financieel toezicht; of

      b. hij in dat jaar op grond van [artikel 5:25m, tweede lid, van de Wet op het financieel toezicht][ref10], een
      persbericht heeft uitgebracht over het algemeen verkrijgbaar gesteld zijn van de door hem opgemaakte jaarlijkse
      financiële verslaggeving, bedoeld in [artikel 5:25c van de Wet op het financieel toezicht][ref11].


