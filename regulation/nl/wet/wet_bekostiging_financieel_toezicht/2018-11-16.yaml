  - number: '15'
    text: |-
      1 Indien de toezichthouder een ingevolge [artikel 13][ref1] in rekening te brengen bedrag vanwege een fusie als
      bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref2] van een persoon niet langer in rekening kan
      brengen aan die persoon, brengt de toezichthouder het bedrag in rekening bij de persoon die bij die fusie het
      vermogen van eerstgenoemde persoon heeft verkregen.

      2 Het eerste lid is van overeenkomstige toepassing op een persoon die in het kader van collectieve waardeoverdracht
      als bedoeld in [artikel 83][ref3], [84][ref4], of [90 van de Pensioenwet][ref5] of [artikel 91][ref6], [92,][ref7]
      of [98 van de Wet verplichte beroepspensioenregeling][ref8] vermogen heeft overgedragen aan een andere persoon.

      3 Indien een persoon als bedoeld in [bijlage IV][ref9] in afwikkeling wordt geplaatst en in dat kader vermogen
      overgaat, zal de toezichthouder een ingevolge [artikel 13][ref10] oorspronkelijk in rekening te brengen dan wel
      gebracht bedrag bij die persoon naar rato van de omvang van het vermogen dat is overgegaan, en rekening houdend
      met het tijdstip per wanneer de overgang van het vermogen heeft plaatsgevonden, verrekenen met de persoon die dat
      vermogen heeft verkregen.


