  - number: '3'
    text: |-
      1 Goedkeuring als bedoeld in [artikel 29 van de Kaderwet zelfstandige bestuursorganen][ref1] wordt niet onthouden
      dan nadat de toezichthouder in de gelegenheid is gesteld de begroting aan te passen, binnen een door Onze Ministers
      gezamenlijk te stellen redelijke termijn.

      2 De toezichthouder doet na goedkeuring van de begroting onverwijld mededeling van de begroting in de Staatscourant
      en houdt de begroting gedurende ten minste twee jaar na goedkeuring op elektronische wijze ter inzage.

      3 Indien de begroting niet voor 1 januari van het begrotingsjaar waarop zij betrekking heeft, is goedgekeurd, kan
      de toezichthouder, zolang de begroting niet is goedgekeurd, voor het aangaan van verplichtingen en het verrichten
      van uitgaven beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij de overeenkomstige
      onderdelen van de begroting van het voorafgaande jaar waren toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
