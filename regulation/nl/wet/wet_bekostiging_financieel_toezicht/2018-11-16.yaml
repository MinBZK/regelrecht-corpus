  - number: '16'
    text: |-
      1 De toezichthouder kan aan de betrokken financiële onderneming een bedrag in rekening brengen ter vergoeding van
      de kosten die hij maakt voor de toepassing van de [artikelen 1:76][ref1] en [1:76a van de Wet op het financieel
      toezicht](onbekend).

      2 De hoogte van het bedrag, bedoeld in het eerste lid, wordt per geval vastgesteld door de toezichthouder en
      wordt op een zodanige wijze gespecificeerd dat daaruit blijkt dat het is gebaseerd op de voor het toezicht op de
      desbetreffende financiële onderneming werkelijk gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel176
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:76
  - number: '17'
    text: |-
      1 De Nederlandsche Bank brengt de kosten verband houdend met haar betrokkenheid bij de beoordeling, bedoeld in
      artikel 33, vierde lid, van verordening (EU) nr. 1024/2013 van de Raad van 15 oktober 2013 waarbij aan de Europese
      Centrale Bank specifieke taken worden opgedragen betreffende het beleid inzake het prudentieel toezicht op
      kredietinstellingen (PbEU 2013, L 287), in rekening bij de banken die onderwerp zijn van de in dat artikel bedoelde
      beoordeling.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de doorberekening
      van de in het eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel17
  - number: '30'
    text: |-
      1 Van een op het moment van inwerkingtreding van deze wet nog niet verrekend exploitatiesaldo van de
      toezichthouder, wordt:

      a. het op grond van het voormalige bekostigingssysteem aan de Staat der Nederlanden toe te rekenen deel van het
      exploitatiesaldo alsnog met de Staat der Nederlanden verrekend;

      b. het op grond van het voormalige bekostigingssysteem aan personen toe te rekenen deel van het exploitatiesaldo
      alsnog met deze personen verrekend.

      2 Onze Minister van Financiën kan beslissen om het eerste lid, onderdeel b, niet van toepassing te verklaren op een
      door hem nader aan te duiden deel van het exploitatiesaldo dat op grond van het voormalige bekostigingssysteem voor
      toerekening aan personen in aanmerking zou komen, in welk geval dat nader aangeduide deel wordt verrekend met de
      Staat der Nederlanden.

      3 De toezichthouder brengt de kosten van eenmalige toezichthandelingen waarvoor de aanvraag dan wel de melding
      is ontvangen voor het moment van inwerkingtreding van deze wet overeenkomstig het voormalige bekostigingssysteem
      in rekening.

      4 De toezichthouder brengt zijn kosten, niet zijnde de kosten, bedoeld in het derde lid, die betrekking hebben
      op een periode die voorafgaat aan het jaar waarin deze wet in werking treedt, overeenkomstig het voormalige
      bekostigingssysteem in rekening.

      5 De bedragen die de toezichthouder op grond van gemaakte afspraken gespreid over meerdere jaren met onder
      toezicht staande ondernemingen verrekent, worden voor zover zij bij de inwerkingtreding van deze wet nog niet zijn
      verrekend, verrekend op een wijze zoals oorspronkelijk is afgesproken.

      6 Ingeval een gerechtelijke uitspraak leidt tot een onherroepelijke neerwaartse bijstelling van een door de
      toezichthouder opgelegde heffing, zal de toezichthouder het als gevolg van die uitspraak te restitueren bedrag
      verrekenen met de Staat der Nederlanden ingeval de heffing betrekking heeft op een periode die gelegen is voor het
      tijdstip waarop deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel30
  - number: '31'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Wet bekostiging financieel toezicht.'
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel32
