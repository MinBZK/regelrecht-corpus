  - number: '2'
    text: |-
      1 De toezichthouder zendt de begroting, bedoeld in [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1],
      jaarlijks voor 1 december aan Onze Ministers.

      2 In de begroting neemt de toezichthouder een overzicht op waaruit de berekeningswijze van de overige kosten
      blijkt.

      3 In het overzicht, bedoeld in het tweede lid, maakt de Nederlandsche Bank onderscheid tussen:

      a. de overige kosten voor het toezicht op personen die behoren tot de in [bijlage II][ref2], onderdeel
      «Toezichthouder: De Nederlandsche Bank», opgenomen toezichtcategorieën, met uitzondering van de kosten, bedoeld in
      onderdeel c;

      b. de overige kosten voor het toezicht op personen die behoren tot de in [bijlage III][ref3], onderdeel
      «Toezichthouder: De Nederlandsche Bank», opgenomen toezichtcategorie, met uitzondering van de kosten, bedoeld in
      onderdeel c;

      c. de overige kosten die verband houden met het voorbereiden van de afwikkeling van kredietinstellingen en
      beleggingsondernemingen in de zin van verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van 15
      juli 2014 betreffende de afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen (PbEU 2014, L 225)
      en het Deel Bijzondere maatregelen financiële ondernemingen van de [Wet op het financieel toezicht][ref4].

      4 De hoogte van de begroting, bedoeld in het eerste lid, is niet hoger dan de totale kosten van het toezicht zoals
      die blijken uit de laatst goedgekeurde begroting van de toezichthouder exclusief de kosten die verband houden met
      de betrokkenheid van de toezichthouder bij de uitvoering van verordening (EU) nr. 1024/2013 van de Raad van 15
      oktober 2013 waarbij aan de Europese Centrale Bank specifieke taken worden opgedragen betreffende het beleid inzake
      het prudentieel toezicht op kredietinstellingen (PbEU 2013, L 287) met daarbij opgeteld:

      a. de kosten die verband houden met de betrokkenheid van de toezichthouder bij de uitvoering van verordening
      (EU) nr. 1024/2013 van de Raad van 15 oktober 2013 waarbij aan de Europese Centrale Bank specifieke taken worden
      opgedragen betreffende het beleid inzake het prudentieel toezicht op kredietinstellingen (PbEU 2013, L 287);

      b. loon- of prijsmutatie; en

      c. de naar kosten herleide mutaties in het takenpakket.

      Onze Ministers kunnen in bijzondere omstandigheden afwijken van hetgeen in dit artikel is bepaald en informeren de
      beide kamers der Staten-Generaal hier tijdig over.

      5 Voor de toepassing van [artikel 27, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref5] wordt met
      betrekking tot de begroting van de Nederlandsche Bank voor «laatst goedgekeurde jaarrekening» gelezen: laatst
      goedgekeurde verantwoording als bedoeld in [artikel 5, tweede lid][ref6], van de Wet bekostiging financieel
      toezicht.

      6 De begroting van de Nederlandsche Bank heeft slechts betrekking op het toezicht.


