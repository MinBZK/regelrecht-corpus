  - number: '12'
    text: |-
      1 De door de toezichthouder te hanteren tarieven voor eenmalige toezichthandelingen zijn vastgelegd in
      [bijlage I][ref1].

      2 De toezichthouder brengt het tarief, bedoeld in het eerste lid, voor zover mogelijk direct na ontvangst van de
      aanvraag of melding in rekening.

      3 De toezichthouder kan het tweede lid buiten toepassing laten of daarvan afwijken voor zover toepassing, gelet op
      het belang van een reële en rechtvaardige kostendoorberekening, zal leiden tot een onbillijkheid van overwegende
      aard.

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede
      en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2018-11-16#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: 12a
    text: |-
      1 Voor de toepassing van [bijlage I][ref1] wordt verstaan onder mkb-onderneming:

      a. een onderneming die op grond van de laatste vastgestelde jaarrekening op het moment van de aanvraag of melding
      van de eenmalige toezichthandeling aan ten minste twee van de volgende drie criteria voldoet:

      1°. een gemiddeld aantal werknemers gedurende het boekjaar van minder dan 250;

      2°. een balanstotaal van ten hoogste € 43.000.000;

      3°. een jaarlijkse netto-omzet van ten hoogste € 50.000.000.

      2 In afwijking van het eerste lid wordt voor de toepassing van onderdeel A9 emissies van [bijlage I][ref2] onder
      een mkb-onderneming verstaan: een uitgevende instelling waarvan op het moment van de aanvraag van de eenmalige
      toezichthandeling nog geen vastgestelde jaarrekening beschikbaar is, indien de totale tegenwaarde van de onder het
      prospectus aan te bieden effecten ten hoogste € 25.000.000 bedraagt.

      3 Indien de onderneming deel uitmaakt van een groep als bedoeld in
      [artikel 2:24b van het Burgerlijk Wetboek][ref3], wordt bij de beoordeling of sprake is van een mkb-onderneming
      uitgegaan van de vastgestelde geconsolideerde jaarrekening van de uiteindelijke moeder.

      4 In afwijking van het eerste lid wordt een special purpose entity voor securitisatiedoeleinden als bedoeld in
      verordening (EU) nr. 575/2013 van het Europees parlement en de Raad van 26 juni 2013 betreffende prudentiële
      vereisten voor kredietinstellingen en beleggingsondernemingen en tot wijziging van verordening (EU) nr. 648/2012
      (PbEU 2013, L176) niet aangemerkt als mkb-onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
      [ref2]: https://wetten.overheid.nl/BWBR0031659
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
