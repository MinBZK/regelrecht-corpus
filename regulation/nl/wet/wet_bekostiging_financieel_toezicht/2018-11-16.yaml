        artikel: '34'
  - number: '7'
    text: |-
      1 De jaarrekening, bedoeld in [artikel 5, eerste lid][ref1], en de verantwoording, bedoeld in artikel 5,
      tweede lid, bevatten een opgave van het over het desbetreffende jaar gerealiseerde exploitatiesaldo, welk saldo
      overeenkomt met het verschil tussen de gerealiseerde baten en lasten.

      2 Tot de in een jaar gerealiseerde baten worden mede gerekend de in dat jaar verkregen opbrengsten uit verbeurde
      dwangsommen of opgelegde bestuurlijke boetes, met dien verstande dat, indien de beschikking waarbij de last
      onder dwangsom of de bestuurlijke boete is opgelegd nog niet onherroepelijk is, de uit een verbeurde dwangsom of
      opgelegde bestuurlijke boete verkregen opbrengsten worden gerekend tot de gerealiseerde baten in het jaar waarin
      die beschikking onherroepelijk wordt.

      3 Voor zover de tot de gerealiseerde baten in een jaar te rekenen opbrengsten uit dwangsommen of bestuurlijke
      boetes het bedrag van € 2.500.000 te boven gaan, komen die opbrengsten toe aan de Staat. De toezichthouder draagt
      het aan de Staat verschuldigde bedrag af, zodra het besluit tot vaststelling van de desbetreffende jaarrekening
      overeenkomstig [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2] is goedgekeurd.

      4 De door de toezichthouder verkregen opbrengsten uit dwangsommen of bestuurlijke boetes worden, voor zover
      zij ingevolge het tweede lid tot de in het desbetreffende jaar gerealiseerde baten worden gerekend en na aftrek
      van de ingevolge het derde lid aan de Staat toekomende opbrengsten, aan de in [bijlage II][ref3], [III][ref4]
      en [IV][ref5] opgenomen toezichtcategorieën van die toezichthouder toegerekend waarbij de toerekening aan de
      toezichtcategorieën van de Nederlandsche Bank geschiedt naar rato van de voor dat jaar naar die bijlagen te
      herleiden verkregen opbrengsten uit dwangsommen of bestuurlijke boetes.

      5 In de opgave, bedoeld in het eerste lid, wordt vastgelegd:

      a. het deel van het exploitatiesaldo dat is voortgekomen uit de betrokkenheid van de toezichthouder bij het
      toezicht ingevolge de wetten bedoeld in [artikel 1, onderdeel c, onder 6° en 15°][ref6], en

      b. het deel van de opbrengsten verkregen uit dwangsommen of opgelegde bestuurlijke boetes, bedoeld in het derde
      lid, dat het bedrag van € 2.500.000 te boven gaat.

      6 De Nederlandsche Bank legt in de opgave, bedoeld in het eerste lid, tevens vast:

      a. het deel van het exploitatiesaldo dat is voortgekomen uit het toezicht op de personen die behoren tot de
      in [bijlage II][ref7], onderdeel «Toezichthouder: De Nederlandsche Bank», opgenomen toezichtcategorieën met
      uitzondering van het exploitatiesaldo, bedoeld in de onderdelen c en d;

      b. het deel van het exploitatiesaldo dat is voortgekomen uit het toezicht op de personen die behoren tot de
      in [bijlage III][ref8], onderdeel «Toezichthouder: De Nederlandsche Bank», opgenomen toezichtcategorie met
      uitzondering van het exploitatiesaldo, bedoeld in de onderdelen c en d;

      c. het deel van het exploitatiesaldo dat is voortgekomen uit het voorbereiden van de afwikkeling van
      kredietinstellingen en beleggingsondernemingen in de zin van verordening (EU) nr. 806/2014 van het Europees
      parlement en de Raad van 15 juli 2014 betreffende de afwikkeling van kredietinstellingen en bepaalde
      beleggingsondernemingen (PbEU 2014, L 225) en het Deel Bijzondere maatregelen financiële ondernemingen van de
      [Wet op het financieel toezicht][ref9];

      d. het deel van het exploitatiesaldo dat verband houdt met het afwikkelen van kredietinstellingen en
      beleggingsondernemingen in de zin van de verordening (EU) nr. 806/2014 van het Europees parlement en de Raad van 15
      juli 2014 betreffende de afwikkeling van kredietinstellingen en bepaalde beleggingsondernemingen (PbEU 2014, L 225)
      en het Deel Bijzondere maatregelen financiële ondernemingen van de [Wet op het financieel toezicht][ref10].


