preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om de bekostiging van het financieel toezicht helder en
    in samenhang met andere bepalingen omtrent het financieel beheer van dit toezicht, overzichtelijk in één wet vast
    te leggen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald, verstaan onder: -
      *Autoriteit Financiële Markten:* Stichting Autoriteit Financiële Markten;
        - *de Nederlandsche Bank:* De Nederlandsche Bank N.V.;
        - *de toezichthouder:* Autoriteit Financiële Markten of de Nederlandsche Bank, ieder voor zover
      betrokken bij het toezicht ingevolge: 1° de [Invoerings- en aanpassingswet Pensioenwet][ref1];
      2° de [Pensioenwet][ref2]; 3° de [Pensioenwet BES][ref3]; 4° de [Sanctiewet 1977][ref4];
      5° de Wet bekostiging financieel toezicht; 6° de [Wet financiële markten BES][ref5]; 7° de
      [Wet giraal effectenverkeer][ref6]; 8° de [Wet handhaving consumentenbescherming][ref7]; 9° de
      [Wet inzake de geldtransactiekantoren][ref8]; 10° de [Wet op het financieel toezicht][ref9];
      11° de [Wet op het notarisambt][ref10]; 12° de [Wet privatisering ABP][ref11]; 13° de
      [Wet privatisering FVP][ref12]; 14° de [Wet ter voorkoming van witwassen en financieren van terrorisme][ref13];
      15° de [Wet ter voorkoming van witwassen en financieren van terrorisme BES][ref14]; 16° de
      [Wet toezicht accountantsorganisaties][ref15]; 17° de [Wet toezicht effectenverkeer 1995][ref16];
      18° de [Wet toezicht financiële verslaggeving][ref17]; 19° de
      [Wet toezicht trustkantoren][ref18]; 20° de [Wet verplichte beroepspensioenregeling][ref19]; 21° de
      [Wet verplichte deelneming in een bedrijfstakpensioenfonds 2000][ref20]; 22° EU-rechtshandelingen;
        - *eenmalige toezichthandeling:* een in [bijlage I][ref21] genoemde handeling van de toezichthouder, welke
      handeling plaatsvindt krachtens een van de wetten en besluiten, bedoeld in onderdeel c, uitgezonderd de onder 6° en
      15° bedoelde wetten;
        - *Onze Ministers:* Onze Minister van Financiën en Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *overige kosten:* alle kosten van de toezichthouder, uitgezonderd: 1° de kosten van eenmalige
      toezichthandelingen; 2° de kosten verband houdend met de betrokkenheid van de toezichthouder bij de wetten, bedoeld
      in onderdeel c, onder 6° en 15°;
        - *personen:* natuurlijke personen, rechtspersonen of vennootschappen, waaronder personenvennootschappen, of
      daarmee vergelijkbare lichamen of samenwerkingsverbanden;
        - *toezicht:* de betrokkenheid van de toezichthouder bij de wetten en bindende besluiten, bedoeld in onderdeel
      c, alsmede de betrokkenheid van de toezichthouder bij de totstandkoming van nieuwe wetten en bindende besluiten
      aangaande het toezicht op de financiële markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020828
