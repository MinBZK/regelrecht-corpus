  - number: '2.1'
    text: |-
      De toezichthouder zendt de begroting, bedoeld in [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1],
      jaarlijks voor 1 december aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '2.2'
    text: 'In de begroting brengt de toezichthouder een onderscheid aan naar:'
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
  - number: 2.2.a
    text: de kosten van eenmalige toezichthandelingen;
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
  - number: 2.2.b
    text: |-
      de kosten verband houdend met zijn betrokkenheid bij het toezicht ingevolge de wetten, bedoeld in
      [artikel 1, onderdeel c, onder 6° en 15°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '1'
  - number: 2.2.c
    text: de overige kosten.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van [artikel 27, vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref1] wordt met
      betrekking tot de begroting van de Nederlandsche Bank voor «laatst goedgekeurde jaarrekening» gelezen: laatst
      goedgekeurde verantwoording als bedoeld in [artikel 5, tweede lid][ref2], van de Wet bekostiging financieel
      toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0031659#Artikel5
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0031659
        artikel: '5'
  - number: '2.4'
    text: De begroting van de Nederlandsche Bank heeft slechts betrekking op het toezicht.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Goedkeuring als bedoeld in [artikel 29 van de Kaderwet zelfstandige bestuursorganen][ref1] wordt niet onthouden
      dan nadat de toezichthouder in de gelegenheid is gesteld de begroting aan te passen, binnen een door Onze Ministers
      gezamenlijk te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel29
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '29'
  - number: '3.2'
    text: |-
      De toezichthouder doet na goedkeuring van de begroting onverwijld mededeling van de begroting in de Staatscourant
      en houdt de begroting gedurende ten minste twee jaar na goedkeuring op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel3
  - number: '3.3'
    text: |-
      Indien de begroting niet voor 1 januari van het begrotingsjaar waarop zij betrekking heeft, is goedgekeurd, kan de
      toezichthouder, zolang de begroting niet is goedgekeurd, voor het aangaan van verplichtingen en het verrichten van
      uitgaven beschikken over ten hoogste vier twaalfde gedeelten van de bedragen die bij de overeenkomstige onderdelen
      van de begroting van het voorafgaande jaar waren toegestaan.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling van Onze Ministers gezamenlijk kunnen regels worden gesteld voor de inrichting van de
      begroting.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel4
  - number: '5.1'
    text: |-
      De Autoriteit Financiële Markten stelt de jaarrekening, bedoeld in
      [artikel 34 van de Kaderwet zelfstandige bestuursorganen][ref1], jaarlijks voor 15 maart op.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '5.2'
    text: |-
      De Nederlandsche Bank stelt jaarlijks voor 15 maart een verantwoording op, waarin met betrekking
      tot het toezicht rekening en verantwoording wordt afgelegd van het financieel beheer en van de
      geleverde prestaties over het verstreken boekjaar. De [artikelen 34, tweede en derde lid][ref1], en
      [35, tweede tot en met vierde lid, van de Kaderwet zelfstandige bestuursorganen][ref2] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel35
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '35'
  - number: '5.3'
    text: |-
      In afwijking van [artikel 35, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] gaat de
      jaarrekening van de Autoriteit Financiële Markten vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de Autoriteit Financiële Markten aangewezen registeraccountant of Accountant-
      Administratieconsulent ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, derde lid, van de Wet op de Accountants-Administratieconsulenten][ref2], die niet werkzaam is bij of
      verbonden is aan een accountantsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002856
        artikel: '36'
  - number: '5.4'
    text: |-
      De toezichthouder zendt de jaarrekening of verantwoording na goedkeuring door de Raad van toezicht,
      onderscheidenlijk de Raad van commissarissen, onverwijld aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      Goedkeuring als bedoeld in [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1] wordt niet
      onthouden dan nadat de toezichthouder in de gelegenheid is gesteld de jaarrekening of verantwoording aan te passen,
      binnen een door Onze Ministers gezamenlijk te stellen redelijke termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '6.2'
    text: |-
      De toezichthouder doet na goedkeuring van de jaarrekening, onderscheidenlijk de verantwoording, onverwijld
      mededeling van die jaarrekening of verantwoording in de Staatscourant en houdt de jaarrekening of verantwoording
      gedurende ten minste vijf jaar na goedkeuring op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel6
  - number: '7.1'
    text: |-
      De jaarrekening, bedoeld in [artikel 5, eerste lid][ref1], en de verantwoording, bedoeld in artikel 5, tweede lid,
      bevatten een opgave van het over het desbetreffende jaar gerealiseerde exploitatiesaldo, welk saldo overeenkomt met
      het verschil tussen de gerealiseerde baten en lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel5
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '5'
  - number: '7.2'
    text: |-
      In de opgave, bedoeld in het eerste lid, wordt vastgelegd het deel van het exploitatiesaldo dat
      voortkomt uit de betrokkenheid van de toezichthouder bij het toezicht ingevolge de wetten bedoeld in
      [artikel 1, onderdeel c, onder 6° en 15°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '1'
  - number: '7.3'
    text: |-
      Tot de in enig jaar gerealiseerde baten, bedoeld in het eerste lid, worden mede gerekend de in het desbetreffende
      jaar onherroepelijk verkregen opbrengsten uit hoofde van geïncasseerde boetes en dwangsommen.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] stelt de
      toezichthouder het in dat artikel bedoelde jaarverslag jaarlijks voor 15 maart op.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '8.2'
    text: Het jaarverslag van de Nederlandsche Bank heeft slechts betrekking op het toezicht.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel8
  - number: '8.3'
    text: De toezichthouder houdt het jaarverslag gedurende ten minste vijf jaren op elektronische wijze ter inzage.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij ministeriële regeling van Onze Ministers gezamenlijk kunnen nadere regels worden gesteld voor de inrichting van
      het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      De toezichthouder organiseert tweemaal per jaar overleg met een daarvoor in aanmerking komende representatieve
      vertegenwoordiging van de onder zijn toezicht staande personen. De toezichthouder kan tevens daarvoor in aanmerking
      komende cliëntenorganisaties toelaten tot het overleg. Ambtenaren kunnen namens Onze Ministers het overleg
      bijwonen.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel9
  - number: '9.2'
    text: De toezichthouder maakt het verslag van het overleg binnen een redelijke termijn na het overleg openbaar.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel9
  - number: '10.1'
    text: |-
      De Staat der Nederlanden draagt jaarlijks bij in de financiering van het toezicht met uitzondering van de
      kosten die voortkomen uit de betrokkenheid van de toezichthouder bij het toezicht ingevolge de wetten bedoeld in
      [artikel 1, onderdeel c, onder 6° en 15°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '1'
  - number: '10.2'
    text: |-
      De hoogte van de in het eerste lid bedoelde bijdrage is voor het jaar van inwerkingtreding van deze wet als volgt
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel10
  - number: 10.2.a
    text: voor de Autoriteit Financiële Markten € 20 000 000;
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel10
  - number: 10.2.b
    text: voor de Nederlandsche Bank € 18 800 000.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      De in het tweede lid bedoelde bedragen worden jaarlijks bijgesteld vanwege binnen de rijksbegroting verwerkte loon-
      en prijsmutaties en opgelegde taakstellingen. Vaststelling van de bijgestelde bedragen geschiedt via hoofdstuk IXB
      van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      De toezichthouder brengt de kosten van het toezicht, uitgezonderd de kosten van zijn betrokkenheid bij de in
      [artikel 1, onderdeel c, onder 6° en 15°][ref1] bedoelde wetten, in rekening bij:


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '1'
  - number: 11.1.a
    text: |-
      personen die bij hem een aanvraag of melding hebben gedaan als gevolg waarvan de toezichthouder overgaat tot het
      verrichten van een eenmalige toezichthandeling zoals vastgelegd in [bijlage I][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: 11.1.b
    text: |-
      personen die behoren tot een der categorieën, genoemd in [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '11.2'
    text: |-
      Tot de in rekening te brengen kosten, bedoeld in het eerste lid, behoren mede de kosten die de toezichthouder maakt
      ter voorbereiding op een taak voordat deze aan hem werd opgedragen en de kosten die aan de toezichthouder zijn
      doorberekend.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel11
  - number: '12.1'
    text: |-
      De door de toezichthouder te hanteren tarieven voor eenmalige toezichthandelingen zijn vastgelegd in
      [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '12.2'
    text: |-
      De toezichthouder brengt het tarief, bedoeld in het eerste lid, voor zover mogelijk direct na ontvangst van de
      aanvraag of melding in rekening.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel12
  - number: '12.3'
    text: |-
      De toezichthouder kan het tweede lid buiten toepassing laten of daarvan afwijken voor zover toepassing, gelet op
      het belang van een reële en rechtvaardige kostendoorberekening, zal leiden tot een onbillijkheid van overwegende
      aard.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel12
  - number: '12.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het tweede
      en derde lid.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      De toezichthouder brengt jaarlijks een bedrag in rekening aan de personen die behoren tot een van de in
      [bijlage II][ref1] opgenomen toezichtcategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '13.2'
    text: |-
      De kosten die aan de in [bijlage II][ref1] bedoelde personen worden doorberekend, zijn in enig jaar gelijk aan de
      som van:


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: 13.2.a
    text: |-
      het totaal van de overige kosten zoals opgenomen in de door de toezichthouder voor het desbetreffende jaar
      opgestelde begroting, waarmee Onze Ministers gezamenlijk hebben ingestemd, en
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
  - number: 13.2.b
    text: |-
      het exploitatiesaldo, bedoeld in [artikel 7, eerste lid][ref1], over het jaar dat voorafgaat aan het jaar waarop de
      in onderdeel a bedoelde begroting betrekking heeft, verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel7
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '7'
  - number: 13.2.c
    text: |-
      het deel van het exploitatiesaldo, bedoeld in [artikel 7, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel7
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '7'
  - number: 13.2.d
    text: |-
      de voor het desbetreffende jaar door de Staat der Nederlanden te verstrekken bijdrage, bedoeld in
      [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel10
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '10'
  - number: '13.3'
    text: |-
      Onze Ministers kunnen, gehoord hebbende de toezichthouder, gezamenlijk besluiten het exploitatiesaldo na aftrek van
      het deel van het exploitatiesaldo, bedoeld in [artikel 7, tweede lid][ref1], geheel of ten dele niet te betrekken
      bij de berekening, bedoeld in het tweede lid, in welk geval de toezichthouder het niet bij de berekening betrokken
      deel van het exploitatiesaldo betrekt bij de vaststelling van het exploitatiesaldo over het eerstvolgende boekjaar.
      Van het gezamenlijke besluit van Onze Ministers wordt in de Staatscourant mededeling gedaan. De in de vorige volzin
      bedoelde bevoegdheid van Onze Ministers is beperkt tot het deel van het exploitatiesaldo, ongeacht of dit saldo
      positief of negatief is, dat, in absolute bedragen, de € 5 000 000 niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0031659#Artikel7
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
        artikel: '7'
  - number: '13.4'
    text: |-
      De kosten, bedoeld in het tweede lid, worden aan de hand van de procentuele aandelen, zoals vastgesteld in
      [bijlage II][ref1], toegerekend aan de toezichtcategorieën, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '13.5'
    text: |-
      De hoogte van een jaarlijks in rekening te brengen bedrag, bedoeld in het eerste lid, wordt bepaald aan de hand van
      de maatstaven zoals vastgelegd in [bijlage II][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '13.6'
    text: |-
      Uiterlijk per 1 juni van ieder jaar worden, op voorstel van de toezichthouder, bij ministeriële regeling van Onze
      Ministers gezamenlijk, voor iedere te onderscheiden toezichtcategorie de bandbreedtes en tarieven vastgesteld.
      Bij de vaststelling van de bandbreedtes en de tarieven wordt rekening gehouden met het bedrag dat op grond van het
      vierde lid is toegerekend aan de desbetreffende categorie.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
  - number: '13.7'
    text: |-
      Het in het eerste lid bedoelde bedrag is evenredig met de overeenkomstig het achtste tot en met het elfde lid te
      bepalen periode dat de betrokkene in het desbetreffende jaar deel uitmaakt van een van de in [bijlage II][ref1]
      opgenomen toezichtcategorieën.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '13.8'
    text: |-
      Met uitzondering van de toezichtcategorieën «Effectenuitgevende instellingen: markt» en «Effectenuitgevende
      instellingen: verslaggeving» is de periode, bedoeld in het zevende lid, gelijk aan de tijdsduur dat die persoon
      over een door de toezichthouder afgegeven vergunning of verklaring van ondertoezichtstelling beschikt dan wel dat
      die persoon op grond van een wettelijke verplichting bij de toezichthouder is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
  - number: '13.9'
    text: |-
      Voor een persoon die behoort tot de in [bijlage II][ref1] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: markt» is de periode, bedoeld in het zevende lid, gelijk aan de
      tijdsduur waarin zijn effecten zijn toegelaten tot de handel op een gereglementeerde markt, bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], of op een met een gereglementeerde markt vergelijkbaar
      systeem uit een staat die geen lidstaat is als bedoeld in artikel 1:1 van de Wet op het financieel toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '13.10'
    text: |-
      Voor een persoon die op enig moment in een jaar behoort tot de in [bijlage II][ref1] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: verslaggeving», is de periode , bedoeld in het zevende lid, gelijk aan een heel
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: '13.11'
    text: |-
      Een persoon behoort in enig kalenderjaar tot de in [bijlage II][ref1] opgenomen toezichtcategorie
      «Effectenuitgevende instellingen: verslaggeving», indien:


      [ref1]: https://wetten.overheid.nl/BWBR0031659
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031659
  - number: 13.11.a
    text: |-
      in dat jaar zijn jaarrekening is vastgesteld en tevens door hem uitgegeven effecten zijn toegelaten tot de handel
      op een gereglementeerde markt als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of de handel
      op een met een gereglementeerde markt vergelijkbaar systeem uit een staat die geen lidstaat is als bedoeld in
      artikel 1:1 van de Wet op het financieel toezicht; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 13.11.b
    text: |-
      hij in dat jaar op grond van [artikel 5:25m, tweede lid, van de Wet op het financieel toezicht][ref1], een
      persbericht heeft uitgebracht over het algemeen verkrijgbaar gesteld zijn van de door hem opgemaakte jaarlijkse
      financiële verslaggeving, bedoeld in [artikel 5:25c van de Wet op het financieel toezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '13.12'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      en zesde lid.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel13
  - number: '30.1'
    text: |-
      Van een op het moment van inwerkingtreding van deze wet nog niet verrekend exploitatiesaldo van de toezichthouder,
      wordt:
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: 30.1.a
    text: |-
      het op grond van het voormalige bekostigingssysteem aan de Staat der Nederlanden toe te rekenen deel van het
      exploitatiesaldo alsnog met de Staat der Nederlanden verrekend;
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: 30.1.b
    text: |-
      het op grond van het voormalige bekostigingssysteem aan personen toe te rekenen deel van het exploitatiesaldo
      alsnog met deze personen verrekend.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '30.2'
    text: |-
      Onze Minister van Financiën kan beslissen om het eerste lid, onderdeel b, niet van toepassing te verklaren op een
      door hem nader aan te duiden deel van het exploitatiesaldo dat op grond van het voormalige bekostigingssysteem voor
      toerekening aan personen in aanmerking zou komen, in welk geval dat nader aangeduide deel wordt verrekend met de
      Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '30.3'
    text: |-
      De toezichthouder brengt de kosten van eenmalige toezichthandelingen waarvoor de aanvraag dan wel de melding is
      ontvangen voor het moment van inwerkingtreding van deze wet overeenkomstig het voormalige bekostigingssysteem in
      rekening.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '30.4'
    text: |-
      De toezichthouder brengt zijn kosten, niet zijnde de kosten, bedoeld in het derde lid, die betrekking hebben
      op een periode die voorafgaat aan het jaar waarin deze wet in werking treedt, overeenkomstig het voormalige
      bekostigingssysteem in rekening.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '30.5'
    text: |-
      De bedragen die de toezichthouder op grond van gemaakte afspraken gespreid over meerdere jaren met onder toezicht
      staande ondernemingen verrekent, worden voor zover zij bij de inwerkingtreding van deze wet nog niet zijn
      verrekend, verrekend op een wijze zoals oorspronkelijk is afgesproken.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '30.6'
    text: |-
      Ingeval een gerechtelijke uitspraak leidt tot een onherroepelijke neerwaartse bijstelling van een door de
      toezichthouder opgelegde heffing, zal de toezichthouder het als gevolg van die uitspraak te restitueren bedrag
      verrekenen met de Staat der Nederlanden ingeval de heffing betrekking heeft op een periode die gelegen is voor het
      tijdstip waarop deze wet in werking treedt.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel30
  - number: '31'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel31
  - number: '32'
    text: 'Deze wet wordt aangehaald als: Wet bekostiging financieel toezicht.'
    url: https://wetten.overheid.nl/BWBR0031659/2013-01-01#Artikel32
