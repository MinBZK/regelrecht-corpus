  - number: '3'
    text: |-
      Indien rechtskundige bijstand verleend wordt, hetzij in strafzaken, hetzij in een civiele procedure of een
      voorgenomen civiele procedure, welker aard naar het oordeel van Onze Minister van Justitie rechtskundige bijstand
      wettigt, wordt zulks op de in [artikel 2][ref1] bedoelde kaart aangetekend en wordt daarop, voor zover het geen
      toevoegingen op grond van het [Wetboek van Strafvordering BES][ref2] betreft, tevens vermeld de naam van de
      advocaat die zich met de bijstand zal belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0028200#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028681
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel3
    references:
