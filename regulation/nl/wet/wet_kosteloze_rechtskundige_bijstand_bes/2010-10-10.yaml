  - number: '1'
    text: |-
      1 Namens de openbare lichamen Bonaire, Sint Eustatius en Saba wordt voor bepaalde tijd en tot wederopzegging door
      een der partijen een overeenkomst aangegaan met advocaten, waarbij deze zich verbinden tegen een nader overeen te
      komen vergoeding kosteloos overeenkomstig de bepalingen van deze wet rechtskundige bijstand te verlenen.

      2 Voor zover de overeenkomst, bedoeld in het eerste lid, betrekking heeft op rechtskundige bijstand in strafzaken,
      worden de bij of krachtens de [artikelen 61 tot en met 69 van het Wetboek van Strafvordering BES][ref1] gegeven
      voorschriften in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel61
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '61'
  - number: '2'
    text: |-
      1 Aan iedere in de openbare lichamen Bonaire, Sint Eustatius en Saba werkelijke woonplaats hebbende persoon,
      die on- of minvermogend is en rechtskundige bijstand behoeft, kan een kaart worden afgegeven, recht gevende op
      kosteloze rechtskundige bijstand.

      2 Vreemdelingen niet ingezetenen, die voldoen aan de vereisten van deze wet komen voor kosteloze rechtskundige
      bijstand in strafzaken in aanmerking.

      Voorzover een internationale overeenkomst zulks verplicht, komen vreemdelingen niet ingezetenen eveneens voor
      kosteloze rechtskundige bijstand in burgerlijke zaken in aanmerking.

      3 De betrokkene die een kaart, bedoeld in het eerste lid, wenst te verkrijgen, wendt zich daartoe tot Onze
      Minister van Justitie, onder overlegging van een verklaring, die door een ten aanzien van de betrokkene bevoegde
      belastingdienst is afgegeven, waaruit de hoogte van het zuiver inkomen op grond van, dan wel overeenkomstig, de
      bepalingen van de [Wet op de inkomstenbelasting BES][ref1] blijkt.

      4 Voor de toepassing van deze wet wordt onder on- of minvermogende verstaan: degene wiens inkomen gelijk is aan of
      minder bedraagt dan het bruto minimumloon, genoemd in [artikel 9, eerste lid, van de Wet minimumlonen BES][ref2].

      5 In bijzondere gevallen kan Onze Minister van Justitie beslissen, dat in afwijking van het bepaalde in het vorige
      lid, een kaart wordt afgegeven als bedoeld in het eerste lid van dit artikel, indien de economische toestand van
      betrokkene zodanig is, dat hij, hoewel hij een hoger belastbaar inkomen heeft dan in het vierde lid gesteld, niet
      in staat moet worden geacht de vermoedelijke kosten van het honorarium van een advocaat te betalen.

      6 Indien zich in de omstandigheden van de persoon aan wie kosteloze rechtskundige bijstand wordt verleend, zodanige
      wijzigingen mochten voordoen, dat op grond daarvan aannemelijk geacht kan worden dat die persoon in staat is de
      kosten van een advocaat zelf te dragen, komt het recht op kosteloze rechtskundige bijstand te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0029306
      [ref2]: https://wetten.overheid.nl/BWBR0028170#Artikel9
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel2
