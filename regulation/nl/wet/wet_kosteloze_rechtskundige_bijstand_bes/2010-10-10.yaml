        bwb_id: BWBR0028681
  - number: '4'
    text: Bij ministeriële regeling worden nadere regels gesteld over de verlening van kosteloze rechtskundige bijstand.
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel4
  - number: '5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel5
  - number: '6'
    text: |-
      Het is de aangewezen advocaat verboden, een geschenk, beloning of vergoeding, van welke aard of waarde ook, in
      verband met de door hem te verlenen rechtskundige bijstand van wie dan ook te vragen, te bedingen of te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel6
  - number: 6a
    text: |-
      1 Indien personen, die als eisende partij met kosteloze rechtskundige bijstand ingevolge deze wet procederen,
      veroordeeld worden in de kosten, komt uitsluitend het salaris van de gemachtigde der wederpartij, tot het door de
      rechter vastgestelde bedrag voor rekening van het Rijk.

      2 Indien de rechter een bedrag vaststelt voor salaris van de advokaat van een onvermogende, aan wie op grond van
      deze wet kosteloze rechtkundige bijstand wordt verleend stort de advokaat dit bedrag na ontvangst in ’s Rijks kas,
      voorzover dit bedrag, dat aan de advocaat voor de behandeling van de zaak in de betreffende instantie is toegekend,
      niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel6a
  - number: 6b
    text: |-
      1 Bij voldoende draagkracht van de rechtzoekende kunnen de kosten van de ten onrechte genoten rechtskundige
      bijstand geheel of gedeeltelijk van overheidswege op hem worden verhaald.

      2 Bij algemene maatregel van bestuur, kunnen regels worden gegeven omtrent het verhaal op de goederen van de
      rechtzoekende.
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel6b
  - number: 6c
    text: |-
      Op de rechtskundige bijstand voor in verzekering gestelde personen is uitsluitend het Besluit toevoeging in
      strafzaken BES van toepassing.
    url: https://wetten.overheid.nl/BWBR0028200/2010-10-10#Artikel6c
