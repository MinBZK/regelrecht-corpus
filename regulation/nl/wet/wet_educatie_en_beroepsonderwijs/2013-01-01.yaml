      ten hoogste twee aaneengesloten studiejaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door
      dat gezag te stellen voorwaarden, verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen
      aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van de tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
