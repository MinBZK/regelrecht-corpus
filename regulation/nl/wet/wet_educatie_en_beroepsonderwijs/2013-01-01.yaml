        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 1.4.1.1.b
    text: |-
      het onderwijs, met uitzondering van [artikel 7.1.1][ref1], en de examens,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
    references:
