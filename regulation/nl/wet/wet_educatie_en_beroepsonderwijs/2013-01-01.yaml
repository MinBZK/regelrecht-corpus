        artikel: 10c
  - number: 1.3.3.2
    text: |-
      [Artikel 1.3.1, derde lid, onder a, en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.5
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.5
  - number: 1.3.5.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.5
  - number: 1.3.5.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen voor educatie en beroepsopleidingen, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.5
  - number: 1.3.5.c
    text: het bieden van mogelijkheden voor loopbaanoriëntatie en -begeleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.5
  - number: 1.3.6.1
    text: |-
      Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling in en draagt er in dat verband zorg
      voor dat, zo veel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling
      van de kwaliteit van het onderwijs, waaronder maatregelen en instrumenten om te waarborgen dat het personeel zijn
      bekwaamheid onderhoudt. Het bevoegd gezag draagt er zorg voor dat de in de eerste volzin bedoelde beoordeling
      geschiedt met betrokkenheid van onafhankelijke deskundigen en belanghebbenden. De uitkomsten van de beoordeling
      zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6
  - number: 1.3.6.2
    text: 'Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6
  - number: 1.3.6.2.a
    text: de beoordeling, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6
  - number: 1.3.6.2.b
    text: de uitkomsten van die beoordeling, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6
  - number: 1.3.6.2.c
    text: het voorgenomen beleid in het licht van die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6
  - number: 1.3.6a
    text: |-
      Het bevoegd gezag draagt zorg voor het personeelsbeleid, voor zover het betreft de duurzame borging van de
      kwaliteit van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.6a
  - number: 1.3.7.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.7
  - number: 1.3.7.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.7
  - number: 1.3.8.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige deelnemer van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.8.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.3.8.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      deelnemer van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.8
  - number: 1.4.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of van een instelling dat aan de met goed gevolg afgelegde examens of onderdelen van
      examens van een beroepsopleiding, verzorgd door die instelling, een diploma of certificaat als bedoeld in
      [artikel 7.4.6][ref2] is verbonden, indien de desbetreffende instelling voor die opleiding in acht neemt hetgeen
      bij of krachtens deze wet is bepaald ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
