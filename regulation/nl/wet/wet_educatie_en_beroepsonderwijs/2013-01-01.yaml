  - number: 2.1.3.4
    text: |-
      Onze Minister besluit binnen 26 weken na ontvangst van een aanvraag op grond van het tweede lid, onder b. Op het
      besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.1.3.5
    text: |-
      Bij een beschikking op grond van het derde lid bepaalt Onze Minister het tijdstip waarop aan die instelling de
      rechten, genoemd in [artikel 1.3.1][ref1], ontnomen worden zodanig dat de ingeschreven deelnemers de opleiding
      waarvoor zij zijn ingeschreven, aan dezelfde instelling of aan een andere instelling binnen een redelijke tijd
      kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.4.1
    text: |-
      Een kenniscentrum beroepsonderwijs bedrijfsleven is werkzaam ten behoeve van beroepsopleidingen die naar hun
      aard en samenhang tot eenzelfde bedrijfstak of groep van bedrijfstakken behoren. Onze Minister kan de indeling in
      werkgebieden van de kenniscentra beroepsonderwijs bedrijfsleven vaststellen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven dragen zorg voor een doelmatige en inzichtelijke onderlinge
      afstemming van werkzaamheden, met inachtneming van de indeling in werkgebieden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.4
  - number: 2.1.5.1
    text: |-
      Onze Minister besluit op aanvraag van het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven over de
      aanvang van bekostiging van het kenniscentrum. Een aanvraag om te besluiten tot aanvang van de bekostiging wordt
      voor 1 februari van het jaar, voorafgaand aan het jaar waarin de bekostiging moet aanvangen, bij Onze Minister
      ingediend. De aanvraag omvat een aanduiding van het werkgebied van het kenniscentrum.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.5
  - number: 2.1.5.2
    text: |-
      Onze Minister betrekt bij de beoordeling van de aanvraag in elk geval de samenhang van de beroepsopleidingen in
      relatie tot een bepaalde bedrijfstak of groep van bedrijfstakken, alsmede de omvang van het werkgebied van het
      kenniscentrum beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.5
  - number: 2.1.5.3
    text: |-
      Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.5
  - number: 2.1.5.4
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van kenniscentra
      beroepsonderwijs bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.1.6
    text: |-
      Onze Minister kan besluiten dat een kenniscentrum beroepsonderwijs bedrijfsleven van zijn taken ontheven is indien
      niet langer behoefte bestaat aan het kenniscentrum of gebleken is dat het zijn taken niet of niet naar behoren
      vervult. Een beschikking als bedoeld in de eerste volzin brengt mee dat de aanspraak op bekostiging, bedoeld in
      [artikel 1.5.1][ref1], vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.1.8
    text: |-
      In deze afdeling wordt verstaan onder: - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een instelling ontstaat door samenvoeging van twee of meer
      instellingen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een instelling,
      een school als bedoeld in de [Wet op het voortgezet onderwijs][ref1], dan wel een instelling als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0005682
  - number: 2.1.9
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.9
  - number: 2.1.10.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring bedoeld in [artikel 2.1.9][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.10.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.1.b
    text: |-
      een schriftelijk advies over, of voor zover van toepassing de schriftelijke instemming met de fusie door de
      betrokken medezeggenschapsraden die is voorafgegaan door de kennisname van de fusie-effectrapportage door de
      medezeggenschapsraden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, is eveneens een aanvraag als bedoeld in [artikel 2.1.3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.10.3
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.a
    text: de motieven van de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de betrokken rechtspersonen in de regio, de onderwijskundige en bestuurlijke diversiteit van het
      onderwijsaanbod in de regio,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.f
    text: de kosten en baten van de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.g
    text: |-
      de personele en financiële gevolgen van de fusie, waaronder begrepen de gevolgen voor de dienstverlening aan
      deelnemers en de eventuele gevolgen voor andere belanghebbende partijen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.h
    text: de wijze waarop over de fusie wordt gecommuniceerd, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.3.i
    text: de wijze waarop de fusie wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.10.4
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.10
  - number: 2.1.11.1
    text: |-
      Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, in het opzicht van de diversiteit van onderwijsaanbieders in het middelbaar beroepsonderwijs,
      gelet op het geheel van de voorzieningen op het gebied van het onderwijs op significante wijze wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.11
  - number: 2.1.11.2
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.11
  - number: 2.1.11.3
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.11
  - number: 2.1.12.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 2.1.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.12.2
    text: |-
      De termijn bedoeld in het eerste lid kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.12
  - number: 2.1.12.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.2.1.1
    text: |-
      De rijksbijdrage voor het beroepsonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde aanspraak betrekking
      heeft wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, per instelling
      berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze. Wat
      huisvestingskosten betreft wordt de rijksbijdrage berekend hetzij op grond van die berekeningswijze hetzij op grond
      van een andere bij of krachtens algemene maatregel van bestuur te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.2.1.2
    text: |-
      De rijksbijdrage bestaat uit afzonderlijk berekende bijdragen ten behoeve van exploitatiekosten en
      huisvestingskosten.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3
    text: 'De bijdrage in de exploitatiekosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.a
    text: personeel,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.b
    text: onderhoud en vervanging van inventaris,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.c
    text: onderhoud van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.d
    text: energie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.e
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.g
    text: heffingen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.h
    text: inkoop van diensten,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.i
    text: |-
      kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid aan gewezen personeel alsmede
      uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1], waaronder mede begrepen gewezen personeel dat was belast met werkzaamheden op het gebied van de
      educatie, met inbegrip van educatieve programma's als bedoeld in [artikel 2.3.1, tweede lid][ref2], zoals luidend
      op 31 december 2008,


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.3.j
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.k
    text: gehandicapte deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.3.l
    text: |-
      ten behoeve van het voorbereidend beroepsonderwijs verzorgd in een agrarisch opleidingscentrum: lesmateriaal als
      bedoeld in [artikel 6e van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
  - number: 2.2.1.4
    text: 'De bijdrage in de huisvestingskosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.4.a
    text: huur van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.4.b
    text: investeringen in gebouwen en terreinen, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.4.c
    text: eerste inrichting.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.1.5
    text: |-
      Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een bedrag in
      mindering gebracht in verband met cursusgelden zoals bedoeld in de [Les- en cursusgeldwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 2.2.1.6
    text: |-
      Een in het eerste lid en in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2.2
    text: 'De maatstaven voorzien in bekostiging aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.2.a
    text: de instroom van deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.2.b
    text: |-
      het aantal deelnemers en examendeelnemers dat een diploma als bedoeld in [artikel 7.4.6][ref1] heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.2.2.3
    text: |-
      Voor voorbereidende en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid][ref1], voor zover
      betrekking hebbend op beroepsopleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a en b][ref2], wordt een
      afzonderlijk bedrag berekend, aan de hand van de instroom van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, geldt inschrijving van een deelnemer voor
      twee of meer voltijdse dan wel twee of meer deeltijdse beroepsopleidingen in enig studiejaar als inschrijving voor
      één voltijdse respectievelijk één deeltijdse beroepsopleiding. Inschrijving van een deelnemer voor zowel voltijdse
      als deeltijdse beroepsopleidingen in enig studiejaar geldt voor de toepassing van die maatstaf als inschrijving
      voor een voltijdse opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.5
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, geldt dat een deelnemer of examendeelnemer
      in enig jaar slechts eenmaal wordt meegeteld bij het bepalen van het aantal deelnemers onderscheidenlijk
      examendeelnemers die een diploma als bedoeld in [artikel 7.4.6][ref1] hebben behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.2.2.6
    text: |-
      Bij de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, blijven buiten beschouwing deelnemers
      aan een deeltijdse opleiding waarvoor het bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma, met
      inbegrip van de beroepspraktijkvorming, heeft ingericht dat minder dan 300 uren per volledig studiejaar omvat.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.7
    text: |-
      In de maatstaven, bedoeld in het tweede lid, kan onderscheid worden gemaakt naar groepen van deelnemers en naar
      opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.8
    text: |-
      Deelnemers die niet zijn opgenomen in de basisadministratie persoonsgegevens, bedoeld in de
      [Wet gemeentelijke basisadministratie persoonsgegegevens][ref1], tellen alleen mee, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 2.2.2.8.a
    text: zij onderwijs, daaronder begrepen de beroepspraktijkvorming, in Nederland volgen, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.2.8.b
    text: |-
      zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister kan volgens bij ministeriële regeling te geven voorschriften aan de rijksbijdrage, berekend op
      grond van [artikel 2.2.2][ref1], een bedrag toevoegen in verband met een onevenredig grote toename van het aantal
      deelnemers ten opzichte van het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.2
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, volgens bij ministeriële regeling te
      geven voorschriften ten behoeve van de ontwikkeling van het bestel van het beroepsonderwijs een bedrag toevoegen
      aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.3
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het beroepsonderwijs
      voor het daarop volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en
      vermeldt daarbij afzonderlijk het bedrag voor gehandicapte deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4
  - number: 2.2.4.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4
  - number: 2.2.4.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4
  - number: 2.2.4.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze,
      bedoeld in [artikel 2.2.2][ref1], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze gegevens en de verklaring worden
      ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2.4a.1
    text: |-
      Onze Minister kan het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van een persoon,
      behorend tot gewezen personeel als bedoeld in [artikel 2.2.1, vijfde lid][ref1], uitsluitend in het kader van het
      bepaalde bij of krachtens [artikel 2.2.1, vijfde lid][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.4a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4a
  - number: 2.2.4a.1.b
    text: het bevoegd gezag van de instelling waar de in onderdeel a bedoelde persoon werkzaam was, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4a
  - number: 2.2.4a.1.c
    text: |-
      de instantie die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt
      of heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 2.2.4a.2
    text: |-
      Het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer wordt op een daartoe strekkend
      verzoek van de minister aan de minister verstrekt door het bevoegd gezag van de instelling waar het gewezen
      personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.4a
  - number: 2.2.5.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
  - number: 2.2.5.1.a
    text: |-
      beroepsopleiding: een beroepsopleiding die op grond van [artikel 2.1.1][ref1] voor bekostiging in aanmerking komt;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.5.1.b
    text: |-
      deelnemer: de aan een instelling ingeschreven deelnemer die een beroepsopleiding volgt waarvoor het
      bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma heeft vastgesteld dat, met inbegrip van de
      beroepspraktijkvorming, een omvang van tenminste 300 uren per volledig studiejaar heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
  - number: 2.2.5.2
    text: |-
      Voor de toepassing van deze paragraaf zijn de [artikelen 8a, eerste en tweede lid][ref1],
      [28b, zesde lid tot en met achtste lid][ref2], met uitzondering van het zesde lid, onder f,
      [28c][ref3], met uitzondering van het eerste lid, onder b, en het derde lid, [28d][ref4] en
      [71a van de Wet op de expertisecentra][ref5] van overeenkomstige toepassing met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel28d
      [ref5]: https://wetten.overheid.nl/BWBR0003549#Artikel71a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28b
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 28d
      - id: ref5
        bwb_id: BWBR0003549
        artikel: 71a
  - number: 2.2.5.2.a
    text: 'onder leerling wordt verstaan: deelnemer als bedoeld in het eerste lid, onder b;'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
  - number: 2.2.5.2.b
    text: 'onder ouders van een leerling wordt verstaan: een deelnemer of de ouders, voogden of verzorgers van een deelnemer;'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
  - number: 2.2.5.2.c
    text: |-
      onder een school als bedoeld in de [Wet op het primair onderwijs][ref1] of de
      [Wet op het voortgezet onderwijs][ref2] wordt verstaan: een instelling als bedoeld in
      [artikel 1.1.1, onder b][ref3], en een hogeschool als bedoeld in [artikel 12.3.9][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.2.5.2.d
    text: 'onder schooljaar wordt verstaan: studiejaar.'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.5
  - number: 2.2.6.1
    text: |-
      Het bevoegd gezag van een instelling geeft aan Onze Minister een melding van een inschrijving
      van een deelnemer dan wel een melding van een deelnemer die reeds staat ingeschreven voor
      wie op basis van een beoordeling door een commissie voor de indicatiestelling als bedoeld in
      [artikel 28c van de Wet op de expertisecentra][ref1], een leerlinggebonden budget voor een cluster als bedoeld in
      [artikel 2, vierde lid, onder b, c of d, van de Wet op de expertisecentra][ref2] beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '2'
  - number: 2.2.6.2
    text: |-
      Onder beoordeling, bedoeld in het eerste lid, wordt verstaan een beoordeling als bedoeld in
      [artikel 2.2.5, tweede lid][ref1], juncto [artikel 28c, eerste lid, onder a van de Wet op de expertisecentra][ref2]
      alsmede een beoordeling als bedoeld in [artikel 28c, eerste lid, van de Wet op de expertisecentra][ref3]
      ten behoeve van een leerling in de zin van de [Wet op het primair onderwijs][ref4] of de
      [Wet op het voortgezet onderwijs][ref5] waarvan de duur van de indicatiestelling niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel28c
      [ref4]: https://wetten.overheid.nl/BWBR0003420
      [ref5]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 28c
      - id: ref4
        bwb_id: BWBR0003420
      - id: ref5
        bwb_id: BWBR0002399
  - number: 2.2.6.3
    text: |-
      Indien sprake is van een eerste inschrijving bij een instelling van een deelnemer voor wie een leerlinggebonden
      budget beschikbaar is dan wel indien een dergelijk budget voor het eerst beschikbaar komt voor een deelnemer die al
      staat ingeschreven bij een instelling, wordt met ingang van de eerste dag van de maand volgend op de in het eerste
      lid bedoelde melding aan het bevoegd gezag ten behoeve van die deelnemer een leerlinggebonden budget verleend voor
      de duur of de resterende duur van de indicatiestelling tot een maximum van zeven jaren in het beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
  - number: 2.2.6.4
    text: |-
      Indien een deelnemer voor wie een leerlinggebonden budget beschikbaar is binnen de instelling verandert van
      leerweg, opleiding of opleidingsniveau, als bedoeld in [artikel 7.2.2, tweede en derde lid][ref1], meldt het
      bevoegd gezag deze wijziging onverwijld aan Onze Minister. Met ingang van 1 augustus volgend op deze wijziging
      vervalt het oorspronkelijke leerlinggebonden budget en wordt een nieuw leerlinggebonden budget verleend voor de
      gewijzigde leerweg, de gewijzigde opleiding of het gewijzigde opleidingsniveau voor de duur of de resterende duur
      van de indicatiestelling totdat in totaal zeven jaren leerlinggebonden budget in het beroepsonderwijs voor de
      deelnemer is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.6.5
    text: |-
      Indien de deelnemer, nadat het derde lid is toegepast, beroepsonderwijs aan een andere instelling gaat volgen,
      wordt met ingang van de eerste dag van de maand volgend op de in het eerste lid bedoelde melding aan het
      bevoegd gezag voor de deelnemer een leerlinggebonden budget verleend voor de duur of de resterende duur van de
      indicatiestelling totdat in totaal zeven jaren leerlinggebonden budget in het beroepsonderwijs voor de deelnemer
      is verstrekt. De vorige volzin is van overeenkomstige toepassing op een deelnemer die zich na uitschrijving
      opnieuw bij een instelling inschrijft en voor wie nog niet in totaal zeven jaren leerlinggebonden budget in het
      beroepsonderwijs is verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
  - number: 2.2.6.6
    text: |-
      Indien de deelnemer de instelling verlaat of niet langer een beroepsopleiding volgt, vervalt het leerlinggebonden
      budget met ingang van de eerste dag van de maand na de datum van het uitschrijven van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
  - number: 2.2.6.7
    text: |-
      Het leerlinggebonden budget wordt berekend op een bij of krachtens algemene maatregel van bestuur vastgestelde
      wijze.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.6
  - number: 2.2.7
    text: |-
      Bij de melding, bedoeld in [artikel 2.2.6, eerste lid][ref1], geeft het bevoegd gezag tevens aan bij welke school
      voor speciaal onderwijs of voortgezet speciaal onderwijs het bij of krachtens algemene maatregel van bestuur
      te bepalen deel van het leerlinggebonden budget wordt besteed. Op grond van deze melding kent Onze Minister
      onverminderd [artikel 2.2.6, zesde lid][ref2], dat deel van het leerlinggebonden budget toe aan laatstbedoelde
      school.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.2.8.1
    text: |-
      Het bevoegd gezag van een instelling waar een deelnemer is ingeschreven voor wie een leerlinggebonden budget
      beschikbaar is, stelt in overeenstemming met de deelnemer of indien de deelnemer minderjarig is met de deelnemer en
      de ouders, voogden of verzorgers van de deelnemer voor elk studiejaar een handelingsplan op. Indien de inschrijving
      van de in de eerste volzin bedoelde deelnemer plaatsvindt op of na 1 augustus wordt het handelingsplan zo spoedig
      mogelijk doch uiterlijk een maand na die inschrijving opgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.8
  - number: 2.2.8.2
    text: |-
      In het handelingsplan dat betrekking heeft op het laatste studiejaar van de periode gedurende welke voor de
      deelnemer een indicatie voor leerlinggebonden budget beschikbaar is, wordt aangegeven dat de voortzetting van de
      voorzieningen die voor de deelnemer zijn getroffen op basis van het leerlinggebonden budget, afhankelijk is van een
      nieuwe beoordeling door een commissie voor de indicatiestelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.8
  - number: 2.2.8.3
    text: |-
      Het bevoegd gezag evalueert jaarlijks het handelingsplan met de deelnemer of indien de deelnemer minderjarig is met
      de deelnemer en de ouders, voogden of verzorgers van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2.8
  - number: 2.2a.1.1
    text: |-
      De rijksbijdrage voor het voortgezet algemeen volwassenenonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde
      aanspraak betrekking heeft wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde
      middelen, per instelling berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.2a.1.2
    text: |-
      [Artikel 2.2.1, derde lid, onder a tot en met k, en vierde lid][ref1], zijn van overeenkomstige toepassing,
      met dien verstande dat in onderdeel i onder gewezen personeel mede wordt begrepen personeel dat was belast met
      werkzaamheden op het gebied van het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2a.2.1
    text: |-
      De in [artikel 2.2a.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2a.2.2
    text: 'De maatstaven voorzien in bekostiging aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.2.a
    text: het aantal ingeschreven deelnemers,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.2.b
    text: |-
      het aantal deelnemers dat bij de instelling een diploma van onderwijs als bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1] heeft behaald en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 2.2a.2.2.c
    text: |-
      het aantal deelnemers dat bij de instelling een eindexamen of deeleindexamen heeft afgelegd in onderwijs als
      bedoeld in de [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 2.2a.2.3
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, blijven deelnemers die niet bij een
      instelling staan ingeschreven op een bij algemene maatregel van bestuur vastgesteld tijdstip buiten beschouwing en
      kan onderscheid worden gemaakt naar het aantal vakken waarvoor een deelnemer is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder c, kan onderscheid worden gemaakt naar het
      aantal vakken waarin de deelnemer met goed gevolg examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.5
    text: |-
      Deelnemers die niet zijn opgenomen in de basisadministratie persoonsgegevens, bedoeld in de Wet gemeentelijke
      basisadministratie persoonsgegevens, tellen alleen mee voor de toepassing van dit artikel, indien:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.5.a
    text: zij onderwijs in Nederland volgen, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.5.b
    text: |-
      zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.2.6
    text: Examendeelnemers tellen niet mee voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.2
  - number: 2.2a.3.1
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, volgens bij ministeriële regeling te
      geven voorschriften ten behoeve van de ontwikkeling van het bestel van het voortgezet algemeen volwassenenonderwijs
      een bedrag toevoegen aan de rijksbijdrage, berekend op grond van [artikel 2.2a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2a.3.2
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.3
  - number: 2.2a.4.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het daarop volgende
      jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en vermeldt daarbij
      afzonderlijk het bedrag voor gehandicapte deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.4
  - number: 2.2a.4.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.4
  - number: 2.2a.4.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.4
  - number: 2.2a.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze titel. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.4
  - number: 2.2a.4.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze,
      bedoeld in [artikel 2.2a.2][ref1] , gaan vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze gegevens en de verklaring worden
      ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.2a.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.3.1
    text: |-
      Mede ten behoeve van de opleidingen educatie, bedoeld in [artikel 7.3.1, eerste lid, onder b tot en met f][ref1],
      ontvangt de gemeente op grond van de [Wet participatiebudget][ref2] een uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0025039
  - number: 2.3.3
    text: |-
      De gemeente waaraan een uitkering is verstrekt op grond van de [Wet participatiebudget][ref1]
      waaruit een bedrag moet worden besteed bij regionale opleidingencentra als bedoeld in
      [artikel 14 van de Wet participatiebudget][ref2], besluit jaarlijks voor 1 november tot een bij algemene
      maatregel van bestuur te bepalen tijdstip ten behoeve van het daaropvolgende kalenderjaar, welk deel van
      die uitkering zal worden bestemd voor educatieve activiteiten, onderscheiden naar de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b tot en met f][ref3], en in voorkomende gevallen naar doelgroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0025039
      [ref2]: https://wetten.overheid.nl/BWBR0025039#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0025039
      - id: ref2
        bwb_id: BWBR0025039
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.3.4.1
    text: |-
      Tot een bij algemene maatregel van bestuur te bepalen tijdstip berust in afwijking van
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] de betaling van de bedragen aan de regionale opleidingencentra
      voor de opleidingen educatie, bedoeld in [artikel 7.3.1, eerste lid, onder b tot en met f][ref2], op een door
      het college met het bevoegd gezag van het desbetreffende regionale opleidingencentrum gesloten overeenkomst of
      overeenkomsten. De [titels 4.1][ref3] en [4.2 van de Algemene wet bestuursrecht][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0005537
  - number: 2.3.4.2
    text: 'Een overeenkomst als bedoeld in het eerste lid heeft ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.a
    text: de aard van de activiteiten,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.b
    text: het aantal contacturen, onderscheiden naar opleidingen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.c
    text: de periode,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.d
    text: de omvang van het bedrag, dan wel de wijze waarop dit berekend wordt,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.e
    text: de wijze waarop het bedrag ter beschikking wordt gesteld, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.2.f
    text: de wijze waarop verantwoording jegens het gemeentebestuur wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.4.3
    text: Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld voor contacturen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.4
  - number: 2.3.6.1
    text: |-
      De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot de educatie en verlenen desgevraagd medewerking aan door of namens
      Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6
  - number: 2.3.6.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van beschikbaarstelling van de in
      het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6
  - number: 2.3.6a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een opleiding educatie gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een opleiding educatie aan Onze
      Minister, tezamen de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.b
    text: de datum van inschrijving of einde inschrijving;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.c
    text: de opleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.d
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.e
    text: het educatieprogramma (vakken);
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.f
    text: |-
      de behaalde certificaten en de data waarop de certificaten zijn behaald, alsmede de vakken waarin examen is
      afgelegd, de cijfers van het schoolexamen en het centraal examen, de eindcijfers en de uitslag van het eindexamen
      of het deeleindexamen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.g
    text: |-
      het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald alsmede, voor zover het
      Nederlands als tweede taal (NT2) betreft, het startniveau;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.h
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.i
    text: indien van toepassing het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.j
    text: indien van toepassing het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.k
    text: het aantal uren per week dat onderwijs wordt gevolgd aan de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.l
    text: indien van toepassing de reden van het uitstromen; en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.m
    text: de locatie waar het onderwijs wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en vijfde lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en vijfde lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de
      tijdstippen en de wijze van verstrekking van de gegevens, bedoeld in het tweede en vijfde lid. Bij de ministeriële
      regelingen, bedoeld in de eerste en tweede volzin, kan onderscheid worden gemaakt tussen het voortgezet algemeen
      volwassenenonderwijs en de overige educatie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.4
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.1.8, eerste lid][ref1], het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6a.5
    text: |-
      Indien de gegevens over de nationaliteit van de deelnemer niet zijn opgenomen in de gemeentelijke
      basisadministratie persoonsgegevens worden deze gegevens door het bevoegd gezag verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.6
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.7
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding educatie in het contact
      met een andere instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving
      van die deelnemer. Onder dit contact wordt mede begrepen de uitwisseling van leergegevens en direct met het
      leren samenhangende begeleidingsgegevens. Bij algemene maatregel van bestuur worden de gegevens, bedoeld in de
      vorige volzin, gespecificeerd. Het bevoegd gezag bewaart in de administratie van de instelling een verklaring van
      instemming van de deelnemer met de uitwisseling van de gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6a.8
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een opleiding educatie ter
      uitvoering van [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.3.6a.9
    text: |-
      De in het zevende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6a
  - number: 2.3.6b.1
    text: |-
      Onze Minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld
      in [artikel 2.3.6a, tweede en zesde lid][ref1], op in het basisregister onderwijs, nadat zij deze gegevens heeft
      getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens, inclusief de gegevens, bedoeld in
      [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals zij voornemens is die
      gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onze Minister kan de door het bevoegd
      gezag verstrekte gegevens uitsluitend met instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
  - number: 2.3.6b.2
    text: |-
      Het bevoegd gezag verstrekt Onze Minister alle inlichtingen die zij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6b
  - number: 2.3.6c.1
    text: 'Gegevens inzake educatie uit het basisregister onderwijs kunnen worden gebruikt door:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6c
  - number: 2.3.6c.1.a
    text: Onze Minister voor zover deze gegevens noodzakelijk zijn voor de begrotings- en beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6c
  - number: 2.3.6c.1.b
    text: de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6c
  - number: 2.3.6c.2
    text: |-
      Het gebruik, bedoeld in het eerste lid, ziet uitsluitend op gegevens die niet herleid of herleidbaar zijn tot
      individuele deelnemers aan een opleiding educatie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6c
  - number: 2.3.6c.3
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en tweede lid, in ieder geval omtrent
      de inhoud en de samenstelling van de desbetreffende gegevens, de wijze waarop de gegevens uit het basisregister
      onderwijs worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt en de perioden waarop de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6c
  - number: 2.3.6d
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door
      de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een opleiding educatie of een
      voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.a
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.b
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.c
    text: |-
      verwerking van de gegevens, bedoeld in [24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1] en in
      [artikel 8.1.8a, vierde lid][ref2], bij de registraties, bedoeld in onderdeel a, en het systeem van doorverwijzing,
      bedoeld in onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.4.1.1
    text: |-
      De rijksbijdrage voor de kenniscentra beroepsonderwijs bedrijfsleven waarop de in [artikel 1.5.1][ref1] bedoelde
      aanspraak betrekking heeft wordt, binnen het raam van de door begrotingswetgever beschikbaar gestelde middelen,
      per kenniscentrum berekend aan de hand van maatstaven, neergelegd in een berekeningswijze, vastgesteld bij of
      krachtens algemene maatregel van bestuur. De maatstaven hebben in elk geval betrekking op de aard en de omvang van
      de werkzaamheden, bedoeld in [artikel 1.5.2][ref2], voor zover niet verricht in het kader van dienstverlening. Wat
      huisvestingskosten betreft wordt de rijksbijdrage berekend hetzij op grond van die berekeningswijze hetzij op grond
      van een andere bij of krachtens algemene maatregel van bestuur te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.4.1.2
    text: |-
      Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een bedrag
      in mindering gebracht in verband met werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede
      uitkeringen wegens ziekte en arbeidsongeschiktheid anders dan op grond van de [Ziektewet][ref1] aan gewezen
      personeel van kenniscentra beroepsonderwijs bedrijfsleven. De [artikelen 2.2.1, vijfde lid, tweede volzin][ref2],
      en [2.2.4a][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.3
    text: |-
      Een in het eerste lid en in het tweede lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.1
  - number: 2.4.2.1
    text: |-
      Onze Minister maakt aan elk kenniscentrum beroepsonderwijs bedrijfsleven jaarlijks in september bekend, welke
      rijksbijdrage voor het daarop volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage
      is berekend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.2
  - number: 2.4.2.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.2
  - number: 2.4.2.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.2
  - number: 2.4.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Indien bijzondere ontwikkelingen in het beroepsonderwijs daartoe aanleiding geven, kan volgens bij ministeriële
      regeling te stellen voorwaarden aan de kenniscentra beroepsonderwijs bedrijfsleven voor een bij die regeling te
      bepalen periode een aanvullende rijksbijdrage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.4.3
  - number: 2.5.3.1
    text: Het bevoegd gezag stelt jaarlijks een jaarrekening vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.2
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financiële beheer van de instelling voor
      zover het betreft de ingevolge deze wet uit ’s Rijks kas ontvangen middelen. Uit de jaarrekening dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de rijksbijdrage. Van niet doelmatige aanwending
      van de rijksbijdrage is in ieder geval sprake voorzover bedragen daaruit worden aangewend voor het op enigerlei
      wijze compenseren van de deelnemers of examendeelnemers voor les- en cursusgeld respectievelijk examengeld.
      Bij ministeriële regeling kunnen met het oog op de verantwoording van de rechtmatigheid en doelmatigheid van de
      aanwending van de rijksbijdrage nadere voorschriften worden gegeven voor de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.3
    text: |-
      Het resultaat van het jaar waarop de jaarrekening betrekking heeft wordt verrekend met de algemene reserve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.4
    text: |-
      Het bevoegd gezag dient de jaarrekening voor 1 juli van het jaar volgend op het boekjaar bij Onze
      Minister in. De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.5.3.5
    text: Het bevoegd gezag maakt de jaarrekening, vergezeld van de verklaring, bedoeld in het vierde lid, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.6
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de berekeningswijze,
      bedoeld in de [artikelen 2.2.2][ref1] en [2.2.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.5.3.7
    text: |-
      Het bevoegd gezag houdt per begrotingsjaar nauwkeurig boek van baten en lasten en draagt er zorg voor dat de baten
      en lasten nauwkeurig en herkenbaar zijn verwerkt in de in het zesde lid bedoelde informatieverzameling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.8
    text: |-
      Het bevoegd gezag bewaart de informatieverzameling en de desbetreffende boeken en bescheiden, bedoeld in het zesde
      en zevende lid, gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.3.9
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van beschikbaarstelling
      van de gegevens en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.3
  - number: 2.5.4.1
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het afgelopen jaar vast en maakt het openbaar. Het
      jaarverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.6, tweede lid][ref1], voorzover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten
      van de bevindingen van de inspectie met betrekking tot de examens. Ook legt het bevoegd gezag in het jaarverslag
      verantwoording af over de omgang met een branchecode voor goed bestuur. Bij ministeriële regeling kan een
      branchecode worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 2.5.4.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.4
  - number: 2.5.5.1
    text: |-
      De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het beroepsonderwijs en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5
  - number: 2.5.5.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de wijze van beschikbaarstelling van de
      in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5
  - number: 2.5.5.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5
  - number: 2.5.5a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft, of, indien de deelnemer minderjarig is, met de ouders,
      voogden of verzorgers van deze deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een beroepsopleiding aan Onze
      Minister, tezamen met de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.b
    text: de datum van inschrijving of van de wijziging of beëindiging daarvan;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.c
    text: |-
      de code, bedoeld in [artikel 6.4.1, tweede lid, onder a][ref1], van het opleidingsdomein, het kwalificatiedossier
      of de kwalificatie waarvoor de deelnemer is ingeschreven en bij inschrijving voor een opleidingsdomein of een
      kwalificatiedossier het niveau, bedoeld in [artikel 7.2.2, derde lid][ref2], van de beroepsopleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.5.5a.2.d
    text: de leerweg;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.e
    text: het al dan niet hebben van een handicap of chronische ziekte die extra ondersteuning vraagt van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.f
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.h
    text: het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.i
    text: |-
      de omvang van beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvorming verzorgt; en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.j
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.l
    text: het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.m
    text: indien van toepassing het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.n
    text: het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.o
    text: indien van toepassing de reden van het uitstromen; en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.p
    text: de locatie waar het onderwijs wordt gevolgd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en zevende lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding, al dan niet tezamen
      met een of meer van de gegevens, bedoeld in het tweede en zevende lid, gebruiken in het verkeer met Onze Minister
      ten behoeve van de vaststelling van de bekostiging van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1], gebruiken het
      persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in contacten met een gemeente in het kader van
      de [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      die wet door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
  - number: 2.5.5a.6
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.1.8, eerste lid][ref1], het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5a.7
    text: |-
      Indien de gegevens over de nationaliteit van de deelnemer niet zijn opgenomen in de gemeentelijke
      basisadministratie persoonsgegevens worden deze gegevens door het bevoegd gezag verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.8
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het kader van
      de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het contact
      met een andere instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving
      van die deelnemer. Onder dit contact wordt mede begrepen de uitwisseling van leergegevens en direct met het
      leren samenhangende begeleidingsgegevens. Bij algemene maatregel van bestuur worden de gegevens, bedoeld in de
      vorige volzin, gespecificeerd. Het bevoegd gezag bewaart in de administratie van de instelling een verklaring van
      instemming van de deelnemer met de uitwisseling van de gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5a.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een beroepsopleiding ter uitvoering
      van [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.5.5a.11
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref1] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref2] en [artikel 2.2.5, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.5.5a.12
    text: |-
      De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5a
  - number: 2.5.5b.1
    text: |-
      Onze Minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld
      in [artikel 2.5.5a, tweede en zevende lid][ref1], op in het basisregister onderwijs, nadat zij deze gegevens
      heeft getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens, inclusief de gegevens,
      bedoeld in [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals zij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd
      [artikel 2.5.5c, tweede lid][ref3], kan Onze Minister de door het bevoegd gezag verstrekte gegevens uitsluitend met
      instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5b.2
    text: |-
      Het bevoegd gezag verstrekt Onze Minister alle inlichtingen die zij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5b
  - number: 2.5.5b.3
    text: |-
      Indien Onze Minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te nemen dat
      een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet en een onderzoek
      daarnaar door de inspectie nodig acht, verstrekt Onze Minister ten behoeve van dit onderzoek de persoonsgebonden
      nummers en andere gegevens van deelnemers aan een beroepsopleiding aan de inspectie. De inspectie meldt de uitkomst
      van het onderzoek aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5b
  - number: 2.5.5b.4
    text: |-
      Onze Minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1] geen gegevens die zij op grond van het derde lid
      hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.5.5c.1
    text: 'Gegevens inzake beroepsonderwijs uit het basisregister onderwijs kunnen worden gebruikt door:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
  - number: 2.5.5c.1.a
    text: |-
      Onze Minister voor zover deze gegevens noodzakelijk zijn voor de bekostiging van instellingen en de begrotings-
      en beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
  - number: 2.5.5c.1.b
    text: de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
  - number: 2.5.5c.2
    text: |-
      Voor zover de door het bevoegd gezag op grond van [artikel 2.5.5a][ref1] verstrekte gegevens naar het oordeel van
      Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling van de bekostiging van
      deze gegevens afwijken, in welk geval de door Onze Minister vastgestelde gewijzigde gegevens worden opgenomen in
      het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5c.3
    text: |-
      Het gebruik, bedoeld in het eerste lid, ziet uitsluitend op gegevens die niet herleid of herleidbaar zijn tot
      individuele deelnemers aan een beroepsopleiding, onverminderd [artikel 2.5.5b, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5c.4
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval omtrent
      de inhoud en de samenstelling van de desbetreffende gegevens, de wijze waarop de gegevens uit het basisregister
      onderwijs worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt en de perioden waarop de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
  - number: 2.5.5c.5
    text: |-
      In afwijking van het derde lid wordt bij algemene maatregel van bestuur bepaald in welke gevallen en onder welke
      voorwaarden Onze Minister gegevens als bedoeld in [artikel 2.5.5a, tweede lid][ref1], kan gebruiken tezamen met
      het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding ten behoeve van de vaststelling van de
      bekostiging van een instelling, alsmede welke gegevens dit gebruik kan betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5e
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door
      de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding of een
      voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 2.5.5e.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.d
    text: |-
      verwerking van de gegevens, bedoeld in [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1]
      en in [artikel 8.1.8a, vierde lid][ref2], bij de registraties, bedoeld in de onderdelen a en b, en het systeem van
      doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.6
    text: |-
      Onze Minister kan naast het accountantsonderzoek, bedoeld in [artikel 2.5.3, vierde lid][ref1], een onderzoek
      instellen of doen instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 2.5.5][ref2], naar de
      rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.7a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.7a
  - number: 2.5.9.1
    text: |-
      Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de
      correctie met de rijksbijdrage voor het desbetreffende jaar of betaalt uit in dat jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.9
  - number: 2.5.9.2
    text: |-
      Indien uit de jaarrekening, uit de verklaring van de accountant, bedoeld in [artikel 2.5.3, vierde lid][ref1], uit
      de resultaten van het onderzoek, bedoeld in [artikel 2.5.6][ref2], of uit de resultaten van het onderzoek, bedoeld
      in [artikel 2.5.7][ref3] blijkt dat de rijksbijdrage op onjuiste gronden is vastgesteld dan wel de besteding
      daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister binnen een jaar na ontvangst van de jaarrekening
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen een jaar na ontvangst van
      de jaarrekening een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de correctie met de
      rijksbijdrage voor het eerstvolgende jaar of betaalt uit in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.9.3
    text: |-
      Onverminderd het eerste en tweede lid is Onze Minister bevoegd tot verrekening van vorderingen krachtens deze wet
      van of op het bevoegd gezag van een instelling met vorderingen krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.9
  - number: 2.5.9a
    text: |-
      De [artikelen 2.5.3][ref1], [2.5.4][ref2], [2.5.6][ref3], [2.5.7][ref4], [2.5.7a][ref5] en [2.5.9][ref6] zijn van
      overeenkomstige toepassing op de rijksbijdrage voor het voortgezet algemeen volwassenenonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.9a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.10
    text: |-
      De [artikelen 2.5.2 tot en met 2.5.9][ref1] zijn van overeenkomstige toepassing op de kenniscentra beroepsonderwijs
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.1
    text: 'Een scholengemeenschap omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
  - number: 2.6.1.a
    text: |-
      een regionaal opleidingencentrum en een school voor voortgezet onderwijs als bedoeld in de
      [Wet op het voortgezet onderwijs][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 2.6.1.b
    text: |-
      een agrarisch opleidingscentrum en een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 9 van de Wet op het voortgezet onderwijs][ref1] of een school voor praktijkonderwijs als bedoeld in
      [artikel 10f van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 2.6.1a
    text: |-
      Ten aanzien van een school voor voortgezet onderwijs die deel uitmaakt van een scholengemeenschap als bedoeld
      in het eerste lid, bestaat aanspraak op rijksbijdrage ten aanzien van de huisvesting, waarvoor bij of krachtens
      algemene maatregel van bestuur een berekeningswijze wordt vastgesteld. [Hoofdstuk 2, titel 8][ref1], is van
      overeenkomstige toepassing ten aanzien van een scholengemeenschap als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      In afwijking van de [Wet medezeggenschap op scholen][ref1] zijn de bepalingen inzake de medezeggenschap bij of
      krachtens de [Wet op de ondernemingsraden][ref2] en deze wet van toepassing op scholengemeenschappen als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0020685
      - id: ref2
        bwb_id: BWBR0002747
  - number: 2.6.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van scholengemeenschappen
      als bedoeld in het eerste lid nadere voorschriften worden gegeven, zo nodig in afwijking van
      [hoofdstuk 1, titel 3, paragraaf 3][ref1], [hoofdstuk 2][ref2], [hoofdstuk 4][ref3] en [hoofdstuk 7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 2.6a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten behoeve van het voorbereidend beroepsonderwijs, verzorgd in
      agrarische opleidingscentra, worden vastgesteld dat het bepaalde bij of krachtens deze wet geheel of gedeeltelijk
      niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6a
  - number: 2.6aa.1
    text: |-
      Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in en met inachtneming
      van [artikel 25a van de Wet op het voortgezet onderwijs][ref2] ook tot onderwijs- en examenvoorzieningen van de
      instelling toelaten zij die niet als deelnemer of examendeelnemer aan de instelling worden ingeschreven maar zijn
      ingeschreven als leerling aan een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 2.6aa.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld over de verantwoording van de bedragen
      die het bevoegd gezag met toepassing van [artikel 99, achtste lid, van de Wet op het voortgezet onderwijs][ref1]
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
  - number: 2.6aa.3
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet onderwijs ter uitvoering van
      [artikel 25a, eerste en tweede lid, van de Wet op het voortgezet onderwijs][ref1] leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een instelling
      van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen van het
      [derde lid, aanhef en onder a tot en met e, van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: '2.7'
    text: |-
      Onze Minister kan volgens bij ministeriële regeling te geven voorschriften aan andere rechtspersonen dan
      die waarvan de instellingen uitgaan, een bijdrage toekennen ter bevordering van de verwezenlijking van de in
      [artikel 1.2.1][ref1] bedoelde doelstellingen van de educatie en het beroepsonderwijs dan wel ten behoeve van
      de afstemming tussen onderwijs en arbeidsmarkt. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 2.8.1.1
    text: |-
      Elke instelling is aangesloten bij de door de bevoegde gezagsorganen gezamenlijk opgerichte rechtspersoon met
      volledige rechtsbevoegdheid, zonder winstoogmerk, die zich ten doel stelt zich borg te stellen voor de nakoming
      van rente- en aflossingsverplichtingen, voortvloeiend uit de door het bevoegd gezag van de instelling aangegane
      leningen, door instandhouding van een onafhankelijk functionerend fonds met een onafhankelijk van de instellingen
      functionerend bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.2
    text: |-
      Elke instelling draagt aan het fonds op zodanige wijze bij, dat door de gezamenlijke bijdragen het functioneren van
      het fonds is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3
    text: |-
      De gezamenlijke instellingen dragen er zorg voor dat in de statuten van de rechtspersoon, bedoeld in het eerste
      lid, in elk geval is opgenomen:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.a
    text: |-
      dat ingeval van door de rechtspersoon te stellen algemene voorwaarden aan het verlenen van borgstelling, deze
      uitsluitend van financiële aard zijn en uitsluitend betrekking hebben op de te waarborgen lening,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.b
    text: |-
      dat ingeval de instelling aan de onder *a* bedoelde voorwaarden voldoet, borgstelling door de rechtspersoon niet
      kan worden geweigerd,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.c
    text: |-
      dat als blijkt dat een instelling niet in staat is tot nakoming van rente- en aflossingsverplichtingen, de
      instelling verplicht is een saneringsplan aan het waarborgfonds over te leggen, waarin is aangegeven op welke wijze
      en binnen welke termijn het evenwicht tussen inkomsten en uitgaven van de instelling hersteld kan worden,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.d
    text: |-
      dat de door de rechtspersoon te stellen voorwaarden in het kader van door hem te waarborgen leningen niet in strijd
      komen met de vrijheid van organisatie en inrichting van het onderwijs binnen de instellingen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.e
    text: |-
      dat een batig saldo van het fonds kan worden uitgekeerd aan de bevoegde gezagsorganen van de instellingen, onder de
      voorwaarde dat een uitkering door het bevoegd gezag van een instelling uitsluitend wordt besteed ten behoeve van de
      werkzaamheden van de instelling waarvoor de rijksbijdrage wordt verleend, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.3.f
    text: |-
      een regeling omtrent de te volgen procedure en te treffen voorzieningen in geval van taakverwaarlozing door het
      bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.1.4
    text: |-
      Van de in het eerste lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag van een
      bijzondere instelling ontheffing verlenen op grond van bedenkingen van godsdienstige of levensbeschouwelijke aard.
      Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening
      is getroffen voor het waarborgen van het voortbestaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.1
  - number: 2.8.2.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere instelling
      draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de bekostiging, zorg
      voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld
      van een verklaring omtrent de getrouwheid van een door de raad van toezicht of het bevoegd gezag aangewezen
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.8.2.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.2
  - number: 2.8.2.3
    text: |-
      Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven deelnemers het onderwijs aan een andere instelling kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.2
  - number: 2.8.3
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.8.3
  - number: 4.1.1
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.1
  - number: 4.1.1a
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.1a
  - number: 4.1.2.1
    text: Het bevoegd gezag stelt een regeling vast voor de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.2
  - number: 4.1.2.2
    text: |-
      Over de regelingen die gaan over aangelegenheden die van algemeen belang zijn voor de rechtspositie van het
      personeel van de instelling, wordt door of namens het bevoegd gezag overlegd met de vakorganisaties van overheids-
      en onderwijspersoneel die daarvoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.2
  - number: 4.1.2.3
    text: |-
      De bepalingen over ontslag verschaffen het personeel van de openbare instellingen niet minder rechten dan
      die welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 4.1.2.4
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven over de maximale beloning van de leden van
      het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.2
  - number: 4.1.2.5
    text: |-
      In geval van een onherroepelijk vonnis tot faillietverklaring van een instelling, voorzien de
      bevoegde gezagsorganen van de overige instellingen er gezamenlijk in dat aan de aanspraken, bedoeld in
      [artikel 79, eerste lid, van de Werkloosheidswet][ref1], van het personeel en gewezen personeel, wordt voldaan,
      evenals aan de aanspraken die in het overleg, bedoeld in het tweede lid, zijn overeengekomen en als aanvulling
      gelden op de wettelijke aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
  - number: 4.1.3
    text: |-
      Met het oog op de voortdurende verbetering van de professionaliteit van het personeel, wordt door of namens
      de bevoegde gezagsorganen in overeenstemming met vakorganisaties van overheids- en onderwijspersoneel een
      professioneel statuut vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.3
  - number: 4.1.5.1
    text: |-
      Elke bijzondere instelling is aangesloten bij een commissie van beroep, waarbij door elk personeelslid van die
      instelling dat rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen een beslissing, door het
      bevoegd gezag genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.1.c
    text: |-
      ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], is bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 4.1.5.1.d
    text: het direct of indirect onthouden van bevordering,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.1.e
    text: het verminderen van de omvang van de betrekking, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.1.f
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.5.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.5
  - number: 4.1.6.1
    text: Een commissie van beroep strekt haar werkzaamheden uit over een of meer bijzondere instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.2
    text: |-
      De commissie bestaat uit een even aantal gewone leden en evenveel plaatsvervangende leden. De bevoegde
      gezagsorganen en het personeel van de aangesloten instellingen kiezen elk de helft van het aantal gewone leden en
      plaatsvervangende leden. De gewone leden kiezen de voorzitter, tevens lid, en de plaatsvervangend voorzitter. De
      voorzitter, de plaatsvervangend voorzitter, de gewone leden en de plaatsvervangende leden worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaren. Zij zijn opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.3
    text: |-
      De leden en de plaatsvervangende leden, alsmede de voorzitter en de plaatsvervangend voorzitter mogen niet behoren
      tot het bevoegd gezag noch deel uitmaken van het personeel van een aangesloten instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen, alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van de derde volzin wordt verleend, wordt de betrokkene van het voornemen tot ontslag in kennis
      gesteld en wordt hem de gelegenheid gegeven zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.5
    text: De uitspraak van de commissie van beroep bindt het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.6
    text: |-
      De bevoegde gezagsorganen van de aangesloten instellingen stellen voor de commissie van beroep een beroepsreglement
      vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is gewaarborgd. In het
      beroepsreglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.6.a
    text: de omvang van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.6.b
    text: de zittingstermijn van de leden en plaatsvervangende leden van de commissie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.6.c
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.6.d
    text: de wijze waarop in het secretariaat wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.6.7
    text: |-
      Het beroepsreglement wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging is
      gehoord.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.6
  - number: 4.1.7
    text: |-
      Het bevoegd gezag en het personeel van de instelling verstrekken aan de commissie van beroep de inlichtingen die
      zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.1.7
  - number: 4.2.1.1
    text: Docenten worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
  - number: 4.2.1.2
    text: 'Tot docent aan een instelling kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
  - number: 4.2.1.2.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 4.2.1.2.b
    text: |-
      voldoet aan de bekwaamheidseisen, bedoeld in [artikel 4.2.3, eerste lid][ref1], blijkend uit het bezit van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1.2.b.1°
    text: |-
      een getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] van een met goed
      gevolg afgelegd afsluitend examen van een aan een hogeschool verbonden opleiding gericht op het beroep van leraar
      in het voortgezet onderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 4.2.1.2.b.2°
    text: |-
      een getuigschrift als bedoeld in artikel 175 van de Wet op het hoger beroepsonderwijs van een met goed gevolg
      afgelegd staatsexamen, voor zover overeenkomend met een getuigschrift als bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.1
  - number: 4.2.1.2.b.3°
    text: |-
      een getuigschrift als bedoeld in
