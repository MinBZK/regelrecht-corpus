        hoofdstuk: '8'
  - number: 1.4.1.1.e
    text: |-
      de vooropleidingseisen, bedoeld in [artikel 8.2.1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.f
    text: de opneming in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
  - number: 1.4.1.3
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister de nodige inlichtingen omtrent de instelling.
      Het bevoegd gezag doet Onze Minister jaarlijks voor 1 maart een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
  - number: 1.4.1.4
    text: |-
      Voor zover ten aanzien van een instelling toepassing is gegeven aan het eerste lid, wordt die instelling voor de
      toepassing van deze wet aangemerkt als een niet uit ’s Rijks kas bekostigde instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
  - number: 1.4.1.5
    text: |-
      [Artikel 1.3.8, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing op instellingen als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '4'
  - number: 1.4.1.6
    text: |-
      Voor een andere dan een in [artikel 1.1.1, onderdeel b][ref1], bedoelde instelling of een instelling zijn
      voor zover het betreft een beroepsopleiding ten aanzien waarvan toepassing is gegeven aan het eerste lid van
      overeenkomstige toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 1.4.1.6.a
    text: |-
      de [artikelen 2.5.5a, eerste, tweede, vijfde tot en met zevende, en negende tot en met twaalfde lid][ref1],
      met dien verstande dat van de gegevens, bedoeld in artikel 2.5.5a, tweede lid, uitsluitend worden verstrekt de
      gegevens, bedoeld in de onderdelen a tot en met d, h tot en met j, en l en o en p, van dat lid;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
