      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.2.3b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.3b.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven. Onze Minister maakt de waarschuwing openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.2.3b
  - number: 6.2.3b.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.2.3b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.1.1
    text: |-
      De aanvraag om toepassing van [artikel 1.6.1][ref1] geldt mede als aanmelding voor registratie in het Centraal
      register. Het bevoegd gezag van een exameninstelling verschaft bij de aanmelding de gegevens waaruit blijkt
      dat de examinering van voldoende kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde, bedoeld in
      [artikel 1.6.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.1.2
    text: |-
      Indien Onze Minister de aanvraag om toepassing van [artikel 1.6.1][ref1] inwilligt, registreert hij bij de
      eerstvolgende gelegenheid daartoe, de exameninstelling bij de desbetreffende opleiding in het Centraal register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.2
    text: |-
      [Artikel 6.2.3b][ref1] is van overeenkomstige toepassing op exameninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.3.1
    text: |-
      In het geval, bedoeld in [artikel 6.3.2, eerste lid][ref1], kan Onze Minister op verzoek van het bevoegd gezag of
      uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.3.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een externe deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.3
  - number: 6.3.3.3
    text: |-
      Onze Minister stelt regels omtrent de toekenning van en verantwoording over maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.3.3
  - number: 6.4.1.1
    text: |-
      Het Centraal register beroepsonderwijs is een systematisch geordende verzameling gegevens met betrekking tot
      de opleidingsdomeinen, kwalificatiedossiers en kwalificaties in het beroepsonderwijs, de instellingen en de
      exameninstellingen. Onze Minister is belast met de aanleg, het beheer en de bekendmaking van het register en met
      het verstrekken van informatie uit het register. De bekendmaking en het verstrekken van informatie kunnen digitaal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.2
    text: 'Het Centraal register bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.2.a
    text: de naam en de code van de opleidingsdomeinen, de kwalificatiedossiers en de bijbehorende kwalificaties,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.2.b
    text: de studielast van de beroepsopleidingen die gericht zijn op de kwalificaties, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.2.c
    text: |-
      of in een kwalificatiedossier ten behoeve van een kwalificatie vereisten zijn opgenomen die bij of krachtens wet
      zijn vastgesteld voor het beroep waarop de kwalificatie is gericht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3
    text: 'Het Centraal register bevat voorts per kwalificatie de volgende gegevens, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.a
    text: de namen van de uit ’s Rijks kas bekostigde instellingen
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.a.1
    text: die blijkens de opgave van het aantal deelnemers daadwerkelijk de desbetreffende beroepsopleiding verzorgen,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.a.2
    text: |-
      waaraan de rechten, genoemd in [artikel 1.3.1][ref1], met betrekking tot de desbetreffende beroepsopleiding zijn
      ontnomen en de ingangs- en einddatum daarvan,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.4.1.3.a.3
    text: waaraan het recht op examinering van de desbetreffende beroepsopleiding is ontnomen en de ingangsdatum daarvan,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.b
    text: de namen van de niet uit ’s Rijks kas bekostigde instellingen
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.b.1
    text: |-
      waaraan het recht, bedoeld in [artikel 1.4.1, eerste lid][ref1], met betrekking tot de desbetreffende
      beroepsopleiding is toegekend en die niet te kennen hebben gegeven dat zij deze beroepsopleiding niet langer zullen
      verzorgen,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.4.1.3.b.2
    text: |-
      waaraan het recht, bedoeld in [artikel 1.4.1, eerste lid][ref1], met betrekking tot de desbetreffende
      beroepsopleiding is ontnomen en de ingangsdatum daarvan,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.4.1.3.b.3
    text: waaraan het recht op examinering van de desbetreffende beroepsopleiding is ontnomen en de ingangsdatum daarvan,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.c
    text: de namen van de exameninstellingen
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.c.1
    text: |-
      die het recht hebben op examinering van de desbetreffende beroepsopleiding en die niet te kennen hebben gegeven dat
      zij die examinering niet langer zullen verzorgen en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.1.3.c.2
    text: waaraan het recht is ontnomen op examinering van de desbetreffende beroepsopleiding, en de ingangsdatum daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.1
  - number: 6.4.2
    text: |-
      Onze Minister registreert per kwalificatie de instellingen die blijkens de opgave van het aantal deelnemers de
      desbetreffende beroepsopleiding daadwerkelijk verzorgen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.2
  - number: 6.4.4.1
    text: |-
      Onverminderd [artikel 6.2.2][ref1] beëindigt Onze Minister de registratie bij een kwalificatie van een niet uit
      ’s Rijks kas bekostigde instelling, indien het bevoegd gezag te kennen geeft dat de instelling de desbetreffende
      beroepsopleiding niet langer zal verzorgen. Onverminderd [artikel 6.3.2][ref2] beëindigt Onze Minister de
      registratie bij een kwalificatie van de examinering door een exameninstelling, indien het bevoegd gezag te kennen
      geeft dat de exameninstelling de examinering van de desbetreffende beroepsopleiding niet langer zal verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.4.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt voor 1 oktober van het jaar voorafgaand aan het eerste
      studiejaar waarin de inschrijving voor de opleiding niet meer openstaat.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.4
  - number: 6.4.4.3
    text: |-
      Onze Minister beëindigt de registratie ambtshalve wanneer de instelling de opleiding niet langer verzorgt en het
      bevoegd gezag de kennisgeving, bedoeld in het eerste lid, niet of niet tijdig doet.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.4
  - number: 6.4.4.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de registratie van de examinering door
      exameninstellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6.4.4
  - number: 6a.1.1.1
    text: |-
      Onze Minister maakt jaarlijks voor de aanvang van het studiejaar bekend welke instellingen, bedoeld in
      [artikel 1.4a.1, eerste lid][ref1], voor welke opleidingen rechten hebben als bedoeld in dat lid. Deze bekendmaking
      vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.1.1.a
    text: de naam van de instelling en van de opleiding die de instelling verzorgt,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.1
  - number: 6a.1.1.1.b
    text: |-
      in voorkomende gevallen, een waarschuwing als bedoeld in [artikel 6a.1.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.1.1.c
    text: in voorkomende gevallen, de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.1
  - number: 6a.1.1.2
    text: |-
      Als peildatum voor de gegevens, bedoeld in het eerste lid, hanteert Onze Minister 1 juni voorafgaand aan de
      bekendmaking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.1
  - number: 6a.1.2.1
    text: |-
      Onze Minister kan ten aanzien van een opleiding educatie, verzorgd door een instelling als bedoeld in
      [artikel 1.4a.1][ref1], het recht, bedoeld in het eerste lid van dat artikel, ontnemen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.1.a
    text: |-
      gebleken is dat de kwaliteit van een of meer examens of een of meer onderdelen van een examen van die opleiding
      onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.2
  - number: 6a.1.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarden, bedoeld in [artikel 1.4a.1, eerste lid][ref1],
      of aan de voorwaarde, bedoeld in [artikel 1.4a.1, zesde lid][ref2], of aan
      [artikel 1.4a.1, achtste lid, onderdelen a tot en met e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6a.1.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder a][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van een of
      meer examens of een of meer onderdelen van een examen van die opleiding. Onze Minister geeft eerst toepassing aan
      [artikel 6a.1.2, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.3.1.a
    text: na de waarschuwing ten minste een jaar is verstreken, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.3
  - number: 6a.1.3.1.b
    text: |-
      Onze Minister aan de hand van een hernieuwd onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.3
  - number: 6a.1.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.4
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1][ref1], langer dan een studiejaar een
      opleiding educatie niet heeft verzorgd, vervalt van rechtswege het recht om voor de desbetreffende opleiding een
      diploma of certificaat als bedoeld in [artikel 1.4a.1, eerste lid][ref2], uit te reiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.2.1.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a,][ref1] ontnemen, indien


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 6a.2.1.1.a
    text: de kwaliteit van de examens van die opleiding langer dan één jaar onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
  - number: 6a.2.1.1.b
    text: niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
  - number: 6a.2.1.2
    text: |-
      Bij de ontneming van het recht, bedoeld in het eerste lid, wordt bepaald met ingang van welk tijdstip dit
      geschiedt. Het besluit tot ontneming van het recht op examinering wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
  - number: 6a.2.1.3
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering, onder bepaling van de termijn waarbinnen aan
      die waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.2.1.4
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na het besluit tot ontneming, bedoeld in het
      eerste lid, het recht op examinering opnieuw verkrijgen. [Artikel 1.4a.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.2.1.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op instellingen als bedoeld in [artikel 1.4a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.1.1
    text: 'Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. Een andere taal kan worden gebezigd:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.1
  - number: 7.1.1.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.1
  - number: 7.1.1.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.1
  - number: 7.1.2.1
    text: |-
      De instelling biedt het onderwijs aan in de vorm van beroepsopleidingen of opleidingen educatie. Een
      beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de naam van de kwalificatie
      waarop zij is gericht of voorzover het gaat om deelnemers die ingeschreven zijn of zullen worden voor een
      opleidingsdomein of kwalificatiedossier, de naam van dat opleidingsdomein of dat kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.2
  - number: 7.1.2.2
    text: |-
      Een beroepsopleiding is een onderwijstraject dat voor een deelnemer is ingericht overeenkomstig de eisen van
      [hoofdstuk 7, titel 2][ref1], en dat is gericht op het behalen van een kwalificatie in het beroepsonderwijs, ten
      bewijze waarvan een diploma wordt uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 7.1.2.3
    text: |-
      Een opleiding educatie is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking
      van eindtermen of het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van een dergelijk diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.1.2.4
    text: Beroepsopleidingen worden afgesloten met een examen. Opleidingen educatie kunnen worden afgesloten met een examen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.2
  - number: 7.1.3
    text: |-
      Een kwalificatie is het geheel van bekwaamheden die een afgestudeerde van een beroepsopleiding kwalificeren voor
      het functioneren in een beroep of een groep van samenhangende beroepen, in het vervolgonderwijs en als burger en
      dat is beschreven binnen een kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.3
  - number: 7.1.4.1
    text: |-
      Bij het geven van onderwijs aan een deelnemer van een beroepsopleiding die bij de aanvang van die opleiding
      leerplichtig was en die is opgenomen in een ziekenhuis of die in verband met ziekte thuis verblijft, kan het
      bevoegd gezag van een instelling die de beroepsopleiding verzorgt, worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
  - number: 7.1.4.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
  - number: 7.1.4.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de
      deelnemer is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 7.1.4.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] indien de deelnemer is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de deelnemer in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: 7.1.4.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de instelling waarbij de deelnemer is ingeschreven, mede het geven van onderwijs aan de
      deelnemer betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
  - number: 7.1.4.4
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
  - number: 7.1.4.5
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, zijn de
      schoolbegeleidingsdiensten die voor de ondersteuning bij het onderwijs aan zieke leerlingen, in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010086
        artikel: IX
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.1
  - number: 7.2.2.1
    text: 'De volgende soorten beroepsopleidingen worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.1.a
    text: de assistentopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.1.b
    text: de basisberoepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.1.c
    text: de vakopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.1.d
    text: de middenkaderopleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.1.e
    text: de specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.2
    text: 'De in het eerste lid bedoelde opleidingen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.2.a
    text: |-
      een beroepsopleidende leerweg, omvattend een praktijkdeel van ten minste 20% en minder dan 60% van de studieduur,
      of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.2.b
    text: een beroepsbegeleidende leerweg, omvattend een praktijkdeel van 60% of meer van de studieduur, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.2.c
    text: zowel de onder *a* als de onder *b* bedoelde leerweg.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.3
    text: |-
      De assistentopleidingen richten zich op de kwalificatie voor het eerste niveau van beroepsuitoefening of voor
      de entree op de arbeidsmarkt. De basisberoepsopleidingen richten zich op de kwalificatie voor het tweede, de
      vakopleidingen op de kwalificatie voor het derde en de middenkader- en specialistenopleidingen op de kwalificatie
      voor het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.2.4
    text: |-
      Aan de in het eerste lid bedoelde opleidingen kunnen ten behoeve van individuele deelnemers voorbereidende
      en ondersteunende activiteiten worden toegevoegd ter bevordering van het kunnen instromen in en met gunstig
      gevolg voltooien van de opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en
      ondersteunende activiteiten zijn bestemd voor deelnemers wier vooropleiding naar het oordeel van het bevoegd gezag
      onvoldoende uitzicht biedt op het binnen een redelijke tijd behalen van de kwalificatie waarvoor de deelnemer en de
      instelling een onderwijsovereenkomst hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.2
  - number: 7.2.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat aan onderdelen van een kwalificatie of
      kwalificaties een certificaat is verbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.3
  - number: 7.2.3.2
    text: |-
      [Artikel 7.4.6][ref1] is van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.4.1
    text: |-
      Met het oog op het functioneren van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen
      het aanbod van het beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de
      arbeidsmarktperspectieven voor afgestudeerden, draagt Onze Minister zorg voor het vaststellen en onderhouden
      van een samenhangend en gedifferentieerd geheel van opleidingsdomeinen, kwalificatiedossiers en bijbehorende
      kwalificaties die voor de desbetreffende bedrijfstakken of beroepencategorieën van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2
    text: |-
      Daartoe worden op voorstel van de desbetreffende kenniscentra beroepsonderwijs bedrijfsleven bij ministeriële
      regeling vastgesteld:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.a
    text: de kwalificatiedossiers,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.b
    text: 'van elk kwalificatiedossier:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.b.1
    text: |-
      het opleidingsdomein waartoe het kwalificatiedossier behoort, tenzij het een kwalificatiedossier betreft dat
      uitsluitend is gericht op de kwalificatie voor de entree op de arbeidsmarkt,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.b.2
    text: de kwalificatie of kwalificaties die het kwalificatiedossier bevat,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.b.3
    text: |-
      de kwalificatie of kwalificaties op grond waarvan een beroepsopleiding kan worden ingericht die voor bekostiging in
      aanmerking komt, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.b.4
    text: |-
      indien het een kwalificatiedossier betreft dat door twee of meer kenniscentra beroepsonderwijs bedrijfsleven
      gezamenlijk is ingediend, op welke bedrijfstak of groep van bedrijfstakken de kwalificatie of de kwalificaties
      gericht zijn,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.c
    text: 'van elke kwalificatie:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.c.1
    text: |-
      de soort beroepsopleiding, bedoeld in [artikel 7.2.2, eerste lid][ref1], waarop de kwalificatie is gericht,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.2°
    text: |-
      de leerweg of leerwegen, bedoeld in [artikel 7.2.2, tweede lid][ref1], waarin die beroepsopleiding kan worden
      verzorgd,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.3
    text: |-
      het niveau, bedoeld in [artikel 7.2.2, derde lid][ref1], van die beroepsopleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.4
    text: de hoogte van de studielast van die beroepsopleiding, met inachtneming van het negende lid, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.2.c.5
    text: |-
      of toepassing is gegeven aan [artikel 7.2.6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.3
    text: |-
      Het kenniscentrum neemt bij het voorstel voor een kwalificatiedossier het bepaalde in het tweede en vierde lid in
      acht. Uit het voorstel blijkt dat het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven voldoende acht
      heeft geslagen op de aansluiting tussen de opleidingen voorbereidend beroepsonderwijs, de opleidingen middelbaar
      algemeen voortgezet onderwijs, de beroepsopleidingen en de opleidingen hoger beroepsonderwijs, in elk geval door
      raadpleging van vertegenwoordigers van die onderwijsvelden. Indien ook andere instanties nauw bij het voorstel voor
      het kwalificatiedossier zijn betrokken, maakt het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven in
      zijn voorstel melding van de wijze waarop het oordeel van die instanties is betrokken in het voorstel.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.4
    text: |-
      Bij de vaststelling van een kwalificatiedossier worden de referentieniveaus
      Nederlandse taal en de referentieniveaus rekenen in acht genomen die op grond van
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1] zijn
      vastgesteld voor de soorten opleiding als bedoeld in [artikel 7.2.2, eerste lid, onder a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de inhoud van een
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.6
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de termijnen bij de totstandkoming, vaststelling en
      geldigheidsduur van kwalificatiedossiers. Tevens worden bij ministeriële regeling een model en een toetsingskader
      voor kwalificatiedossiers vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.7
    text: |-
      Deelnemers worden behoudens de tweede volzin opgeleid overeenkomstig het kwalificatiedossier dat voor de
      desbetreffende beroepsopleiding is vastgesteld voor de aanvang van het studiejaar waarin zij met het eerste jaar
      van die opleiding starten. Nadat de geldigheidsduur van een kwalificatiedossier is verstreken, kan een diploma op
      basis van dat kwalificatiedossier nog worden uitgereikt gedurende een periode die overeenkomt met de normatieve
      studieduur van de desbetreffende beroepsopleiding, vermeerderd met 2 jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.8
    text: |-
      Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de studielast. De studieduur kan
      verschillen voor onderscheiden deelnemers of groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.9
    text: |-
      De studielast van elke kwalificatie wordt uitgedrukt in normatieve studiejaren. Een normatief studiejaar telt
      veertig weken van elk veertig uren studie, daaronder mede begrepen het onderricht in de praktijk. De studielast
      bedraagt voor de onderscheiden in [artikel 7.2.2, eerste lid, onder a tot en met e][ref1], bedoelde opleidingen het
      volgende aantal normatieve studiejaren of het volgende gedeelte daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.9.a
    text: 1 jaar,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.9.b
    text: ten minste 2 en ten hoogste 3 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.9.c
    text: ten minste 2 en ten hoogste 4 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.9.d
    text: ten minste 3 en ten hoogste 4 jaren, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.4.9.e
    text: ten minste 1 jaar en ten hoogste 2 jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      Bij ministeriële regeling kan een organisatie worden aangewezen die belast is met de advisering over de landelijke
      kwalificatiestructuur, bedoeld in [artikel 7.2.4, eerste lid][ref1], en over de voorstellen tot vaststelling
      van kwalificatiedossiers, bedoeld in artikel 7.2.4, tweede en derde lid. Laatstgenoemde advisering heeft in elk
      geval betrekking op de vraag of en in hoeverre deze voorstellen bijdragen aan de ontwikkeling van de landelijke
      kwalificatiestructuur. In de ministeriële regeling worden tevens regels gesteld voor de werkwijze van de
      organisatie en de subsidiëring van de werkzaamheden, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.5a
    text: |-
      Bij ministeriële regeling worden op voorstel van de instellingen in overleg met de kenniscentra beroepsonderwijs
      bedrijfsleven de opleidingsdomeinen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.5a
  - number: 7.2.6.1
    text: |-
      Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke organisatie,
      vereisten zijn vastgesteld over de kwaliteiten onder meer op het gebied van kennis, inzicht, vaardigheden of
      beroepshoudingen waarover degenen die een opleiding gericht op dat beroep voltooien, moeten beschikken, of over de
      examinering bij de desbetreffende beroepsopleiding:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.6
  - number: 7.2.6.1.a
    text: |-
      draagt het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven ervoor zorg dat deze vereisten verwerkt zijn
      bij het doen van het voorstel, bedoeld in [artikel 7.2.4, tweede en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6.1.b
    text: |-
      voegt het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven een verklaring van Onze
      Minister die het aangaat dat deze vereisten correct zijn verwerkt in het voorstel, bedoeld in
      [artikel 7.2.4, tweede en derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6.1.c
    text: |-
      neemt Onze Minister deze vereisten in acht bij de vaststelling van de standaarden, bedoeld in
      [artikel 7.4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.6.2
    text: |-
      De instelling draagt er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding volgen,
      ten minste in de gelegenheid zijn aan de in het eerste lid bedoelde vereisten te voldoen en dat bij de examinering,
      zo nodig in afwijking van [titel 4 van dit hoofdstuk][ref1], aan die vereisten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '4'
  - number: 7.2.7.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat beroepsopleidingen zodanig zijn ingericht dat deelnemers, ongeacht of
      zij eerst worden ingeschreven voor een opleidingsdomein of voor een kwalificatiedossier, de kwalificatie binnen de
      vastgestelde studieduur kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.7
  - number: 7.2.7.2
    text: Beroepsopleidingen zijn voltijds of deeltijds dan wel zowel voltijds als deeltijds ingericht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.7
  - number: 7.2.7.3
    text: |-
      Voltijdse beroepsopleidingen zijn opleidingen in de beroepsopleidende leerweg waarvan elk volledig studiejaar een
      studielast van 1600 uren of meer heeft, en waarvoor het bevoegd gezag voor de deelnemer in instellingstijd een
      onderwijsprogramma verzorgt dat ten minste 850 uren per volledig studiejaar omvat. Indien de door Onze Minister
      vastgestelde studielast ertoe leidt dat in het laatste studiejaar de duur van de opleiding gerekend vanaf 1
      september en naar boven afgerond op hele maanden minder is dan 10 maanden, dan wordt de norm van 850 uren in dat
      jaar evenredig verlaagd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.7
  - number: 7.2.7.4
    text: |-
      Het in instellingstijd verzorgde onderwijsprogramma, bedoeld in het derde lid, omvat alle onderwijsactiviteiten,
      gericht op het bereiken van de onderwijs- en vormingsdoelen van de opleiding, waaraan door de deelnemer wordt
      deelgenomen onder verantwoordelijkheid en toezicht van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.7
  - number: 7.2.7.5
    text: Beroepsopleidingen die niet zijn ingericht volgens het derde lid, zijn deeltijdse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.7
  - number: 7.2.8.1
    text: |-
      Van elke beroepsopleiding maakt onderricht in de praktijk van het beroep deel uit. De beroepspraktijkvorming kan
      voor een deel plaatsvinden in de periode waarin de deelnemer is ingeschreven voor een opleidingsdomein of een
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst, gesloten door de in
      [artikel 7.2.9][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen van partijen en omvat
      met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste bepalingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.2.a
    text: |-
      de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het aantal te volgen praktijkuren per
      kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.8.2.b
    text: de begeleiding van de deelnemer,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.8.2.c
    text: |-
      dat deel van de kwalificatie dat de deelnemer tijdens de beroepspraktijkvorming dient te behalen, en de beoordeling
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.8.2.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de deelnemers binnen het bedrijf. Het bevoegd gezag beoordeelt of de deelnemer het in het tweede lid, onder c,
      bedoelde deel van de kwalificatie heeft behaald. Het bevoegd gezag betrekt bij die beoordeling het oordeel van het
      bedrijf onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling
      op te nemen regels.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.8
  - number: 7.2.9.1
    text: |-
      Het bevoegd gezag van de instelling draagt zorg voor de totstandkoming van de in [artikel 7.2.8][ref1] bedoelde
      overeenkomst. De overeenkomst wordt gesloten door de instelling, de deelnemer en het bedrijf dat of de organisatie
      die de beroepspraktijkvorming verzorgt. De overeenkomst wordt voor zover het de beroepsbegeleidende leerweg
      betreft, mede ondertekend door het bestuur van het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven, dat
      daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.a
    text: |-
      dat het een bedrijf of organisatie betreft met een gunstige beoordeling als bedoeld in [artikel 7.2.10][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.b
    text: dat de gronden voor deze gunstige beoordeling nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.9
  - number: 7.2.9.2
    text: |-
      Indien het bevoegd gezag en het betrokken kenniscentrum beroepsonderwijs bedrijfsleven na het sluiten van de in
      [artikel 7.2.8][ref1] bedoelde overeenkomst vaststellen dat de praktijkplaats niet of niet volledig beschikbaar
      is, de begeleiding tekortschiet of ontbreekt, het bedrijf of de organisatie niet langer beschikt over een
      gunstige beoordeling als bedoeld in het eerste lid, of sprake is van andere omstandigheden die maken dat de
      beroepspraktijkvorming niet naar behoren zal kunnen plaatsvinden, bevordert het bevoegd gezag, na overleg met het
      bestuur van het betrokken kenniscentrum beroepsonderwijs bedrijfsleven, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.10.1
    text: |-
      Het kenniscentrum beroepsonderwijs bedrijfsleven richt een stelsel van kwaliteitszorg voor de
      beroepspraktijkvorming in en zorgt ervoor dat bedrijven en organisaties die de beroepspraktijkvorming
      verzorgen eenmaal per vier jaar worden beoordeeld aan de hand van de in dit stelsel ontwikkelde criteria.
      Indien daartoe door bijzondere omstandigheden aanleiding bestaat kan controle frequenter plaatsvinden. In
      geval van een kenniscentrum beroepsonderwijs bedrijfsleven waarvan de samenstelling van het bestuur voldoet
      aan [artikel 9.2.1, tweede lid, onder b][ref1], worden deze criteria vastgesteld op voorstel van de commissie
      onderwijs-bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.2.10.2
    text: |-
      Het kenniscentrum beroepsonderwijs bedrijfsleven maakt de in het eerste lid bedoelde criteria bekend. Van deze
      bekendmaking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.10
  - number: 7.2.10.3
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven dragen gezamenlijk zorg voor openbaarmaking van een overzicht van
      bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.10
  - number: 7.2.10.4
    text: |-
      Tot het verzorgen van de beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend
      bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.10
  - number: 7.2.11
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat aan de deelnemers gelegenheid wordt gegeven diagnostische
      toetsen Nederlandse taal en rekenen af te leggen. Indien toepassing wordt gegeven aan de vorige volzin, worden
      bij of krachtens algemene maatregel van bestuur voorschriften omtrent deze toetsen vastgesteld. Deze voorschriften
      hebben in elk geval betrekking op het moment of de momenten waarop de toetsen kunnen worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.2.11
  - number: 7.3.1.1
    text: 'De volgende opleidingen educatie worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.1.a
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma van onderwijs als
      bedoeld in de [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.3.1.1.b
    text: |-
      opleidingen Nederlandse taal en rekenen, gericht op alfabetisering en op het ingangsniveau van het
      beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.1.c
    text: |-
      de opleidingen Nederlands als tweede taal I en II die opleiden voor het diploma Nederlands als tweede taal, bedoeld
      in het Staatsexamenbesluit Nederlands als tweede taal,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.1.d
    text: de opleidingen Nederlands als tweede taal, gericht op beheersing van een basisniveau Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.1.e
    text: de opleidingen Nederlands als tweede taal, gericht op alfabetisering, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.1.f
    text: bij ministeriële regeling aan te wijzen andere opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.2
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder b, zijn afgestemd op het maatschappelijk functioneren van de
      deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.1.3
    text: Bij de opleidingen, bedoeld in het eerste lid, onder b, c en d, kunnen verschillende niveaus worden onderscheiden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.1
  - number: 7.3.2.1
    text: |-
      De opleiding Nederlands als tweede taal I is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c][ref1], door hen voor wie het Nederlands niet de moedertaal is en die ten
      minste het niveau van het primair onderwijs hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2.2
    text: |-
      De opleiding Nederlands als tweede taal II is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het
      Nederlands niet de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het
      niveau van het middenkader.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.2
  - number: 7.3.3.1
    text: |-
      Bij ministeriële regeling worden eindtermen vastgesteld voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder c][ref1], en kunnen eindtermen worden vastgesteld voor de opleidingen, bedoeld in
      artikel 7.3.1, eerste lid, onder b, d, e en f.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3.2
    text: |-
      Het bevoegd gezag stelt eindtermen vast voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b, d, e en f][ref1], indien daarvoor geen eindtermen zijn vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4.1
    text: |-
      Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het behalen
      van elk der in het eerste lid genoemde diploma’s noodzakelijke vakken en andere programma-onderdelen, en omtrent
      de cursusduur.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.3.4
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.1
  - number: 7.4.2.1
    text: Het bevoegd gezag van een instelling geeft de deelnemers de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.2
  - number: 7.4.2.2
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen of de kwalificatie-eisen in het
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.2
  - number: 7.4.2.4
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.4.3
    text: |-
      Het examen van een beroepsopleiding is eerst dan met goed gevolg afgesloten wanneer zowel de beroepspraktijkvorming
      als het overige deel van de beroepsopleiding met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.3
  - number: 7.4.3a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de examens van
      beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.3a
  - number: 7.4.3a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen onderdelen van een beroepsopleiding worden aangewezen waarbij geheel
      of gedeeltelijk centrale examinering plaatsvindt. Voor onderdelen waarbij gedeeltelijk centrale examinering
      plaatsvindt, wordt bij ministeriële regeling bepaald over welk gedeelte het centraal examen zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.3a
  - number: 7.4.4
    text: |-
      Bij ministeriële regeling worden landelijke standaarden voor de kwaliteit van de examens van de beroepsopleidingen
      vastgesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4
  - number: 7.4.4.a
    text: |-
      de inhoud en het niveau van de examens, in relatie tot de kwalificatie-eisen in het kwalificatiedossier, bedoeld
      in [artikel 7.2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.4.b
    text: de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4
  - number: 7.4.4a.1
    text: |-
      Het bevoegd gezag kan de examinering van een beroepsopleiding overdragen aan een andere instelling als bedoeld
      in [artikel 1.1.1, onder b,][ref1] of [1.4.1][ref2] of aan een exameninstelling, voor zover deze het recht op
      examinering van die beroepsopleiding hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.4a.2
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.1.5b, eerste lid][ref1],
      [6.2.3b, eerste lid][ref2], dan wel [6.3.2, eerste lid][ref3], is het bevoegd gezag voor die beroepsopleiding
      gehouden toepassing te geven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.4.4a.3
    text: |-
      Het bevoegd gezag kan de examinering van examendeelnemers die op grond van een samenwerkingsovereenkomst als
      bedoeld in [artikel 8.4.2][ref1] een assistentopleiding volgen, onder zijn verantwoordelijkheid laten uitvoeren
      door het bevoegd gezag van een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.4.5.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, een examencommissie in ten behoeve van de organisatie en het
      afnemen van de examens voor elke door de instelling verzorgde opleiding of voor groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.5
  - number: 7.4.5.2
    text: Het bevoegd gezag benoemt de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.5
  - number: 7.4.6.1
    text: Ten bewijze dat een examen met goed gevolg is afgelegd, reikt de examencommissie een diploma uit.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.6
  - number: 7.4.6.2
    text: |-
      Bij ministeriële regeling worden modellen en technische veiligheidseisen voor het diploma en de resultatenlijst van
      een beroepsopleiding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.6
  - number: 7.4.7.1
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het desgevraagd, aan belanghebbenden of aan de
      op grond van de [Algemene wet erkenning EG-beroepskwalificaties][ref1] bevoegde autoriteiten, verstrekken van op
      vergelijking van opleidingen berustende waarderingen of vergelijkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: 7.4.7.1.a
    text: van buitenlandse diploma’s of certificaten als bedoeld in die wet alsmede van andere buitenlandse diploma's, met
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.1.b
    text: de getuigschriften van overeenkomstige Nederlandse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.2
    text: |-
      Bij de vergelijkingen en waarderingen wordt zo mogelijk aangegeven tot welke soort in
      [artikel 7.2.2, eerste lid][ref1], bedoelde beroepsopleiding de desbetreffende opleiding kan worden gerekend
      en met welke in het Centraal register vermelde beroepsopleiding die opleiding vergelijkbaar is of kan worden
      gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.3
    text: 'De vergelijking of waardering wordt slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.3.a
    text: |-
      op verzoek van de op grond van de in het eerste lid genoemde [wet][ref1] bevoegde autoriteiten, ten behoeve van
      aanvragen tot het verlenen van erkenning van beroepskwalificaties als bedoeld in [artikel 5 van die wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0023066
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0023066
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 7.4.7.3.b
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan een
      Nederlandse beroepsopleiding, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.3.c
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan de
      Nederlandse arbeidsmarkt op een niveau dat overeenkomt met een in [artikel 7.2.2][ref1] bedoeld niveau van
      beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.4
    text: |-
      Onze minister kan beleidsregels stellen met het oog op een doelmatige vervulling van de in het eerste lid genoemde
      taken door de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.5
    text: |-
      De rechtspersoon verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak redelijkerwijs
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.6
    text: |-
      Indien naar het oordeel van Onze Minister de rechtspersoon zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder
      getroffen dan nadat de rechtspersoon in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog zijn taak naar behoren uit te voeren. Onze Minister stelt de beide kamers der Staten-Generaal
      onverwijld in kennis van door hem getroffen voorzieningen als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.7.7
    text: |-
      Onze minister verstrekt, onder door hem op te leggen verplichtingen, aan de rechtspersoon jaarlijks uit 's Rijks
      kas middelen ten behoeve van de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.7
  - number: 7.4.8.1
    text: Het bevoegd gezag zorgt voor een goede organisatie en kwaliteit van het onderwijsprogramma en de examinering.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
  - number: 7.4.8.2
    text: |-
      Het bevoegd gezag zorgt ervoor dat deelnemers volledig en tijdig worden geïnformeerd over het onderwijsprogramma en
      de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
  - number: 7.4.8.3
    text: |-
      Het bevoegd gezag zorgt ervoor dat voltijdse beroepsopleidingen aantoonbaar voldoen aan de eisen van
      [artikel 7.2.7, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.4
    text: |-
      Het bevoegd gezag zorgt ervoor dat de instelling beschikt over een deelnemersstatuut waarin de rechten en plichten
      van de deelnemers zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
  - number: 7.4.8.5
    text: |-
      De examencommissie stelt regels vast met betrekking tot de goede gang van zaken tijdens het afnemen van de toetsen,
      het examen of de examenonderdelen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
  - number: 7.4.8.6
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 7.4.4a][ref1], dan treedt de
      examenregeling van de instelling of exameninstelling die de examinering verzorgt in de plaats van de examenregeling
      van de instelling die het onderwijs verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9.1
    text: Het bevoegd gezag van een exameninstelling zorgt voor een goede organisatie en kwaliteit van de examinering.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.9
  - number: 7.4.9.2
    text: |-
      Het bevoegd gezag van een exameninstelling zorgt ervoor dat de deelnemers die in dat jaar examen willen afleggen
      volledig en tijdig geïnformeerd worden over de inhoud en inrichting van de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.9
  - number: 7.4.10
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.10
  - number: 7.4.11.1
    text: Aan de deelnemers wordt gelegenheid gegeven een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
  - number: 7.4.11.2
    text: |-
      [Artikel 7.4.5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens
      van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als tweede taal I en II, bedoeld
      in [artikel 7.3.1, eerste lid, onder a en c][ref1]. Bij deze algemene maatregel van bestuur kunnen tevens
      voorschriften worden gegeven omtrent de examenprogramma’s en de verdeling daarvan in onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.11.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
  - number: 7.4.11.5
    text: |-
      [Artikel 7.4.6][ref1] is van toepassing, met dien verstande dat degene die een onderdeel van een examen van de
      opleiding voortgezet algemeen volwassenenonderwijs of Nederlands als tweede taal I of II met goed gevolg heeft
      afgelegd een certificaat ontvangt. Bij of krachtens algemene maatregel van bestuur wordt bepaald onder welke
      voorwaarden het bezit van certificaten aanspraak geeft op een diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.6
    text: |-
      [Artikel 7.4.8, eerste, tweede, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.7
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de artikelen [6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.1.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt al dan niet in samenwerking met een of meer bevoegde
      gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de examens in, dan wel
      sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de examinatoren kunnen
      worden onderworpen aan het oordeel van een commissie van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.1
  - number: 7.5.1.2
    text: |-
      De commissie van beroep voor de examens bestaat uit een even aantal gewone leden en evenveel plaatsvervangende
      leden, een voorzitter, tevens lid, en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.1
  - number: 7.5.1.3
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden worden door
      het bevoegd gezag benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw
      benoembaar. De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag, van de inspectie
      of van een in [artikel 7.4.5][ref1] bedoelde examencommissie of examinator tegen de beslissing waarvan
      onderscheidenlijk van wie beroep kan worden ingesteld bij de commissie van beroep, noch zijn zij belast met de in
      [artikel 7.2.8, tweede lid, onder c][ref2], bedoelde beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.5.1.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van
      de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun
      functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn
      veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene
      van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.1
  - number: 7.5.2.1
    text: De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
  - number: 7.5.2.2
    text: |-
      De termijn voor het indienen van het beroepschrift bedraagt, wat de openbare instellingen betreft in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref1], twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.5.2.3
    text: |-
      De commissie beslist binnen vier weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het beroepschrift is verstreken, wat de openbare instellingen betreft in afwijking van
      [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1], tenzij de commissie deze termijn heeft
      verlengd met ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.2.4
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
  - number: 7.5.2.5
    text: |-
      De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
  - number: 7.5.2.6
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie
      is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen,
      wat de openbare instellingen betreft in afwijking van [artikel 7:25 van de Algemene wet bestuursrecht][ref1].
      Zij kan bepalen dat opnieuw of, indien de beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat
      het examen of enig onderdeel daarvan opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.3.1
    text: |-
      In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek
      na de desbetreffende examencommissie dan wel de desbetreffende examinator te hebben gehoord, althans te hebben
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.3
  - number: 7.5.3.2
    text: |-
      Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.3
  - number: 7.5.4
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.5.4
  - number: 7.7.1.1
    text: |-
      Het bevoegd gezag van een instelling is verplicht, studenten die zijn ingeschreven voor een opleiding voor
      het beroep van leraar waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, of
      die anderszins studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor
      een functie in het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de
      instelling te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 7.7.1.2
    text: |-
      De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling in
      totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits dat
      in overeenstemming is met de goede gang van zaken binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 7.7.1.3
    text: |-
      Het bevoegd gezag kan een student de verdere toegang tot de instelling ontzeggen, indien deze in de instelling in
      strijd handelt met de grondslag en doelstellingen van de instelling. Van een besluit tot ontzegging van de toegang
      tot de instelling wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag
      van de betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie. Indien
      het bevoegd gezag van een bijzondere school een student de toegang weigert, maakt het dit besluit, schriftelijk en
      met redenen omkleed, bekend door toezending of uitreiking aan de student, onverminderd het bepaalde in de vorige
      volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 7.7.1.4
    text: |-
      Het bevoegd gezag van de instelling regelt de werkzaamheden in verband met de begeleiding door de leraren van
      de studenten in de instelling in overeenstemming met de leraren, alsmede in overeenstemming met de betrokken
      opleidingsinstellingen, dan wel, indien het betreft studenten die zich voorbereiden op het afleggen van een
      staatsexamen ter verkrijging van een bewijs van bekwaamheid of een bewijs van voldoende pedagogische en didactische
      voorbereiding, in overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 7.7.1.5
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 7.7.1.6
    text: |-
      De instellingen waarbij studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de
      inspectie, belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te
      wijzen docenten van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies,
      een en ander voor zover dat voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de
      begeleiding van de praktische vorming van de in de instelling aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel7.7.1
  - number: 8.1.1.1
    text: |-
      Een ieder die gebruik wenst te kunnen maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als deelnemer te laten inschrijven. Een ieder die uitsluitend wenst te worden toegelaten
      tot examenvoorzieningen, dient zich door het bevoegd gezag als examendeelnemer te laten inschrijven. Voor de
      inschrijving als examendeelnemer is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      Indien het een meerderjarige examendeelnemer betreft die het examengeld niet zelf voldoet, wordt niet overgegaan
      tot inschrijving dan nadat de deelnemer schriftelijk heeft verklaard dat hij ermee instemt dat een in die
      verklaring vermelde derde namens hem het examengeld voldoet. De inschrijving voor een opleiding of een onderdeel
      van een opleiding staat uitsluitend open voor degene waarvan de ouders, voogden of verzorgers aantonen, dan wel,
      indien hij meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1.1.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1.1.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1.1.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding begint
      waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.1.1.1.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1.1a
    text: |-
      Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke
      grond dan ook niet in overeenstemming met de vijfde volzin van het eerste lid heeft plaatsgevonden, wordt de
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3][ref1], met onmiddellijke ingang ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.2
    text: |-
      De inschrijving geschiedt voor een opleiding of een onderdeel daarvan. In geval van een beroepsopleiding geschiedt
      de inschrijving voor een opleidingsdomein, een kwalificatiedossier of een kwalificatie. Bij de inschrijving worden
      alle gegevens vermeld die het bevoegd gezag nodig heeft om te kunnen voldoen aan de verplichting, bedoeld in
      [artikel 2.3.6a, tweede lid][ref1], of ingeval van een beroepsopleiding, [artikel 2.5.5a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.1.3
    text: |-
      De inschrijving staat uitsluitend open voor degenen ten aanzien van wie het bevoegd gezag beslist dat zij tot de
      instelling worden toegelaten, onverminderd het eerste lid, vierde volzin, en het vijfde lid. Het bevoegd gezag
      kan het nemen van de beslissing over de toelating opdragen aan een door hem in te stellen toelatingscommissie. Het
      bevoegd gezag regelt de bevoegdheden en de werkzaamheden van de toelatingscommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1.4
    text: |-
      De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend
      open voor degenen voor wie de volledige leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref1], is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 8.1.1.5
    text: |-
      In afwijking van het derde lid en met inachtneming van [artikel 8.2.1][ref1] en het krachtens [artikel 8.2.2][ref2]
      bepaalde” doch onverminderd de vierde volzin van het eerste lid, staat de inschrijving voor een assistentopleiding
      of basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref3], open voor een ieder, met dien verstande
      dat het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven,
      geacht worden de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden
      geweigerd dan wel ingetrokken indien de betrokkene de grondslag en de doelstellingen van de instelling niet
      respecteert. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel ingetrokken indien
      gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal maken
      door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan niet
      worden ingetrokken op grond van de tweede volzin indien voor betrokkene geen gelegenheid bestaat de opleiding aan
      een andere instelling te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.6
    text: |-
      De toelating tot opleidingen educatie staat uitsluitend open voor volwassenen. De toelating tot de opleidingen
      educatie, bedoeld in [artikel 7.3.1. eerste lid, onderdelen c tot en met e][ref1], staat niet open voor volwassenen
      die inburgeringsplichtig zijn in de zin van [artikel 1, aanhef en onder b, van de Wet inburgering][ref2]. Het
      bevoegd gezag neemt bij de toelating tot opleidingen educatie de overeenkomst, bedoeld in [artikel 2.3.4][ref3],
      in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.1.7
    text: |-
      De inschrijving voor een opleidingsdomein kan uitsluitend geschieden voor een beroepsopleiding in de
      beroepsopleidende leerweg op het tweede, derde of vierde niveau, bedoeld in [artikel 7.2.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.8
    text: |-
      Bij ministeriële regeling kan een maximum worden vastgesteld voor het percentage van de deelnemers in het
      beroepsonderwijs dat in een jaar kan worden ingeschreven voor een opleidingsdomein.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1
  - number: 8.1.1a.1
    text: |-
      De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de deelnemer
      of, indien deze minderjarig is, door de ouders, voogden of verzorgers de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de deelnemer zijn overgelegd.
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de deelnemer kan worden overgelegd, vindt de inschrijving plaats met
      inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
  - number: 8.1.1a.3
    text: |-
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag binnen twee
      weken na het besluit tot inschrijving aan Onze Minister de beschikbare gegevens van de deelnemer, bedoeld in het
      eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
  - number: 8.1.1a.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de deelnemer, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de deelnemer. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de deelnemer toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
  - number: 8.1.1a.5
    text: Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
  - number: 8.1.1a.6
    text: |-
      Indien aan een deelnemer een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de administratie van de instelling in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.1a
  - number: 8.1.2.1
    text: |-
      Indien binnen redelijke afstand van de woning van de deelnemer niet de gelegenheid bestaat tot het volgen van
      het onderwijs aan een openbare instelling, mag aan deze deelnemer de toelating tot een bijzondere instelling niet
      worden geweigerd op grond van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.2
  - number: 8.1.2.2
    text: Openbare instellingen zijn toegankelijk voor deelnemers zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.2
  - number: 8.1.3.1
    text: Aan de inschrijving ligt een overeenkomst tussen het bevoegd gezag en de deelnemer ten grondslag.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.2
    text: |-
      De overeenkomst wordt, overeenkomstig een door het bevoegd gezag vastgesteld model, schriftelijk aangegaan. De
      overeenkomst wordt gesloten voor de duur van de beroepsopleiding of een deel daarvan, de opleiding educatie of het
      deel van de opleiding educatie waarop de inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.3
    text: |-
      De overeenkomst regelt de rechten en verplichtingen van partijen, daaronder begrepen die, welke voortvloeien uit de
      wet, en omvat ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.3.a
    text: |-
      de inhoud en inrichting van een opleiding, waaronder voor een beroepsopleiding begrepen het voltijdse of deeltijdse
      karakter, de leerweg, de examenvoorzieningen en de kwalificatie, of, bij inschrijving voor een opleidingsdomein of
      een kwalificatiedossier, dat opleidingsdomein of dat kwalificatiedossier en het beoogde niveau van de te behalen
      kwalificatie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.3.b
    text: de tijdvakken waarbinnen en, voor zover mogelijk, de lokaties waarop het onderwijs verzorgd wordt,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.3.c
    text: de wijze waarop partijen uit de overeenkomst voortkomende prestaties gestalte zullen geven,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.3.d
    text: |-
      in voorkomend geval, terugbetaling van voorschotten, verstrekt door het bevoegd gezag, ter voldoening van een bij
      of krachtens de wet geregelde geldelijke bijdrage als bedoeld in [artikel 8.1.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.3.e
    text: |-
      de terugbetaling van cursusgeld in andere gevallen dan bedoeld in
      [artikel 14, tweede lid onder a tot en met d, van het Uitvoeringsbesluit Les- en cursusgeldwet 2000][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel14
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '14'
  - number: 8.1.3.3.f
    text: het verzuimbeleid van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.4
    text: |-
      Indien tot een bijzondere instelling andere deelnemers worden toegelaten dan voor wie de instelling in verband
      met de godsdienstige of levensbeschouwelijke richting wordt in stand gehouden, kunnen deze deelnemers niet worden
      verplicht tot het volgen van onderwijs dat in verband met die richting door de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
  - number: 8.1.3.5
    text: |-
      Definitieve verwijdering van een deelnemer waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet
      plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere instelling, een school voor speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref2] bereid is de deelnemer toe te laten. Indien aantoonbaar
      gedurende 8 weken zonder succes is gezocht naar een zodanige instelling of school waarnaar kan worden verwezen, kan
      in afwijking van de eerste volzin tot definitieve verwijdering worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 8.1.3.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.4
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde geldelijke
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.4
  - number: 8.1.7.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de instelling ingeschreven deelnemer die valt onder de werking van de
      [Wet studiefinanciering 2000][ref1] of van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], vast,
      of deze deelnemer gedurende een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het
      onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van
      onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling wordt gedaan indien een ingeschreven
      deelnemer in een of meer vakken niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt
      verstaan afwezigheid wegens ziekte van de deelnemer, welke ziekte uitsluitend kan worden aangetoond door middel van
      een gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van vier weken aan
      de deelnemer dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de deelnemer om
      opgaaf van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de opgave van de gegevens van
      de deelnemer, bedoeld in [artikel 8.1.8a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.7.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.3.a
    text: |-
      of de reden die de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.3.b
    text: |-
      dat de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      deelnemer voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      deelnemer die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die deelnemer voor het einde van de periode van 8 weken
      weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift van de gegevens
      die over de betrokken deelnemer aan Onze Minister zijn verstrekt aan deze betrokkene. Het bevoegd gezag geeft
      daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen heeft voor de studiefinanciering van
      betrokkene op grond van de [Wet studiefinanciering 2000][ref1] of voor de tegemoetkoming onderwijsbijdrage en
      schoolkosten van betrokkene op grond van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], alsmede
      welke beroepsgang voor betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.8
    text: |-
      Indien het bevoegd gezag van een bijzondere instelling aan Onze Minister de in het vijfde lid bedoelde mededeling
      heeft gedaan, kan de deelnemer binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid, bij het
      bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.9
    text: Onder «deelnemer» als bedoeld in het vijfde en zevende lid wordt verstaan de deelnemer die
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
  - number: 8.1.7.9.a
    text: |-
      een assistentopleiding of een basisberoepsopleiding volgt als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a of b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.9.b
    text: |-
      voor 1 augustus 2005 studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref1] ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 8.1.8.1.b
    text: |-
      die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref2] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
  - number: 8.1.8.1.c
    text: die bij de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8
  - number: 8.1.8.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8
  - number: 8.1.8a.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan Onze Minister van de gegevens van degene die voldoet aan
      [artikel 8.1.8, eerste lid, onderdelen a en b][ref1], en die het onderwijs of de educatie aan de instelling
      gedurende een aaneengesloten periode van ten minste vier weken of een door het bevoegd gezag te bepalen kortere
      periode zonder geldige reden niet meer volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.8a.2
    text: |-
      Onze Minister neemt de op grond van dit artikel door het bevoegd gezag verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.3
    text: |-
      Onze Minister bericht burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft
      onverwijld na ontvangst van de opgave, bedoeld in het eerste lid, dat een zodanige opgave heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.4
    text: |-
      Onze Minister verstrekt uit het meldingsregister relatief verzuim aan het betrokken bevoegd gezag en aan
      burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft de ter zake van die
      betrokkene geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.5
    text: |-
      Burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft melden aan Onze
      Minister telkens de status van de behandeling van de ter zake van de betrokkene gedane opgave, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.6
    text: |-
      Onze Minister neemt de op grond van dit artikel door burgemeester en wethouders verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.7
    text: |-
      Het betrokken bevoegd gezag en burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft, zijn bevoegd het meldingsregister relatief verzuim te raadplegen voor zover het betreft de
      ter zake van die betrokkene geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.8
    text: |-
      Het bevoegd gezag kan de gegevens, bedoeld in het eerste lid, verstrekken aan burgemeester en wethouders van de
      gemeente waar de betrokkene woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.9
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste en vijfde lid en wordt een nadere specificatie gegeven van de gegevens die op
      grond van het eerste en vijfde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
  - number: 8.1.8a.11
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 8.1.8a.12
    text: |-
      Op verzoek van burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft, komen
      hun rechten en verplichtingen als bedoeld in dit artikel toe aan burgemeester en wethouders van de contactgemeente,
      bedoeld in [artikel 8.3.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.1.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.1
    text: |-
      Vereiste voor inschrijving voor een vakopleiding en een middenkaderopleiding als bedoeld in
      [artikel 7.2.2, eerste lid][ref1], is met inachtneming van het bepaalde krachtens [artikel 8.2.2][ref2] het bezit
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.1.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.1.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.1.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.1.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.1.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.2
    text: |-
      Vereiste voor inschrijving voor een specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], is het
      bezit van een diploma vakopleiding voor eenzelfde beroep of beroepencategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.3
    text: |-
      Indien een assistentopleiding en een basisberoepsopleiding voorbereiden op eenzelfde beroep of
      beroepencategorie, bedoeld in [artikel 7.2.4, eerste lid][ref1], is, met inachtneming van het bepaalde krachtens
      [artikel 8.2.2][ref2], voor de inschrijving voor de basisberoepsopleiding vereist het bezit van


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.3.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.3.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.3.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.3.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.3.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.4
    text: |-
      Voor de inschrijving voor een assistentopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], en voor de
      inschrijving voor een opleiding educatie, gelden geen vooropleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.5
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen afwijken van het eerste tot en met derde lid, indien de deelnemer naar
      verwachting het onderwijs in de desbetreffende beroepsopleiding met voldoende resultaat zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
  - number: 8.2.1.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2.1
    text: |-
      Op voorstel van organisaties in het voortgezet onderwijs, vertegenwoordigers van de instellingen, de kenniscentra
      beroepsonderwijs bedrijfsleven, bedoeld in [artikel 9.2.1, tweede lid, onderdeel a][ref1], en de commissies
      onderwijs-bedrijfsleven, bedoeld in [artikel 9.2.1, derde lid][ref2], worden bij ministeriële regeling aangewezen
      de sectoren, bedoeld in de [artikelen 10][ref3], [10b][ref4] en [10d van de Wet op het voortgezet onderwijs][ref5],
      waarop het diploma middelbaar algemeen voortgezet onderwijs, het diploma voorbereidend beroepsonderwijs,
      het diploma mavo-vbo en de diploma's voorbereidend middelbaar beroepsonderwijs betrekking moeten hebben,
      alsmede vakken en andere programma-onderdelen die deel moeten hebben uitgemaakt van het examen ter
      verkrijging van een van deze diploma's, om te kunnen worden ingeschreven voor een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.2.2
    text: |-
      In de ministeriële regeling kan onderscheid worden gemaakt naar groepen van deelnemers, dan wel kan worden bepaald
      dat de regeling niet van toepassing is op groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.2.2
  - number: 8.3.1.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 8.1.8, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.1.1.a
    text: |-
      die het onderwijs of de educatie aan de instelling waaraan hij is ingeschreven gedurende een aaneengesloten periode
      van ten minste vier weken of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer
      volgt, of
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.1
  - number: 8.3.1.1.b
    text: |-
      die niet meer aan een instelling is ingeschreven en evenmin is ingeschreven aan een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.1.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater
      niet verstaan degene die in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a][ref1], dan wel een getuigschrift van het praktijkonderwijs als bedoeld
      in [artikel 10f van de Wet op het voortgezet onderwijs][ref2] en werkzaam is op grond van een aanstelling of
      arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 8.3.2.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 8.1.8][ref1] heeft gemeld of waarover zij op grond van [artikel 8.1.8a][ref2] of op grond van
      [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref3] beschikken. Burgemeester en
      wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs of arbeidsmarkt van de in
      [artikel 8.3.1][ref4] bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem. Het systeem
      heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van de
      [Leerplichtwet 1969][ref5]. Voor de uitvoering van de eerste en tweede volzin kunnen bij ministeriële regeling
      nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0002628
  - number: 8.3.2.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met instellingen, scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.2.3
    text: |-
      De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onverwijld gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen
      coördinerende taken met het oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.4
    text: |-
      Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, dragen
      burgemeester en wethouders van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van
      dit artikel over aan burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing
      wordt onverwijld gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de colleges van burgemeester en wethouders in de regio aan de contactgemeente een
      specifieke uitkering toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente
      draagt er zorg voor dat de colleges van burgemeester en wethouders in de regio gebruik kunnen maken van de
      instrumenten die met behulp van deze uitkering zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur
      worden regels gegeven voor de berekening en betaling van de uitkering. De berekening geschiedt in elk geval aan
      de hand van het aantal volwassen inwoners van de gemeenten in de regio op 1 januari van het jaar voorafgaande aan
      het jaar van de uitkering, waarbij rekening wordt gehouden met het opleidingsniveau en met de etnische achtergrond
      van die inwoners. Bij de berekening van een deel van de uitkering kunnen de volwassen inwoners van gemeenten die
      op grond van een andere regeling reeds een vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen,
      buiten beschouwing worden gelaten. Onze Minister hanteert het aantal volwassen inwoners van de gemeenten in de
      regio dat blijkt uit de gegevens die het Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.6
    text: |-
      Het bevoegd gezag geeft aan de door burgemeester en wethouders aangewezen personen alle gevraagde bescheiden ter
      inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.7
    text: |-
      De gemeenteraden in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
  - number: 8.3.2.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien uit de
      informatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1], niet blijkt dat de uitkering is
      besteed in overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 8.3.3.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 8.3.2, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.3.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.3
  - number: 8.3.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.3.3
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 10b1 van de Wet op het voortgezet onderwijs][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een school voor voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref2] en het bevoegd gezag van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b7 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b7
  - number: 8.4.2.1
    text: |-
      De assistentopleiding, bedoeld in [artikel 10b8 van de Wet op het voortgezet onderwijs][ref1], wordt verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b8
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.2.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b9 van de Wet op het voorgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b9
  - number: 8a.1.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.1
  - number: 8a.1.1.a
    text: |-
      deelnemersraad: de deelnemersraad, bedoeld in [artikel 8a.1.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.1.b
    text: |-
      reglement: het reglement voor de raad, bedoeld in [artikel 8a.3.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.1.c
    text: |-
      commissie: de landelijke geschillencommissie medezeggenschap, bedoeld in [artikel 8a.4.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.2.1
    text: |-
      Aan elke instelling is een deelnemersraad verbonden. De deelnemersraad behartigt de belangen van de deelnemers in
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.2.2
    text: De deelnemersraad bestaat uit een oneven aantal leden die uit en door de deelnemers worden gekozen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.2.3
    text: De verkiezing van de leden van de deelnemersraad geschiedt bij geheime schriftelijke stemming.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.2.4
    text: |-
      Alle deelnemers die bij de instelling zijn ingeschreven, zijn kiesgerechtigd voor de deelnemersraad en kunnen zich
      daarvoor verkiesbaar stellen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.2.5
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de leden, voormalige leden en kandidaat-leden van de deelnemersraad niet
      uit hoofde van hun lidmaatschap of vroegere lidmaatschap daarvan, dan wel hun kandidatuur voor dat lidmaatschap,
      worden benadeeld in hun positie met betrekking tot de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.2.6
    text: |-
      De deelnemersraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De voorzitter,
      of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de deelnemersraad in rechte.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.2
  - number: 8a.1.3.1
    text: |-
      Indien ten minste 25 ouders van deelnemers van een regionaal opleidingencentrum daarom verzoeken, stelt het bevoegd
      gezag een ouderraad in. Indien van de eerste volzin gebruik wordt gemaakt, legt het bevoegd gezag de bevoegdheden
      van de ouderraad vast in het medezeggenschapsstatuut, na overleg met de ouders die het verzoek hebben ingediend. Op
      een ouderraad als bedoeld in de eerste volzin, is [artikel 8a.1.2][ref1], met uitzondering van het eerste lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.3.2
    text: |-
      Aan een agrarisch opleidingscentrum en aan een scholengemeenschap als bedoeld in [artikel 2.6, eerste lid][ref1],
      is een ouderraad verbonden. Een ouderraad als bedoeld in de eerste volzin, behartigt in het bijzonder de belangen
      van de deelnemers in de leeftijd tot 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.1.3.3
    text: |-
      Indien een school voor voortgezet onderwijs als bedoeld in de Wet op het voortgezet onderwijs zich met een
      regionaal opleidingencentrum verenigt tot een scholengemeenschap als bedoeld in [artikel 2.6, eerste lid][ref1],
      vormt het in de [Wet medezeggenschap op scholen][ref2] bedoelde, uit en door de ouders gekozen deel
      van de medezeggenschapsraad van die school voor voortgezet onderwijs de eerste ouderraad van de
      scholengemeenschap. Indien een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 9 van de Wet op het voortgezet onderwijs][ref3] zich met een agrarisch opleidingscentrum verenigt tot een
      scholengemeenschap als bedoeld in artikel 2.6, eerste lid, vormen de ouderraad van het agrarisch opleidingscentrum,
      bedoeld in het tweede lid, en het in de Wet medezeggenschap op scholen bedoelde, uit en door de ouders gekozen
      deel van de medezeggenschapsraad van die school voor middelbaar algemeen voortgezet onderwijs gezamenlijk de eerste
      ouderraad van de scholengemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020685
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020685
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '9'
  - number: 8a.1.3.4
    text: |-
      Het bevoegd gezag legt de bevoegdheden van een ouderraad vast in het medezeggenschapsstatuut. Voor de vaststelling
      is [artikel 8a.2.2, derde lid, aanhef en onderdeel a][ref1], van overeenkomstige toepassing op een ouderraad. Op
      een ouderraad zijn [artikel 8a.2.1, vierde lid][ref2], en [titel 4][ref3] van dit hoofdstuk van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: 8a
  - number: 8a.1.4.1
    text: |-
      Het bevoegd gezag zorgt ervoor dat binnen de instelling een volwaardige, goed functionerende en effectieve
      medezeggenschap van deelnemers en, in voorkomende gevallen, ouders plaats kan vinden waarbij ten minste wordt
      voldaan aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.4
  - number: 8a.1.4.1.a
    text: |-
      de verkiezingen zijn zodanig geregeld dat deze kunnen leiden tot een deelnemersraad of, in voorkomende gevallen,
      een ouderraad die een representatieve vertegenwoordiging van deelnemers of ouders vormt;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.4
  - number: 8a.1.4.1.b
    text: |-
      de medezeggenschapsstructuren sluiten zo veel mogelijk aan bij de organisatiestructuur, besluitvormingsprocedures
      en verantwoordelijkheidsverdelingen binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.4
  - number: 8a.1.4.2
    text: |-
      Het bevoegd gezag legt de inrichting van de medezeggenschap telkens voor een periode
      van ten hoogste vier jaren vast in een medezeggenschapsstatuut. Voor de vaststelling is
      [artikel 8a.2.2, derde lid, aanhef en onderdeel a][ref1], van overeenkomstige toepassing op de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.5.1
    text: |-
      Het bevoegd gezag stelt de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad ten minste
      eenmaal per jaar in de gelegenheid gezamenlijk de algemene gang van zaken in de instelling met hem te bespreken.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.5
  - number: 8a.1.5.2
    text: |-
      Het bevoegd gezag, de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad komen voorts
      met elkaar bijeen indien daarom onder opgave van redenen door één of meer der raden wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.5
  - number: 8a.1.5.3
    text: |-
      In geval van een voornemen tot een fusie als bedoeld in [artikel 2.1.8][ref1] komen het bevoegd gezag, de
      deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad bijeen om dat voornemen te bespreken.
      De bespreking is gericht op het bereiken van overeenstemming. Indien overeenstemming wordt bereikt, wordt dit
      aangemerkt als instemming met het voornemen tot fusie. Bij het ontbreken van overeenstemming wordt dit aangemerkt
      als het onthouden van instemming. In het laatste geval kan elk van de deelnemers aan de bespreking het geschil
      voorleggen aan de geschillencommissie, bedoeld in [artikel 8a.4.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.5.4
    text: |-
      Indien geen overeenstemming wordt bereikt, hebben de deelnemersraad, de ondernemingsraad en, in voorkomende
      gevallen, de ouderraad elk afzonderlijk adviesrecht ten aanzien van het voornemen tot fusie, onverminderd het recht
      het geschil voor te leggen aan de in het vorige lid bedoelde geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.5
  - number: 8a.1.5.5
    text: |-
      Het bevoegd gezag stelt de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad in de
      gelegenheid om tijdig voorafgaand aan de gezamenlijke bijeenkomst, bedoeld in het derde lid, kennis te nemen van de
      opgestelde fusie-effectrapportage, bedoeld in [artikel 2.1.10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.2.1.1
    text: |-
      Het bevoegd gezag stelt de deelnemersraad ten minste twee maal per jaar in de gelegenheid de algemene gang van
      zaken in de instelling met hem te bespreken. Het bevoegd gezag en de deelnemersraad komen met elkaar bijeen, indien
      daarom onder opgave van redenen wordt verzocht door het bevoegd gezag of de deelnemersraad. De besprekingen worden
      namens het bevoegd gezag gevoerd door een lid van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.1
  - number: 8a.2.1.2
    text: |-
      De deelnemersraad is bevoegd tot bespreking van alle aangelegenheden, de instelling betreffende. Hij is bevoegd
      over deze aangelegenheden aan het bevoegd gezag voorstellen te doen en standpunten kenbaar te maken, alsmede het
      bevoegd gezag te verplichten daarover een standpunt in te nemen en bekend te maken.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.1
  - number: 8a.2.1.3
    text: |-
      Het bevoegd gezag verstrekt de deelnemersraad desgevraagd tijdig alle inlichtingen die deze voor de vervulling van
      zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.1
  - number: 8a.2.1.4
    text: |-
      Het bevoegd gezag draagt zorg voor de voorzieningen die de deelnemersraad voor de vervulling van zijn taak
      redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.1
  - number: 8a.2.1.5
    text: |-
      De deelnemersraad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      instelling betrokkenen van het verslag kennis kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.1
  - number: 8a.2.2.1
    text: 'De deelnemersraad heeft de volgende bijzondere bevoegdheden:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.1.a
    text: het verlenen van instemming aan een door het bevoegd gezag voorgenomen besluit als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.1.b
    text: het uitbrengen van advies over een door het bevoegd gezag voorgenomen besluit als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.2
    text: |-
      De bijzondere bevoegdheden zijn niet van toepassing, voor zover de desbetreffende aangelegenheid voor de instelling
      reeds inhoudelijk is geregeld in een bij of krachtens wet gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3
    text: |-
      De deelnemersraad heeft instemmingsbevoegdheid met betrekking tot voorgenomen besluiten van het bevoegd gezag ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.a
    text: het medezeggenschapsstatuut;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.b
    text: het deelnemersstatuut en de huisregels voor deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.c
    text: de beroeps- en klachtenregelingen voor deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.d
    text: |-
      de hoogte en de besteding van de vrijwillige ouder- of deelnemerbijdrage, alsmede de wijze waarop deze bijdrage
      tussen deelnemer en bevoegd gezag wordt overeengekomen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.e
    text: de wijze waarop informatie wordt gegeven over de inhoud, planning en organisatie van het onderwijs en de examens;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.f
    text: de besteding van stagefondsen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.g
    text: de model-onderwijsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.h
    text: de model-praktijkovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.i
    text: het beleid met betrekking tot toelating, schorsing en verwijdering van deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.j
    text: |-
      de wijze van vastleggen van studievorderingen van deelnemers en in dat verband het beleid met betrekking tot
      bescherming van de privacy van deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.k
    text: de regels op het gebied van veiligheid, gezondheid en welzijn voor zover deze de deelnemers betreffen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.3.l
    text: |-
      het reglement voor de deelnemersraad, met inachtneming van [artikel 8a.3.1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.2.2.4
    text: |-
      De deelnemersraad heeft adviesbevoegdheid met betrekking tot voorgenomen besluiten van het bevoegd gezag ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.4.a
    text: |-
      besluiten van het bevoegd gezag over inkrimping, uitbreiding, fusie en overdracht van de instelling, beëindiging
      van opleidingen en samenwerking met andere instellingen bij de uitvoering van opleidingen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.4.b
    text: verandering van de grondslag van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.4.c
    text: werkomstandigheden en voorzieningen voor deelnemers binnen de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.4.d
    text: het beleid met betrekking tot intake- en assessmentprocedures;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.4.e
    text: de rol van deelnemers bij de interne kwaliteitszorg en zelfevaluatie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.5
    text: |-
      In het reglement kunnen andere, nader te omschrijven onderwerpen worden opgenomen ten aanzien waarvan een van de
      bijzondere bevoegdheden aan de deelnemersraad wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.2.6
    text: |-
      De deelnemersraad heeft adviesbevoegdheid met betrekking tot een voorgenomen besluit van de raad van toezicht ten
      aanzien van de profielen, bedoeld in [artikel 9.1.4, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 8a.2.2.7
    text: |-
      Alvorens de raad van toezicht tot benoeming of ontslag van een lid van het college van bestuur overgaat, wordt de
      deelnemersraad vertrouwelijk gehoord over het voorgenomen besluit tot benoeming of ontslag. Het horen geschiedt op
      een zodanig tijdstip dat het van wezenlijke invloed kan zijn op de besluitvorming.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.2
  - number: 8a.2.3
    text: |-
      De deelnemersraad neemt voorafgaand aan de uitoefening van de adviesbevoegdheid, bedoeld in
      [artikel 8a.2.2, vierde lid, onder a][ref1], voor zover het betreft fusie en overdracht van de instelling, kennis
      van de opgestelde fusie-effectrapportage, bedoeld in [artikel 2.1.10, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.3.1.1
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de voorschriften in dit hoofdstuk, voor een periode van telkens vijf
      jaar een reglement voor de deelnemersraad vast. Het reglement kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2
    text: 'In het reglement worden in ieder geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.a
    text: het aantal leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.b
    text: de wijze en organisatie van de verkiezingen van de leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.c
    text: de zittingsduur van de leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.d
    text: |-
      de wijze waarop wordt gewaarborgd dat de leden van de deelnemersraad hun uit het lidmaatschap van de deelnemersraad
      voortvloeiende verplichtingen nakomen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.e
    text: |-
      de voorstellen van de deelnemersraad, bedoeld in [artikel 8a.2.1, tweede lid][ref1], waarover het bevoegd gezag een
      standpunt inneemt, en de termijnen daarvoor;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.3.1.2.f
    text: het verschaffen van informatie door het bevoegd gezag aan de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.g
    text: |-
      de termijnen binnen welke tot instemming of onthouding van instemming moet worden besloten, en de termijnen binnen
      welke advies moet worden uitgebracht;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.2.h
    text: het toekennen van eventuele andere bevoegdheden aan de deelnemersraad.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.3.1.3
    text: |-
      Het bevoegd gezag legt het reglement, alsmede elke wijziging ervan, als voorstel aan de deelnemersraad voor
      en stelt het slechts vast voor zover het voorstel de instemming van twee derden van het aantal leden van de
      deelnemersraad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.3.1
  - number: 8a.4.1.1
    text: |-
      Er is een landelijke geschillencommissie medezeggenschap, waarbij elke instelling is aangesloten. De commissie
      bestaat uit drie leden, waaronder de voorzitter, en drie plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.1
  - number: 8a.4.1.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap, in overeenstemming met Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, benoemt de leden en plaatsvervangende leden voor vier jaar. Zij zijn een keer herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.1
  - number: 8a.4.1.3
    text: |-
      Een lid en een plaatsvervangend lid worden benoemd op bindende voordracht van vertegenwoordigers van de
      gezamenlijke bevoegde gezagsorganen van de instellingen en een lid en een plaatsvervangend lid op bindende
      voordracht van vertegenwoordigers van de deelnemersraden van de instellingen. Deze twee leden doen een bindende
      voordracht voor het derde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.1
  - number: 8a.4.1.4
    text: |-
      Indien sprake is van een geschil als bedoeld in [artikel 8a.4.2, onderdeel a][ref1], voor zover het betreft
      het ontbreken van de vereiste instemming van de ondernemingsraad met het medezeggenschapsstatuut, wordt voor
      de duur van behandeling van dat geschil een lid benoemd op bindende voordracht van vertegenwoordigers van de
      ondernemingsraden van de instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.1.5
    text: |-
      De leden en de plaatsvervangende leden mogen geen deel uitmaken van het bevoegd gezag of van de deelnemersraad van
      een instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.1
  - number: 8a.4.2
    text: 'De commissie neemt kennis van de volgende geschillen:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.2
  - number: 8a.4.2.a
    text: |-
      op verzoek van het bevoegd gezag of van de deelnemersraad, indien het bevoegd gezag ten aanzien van een voorgenomen
      besluit als bedoeld in [artikel 8a.2.2, derde lid][ref1], niet de vereiste instemming heeft verworven;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.2.b
    text: |-
      op verzoek van het bevoegd gezag of van de deelnemersraad, indien het bevoegd gezag en de raad van mening
      verschillen over de interpretatie van hoofdstuk 8a dan wel het reglement;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.2
  - number: 8a.4.2.c
    text: |-
      op verzoek van de deelnemersraad, indien het bevoegd gezag een besluit heeft genomen waarover ingevolge
      [artikel 8a.2.2, vierde lid][ref1], of [artikel 8a.5.1][ref2] juncto artikel 8a.2.2 advies door de deelnemersraad
      is uitgebracht, het bevoegd gezag daarbij het uitgebrachte advies niet of niet geheel heeft gevolgd en de
      deelnemersraad van oordeel is dat daardoor de belangen van de deelnemers, van de deelnemersraad of van de
      instelling ernstig worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.1
    text: |-
      Voor zover aan een voorgenomen besluit van het bevoegd gezag als bedoeld in [artikel 8a.2.2, derde lid][ref1], de
      vereiste instemming is onthouden, deelt het bevoegd gezag aan de deelnemersraad dan wel de deelnemersraad aan het
      bevoegd gezag binnen drie maanden mede of het voorstel wordt voorgelegd aan de commissie. Indien een dergelijke
      mededeling niet binnen drie maanden wordt gedaan, vervalt het voorstel. Het voorstel vervalt eveneens, indien door
      het bevoegd gezag aan de deelnemersraad dan wel door de deelnemersraad aan het bevoegd gezag is meegedeeld dat het
      voorstel wordt voorgelegd aan de commissie en het voorstel niet binnen zes weken na het doen van deze mededeling
      daadwerkelijk wordt voorgelegd aan de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.2
    text: |-
      Indien het bevoegd gezag een verzoek doet als bedoeld in [artikel 8a.4.2, onderdeel a][ref1], geschiedt dit onder
      overlegging van de door het bevoegd gezag gemaakte afweging van de belangen die daarbij voor het bevoegd gezag aan
      de orde zijn, en stelt de commissie de deelnemersraad in de gelegenheid om zijn argumenten voor het onthouden van
      zijn instemming bij de commissie naar voren te brengen. Indien de deelnemersraad een verzoek doet als bedoeld in
      artikel 8a.4.2, onderdeel a, wordt het verzoek met redenen omkleed en stelt de commissie het bevoegd gezag in de
      gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de deelnemersraad voor te leggen, tenzij
      het bevoegd gezag of de deelnemersraad te kennen geeft daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van zowel het bevoegd gezag als
      de deelnemersraad, stelt zij vast, indien het betreft een geschil als bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
  - number: 8a.4.3.3.a
    text: |-
      artikel 8a.4.2, onderdeel a: of de deelnemersraad in redelijkheid tot het onthouden van instemming heeft
      kunnen komen of dat sprake is van bepaalde zwaarwegende omstandigheden die het voorstel van het bevoegd gezag
      rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
  - number: 8a.4.3.3.b
    text: 'artikel 8a.4.2, onderdeel b: welke interpretatie aan dit hoofdstuk of het reglement moet worden gegeven;'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
  - number: 8a.4.3.3.c
    text: |-
      artikel 8a.4.2, onderdeel c: of het bevoegd gezag bij afweging van betrokken belangen in redelijkheid tot het
      besluit heeft kunnen komen en of het besluit al dan niet in stand kan blijven.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
  - number: 8a.4.3.4
    text: |-
      Voor zover de commissie van oordeel is dat het voorstel van het bevoegd gezag niet in redelijkheid tot stand is
      gekomen, geeft zij aan hoe het voorstel moet worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
  - number: 8a.4.3.5
    text: |-
      Onverminderd [artikel 8a.4.4][ref1] is een vaststelling van de commissie als bedoeld in het derde lid, voor het
      bevoegd gezag en de deelnemersraad bindend. Zo nodig neemt het bevoegd gezag met inachtneming van de vaststelling
      van de commissie een nieuw besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.6
    text: |-
      Indien de ondernemingsraad ten aanzien van een voorstel tot vaststelling of wijziging van het
      medezeggenschapsstatuut zijn instemming heeft onthouden, zijn de [artikelen 27, vierde tot en met zesde lid][ref1],
      en [36 van de Wet op de ondernemingsraden][ref2] van overeenkomstige toepassing, met dien verstande dat de
      bevoegdheden van de bedrijfscommissie, bedoeld in het genoemde artikel 36, worden uitgeoefend door de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel36
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '36'
  - number: 8a.4.4.1
    text: |-
      De deelnemersraad kan in rechte optreden indien de vordering strekt tot naleving door het bevoegd gezag van
      de verplichtingen jegens de deelnemersraad, voortvloeiend uit [hoofdstuk 8a][ref1]. Tegen een uitspraak van de
      commissie op grond van [artikel 8a.4.3][ref2] staat beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.4.2
    text: |-
      Een vordering of beroep als bedoeld in het eerste lid, wordt ingediend bij de ondernemingskamer van het gerechtshof
      Amsterdam.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
  - number: 8a.4.4.3
    text: |-
      Het beroep wordt ingediend bij beroepschrift binnen een maand nadat het bevoegd gezag of de deelnemersraad van de
      uitspraak op de hoogte is gesteld. De wederpartij wordt van het beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
  - number: 8a.4.4.4
    text: |-
      Het beroep kan uitsluitend worden ingesteld op de grond dat de commissie een onjuiste toepassing heeft gegeven aan
      de wet.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
  - number: 8a.4.4.5
    text: Tegen een uitspraak van de ondernemingskamer kan geen beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
  - number: 8a.4.4.6
    text: |-
      In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:75 van de Algemene wet bestuursrecht][ref2] kan de deelnemersraad niet in de proceskosten worden
      veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8a.4.4.7
    text: |-
      In dit artikel wordt onder «uitspraak» verstaan: een vaststelling of oordeel van de commissie als bedoeld in
      [artikel 8a.4.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.5
    text: |-
      Deze titel is van overeenkomstige toepassing op het advies, bedoeld in [artikel 8a.2.2, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.5.1.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan de instelling
      ten grondslag ligt, kan het bevoegd gezag in het reglement een aan de deelnemersraad toekomend instemmingsrecht
      omzetten in een adviesrecht. In afwijking van [artikel 8a.2.2, derde lid, onderdeel l][ref1], juncto
      [artikel 8a.3.1][ref2] stelt het bevoegd gezag het reglement, daaronder elke wijziging ervan mede begrepen, slechts
      vast nadat het hierover advies heeft ontvangen van de deelnemersraad. Het bevoegd gezag kan slechts toepassing
      geven aan de eerste volzin indien een meerderheid van twee derden van de deelnemers dat ondersteunt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.5.1.2
    text: |-
      De mogelijkheid tot afwijking, bedoeld in het eerste lid, komt te vervallen indien de gronden waarop zij berustte
      niet langer aanwezig zijn dan wel indien zij niet langer worden ondersteund door een meerderheid van twee derden
      van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.5.1
  - number: 8a.5.1.3
    text: |-
      Het bevoegd gezag toetst elke vijf jaar de stand van zaken met betrekking tot de gronden van de afwijking en de
      ondersteuning ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel8a.5.1
  - number: 9.1.1
    text: |-
      Bijzondere instellingen worden in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid niet zijnde
      een rechtspersoon als bedoeld in [artikel 2:1 van het Burgerlijk Wetboek][ref1], die zich blijkens de statuten
      of reglementen het geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst
      te beogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.1.2.1
    text: |-
      Het bevoegd gezag van een openbare instelling kan de instandhouding van die instelling overdragen aan een ander
      orgaan dat tot de instandhouding van een openbare instelling bevoegd is.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.2
  - number: 9.1.2.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte
      van levering als bedoeld in [artikel 3:89 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen het personeel in gelijke betrekkingen aan de instelling aanstelt met
      ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 9.1.2.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de instelling,
      onverminderd hetgeen verder voor de overgang naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.2
  - number: 9.1.2.4
    text: |-
      Van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken kan Onze
      Minister in bijzondere omstandigheden ontheffing verlenen. Onze Minister besluit binnen zes maanden na ontvangst
      van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.2
  - number: 9.1.3.1
    text: |-
      De rechtspersoon die een bijzondere instelling in stand houdt, kan de instandhouding van die instelling overdragen
      aan een andere rechtspersoon die voldoet aan [artikel 9.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.2
    text: |-
      Op deze overdracht is [artikel 9.1.2, tweede tot en met vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.3
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere instelling in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de instelling in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding
      van de instelling overgaat. In het laatste geval is [artikel 9.1.2, tweede tot en met vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.4.1
    text: Een bijzondere instelling heeft een college van bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.2
    text: |-
      Een lid van een raad van toezicht heeft geen directe belangen bij de instelling. Een lid van het college van
      bestuur kan niet tevens lid zijn van het college van bestuur van een andere instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.3
    text: |-
      De raad van toezicht houdt, met het oog op de taken van de desbetreffende instelling, genoemd in
      [artikel 1.3.5][ref1], toezicht op de uitvoering van werkzaamheden en de uitoefening van bevoegdheden door het
      college van bestuur en staat dit college met raad ter zijde. De raad van toezicht is in elk geval belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.1.4.3.a
    text: het benoemen, schorsen, ontslaan en vaststellen van de beloning van de leden van het college van bestuur;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.3.b
    text: het goedkeuren van het bestuursreglement;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.3.c
    text: |-
      het goedkeuren van de begroting, de jaarrekening, het jaarverslag en, indien van toepassing, het strategisch
      meerjarenplan van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.3.d
    text: |-
      het toezien op de naleving van wettelijke verplichtingen en de omgang met de branchecode, bedoeld in
      [artikel 2.5.4, eerste lid][ref1], door het college van bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.1.4.3.e
    text: |-
      het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen van de instelling verkregen op grond van de [artikelen 2.2.1][ref1], [2.2.3][ref2] en [2.3.4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.1.4.3.f
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de raad, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 9.1.4.3.g
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met f, in het jaarverslag van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.4
    text: Het college van bestuur voorziet de raad van toezicht van onafhankelijke administratieve ondersteuning.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.5
    text: |-
      De samenstelling, taken en bevoegdheden van de raad van toezicht zijn zodanig dat de raad een deugdelijk en
      onafhankelijk toezicht kan uitoefenen. De leden van de raad van toezicht hebben daarin zitting op persoonlijke
      titel en oefenen hun functie uit zonder last of ruggespraak. De benoeming van de leden van de raad geschiedt op
      basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.6
    text: |-
      De statuten van de rechtspersoon die een bijzondere instelling in stand houdt, voorzien in een regeling die
      waarborgt dat de ondernemingsraad invloed kan uitoefenen op de samenstelling van de raad van toezicht van de
      desbetreffende instelling. De bedoelde regeling houdt ten minste in dat de ondernemingsraad in de gelegenheid wordt
      gesteld om
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.6.a
    text: aan de raad van toezicht advies uit te brengen over de profielen, bedoeld in het vijfde lid, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.6.b
    text: een bindende voordracht te doen voor één lid van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
  - number: 9.1.4.7
    text: |-
      De statuten van de rechtspersoon die een bijzondere instelling in stand houdt, voorzien in een regeling
      die waarborgt dat de raad van toezicht de ondernemingsraad vertrouwelijk hoort over een voorgenomen besluit
      tot benoeming of ontslag van een lid van het college van bestuur, niet zijnde bestuurder in de zin van de
      [Wet op de ondernemingsraden][ref1]. Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan
      zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 9.1.5.1
    text: |-
      Het bevoegd gezag van een openbare instelling kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden
      overdragen aan een alsdan in te stellen college van bestuur. [Artikel 9.1.4, eerste, tweede en vijfde lid][ref1],
      en [artikel 9.1.7, eerste en tweede lid][ref2], zijn in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.5.2
    text: |-
      Indien dat dienstig is voor een goede uitvoering van deze wet, kan het bevoegd gezag de uitoefening van hem
      bij wettelijk voorschrift opgedragen taken en bevoegdheden opdragen aan het bestuur van een kenniscentrum
      beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.5
  - number: 9.1.7.1
    text: 'Het college van bestuur stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.a
    text: |-
      de verantwoordelijkheidsverdeling tussen het college van bestuur en de raad van toezicht en de wijze waarop
      conflicten tussen beide organen worden geregeld;
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.b
    text: de wijze waarop het college van bestuur zijn taken en bevoegdheden uitoefent, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.c
    text: 'indien de instelling een of meer organisatorische eenheden omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.1°
    text: de organisatorische eenheden die de instelling omvat,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.2°
    text: de taken en bevoegdheden die zijn op- of overgedragen aan het bestuur van de desbetreffende eenheid,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.3°
    text: de verhouding van het bestuur van de desbetreffende eenheid tot het college van bestuur en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.4°
    text: de samenstelling, de wijze van benoeming en de werkwijze van het bestuur van de desbetreffende eenheid.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.2
    text: |-
      Het college van bestuur zendt het bestuursreglement, alsmede elke wijziging daarvan, zo spoedig mogelijk aan Onze
      minister.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.7.3
    text: |-
      Indien de statuten van een bijzondere instelling de onderwerpen, bedoeld in het eerste lid, onder a en c regelen,
      is regeling daarvan in het bestuursreglement niet noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.7
  - number: 9.1.8
    text: |-
      In afwijking van [artikel 9.1.4, eerste lid][ref1], kan een functionele scheiding tussen bestuur en
      toezicht worden aangebracht binnen het bestuur van de rechtspersoon waarvan de instelling uitgaat. De
      [artikelen 9.1.4, tweede tot en met vijfde lid][ref2], en [artikel 9.1.7][ref3] zijn van overeenkomstige
      toepassing. Het bevoegd gezag draagt zorg voor een deugdelijke scheiding tussen bestuur en toezicht, vermeldt in de
      statuten of het bestuursreglement de wijze waarop deze wordt gewaarborgd en vermeldt jaarlijks in het jaarverslag,
      bedoeld in [artikel 2.5.4][ref4], de redenen voor de afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.2.1.1
    text: |-
      Een kenniscentrum beroepsonderwijs bedrijfsleven wordt in stand gehouden door een rechtspersoon
      met volledige rechtsbevoegdheid zonder winstoogmerk niet zijnde een rechtspersoon als bedoeld in
      [artikel 2:1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.2.1.2
    text: 'Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven bestaat:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
  - number: 9.2.1.2.a
    text: |-
      ofwel voor een derde deel uit vertegenwoordigers van werkgeversorganisaties, voor een derde deel uit
      vertegenwoordigers van werknemersorganisaties en voor een derde deel uit vertegenwoordigers van de instellingen en
      de andere instellingen, bedoeld in [artikel 1.4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.1.2.b
    text: |-
      ofwel voor de helft uit vertegenwoordigers van werkgeversorganisaties en voor de helft uit vertegenwoordigers van
      werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
  - number: 9.2.1.3
    text: |-
      Aan een kenniscentrum beroepsonderwijs bedrijfsleven is een paritaire commissie beroepsonderwijs bedrijfsleven
      verbonden, die voor de helft bestaat uit vertegenwoordigers van het bedrijfsleven en voor de helft uit
      vertegenwoordigers van de instellingen en de andere instellingen, bedoeld in [artikel 1.4.1][ref1], die
      opleidingen verzorgen op het terrein waarop het kenniscentrum beroepsonderwijs bedrijfsleven werkzaam is.
      Onder de vertegenwoordigers van de instellingen bevinden zich in elk geval een of meer docenten als bedoeld
      in [artikel 4.2.1][ref2]. De paritaire commissie heeft tot taak om overeenstemming te bereiken tussen
      vertegenwoordigers van het bedrijfsleven en vertegenwoordigers van de instellingen over de inhoud van de bij Onze
      Minister in te dienen voorstellen voor kwalificatiedossiers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 9.2.1.4
    text: |-
      Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven kan indien dat dienstig is voor een goede
      uitvoering van deze wet, aan het bevoegd gezag van een instelling de uitoefening van hem bij wettelijk voorschrift
      opgedragen taken en bevoegdheden opdragen, met uitzondering van het doen van voorstellen als bedoeld in
      [artikel 7.2.4, tweede en derde lid][ref1]. Indien het bestuur gebruik maakt van deze mogelijkheid, stelt het
      een reglement vast waarin in elk geval worden vastgelegd de taken en bevoegdheden die het bestuur ter uitoefening
      opdraagt aan het bevoegd gezag, alsmede richtlijnen voor uitoefening van de aan het bevoegd gezag opgedragen taken
      en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.2.2.1
    text: |-
      De rechtspersoon die een kenniscentrum beroepsonderwijs bedrijfsleven in stand houdt, kan de instandhouding van dat
      kenniscentrum overdragen aan een andere rechtspersoon die voldoet aan [artikel 9.2.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2.2
    text: |-
      Op deze overdracht is [artikel 9.1.2, tweede tot en met vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Indien de uitspraak op een beroep als bedoeld in artikel 2 van de bij de Algemene wet bestuursrecht behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1] strekt tot onderscheidenlijk het toekennen van de rechten,
      genoemd in [artikel 1.3.1][ref2], diploma-erkenning als bedoeld in de [artikelen 1.4.1][ref3] of [1.4a.1][ref4],
      examinering als bedoeld in [artikel 1.6.1][ref5], of registratie in het Centraal register, treden de gevolgen
      daarvan in met ingang van het studiejaar dat aanvangt in het jaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 11.1.1
    text: |-
      Indien het bevoegd gezag van een instelling of een kenniscentrum beroepsonderwijs bedrijfsleven in strijd handelt
      met het bepaalde bij of krachtens deze wet, kan Onze Minister bepalen dat de rijksbijdrage, voorschotten daaronder
      begrepen, geheel of gedeeltelijk wordt ingehouden dan wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.1
  - number: 11.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een instelling in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 11.1.3
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het eerste
      of tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.1
  - number: 11.1.4
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing indien het bevoegd gezag van een agrarisch
      opleidingscentrum ten aanzien van het voorbereidend beroepsonderwijs dat in de instelling wordt verzorgd, in strijd
      handelt met het bepaalde bij of krachtens de [Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 11.2.1
    text: |-
      Het is anderen dan de instellingen die daartoe ingevolge deze wet gerechtigd zijn, verboden onderwijs aan te
      bieden of te verzorgen, dan wel examinering te verzorgen, onder de naam van een in het Centraal register opgenomen
      beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.2
  - number: 11.2.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.2
  - number: 11.2.3
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11.2
  - number: 11a.1.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het beroepsonderwijs kan bij
      wijze van experiment bij algemene maatregel van bestuur worden afgeweken van: - [titel 2 van hoofdstuk 2][ref1],
        - [hoofdstuk 6][ref2], en
        - [hoofdstuk 7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 11a.1.2
    text: 'In geval van toepassing van het eerste lid worden bij algemene maatregel van bestuur in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.2.b
    text: |-
      op welke wijze van welke artikelen van de in het eerste lid genoemde hoofdstukken, titels of paragrafen wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien, voordat een
      experiment is afgelopen, een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten
      in een structurele wettelijke regeling, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
  - number: 11a.1.6
    text: |-
