      uit een samenvoeging van een agrarisch opleidingscentrum met een school voor voorbereidend beroepsonderwijs in de
      sector landbouw, als bedoeld in [artikel 10c, onderdeel d, van de Wet op het voortgezet onderwijs][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
