        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 1.4a.1.5
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien
      de beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis
      en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien. Een begunstigende
      beschikking is voor het eerst van kracht ten aanzien van een opleiding educatie die aanvangt nadat die beschikking
      is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4a.1
  - number: 1.4a.1.6
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister jaarlijks voor 15 oktober een opgave van de
      opleidingen educatie, bedoeld in het eerste lid, die de instelling verzorgt in het lopende studiejaar, alsmede van
      de opleidingen educatie die de instelling heeft verzorgd in het daaraan voorafgaande studiejaar.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4a.1
  - number: 1.4a.1.7
    text: |-
      Voor zover ten aanzien van een instelling die een opleiding educatie verzorgt, toepassing is gegeven aan het eerste
      lid, wordt die instelling voor de toepassing van deze wet wat deze opleiding betreft, aangemerkt als een andere
      instelling dan bedoeld in [artikel 1.1.1, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 1.4a.1.8
    text: |-
