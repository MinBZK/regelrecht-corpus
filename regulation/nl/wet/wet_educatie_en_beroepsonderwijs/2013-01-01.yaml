      Beoordelingen, afgegeven op grond van de [artikelen 12][ref1] en
      [14 van de Subsidieregeling leerlinggebonden financiering MBO][ref2], die hebben geleid tot een indicatiestelling
      waarvan de duur nog niet is verstreken, gelden als een beoordeling die gemeld wordt door het bevoegd gezag van een
      instelling als bedoeld in [artikel 2.2.6, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019181#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0019181#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
