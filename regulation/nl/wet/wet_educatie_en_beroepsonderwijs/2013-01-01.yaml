      Onverminderd [artikel 4.2.1][ref1] kan tot docent aan een instelling worden benoemd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
