    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      Indien aan een agrarisch opleidingscentrum gedurende twee achtereenvolgende jaren minder dan 1200 deelnemers zijn
      ingeschreven voor beroepsopleidingen of voor het voorbereidend beroepsonderwijs, bedoeld in [artikel 1.3.3][ref1],
      kan Onze Minister besluiten dat aan die instelling de rechten, genoemd in [artikel 1.3.1][ref2], ontnomen worden,
      onverminderd het overigens met betrekking tot ontneming van rechten in deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
