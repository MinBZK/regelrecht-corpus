  - number: 12.2.7.a
    text: |-
      degene die in het studiejaar 1995-1996 bevoegd onderwijs heeft gegeven aan een school voor beroepsbegeleidend
      onderwijs, een school voor middelbaar beroepsonderwijs, dan wel wat deeltijds middelbaar beroepsonderwijs betreft
      aan een andere school, aan een vormingsinstituut voor jeugdigen of aan een instelling voor basiseducatie,
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.7.b
    text: |-
      degene die in de periode van 1 augustus 1990 tot en met 31 juli 1995 gedurende ten minste 40 weken bevoegd
      onderwijs als bedoeld in onderdeel *a* heeft gegeven, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.7.c
    text: degene die
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.7.c.1°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen van de opleiding cultureel werk
      of de opleiding culturele en maatschappelijke vorming behorend tot het onderdeel gedrag en maatschappij van het
      Centraal register opleidingen hoger onderwijs, met de differentiatie basiseducatie, dat op grond van de artikelen
      4 en 5 van het Uitvoeringsbesluit KVE 1991 zoals dat luidde op 31 juli 1995 zou hebben geleid tot een bevoegdheid
      voor het verzorgen van activiteiten basiseducatie, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.7.c.2°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen binnen het hoger pedagogisch
      onderwijs met de differentiatie basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.7.c.3°
    text: uiterlijk aan het begin van het studiejaar 1994-1995 is gestart met de differentiatie basiseducatie.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.7
  - number: 12.2.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de gevolgen
      voor het personeel van de invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.9
  - number: 12.2.10.1
    text: |-
      Op geschillen tussen personeel en bevoegd gezag van een school voor beroepsbegeleidend onderwijs, een school voor
      middelbaar beroepsonderwijs dan wel wat deeltijds middelbaar beroepsonderwijs betreft van een andere school, van
      een vormingsinstituut voor jeugdigen, van een instelling voor basiseducatie, een landbouwpraktijkschool of een
      kenniscentrum beroepsonderwijs bedrijfsleven die ingevolge de op 31 december 1995 geldende voorschriften aanhangig
      zijn gemaakt bij een commissie van beroep of bij de burgerlijke rechter, blijven de op die dag geldende regelingen
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.10
  - number: 12.2.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot geschillen tussen het bevoegd gezag en een
      deelnemer met betrekking tot examens.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.2.10
  - number: 12.3.8.1
    text: |-
      Het Christelijk Instituut voor Doven "Effatha" en het Instituut voor Doven "Sint-Michielsgestel" behouden in
      afwijking van [artikel 12.3.2][ref1] ten behoeve van het verzorgen van beroepsopleidingen die de voortzetting zijn
      van beroepsbegeleidend onderwijs dat deze instituten op 31 december 1995 verzorgden, aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.3.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.8.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde instituten. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of krachtens
      deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.3.8
  - number: 12.3.9.1
    text: |-
      Ten aanzien van de beroepsopleidingen die een voortzetting vormen van de opleidingen voor deeltijds middelbaar
      beroepsonderwijs in de sector dienstverlening en gezondheidszorg, op 31 december 1995 op grond van artikel 3.11
      van de Wet op het cursorisch beroepsonderwijs verbonden aan de Hogeschool Haarlem en aan de Hogeschool Tilburg,
      behouden deze hogescholen aanspraak op bekostiging uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.3.9
  - number: 12.3.9.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde beroepsopleidingen. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of
      krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.3.9
  - number: 12.3.44
    text: |-
      De op 31 december 1995 geldende voorschriften vastgesteld bij of krachtens de
      [Wet op het voortgezet onderwijs][ref1], de Wet op het cursorisch beroepsonderwijs of de Kaderwet
      Volwasseneneducatie 1991 blijven van toepassing ten aanzien van bedragen waarop de instellingen en de kenniscentra
      beroepsonderwijs bedrijfsleven voor 1 januari 1996 ingevolge de bedoelde voorschriften aanspraak hebben, maar die
      nog niet zijn vastgesteld of uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.3.44
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 12.4.1
    text: |-
      Op geschillen die ingevolge de op 31 juli 2008 geldende voorschriften van de
      [Subsidieregeling leerlinggebonden financiering MBO][ref1] aanhangig zijn gemaakt, blijft de op die dag geldende
      regeling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019181
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel12.4.1
    references:
      - id: ref1
        bwb_id: BWBR0019181
