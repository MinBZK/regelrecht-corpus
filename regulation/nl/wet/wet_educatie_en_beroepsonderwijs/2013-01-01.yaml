  - number: 1.4a.1.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt gedaan voor een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of voor een instelling. Het bevoegd gezag voegt bij deze aanvraag in elk geval het ontwerp van
      een beschrijving van de regeling voor het onderwijsprogramma en de examens, bedoeld in [artikel 7.4.8][ref2], voor
      de opleiding educatie waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4a.1.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid heeft geen betrekking op een opleiding educatie waarvoor de instelling
      een rijksbijdrage als bedoeld in [artikel 2.2a.1][ref1] of een bedrag als bedoeld in [artikel 2.3.3][ref2] ontvangt
      of op een opleiding educatie die daarmee overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
