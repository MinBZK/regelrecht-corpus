  - number: 11a.1.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband tussen een instelling en een
      school als bedoeld in de [Wet op het voortgezet onderwijs][ref1] of een instelling als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2]. Bij samenwerking met een school als bedoeld in de
      Wet op het voortgezet onderwijs kan voor die school worden afgeweken van [titel II, afdeling I, hoofdstuk I][ref3]
      en van [titel III, afdeling II, van die wet][ref4]. Bij de algemene maatregel van bestuur, bedoeld in het tweede
      lid, wordt geregeld welke bij of krachtens de Wet op het voortgezet onderwijs onderscheidenlijk de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek vastgestelde voorschriften van toepassing of van overeenkomstige toepassing
      zijn op de samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0002399#HoofdstukI
      [ref4]: https://wetten.overheid.nl/BWBR0002399#AfdelingII
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel11a.1
    references:
