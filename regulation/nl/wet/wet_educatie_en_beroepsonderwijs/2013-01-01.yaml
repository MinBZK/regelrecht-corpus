        hoofdstuk: I
        paragraaf: '3'
  - number: 1.6.1.1.b
    text: de examens, en
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.6.1
  - number: 1.6.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 1.6.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.6.1
  - number: 1.7.1.1
    text: |-
      Aan een instelling en een kenniscentrum beroepsonderwijs bedrijfsleven kunnen contractactiviteiten worden verricht,
      bestaande uit werkzaamheden voor eigen rekening ten behoeve van derden. Deze activiteiten kunnen worden verricht
      indien zij verband houden met werkzaamheden waarvoor de instelling of het kenniscentrum uit de openbare kas
      bekostigd wordt of, wat kenniscentra beroepsonderwijs bedrijfsleven betreft, met werkzaamheden verricht in het
      kader van dienstverlening jegens de instellingen en voor zover de uitvoering van die werkzaamheden hierdoor niet
      wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.7.1
  - number: 1.7.1.2
    text: |-
      Het bevoegd gezag van een instelling en het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven dragen er
      zorg voor dat [artikel 2 van de Wet privatisering ABP][ref1] van toepassing blijft op het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 1.7.1.3
    text: |-
      De vereisten voor benoembaarheid, bedoeld in [artikel 4.2.1, eerste lid][ref1], zijn niet van toepassing op een
      docent voor zover deze is belast met het verrichten van contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 1.7.1.4
    text: |-
      Het bevoegd gezag voorziet in een regeling voor het verrichten van contractactiviteiten door het personeel van
      de instelling en het kenniscentrum beroepsonderwijs bedrijfsleven met het oog op het voorkomen van vermenging van
      belangen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.7.1
  - number: 2.1.1
    text: |-
      Onverminderd de [artikelen 1.3.2a][ref1] en [1.3.3][ref2] komt een beroepsopleiding bij een instelling
      voor bekostiging in aanmerking indien zij is gericht op een kwalificatie of kwalificaties als bedoeld in
      [artikel 7.2.4, tweede lid, onder b3°][ref3] en de rechten, genoemd in [artikel 1.3.1][ref4], met betrekking tot
      de desbetreffende beroepsopleiding niet zijn ontnomen op grond van [artikel 6.1.4][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel6
