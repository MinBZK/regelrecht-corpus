  - number: 1.5.1
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven die daartoe op voet van [artikel 2.1.5][ref1] door Onze Minister in
      aanmerking zijn gebracht, hebben aanspraak op bekostiging uit ’s Rijks kas ten behoeve van het vervullen van hun
      bij deze wet opgedragen werkzaamheden, voor zover niet verricht in het kader van dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.5.2.1
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan het ontwikkelen en onderhouden van een landelijke
      kwalificatiestructuur, gericht op de aansluiting tussen het aanbod van beroepsonderwijs en de maatschappelijke
      behoeften daaraan, mede in het licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede gelet op van
      belang zijnde ontwikkelingen in internationaal verband.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.5.2
  - number: 1.5.2.2
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan een doelmatige en doelgerichte inzet van
      overheidsmiddelen door het ontwikkelen van voorstellen, welke beroepsopleidingen voor bekostiging uit ’s Rijks kas
      in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.5.2
  - number: 1.5.2.3
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan de bevordering van de kwaliteit van de plaatsen waar de
      beroepspraktijkvorming wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.5.2
  - number: 1.5.2.4
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen zoveel mogelijk zorg voor de beschikbaarheid van een
      toereikend aantal bedrijven en organisaties van voldoende kwaliteit die de beroepspraktijkvorming verzorgen.
      Kenniscentra beroepsonderwijs bedrijfsleven zijn voorts belast met een regelmatige beoordeling van die bedrijven
      en organisaties.
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.5.2
  - number: 1.6.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het recht
      heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in acht
      neemt hetgeen bij of krachtens deze wet is bepaald over:
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.6.1
  - number: 1.6.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1], voorzover het betreft de examinering,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.6.1
