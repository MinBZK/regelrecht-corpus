  - number: 1.3.3.1
    text: |-
      Agrarische opleidingscentra zijn instellingen waarin beroepsonderwijs op het gebied van landbouw, natuurlijke
      omgeving en voedsel en voorbereidend beroepsonderwijs in de afdeling landbouw, natuurlijke omgeving en voedsel,
      bedoeld in [artikel 10c, onderdeel d, van de Wet op het voortgezet onderwijs][ref1], worden verzorgd. Voor zover
      dat bij wet is bepaald, kan aan een agrarisch opleidingscentrum tevens ander voortgezet onderwijs worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.3.3
