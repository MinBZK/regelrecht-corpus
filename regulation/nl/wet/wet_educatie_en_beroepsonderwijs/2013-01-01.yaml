  - number: 1.4.1.7
    text: |-
      Voor een beroepsopleiding als bedoeld in de aanhef van het zesde lid kan bij ministeriële regeling een nadere
      specificatie worden gegeven van de gegevens, bedoeld in [artikel 2.5.5a, tweede lid][ref1], voor zover dat lid van
      overeenkomstige toepassing is verklaard in het zesde lid, onderdeel a, en worden bepaald welke van die gegevens
      niet langer behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent
      de tijdstippen en de wijze van verstrekking van die gegevens. Bij ministeriële regeling worden regels gesteld ter
      uitvoering van [artikel 2.5.5c, eerste en derde lid][ref2], voor zover die leden van overeenkomstige toepassing
      zijn verklaard in het zesde lid, onderdeel c, in ieder geval omtrent de inhoud en de samenstelling van die
      gegevens, de wijze waarop de gegevens uit het basisregister onderwijs worden verstrekt, de tijdstippen waarop de
      gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel1.4.1
