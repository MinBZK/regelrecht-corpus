      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2013-01-01#Artikel4.2.4
