      [artikel 4.2.1, tweede lid, onderdeel b 1° tot en met 4°][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.4.2.b
    text: |-
      betrokkene in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EG-beroepskwalificaties][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.2.4.2.c
    text: |-
      betrokkene in het bezit is van een buitenlands getuigschrift of diploma dat gelijkwaardig is aan een onder a
      bedoeld getuigschrift of een onder b bedoelde erkenning van beroepskwalificaties, of
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
  - number: 4.2.4.2.d
    text: |-
      betrokkene ten minste drie jaren ervaring heeft in de praktijk van het beroep waarop het desbetreffende onderwijs
      is gericht en naar het oordeel van het bevoegd gezag door een combinatie van opleiding en ervaring geacht
      wordt te beschikken over een kwalificatieniveau dat vergelijkbaar is met het onder a tot en met c bedoelde
      kwalificatieniveau, en
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
  - number: 4.2.4.2.e
    text: |-
      de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge samenhang bezien,
      naar het oordeel van het bevoegd gezag van voldoende belang zijn in verhouding tot de beoogde werkzaamheden aan
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Indien betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], stelt het bevoegd gezag vast,
      welke scholing en begeleiding voor betrokkene noodzakelijk zijn om binnen twee jaar na benoeming of tewerkstelling
      zonder benoeming te kunnen voldoen aan de in [artikel 4.2.3, derde lid onder a][ref2], genoemde bekwaamheidseisen
      ten aanzien van pedagogisch-didactische kennis, inzicht en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.5
    text: |-
      De op grond van artikel 4.2.4, derde lid, noodzakelijk geoordeelde scholing wordt uitgevoerd door of onder
      verantwoordelijkheid van een instelling voor hoger onderwijs als bedoeld in de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek die een lerarenopleiding verzorgt. Het bevoegd gezag stelt in overeenstemming met het
      bestuur van die instelling het voor betrokkene noodzakelijke scholingstraject vast.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2.5
  - number: 4.2a.1
    text: |-
      Tot lid van het personeel, anders dan bedoeld in de [artikelen 4.2.1][ref1] en [4.2.2][ref2], kan slechts
      worden benoemd degene die in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref3], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0014194
  - number: 4.3.1
    text: |-
      Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven stelt jaarlijks het beleid vast met betrekking tot
      de formatie van het kenniscentrum beroepsonderwijs bedrijfsleven. Zoveel mogelijk tegelijk met deze vaststelling
      bepaalt het bestuur functies en taken van het personeel van het kenniscentrum beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.3.1
  - number: 4.3.2
    text: |-
      [Artikel 4.1.2][ref1] is van overeenkomstige toepassing op de rechtspositie van het personeel van kenniscentra
      beroepsonderwijs bedrijfsleven, met dien verstande dat het gaat om kenniscentra beroepsonderwijs bedrijfsleven en
      de besturen daarvan in plaats van om instellingen en de bevoegde gezagsorganen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.3.3
    text: |-
      Op een kenniscentrum beroepsonderwijs bedrijfsleven zijn de [artikelen 4.1.5][ref1], [4.1.6][ref2] en [4.1.7][ref3]
      van overeenkomstige toepassing, met dien verstande dat de desbetreffende commissie van beroep haar werkzaamheden
      uitstrekt over ten minste drie kenniscentra beroepsonderwijs bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 6.1.1
    text: |-
      Het bevoegd gezag bepaalt welke beroepsopleidingen de instelling verzorgt. Ten aanzien van die opleidingen geldt
      de aanspraak op bekostiging uitsluitend indien Onze Minister krachtens [artikel 2.1.1][ref1] heeft besloten dat de
      opleidingen voor bekostiging in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.1.3.1
    text: |-
      Het bevoegd gezag zorgt ervoor dat een beroepsopleiding alleen door de instelling wordt aangeboden als er na
      beëindiging van de opleiding voldoende arbeidsmarktperspectief is voor de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.3
  - number: 6.1.3.2
    text: |-
      Onverminderd het eerste lid zorgt het bevoegd gezag van een instelling als bedoeld in de [artikelen 1.3.2a][ref1]
      of [1.3.3][ref2] ervoor dat een beroepsopleiding die niet behoort tot het werkgebied van een kenniscentrum
      beroepsonderwijs bedrijfsleven dat werkzaam is voor de specifieke bedrijfstak of groep van bedrijfstakken waarvoor
      de instelling opleidingen verzorgt, alleen wordt aangeboden als die beroepsopleiding aantoonbaar gericht is op
      en van belang is voor de specifieke bedrijfstak of groep van bedrijfstakken waarvoor de instelling opleidingen
      verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.1
    text: |-
      Onze Minister kan besluiten dat ten aanzien van een beroepsopleiding die de instelling verzorgt, de rechten,
      genoemd in [artikel 1.3.1][ref1], gedurende twee jaar worden ontnomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.1.a
    text: gebleken is dat de kwaliteit van die opleiding langer dan één jaar onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg,
      het onderwijs of de examens, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.1.c
    text: |-
      niet of niet meer wordt voldaan aan de zorgplicht, bedoeld in [artikel 6.1.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.4.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.2.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 1.3.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] meer is
      verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.4.2.c
    text: de registratie in het Centraal register wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.3
    text: |-
      Bij een beschikking tot ontneming van rechten bepaalt Onze Minister het tijdstip waarop die beschikking van kracht
      wordt zodanig, dat de voor de opleiding ingeschreven deelnemers de opleiding aan een andere instelling binnen een
      redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Onze Minister neemt een beschikking als bedoeld in het eerste lid voor 1 november van het jaar voorafgaand aan het
      studiejaar waarin het in het derde lid bedoelde tijdstip valt.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.4.5
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.4
  - number: 6.1.5.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder a][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding.
      Onze Minister geeft eerst toepassing aan [artikel 6.1.4, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.1.a
    text: na de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5
  - number: 6.1.5.1.b
    text: |-
      Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5
  - number: 6.1.5.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.3
    text: Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5
  - number: 6.1.5a.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.1.4, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5a
  - number: 6.1.5a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5a
  - number: 6.1.5b.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.4][ref1]. Bij
      de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in het
      Centraal register bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.5b.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5b.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.1.1
    text: |-
      De aanvraag om toepassing van [artikel 1.4.1][ref1] geldt mede als aanmelding voor registratie in het Centraal
      register. In aanvulling op de gegevens, bedoeld in [artikel 6.4.1, vijfde lid, en zesde lid, onder a en b][ref2],
      verschaft het bevoegd gezag van een niet uit ’s Rijks kas bekostigde instelling bij de aanmelding de gegevens
      waaruit blijkt dat het onderwijs van voldoende kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde,
      bedoeld in [artikel 1.4.1, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.1.2
    text: |-
      Indien Onze Minister de aanvraag om toepassing van [artikel 1.4.1][ref1] inwilligt, registreert hij bij de
      eerstvolgende gelegenheid daartoe, de opleiding in het Centraal register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1
    text: |-
      Onze Minister kan ten aanzien van een beroepsopleiding, verzorgd door een niet uit ’s Rijks kas bekostigde
      instelling, het recht, bedoeld in [artikel 1.4.1][ref1], ontnemen indien


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1.a
    text: gebleken is dat de kwaliteit van de opleiding gedurende een reeks van jaren onvoldoende is geweest,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.2
  - number: 6.2.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarde, bedoeld in [artikel 1.4.1, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1.c
    text: |-
      in strijd is gehandeld met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.2.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden en dat de registratie in het Centraal register wordt
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
