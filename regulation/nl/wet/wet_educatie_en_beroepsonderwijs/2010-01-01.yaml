  - number: 12.1a.3
    text: |-
      De opleidingen die op basis van de
      [Regeling subsidiëring proeftuinen herontwerp beroepsonderwijs studiejaar 2004–2005][ref1] voor bekostiging
      in aanmerking zijn gebracht, gelden met ingang van het studiejaar 2005–2006 voor de toepassing van deze wet als
      opleidingen die op basis van [artikel 12.1a.1, eerste lid][ref2], voor bekostiging in aanmerking zijn gebracht
      voor zover het deelnemers betreft die in het studiejaar 2004–2005 reeds voor de desbetreffende opleiding waren
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0017157
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
