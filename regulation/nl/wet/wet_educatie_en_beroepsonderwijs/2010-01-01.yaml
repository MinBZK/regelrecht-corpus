      berusten ten aanzien van het personeel aan instellingen in de zin van deze wet met ingang van 1 januari 1996 op
      onderscheidenlijk de [artikelen 4.1.1][ref6], [4.1.2][ref7], [3.1.2][ref8] en [3.2.1][ref9].


