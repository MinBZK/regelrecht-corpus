  - number: 1.4a.1.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt gedaan voor een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of voor een instelling. Het bevoegd gezag voegt bij deze aanvraag in elk geval het ontwerp van
      de in [artikel 7.4.8][ref2] bedoelde onderwijs- en examenregeling voor de opleiding educatie waarop de aanvraag
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.4a.1
    references:
      - id: ref1
