  - number: 12.1a.1.2
    text: Bij de aanvraag, bedoeld in het eerste lid, vermeldt het bevoegd gezag in elk geval
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.2.1°
    text: de naam en de studielast van de opleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.2.2°
    text: de leerweg of leerwegen waarin de opleiding wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.2.3°
    text: |-
      indien beschikbaar, de code waarmee het geheel van de desbetreffende eindtermen wordt aangeduid en de code waarmee
      de deelkwalificaties van de opleiding worden aangeduid,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.2.4°
    text: |-
      of het een opleiding betreft die is gericht op een bepaald beroep waarvoor bij of krachtens de wet vereisten zijn
      vastgesteld en
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.2.5°
    text: een voorstel voor de regeling, bedoeld in het eerste lid, laatste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.3
    text: |-
      De aanvraag, bedoeld in het eerste lid, geldt mede als aanmelding voor registratie in het Centraal register.
      Indien Onze Minister de aanvraag inwilligt en de eindtermen zijn vastgesteld, registreert hij bij de eerstvolgende
      gelegenheid daartoe de in het tweede lid, onder 1° tot en met 4°, genoemde gegevens in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.1.4
    text: |-
      De bekostiging op grond van het eerste lid eindigt op het door Onze Minister in de bekostigingsbeschikking
      bepaalde tijdstip of, indien dat eerder is, zodra de desbetreffende opleiding wordt bekostigd op grond van
      [artikel 2.1.1, eerste lid][ref1]. Bij niet nakoming van de voorwaarden, bedoeld in het eerste lid, kan Onze
      Minister onverminderd [artikel 11.1][ref2] bepalen dat de bekostiging met ingang van een eerder tijdstip dan
      bedoeld in de eerste volzin eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel11
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
