  - number: 12.1a.2.2
    text: |-
      [ Artikel 1.4.1, tweede tot en met vijfde lid][ref1], en [artikel 12.1a.1, tweede lid][ref2], zijn van
      overeenkomstige toepassing op de aanvragen, bedoeld in het eerste lid. In aanvulling op de gegevens, bedoeld
      in [artikel 12.1a.1, tweede lid][ref3], verschaft het bevoegd gezag van een niet uit ’s Rijks kas bekostigde
      instelling bij de aanvraag tevens de gegevens waaruit blijkt dat het onderwijs van voldoende kwaliteit is of zal
      zijn en dat wordt voldaan aan de voorschriften, bedoeld in [artikel 1.4.1, eerste lid][ref4]. De aanvraag, bedoeld
      in het eerste lid, geldt mede als aanmelding voor registratie in het Centraal register. Indien Onze Minister de
      aanvraag inwilligt en de eindtermen zijn vastgesteld, registreert hij bij de eerstvolgende gelegenheid daartoe de
      in [artikel 12.1a.1, tweede lid, onder 1° tot en met 4°][ref5], genoemde gegevens in het Centraal register.


