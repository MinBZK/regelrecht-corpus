        artikel: '1'
        hoofdstuk: I
        paragraaf: '4'
  - number: 1.4.1.5a
    text: |-
      Het eerste lid is niet van toepassing op opleidingen, bedoeld in [artikel 12.1a.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.4.1
    references:
