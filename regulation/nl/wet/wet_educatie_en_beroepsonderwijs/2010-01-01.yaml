  - number: 12.1a.1.6
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de toepassing van het eerste
      tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel12.1a.1
  - number: 12.1a.2.1
    text: |-
      Met het oog op de ontwikkeling van nieuwe kwalificaties en de daarop gerichte opleidingen kan Onze Minister
      op aanvraag van het bevoegd gezag van een andere instelling dan bedoeld in [artikel 1.1.1, onderdeel b][ref1],
      of van een instelling besluiten dat aan de met goed gevolg afgelegde examens of onderdelen van examens van
      opleidingen waarvoor de eindtermen zijn vastgesteld met toepassing van [artikel 7.2.4, lid 3a][ref2], of
      [artikel 17 van de Regeling subsidiëring proeftuinen herontwerp beroepsonderwijs studiejaar 2004–2005][ref3],
      een diploma of certificaat als bedoeld in [artikel 7.4.6][ref4] is verbonden. Voorwaarde voor de toepassing van de
      eerste volzin is dat de desbetreffende instelling de voorschriften, bedoeld in [artikel 1.4.1, eerste lid][ref5],
      in acht neemt. Onze Minister bepaalt de aanvang en het einde van de erkenning en de aanvullende voorwaarden
      voor erkenning, die in elk geval betrekking hebben op de regeling die de instelling treft om de belangen van de
      deelnemers te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
