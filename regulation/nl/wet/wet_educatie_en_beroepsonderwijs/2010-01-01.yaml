  - number: 12.2.2.1
    text: |-
      De op 31 december 1995 geldende voorschriften vastgesteld bij of krachtens de [artikelen 37a][ref1], [38][ref2],
      [39][ref3], [40][ref4] en [40a van de Wet op het voortgezet onderwijs][ref5], de artikelen 2.42, 2.45, 2.46, 2.51,
