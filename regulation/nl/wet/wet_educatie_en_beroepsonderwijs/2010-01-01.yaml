  - number: 12.2.5
    text: |-
      De op 31 december 1995 geldende voorschriften met betrekking tot het voortgezet
      algemeen volwassenenonderwijs die berusten op de [artikelen 23b, tweede lid][ref1], en
      [29, vijfde lid, van de Wet op het voortgezet onderwijs][ref2], berusten ten aanzien van de opleidingen
      voortgezet algemeen volwassenenonderwijs, bedoeld in [artikel 7.3.4][ref3], met ingang van 1 januari 1996 op
      [artikel 7.3.4, tweede lid][ref4], onderscheidenlijk [artikel 7.4.11, derde en zesde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel23
