  - number: 1.2.1.1
    text: |-
      Educatie is gericht op de bevordering van de persoonlijke ontplooiing ten dienste van het maatschappelijk
      functioneren van volwassenen door de ontwikkeling van kennis, inzicht, vaardigheden en houdingen op een wijze die
      aansluit bij hun behoeften, mogelijkheden en ervaringen alsmede bij maatschappelijke behoeften. Waar mogelijk sluit
      de educatie aan op het ingangsniveau van het beroepsonderwijs. Educatie omvat niet activiteiten op het niveau van
      het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.2.1
  - number: 1.2.1.2
    text: |-
      Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen,
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de deelnemers en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.2.1
  - number: 1.3.1.1
    text: |-
      Aan regionale opleidingencentra worden opleidingen beroepsonderwijs verzorgd en worden tot op een bij algemene
      maatregel van bestuur te bepalen tijdstip opleidingen educatie verzorgd. Vanaf het tijdstip, bedoeld in de eerste
      volzin, kunnen aan regionale opleidingencentra opleidingen educatie worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.1
  - number: 1.3.1.2
    text: |-
      Het regionaal opleidingencentrum dat daarvoor op grond van [artikel 2.1.3, eerste en tweede lid][ref1], in
      aanmerking komt, heeft aanspraak op bekostiging uit 's Rijks kas voor het verzorgen van beroepsopleidingen die op
      de voet van [artikel 2.1.1][ref2] voor bekostiging in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.1.3
    text: |-
      De regionale opleidingencentra die daarvoor op grond van [artikel 2.3.3][ref1] in aanmerking komen, ontvangen voor
      het verzorgen van opleidingen educatie een bedrag van het college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.1.4
    text: |-
      Aan de met goed gevolg afgelegde examens of onderdelen van examens van opleidingen als bedoeld in het tweede en
      derde lid, is een bewijsstuk als bedoeld in [artikel 7.4.6][ref1] dan wel [artikel 7.4.15][ref2] verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 1.3.2a.1
    text: |-
      Aan vakinstellingen worden beroepsopleidingen verzorgd die naar hun aard en onderlinge samenhang aantoonbaar
      gericht zijn op en van belang zijn voor een specifieke bedrijfstak of groep van bedrijfstakken.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.2a
  - number: 1.3.2a.2
    text: Artikel 1.3.1, tweede en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.2a
  - number: 1.3.3.1
    text: |-
      Agrarische opleidingscentra zijn instellingen waarin beroepsonderwijs op het gebied van de landbouw en de
      natuurlijke omgeving en voorbereidend beroepsonderwijs in de afdeling landbouw en natuurlijke omgeving, bedoeld in
      [artikel 10c, onderdeel d, van de Wet op het voortgezet onderwijs][ref1], worden verzorgd. Voor zover dat bij wet
      is bepaald, kan aan een agrarisch opleidingscentrum tevens ander voortgezet onderwijs worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
  - number: 1.3.3.2
    text: |-
      [Artikel 1.3.1, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.5
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.5
  - number: 1.3.5.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.5
  - number: 1.3.5.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen voor educatie en beroepsopleidingen, en
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.5
  - number: 1.3.5.c
    text: het bieden van mogelijkheden voor loopbaanoriëntatie en -begeleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.5
  - number: 1.3.6.1
    text: |-
      Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling in en draagt er in dat verband zorg
      voor dat, zo veel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling
      van de kwaliteit van het onderwijs, waaronder maatregelen en instrumenten om te waarborgen dat het personeel zijn
      bekwaamheid onderhoudt. Het bevoegd gezag draagt er zorg voor dat de in de eerste volzin bedoelde beoordeling
      geschiedt met betrokkenheid van onafhankelijke deskundigen en belanghebbenden. De uitkomsten van de beoordeling
      zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.6
  - number: 1.3.6.2
    text: 'Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.6
  - number: 1.3.6.2.a
    text: de beoordeling, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.6
  - number: 1.3.6.2.b
    text: de uitkomsten van die beoordeling, en
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.6
  - number: 1.3.6.2.c
    text: het voorgenomen beleid in het licht van die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.6
  - number: 1.3.7.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.7
  - number: 1.3.7.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.7
  - number: 1.3.8.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige deelnemer van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.8.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007625/2010-01-01#Artikel1.3.8
    references:
