      1 Het experiment leergang vm2, dat is onderverdeeld in zes leergangen van vier jaar die per opvolgend leerjaar
      zijn of worden gestart, wordt voor de toepassing van [artikel 11a.1, vierde lid][ref1], geacht te zijn gestart op
      1 augustus 2008.

      2 [Artikel 11a.1, vierde lid][ref2], wordt ten aanzien van de duur van het experiment leergang vm2 zodanig
      toegepast dat een leerling die deelneemt aan een leergang die binnen de termijn van zes jaar is gestart, de
      leergang van vier jaar kan doorlopen.


