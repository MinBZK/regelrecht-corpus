        bwb_id: BWBR0044212
        artikel: '2.6'
  - number: 8.0.3
    text: |-
      1 Bij de aanmelding, bedoeld in [artikel 8.0.1][ref1], legt de betrokkene of, als deze minderjarig is, diens
      ouders, zijn persoonsgebonden nummer over onder vermelding van, indien van toepassing, de school als bedoeld in de
      [Wet op het voorgezet onderwijs][ref2], de school of instelling als bedoeld in de Wet op de expertisecentra of de
      instelling als bedoeld in deze wet waar hij op het moment van aanmelding staat ingeschreven.

      2 Het persoonsgebonden nummer wordt overgelegd door middel van een van overheidswege verstrekt document, waarop
      tevens de gegevens over de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van betrokkene zijn
      vermeld. Indien geen persoonsgebonden nummer kan worden overgelegd, worden in plaats daarvan de geslachtsnaam, de
      voorletters, de geboortedatum en het geslacht van betrokkene vermeld.

      3 Indien degene die zich aanmeldt nog is ingeschreven bij een school of instelling als bedoeld in het eerste
      lid, doet het bevoegd gezag waar betrokkene zich aanmeldt, aan het bevoegd gezag van de school of instelling waar
      betrokkene is ingeschreven, zo snel mogelijk opgave van deze aanmelding en vermeldt daarbij:

      a. of aan de betrokkene een positieve beslissing over inschrijving als bedoeld in [artikel 8.1.1, lid 1c][ref3],
      bekend is gemaakt;

      b. of de aanmelding in verband met de toepassing van [artikel 8.1.1c][ref4] niet tot inschrijving kan leiden;

      c. of de aanmelding is ingetrokken; en

      d. of de betrokkene is ingeschreven.

      4 Indien degene die zich aanmeldt niet in het bezit is van een diploma dat wordt aangemerkt als een
      startkwalificatie en de leeftijd van 27 jaar nog niet heeft bereikt, doet het bevoegd gezag waar betrokkene zich
      aanmeldt, zo snel mogelijk aan het college van burgemeester en wethouders van de woon- of verblijfplaats van
      betrokkene, opgave van deze aanmelding en vermeldt daarbij:

      a. of aan de betrokkene een positieve beslissing over inschrijving als bedoeld in [artikel 8.1.1, lid 1c][ref5],
      bekend is gemaakt;

      b. of de aanmelding in verband met de toepassing van [artikel 8.1.1c][ref6] niet tot inschrijving leidt;

      c. of de aanmelding is ingetrokken; en

      d. of de betrokkene is ingeschreven.

      5 Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het derde en vierde lid. Deze betreffen in
      ieder geval een specificatie van de gegevens en het tijdstip en de wijze waarop deze gegevens worden geleverd.

      6 De informatie bedoeld in het derde lid, respectievelijk het vierde lid, wordt door het bevoegd gezag van de
      school of instelling waar een betrokkene op het moment van aanmelding is ingeschreven respectievelijk door het
      college van burgemeester en wethouders van de gemeente waar deze woon- of verblijfplaats heeft, uitsluitend
      gebruikt ten behoeve van het voorkomen van voortijdig schoolverlaten.


