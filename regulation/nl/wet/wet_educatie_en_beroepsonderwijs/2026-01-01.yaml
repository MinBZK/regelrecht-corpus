        bwb_id: BWBR0007625
        artikel: 8a.2.2
        hoofdstuk: 8a
  - number: 8a.2.4
    text: |-
      1 Een ouderraad van een verticale scholengemeenschap heeft instemmingsbevoegdheid met betrekking tot voorgenomen
      beslissingen van het bevoegd gezag ten aanzien van:

      a. de vaststelling van de schoolgids voor een school;

      b. de vaststelling of wijziging van de hoogte en de vaststelling of wijziging van de bestemming van de middelen die
      van de ouders wordt gevraagd zonder dat daartoe een wettelijke verplichting bestaat dan wel zijn ontvangen op grond
      van een overeenkomst die door de ouders is aangegaan;

      c. de vaststelling of wijziging van het beleid met betrekking tot het beheersbaar houden van de middelen
      die van de ouders worden gevraagd voor schoolkosten, met uitzondering van lesmateriaal als bedoeld in
      [artikel 2.110 van de Wet voortgezet onderwijs 2020][ref1], die door het bevoegd gezag noodzakelijk worden
      bevonden;

      d. vaststelling of wijziging van een regeling over het verwerken van en de bescherming van persoonsgegevens van
      ouders;

      e. vaststelling of wijziging van het beleid ten aanzien van de uitwisseling van informatie tussen het bevoegd gezag
      en ouders.

      2 De ouderraad van een verticale scholengemeenschap heeft adviesbevoegdheid met betrekking tot voorgenomen
      beslissingen van het bevoegd gezag ten aanzien van:

      a. regeling van de gevolgen voor ouders met betrekking tot een aangelegenheid omtrent beëindiging, belangrijke
      inkrimping, uitbreiding van werkzaamheden van een school of een belangrijk onderdeel daarvan, dan wel vaststelling
      of wijziging van het beleid ter zake;

      b. regeling van de gevolgen voor ouders van het aangaan, verbreken of belangrijk wijzigen van een duurzame
      samenwerking met een andere school of instelling, dan wel vaststelling of wijziging van het beleid ter zake;

      c. verandering of omzetting van de grondslag van de school, of een onderdeel daarvan, dan wel vaststelling of
      wijziging van het beleid ter zake.

      3 [Artikel 8a.2.2, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.110
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
