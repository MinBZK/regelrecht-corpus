  - number: 1.1.2
    text: |-
      De bij of krachtens deze wet gestelde bepalingen die zich rechtstreeks of naar hun aard richten tot het bevoegd
      gezag, zijn voor het bekostigd bijzonder onderwijs voorwaarden voor bekostiging.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.1.2
  - number: 1.2.1
    text: |-
      1 Educatie is gericht op bevordering van de zelfredzaamheid van volwassenen en sluit waar mogelijk aan op het
      ingangsniveau van het beroepsonderwijs. Educatie omvat activiteiten op het niveau van het basisonderwijs en het
      voortgezet onderwijs. Opleidingen voortgezet algemeen volwassenenonderwijs zijn gericht op het behalen van een
      diploma van onderwijs als bedoeld in de [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref1].

      2 Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen,
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de studenten en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.4'
  - number: 1.3.1
    text: |-
      1 Aan regionale opleidingencentra worden verzorgd:

      a. opleidingen beroepsonderwijs en

      b. indien de desbetreffende instelling op 1 augustus 2012 een of meer opleidingen voortgezet algemeen
      volwassenenonderwijs verzorgde: een of meer opleidingen voortgezet algemeen volwassenenonderwijs.

      2 Aan regionale opleidingencentra kunnen een of meer opleidingen voortgezet algemeen volwassenenonderwijs worden
      verzorgd, indien de desbetreffende instelling op 1 augustus 2012 geen voortgezet algemeen volwassenenonderwijs
      verzorgde.

      3 Het regionaal opleidingencentrum dat daarvoor op grond van [artikel 2.1.3, eerste en tweede lid][ref1], in
      aanmerking komt, heeft aanspraak op bekostiging uit ’s Rijks kas voor

      a. het verzorgen van beroepsopleidingen die op de voet van [artikel 2.1.1][ref2] voor bekostiging in aanmerking
      komen en

      b. het verzorgen van opleidingen voortgezet algemeen volwassenenonderwijs die op de voet van [artikel 2.1.2][ref3]
      voor bekostiging in aanmerking komen.

      4 Aan de met goed gevolg afgelegde examens of onderdelen van examens van opleidingen als bedoeld in het
      derde lid is een bewijsstuk als bedoeld in [artikel 7.4.6][ref4] of, indien het betreft voortgezet algemeen
      volwassenenonderwijs, [7.4.11, vijfde lid][ref5], verbonden.


