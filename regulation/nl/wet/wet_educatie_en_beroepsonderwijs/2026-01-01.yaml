  - number: 6.2.2
    text: |-
      1 Onze Minister kan ten aanzien van een beroepsopleiding in de beroepsopleidende of beroepsbegeleidende leerweg,
      verzorgd door een niet uit ’s Rijks kas bekostigde instelling, het recht, bedoeld in [artikel 1.4.1][ref1],
      ontnemen indien

      a. gebleken is dat de kwaliteit van die opleiding ten minste drie maanden onvoldoende is geweest,

      b. niet of niet meer voldaan wordt aan de voorwaarde, bedoeld in [artikel 1.4.1, eerste lid][ref2],
      aan [artikel 1.4.1, tiende lid, onderdelen a tot en met c][ref3],
      aan [artikel 1.4.2][ref4], of aan de leveringsverplichting, bedoeld in
      [artikel 12, eerste, derde en vierde lid, van de Wet register onderwijsdeelnemers][ref5], of

      c. in strijd is gehandeld met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref6].

      2 Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma
      als bedoeld in [artikel 7.4.6][ref7] of certificaat als bedoeld in [artikel 7.2.3][ref8] is verbonden en dat de
      registratie in de Registratie instellingen en opleidingen wordt beëindigd.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een beroepsopleiding in een andere leerweg als
      bedoeld in [artikel 1.4.1, lid 1a][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
