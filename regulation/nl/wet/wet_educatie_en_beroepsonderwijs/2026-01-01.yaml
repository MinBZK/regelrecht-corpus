  - number: 6.1.2
    text: |-
      1 Het bevoegd gezag van een instelling meldt aan Onze Minister het voornemen tot het starten of beëindigen van
      een beroepsopleiding voorafgaand aan het studiejaar waarin wordt beoogd de beroepsopleiding te starten of te
      beëindigen.

      2 Bij ministeriële regeling worden nadere voorschriften gesteld omtrent:

      a. het uiterste tijdstip van melding, waarbij onderscheid kan worden gemaakt tussen het starten en beëindigen van
      een opleiding in de beroepsopleidende en in de beroepsbegeleidende leerweg;

      b. de vorm en nadere inhoud van de melding.

      3 Onze Minister maakt de melding openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.2
  - number: 6.1.2a
    text: |-
      1 Het bevoegd gezag zorgt ervoor dat de instelling voldoende keuzedelen verzorgt waar studenten uit kunnen kiezen
      in het kader van hun beroepsopleiding.

      2 Het bevoegd gezag kan één of meer onderdelen van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b tot en met d][ref1], aanbieden die niet behoren tot de kwalificaties of de
      keuzedelen, mits deze onderdelen betrekking hebben op persoonlijke, culturele of levensbeschouwelijke vorming,
      aantoonbaar van voldoende kwaliteit zijn en niet samenvallen met onderdelen van de desbetreffende kwalificatie. Bij
      toepassing van de eerste volzin legt het bevoegd gezag hierover verantwoording af in het bestuursverslag, bedoeld
      in [artikel 2.5.4][ref2], dan wel, bij toepassing van [artikel 1.4.1, eerste lid][ref3], in het verslag, bedoeld in
      artikel 1.4.1, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.2a
