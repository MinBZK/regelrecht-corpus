  - number: 8.0.2
    text: |-
      1 Het bevoegd gezag geeft jaarlijks op welke vavo-studenten die aan die instelling een opleiding voor
      voortgezet algemeen volwassenen onderwijs gericht op het behalen van een diploma van onderwijs als bedoeld in
      [artikel 2.6 van de Wet voortgezet onderwijs 2020][ref1] volgen, naar verwachting het aankomend studiejaar hun
      opleiding zullen vervolgen aan een beroepsopleiding. De opgave wordt gedaan aan het college van burgemeester en
      wethouders van de woon- of verblijfplaats van deze vavo-studenten. Deze informatie wordt uitsluitend gebruikt om
      schooluitval bij de overgang naar het beroepsonderwijs te voorkomen.

      2 Bij ministeriële regeling worden ter uitvoering van het eerste lid regels vastgesteld. Deze betreffen in ieder
      geval een specificatie van de bij de opgave te leveren gegevens, het tijdstip en de wijze waarop deze gegevens
      worden geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.0.2
