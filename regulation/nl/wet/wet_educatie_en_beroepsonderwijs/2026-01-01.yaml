  - number: 9.2.3
    text: |-
      Het bevoegd gezag geeft uiterlijk binnen vier weken aan het college van burgemeester en wethouders alle gevraagde
      bescheiden ter inzage en verstrekt alle inlichtingen die het college van burgemeester en wethouders voor de
      uitvoering van deze paragraaf redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.2.3
  - number: 9.2.4
    text: |-
      1 Voor de uitvoering van deze paragraaf werken de colleges van burgemeester en wethouders samen binnen bij
      ministeriële regeling vastgestelde regio’s.

      2 De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onmiddellijk gemeld aan Onze Minister.

      3 Het college van burgemeester en wethouders van de contactgemeente vervult coördinerende taken bij de uitvoering
      van deze paragraaf. In dat verband:

      a. maakt het over de inzet en verantwoordelijkheid bij de uitvoering van deze paragraaf afspraken met:

      1°. instellingen;

      2°. instellingen en scholen als bedoeld in de [Wet op de expertisecentra][ref1];

      3°. scholen als bedoeld in de [Wet voortgezet onderwijs 2020][ref2];

      4°. organisaties die betrokken zijn bij de begeleiding van personen tot 27 jaar; en

      5°. centrumgemeenten van de betrokken arbeidsmarktregio’s, vastgesteld krachtens
      [artikel 10, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      b. draagt het zorg voor het tot stand komen van een regionaal netwerk van die instellingen, scholen, organisaties
      en gemeenten;

      c. organiseert en coördineert het de activiteiten, bedoeld in de [artikelen 9.2.5][ref4] en [9.2.8][ref5]; en

      d. stelt het beleid vast dat de hoofdzaken bevat van de uitvoering van [artikel 9.2.5][ref6] met aandacht voor een
      zorgvuldige omgang met de persoonsgegevens, bedoeld in [artikel 9.2.7][ref7], en houdt het bij het vaststellen van
      dat beleid rekening met het regionaal programma, bedoeld in [artikel 9.2.8][ref8].

      4 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taken,
      bedoeld in het derde lid.

      5 Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, draagt
      het college van burgemeester en wethouders van de vorige contactgemeente alle bescheiden met betrekking tot de
      uitvoering van deze paragraaf uiterlijk binnen vier weken over aan het college van burgemeester en wethouders van
      de nieuwe contactgemeente.


