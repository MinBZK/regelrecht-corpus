  - number: 12.2.7
    text: |-
      Onverminderd [artikel 4.2.1][ref1] kan tot docent aan een instelling worden benoemd:

      a. degene die in het studiejaar 1995-1996 bevoegd onderwijs heeft gegeven aan een school voor beroepsbegeleidend
      onderwijs, een school voor middelbaar beroepsonderwijs, dan wel wat deeltijds middelbaar beroepsonderwijs betreft
      aan een andere school, aan een vormingsinstituut voor jeugdigen of aan een instelling voor basiseducatie,

      b. degene die in de periode van 1 augustus 1990 tot en met 31 juli 1995 gedurende ten minste 40 weken bevoegd
      onderwijs als bedoeld in onderdeel *a* heeft gegeven, en

      c. degene die

      1°. voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen van de opleiding cultureel
      werk of de opleiding culturele en maatschappelijke vorming behorend tot het onderdeel gedrag en maatschappij van
      het op dat moment geldende Centraal register opleidingen hoger onderwijs, met de differentiatie basiseducatie, dat
      op grond van de artikelen 4 en 5 van het Uitvoeringsbesluit KVE 1991 zoals dat luidde op 31 juli 1995 zou hebben
      geleid tot een bevoegdheid voor het verzorgen van activiteiten basiseducatie, dan wel

      2°. voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen binnen het hoger pedagogisch
      onderwijs met de differentiatie basiseducatie, en

      3°. uiterlijk aan het begin van het studiejaar 1994-1995 is gestart met de differentiatie basiseducatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel12.2.7
