  - number: 6.2.3c
    text: |-
      1 Onverminderd de [artikelen 6.2.2 tot en met 6.2.3b][ref1] kan Onze Minister besluiten dat ten aanzien van een
      beroepsopleiding aan een niet uit ’s Rijks kas bekostigde instelling als bedoeld in [artikel 1.4.1][ref2] gedurende
      ten hoogste zes maanden rechten kunnen worden geschorst indien:

      a. het bevoegd gezag wat betreft het onderwijs of de examinering tekortschiet in de naleving van het bepaalde bij
      of krachtens deze wet;

      b. er daardoor of mede daardoor een wezenlijk vermoeden bestaat dat niet aan alle voorwaarden wordt voldaan om tot
      diplomering over te gaan of de kwaliteit van de examens in grote mate niet voldoet aan de standaarden, bedoeld in
      [artikel 7.4.4][ref3]; en

      c. de inzet van andere bevoegdheden van Onze Minister op grond van deze wet niet kan worden afgewacht.

      2 Onze Minister schorst uitsluitend:

      a. het recht op examinering voor de betreffende beroepsopleiding, of een deel daarvan;

      b. het recht om voor die opleiding een diploma als bedoeld in [artikel 7.4.6][ref4] te verstrekken;

      c. het recht om voor onderdelen van die opleiding een certificaat als bedoeld in [artikel 7.2.3][ref5] te
      verstrekken; of

      d. het recht om voor onderdelen van die opleiding een mbo-verklaring als bedoeld in [artikel 7.4.6a][ref6] te
      verstrekken.


