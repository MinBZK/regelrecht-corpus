  - number: 2.6.1
    text: |-
      1 Een verticale scholengemeenschap kan worden gevormd met een instelling en een school voor praktijkonderwijs, vbo
      of mavo.

      2 Onder school als bedoeld in het eerste lid wordt ook verstaan een scholengemeenschap die uitsluitend
      uit voorgaande schoolsoorten bestaat, alsmede een school voor mavo met een afdeling havo als bedoeld in
      [artikel 2.5, eerste lid, onderdeel b, van de Wet voortgezet onderwijs 2020][ref1].

      3 Een verticale scholengemeenschap kan een andere schoolsoort voor voortgezet onderwijs omvatten dan bedoeld in het
      eerste lid, voor zover die verticale scholengemeenschap reeds bestond op 1 januari 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.6.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.5'
  - number: 2.6.2
    text: |-
      1 Op aanvraag van het bevoegd gezag dat zowel een instelling als een school of scholengemeenschap als bedoeld in
      [artikel 2.6.1, eerste en tweede lid][ref1], in stand houdt, besluit Onze Minister tot de vorming, wijziging of
      beëindiging van een verticale scholengemeenschap volgens bij of krachtens algemene maatregel van bestuur te bepalen
      regels.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:

      a. het percentage studenten en leerlingen van een instelling respectievelijk school of scholengemeenschap,
      afkomstig uit hetzelfde postcodegebied;

      b. de mate van verwantschap tussen het opleidingenaanbod van de instelling en een profiel dat de school voor vbo
      aanbiedt;

      c. de aanvraagprocedure omtrent de vorming van een verticale scholengemeenschap; en

      d. het geheel of gedeeltelijk van overeenkomstige toepassing verklaren van bepalingen van deze wet op de school of
      scholengemeenschap die deel uitmaakt van een verticale scholengemeenschap.

      3 Aan een besluit omtrent de vorming van een verticale scholengemeenschap kunnen voorwaarden en beperkingen worden
      verbonden.

      4 De voordracht voor een krachtens het tweede lid, onderdeel b, vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.6.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.6.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 2.6.1
        hoofdstuk: '2'
  - number: 2.6.3
    text: |-
      1 Ingeval van een verticale scholengemeenschap wordt de rijksbijdrage in de huisvestingskosten mede berekend voor
      de school die deel uitmaakt van de verticale scholengemeenschap volgens bij of krachtens algemene maatregel van
      bestuur te stellen regels.

      2 In afwijking van de [Wet medezeggenschap op scholen][ref1], uitgezonderd de [artikelen 4a][ref2], [11a][ref3]
      en [14a van die wet][ref4], zijn de bepalingen inzake medezeggenschap bij of krachtens deze wet en de Wet
      op de ondernemingsraden van toepassing op de school of scholengemeenschap die deel uitmaakt van de verticale
      scholengemeenschap.

      3 De [artikelen 2.2.8 tot en met 2.2.10][ref5] zijn van overeenkomstige toepassing op een school of
      scholengemeenschap die deel uitmaakt van de verticale scholengemeenschap.


