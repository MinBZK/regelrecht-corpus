  - number: 2.1.2
    text: |-
      1 Een opleiding voortgezet algemeen volwassenenonderwijs van een regionaal opleidingencentrum komt voor bekostiging
      in aanmerking indien

      a. de instelling op 1 augustus 2012 een of meer opleidingen voortgezet algemeen volwassenenonderwijs verzorgde op
      grond van een overeenkomst als bedoeld in [artikel 2.3.4][ref1] zoals luidend op die datum, of

      b. Onze Minister van Onderwijs, Cultuur en Wetenschap op aanvraag van de instelling heeft bepaald dat opleidingen
      voortgezet algemeen volwassenenonderwijs van de instelling voor bekostiging in aanmerking komen.

      2 Onze Minister beoordeelt de aanvraag, bedoeld in het eerste lid, onderdeel b, aan de hand van de maatschappelijke
      behoefte aan een of meer opleidingen voortgezet algemeen volwassenenonderwijs, in het licht van het onderwijsaanbod
      verzorgd door andere, al dan niet uit ’s Rijks kas bekostigde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.1.2
