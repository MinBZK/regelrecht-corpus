  - number: 2.2.2
    text: |-
      1 De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.

      2 De maatstaven voorzien in bekostiging aan de hand van:

      a. het aantal ingeschreven studenten, en

      b. het aantal studenten dat een diploma als bedoeld in [artikel 7.4.6][ref2] heeft behaald, waaronder mede begrepen
      het aantal extraneï dat een dergelijk diploma bij een instelling heeft behaald binnen twee kalenderjaren volgend
      op het kalenderjaar waarin de inschrijving als student bij een instelling voor een beroepsopleiding waarvoor de
      instelling bekostiging heeft of zal ontvangen, zonder het behalen van een dergelijk diploma is geëindigd.

      3 Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, geldt inschrijving van een student voor
      twee of meer beroepsopleidingen in enig studiejaar als inschrijving voor één beroepsopleiding.

      4 Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, geldt dat indien in enig kalenderjaar
      door een student of extraneus een diploma wordt behaald van een beroepsopleiding die niet van een hoger niveau
      als bedoeld in [artikel 7.2.2, derde lid][ref3], is dan de beroepsopleiding waarvan die student al eerder in dat
      kalenderjaar een diploma heeft behaald, uitsluitend het eerstbehaalde van die diploma’s wordt meegeteld.

      5 Bij de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, blijven de studenten aan de
      entreeopleiding buiten beschouwing.

      6 In de maatstaven, bedoeld in het tweede lid, kan onderscheid gemaakt worden naar groepen van studenten, naar
      opleidingen, naar verblijfsduur van een student in één of meer opleidingen, naar soorten van instellingen en naar
      behaalde diploma’s.

      7 Studenten die niet als ingezetene zijn ingeschreven in de basisregistratie personen tellen alleen mee, indien:

      a. zij onderwijs, daaronder begrepen de beroepspraktijkvorming, in Nederland volgen, en

      b. zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
