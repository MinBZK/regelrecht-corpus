  - number: 6.3.1
    text: |-
      1 De aanvraag om toepassing van [artikel 1.6.1][ref1] geldt mede als aanmelding voor registratie in de Registratie
      instellingen en opleidingen. Het bevoegd gezag van een exameninstelling verschaft bij de aanmelding de gegevens
      waaruit blijkt dat de examinering van voldoende kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde,
      bedoeld in [artikel 1.6.1, tweede lid][ref2].

      2 Indien Onze Minister de aanvraag om toepassing van [artikel 1.6.1][ref3] inwilligt, registreert hij bij
      de eerstvolgende gelegenheid daartoe, de exameninstelling bij de desbetreffende opleiding in de Registratie
      instellingen en opleidingen.


