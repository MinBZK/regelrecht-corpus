  - number: 9.1.8
    text: |-
      1 In het kader van de onderwijs- en examenregeling, bedoeld in [artikel 7.4.8, tweede lid, en lid 2a][ref1] die
      wordt opgesteld ten aanzien van een doorlopende leerroute, beschrijft het bevoegd gezag van de instelling samen
      met het bevoegd gezag van de school voor de gehele doorlopende leerroute vmbo-mbo het onderwijsprogramma en de
      examinering per studiejaar. Daarbij wordt vermeld welke onderdelen van het onderwijsprogramma en van het examen:

      a. voortgezet onderwijs betreffen, en welk deel daarbinnen vakoverstijgend is;

      b. beroepsonderwijs betreffen;

      c. een combinatie van voortgezet onderwijs en beroepsonderwijs betreffen, en welk deel daarbinnen voortgezet
      onderwijs onderscheidenlijk beroepsonderwijs betreft.

      2 Bij de beschrijving van het onderwijsprogramma wordt tevens vermeld bij welk deel gebruik wordt gemaakt van de
      teambevoegdheid, bedoeld in [artikel 9.1.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9.1.12
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.8
