  - number: 7.2.4a
    text: |-
      1 Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de bij of krachtens het tweede
      en derde lid gestelde regels.

      2 De studieduur van de opleiding wordt uitgedrukt in volledige studiejaren of gedeelten daarvan. Eén volledig
      studiejaar heeft een studielast van ten minste 1600 klokuren.

      3 De studieduur bedraagt:

      a. één volledig studiejaar voor de entreeopleiding;

      b. ten minste één en ten hoogste twee volledige studiejaren voor de basisberoepsopleiding;

      c. ten minste twee en ten hoogste drie volledige studiejaren voor de vakopleiding;

      d. drie volledige studiejaren voor de middenkaderopleiding;

      e. één volledig studiejaar voor de specialistenopleiding.

      4 Indien dit in verband met de aard van de opleiding noodzakelijk is, kan Onze Minister bij ministeriële regeling
      bepalen dat voor de middenkaderopleiding een langere studieduur kan worden vastgesteld. Onze Minister geeft daarbij
      de betreffende opleiding aan en het aantal volledige studiejaren of gedeelten daarvan die de studieduur van die
      opleiding ten hoogste mag bedragen.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.2.4a
  - number: 7.2.5a
    text: |-
      Bij ministeriële regeling worden op voorstel van de instellingen in overleg met de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven de opleidingsdomeinen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.2.5a
  - number: 7.2.6
    text: |-
      1 Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke
      organisatie, vereisten zijn vastgesteld over de kwaliteiten onder meer op het gebied van kennis, inzicht,
      vaardigheden of beroepshoudingen waarover degenen die een opleiding gericht op dat beroep voltooien, moeten
      beschikken, of over de examinering bij de desbetreffende beroepsopleiding:

      a. draagt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven ervoor zorg dat deze vereisten verwerkt zijn
      bij het doen van het voorstel, bedoeld in [artikel 7.2.4, tweede en derde lid][ref1],

      b. voegt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven een verklaring van Onze
      Minister die het aangaat dat deze vereisten correct zijn verwerkt in het voorstel, bedoeld in
      [artikel 7.2.4, tweede en derde lid][ref2], en

      c. neemt Onze Minister deze vereisten in acht bij de vaststelling van de standaarden, bedoeld in
      [artikel 7.4.4][ref3].

      2 De instelling draagt er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding
      volgen, ten minste in de gelegenheid zijn aan de in het eerste lid bedoelde vereisten te voldoen en dat bij de
      examinering, zo nodig in afwijking van [titel 4 van dit hoofdstuk][ref4], aan die vereisten wordt voldaan.


