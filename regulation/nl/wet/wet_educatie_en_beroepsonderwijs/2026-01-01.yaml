  - number: 6.3.3
    text: |-
      1 In het geval, bedoeld in [artikel 6.3.2, eerste lid][ref1], kan Onze Minister op verzoek van het bevoegd gezag of
      uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.

      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een externe deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.

      3 Onze Minister stelt regels omtrent de toekenning van en verantwoording over maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.3.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.3.3
