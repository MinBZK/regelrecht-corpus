  - number: 7.2.9
    text: |-
      1 Het bevoegd gezag van de instelling draagt zorg voor de beschikbaarheid van de praktijkplaats en de
      totstandkoming van de in [artikel 7.2.8][ref1] bedoelde overeenkomst. De overeenkomst wordt gesloten door de
      instelling, de student en het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt.

      2 Indien het bevoegd gezag en de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven na het sluiten van de in
      [artikel 7.2.8][ref2] bedoelde overeenkomst vaststellen dat de praktijkplaats niet of niet volledig beschikbaar
      is, de begeleiding tekortschiet of ontbreekt, het bedrijf of de organisatie niet langer beschikt over een gunstige
      beoordeling als bedoeld in [artikel 1.5.3][ref3], of sprake is van andere omstandigheden die maken dat de
      beroepspraktijkvorming niet naar behoren zal kunnen plaatsvinden, bevordert het bevoegd gezag, na overleg met het
      bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
