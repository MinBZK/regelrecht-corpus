  - number: 3.1.3
    text: |-
      1 Het bevoegd gezag regelt de interne bevoegdheidsverdeling en kan daartoe naast de statuten een bestuursreglement
      vaststellen. In de statuten of het bestuursreglement worden ten minste vastgelegd:

      a. de verantwoordelijkheidsverdeling tussen het bestuur van de rechtspersoon en de raad van toezicht en de wijze
      waarop conflicten tussen beide kunnen worden opgelost;

      b. de wijze waarop het bevoegd gezag zijn taken en bevoegdheden uitoefent, en

      c. indien de instelling een of meer organisatorische eenheden omvat:

      1°. de organisatorische eenheden die de instelling omvat;

      2° de taken en bevoegdheden die zijn op- of overgedragen aan het hoofd van de desbetreffende eenheid;

      3° de verhouding van het hoofd van de desbetreffende eenheid tot degene die is belast met de dagelijkse leiding van
      de instelling; en

      4°. de samenstelling, en de werkwijze van het hoofd van de desbetreffende eenheid.

      2 Het bestuursreglement wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel3.1.3
  - number: 3.1.4
    text: |-
      1 Een bestuurder en een lid van de raad van toezicht worden benoemd op basis van vooraf openbaar gemaakte
      profielschetsen.

      2 De ondernemingsraad en de studentenraad worden in de gelegenheid gesteld advies uit te brengen over de
      vaststelling of wijziging van een profielschets.

      3 De raad van toezicht stelt de medezeggenschapsraden binnen de instelling in de gelegenheid twee leden voor te
      dragen voor een sollicitatiecommissie voor het benoemen van een bestuurder:

      a. een lid van of namens de ondernemingsraad; en

      b. een lid van of namens de studentenraad of ouderraad.

      4 De raad van toezicht hoort de ondernemingsraad en de studentenraad vertrouwelijk over een voorgenomen
      beslissing tot benoeming of ontslag van een bestuurder of over de bestuurder in de zin van de
      [Wet op de ondernemingsraden][ref1]. Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan
      zijn op de besluitvorming.

      5 De studentenraad heeft de bevoegdheid advies uit brengen over een voorgenomen beslissing tot benoeming of ontslag
      van een bestuurder of over de bestuurder in de zin van de [Wet op de ondernemingsraden][ref2].

      6 De ondernemingsraad wordt in de gelegenheid gesteld een bindende voordracht te doen voor een lid van de raad
      van toezicht.

      7 De raad van toezicht stelt de studentenraad en de ondernemingsraad van de instelling ten minste tweemaal per jaar
      in de gelegenheid overleg met hem te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel3.1.4
