  - number: 7.4.8
    text: |-
      1 Het bevoegd gezag zorgt voor een goede organisatie en kwaliteit van het onderwijsprogramma en de examinering.

      2 Het bevoegd gezag legt de beschrijving van het onderwijsprogramma en de regels met betrekking tot het examen
      tijdig voor aanvang van de opleiding vast in de onderwijs- en examenregeling van de instelling en zorgt ervoor
      dat studenten en deelnemers volledig en tijdig worden geïnformeerd over het onderwijsprogramma, examens en het
      ondersteuningsaanbod voor studenten met een handicap of chronische ziekte en deelnemers die extra ondersteuning
      behoeven.

      2a De onderwijs- en examenregeling omvat in elk geval bepalingen over:

      a. de inhoud en inrichting van een opleiding, waaronder voor een beroepsopleiding begrepen:

      1°. de leerweg;

      2°. de examenvoorzieningen;

      3°. de kwalificatie of, bij inschrijving voor een opleidingsdomein of een kwalificatiedossier, dat opleidingsdomein
      of dat kwalificatiedossier;

      4°. het beoogde niveau van de te behalen kwalificatie; en

      5°. de keuzedelen en de onderdelen met betrekking tot persoonlijke, culturele of levensbeschouwelijke vorming,
      bedoeld in [artikel 6.1.2a, tweede lid][ref1], die deel uitmaken van de beroepsopleiding;

      b. het aantal begeleide onderwijsuren, bedoeld in [artikel 7.2.7][ref2], per programmaonderdeel per studiejaar;

      c. het aantal klokuren beroepspraktijkvorming per studiejaar;

      d. de tijdvakken waarbinnen de opleiding wordt verzorgd;

      e. de locatie en in voorkomend geval het samenwerkingscollege waar de opleiding wordt verzorgd; en

      f. de gronden waarop de examencommissie vrijstelling kan verlenen van een instellingsexamen of een centraal examen.

      3 Het bevoegd gezag zorgt ervoor dat beroepsopleidingen aantoonbaar voldoen aan de eisen van
      [artikel 7.2.7, derde, vierde, zesde, zevende, achtste en negende lid][ref3].

      4 Het bevoegd gezag zorgt ervoor dat de instelling beschikt over een toegankelijk en begrijpelijk studentenstatuut
      waarin de rechten en plichten van de studenten zijn opgenomen, en stelt de actuele versie van het studentenstatuut
      voor de studenten beschikbaar. Het bevoegd gezag bevordert voorts de kennis van het studentenstatuut. Het
      studentenstatuut bevat in elk geval:

      a. een beschrijving van de procedures voor de behandeling van klachten en geschillen, bedoeld in [titel 5][ref4],
      daaronder begrepen de inrichting van de toegankelijke faciliteit, bedoeld in [artikel 7.5.1][ref5];

      b. een beschrijving van de procedures voor de behandeling van geschillen inzake medezeggenschap;

      c. een beschrijving van de beroepsrechten die kunnen worden ontleend aan deze wet en andere wettelijke regelingen;

      d. een beschrijving van aanvullende procedures ter bescherming van de rechten van studenten die door het bevoegd
      gezag worden getroffen;

      e. de nadere regels over het bindend studieadvies, bedoeld in [artikel 8.1.7a, vierde lid][ref6];

      f. het beleid met betrekking tot het beperkt en beheersbaar houden van de middelen die van de studenten worden
      gevraagd voor schoolkosten die door het bevoegd gezag noodzakelijk worden bevonden;

      g. in voorkomend geval, bepalingen over de terugbetaling van voorschotten, verstrekt door het bevoegd gezag, ter
      voldoening van een bij of krachtens de wet geregelde geldelijke bijdrage als bedoeld in [artikel 8.1.4][ref7];

      h. bepalingen over de terugbetaling van cursusgeld in andere gevallen dan bedoeld in
      [artikel 14, tweede lid, onderdeel a tot en met d, van het Uitvoeringsbesluit Les- en cursusgeldwet 2000][ref8];

      i. het beleid van het bevoegd gezag met betrekking tot toelating, verzuim, schorsing en verwijdering van studenten;

      j. de rechten en plichten ten aanzien van zwangerschap en bevalling;

      k. de instellingsregels over het mbo-studentenfonds, bedoeld in [artikel 8.1.5e][ref9]; en

      l. het beleid met betrekking tot loopbaanbegeleiding als bedoeld in [artikel 9.2.12, vijfde lid][ref10].

      5 De examencommissie stelt regels vast met betrekking tot de goede gang van zaken tijdens het afnemen van de
      toetsen, het examen of de examenonderdelen.

      6 Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 7.4.4a][ref11], dan treedt de
      examenregeling van de instelling of exameninstelling die de examinering verzorgt in de plaats van de examenregeling
      van de instelling die het onderwijs verzorgt.


