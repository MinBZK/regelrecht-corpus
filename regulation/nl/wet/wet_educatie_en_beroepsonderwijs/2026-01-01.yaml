  - number: 9.2.9
    text: |-
      1 Onze Minister verstrekt aan de contactgemeente een specifieke uitkering voor de activiteiten die de colleges
      van burgemeester en wethouders van de gemeenten in de regio verrichten op grond van deze paragraaf. Deze uitkering
      wordt jaarlijks uiterlijk verleend in december voor het daaropvolgende kalenderjaar en blijft binnen de grenzen van
      de middelen die de begrotingswetgever beschikbaar heeft gesteld. Bij of krachtens algemene maatregel van bestuur
      worden regels gesteld voor de berekening en betaling van de uitkering.

      2 Het college van burgemeester en wethouders van de contactgemeente zorgt dat de colleges van burgemeester en
      wethouders van de gemeenten in de regio gebruik kunnen maken van de instrumenten die met behulp van de uitkering
      zijn verwezenlijkt.

      3 Indien het college van burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens deze
      paragraaf niet nakomt, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze Minister
      gaat pas na overleg met het college van burgemeester en wethouders over tot gehele of gedeeltelijke inhouding. Onze
      Minister kan de uitkering opnieuw toekennen indien de reden voor inhouding of opschorting is vervallen.

      4 Onze Minister kan de uitkering geheel of gedeeltelijk terugvorderen indien uit de informatie op grond van
      [artikel 17a van de Financiële-verhoudingswet][ref1] niet blijkt dat de uitkering is besteed in overeenstemming
      met deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.2.9
