  - number: 2.3.6
    text: |-
      1 De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het voortgezet algemeen volwassenenonderwijs en verlenen desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.

      2 Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van beschikbaarstelling van de
      in het eerste lid bedoelde gegevens.

      3 Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.3.6
  - number: 2.3.6a
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een vavo-student gebruiken in het verkeer met de vavo-
      student op wie het nummer betrekking heeft.

      2

      3

      4 Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.0.2, eerste lid][ref1], het persoonsgebonden nummer van de betrokkene.

      5

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een vavo-student aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.

      7 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een vavo-student in het contact met een andere
      instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die vavo-
      student of ten behoeve van het volgen van onderwijs in een samenwerkingscollege. Onder dit contact wordt mede
      begrepen de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene
      maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.

      8 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een vavo-student ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref2], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref3].

      9 Het bevoegd gezag kan het persoonsgebonden nummer van een vavo-student eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze vavo-student met het oog op het bieden van voorzieningen in het kader van
      het onderwijs en de begeleiding van vavo-studenten. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt
      bewaard in de systemen waarin de vavo-studenten zijn geregistreerd.

      10 Het bevoegd gezag kan het pseudoniem, bedoeld in het negende lid, gebruiken voor het genereren van een ander
      pseudoniem voor een vavo-student in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de vavo-studenten zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.

      11 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het tiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het negende lid, een ander pseudoniem kan
      genereren.

      Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.

      12 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      negende tot en met het elfde lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.

      13 De in het zevende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.0.2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel107
