  - number: 9.2.6
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde over het gebruik van het burgerservicenummer door het
      college van burgemeester en wethouders, gebruikt het college van burgemeester en wethouders het persoonsgebonden
      nummer van een student, vavo-student of persoon die voldoet aan [artikel 9.2.1][ref1] alleen voor:

      a. de registratie van leerplichtige en kwalificatieplichtige jongeren in het belang van het toezicht op de naleving
      van de [Leerplichtwet 1969][ref2];

      b. de uitvoering van [artikel 9.2.5][ref3];

      c. het verwerken van de gegevens, bedoeld in
      [artikel 21, eerste en derde lid, van de Wet register onderwijsdeelnemers][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.1
