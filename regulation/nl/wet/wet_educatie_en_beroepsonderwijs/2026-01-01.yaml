  - number: 7.5.10
    text: |-
      1 In afwijking van [artikel 7.5.9, eerste lid][ref1], kan het bevoegd gezag van een bijzondere instelling,
      al dan niet in samenwerking met bevoegde gezagsorganen van een of meer andere bijzondere instellingen met een
      levensbeschouwelijke aard, in een regeling bepalen dat de instelling in verband met de levensbeschouwelijke aard
      van de instelling een college van beroep bijzonder onderwijs instelt voor de behandeling van beroepen ingesteld
      door een betrokkene tegen een beslissing van een orgaan van een instelling die jegens hem op grond van deze wet en
      daarop gebaseerde regelingen is genomen.

      2 De regeling bevat in elk geval regels over:

      a. de omvang en samenstelling van het college;

      b. indien nodig, de splitsing in kamers, alsmede de verdeling van de werkzaamheden over de verschillende kamers;

      c. de zittingstermijn van de leden en eventuele plaatsvervangende leden van het college;

      d. de wijze waarop het lidmaatschap of plaatsvervangend lidmaatschap van het college eindigt;

      e. de procedure voor het minnelijk schikken van geschillen en de gevallen waarin deze procedure achterwege kan
      worden gelaten;

      f. de wijze waarop in het secretariaat van het college wordt voorzien; en

      g. de wijze waarop de voorzitter wordt vervangen.

      3 De voorzitter en de plaatsvervangende voorzitter of voorzitters moeten voldoen
      aan de vereisten voor benoembaarheid tot rechterlijk ambtenaar, bedoeld in
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref2].

      4 De regeling bevat tevens een uitwerking van de rechtsgang bij het college, waarbij de
      [artikelen 7.5.3, derde en vierde lid][ref3], [7.5.4, zesde lid][ref4], [7.5.5, eerste lid][ref5], en [7.5.6][ref6]
      van overeenkomstige toepassing zijn.

      5 Het college beslist binnen tien weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het
      beroepschrift is verstreken.

      6 De regeling alsmede wijzigingen daarvan worden vastgesteld met inachtneming van de
      [artikelen 7.5.1 tot en met 7.5.9][ref7] en worden na de vaststelling zo spoedig mogelijk gezonden aan Onze
      Minister. Onze Minister kan binnen drie maanden verklaren van oordeel te zijn, dat het bevoegd gezag bij de
      vaststelling van de rechtsgang de artikelen 7.5.1 tot en met 7.5.9 niet in acht heeft genomen en daartoe in
      redelijkheid geen beroep heeft kunnen doen op de eigen levensbeschouwelijke aard van de bijzondere instelling die
      zich tegen inachtneming daarvan zou verzetten, of dat onvoldoende aannemelijk heeft gemaakt. Binnen drie maanden
      wordt het bezwaar ondervangen.

      7 De werking van het besluit van Onze Minister, bedoeld in het zesde lid, wordt opgeschort totdat de beroepstermijn
      is verstreken, of, indien beroep is ingesteld, op het beroep is beslist.


