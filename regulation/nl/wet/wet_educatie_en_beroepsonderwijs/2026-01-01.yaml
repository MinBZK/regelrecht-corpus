  - number: 8a.4.3
    text: |-
      1 Voor zover aan een voorgenomen beslissing van het bevoegd gezag als bedoeld in [artikel 8a.2.2, derde lid][ref1],
      de vereiste instemming is onthouden, deelt het bevoegd gezag aan de studentenraad dan wel de studentenraad aan het
      bevoegd gezag binnen drie maanden mede of het voorstel wordt voorgelegd aan de commissie. Indien een dergelijke
      mededeling niet binnen drie maanden wordt gedaan, vervalt het voorstel. Het voorstel vervalt eveneens, indien door
      het bevoegd gezag aan de studentenraad dan wel door de studentenraad aan het bevoegd gezag is meegedeeld dat het
      voorstel wordt voorgelegd aan de commissie en het voorstel niet binnen zes weken na het doen van deze mededeling
      daadwerkelijk wordt voorgelegd aan de commissie.

      2 Indien het bevoegd gezag een verzoek doet als bedoeld in [artikel 8a.4.2, onderdeel a][ref2], geschiedt dit onder
      overlegging van de door het bevoegd gezag gemaakte afweging van de belangen die daarbij voor het bevoegd gezag aan
      de orde zijn, en stelt de commissie de studentenraad in de gelegenheid om zijn argumenten voor het onthouden van
      zijn instemming bij de commissie naar voren te brengen. Indien de studentenraad een verzoek doet als bedoeld in
      artikel 8a.4.2, onderdeel a, wordt het verzoek met redenen omkleed en stelt de commissie het bevoegd gezag in de
      gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar voren te brengen.

      3 De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de studentenraad voor te leggen, tenzij
      het bevoegd gezag of de studentenraad te kennen geeft daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van zowel het bevoegd gezag als
      de studentenraad, stelt zij vast, indien het betreft een geschil als bedoeld in:

      a. [artikel 8a.4.2, onderdeel a][ref3]: of de studentenraad in redelijkheid tot het onthouden van instemming heeft
      kunnen komen of dat sprake is van bepaalde zwaarwegende omstandigheden die het voorstel van het bevoegd gezag
      rechtvaardigen;

      b. [artikel 8a.4.2, onderdeel b][ref4]: welke interpretatie aan dit hoofdstuk of het reglement moet worden gegeven;

      c. [artikel 8a.4.2, onderdeel c][ref5]: of het bevoegd gezag bij afweging van betrokken belangen in redelijkheid
      tot de beslissing heeft kunnen komen en of de beslissing al dan niet in stand kan blijven.

      4 Voor zover de commissie van oordeel is dat het voorstel van het bevoegd gezag niet in redelijkheid tot stand is
      gekomen, geeft zij aan hoe het voorstel moet worden gewijzigd.

      5 Onverminderd [artikel 8a.4.4][ref6] is een vaststelling van de commissie als bedoeld in het derde lid, voor het
      bevoegd gezag en de studentenraad bindend. Zo nodig neemt het bevoegd gezag met inachtneming van de vaststelling
      van de commissie een nieuwe beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
