  - number: 9.1.15
    text: |-
      Het bevoegd gezag van de instelling kan met het bevoegd gezag van de school waarmee een samenwerkingsovereenkomst
      is gesloten als bedoeld in [artikel 9.1.3][ref1], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo een
      deel van de rijksbijdrage over te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.1.3
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.15
