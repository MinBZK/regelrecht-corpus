  - number: 8.1.5c
    text: |-
      1 Indien op grond van de [artikelen 8.1.5][ref1] of [8.1.5b][ref2] financiële ondersteuning wordt toegekend aan een
      student die een beroepsopleidende leerweg volgt, is het bedrag daarvan niet hoger dan het normbedrag voor de kosten
      van levensonderhoud voor het beroepsonderwijs, bedoeld in [artikel 3.18 van de Wet studiefinanciering 2000][ref3],
      en indien van toepassing niet hoger dan de som van dat bedrag en het bedrag van de toeslag eenoudergezin.

      2 Onverminderd het eerste lid, kan bij algemene maatregel van bestuur worden bepaald dat een lid van de
      studentenraad als bedoeld in [artikel 8.1.5, tweede lid, onderdeel a][ref4], een financiële ondersteuning ontvangt
      ter hoogte van een bij algemene maatregel van bestuur te bepalen minimumbedrag. De voordracht voor deze algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-
      Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.5
