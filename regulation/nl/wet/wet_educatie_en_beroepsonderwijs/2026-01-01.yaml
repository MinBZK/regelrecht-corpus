        artikel: '22'
  - number: 8.1.2
    text: |-
      1 Indien binnen redelijke afstand van de woning van de student of vavo-student niet de gelegenheid bestaat tot het
      volgen van het onderwijs aan een openbare instelling, mag aan deze student of vavo-student de toelating tot een
      bijzondere instelling niet worden geweigerd op grond van godsdienst of levensbeschouwing.

      2 Openbare instellingen zijn toegankelijk voor studenten en vavo-studenten zonder onderscheid naar godsdienst of
      levensbeschouwing.

      3 Indien tot een bijzondere instelling andere studenten en vavo-studenten worden toegelaten dan voor wie de
      instelling in verband met de godsdienstige of levensbeschouwelijke richting wordt in stand gehouden, kunnen deze
      studenten en vavo-studenten niet worden verplicht tot het volgen van onderwijs dat in verband met die richting door
      de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.2
  - number: 8.1.3a
    text: |-
      1 Het bevoegd gezag beoordeelt voorafgaande aan de inschrijving van de student of vavo-student of deze student of
      vavo-student extra ondersteuning behoeft in verband met handicap of chronische ziekte en onderzoekt daartoe zijn
      mogelijkheden, behoeften en omstandigheden. Het bevoegd gezag kan de student of vavo-student verzoeken gegevens te
      overleggen betreffende handicap of chronische ziekte of beperkingen in de onderwijsparticipatie.

      2 Indien de inschrijving een student of vavo-student betreft die extra ondersteuning behoeft in verband met
      handicap of chronische ziekte, vindt de inschrijving slechts plaats nadat het bevoegd gezag met de student of vavo-
      student schriftelijke afspraken heeft gemaakt over deze ondersteuning.

      3 De afspraken worden ten minste één keer per studiejaar met de student of vavo-student geëvalueerd op hun
      doeltreffendheid.

      4 Indien de noodzaak van extra ondersteuning in verband met handicap of chronische ziekte na de inschrijving
      ontstaat, zijn het tweede en derde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.3a
  - number: 8.1.4
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde geldelijke
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.4
  - number: 8.1.5
    text: |-
      1 Het bevoegd gezag treft voorzieningen voor de ondersteuning van bij die instelling ingeschreven studenten.

      2 Ondersteuning wordt verstrekt aan de volgende categorieën van studenten:

      a. studenten die lid zijn van een studentenraad als bedoeld in [artikel 8a.1.2][ref1], van een andere door het
      bevoegd gezag ingestelde medezeggenschapsstructuur of van het bestuur van een studentenorganisatie van enige omvang
      met volledige rechtsbevoegdheid,

      b. studenten die activiteiten verrichten op bestuurlijk of maatschappelijk gebied die naar het oordeel van het
      bevoegd gezag mede in het belang zijn van de instelling of van het onderwijs dat de student volgt,

      c. studenten, of diens wettelijk vertegenwoordiger, die aantoonbaar onvoldoende financiële middelen hebben voor de
      aanschaf van onderwijsbenodigdheden waarover de student geacht wordt zelf te beschikken, en

      d. studenten die in verband met de aanwezigheid van een bijzondere omstandigheid studievertraging hebben opgelopen.

      3 De bijzondere omstandigheden, bedoeld in onderdeel d zijn:

      a. ziekte,

      b. zwangerschap en bevalling,

      c. een handicap of chronische ziekte,

      d. bijzondere familieomstandigheden,

      e. een onvoldoende studeerbare opleiding,

      f. overige door het bevoegd gezag vastgestelde bijzondere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.1.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.5
