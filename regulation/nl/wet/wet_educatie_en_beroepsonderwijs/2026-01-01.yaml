  - number: 8a.1.4
    text: |-
      1 Het bevoegd gezag zorgt ervoor dat binnen de instelling een volwaardige, goed functionerende en effectieve
      medezeggenschap van studenten en vavo-studenten en, in voorkomende gevallen, ouders plaats kan vinden waarbij ten
      minste wordt voldaan aan de volgende eisen:

      a. de verkiezingen zijn zodanig geregeld dat deze kunnen leiden tot een studentenraad of, in voorkomende gevallen,
      een ouderraad die een representatieve vertegenwoordiging van studenten, vavo-studenten of in voorkomende gevallen
      ouders vormt;

      b. de medezeggenschapsstructuren sluiten zo veel mogelijk aan bij de organisatiestructuur,
      besluitvormingsprocedures en verantwoordelijkheidsverdelingen binnen de instelling.

      2 Het bevoegd gezag legt de inrichting van de medezeggenschap telkens voor een periode
      van ten hoogste vier jaren vast in een medezeggenschapsstatuut. Voor de vaststelling is
      [artikel 8a.2.2, derde lid, aanhef en onderdeel a][ref1], van overeenkomstige toepassing op de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a.2.2
        hoofdstuk: 8a
  - number: 8a.1.5
    text: |-
      1 Het bevoegd gezag stelt de studentenraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad ten
      minste eenmaal per jaar in de gelegenheid gezamenlijk de algemene gang van zaken in de instelling met hem te
      bespreken.

      2 Het bevoegd gezag, de studentenraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad komen voorts
      met elkaar bijeen indien daarom onder opgave van redenen door één of meer der raden wordt verzocht.

      3 In geval van een voornemen tot een fusie komen het bevoegd gezag, de studentenraad, de ondernemingsraad en,
      in voorkomende gevallen, de ouderraad bijeen om dat voornemen te bespreken. De bespreking is gericht op het
      bereiken van overeenstemming. Indien overeenstemming wordt bereikt, wordt dit aangemerkt als instemming met het
      voornemen tot fusie. Bij het ontbreken van overeenstemming wordt dit aangemerkt als het onthouden van instemming.
      In het laatste geval kan elk van de studenten en vavo-studenten aan de bespreking het geschil voorleggen aan de
      geschillencommissie, bedoeld in [artikel 8a.4.1, eerste lid][ref1].

      4 Indien geen overeenstemming wordt bereikt, hebben de studentenraad, de ondernemingsraad en, in voorkomende
      gevallen, de ouderraad elk afzonderlijk adviesrecht ten aanzien van het voornemen tot fusie, onverminderd het recht
      het geschil voor te leggen aan de in het vorige lid bedoelde geschillencommissie.

      5 Het bevoegd gezag stelt de studentenraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad in de
      gelegenheid om tijdig voorafgaand aan de gezamenlijke bijeenkomst, bedoeld in het derde lid, kennis te nemen van de
      opgestelde fusie-effectrapportage, bedoeld in artikel 2.1.10, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.4.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.1.5
