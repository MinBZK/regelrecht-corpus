  - number: 6.4.1
    text: |-
      1 De Registratie instellingen en opleidingen omvat een systematisch geordende verzameling gegevens met betrekking
      tot de opleidingsdomeinen, kwalificatiedossiers, kwalificaties, keuzedelen en onderdelen van kwalificaties waarvoor
      toepassing is gegeven aan [artikel 7.2.3, eerste lid][ref1], in het beroepsonderwijs, de instellingen en de
      exameninstellingen. Onze Minister is belast met de aanleg, het beheer en de bekendmaking van het register en met
      het verstrekken van informatie uit het register. De bekendmaking en het verstrekken van informatie kunnen digitaal
      plaatsvinden.

      2 De Registratie instellingen en opleidingen bevat de volgende gegevens:

      a. de naam en de code van de opleidingsdomeinen, de kwalificatiedossiers en de bijbehorende kwalificaties, de
      keuzedelen en de onderdelen van kwalificaties waarvoor toepassing is gegeven aan [artikel 7.2.3, eerste lid][ref2],

      b. of in een kwalificatiedossier ten behoeve van een kwalificatie vereisten zijn opgenomen die bij of krachtens wet
      zijn vastgesteld voor het beroep waarop de kwalificatie is gericht en

      c. een overzicht van de keuzedelen en onderdelen van kwalificaties waarvoor toepassing is gegeven aan
      [artikel 7.2.3, eerste lid][ref3],

      d. of ten aanzien van een keuzedeel of een onderdeel van een kwalificatie waarvoor toepassing is gegeven aan
      [artikel 7.2.3, eerste lid][ref4], vereisten zijn opgenomen als bedoeld in [artikel 7.2.6][ref5],

      e. of voor de kwalificatie toepassing is gegeven aan [artikel 6.1.1, tweede lid][ref6], en

      f. het NLQF-niveau dat voor de kwalificatie is vastgesteld bij of krachtens de [Wet NLQF][ref7] en het daarmee
      corresponderende EQF-niveau.

      3 De Registratie instellingen en opleidingen bevat voorts per kwalificatie de volgende gegevens, voor zover van
      toepassing:

      a. de namen van de uit ’s Rijks kas bekostigde instellingen

      1° die blijkens de opgave van het aantal studenten daadwerkelijk de desbetreffende beroepsopleiding verzorgen,

      2° waaraan de rechten, genoemd in [artikel 1.3.1][ref8], met betrekking tot de desbetreffende beroepsopleiding zijn
      ontnomen en de ingangs- en einddatum daarvan,

      3° waaraan het recht op examinering van de desbetreffende beroepsopleiding is ontnomen en de ingangsdatum daarvan,

      4° waaraan het alleenrecht, bedoeld in [artikel 6.1.1, tweede lid][ref9], is toegekend en de ingangs- en einddatum
      daarvan,

      b. de namen van de niet uit ’s Rijks kas bekostigde instellingen

      1° waaraan het recht, bedoeld in [artikel 1.4.1, eerste lid][ref10], met betrekking tot de desbetreffende
      beroepsopleiding is toegekend en die niet te kennen hebben gegeven dat zij deze beroepsopleiding niet langer zullen
      verzorgen,

      2° waaraan het recht, bedoeld in [artikel 1.4.1, eerste lid][ref11], met betrekking tot de desbetreffende
      beroepsopleiding is ontnomen en de ingangsdatum daarvan,

      3° waaraan het recht op examinering van de desbetreffende beroepsopleiding is ontnomen en de ingangsdatum daarvan,

      c. de namen van de exameninstellingen

      1° die het recht hebben op examinering van de desbetreffende beroepsopleiding en die niet te kennen hebben gegeven
      dat zij die examinering niet langer zullen verzorgen en

      2° waaraan het recht is ontnomen op examinering van de desbetreffende beroepsopleiding, en de ingangsdatum daarvan.


