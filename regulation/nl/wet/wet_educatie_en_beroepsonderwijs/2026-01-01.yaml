  - number: 7.4.5
    text: |-
      1 Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, ten behoeve van de examinering een examencommissie in voor elke
      door de instelling verzorgde opleiding of voor groepen van opleidingen.

      2 Het bevoegd gezag kan de taken en bevoegdheden, bedoeld in [artikel 7.4.5a][ref1] gedeeltelijk opdragen aan een
      centrale examencommissie.

      3 Het bevoegd gezag draagt er zorg voor dat het onafhankelijk en deskundig functioneren van de examencommissie
      voldoende is gewaarborgd.

      4 Het bevoegd gezag benoemt de leden van de examencommissie op basis van hun deskundigheid op het gebied van de
      desbetreffende opleiding of groepen van opleidingen of op het gebied van examinering.

      5 Alvorens tot benoeming van een lid over te gaan, hoort het bevoegd gezag de leden van de desbetreffende
      examencommissie en toetst het de deskundigheid van het te benoemen lid.

      6 Ten minste één lid van de examencommissie is afkomstig van buiten de opleiding of groep van opleidingen waarvoor
      de examencommissie is ingesteld.

      7 Ten minste één lid van de examencommissie is als docent verbonden aan de opleiding of groep van opleidingen
      waarvoor de examencommissie is ingesteld.

      8 Ten minste één lid van de examencommissie is afkomstig uit de beroepspraktijk, voor zover hierin niet wordt
      voorzien met een lid als bedoeld in het zesde lid.

      9 Leden van het bevoegd gezag en personen die anderszins financiële verantwoordelijkheid dragen binnen de
      instelling worden niet benoemd tot lid van de examencommissie. In afwijking van de eerste volzin kunnen
      personen die anderszins financiële verantwoordelijkheid dragen binnen de instelling worden benoemd tot lid van
      de examencommissie indien de examencommissie regels vaststelt ter voorkoming van belangenverstrengeling bij de
      toedeling en uitvoering van haar taken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.5a
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.4.5a
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.5a
    text: |-
      1 Een examencommissie heeft behoudens [artikel 7.4.5, tweede lid][ref1], ten minste de volgende taken en
      bevoegdheden:

      a. het borgen van de kwaliteit van de examinering en van de instellingsexamens,

      b. het vaststellen van richtlijnen en aanwijzingen om instellingsexamens te beoordelen en vast te stellen,

      c. het vaststellen van de instellingsexamens,

      d. het op objectieve en deskundige wijze vaststellen of een student voldoet aan de voorwaarden voor het verkrijgen
      van een diploma, een certificaat of een verklaring als bedoeld in [artikel 7.4.6a][ref2] alsmede het uitreiken of
      afgeven daarvan,

      e. het verlenen van vrijstelling van een instellingsexamen of een centraal examen en

      f. het bij de uitslag betrekken van een keuzedeel waarin de student in het kader van een eerder door hem gevolgde
      beroepsopleiding examen heeft afgelegd maar dat niet met goed gevolg door hem is afgesloten.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taken en
      bevoegdheden, bedoeld in het eerste lid, en kunnen andere taken en bevoegdheden dan bedoeld in het eerste lid aan
      de examencommissie worden toegekend.

      3 De examencommissie stelt regels vast over de uitvoering van de taken en bevoegdheden, bedoeld in het eerste lid,
      en de maatregelen die zij in dat verband kan nemen.

      4 Indien een student bij het examen fraudeert, kan de examencommissie de student het recht ontnemen één of meer
      door de examencommissie aan te wijzen examens af te leggen, gedurende een door de examencommissie te bepalen
      termijn van ten hoogste een jaar. Bij ernstige fraude kan het bevoegd gezag op voorstel van de examencommissie de
      inschrijving voor de opleiding van de betrokkene definitief beëindigen.

      5 Indien een student bij de examencommissie een verzoek of een klacht indient waarbij een lid van de
      examencommissie is betrokken, neemt het betrokken lid geen deel aan de behandeling van het verzoek of de klacht.

      6 De examencommissie stelt jaarlijks een verslag op over de examenkwaliteit per opleiding, aan de hand van de
      standaarden, bedoeld in [artikel 7.4.4][ref3], en haar werkzaamheden en verstrekt dit verslag aan het bevoegd gezag
      van de instelling of de exameninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.5
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.5a
