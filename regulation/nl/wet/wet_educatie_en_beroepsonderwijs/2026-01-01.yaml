  - number: 7.1.1
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. Een andere taal kan worden gebezigd:

      a. wanneer het onderwijs met betrekking tot die taal betreft, of

      b. indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de studenten
      en vavo-studenten daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.1.1
  - number: 7.1.2
    text: |-
      1 De instelling biedt het onderwijs aan in de vorm van beroepsopleidingen of opleidingen educatie. Een
      beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de naam van de kwalificatie
      waarop zij is gericht of voorzover het gaat om studenten die ingeschreven zijn of zullen worden voor een
      opleidingsdomein of kwalificatiedossier, de naam van dat opleidingsdomein of dat kwalificatiedossier. Het keuzedeel
      dat deel uitmaakt van de beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de
      naam van dat keuzedeel.

      2 Een beroepsopleiding is een onderwijstraject dat voor een student is ingericht overeenkomstig de eisen van
      [hoofdstuk 7, titel 2][ref1], onverminderd [artikel 1.4.1, lid 1a][ref2], en dat is gericht op het behalen van
      een kwalificatie in het beroepsonderwijs alsmede een of meer daarbij behorende keuzedelen, ten bewijze waarvan een
      diploma wordt uitgereikt.

      3 Een opleiding educatie is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking
      van eindtermen of het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref3], of onderdelen van een dergelijk diploma.

      4 Beroepsopleidingen worden afgesloten met een examen. Opleidingen educatie kunnen worden afgesloten met een
      examen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 1.4.1
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '2.4'
  - number: 7.1.3
    text: |-
      1 Een kwalificatie is het geheel van bekwaamheden die een afgestudeerde van een beroepsopleiding kwalificeren voor
      het functioneren in een beroep of een groep van samenhangende beroepen, in het vervolgonderwijs en als burger en
      dat is beschreven binnen een kwalificatiedossier.

      2 Het keuzedeel is onderdeel van een beroepsopleiding en is gericht op verbreding of verdieping van de kwalificatie
      waar deze bij behoort, dan wel gericht op doorstroom naar een vervolgopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.1.3
  - number: 7.1.4
    text: |-
      1 Bij het geven van onderwijs aan een student die bij de aanvang van die opleiding leerplichtig was en die is
      opgenomen in een ziekenhuis of die in verband met ziekte thuis verblijft, kan het bevoegd gezag van een instelling
      die de beroepsopleiding verzorgt, worden ondersteund.

      2 De ondersteuning bedoeld in het eerste lid wordt verzorgd door:

      a. een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de student
      is opgenomen in een academisch ziekenhuis of

      b. een schoolbegeleidingsdienst als bedoeld in [artikel 185 van de Wet op het primair onderwijs][ref2] en
      [artikel 166 van de Wet op de expertisecentra][ref3] indien de student is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de student in verband met ziekte thuis verblijft.

      3 De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de instelling waarbij de student is ingeschreven, mede het geven van onderwijs aan de
      student betreffen.

      4 Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke studenten. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.4
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel185
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.1.4
    references:
      - id: ref1
