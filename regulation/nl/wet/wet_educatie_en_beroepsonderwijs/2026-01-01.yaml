  - number: 8.5.2
    text: |-
      1 De entreeopleiding, ingevolge [artikel 14a, tweede lid, van de Wet op de expertisecentra][ref1], dan wel
      ingevolge [artikel 2.71, tweede lid, aanhef en onderdeel b, van de Wet voortgezet onderwijs 2020][ref2], wordt
      verzorgd op grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd
      gezag van een school waar voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref3] wordt
      verzorgd.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan het gestelde bij of krachtens
      [artikel 2.102, vijfde lid en zevende lid, aanhef en onderdeel b, van de Wet voortgezet onderwijs 2020][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
