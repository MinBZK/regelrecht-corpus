  - number: 8a.3.1
    text: |-
      1 Het bevoegd gezag stelt, met inachtneming van de voorschriften in dit hoofdstuk, voor een periode van telkens
      vijf jaar een reglement voor de studentenraad vast. Het reglement kan tussentijds worden gewijzigd.

      2 In het reglement worden in ieder geval regels gesteld omtrent:

      a. het aantal leden van de studentenraad;

      b. de wijze en organisatie van de verkiezingen van de leden van de studentenraad;

      c. de zittingsduur van de leden van de studentenraad;

      d. de wijze waarop wordt gewaarborgd dat de leden van de studentenraad hun uit het lidmaatschap van de
      studentenraad voortvloeiende verplichtingen nakomen;

      e. de voorstellen van de studentenraad, bedoeld in [artikel 8a.2.1, tweede lid][ref1], waarover het bevoegd gezag
      een standpunt inneemt, en de termijnen daarvoor;

      f. het verschaffen van informatie door het bevoegd gezag aan de studentenraad;

      g. de termijnen binnen welke tot instemming of onthouding van instemming moet worden besloten, en de termijnen
      binnen welke advies moet worden uitgebracht;

      h. het toekennen van eventuele andere bevoegdheden aan de studentenraad.

      3 Het bevoegd gezag legt het reglement, alsmede elke wijziging ervan, als voorstel aan de studentenraad voor
      en stelt het slechts vast voor zover het voorstel de instemming van twee derden van het aantal leden van de
      studentenraad heeft verworven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.3.1
