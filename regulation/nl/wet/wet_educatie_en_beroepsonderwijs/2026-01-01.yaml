  - number: 7.7.1
    text: |-
      1 Het bevoegd gezag van een instelling is verplicht, ho-studenten die zijn ingeschreven voor een opleiding voor
      het beroep van leraar waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, of
      die anderszins studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor
      een functie in het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de
      instelling te verkrijgen.

      2 De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling
      in totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits
      dat in overeenstemming is met de goede gang van zaken binnen de instelling.

      3 Het bevoegd gezag kan een ho-student de verdere toegang tot de instelling ontzeggen, indien deze in de instelling
      in strijd handelt met de grondslag en doelstellingen van de instelling. Van een besluit tot ontzegging van de
      toegang tot de instelling wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd
      gezag van de betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie.
      Indien het bevoegd gezag van een bijzondere school een ho-student de toegang weigert, maakt het dit besluit,
      schriftelijk en met redenen omkleed, bekend door toezending of uitreiking aan de ho-student, onverminderd het
      bepaalde in de vorige volzin.

      4 Het bevoegd gezag van de instelling regelt de werkzaamheden in verband met de begeleiding door de leraren van
      de ho-studenten in de instelling in overeenstemming met de leraren, alsmede in overeenstemming met de betrokken
      opleidingsinstellingen, dan wel, indien het betreft ho-studenten die zich voorbereiden op het afleggen van een
      staatsexamen ter verkrijging van een bewijs van bekwaamheid of een bewijs van voldoende pedagogische en didactische
      voorbereiding, in overeenstemming met de betrokken staatsexamencommissie.

      5 Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.

      6 De instellingen waarbij ho-studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de
      inspectie, belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te
      wijzen docenten van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies,
      een en ander voor zover dat voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de
      begeleiding van de praktische vorming van de in de instelling aanwezige ho-studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.7.1
  - number: 8.0.1
    text: |-
      1 Uiterlijk op 1 april voorafgaand aan een studiejaar meldt degene die zich als student wenst te laten inschrijven
      voor een beroepsopleiding die start bij de aanvang van dat studiejaar, zich aan bij de desbetreffende instelling.
      Na de aanmelding kan de betrokkene zijn aanmelding nog wijzigen.

      2 Bij ministeriële regeling kan een maximum aantal beroepsopleidingen worden vastgesteld waarvoor de betrokkene
      zich kan aanmelden.

      3 Dit artikel is niet van toepassing op een deelnemer die zich aanmeldt bij een andere beroepsopleiding dan die
      waar hij oorspronkelijk was ingeschreven en kan aantonen dat de aanmelding het gevolg is van een beëindiging van de
      inschrijving op grond van [artikel 8.1.7a][ref1], op een zodanig tijdstip dat hij zich niet kon aanmelden uiterlijk
      1 april voorafgaand aan het studiejaar waarvoor hij zich wenst in te schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.7a
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.0.1
