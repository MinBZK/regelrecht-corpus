  - number: 8.1.7a
    text: |-
      1 Het bevoegd gezag brengt aan iedere student die zich inschrijft, advies uit over de voortzetting van
      zijn opleiding. Aan degenen die zijn ingeschreven voor een opleiding waarvan studieduur als bedoeld in
      [artikel 7.2.4a, derde lid][ref1], één volledig studiejaar bedraagt wordt dit advies uiterlijk binnen vier
      kalendermaanden na aanvang van de opleiding gegeven, doch niet eerder dan drie maanden na aanvang. Aan degenen die
      zijn ingeschreven voor een opleiding als bedoeld in artikel 7.2.4a, derde lid, die meer dan één volledig studiejaar
      bedraagt wordt dit advies na ten minste negen kalendermaanden en uiterlijk aan het eind van het eerste studiejaar
      van de opleiding gegeven.

      2 Aan een advies als bedoeld in het eerste lid kan het bevoegd gezag de beëindiging van de inschrijving voor de
      desbetreffende opleiding verbinden. Tot beëindiging van de inschrijving wordt slechts overgaan indien:

      a. de student naar het oordeel van het bevoegd gezag, met inachtneming van de bij ministeriële regeling
      vastgestelde persoonlijke omstandigheden, onvoldoende vordering heeft gemaakt in de opleiding;

      b. het bevoegd gezag heeft gezorgd voor zodanige voorzieningen dat de mogelijkheden voor goede voortgang van de
      opleiding zijn gewaarborgd, en

      c. het bevoegd gezag de desbetreffende student een schriftelijke waarschuwing heeft gegeven onder bepaling van een
      redelijke termijn waarbinnen de studieresultaten ten genoegen van het bevoegd gezag dienen te zijn verbeterd.

      3 De student van wie de inschrijving voor een opleiding op grond van het tweede lid is beëindigd, kan niet
      opnieuw aan die instelling voor die opleiding worden ingeschreven. Het bevoegd gezag spant zich in de student te
      ondersteunen en begeleiden naar een andere opleiding al dan niet aan die instelling, rekening houdend met diens
      voorkeuren. [Artikel 8.1.7d, tweede lid][ref2], is daarbij van overeenkomstige toepassing op een student op wie
      de [Leerplichtwet 1969][ref3] niet meer van toepassing is. Het bevoegd gezag biedt de student in elk geval de
      mogelijkheid zich te laten inschrijven aan een andere opleiding aan die instelling waarvoor de inschrijving wel
      mogelijk is. De vorige volzin geldt niet voor beroepscolleges als bedoeld in [artikel 1.3.2][ref4] of als het een
      student betreft op wie [artikel 8.1.1c, derde lid, onderdeel a of b][ref5], van toepassing is.

      4 Het bevoegd gezag stelt ter uitvoering van de voorgaande leden nadere regels vast. Deze regels hebben in elk
      geval betrekking op de te behalen studieresultaten en de voorzieningen, bedoeld in het tweede lid.

      5 Tegen het advies, bedoeld in het eerste lid, staat beroep open bij de Commissie van beroep voor de examens,
      bedoeld in [artikel 7.5.3][ref6]. De artikelen 7.5.3 tot en met [7.5.6][ref7] zijn van overeenkomstige toepassing.


