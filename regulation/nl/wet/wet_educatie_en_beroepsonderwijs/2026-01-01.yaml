  - number: 9.1.3
    text: |-
      1 Een doorlopende leerroute vmbo-mbo wordt verzorgd door het bevoegd gezag van een instelling en het bevoegd gezag
      van een school gezamenlijk op grond van een samenwerkingsovereenkomst.

      2 Een samenwerkingsovereenkomst als bedoeld in het eerste lid voldoet aan
      [ artikel 2.107b, tweede lid, van de Wet voortgezet onderwijs 2020][ref1].

      3 Indien de doorlopende leerroute vmbo-mbo volledig wordt verzorgd binnen een verticale
      scholengemeenschap regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen, genoemd in
      __REF000___________________________________________________________________________________________________________
      ____________.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.107b
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.107b
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: 2.107b
      - id: ref2
        bwb_id: BWBR0044212
        artikel: 2.107b
  - number: 9.1.4
    text: |-
      Het bevoegd gezag van een instelling en het bevoegd gezag van een school melden gezamenlijk aan Onze Minister dat
      zij een doorlopende leerroute vmbo-mbo aanbieden.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.4
  - number: 9.1.5
    text: |-
      1 Aan een leerling van een school kunnen delen van het onderwijsprogramma van de doorlopende leerroute vmbo-mbo
      en examens worden aangeboden die behoren tot de beroepsopleiding die deel uitmaakt van die doorlopende leerroute,
      zonder inschrijving als bedoeld in [artikel 8.1.1, eerste lid][ref1].

      2 Een student in de doorlopende leerroute vmbo-mbo kan in de gelegenheid worden gesteld om delen van het
      onderwijsprogramma te volgen en examens af te leggen die behoren tot het voortgezet onderwijs dat deel uitmaakt van
      die doorlopende leerroute.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8.1.1
        hoofdstuk: '8'
  - number: 9.1.6
    text: |-
      1

      De leerling van een school die een doorlopende leerroute vmbo-mbo volgt wordt met ingang van het derde studiejaar
      van die doorlopende leerroute vmbo-mbo ingeschreven als student aan de instelling die het beroepsonderwijs binnen
      de doorlopende leerroute vmbo-mbo verzorgt. In afwijking van [artikel 8.1.1a][ref1], eerste lid, eerste volzin,
      overlegt de school de gegevens, bedoeld in die volzin.

      2 Voor de inschrijving, bedoeld in het eerste lid, is het studentenstatuut, bedoeld in
      [artikel 7.4.8, vierde lid][ref2], reeds van toepassing op een leerling van een school die een doorlopende
      leerroute vmbo-mbo volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.1a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.8
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8.1.1a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 7.4.8
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 9.1.7
    text: |-
      1 Het bevoegd gezag van de instelling draagt de gehele studieduur van de doorlopende leerroute vmbo-mbo zorg voor:

      a. de uitvoering van delen van het onderwijsprogramma die behoren tot de beroepsopleiding die deel uitmaakt van de
      doorlopende leerroute vmbo-mbo, met inbegrip van de beroepspraktijkvorming;

      b. de examinering en diplomering betreffende de beroepsopleiding die deel uitmaakt van de doorlopende leerroute
      vmbo-mbo.

      2 Ten aanzien van de onderdelen van een doorlopende leerroute vmbo-mbo, bedoeld in het
      eerste lid, die in het eerste of tweede studiejaar van die route plaatsvinden, is van
      overeenkomstige toepassing hetgeen is bepaald bij of krachtens de [artikelen 2.5.5][ref1] en
      [2.5.5a, eerste, vierde, negende, tiende en twaalfde tot en met vijftiende lid][ref2], alsmede
      het bepaalde bij of krachtens de [artikelen 10][ref3], [12][ref4], [14][ref5], [15][ref6] en
      [25 van de Wet register onderwijsdeelnemers][ref7].

      3 Artikel 7.4.8a is van overeenkomstige toepassing op klachten over met de doorlopende leerroute vmbo-mbo verband
      houdende gedragingen van het bevoegd gezag van de school waarmee een samenwerkingsovereenkomst als bedoeld in
      [artikel 9.1.3][ref8] is gesloten, of van de ten behoeve van die school met taken belaste personen. Onverminderd
      artikel 7.4.8a, derde lid, maken de leden van de klachtencommissie geen deel uit van het bevoegd gezag van de
      school en is de voorzitter van de klachtencommissie niet werkzaam voor of bij dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.5
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.5a
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0042012#Artikel12
