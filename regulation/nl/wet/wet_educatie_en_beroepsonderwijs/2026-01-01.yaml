  - number: 7.1.5
    text: |-
      Het bevoegd gezag rapporteert over de vorderingen van de studenten aan hun ouders, dan wel aan de studenten zelf
      indien zij meerderjarig en handelingsbekwaam zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.1.5
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.2.1
  - number: 7.2.2
    text: |-
      1 De volgende soorten beroepsopleidingen worden onderscheiden:

      a. de entreeopleiding,

      b. de basisberoepsopleiding,

      c. de vakopleiding,

      d. de middenkaderopleiding, en

      e. de specialistenopleiding.

      2 De in het eerste lid bedoelde opleidingen kunnen worden verzorgd in de beroepsopleidende leerweg en de
      beroepsbegeleidende leerweg.

      3 De entreeopleidingen richten zich op de kwalificatie voor het eerste niveau van beroepsuitoefening of voor
      de entree op de arbeidsmarkt. De basisberoepsopleidingen richten zich op de kwalificatie voor het tweede, de
      vakopleidingen op de kwalificatie voor het derde en de middenkader- en specialistenopleidingen op de kwalificatie
      voor het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.2.2
  - number: 7.2.3
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat aan onderdelen van een kwalificatie of
      kwalificaties dan wel aan een keuzedeel of keuzedelen een certificaat is verbonden.

      2 [Artikel 7.4.6, eerste en derde lid,][ref1] is van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.4.6
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.4
    text: |-
      1 Met het oog op het functioneren van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen
      het aanbod van het beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de
      arbeidsmarktperspectieven voor afgestudeerden, draagt Onze Minister zorg voor het vaststellen en onderhouden
      van een samenhangend en gedifferentieerd geheel van opleidingsdomeinen, kwalificatiedossiers, de bijbehorende
      kwalificaties alsmede de keuzedelen die voor de desbetreffende bedrijfstakken of beroepencategorieën van belang
      zijn.

      2 Daartoe worden op voorstel van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, behoudens het achtste
      lid, bij ministeriële regeling vastgesteld:

      a. de kwalificatiedossiers,

      b. van elk kwalificatiedossier:

      1° het opleidingsdomein waartoe het kwalificatiedossier behoort, tenzij het een kwalificatiedossier betreft dat
      uitsluitend is gericht op de kwalificatie voor de entree op de arbeidsmarkt,

      2° de kwalificatie of kwalificaties die het kwalificatiedossier bevat, en

      3° de kwalificatie of kwalificaties op grond waarvan een beroepsopleiding kan worden ingericht die voor bekostiging
      in aanmerking komt,

      c. van elke kwalificatie:

      1° de soort beroepsopleiding, bedoeld in [artikel 7.2.2, eerste lid][ref1], waarop de kwalificatie is gericht,

      2°. de leerweg of leerwegen, bedoeld in [artikel 7.2.2, tweede lid][ref2], waarin die beroepsopleiding kan worden
      verzorgd,

      3° het niveau, bedoeld in [artikel 7.2.2, derde lid][ref3], van die beroepsopleiding,

      4° of toepassing is gegeven aan [artikel 7.2.6, eerste lid][ref4] en

      5°. of een beroepscollege een op de kwalificatie gerichte beroepsopleiding mag verzorgen,

      d. de keuzedelen, waarbij van elk keuzedeel wordt aangegeven bij welke kwalificatie of kwalificaties het behoort.

      3 De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven neemt bij het voorstel voor een kwalificatiedossier
      het bepaalde in het tweede, vierde, vijfde en zesde lid in acht. Uit het voorstel blijkt dat voldoende acht is
      geslagen op de aansluiting tussen de opleidingen voorbereidend beroepsonderwijs, de opleidingen middelbaar algemeen
      voortgezet onderwijs, de beroepsopleidingen en de opleidingen hoger beroepsonderwijs, in elk geval door raadpleging
      van vertegenwoordigers van die onderwijsvelden. Indien ook andere instanties nauw bij het voorstel voor het
      kwalificatiedossier zijn betrokken, maakt de Samenwerkingsorganisatie in haar voorstel melding van de wijze waarop
      het oordeel van die instanties is betrokken in het voorstel.

      4 Bij de vaststelling van een kwalificatiedossier worden de referentieniveaus
      Nederlandse taal en de referentieniveaus rekenen in acht genomen die op grond van
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref5] zijn
      vastgesteld voor de soorten opleiding als bedoeld in [artikel 7.2.2, eerste lid, onder a tot en met e][ref6].

      5 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de inhoud van een
      kwalificatiedossier.

      6 Bij ministeriële regeling worden voorschriften gegeven voor de termijnen bij de totstandkoming, vaststelling
      en geldigheidsduur van kwalificatiedossiers, keuzedelen en de koppeling van keuzedelen aan kwalificaties. Tevens
      worden bij ministeriële regeling een model voor een kwalificatiedossier, een model voor een keuzedeel en een
      toetsingskader voor de kwalificatiestructuur vastgesteld.

      7 Studenten worden behoudens de tweede volzin opgeleid overeenkomstig het kwalificatiedossier dat voor de
      desbetreffende beroepsopleiding is vastgesteld voor de aanvang van het studiejaar waarin zij met het eerste jaar
      van die opleiding starten. Nadat de geldigheidsduur van een kwalificatiedossier, een keuzedeel, keuzedelen en de
      koppeling van keuzedelen aan kwalificaties is verstreken, kan een diploma op basis van dat kwalificatiedossier nog
      worden uitgereikt dan wel het behalen van een keuzedeel op het diploma worden vermeld, gedurende een periode die
      overeenkomt met de studieduur van de desbetreffende beroepsopleiding, vermeerderd met 2 jaren.

      8 Onze Minister kan in bijzondere gevallen een kwalificatiedossier vaststellen zonder voorstel van de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven. Onze Minister gaat hiertoe niet over dan nadat de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven in de gelegenheid is gesteld om binnen een door Onze
      Minister te stellen termijn een voorstel voor een kwalificatiedossier te doen dat aansluit bij de ontwikkelingen op
      de arbeidsmarkt en is afgestemd met het beroepsonderwijs en het bedrijfsleven.


