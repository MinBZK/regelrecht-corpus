  - number: 7.5.4
    text: |-
      1 De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.

      2 Het beroep kan, wat de openbare instellingen betreft in afwijking van
      [hoofdstuk 7 van de Algemene wet bestuursrecht][ref1], worden ingesteld terzake dat een beslissing in strijd is met
      het recht.

      3 De commissie beslist binnen vier weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het beroepschrift is verstreken, wat de openbare instellingen betreft in afwijking van
      [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref2], tenzij de commissie deze termijn heeft
      verlengd met ten hoogste twee weken.

      4 De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.

      5 De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders van de kandidaat indien deze
      minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de beroepspraktijkvorming
      verzorgt, en aan de inspectie.

      6 Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie
      is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen,
      wat de openbare instellingen betreft in afwijking van [artikel 7:25 van de Algemene wet bestuursrecht][ref3].
      Zij kan bepalen dat opnieuw of, indien de beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat
      het examen of enig onderdeel daarvan opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel724
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel725
