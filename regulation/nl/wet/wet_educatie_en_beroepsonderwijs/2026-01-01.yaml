  - number: 2.6aa
    text: |-
      1 Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in
      [artikel 2.99 van de Wet voortgezet onderwijs 2020][ref2] en met inachtneming van de [artikelen 2.100][ref3],
      [2.101][ref4] en [2.108 van die wet][ref5] ook tot onderwijs- en examenvoorzieningen van de instelling toelaten zij
      die niet als student, vavo-student of extraneus aan de instelling worden ingeschreven maar zijn ingeschreven als
      leerling aan een school voor voortgezet onderwijs.

      2 Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld over de verantwoording van de bedragen
      die het bevoegd gezag met toepassing van [artikel 5.39, zevende lid, van de Wet voortgezet onderwijs 2020][ref6]
      heeft ontvangen.

      3 Indien het bevoegd gezag van een school voor voortgezet onderwijs ter uitvoering van
      [artikel 2.99 van de Wet voortgezet onderwijs 2020][ref7] leerlingen in het kader van het onderwijs waarvoor zij
      aan die school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een instelling van datzelfde bevoegd
      gezag verzorgt, regelt het bevoegd gezag voor zover van toepassing op overeenkomstige wijze de onderwerpen, bedoeld
      in [artikel 2.100, tweede lid, van die wet][ref8].


