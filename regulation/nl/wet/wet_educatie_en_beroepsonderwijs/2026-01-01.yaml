  - number: 9.2.11
    text: |-
      1 Het college van burgemeester en wethouders van de contactgemeente geeft aan Onze Minister alle gevraagde gegevens
      ter inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het beleid van Onze Minister op het
      gebied van het bevorderen van het aantal personen tot 27 jaar dat een startkwalificatie behaalt en het verbeteren
      van de overgang van het onderwijs naar de arbeidsmarkt.

      2 Bij ministeriële regeling kunnen voorschriften worden gegeven over de wijze waarop de gegevens beschikbaar worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.2.11
  - number: 9.2.12
    text: |-
      1 Loopbaanbegeleiding als bedoeld in dit artikel en de daarop berustende bepalingen omvat advisering en
      ondersteuning bij de overstap naar vervolgonderwijs of de arbeidsmarkt.

      2 Het bevoegd gezag biedt loopbaanbegeleiding aan tijdens de opleiding en tot een jaar na diplomering.

      3 Het bevoegd gezag doet een aanbod van loopbaanbegeleiding aan de student of gediplomeerde van de entreeopleiding
      of de beroepsopleidende leerweg van de basisberoepsopleiding, met uitzondering van de gediplomeerde met een
      aansluitende inschrijving voor vervolgonderwijs.

      4 Het bevoegd gezag kan loopbaanbegeleiding bieden aan de student of gediplomeerde van de beroepsbegeleidende
      leerweg van de basisberoepsopleiding of aan de student of gediplomeerde van de vakopleiding, de
      middenkaderopleiding of de specialistenopleiding.

      5 Het bevoegd gezag stelt beleid vast met betrekking tot de loopbaanbegeleiding dat in elk geval bevat op
      welke wijze het bevoegd gezag gebruik maakt van de bevoegdheid, bedoeld in het vierde lid. Het bevoegd gezag
      houdt bij het vaststellen van het beleid rekening met de afspraken uit het regionaal programma, bedoeld in
      [artikel 9.2.8, derde lid, onderdeel b][ref1].

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de inhoud
      van het beleid, bedoeld in het vijfde lid, en de invulling van de loopbaanbegeleiding.

      7 Van de termijn, bedoeld in het tweede lid, kan worden afgeweken in geval van bijzondere omstandigheden als
      bedoeld in [artikel 8.1.5, derde lid, onderdelen a tot en met f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.5
