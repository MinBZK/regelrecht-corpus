        artikel: 8a.4.1
        hoofdstuk: 8a
  - number: 8a.1.6
    text: |-
      1 Het bevoegd gezag behoeft de voorafgaande instemming over de hoofdlijnen van de jaarlijkse begroting van een
      gezamenlijke vergadering van de studentenraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad,
      waarbij in elk geval aandacht wordt besteed aan de beoogde verdeling van de middelen over de beleidsterreinen
      onderwijs, huisvesting en beheer, investeringen en personeel.

      2 Het bevoegd gezag stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een reglement voor de
      gezamenlijke vergadering vast. [Artikelen 8a. 3.1, tweede lid, aanhef en onderdeel f, en derde lid][ref1], zijn van
      overeenkomstige toepassing.

      3 Bij algemene maatregel van bestuur kunnen regels of nadere regels worden vastgesteld omtrent:

      a. hetgeen wordt verstaan onder hoofdlijnen van de jaarlijkse begroting;

      b. situaties waarin het instemmingsrecht, bedoeld in het eerste lid, niet wordt uitgeoefend;

      c. de termijn waarbinnen tot instemming of onthouding van de instemming moet worden besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.3.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a.3.1
        hoofdstuk: 8a
  - number: 8a.2.1
    text: |-
      1 Het bevoegd gezag stelt de studentenraad ten minste twee maal per jaar in de gelegenheid de algemene gang van
      zaken in de instelling met hem te bespreken. Het bevoegd gezag en de studentenraad komen met elkaar bijeen, indien
      daarom onder opgave van redenen wordt verzocht door het bevoegd gezag of de studentenraad.

      2 De studentenraad is bevoegd tot bespreking van alle aangelegenheden, de instelling betreffende. Hij is bevoegd
      over deze aangelegenheden aan het bevoegd gezag voorstellen te doen en standpunten kenbaar te maken, alsmede het
      bevoegd gezag te verplichten daarover een standpunt in te nemen en bekend te maken.

      3 Het bevoegd gezag verstrekt de studentenraad desgevraagd tijdig alle inlichtingen die deze voor de vervulling van
      zijn taak redelijkerwijs nodig heeft.

      4 Het bevoegd gezag draagt zorg voor de voorzieningen die de studentenraad voor de vervulling van zijn taak
      redelijkerwijs nodig heeft.

      5 De studentenraad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij
      de instelling betrokkenen van het verslag kennis kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.2.1
  - number: 8a.2.1a
    text: |-
      Indien het bevoegd gezag een voorstel voor advies of instemming voorlegt aan de studentenraad, wijst het bevoegd
      gezag de studentenraad uitdrukkelijk op haar instemmings- of adviesbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.2.1a
  - number: 8a.2.2
    text: |-
      1 De studentenraad heeft de volgende bijzondere bevoegdheden:

      a. het verlenen van instemming aan een door het bevoegd gezag voorgenomen beslissing als bedoeld in het derde lid;

      b. het uitbrengen van advies over een door het bevoegd gezag voorgenomen beslissing als bedoeld in het vierde lid.

      2 De bijzondere bevoegdheden zijn niet van toepassing, voor zover de desbetreffende aangelegenheid voor de
      instelling reeds inhoudelijk is geregeld in een bij of krachtens wet gegeven voorschrift.

      3 De studentenraad heeft instemmingsbevoegdheid met betrekking tot voorgenomen beslissingen van het bevoegd gezag
      ten aanzien van:

      a. het medezeggenschapsstatuut;

      b. het studentenstatuut en de huisregels voor studenten en vavo-studenten;

      c. de beroeps- en klachtenregelingen voor studenten en vavo-studenten;

      d. de hoogte en de besteding van de vrijwillige ouder- of studentbijdrage, alsmede de wijze waarop deze bijdrage
      tussen student of vavo-student en bevoegd gezag wordt overeengekomen;

      e. de wijze waarop informatie wordt gegeven over de inhoud, planning en organisatie van het onderwijs en de
      examens;

      f.

      g.

      h. de model-praktijkovereenkomst;

      i.

      j. de wijze van vastleggen van studievorderingen van studenten en vavo-studenten en in dat verband het beleid met
      betrekking tot bescherming van de privacy van studenten en vavo-studenten;

      k. de regels op het gebied van veiligheid, gezondheid en welzijn voor zover deze de studenten en vavo-studenten
      betreffen;

      l. het reglement voor de studentenraad, met inachtneming van [artikel 8a.3.1, derde lid][ref1];

      m. het onderwijsprogramma indien dit minder uren als bedoeld in [artikel 7.2.7, derde of vierde lid][ref2], omvat;

      n.

      o. het beleid bij de toepassing van [artikel 8.1.5][ref3];

      p. het vaststellen of wijzigen van een examenreglement voor een opleiding voortgezet algemeen volwassenenonderwijs
      als bedoeld in [artikel 2.60 van de Wet voortgezet onderwijs 2020][ref4];

      q. het vaststellen of wijzigen van een programma van toetsing en afsluiting
      voor een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in de
      [artikelen 2.60a tot en met 2.60c van de Wet voortgezet onderwijs 2020][ref5];

      r. de vaststelling van de schoolgids, bedoeld in [artikel 2.92 van de Wet voortgezet onderwijs 2020][ref6], voor
      een school die deel uitmaakt van een verticale scholengemeenschap.

      4 De studentenraad heeft adviesbevoegdheid met betrekking tot voorgenomen beslissingen van het bevoegd gezag ten
      aanzien van:

      a. inkrimping, uitbreiding, fusie en overdracht van de instelling, beëindiging van opleidingen, samenwerking
      met andere instellingen bij de uitvoering van opleidingen en vorming, wijziging of beëindiging van een verticale
      scholengemeenschap;

      b. verandering van de grondslag van de instelling;

      c. werkomstandigheden en voorzieningen voor studenten en vavo-studenten binnen de instelling;

      d. het beleid met betrekking tot intake- en assessmentprocedures;

      e. de rol van studenten en vavo-studenten bij de interne kwaliteitszorg en zelfevaluatie;

      f. de te verstrekken informatie aan aspirant-studenten van beroepsopleidingen, bedoeld in [artikel 6.1.3a][ref7];

      g. de regeling die het bevoegd gezag vaststelt voor de selectiecriteria en de selectieprocedure, bedoeld in
      [artikel 8.2.2a][ref8].

      5 In het reglement kunnen andere, nader te omschrijven onderwerpen worden opgenomen ten aanzien waarvan een van de
      bijzondere bevoegdheden aan de studentenraad wordt toegekend.


