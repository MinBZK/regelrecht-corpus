        paragraaf: 4.1.3.3
  - number: 2.1.5
    text: |-
      1 Na een goedkeuringsbesluit als bedoeld in [artikel 2.1.4, eerste lid][ref1], geschiedt de overdracht van de
      instandhouding van een instelling bij notariële akte. Bij deze akte verbindt het bevoegd gezag zich om de rechten
      ten aanzien van de gebouwen en terreinen en roerende zaken met betrekking tot die instelling over te dragen. Deze
      akte geldt tevens als akte van levering als bedoeld in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref2].
      In de akte wordt bepaald dat het bevoegd gezag aan wie wordt overgedragen het personeel in gelijke betrekkingen in
      dienst neemt met ingang van de datum van overdracht.

      2 Door overdracht met inachtneming van het eerste lid treedt het verkrijgende bevoegd gezag in alle uit de wet
      voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de instelling, onverminderd
      hetgeen verder voor de overgang naar burgerlijk recht is vereist.

      3 Van de verplichting tot overdracht van de rechten ten aanzien van onroerende en roerende zaken kan Onze Minister
      ontheffing verlenen in bijzondere omstandigheden. Onze Minister besluit binnen zes maanden na ontvangst van een
      aanvraag.

      4 Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref3] van een rechtspersoon
      die een instelling in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de instelling in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de
      instelling overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
