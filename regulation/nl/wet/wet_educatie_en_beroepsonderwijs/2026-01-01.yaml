  - number: 2.2a.4
    text: |-
      1 Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het daarop
      volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en vermeldt
      daarbij afzonderlijk het bedrag voor vavo-studenten met een handicap of chronische ziekte.

      2 De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.

      3 Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze titel. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de vavo-studenten.

      5 De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze,
      bedoeld in [artikel 2.2a.2][ref1] , gaan vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze gegevens en de verklaring worden
      ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2a.2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
