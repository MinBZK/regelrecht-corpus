  - number: 6.1.3
    text: |-
      1 Het bevoegd gezag zorgt ervoor dat een beroepsopleiding alleen door de instelling wordt aangeboden als er na
      beëindiging van de opleiding voldoende arbeidsmarktperspectief is voor de studenten. Onder arbeidsmarktperspectief
      wordt in ieder geval verstaan het perspectief voor gediplomeerde schoolverlaters op het binnen een redelijke
      termijn vinden van werk op het niveau van de gevolgde opleiding.

      2 Onverminderd het eerste lid kan het bevoegd gezag van een beroepscollege een beroepsopleiding aanbieden als
      de soort instelling in de regeling, bedoeld in [artikel 7.2.4][ref1], is vermeld bij de kwalificatie waarop de
      opleiding is gericht of als de opleiding aantoonbaar gericht is op en van belang is voor de specifieke bedrijfstak
      of groep van bedrijfstakken waarvoor de instelling opleidingen verzorgt.

      3 Het bevoegd gezag zorgt ervoor dat een beroepsopleiding alleen door de instelling wordt aangeboden als de
      verzorging van die opleiding, gelet op het geheel van de voorzieningen op het gebied van het beroepsonderwijs,
      doelmatig is.

      4 Het bevoegd gezag legt over wijzigingen van het opleidingenaanbod van een instelling met betrekking tot het
      arbeidsmarktperspectief en de doelmatige verzorging van een opleiding verantwoording af in het bestuursverslag,
      bedoeld in [artikel 2.5.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.3
    references:
