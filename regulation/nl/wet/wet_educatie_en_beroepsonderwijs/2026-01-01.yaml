  - number: 1.4.1
    text: |-
      1 Onze Minister besluit op aanvraag van het bevoegd gezag van een andere dan een in [artikel 1.1.1][ref1] bedoelde
      instelling of van een instelling dat aan de met goed gevolg afgelegde examens of onderdelen van examens van een
      beroepsopleiding in de beroepsopleidende leerweg of van een beroepsopleiding in de beroepsbegeleidende leerweg,
      verzorgd door die instelling, een diploma als bedoeld in [artikel 7.4.6][ref2] of een certificaat als bedoeld in
      [artikel 7.2.3][ref3] is verbonden, indien de desbetreffende instelling voor die opleiding in acht neemt hetgeen
      bij of krachtens deze wet is bepaald ten aanzien van:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref4],

      a1. de informatie aan aspirant-studenten, bedoeld in [artikel 6.1.3a][ref5],

      b. het onderwijs, met uitzondering van de [artikelen 7.1.1][ref6], [7.1.5][ref7] en [7.2.4a, derde lid][ref8],
      mits het aantal begeleide onderwijsuren en het aantal uren beroepspraktijkvorming op grond
      van de studieduur naar evenredigheid ten minste gelijk is aan het aantal uren, bedoeld in
      [artikel 7.2.7, tweede tot en met vierde lid][ref9], de examens, de verklaring, bedoeld in
      [artikel 7.4.6a, eerste lid][ref10], en in geval van een samenwerkingscollege de [artikelen 8.6.1][ref11] en
      [8.6.3][ref12],

      c. de commissie van beroep voor de examens, bedoeld in [artikel 7.5.3][ref13],

      d.

      e. de vooropleidingseisen, bedoeld in [artikel 8.2.1][ref14], en

      f. de opneming in de Registratie instellingen en opleidingen.

      Het bevoegd gezag voegt bij deze aanvraag in elk geval een beschrijving van de regeling voor het onderwijsprogramma
      en de examens, bedoeld in [artikel 7.4.8][ref15], voor de beroepsopleiding waarop de aanvraag betrekking heeft.

      1a Het eerste lid is van overeenkomstige toepassing op een beroepsopleiding in andere dan in het eerste
      lid genoemde leerwegen, met dien verstande dat voor die opleiding [artikel 7.2.2, tweede lid][ref16], niet
      van toepassing is en ten aanzien van het onderwijs [artikel 7.2.7, eerste lid][ref17], niet in acht behoeft
      te worden genomen voor wat betreft de eisen met betrekking tot voldoende begeleide onderwijsuren en uren
      beroepspraktijkvorming en artikel 7.2.7, tweede tot en met achtste lid, niet in acht behoeft te worden genomen. Het
      tweede tot en met tiende lid zijn van overeenkomstige toepassing.

      1b Een beroepsopleiding als bedoeld in lid 1 of lid 1a van een andere dan een in [artikel 1.1.1][ref18] bedoelde
      instelling bevat geen keuzedelen die niet zijn gekoppeld aan een kwalificatie, behorend bij een beroepsopleiding
      waarvoor de instelling een diploma-erkenning heeft op grond van lid 1 of lid 1a.

      1c Het bevoegd gezag dat een beroepsopleiding als bedoeld in lid 1 of lid 1a verzorgt kan met een student
      overeenkomen dat de student slechts een onderdeel van de beroepsopleiding zal volgen.

      2 Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.

      3 In afwijking van het eerste lid kan Onze Minister de aanvraag toewijzen voor anderhalf jaar, indien een aanvraag
      wordt gedaan door:

      a. een bevoegd gezag dat geen andere beroepsopleiding verzorgt waaraan een diploma of certificaat als bedoeld in
      het eerste lid is verbonden, of

      b. een bevoegd gezag dat drie jaren of minder voorafgaand aan de aanvraag voor een andere beroepsopleiding die het
      verzorgt, een waarschuwing als bedoeld in [artikelen 6.1.5][ref19] of [6.2.3][ref20] heeft ontvangen, indien de
      inspectie uit een oogpunt van kwaliteitsbewaking hiertoe aanleiding ziet.

      4 Bij toepassing van het derde lid wordt de toewijzing na de in het derde lid bedoelde periode van anderhalf jaar
      voor onbepaalde tijd van rechtswege verlengd, tenzij Onze Minister uiterlijk twee maanden voordat die periode van
      anderhalf jaar is verstreken, besluit om de desbetreffende beschikking in te trekken omdat:

      a. de opleiding in de praktijk van onvoldoende kwaliteit blijkt te zijn,

      b. het bevoegd gezag heeft aangegeven geen verlenging te wensen, of

      c. de opleiding niet binnen één jaar na de toewijzing is gestart.

      5 Indien een beschikking op grond van het vierde lid, onderdeel a, is ingetrokken, brengt het bevoegd gezag,
      alvorens het een nieuwe aanvraag als bedoeld in het eerste lid of lid 1a indient, zodanige verbeteringen aan
      dat aannemelijk is dat de desbetreffende opleiding of opleidingen in de praktijk wel van voldoende kwaliteit zal
      respectievelijk zullen, zijn.

      6 Indien een toewijzing als bedoeld in het derde lid wordt gedaan, informeert het bevoegd gezag de studenten en
      aspirant-studenten daarover en over de mogelijkheden om hun opleiding elders af te ronden in het geval dat de
      beschikking wordt ingetrokken.

      7 Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister de nodige inlichtingen omtrent de
      instelling. Het bevoegd gezag doet Onze Minister jaarlijks voor 1 maart een verslag toekomen omtrent de
      werkzaamheden van de instelling voor zover betrekking hebbend op beroepsopleidingen.

      8 Voor zover ten aanzien van een instelling toepassing is gegeven aan het eerste lid, wordt die instelling voor de
      toepassing van deze wet aangemerkt als een niet uit ’s Rijks kas bekostigde instelling.

      9 De [artikelen 1.3.8][ref21] en [1.3.9][ref22] zijn van overeenkomstige toepassing op instellingen als bedoeld in
      het eerste lid.

      10 Voor een andere dan een in [artikel 1.1.1][ref23] bedoelde instelling of een instelling zijn voor zover het
      betreft een beroepsopleiding ten aanzien waarvan toepassing is gegeven aan het eerste lid van overeenkomstige
      toepassing:

      a. [artikel 2.5.5a, eerste, vijfde, zesde en negende tot en met twaalfde lid][ref24];

      b. [artikel 8.1.1a][ref25]; en

      c. de [artikelen 9.2.2][ref26], [9.2.3][ref27] en [9.2.6][ref28].


