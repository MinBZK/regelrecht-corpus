  - number: 12.5.1c
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 23 februari 2022 tot wijziging van
      onder meer de Wet educatie en beroepsonderwijs met het oog op de verbetering van de rechtsbescherming van mbo-
      studenten (Stb. 2022, 134) aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van die wet
      in de praktijk.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel12.5.1c
  - number: 12.5.2
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 1996, met uitzondering van:

      a. [artikel 7.4.11][ref1], wat de examens van de opleidingen Nederlands als tweede taal I en II betreft, welk
      artikel ten aanzien van die examens in werking treedt met ingang van een bij koninklijk besluit te bepalen
      tijdstip;

      b. [artikel 12.3.1][ref2], [artikel 12.3.10][ref3], [artikel 12.3.11][ref4] en [artikel 12.3.19, tweede lid][ref5],
      die in werking treden met ingang van 1 november 1995;

      c. de [artikelen 12.4.1][ref6], 12.4.2, onderdelen C, onder 7, I en J, en 12.4.10, onderdeel A, die in werking
      treden met ingang van 1 januari 1997;

      d. de artikelen 12.4.2, met uitzondering van de onderdelen C, onder 7, I en J, 12.4.9 en 12.4.10, met uitzondering
      van onderdeel A, die in werking treden met ingang van 1 augustus 1997.


