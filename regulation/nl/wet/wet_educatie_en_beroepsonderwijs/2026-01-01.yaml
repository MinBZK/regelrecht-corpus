  - number: 7.5.2
    text: |-
      1 Het bevoegd gezag draagt zorg voor een behoorlijke behandeling van klachten van studenten en deelnemers,
      aspirant-studenten en aspirant-deelnemers, voormalige studenten en deelnemers, personeel en overige betrokkenen bij
      het onderwijs of de praktijkbegeleiding van de instelling over gedragingen van het bevoegd gezag of ten behoeve van
      de instelling met taken belaste personen.

      2 Het bevoegd gezag voorziet in de klachtbehandeling met overeenkomstige
      toepassing van in elk geval de [artikelen 9:3 tot en met 9:7, eerste lid][ref1],
      [9:8, eerste lid, aanhef en onderdelen a tot en met e, en derde lid, eerste volzin][ref2], [9:9][ref3],
      [9:10, eerste lid, tweede lid, onderdelen b en c, en derde lid][ref4], [9:11][ref5], [9:12, eerste lid][ref6],
      [9:12a][ref7], [9:15][ref8] en [9:16 van de Algemene wet bestuursrecht][ref9].

      3 Het bevoegd gezag voorziet in een klachtencommissie die is belast met de behandeling van en advisering over
      klachten en die bestaat uit ten minste drie leden die geen deel uitmaken van een bevoegd gezag als bedoeld in
      [artikel 1.1.1, onder w][ref10], waaronder een voorzitter die niet werkzaam is voor of bij het bevoegd gezag.

      4 Op een ieder die is betrokken bij de uitvoering van dit artikel is
      [artikel 2:5, eerste lid, van de Algemene wet bestuursrecht][ref11] van overeenkomstige toepassing.


