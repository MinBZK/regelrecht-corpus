  - number: 1.7.1
    text: |-
      1 Aan een instelling kunnen contractactiviteiten worden verricht, bestaande uit werkzaamheden voor eigen rekening
      ten behoeve van derden. Deze activiteiten kunnen worden verricht indien zij verband houden met werkzaamheden
      waarvoor de instelling uit de openbare kas bekostigd wordt en voor zover de uitvoering van die werkzaamheden
      hierdoor niet wordt geschaad.

      2 Het bevoegd gezag van een instelling draagt er zorg voor dat [artikel 2 van de Wet privatisering ABP][ref1] van
      toepassing blijft op het personeel.

      3 De vereisten voor benoembaarheid, bedoeld in [artikel 4.2.1, eerste lid][ref2], zijn niet van toepassing op een
      docent voor zover deze is belast met het verrichten van contractactiviteiten.

      4 Het bevoegd gezag voorziet in een regeling voor het verrichten van contractactiviteiten door het personeel van de
      instelling met het oog op het voorkomen van vermenging van belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.1
