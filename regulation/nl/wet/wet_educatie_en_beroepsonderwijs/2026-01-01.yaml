  - number: 1.4a.2
    text: |-
      1 Het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1, tweede lid][ref1], waarvoor wat betreft
      een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in [artikel 7.3.1, eerste lid, onder a][ref2],
      toepassing is gegeven aan artikel 1.4a.1, eerste lid, kan, ten aanzien van genoemde opleiding, in afwijking van
      [artikel 8.1.1d, eerste volzin][ref3], in gevallen als geregeld in en met inachtneming van de voorschriften gegeven
      bij of krachtens [artikel 2.109 van de Wet voortgezet onderwijs 2020][ref4] tot onderwijs- en examenvoorzieningen
      van de instelling toelaten zij die niet als vavo-student of extraneus aan de instelling worden ingeschreven
      maar zijn ingeschreven als leerling aan een ingevolge [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref5]
      aangewezen school.

      2 Indien het bevoegd gezag van een ingevolge [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref6] aangewezen
      school ter uitvoering van [artikel 2.109, eerste en tweede lid, van die wet][ref7] leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven, onderwijs wil kunnen laten volgen dat een instelling als
      bedoeld in [artikel 1.4a.1, tweede lid][ref8], van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op
      overeenkomstige wijze de onderwerpen, bedoeld in artikel 2.109, vierde lid, van de Wet voortgezet onderwijs 2020.


