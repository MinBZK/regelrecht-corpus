  - number: 2.1.4
    text: |-
      1 Een fusie, splitsing of omzetting komt niet tot stand dan na goedkeuring van Onze Minister.

      2 Onze Minister besluit binnen dertien weken na ontvangst van de aanvraag, welke termijn eenmaal kan worden
      verlengd met ten hoogste dertien weken. [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van
      toepassing.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.1.4
    references:
