  - number: 1.3.10
    text: |-
      [Artikel 2:13, eerste lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing in het verkeer tussen
      ouders, studenten, vavo-studenten of deelnemers en het bevoegd gezag.


