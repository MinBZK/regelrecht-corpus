  - number: 2.2a.3
    text: |-
      1 Onze Minister kan volgens bij ministeriële regeling te geven voorschriften ten behoeve van de ontwikkeling van
      het bestel van het voortgezet algemeen volwassenenonderwijs een bedrag toevoegen aan de rijksbijdrage, berekend op
      grond van [artikel 2.2a.2][ref1].

      2 Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2a.2
