  - number: 9.1.13
    text: |-
      Op een student aan een doorlopende leerroute op wie de [Leerplichtwet 1969][ref1] niet van toepassing is, is
      [artikel 8.1.7d, tweede lid][ref2], van overeenkomstige toepassing, indien hij nog geen vmbo-diploma heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.7d
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel9.1.13
