  - number: 7.4.6b
    text: |-
      1 Aan de bezitter van een diploma, certificaat of mbo-verklaring als bedoeld in de
      [artikelen 7.4.6, eerste lid][ref1], [7.2.3, eerste lid][ref2], respectievelijk [7.4.6a][ref3] reikt de
      examencommissie van de betreffende instelling desgevraagd een vervangend getuigschrift uit in verband met
      een naamswijziging van de betrokkene ten gevolge van de toepassing van de [artikelen 4, vierde lid][ref4],
      [7, eerste lid][ref5], [28b, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref6] of
      [artikel 12 van de Rijkswet op het Nederlanderschap][ref7].

      2 Het vervangende getuigschrift bevat geen andere wijzigingen van de oorspronkelijke relevante gegevens.

      3 Het vervangende getuigschrift wordt verstrekt onder de voorwaarde dat het oorspronkelijke getuigschrift bij de
      betrokken examencommissie wordt ingeleverd.

      4 Het vervangende getuigschrift heeft dezelfde bewijskracht als het oorspronkelijke getuigschrift.

      5 Bij ministeriële regeling kunnen voorschriften worden gesteld over de door de aanvrager over te leggen gegevens
      en de wijze waarop de vervanging door de examencommissie wordt uitgevoerd.

      6 In afwijking van [artikel 7.4.1][ref8] is deze bepaling ook van toepassing op getuigschriften van opleidingen
      voortgezet algemeen volwassenenonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
