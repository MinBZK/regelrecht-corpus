  - number: 9.1.9
    text: |-
      1 In afwijking van de [artikelen 2.6, derde lid][ref1], en
      [2.7, derde lid, van de Wet voortgezet onderwijs 2020][ref2] en
      [artikel 7.2.4a, derde lid, onderdelen b tot en met d, en vierde lid][ref3], bedraagt de studieduur van een
      doorlopende leerroute vmbo-mbo vanaf het derde leerjaar aan een school:

      a. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een eenjarige basisberoepsopleiding ten
      minste twee en ten hoogste drie volledige studiejaren;

      b. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een tweejarige basisberoepsopleiding of
      tweejarige vakopleiding ten minste drie en ten hoogste vier volledige studiejaren;

      c. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een driejarige vakopleiding of de
      middenkaderopleiding ten minste vier en ten hoogste vijf volledige studiejaren;

      d. voor een doorlopende leerroute vmbo-mbo die opleidt tot het diploma van een middenkaderopleiding als bedoeld in
      [artikel 7.2.4a, vierde lid][ref4], ten minste vijf en ten hoogste zes volledige studiejaren.

      2 Ten aanzien van de opleiding voorbereidend beroepsonderwijs of middelbaar algemeen voortgezet onderwijs die deel
      uitmaakt van een doorlopende leerroute vmbo-mbo wordt onder «studieduur» mede verstaan «cursusduur als bedoeld in
      de [Wet voortgezet onderwijs 2020][ref5]» en wordt onder «volledig studiejaar» mede verstaan «jaar».


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.7
