  - number: 6.1.4a
    text: |-
      1 Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheden, bedoeld in
      [artikel 6.1.1, tweede lid][ref1], en [6.1.4, eerste lid, onder c][ref2].

      2 Onze Minister kan zich bij de toepassing van de beleidsregels laten adviseren door een onafhankelijke
      adviescommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.4a
