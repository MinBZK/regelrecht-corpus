  - number: 9.2.5
    text: |-
      1 Het college van burgemeester en wethouders kan ondersteuning bieden aan de persoon, bedoeld in
      [artikel 9.2.1][ref1], gericht op het terugleiden naar onderwijs.

      2 Indien het terugleiden naar onderwijs niet passend is, kan het college van burgemeester en wethouders
      de persoon ondersteunen bij het vinden van werk of doorgeleiden naar ondersteuning op grond van
      [artikel 7a van de Participatiewet][ref2].

      3 Voor zover dit noodzakelijk is voor de uitvoering van het eerste en het tweede lid, verwerkt het college van
      burgemeester en wethouders de volgende persoonsgegevens:

      a. gegevens als bedoeld in [artikel 21, eerste, derde en vierde lid, van de Wet register onderwijsdeelnemers][ref3];

      b. gegevens waarover het college beschikt ten behoeve van de uitvoering van de [Leerplichtwet 1969][ref4]; en

      c. gegevens als bedoeld in
      [artikel 73, zevende lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5].

      4 Het college van burgemeester en wethouders kan de gegevens, bedoeld in het derde lid, verder verwerken voor zover
      dit noodzakelijk is voor de uitvoering van [artikel 7a van de Participatiewet][ref6].

      5 De ondersteuning, bedoeld in het eerste en tweede lid, vindt pas plaats na overleg met het bevoegd gezag van de
      school of instelling over de aangeboden loopbaanbegeleiding indien de persoon, bedoeld in [artikel 9.2.1][ref7]:

      a. korter dan een jaar geleden een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel a][ref8], heeft gehaald;

      b. korter dan twee jaar geleden een schooldiploma of verklaring als bedoeld in
      [artikel 14d van de Wet op de expertisecentra][ref9] heeft gehaald; of

      c. korter dan twee jaar geleden een schooldiploma praktijkonderwijs als bedoeld in
      [artikel 2.58, derde lid, van de Wet voortgezet onderwijs 2020][ref10] of een verklaring praktijkonderwijs als
      bedoeld in [artikel 2.59, tweede lid, van die wet][ref11] heeft gehaald.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taken,
      bedoeld in dit artikel.

      7 Van de termijnen, bedoeld in het vijfde lid, kan worden afgeweken indien daar gerechtvaardigde belangen voor
      zijn.


