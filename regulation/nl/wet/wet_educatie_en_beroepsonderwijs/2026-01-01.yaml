  - number: 9.2.1
    text: |-
      Deze paragraaf is van toepassing op degene:

      a. op wie de leerplicht of de kwalificatieplicht, bedoeld in [paragraaf 2][ref1] onderscheidenlijk
      [2a van de Leerplichtwet 1969][ref2], niet meer van toepassing is en die jonger is dan 27 jaar;

      b. die geen startkwalificatie heeft behaald; en

      c. die:

      1°. het onderwijs waarvoor hij is ingeschreven gedurende een aaneengesloten periode van ten minste vier weken of
      een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt; of

      2°. niet is ingeschreven aan een instelling als bedoeld in de [Wet op het onderwijstoezicht][ref3].


