      1 Het eindexamen omvat voor degene die geen eindexamen in het vak wiskunde aflegt een instellingsexamen
      rekenen. Bij de vaststelling van de opgaven van dit instellingsexamen worden de referentieniveaus rekenen
      in acht genomen die voor de desbetreffende schoolsoort of leerweg daarbinnen zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden omtrent dit instellingsexamen nadere voorschriften
      vastgesteld.

      3 Dit artikel is ook van toepassing op degene die het eindexamen van een erkende opleiding voortgezet algemeen
      volwassenonderwijs aflegt aan een instelling als bedoeld in [artikel 1.4a.1][ref2].

      4 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
