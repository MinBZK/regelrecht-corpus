  - number: 8.1.1a
    text: |-
      1 De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de student
      of vavo-student of, indien deze minderjarig is, door de ouders de gegevens betreffende de geslachtsnaam, de
      voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de student of vavo-student zijn
      overgelegd. Indien door de student of vavo-student of, indien deze minderjarig is, door de ouders aannemelijk
      wordt gemaakt dat geen persoonsgebonden nummer van de student of vavo-student kan worden overgelegd, vindt de
      inschrijving plaats met inachtneming van het derde lid.

      2 De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document, waarin de desbetreffende gegevens zijn opgenomen.

      3 Indien door de student of vavo-student of, indien deze minderjarig is, door de ouders aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de student of vavo-student kan worden overgelegd, meldt het bevoegd
      gezag binnen twee weken na de beslissing tot inschrijving aan Onze Minister de beschikbare gegevens van de
      student of vavo-student, bedoeld in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het
      studentadministratienummer.

      4 Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het
      bevoegd gezag het burgerservicenummer van de student of vavo-student, dan wel, indien is gebleken dat hem niet
      van overheidswege een burgerservicenummer is verstrekt, het onderwijsnummer van de student of vavo-student. Het
      onderwijsnummer is een door Onze Minister uitgegeven en aan de student of vavo-student toegekend persoonsgebonden
      nummer.

      5 Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de administratie van de
      instelling.

      6 Indien aan een student of vavo-student een onderwijsnummer is toegekend en het bevoegd gezag daarna de
      beschikking krijgt over zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als
      persoonsgebonden nummer op in de administratie van de instelling in de plaats van het onderwijsnummer. Het bevoegd
      gezag meldt deze wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het
      onderwijsnummer van de student of vavo-student.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.1
