  - number: '11.2'
    text: |-
      1 Het is anderen dan de instellingen die daartoe ingevolge deze wet zijn gerechtigd, verboden om:

      a. een beroepsopleiding in de zin van deze wet te verzorgen of aan te bieden;

      b. een examen in de zin van deze wet af te nemen of aan te bieden;

      c. een diploma als bedoeld in [artikel 7.4.6][ref1], een certificaat als bedoeld in [artikel 7.2.3][ref2] of een
      mbo-verklaring als bedoeld in [artikel 7.4.6a][ref3] af te geven of in het vooruitzicht te stellen; of

      d. de indruk te wekken dat een activiteit onderwijs of examinering in de zin van deze wet betreft, dan wel kan
      leiden tot een diploma als bedoeld in [artikel 7.4.6][ref4], een certificaat als bedoeld in [artikel 7.2.3][ref5]
      of een mbo-verklaring als bedoeld in [artikel 7.4.6a][ref6].

      2 Onze Minister kan een bestuurlijke boete opleggen aan degene die handelt in strijd met het eerste lid.

      3 De bestuurlijke boete, bedoeld in het tweede lid, bedraagt ten hoogste het bedrag dat is vastgesteld voor
      de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7], of, indien dat
      passender is, ten hoogste 10% van de omzet van de onderneming, onderscheidenlijk, indien de overtreding door
      een ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen die van de vereniging deel
      uitmaken, in het boekjaar voorafgaande aan het besluit waarin de bestuurlijke boete wordt opgelegd.


