  - number: 1.4a.1
    text: |-
      1 Onze Minister besluit op aanvraag van het bevoegd gezag van een in het tweede lid bedoelde instelling,
      dat aan de met goed gevolg afgelegde examens of onderdelen van examens van een opleiding educatie, verzorgd
      door die instelling, een diploma als bedoeld in [artikel 7.4.6][ref1] of, indien het betreft voortgezet
      algemeen volwassenenonderwijs of Nederlands als tweede taal I en II, een diploma of certificaat als
      bedoeld in [artikel 7.4.11, vijfde lid][ref2], is verbonden, indien die instelling in acht neemt hetgeen
      bij of krachtens deze wet voor die opleiding is bepaald ten aanzien van de kwaliteitszorg, bedoeld in
      [artikel 1.3.6][ref3], en ten aanzien van het onderwijs, bedoeld in [hoofdstuk 7][ref4], met uitzondering
      van de [artikelen 7.1.1][ref5] en [7.1.5][ref6], [titel 2][ref7], [titel 4][ref8], voor zover het betreft de
      [artikelen 7.4.4][ref9], [7.4.5, achtste lid][ref10] en [7.4.7][ref11], en [titel 5][ref12] voor zover het betreft
      de [artikelen 7.5.1][ref13], [7.5.7][ref14], [7.5.8][ref15], [7.5.9][ref16] en [7.5.10][ref17], en eveneens in acht
      neemt hetgeen is bepaald in [artikel 8.1.1d][ref18], en in [artikel 1.4a.2][ref19].

      2 Een aanvraag als bedoeld in het eerste lid wordt gedaan voor een andere dan een in [artikel 1.1.1][ref20]
      bedoelde instelling of voor een instelling. Het bevoegd gezag voegt bij deze aanvraag in elk geval het ontwerp van
      een beschrijving van de regeling voor het onderwijsprogramma en de examens, bedoeld in [artikel 7.4.8][ref21], voor
      de opleiding educatie waarop de aanvraag betrekking heeft.

      3 Een aanvraag als bedoeld in het eerste lid heeft geen betrekking op een opleiding educatie waarvoor de instelling
      een rijksbijdrage als bedoeld in [artikel 2.2a.1][ref22] ontvangt of op een opleiding educatie die daarmee
      overeenkomt.

      4 Een aanvraag als bedoeld in het eerste lid heeft uitsluitend betrekking op opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder a][ref23], alsmede op andere in dat lid bedoelde opleidingen, voor zover daarvoor
      bij ministeriële regeling eindtermen zijn vastgesteld.

      5 Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Een
      begunstigende beschikking is voor het eerst van kracht ten aanzien van een opleiding educatie die aanvangt nadat
      die beschikking is bekend gemaakt.

      6 Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister jaarlijks voor 15 oktober een opgave van de
      opleidingen educatie, bedoeld in het eerste lid, die de instelling verzorgt in het lopende studiejaar, alsmede van
      de opleidingen educatie die de instelling heeft verzorgd in het daaraan voorafgaande studiejaar.

      7 Voor zover ten aanzien van een instelling die een opleiding educatie verzorgt, toepassing is gegeven aan het
      eerste lid, wordt die instelling voor de toepassing van deze wet wat deze opleiding betreft, aangemerkt als een
      andere instelling dan bedoeld in [artikel 1.1.1][ref24].

      8 Voor een andere dan een in [artikel 1.1.1][ref25] bedoelde instelling of een instelling zijn voor zover het
      betreft een opleiding voortgezet algemeen volwassenenonderwijs ten aanzien waarvan toepassing is gegeven aan het
      eerste lid van overeenkomstige toepassing:

      a. [artikel 2.3.6a, eerste, vierde en zevende tot en met negende lid][ref26];

      b. [artikel 8.1.1a][ref27]; en

      c. de [artikelen 9.2.2][ref28], [9.2.3][ref29] en [9.2.6][ref30].

      9 [Artikel 1.3.9][ref31] is van overeenkomstige toepassing op instellingen als bedoeld in het eerste lid.


