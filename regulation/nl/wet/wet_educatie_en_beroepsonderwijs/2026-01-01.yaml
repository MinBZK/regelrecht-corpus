  - number: 8a.2.2a
    text: |-
      Indien een te nemen beslissing op grond van [artikel 8a.2.2][ref1] vooraf voor advies dient te worden voorgelegd
      aan de studentenraad, draagt het bevoegd gezag er zorg voor dat:

      a. advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de
      besluitvorming,

      b. de studentenraad in de gelegenheid wordt gesteld met het bevoegd gezag overleg te voeren voordat dit advies
      wordt uitgebracht,

      c. de studentenraad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het
      uitgebrachte advies gevolg wordt gegeven, en

      d. de studentenraad, indien het bevoegd gezag het advies niet of niet geheel wil volgen, in de gelegenheid wordt
      gesteld nader overleg met het bevoegd gezag te voeren alvorens de beslissing definitief wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.2.2a
