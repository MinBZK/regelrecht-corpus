preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de totstandkoming van een landelijke
    kwalificatiestructuur voor het beroepsonderwijs, de gewenste verbetering van de aansluiting tussen onderwijs
    en arbeidsmarkt, de gewenste verbetering van de afstemming tussen beroepsonderwijs en educatie, en voor een
    samenhangende besluitvorming op het gebied van de educatie, wenselijk is de toedeling van bevoegdheden aan de
    rijksoverheid, aan de gemeenten, aan de landelijke organen en aan de instellingen te herzien;

    dat het daarvoor wenselijk is de regelingen met betrekking tot de educatie en het beroepsonderwijs in de Wet op het
    cursorisch beroepsonderwijs en de Kaderwet Volwasseneneducatie 1991, alsmede de regelingen met betrekking tot het
    middelbaar beroepsonderwijs en het voortgezet algemeen volwassenenonderwijs in de Wet op het voortgezet onderwijs,
    in een samenhangend wettelijk kader neer te leggen met ingang van de expiratiedatum van deze regelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *beroepscollege:* beroepscollege als bedoeld in [artikel 1.3.2][ref1];
        - *beroepsonderwijs:* onderwijs als bedoeld in [artikel 1.2.1, tweede lid][ref2];
        - *beroepsopleiding:* opleiding als bedoeld in [artikel 7.1.2, tweede lid][ref3];
        - *beroepsopleiding in de beroepsbegeleidende leerweg:* beroepsopleiding als bedoeld in
      [artikel 7.2.7, vierde lid][ref4];
        - *beroepsopleiding in de beroepsopleidende leerweg:* beroepsopleiding als bedoeld in
      [artikel 7.2.7, derde lid][ref5];
        - *beroepspraktijkvorming:* onderricht in de praktijk van het beroep als bedoeld in
      [artikel 7.2.8, eerste lid][ref6];
        - *bestuursoverdracht:* overdracht van een instelling aan een ander bevoegd gezag;
        - *bevoegd gezag:* a. van een openbare instelling: 1°. college van burgemeester en wethouders van de gemeente
      die de instelling in stand houdt, behoudens voor zover de raad anders bepaalt en met inachtneming van door hem
      te stellen regels; 2°. bevoegd orgaan krachtens de betrokken gemeenschappelijke regeling waarbij het openbaar
      lichaam dat de instelling in stand houdt, is opgericht; b. van een bijzondere instelling: rechtspersoon die de
      instelling in stand houdt als bedoeld in [artikel 2.1.3, derde lid][ref7]; c. van een instelling met diploma-
      erkenning als bedoeld in de [artikelen 1.4.1][ref8] of [1.4a.1][ref9]: rechtspersoon of natuurlijke persoon die de
      instelling in stand houdt; d. van een exameninstelling als bedoeld in [artikel 1.6.1][ref10]: rechtspersoon die de
      exameninstelling in stand houdt;
        - *bijzondere instelling:* instelling die uitgaat van een rechtspersoon met volledige rechtsbevoegdheid niet zijnde
      een rechtspersoon als bedoeld in [artikel 1 van Boek 2 van het Burgerlijk Wetboek][ref11];
        - *burgerservicenummer:* burgerservicenummer als bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref12];
        - *centraal examen:* examen of examenonderdeel bestaande uit door het College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref13], vastgestelde toetsen die door of in
      opdracht van de instelling worden afgenomen;
        - *deelnemer:* degene die een opleiding educatie volgt, met uitzondering van een opleiding voortgezet algemeen
      volwassenenonderwijs;
        - *doorlopende leerroute vmbo-mbo:* route als bedoeld in [artikel 9.1.2, tweede lid][ref14];
        - *educatie:* onderwijs bestemd voor volwassenen als bedoeld in [artikel 1.2.1, eerste lid][ref15];
        - *eindtermen:* eindtermen als bedoeld in [artikel 7.3.3][ref16];
        - *exameninstelling:* instelling als bedoeld in [artikel 1.6.1][ref17];
        - *examinering:* het nemen van een beslissing over de inhoud en het niveau van een examen, procedures en
      voorwaarden waaronder een examen wordt afgenomen, alsmede het vaststellen van de uitslag van een examen;
        - *fusie:* institutionele fusie of bestuursoverdracht;
        - *ho-student:* degene die hoger onderwijs volgt, als bedoeld in
      [artikel 1.1, onderdeel b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref18];
        - *inspectie:* Inspectie van het onderwijs als bedoeld in de [Wet op het onderwijstoezicht][ref19];
        - *instelling:* regionaal opleidingencentrum of beroepscollege;
        - *instellingsexamen:* examen of examenonderdeel, bestaande uit toetsen die zijn vastgesteld en worden afgenomen
      door of in opdracht van de instelling;
        - *institutionele fusie:* samenvoeging van twee of meer instellingen tot een instelling;
        - *keuzedeel:* keuzedeel als bedoeld in [artikel 7.1.3, tweede lid][ref20];
        - *kwalificatie:* kwalificatie als bedoeld in [artikel 7.1.3, eerste lid][ref21];
        - *kwalificatiedossier:* document waarin een of meer kwalificaties zijn beschreven;
        - *leerweg:* leerweg als bedoeld in [artikel 7.2.2, tweede lid][ref22], tenzij anders bepaald;
        - *ondernemingsraad:* ondernemingsraad als bedoeld in de [Wet op de ondernemingsraden][ref23];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *openbare instelling:* instelling in stand gehouden door een gemeente dan wel door een openbaar lichaam,
      ingesteld bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref24],
      waarin deelnemen een of meer gemeenten, al dan niet tezamen met een of meer privaatrechtelijke rechtspersonen met
      volledige rechtsbevoegdheid;
        - *opleiding educatie:* opleiding als bedoeld in [artikel 7.3.1, eerste lid][ref25];
        - *opleiding voortgezet algemeen volwassenenonderwijs:* opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a][ref26];
        - *opleidingsdomein:* samenhangend geheel van kwalificatiedossiers die zijn gericht op en van belang zijn voor
      eenzelfde bedrijfstak of groep van bedrijfstakken;
        - *ouders:* met het gezag over de student of vavo-student belaste ouders, voogden of verzorgers;
        - *personeel:* a. benoemde docenten en overig personeel dat is benoemd aan de instelling; b. onder a bedoeld
      personeel dat zonder benoeming is tewerkgesteld aan de instelling, tenzij het betreft de toepassing van de
      [artikelen 4.1.1][ref27], [4.1.2][ref28] en [4.1.3][ref29], en de toepassing van daarmee verband houdende
      wettelijke bepalingen;
        - *persoonsgebonden nummer:* burgerservicenummer dan wel door Onze Minister uitgegeven onderwijsnummer als bedoeld
      in [artikel 8.1.1a, vierde lid][ref30];
        - *regionaal opleidingencentrum:* regionaal opleidingencentrum als bedoeld in [artikel 1.3.1][ref31];
        - *register onderwijsdeelnemers:* register onderwijsdeelnemers als bedoeld in
      [artikel 4 van de Wet register onderwijsdeelnemers][ref32];
        - *Registratie instellingen en opleidingen:* Registratie instellingen en opleidingen, bedoeld in
      [artikel 6.4.1, eerste lid][ref33];
        - *samenwerkingscollege:* samenwerkingsverband tussen instellingen dat ertoe strekt onder gezamenlijke
      verantwoordelijkheid een of meer beroepsopleidingen of opleidingen voortgezet algemeen volwassenenonderwijs te
      verzorgen, niet zijnde een fusie als bedoeld in [artikel 2.1.8][ref34];
        - *Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven:* rechtspersoon, aangewezen op grond van
      [artikel 1.5.1, eerste lid][ref35];
        - *scholengemeenschap:* scholengemeenschap als bedoeld in de [Wet voortgezet onderwijs 2020][ref36];
        - *school:* school als bedoeld in de [Wet voortgezet onderwijs 2020][ref37];
        - *school voor mavo:* school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 2.6 van de Wet voortgezet onderwijs 2020][ref38];
        - *school voor praktijkonderwijs:* school voor praktijkonderwijs als bedoeld in
      [artikel 2.8 van de Wet voortgezet onderwijs 2020][ref39];
        - *school voor vbo:* school voor voorbereidend beroepsonderwijs als bedoeld in
      [artikel 2.7 van de Wet voortgezet onderwijs 2020][ref40];
        - *startkwalificatie:* startkwalificatie als bedoeld in de [Leerplichtwet 1969][ref41];
        - *student:* degene die beroepsonderwijs volgt;
        - *studiejaar:* tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli van het daarop volgend jaar;
        - *vavo-student:* degene die een opleiding voortgezet algemeen volwassenenonderwijs volgt;
        - *verticale scholengemeenschap:* verticale scholengemeenschap als bedoeld in [artikel 2.6.1][ref42];
        - *volwassene:* in Nederland woonachtige van 18 jaren of ouder;
        - *waarborgfonds:* fonds als bedoeld in [artikel 2.2.9][ref43].


