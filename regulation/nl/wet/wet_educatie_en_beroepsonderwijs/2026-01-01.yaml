  - number: 4.1.1
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.1.1
  - number: 4.1.1a
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.1.1a
  - number: 4.1.2
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.

      2 Over de door het bevoegd gezag ingevolge het eerste lid te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers.

      3 In geval van een onherroepelijk vonnis tot faillietverklaring van een instelling, voorzien de
      bevoegde gezagsorganen van de overige instellingen er gezamenlijk in dat aan de aanspraken, bedoeld in
      [artikel 79, eerste lid, van de Werkloosheidswet][ref1], van het personeel en gewezen personeel, wordt voldaan,
      evenals aan de aanspraken die in het overleg, bedoeld in het tweede lid, zijn overeengekomen en als aanvulling
      gelden op de wettelijke aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.1.2
