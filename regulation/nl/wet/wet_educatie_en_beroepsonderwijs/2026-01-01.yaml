  - number: 2.2a.2
    text: |-
      1 De in [artikel 2.2a.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.

      2 De maatstaven voorzien in bekostiging aan de hand van:

      a. het aantal ingeschreven vavo-studenten,

      b. het aantal vavo-studenten dat bij de instelling een diploma van onderwijs als bedoeld in de
      [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref2] heeft behaald en

      c. het aantal vavo-studenten dat bij de instelling een eindexamen of deeleindexamen heeft afgelegd in onderwijs als
      bedoeld in de [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref3].

      3 Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, blijven vavo-studenten die niet bij een
      instelling staan ingeschreven op een bij algemene maatregel van bestuur vastgesteld tijdstip buiten beschouwing en
      kan onderscheid worden gemaakt naar het aantal vakken waarvoor een vavo-student is ingeschreven.

      4 Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder c, kan onderscheid worden gemaakt naar het
      aantal vakken waarin de vavo-student met goed gevolg examen heeft afgelegd.

      5 Vavo-studenten die niet zijn opgenomen in de basisregistratie personen tellen alleen mee voor de toepassing van
      dit artikel, indien:

      a. zij onderwijs in Nederland volgen, en

      b. zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.

      6 Extraneï tellen niet mee voor de toepassing van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2a.1
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
