  - number: 2.2.3
    text: |-
      1 Onze Minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], een bedrag toevoegen in
      verband met:

      a. bijzondere omstandigheden die betrekking hebben op een individuele instelling en die in redelijkheid niet door
      die instelling binnen de rijksbijdrage voor het betreffende bekostigingsjaar of binnen de normale bedrijfsvoering
      kunnen worden opgevangen; of

      b. de ontwikkelingen van het bestel van het beroepsonderwijs.

      2 Het bedrag bedoeld in het eerste lid, onderdeel a, kan op de rijksbijdrage van een later jaar geheel of
      gedeeltelijk in mindering worden gebracht. Indien dat het geval is wordt dit vermeld in de beschikking en wordt in
      die beschikking tevens de hoogte vermeld van het bedrag dat in mindering zal worden gebracht of de criteria voor de
      bepaling van dat bedrag.

      3 Bij ministeriële regeling kunnen voorschriften worden gegeven voor de verstrekking bedoeld in het eerste lid en
      de vermindering bedoeld in het tweede lid.

      4 Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.3
