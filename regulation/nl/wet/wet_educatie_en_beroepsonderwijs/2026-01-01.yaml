  - number: 8.1.1c
    text: |-
      1 Onverminderd de [artikelen 8.1.1][ref1], [8.1.2][ref2] en [8.1.7b][ref3], staat de toelating tot een
      basisberoepsopleiding, een vakopleiding, een middenkaderopleiding en een specialistenopleiding open voor degene die
      voldoet aan de in de bij of krachtens de [artikelen 8.2.1][ref4], [8.2.2][ref5] en [8.2.2a][ref6] ten aanzien van
      die opleidingen gestelde eisen.

      2 Het bevoegd gezag kan het aantal studenten voor een opleiding beperken wegens de opleidingscapaciteit of uit
      oogpunt van arbeidsmarktperspectief.

      3 Het bevoegd gezag kan de toelating van degene die om toelating verzoekt weigeren indien:

      a. [paragraaf 2a van de Leerplichtwet 1969][ref7] niet meer van toepassing is op hem, zijn inschrijving reeds
      driemaal is beëindigd op grond van [artikel 8.1.7a, tweede lid][ref8] en sinds de laatste dag van inschrijving
      minder dan drie studiejaren zijn verstreken;

      b. hij reeds zes jaar of langer in een beroepsopleiding ingeschreven is geweest zonder een diploma te hebben
      behaald en sinds de laatste dag van inschrijving minder dan drie studiejaren zijn verstreken; of

      c. [paragraaf 2a van de Leerplichtwet 1969][ref9] niet meer op hem van toepassing is, en:

      1°. hij zich niet uiterlijk op de datum, genoemd in [artikel 8.0.1, eerste lid][ref10], heeft aangemeld, voor zover
      het een opleiding betreft die start bij de aanvang van het op die datum volgende studiejaar, en voor zover het
      derde lid van dat artikel niet van toepassing is, of

      2°. ten behoeve van hem geen studiekeuzeadvies is uitgebracht als bedoeld in [artikel 8.0.4][ref11], voor zover
      het bevoegd gezag daartoe voor diegene verplichte intakeactiviteiten organiseert; of

      d. hij niet voor 1 juli heeft gereageerd op het verzoek van het bevoegd gezag om te kennen te geven of hij zijn
      aanmelding wenst te handhaven, voor zover het bevoegd gezag een reactie op dit verzoek als voorwaarde voor de
      toelating heeft gesteld.

      3a Het bevoegd gezag kan zich niet beroepen op de grond, bedoeld in het derde lid, onderdeel d, indien het bevoegd
      gezag degene die om toelating verzoekt na de aanmelding niet schriftelijk heeft geïnformeerd dat het geven van een
      reactie als bedoeld in het derde lid, onderdeel d, een voorwaarde voor de toelating is.

      4 Het bevoegd gezag van een regionaal opleidingencentrum biedt een betrokkene de mogelijkheid zich te laten
      inschrijven aan een opleiding aan de instelling waarvoor de inschrijving wel mogelijk is, rekening houdend met
      diens voorkeuren, indien:

      a. de betrokkene niet wordt ingeschreven op grond van het tweede lid;

      b. de betrokkene niet wordt ingeschreven omdat hij niet voldoet aan de voor die opleiding krachtens
      [artikel 8.2.2a][ref12] gestelde eisen; of

      c. [paragraaf 2a van de Leerplichtwet 1969][ref13] op hem van toepassing is, en de betrokkene niet wordt
      ingeschreven:

      1°. omdat hij zich niet uiterlijk op de datum, genoemd in [artikel 8.0.1, eerste lid][ref14], heeft aangemeld,
      voor zover het een opleiding betreft die start bij de aanvang van het op die datum volgende studiejaar, en voor
      zover het derde lid van dat artikel niet van toepassing is;

      2°. omdat ten behoeve van hem geen studiekeuzeadvies is uitgebracht als bedoeld in [artikel 8.0.4][ref15], voor
      zover het bevoegd gezag daartoe voor diegene verplichte intakeactiviteiten organiseert; of

      3°. op grond van het derde lid, onderdeel d.

      5 Bij een inschrijvingsbeperking als bedoeld in het tweede lid hanteert het bevoegd gezag geen toelatingscriteria
      waarbij aan betrokkenen die aan de vooropleidingseisen voor de desbetreffende opleiding voldoen, extra eisen
      worden gesteld aan hun geschiktheid. Onverminderd de vorige volzin, verleent het bevoegd gezag aan de inschrijving
      van betrokkenen die in overeenstemming met [artikel 8.0.1, eerste lid][ref16], uiterlijk op 1 april voor de
      desbetreffende opleiding zijn aangemeld, voorrang.

      6 Het bevoegd gezag stelt met in achtneming van de voorgaande leden de toelatingsprocedure vast en stelt deze
      informatie voor een ieder beschikbaar uiterlijk 1 februari voorafgaand aan het studiejaar waarvoor deze geldt.


