  - number: 2.1.3
    text: |-
      1 Instellingen worden bij wet voor bekostiging in aanmerking gebracht.
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van instellingen.

      2 De eerste volzin van het eerste lid is niet van toepassing ten aanzien van:

      a. instellingen die op grond van [artikel 12.3.1][ref2] zoals dat luidde door de Wet van 11 april 2001, Stb. 207,
      of [artikel 12.3.3][ref3] zoals dat luidde ingevolge de Wet educatie en beroepsonderwijs (Stb. 1995, 501) door Onze
      Minister voor bekostiging in aanmerking zijn gebracht, en

      b. instellingen die zijn voortgekomen uit:

      1°. een institutionele fusie of splitsing van bekostigde instellingen;

      2°. een omzetting van een bijzondere instelling in een openbare of omgekeerd.

      3 Een uit ’s Rijks kas bekostigde bijzondere instelling wordt in stand gehouden door een rechtspersoon
      met volledige rechtsbevoegdheid die zich het geven van beroepsonderwijs of opleidingen voortgezet
      algemeen volwassenonderwijs als bedoeld in [artikel 2.1.2][ref4] ten doel stelt, zonder daarbij
      het maken van winst te beogen, en die geen publiekrechtelijke rechtspersoon is als bedoeld in
      [artikel 1 van Boek 2 van het Burgerlijk Wetboek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12.3.1
