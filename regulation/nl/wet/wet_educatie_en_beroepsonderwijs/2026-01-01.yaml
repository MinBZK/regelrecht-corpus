  - number: 7.4.10
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.10
  - number: 7.4.11
    text: |-
      1 Aan de vavo-studenten en deelnemers wordt gelegenheid gegeven een examen af te leggen.

      2 [Artikel 7.4.5, eerste tot en met vijfde en negende lid][ref1], is van overeenkomstige toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens
      van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als tweede taal I en II, bedoeld
      in [artikel 7.3.1, eerste lid, onder a en c][ref2]. Bij deze algemene maatregel van bestuur kunnen tevens
      voorschriften worden gegeven omtrent de examenprogramma’s en de verdeling daarvan in onderdelen.

      4 Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat
      wordt afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden
      na ontvangst van een aanvraag.

      5 [Artikel 7.4.6, eerste en derde lid][ref3], is van toepassing, met dien verstande dat degene die een onderdeel
      van een examen van de opleiding voortgezet algemeen volwassenenonderwijs of Nederlands als tweede taal I of II met
      goed gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene maatregel van bestuur wordt bepaald
      onder welke voorwaarden het bezit van certificaten aanspraak geeft op een diploma.

      6 De [artikelen 7.4.8, eerste en tweede lid, lid 2a en vierde en vijfde lid][ref4], en [7.5.2][ref5], zijn van
      overeenkomstige toepassing.

      7 [Hoofdstuk 2, paragraaf 5, van de Wet voortgezet onderwijs 2020][ref6] is van toepassing op de examens van
      opleidingen voortgezet algemeen volwassenenonderwijs:

      a. met uitzondering van de [artikelen 2.51, eerste tot en met vijfde lid][ref7], 2.51a, [2.59][ref8],
      [2.60, eerste lid, onder d, tweede tot en met vierde lid][ref9], 2.60b, eerste tot en met derde lid, 2.60c, tweede
      en derde lid, 2.60d, [2.62 tot en met 2.64][ref10];

      b. met dien verstande dat:

      1°. «de rector of directeur» en «het bevoegd gezag» worden gelezen als «de examencommissie», behalve in de
      [artikelen 2.52][ref11], [2.53][ref12], [2.54][ref13] en [2.55, eerste lid][ref14];

      2°. de examencommissie de uitslag van het eindexamen vaststelt;

      3°. de examencommissie de cijferlijsten, diploma’s, getuigschriften en certificaten tekent;

      4°. de examencommissie een examenreglement vaststelt alsmede jaarlijks een programma van toetsing en afsluiting
      vaststelt;

      5°. de examencommissie de vaststelling van een wijziging van het programma van toetsing en afsluiting na 1 oktober
      aan de kandidaten en de inspectie zendt.


