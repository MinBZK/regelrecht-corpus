        bwb_id: BWBR0007625
        artikel: 8a.2.2
        hoofdstuk: 8a
  - number: 8a.2.3
    text: |-
      De studentenraad neemt voorafgaand aan de uitoefening van de adviesbevoegdheid, bedoeld in
      [artikel 8a.2.2, vierde lid, onder a][ref1], voor zover het betreft fusie en overdracht van de instelling, kennis
      van de opgestelde fusie-effectrapportage, bedoeld in artikel 2.1.10, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.2.3
    references:
