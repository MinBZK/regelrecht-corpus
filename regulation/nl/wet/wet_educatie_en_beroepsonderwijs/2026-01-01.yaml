      1 Het bevoegd gezag van een exameninstelling zorgt voor een goede organisatie en kwaliteit van de examinering.

      2 Het bevoegd gezag van een exameninstelling zorgt ervoor dat de studenten die in dat jaar examen willen afleggen
      volledig en tijdig geïnformeerd worden over de inhoud en inrichting van de examens.
