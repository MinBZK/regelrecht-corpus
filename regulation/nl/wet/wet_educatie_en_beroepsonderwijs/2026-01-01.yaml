        hoofdstuk: '8'
  - number: 8.1.1d
    text: |-
      1 De toelating tot opleidingen voortgezet algemeen volwassenenonderwijs staat uitsluitend open voor volwassenen.

      2 In afwijking van het eerste lid staat de toelating tot opleidingen voortgezet algemeen volwassenenonderwijs
      tevens open voor degenen die niet meer zijn ingeschreven bij een school voor voortgezet onderwijs, in de loop
      van het studiejaar de leeftijd van 18 jaren bereiken en op grond van [artikel 9.2.5][ref1] of op grond van
      [artikel 22, eerste lid, van de Leerplichtwet 1969][ref2] naar de desbetreffende opleiding zijn doorverwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel22
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.1d
