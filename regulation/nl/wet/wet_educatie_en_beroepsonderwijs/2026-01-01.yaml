  - number: 8a.1.1a
    text: |-
      Onze Minister pleegt geregeld overleg met de daarvoor in aanmerking komende belangenorganisaties van studenten over
      aangelegenheden van algemeen belang voor studenten.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.1.1a
  - number: 8a.1.2
    text: |-
      1 Aan elke instelling en aan elke school die deel uitmaakt van een verticale scholengemeenschap is een
      studentenraad verbonden. De studentenraad behartigt de belangen van de studenten en vavo-studenten in de instelling
      en van de leerlingen in de school. Indien sprake is van een verticale scholengemeenschap is de studentenraad
      verbonden aan de verticale scholengemeenschap en behartigt de studentenraad ook de belangen van de leerlingen van
      de school of scholengemeenschap die deel uitmaakt van de verticale scholengemeenschap.

      2 De studentenraad bestaat uit een oneven aantal leden die uit en door de studenten en vavo-studenten worden
      gekozen.

      3 De verkiezing van de leden van de studentenraad geschiedt bij geheime schriftelijke stemming.

      4 Alle studenten en vavo-studenten die bij de instelling zijn ingeschreven, zijn kiesgerechtigd voor de
      studentenraad en kunnen zich daarvoor verkiesbaar stellen.

      5 Het bevoegd gezag draagt er zorg voor dat de leden, voormalige leden en kandidaat-leden van de studentenraad niet
      uit hoofde van hun lidmaatschap of vroegere lidmaatschap daarvan, dan wel hun kandidatuur voor dat lidmaatschap,
      worden benadeeld in hun positie met betrekking tot de instelling.

      6 De studentenraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De
      voorzitter, of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de studentenraad in
      rechte.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.1.2
  - number: 8a.1.3
    text: |-
      1 Indien ten minste 25 ouders van vavo-studenten of studenten van een instelling daarom verzoeken, stelt het
      bevoegd gezag een ouderraad in.

      2 Aan elke verticale scholengemeenschap is een ouderraad verbonden.

      3 De ouderraad behartigt in het bijzonder de belangen van de minderjarigen die onderwijs volgen.

      4 Indien een instelling zich met een school of scholengemeenschap verenigt tot een verticale scholengemeenschap,
      maakt de oudergeleding van de medezeggenschapsraad van die school van rechtswege deel uit van de ouderraad tot de
      eerstvolgende verkiezingen.

      5 Het bevoegd gezag legt de bevoegdheden van een ouderraad vast in het medezeggenschapsstatuut. Indien een
      situatie als bedoeld in het vierde lid zich voordoet, wordt het medezeggenschapsstatuut binnen vier maanden opnieuw
      vastgesteld.

      6 Op de ouderraad zijn de [artikelen 8a.1.1][ref1],
      [8a.1.2, met uitzondering van het eerste lid][ref2],[ 8a.2.1][ref3],
      [8a.2.2, derde lid, aanhef en onderdeel a][ref4], en [titel 4 van hoofdstuk 8a][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.1.2
