  - number: 7.4.6
    text: |-
      1 Ten bewijze dat een opleiding met goed gevolg is afgesloten, reikt de examencommissie een diploma uit.

      2 Een beroepsopleiding is eerst dan met goed gevolg afgesloten wanneer met goed gevolg examen is afgelegd in de
      kwalificatie en het keuzedeel of de keuzedelen en de beroepspraktijkvorming voor zover betrekking hebbend op de
      kwalificatie met een positieve beoordeling is voltooid.

      3 Bij ministeriële regeling worden modellen en technische veiligheidseisen voor het diploma en de resultatenlijst
      van een beroepsopleiding vastgesteld.

      4 Bij ministeriele regeling kunnen modellen en technische veiligheidseisen voor het diploma en de resultatenlijst
      van een opleiding educatie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.6
  - number: 7.4.6a
    text: |-
      1 Een student die ten minste één waardering voor een onderdeel of voor een deel daarvan van de opleiding heeft
      behaald waarvoor geen diploma als bedoeld in [artikel 7.4.6, eerste lid][ref1], of certificaat als bedoeld in
      [artikel 7.2.3, eerste lid][ref2], kan worden uitgereikt, ontvangt op zijn verzoek, een door de examencommissie af
      te geven verklaring.

      2 In afwijking van het eerste lid ontvangt de student, ook zonder een daartoe strekkend verzoek, een verklaring van
      de desbetreffende examencommissie, indien de student:

      a. niet meer aan een instelling is ingeschreven,

      b. de leeftijd van 27 jaar nog niet heeft bereikt, en

      c. niet in het bezit is van een startkwalificatie.

      3 Op de verklaring zijn in ieder geval opgenomen de onderdelen of de delen daarvan waarvoor op de datum van
      beëindiging van de opleiding door de student een waardering is behaald en de overige bij ministeriële regeling te
      bepalen gegevens die per categorie van studenten kunnen verschillen.

      4 Bij ministeriële regeling wordt voor de verklaring een model vastgesteld, dat voor verschillende categorieën van
      studenten kan verschillen en kunnen voor de verklaring technische veiligheidseisen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.6a
