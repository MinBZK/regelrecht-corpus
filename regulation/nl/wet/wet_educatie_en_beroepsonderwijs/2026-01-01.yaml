        hoofdstuk: '6'
  - number: 6.1.4b
    text: |-
      1 De kwaliteit van een beroepsopleiding is zeer zwak indien het studiesucces van die opleiding onvoldoende is, en
      het bevoegd gezag onvoldoende uitvoering geeft aan:

      a. de zorgplicht inzake het onderwijsprogramma en de examinering, bedoeld in [artikel 7.4.8][ref1],

      b. de beroepspraktijkvorming, bedoeld in de [artikelen 7.2.8][ref2] en [7.2.9][ref3], of

      c. de regels op het gebied van veiligheid, bedoeld in [artikel 8a.2.2, derde lid, onderdeel k][ref4].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop het
      studiesucces, bedoeld in het eerste lid, wordt gemeten en beoordeeld.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.9
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.4b
