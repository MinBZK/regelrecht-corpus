      1 Het Christelijk Instituut voor Doven "Effatha" en het Instituut voor Doven "Sint-Michielsgestel" behouden in
      afwijking van [artikel 12.3.2][ref1] ten behoeve van het verzorgen van beroepsopleidingen die de voortzetting zijn
      van beroepsbegeleidend onderwijs dat deze instituten op 31 december 1995 verzorgden, aanspraak op bekostiging uit
      ’s Rijks kas.

      2 Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde instituten.


