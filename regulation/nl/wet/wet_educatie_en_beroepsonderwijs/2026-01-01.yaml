  - number: 8.1.5g
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over vergoeding door het bevoegd gezag van
      kosten die studenten hebben gemaakt voor de aanschaf van onderwijsbenodigdheden die door het bevoegd gezag zijn
      voorgeschreven, maar waarvan gezien het onderwijsprogramma door de studenten geen gebruik is gemaakt. De voordracht
      voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers
      der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8.1.5g
  - number: 8.1.6
    text: |-
      1 Onze Minister treft voorzieningen voor de financiële ondersteuning van een student of vavo-student die bestuurslid
      is van een van een rechtspersoon met volledige rechtsbevoegdheid uitgaande politieke jongerenorganisatie van enige
      omvang of van een landelijke organisatie van enige omvang die voor het beroepsonderwijs of het hoger onderwijs,
      bedoeld in [artikel 1.1 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], relevante
      activiteiten ontplooit en die daartoe daadwerkelijke activiteiten ontplooit.

      2 Bij ministeriële regeling worden de voorwaarden gesteld waaronder deze financiële ondersteuning plaatsvindt.

      3 De [artikelen 8.1.5d][ref2] en [8.1.5f][ref3] zijn van overeenkomstige toepassing.


