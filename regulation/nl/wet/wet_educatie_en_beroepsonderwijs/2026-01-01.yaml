  - number: 7.5.3
    text: |-
      1 Het bevoegd gezag van een instelling of exameninstelling stelt al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de examens in,
      dan wel sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de examinatoren
      kunnen worden onderworpen aan het oordeel van een commissie van beroep voor de examens.

      2 De commissie van beroep voor de examens bestaat uit een even aantal gewone leden en evenveel plaatsvervangende
      leden, een voorzitter, tevens lid, en een plaatsvervangend voorzitter.

      3 De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden worden door
      het bevoegd gezag benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw
      benoembaar. De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag, van de inspectie
      of van een in [artikel 7.4.5][ref1] bedoelde examencommissie of examinator tegen de beslissing waarvan
      onderscheidenlijk van wie beroep kan worden ingesteld bij de commissie van beroep, noch zijn zij belast met de in
      [artikel 7.2.8, tweede lid, onder c][ref2], bedoelde beoordeling.

      4 Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van
      de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun
      functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn
      veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene
      van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te doen horen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.5
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.8
