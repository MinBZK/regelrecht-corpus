  - number: 8a.1.1
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      a. studentenraad: de studentenraad, bedoeld in [artikel 8a.1.2, eerste lid][ref1];

      b. reglement: het reglement voor de raad, bedoeld in [artikel 8a.3.1, eerste lid][ref2];

      c. commissie: de landelijke geschillencommissie medezeggenschap, bedoeld in [artikel 8a.4.1, eerste lid][ref3].

      2 Voor de toepassing van hoofdstuk 8a wordt onder student mede begrepen een leerling van een school die deel
      uitmaakt van een verticale scholengemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.3.1
