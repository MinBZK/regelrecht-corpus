  - number: 1.5.2
    text: |-
      1 Als rechtspersoon in de zin van [artikel 1.5.1, eerste lid][ref1], wordt aangewezen een rechtspersoon met
      volledige rechtsbevoegdheid zonder winstoogmerk, niet zijnde een publiekrechtelijke rechtspersoon als bedoeld in
      [artikel 1 van Boek 2 van het Burgerlijk Wetboek][ref2].

      2 In de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven participeren vertegenwoordigers van het
      beroepsonderwijs en het bedrijfsleven.

      3 Onze Minister benoemt de voorzitter van het bestuur van de Samenwerkingsorganisatie beroepsonderwijs
      bedrijfsleven en diens plaatsvervanger op voordracht van vertegenwoordigers van het beroepsonderwijs en van het
      bedrijfsleven voor een periode van ten hoogste vier jaren. Zij kunnen eenmaal worden herbenoemd voor eenzelfde
      periode. [Artikel 12 van de Kaderwet zelfstandige bestuursorganen][ref3] is van overeenkomstige toepassing.

      4 De statuten van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven regelen in ieder geval de
      betrokkenheid van het beroepsonderwijs en het bedrijfsleven bij de uitvoering van haar wettelijke taken. Aanvullend
      kan een bestuursreglement worden vastgesteld.

      5 De statuten en het bestuursreglement alsmede wijzigingen daarvan behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.5.1
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel12
