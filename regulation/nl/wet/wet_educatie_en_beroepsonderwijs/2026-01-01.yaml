  - number: 6a.2.1
    text: |-
      1 Onze Minister kan aan een instelling het recht op examinering van een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a,][ref1] ontnemen, indien

      a. de kwaliteit van de examens van die opleiding langer dan één jaar onvoldoende is geweest, of

      b. niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de examens.

      2 Bij de ontneming van het recht, bedoeld in het eerste lid, wordt bepaald met ingang van welk tijdstip dit
      geschiedt. Het besluit tot ontneming van het recht op examinering wordt openbaar gemaakt.

      3 Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een
      waarschuwing op grond van zijn bevindingen over de kwaliteit van de examinering, onder bepaling van de termijn
      waarbinnen aan die waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref2], is van overeenkomstige
      toepassing.

      4 Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na het besluit tot ontneming, bedoeld
      in het eerste lid, het recht op examinering opnieuw verkrijgen. [Artikel 1.4a.1][ref3] is van overeenkomstige
      toepassing.

      5 Dit artikel is van overeenkomstige toepassing op instellingen als bedoeld in [artikel 1.4a.1][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
