  - number: 7.3.3
    text: |-
      1 Bij ministeriële regeling worden eindtermen vastgesteld voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder c][ref1], en kunnen eindtermen worden vastgesteld voor de opleidingen, bedoeld in
      artikel 7.3.1, eerste lid, onder b, d, e en f.

      2 Het bevoegd gezag stelt eindtermen vast voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b, d, e en f][ref2], indien daarvoor geen eindtermen zijn vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
