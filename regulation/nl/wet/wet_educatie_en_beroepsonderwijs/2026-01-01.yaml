      stond ingeschreven voor een beroepsopleiding wordt door het bevoegd gezag in de gelegenheid gesteld
      deze opleiding te voltooien uiterlijk in het studiejaar volgend op het studiejaar waarin de voor hem
      geldende studieduur is verstreken. Hierop zijn de [artikelen 7.2.2, eerste tot en met derde lid][ref1],
      [7.2.4, achtste en negende lid][ref2], [7.2.7][ref3] en [12.4a.2][ref4] van toepassing zoals die artikelen luidden
      vóór dat tijdstip.


