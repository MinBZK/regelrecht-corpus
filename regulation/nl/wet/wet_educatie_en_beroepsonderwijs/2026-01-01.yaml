        hoofdstuk: '4'
        paragraaf: '1'
  - number: 6.1.1
    text: |-
      1 Het bevoegd gezag bepaalt welke beroepsopleidingen de instelling verzorgt. Ten aanzien van die opleidingen geldt
      de aanspraak op bekostiging uitsluitend indien de opleidingen krachtens [artikel 2.1.1][ref1] voor bekostiging in
      aanmerking komen.

      2 Onze Minister kan bepalen dat de aanspraak op bekostiging en het recht op diplomering, bedoeld in
      [artikel 1.3.1, derde lid, onderdeel a][ref2], onderscheidenlijk vierde lid, ten aanzien van een beroepsopleiding
      die dreigt te verdwijnen, voor een periode van 5 jaren slechts toekomen aan één instelling als bedoeld in
      [artikel 1.1.1][ref3] indien hij van oordeel is dat het een unieke, kleinschalige beroepsopleiding betreft die van
      belang blijft voor de arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.1
    references:
