  - number: 6.4.4
    text: |-
      1 Onverminderd [artikel 6.2.2][ref1] beëindigt Onze Minister de registratie bij een kwalificatie van een niet uit
      ’s Rijks kas bekostigde instelling, indien het bevoegd gezag te kennen geeft dat de instelling de desbetreffende
      beroepsopleiding niet langer zal verzorgen. Onverminderd [artikel 6.3.2][ref2] beëindigt Onze Minister de
      registratie bij een kwalificatie van de examinering door een exameninstelling, indien het bevoegd gezag te kennen
      geeft dat de exameninstelling de examinering van de desbetreffende beroepsopleiding niet langer zal verzorgen.

      2 De kennisgeving, bedoeld in het eerste lid, geschiedt voor 1 oktober van het jaar voorafgaand aan het eerste
      studiejaar waarin de inschrijving voor de opleiding niet meer openstaat.

      3 Onze Minister kan de registratie ambtshalve beëindigen wanneer er gedurende ten minste één jaar geen studenten
      meer zijn ingeschreven aan de opleiding en de inspectie uit een oogpunt van kwaliteitsbewaking hiertoe aanleiding
      ziet.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op de registratie van de examinering door
      exameninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.3.2
