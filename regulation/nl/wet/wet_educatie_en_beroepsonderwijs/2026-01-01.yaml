  - number: 2.3.1
    text: |-
      1 Het college van burgemeester en wethouders draagt zorg voor een aanbod van opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder b tot en met f][ref1], met voldoende aandacht voor alle doelgroepen.

      2 Voor de vervulling van hun in het eerste lid bedoelde taak werken de colleges van burgemeester en wethouders
      samen binnen bij ministeriële regeling vastgestelde regio’s. Bij ministeriële regeling wordt voor elke regio een
      contactgemeente aangewezen.

      3 Het college van burgemeester en wethouders van een contactgemeente vervult coördinerende taken met het oog op het
      aanbod van opleidingen educatie als bedoeld in het eerste lid. In dat verband

      a. draagt het college in overleg met de colleges van burgemeester en wethouders in de overige gemeenten in de regio
      zorg voor de totstandkoming van een regionaal programma van educatievoorzieningen,

      b. maakt het college afspraken met aanbieders van opleidingen educatie, overeenkomstig het regionaal programma,
      bedoeld onder a, en

      c. coördineert het college de overige werkzaamheden die verband houden met de uitvoering van het regionaal
      programma.

      4 Het overleg, bedoeld in het derde lid, onder a, heeft in elk geval betrekking op de behoefte aan
      educatievoorzieningen in de gemeenten in de regio en de wijze waarop in deze behoefte zal worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.3.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.3.1
        hoofdstuk: '7'
  - number: 2.3.2
    text: |-
      1 Onze Minister verstrekt ten behoeve van de taak van de colleges van burgemeester en wethouders in de
      betreffende regio aan de contactgemeenten een uitkering. De uitkering wordt, binnen het raam van de door de
      begrotingswetgever beschikbaar gestelde middelen, berekend aan de hand van voor elke gemeente gelijkelijk
      geldende maatstaven. Deze uitkering is bestemd voor een aanbod van opleidingen educatie aan een persoon
      als bedoeld in [artikel 2.3.3, eerste lid][ref1], niet zijnde een inburgeringsplichtige als bedoeld in
      [artikel 3 van de Wet inburgering 2021][ref2].

      2 De contactgemeente draagt er zorg voor dat de doelgroepen in alle gemeenten in de betreffende regio
      overeenkomstig het regionaal programma, bedoeld in het [artikel 2.3.1, derde lid, onder a][ref3], gebruik kunnen
      maken van de educatievoorzieningen die met behulp van de uitkering, bedoeld in het eerste lid, tot stand zijn
      gekomen.

      3 De uitkering wordt vastgesteld in september voorafgaande aan het kalenderjaar waarop zij betrekking heeft.

      4 Bij algemene maatregel van bestuur worden regels gesteld over de berekeningswijze en de betaalbaarstelling van
      de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0044770#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.1
