      1 Een schriftelijke beslissing van een orgaan van een instelling inhoudende een rechtshandeling die jegens een
      betrokkene is genomen op grond van deze wet en daarop gebaseerde regelingen, wordt voor de toepassing van de
      bepalingen van de [Algemene wet bestuursrecht][ref1] met betrekking tot besluiten aangemerkt als een besluit als
      bedoeld in [artikel 1:3 van die wet][ref2]. Het beroep kan worden ingesteld door de betrokkene.

      2 Tegen een beslissing van een college van beroep bijzonder onderwijs als bedoeld in [artikel 7.5.10][ref3] kan
      geen beroep worden ingesteld.

      3 De organen van de instelling verstrekken aan de Afdeling bestuursrechtspraak van de Raad van State de gegevens
      die zij voor de uitvoering van haar taak nodig oordeelt.


