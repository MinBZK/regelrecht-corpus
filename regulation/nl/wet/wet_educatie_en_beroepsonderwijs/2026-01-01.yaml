  - number: 1.3.2
    text: |-
      1 Aan een beroepscollege worden opleidingen beroepsonderwijs verzorgd. Voor andere dan entreeopleidingen zijn
      deze naar hun aard en onderlinge samenhang gericht op en van belang voor een specifieke bedrijfstak of groep van
      bedrijfstakken.

      2 [Artikel 1.3.1, derde lid, aanhef en onder a, en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.1
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.5
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:

      a. de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,

      b. het aanbieden van doelmatige leerwegen, in het bijzonder door het zorgdragen voor een zorgvuldige afstemming
      tussen opleidingen voortgezet algemeen volwassenenonderwijs en beroepsopleidingen,

      c. het bieden van mogelijkheden voor loopbaanoriëntatie, en

      d. het bieden van mogelijkheden voor loopbaanbegeleiding tijdens de opleiding en na diplomering.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.3.5
  - number: 1.3.6
    text: |-
      1 Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling in en draagt er in dat verband zorg
      voor dat, zo veel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling
      van de kwaliteit van het onderwijs, waaronder maatregelen en instrumenten om te waarborgen dat het personeel zijn
      bekwaamheid onderhoudt. De beoordeling bij de instellingen geschiedt mede aan de hand van het oordeel van studenten
      en vavo-studenten over de kwaliteit van het onderwijs aan de instelling. Het bevoegd gezag draagt er zorg voor
      dat de in de eerste volzin bedoelde beoordeling geschiedt met betrokkenheid van onafhankelijke deskundigen en
      belanghebbenden. De uitkomsten van de beoordeling zijn openbaar.

      2 Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:

      a. de beoordeling, bedoeld in het eerste lid,

      b. de uitkomsten van die beoordeling, en

      c. het voorgenomen beleid in het licht van die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.3.6
  - number: 1.3.6a
    text: |-
      Het bevoegd gezag draagt zorg voor het personeelsbeleid, voor zover het betreft de duurzame borging van de
      kwaliteit van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.3.6a
  - number: 1.3.7
    text: |-
      1 Het openbaar onderwijs draagt bij aan de ontwikkeling van de studenten en vavo-studenten met aandacht voor de
      godsdienstige, levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en
      met onderkenning van de betekenis van de verscheidenheid van die waarden.

      2 Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.3.7
  - number: 1.3.8
    text: |-
      1 Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een seksueel misdrijf als bedoeld
      in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige student of vavo-student van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].

      2 Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als
      bedoeld in het eerste lid jegens een minderjarige student of vavo-student van de instelling, doet het
      bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref3] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref4], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken student of vavo-student, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste
      persoon, hiervan op de hoogte.

      3 Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      student of vavo-student van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
