  - number: 9.1.11
    text: |-
      1 In afwijking van [artikel 2.38, derde en vierde lid, van de Wet voortgezet onderwijs 2020][ref1] en
      [artikel 7.2.7, vierde lid, eerste volzin][ref2], en onverminderd [artikel 8.1.1, derde lid][ref3], omvat
      het gehele onderwijsprogramma van een doorlopende leerroute vmbo-mbo waarvan een beroepsopleiding in de
      beroepsbegeleidende leerweg deel uitmaakt:

      a. bij een studieduur van twee volledige studiejaren ten minste 1.850 klokuren, waarvan ten minste 900 begeleide
      onderwijsuren en ten minste 610 klokuren aan beroepspraktijkvorming;

      b. bij een studieduur van drie volledige studiejaren ten minste 2.850 klokuren, waarvan ten minste 2.200 begeleide
      onderwijsuren en ten minste 610 klokuren aan beroepspraktijkvorming;

      c. bij een studieduur van vier volledige studiejaren 3.700 klokuren, waarvan ten minste 2.400 begeleide
      onderwijsuren en ten minste 1.220 klokuren aan beroepspraktijkvorming;

      d. bij een studieduur van vijf volledige studiejaren ten minste 4.550 klokuren, waarvan ten minste 2.600 begeleide
      onderwijsuren en ten minste 1.830 klokuren aan beroepspraktijkvorming;

      e. bij een studieduur van zes volledige studiejaren ten minste 5.400 klokuren, waarvan ten minste 2.800 begeleide
      onderwijsuren en ten minste 2.300 klokuren aan beroepspraktijkvorming.

      2 Het bevoegd gezag van de instelling en het bevoegd gezag van de school kunnen gezamenlijk een onderwijsprogramma
      verzorgen dat minder uren omvat dan de in het eerste lid, onderdelen a tot en met e, genoemde aantallen mits de
      opleiding aantoonbaar van voldoende kwaliteit is. In het geval het onderwijsprogramma minder uren omvat, legt het
      bevoegd gezag hierover verantwoording af in het bestuursverslag, bedoeld in [artikel 2.5.4][ref4] dan wel, bij
      toepassing van [artikel 1.4.1, eerste lid][ref5], in het verslag, bedoeld in artikel 1.4.1, zevende lid.

      3 Ten aanzien van het derde studiejaar van een doorlopende leerroute vmbo-mbo wordt onder begeleide onderwijsuren
      mede verstaan: onderwijstijd als bedoeld in [artikel 2.38 van de Wet voortgezet onderwijs 2020][ref6].


