    text: |-
      1 De aanvraag om toepassing van [artikel 1.4.1][ref1] geldt mede als aanmelding voor registratie
      in de Registratie instellingen en opleidingen. In aanvulling op de gegevens, bedoeld in
      [artikel 6.4.1, tweede lid, en derde lid, onderdelen a en b][ref2], verschaft het bevoegd gezag van een niet uit
      ’s Rijks kas bekostigde instelling bij de aanmelding de gegevens waaruit blijkt dat het onderwijs van voldoende
      kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde, bedoeld in [artikel 1.4.1, eerste lid][ref3].

      2 Indien Onze Minister de aanvraag om toepassing van [artikel 1.4.1][ref4] inwilligt, registreert hij bij de
      eerstvolgende gelegenheid daartoe, de naam van de instelling bij de kwalificatie waarop de opleiding is gericht in
      de Registratie instellingen en opleidingen.


