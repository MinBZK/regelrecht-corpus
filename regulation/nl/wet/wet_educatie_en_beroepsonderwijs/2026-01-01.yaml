  - number: 12.2.4
    text: |-
      1 De agrarische opleidingscentra als bedoeld in [artikel 1.3.3][ref1] van de Wet educatie en beroepsonderwijs
      zoals dat luidde op de dag voor inwerkingtreding van de [Wet bestuurlijke harmonisatie beroepsonderwijs][ref2] zijn
      van rechtswege omgezet in verticale scholengemeenschappen als bedoeld in [artikel 2.6.1][ref3].

      2 De verticale scholengemeenschap als bedoeld in het eerste lid omvat een beroepscollege en een school voor vbo.

      3 Scholengemeenschappen in de zin van artikel 2.6 van de Wet educatie en beroepsonderwijs zoals die bepaling luidde
      op de dag voor inwerkingtreding van de [Wet bestuurlijke harmonisatie beroepsonderwijs][ref4] die een agrarisch
      opleidingscentrum en een school voor mavo of een school voor praktijkonderwijs omvatten als bedoeld in artikel 2.6,
      eerste lid, onderdeel b, van de Wet educatie en beroepsonderwijs zoals dat luidde op de dag voor inwerkingtreding
      van de hiervoor genoemde wet, zijn van rechtswege omgezet in verticale scholengemeenschappen, bestaande uit in
      ieder geval een beroepscollege en een school voor vbo, alsmede, afhankelijk van het geval, een school voor mavo of
      een school voor praktijkonderwijs.

      4 Indien bij de omzetting van het agrarisch opleidingscentrum als bedoeld in het derde lid ten minste een school
      voor vbo en een school voor mavo resteren, worden beide scholen aangemerkt als een scholengemeenschap.

      5 De vorming van een verticale scholengemeenschap ingevolge dit artikel brengt geen wijzigingen aan in het aanbod
      van profielen of ander voortgezet onderwijs of in het aanbod aan kwalificaties en niveaus van beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.3
      [ref2]: https://wetten.overheid.nl/BWBR0045852
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.6.1
      [ref4]: https://wetten.overheid.nl/BWBR0045852
