  - number: 6a.1.1
    text: |-
      1 Onze Minister houdt een elektronisch register bij omtrent opleidingen educatie waarvoor diploma-erkenning is
      aangevraagd als bedoeld in [artikel 1.4a.1][ref1].

      2 Het register is openbaar en maakt onderscheid tussen opleidingen voortgezet algemeen volwassenenonderwijs en
      andere opleidingen educatie.

      3 Het register vermeldt ten minste:

      a. de naam van de opleiding educatie en het tijdstip met ingang waarvan het diploma is erkend, en de naam en
      vestigingsplaats van de instelling als bedoeld in [artikel 1.4a.1, eerste lid][ref2];

      b. een eventuele waarschuwing of ontneming van de diploma-erkenning als bedoeld in de [artikelen 6a.1.3][ref3] of
      [6a.2.1, derde lid][ref4], respectievelijk [6a.1.2][ref5], [6a.1.4][ref6] of 6a.2.1, eerste lid voor een opleiding
      educatie.

      4 Bij ministeriele regeling kunnen nadere regels worden gesteld over het register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4a.1
