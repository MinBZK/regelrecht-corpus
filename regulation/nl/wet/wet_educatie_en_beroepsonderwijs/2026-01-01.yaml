  - number: 7.3.1
    text: |-
      1 De volgende opleidingen educatie worden onderscheiden:

      a. opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma van onderwijs als
      bedoeld in de [artikelen 2.4 tot en met 2.6 van de Wet voortgezet onderwijs 2020][ref1],

      b. opleidingen Nederlandse taal en rekenen, gericht op alfabetisering en op het ingangsniveau van het
      beroepsonderwijs,

      c. de opleidingen Nederlands als tweede taal I en II die opleiden voor het diploma Nederlands als tweede taal,
      bedoeld in het Staatsexamenbesluit Nederlands als tweede taal,

      d. de opleidingen Nederlands als tweede taal, gericht op beheersing van een basisniveau Nederlandse taal,

      e. de opleidingen Nederlands als tweede taal, gericht op alfabetisering, en

      f. bij ministeriële regeling aan te wijzen andere opleidingen.

      2 De opleidingen, bedoeld in het eerste lid, onder b, zijn afgestemd op het maatschappelijk functioneren van de
      deelnemers.

      3 Bij de opleidingen, bedoeld in het eerste lid, onder b, c en d, kunnen verschillende niveaus worden
      onderscheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '2.4'
  - number: 7.3.2
    text: |-
      1 De opleiding Nederlands als tweede taal I is gericht op de beheersing van de Nederlandse taal met het oog
      op het volgen van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c][ref1], door hen voor wie het Nederlands niet de moedertaal is en die ten
      minste het niveau van het primair onderwijs hebben bereikt.

      2 De opleiding Nederlands als tweede taal II is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het
      Nederlands niet de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het
      niveau van het middenkader.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.3.2
