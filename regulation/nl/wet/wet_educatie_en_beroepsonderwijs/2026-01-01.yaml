  - number: 7.3.4
    text: |-
      1 Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het
      behalen van elk der in het eerste lid genoemde diploma’s noodzakelijke vakken en andere programma-onderdelen, en
      omtrent de cursusduur.

      3 Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.3.4
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.1
  - number: 7.4.2
    text: |-
      1 Het bevoegd gezag van een instelling geeft de studenten en deelnemers de gelegenheid een examen af te leggen.

      2 Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen of aan de hand van de kwalificatie-
      eisen in het kwalificatiedossier en de eisen van het keuzedeel of de keuzedelen.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.2
  - number: 7.4.3
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens van
      opleidingen educatie.

      2 In geval van toepassing van het eerste lid zijn de [artikelen 7.4.3a, tweede lid][ref1], waarbij voor centraal
      examen staatsexamen kan worden gelezen, en [7.4.4][ref2] van overeenkomstige toepassing op die opleiding educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.3a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.4.3a
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 7.4.4
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.3a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de examens van
      beroepsopleidingen.

      2 Bij algemene maatregel van bestuur kunnen onderdelen van een beroepsopleiding worden aangewezen waarbij geheel
      of gedeeltelijk centrale examinering plaatsvindt. Voor onderdelen waarbij gedeeltelijk centrale examinering
      plaatsvindt, wordt bij ministeriële regeling bepaald over welk gedeelte het centraal examen zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.3a
  - number: 7.4.4
    text: |-
      Bij ministeriële regeling worden landelijke standaarden voor de kwaliteit van de examens van de beroepsopleidingen
      vastgesteld die betrekking hebben op:

      a. de inhoud en het niveau van de examens, in relatie tot de kwalificatie-eisen in het kwalificatiedossier alsmede
      de eisen van de keuzedelen, bedoeld in [artikel 7.2.4][ref1];

      b. de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.4
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.4a
    text: |-
      1 Het bevoegd gezag kan de gehele examinering van een beroepsopleiding overdragen aan een andere instelling
      als bedoeld in [artikel 1.1.1][ref1] of [1.4.1][ref2] of aan een exameninstelling, voor zover deze het recht op
      examinering van die beroepsopleiding hebben.

      2 Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.1.5b, eerste lid][ref3],
      [6.2.3b, eerste lid][ref4], [6.2.3c, eerste lid][ref5], dan wel [6.3.2, eerste lid][ref6], is het bevoegd gezag
      voor die beroepsopleiding gehouden toepassing te geven aan het eerste lid. Voor zover er bij toepassing van artikel
      6.2.3c, eerste lid, sprake is van een schorsing van een deel van het recht op examinering, bedoeld in artikel
      6.2.3c, tweede lid, onder a, of een schorsing als bedoeld in artikel 6.2.3c, tweede lid, onder b, c of d, is het
      bevoegd gezag in afwijking van het eerste lid slechts gehouden dit deel over te dragen.

      3 Het bevoegd gezag kan de examinering van extraneï die op grond van een samenwerkingsovereenkomst als bedoeld in
      [artikel 8.4.2][ref7] een entreeopleiding volgen, onder zijn verantwoordelijkheid laten uitvoeren door het bevoegd
      gezag van een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.4.1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.5b
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6.2.3b
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel6.2.3c
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel6.3.2
      [ref7]: https://wetten.overheid.nl/BWBR0007625#Artikel8.4.2
