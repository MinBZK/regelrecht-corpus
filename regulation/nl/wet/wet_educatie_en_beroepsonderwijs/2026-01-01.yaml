  - number: 6a.1.2
    text: |-
      1 Onze Minister kan ten aanzien van een opleiding educatie, verzorgd door een instelling als bedoeld in
      [artikel 1.4a.1][ref1], het recht, bedoeld in het eerste lid van dat artikel, ontnemen indien:

      a. gebleken is dat de kwaliteit van een of meer examens of een of meer onderdelen van een examen van die opleiding
      onvoldoende is geweest, of

      b. niet of niet meer voldaan wordt aan de voorwaarden, bedoeld in [artikel 1.4a.1, eerste lid][ref2],
      of aan de voorwaarde, bedoeld in [artikel 1.4a.1, zesde lid][ref3], of aan
      [artikel 1.4a.1, achtste lid, onderdelen a tot en met e][ref4].

      2 Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref5] is verbonden.


