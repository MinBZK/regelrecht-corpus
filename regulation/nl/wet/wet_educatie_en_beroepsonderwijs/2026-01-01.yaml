  - number: 3.1.1
    text: |-
      1 Het bevoegd gezag zorgt voor een scheiding tussen de functies van bestuur en intern toezicht.

      2 Een bestuurder van de rechtspersoon die een bijzondere instelling in stand houdt, is niet tevens als bestuurder
      verbonden aan een ander bevoegd gezag of aan een rechtspersoon die wezenlijke invloed heeft op een ander bevoegd
      gezag.

      3 De samenstelling, taken en bevoegdheden van het intern toezicht zijn zodanig georganiseerd dat een deugdelijk en
      onafhankelijk toezicht kan worden uitgeoefend.

      4 Het bevoegd gezag van een openbare instelling kan hem bij of krachtens wettelijk voorschrift opgedragen taken en
      bevoegdheden delegeren aan het hoofd van de instelling of een ander lid van het personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      1 Aan het bevoegd gezag van een bijzondere instelling is een raad van toezicht verbonden.

      2 De raad van toezicht houdt toezicht op het bestuur van de rechtspersoon bij de uitvoering van diens werkzaamheden
      en diens uitoefening van bevoegdheden en staat dit bestuur met raad ter zijde.

      3 De leden van de raad van toezicht hebben daarin zitting op persoonlijke titel en oefenen hun functie uit zonder
      last of ruggespraak. Een lid van een raad van toezicht heeft geen directe belangen bij de rechtspersoon die de
      instelling in stand houdt of de instelling zelf.

      4 De raad van toezicht is in elk geval belast met:

      a. het benoemen, schorsen, ontslaan en vaststellen van de beloning van de bestuurders van de rechtspersoon die het
      bevoegd gezag vormt;

      b. het goedkeuren van het bestuursreglement, de begroting, de jaarrekening, het bestuursverslag, en indien van
      toepassing, het strategisch meerjarenplan voor de instelling en een samenwerkingsovereenkomst als bedoeld in
      [artikel 8.6.1][ref1];

      c. het toezien op de naleving van wettelijke verplichtingen en de omgang met de branchecode, bedoeld in
      [artikel 2.5.4, eerste lid][ref2], door het bevoegd gezag;

      d. het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen door het bevoegd gezag ten behoeve van de instelling;

      e. het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] die verslag uitbrengt aan de raad; en

      f. het jaarlijks verantwoording afleggen over de uitvoering van zijn taken en uitoefening van zijn bevoegdheden in
      het bestuursverslag.

      5 Het bevoegd gezag voorziet de raad van toezicht van onafhankelijke administratieve ondersteuning.

      6 In afwijking van het eerste lid kan een functionele scheiding tussen bestuur en toezicht worden aangebracht
      binnen het bestuur van de rechtspersoon die de instelling in stand houdt. De voorgaande leden zijn van
      overeenkomstige toepassing. Het bestuursverslag vermeldt de redenen voor de afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8.6.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.5.4
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
