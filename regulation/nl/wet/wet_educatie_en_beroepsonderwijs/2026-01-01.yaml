  - number: 6.1.5
    text: |-
      1 Voordat Onze Minister een besluit neemt op grond van [artikel 6.1.4, eerste lid, onder a][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding,
      onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven. De termijn waarbinnen aan
      de waarschuwing gevolg moet zijn gegeven bedraagt ten minste drie maanden. Onze Minister geeft pas toepassing aan
      artikel 6.1.4, eerste lid, onder a, nadat:

      a. de termijn, bedoeld in de aanhef, is verstreken, en

      b. Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.

      2 Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder b][ref2], geeft hij
      aan het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg
      moet zijn gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de
      waarschuwing gevolg moet zijn gegeven bedraagt ten minste drie maanden.

      2a Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder c][ref3], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de naleving van een of meer
      zorgplichten, bedoeld in [artikel 6.1.3][ref4], waarbij wordt bepaald aan welke maatregelen het bevoegd gezag
      gevolg dient te geven. Aan de waarschuwing kan een termijn van ten minste drie maanden worden verbonden waarbinnen
      aan de maatregelen gevolg moet worden gegeven.

      3 Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.3
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.5
