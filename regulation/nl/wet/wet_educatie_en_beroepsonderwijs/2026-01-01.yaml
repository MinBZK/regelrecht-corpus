  - number: 9.2.7
    text: |-
      1 Indien de persoon, bedoeld in [artikel 9.2.1][ref1], instemt met ondersteuning op grond van
      [artikel 9.2.5][ref2], kan het college van burgemeester en wethouders zijn gegevens over gezondheid
      en persoonsgegevens van strafrechtelijke aard, bedoeld in [paragraaf 3.1][ref3] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4], verwerken voor zover dit
      noodzakelijk is voor de uitvoering van artikel 9.2.5.

      2 Het college van burgemeester en wethouders verstrekt de gegevens over gezondheid en persoonsgegevens van
      strafrechtelijke aard, bedoeld in het eerste lid, niet aan derden en bewaart de gegevens op een plaats die
      uitsluitend toegankelijk is voor personen die belast zijn met de uitvoering van [artikel 9.2.5][ref5].

      3 Het college van burgemeester en wethouders bewaart de gegevens, bedoeld in het eerste lid, tot uiterlijk twee
      jaar nadat de betrokkene de leeftijd van 27 jaar bereikt of een startkwalificatie behaalt.


