  - number: '11.1'
    text: |-
      1 Indien het bevoegd gezag van een instelling in strijd handelt met het bepaalde bij of krachtens deze wet dan wel
      een aanwijzing als bedoeld in [artikel 3.1.5][ref1] of een spoedaanwijzing als bedoeld in [artikel 3.1.6][ref2]
      niet opvolgt, kan Onze Minister de rijksbijdrage, voorschotten daaronder begrepen, geheel of gedeeltelijk inhouden
      dan wel opschorten.

      2 Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een instelling in
      strijd handelt met [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref3].

      3 Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het
      eerste of tweede lid is vervallen.


