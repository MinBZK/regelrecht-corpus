  - number: 7.2.8
    text: |-
      1 Van elke beroepsopleiding maakt onderricht in de praktijk van het beroep deel uit. De beroepspraktijkvorming
      kan voor een deel plaatsvinden in de periode waarin de student is ingeschreven voor een opleidingsdomein of een
      kwalificatiedossier of tijdens het onderwijsprogramma op basis van een of meer keuzedelen.

      2 De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst, gesloten door de in
      [artikel 7.2.9][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen van partijen en omvat
      met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste bepalingen over:

      a. de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het totale aantal te volgen praktijkuren en
      de verdeling daarvan over de studiejaren,

      b. de begeleiding van de student,

      c. het deel van de kwalificatie dan wel het keuzedeel, de keuzedelen of het deel daarvan dat de
      beroepspraktijkvorming omvat alsmede de wijze van beoordeling van de beroepspraktijkvorming, en

      d. de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.

      3 Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de studenten binnen het bedrijf. Het bevoegd gezag beoordeelt of de student de beroepspraktijkvorming met een
      positieve beoordeling heeft voltooid. Het bevoegd gezag betrekt bij die beoordeling het oordeel van het bedrijf
      onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling op te
      nemen regels.

      4 De beroepspraktijkvorming vindt plaats bij een bedrijf of organisatie met een erkenning op grond van
      [artikel 1.5.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.5.3
