  - number: 9.2.10
    text: |-
      1 Het college van burgemeester en wethouders van de contactgemeente stelt mede namens de colleges van burgemeester
      en wethouders van de andere gemeenten in de regio jaarlijks een effectrapportage vast. De effectrapportage
      vermeldt de streefcijfers, bedoeld in [artikel 9.2.8, derde lid, onderdeel a][ref1], en de bereikte resultaten
      en bevat een toelichting op afwijkingen. Het college van burgemeester en wethouders van de contactgemeente zendt de
      effectrapportage aan Onze Minister.

      2 Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de inhoud, het tijdstip van indiening
      en de inrichting van de effectrapportage.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.8
