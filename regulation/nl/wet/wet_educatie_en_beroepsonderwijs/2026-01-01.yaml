  - number: 4.2.3
    text: |-
      1 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor de uitoefening van het docentschap.

      2 Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.

      3 De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:

      a. pedagogisch-didactische kennis, inzicht en vaardigheden, en

      b. vakbekwaamheid.

      4 De algemene maatregel van bestuur, bedoeld in het eerste en tweede lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.

      5 Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste
      en tweede lid bedoelde bekwaamheidseisen. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal
      in de zes jaar in de gelegenheid, hem een voorstel te doen over ongewijzigde handhaving of wijziging van de
      bekwaamheidseisen voor zover vastgesteld. Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens,
      in hoeverre dat voorstel mede steun geniet van een vertegenwoordiging van bevoegde gezagsorganen, van ouders en van
      studenten en vavo-studenten.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.2.3
  - number: 4.2.3a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.2.3a
  - number: 4.2.3b
    text: |-
      1 Degene die op 31 juli 2017 voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan
      een instelling is benoemd of tewerkgesteld zonder benoeming, alsmede degene die eerder al voor het geven van dat
      onderwijs benoemd is geweest of tewerkgesteld zonder benoeming, voldoet aan de bekwaamheidseisen voor het geven van
      dat onderwijs.

      2 Degene die binnen een periode van vijf jaren gerekend vanaf 1 augustus 2017 voor de eerste keer wordt benoemd of
      tewerkgesteld zonder benoeming voor het geven van godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs aan
      een instelling, dient binnen een periode van vijf jaren gerekend vanaf het tijdstip van die eerste benoeming of
      die eerste tewerkstelling zonder benoeming, te voldoen aan de bekwaamheidseisen voor het geven van dat onderwijs
      om belast te kunnen blijven worden met de desbetreffende werkzaamheden. Bij algemene maatregel van bestuur kan
      deze periode worden verlengd met een daarbij te bepalen periode indien verlenging noodzakelijk is voor een goede
      invoering van die bekwaamheidseisen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op degene die:

      a. onderwijsondersteunende werkzaamheden ten behoeve van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs aan een instelling verricht, vanaf het moment dat voor die werkzaamheden bekwaamheidseisen zijn
      vastgesteld; of

      b. is aangewezen, eerder was aangewezen onderscheidenlijk voor de eerste keer wordt aangewezen voor het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs op openbare instellingen.

      4 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.2.3b
  - number: 4.2.3c
    text: |-
      [Artikel 1.3.6, eerste lid][ref1], wat het onderhouden van de bekwaamheid betreft, vindt voor een bepaalde
      personeelscategorie voor het eerst toepassing met ingang van het tijdstip waarop de bekwaamheidseisen voor die
      categorie in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.6
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel4.2.3c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 1.3.6
        hoofdstuk: I
        paragraaf: '3'
  - number: 4.2.4
    text: |-
      1 Aan degene die niet in het bezit is van een in [artikel 4.2.1, tweede lid, onder b][ref1], genoemd getuigschrift
      of diploma respectievelijk genoemde erkenning van beroepskwalificaties wordt door het bevoegd gezag dat voornemens
      is betrokkene te benoemen een geschiktheidsverklaring afgegeven, indien de betrokkene naar het oordeel van het
      bevoegd gezag:

      a. vakinhoudelijk bekwaam is en geschikt is voor het beroep van docent, en

      b. voldoet aan de in [artikel 4.2.3, derde lid][ref2], onder a genoemde eisen, blijkend uit het bezit van een
      getuigschrift als bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3],
      of

      c. in staat is verantwoord les te geven en binnen twee jaar na benoeming of tewerkstelling zonder benoeming tot
      docent te voldoen aan de in [artikel 4.2.3, derde lid, onder a][ref4], genoemde eisen.

      2 Het bevoegd gezag geeft de in het eerste lid bedoelde verklaring slechts af, indien:

      a. betrokkene in het bezit is van een getuigschrift van een met goed gevolg afgelegd afsluitend examen
      van een opleiding in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek, niet zijnde een getuigschrift als bedoeld in
      [artikel 4.2.1, tweede lid, onderdeel b 1° tot en met 4°][ref5],

      b. betrokkene in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6],

      c. betrokkene in het bezit is van een buitenlands getuigschrift of diploma dat gelijkwaardig is aan een onder a
      bedoeld getuigschrift of een onder b bedoelde erkenning van beroepskwalificaties, of

      d. betrokkene ten minste drie jaren ervaring heeft in de praktijk van het beroep waarop het desbetreffende
      onderwijs is gericht en naar het oordeel van het bevoegd gezag door een combinatie van opleiding en ervaring
      geacht wordt te beschikken over een kwalificatieniveau dat vergelijkbaar is met het onder a tot en met c bedoelde
      kwalificatieniveau, en

      e. de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge samenhang bezien,
      naar het oordeel van het bevoegd gezag van voldoende belang zijn in verhouding tot de beoogde werkzaamheden aan
      de instelling.

      3 Indien betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7], stelt het bevoegd gezag vast,
      welke scholing en begeleiding voor betrokkene noodzakelijk zijn om binnen twee jaar na benoeming of tewerkstelling
      zonder benoeming te kunnen voldoen aan de in [artikel 4.2.3, derde lid onder a][ref8], genoemde bekwaamheidseisen
      ten aanzien van pedagogisch-didactische kennis, inzicht en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.3
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7a.4
