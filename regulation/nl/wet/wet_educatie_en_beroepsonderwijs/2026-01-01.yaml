  - number: 6.1.5a
    text: |-
      1 In de gevallen, bedoeld in [artikel 6.1.4, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.

      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.

      3 Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze
      het verstrekken van financiële middelen betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.4
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6.1.4
        hoofdstuk: '6'
  - number: 6.1.5b
    text: |-
      1 Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.4][ref1].
      Bij de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in de
      Registratie instellingen en opleidingen bekendgemaakt.

      2 Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een
      waarschuwing op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn
      waarbinnen aan die waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref2], is van overeenkomstige
      toepassing.

      3 Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.5
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.6.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.5b
