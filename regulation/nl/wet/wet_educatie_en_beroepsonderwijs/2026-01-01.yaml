        artikel: 8a.2.1
        hoofdstuk: 8a
  - number: 8a.4.1
    text: |-
      1 Er is een landelijke geschillencommissie medezeggenschap, waarbij elke instelling is aangesloten. De commissie
      bestaat uit drie leden, waaronder de voorzitter, en drie plaatsvervangende leden.

      2 Onze Minister benoemt de leden en plaatsvervangende leden voor vier jaar. Zij zijn een keer herbenoembaar.

      3 Een lid en een plaatsvervangend lid worden benoemd op bindende voordracht van vertegenwoordigers van de
      gezamenlijke bevoegde gezagsorganen van de instellingen en een lid en een plaatsvervangend lid op bindende
      voordracht van vertegenwoordigers van de studentenraden van de instellingen. Deze twee leden doen een bindende
      voordracht voor het derde lid, tevens voorzitter, en diens plaatsvervanger.

      4 Indien sprake is van een geschil als bedoeld in [artikel 8a.4.2, onderdeel a][ref1], voor zover het betreft
      het ontbreken van de vereiste instemming van de ondernemingsraad met het medezeggenschapsstatuut, wordt voor
      de duur van behandeling van dat geschil een lid benoemd op bindende voordracht van vertegenwoordigers van de
      ondernemingsraden van de instellingen.

      5 De leden en de plaatsvervangende leden mogen geen deel uitmaken van het bevoegd gezag of van de studentenraad van
      een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.4.2
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel8a.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a.4.2
        hoofdstuk: 8a
  - number: 8a.4.2
    text: |-
      De commissie neemt kennis van de volgende geschillen:

      a. op verzoek van het bevoegd gezag of van de studentenraad, indien het bevoegd gezag ten aanzien van een
      voorgenomen beslissing als bedoeld in [artikel 8a.2.2, derde lid][ref1], niet de vereiste instemming heeft
      verworven;

      b. op verzoek van het bevoegd gezag of van de studentenraad, indien het bevoegd gezag en de raad van mening
      verschillen over de interpretatie van hoofdstuk 8a dan wel het reglement;

      c. op verzoek van de studentenraad, indien het bevoegd gezag een beslissing heeft genomen waarover ingevolge
      [artikel 8a.2.2, vierde lid][ref2], of [artikel 8a.5.1][ref3] juncto artikel 8a.2.2 advies door de studentenraad
      is uitgebracht, het bevoegd gezag daarbij het uitgebrachte advies niet of niet geheel heeft gevolgd en de
      studentenraad van oordeel is dat daardoor de belangen van de studenten en vavo-studenten, van de studentenraad of
      van de instelling ernstig worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.5.1
