  - number: 4.2.1a
    text: |-
      Onze Minister kan aan een persoon die in het bezit is van een buiten de Europese Economische Ruimte en
      Zwitserland behaald bewijsstuk waarmee de bekwaamheid wordt aangetoond voor het docentschap, bedoeld in
      [artikel 4.2.1, tweede lid, onderdeel b][ref1], of voor het verrichten van onderwijsondersteunende werkzaamheden,
      bedoeld in [artikel 4.2.3, tweede lid][ref2], de bevoegdheid tot het geven van beroepsonderwijs onderscheidenlijk
      het verrichten van onderwijsondersteunende werkzaamheden verlenen. Hij kan daarbij voorwaarden en beperkingen
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4.2.3
