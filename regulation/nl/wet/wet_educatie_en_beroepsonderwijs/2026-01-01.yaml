  - number: 1.4.2
    text: |-
      1 Het bevoegd gezag van een andere dan in [artikel 1.1.1][ref1] bedoelde instelling of van een instelling, kan
      wat betreft een beroepsopleiding ten aanzien waarvan toepassing is gegeven aan [artikel 1.4.1, eerste lid][ref2],
      een doorlopende leerroute vmbo-mbo of de geïntegreerde route vmbo-basisberoepsopleiding als bedoeld in
      [artikel 2.107l van de Wet voortgezet onderwijs 2020][ref3] aanbieden.

      2 Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen
      het bevoegd gezag, bedoeld in het eerste lid, en het bevoegd gezag van een ingevolgde
      [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref4] aangewezen school.

      3 De [artikelen 9.1.2][ref5], [9.1.3][ref6], met uitzondering van het tweede lid wat betreft
      [artikel 2.107b, tweede lid, onderdeel e, van de Wet voortgezet onderwijs 2020][ref7],
      [9.1.4 tot en met 9.1.6][ref8], [9.1.7, eerste en tweede lid][ref9], [9.1.8][ref10], [9.1.10][ref11],
      [9.1.11][ref12], [9.1.14][ref13], [9.1.16][ref14] en [9.1.17][ref15] zijn van overeenkomstige
      toepassing, met dien verstande dat voor «school» telkens wordt gelezen «school aangewezen ingevolge
      [artikel 2.66 van de Wet voortgezet onderwijs 2020][ref16]».


