        paragraaf: '1'
  - number: 6.1.3a
    text: |-
      1 Het bevoegd gezag verstrekt zodanige informatie aan aspirant-studenten van beroepsopleidingen over:

      a. de instelling,

      b. het aanbod van beroepsopleidingen,

      c. het arbeidsmarktperspectief na beëindiging van de desbetreffende beroepsopleiding,

      d. de inhoud en de inrichting van het te volgen onderwijs,

      e. de examinering,

      f. de vooropleidingseisen voor de verschillende beroepsopleidingen, en

      g. de kwaliteit van de verschillende beroepsopleidingen waaronder het oordeel van de inspectie ter zake,

      dat de aspirant-studenten in staat zijn de opleidingsmogelijkheden te vergelijken en een passende opleiding te
      kiezen, alsmede zich een goed oordeel te vormen over de inhoud en de inrichting van het te volgen onderwijs en de
      examens en zich goed voor te bereiden op de gestelde eisen.

      2 Bij ministeriële regeling kunnen nadere specificaties worden gegeven over de vorm en inhoud van de informatie die
      nodig is voor het vergelijken van opleidingen en het kiezen van een passende opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel6.1.3a
  - number: 6.1.4
    text: |-
      1 Onze Minister kan besluiten dat ten aanzien van een beroepsopleiding in de beroepsopleidende of
      beroepsbegeleidende leerweg die de instelling verzorgt, de rechten, genoemd in [artikel 1.3.1][ref1], gedurende
      twee jaar worden ontnomen indien:

      a. gebleken is dat de kwaliteit van die opleiding ten minste drie maanden zeer zwak is geweest,

      b. niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de
      kwaliteitszorg, het onderwijs of de examens, of

      c. niet of niet meer wordt voldaan aan een of meer zorgplichten, bedoeld in [artikel 6.1.3][ref2].

      2 Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:

      a. de aanspraak op bekostiging, bedoeld in [artikel 1.3.1][ref3], voor zover van toepassing, vervalt,

      b. aan de examens of onderdelen daarvan geen diploma als bedoeld in [artikel 7.4.6][ref4] of certificaat als
      bedoeld in [artikel 7.2.3][ref5] meer is verbonden, en

      c. in de Registratie instellingen en opleidingen wordt geregistreerd dat de rechten, genoemd in
      [artikel 1.3.1][ref6], van de instelling met betrekking tot de opleiding zijn ontnomen en de ingangsdatum en de
      einddatum daarvan.

      3 Bij een beschikking tot ontneming van rechten bepaalt Onze Minister het tijdstip waarop die beschikking van
      kracht wordt zodanig, dat de voor de opleiding ingeschreven studenten de opleiding aan een andere instelling binnen
      een redelijke tijd kunnen voltooien.

      4 Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6.1.3
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7.4.6
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.3
