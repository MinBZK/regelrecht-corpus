      - id: ref2
        bwb_id: BWBR0002747
  - number: 3.1.5
    text: |-
      1 Onze Minister kan het bevoegd gezag een aanwijzing tot het nemen van een of meer maatregelen geven, indien sprake
      is van wanbeheer.

      2 Onder wanbeheer wordt verstaan:

      a. financieel wanbeleid;

      b. het in ernstige mate of langdurig nalaten om, in ieder geval in strijd met de [artikelen 1.3.6][ref1] en
      [1.3.6a][ref2], maatregelen te treffen die noodzakelijk zijn voor het waarborgen van de kwaliteit en de goede
      voortgang van het onderwijs, waaronder de deugdelijke afsluiting daarvan;

      c. het door een bestuurder of toezichthouder ongerechtvaardigd verrijken van het bevoegd gezag, zichzelf of een
      derde;

      d. het in de hoedanigheid van bestuurder of toezichthouder handelen in strijd met wettelijke bepalingen waardoor
      financieel voordeel wordt behaald ten gunste van het bevoegd gezag, zichzelf of een derde;

      e. het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen binnen de instelling, waaronder in ieder geval wordt verstaan intimidatie of bedreiging van
      personeel of studenten door een bestuurder of toezichthouder.

      3 Onze Minister motiveert in de aanwijzing waarom het doel van de aanwijzing niet met een minder zwaar middel kan
      worden bereikt

      4 De aanwijzing vermeldt de termijn waarbinnen zij moet worden uitgevoerd.

      5 Voordat Onze Minister een aanwijzing geeft heeft de inspectie een onderzoek als bedoeld in [artikel 11][ref3] of
      [artikel 15 van de Wet op het onderwijstoezicht][ref4] verricht en daarover een inspectierapport uitgebracht als
      bedoeld in [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref5], waaruit volgt dat sprake is van
      wanbeheer als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.6a
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0013800#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0013800#Artikel20
