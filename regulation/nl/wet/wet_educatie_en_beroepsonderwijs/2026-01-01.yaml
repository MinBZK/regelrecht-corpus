  - number: 7.4.7
    text: |-
      1 Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het desgevraagd, aan belanghebbenden of aan de
      op grond van de [Algemene wet erkenning EU-beroepskwalificaties][ref1] bevoegde autoriteiten, verstrekken van op
      vergelijking van opleidingen berustende waarderingen of vergelijkingen:

      a. van buitenlandse diploma’s of certificaten als bedoeld in die wet alsmede van andere buitenlandse diploma's, met

      b. de getuigschriften van overeenkomstige Nederlandse beroepsopleidingen.

      2 Bij de vergelijkingen en waarderingen wordt zo mogelijk aangegeven tot welke soort in
      [artikel 7.2.2, eerste lid][ref2], bedoelde beroepsopleiding de desbetreffende opleiding kan worden gerekend en met
      welke in de Registratie instellingen en opleidingen vermelde beroepsopleiding die opleiding vergelijkbaar is of kan
      worden gelijkgesteld.

      3 De vergelijking of waardering wordt slechts verstrekt:

      a. op verzoek van de op grond van de in het eerste lid genoemde [wet][ref3] bevoegde autoriteiten, ten behoeve van
      aanvragen tot het verlenen van erkenning van beroepskwalificaties als bedoeld in [artikel 5 van die wet][ref4],

      b. indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan een
      Nederlandse beroepsopleiding, of

      c. indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan de
      Nederlandse arbeidsmarkt op een niveau dat overeenkomt met een in [artikel 7.2.2][ref5] bedoeld niveau van
      beroepsuitoefening.

      4 Onze Minister kan beleidsregels stellen met het oog op een doelmatige vervulling van de in het eerste lid
      genoemde taken door de rechtspersoon.

      5 De rechtspersoon verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak redelijkerwijs
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.

      6 Indien naar het oordeel van Onze Minister de rechtspersoon zijn taak ernstig verwaarloost, kan Onze Minister
      de noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder
      getroffen dan nadat de rechtspersoon in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog zijn taak naar behoren uit te voeren. Onze Minister stelt de beide kamers der Staten-Generaal
      onverwijld in kennis van door hem getroffen voorzieningen als bedoeld in de eerste volzin.

      7 Onze Minister verstrekt, onder door hem op te leggen verplichtingen, aan de rechtspersoon jaarlijks uit 's Rijks
      kas middelen ten behoeve van de uitvoering van de in het eerste lid genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
      [ref3]: https://wetten.overheid.nl/BWBR0023066
      [ref4]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
