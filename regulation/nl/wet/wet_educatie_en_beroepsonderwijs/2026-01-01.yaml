  - number: 9.2.13
    text: |-
      1 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de student of gediplomeerde
      woon- of verblijfplaats heeft, betrekken bij de loopbaanbegeleiding, bedoeld in [artikel 9.2.12][ref1], om de
      student of gediplomeerde ondersteuning te bieden op grond van [artikel 7a van de Participatiewet][ref2].

      2 Het bevoegd gezag kan het college van burgemeester en wethouders van de gemeente waar de gediplomeerde
      woon- of verblijfplaats heeft, verzoeken de ondersteuning van een gediplomeerde voort te zetten op grond van
      [artikel 7a van de Participatiewet][ref3], mits de betrokkene daarmee instemt.

      3 Indien de ondersteuning met toepassing van het tweede lid wordt voortgezet door het college
      van burgemeester en wethouders, stelt het bevoegd gezag een overgangsdocument op overeenkomstig
      [artikel 14e van de Wet op de expertisecentra][ref4] en verstrekt dit document aan het college van burgemeester
      en wethouders.


