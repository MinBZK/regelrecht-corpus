  - number: 2.3.5
    text: |-
      1 Het college van burgemeester en wethouders van de contactgemeente verstrekt desgevraagd aan Onze Minister
      gegevens die betrekking hebben op het aanbod bedoeld in [artikel 2.3.1, eerste lid][ref1], teneinde deze
      in staat te stellen een zorgvuldig en samenhangend beleid met betrekking tot educatie te voeren en zijn
      stelselverantwoordelijkheid te waarborgen. De gegevens worden kosteloos verstrekt.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de verstrekking van de in het eerste lid bedoelde gegevens en

      b. de betaling van de uitkering, bedoeld in [artikel 2.3.2, eerste lid][ref2], indien het college van burgemeester
      en wethouders van de contactgemeente de in het eerste lid bedoelde gegevens niet of niet tijdig verstrekt dan wel
      de kwaliteit van die gegevens te kort schiet.


