  - number: 9.2.8
    text: |-
      1 Het college van burgemeester en wethouders van de contactgemeente stelt mede namens de colleges van burgemeester
      en wethouders van de andere gemeenten in de regio, bedoeld in [artikel 9.2.4, eerste lid][ref1], voor een bij
      ministeriële regeling te bepalen periode een regionaal programma op.

      2 Bij het regionaal programma worden de partijen, bedoeld in [artikel 9.2.4, derde lid, onderdeel a][ref2],
      betrokken.

      3 Het regionaal programma bevat ten minste:

      a. streefcijfers en daarbij behorende maatregelen ter bevordering van het aantal personen van 12 tot 27 jaar dat
      een startkwalificatie behaalt en ter verbetering van de overgang van het onderwijs naar de arbeidsmarkt; en

      b. afspraken over de samenwerking tussen de partijen bij de uitvoering van de maatregelen en
      de activiteiten, bedoeld in de [artikelen 9.2.5][ref3], [9.2.12][ref4] en [9.2.13][ref5], de
      [artikelen 44][ref6] en [44a van de Wet op de expertisecentra][ref7], de [artikelen 2.31a][ref8] en
      [2.31b van de Wet voortgezet onderwijs 2020][ref9] en [artikel 7a van de Participatiewet][ref10].

      4 De partijen bedoeld in [artikel 9.2.4, derde lid, onderdeel a][ref11], voeren regionaal bestuurlijk overleg
      over de totstandkoming en de voortgang van het regionaal programma. Bij het overleg worden ook het domein zorg en
      het sociaal domein betrokken.

      5 Bij regeling van Onze Minister, handelende in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid, kunnen nadere voorwaarden worden gesteld aan het regionaal programma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.2.4
