  - number: 2.1.1
    text: |-
      Onverminderd de [artikelen 1.3.2][ref1] en [6.1.1, tweede lid][ref2] komt een beroepsopleiding bij een instelling
      voor bekostiging in aanmerking indien zij is gericht op een kwalificatie of kwalificaties als bedoeld in
      [artikel 7.2.4, tweede lid, onder b3°][ref3], alsmede op een keuzedeel of keuzedelen en de rechten, genoemd
      in [artikel 1.3.1][ref4], met betrekking tot de desbetreffende beroepsopleiding niet zijn ontnomen op grond van
      [artikel 6.1.4][ref5].


