  - number: 2.2.5
    text: |-
      Het bevoegd gezag kan het deel van de rijksbijdrage dat overblijft na dekking van de exploitatie- en
      huisvestingskosten voor een instelling of de huisvestingskosten van een school binnen een verticale
      scholengemeenschap mede aanwenden ter dekking van de exploitatie- en huisvestingskosten van een door hem in stand
      gehouden:

      a. andere instelling; of

      b. school binnen een verticale scholengemeenschap.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.5
  - number: 2.2.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de besteding van de
      rijksbijdrage aan private activiteiten ten behoeve van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.6
  - number: 2.2.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.7
  - number: 2.2.8
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.8
  - number: 2.2.9
    text: |-
      1 Elke instelling is aangesloten bij de door de bevoegde gezagsorganen gezamenlijk opgerichte rechtspersoon met
      volledige rechtsbevoegdheid, zonder winstoogmerk, die zich ten doel stelt zich borg te stellen voor de nakoming
      van rente- en aflossingsverplichtingen, voortvloeiend uit de door het bevoegd gezag van de instelling aangegane
      leningen, door instandhouding van een onafhankelijk functionerend fonds met een onafhankelijk van de instellingen
      functionerend bestuur.

      2 Elke instelling draagt aan het fonds op zodanige wijze bij, dat door de gezamenlijke bijdragen het functioneren
      van het fonds is gewaarborgd.

      3 De gezamenlijke instellingen dragen er zorg voor dat in de statuten van de rechtspersoon, bedoeld in het eerste
      lid, in elk geval is opgenomen:

      a. dat ingeval van door de rechtspersoon te stellen algemene voorwaarden aan het verlenen van borgstelling, deze
      uitsluitend van financiële aard zijn en uitsluitend betrekking hebben op de te waarborgen lening;

      b. dat ingeval de instelling aan de onder a bedoelde voorwaarden voldoet, borgstelling door de rechtspersoon niet
      kan worden geweigerd;

      c. dat als blijkt dat een instelling niet in staat is tot nakoming van rente- en aflossingsverplichtingen, de
      instelling verplicht is een saneringsplan aan het waarborgfonds over te leggen, waarin is aangegeven op welke wijze
      en binnen welke termijn het evenwicht tussen inkomsten en uitgaven van de instelling hersteld kan worden;

      d. dat de door de rechtspersoon te stellen voorwaarden in het kader van door hem te waarborgen leningen niet in
      strijd komen met de vrijheid van organisatie en inrichting van het onderwijs binnen de instellingen;

      e. dat een batig saldo van het fonds kan worden uitgekeerd aan de bevoegde gezagsorganen van de instellingen, onder
      de voorwaarde dat een uitkering door het bevoegd gezag van een instelling uitsluitend wordt besteed ten behoeve van
      de werkzaamheden van de instelling waarvoor de rijksbijdrage wordt verleend; en

      f. een regeling omtrent de te volgen procedure en te treffen voorzieningen in geval van taakverwaarlozing door het
      bestuur van het fonds.

      4 Van de in het eerste lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag van een
      bijzondere instelling ontheffing verlenen op grond van bedenkingen van godsdienstige of levensbeschouwelijke aard.
      Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening
      is getroffen voor het waarborgen van het voortbestaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.9
  - number: 2.2.10
    text: |-
      1 Bij een beëindiging van de bekostiging van een instelling of de opheffing ervan stelt het bevoegd gezag zo
      spoedig mogelijk een eindafrekening vast.

      2 Voorafgaand aan de situatie, bedoeld in het eerste lid, maakt het bevoegd gezag aan Onze Minister zijn plan
      bekend met daarin de reeds genomen of voorgenomen maatregelen, gericht op het kunnen voltooien van het onderwijs
      van de ingeschreven studenten.

      3 De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld van een verklaring omtrent de getrouwheid
      van een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      4 Het bevoegd gezag is een batig saldo verschuldigd aan de Staat. Onze Minister stelt het verschuldigde bedrag
      vast. Hierbij wordt rekening gehouden met door het bevoegd gezag uit eigen middelen aan investeringen bestede
      gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2.10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2a.1
    text: |-
      1 De rijksbijdrage voor het voortgezet algemeen volwassenenonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde
      aanspraak betrekking heeft wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde
      middelen, per instelling berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.

      2 [Artikel 2.2.1, derde lid, onder a tot en met k, en vierde lid][ref2], zijn van overeenkomstige toepassing,
      met dien verstande dat in onderdeel i onder gewezen personeel mede wordt begrepen personeel dat was belast met
      werkzaamheden op het gebied van het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.2a.1
    references:
      - id: ref1
