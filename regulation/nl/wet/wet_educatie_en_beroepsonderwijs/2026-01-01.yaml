  - number: 9.1.12
    text: |-
      Voor de vakoverstijgende delen van het onderwijsprogramma, bedoeld in
      [artikel 9.1.8, eerste lid, onderdeel a][ref1], en voor de delen van het onderwijsprogramma die een combinatie
      van voortgezet onderwijs en beroepsonderwijs betreffen, bedoeld artikel 9.1.8, eerste lid, onderdeel c, kan, voor
      zover wordt voldaan aan [artikel 7.13a van de Wet voortgezet onderwijs 2020][ref2], worden gewerkt met teams die
      verantwoordelijk zijn voor de kwaliteit van dat deel van het onderwijsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9.1.8
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel7.13a
