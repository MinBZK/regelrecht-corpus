  - number: 7.2.7
    text: |-
      1 Het bevoegd gezag draagt er zorg voor dat beroepsopleidingen zodanig zijn ingericht dat studenten, ongeacht of
      zij eerst worden ingeschreven voor een opleidingsdomein of voor een kwalificatiedossier, de kwalificatie en daarbij
      behorende keuzedelen binnen de vastgestelde studieduur kunnen bereiken en dat het onderwijsprogramma evenwichtig is
      ingedeeld, alsmede voldoende begeleide onderwijsuren en uren beroepspraktijkvorming omvat.

      2 Beroepsopleidingen in de beroepsopleidende leerweg en in de beroepsbegeleidende leerweg zijn voltijds ingericht
      en hebben per volledig studiejaar een studielast van ten minste 1600 klokuren.

      3 Het onderwijsprogramma voor een opleiding in de beroepsopleidende leerweg voldoet aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming, bedoeld in het eerste lid, indien het bevoegd
      gezag voor de student een onderwijsprogramma verzorgt dat:

      a. voor de entreeopleiding ten minste 1000 klokuren omvat waarvan ten minste 600 begeleide onderwijsuren;

      b. voor een eenjarige basisberoepsopleiding en voor de specialistenopleiding ten minste 1000 klokuren omvat,
      waarvan ten minste 700 begeleide onderwijsuren en ten minste 250 klokuren beroepspraktijkvorming;

      c. voor een tweejarige basisberoepsopleiding en voor een tweejarige vakopleiding ten minste 2000 klokuren omvat,
      waarvan ten minste 1250 begeleide onderwijsuren en ten minste 450 klokuren beroepspraktijkvorming, met dien
      verstande dat in het eerste studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd;

      d. voor een driejarige vakopleiding en de middenkaderopleiding ten minste 3000 klokuren omvat, waarvan ten minste
      1800 begeleide onderwijsuren en ten minste 900 klokuren beroepspraktijkvorming, met dien verstande dat in het
      eerste studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd.

      Het bevoegd gezag kan een onderwijsprogramma verzorgen dat minder uren omvat dan de onder a tot en met d genoemde
      aantallen mits de opleiding aantoonbaar van voldoende kwaliteit is. In het geval het onderwijsprogramma minder uren
      omvat, legt het bevoegd gezag hierover verantwoording af in het bestuursverslag, bedoeld in [artikel 2.5.4][ref1]
      dan wel, bij toepassing van [artikel 1.4.1, eerste lid][ref2], in het verslag, bedoeld in artikel 1.4.1, zevende
      lid.

      4 Het onderwijsprogramma voor een opleiding in de beroepsbegeleidende leerweg voldoet aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming, bedoeld in het eerste lid, indien het bevoegd
      gezag voor de student een onderwijsprogramma verzorgt dat elk studiejaar ten minste 850 klokuren omvat, waarvan
      ten minste 200 begeleide onderwijsuren en ten minste 610 klokuren beroepspraktijkvorming. Het bevoegd gezag kan
      een onderwijsprogramma verzorgen dat minder uren omvat dan de genoemde aantallen mits de opleiding aantoonbaar
      van voldoende kwaliteit is. In het geval het onderwijsprogramma minder uren omvat, legt het bevoegd gezag
      hierover verantwoording af in het bestuursverslag, bedoeld in [artikel 2.5.4][ref3] dan wel, bij toepassing van
      [artikel 1.4.1, eerste lid][ref4], in het verslag, bedoeld in artikel 1.4.1, zevende lid.

      5 Het onderwijsprogramma, bedoeld in het derde en vierde lid, omvat alle onderwijsactiviteiten, gericht op het
      bereiken van de onderwijs- en vormingsdoelen van de opleiding, waaraan door de student wordt deelgenomen onder
      verantwoordelijkheid en toezicht van het bevoegd gezag en bestaat uitsluitend uit begeleide onderwijsuren en
      beroepspraktijkvorming.

      6 De begeleide onderwijsuren, bedoeld in het eerste, derde, vierde en vijfde lid, zijn klokuren waarin onderwijs
      wordt gegeven onder verantwoordelijkheid en met actieve betrokkenheid van onderwijspersoneel als bedoeld in de
      [artikelen 4.2.1][ref5] en [4.2.2][ref6], niet zijnde uren die deel uit maken van de beroepspraktijkvorming.

      7 Indien in het laatste studiejaar van de basisberoepsopleiding of de vakopleiding de studieduur van de opleiding
      gerekend vanaf 1 september en naar boven afgerond op hele maanden minder is dan 10 maanden, worden het aantal
      begeleide onderwijsuren en het aantal klokuren beroepspraktijkvorming, genoemd in het derde lid, onder b, c en d
      en het vierde lid, in dat studiejaar evenredig verlaagd. De laatste twee volzinnen van het derde en vierde lid zijn
      van overeenkomstige toepassing.

      8 Voor opleidingen waarvan op grond van [artikel 7.2.4a, vierde lid][ref7], een studieduur is vastgesteld van
      meer dan drie volledige studiejaren wordt het onderwijsprogramma, bedoeld in het derde lid, onderdeel d, naar
      evenredigheid verhoogd met begeleide onderwijsuren en uren beroepspraktijkvorming. De laatste twee volzinnen van
      het derde lid zijn van overeenkomstige toepassing.

      9 Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het aanbod van
      keuzedelen aan studenten alsmede de omvang van het keuzedeel of de keuzedelen die onderdeel uitmaken van de
      beroepsopleiding en de omvang van de onderdelen, bedoeld in [artikel 6.1.2a, tweede lid][ref8].

      10 Het bevoegd gezag kan op verzoek van de student bij het aanbod van keuzedelen bij een opleiding afwijken van de
      koppeling van keuzedelen aan de kwalificatie van de opleiding zoals opgenomen in de ministeriële regeling, bedoeld
      in [artikel 7.2.4, zesde lid, eerste volzin][ref9]. De keuzedelen die bij een opleiding worden aangeboden, vallen
      niet samen met een of meer onderdelen van de kwalificatie van de opleiding. Het bevoegd gezag legt verantwoording
      af over de toepassing van de in de eerste volzin bedoelde bevoegdheid in het bestuursverslag, bedoeld in
      [artikel 2.5.4][ref10], dan wel, bij toepassing van [artikel 1.4.1, eerste lid][ref11], in het verslag, bedoeld in
      artikel 1.4.1, zevende lid.


