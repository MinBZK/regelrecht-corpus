  - number: 8.1.1
    text: |-
      1 Een ieder die gebruik wenst te kunnen maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als student of vavo-student te laten inschrijven. Een ieder die uitsluitend wenst te worden
      toegelaten tot examenvoorzieningen, dient zich door het bevoegd gezag als extraneus te laten inschrijven. Voor
      de inschrijving als extraneus is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      Indien het een meerderjarige extraneus betreft die het examengeld niet zelf voldoet, wordt niet overgegaan tot
      inschrijving dan nadat de extraneus schriftelijk heeft verklaard dat hij ermee instemt dat een in die verklaring
      vermelde derde namens hem het examengeld voldoet. De inschrijving voor een opleiding of een onderdeel van een
      opleiding staat uitsluitend open voor degene waarvan de ouders aantonen, dan wel, indien hij meerderjarig en
      handelingsbekwaam is, degene die aantoont dat hij:

      a. de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,

      b. vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,

      c. vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin
      van [artikel 8 van de Vreemdelingenwet 2000][ref1], of

      d. vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.

      1a Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke grond dan
      ook niet in overeenstemming met de vijfde volzin van het eerste lid heeft plaatsgevonden, wordt de inschrijving met
      onmiddellijke ingang beëindigd.

      1b Voor de ho-student die zich heeft ingeschreven voor een associate degree-opleiding als bedoeld in
      [artikel 1.1, onderdeel m, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] geldt
      niet de verplichting, bedoeld in de eerste volzin van het eerste lid, om gebruik te kunnen maken van de
      onderwijsvoorzieningen.

      1c Het bevoegd gezag van een bijzondere instelling maakt de beslissing over inschrijving schriftelijk en voorzien
      van een deugdelijke motivering bekend aan de student of vavo-student. Indien de student of vavo-student jonger dan
      18 jaar is, maakt het bevoegd gezag de beslissing ook aan de ouders schriftelijk bekend.

      2 De inschrijving geschiedt voor een opleiding voortgezet algemeen volwassenenonderwijs of een onderdeel
      daarvan of voor een beroepsopleiding. In geval van een beroepsopleiding geschiedt de inschrijving voor
      een opleidingsdomein, een kwalificatiedossier of een kwalificatie. Bij de inschrijving worden alle
      gegevens vermeld die het bevoegd gezag nodig heeft om te kunnen voldoen aan de verplichting, bedoeld in
      [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref3].

      3 De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend
      open voor degenen voor wie de volledige leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref4], is
      geëindigd.

      4 Het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven voor
      een entreeopleiding of een basisberoepsopleiding, geacht worden de grondslag en de doelstellingen van de instelling
      te respecteren. De inschrijving kan worden geweigerd dan wel beëindigd indien de betrokkene de grondslag en de
      doelstellingen van de instelling niet respecteert. Ten aanzien van degenen die wensen te worden ingeschreven
      voor een vakopleiding, middenkaderopleiding of een specialistenopleiding, kan het bevoegd gezag ook aangeven dat
      zij geacht worden de grondslag en de doelstellingen van de instelling te onderschrijven en kan de inschrijving
      van een betrokkene ook worden geweigerd dan wel beëindigd, indien deze de grondslag en de doelstellingen van de
      instelling niet onderschrijft. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan
      wel beëindigd indien gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten
      misbruik zal maken door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien
      is gebleken dat de betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft
      gemaakt. De beëindiging van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan
      niet worden beëindigd op grond van de tweede of derde volzin indien voor betrokkene geen gelegenheid bestaat de
      opleiding aan een andere instelling te volgen. De inschrijving kan niet worden geweigerd of beëindigd op grond
      van de derde volzin maar uitsluitend op grond van de tweede volzin die van overeenkomstige toepassing is op de
      vak-, middenkader- en specialistenopleiding, indien betrokkene binnen een verticale scholengemeenschap doorstroomt
      respectievelijk is doorgestroomd van openbaar voortgezet onderwijs naar beroepsonderwijs.

      5 De inschrijving voor een opleidingsdomein kan uitsluitend geschieden voor een beroepsopleiding in de
      beroepsopleidende leerweg op het tweede, derde of vierde niveau, bedoeld in [artikel 7.2.2, derde lid][ref5].

      6 Bij ministeriële regeling kan een maximum worden vastgesteld voor het percentage van de studenten dat in een jaar
      kan worden ingeschreven voor een opleidingsdomein.


