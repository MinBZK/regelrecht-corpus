  - number: 2.1.7
    text: |-
      1 De aanvraag tot goedkeuring van een fusie gaat vergezeld van:

      a. een door het bevoegd gezag dan wel bevoegde gezagsorganen opgestelde fusie-effectrapportage; en

      b. de schriftelijke adviezen, instemmingsverklaringen over de fusie van de betrokken medezeggenschapsraden dan wel
      een uitspraak van de geschillencommissie of Ondernemingskamer als bedoeld in hoofdstuk 8a, titel 4.

      2 De fusie-effectrapportage bevat ten minste een weergave van:

      a. de motieven voor de fusie;

      b. de alternatieven voor de fusie;

      c. het tijdsbestek waarbinnen de fusie zal worden gerealiseerd;

      d. de te bereiken doelen;

      e. de effecten van de fusie op de keuzevrijheid, in het bijzonder op de spreiding en omvang van de betrokken
      bevoegde gezagsorganen in de regio, en op de onderwijskundige en bestuurlijke diversiteit van het onderwijsaanbod
      in de regio;

      f. de kosten en baten van de fusie;

      g. de personele en financiële gevolgen van de fusie, waaronder begrepen de gevolgen voor de dienstverlening aan
      studenten en vavo-studenten en de eventuele gevolgen voor andere belanghebbende partijen;

      h. de wijze waarop over de fusie wordt gecommuniceerd; en

      i. de wijze waarop de fusie wordt geëvalueerd.

      3 Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.1.7
  - number: 2.1.8
    text: |-
      1 Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, in het opzicht van de diversiteit van onderwijsaanbieders in het beroepsonderwijs, gelet op het
      geheel van de voorzieningen op het gebied van het onderwijs op significante wijze wordt belemmerd.

      2 Onze Minister laat zich ten aanzien van de goedkeuring tot fusie adviseren door een onafhankelijke
      adviescommissie.

      3 Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.1.8
  - number: 2.2.1
    text: |-
      1 De rijksbijdrage voor het beroepsonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde aanspraak betrekking heeft
      wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, per instelling berekend aan
      de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze.

      2 De rijksbijdrage bestaat uit bijdragen ten behoeve van exploitatiekosten en huisvestingskosten.

      3 De bijdrage in de exploitatiekosten heeft betrekking op:

      a. personeel,

      b. onderhoud en vervanging van inventaris,

      c. onderhoud van gebouwen en terreinen,

      d. energie,

      e. administratie, beheer en bestuur,

      f. schoonmaken,

      g. heffingen,

      h. inkoop van diensten,

      i. kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid aan gewezen personeel
      alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref2], waaronder mede begrepen gewezen personeel dat was belast met werkzaamheden op het gebied van de
      educatie, met inbegrip van educatieve programma's als bedoeld in [artikel 2.3.1, tweede lid][ref3], zoals luidend
      op 31 december 2008,

      j. loopbaanoriëntatie en -begeleiding,

      k. studenten met een handicap of chronische ziekte, en

      l. studenten die in aanmerking komen voor ondersteuning op grond van [artikel 8.1.5][ref4].

      4 De bijdrage in de huisvestingskosten heeft betrekking op:

      a. huur van gebouwen en terreinen,

      b. investeringen in gebouwen en terreinen, en

      c. eerste inrichting.

      5 Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een bedrag in
      mindering gebracht in verband met cursusgelden zoals bedoeld in de [Les- en cursusgeldwet][ref5].

      6 Een in het eerste lid en in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8.1.5
      [ref5]: https://wetten.overheid.nl/BWBR0004188
