  - number: 8a.4.4
    text: |-
      1 De studentenraad kan in rechte optreden indien de vordering strekt tot naleving door het bevoegd gezag van
      de verplichtingen jegens de studentenraad, voortvloeiend uit [hoofdstuk 8a][ref1]. Tegen een uitspraak van de
      commissie op grond van [artikel 8a.4.3][ref2] staat beroep open.

      2 Een vordering of beroep als bedoeld in het eerste lid, wordt ingediend bij de ondernemingskamer van het
      gerechtshof Amsterdam.

      3 Het beroep wordt ingediend bij beroepschrift binnen een maand nadat het bevoegd gezag of de studentenraad van de
      uitspraak op de hoogte is gesteld. De wederpartij wordt van het beroep in kennis gesteld.

      4 Het beroep kan uitsluitend worden ingesteld op de grond dat de commissie een onjuiste toepassing heeft gegeven
      aan de wet.

      5 Tegen een uitspraak van de ondernemingskamer kan geen beroep in cassatie worden ingesteld.

      6 In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref3] en
      [artikel 8:75 van de Algemene wet bestuursrecht][ref4] kan de studentenraad niet in de proceskosten worden
      veroordeeld.

      7 In dit artikel wordt onder «uitspraak» verstaan: een vaststelling of oordeel van de commissie als bedoeld in
      [artikel 8a.4.3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
