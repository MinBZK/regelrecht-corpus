  - number: 2.5.4
    text: |-
      1 Het bevoegd gezag stelt jaarlijks een bestuursverslag over het afgelopen jaar vast en maakt het openbaar. Het
      bestuursverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.6, tweede lid][ref1], voorzover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten van
      de bevindingen van de inspectie met betrekking tot de examens en informatie over schorsing en verwijdering van
      studenten, vavo-studenten en deelnemers in het afgelopen jaar. Ook legt het bevoegd gezag in het bestuursverslag
      verantwoording af over de omgang met een branchecode voor goed bestuur. Bij ministeriële regeling kan een
      branchecode worden aangewezen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting en de wijze en het tijdstip van
      openbaarmaking van het bestuursverslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1.3.6
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.5.4
