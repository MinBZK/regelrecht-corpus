  - number: 2.3.4
    text: |-
      1 Het college van burgemeester en wethouders van de contactgemeente legt verantwoording af aan Onze Minister over
      de uitvoering van deze wet, op de wijze, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref2], blijkt dat de uitkering, bedoeld in
      [artikel 2.3.2, eerste lid][ref3], niet volledig of onrechtmatig is besteed, wordt de uitkering ter hoogte van
      het niet of onrechtmatig bestede deel door Onze Minister teruggevorderd. Onze Minister doet binnen een jaar na
      ontvangst van de verantwoordingsinformatie mededeling van de terugvordering aan het college van burgemeester en
      wethouders van de contactgemeente.

      3 Indien de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref4], niet volledig door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties is ontvangen binnen dertien maanden na het kalenderjaar waarop zij
      betrekking heeft, wordt de uitkering teruggevorderd. Indien volledige terugvordering naar het oordeel van Onze
      Minister leidt tot een onbillijkheid van overwegende aard, stelt Onze Minister de terugvordering op een lager
      bedrag vast. Onze Minister doet binnen drie maanden na afloop van de dertien maanden, bedoeld in de eerste volzin,
      mededeling van terugvordering aan het college van burgemeester en wethouders van de contactgemeente.

      4 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering, bedoeld in het tweede en
      derde lid, alsmede over de verdeling van de teruggevorderde gelden. Daarbij kan worden bepaald dat een gedeelte van
      het niet bestede deel van de uitkering niet wordt teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2.3.2
      [ref4]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
