        artikel: 1.3.6
        hoofdstuk: I
        paragraaf: '3'
  - number: 2.5.5
    text: |-
      1 De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het beroepsonderwijs en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.

      2 Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de wijze van beschikbaarstelling van
      de in het eerste lid bedoelde gegevens.

      3 Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel2.5.5
  - number: 2.5.5a
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een student gebruiken in het verkeer met de student op wie
      het nummer betrekking heeft, of, indien de student minderjarig is, met de ouders van deze student.

      2

      3

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een student, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken in het
      verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de instelling.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref2],
      gebruiken het persoonsgebonden nummer van een student in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref3], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer van de betrokkene bij de opgave, bedoeld in
      [artikel 8.0.3, derde en vierde lid][ref4].

      7

      8 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een student in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      9 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een student in het contact met een andere instelling
      of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving van die student of
      ten behoeve van het volgen van onderwijs in een samenwerkingscollege, een doorlopende leerroute vmbo-mbo, de
      geïntegreerde route vmbo-basisberoepsopleiding, bedoeld in [artikel 9.1.17][ref5] of [9.1.19][ref6], of een
      doorlopende leerroute als bedoeld in [artikel 9.1.18][ref7]. Onder dit contact wordt mede begrepen de uitwisseling
      van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij algemene maatregel van bestuur
      worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.

      10 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een student ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref8], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref9].

      11 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een student in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref10] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref11] en [artikel 2.2.5, tweede lid][ref12].

      12 Het bevoegd gezag kan het persoonsgebonden nummer van een student eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze student met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van studenten. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de studenten zijn geregistreerd.

      13 Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een student in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de studenten zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.

      14 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het
      dertiende lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander
      pseudoniem kan genereren.

      Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.

      15 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.

      16 De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


