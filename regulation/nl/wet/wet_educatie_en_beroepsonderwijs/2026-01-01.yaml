  - number: 8a.5.1
    text: |-
      1 Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan de instelling ten
      grondslag ligt, kan het bevoegd gezag in het reglement een aan de studentenraad toekomend instemmingsrecht omzetten
      in een adviesrecht. In afwijking van [artikel 8a.2.2, derde lid, onderdeel l][ref1], juncto [artikel 8a.3.1][ref2]
      stelt het bevoegd gezag het reglement, daaronder elke wijziging ervan mede begrepen, slechts vast nadat het
      hierover advies heeft ontvangen van de studentenraad. Het bevoegd gezag kan slechts toepassing geven aan de eerste
      volzin indien een meerderheid van twee derden van de studenten en vavo-studenten dat ondersteunt.

      2 De mogelijkheid tot afwijking, bedoeld in het eerste lid, komt te vervallen indien de gronden waarop zij berustte
      niet langer aanwezig zijn dan wel indien zij niet langer worden ondersteund door een meerderheid van twee derden
      van de studenten en vavo-studenten.

      3 Het bevoegd gezag toetst elke vijf jaar de stand van zaken met betrekking tot de gronden van de afwijking en de
      ondersteuning ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.2.2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a.3.1
