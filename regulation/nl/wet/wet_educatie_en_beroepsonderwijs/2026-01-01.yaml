  - number: 8.2.1
    text: |-
      1 Vereiste voor toelating tot een middenkaderopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], is met
      inachtneming van het bepaalde krachtens [artikel 8.2.2][ref2] het bezit van:

      a. een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,

      b. een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs
      voor zover het betreft de theoretische leerweg,

      c. een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de
      gemengde leerweg,

      d. een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een
      school voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen,

      e. een ander bij ministeriële regeling aangewezen diploma of bewijsstuk,

      f. een diploma basisberoepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel b][ref3], of

      g. een diploma vakopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel c][ref4].

      2 Vereiste voor inschrijving voor een specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref5], is
      het bezit van een diploma vakopleiding voor eenzelfde beroep of beroepencategorie.

      3 Vereiste voor toelating tot een vakopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref6], is met
      inachtneming van het bepaalde krachtens [artikel 8.2.2][ref7] het bezit van:

      a. een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,

      b. een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs
      voor zover het betreft de theoretische leerweg,

      c. een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de
      gemengde leerweg,

      d. een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een
      school voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen,

      e. een ander bij ministeriële regeling aangewezen diploma of bewijsstuk, of

      f. een diploma basisberoepsopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel b][ref8].

      4 Vereiste voor toelating tot een basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref9], is met
      inachtneming van het bepaalde krachtens [artikel 8.2.2][ref10] het bezit van:

      a. een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte
      leerweg,

      b. een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs
      voor zover het betreft de theoretische leerweg,

      c. een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de
      gemengde leerweg,

      d. een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een
      school voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen,

      e. een ander bij ministeriële regeling aangewezen diploma of bewijsstuk, of

      f. een diploma entreeopleiding, bedoeld in [artikel 7.2.2, eerste lid, onderdeel a][ref11].

      5 Voor de toelating tot een opleiding voortgezet algemeen volwassenenonderwijs gelden geen vooropleidingseisen.

      6 Het bevoegd gezag kan in bijzondere gevallen personen die niet voldoen aan de vooropleidingseis voor een
      basisberoepsopleiding, vakopleiding, middenkaderopleiding of specialistenopleiding, vrijstellen van die
      vooropleidingseis, indien zij bij een onderzoek hebben blijk gegeven van geschiktheid voor het desbetreffende
      onderwijs.


