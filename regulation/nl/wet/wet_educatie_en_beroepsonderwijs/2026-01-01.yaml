  - number: 8.1.1b
    text: |-
      1 Onverminderd de [artikelen 8.1.1][ref1], [8.1.2][ref2] en [8.1.7b][ref3], staat de toelating
      tot de entreeopleiding uitsluitend open voor degenen die niet ten minste voldoen aan de
      vooropleidingseisen van de basisberoepsopleiding, bedoeld in [artikel 8.2.1, vierde lid][ref4], en op wie
      [paragraaf 2 van de Leerplichtwet 1969][ref5] niet meer van toepassing is, met uitzondering van degenen ten aanzien
      van wie toepassing is gegeven aan [artikel 3b van de Leerplichtwet 1969][ref6].

      2 Het bevoegd gezag kan de toelating tot de entreeopleiding slechts weigeren indien diegene die om toelating
      verzoekt in de afgelopen twee studiejaren bij een instelling was ingeschreven voor een entreeopleiding.


