  - number: 8.1.5d
    text: |-
      In aanvulling op de voorziening, bedoeld in de [artikelen 8.1.5][ref1] of [8.1.5b][ref2], kan voor een student
      die een beroepsopleidende leerweg volgt een voorziening voor financiële ondersteuning worden getroffen,
      die samen met de financiële ondersteuning ingevolge de voorziening, bedoeld in de artikelen 8.1.5 of
      8.1.5b hoger is dan het normbedrag voor de kosten van levensonderhoud voor het beroepsonderwijs, bedoeld in
      [artikel 3.18 van de Wet studiefinanciering 2000][ref3], en indien van toepassing hoger is dan de som van dat
      bedrag en het bedrag van de toeslag eenoudergezin. Deze aanvulling wordt verstrekt onder de benaming: voorziening
      voor aanvullende ondersteuning.


