  - number: 1.5.3
    text: |-
      1 De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven is belast met het bij regeling vaststellen van de
      erkenningsvoorwaarden voor bedrijven en andere organisaties die de beroepspraktijkvorming verzorgen.

      2 De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven erkent op aanvraag een bedrijf of organisatie, die aan
      de erkenningsvoorwaarden voldoet, als leerbedrijf voor de beroepspraktijkvorming.

      3 Erkende leerbedrijven worden ten minste eenmaal in de vier jaren herbeoordeeld.

      4 De erkenning wordt geweigerd of ingetrokken als niet of niet meer aan de voorwaarden wordt voldaan. De erkenning
      vervalt van rechtswege als het leerbedrijf gedurende een periode van vier jaren geen beroepspraktijkvorming heeft
      verzorgd.

      5 De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven draagt zorg voor openbaarmaking van een actueel
      overzicht van alle erkende leerbedrijven, waarbij wordt vermeld voor welke kwalificaties het een leerbedrijf is.

      6 De regeling, bedoeld in het eerste lid, treedt eerst in werking na goedkeuring door Onze Minister. Goedkeuring
      wordt onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0007625/2026-01-01#Artikel1.5.3
  - number: 1.6.1
    text: |-
      1 Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het
      recht heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in
      acht neemt hetgeen bij of krachtens deze wet is bepaald over:

      a. de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1], voorzover het betreft de examinering,

      b. de examens, en

      c. de rechtsbescherming, bedoeld in [hoofdstuk 7, titel 5][ref2].

      2 Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.


