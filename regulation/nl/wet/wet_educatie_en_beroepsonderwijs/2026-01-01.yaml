      1 Indien een instelling de verklaring omtrent de getrouwheid, bedoeld in [artikel 2.2.4, vijfde lid][ref1], ten
      behoeve van de rijksbijdrage beroepsonderwijs voor het bekostigingsjaar 2025 indient na een tijdstip dat op grond
      van artikel 2.2.4, vijfde lid, is bepaald, wordt de rijksbijdrage voor de instelling voorlopig vastgesteld met
      gebruik van de voorlopige gegevens van het kalenderjaar 2025.

      2 Nadat de instelling de verklaring omtrent de getrouwheid alsnog heeft ingediend voor een later tijdstip dat
      op grond van[ artikel 2.2.4, vierde lid][ref2], is bepaald, wordt de rijksbijdrage voor de instelling definitief
      vastgesteld met gebruik van de gegevens die vergezeld gaan van de verklaring omtrent de getrouwheid en met
      inachtneming van de voorschriften op grond van artikel 2.2.4, vierde lid.


