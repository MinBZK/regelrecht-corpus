  - number: 8.1.5e
    text: |-
      1 Het bevoegd gezag stelt regels van procedurele aard vast met betrekking tot de toepassing van de
      [artikelen 8.1.5][ref1] of [8.1.5b][ref2], waartoe in ieder geval behoren regels over de aanvraag, de aanvang en de
      duur van de ondersteuning en indien het financiële ondersteuning betreft tevens de hoogte van het bedrag.

      2 Het bevoegd gezag kan aan de toekenning van ondersteuning de verplichting verbinden dat de student feitelijk
      studerend is.


