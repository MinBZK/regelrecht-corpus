  - number: 12.1a.5.a
    text: |-
      zij van toepassing blijven op opleidingen die voor die datum op basis van [artikel 12.1a.1, eerste lid][ref1], voor
      bekostiging in aanmerking zijn gebracht of op basis van [artikel 12.1a.2, eerste lid][ref2], zijn erkend en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1a.5
