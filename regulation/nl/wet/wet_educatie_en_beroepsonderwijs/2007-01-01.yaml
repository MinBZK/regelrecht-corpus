        artikel: '2'
        hoofdstuk: '2'
  - number: 12.3.36.4
    text: |-
      Voor de periode van 1 januari 1997 tot en met 31 juli 1997 heeft een instelling die een opleiding deeltijds
      middelbaar beroepsonderwijs verzorgt, voor die opleiding aanspraak op bekostiging uit ’s Rijks kas ter grootte
      van 7/12 van het bedrag dat de desbetreffende instelling over het kalenderjaar 1996 bij of krachtens de Kaderwet
      Volwasseneneducatie 1991 en de Wet op het cursorisch beroepsonderwijs als bekostiging voor die opleiding heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.36
  - number: 12.3.36.5
    text: 'De aanspraak, bedoeld in het eerste lid, geldt:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.36
  - number: 12.3.36.5.a
    text: |-
      wat opleidingen basiseducatie en opleidingen voortgezet algemeen volwassenenonderwijs betreft, jegens de
      gemeentebesturen, en, voor zover het huisvestingskosten betreft, jegens Onze Minister, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.36
  - number: 12.3.36.5.b
    text: |-
      wat opleidingen deeltijds middelbaar beroepsonderwijs en opleidingen specifieke scholing betreft, jegens het Rijk
      en jegens de Arbeidsvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.36
  - number: 12.3.37.1
    text: |-
      Voor de periode van 1 augustus 1997 tot en met 31 december 1997, voor het jaar 1998 en voor het jaar 1999 wordt de
      rijksbijdrage voor het beroepsonderwijs ten behoeve van een instelling, in afwijking van de [artikelen 2.2.1][ref1]
      en [2.2.2][ref2], telkens vastgesteld op de hoogte of op het overeenkomstige gedeelte van de hoogte van de
      rijksbijdrage waarop die instelling overeenkomstig de op 31 december 1995 geldende voorschriften aanspraak zou
      hebben voor het jaar 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.37
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.3.37.2
    text: |-
      De voor de in het eerste lid bedoelde periode en jaren vastgestelde rijksbijdrage kan volgens bij ministeriële
      regeling te geven voorschriften worden verhoogd of verlaagd in verband met:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.37
  - number: 12.3.37.2.a
    text: de door de begrotingswetgever beschikbaar gestelde middelen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.37
  - number: 12.3.37.2.b
    text: wijziging van het aantal deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.37
  - number: 12.3.37.2.c
    text: |-
      maatregelen van overgangsrechtelijke of invoeringsrechtelijke aard die zijn getroffen bij of krachtens deze wet of
      die verband houden met de in [artikel 12.1.2][ref1] bedoelde wetten en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.37
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.43
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van de
      [artikelen 12.3.36][ref1] en [12.3.37][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.43
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.44
    text: |-
      De op 31 december 1995 geldende voorschriften vastgesteld bij of krachtens de
      [Wet op het voortgezet onderwijs][ref1], de Wet op het cursorisch beroepsonderwijs of de Kaderwet
      Volwasseneneducatie 1991 blijven van toepassing ten aanzien van bedragen waarop de instellingen, de agrarische
      innovatie- en praktijkcentra en de kenniscentra beroepsonderwijs bedrijfsleven voor 1 januari 1996 ingevolge de
      bedoelde voorschriften aanspraak hebben, maar die nog niet zijn vastgesteld of uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.44
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 12.3.48.1
    text: |-
      Bij ministeriële regeling worden regels vastgesteld of kunnen regels worden vastgesteld ten aanzien van onderwerpen
      waarvan deze wet bepaalt dat zij bij of krachtens algemene maatregel van bestuur worden onderscheidenlijk
      kunnen worden geregeld. De in de eerste volzin bedoelde regels vervallen met ingang van het tijdstip waarop de
      desbetreffende algemene maatregel van bestuur in werking treedt, doch uiterlijk twaalf maanden na het tijdstip
      waarop de bepaling waarop de algemene maatregel van bestuur berust, in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.48
  - number: 12.3.48.2
    text: |-
      Voor zover deze wet daarin niet voorziet, alsmede indien nodig in afwijking van het bij en krachtens deze wet
      bepaalde, worden bij ministeriële regeling regels vastgesteld ten behoeve van een goede invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.48
  - number: 12.3.48.3
    text: |-
      Onze Minister kan, al dan niet op aanvraag van het bevoegd gezag, volgens bij ministeriële regeling te geven
      regels, de met inachtneming van hoofdstuk 12 vastgestelde vergoedingen aanvullen met een bedrag ten behoeve van de
      goede gang van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.48
  - number: 12.5.1
    text: |-
      Onze Minister brengt voor 1 januari 2002 verslag uit over de werking van deze wet aan de beide Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.5.1
  - number: 12.5.2
    text: 'Deze wet treedt in werking met ingang van 1 januari 1996, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.5.2
  - number: 12.5.2.a
    text: |-
      [artikel 7.4.11][ref1], wat de examens van de opleidingen Nederlands als tweede taal I en II betreft, welk artikel
      ten aanzien van die examens in werking treedt met ingang van een bij koninklijk besluit te bepalen tijdstip;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
