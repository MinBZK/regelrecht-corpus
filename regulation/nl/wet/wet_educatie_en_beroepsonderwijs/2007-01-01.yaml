    text: |-
      deelnemers aan een opleiding die op basis van [artikel 12.1a.1, eerste lid][ref1], voor bekostiging in aanmerking
      is gebracht, onverminderd de overige eisen kunnen worden meegeteld voor de berekening van de rijksbijdrage als zij
      op de desbetreffende teldatum waren ingeschreven voor die opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1a.5
