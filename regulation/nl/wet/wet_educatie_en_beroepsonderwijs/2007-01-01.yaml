        hoofdstuk: '6'
  - number: 6.1.5a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5a
  - number: 6.1.5a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5a
  - number: 6.1.5b.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in artikel 7.4.4. Bij de
      ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in het
      Centraal register bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5b
  - number: 6.1.5b.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5b
  - number: 6.1.5b.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. Artikel 1.6.1 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5b
  - number: 6.1.6.1
    text: |-
      Onze Minister kan ten aanzien van een beroepsopleiding, verzorgd door een instelling ten aanzien waarvan Onze
      Minister in de vier jaren voorafgaand aan de aanmelding voor registratie voor die opleiding toepassing heeft
      gegeven aan [artikel 6.1.4, eerste lid, onder a of onder b][ref1], de rechten, genoemd in [artikel 1.3.1][ref2],
      onthouden wanneer naar het oordeel van Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.6
