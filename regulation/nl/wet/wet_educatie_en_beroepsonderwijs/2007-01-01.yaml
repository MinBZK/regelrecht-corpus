        bwb_id: BWBR0017157
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.1a.4
    text: |-
      Onze Minister zendt voor 1 oktober 2007 aan de Tweede Kamer der Staten-Generaal een door een onafhankelijke
      organisatie op te stellen verslag over de doeltreffendheid en de effecten van de opleidingen, bedoeld in de
      [artikelen 12.1a.1 tot en met 12.1a.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
