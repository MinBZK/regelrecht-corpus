        hoofdstuk: '12'
  - number: 12.3.36.2
    text: |-
      Ten aanzien van deelnemers als bedoeld in [artikel 12.3.23, tweede lid][ref1], heeft het bevoegd gezag aanspraak
      op bekostiging uit ’s Rijks kas, berekend overeenkomstig de op 31 december 1995 geldende voorschriften gedurende de
      in [artikel 12.3.23, tweede lid][ref2], bedoelde periode waarin de in dat lid bedoelde voorschriften van toepassing
      blijven. De eerste volzin is van overeenkomstige toepassing op deelnemers aan opleidingen en afdelingen als bedoeld
      in [artikel 12.3.25][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.36
