    text: |-
      Indien een instelling als bedoeld in de [Wet op de erkende onderwijsinstellingen][ref1] cursisten die op 31 juli
      1997 bij de instelling een cursus volgen waarover met ingang van 1 augustus 1997 de erkenning zich als gevolg
      van [artikel 12.4.9][ref2] niet langer uitstrekt en ten aanzien van deze cursus evenmin met ingang van 1 augustus
      1997 aan deze instelling het in [artikel 1.4.1, eerste lid][ref3], bedoelde recht is toegekend dan wel dit
      recht wel is toegekend maar ten aanzien van deze cursus met ingang van 1 augustus 1997 niet langer aanspraak op
      studiefinanciering bestaat,, in de gelegenheid stelt die cursus binnen een redelijke tijd gerekend vanaf die datum
      te voltooien, en deze cursisten op 31 juli 1997 ten behoeve van die cursus aanspraak hebben op studiefinanciering
      ingevolge de Wet op de studiefinanciering zoals luidend op dat tijdstip, strekken de in [artikel 12.4.2][ref4]
      opgenomen wijzigingen van de [artikelen 9][ref5] en [11 van de Wet op de studiefinanciering][ref6] niet ten nadele
      van deze cursisten, zolang zij de cursus waarop deze aanspraak betrekking heeft, zonder onderbreking voortzetten.
      De eerste volzin is van toepassing tot en met 31 juli 2000.


