  - number: 12.1a.2.2
    text: |-
      [Artikel 1.4.1, tweede tot en met vijfde lid][ref1], en [artikel 12.1a.1, tweede en derde lid][ref2], zijn van
      overeenkomstige toepassing op de aanvragen, bedoeld in het eerste lid. In aanvulling op de gegevens, bedoeld
      in [artikel 12.1a.1, tweede lid][ref3], verschaft het bevoegd gezag van een niet uit ’s Rijks kas bekostigde
      instelling bij de aanvraag tevens de gegevens waaruit blijkt dat het onderwijs van voldoende kwaliteit is of zal
      zijn en dat wordt voldaan aan de voorschriften, bedoeld in [artikel 1.4.1, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
