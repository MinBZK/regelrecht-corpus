  - number: '10.2'
    text: |-
      Indien de uitspraak op een beroep als bedoeld in [artikel 10.1][ref1] strekt tot onderscheidenlijk het toekennen
      van de rechten, genoemd in [artikel 1.3.1][ref2], diploma-erkenning als bedoeld in de [artikelen 1.4.1][ref3]
      of [1.4a.1][ref4], examinering als bedoeld in [artikel 1.6.1][ref5], of registratie in het Centraal register,
      treden de gevolgen daarvan in met ingang van het studiejaar dat aanvangt in het jaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 11.1.1
    text: |-
      Indien het bevoegd gezag van een instelling, een agrarisch innovatie- en praktijkcentrum of een kenniscentrum
      beroepsonderwijs bedrijfsleven in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze Minister
      bepalen dat de rijksbijdrage, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.1
  - number: 11.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een instelling in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 11.1.3
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het eerste
      of tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.1
  - number: 11.2.1
    text: |-
      Het is anderen dan de instellingen die daartoe ingevolge deze wet gerechtigd zijn, verboden onderwijs aan te
      bieden of te verzorgen, dan wel examinering te verzorgen, onder de naam van een in het Centraal register opgenomen
      beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.2
  - number: 11.2.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.2
  - number: 11.2.3
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.2
  - number: 11.3.1
    text: |-
      Indien de gemeente de gegevens, bedoeld in artikel 2.3.6, dan wel de verantwoording, bedoeld in artikel 2.5.9a,
      eerste lid, binnen de bij of krachtens die artikelen vastgestelde termijnen niet of niet volledig heeft verstrekt,
      kan Onze Minister besluiten de betaling van de rijksbijdrage, bedoeld in artikel 2.3.1, eerste lid, voorschotten
      daaronder begrepen, geheel of gedeeltelijk op te schorten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.3
  - number: 11.3.2
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen indien hem blijkt dat de reden voor de toepassing van het
      eerste lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.3
  - number: 11.4.1
    text: |-
      Onze Minister kan de rijksbijdrage per gemeente, bedoeld in artikel 2.3.1, eerste lid, binnen een periode van vijf
      jaren na de vaststelling op de volgende gronden intrekken of ten nadele van de gemeente wijzigen:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.4
  - number: 11.4.1.a
    text: |-
      handelen in strijd met wettelijke voorschriften dan wel met aan de rijksbijdrage op grond van wettelijke regels
      verbonden verplichtingen of voorwaarden;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.4
  - number: 11.4.1.b
    text: |-
      handelen in strijd met het controleprotocol, bedoeld in artikel 2.5.9a, tweede lid, of met de doelstelling van de
      educatie, bedoeld in artikel 1.2.1, eerste lid;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.4
  - number: 11.4.1.c
    text: indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.4
  - number: 11.4.2
    text: |-
      Onze Minister kan een uit het eerste lid volgende vordering op een gemeente verrekenen met de betaling aan die
      gemeente, voortvloeiend uit een in een later jaar toegekende rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel11.4
  - number: 12.1.1
    text: 'Met ingang van 1 januari 1996 worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.1
  - number: 12.1.1.a
    text: het Besluit vormingswerk voor jeugdigen 1994,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.1
  - number: 12.1.1.b
    text: |-
      het besluit van 21 februari 1994, houdende aanwijzing van Innovatie- en praktijkcentra op grond van artikel 61 van
      de Wet op het voortgezet onderwijs (*Stb.* 1994, 191), en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.1
  - number: 12.1.1.c
    text: het Besluit bekostiging Innovatie- en praktijkcentra.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.1
  - number: 12.1.2.1
    text: |-
      Indien dat voor een goede uitvoering van deze wet noodzakelijk is, kan bij algemene maatregel van bestuur worden
      afgeweken van de ingetrokken of vervallen wetten die ingevolge dit hoofdstuk van toepassing blijven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.2
  - number: 12.1.2.2
    text: |-
      Van de ingetrokken of vervallen voorschriften die bij algemene maatregel van bestuur of ministeriële regeling zijn
      vastgesteld en die ingevolge dit hoofdstuk van toepassing blijven, kan worden afgeweken bij algemene maatregel van
      bestuur respectievelijk ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1.2
  - number: 12.1a.1.1
    text: |-
      Met het oog op de ontwikkeling van nieuwe kwalificaties en de daarop gerichte opleidingen kan Onze Minister op
      aanvraag van het bevoegd gezag van een instelling als bedoeld in [artikel 1.1.1, onderdeel b][ref1], een instituut
      als bedoeld in [artikel 12.3.8][ref2] of een hogeschool als bedoeld in [artikel 12.3.9][ref3] besluiten dat een
      beroepsopleiding waarvoor de eindtermen worden voorbereid of met toepassing van [artikel 7.2.4, lid 3a][ref4], of
      [artikel 17 van de Regeling subsidiëring proeftuinen herontwerp beroepsonderwijs studiejaar 2004–2005][ref5]
      zijn vastgesteld, voor bekostiging overeenkomstig [hoofdstuk 2, titel 2, paragraaf 1][ref6] in aanmerking komt.
      Onze Minister bepaalt de aanvang en het einde van de bekostiging en de aanvullende voorwaarden voor bekostiging,
      die in elk geval betrekking hebben op de regeling die de instelling treft om de belangen van de deelnemers te
      waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0017157#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1a.1
    references:
      - id: ref1
