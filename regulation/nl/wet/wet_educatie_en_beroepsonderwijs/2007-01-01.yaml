  - number: 6.4.1.1
    text: |-
      Het Centraal register beroepsopleidingen is een systematisch geordende verzameling gegevens met betrekking tot de
      beroepsopleidingen die door de instellingen en de andere instellingen, bedoeld in [artikel 1.4.1][ref1], worden
      verzorgd alsmede met betrekking tot de examinering die door de exameninstellingen wordt verzorgd. Onze Minister
      is belast met de aanleg, het beheer en de bekendmaking van het register en met het verstrekken van informatie uit
      het register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.4.1.2
    text: |-
      Het Centraal register wordt jaarlijks voor 1 mei bekendgemaakt. Van deze bekendmaking wordt mededeling gedaan in de
      *Staatscourant*. Het register heeft betrekking op het studiejaar dat aanvangt in datzelfde jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.3
    text: |-
      Onze Minister stelt de inrichting van het Centraal register vast. Onze Minister stelt de kenniscentra
      beroepsonderwijs bedrijfsleven in de gelegenheid, hem een voorstel te doen voor de indeling van het Centraal
      register.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het verstrekken van informatie
      uit het Centraal register. Daarbij kan worden bepaald dat voor het verstrekken van informatie aan anderen
      dan het Kwaliteitscentrum examinering beroepsopleidingen en de bevoegde gezagsorganen van de instellingen en
      exameninstellingen waarop deze wet betrekking heeft, een vergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.5
    text: 'Het Centraal register bevat van elke beroepsopleiding de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.5.a
    text: |-
      de naam van de opleiding, de leerweg of leerwegen waarin de opleiding wordt verzorgd, de code waarmee het geheel
      van de eindtermen van de opleiding wordt aangeduid, de code waarmee de deelkwalificaties van de opleiding worden
      aangeduid,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.5.b
    text: |-
      of de opleiding is vermeld in het overzicht, bedoeld in [artikel 2.1.1, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.4.1.5.c
    text: de studielast, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.5.d
    text: |-
      of het een opleiding betreft die is gericht op een bepaald beroep waarvoor bij of krachtens de wet vereisten zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.6
    text: 'Het Centraal register bevat voorts de volgende gegevens, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.6.a
    text: de namen van de instellingen die de opleiding verzorgen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.6.b
    text: de namen van de exameninstellingen die het recht hebben tot examinering van een beroepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.6.c
    text: |-
      de waarschuwing, bedoeld in [artikel 6.1.5, eerste lid][ref1], [artikel 6.2.3, eerste lid][ref2], of
      [artikel 6.3.3, eerste lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.1.6.d
    text: de bepaling dat het recht op examinering is ontnomen, en met ingang van welk tijdstip, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.1.6.e
    text: de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.1
  - number: 6.4.2.1
    text: |-
      Het bevoegd gezag meldt elke beroepsopleiding met de verzorging waarvan de instelling voornemens is een aanvang te
      maken, voor registratie in het Centraal register aan.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
  - number: 6.4.2.2
    text: |-
      De aanmelding geschiedt voor 1 december voorafgaand aan het studiejaar met ingang waarvan een aanvang gemaakt zal
      worden met de opleiding, onder vermelding van de gegevens, bedoeld in [artikel 6.4.1, vijfde lid, onder a][ref1],
      behalve wat de gegevens over deelkwalificaties betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.3
    text: |-
      Onze Minister registreert de opleiding overeenkomstig de door het bevoegd gezag overgelegde gegevens binnen drie
      maanden in het Centraal register en doet de commissie, bedoeld in [artikel 6.1.2][ref1], daarvan mededeling. Indien
      registratie binnen deze termijn niet mogelijk is, stelt Onze Minister het bevoegd gezag daarvan in kennis en noemt
      daarbij een redelijke termijn waarbinnen registratie wel mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.4
    text: |-
      Onverminderd de [artikelen 6.1.3][ref1], [6.1.4][ref2] en [6.1.6][ref3] weigert Onze Minister registratie in het
      Centraal register uitsluitend indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.4.a
    text: hij de gegevens niet tijdig of niet volledig heeft ontvangen, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
  - number: 6.4.2.4.b
    text: |-
      hij de aanvraag, bedoeld in [artikel 6.2.1, eerste lid][ref1], afwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.5
    text: |-
      Onze Minister kan toestaan dat in spoedeisende gevallen in het belang van de deelnemers wordt afgeweken van de
      termijnen in de voorgaande leden, indien het een opleiding betreft:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
  - number: 6.4.2.5.a
    text: |-
      die door een instelling waaronder in dit onderdeel mede wordt begrepen een instelling als bedoeld in
      [artikel 1.4.1][ref1], niet meer kan worden verzorgd, waarvan de deelnemers redelijkerwijs niet kunnen worden
      ingeschreven aan een andere instelling die deze opleiding verzorgt, en die wordt aangemeld voor registratie in het
      Centraal register door het bevoegd gezag van een andere instelling, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.4.2.5.b
    text: |-
      waarvoor Onze Minister toepassing heeft gegeven aan [artikel 7.2.4, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.4.2.6
    text: |-
      Het tweede tot en met vijfde lid zijn van overeenkomstige toepassing op de registratie van de examinering door
      exameninstellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
  - number: 6.4.2.6a
    text: |-
      Het eerste tot en met zesde lid zijn niet van toepassing op de aanmelding van de opleidingen, bedoeld in
      [artikel 12.1a.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 6.4.3
    text: |-
      Indien de aanmelding voor registratie betrekking heeft op een opleiding, verzorgd door een instelling ten
      aanzien waarvan Onze Minister in de vier jaren voorafgaand aan de aanmelding voor die opleiding toepassing
      heeft gegeven aan [artikel 6.1.4][ref1], verschaft het bevoegd gezag in aanvulling op de gegevens, bedoeld in
      [artikel 6.4.1, vijfde lid, onder a][ref2], gegevens waaruit blijkt dat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.3.a
    text: het onderwijs van voldoende kwaliteit is, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.3
  - number: 6.4.3.b
    text: |-
      wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg, het onderwijs en
      de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.3
  - number: 6.4.4.1
    text: |-
      Onverminderd de [artikelen 6.1.4][ref1] en [6.2.2][ref2] beëindigt Onze Minister de registratie van een opleiding
      indien het bevoegd gezag te kennen geeft dat de instelling de opleiding niet langer zal verzorgen. Onverminderd
      [artikel 6.3.2][ref3] beëindigt Onze Minister de registratie van de examinering van een bepaalde beroepsopleiding,
      met ingang van het tijdstip waarop de examinering niet meer plaatsvindt, indien het bevoegd gezag te kennen geeft
      dat de exameninstelling die examinering niet langer zal verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.4.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt voor 1 oktober van het jaar voorafgaand aan het eerste
      studiejaar waarin de inschrijving voor de opleiding niet meer openstaat.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.4
  - number: 6.4.4.3
    text: |-
      Onze Minister beëindigt de registratie ambtshalve wanneer de instelling de opleiding niet langer verzorgt en het
      bevoegd gezag de kennisgeving, bedoeld in het eerste lid, niet of niet tijdig doet.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.4
  - number: 6.4.4.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de registratie van de examinering door
      exameninstellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.4.4
  - number: 6a.1.1.1
    text: |-
      Onze Minister maakt jaarlijks voor de aanvang van het studiejaar bekend welke instellingen, bedoeld in
      [artikel 1.4a.1, eerste lid][ref1], voor welke opleidingen rechten hebben als bedoeld in dat lid. Deze bekendmaking
      vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.1.1.a
    text: de naam van de instelling en van de opleiding die de instelling verzorgt,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.1
  - number: 6a.1.1.1.b
    text: |-
      in voorkomende gevallen, een waarschuwing als bedoeld in [artikel 6a.1.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.1.1.c
    text: in voorkomende gevallen, de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.1
  - number: 6a.1.1.2
    text: |-
      Als peildatum voor de gegevens, bedoeld in het eerste lid, hanteert Onze Minister 1 juni voorafgaand aan de
      bekendmaking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.1
  - number: 6a.1.2.1
    text: |-
      Onze Minister kan ten aanzien van een opleiding educatie, verzorgd door een instelling als bedoeld in
      [artikel 1.4a.1][ref1], het recht, bedoeld in het eerste lid van dat artikel, ontnemen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.1.a
    text: |-
      gebleken is dat de kwaliteit van een of meer examens of een of meer onderdelen van een examen van die opleiding
      onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.2
  - number: 6a.1.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarden, bedoeld in [artikel 1.4a.1, eerste lid][ref1], of aan de
      voorwaarde, bedoeld in [artikel 1.4a.1, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6a.1.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder a][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van een of
      meer examens of een of meer onderdelen van een examen van die opleiding. Onze Minister geeft eerst toepassing aan
      [artikel 6a.1.2, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.3.1.a
    text: na de waarschuwing ten minste een jaar is verstreken, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.3
  - number: 6a.1.3.1.b
    text: |-
      Onze Minister aan de hand van een hernieuwd onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.3
  - number: 6a.1.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.4
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1][ref1], langer dan een studiejaar een
      opleiding educatie niet heeft verzorgd, vervalt van rechtswege het recht om voor de desbetreffende opleiding een
      diploma of certificaat als bedoeld in [artikel 1.4a.1, eerste lid][ref2], uit te reiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.1.1
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. Onverminderd
      [artikel 7.3.4, derde lid][ref1], kan een andere taal worden gebezigd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.1.1.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.1
  - number: 7.1.1.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.1
  - number: 7.1.2.1
    text: |-
      De instelling biedt het onderwijs aan in de vorm van opleidingen. Voor zover het een beroepsopleiding betreft,
      wordt deze opleiding door de instelling in het maatschappelijk verkeer aangeduid met de naam waaronder deze
      opleiding is vermeld in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.2
  - number: 7.1.2.2
    text: |-
      Een opleiding is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking van eindtermen
      dan wel gericht op het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van een dergelijk diploma.
      Een of meer onderwijseenheden van een beroepsopleiding leiden tot een deelkwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.1.2.3
    text: |-
      Elke opleiding wordt afgesloten met een examen. Elke onderwijseenheid die, onderscheidenlijk elk samenstel van
      onderwijseenheden dat leidt tot een deelkwalificatie als bedoeld in [artikel 7.2.3][ref1], wordt afgesloten met
      een toets.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.1.3
    text: |-
      Eindtermen zijn als zodanig omschreven kwaliteiten op het gebied van kennis, inzicht, vaardigheden en
      in voorkomende gevallen beroepshoudingen, waarover degene die de opleiding voltooit, met het oog op het
      maatschappelijk en beroepsmatig functioneren dient te beschikken, en die in voorkomende gevallen betekenis hebben
      voor de doorstroming naar vervolgonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.3
  - number: 7.1.4.1
    text: |-
      Bij het geven van onderwijs aan een deelnemer van een beroepsopleiding die bij de aanvang van die opleiding
      leerplichtig was en die is opgenomen in een ziekenhuis of die in verband met ziekte thuis verblijft, kan het
      bevoegd gezag van een instelling die de beroepsopleiding verzorgt, worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
  - number: 7.1.4.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
  - number: 7.1.4.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de
      deelnemer is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 7.1.4.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] indien de deelnemer is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de deelnemer in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: 7.1.4.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de instelling waarbij de deelnemer is ingeschreven, mede het geven van onderwijs aan de
      deelnemer betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
  - number: 7.1.4.4
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
  - number: 7.1.4.5
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, zijn de
      schoolbegeleidingsdiensten die voor de ondersteuning bij het onderwijs aan zieke leerlingen, in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010086
        artikel: IX
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.1
  - number: 7.2.2.1
    text: 'De volgende beroepsopleidingen worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.a
    text: de assistentopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.b
    text: de basisberoepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.c
    text: de vakopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.d
    text: de middenkaderopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.e
    text: de specialistenopleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.1.f
    text: andere opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.2
    text: 'De in het eerste lid bedoelde opleidingen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.2.a
    text: |-
      een beroepsopleidende leerweg, omvattend een praktijkdeel van ten minste 20% en minder dan 60% van de studieduur,
      of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.2.b
    text: een beroepsbegeleidende leerweg, omvattend een praktijkdeel van 60% of meer van de studieduur, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.2.c
    text: zowel de onder *a* als de onder *b* bedoelde leerweg.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.3
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder *a* tot en met *e*, richten zich op de kwalificatie voor
      opeenvolgende niveaus van beroepsuitoefening, waarbij de assistentopleiding is gericht op het eerste en de
      middenkaderopleiding en de specialistenopleiding op het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.2.4
    text: |-
      Aan de in het eerste lid bedoelde opleidingen kunnen ten behoeve van individuele deelnemers voorbereidende
      en ondersteunende activiteiten worden toegevoegd ter bevordering van het kunnen instromen in en met gunstig
      gevolg voltooien van de opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en
      ondersteunende activiteiten zijn bestemd voor deelnemers wier vooropleiding naar het oordeel van het bevoegd gezag
      onvoldoende uitzicht biedt op verwezenlijking van de eindtermen van de opleiding binnen redelijke tijd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.2
  - number: 7.2.3
    text: |-
      Eindtermen voor beroepsopleidingen zijn onderverdeeld in deelkwalificaties. Een deelkwalificatie is een combinatie
      van eindtermen, vastgesteld voor een bepaalde beroepsopleiding, die in het licht van de uitoefening van het beroep
      waarop de opleiding is gericht een zelfstandige betekenis hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.3
  - number: 7.2.4.1
    text: |-
      Met het oog op de totstandkoming van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen
      het aanbod van het beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de
      arbeidsmarktperspectieven voor afgestudeerden, draagt Onze Minister, in voorkomende gevallen in overeenstemming
      met Onze Minister wie het, gezien de aard van de in [artikel 7.2.6][ref1] bedoelde vereisten, mede aangaat,
      zorg voor het vaststellen en onderhouden van een samenhangend en gedifferentieerd geheel van eindtermen voor
      beroepsopleidingen die voor de desbetreffende bedrijfstakken of beroepencategorieën van betekenis zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2
    text: 'Daartoe worden bij ministeriële regeling per beroepsopleiding vóór 1 september vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.2.a
    text: de eindtermen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.2.b
    text: de indeling daarvan in deelkwalificaties,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.2.c
    text: welke deelkwalificaties verplicht zijn voor het behalen van het diploma van de desbetreffende beroepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.2.d
    text: de hoogte van de studielast, met inachtneming van het negende lid,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.2.e
    text: |-
      welk van de soorten opleidingen, bedoeld in [artikel 7.2.2, eerste lid][ref1], het betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.f
    text: |-
      in welke leerwegen, bedoeld in [artikel 7.2.2, tweede lid][ref1], de opleiding verzorgd wordt, en, voor zover
      mogelijk


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.g
    text: het beroep of de beroepencategorie op de voorbereiding waarvan de beroepsopleiding is gericht.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.3
    text: |-
      Onze Minister stelt de in het tweede lid bedoelde ministeriële regeling vast op voorstel van het desbetreffende
      kenniscentrum beroepsonderwijs bedrijfsleven. Het kenniscentrum beroepsonderwijs bedrijfsleven doet een dergelijk
      voorstel telkens vóór 1 juni en neemt daarbij het tweede lid in acht.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.3a
    text: |-
      Met het oog op de ontwikkeling van nieuwe kwalificaties kunnen met afwijking van de termijnen, bedoeld in het
      tweede en derde lid, eindtermen tot stand worden gebracht.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.4
    text: 'Bij het voorstel voor de eindtermen voegt het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.4.a
    text: |-
      het advies van de commissie, bedoeld in [artikel 6.1.2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.2.4.4.b
    text: |-
      het voorstel, bedoeld in [artikel 1.5.2, tweede lid][ref1]. Uit het voorstel blijkt dat het bestuur van het
      kenniscentrum beroepsonderwijs bedrijfsleven voldoende acht heeft geslagen op de aansluiting tussen de opleidingen
      voorbereidend beroepsonderwijs, de opleidingen middelbaar algemeen voortgezet onderwijs, de beroepsopleidingen
      en de opleidingen hoger beroepsonderwijs, in elk geval door raadpleging van vertegenwoordigers van die
      onderwijsvelden. Indien ook andere instanties nauw bij het voorstel voor de eindtermen zijn betrokken, maakt het
      bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven in zijn voorstel melding van de wijze waarop het
      oordeel van die instanties is betrokken in het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.2.4.5
    text: |-
      Indien het in het derde en vierde lid een kenniscentrum beroepsonderwijs bedrijfsleven betreft waarvan de
      samenstelling van het bestuur voldoet aan [artikel 9.2.1, tweede lid, onder b][ref1], wordt het voorstel gedaan
      door de commissie onderwijs-bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.2.4.6
    text: |-
      De eindtermen hebben betrekking op opleidingen met de verzorging waarvan de instellingen in het studiejaar na het
      jaar van de vaststelling een aanvang kunnen maken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.7
    text: |-
      In bijzondere gevallen, verband houdend met de gebleken dringende maatschappelijke behoefte aan een
      beroepsopleiding, kan Onze Minister bij de vaststelling van de eindtermen voor die opleiding in afwijking
      van het zesde lid beslissen dat deze eindtermen betrekking hebben op opleidingen met de verzorging waarvan de
      instellingen reeds kunnen beginnen in het studiejaar dat aanvangt in het jaar van die vaststelling. De dringende
      maatschappelijke behoefte blijkt in ieder geval uit een advies van de commissie, bedoeld in [artikel 6.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.2.4.8
    text: |-
      Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de studielast. De studieduur kan
      verschillen voor onderscheiden deelnemers of groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9
    text: |-
      De studielast van elke opleiding wordt uitgedrukt in normatieve studiejaren. Een normatief studiejaar telt veertig
      weken van elk veertig uren studie, daaronder mede begrepen het onderricht in de praktijk. De studielast bedraagt
      voor de onderscheiden in [artikel 7.2.2, eerste lid, onder a tot en met f][ref1], bedoelde opleidingen het volgende
      aantal normatieve studiejaren of het volgende gedeelte daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.9.a
    text: ten minste een half jaar en ten hoogste 1 jaar,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9.b
    text: ten minste 2 en ten hoogste 3 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9.c
    text: ten minste 2 en ten hoogste 4 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9.d
    text: ten minste 3 en ten hoogste 4 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9.e
    text: ten minste 1 jaar en ten hoogste 2 jaren, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.9.f
    text: ten minste 15 weken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.4.10
    text: Dit artikel is van overeenkomstige toepassing bij wijzigingen van de eindtermen en de indeling daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      De in [artikel 6.1.2, eerste lid, onder b][ref1], bedoelde taak van de in dat artikel bedoelde commissie behelst de
      advisering aan de kenniscentra beroepsonderwijs bedrijfsleven onderscheidenlijk commissies onderwijs-bedrijfsleven
      over de in [artikel 7.2.4, eerste lid][ref2], bedoelde voorstellen voor de eindtermen. De advisering heeft in
      elk geval betrekking op de vraag of en in hoeverre deze voorstellen bijdragen aan de totstandkoming van een
      kwalificatiestructuur als bedoeld in [artikel 7.2.4, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6
    text: |-
      Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke organisatie,
      vereisten zijn vastgesteld over de kwaliteiten op het gebied van kennis, inzicht, vaardigheden of beroepshoudingen
      waarover degenen die een opleiding gericht op dat beroep voltooien, moeten beschikken, of over de examinering bij
      de desbetreffende beroepsopleiding:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.6
  - number: 7.2.6.a
    text: |-
      neemt Onze Minister deze vereisten in acht bij de vaststelling van de eindtermen en bij de vaststelling van de
      standaarden, bedoeld in [artikel 7.4.4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.6.b
    text: |-
      draagt de instelling er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding volgen,
      ten minste in de gelegenheid zijn aan die vereisten te voldoen, en dat bij de examinering, zo nodig in afwijking
      van [titel 4 van dit hoofdstuk][ref1], aan die vereisten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '4'
  - number: 7.2.7
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de opleidingen zodanig zijn ingericht dat de deelnemers de eindtermen
      binnen de vastgestelde studieduur kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.7
  - number: 7.2.8.1
    text: Van elke beroepsopleiding maakt onderricht in de praktijk van het beroep deel uit.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst, gesloten door de in
      [artikel 7.2.9][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen van partijen en omvat
      met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste bepalingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.2.a
    text: |-
      de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het aantal te volgen praktijkuren per
      kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.8.2.b
    text: de begeleiding van de deelnemer,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.8.2.c
    text: |-
      dat deel van de eindtermen dat de deelnemer tijdens de praktijkperiode dient te realiseren en de beoordeling
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.8.2.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de deelnemers binnen het bedrijf. Het bevoegd gezag beoordeelt of de deelnemer het in het tweede lid, onder *c*,
      bedoelde deel van de eindtermen heeft gerealiseerd. Het bevoegd gezag betrekt bij die beoordeling het oordeel
      van het bedrijf onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en
      examenregeling op te nemen regels.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.8
  - number: 7.2.9.1
    text: |-
      Het bevoegd gezag van de instelling draagt zorg voor de totstandkoming van de in [artikel 7.2.8][ref1] bedoelde
      overeenkomst. De overeenkomst wordt gesloten door de instelling, de deelnemer en het bedrijf dat of de organisatie
      die de beroepspraktijkvorming verzorgt. De overeenkomst wordt voor zover het de beroepsbegeleidende leerweg
      betreft, mede ondertekend door het bestuur van het desbetreffende kenniscentrum beroepsonderwijs bedrijfsleven, dat
      daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.a
    text: |-
      dat het een bedrijf of organisatie betreft met een gunstige beoordeling als bedoeld in [artikel 7.2.10][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.b
    text: dat de gronden voor deze gunstige beoordeling nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.9
  - number: 7.2.9.2
    text: |-
      Indien het bevoegd gezag en het betrokken kenniscentrum beroepsonderwijs bedrijfsleven na het sluiten van de in
      [artikel 7.2.8][ref1] bedoelde overeenkomst vaststellen dat de praktijkplaats niet of niet volledig beschikbaar
      is, de begeleiding tekortschiet of ontbreekt, het bedrijf of de organisatie niet langer beschikt over een
      gunstige beoordeling als bedoeld in het eerste lid, of sprake is van andere omstandigheden die maken dat de
      beroepspraktijkvorming niet naar behoren zal kunnen plaatsvinden, bevordert het bevoegd gezag, na overleg met het
      bestuur van het betrokken kenniscentrum beroepsonderwijs bedrijfsleven, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.10.1
    text: |-
      Het kenniscentrum beroepsonderwijs bedrijfsleven draagt zorg voor een regelmatige beoordeling van bedrijven en
      organisaties die de beroepspraktijkvorming verzorgen, aan de hand van daartoe door dat kenniscentrum vastgestelde
      criteria. In geval van een kenniscentrum beroepsonderwijs bedrijfsleven waarvan de samenstelling van het bestuur
      voldoet aan [artikel 9.2.1, tweede lid, onder b][ref1], worden deze criteria vastgesteld op voorstel van de
      commissie onderwijs-bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.2.10.2
    text: |-
      Het kenniscentrum beroepsonderwijs bedrijfsleven maakt de in het eerste lid bedoelde criteria bekend. Van deze
      bekendmaking wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.10
  - number: 7.2.10.3
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven dragen gezamenlijk zorg voor openbaarmaking van een overzicht van
      bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.10
  - number: 7.2.10.4
    text: |-
      Tot het verzorgen van de beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend
      bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.2.10
  - number: 7.3.1.1
    text: 'De volgende opleidingen educatie worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.1.a
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van dat diploma,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.3.1.1.b
    text: opleidingen gericht op breed maatschappelijk functioneren,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.1.c
    text: |-
      de opleidingen Nederlands als tweede taal I en II, niveaus B1 en B2 van het Raamwerk NT2, die opleiden voor het
      niveau van het diploma Nederlands als tweede taal, bedoeld in het Staatsexamenbesluit Nederlands als tweede taal,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.1.d
    text: de opleidingen Nederlands als tweede taal, niveaus A1 en A2 van het Raamwerk NT2,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.1.e
    text: de opleidingen Nederlands als tweede taal, gericht op alfabetisering, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.1.f
    text: andere opleidingen, gericht op sociale redzaamheid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
  - number: 7.3.1.2
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder *b*, sluiten aan bij de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2.1
    text: |-
      De opleiding Nederlands als tweede taal I is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c][ref1], door hen voor wie het Nederlands niet de moedertaal is en die ten
      minste het niveau van het primair onderwijs hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2.2
    text: |-
      De opleiding Nederlands als tweede taal II is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het
      Nederlands niet de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het
      niveau van het middenkader.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.2
  - number: 7.3.3.1
    text: Bij ministeriële regeling worden eindtermen vastgesteld voor de opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.3
  - number: 7.3.3.2
    text: |-
      Bij ministeriële regeling kan worden bepaald welke opleidingen in elk geval behoren tot de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b en e][ref1], en kunnen daarvoor eindtermen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3.3
    text: |-
      Het bevoegd gezag stelt eindtermen vast voor de overige opleidingen educatie, met uitzondering van de opleidingen,
      bedoeld in [artikel 7.3.1, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4.1
    text: |-
      Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs, dan wel voor het behalen van onderdelen van het diploma.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het behalen
      van elk der in het eerste lid genoemde diploma’s of onderdelen daarvan noodzakelijke vakken en andere programma-
      onderdelen, en omtrent de cursusduur.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      Ten behoeve van deelnemers met een niet-Nederlandse culturele achtergrond kan onderwijs worden gegeven in de taal
      van het land van oorsprong van die deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.4
  - number: 7.3.4.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.3.4
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.1
  - number: 7.4.2.1
    text: Het bevoegd gezag van een instelling geeft de deelnemers de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.2
  - number: 7.4.2.2
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.2
  - number: 7.4.2.3
    text: |-
      Het examen kan bestaan uit afzonderlijke onderdelen. Het examen van een beroepsopleiding is met gunstig
      gevolg afgelegd indien alle toetsen van die opleiding met gunstig gevolg zijn afgelegd, onverminderd
      [artikel 7.4.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.2.4
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.4.3.1
    text: |-
      Het examen van een beroepsopleiding is niet met gunstig gevolg afgelegd dan na een gunstige beoordeling als bedoeld
      in [artikel 7.2.8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.3.2
    text: Het examen van beroepsopleidingen bestaat uit onderdelen die overeenkomen met de deelkwalificaties.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.3
  - number: 7.4.3.3
    text: |-
      Deelnemers die in het bezit zijn van een certificaat van een andere instelling zijn vrijgesteld van het daarmee
      overeenkomende examenonderdeel.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.3
  - number: 7.4.4
    text: |-
      Bij ministeriële regeling worden landelijke standaarden voor de kwaliteit van de examens van de beroepsopleidingen
      vastgesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.4
  - number: 7.4.4.a
    text: |-
      de inhoud en het niveau van de examens, in relatie tot de eindtermen, bedoeld in [artikel 7.2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.4.b
    text: de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.4
  - number: 7.4.4a.1
    text: |-
      Het bevoegd gezag kan de examinering van een beroepsopleiding overdragen aan een andere instelling als bedoeld
      in [artikel 1.1.1, onder b,][ref1] of [1.4.1][ref2] of aan een exameninstelling, voor zover deze het recht op
      examinering van die beroepsopleiding hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.4a.2
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.1.5b, eerste lid][ref1],
      [6.2.3b, eerste lid][ref2], dan wel [6.3.2, eerste lid][ref3], is het bevoegd gezag voor die beroepsopleiding
      gehouden toepassing te geven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.4.5.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, een examencommissie in ten behoeve van de organisatie en het
      afnemen van de examens voor elke door de instelling verzorgde opleiding of voor groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.5
  - number: 7.4.5.2
    text: Het bevoegd gezag benoemt de leden van de examencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.5
  - number: 7.4.6.1
    text: |-
      Ten bewijze dat een toets of examenonderdeel met goed gevolg is afgelegd, reikt de examencommissie een bewijsstuk
      uit. Indien het examenonderdeel een deelkwalificatie betreft reikt de examencommissie een certificaat uit. Ten
      bewijze dat een examen met goed gevolg is afgelegd reikt de examencommissie een diploma uit. Het examen van
      beroepsopleidingen is eerst dan met goed gevolg afgesloten wanneer zowel de beroepspraktijkvorming als het overige
      deel van het onderricht met goed gevolg zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.6
  - number: 7.4.6.2
    text: 'De bewijsstukken, bedoeld in het eerste lid, vermelden, voorzover zij betrekking hebben op een beroepsopleiding:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.6
  - number: 7.4.6.2.a
    text: |-
      de naam van het kenniscentrum beroepsopleidingen bedrijfsleven op voorstel waarvan de eindtermen van die
      beroepsopleiding zijn vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.6
  - number: 7.4.6.2.b
    text: de naam van de instelling waaraan de deelnemer is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.6
  - number: 7.4.7.1
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het desgevraagd, aan belanghebbenden of aan de
      bevoegde autoriteit, bedoeld in [artikel 8 van de Algemene wet erkenning EG-beroepsopleidingen][ref1], verstrekken
      van op vergelijking van opleidingen berustende waarderingen of vergelijkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '8'
  - number: 7.4.7.1.a
    text: van buitenlandse diploma’s of certificaten als bedoeld in die wet alsmede van andere buitenlandse diploma's, met
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.1.b
    text: de getuigschriften van overeenkomstige Nederlandse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.2
    text: |-
      Bij de vergelijkingen en waarderingen wordt zo mogelijk aangegeven tot welke soort in
      [artikel 7.2.2, eerste lid][ref1], bedoelde beroepsopleiding de desbetreffende opleiding kan worden gerekend
      en met welke in het Centraal register vermelde beroepsopleiding die opleiding vergelijkbaar is of kan worden
      gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.3
    text: 'De vergelijking of waardering wordt slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.3.a
    text: |-
      op verzoek van de autoriteit, bedoeld in [artikel 8 van de in het eerste lid genoemde wet][ref1], ten behoeve van
      aanvragen van EG-verklaringen als bedoeld in [artikel 10 van die wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '10'
  - number: 7.4.7.3.b
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan een
      Nederlandse beroepsopleiding, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.3.c
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan de
      Nederlandse arbeidsmarkt op een niveau dat overeenkomt met een in [artikel 7.2.2][ref1] bedoeld niveau van
      beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.4
    text: |-
      Onze minister kan beleidsregels stellen met het oog op een doelmatige vervulling van de in het eerste lid genoemde
      taken door de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.5
    text: |-
      De rechtspersoon verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak redelijkerwijs
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.6
    text: |-
      Indien naar het oordeel van Onze Minister de rechtspersoon zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder
      getroffen dan nadat de rechtspersoon in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog zijn taak naar behoren uit te voeren. Onze Minister stelt de beide kamers der Staten-Generaal
      onverwijld in kennis van door hem getroffen voorzieningen als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.7.7
    text: |-
      Onze minister verstrekt, onder door hem op te leggen verplichtingen, aan de rechtspersoon jaarlijks uit 's Rijks
      kas middelen ten behoeve van de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.7
  - number: 7.4.8.1
    text: |-
      Het bevoegd gezag stelt voor elke door de instelling verzorgde opleiding een onderwijs- en examenregeling vast. De
      onderwijs- en examenregeling wordt vastgesteld voor 1 mei voorafgaand aan het studiejaar en omvat ten minste:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.a
    text: de onderwijs- en vormingsdoelen, daaronder begrepen de eindtermen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.b
    text: de onderwijseenheden die deel uitmaken van de opleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.c
    text: |-
      de inhoud en inrichting van de opleiding, daaronder begrepen de onderscheiding van de opleiding in leerwegen als
      bedoeld in [artikel 7.2.2, tweede lid][ref1], en de inhoud en inrichting van de beroepspraktijkvorming,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.1.d
    text: de inhoud en, in voorkomende gevallen, de indeling in onderdelen van het examen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.e
    text: |-
      de studieduur van de opleiding en van de daarvan deel uitmakende onderwijseenheden en deelkwalificaties, voor zover
      de studieduur op grond van [artikel 7.2.4][ref1] is vastgesteld voor een groep of voor groepen van deelnemers,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.1.f
    text: |-
      de opleidingstrajecten van een opleiding die voldoen aan de eisen van de [Wet studiefinanciering 2000][ref1] of van
      de [hoofdstukken 3][ref2] en [4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 7.4.8.1.g
    text: |-
      in voorkomende gevallen, de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat
      gelegenheid wordt geboden tot het afleggen van de toetsen, het examen of onderdelen daarvan,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.h
    text: |-
      de wijze waarop de toetsen en het examen of onderdelen daarvan worden afgenomen, daaronder begrepen de wijze
      waarop gehandicapte deelnemers in voorkomende gevallen in de gelegenheid worden gesteld de toetsen en het examen of
      onderdelen daarvan af te leggen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.j
    text: |-
      op welke andere gronden dan genoemd in [artikel 7.4.3, derde lid][ref1], de examencommissie vrijstelling van het
      afleggen van een of meer toetsen en examenonderdelen kan verlenen,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.8.1.k
    text: |-
      waar nodig, dat het met goed gevolg afleggen van een of meer toetsen of examenonderdelen voorwaarde is voor het
      afleggen van andere toetsen of onderdelen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.l
    text: de wijze waarop en de termijn waarbinnen de deelnemer inzage verkrijgt in zijn beoordeelde werk,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.m
    text: de wijze waarop en de termijn waarbinnen kennis genomen kan worden van schriftelijke opgaven, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1.n
    text: de termijn waarbinnen de uitslag van een toets, examenonderdeel en examen bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.1a
    text: |-
      De termijn, bedoeld in de aanhef van het eerste lid, is niet van toepassing op de opleidingen, bedoeld in de
      [artikelen 12.1a.1, eerste lid][ref1], en [12.1a.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 7.4.8.2
    text: |-
      De examencommissie stelt, met inachtneming van de onderwijs- en examenregeling, regels vast met betrekking tot de
      goede gang van zaken tijdens het afnemen van de toetsen, het examen of de examenonderdelen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
  - number: 7.4.8.3
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in [artikel 1.3.2, eerste lid][ref1], die uitgaat van
      verschillende godsdienstige of levensbeschouwelijke overtuigingen, houdt bij de vaststelling van de onderwijs- en
      examenregeling rekening met die verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 7.4.8.4
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 7.4.4a][ref1], dan treedt de
      examenregeling van de instelling of exameninstelling die de examinering verzorgt in de plaats van de examenregeling
      van de instelling die het onderwijs verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.8a.1
    text: |-
      Het bevoegd gezag van een exameninstelling stelt voor elke opleiding waarvoor door de instelling examens mogen
      worden afgenomen een examenregeling vast.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8a
  - number: 7.4.8a.2
    text: |-
      De examenregeling wordt vastgesteld voor 15 april voorafgaand aan het studiejaar. Bij het vaststellen wordt artikel
      7.4.8, eerste lid, onder d, alsmede onder g tot en met n, in acht genomen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8a
  - number: 7.4.8a.3
    text: Artikel 7.4.8, tweede lid, en artikel 7.4.9 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.8a
  - number: 7.4.9
    text: |-
      Het bevoegd gezag maakt tijdig voor de aanvang van het studiejaar en zodanig dat de aanstaande deelnemer zich een
      goed beeld kan vormen van de inhoud en inrichting van het onderwijs en de examens, de onderwijs- en examenregeling
      bekend. De termijn, bedoeld in de vorige volzin, is niet van toepassing op de opleidingen, bedoeld in de
      [artikelen 12.1a.1, eerste lid][ref1], en [12.1a.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 7.4.9a.1
    text: 'Onze Minister wijst een rechtspersoon aan die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
  - number: 7.4.9a.1.a
    text: |-
      het ontwikkelen van voorstellen voor de standaarden, bedoeld in [artikel 7.4.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9a.1.b
    text: |-
      het ingevolge [artikel 7.4.9g][ref1] verrichten van onderzoek naar de kwaliteit van de examinering van
      beroepsopleidingen door instellingen en exameninstellingen aan de hand van de standaarden, bedoeld in
      [artikel 7.4.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1b
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9a.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als Kwaliteitscentrum
      examinering beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
  - number: 7.4.9a.3
    text: |-
      Alvorens standaarden of een wijziging daarvan voor te stellen, voert het Kwaliteitscentrum examinering
      beroepsopleidingen overleg met vertegenwoordigers van het onderwijsveld en van het bedrijfsleven en andere
      betrokkenen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
  - number: 7.4.9a.4
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen verricht het onderzoek, bedoeld in het eerste lid, onderdeel
      b, op zodanige wijze dat instellingen niet meer worden belast dan voor een zorgvuldig onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9a
  - number: 7.4.9b.1
    text: |-
      Onze Minister benoemt de bestuurders van het Kwaliteitscentrum examinering beroepsopleidingen voor ten hoogste
      vijf jaar, gehoord de vertegenwoordigers van de instellingen, bedoeld in de [artikelen 1.1.1, onder b][ref1], en
      [1.4.1][ref2], en van de kenniscentra beroepsopleidingen bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.9b.2
    text: |-
      De statuten van het Kwaliteitscentrum examinering beroepsopleidingen of een wijziging van die statuten behoeven de
      instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9b
  - number: 7.4.9b.3
    text: |-
      Onze Minister kan bij een aanwijzing als bedoeld in [artikel 7.4.9a, eerste lid][ref1], de termijn vaststellen
      waarbinnen voor de eerste keer bestuurders worden voorgedragen of de statuten worden voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.4.9c.1
    text: |-
      Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen, waaronder het intrekken van
      de aanwijzing, bedoeld in [artikel 7.4.9a, eerste lid][ref1], indien het Kwaliteitscentrum examinering
      beroepsopleidingen naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.4.9c.2
    text: |-
      De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het Kwaliteitscentrum
      examinering beroepsopleidingen in de gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn
      alsnog zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9c
  - number: 7.4.9d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent taak,
      samenstelling van het bestuur en werkwijze van het Kwaliteitscentrum examinering beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9d
  - number: 7.4.9d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld op grond waarvan Onze Minister subsidie kan
      verstrekken aan het Kwaliteitscentrum examinering beroepsopleidingen voor de op grond van [artikel 7.4.9a][ref1]
      uit te voeren taken. Bij deze algemene maatregel van bestuur kan voor een subsidie als bedoeld in de eerste volzin
      een subsidieplafond worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.4.9e.1
    text: |-
      Het bestuur van het Kwaliteitscentrum examinering beroepsopleidingen richt een stelsel van kwaliteitszorg in en
      draagt er zorg voor dat wordt voorzien in een regelmatige beoordeling van de kwaliteit van de taakuitoefening, met
      betrokkenheid van onafhankelijke deskundigen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9e
  - number: 7.4.9e.2
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen zendt jaarlijks voor 1 juli een jaarverslag aan Onze Minister.
      Het Kwaliteitscentrum examinering beroepsopleidingen maakt in het jaarverslag de uitkomsten van de beoordeling,
      bedoeld in het eerste lid, en het voorgenomen beleid in het licht van die uitkomsten bekend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9e
  - number: 7.4.9e.3
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen zendt jaarlijks voor 1 oktober een jaarwerkplan voor het
      daaropvolgende kalenderjaar aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9e
  - number: 7.4.9e.4
    text: Onze Minister kan regels stellen over de inrichting van het jaarverslag en het jaarwerkplan.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9e
  - number: 7.4.9e.5
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen stelt jaarlijks voor 1 november een verslag op over zijn
      bevindingen over de examens van beroepsopleidingen in het voorafgaande studiejaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9e
  - number: 7.4.9f.1
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen zendt jaarlijks voor 1 oktober aan Onze Minister de begroting
      voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9f
  - number: 7.4.9f.2
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen brengt jaarlijks voor 1 juli een jaarrekening over het
      voorafgaande kalenderjaar uit, die vergezeld gaat van een verklaring omtrent de getrouwheid en de rechtmatigheid,
      afgegeven door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1]. Het
      Kwaliteitscentrum examinering beroepsopleidingen stelt de stukken, bedoeld in de eerste volzin, algemeen
      verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9f
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 7.4.9f.3
    text: |-
      Onze Minister kan regels stellen over de inrichting van de begroting, de jaarrekening en aandachtspunten voor de
      accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9f
  - number: 7.4.9g.1
    text: |-
      Ter uitvoering van de taken, bedoeld in [artikel 7.4.9a, eerste lid, onder b][ref1], onderzoekt het
      Kwaliteitscentrum examinering beroepsopleidingen jaarlijks de examinering van de beroepsopleidingen door
      instellingen als bedoeld in de [artikelen 1.1.1, onder b][ref2], en [1.4.1][ref3] en door exameninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9g
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.9g.2
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen stelt het bevoegd gezag in kennis van de aanvangsdatum alsmede
      van de planning van het onderzoek, bedoeld in het eerste lid. Kennisgeving geschiedt ten minste vier weken voor
      aanvang van een onderzoek.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9g
  - number: 7.4.9g.3
    text: |-
      Het bevoegd gezag is het Kwaliteitscentrum examinering beroepsopleidingen voor het onderzoek vergoeding
      verschuldigd overeenkomstig een door Onze Minister vastgestelde berekeningswijze.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9g
  - number: 7.4.9h.1
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen legt zijn oordeel na een onderzoek als bedoeld in
      [artikel 7.4.9g, eerste lid][ref1], vast in een verklaring. Het Kwaliteitscentrum examinering beroepsopleidingen
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1b
  - number: 7.4.9h.1.a
    text: |-
      een goedkeurende verklaring indien de examinering bij de beroepsopleiding door de instelling of exameninstelling in
      overeenstemming is met de standaarden, bedoeld in [artikel 7.4.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9h.1.b
    text: |-
      een afkeurende verklaring indien de examinering bij de beroepsopleiding door de instelling of exameninstelling niet
      in overeenstemming is met de standaarden, bedoeld in [artikel 7.4.4][ref1], waarbij het naar het oordeel van het
      Kwaliteitscentrum examinering beroepsopleidingen niet aannemelijk is dat dit binnen een jaar alsnog het geval zal
      zijn, alsmede in gevallen als bedoeld in het derde lid, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9h.1.c
    text: |-
      een voorwaardelijke verklaring indien de examinering bij de beroepsopleiding door de instelling of exameninstelling
      niet in overeenstemming is met de standaarden, bedoeld in [artikel 7.4.4][ref1], waarbij het naar het oordeel van
      het Kwaliteitscentrum examinering beroepsopleidingen aannemelijk is dat dit binnen een jaar alsnog het geval zal
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9h.2
    text: |-
      Indien er naar het oordeel van het Kwaliteitscentrum examinering beroepsopleidingen op enig moment tijdens
      het onderzoek sprake is van een zodanige discrepantie tussen de kwaliteit van het examen van een opleiding
      en de standaarden, bedoeld in [artikel 7.4.4][ref1], dat vaststaat dat zonder verbeteringen aan het eind
      van het onderzoek een afkeurende verklaring zal worden afgegeven, meldt het Kwaliteitscentrum examinering
      beroepsopleidingen dit onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9h.3
    text: |-
      Indien na het afgeven van een voorwaardelijke verklaring bij het eerstvolgende jaarlijks onderzoek blijkt dat de
      examinering bij de beroepsopleiding door de instelling of exameninstelling opnieuw niet in overeenstemming is met
      de standaarden, bedoeld in [artikel 7.4.4][ref1], wordt een afkeurende verklaring afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.9h.4
    text: |-
      Een verklaring wordt door het Kwaliteitscentrum examinering beroepsopleidingen voorzien van een onderbouwing van
      het oordeel.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
  - number: 7.4.9h.5
    text: |-
      Alvorens een verklaring vast te stellen, stelt het Kwaliteitscentrum examinering beroepsopleidingen het bevoegd
      gezag in de gelegenheid van de ontwerpverklaring kennis te nemen en daarover overleg te voeren. Indien in het
      overleg geen overeenstemming is bereikt over door het bevoegd gezag gewenste wijzigingen in de ontwerpverklaring,
      wordt de zienswijze van het bevoegd gezag, zoals door deze aangegeven, in een bij de verklaring behorende bijlage
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
  - number: 7.4.9h.6
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen zendt een verklaring onverwijld aan het bevoegd gezag. Indien
      het een goedkeurende verklaring betreft, meldt het Kwaliteitscentrum examinering beroepsopleidingen dit aan Onze
      Minister. Indien het een afkeurende of voorwaardelijke verklaring betreft, zendt het Kwaliteitscentrum examinering
      beroepsopleidingen een afschrift van die verklaring onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9h
  - number: 7.4.9i.1
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen maakt een verklaring als bedoeld in [artikel 7.4.9h][ref1] in
      de vijfde week na vaststelling daarvan openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9i
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1b
  - number: 7.4.9i.2
    text: |-
      Tevens verstrekt het Kwaliteitscentrum examinering beroepsopleidingen aan derden op verzoek een afschrift van
      de verklaring. Het Kwaliteitscentrum examinering beroepsopleidingen kan een vergoeding van de kosten vragen
      overeenkomstig een door Onze Minister vast te stellen tarief voor de afgifte van een verklaring.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9i
  - number: 7.4.9i.3
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen verstrekt een verklaring niet eerder aan derden dan nadat deze
      op grond van het eerste lid openbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9i
  - number: 7.4.9j
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen stelt een klachtenregeling vast inzake behandeling van
      klachten over gedragingen van personen die belast zijn met het uitoefenen van taken voor het Kwaliteitscentrum
      examinering beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9j
  - number: 7.4.9k.1
    text: |-
      Het Kwaliteitscentrum examinering beroepsopleidingen verstrekt desgevraagd aan Onze Minister de voor de uitvoering
      van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden,
      voorzover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9k
  - number: 7.4.9k.2
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling verstrekt desgevraagd aan het Kwaliteitscentrum
      examinering beroepsopleidingen alle voor de uitvoering van zijn taken, bedoeld in [artikel 7.4.9a][ref1], benodigde
      inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.9k
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: 1a
  - number: 7.4.10
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.10
  - number: 7.4.11.1
    text: Aan de deelnemers wordt gelegenheid gegeven een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
  - number: 7.4.11.2
    text: |-
      [Artikel 7.4.5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de examens
      van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als tweede taal I en II, bedoeld
      in [artikel 7.3.1, eerste lid, onder a en c][ref1]. Bij deze algemene maatregel van bestuur kunnen tevens
      voorschriften worden gegeven omtrent de examenprogramma’s en de verdeling daarvan in onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.11.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
  - number: 7.4.11.5
    text: |-
      [Artikel 7.4.6][ref1] is van toepassing, met dien verstande dat degene die een onderdeel van het examen Nederlands
      als tweede taal I of II met goed gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene
      maatregel van bestuur wordt bepaald onder welke voorwaarden het bezit van certificaten aanspraak geeft op een
      diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.6
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de artikelen [6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.1.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt al dan niet in samenwerking met een of meer bevoegde
      gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de examens in, dan wel
      sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de examinatoren kunnen
      worden onderworpen aan het oordeel van een commissie van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.1
  - number: 7.5.1.2
    text: |-
      De commissie van beroep voor de examens bestaat uit een even aantal gewone leden en evenveel plaatsvervangende
      leden, een voorzitter, tevens lid, en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.1
  - number: 7.5.1.3
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden worden door
      het bevoegd gezag benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw
      benoembaar. De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag, van de inspectie
      of van een in [artikel 7.4.5][ref1] bedoelde examencommissie of examinator tegen de beslissing waarvan
      onderscheidenlijk van wie beroep kan worden ingesteld bij de commissie van beroep, noch zijn zij belast met de in
      [artikel 7.2.8, tweede lid, onder c][ref2], bedoelde beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.5.1.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van
      de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun
      functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn
      veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene
      van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.1
  - number: 7.5.2.1
    text: De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
  - number: 7.5.2.2
    text: |-
      De termijn voor het indienen van het beroepschrift bedraagt, wat de openbare instellingen betreft in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref1], twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.5.2.3
    text: |-
      De commissie beslist binnen vier weken na ontvangst van het beroepschrift, wat de openbare instellingen betreft in
      afwijking van [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1], tenzij de commissie deze termijn
      heeft verlengd met ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.2.4
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
  - number: 7.5.2.5
    text: |-
      De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
  - number: 7.5.2.6
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie
      is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen,
      wat de openbare instellingen betreft in afwijking van [artikel 7:25 van de Algemene wet bestuursrecht][ref1].
      Zij kan bepalen dat opnieuw of, indien de beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat
      het examen of enig onderdeel daarvan opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.3.1
    text: |-
      In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek
      na de desbetreffende examencommissie dan wel de desbetreffende examinator te hebben gehoord, althans te hebben
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.3
  - number: 7.5.3.2
    text: |-
      Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.3
  - number: 7.5.4
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.5.4
  - number: 7.7.1.1
    text: |-
      Het bevoegd gezag van een instelling is verplicht, studenten die zijn ingeschreven voor een opleiding voor
      het beroep van leraar waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, of
      die anderszins studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor
      een functie in het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de
      instelling te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 7.7.1.2
    text: |-
      De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling in
      totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits dat
      in overeenstemming is met de goede gang van zaken binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 7.7.1.3
    text: |-
      Het bevoegd gezag kan een student de verdere toegang tot de instelling ontzeggen, indien deze in de instelling in
      strijd handelt met de grondslag en doelstellingen van de instelling. Van een besluit tot ontzegging van de toegang
      tot de instelling wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag
      van de betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie. Indien
      het bevoegd gezag van een bijzondere school een student de toegang weigert, maakt het dit besluit, schriftelijk en
      met redenen omkleed, bekend door toezending of uitreiking aan de student, onverminderd het bepaalde in de vorige
      volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 7.7.1.4
    text: |-
      Het bevoegd gezag van de instelling regelt de werkzaamheden in verband met de begeleiding door de leraren van
      de studenten in de instelling in overeenstemming met de leraren, alsmede in overeenstemming met de betrokken
      opleidingsinstellingen, dan wel, indien het betreft studenten die zich voorbereiden op het afleggen van een
      staatsexamen ter verkrijging van een bewijs van bekwaamheid of een bewijs van voldoende pedagogische en didactische
      voorbereiding, in overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 7.7.1.5
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 7.7.1.6
    text: |-
      De instellingen waarbij studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de
      inspectie, belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te
      wijzen docenten van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies,
      een en ander voor zover dat voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de
      begeleiding van de praktische vorming van de in de instelling aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel7.7.1
  - number: 8.1.1.1
    text: |-
      Een ieder die gebruik wenst te kunnen maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als deelnemer te laten inschrijven. Een ieder die uitsluitend wenst te worden toegelaten
      tot examenvoorzieningen, dient zich door het bevoegd gezag als examendeelnemer te laten inschrijven. Voor de
      inschrijving als examendeelnemer is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      Indien het een meerderjarige examendeelnemer betreft die het examengeld niet zelf voldoet, wordt niet overgegaan
      tot inschrijving dan nadat de deelnemer schriftelijk heeft verklaard dat hij ermee instemt dat een in die
      verklaring vermelde derde namens hem het examengeld voldoet. De inschrijving voor een opleiding of een onderdeel
      van een opleiding staat uitsluitend open voor degene waarvan de ouders, voogden of verzorgers aantonen, dan wel,
      indien hij meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
  - number: 8.1.1.1.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
  - number: 8.1.1.1.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
  - number: 8.1.1.1.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding begint
      waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.1.1.1.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
  - number: 8.1.1.1a
    text: |-
      Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke
      grond dan ook niet in overeenstemming met de vijfde volzin van het eerste lid heeft plaatsgevonden, wordt de
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3][ref1], met onmiddellijke ingang ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.2
    text: |-
      De inschrijving geschiedt voor een opleiding, dan wel een onderdeel daarvan. Indien het verzoek om inschrijving
      betrekking heeft op een beroepsopleiding, wordt daarbij aangegeven op welke leerweg het verzoek van toepassing is.
      Tevens wordt bij de inschrijving vastgelegd of sprake is van inschrijving voor een opleidingstraject als bedoeld in
      [artikel 7.4.8, eerste lid, onder f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.1.1.3
    text: |-
      De inschrijving staat uitsluitend open voor degenen ten aanzien van wie het bevoegd gezag beslist dat zij
      tot de instelling worden toegelaten, onverminderd de vierde volzin van het eerste lid, het vijfde lid en
      [artikel 8.1.6][ref1]. Het bevoegd gezag kan het nemen van de beslissing over de toelating opdragen aan een
      door hem in te stellen toelatingscommissie. Het bevoegd gezag regelt de bevoegdheden en de werkzaamheden van de
      toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.4
    text: |-
      De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend
      open voor degenen voor wie de volledige leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref1], is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 8.1.1.5
    text: |-
      In afwijking van het derde lid en met inachtneming van [artikel 8.2.1][ref1] en het krachtens [artikel 8.2.2][ref2]
      bepaalde” doch onverminderd de vierde volzin van het eerste lid, staat de inschrijving voor een assistentopleiding
      of basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref3], open voor een ieder, met dien verstande
      dat het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven,
      geacht worden de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving kan worden
      geweigerd dan wel ingetrokken indien de betrokkene de grondslag en de doelstellingen van de instelling niet
      respecteert. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel ingetrokken indien
      gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal maken
      door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan niet
      worden ingetrokken op grond van de tweede volzin indien voor betrokkene geen gelegenheid bestaat de opleiding aan
      een andere instelling te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.6
    text: |-
      De toelating tot opleidingen educatie staat uitsluitend open voor volwassenen. De toelating tot de opleidingen
      educatie, bedoeld in [artikel 7.3.1, eerste lid, onderdelen c en d][ref1], staat uitsluitend open voor volwassenen
      die geen inburgeringsplichtigen zijn in de zin van [artikel 1 van de Wet inburgering][ref2]. Het bevoegd gezag
      neemt bij de toelating tot opleidingen educatie de overeenkomst, bedoeld in [artikel 2.3.4][ref3], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.1.7
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 7:10][ref1] en
      [7:24 van de Algemene wet bestuursrecht][ref2], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      het op een bezwaar- of beroepschrift te nemen besluit ter zake van de toelating van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 8.1.1a.1
    text: |-
      De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de deelnemer
      of, indien deze minderjarig is, door de ouders, voogden of verzorgers de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de deelnemer zijn overgelegd.
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de deelnemer kan worden overgelegd, vindt de inschrijving plaats met
      inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
  - number: 8.1.1a.3
    text: |-
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag binnen
      twee weken na het besluit tot inschrijving aan de Informatie Beheer Groep de beschikbare gegevens van de deelnemer,
      bedoeld in het eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
  - number: 8.1.1a.4
    text: |-
      De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de deelnemer, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de deelnemer. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de deelnemer toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
  - number: 8.1.1a.5
    text: Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
  - number: 8.1.1a.6
    text: |-
      Indien aan een deelnemer een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt
      over zijn sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden
      nummer op in de administratie van de instelling in de plaats van het onderwijsnummer. Het bevoegd gezag meldt
      deze wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.1a
  - number: 8.1.2.1
    text: |-
      Indien binnen redelijke afstand van de woning van de deelnemer niet de gelegenheid bestaat tot het volgen van
      het onderwijs aan een openbare instelling, mag aan deze deelnemer de toelating tot een bijzondere instelling niet
      worden geweigerd op grond van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.2
  - number: 8.1.2.2
    text: Openbare instellingen zijn toegankelijk voor deelnemers zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.2
  - number: 8.1.3.1
    text: Aan de inschrijving ligt een overeenkomst tussen het bevoegd gezag en de deelnemer ten grondslag.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.2
    text: |-
      De overeenkomst wordt, overeenkomstig een door het bevoegd gezag vastgesteld model, schriftelijk aangegaan.
      De overeenkomst wordt gesloten voor de duur van de opleiding dan wel voor het deel van de opleiding waarop de
      inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3
    text: |-
      De overeenkomst regelt de rechten en verplichtingen van partijen, daaronder begrepen die, welke voortvloeien uit de
      wet, en omvat ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.a
    text: de inhoud en inrichting van het onderwijs waarop de overeenkomst betrekking heeft, alsmede de examenvoorzieningen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.b
    text: de tijdvakken waarbinnen en, voor zover mogelijk, de lokaties waarop het onderwijs verzorgd wordt,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.c
    text: de wijze waarop partijen uit de overeenkomst voortkomende prestaties gestalte zullen geven,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.d
    text: |-
      de loopbaanoriëntatie en -begeleiding, daaronder begrepen een regelmatige advisering over de voortzetting van de
      studie binnen of buiten de opleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.d1
    text: |-
      in voorkomend geval, terugbetaling van voorschotten, verstrekt door het bevoegd gezag, ter voldoening van een bij
      of krachtens de wet geregelde geldelijke bijdrage als bedoeld in [artikel 8.1.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.3.e
    text: schorsing en verwijdering,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.3.f
    text: |-
      tussentijdse beëindiging van de overeenkomst en onmiddellijke ontbinding van de overeenkomst in het geval, bedoeld
      in [artikel 8.1.1, lid 1a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.3.g
    text: |-
      de schadevergoeding waarop de deelnemer bij beëindiging van de bekostiging of ontneming van rechten als bedoeld
      in [artikel 2.1.3][ref1] onderscheidenlijk in de [artikelen 6.1.4][ref2] of [6.2.2][ref3] jegens de instelling
      aanspraak heeft en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.1.3.3.h
    text: |-
      de terugbetaling van cursusgeld in andere gevallen dan bedoeld in
      [artikel 14, tweede lid onder a tot en met d, van het Uitvoeringsbesluit Les- en cursusgeldwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel14
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '14'
  - number: 8.1.3.3a
    text: |-
      De overeenkomst met betrekking tot een opleiding als bedoeld in [artikel 12.1a.1, eerste lid][ref1], of
      [artikel 12.1a.2, eerste lid][ref2], bevat tevens de regeling, bedoeld in de laatste volzin van die artikelleden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 8.1.3.4
    text: |-
      Indien tot een bijzondere instelling andere deelnemers worden toegelaten dan voor wie de instelling in verband
      met de godsdienstige of levensbeschouwelijke richting wordt in stand gehouden, kunnen deze deelnemers niet worden
      verplicht tot het volgen van onderwijs dat in verband met die richting door de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
  - number: 8.1.3.5
    text: |-
      [Artikel 8.1.1, zevende lid][ref1], is van overeenkomstige toepassing op de schorsing en verwijdering van
      deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.6
    text: |-
      Definitieve verwijdering van een deelnemer waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet
      plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere instelling, een school voor speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref2] bereid is de deelnemer toe te laten. Indien aantoonbaar
      gedurende 8 weken zonder succes is gezocht naar een zodanige instelling of school waarnaar kan worden verwezen, kan
      in afwijking van de eerste volzin tot definitieve verwijdering worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 8.1.3.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.4
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde geldelijke
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.4
  - number: 8.1.5.1
    text: |-
      Indien de omvang van de door de begrotingswetgever beschikbaar gestelde middelen, daaronder voor de toepassing
      van dit artikel mede begrepen middelen ten behoeve van studiefinanciering en tegemoetkoming in de studiekosten,
      daartoe naar het oordeel van Onze Minister aanleiding geeft, overlegt Onze Minister in maart, in het kader van
      het in [artikel 3.1.1][ref1] geregelde overleg, met de bevoegde gezagsorganen en de kenniscentra beroepsonderwijs
      bedrijfsleven over de aantallen deelnemers voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel3
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.1.5.1.a
    text: |-
      de beroepsbegeleidende leerweg van een bepaalde beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b en c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.5.1.b
    text: de beroepsopleidende leerweg van die opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.5
  - number: 8.1.5.2
    text: |-
      Het overleg strekt ertoe, tot afspraken te komen over de aantallen voor de in het eerste lid bedoelde leerwegen ten
      hoogste in te schrijven deelnemers. Indien deze afspraken tot stand komen, stellen de bevoegde gezagsorganen van de
      desbetreffende instellingen met inachtneming van de overeengekomen aantallen deelnemers gezamenlijk een onderlinge
      verdeling van deze aantallen vast. De inschrijving voor de in het eerste lid bedoelde beroepsopleidende leerweg aan
      de onderscheiden instellingen vindt vervolgens plaats tot ten hoogste het voor elke instelling op de voet van de
      tweede volzin vastgestelde aantal.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.5
  - number: 8.1.5.3
    text: |-
      Indien het in het eerste lid bedoelde overleg naar het oordeel van Onze Minister niet of onvoldoende leidt tot
      afspraken als bedoeld in het tweede lid, kunnen bij ministeriële regeling voor 1 mei volgend op dat overleg de
      aantallen deelnemers worden vastgesteld die in de daarop volgende twee studiejaren ten hoogste voor de eerste maal
      kunnen worden ingeschreven voor de in het eerste lid bedoelde beroepsopleidende leerweg aan al de instellingen die
      deze leerweg verzorgen. In dat geval is het tweede lid, tweede en derde volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.5
  - number: 8.1.6
    text: |-
      Het bevoegd gezag kan de inschrijving voor een bepaalde assistentopleiding of basisberoepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid][ref1], opschorten voor zover en voor zolang de organisatorische en technische
      capaciteit voor het verzorgen van die opleiding, ook na aantoonbare inspanningen van het bevoegd gezag om te komen
      tot een toereikende capaciteit, daartoe naar zijn oordeel noodzaakt. Met inachtneming van de in de eerste volzin
      bedoelde beperkingen geschiedt de inschrijving in de volgorde van aanmelding voor de desbetreffende opleiding,
      volgens in de onderwijs- en examenregeling te geven regels van procedurele aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de instelling ingeschreven deelnemer die valt onder de werking van de
      [Wet studiefinanciering 2000][ref1] of van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], vast,
      of deze deelnemer gedurende een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het
      onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van
      onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling wordt gedaan indien een ingeschreven
      deelnemer in een of meer vakken niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt
      verstaan afwezigheid wegens ziekte van de deelnemer, welke ziekte uitsluitend kan worden aangetoond door middel van
      een gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken aan
      de deelnemer dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de deelnemer om
      opgaaf van de reden van de afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.3.a
    text: |-
      of de reden die de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.3.b
    text: |-
      dat de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      deelnemer voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan de Informatie Beheer
      Groep de deelnemer die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden
      niet aan het onderwijs heeft deelgenomen. Tevens meldt het indien die deelnemer voor het einde van de periode van 8
      weken weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken deelnemer aan de Informatie Beheer Groep zijn verstrekt aan deze
      betrokkene. Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid,
      gevolgen heeft voor de studiefinanciering van betrokkene op grond van de [Wet studiefinanciering 2000][ref1]
      of voor de tegemoetkoming onderwijsbijdrage en schoolkosten van betrokkene op grond van de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], alsmede welke beroepsgang voor betrokkene tegen de
      mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.8
    text: |-
      Indien het bevoegd gezag van een bijzondere instelling aan de Informatie Beheer Groep de in het vijfde lid bedoelde
      mededeling heeft gedaan, kan de deelnemer binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid,
      bij het bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.9
    text: Onder «deelnemer» als bedoeld in het vijfde en zevende lid wordt verstaan de deelnemer die
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
  - number: 8.1.7.9.a
    text: |-
      een assistentopleiding of een basisberoepsopleiding volgt als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a of b][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.9.b
    text: |-
      een andere opleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdeel f][ref1], volgt waarvan bij ministeriële
      regeling is aangegeven dat deze voor de toepassing van de [Wet studiefinanciering 2000][ref2] wordt aangemerkt als
      een opleiding als bedoeld in [artikel 7.2.2, eerste lid, onderdelen a of b][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0011453
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.9.c
    text: |-
      voor 1 augustus 2005 studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref1] ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 8.1.8.1.b
    text: |-
      die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref2] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '8'
  - number: 8.1.8.1.c
    text: die
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
  - number: 8.1.8.1.c.1°
    text: |-
      het onderwijs of de educatie aan de instelling gedurende een aaneengesloten periode van ten minste een maand of een
      door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
  - number: 8.1.8.1.c.2°
    text: bij de instelling wordt in- of uitgeschreven of van de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
  - number: 8.1.8.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.1.8
  - number: 8.2.1.1
    text: |-
      Vereiste voor inschrijving voor een vakopleiding en een middenkaderopleiding als bedoeld in
      [artikel 7.2.2, eerste lid][ref1], is met inachtneming van het bepaalde krachtens [artikel 8.2.2][ref2] het bezit
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.1.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.1.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.1.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.1.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.1.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.2
    text: |-
      Vereiste voor inschrijving voor een specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], is het
      bezit van een diploma vakopleiding voor eenzelfde beroep of beroepencategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.3
    text: |-
      Indien een assistentopleiding en een basisberoepsopleiding voorbereiden op eenzelfde beroep of
      beroepencategorie, bedoeld in [artikel 7.2.4, eerste lid][ref1], is, met inachtneming van het bepaalde krachtens
      [artikel 8.2.2][ref2], voor de inschrijving voor de basisberoepsopleiding vereist het bezit van


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.3.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de basisberoepsgerichte leerweg of de kaderberoepsgerichte
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.3.b
    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.3.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.3.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.3.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.4
    text: |-
      Voor de inschrijving voor een assistentopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], en voor de
      inschrijving voor een opleiding educatie, gelden geen vooropleidingseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.5
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen afwijken van het eerste tot en met derde lid, indien de deelnemer naar
      verwachting het onderwijs in de desbetreffende beroepsopleiding met voldoende resultaat zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
  - number: 8.2.1.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2.1
    text: |-
      Op voorstel van organisaties in het voortgezet onderwijs, vertegenwoordigers van de instellingen, de kenniscentra
      beroepsonderwijs bedrijfsleven, bedoeld in [artikel 9.2.1, tweede lid, onderdeel a][ref1], en de commissies
      onderwijs-bedrijfsleven, bedoeld in [artikel 9.2.1, derde lid][ref2], worden bij ministeriële regeling aangewezen
      de sectoren, bedoeld in de [artikelen 10][ref3], [10b][ref4] en [10d van de Wet op het voortgezet onderwijs][ref5],
      waarop het diploma middelbaar algemeen voortgezet onderwijs, het diploma voorbereidend beroepsonderwijs,
      het diploma mavo-vbo en de diploma's voorbereidend middelbaar beroepsonderwijs betrekking moeten hebben,
      alsmede vakken en andere programma-onderdelen die deel moeten hebben uitgemaakt van het examen ter
      verkrijging van een van deze diploma's, om te kunnen worden ingeschreven voor een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10b
      - id: ref5
        bwb_id: BWBR0002399
        artikel: 10d
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.2.2
    text: |-
      In de ministeriële regeling kan onderscheid worden gemaakt naar groepen van deelnemers, dan wel kan worden bepaald
      dat de regeling niet van toepassing is op groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.2.2
  - number: 8.3.1.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 8.1.8, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.1.1.a
    text: |-
      die het onderwijs of de educatie aan de instelling waaraan hij is ingeschreven gedurende een aaneengesloten periode
      van ten minste een maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer
      volgt, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.1
  - number: 8.3.1.1.b
    text: |-
      die niet meer aan een instelling is ingeschreven en evenmin is ingeschreven aan een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.1.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater
      niet verstaan degene die in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a][ref1], dan wel een getuigschrift van het praktijkonderwijs als bedoeld
      in [artikel 10f van de Wet op het voortgezet onderwijs][ref2] en werkzaam is op grond van een aanstelling of
      arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 8.3.2.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 8.1.8][ref1] heeft gemeld. Burgemeester en wethouders dragen bovendien zorg voor een systeem van
      doorverwijzing naar onderwijs of arbeidsmarkt van de in [artikel 8.3.1][ref2] bedoelde voortijdige schoolverlaters
      en voor het onderhoud van dit systeem. Het systeem heeft mede betrekking op de gegevens waarover de gemeente
      beschikt in het kader van de uitvoering van de [Leerplichtwet 1969][ref3]. Voor de uitvoering van de eerste en
      tweede volzin kunnen bij ministeriële regeling nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0002628
  - number: 8.3.2.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met instellingen, scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.2.3
    text: |-
      De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onverwijld gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen
      coördinerende taken met het oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.4
    text: |-
      Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, dragen
      burgemeester en wethouders van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van
      dit artikel over aan burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing
      wordt onverwijld gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de colleges van burgemeester en wethouders in de regio aan de contactgemeente een
      specifieke uitkering toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente
      draagt er zorg voor dat de colleges van burgemeester en wethouders in de regio gebruik kunnen maken van de
      instrumenten die met behulp van deze uitkering zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur
      worden regels gegeven voor de berekening en betaling van de uitkering. De berekening geschiedt in elk geval aan
      de hand van het aantal volwassen inwoners van de gemeenten in de regio op 1 januari van het jaar voorafgaande aan
      het jaar van de uitkering, waarbij rekening wordt gehouden met het opleidingsniveau en met de etnische achtergrond
      van die inwoners. Bij de berekening van een deel van de uitkering kunnen de volwassen inwoners van gemeenten die
      op grond van een andere regeling reeds een vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen,
      buiten beschouwing worden gelaten. Onze Minister hanteert het aantal volwassen inwoners van de gemeenten in de
      regio dat blijkt uit de gegevens die het Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.6
    text: |-
      Het bevoegd gezag geeft aan de door burgemeester en wethouders aangewezen personen alle gevraagde bescheiden ter
      inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.7
    text: |-
      De gemeenteraden in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
  - number: 8.3.2.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien
      uit de rekening van de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk
      verslag omtrent het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het
      verslag van de accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 8.3.3.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 8.3.2, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.3.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.3
  - number: 8.3.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.3.3
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 10b1 van de Wet op het voortgezet onderwijs][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een school voor voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref2] en het bevoegd gezag van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b7 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b7
  - number: 9.1.1.1
    text: |-
      Bijzondere instellingen en agrarische innovatie- en praktijkcentra worden in stand gehouden door
      een rechtspersoon met volledige rechtsbevoegdheid niet zijnde een rechtspersoon als bedoeld in
      [artikel 2:1 van het Burgerlijk Wetboek][ref1], die zich blijkens de statuten of reglementen het geven van
      onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.1.1.2
    text: |-
      Het bevoegd gezag zendt elke wijziging van de statuten of reglementen binnen vier weken na vaststelling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.1
  - number: 9.1.2.1
    text: |-
      Het bevoegd gezag van een openbare instelling kan de instandhouding van die instelling overdragen aan een ander
      orgaan dat tot de instandhouding van een openbare instelling bevoegd is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.2
  - number: 9.1.2.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte
      van levering als bedoeld in [artikel 3:89 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen het personeel in gelijke betrekkingen aan de instelling aanstelt met
      ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 9.1.2.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de instelling,
      onverminderd hetgeen verder voor de overgang naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.2
  - number: 9.1.2.4
    text: |-
      Van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken kan Onze
      Minister in bijzondere omstandigheden ontheffing verlenen. Onze Minister besluit binnen zes maanden na ontvangst
      van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.2
  - number: 9.1.3.1
    text: |-
      De rechtspersoon die een bijzondere instelling of een agrarisch innovatie- en praktijkcentrum in stand houdt, kan
      de instandhouding van die instelling onderscheidenlijk dat centrum overdragen aan een andere rechtspersoon die
      voldoet aan [artikel 9.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.2
    text: |-
      Op deze overdracht is [artikel 9.1.2, tweede tot en met vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.3
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere instelling of een agrarisch innovatie- en praktijkcentrum in stand houdt, wordt in de
      splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de instelling onderscheidenlijk het centrum
      in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de instelling of het centrum
      overgaat. In het laatste geval is [artikel 9.1.2, tweede tot en met vierde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.4.1
    text: |-
      Elke instelling heeft hetzij een centrale directie hetzij een college van bestuur. Een centrale directie dan wel
      een college van bestuur bestaat uit ten hoogste drie leden, waarvan er een door het bevoegd gezag wordt benoemd
      tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.4
  - number: 9.1.4.2
    text: |-
      Een lid van de centrale directie, onderscheidenlijk college van bestuur, kan niet terzelfdertijd lid zijn van een
      centrale directie of college van bestuur van een tweede instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.4
  - number: 9.1.4.3
    text: |-
      De centrale directie heeft onder verantwoordelijkheid van het bevoegd gezag de leiding van de voorbereiding en
      de uitvoering van het beleid van de instelling alsmede de coördinatie van de dagelijkse gang van zaken en van het
      beheer van de instelling. Het college van bestuur is belast met de taken en bevoegdheden van de centrale directie
      alsmede met de door het bevoegd gezag aan het college overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.4
  - number: 9.1.5.1
    text: |-
      Het bevoegd gezag van een instelling kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen
      aan een alsdan in de plaats van de centrale directie in te stellen college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.5
  - number: 9.1.5.2
    text: |-
      Het college van bestuur van een instelling kan hem bij wettelijk voorschrift opgedragen of door het bevoegd gezag
      overgedragen taken en bevoegdheden overdragen aan het bestuur van een organisatorische eenheid als bedoeld in
      [artikel 9.1.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.5.3
    text: |-
      Indien dat dienstig is voor een goede uitvoering van deze wet, kan het bevoegd gezag de uitoefening van hem
      bij wettelijk voorschrift opgedragen taken en bevoegdheden opdragen aan het bestuur van een kenniscentrum
      beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.5
  - number: 9.1.6
    text: Het bevoegd gezag kan bij bestuursreglement een of meer organisatorische eenheden instellen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.6
  - number: 9.1.7.1
    text: 'Het bevoegd gezag stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.1.a
    text: |-
      de taken en bevoegdheden die het bevoegd gezag overdraagt aan het college van bestuur, indien het bevoegd gezag
      toepassing heeft gegeven aan [artikel 9.1.5, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.7.1.b
    text: de richtlijnen voor de uitoefening van de aan het college van bestuur overgedragen taken en bevoegdheden, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.1.c
    text: 'indien de instelling een of meer organisatorische eenheden omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.1°
    text: |-
      welke bevoegdheden het college van bestuur heeft overgedragen aan het bestuur van de desbetreffende eenheid, indien
      het college van bestuur toepassing heeft gegeven aan [artikel 9.1.5, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.7.1.c.2°
    text: |-
      de verhouding van het bestuur van de desbetreffende eenheid tot het bevoegd gezag, het college van bestuur of de
      centrale directie,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.3°
    text: welke organisatorische eenheden de desbetreffende instelling omvat, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.1.c.4°
    text: welke beroepsopleidingen of opleidingen educatie in die organisatorische eenheden zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.2
    text: |-
      Indien de instelling organisatorische eenheden omvat, worden bij of krachtens het bestuursreglement de
      samenstelling en de werkwijze van het bestuur van de desbetreffende eenheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.3
    text: |-
      Het bevoegd gezag zendt het bestuursreglement, alsmede elke wijziging daarvan, zo spoedig mogelijk aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.1.7.4
    text: |-
      Indien de statuten van een bijzondere instelling de onderwerpen, bedoeld in het eerste lid, tweede volzin, onder
      *a* en *b*, regelen, kan het bevoegd gezag beslissen deze regeling niet op te nemen in het bestuursreglement.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.1.7
  - number: 9.2.1.1
    text: |-
      Een kenniscentrum beroepsonderwijs bedrijfsleven wordt in stand gehouden door een rechtspersoon
      met volledige rechtsbevoegdheid zonder winstoogmerk niet zijnde een rechtspersoon als bedoeld in
      [artikel 2:1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.2.1.2
    text: 'Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven bestaat:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
  - number: 9.2.1.2.a
    text: |-
      ofwel voor een derde deel uit vertegenwoordigers van werkgeversorganisaties, voor een derde deel uit
      vertegenwoordigers van werknemersorganisaties en voor een derde deel uit vertegenwoordigers van de instellingen en
      de andere instellingen, bedoeld in [artikel 1.4.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.1.2.b
    text: |-
      ofwel voor de helft uit vertegenwoordigers van werkgeversorganisaties en voor de helft uit vertegenwoordigers van
      werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
  - number: 9.2.1.3
    text: |-
      Aan het kenniscentrum beroepsonderwijs bedrijfsleven waarvan de samenstelling van het bestuur voldoet aan
      het tweede lid, onder *b*, is een commissie onderwijs-bedrijfsleven verbonden, die voor de helft bestaat uit
      vertegenwoordigers van het bedrijfsleven en voor de helft uit vertegenwoordigers van de instellingen en de andere
      instellingen, bedoeld in [artikel 1.4.1][ref1], die opleidingen verzorgen op het terrein waarop het kenniscentrum
      beroepsonderwijs bedrijfsleven werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.1.4
    text: |-
      Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven kan indien dat dienstig is voor een goede
      uitvoering van deze wet, aan het bevoegd gezag van een instelling de uitoefening van hem bij wettelijk voorschrift
      opgedragen taken en bevoegdheden opdragen, met uitzondering van de in [artikel 7.2.4, eerste lid][ref1], bedoelde
      taak. Indien het bestuur gebruik maakt van deze mogelijkheid, stelt het een reglement vast waarin in elk geval
      worden vastgelegd de taken en bevoegdheden die het bestuur ter uitoefening opdraagt aan het bevoegd gezag, alsmede
      richtlijnen voor uitoefening van de aan het bevoegd gezag opgedragen taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.2.2.1
    text: |-
      De rechtspersoon die een kenniscentrum beroepsonderwijs bedrijfsleven in stand houdt, kan de instandhouding van dat
      kenniscentrum overdragen aan een andere rechtspersoon die voldoet aan [artikel 9.2.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2.2
    text: |-
