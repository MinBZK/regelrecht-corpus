preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op de totstandkoming van een landelijke
    kwalificatiestructuur voor het beroepsonderwijs, de gewenste verbetering van de aansluiting tussen onderwijs
    en arbeidsmarkt, de gewenste verbetering van de afstemming tussen beroepsonderwijs en educatie, en voor een
    samenhangende besluitvorming op het gebied van de educatie, wenselijk is de toedeling van bevoegdheden aan de
    rijksoverheid, aan de gemeenten, aan de landelijke organen en aan de instellingen te herzien;

    dat het daarvoor wenselijk is de regelingen met betrekking tot de educatie en het beroepsonderwijs in de Wet op het
    cursorisch beroepsonderwijs en de Kaderwet Volwasseneneducatie 1991, alsmede de regelingen met betrekking tot het
    middelbaar beroepsonderwijs en het voortgezet algemeen volwassenenonderwijs in de Wet op het voortgezet onderwijs,
    in een samenhangend wettelijk kader neer te leggen met ingang van de expiratiedatum van deze regelingen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#ArtikelAanhef
