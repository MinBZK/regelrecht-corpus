        hoofdstuk: '8'
  - number: 1.4a.1.2
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt gedaan voor een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of voor een instelling. Het bevoegd gezag voegt bij deze aanvraag in elk geval het ontwerp van
      de in [artikel 7.4.8][ref2] bedoelde onderwijs- en examenregeling voor de opleiding educatie waarop de aanvraag
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4a.1.3
    text: |-
      Een aanvraag als bedoeld in het eerste lid heeft betrekking op een opleiding educatie waarvoor de instelling geen
      bedrag als bedoeld in [artikel 2.3.3][ref1] van de gemeente ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.4a.1.4
    text: |-
      Een aanvraag als bedoeld in het eerste lid heeft uitsluitend betrekking op opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder a][ref1], alsmede op andere in dat lid bedoelde opleidingen, voor zover daarvoor
      bij ministeriële regeling eindtermen zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 1.4a.1.5
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien
      de beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis
      en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien. Een begunstigende
      beschikking is voor het eerst van kracht ten aanzien van een opleiding educatie die aanvangt nadat die beschikking
      is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
  - number: 1.4a.1.6
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister jaarlijks voor 15 oktober een opgave van de
      opleidingen educatie, bedoeld in het eerste lid, die de instelling verzorgt in het lopende studiejaar, alsmede van
      de opleidingen educatie die de instelling heeft verzorgd in het daaraan voorafgaande studiejaar. De opgave bevat
      per opleiding educatie met betrekking tot het lopende studiejaar het aantal deelnemers op de peildatum 1 oktober,
      en met betrekking tot het daaraan voorafgaande studiejaar het aantal verstrekte diploma's en certificaten, bedoeld
      in [artikel 7.4.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4a.1.7
    text: |-
      Voor zover ten aanzien van een instelling die een opleiding educatie verzorgt, toepassing is gegeven aan het eerste
      lid, wordt die instelling voor de toepassing van deze wet wat deze opleiding betreft, aangemerkt als een andere
      instelling dan bedoeld in [artikel 1.1.1, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 1.5.1
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven die daartoe op voet van [artikel 2.1.5][ref1] door Onze Minister in
      aanmerking zijn gebracht, hebben aanspraak op bekostiging uit ’s Rijks kas ten behoeve van het vervullen van hun
      bij deze wet opgedragen werkzaamheden, voor zover niet verricht in het kader van dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.5.2.1
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan het ontwikkelen en onderhouden van een landelijke
      kwalificatiestructuur, gericht op de aansluiting tussen het aanbod van beroepsonderwijs en de maatschappelijke
      behoeften daaraan, mede in het licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede gelet op van
      belang zijnde ontwikkelingen in internationaal verband.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.5.2
  - number: 1.5.2.2
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan een doelmatige en doelgerichte inzet van
      overheidsmiddelen door het ontwikkelen van voorstellen, welke beroepsopleidingen voor bekostiging uit ’s Rijks kas
      in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.5.2
  - number: 1.5.2.3
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen bij aan de bevordering van de kwaliteit van de plaatsen waar de
      beroepspraktijkvorming wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.5.2
  - number: 1.5.2.4
    text: |-
      Kenniscentra beroepsonderwijs bedrijfsleven dragen zoveel mogelijk zorg voor de beschikbaarheid van een
      toereikend aantal bedrijven en organisaties van voldoende kwaliteit die de beroepspraktijkvorming verzorgen.
      Kenniscentra beroepsonderwijs bedrijfsleven zijn voorts belast met een regelmatige beoordeling van die bedrijven
      en organisaties.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.5.2
  - number: 1.6.1.1
    text: |-
      Onze Minister besluit, het Kwaliteitscentrum examinering beroepsopleidingen gehoord, op aanvraag van het bevoegd
      gezag van een exameninstelling, dat de exameninstelling het recht heeft tot examinering van een beroepsopleiding in
      opdracht van een instelling, indien die exameninstelling in acht neemt hetgeen bij of krachtens deze wet is bepaald
      over:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.6.1
  - number: 1.6.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1], voorzover het betreft de examinering,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 1.6.1.1.b
    text: de examens, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.6.1
  - number: 1.6.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 1.6.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.6.1
  - number: 1.7.1.1
    text: |-
      Aan een instelling, een agrarisch innovatie- en praktijkcentrum en een kenniscentrum beroepsonderwijs
      bedrijfsleven kunnen contractactiviteiten worden verricht, bestaande uit werkzaamheden voor eigen rekening
      ten behoeve van derden. Deze activiteiten kunnen worden verricht indien zij verband houden met werkzaamheden
      waarvoor de instelling, het centrum of het kenniscentrum uit de openbare kas bekostigd wordt of, wat kenniscentra
      beroepsonderwijs bedrijfsleven betreft, met werkzaamheden verricht in het kader van dienstverlening jegens de
      instellingen en voor zover de uitvoering van die werkzaamheden hierdoor niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.7.1
  - number: 1.7.1.2
    text: |-
      Het bevoegd gezag van een instelling en een agrarisch innovatie- en praktijkcentrum en het bestuur van het
      kenniscentrum beroepsonderwijs bedrijfsleven dragen er zorg voor dat de toepassing van het eerste lid, al dan
      niet in combinatie met aanstelling van personeel voor eigen rekening anders dan voor contractactiviteiten, er niet
      toe leidt dat minder dan 51% van de personeelskosten van de instelling, het centrum of het kenniscentrum wordt
      bekostigd uit de openbare kas.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.7.1
  - number: 1.7.1.3
    text: |-
      De vereisten voor benoembaarheid, bedoeld in [artikel 4.2.1, eerste lid][ref1], zijn niet van toepassing op een
      docent voor zover deze is belast met het verrichten van contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 1.7.1.4
    text: |-
      Het bevoegd gezag voorziet in een regeling voor het verrichten van contractactiviteiten door het personeel van de
      instelling, het agrarisch innovatie- en praktijkcentrum en het kenniscentrum beroepsonderwijs bedrijfsleven met het
      oog op het voorkomen van vermenging van belangen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.7.1
  - number: 2.1.1.1
    text: |-
      Onze Minister besluit jaarlijks voor 1 september of een beroepsopleiding ten aanzien waarvan Onze Minister
      eindtermen heeft vastgesteld, voor bekostiging in aanmerking komt. De aanspraak op bekostiging ontstaat met ingang
      van het studiejaar volgend op het in de eerste volzin bedoelde jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
  - number: 2.1.1.2
    text: 'Bij de toepassing van het eerste lid betrekt Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
  - number: 2.1.1.2.a
    text: |-
      de maatschappelijke behoeften aan de opleiding, mede in het licht van het onderwijsaanbod verzorgd door niet uit ’s
      Rijks kas bekostigde instellingen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
  - number: 2.1.1.2.b
    text: de arbeidsmarktperspectieven voor afgestudeerden, alsmede
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
  - number: 2.1.1.2.c
    text: de mate waarin de inhoud van de opleiding bijdraagt aan een duurzame en brede beroepskwalificatie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
  - number: 2.1.1.3
    text: |-
      De ministeriële regeling, bedoeld in [artikel 7.2.4, tweede lid][ref1], omvat mede een overzicht van de
      beroepsopleidingen die op grond van het eerste lid voor bekostiging in aanmerking komen. Bij deze ministeriële
      regeling wordt tevens het tijdstip bepaald met ingang waarvan de bekostiging wordt beëindigd. Dat tijdstip wordt
      zodanig bepaald dat het bevoegd gezag in de gelegenheid is om de voor de opleiding ingeschreven deelnemers in staat
      te stellen de opleiding te voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.1.1.3a
    text: |-
      Het eerste tot en met derde lid zijn niet van toepassing op opleidingen, bedoeld in
      [artikel 12.1a.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.1.3.1
    text: |-
      Instellingen worden bij wet voor bekostiging in aanmerking gebracht.
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.1.3.2
    text: 'Het eerste lid is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
  - number: 2.1.3.2.a
    text: |-
      instellingen die op grond van [artikel 12.3.1][ref1] zoals dat luidde door de Wet van 11 april 2001, Stb. 207, of
      [artikel 12.3.3][ref2] zoals dat luidde ingevolge de Wet educatie en beroepsonderwijs (Stb. 1995, 501) door Onze
      Minister voor bekostiging in aanmerking zijn gebracht, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.1.3.2.b
    text: |-
      instellingen die zijn voortgekomen uit samenvoeging of splitsing van bekostigde instellingen dan wel uit de
      omzetting van een bijzondere instelling in een openbare of omgekeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      Indien aan een agrarisch opleidingscentrum gedurende twee achtereenvolgende jaren minder dan 1200 deelnemers zijn
      ingeschreven voor beroepsopleidingen of voor het voorbereidend beroepsonderwijs, bedoeld in [artikel 1.3.3][ref1],
      kan Onze Minister besluiten dat aan die instelling de rechten, genoemd in [artikel 1.3.1][ref2], ontnomen worden,
      onverminderd het overigens met betrekking tot ontneming van rechten in deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.3.4
    text: |-
      Onze Minister besluit binnen tien maanden na ontvangst van een aanvraag op grond van het tweede lid, onder *b*.
      Indien de beschikking niet binnen tien maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien. Bij ministeriële
      regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onder b.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
  - number: 2.1.3.5
    text: |-
      Bij een beschikking op grond van het derde lid bepaalt Onze Minister het tijdstip waarop aan die instelling de
      rechten, genoemd in [artikel 1.3.1][ref1], ontnomen worden zodanig dat de ingeschreven deelnemers de opleiding
      waarvoor zij zijn ingeschreven, aan dezelfde instelling of aan een andere instelling binnen een redelijke tijd
      kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.4.1
    text: |-
      Een kenniscentrum beroepsonderwijs bedrijfsleven is werkzaam ten behoeve van beroepsopleidingen die naar hun
      aard en samenhang tot eenzelfde bedrijfstak of groep van bedrijfstakken behoren. Onze Minister stelt de indeling
      in werkgebieden van de kenniscentra beroepsonderwijs bedrijfsleven vast. Onze Minister stelt de kenniscentra
      beroepsonderwijs bedrijfsleven in de gelegenheid, hem daartoe een voorstel te doen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      De kenniscentra beroepsonderwijs bedrijfsleven dragen zorg voor een doelmatige en inzichtelijke onderlinge
      afstemming van werkzaamheden, met inachtneming van de indeling in werkgebieden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.4
  - number: 2.1.5.1
    text: |-
      Onze Minister besluit op aanvraag van het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven over de
      aanvang van bekostiging van het kenniscentrum. Een aanvraag om te besluiten tot aanvang van de bekostiging wordt
      voor 1 februari van het jaar, voorafgaand aan het jaar waarin de bekostiging moet aanvangen, bij Onze Minister
      ingediend. De aanvraag omvat een aanduiding van het werkgebied van het kenniscentrum.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.5
  - number: 2.1.5.2
    text: |-
      Onze Minister betrekt bij de beoordeling van de aanvraag in elk geval de samenhang van de beroepsopleidingen in
      relatie tot een bepaalde bedrijfstak of groep van bedrijfstakken, alsmede de omvang van het werkgebied van het
      kenniscentrum beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.5
  - number: 2.1.5.3
    text: |-
      Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt
      hij daarbij een redelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.5
  - number: 2.1.5.4
    text: |-
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van kenniscentra
      beroepsonderwijs bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.1.6
    text: |-
      Onze Minister kan besluiten dat een kenniscentrum beroepsonderwijs bedrijfsleven van zijn taken ontheven is indien
      niet langer behoefte bestaat aan het kenniscentrum of gebleken is dat het zijn taken niet of niet naar behoren
      vervult. Een beschikking als bedoeld in de eerste volzin brengt mee dat de aanspraak op bekostiging, bedoeld in
      [artikel 1.5.1][ref1], vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.1.7
    text: |-
      [Artikel 2.1.5, met uitzondering van de derde volzin van het eerste lid][ref1], en [artikel 2.1.6][ref2] zijn van
      overeenkomstige toepassing op de agrarische innovatie- en praktijkcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.1
    text: |-
      De rijksbijdrage voor het beroepsonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde aanspraak betrekking heeft
      wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, per instelling berekend
      aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze die ten aanzien
      van de in [artikel 2.2.2, tweede lid, onder ][ref2], bedoelde gegevens betrekking heeft op het tweede aan het
      desbetreffende jaar voorafgaande jaar. Wat huisvestingskosten betreft wordt de rijksbijdrage berekend hetzij op
      grond van die berekeningswijze hetzij op grond van een andere bij of krachtens algemene maatregel van bestuur te
      bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.1.2
    text: |-
      De rijksbijdrage bestaat uit afzonderlijk berekende bijdragen ten behoeve van exploitatiekosten en
      huisvestingskosten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3
    text: 'De bijdrage in de exploitatiekosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.a
    text: personeel,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.b
    text: onderhoud en vervanging van inventaris,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.c
    text: onderhoud van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.d
    text: energie,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.e
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.g
    text: heffingen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.h
    text: inkoop van diensten,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.i
    text: |-
      kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid aan gewezen personeel alsmede
      uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1], waaronder mede begrepen gewezen personeel dat was belast met werkzaamheden op het gebied van de
      educatie, met inbegrip van educatieve programma's als bedoeld in [artikel 2.3.1, tweede lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.3.j
    text: loopbaanoriëntatie en -begeleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.3.k
    text: gehandicapte deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.4
    text: 'De bijdrage in de huisvestingskosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.4.a
    text: huur van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.4.b
    text: investeringen in gebouwen en terreinen, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.4.c
    text: eerste inrichting.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.1.5
    text: |-
      Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een
      bedrag in mindering gebracht in verband met cursusgelden zoals bedoeld in de [Les- en cursusgeldwet][ref1],
      werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede uitkeringen wegens ziekte en
      arbeidsongeschiktheid anders dan op grond van de [Ziektewet][ref2] aan gewezen personeel van instellingen,
      waaronder mede begrepen gewezen personeel dat was belast met werkzaamheden op het gebied van de educatie, met
      inbegrip van educatieve programma's als bedoeld in [artikel 2.3.1, tweede lid][ref3], en agrarische innovatie-
      en praktijkcentra. Deze regels kunnen in elk geval voorzien in onderscheid in verband met de datum waarop
      gewezen personeel is ontslagen, alsmede onderscheid in verband met de beslissing van de rechtspersoon, bedoeld in
      [artikel 4.4.2, eerste lid][ref4], zoals luidend op 31 juli 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0004188
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0004188
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.2.1.6
    text: |-
      Een in het eerste lid en in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2.2
    text: 'De maatstaven voorzien in bekostiging aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
  - number: 2.2.2.2.a
    text: de instroom van deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
  - number: 2.2.2.2.b
    text: |-
      het aantal deelnemers en examendeelnemers dat een diploma als bedoeld in [artikel 7.4.6][ref1] heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.2.2.3
    text: |-
      Voor voorbereidende en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid][ref1], voor zover
      betrekking hebbend op beroepsopleidingen als bedoeld in [artikel 7.2.2, eerste lid, onder a en b][ref2], wordt een
      afzonderlijk bedrag berekend, aan de hand van de instroom van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, geldt inschrijving van een deelnemer voor
      twee of meer voltijdse dan wel twee of meer deeltijdse beroepsopleidingen in enig studiejaar als inschrijving voor
      één voltijdse respectievelijk één deeltijdse beroepsopleiding. Inschrijving van een deelnemer voor zowel voltijdse
      als deeltijdse beroepsopleidingen in enig studiejaar geldt voor de toepassing van die maatstaf als inschrijving
      voor een voltijdse opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
  - number: 2.2.2.5
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, geldt dat een deelnemer of examendeelnemer
      in enig jaar slechts eenmaal wordt meegeteld bij het bepalen van het aantal deelnemers onderscheidenlijk
      examendeelnemers die een diploma als bedoeld in [artikel 7.4.6][ref1] hebben behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.2.2.6
    text: |-
      Bij de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, blijven buiten beschouwing deelnemers
      aan een deeltijdse opleiding waarvoor het bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma, met
      inbegrip van de beroepspraktijkvorming, heeft ingericht dat minder dan 300 uren per volledig studiejaar omvat.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
  - number: 2.2.2.7
    text: |-
      In de maatstaven, bedoeld in het tweede lid, kan onderscheid worden gemaakt naar groepen van deelnemers en naar
      opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], ten behoeve van specifieke,
      door Onze Minister aan te duiden activiteiten van beperkte duur en onder door hem op te leggen verplichtingen
      aanvullende bedragen toevoegen. Onze Minister maakt in voorkomend geval zijn voornemens hiertoe bij gelegenheid
      van de indiening van het voorstel van wet inzake de rijksbegroting voor het jaar waarop de aanvullende bedragen
      betrekking hebben, aan de Tweede Kamer der Staten-Generaal bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.2
    text: |-
      De omvang van de aanvullende bedragen bedraagt ten hoogste 2% van de rijksbijdrage berekend op grond van
      [artikel 2.2.2][ref1]. Indien Onze Minister bij gelegenheid van de indiening van de in het eerste lid bedoelde
      begroting aantoont dat voor de in dat lid bedoelde activiteiten een groter bedrag noodzakelijk is, kan van het in
      de eerste volzin bedoelde percentage worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.3
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, volgens bij ministeriële regeling te
      geven voorschriften ten behoeve van de ontwikkeling van het bestel van het beroepsonderwijs een bedrag toevoegen
      aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], welk bedrag betrekking heeft op andere dan in
      dat artikel genoemde kostensoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.4
    text: |-
      Onze Minister besluit binnen negen maanden na ontvangst van een aanvraag voor een aanvullend bedrag als bedoeld
      in het eerste lid. Indien de beschikking niet binnen negen maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.3
  - number: 2.2.3.5
    text: |-
      Onze Minister kan per activiteit als bedoeld in het eerste lid of kostensoort als bedoeld in het derde lid
      een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent de verdeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het daarop volgende
      jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en vermeldt daarbij
      afzonderlijk het bedrag voor gehandicapte deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4
  - number: 2.2.4.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4
  - number: 2.2.4.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4
  - number: 2.2.4.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze, bedoeld in
      [artikel 2.2.2][ref1], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het bevoegd
      gezag aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].
      Deze gegevens en de verklaring worden ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2.4a.1
    text: |-
      Onze Minister kan het sociaal-fiscaal nummer van een persoon, behorend tot gewezen personeel als
      bedoeld in [artikel 2.2.1, vijfde lid][ref1], uitsluitend in het kader van het bepaalde bij of krachtens
      [artikel 2.2.1, vijfde lid][ref2], gebruiken in het verkeer met:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.4a.1.a
    text: het gewezen personeelslid,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4a
  - number: 2.2.4a.1.b
    text: het bevoegd gezag van de instelling waar de in onderdeel a bedoelde persoon werkzaam was, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4a
  - number: 2.2.4a.1.c
    text: |-
      de instantie die de werkloosheidsuitkeringen, de suppleties inzake arbeidsongeschiktheid alsmede de uitkeringen
      wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1] verstrekt
      of heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 2.2.4a.2
    text: |-
      Het sociaal-fiscaal nummer wordt op een daartoe strekkend verzoek van de minister aan de minister verstrekt door
      het bevoegd gezag van de instelling waar het gewezen personeelslid werkzaam was.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.4a
  - number: 2.2.12.1
    text: |-
      De rijksbijdrage waarop de in [artikel 1.3.4][ref1] bedoelde aanspraak betrekking heeft wordt, binnen het
      raam van de door de begrotingswetgever beschikbaar gestelde middelen, per centrum berekend aan de hand van
      maatstaven, neergelegd in een berekeningswijze, vastgesteld bij of krachtens algemene maatregel van bestuur.
      De maatstaven hebben in elk geval betrekking op de aard en de omvang van de werkzaamheden, bedoeld in
      [artikel 1.3.5, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '2'
  - number: 2.2.12.2
    text: |-
      [Artikel 2.2.1, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.12.3
    text: |-
      De [artikelen 2.2.4][ref1] en [2.2.4a][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.3.1.1
    text: |-
      Onze Minister verstrekt ten behoeve van de educatie jaarlijks aan de gemeenten een rijksbijdrage. De bijdrage
      wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, berekend aan de hand
      van voor elke gemeente gelijkelijk geldende maatstaven, neergelegd in een bij of krachtens algemene maatregel
      van bestuur vastgestelde berekeningswijze. De maatstaven hebben in elk geval betrekking op het aantal volwassen
      inwoners van de desbetreffende gemeenten, waarbij rekening wordt gehouden met het opleidingsniveau en de etnische
      achtergrond van die inwoners.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.1
  - number: 2.3.1.2
    text: |-
      Het eerste lid is niet van toepassing op gemeenten die op grond van het
      [Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1] een brede doeluitkering in het kader
      van het Grotestedenbeleid ontvangen. Voorzover de brede doeluitkering wordt aangewend voor educatie, zijn de
      [artikelen 2.3.3][ref2], [2.3.4][ref3] en [2.3.6 tot en met 2.3.6d][ref4] daarop van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018238
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018238
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.1.3
    text: |-
      De in het eerste lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Onze Minister maakt aan de gemeentebesturen jaarlijks in september bekend welke rijksbijdrage voor de gemeente voor
      het daarop volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      De rijksbijdrage, bedoeld in [artikel 2.3.1, eerste en tweede lid][ref1], wordt betaald volgens een door Onze
      Minister te bepalen kasritme.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.3
    text: |-
      Het college van burgemeester en wethouders van een gemeente waaraan een rijksbijdrage als bedoeld in
      [artikel 2.3.1][ref1] is verstrekt, besluit jaarlijks voor 1 november ten behoeve van het daaropvolgende jaar
      welke bedragen zullen worden bestemd voor de educatieve activiteiten, onderscheiden naar de opleidingen, bedoeld in
      [artikel 7.3.1][ref2], en in voorkomende gevallen naar doelgroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.3.4.1
    text: |-
      Bedragen die Onze Minister op grond van [artikel 2.3.1][ref1] ten behoeve van de educatie aan een gemeente
      verstrekt, worden door het gemeentebestuur betaald aan een of meer regionale opleidingencentra. In afwijking
      van [titel 4.2 van de Algemene wet bestuursrecht][ref2] berust de betaling van de bedragen aan die instelling
      of regionale opleidingencentra op een door het gemeentebestuur met het bevoegd gezag gesloten overeenkomst. De
      [titels 4.1][ref3] en [4.2 van de Algemene wet bestuursrecht][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0005537
  - number: 2.3.4.2
    text: |-
      De rijksbijdrage per gemeente wordt aan de gemeente verstrekt onder de voorwaarde dat gedurende het jaar waarvoor
      de middelen worden toegekend, een of meer overeenkomsten als bedoeld in het eerste lid van kracht zijn op grond
      waarvan die gemeente jegens het desbetreffende bevoegd gezag gehouden is tot betaling van het totale bedrag van de
      rijksbijdrage gedurende de looptijd van die overeenkomst of overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3
    text: 'Een overeenkomst als bedoeld in het eerste lid heeft ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.a
    text: de aard van de activiteiten,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.b
    text: het aantal deelnemers, in voorkomende gevallen onderscheiden naar doelgroepen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.c
    text: de periode,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.d
    text: de omvang van het bedrag, dan wel de wijze waarop dit berekend wordt,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.e
    text: de wijze waarop het bedrag ter beschikking wordt gesteld, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.3.f
    text: de wijze waarop verantwoording jegens het gemeentebestuur wordt afgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
  - number: 2.3.4.4
    text: |-
      Ten aanzien van opleidingen voortgezet algemeen volwassenenonderwijs, bedoeld in
      [artikel 7.3.1, eerste lid, onder a][ref1], bevat een overeenkomst als bedoeld in het eerste lid geen bepalingen
      omtrent de combinaties van vakken waarop de diploma’s betrekking dienen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.3.5.1
    text: |-
      Op de gezamenlijke aanvraag van samenwerkende gemeenten wordt de rijksbijdrage aan een door
      die gemeenten uit hun midden aangewezen gemeente of aan een rechtspersoon als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '8'
  - number: 2.3.5.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, wordt gedaan voor 1 december van het jaar voorafgaand aan het jaar waarvoor
      de middelen aan de gemeenten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.5
  - number: 2.3.5.3
    text: |-
      Titel 3 van dit hoofdstuk en de artikelen 11.3 en 11.4 zijn van overeenkomstige toepassing op de volgens het eerste
      lid aangewezen gemeente of de in dat lid bedoelde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.5
  - number: 2.3.6.1
    text: |-
      De in [artikel 2.3.1][ref1] bedoelde colleges van burgemeester en wethouders en de instellingen dragen er zorg voor
      dat zij beschikken over geordende gegevens ten behoeve van het door Onze Minister te voeren beleid met betrekking
      tot de educatie en verlenen desgevraagd medewerking aan door of namens Onze Minister uit te voeren onderzoek dat
      geheel of mede op deze gegevens is gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.6.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van beschikbaarstelling van de in
      het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6
  - number: 2.3.6a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een opleiding educatie gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een opleiding educatie aan de
      Informatie Beheer Groep, tezamen de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.b
    text: de datum van inschrijving of einde inschrijving;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.c
    text: de opleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.d
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.e
    text: |-
      het al dan niet volgen van een educatief programma als bedoeld in
      [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 2.3.6a.2.f
    text: |-
      de behaalde certificaten, de vakken waarin examen is afgelegd, de cijfers van het schoolexamen en het centraal
      examen, de eindcijfers en de uitslag van het eindexamen of het deeleindexamen;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.g
    text: |-
      het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald alsmede, voor zover het
      Nederlands als tweede taal (NT2) betreft, het startniveau;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.h
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.i
    text: indien van toepassing het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.k
    text: indien van toepassing het zijn van examendeelnemer; en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.2.l
    text: het aantal uren per week dat onderwijs wordt gevolgd aan de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede en
      zesde lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zesde lid, niet langer behoeven te
      worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen en de wijze
      van verstrekking van de gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.4
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.1.8, eerste lid][ref1], het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6a.6
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.8
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding educatie in het contact
      met een andere instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving
      van die deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
  - number: 2.3.6a.9
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een opleiding educatie ter
      uitvoering van [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.3.6b.1
    text: |-
      De Informatie Beheer Groep neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere
      gegevens, bedoeld in [artikel 2.3.6a, tweede lid][ref1], op in het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref2], nadat zij deze gegevens heeft getoetst
      op juistheid en volledigheid. De Informatie Beheer Groep verstrekt de gegevens, inclusief de gegevens, bedoeld
      in [artikel 9b, eerste lid, onderdeel g, van de Wet verzelfstandiging Informatiseringsbank][ref3], zoals zij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. De Informatie Beheer
      Groep kan de door het bevoegd gezag verstrekte gegevens uitsluitend met instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0006320#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0006320
        artikel: 9b
  - number: 2.3.6b.2
    text: |-
      Het bevoegd gezag verstrekt de Informatie Beheer Groep alle inlichtingen die zij nodig acht voor de uitvoering
      van de taak, bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs
      opgenomen gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6b
  - number: 2.3.6c.1
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], aan Onze Minister de gegevens inzake educatie
      die Onze Minister nodig heeft voor de begrotings- en beleidsvoorbereiding.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6c
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 2.3.6c.2
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], aan de inspectie de gegevens inzake educatie
      die de inspectie nodig heeft voor het toezicht op het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6c
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 2.3.6c.3
    text: |-
      De gegevens, bedoeld in het eerste en het tweede lid, worden op een zodanige wijze verstrekt, dat de deelnemers
      aan een opleiding educatie niet geïdentificeerd of identificeerbaar zijn. Bij algemene maatregel van bestuur worden
      regels gesteld omtrent het verstrekken van de gegevens. Daarbij worden in ieder geval regels gesteld omtrent de
      inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens worden verstrekt, de tijdstippen waarop de
      gegevens worden verstrekt, en de perioden waarop de gegevens betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6c
  - number: 2.3.6c.4
    text: |-
      Onze Minister kan ten behoeve van de uitvoering van subsidieregelingen van het Europees Sociaal Fonds het
      persoonsgebonden nummer van een deelnemer gebruiken in het verkeer met een instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6c
  - number: 2.3.6d
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het sociaal-fiscaalnummer door
      de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een opleiding educatie of een
      voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.a
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.b
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.d
    text: |-
      verwerking van de gegevens, bedoeld in
      [artikel 9e, derde en vierde lid, van de Wet verzelfstandiging Informatiseringsbank][ref1] bij de registraties,
      bedoeld in de onderdelen a en b, en het systeem van doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9e
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9e
  - number: 2.4.1.1
    text: |-
      De rijksbijdrage voor de kenniscentra beroepsonderwijs bedrijfsleven waarop de in [artikel 1.5.1][ref1] bedoelde
      aanspraak betrekking heeft wordt, binnen het raam van de door begrotingswetgever beschikbaar gestelde middelen,
      per kenniscentrum berekend aan de hand van maatstaven, neergelegd in een berekeningswijze, vastgesteld bij of
      krachtens algemene maatregel van bestuur. De maatstaven hebben in elk geval betrekking op de aard en de omvang van
      de werkzaamheden, bedoeld in [artikel 1.5.2][ref2], voor zover niet verricht in het kader van dienstverlening. Wat
      huisvestingskosten betreft wordt de rijksbijdrage berekend hetzij op grond van die berekeningswijze hetzij op grond
      van een andere bij of krachtens algemene maatregel van bestuur te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.4.1.2
    text: |-
      Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een bedrag
      in mindering gebracht in verband met werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid alsmede
      uitkeringen wegens ziekte en arbeidsongeschiktheid anders dan op grond van de [Ziektewet][ref1] aan gewezen
      personeel van kenniscentra beroepsonderwijs bedrijfsleven. De [artikelen 2.2.1, vijfde lid, tweede volzin][ref2],
      en [2.2.4a][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.4.1.3
    text: |-
      Een in het eerste lid en in het tweede lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.1
  - number: 2.4.2.1
    text: |-
      Onze Minister maakt aan elk kenniscentrum beroepsonderwijs bedrijfsleven jaarlijks in september bekend, welke
      rijksbijdrage voor het daarop volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage
      is berekend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.2
  - number: 2.4.2.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.2
  - number: 2.4.2.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.2
  - number: 2.4.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Indien bijzondere ontwikkelingen in het beroepsonderwijs daartoe aanleiding geven, kan volgens bij ministeriële
      regeling te stellen voorwaarden aan de kenniscentra beroepsonderwijs bedrijfsleven voor een bij die regeling te
      bepalen periode een aanvullende rijksbijdrage worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.4.3
  - number: 2.5.1
    text: |-
      Voor de toepassing van deze paragraaf wordt onder "instelling" tevens verstaan: agrarisch innovatie- en
      praktijkcentrum.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.1
  - number: 2.5.2.1
    text: |-
      Het bevoegd gezag stelt jaarlijks voor het eerstvolgende begrotingsjaar een begroting voor de instelling vast. Het
      begrotingsjaar valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.2
  - number: 2.5.2.2
    text: |-
      De begroting behelst een raming van de baten en lasten van de instelling en is sluitend. De in de begroting
      voorziene baten uit de rijksbijdrage komen overeen met de voor het desbetreffende jaar door Onze Minister
      vastgestelde rijksbijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.2
  - number: 2.5.2.3
    text: Het bevoegd gezag doet de noodzakelijke uitgaven binnen de grenzen van de begroting.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.2
  - number: 2.5.2.4
    text: |-
      Af- en overschrijving op de uitgavenposten van de begroting kunnen door het bevoegd gezag geschieden overeenkomstig
      door het bevoegd gezag vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.2
  - number: 2.5.3.1
    text: Het bevoegd gezag stelt jaarlijks een jaarrekening vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.2
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financiële beheer van de instelling voor
      zover het betreft de ingevolge deze wet uit ’s Rijks kas ontvangen middelen. Uit de jaarrekening dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de rijksbijdrage. Van niet doelmatige aanwending
      van de rijksbijdrage is in ieder geval sprake voorzover bedragen daaruit worden aangewend voor het op enigerlei
      wijze compenseren van de deelnemers of examendeelnemers voor les- en cursusgeld respectievelijk examengeld. In de
      jaarrekening zijn de cijfers van de begroting mede opgenomen. Bij ministeriële regeling kunnen met het oog op de
      verantwoording van de rechtmatigheid en doelmatigheid van de aanwending van de rijksbijdrage nadere voorschriften
      worden gegeven voor de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.3
    text: |-
      Het resultaat van het jaar waarop de jaarrekening betrekking heeft wordt verrekend met de algemene reserve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.4
    text: |-
      Het bevoegd gezag dient de jaarrekening voor 1 juli van het jaar volgend op het boekjaar bij Onze Minister in. De
      jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door het bevoegd gezag
      aangewezen accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Bij de
      aanwijzing van de accountant bedingt het bevoegd gezag dat aan Onze Minister op diens verzoek inzicht wordt geboden
      in de controlerapporten van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.5.3.5
    text: Het bevoegd gezag maakt de jaarrekening, vergezeld van de verklaring, bedoeld in het vierde lid, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.6
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de berekeningswijze,
      bedoeld in de [artikelen 2.2.2][ref1] en [2.2.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.5.3.7
    text: |-
      Het bevoegd gezag houdt per begrotingsjaar nauwkeurig boek van baten en lasten en draagt er zorg voor dat de baten
      en lasten nauwkeurig en herkenbaar zijn verwerkt in de in het zesde lid bedoelde informatieverzameling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.8
    text: |-
      Het bevoegd gezag bewaart de informatieverzameling en de desbetreffende boeken en bescheiden, bedoeld in het zesde
      en zevende lid, gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.3.9
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van beschikbaarstelling
      van de gegevens en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.3
  - number: 2.5.4.1
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het afgelopen jaar vast en maakt het openbaar. Het
      jaarverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.6, tweede lid][ref1], voorzover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten van de
      bevindingen van het Kwaliteitscentrum examinering beroepsopleidingen met betrekking tot de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 2.5.4.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.4
  - number: 2.5.5.1
    text: |-
      De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het beroepsonderwijs en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5
  - number: 2.5.5.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de wijze van beschikbaarstelling van de
      in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5
  - number: 2.5.5.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5
  - number: 2.5.5a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft, of, indien de deelnemer minderjarig is, met de ouders,
      voogden of verzorgers van deze deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een beroepsopleiding aan de
      Informatie Beheer Groep, tezamen met de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.b
    text: de datum van inschrijving of einde inschrijving;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.c
    text: de kwalificatie;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.d
    text: de leerweg;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.e
    text: het al dan niet hebben van een handicap of chronische ziekte die extra ondersteuning vraagt van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.f
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.g
    text: |-
      de behaalde deelkwalificaties, voorzover het betreft het beroepsonderwijs op het gebied van de landbouw en de
      natuurlijke omgeving;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.h
    text: het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.i
    text: |-
      de omvang van beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst en het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvorming verzorgt; en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.j
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.k
    text: het al dan niet zijn van risicodeelnemer;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.l
    text: het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.m
    text: indien van toepassing het zijn van examendeelnemer; en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.2.n
    text: het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding, al dan niet tezamen
      met een of meer van de gegevens, bedoeld in het tweede lid, gebruiken in het verkeer met Onze Minister ten behoeve
      van de vaststelling van de bekostiging van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1], gebruiken het
      persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in contacten met een gemeente in het kader van
      de [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      die wet door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
  - number: 2.5.5a.6
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.1.8, eerste lid][ref1], het persoonsgebonden nummer van de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5a.8
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het kader van
      de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het contact
      met een andere instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving
      van die deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
  - number: 2.5.5a.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een beroepsopleiding ter uitvoering
      van [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.5.5b.1
    text: |-
      De Informatie Beheer Groep neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere
      gegevens, bedoeld in [artikel 2.5.5a, tweede lid][ref1], op in het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref2], nadat zij deze gegevens heeft getoetst
      op juistheid en volledigheid. De Informatie Beheer Groep verstrekt de gegevens, inclusief de gegevens, bedoeld
      in artikel [9b, eerste lid, onderdeel g, van de Wet verzelfstandiging Informatiseringsbank][ref3], zoals zij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd de derde
      volzin van [artikel 2.5.5c, eerste lid][ref4], kan de Informatie Beheer Groep de door het bevoegd gezag verstrekte
      gegevens uitsluitend met instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0006320#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006320
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0006320
        artikel: 9b
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5b.2
    text: |-
      Het bevoegd gezag verstrekt de Informatie Beheer Groep alle inlichtingen die zij nodig acht voor de uitvoering
      van de taak, bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs
      opgenomen gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5b
  - number: 2.5.5b.3
    text: |-
      Indien de Informatie Beheer Groep naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan
      te nemen dat een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet,
      meldt zij dit aan Onze Minister. Indien Onze Minister een onderzoek door de inspectie nodig acht, verstrekt de
      Informatie Beheer Groep ten behoeve van dit onderzoek de persoonsgebonden nummers en andere gegevens van deelnemers
      aan een beroepsopleiding aan de inspectie. De inspectie meldt de uitkomst van het onderzoek aan Onze Minister en de
      Informatie Beheer Groep. Indien de inspectie constateert dat het bevoegd gezag in strijd handelt of heeft gehandeld
      met het bepaalde bij of krachtens deze wet, meldt zij de uitkomst van het onderzoek aan Onze Minister, tezamen met
      de voor die uitkomst relevante gegevens die aan de inspectie werden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5b
  - number: 2.5.5b.4
    text: |-
      Onze Minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, tweede lid, van de Vreemdelingenwet 2000][ref1] geen gegevens die zij op grond van het derde lid
      hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 2.5.5c.1
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], aan Onze Minister de gegevens inzake
      beroepsonderwijs die Onze Minister nodig heeft voor de bekostiging van instellingen en de begrotings- en
      beleidsvoorbereiding. Voorzover de door het bevoegd gezag aan de Informatie Beheer Groep verstrekte gegevens
      naar het oordeel van Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling
      van de bekostiging van deze gegevens afwijken. De Informatie Beheer Groep neemt in dat geval de door Onze
      Minister vastgestelde gewijzigde gegevens op in het basisregister onderwijs, nadat het desbetreffende besluit tot
      vaststelling van de bekostiging onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 2.5.5c.2
    text: |-
      De Informatie Beheer Groep verstrekt uit het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], aan de inspectie de gegevens inzake
      beroepsonderwijs die de inspectie nodig heeft voor het toezicht op het onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 2.5.5c.3
    text: |-
      Onverminderd [artikel 2.5.5b, derde lid][ref1], worden de gegevens, bedoeld in het eerste en het tweede lid, op een
      zodanige wijze verstrekt, dat de deelnemers aan een beroepsopleiding niet geïdentificeerd of identificeerbaar zijn.
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het verstrekken van de gegevens. Daarbij worden
      in ieder geval regels gesteld omtrent de inhoud en de samenstelling van de gegevens, de wijze waarop de gegevens
      worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt, en de perioden waarop de gegevens betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5d.1
    text: |-
      Onze Minister is bevoegd het basisregister onderwijs, bedoeld in
      [artikel 9a van de Wet verzelfstandiging Informatiseringsbank][ref1], te raadplegen ten behoeve van de vaststelling
      van de bekostiging van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5d
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9a
  - number: 2.5.5d.2
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke gegevens als bedoeld in [artikel 2.5.5a, tweede lid][ref1],
      Onze Minister kan raadplegen tezamen met het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding.
      Bij deze algemene maatregel van bestuur wordt voorts bepaald op welke wijze en onder welke voorwaarden Onze
      Minister het basisregister onderwijs kan raadplegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5d.3
    text: |-
      Onze Minister kan ten behoeve van de vaststelling van de bekostiging van een instelling het persoonsgebonden nummer
      van een deelnemer aan een beroepsopleiding gebruiken in het verkeer met die instelling, al dan niet tezamen met de
      gegevens, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5d
  - number: 2.5.5d.4
    text: |-
      Onze Minister kan ten behoeve van de uitvoering van subsidieregelingen van het Europees Sociaal Fonds het
      persoonsgebonden nummer van een deelnemer gebruiken in het verkeer met een instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5d
  - number: 2.5.5e
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het sociaal-fiscaalnummer door
      de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding of een
      voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 2.5.5e.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.d
    text: |-
      verwerking van de gegevens, bedoeld in
      [artikel 9e, derde en vierde lid, van de Wet verzelfstandiging Informatiseringsbank][ref1] bij de registraties,
      bedoeld in de onderdelen a en b, en het systeem van doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0006320#Artikel9e
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0006320
        artikel: 9e
  - number: 2.5.6
    text: |-
      Onze Minister kan naast het accountantsonderzoek, bedoeld in [artikel 2.5.3, vierde lid][ref1], een onderzoek
      instellen of doen instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 2.5.5][ref2], naar
      de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de instelling. Het bevoegd
      gezag verstrekt aan degene die door Onze Minister met het onderzoek is belast alle inlichtingen die deze voor de
      uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in informatie, boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.7
    text: |-
      De accountant die door Onze Minister is belast met het onderzoek van de ministeriële jaarrekening, heeft met het
      oog op het verrichten van dat onderzoek toegang tot elke instelling. Aan de accountant wordt desgevraagd inzage
      in de informatie en in de boeken en bescheiden gegeven en worden alle inlichtingen verstrekt die deze voor de
      uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.7
  - number: 2.5.7a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.7a
  - number: 2.5.8.2
    text: |-
      Op de rijksbijdrage worden in mindering gebracht de salarissen, toelagen, uitkeringen of andere bijdragen waarop
      aanspraak wordt gemaakt door personeel dat:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.8
  - number: 2.5.8.2.a
    text: |-
      langer dan twee jaar anders dan wegens vervanging of in geval van docenten indien de benoeming is geschied wegens
      tijdelijke afwezigheid van een docent, onafgebroken, met een onderbreking van een week of minder dan wel met een of
      meer onderbrekingen gedurende een instellingsvakantie, in een gelijksoortige functie in tijdelijke dienst verbonden
      is geweest aan een instelling van het bevoegd gezag, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.8
  - number: 2.5.8.2.b
    text: |-
      langer dan drie jaar direct of indirect in verband met het verrichten van contractactiviteiten in tijdelijke dienst
      is benoemd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.8
  - number: 2.5.8.6
    text: |-
      De vermindering, bedoeld in het tweede lid, onderdeel a, vindt niet plaats indien toepassing is gegeven aan
      [artikel 4.2.1, derde lid, onderdeel b][ref1]. Bij ministeriële regeling wordt bepaald in welke overige gevallen
      geen vermindering plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 2.5.9.1
    text: |-
      Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. De correctie wordt
      verrekend met de rijksbijdrage voor het desbetreffende jaar of uitbetaald in dat jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.9
  - number: 2.5.9.2
    text: |-
      Indien uit de jaarrekening, uit de verklaring van de accountant, bedoeld in [artikel 2.5.3, vierde lid][ref1], uit
      de resultaten van het onderzoek, bedoeld in [artikel 2.5.6][ref2], of uit de resultaten van het onderzoek, bedoeld
      in [artikel 2.5.7][ref3] blijkt dat de rijksbijdrage op onjuiste gronden is vastgesteld dan wel de besteding
      daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister binnen een jaar na ontvangst van de jaarrekening
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen een jaar na ontvangst
      van de jaarrekening een correctie als bedoeld in de eerste volzin bekend. De correctie wordt verrekend met de
      rijksbijdrage voor het eerstvolgende jaar of uitbetaald in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.9a.1
    text: |-
      Voor 1 juli van het jaar volgend op het jaar waarvoor de middelen aan het college van burgemeester en wethouders
      worden verstrekt, dient het college van burgemeester en wethouders bij Onze Minister een verantwoording in waaruit
      blijkt dat de rijksbijdrage, bedoeld in [artikel 2.3.1, eerste lid][ref1], door het college van burgemeester en
      wethouders rechtmatig is besteed. Indien activiteiten als bedoeld in [artikel 2.3.4, derde lid, onder a][ref2],
      waarvoor het college van burgemeester en wethouders zich heeft verplicht, niet of niet volledig zijn verricht en
      het college van burgemeester en wethouders uit dien hoofde in enig jaar aanspraken heeft jegens de instelling,
      besteedt het college van burgemeester en wethouders de uit die aanspraken voortvloeiende middelen uiterlijk in het
      jaar volgend op het jaar waarin die middelen zijn terugontvangen, en verantwoordt het college van burgemeester en
      wethouders die middelen in het jaar volgend op het jaar waarin de middelen zijn besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.9a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.9a.2
    text: Ten behoeve van de verklaring van de accountant wordt bij ministeriële regeling een controleprotocol opgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.9a
  - number: 2.5.9a.3
    text: |-
      De financiële verantwoording wordt ingericht volgens een bij ministeriële regeling vastgesteld model
      en is voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. Aan Onze Minister wordt op diens verzoek
      inzicht gegeven in de gegevens die bij de controle op enigerlei wijze een rol spelen, en in de controlerapporten
      van de accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.9a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.5.10
    text: |-
      De [artikelen 2.5.2 tot en met 2.5.9][ref1] zijn van overeenkomstige toepassing op de kenniscentra beroepsonderwijs
      bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.6.1
    text: |-
      In een scholengemeenschap zijn tot één instelling verenigd een regionaal opleidingencentrum en een
      school voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref1], dan wel een
      agrarisch opleidingscentrum en een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 9 van de Wet op het voortgezet onderwijs][ref2]. Ten aanzien van een school voor voortgezet onderwijs die
      deel uitmaakt van een scholengemeenschap als bedoeld in de eerste volzin, bestaat aanspraak op rijksbijdrage ten
      aanzien van de huisvesting, waarvoor bij of krachtens algemene maatregel van bestuur een berekeningswijze wordt
      vastgesteld. [Hoofdstuk 2, titel 8][ref3], is van overeenkomstige toepassing ten aanzien van een scholengemeenschap
      als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten behoeve van scholengemeenschappen
      als bedoeld in het eerste lid nadere voorschriften worden gegeven, zo nodig in afwijking van
      [hoofdstuk 1, titel 3, paragraaf 3][ref1], [hoofdstuk 2][ref2], [hoofdstuk 4][ref3] en [hoofdstuk 7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 2.6a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten behoeve van het voorbereidend beroepsonderwijs, verzorgd in
      agrarische opleidingscentra, worden vastgesteld dat het bepaalde bij of krachtens deze wet geheel of gedeeltelijk
      niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6a
  - number: 2.6aa.1
    text: |-
      Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in en met inachtneming
      van [artikel 25a van de Wet op het voortgezet onderwijs][ref2] ook tot onderwijs- en examenvoorzieningen van de
      instelling toelaten zij die niet als deelnemer of examendeelnemer aan de instelling worden ingeschreven maar zijn
      ingeschreven als leerling aan een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 2.6aa.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld over de verantwoording van de bedragen
      die het bevoegd gezag met toepassing van [artikel 99, achtste lid, van de Wet op het voortgezet onderwijs][ref1]
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
  - number: 2.6aa.3
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet onderwijs ter uitvoering van
      [artikel 25a, eerste en tweede lid, van de Wet op het voortgezet onderwijs][ref1] leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een instelling
      van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen van het
      [derde lid, aanhef en onder a tot en met e, van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: '2.7'
    text: |-
      Onze Minister kan volgens bij ministeriële regeling te geven voorschriften aan andere rechtspersonen dan
      die waarvan de instellingen uitgaan, een bijdrage toekennen ter bevordering van de verwezenlijking van de in
      [artikel 1.2.1][ref1] bedoelde doelstellingen van de educatie en het beroepsonderwijs dan wel ten behoeve van
      de afstemming tussen onderwijs en arbeidsmarkt. Voor zover toepassing van de eerste volzin het verstrekken van
      subsidie betreft, zijn de [artikelen 4 tot en met 19 van de Wet overige OCenW-subsidies][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 2.8.1.1
    text: |-
      Elke instelling is aangesloten bij de door de bevoegde gezagsorganen gezamenlijk opgerichte rechtspersoon met
      volledige rechtsbevoegdheid, zonder winstoogmerk, die zich ten doel stelt zich borg te stellen voor de nakoming
      van rente- en aflossingsverplichtingen, voortvloeiend uit de door het bevoegd gezag van de instelling aangegane
      leningen, door instandhouding van een onafhankelijk functionerend fonds met een onafhankelijk van de instellingen
      functionerend bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.2
    text: |-
      Elke instelling draagt aan het fonds op zodanige wijze bij, dat door de gezamenlijke bijdragen het functioneren van
      het fonds is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3
    text: |-
      De gezamenlijke instellingen dragen er zorg voor dat in de statuten van de rechtspersoon, bedoeld in het eerste
      lid, in elk geval is opgenomen:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.a
    text: |-
      dat ingeval van door de rechtspersoon te stellen algemene voorwaarden aan het verlenen van borgstelling, deze
      uitsluitend van financiële aard zijn en uitsluitend betrekking hebben op de te waarborgen lening,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.b
    text: |-
      dat ingeval de instelling aan de onder *a* bedoelde voorwaarden voldoet, borgstelling door de rechtspersoon niet
      kan worden geweigerd,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.c
    text: |-
      dat als blijkt dat een instelling niet in staat is tot nakoming van rente- en aflossingsverplichtingen, de
      instelling verplicht is een saneringsplan aan het waarborgfonds over te leggen, waarin is aangegeven op welke wijze
      en binnen welke termijn het evenwicht tussen inkomsten en uitgaven van de instelling hersteld kan worden,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.d
    text: |-
      dat de door de rechtspersoon te stellen voorwaarden in het kader van door hem te waarborgen leningen niet in strijd
      komen met de vrijheid van organisatie en inrichting van het onderwijs binnen de instellingen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.e
    text: |-
      dat een batig saldo van het fonds kan worden uitgekeerd aan de bevoegde gezagsorganen van de instellingen, onder de
      voorwaarde dat een uitkering door het bevoegd gezag van een instelling uitsluitend wordt besteed ten behoeve van de
      werkzaamheden van de instelling waarvoor de rijksbijdrage wordt verleend, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.3.f
    text: |-
      een regeling omtrent de te volgen procedure en te treffen voorzieningen in geval van taakverwaarlozing door het
      bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.1.4
    text: |-
      Van de in het eerste lid bedoelde verplichting kan Onze Minister op verzoek van het bevoegd gezag van een
      bijzondere instelling ontheffing verlenen op grond van bedenkingen van godsdienstige of levensbeschouwelijke aard.
      Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening
      is getroffen voor het waarborgen van het voortbestaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.1
  - number: 2.8.2.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere instelling
      draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de bekostiging, zorg
      voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld
      van een verklaring omtrent de getrouwheid van een door het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.8.2.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.2
  - number: 2.8.2.3
    text: |-
      Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven deelnemers het onderwijs aan een andere instelling kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.2
  - number: 2.8.3
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel2.8.3
  - number: 3.1.1.1
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap en Onze Minister van Landbouw, Natuur en Voedselkwaliteit
      plegen geregeld overleg met een vertegenwoordiging van de instellingen, van de andere instellingen, bedoeld in
      de [artikelen 1.4.1][ref1] en [1.4a.1][ref2], van de exameninstellingen, bedoeld in [artikel 1.6.1][ref3], van
      de kenniscentra beroepsonderwijs bedrijfsleven en van de colleges van burgemeester en wethouders, gezamenlijk dan
      wel afzonderlijk, over aangelegenheden van algemeen beleid met betrekking tot de educatie en het beroepsonderwijs,
      waaronder mede wordt verstaan het informatieverkeer met Onze Minister. Het gezamenlijk overleg wordt aangeduid als
      EB-kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 3.1.1.2
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit pleegt geregeld overleg met een vertegenwoordiging van
      de agrarische opleidingscentra, het kenniscentrum beroepsonderwijs bedrijfsleven werkzaam op het gebied van
      de landbouw en de natuurlijke omgeving en de agrarische innovatie- en praktijkcentra, over aangelegenheden van
      algemeen beleid met betrekking tot het beroepsonderwijs op het gebied van de landbouw en de natuurlijke omgeving
      voor zover die aangelegenheden niet behoren tot de in het eerste lid bedoelde aangelegenheden van algemeen beleid
      met betrekking tot het beroepsonderwijs. Dit overleg wordt aangeduid als AB-kamer.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
  - number: 3.1.1.3
    text: 'Het in het eerste en tweede lid bedoelde overleg heeft onder meer betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
  - number: 3.1.1.3.a
    text: |-
      de wijze van de verslaglegging, bedoeld in [artikel 1.3.6, tweede lid][ref1], en bedoeld in
      [artikel 1.6.1, tweede lid, onderdeel c][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 3.1.1.3.b
    text: |-
      de wijze waarop het aantal behaalde diploma's, bedoeld in [artikel 2.2.2, tweede lid][ref1], als maatstaf wordt
      betrokken in de algemene berekeningswijze, bedoeld in [artikel 2.2.1, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.1.1.3.c
    text: |-
      de voorgenomen toepassing van [artikel 2.3.6, tweede en derde lid][ref1], en [2.5.5, tweede en derde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.1.1.3.d
    text: |-
      de voorgenomen toepassing van [artikel 8.1.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 3.1.1.4
    text: |-
      In elk geval ten aanzien van de in het derde lid genoemde onderwerpen is het overleg gericht op het bereiken van
      overeenstemming. Indien overeenstemming uitblijft, kan ten aanzien van die onderwerpen uitvoering worden gegeven
      aan het ter zake bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.1.1
  - number: 3.2.1
    text: |-
      Over de regelingen, bedoeld in [artikel 4.1.2, eerste en vierde lid][ref1], alsmede over andere aangelegenheden
      van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd gezag van de
      instellingen en de agrarische innovatie- en praktijkcentra overleg gevoerd met de daarvoor in aanmerking komende
      vakorganisaties van overheids- en onderwijspersoneel, op een met deze schriftelijk overeengekomen wijze. In geval
      van een geschil over de deelneming aan het overleg, bedoeld in de eerste volzin, alsmede in geval van een geschil
      over de aard, de inhoud en de organisatie van het overleg leggen de betrokken partijen het geschil voor aan een
      geschillencommissie. Deze geschillencommissie bestaat uit drie personen, die door de partijen gezamenlijk worden
      aangewezen. De uitspraak van de geschillencommissie heeft bindende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 3.3.1
    text: |-
      [Artikel 3.2.1][ref1] is van overeenkomstige toepassing op de kenniscentra beroepsonderwijs bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel3
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '3'
        hoofdstuk: '3'
  - number: 4.1.1
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.1
  - number: 4.1.1a.1
    text: |-
      Het bevoegd gezag stelt ten behoeve van de leidinggevende functies in de instelling, indien van een
      ondervertegenwoordiging van vrouwen in de leidinggevende functies sprake is, eenmaal in de 4 jaar een document
      inzake evenredige vertegenwoordiging van vrouwen in leidinggevende functies vast.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.1a
  - number: 4.1.1a.2
    text: |-
      Het document bevat streefcijfers, met inbegrip van een bepaald tijdvak waarbinnen deze streefcijfers worden
      gerealiseerd, aan de hand waarvan door het bevoegd gezag een beleid inzake evenredige vertegenwoordiging van
      vrouwen in de leidinggevende functies wordt gevoerd, opdat in de leidinggevende functies van de instelling vrouwen
      en mannen naar evenredigheid werkzaam zullen zijn. Voor de evenredige vertegenwoordiging wordt uitgegaan van de
      verhouding mannen en vrouwen voor wat betreft het onderwijzend personeel dat werkzaam is in het door de instelling
      verzorgde onderwijs, zoals die blijkt uit de daarover jaarlijks door Onze Minister gepubliceerde cijfers. Het
      document vermeldt tevens de maatregelen die het bevoegd gezag heeft genomen en zal nemen teneinde de in de eerste
      volzin bedoelde streefcijfers te realiseren en geeft een overzicht van de beoogde en bereikte resultaten van het
      beleid inzake evenredige vertegenwoordiging van vrouwen in de leidinggevende functies gedurende de periode waarvoor
      het document geldt, onderscheidenlijk de periode waarvoor het vorige document gold.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.1a
  - number: 4.1.1a.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat een exemplaar van het document ter inzage wordt gelegd op een voor het
      personeel en de deelnemers aan het onderwijs toegankelijke plaats, alsmede dat een exemplaar wordt bewaard bij de
      administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.1a
  - number: 4.1.2.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur gestelde regels als bedoeld in het tweede en
      derde lid, regelt het bevoegd gezag van een openbare instelling de rechtspositie van het personeel en draagt het
      bevoegd gezag van een bijzondere instelling zorg voor de regeling van de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
  - number: 4.1.2.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
  - number: 4.1.2.2.a
    text: |-
      salarisschalen en uitgangspunten waaraan een door het bevoegd gezag in te richten functiewaarderingssysteem moet
      voldoen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
  - number: 4.1.2.2.b
    text: |-
      rechten en plichten van het personeel en het bevoegd gezag bij ziekte, zwangerschap, bevalling,
      arbeidsongeschiktheid en ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover
      deze bij wet voorgeschreven rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bevoegd
      gezag deze rechten en plichten zelf regelt dan wel voor de regeling daarvan zorg draagt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
  - number: 4.1.2.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
  - number: 4.1.2.4
    text: |-
      Onder regeling van de rechtspositie als bedoeld in het eerste lid, wordt tevens begrepen het vaststellen van
      bepalingen inzake benoeming, schorsing, disciplinaire maatregelen en ontslag van personeel. De bepalingen
      omtrent ontslag mogen het personeel van de openbare instellingen niet minder rechten verschaffen dan die
      welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van de
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 4.1.3
    text: |-
      In afwijking van de regelingen, bedoeld in [artikel 4.1.2, eerste en vierde lid][ref1], leggen de gedeputeerde
      staten van de desbetreffende provincie de disciplinaire maatregel of de schorsing op of verlenen zij het ontslag,
      indien het betreft een lid van de centrale directie, een lid van het college van bestuur of een docent aan een
      gemeentelijke instelling, die tevens lid is van de raad van de gemeente die de instelling in stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.4
    text: |-
      De [artikelen 4.1.1][ref1] en [4.1.2][ref2] zijn van overeenkomstige toepassing op de agrarische innovatie- en
      praktijkcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.5.1
    text: |-
      Elke bijzondere instelling is aangesloten bij een commissie van beroep, waarbij door elk personeelslid van die
      instelling dat rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen een beslissing, door het
      bevoegd gezag genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.c
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.d
    text: het direct of indirect onthouden van bevordering,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.e
    text: het verminderen van de omvang van de betrekking, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.1.f
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.5.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.5
  - number: 4.1.6.1
    text: Een commissie van beroep strekt haar werkzaamheden uit over een of meer bijzondere instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.2
    text: |-
      De commissie bestaat uit een even aantal gewone leden en evenveel plaatsvervangende leden. De bevoegde
      gezagsorganen en het personeel van de aangesloten instellingen kiezen elk de helft van het aantal gewone leden en
      plaatsvervangende leden. De gewone leden kiezen de voorzitter, tevens lid, en de plaatsvervangend voorzitter. De
      voorzitter, de plaatsvervangend voorzitter, de gewone leden en de plaatsvervangende leden worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaren. Zij zijn opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.3
    text: |-
      De leden en de plaatsvervangende leden, alsmede de voorzitter en de plaatsvervangend voorzitter mogen niet behoren
      tot het bevoegd gezag noch deel uitmaken van het personeel van een aangesloten instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen, alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van de derde volzin wordt verleend, wordt de betrokkene van het voornemen tot ontslag in kennis
      gesteld en wordt hem de gelegenheid gegeven zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.5
    text: De uitspraak van de commissie van beroep bindt het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.6
    text: |-
      De bevoegde gezagsorganen van de aangesloten instellingen stellen voor de commissie van beroep een beroepsreglement
      vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is gewaarborgd. In het
      beroepsreglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.6.a
    text: de omvang van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.6.b
    text: de zittingstermijn van de leden en plaatsvervangende leden van de commissie,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.6.c
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.6.d
    text: de wijze waarop in het secretariaat wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.6.7
    text: |-
      Het beroepsreglement wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging is
      gehoord.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.6
  - number: 4.1.7
    text: |-
      Het bevoegd gezag en het personeel van de instelling verstrekken aan de commissie van beroep de inlichtingen die
      zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.1.7
  - number: 4.2.1.1
    text: Docenten worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming.
