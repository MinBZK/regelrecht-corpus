  - number: 4.2.1.2.d
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      In geval van een geschiktheidsverklaring als bedoeld in [artikel 4.2.4][ref1] vindt de benoeming of
      tewerkstelling zonder benoeming voor zover betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] plaats voor een periode van
      ten hoogste twee aaneengesloten studiejaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door
      dat gezag te stellen voorwaarden, verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen
      aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van de tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.2.1.4
    text: Het tweede lid is niet van toepassing voor zover een docent is belast met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.1
  - number: 4.2.1.5
    text: |-
      Het bevoegd gezag kan ten aanzien van een docent voor een periode van ten hoogste twee jaar afwijken van de
      eisen, bedoeld in het tweede lid, onder b en c. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn
      verlengen met ten hoogste twee jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de
      voortgang van het onderwijs aan de school. In dat geval verklaren het bevoegd gezag en de betrokkene in ieder geval
      schriftelijk dat betrokkene verplicht is zich in te spannen om binnen de verlengingsperiode alsnog te voldoen aan
      de eisen, bedoeld in het tweede lid, onder b. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot
      de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.1
  - number: 4.2.1.6
    text: |-
      Het bevoegd gezag kan afwijken van het tweede lid, onder b en c, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en
      het bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van
      een daartoe door het bevoegd gezag aan te wijzen docent voor een beperkte betrekkingsomvang te worden belast met
      het uitsluitend verzorgen van onderwijsonderdelen waar die specifieke kennis en bekwaamheden in het bijzonder
      betrekking op hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde te verzorgen
      onderwijsonderdelen ten hoogste een aantal van gemiddeld 4 klokuren per week op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.1
  - number: 4.2.2.1
    text: |-
      Onderwijsondersteunende werkzaamheden waarvoor op grond van [artikel 4.2.3, tweede lid][ref1], bekwaamheidseisen
      zijn vastgesteld, mogen slechts worden verricht door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1], die op het tijdstip van
      overlegging aan het bevoegd gezag niet ouder is dan 6 maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: 4.2.2.1.b
    text: |-
      in het bezit is van een bij ministeriële regeling aangewezen getuigschrift waaruit blijkt dat wordt voldaan aan de
      in [artikel 4.2.3, tweede lid][ref1], bedoelde bekwaamheidseisen, voor zover vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.1.c
    text: |-
      in het bezit is van een ten aanzien van de door hem te verrichten werkzaamheden, al
      dan niet bedoeld in [artikel 4.2.3, tweede lid][ref1], afgegeven EG-verklaring als
      bedoeld in de [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2] dan wel in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006317
      [ref3]: https://wetten.overheid.nl/BWBR0006781
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006317
      - id: ref3
        bwb_id: BWBR0006781
  - number: 4.2.2.1.d
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
  - number: 4.2.2.1.e
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
  - number: 4.2.2.2
    text: |-
      Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] en deelnemers
      aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in [artikel 7.2.2][ref2] die in het kader van die
      opleiding onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 4.2.3, tweede lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid,
      onder b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.4
    text: |-
      Het bevoegd gezag kan voor een periode van ten hoogste twee jaar afwijken van de eisen, bedoeld in het eerste
      lid, onder b tot en met d. Het bevoegd gezag kan deze periode met ten hoogste de helft verlengen indien bijzondere
      omstandigheden daartoe naar zijn oordeel aanleiding geven. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.2
  - number: 4.2.3.1
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor de uitoefening van het docentschap.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.2
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.3.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.3.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste en tweede lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3.5
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste
      en tweede lid bedoelde bekwaamheidseisen. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal
      in de zes jaar in de gelegenheid, hem een voorstel te doen over ongewijzigde handhaving of wijziging van de
      bekwaamheidseisen voor zover vastgesteld. Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens,
      in hoeverre dat voorstel mede steun geniet van een vertegenwoordiging van bevoegde gezagsorganen, van ouders en
      van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3
  - number: 4.2.3a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.3a
  - number: 4.2.4.1
    text: |-
      Aan degene die niet in het bezit is van een in artikel 4.2.1, tweede lid, onder b, genoemd getuigschrift of diploma
      respectievelijk genoemde verklaring wordt door het bevoegd gezag dat voornemens is betrokkene te benoemen een
      geschiktheidsverklaring afgegeven, indien de betrokkene naar het oordeel van het bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.1.a
    text: vakinhoudelijk bekwaam is en geschikt is voor het beroep van docent, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.1.b
    text: |-
      voldoet aan de in artikel 4.2.3, derde lid, onder a genoemde eisen, blijkend uit het bezit van een getuigschrift
      als bedoeld in artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.1.c
    text: |-
      in staat is verantwoord les te geven en binnen twee jaar na benoeming of tewerkstelling zonder benoeming tot docent
      te voldoen aan de in artikel 4.2.3, derde lid, onder a, genoemde eisen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2
    text: 'Het bevoegd gezag geeft de in het eerste lid bedoelde verklaring slechts af, indien:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2.a
    text: |-
      betrokkene in het bezit is van een getuigschrift van een met goed gevolg afgelegd afsluitend examen van een
      opleiding in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de Wet op het hoger
      onderwijs en wetenschappelijk onderzoek, niet zijnde een getuigschrift als bedoeld in artikel 4.2.1, tweede lid,
      onderdeel b 1° tot en met 4°,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2.b
    text: |-
      betrokkene in het bezit is van een EG-verklaring als bedoeld in de Algemene wet erkenning EG-hoger-
      onderwijsdiploma's, niet zijnde een EG-verklaring als bedoeld in artikel 4.2.1, tweede lid, onderdeel b 5°,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2.c
    text: |-
      betrokkene in het bezit is van een buitenlands getuigschrift of diploma dat gelijkwaardig is aan een onder a
      bedoeld getuigschrift of een onder b bedoelde verklaring, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2.d
    text: |-
      betrokkene ten minste drie jaren ervaring heeft in de praktijk van het beroep waarop het desbetreffende onderwijs
      is gericht en naar het oordeel van het bevoegd gezag door een combinatie van opleiding en ervaring geacht
      wordt te beschikken over een kwalificatieniveau dat vergelijkbaar is met het onder a tot en met c bedoelde
      kwalificatieniveau, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.2.e
    text: |-
      de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge samenhang bezien,
      naar het oordeel van het bevoegd gezag van voldoende belang zijn in verhouding tot de beoogde werkzaamheden aan
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Indien betrokkene niet in het bezit is van een getuigschrift als bedoeld in artikel 7a.4 van de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek, stelt het bevoegd gezag vast, welke scholing en begeleiding voor
      betrokkene noodzakelijk zijn om binnen twee jaar na benoeming of tewerkstelling zonder benoeming te kunnen voldoen
      aan de in artikel 4.2.3, derde lid onder a, genoemde bekwaamheidseisen ten aanzien van pedagogisch-didactische
      kennis, inzicht en vaardigheden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.4
  - number: 4.2.5
    text: |-
      De op grond van artikel 4.2.4, derde lid, noodzakelijk geoordeelde scholing wordt uitgevoerd door of onder
      verantwoordelijkheid van een instelling voor hoger onderwijs als bedoeld in de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek die een lerarenopleiding verzorgt. Het bevoegd gezag stelt in overeenstemming met het
      bestuur van die instelling het voor betrokkene noodzakelijke scholingstraject vast.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2.5
  - number: 4.2a.1
    text: |-
      Tot lid van het personeel, anders dan bedoeld in de [artikelen 4.2.1][ref1] en [4.2.2][ref2], kan slechts
      worden benoemd degene die in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref3], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0014194
  - number: 4.3.1
    text: |-
      Het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven stelt jaarlijks het beleid vast met betrekking tot
      de formatie van het kenniscentrum beroepsonderwijs bedrijfsleven. Zoveel mogelijk tegelijk met deze vaststelling
      bepaalt het bestuur functies en taken van het personeel van het kenniscentrum beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.1
  - number: 4.3.2.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur gestelde regels als bedoeld in het tweede
      en derde lid, draagt het bestuur van een kenniscentra beroepsonderwijs bedrijfsleven zorg voor de regeling van de
      rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.2
  - number: 4.3.2.2.a
    text: salarisschalen en uitgangspunten waaraan een door het bestuur in te richten functiewaarderingssysteem moet voldoen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.2
  - number: 4.3.2.2.b
    text: |-
      rechten en plichten van het personeel en het bestuur bij ziekte, zwangerschap, bevalling, arbeidsongeschiktheid en
      ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover deze bij wet voorgeschreven
      rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bestuur deze rechten en plichten
      zelf regelt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.2
  - number: 4.3.2.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.2
  - number: 4.3.3.1
    text: |-
      Elk kenniscentrum beroepsonderwijs bedrijfsleven is aangesloten bij een commissie van beroep, waarbij door elk
      personeelslid van dat kenniscentrum dat rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen
      een beslissing, door het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.c
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.d
    text: het direct of indirect onthouden van bevordering,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.e
    text: het verminderen van de omvang van de betrekking, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.1.f
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.3.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie van beroep zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.3
  - number: 4.3.4.1
    text: |-
      Een commissie van beroep strekt haar werkzaamheden uit over ten minste drie kenniscentra beroepsonderwijs
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.2
    text: |-
      De commissie bestaat uit een even aantal gewone leden en evenveel plaatsvervangende leden. De besturen en het
      personeel van de kenniscentra beroepsonderwijs bedrijfsleven kiezen elk de helft van het aantal gewone leden en
      plaatsvervangende leden. De gewone leden kiezen de voorzitter, tevens lid, en de plaatsvervangend voorzitter. De
      voorzitter, de plaatsvervangend voorzitter, de gewone leden en de plaatsvervangende leden worden benoemd voor een
      termijn van ten minste drie en ten hoogste vijf jaren. Zij zijn opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.3
    text: |-
      De leden en de plaatsvervangende leden, alsmede de voorzitter en de plaatsvervangend voorzitter, mogen geen lid
      zijn van het bestuur noch deel uitmaken van het personeel van een aangesloten kenniscentrum beroepsonderwijs
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van de derde volzin wordt verleend, wordt de betrokkene van het voornemen tot ontslag in kennis
      gesteld en wordt hem de gelegenheid gegeven zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.5
    text: De uitspraak van de commissie van beroep bindt het bestuur van het kenniscentrum beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.6
    text: |-
      De besturen van de aangesloten kenniscentra beroepsonderwijs bedrijfsleven stellen voor de commissie van beroep
      een beroepsreglement vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is
      gewaarborgd. In het beroepsreglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.6.a
    text: de omvang van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.6.b
    text: de zittingstermijn van de leden en plaatsvervangende leden van de commissie,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.6.c
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.6.d
    text: de wijze waarop in het secretariaat wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.4.7
    text: |-
      Het beroepsreglement wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging is
      gehoord.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.4
  - number: 4.3.5
    text: |-
      Het bestuur en het personeel van het kenniscentrum beroepsonderwijs bedrijfsleven verstrekken aan de commissie van
      beroep de inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel4.3.5
  - number: 6.1.1
    text: |-
      Het bevoegd gezag bepaalt welke beroepsopleidingen de instelling verzorgt. Ten aanzien van die opleidingen geldt
      de aanspraak op bekostiging uitsluitend indien Onze Minister krachtens [artikel 2.1.1][ref1] heeft besloten dat de
      opleidingen voor bekostiging in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.1.2.1
    text: 'Onze Minister stelt een adviescommissie onderwijs-arbeidsmarkt in, belast met:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
  - number: 6.1.2.1.a
    text: |-
      de beoordeling van de doelmatigheid van de beroepsopleidingen die de instellingen voornemens zijn te verzorgen of
      reeds verzorgen, gelet op het geheel en de spreiding van het aanbod van beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
  - number: 6.1.2.1.b
    text: |-
      de beoordeling van het belang van beroepsopleidingen aan vakinstellingen, bedoeld in
      [artikel 6.1.3a, eerste lid, onderdeel b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.2.1.c
    text: |-
      de in [artikel 7.2.5][ref1] bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.2.2
    text: |-
      De commissie bestaat uit zes leden. Drie leden worden benoemd door Onze Minister. Van de overige leden wordt
      door Onze Minister een lid benoemd op voordracht van de kenniscentra beroepsonderwijs bedrijfsleven, een lid op
      voordracht van de werkgeversorganisaties en werknemersorganisaties, en een lid op voordracht van de instellingen en
      de andere instellingen, bedoeld in [artikel 1.4.1][ref1]. Onze Minister benoemt voor elk lid een plaatsvervangend
      lid. De derde volzin is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.1.2.3
    text: |-
      De leden en plaatsvervangende leden worden door Onze Minister geschorst en ontslagen. De benoeming geschiedt
      voor een termijn van vier jaren. De leden en plaatsvervangende leden zijn opnieuw benoembaar. De leden en
      plaatsvervangende leden worden tussentijds op eigen verzoek of om zwaarwichtige redenen ontslagen. Aan het ontslag
      om zwaarwichtige redenen kan een schorsing voorafgaan. Degene die een tussentijds opengevallen plaats vervult,
      wordt benoemd voor de duur van de voor degene in wiens plaats hij treedt nog resterende benoemingstermijn.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
  - number: 6.1.2.4
    text: Onze Minister kan aan de leden een tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.2
  - number: 6.1.3.1
    text: |-
      Onverminderd [artikel 6.1.3a][ref1] kan Onze Minister ten aanzien van een beroepsopleiding, vermeld in het
      overzicht, bedoeld in [artikel 2.1.1, derde lid][ref2], die de instelling voornemens is te verzorgen, de rechten,
      genoemd in [artikel 1.3.1][ref3], onthouden indien de verzorging van die opleiding kennelijk niet doelmatig kan
      worden geacht, gelet op het geheel en de spreiding van het aanbod van beroepsonderwijs. Onze Minister kan alvorens
      een beschikking als bedoeld in de eerste volzin te nemen, de commissie, bedoeld in [artikel 6.1.2][ref4], horen.
      Indien het betreft een beroepsopleiding waarvan Onze Minister ingevolge [artikel 7.2.4][ref5], derde lid, heeft
      besloten dat zij zowel in de beroepsopleidende als de beroepsbegeleidende leerweg kan worden verzorgd, zijn de
      eerste en tweede volzin van overeenkomstige toepassing ten aanzien van de afzonderlijke leerwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.3.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
  - number: 6.1.3.2.a
    text: |-
      geen aanspraak bestaat op bekostiging als bedoeld in [artikel 1.3.1][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.3.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.3.2.c
    text: de registratie in het Centraal register wordt geweigerd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
  - number: 6.1.3.3
    text: |-
      Onze Minister neemt een beschikking als bedoeld in het eerste lid voor 1 februari van het jaar waarin een aanvang
      zal worden gemaakt met het onderwijs en doet de commissie, bedoeld in [artikel 6.1.2][ref1], daarvan mededeling.
      Wanneer Onze Minister daarbij afwijkt van het standpunt van de commissie, doet hij de Tweede Kamer der Staten-
      Generaal daarvan mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.3a.1
    text: |-
      Indien een beroepsopleiding die een vakinstelling voornemens is te verzorgen, niet behoort tot het werkgebied
      van een kenniscentrum beroepsonderwijs bedrijfsleven dat werkzaam is voor de specifieke bedrijfstak of groep
      van bedrijfstakken waarvoor de vakinstelling opleidingen verzorgt, onthoudt Onze Minister ten aanzien van die
      beroepsopleiding de rechten, genoemd in artikel 1.3.1, indien de vakinstelling naar het oordeel van Onze Minister,
      gehoord de commissie, bedoeld in artikel 6.1.2, niet heeft aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3a
  - number: 6.1.3a.1.a
    text: |-
      de verzorging van die beroepsopleiding, gelet op het geheel en de spreiding van het aanbod van beroepsonderwijs en
      de behoefte aan afgestudeerden, doelmatig is, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3a
  - number: 6.1.3a.1.b
    text: |-
      die beroepsopleiding gericht is op en van belang is voor de specifieke bedrijfstak of groep van bedrijfstakken
      waarvoor de vakinstelling opleidingen verzorgt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3a
  - number: 6.1.3a.2
    text: |-
      Onze Minister kan beleidsregels vaststellen op grond waarvan hij beoordeelt of de vakinstelling genoegzaam heeft
      aangetoond dat is voldaan aan de criteria, bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3a
  - number: 6.1.3a.3
    text: Artikel 6.1.3, tweede en derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.3a
  - number: 6.1.4.1
    text: |-
      Onze Minister, gehoord de in [artikel 6.1.2][ref1] genoemde commissie, kan besluiten dat ten aanzien van een
      beroepsopleiding die de instelling verzorgt, de rechten, genoemd in [artikel 1.3.1][ref2], ontnomen worden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.1.a
    text: gebleken is dat de kwaliteit van die opleiding gedurende een reeks van jaren onvoldoende is geweest,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg,
      het onderwijs of de examens, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.1.c
    text: |-
      indien de verzorging van die opleiding kennelijk niet langer doelmatig kan worden geacht, gelet op het geheel en de
      spreiding van het aanbod van beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.2.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 1.3.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] meer is
      verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.4.2.c
    text: de registratie in het Centraal register wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.3
    text: |-
      Bij een beschikking tot ontneming van rechten bepaalt Onze Minister het tijdstip waarop die beschikking van kracht
      wordt zodanig, dat de voor de opleiding ingeschreven deelnemers de opleiding aan een andere instelling binnen een
      redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Onze Minister neemt een beschikking als bedoeld in het eerste lid voor 1 november van het jaar voorafgaand aan het
      studiejaar waarin het in het derde lid bedoelde tijdstip valt.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.4
  - number: 6.1.5.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder a][ref1], geeft
      hij aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit
      van de opleiding, en maakt deze in het Centraal register bekend. Onze Minister geeft eerst toepassing aan
      [artikel 6.1.4, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel6.1.5
    references:
