  - number: 1.3.2a.1
    text: |-
      Aan vakinstellingen worden beroepsopleidingen verzorgd die naar hun aard en onderlinge samenhang aantoonbaar
      gericht zijn op en van belang zijn voor een specifieke bedrijfstak of groep van bedrijfstakken.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.2a
  - number: 1.3.2a.2
    text: Artikel 1.3.1, tweede en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.2a
  - number: 1.3.3.1
    text: |-
      Agrarische opleidingscentra zijn instellingen waarin beroepsonderwijs op het gebied van de landbouw en de
      natuurlijke omgeving en voorbereidend beroepsonderwijs in de afdeling landbouw en natuurlijke omgeving, bedoeld in
      [artikel 10c, onderdeel d, van de Wet op het voortgezet onderwijs][ref1], worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
  - number: 1.3.3.2
    text: |-
      [Artikel 1.3.1, tweede en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.4
    text: |-
      Agrarische innovatie- en praktijkcentra zijn werkzaam ten behoeve van het beroepsonderwijs op het gebied van de
      landbouw en de natuurlijke omgeving. De centra die daarvoor op grond van [artikel 2.1.7][ref1] in aanmerking komen,
      hebben ten behoeve van het vervullen van de hun bij deze wet opgedragen werkzaamheden aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.5.1
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.5.1.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.5.1.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen voor educatie en beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.5.1.c
    text: het bieden van mogelijkheden voor loopbaanoriëntatie en -begeleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.5.1.d
    text: |-
      de afstemming op de ontwikkelingen in de samenleving op nationaal en internationaal gebied in het algemeen en ten
      aanzien van de arbeidsmarkt in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.5.2
    text: |-
      Agrarische innovatie- en praktijkcentra dragen door het verlenen van diensten aan de agrarische opleidingscentra
      bij aan de inhoudelijke vernieuwing en de doelmatige uitvoering van het onderwijs. De centra ontwikkelen daartoe
      voorstellen voor de inhoud en inrichting van het onderwijs en verzorgen onderdelen van het onderwijs die vanwege
      de schaal waarop de desbetreffende activiteiten verricht moeten worden, de vereiste deskundigheid of de benodigde
      outillage of door de risico’s die de desbetreffende activiteiten meebrengen voor de bedrijfsvoering van het
      bedrijf of de organisatie waar de beroepspraktijkvorming wordt verzorgd, doelmatiger op centraal niveau dan door de
      agrarische opleidingscentra afzonderlijk verzorgd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.5
  - number: 1.3.6.1
    text: |-
      Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling dan wel voor het agrarisch innovatie-
      en praktijkcentrum in en draagt er in dat verband zorg voor dat, zo veel mogelijk in samenwerking met andere
      instellingen, wordt voorzien in een regelmatige beoordeling van de kwaliteit van het onderwijs, waaronder
      maatregelen en instrumenten om te waarborgen dat het personeel zijn bekwaamheid onderhoudt. Het bevoegd gezag
      draagt er zorg voor dat de in de eerste volzin bedoelde beoordeling geschiedt met betrokkenheid van onafhankelijke
      deskundigen en belanghebbenden. De uitkomsten van de beoordeling zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.6.2
    text: 'Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.6.2.a
    text: de beoordeling, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.6.2.b
    text: de uitkomsten van die beoordeling, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.6.2.c
    text: het voorgenomen beleid in het licht van die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.6.3
    text: |-
      Het bevoegd gezag beslist of een verslag als bedoeld in het tweede lid onderdeel uitmaakt van een jaarverslag als
      bedoeld in [artikel 2.5.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.3.6.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de frequentie en de inrichting van het verslag.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.6
  - number: 1.3.7.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.7
  - number: 1.3.7.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.7
  - number: 1.3.8.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige deelnemer van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.8.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.3.8.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      deelnemer van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.8
  - number: 1.3.8.4
    text: Het eerste tot en met derde lid zijn van overeenkomstige toepassing op agrarische innovatie- en praktijkcentra.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.3.8
  - number: 1.4.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of van een instelling dat aan de met goed gevolg afgelegde examens of onderdelen van
      examens van een beroepsopleiding, verzorgd door die instelling, een diploma of certificaat als bedoeld in
      [artikel 7.4.6][ref2] is verbonden, indien de desbetreffende instelling voor die opleiding in acht neemt hetgeen
      bij of krachtens deze wet is bepaald ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 1.4.1.1.b
    text: |-
      het onderwijs, met uitzondering van [artikel 7.1.1][ref1], en de examens,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 1.4.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 1.4.1.1.d
    text: |-
      de onderwijsovereenkomst, bedoeld in [artikel 8.1.3, eerste tot en met derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.e
    text: |-
      de vooropleidingseisen, bedoeld in [artikel 8.2.1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.f
    text: de opneming in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
  - number: 1.4.1.3
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister de nodige inlichtingen omtrent de instelling.
      Het bevoegd gezag doet Onze Minister jaarlijks voor 1 maart een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op beroepsopleidingen. Het verslag bevat tevens het aantal deelnemers per
      beroepsopleiding en het aantal uitgereikte certificaten en diploma's, bedoeld in [artikel 7.4.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.4
    text: |-
      Voor zover ten aanzien van een instelling toepassing is gegeven aan het eerste lid, wordt die instelling voor de
      toepassing van deze wet aangemerkt als een niet uit ’s Rijks kas bekostigde instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
  - number: 1.4.1.5
    text: |-
      [Artikel 1.3.8, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing op instellingen als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '4'
  - number: 1.4.1.5a
    text: |-
      Het eerste lid is niet van toepassing op opleidingen, bedoeld in [artikel 12.1a.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 1.4a.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een in het tweede lid bedoelde instelling, dat
      aan de met goed gevolg afgelegde examens of onderdelen van examens van een opleiding educatie, verzorgd door
      die instelling, een diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden, indien die
      instelling in acht neemt hetgeen bij of krachtens deze wet voor die opleiding is bepaald ten aanzien van de
      kwaliteitszorg, bedoeld in [artikel 1.3.6][ref2], en ten aanzien van het onderwijs, bedoeld in [hoofdstuk 7][ref3],
      met uitzondering van [artikel 7.1.1][ref4], [titel 2][ref5], [titel 4][ref6] voor zover het betreft de
      [artikelen 7.4.3][ref7], [7.4.4][ref8] en [7.4.7][ref9], en [titel 6][ref10], en eveneens in acht neemt hetgeen is
      bepaald in [artikel 8.1.1, zesde lid, eerste volzin][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref7]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref8]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref9]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref10]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref11]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel1.4a.1
    references:
