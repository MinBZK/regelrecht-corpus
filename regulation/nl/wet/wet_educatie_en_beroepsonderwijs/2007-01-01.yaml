    text: |-
      De op 31 december 1995 geldende voorschriften vastgesteld bij of krachtens de artikelen 2.55 en 2.59 van de
      Wet op het cursorisch beroepsonderwijs berusten ten aanzien van het personeel van kenniscentra beroepsonderwijs
      bedrijfsleven met ingang van 1 januari 1996 op onderscheidenlijk de [artikelen 4.3.1][ref1], [4.3.2][ref2] en
