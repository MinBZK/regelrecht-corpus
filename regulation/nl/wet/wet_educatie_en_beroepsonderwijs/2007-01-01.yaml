  - number: 12.1a.2.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot de toepassing van het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1a.2
  - number: 12.1a.2.4
    text: |-
      Voor de toepassing van de [Wet studiefinanciering 2000][ref1] en de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2] wordt een opleiding als bedoeld in het eerste lid
      gelijkgesteld met een opleiding als bedoeld in [artikel 1.4.1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.1a.2
    references:
