        hoofdstuk: '4'
  - number: 12.2.7
    text: |-
      Onverminderd [artikel 4.2.1][ref1] kan tot docent aan een instelling worden benoemd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.2.7.a
    text: |-
      degene die in het studiejaar 1995-1996 bevoegd onderwijs heeft gegeven aan een school voor beroepsbegeleidend
      onderwijs, een school voor middelbaar beroepsonderwijs, dan wel wat deeltijds middelbaar beroepsonderwijs betreft
      aan een andere school, aan een vormingsinstituut voor jeugdigen of aan een instelling voor basiseducatie,
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.7.b
    text: |-
      degene die in de periode van 1 augustus 1990 tot en met 31 juli 1995 gedurende ten minste 40 weken bevoegd
      onderwijs als bedoeld in onderdeel *a* heeft gegeven, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.7.c
    text: degene die
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.7.c.1°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen van de opleiding cultureel werk
      of de opleiding culturele en maatschappelijke vorming behorend tot het onderdeel gedrag en maatschappij van het
      Centraal register opleidingen hoger onderwijs, met de differentiatie basiseducatie, dat op grond van de artikelen
      4 en 5 van het Uitvoeringsbesluit KVE 1991 zoals dat luidde op 31 juli 1995 zou hebben geleid tot een bevoegdheid
      voor het verzorgen van activiteiten basiseducatie, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.7.c.2°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen binnen het hoger pedagogisch
      onderwijs met de differentiatie basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.7.c.3°
    text: uiterlijk aan het begin van het studiejaar 1994-1995 is gestart met de differentiatie basiseducatie.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.7
  - number: 12.2.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de gevolgen
      voor het personeel van de invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.9
  - number: 12.2.10.1
    text: |-
      Op geschillen tussen personeel en bevoegd gezag van een school voor beroepsbegeleidend onderwijs, een school voor
      middelbaar beroepsonderwijs dan wel wat deeltijds middelbaar beroepsonderwijs betreft van een andere school, van
      een vormingsinstituut voor jeugdigen, van een instelling voor basiseducatie, een landbouwpraktijkschool of een
      kenniscentrum beroepsonderwijs bedrijfsleven die ingevolge de op 31 december 1995 geldende voorschriften aanhangig
      zijn gemaakt bij een commissie van beroep of bij de burgerlijke rechter, blijven de op die dag geldende regelingen
      van toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.10
  - number: 12.2.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot geschillen tussen het bevoegd gezag en een
      deelnemer met betrekking tot examens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.2.10
  - number: 12.3.8.1
    text: |-
      Het Christelijk Instituut voor Doven "Effatha" en het Instituut voor Doven "Sint-Michielsgestel" behouden in
      afwijking van [artikel 12.3.2][ref1] ten behoeve van het verzorgen van beroepsopleidingen die de voortzetting zijn
      van beroepsbegeleidend onderwijs dat deze instituten op 31 december 1995 verzorgden, aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.8.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde instituten. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of krachtens
      deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.8
  - number: 12.3.9.1
    text: |-
      Ten aanzien van de beroepsopleidingen die een voortzetting vormen van de opleidingen voor deeltijds middelbaar
      beroepsonderwijs in de sector dienstverlening en gezondheidszorg, op 31 december 1995 op grond van artikel 3.11
      van de Wet op het cursorisch beroepsonderwijs verbonden aan de Hogeschool Haarlem en aan de Hogeschool Tilburg,
      behouden deze hogescholen aanspraak op bekostiging uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.9
  - number: 12.3.9.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde beroepsopleidingen. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of
      krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.9
  - number: 12.3.23.1
    text: |-
      Tot 1 januari 1997 blijven van kracht de op 31 december 1995 geldende bij en krachtens de Wet op het voortgezet
      onderwijs, de Wet op het cursorisch beroepsonderwijs en de Kaderwet Volwasseneneducatie 1991 gegeven voorschriften
      met betrekking tot de scholen voor voortgezet algemeen volwassenenonderwijs, de instellingen voor basiseducatie en
      de opleidingen specifieke scholing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.23
  - number: 12.3.23.2
    text: |-
      Tot 1 augustus 1997 blijven van kracht de op 31 december 1995 geldende bij en krachtens de Wet op het voortgezet
      onderwijs en de Wet op het cursorisch beroepsonderwijs gegeven voorschriften met betrekking tot het middelbaar
      beroepsonderwijs, de opleidingen deeltijds middelbaar beroepsonderwijs en het vormingswerk voor jeugdigen,
      onderscheidenlijk de bij en krachtens de Wet op het cursorisch beroepsonderwijs gegeven voorschriften met
      betrekking tot het leerlingwezen.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.23
  - number: 12.3.23.3
    text: |-
      De in het eerste en tweede lid bedoelde voorschriften hebben betrekking op het onderwijs, de deelnemers, de
      inschrijving en de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.23
  - number: 12.3.23.4
    text: |-
      De bevoegdheid van de commissie van beroep voor de examens, bedoeld in [artikel 7.5.1][ref1], strekt zich mede uit
      tot de examens, verbonden aan de in het eerste en tweede lid bedoelde opleidingen en programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.23
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 12.3.24.1
    text: |-
      Het bevoegd gezag stelt, voor zover van toepassing onverminderd de bevoegdheden van het desbetreffende
      kenniscentrum beroepsonderwijs bedrijfsleven volgens de op 31 december 1995 geldende voorschriften, deelnemers:
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
  - number: 12.3.24.1.a
    text: |-
      die op 31 december 1996 zijn ingeschreven volgens een beschikking op grond van de artikelen 15, derde lid, 21 of
      24 van de Kaderwet Volwasseneneducatie 1991 zoals luidend op 31 december 1995, voor een opleiding basiseducatie,
      voortgezet algemeen volwassenenonderwijs, deeltijds middelbaar beroepsonderwijs of specifieke scholing, of
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
  - number: 12.3.24.1.b
    text: |-
      die op 31 juli 1997 zijn ingeschreven voor een opleiding beroepsbegeleidend onderwijs, een opleiding middelbaar
      beroepsonderwijs, of een programma aan een vormingsinstituut voor jeugdigen, en
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
  - number: 12.3.24.1.c
    text: |-
      die de onder *a* en *b* bedoelde opleiding onderscheidenlijk het onder *b* bedoelde programma nog niet hebben
      voltooid, in de gelegenheid hun opleiding onderscheidenlijk programma binnen een redelijke tijd te voltooien,
      overeenkomstig de op 31 december 1995 geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
  - number: 12.3.24.2
    text: |-
      Deelnemers die een in het eerste lid bedoelde opleiding of een in dat lid bedoeld programma of een deel daarvan
      behorend bij een certificaateenheid dan wel betrekking hebbend op het praktijkgedeelte met goed gevolg voltooien,
      ontvangen een diploma, certificaat of praktijkgetuigschrift overeenkomstig het op 31 december 1995 geldende model.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
  - number: 12.3.24.3
    text: |-
      De bevoegdheid van de commissie van beroep voor de examens, bedoeld in [artikel 7.5.1][ref1], strekt zich mede uit
      tot de examens, verbonden aan de in het eerste lid bedoelde opleidingen en programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.24
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 12.3.25.1
    text: |-
      Een opleiding als bedoeld in [artikel II, onderdeel B, zesde lid, onder a, van de Wet van 23 mei 1990](onbekend)
      (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende op 31 december 1995
      geldende voorschriften verbonden blijven aan de in dat lid bedoelde school onderscheidenlijk aan de instelling
      waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.25.2
    text: |-
      Artikel II, onderdeel M, van de Wet van 23 mei 1990 (*Stb.* 266) zoals luidend op 31 december 1995, vindt tot en
      met 31 juli 1997 overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.25
  - number: 12.3.25.3
    text: |-
      Een afdeling vooropleiding voor hoger beroepsonderwijs als bedoeld in [artikel II, onderdeel R, van de Wet van 23
      mei 1990](onbekend) (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende
      op 31 december 1995 geldende voorschriften verbonden blijven aan de dagschool voor middelbaar beroepsonderwijs
      onderscheidenlijk aan de instelling waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2007-01-01#Artikel12.3.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.25.4
    text: |-
      Een afdeling voor hoger algemeen voortgezet onderwijs als bedoeld in [artikel II, onderdeel S, van de Wet van 23
      mei 1990](onbekend) (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende
      op 31 december 1995 geldende voorschriften verbonden blijven aan de dagschool voor middelbaar beroepsonderwijs
      onderscheidenlijk aan de instelling waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
