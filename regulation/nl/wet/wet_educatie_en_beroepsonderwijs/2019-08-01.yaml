        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.8.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde instituten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.3.8
  - number: 12.3.9.1
    text: |-
      Ten aanzien van de beroepsopleidingen die een voortzetting vormen van de opleidingen voor deeltijds middelbaar
      beroepsonderwijs in de sector dienstverlening en gezondheidszorg, op 31 december 1995 op grond van artikel 3.11
      van de Wet op het cursorisch beroepsonderwijs verbonden aan de Hogeschool Haarlem en aan de Hogeschool Tilburg,
      behouden deze hogescholen aanspraak op bekostiging uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.3.9
  - number: 12.3.9.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.3.9
  - number: 12.4.1.1
    text: |-
      Onze Minister voegt voor een bij ministeriële regeling te bepalen periode aan de rijksbijdrage voor het
      beroepsonderwijs, berekend op grond van [artikel 2.2.2][ref1], al dan niet onder door hem op te leggen
      verplichtingen, een bedrag toe in verband met de invoering van passend onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.4.1.2
    text: |-
      Het bedrag wordt voor een periode van een jaar berekend door het voor leerlinggebonden financiering
      voor alle instellingen gezamenlijk vastgestelde budget voor het studiejaar dat start op het tijdstip
      van inwerkingtreding van dit artikel over de instellingen te verdelen naar rato van het gemiddelde
      bedrag dat een instelling voor de drie studiejaren daaraan voorafgaand ontving voor leerlinggebonden
      financiering. Voor zover het betreft de leerlinggebonden financiering voor cluster 2, bedoeld in
      [artikel 2, vierde lid, van de Wet op de expertisecentra][ref1], wordt op het budget, bedoeld in de eerste volzin,
      het deel van het leerlinggebonden budget als bedoeld in [artikel 2.2.7][ref2] zoals luidend voor inwerkingtreding
      van dit artikel in mindering gebracht. Op het budget, bedoeld in de eerste volzin, wordt tevens in mindering
      gebracht de bedragen die op grond van [artikel 2.7.2, eerste lid, tabel B, van het Uitvoeringsbesluit WEB][ref3],
      zoals dat luidde op 31 juli 2014, zijn toegekend aan het bevoegd gezag van de school voor speciaal en voortgezet
      speciaal onderwijs «De Waterlelie» te Cruquius en het bevoegd gezag van de school voor speciaal en voortgezet
      speciaal onderwijs «De Berkenschutse» te Heeze op peildatum 1 oktober 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.4.1
    references:
