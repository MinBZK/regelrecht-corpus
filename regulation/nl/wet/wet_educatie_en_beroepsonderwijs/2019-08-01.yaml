        artikel: '8'
  - number: 8.1.8.1.c
    text: die bij de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8
  - number: 8.1.8.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8
  - number: 8.1.8a.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan Onze Minister van de gegevens van degene die voldoet aan
      [artikel 8.1.8, eerste lid, onderdelen a en b][ref1], en die het onderwijs of het voortgezet algemeen
      volwassenenonderwijs aan de instelling gedurende een aaneengesloten periode van ten minste vier weken of een door
      het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.8a.2
    text: |-
      Onze Minister neemt de op grond van dit artikel door het bevoegd gezag verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.3
    text: |-
      Onze Minister bericht burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft
      onverwijld na ontvangst van de opgave, bedoeld in het eerste lid, dat een zodanige opgave heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.4
    text: |-
      Onze Minister verstrekt uit het meldingsregister relatief verzuim aan het betrokken bevoegd gezag en aan
      burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft de ter zake van die
      betrokkene geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.5
    text: |-
      Burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft melden aan Onze
      Minister telkens de status van de behandeling van de ter zake van de betrokkene gedane opgave, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.6
    text: |-
      Onze Minister neemt de op grond van dit artikel door burgemeester en wethouders verstrekte gegevens op in het
      meldingsregister relatief verzuim.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.7
    text: |-
      Het betrokken bevoegd gezag en burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft, zijn bevoegd het meldingsregister relatief verzuim te raadplegen voor zover het betreft de
      ter zake van die betrokkene geregistreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.8
    text: |-
      Het bevoegd gezag kan de gegevens, bedoeld in het eerste lid, verstrekken aan burgemeester en wethouders van de
      gemeente waar de betrokkene woon- of verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.9
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.10
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste en vijfde lid en wordt een nadere specificatie gegeven van de gegevens die op
      grond van het eerste en vijfde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
  - number: 8.1.8a.11
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen gegevens over gezondheid,
      gegevens waaruit religieuze of levensbeschouwelijke overtuigingen blijken en persoonsgegevens
      van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] omvatten, voor zover deze
      persoonsgegevens noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 8.1.8a.12
    text: |-
      Op verzoek van burgemeester en wethouders van de gemeente waar de betrokkene woon- of verblijfplaats heeft, komen
      hun rechten en verplichtingen als bedoeld in dit artikel toe aan burgemeester en wethouders van de contactgemeente,
      bedoeld in [artikel 8.3.2, derde lid][ref1].


