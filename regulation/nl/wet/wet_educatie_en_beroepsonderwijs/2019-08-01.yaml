  - number: 8.2.1.5
    text: Voor de toelating tot een opleiding voortgezet algemeen volwassenenonderwijs gelden geen vooropleidingseisen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.1
  - number: 8.2.1.6
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen personen die niet voldoen aan de vooropleidingseis voor een
      basisberoepsopleiding, vakopleiding, middenkaderopleiding of specialistenopleiding, vrijstellen van die
      vooropleidingseis, indien zij bij een onderzoek hebben blijk gegeven van geschiktheid voor het desbetreffende
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.1
  - number: 8.2.1.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2.1
    text: |-
      Op voorstel van organisaties in het voortgezet onderwijs, vertegenwoordigers van de instellingen en de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven worden bij ministeriële regeling aangewezen de
      profielen, bedoeld in de [artikelen 10][ref1], [10b][ref2] en [10d van de Wet op het voortgezet onderwijs][ref3],
      waarop het diploma middelbaar algemeen voortgezet onderwijs, het diploma voorbereidend beroepsonderwijs,
      het diploma mavo-vbo en de diploma's voorbereidend middelbaar beroepsonderwijs betrekking moeten hebben,
      alsmede vakken en andere programma-onderdelen die deel moeten hebben uitgemaakt van het examen ter
      verkrijging van een van deze diploma's, om te kunnen worden toegelaten tot een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref4]. De eerste volzin is van overeenkomstige toepassing op
      de diploma’s van beroepsopleidingen, bedoeld in artikel 7.2.2, eerste lid, onderdelen a tot en met c, ingeval van
      doorstroom van een lager naar een hoger niveau als bedoeld in artikel 7.2.2, derde lid, met dien verstande dat er
      geen sprake is van een voorstel van organisaties in het voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
