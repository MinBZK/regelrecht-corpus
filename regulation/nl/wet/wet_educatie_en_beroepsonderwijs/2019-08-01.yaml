  - number: 12.5.1
    text: |-
      Onze Minister brengt voor 1 januari 2002 verslag uit over de werking van deze wet aan de beide Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.5.1
  - number: 12.5.1a
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van de Wet van 29 november 2017 tot wijziging
      van diverse onderwijswetten in verband met het pseudonimiseren van het persoonsgebonden nummer van een
      onderwijsdeelnemer ten behoeve van het bieden van voorzieningen in het kader van het onderwijs en de begeleiding
      van onderwijsdeelnemers (Stb. 508) aan de Staten-Generaal een verslag over de doeltreffendheid en effecten van de
      [artikelen 2.3.6a, negende tot en met twaalfde lid][ref1], en [2.5.5a, twaalfde tot en met vijftiende lid][ref2],
      in de praktijk.


