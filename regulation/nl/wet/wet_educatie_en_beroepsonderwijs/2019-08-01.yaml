        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 1.3.2a.1
    text: |-
      Aan vakinstellingen worden beroepsopleidingen verzorgd die naar hun aard en onderlinge samenhang aantoonbaar
      gericht zijn op en van belang zijn voor een specifieke bedrijfstak of groep van bedrijfstakken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.2a
  - number: 1.3.2a.2
    text: |-
      [Artikel 1.3.1, derde lid, onder a, en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.2a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.3.1
    text: |-
      Agrarische opleidingscentra zijn instellingen waarin beroepsonderwijs op het gebied van landbouw,
      natuurlijke omgeving en voedsel en voorbereidend beroepsonderwijs in het profiel groen, bedoeld in
      [artikel 10b, derde lid, onderdeel i, van de Wet op het voortgezet onderwijs][ref1], worden verzorgd. Voor zover
      dat bij wet is bepaald, kan aan een agrarisch opleidingscentrum tevens ander voortgezet onderwijs worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 1.3.3.2
    text: |-
      [Artikel 1.3.1, derde lid, onder a, en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.3.5
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.5
  - number: 1.3.5.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.5
  - number: 1.3.5.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorgdragen voor een zorgvuldige afstemming tussen
      opleidingen voortgezet algemeen volwassenenonderwijs en beroepsopleidingen, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.5
  - number: 1.3.5.c
    text: het bieden van mogelijkheden voor loopbaanoriëntatie en -begeleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.5
  - number: 1.3.6.1
    text: |-
      Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling in en draagt er in dat verband zorg
      voor dat, zo veel mogelijk in samenwerking met andere instellingen, wordt voorzien in een regelmatige beoordeling
      van de kwaliteit van het onderwijs, waaronder maatregelen en instrumenten om te waarborgen dat het personeel
      zijn bekwaamheid onderhoudt. De beoordeling bij de instellingen geschiedt mede aan de hand van het oordeel
      van deelnemers over de kwaliteit van het onderwijs aan de instelling. Het bevoegd gezag draagt er zorg voor
      dat de in de eerste volzin bedoelde beoordeling geschiedt met betrokkenheid van onafhankelijke deskundigen en
      belanghebbenden. De uitkomsten van de beoordeling zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6
  - number: 1.3.6.2
    text: 'Het bevoegd gezag maakt regelmatig, en voor zover het de examens betreft jaarlijks, een verslag openbaar omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6
  - number: 1.3.6.2.a
    text: de beoordeling, bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6
  - number: 1.3.6.2.b
    text: de uitkomsten van die beoordeling, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6
  - number: 1.3.6.2.c
    text: het voorgenomen beleid in het licht van die uitkomsten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6
  - number: 1.3.6a
    text: |-
      Het bevoegd gezag draagt zorg voor het personeelsbeleid, voor zover het betreft de duurzame borging van de
      kwaliteit van het onderwijspersoneel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.6a
  - number: 1.3.7.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.7
  - number: 1.3.7.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.7
  - number: 1.3.8.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige deelnemer van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.8.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.3.8.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      deelnemer van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.8
  - number: 1.3.9.1
    text: |-
      Het bevoegd gezag stelt voor het personeel van zijn instelling een meldcode vast waarin stapsgewijs wordt
      aangegeven hoe met signalen van huiselijk geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan
      bijdraagt dat zo snel en adequaat mogelijk hulp kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.9
  - number: 1.3.9.2
    text: |-
      Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.9
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
  - number: 1.3.9.3
    text: |-
      Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 1.3.9.4
    text: Het bevoegd gezag bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.9
  - number: 1.3.9.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.9
  - number: 1.4.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling of van een instelling dat aan de met goed gevolg afgelegde examens of onderdelen van examens
      van een beroepsopleiding in de beroepsopleidende leerweg of van een beroepsopleiding in de beroepsbegeleidende
      leerweg, verzorgd door die instelling, een diploma als bedoeld in [artikel 7.4.6][ref2] of een certificaat als
      bedoeld in [artikel 7.2.3][ref3] is verbonden, indien de desbetreffende instelling voor die opleiding in acht neemt
      hetgeen bij of krachtens deze wet is bepaald ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 1.4.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 1.4.1.1.a1
    text: |-
      de informatie aan aspirant-deelnemers, bedoeld in [artikel 6.1.3a][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 1.4.1.1.b
    text: |-
      het onderwijs, met uitzondering van de [artikelen 7.1.1][ref1] en [7.2.4a, derde lid][ref2], mits het aantal
      begeleide onderwijsuren en het aantal uren beroepspraktijkvorming op grond van de studieduur, naar evenredigheid
      ten minste gelijk is aan het aantal uren, bedoeld in [artikel 7.2.7, tweede tot en met vierde lid][ref3], en de
      examens alsmede in geval van een samenwerkingscollege de [artikelen 8.6.1][ref4] en [8.6.3][ref5],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 1.4.1.1.d
    text: |-
      de onderwijsovereenkomst, bedoeld in [artikel 8.1.3, eerste tot en met derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.e
    text: |-
      de vooropleidingseisen, bedoeld in [artikel 8.2.1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.1.1.f
    text: de opneming in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.1a
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een beroepsopleiding in andere dan in het eerste lid genoemde
      leerwegen, met dien verstande dat voor die opleiding [artikel 7.2.2, tweede lid][ref1], niet van toepassing is en
      ten aanzien van het onderwijs [artikel 7.2.7, eerste lid][ref2], niet in acht behoeft te worden genomen voor wat
      betreft de eisen met betrekking tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming en artikel
      7.2.7, tweede tot en met achtste lid, niet in acht behoeft te worden genomen. Het tweede tot en met elfde lid zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 1.4.1.1b
    text: |-
      Een beroepsopleiding als bedoeld in lid 1 of lid 1a van een andere dan een in [artikel 1.1.1, onder b][ref1],
      bedoelde instelling bevat geen keuzedelen die niet zijn gekoppeld aan een kwalificatie, behorend bij een
      beroepsopleiding waarvoor de instelling een diploma-erkenning heeft op grond van lid 1 of lid 1a.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 1.4.1.2
    text: Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister de aanvraag toewijzen voor anderhalf jaar, indien een aanvraag
      wordt gedaan door:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.3.a
    text: |-
      een bevoegd gezag dat geen andere beroepsopleiding verzorgt waaraan een diploma of certificaat als bedoeld in het
      eerste lid is verbonden, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.3.b
    text: |-
      een bevoegd gezag dat drie jaren of minder voorafgaand aan de aanvraag voor een andere beroepsopleiding die het
      verzorgt, een waarschuwing als bedoeld in [artikelen 6.1.5][ref1] of [6.2.3][ref2] heeft ontvangen, indien de
      inspectie uit een oogpunt van kwaliteitsbewaking hiertoe aanleiding ziet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 1.4.1.4
    text: |-
      Bij toepassing van het derde lid wordt de toewijzing na de in het derde lid bedoelde periode van anderhalf jaar
      voor onbepaalde tijd van rechtswege verlengd, tenzij Onze Minister uiterlijk twee maanden voordat die periode van
      anderhalf jaar is verstreken, besluit om de desbetreffende beschikking in te trekken omdat:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.4.a
    text: de opleiding in de praktijk van onvoldoende kwaliteit blijkt te zijn,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.4.b
    text: het bevoegd gezag heeft aangegeven geen verlenging te wensen, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.4.c
    text: de opleiding niet binnen één jaar na de toewijzing is gestart.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.5
    text: |-
      Indien een beschikking op grond van het vierde lid, onderdeel a, is ingetrokken, brengt het bevoegd gezag, alvorens
      het een nieuwe aanvraag als bedoeld in het eerste lid of lid 1a indient, zodanige verbeteringen aan dat aannemelijk
      is dat de desbetreffende opleiding of opleidingen in de praktijk wel van voldoende kwaliteit zal respectievelijk
      zullen, zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.6
    text: |-
      Indien een toewijzing als bedoeld in het derde lid wordt gedaan, informeert het bevoegd gezag de deelnemers en
      aspirant-deelnemers daarover en over de mogelijkheden om hun opleiding elders af te ronden in het geval dat de
      beschikking wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.7
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister de nodige inlichtingen omtrent de instelling.
      Het bevoegd gezag doet Onze Minister jaarlijks voor 1 maart een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.8
    text: |-
      Voor zover ten aanzien van een instelling toepassing is gegeven aan het eerste lid, wordt die instelling voor de
      toepassing van deze wet aangemerkt als een niet uit ’s Rijks kas bekostigde instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4.1
  - number: 1.4.1.9
    text: |-
      De [artikelen 1.3.8][ref1] en [1.3.9][ref2] zijn van overeenkomstige toepassing op instellingen als bedoeld in het
      eerste lid.


