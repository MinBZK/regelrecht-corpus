        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2a.2
    text: |-
      Het bevoegd gezag stelt een regeling vast voor de selectiecriteria en de selectieprocedure en stelt deze uiterlijk
      1 februari voorafgaand aan het studiejaar waar deze voor geldt, voor een ieder beschikbaar. De selectiecriteria
      kunnen uitsluitend eisen bevatten die direct verband houden met de gronden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.2a
  - number: 8.2.2a.3
    text: |-
      Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen tevens voorschriften van procedurele aard worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.2a
  - number: 8.3.1.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 8.1.8, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.1
