  - number: 12.2.7.a
    text: |-
      degene die in het studiejaar 1995-1996 bevoegd onderwijs heeft gegeven aan een school voor beroepsbegeleidend
      onderwijs, een school voor middelbaar beroepsonderwijs, dan wel wat deeltijds middelbaar beroepsonderwijs betreft
      aan een andere school, aan een vormingsinstituut voor jeugdigen of aan een instelling voor basiseducatie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.7.b
    text: |-
      degene die in de periode van 1 augustus 1990 tot en met 31 juli 1995 gedurende ten minste 40 weken bevoegd
      onderwijs als bedoeld in onderdeel *a* heeft gegeven, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.7.c
    text: degene die
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.7.c.1°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen van de opleiding cultureel werk
      of de opleiding culturele en maatschappelijke vorming behorend tot het onderdeel gedrag en maatschappij van het
      Centraal register opleidingen hoger onderwijs, met de differentiatie basiseducatie, dat op grond van de artikelen
      4 en 5 van het Uitvoeringsbesluit KVE 1991 zoals dat luidde op 31 juli 1995 zou hebben geleid tot een bevoegdheid
      voor het verzorgen van activiteiten basiseducatie, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.7.c.2°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen binnen het hoger pedagogisch
      onderwijs met de differentiatie basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.7.c.3°
    text: uiterlijk aan het begin van het studiejaar 1994-1995 is gestart met de differentiatie basiseducatie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.7
  - number: 12.2.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de gevolgen
      voor het personeel van de invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.2.9
  - number: 12.3.8.1
    text: |-
      Het Christelijk Instituut voor Doven "Effatha" en het Instituut voor Doven "Sint-Michielsgestel" behouden in
      afwijking van [artikel 12.3.2][ref1] ten behoeve van het verzorgen van beroepsopleidingen die de voortzetting zijn
      van beroepsbegeleidend onderwijs dat deze instituten op 31 december 1995 verzorgden, aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.3.8
    references:
