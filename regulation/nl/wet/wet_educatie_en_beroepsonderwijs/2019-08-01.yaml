  - number: 2.6.1
    text: 'Een scholengemeenschap omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
  - number: 2.6.1.a
    text: |-
      een regionaal opleidingencentrum en een school voor voortgezet onderwijs als bedoeld in de
      [Wet op het voortgezet onderwijs][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 2.6.1.b
    text: |-
      een agrarisch opleidingscentrum en een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 9 van de Wet op het voortgezet onderwijs][ref1] of een school voor praktijkonderwijs als bedoeld in
      [artikel 10f van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 2.6.1a
    text: |-
      Ten aanzien van een school voor voortgezet onderwijs die deel uitmaakt van een scholengemeenschap als bedoeld
      in het eerste lid, bestaat aanspraak op rijksbijdrage ten aanzien van de huisvesting, waarvoor bij of krachtens
      algemene maatregel van bestuur een berekeningswijze wordt vastgesteld. [Hoofdstuk 2, titel 8][ref1], is van
      overeenkomstige toepassing ten aanzien van een scholengemeenschap als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '2'
  - number: 2.6.2
    text: |-
      In afwijking van de [Wet medezeggenschap op scholen][ref1] zijn de bepalingen inzake de medezeggenschap bij of
      krachtens de [Wet op de ondernemingsraden][ref2] en deze wet van toepassing op scholengemeenschappen als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020685
      [ref2]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0020685
      - id: ref2
        bwb_id: BWBR0002747
  - number: 2.6.3
    text: |-
      Bij algemene maatregel van bestuur kunnen ter uitvoering van deze wet voorschriften worden gegeven ten aanzien van
      scholengemeenschappen als bedoeld in het eerste lid. Daarbij kan bij algemene maatregel van bestuur worden bepaald
      welke voorschriften van deze wet geheel of gedeeltelijk van toepassing of overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6
  - number: 2.6a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan ten behoeve van het voorbereidend beroepsonderwijs, verzorgd in
      agrarische opleidingscentra, worden vastgesteld dat het bepaalde bij of krachtens deze wet geheel of gedeeltelijk
      niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6a
  - number: 2.6aa.1
    text: |-
      Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in en met inachtneming
      van [artikel 25a van de Wet op het voortgezet onderwijs][ref2] ook tot onderwijs- en examenvoorzieningen van de
      instelling toelaten zij die niet als deelnemer of examendeelnemer aan de instelling worden ingeschreven maar zijn
      ingeschreven als leerling aan een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 2.6aa.2
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld over de verantwoording van de bedragen
      die het bevoegd gezag met toepassing van [artikel 99, achtste lid, van de Wet op het voortgezet onderwijs][ref1]
      heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel99
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '99'
  - number: 2.6aa.3
    text: |-
      Indien het bevoegd gezag van een school voor voortgezet onderwijs ter uitvoering van
      [artikel 25a, eerste en tweede lid, van de Wet op het voortgezet onderwijs][ref1] leerlingen in het kader van het
      onderwijs waarvoor zij aan die school zijn ingeschreven, ook onderwijs wil kunnen laten volgen dat een instelling
      van datzelfde bevoegd gezag verzorgt, regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen van het
      [derde lid, aanhef en onder a tot en met e, van dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel25a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6aa
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 25a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 25a
  - number: 2.6b
    text: |-
      Het bevoegd gezag kan in afwijking van [artikel 8.1.1][ref1], in gevallen als geregeld in en met inachtneming van
      [artikel 14b van de Wet op de expertisecentra][ref2], ook tot examenvoorzieningen van de instelling toelaten zij
      die niet als examendeelnemer aan de instelling worden ingeschreven maar zijn ingeschreven als leerling aan een
      school waar voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref3] wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14b
      [ref3]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.6b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14b
      - id: ref3
        bwb_id: BWBR0003549
  - number: '2.7'
    text: |-
      Onze Minister kan volgens bij ministeriële regeling te geven voorschriften aan andere rechtspersonen dan
      die waarvan de instellingen uitgaan, een bijdrage toekennen ter bevordering van de verwezenlijking van de in
      [artikel 1.2.1][ref1] bedoelde doelstellingen van de educatie en het beroepsonderwijs dan wel ten behoeve van
      de afstemming tussen onderwijs en arbeidsmarkt. Bij de toepassing van dit artikel zijn de [artikelen 4][ref2],
      [5][ref3], [9][ref4] en [10 van de Wet overige OCW-subsidies][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '10'
  - number: 2.8.1.1
    text: |-
      Elke instelling is aangesloten bij de door de bevoegde gezagsorganen gezamenlijk opgerichte rechtspersoon met
      volledige rechtsbevoegdheid, zonder winstoogmerk, die zich ten doel stelt zich borg te stellen voor de nakoming
      van rente- en aflossingsverplichtingen, voortvloeiend uit de door het bevoegd gezag van de instelling aangegane
      leningen, door instandhouding van een onafhankelijk functionerend fonds met een onafhankelijk van de instellingen
      functionerend bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.2
    text: |-
      Elke instelling draagt aan het fonds op zodanige wijze bij, dat door de gezamenlijke bijdragen het functioneren van
      het fonds is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3
    text: |-
      De gezamenlijke instellingen dragen er zorg voor dat in de statuten van de rechtspersoon, bedoeld in het eerste
      lid, in elk geval is opgenomen:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.a
    text: |-
      dat ingeval van door de rechtspersoon te stellen algemene voorwaarden aan het verlenen van borgstelling, deze
      uitsluitend van financiële aard zijn en uitsluitend betrekking hebben op de te waarborgen lening,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.b
    text: |-
      dat ingeval de instelling aan de onder *a* bedoelde voorwaarden voldoet, borgstelling door de rechtspersoon niet
      kan worden geweigerd,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.c
    text: |-
      dat als blijkt dat een instelling niet in staat is tot nakoming van rente- en aflossingsverplichtingen, de
      instelling verplicht is een saneringsplan aan het waarborgfonds over te leggen, waarin is aangegeven op welke wijze
      en binnen welke termijn het evenwicht tussen inkomsten en uitgaven van de instelling hersteld kan worden,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.d
    text: |-
      dat de door de rechtspersoon te stellen voorwaarden in het kader van door hem te waarborgen leningen niet in strijd
      komen met de vrijheid van organisatie en inrichting van het onderwijs binnen de instellingen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.e
    text: |-
      dat een batig saldo van het fonds kan worden uitgekeerd aan de bevoegde gezagsorganen van de instellingen, onder de
      voorwaarde dat een uitkering door het bevoegd gezag van een instelling uitsluitend wordt besteed ten behoeve van de
      werkzaamheden van de instelling waarvoor de rijksbijdrage wordt verleend, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.3.f
    text: |-
      een regeling omtrent de te volgen procedure en te treffen voorzieningen in geval van taakverwaarlozing door het
      bestuur van het fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.1.4
    text: |-
      Van de in het eerste lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag van een
      bijzondere instelling ontheffing verlenen op grond van bedenkingen van godsdienstige of levensbeschouwelijke aard.
      Onze Minister verleent de ontheffing slechts, indien het bevoegd gezag aantoont dat een afdoende andere voorziening
      is getroffen voor het waarborgen van het voortbestaan van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.1
  - number: 2.8.2.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere instelling
      draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de bekostiging, zorg
      voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld
      van een verklaring omtrent de getrouwheid van een door de raad van toezicht of het bevoegd gezag aangewezen
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.8.2.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.2
  - number: 2.8.2.3
    text: |-
      Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven deelnemers het onderwijs aan een andere instelling kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.2
  - number: 2.8.3
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.8.3
  - number: 4.1.1
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.1
  - number: 4.1.1a
    text: Het bevoegd gezag streeft evenredige vertegenwoordiging van vrouwen in leidinggevende posities na.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.1a
  - number: 4.1.2.1
    text: Het bevoegd gezag stelt een regeling vast voor de rechtspositie van het personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.2
  - number: 4.1.2.2
    text: |-
      Over de regelingen die gaan over aangelegenheden die van algemeen belang zijn voor de rechtspositie van het
      personeel van de instelling, wordt door of namens het bevoegd gezag overlegd met de vakorganisaties van overheids-
      en onderwijspersoneel die daarvoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.2
  - number: 4.1.2.3
    text: |-
      De bepalingen over ontslag verschaffen het personeel van de openbare instellingen niet minder rechten dan
      die welke voor werknemers met een arbeidsovereenkomst voortvloeien uit de bepalingen van dwingend recht van
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 4.1.2.4
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven over de maximale beloning van de leden van
      het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.2
  - number: 4.1.2.5
    text: |-
      In geval van een onherroepelijk vonnis tot faillietverklaring van een instelling, voorzien de
      bevoegde gezagsorganen van de overige instellingen er gezamenlijk in dat aan de aanspraken, bedoeld in
      [artikel 79, eerste lid, van de Werkloosheidswet][ref1], van het personeel en gewezen personeel, wordt voldaan,
      evenals aan de aanspraken die in het overleg, bedoeld in het tweede lid, zijn overeengekomen en als aanvulling
      gelden op de wettelijke aanspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel79
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '79'
  - number: 4.1.3
    text: |-
      Met het oog op de voortdurende verbetering van de professionaliteit van het personeel, wordt door of namens
      de bevoegde gezagsorganen in overeenstemming met vakorganisaties van overheids- en onderwijspersoneel een
      professioneel statuut vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1.3
  - number: 4.1a.1.1
    text: |-
      Onder het beroep van docent wordt verstaan het binnen de kaders van het onderwijskundig beleid van de instelling,
      verantwoordelijkheid dragen voor het vakinhoudelijke, vakdidactische en pedagogische proces in de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.2
    text: |-
      Docenten komt een zelfstandige verantwoordelijkheid toe als het gaat om het beoordelen van de onderwijsprestaties
      van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.3
    text: |-
      Docenten beschikken over voldoende vakinhoudelijke, vakdidactische en pedagogische zeggenschap, waaronder wordt
      verstaan de zeggenschap over:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.3.a
    text: de inhoud van de lesstof;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.3.b
    text: de wijze waarop de lesstof wordt aangeboden en de middelen die daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.3.c
    text: |-
      de te hanteren pedagogisch-didactische aanpak op de school en de wijze waarop daar uitvoering aan wordt gegeven,
      waaronder de begeleiding van de deelnemers en de contacten met de ouders;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.3.d
    text: |-
      het in samenhang met de onderdelen a, b en c, onderhouden van de bekwaamheid van de docenten als onderdeel van
      het team.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.1a.1.4
    text: |-
      Het bevoegd gezag maakt met de docenten afspraken over de wijze waarop de zeggenschap van docenten als bedoeld
      in het derde lid wordt georganiseerd. Bij het maken van deze afspraken wordt de professionele standaard van de
      beroepsgroep in acht genomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.1a.1
  - number: 4.2.1.1
    text: Docenten worden door het bevoegd gezag benoemd dan wel tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.2
    text: 'Tot docent aan een instelling kan slechts worden benoemd of tewerkgesteld zonder benoeming degene die:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.2.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 4.2.1.2.b
    text: |-
      voldoet aan de bekwaamheidseisen, bedoeld in [artikel 4.2.3, eerste lid][ref1], blijkend uit het bezit van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1.2.b.1°
    text: |-
      een getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] van een met goed
      gevolg afgelegd afsluitend examen van een aan een hogeschool verbonden opleiding gericht op het beroep van leraar
      in het voortgezet onderwijs,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 4.2.1.2.b.2°
    text: |-
      een getuigschrift als bedoeld in artikel 175 van de Wet op het hoger beroepsonderwijs van een met goed gevolg
      afgelegd staatsexamen, voor zover overeenkomend met een getuigschrift als bedoeld onder 1°,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.2.b.3°
    text: |-
      een getuigschrift als bedoeld in
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] van een met goed
      gevolg afgelegd afsluitend examen van een universitaire lerarenopleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 4.2.1.2.b.4°
    text: |-
      een getuigschrift of diploma van een opleiding die vóór 1 augustus 1991 was gericht op het beroep van leraar in het
      voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.2.b.5°
    text: |-
      een ten aanzien van het door hem te geven onderwijs verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.2.1.2.b.6°
    text: |-
      een gelijkwaardig buitenlands getuigschrift of diploma, behaald in een land dat niet behoort tot de Lid-Staten van
      de EU, dan wel een gelijkwaardig Nederlands-Antilliaans of Arubaans getuigschrift of diploma, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.2.c
    text: |-
      in het bezit is van een door het bevoegd gezag afgegeven geschiktheidsverklaring als bedoeld in
      [artikel 4.2.4][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.1.2.d
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het geven van onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      In geval van een geschiktheidsverklaring als bedoeld in [artikel 4.2.4][ref1] vindt de benoeming of
      tewerkstelling zonder benoeming voor zover betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] plaats voor een periode van
      ten hoogste twee aaneengesloten studiejaren. Het bevoegd gezag kan deze benoemingsperiode, al dan niet onder door
      dat gezag te stellen voorwaarden, verlengen met ten hoogste twee jaren indien het bevoegd gezag daarvoor redenen
      aanwezig acht. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot de toepassing van de tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.2.1.4
    text: Het tweede lid is niet van toepassing voor zover een docent is belast met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.5
    text: |-
      Het bevoegd gezag kan ten aanzien van een docent voor een periode van ten hoogste twee jaar afwijken van de
      eisen, bedoeld in het tweede lid, onder b en c. Het bevoegd gezag kan de in de eerste volzin bedoelde termijn
      verlengen met ten hoogste twee jaren indien het bevoegd gezag dat noodzakelijk oordeelt vanwege de kwaliteit en de
      voortgang van het onderwijs aan de school. In dat geval verklaren het bevoegd gezag en de betrokkene in ieder geval
      schriftelijk dat betrokkene verplicht is zich in te spannen om binnen de verlengingsperiode alsnog te voldoen aan
      de eisen, bedoeld in het tweede lid, onder b. Het bevoegd gezag beschikt over geordende gegevens met betrekking tot
      de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.1.6
    text: |-
      Het bevoegd gezag kan afwijken van het tweede lid, onder b en c, ten aanzien van degene die gelet op specifieke
      kennis en bekwaamheden, samenhangend met ervaringen en werkzaamheden in andere sectoren van de samenleving en
      het bedrijfsleven, naar het oordeel van het bevoegd gezag voldoende bekwaam is om onder verantwoordelijkheid van
      een daartoe door het bevoegd gezag aan te wijzen docent voor een beperkte betrekkingsomvang te worden belast met
      het uitsluitend verzorgen van onderwijsonderdelen waar die specifieke kennis en bekwaamheden in het bijzonder
      betrekking op hebben. De betrekkingsomvang is voor het totaal van de in de eerste volzin bedoelde te verzorgen
      onderwijsonderdelen ten hoogste een aantal van gemiddeld 4 klokuren per week op jaarbasis.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.1
  - number: 4.2.2.1
    text: |-
      Onderwijsondersteunende werkzaamheden waarvoor op grond van [artikel 4.2.3, tweede lid][ref1], bekwaamheidseisen
      zijn vastgesteld, mogen slechts worden verricht door degene die:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.1.a
    text: |-
      in het bezit is van een verklaring omtrent het gedrag, afgegeven ingevolge de
      [Wet justitiële en strafvorderlijke gegevens][ref1], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 4.2.2.1.b
    text: |-
      in het bezit is van een bij ministeriële regeling aangewezen getuigschrift waaruit blijkt dat wordt voldaan aan de
      in [artikel 4.2.3, tweede lid][ref1], bedoelde bekwaamheidseisen, voor zover vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.1.c
    text: |-
      in het bezit is van een ten aanzien van de door hem te verrichten werkzaamheden, al dan niet bedoeld
      in [artikel 4.2.3, tweede lid][ref1], verleende erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.2.2.1.d
    text: volgens bij algemene maatregel van bestuur te geven regels zijn bekwaamheid heeft aangetoond, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
  - number: 4.2.2.1.e
    text: niet krachtens rechterlijke uitspraak is uitgesloten van het verrichten van die werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
  - number: 4.2.2.2
    text: |-
      Het eerste lid is niet van toepassing op een onderwijsondersteunende functionaris voor zover deze is belast met
      werkzaamheden in verband met contractactiviteiten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
  - number: 4.2.2.3
    text: |-
      Ten aanzien van studenten aan een opleiding als bedoeld in
      [artikel 7.7, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] en deelnemers
      aan de beroepsbegeleidende leerweg van een opleiding als bedoeld in [artikel 7.2.2][ref2] die in het kader van die
      opleiding onderwijsondersteunende werkzaamheden verrichten waarvoor op grond van [artikel 4.2.3, tweede lid][ref3],
      bekwaamheidseisen zijn vastgesteld, kan voor de duur van die werkzaamheden worden afgeweken van het eerste lid,
      onder b tot en met d.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.2.4
    text: |-
      Het bevoegd gezag kan voor een periode van ten hoogste twee jaar afwijken van de eisen, bedoeld in het eerste
      lid, onder b tot en met d. Het bevoegd gezag kan deze periode met ten hoogste de helft verlengen indien bijzondere
      omstandigheden daartoe naar zijn oordeel aanleiding geven. Het bevoegd gezag beschikt over geordende gegevens met
      betrekking tot de toepassing van de tweede volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.2
  - number: 4.2.3.1
    text: Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor de uitoefening van het docentschap.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.2
    text: |-
      Bij algemene maatregel van bestuur worden bekwaamheidseisen vastgesteld voor bij die maatregel aan te wijzen
      onderwijsondersteunende werkzaamheden die rechtstreeks verband houden met het onderwijsleerproces.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.3
    text: |-
      De in het eerste lid bedoelde bekwaamheidseisen zijn gericht op het handelen in het onderwijsleerproces, het
      algemeen professioneel handelen en het werken binnen een onderwijsorganisatie. Zij omvatten in elk geval eisen ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.3.a
    text: pedagogisch-didactische kennis, inzicht en vaardigheden, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.3.b
    text: vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.4
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste en tweede lid, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3.5
    text: |-
      Onze Minister stelt een beroepsorganisatie die hij vanuit het oogpunt van beroepskwaliteit representatief acht
      voor onderwijspersoneel als bedoeld in deze wet, in de gelegenheid hem een voorstel te doen voor de in het eerste
      en tweede lid bedoelde bekwaamheidseisen. Onze Minister stelt deze organisatie vervolgens in elk geval eenmaal
      in de zes jaar in de gelegenheid, hem een voorstel te doen over ongewijzigde handhaving of wijziging van de
      bekwaamheidseisen voor zover vastgesteld. Uit een voorstel als bedoeld in de eerste of tweede volzin blijkt tevens,
      in hoeverre dat voorstel mede steun geniet van een vertegenwoordiging van bevoegde gezagsorganen, van ouders en
      van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3
  - number: 4.2.3a
    text: |-
      Het bevoegd gezag beschikt ten aanzien van elk personeelslid dat een functie of werkzaamheden verricht waarvoor
      bekwaamheidseisen zijn vastgesteld, over geordende gegevens met betrekking tot de bekwaamheid en het onderhouden
      van de bekwaamheid. Ten behoeve van de onderlinge vergelijkbaarheid en herkenbaarheid van de gegevens kunnen bij
      ministeriële regeling voorschriften worden vastgesteld over de inrichting en wijze van ordening van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.3a
  - number: 4.2.4.1
    text: |-
      Aan degene die niet in het bezit is van een in [artikel 4.2.1, tweede lid, onder b][ref1], genoemd getuigschrift of
      diploma respectievelijk genoemde erkenning van beroepskwalificaties wordt door het bevoegd gezag dat voornemens is
      betrokkene te benoemen een geschiktheidsverklaring afgegeven, indien de betrokkene naar het oordeel van het bevoegd
      gezag:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.4.1.a
    text: vakinhoudelijk bekwaam is en geschikt is voor het beroep van docent, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
  - number: 4.2.4.1.b
    text: |-
      voldoet aan de in [artikel 4.2.3, derde lid][ref1], onder a genoemde eisen, blijkend uit het bezit van een
      getuigschrift als bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.2.4.1.c
    text: |-
      in staat is verantwoord les te geven en binnen twee jaar na benoeming of tewerkstelling zonder benoeming tot docent
      te voldoen aan de in [artikel 4.2.3, derde lid, onder a][ref1], genoemde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.4.2
    text: 'Het bevoegd gezag geeft de in het eerste lid bedoelde verklaring slechts af, indien:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
  - number: 4.2.4.2.a
    text: |-
      betrokkene in het bezit is van een getuigschrift van een met goed gevolg afgelegd afsluitend examen
      van een opleiding in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      Wet op het hoger onderwijs en wetenschappelijk onderzoek, niet zijnde een getuigschrift als bedoeld in
      [artikel 4.2.1, tweede lid, onderdeel b 1° tot en met 4°][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.4.2.b
    text: |-
      betrokkene in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 4.2.4.2.c
    text: |-
      betrokkene in het bezit is van een buitenlands getuigschrift of diploma dat gelijkwaardig is aan een onder a
      bedoeld getuigschrift of een onder b bedoelde erkenning van beroepskwalificaties, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
  - number: 4.2.4.2.d
    text: |-
      betrokkene ten minste drie jaren ervaring heeft in de praktijk van het beroep waarop het desbetreffende onderwijs
      is gericht en naar het oordeel van het bevoegd gezag door een combinatie van opleiding en ervaring geacht
      wordt te beschikken over een kwalificatieniveau dat vergelijkbaar is met het onder a tot en met c bedoelde
      kwalificatieniveau, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
  - number: 4.2.4.2.e
    text: |-
      de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge samenhang bezien,
      naar het oordeel van het bevoegd gezag van voldoende belang zijn in verhouding tot de beoogde werkzaamheden aan
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Indien betrokkene niet in het bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], stelt het bevoegd gezag vast,
      welke scholing en begeleiding voor betrokkene noodzakelijk zijn om binnen twee jaar na benoeming of tewerkstelling
      zonder benoeming te kunnen voldoen aan de in [artikel 4.2.3, derde lid onder a][ref2], genoemde bekwaamheidseisen
      ten aanzien van pedagogisch-didactische kennis, inzicht en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.5
    text: |-
      De op grond van artikel 4.2.4, derde lid, noodzakelijk geoordeelde scholing wordt uitgevoerd door of onder
      verantwoordelijkheid van een instelling voor hoger onderwijs als bedoeld in de Wet op het hoger onderwijs en
      wetenschappelijk onderzoek die een lerarenopleiding verzorgt. Het bevoegd gezag stelt in overeenstemming met het
      bestuur van die instelling het voor betrokkene noodzakelijke scholingstraject vast.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2.5
  - number: 4.2a.1
    text: |-
      Tot lid van het personeel, anders dan bedoeld in de [artikelen 4.2.1][ref1] en [4.2.2][ref2], kan slechts
      worden benoemd degene die in het bezit is van een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref3], die op het tijdstip van overlegging aan het bevoegd gezag
      niet ouder is dan 6 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0014194
  - number: 4.3.1
    text: |-
      Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven stelt jaarlijks het beleid vast met
      betrekking tot de formatie van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven. Zoveel mogelijk tegelijk
      met deze vaststelling bepaalt het bestuur functies en taken van het personeel van de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.3.1
  - number: 4.3.2
    text: |-
      [Artikel 4.1.2][ref1], met uitzondering van het vijfde lid, is van overeenkomstige toepassing op de rechtspositie
      van het personeel van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, met dien verstande dat het gaat
      om de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven en het bestuur daarvan in plaats van om instellingen
      en de bevoegde gezagsorganen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.1.1
    text: |-
      Er is een lerarenregister. In het lerarenregister zijn van docenten voor wie de grond voor benoeming
      of tewerkstelling zonder benoeming is gelegen in [artikel 4.2.1, tweede lid, onder b][ref1],
      of voor zover hij in bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2], onder c,
      persoonsidentificerende gegevens en gegevens betreffende de instelling, de benoeming of tewerkstelling zonder
      benoeming, en de herregistratie opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.4.1.2
    text: 'Het lerarenregister heeft tot doel:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.1.2.a
    text: |-
      het vastleggen van het onderwijs waarvoor een docent is benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 4.2.1, tweede lid, onder b, of onder c][ref1], voor zover hij in bezit is van een getuigschrift als
      bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.4.1.2.b
    text: het vastleggen op welke wijze een docent voldoet aan de bekwaamheidseisen; en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.1.2.c
    text: het vastleggen of een docent voldoet aan de herregistratiecriteria.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.1.3
    text: 'In aanvulling op het tweede lid heeft het lerarenregister tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.1.3.a
    text: |-
      aan Onze Minister ten behoeve van de beleidsvorming ten aanzien van benoeming of tewerkstelling zonder benoeming
      van docenten als bedoeld in de [artikelen 4.2.1][ref1] en 4.2.3b; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.1.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.1.4
    text: Onze Minister draagt zorg voor het beheer van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.1
  - number: 4.4.3
    text: |-
      Onze Minister is voor de verwerking van persoonsgegevens in het kader van het lerarenregister de
      verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.3
  - number: 4.4.5
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de autorisatie van degenen die onder zijn gezag vallen
      voor verwerking van persoonsgegevens in het kader van het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.5
  - number: 4.4.6.1
    text: 'Het lerarenregister bevat voor elke daarin opgenomen docent:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.b
    text: de geslachtsnaam, de voornamen, het geslacht, het adres, de postcode, en de geboortedatum van de docent;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.c
    text: |-
      gegevens betreffende de benoeming of tewerkstelling zonder benoeming, waaronder in ieder geval de ingangsdatum
      ervan;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.d
    text: |-
      gegevens betreffende de instelling waaraan hij benoemd is of tewerkgesteld zonder benoeming, waaronder in ieder
      geval het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.e
    text: het onderwijs waarvoor de docent kan opgaan voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.f
    text: voor welk onderwijs als bedoeld in onderdeel e de docent opgaat voor herregistratie;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.g
    text: gegevens betreffende de activiteiten voor herregistratie; en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.6.1.h
    text: |-
      gegevens betreffende de herregistratie waaronder, indien van toepassing, de aantekening, bedoeld in
      [artikel 4.4.11, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.6.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, onderdelen c tot en
      met h, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.6
  - number: 4.4.7.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van docenten die zijn benoemd of tewerkgesteld zonder
      benoeming op grond van [artikel 4.2.1, tweede lid, onder b, of onder c][ref1], voor zover hij in bezit is van een
      getuigschrift als bedoeld in [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2],
      en draagt zorg voor het correct bijhouden van die gegevens ten behoeve van het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.4.7.2
    text: |-
      De docent verstrekt aan Onze Minister de gegevens, genoemd in
      [artikel 4.4.6, eerste lid, onderdelen e tot en met g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.7.3
    text: |-
      Indien een docent niet is benoemd of tewerkgesteld zonder benoeming, kan hij ten behoeve van opname
      in het lerarenregister de gegevens, genoemd in [4.4.6, eerste lid, onderdelen e tot en met g][ref1],
      verstrekken aan Onze Minister mits hij tevens gegevens, bedoeld in artikel 4.4.6,
      eerste lid, onderdelen a en b, verstrekt en middels een bewijsstuk als bedoeld in
      [artikel 4.2.1, tweede lid, onder b][ref2], of voor zover hij in bezit is van een getuigschrift als bedoeld in
      [artikel 7a.4 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek, onder c][ref3], aantoont dat hij aan
      de bekwaamheidseisen voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 7a
  - number: 4.4.7.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de tijdstippen en wijze van
      levering, de correctie van gegevens en over het aantonen van de bekwaamheidseisen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.7
  - number: 4.4.8.1
    text: |-
      De gegevens, bedoeld in [artikel 4.4.6, eerste lid, onder b][ref1], zijn gekoppeld aan het burgerservicenummer van
      de desbetreffende docent en worden door Onze Minister verkregen uit de basisregistratie personen indien de docent
      als ingezetene is ingeschreven in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.8.2
    text: |-
      Indien de docent niet als ingezetene is ingeschreven in de basisregistratie personen, worden de desbetreffende
      gegevens verkregen uit de levering op grond van [artikel 4.4.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.9
    text: |-
      Nadat een docent de gegevens, bedoeld in [artikel 4.4.7, tweede en derde lid][ref1], heeft verstrekt, neemt Onze
      Minister het burgerservicenummer en de andere gegevens die zijn geleverd op grond van artikel 4.4.7 en verkregen
      op grond van [artikel 4.4.8][ref2] of [4.4.18, tweede lid][ref3], op in het lerarenregister, met dien verstande
      dat hij de basisgegevens slechts opneemt voor zover deze niet kunnen worden verkregen uit de basisadministratie
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.4.10.1
    text: |-
      Indien een of meer van de basisgegevens van een leraar in het lerarenregister afwijken van de betreffende
      basisgegevens behorende bij de benoeming of tewerkstelling zonder benoeming van deze leraar, kan de betrokkene
      Onze Minister elektronisch verzoeken deze gegevens te verbeteren. Onze Minister verzoekt het bevoegd gezag om hem
      overeenkomstig [artikel 4.4.7, eerste lid][ref1], de juiste gegevens te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.10.2
    text: |-
      Indien het bevoegd gezag na het verzoek van Onze Minister constateert dat de basisgegevens van de leraar in het
      lerarenregister overeenkomen met de betreffende basisgegevens behorende bij de benoeming of tewerkstelling zonder
      benoeming van deze leraar, deelt hij dit elektronisch mee aan Onze Minister en deelt Onze Minister dit elektronisch
      mee aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.10
  - number: 4.4.10.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op de gegevens die op grond van [artikel 4.4.8][ref1] zijn
      overgenomen uit de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.10.4
    text: |-
      Een beslissing op een verzoek als bedoeld in het eerste lid, eerste volzin, geldt als een besluit in de zin van de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4.4.13.1
    text: |-
      Gegevens van een docent als bedoeld in [artikel 4.4.6][ref1] worden verwijderd uit het lerarenregister:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.13.1.a
    text: indien betrokkene Onze Minister hier om verzoekt;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.1.b
    text: indien betrokkene de pensioengerechtigde leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.1.c
    text: indien betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, onder b en c, worden alle in het lerarenregister geregistreerde gegevens
      van betrokkene verwijderd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.3
    text: |-
      Indien een of meerdere gegevens van een docent op grond van het eerste lid worden verwijderd uit het
      lerarenregister, blijven deze gegevens tot vijf jaar na verwijdering bewaard.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.4
    text: |-
      Indien op grond van [artikel 4.4.7][ref1] gegevens worden verstrekt voor heropname van een docent in het
      lerarenregister, worden door Onze Minister van deze docent de bewaarde gegevens als bedoeld in artikel 4.4.7,
      eerste lid, onderdelen e tot en met h, opgenomen in het lerarenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.13.5
    text: |-
      Op verzoek van een docent aan Onze Minister is het eerste lid, aanhef en onder b, op deze docent niet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
  - number: 4.4.13.6
    text: |-
      Met pensioengerechtigde leeftijd wordt in dit artikel bedoeld de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.13
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 4.4.14.2
    text: |-
      Op verzoek van het bevoegd gezag van de instelling waaraan de docent is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een docent verstrekt:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.2.b
    text: gegevens betreffende de benoeming of tewerkstelling zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.2.c
    text: gegevens betreffende de instelling waaraan hij is benoemd of tewerkgesteld zonder benoeming;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.2.d
    text: |-
      indien het bevoegd gezag daarvoor toestemming heeft van de docent: gegevens betreffende de activiteiten voor
      herregistratie;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.2.e
    text: overige gegevens betreffende de herregistratie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.3.a
    text: wordt de wijze waarop de gegevens van een docent worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.5
    text: |-
      De betrokkene heeft toegang tot de gegevens die worden bewaard op grond van [artikel 4.4.13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.4.14.6
    text: 'Uit het lerarenregister worden aan Onze Minister gegevens verstrekt ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.6.b
    text: de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.7
    text: |-
      Uit het lerarenregister worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.14.8
    text: |-
      Bij de verstrekking, bedoeld in het zesde en zevende lid, kunnen persoonsgegevens worden verwerkt, indien
      dit noodzakelijk is voor de in het zesde of zevende lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.14
  - number: 4.4.15.1
    text: |-
      Er is een registervoorportaal. In het registervoorportaal zijn van docenten die zijn benoemd of
      tewerkgesteld zonder benoeming en niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen
      persoonsidentificerende gegevens en gegevens betreffende de school en de benoeming of tewerkstelling opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.15.2
    text: |-
      Het registervoorportaal heeft tot doel het inzichtelijk maken welke docenten die zijn benoemd of tewerkgesteld
      zonder benoeming niet voldoen aan de bekwaamheidseisen van het onderwijs dat zij verzorgen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.15.3
    text: 'In aanvulling op het tweede lid heeft het registervoorportaal tot doel gegevens te verstrekken:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.15.3.a
    text: aan Onze Minister ten behoeve van de beleidsvorming; en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.15.3.b
    text: |-
      aan de inspectie voor zover de verwerking van die gegevens noodzakelijk is voor de goede vervulling van haar
      publieke taak.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.15.4
    text: |-
      Het eerste lid, is niet van toepassing op docenten die zijn benoemd of tewerkgesteld zonder benoeming op grond van
      [artikel 4.2.1, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.15.5
    text: Onze Minister draagt zorg voor het beheer van het registervoorportaal.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.15
  - number: 4.4.16.1
    text: |-
      Het registervoorportaal bevat voor elke daarin opgenomen docent de basisgegevens die op grond van
      [artikel 4.4.17][ref1] worden geleverd, waaronder in ieder geval het gegeven betreffende het onderwijs waarvoor hij
      is benoemd of tewerkgesteld zonder benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.4.16.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de gegevens, bedoeld in het eerste lid, nader worden
      gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.16
  - number: 4.4.17.1
    text: |-
      Het bevoegd gezag verstrekt aan Onze Minister de basisgegevens van docenten die zijn benoemd of zijn
      tewerkgesteld zonder benoeming op grond van [artikel 4.2.1, tweede lid, onder c][ref1], met uitzondering van de
      geschiktheidsverklaring afgegeven op grond van [4.2.4, eerste lid, onder b, derde en vijfde lid][ref2], en draagt
      zorg voor het correct bijhouden van die gegevens ten behoeve van het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.17.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het tijdstip en de wijze van
      levering en over de correctie van de gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.17
  - number: 4.4.18.1
    text: 'De docent blijft voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen vermeld:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
  - number: 4.4.18.1.a
    text: totdat hij voldoet aan de bekwaamheidseisen van dat onderwijs; of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
  - number: 4.4.18.1.b
    text: maximaal voor de duur van de periode, genoemd in het artikel op grond waarvan deze docent dit onderwijs geeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
  - number: 4.4.18.2
    text: |-
      Het bevoegd gezag stelt een docent die in het registervoorportaal is opgenomen in staat te voldoen aan de vereisten
      om voor het desbetreffende onderwijs in het lerarenregister te kunnen worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
  - number: 4.4.18.3
    text: |-
      Vanaf het moment dat een docent voor het onderwijs waarvoor hij in het registervoorportaal is opgenomen, voldoet
      aan de criteria om in het lerarenregister te worden vermeld, worden de gegevens van deze docent verstrekt voor
      opname in het lerarenregister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
  - number: 4.4.18.4
    text: |-
      Indien een docent opgenomen is in het registervoorportaal niet langer voldoet aan de vereisten die op grond van de
      in [artikel 4.4.17, eerste lid][ref1], genoemde bepalingen zijn gesteld aan de docent, worden de gegevens van deze
      docent verwijderd uit het registervoorportaal en gedurende vijf jaar bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.18
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.4.19.2
    text: |-
      Op verzoek van het bevoegd gezag van de instelling waaraan de docent is benoemd of tewerkgesteld zonder benoeming
      worden in aanvulling op de gegevens, bedoeld in het eerste lid, de volgende gegevens van een docent verstrekt:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.2.a
    text: het geslacht, het adres, de postcode en de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.2.b
    text: overige gegevens betreffende de benoeming of tewerkstelling zonder benoeming; en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.2.c
    text: gegevens betreffende de instelling waaraan hij is benoemd of tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.3
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.3.a
    text: wordt de wijze waarop de gegevens van een docent worden verstrekt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.3.c
    text: kunnen de gegevens, bedoeld in het eerste lid en tweede lid, nader worden gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.4
    text: |-
      De docent heeft toegang tot de gegevens die worden bewaard op grond van [artikel 4.4.18, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 4.4.19.5
    text: Uit het registervoorportaal worden aan Onze Minister gegevens verstrekt ten behoeve van de beleidsvorming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.6
    text: |-
      Uit het registervoorportaal worden aan de inspectie gegevens verstrekt voor zover de verwerking van die gegevens
      noodzakelijk is voor de goede vervulling van haar publieke taak.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.19.7
    text: |-
      Bij de verstrekking, bedoeld in het vijfde en zesde lid, kunnen persoonsgegevens worden verwerkt, indien
      dat noodzakelijk is voor de in het vijfde of zesde lid genoemde doelen, onverminderd de verplichting voor de
      verwerkingsverantwoordelijke om passende technische en organisatorische maatregelen te treffen als bedoeld in
      artikel 25 van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.19
  - number: 4.4.21
    text: |-
      De [artikelen, 4.4.1, vierde lid][ref1], [4.4.3][ref2], [4.4.5][ref3] en [4.4.8 tot en met 4.4.10][ref4], zijn van
      overeenkomstige toepassing op het registervoorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel4.4.21
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 6.1.1.1
    text: |-
      Het bevoegd gezag bepaalt welke beroepsopleidingen de instelling verzorgt. Ten aanzien van die opleidingen geldt
      de aanspraak op bekostiging uitsluitend indien de opleidingen krachtens [artikel 2.1.1][ref1] voor bekostiging in
      aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.1.1.2
    text: |-
      Onze Minister kan bepalen dat de aanspraak op bekostiging en het recht op diplomering, bedoeld in
      [artikel 1.3.1, derde lid, onderdeel a][ref1], onderscheidenlijk vierde lid, ten aanzien van een beroepsopleiding
      die dreigt te verdwijnen, voor een periode van 5 jaren slechts toekomen aan één instelling als bedoeld in
      [artikel 1.1.1, onderdeel b][ref2], indien hij van oordeel is dat het een unieke, kleinschalige beroepsopleiding
      betreft die van belang blijft voor de arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.1.2.1
    text: |-
      Het bevoegd gezag van een instelling meldt aan Onze Minister het voornemen tot het starten of beëindigen van
      een beroepsopleiding voorafgaand aan het studiejaar waarin wordt beoogd de beroepsopleiding te starten of te
      beëindigen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2
  - number: 6.1.2.2
    text: 'Bij ministeriële regeling worden nadere voorschriften gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2
  - number: 6.1.2.2.a
    text: |-
      het uiterste tijdstip van melding, waarbij onderscheid kan worden gemaakt tussen het starten en beëindigen van een
      opleiding in de beroepsopleidende en in de beroepsbegeleidende leerweg;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2
  - number: 6.1.2.2.b
    text: de vorm en nadere inhoud van de melding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2
  - number: 6.1.2.3
    text: Onze Minister maakt de melding openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2
  - number: 6.1.2a.1
    text: |-
      Het bevoegd gezag zorgt ervoor dat de instelling voldoende keuzedelen verzorgt waar deelnemers uit kunnen kiezen in
      het kader van hun beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2a
  - number: 6.1.2a.2
    text: |-
      Het bevoegd gezag kan één of meer onderdelen van een beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b tot en met d][ref1], aanbieden die niet behoren tot de kwalificaties of de
      keuzedelen, mits deze onderdelen betrekking hebben op persoonlijke, culturele of levensbeschouwelijke vorming,
      aantoonbaar van voldoende kwaliteit zijn en niet samenvallen met onderdelen van de desbetreffende kwalificatie. Bij
      toepassing van de eerste volzin legt het bevoegd gezag hierover verantwoording af in het bestuursverslag, bedoeld
      in [artikel 2.5.4][ref2], dan wel, bij toepassing van [artikel 1.4.1, eerste lid][ref3], in het verslag, bedoeld in
      artikel 1.4.1, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.2a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.1.3.1
    text: |-
      Het bevoegd gezag zorgt ervoor dat een beroepsopleiding alleen door de instelling wordt aangeboden als er na
      beëindiging van de opleiding voldoende arbeidsmarktperspectief is voor de deelnemers. Onder arbeidsmarktperspectief
      wordt in ieder geval verstaan het perspectief voor gediplomeerde schoolverlaters op het binnen een redelijke
      termijn vinden van werk op het niveau van de gevolgde opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3
  - number: 6.1.3.2
    text: |-
      Onverminderd het eerste lid kan het bevoegd gezag van een instelling als bedoeld in [artikel 1.3.2a][ref1]
      of [1.3.3][ref2] een beroepsopleiding aanbieden als de soort instelling in de regeling, bedoeld in
      [artikel 7.2.4][ref3], is vermeld bij de kwalificatie waarop de opleiding is gericht of als de opleiding
      aantoonbaar gericht is op en van belang is voor de specifieke bedrijfstak of groep van bedrijfstakken waarvoor de
      instelling opleidingen verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.3.3
    text: |-
      Het bevoegd gezag zorgt ervoor dat een beroepsopleiding alleen door de instelling wordt aangeboden als de
      verzorging van die opleiding, gelet op het geheel van de voorzieningen op het gebied van het beroepsonderwijs,
      doelmatig is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3
  - number: 6.1.3.4
    text: |-
      Het bevoegd gezag legt over wijzigingen van het opleidingenaanbod van een instelling met betrekking tot het
      arbeidsmarktperspectief en de doelmatige verzorging van een opleiding verantwoording af in het bestuursverslag,
      bedoeld in [artikel 2.5.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 6.1.3a.1
    text: 'Het bevoegd gezag verstrekt zodanige informatie aan aspirant-deelnemers van beroepsopleidingen over:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.a
    text: de instelling,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.b
    text: het aanbod van beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.c
    text: het arbeidsmarktperspectief na beëindiging van de desbetreffende beroepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.d
    text: de inhoud en de inrichting van het te volgen onderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.e
    text: de examinering,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.f
    text: de vooropleidingseisen voor de verschillende beroepsopleidingen, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.1.g
    text: de kwaliteit van de verschillende beroepsopleidingen waaronder het oordeel van de inspectie ter zake,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.3a.2
    text: |-
      Bij ministeriële regeling kunnen nadere specificaties worden gegeven over de vorm en inhoud van de informatie die
      nodig is voor het vergelijken van opleidingen en het kiezen van een passende opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.3a
  - number: 6.1.4.1
    text: |-
      Onze Minister kan besluiten dat ten aanzien van een beroepsopleiding in de beroepsopleidende of beroepsbegeleidende
      leerweg die de instelling verzorgt, de rechten, genoemd in [artikel 1.3.1][ref1], gedurende twee jaar worden
      ontnomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.1.a
    text: gebleken is dat de kwaliteit van die opleiding langer dan één jaar onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
  - number: 6.1.4.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg,
      het onderwijs of de examens, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
  - number: 6.1.4.1.c
    text: |-
      niet of niet meer wordt voldaan aan een of meer zorgplichten, bedoeld in [artikel 6.1.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.4.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
  - number: 6.1.4.2.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 1.3.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma als bedoeld in [artikel 7.4.6][ref1] of certificaat als bedoeld
      in [artikel 7.2.3][ref2] meer is verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.4.2.c
    text: |-
      in het Centraal register wordt geregistreerd dat de rechten, genoemd in [artikel 1.3.1][ref1], van de instelling
      met betrekking tot de opleiding zijn ontnomen en de ingangsdatum en de einddatum daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.3
    text: |-
      Bij een beschikking tot ontneming van rechten bepaalt Onze Minister het tijdstip waarop die beschikking van kracht
      wordt zodanig, dat de voor de opleiding ingeschreven deelnemers de opleiding aan een andere instelling binnen een
      redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
  - number: 6.1.4.4
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4
  - number: 6.1.4a.1
    text: |-
      Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheden, bedoeld in
      [artikel 6.1.1, tweede lid][ref1], en [6.1.4, eerste lid, onder c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.4a.2
    text: |-
      Onze Minister kan zich bij de toepassing van de beleidsregels laten adviseren door een onafhankelijke
      adviescommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.4a
  - number: 6.1.5.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder a][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van de opleiding.
      Onze Minister geeft eerst toepassing aan [artikel 6.1.4, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.1.a
    text: na de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
  - number: 6.1.5.1.b
    text: |-
      Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
  - number: 6.1.5.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.2a
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder c][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de naleving van een of meer
      zorgplichten, bedoeld in [artikel 6.1.3][ref2], waarbij wordt bepaald aan welke maatregelen het bevoegd gezag
      gevolg dient te geven. Aan de waarschuwing kan een termijn van ten minste drie maanden worden verbonden waarbinnen
      aan de maatregelen gevolg moet worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.3
    text: Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5
  - number: 6.1.5a.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.1.4, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5a
  - number: 6.1.5a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5a
  - number: 6.1.5b.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.4][ref1]. Bij
      de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in het
      Centraal register bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.5b.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5b.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.1.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.1.1
    text: |-
      De aanvraag om toepassing van [artikel 1.4.1][ref1] geldt mede als aanmelding voor
      registratie in het Centraal register. In aanvulling op de gegevens, bedoeld in
      [artikel 6.4.1, tweede lid, en derde lid, onderdelen a en b][ref2], verschaft het bevoegd gezag van een niet uit
      ’s Rijks kas bekostigde instelling bij de aanmelding de gegevens waaruit blijkt dat het onderwijs van voldoende
      kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde, bedoeld in [artikel 1.4.1, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.1.2
    text: |-
      Indien Onze Minister de aanvraag om toepassing van [artikel 1.4.1][ref1] inwilligt, registreert hij bij de
