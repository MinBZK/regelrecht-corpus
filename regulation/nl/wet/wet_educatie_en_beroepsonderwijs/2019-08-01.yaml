  - number: 1.2.1.1
    text: |-
      Educatie is gericht op bevordering van de zelfredzaamheid van volwassenen en sluit waar mogelijk aan op het
      ingangsniveau van het beroepsonderwijs. Educatie omvat activiteiten op het niveau van het basisonderwijs en het
      voortgezet onderwijs. Opleidingen voortgezet algemeen volwassenenonderwijs zijn gericht op het behalen van een
      diploma van onderwijs als bedoeld in de [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 1.2.1.2
    text: |-
      Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen,
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de deelnemers en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.2.1
  - number: 1.3.1.1
    text: 'Aan regionale opleidingencentra worden verzorgd:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.1
  - number: 1.3.1.1.a
    text: opleidingen beroepsonderwijs en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.1
  - number: 1.3.1.1.b
    text: |-
      indien de desbetreffende instelling op 1 augustus 2012 een of meer opleidingen voortgezet algemeen
      volwassenenonderwijs verzorgde: een of meer opleidingen voortgezet algemeen volwassenenonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.1
  - number: 1.3.1.2
    text: |-
      Aan regionale opleidingencentra kunnen een of meer opleidingen voortgezet algemeen volwassenenonderwijs worden
      verzorgd, indien de desbetreffende instelling op 1 augustus 2012 geen voortgezet algemeen volwassenenonderwijs
      verzorgde.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.3.1
  - number: 1.3.1.3
    text: |-
      Het regionaal opleidingencentrum dat daarvoor op grond van [artikel 2.1.3, eerste en tweede lid][ref1], in
      aanmerking komt, heeft aanspraak op bekostiging uit ’s Rijks kas voor


