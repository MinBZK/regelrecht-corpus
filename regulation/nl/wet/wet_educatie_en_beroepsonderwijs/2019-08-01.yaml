    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt voor 1 oktober van het jaar voorafgaand aan het eerste
      studiejaar waarin de inschrijving voor de opleiding niet meer openstaat.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.4.4
  - number: 6.4.4.3
    text: |-
      Onze Minister kan de registratie ambtshalve beëindigen wanneer er gedurende ten minste één jaar geen deelnemers
      meer zijn ingeschreven aan de opleiding en de inspectie uit een oogpunt van kwaliteitsbewaking hiertoe aanleiding
      ziet.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.4.4
  - number: 6.4.4.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op de registratie van de examinering door
      exameninstellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6.4.4
  - number: 6a.1.1.1
    text: |-
      Onze Minister maakt jaarlijks voor de aanvang van het studiejaar bekend welke instellingen, bedoeld in
      [artikel 1.4a.1, eerste lid][ref1], voor welke opleidingen rechten hebben als bedoeld in dat lid. Deze bekendmaking
      vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.1.1.a
    text: de naam van de instelling en van de opleiding die de instelling verzorgt,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.1
  - number: 6a.1.1.1.b
    text: |-
      in voorkomende gevallen, een waarschuwing als bedoeld in [artikel 6a.1.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.1.1.c
    text: in voorkomende gevallen, de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.1
  - number: 6a.1.1.2
    text: |-
      Als peildatum voor de gegevens, bedoeld in het eerste lid, hanteert Onze Minister 1 juni voorafgaand aan de
      bekendmaking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.1
  - number: 6a.1.2.1
    text: |-
      Onze Minister kan ten aanzien van een opleiding educatie, verzorgd door een instelling als bedoeld in
      [artikel 1.4a.1][ref1], het recht, bedoeld in het eerste lid van dat artikel, ontnemen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.1.a
    text: |-
      gebleken is dat de kwaliteit van een of meer examens of een of meer onderdelen van een examen van die opleiding
      onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.2
  - number: 6a.1.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarden, bedoeld in [artikel 1.4a.1, eerste lid][ref1],
      of aan de voorwaarde, bedoeld in [artikel 1.4a.1, zesde lid][ref2], of aan
      [artikel 1.4a.1, achtste lid, onderdelen a tot en met e][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6a.1.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder a][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van een of
      meer examens of een of meer onderdelen van een examen van die opleiding. Onze Minister geeft eerst toepassing aan
      [artikel 6a.1.2, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.3.1.a
    text: na de waarschuwing ten minste een jaar is verstreken, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.3
  - number: 6a.1.3.1.b
    text: |-
      Onze Minister aan de hand van een hernieuwd onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.3
  - number: 6a.1.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.4
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1][ref1], langer dan een studiejaar een
      opleiding educatie niet heeft verzorgd, vervalt van rechtswege het recht om voor de desbetreffende opleiding een
      diploma of certificaat als bedoeld in [artikel 1.4a.1, eerste lid][ref2], uit te reiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.2.1.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een opleiding educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a,][ref1] ontnemen, indien


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 6a.2.1.1.a
    text: de kwaliteit van de examens van die opleiding langer dan één jaar onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
  - number: 6a.2.1.1.b
    text: niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
  - number: 6a.2.1.2
    text: |-
      Bij de ontneming van het recht, bedoeld in het eerste lid, wordt bepaald met ingang van welk tijdstip dit
      geschiedt. Het besluit tot ontneming van het recht op examinering wordt openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
  - number: 6a.2.1.3
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering, onder bepaling van de termijn waarbinnen aan
      die waarschuwing gevolg moet zijn gegeven. [Artikel 6.1.5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.2.1.4
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na het besluit tot ontneming, bedoeld in het
      eerste lid, het recht op examinering opnieuw verkrijgen. [Artikel 1.4a.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.2.1.5
    text: |-
      Dit artikel is van overeenkomstige toepassing op instellingen als bedoeld in [artikel 1.4a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel6a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.1.1
    text: 'Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. Een andere taal kan worden gebezigd:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.1
  - number: 7.1.1.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.1
  - number: 7.1.1.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.1
  - number: 7.1.2.1
    text: |-
      De instelling biedt het onderwijs aan in de vorm van beroepsopleidingen of opleidingen educatie. Een
      beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de naam van de kwalificatie
      waarop zij is gericht of voorzover het gaat om deelnemers die ingeschreven zijn of zullen worden voor een
      opleidingsdomein of kwalificatiedossier, de naam van dat opleidingsdomein of dat kwalificatiedossier. Het keuzedeel
      dat deel uitmaakt van de beroepsopleiding wordt door de instelling in het maatschappelijk verkeer aangeduid met de
      naam van dat keuzedeel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.2
  - number: 7.1.2.2
    text: |-
      Een beroepsopleiding is een onderwijstraject dat voor een deelnemer is ingericht overeenkomstig de eisen van
      [hoofdstuk 7, titel 2][ref1], onverminderd [artikel 1.4.1, lid 1a][ref2], en dat is gericht op het behalen van
      een kwalificatie in het beroepsonderwijs alsmede een of meer daarbij behorende keuzedelen, ten bewijze waarvan een
      diploma wordt uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.1.2.3
    text: |-
      Een opleiding educatie is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking
      van eindtermen of het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van een dergelijk diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.1.2.4
    text: Beroepsopleidingen worden afgesloten met een examen. Opleidingen educatie kunnen worden afgesloten met een examen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.2
  - number: 7.1.3.1
    text: |-
      Een kwalificatie is het geheel van bekwaamheden die een afgestudeerde van een beroepsopleiding kwalificeren voor
      het functioneren in een beroep of een groep van samenhangende beroepen, in het vervolgonderwijs en als burger en
      dat is beschreven binnen een kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.3
  - number: 7.1.3.2
    text: |-
      Het keuzedeel is onderdeel van een beroepsopleiding en is gericht op verbreding of verdieping van de kwalificatie
      waar deze bij behoort, dan wel gericht op doorstroom naar een vervolgopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.3
  - number: 7.1.4.1
    text: |-
      Bij het geven van onderwijs aan een deelnemer van een beroepsopleiding die bij de aanvang van die opleiding
      leerplichtig was en die is opgenomen in een ziekenhuis of die in verband met ziekte thuis verblijft, kan het
      bevoegd gezag van een instelling die de beroepsopleiding verzorgt, worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
  - number: 7.1.4.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
  - number: 7.1.4.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de
      deelnemer is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 7.1.4.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 180 van de Wet op het primair onderwijs][ref1] en
      [artikel 166 van de Wet op de expertisecentra][ref2] indien de deelnemer is opgenomen in een ziekenhuis niet zijnde
      een academisch ziekenhuis dan wel indien de deelnemer in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel166
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '180'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '166'
  - number: 7.1.4.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de instelling waarbij de deelnemer is ingeschreven, mede het geven van onderwijs aan de
      deelnemer betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
  - number: 7.1.4.4
    text: |-
      Het Rijk verstrekt aan schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, bekostiging voor
      activiteiten die worden verricht met betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
  - number: 7.1.4.5
    text: |-
      Schoolbegeleidingsdiensten als bedoeld in het tweede lid, onderdeel b, zijn de
      schoolbegeleidingsdiensten die voor de ondersteuning bij het onderwijs aan zieke leerlingen, in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________________________________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0010086#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0010086
        artikel: IX
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.1
  - number: 7.2.2.1
    text: 'De volgende soorten beroepsopleidingen worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.1.a
    text: de entreeopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.1.b
    text: de basisberoepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.1.c
    text: de vakopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.1.d
    text: de middenkaderopleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.1.e
    text: de specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.2
    text: |-
      De in het eerste lid bedoelde opleidingen kunnen worden verzorgd in de beroepsopleidende leerweg en de
      beroepsbegeleidende leerweg.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.2.3
    text: |-
      De entreeopleidingen richten zich op de kwalificatie voor het eerste niveau van beroepsuitoefening of voor
      de entree op de arbeidsmarkt. De basisberoepsopleidingen richten zich op de kwalificatie voor het tweede, de
      vakopleidingen op de kwalificatie voor het derde en de middenkader- en specialistenopleidingen op de kwalificatie
      voor het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.2
  - number: 7.2.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat aan onderdelen van een kwalificatie of
      kwalificaties dan wel aan een keuzedeel of keuzedelen een certificaat is verbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.3
  - number: 7.2.3.2
    text: |-
      [Artikel 7.4.6, eerste en derde lid,][ref1] is van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.4.1
    text: |-
      Met het oog op het functioneren van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen
      het aanbod van het beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de
      arbeidsmarktperspectieven voor afgestudeerden, draagt Onze Minister zorg voor het vaststellen en onderhouden
      van een samenhangend en gedifferentieerd geheel van opleidingsdomeinen, kwalificatiedossiers, de bijbehorende
      kwalificaties alsmede de keuzedelen die voor de desbetreffende bedrijfstakken of beroepencategorieën van belang
      zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2
    text: |-
      Daartoe worden op voorstel van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, behoudens het achtste
      lid, bij ministeriële regeling vastgesteld:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.a
    text: de kwalificatiedossiers,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.b
    text: 'van elk kwalificatiedossier:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.b.1
    text: |-
      het opleidingsdomein waartoe het kwalificatiedossier behoort, tenzij het een kwalificatiedossier betreft dat
      uitsluitend is gericht op de kwalificatie voor de entree op de arbeidsmarkt,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.b.2
    text: de kwalificatie of kwalificaties die het kwalificatiedossier bevat, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.b.3
    text: |-
      de kwalificatie of kwalificaties op grond waarvan een beroepsopleiding kan worden ingericht die voor bekostiging in
      aanmerking komt,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.c
    text: 'van elke kwalificatie:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.2.c.1
    text: |-
      de soort beroepsopleiding, bedoeld in [artikel 7.2.2, eerste lid][ref1], waarop de kwalificatie is gericht,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.2°
    text: |-
      de leerweg of leerwegen, bedoeld in [artikel 7.2.2, tweede lid][ref1], waarin die beroepsopleiding kan worden
      verzorgd,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.3
    text: |-
      het niveau, bedoeld in [artikel 7.2.2, derde lid][ref1], van die beroepsopleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.4
    text: |-
      of toepassing is gegeven aan [artikel 7.2.6, eerste lid][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.2.c.5
    text: |-
      in voorkomend geval, door welke soorten instellingen als bedoeld in de [artikelen 1.3.2a][ref1] en [1.3.3][ref2],
      een beroepsopleiding mag worden verzorgd die is gericht op de kwalificatie,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 7.2.4.2.d
    text: de keuzedelen, waarbij van elk keuzedeel wordt aangegeven bij welke kwalificatie of kwalificaties het behoort.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.3
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven neemt bij het voorstel voor een kwalificatiedossier
      het bepaalde in het tweede, vierde, vijfde en zesde lid in acht. Uit het voorstel blijkt dat voldoende acht is
      geslagen op de aansluiting tussen de opleidingen voorbereidend beroepsonderwijs, de opleidingen middelbaar algemeen
      voortgezet onderwijs, de beroepsopleidingen en de opleidingen hoger beroepsonderwijs, in elk geval door raadpleging
      van vertegenwoordigers van die onderwijsvelden. Indien ook andere instanties nauw bij het voorstel voor het
      kwalificatiedossier zijn betrokken, maakt de Samenwerkingsorganisatie in haar voorstel melding van de wijze waarop
      het oordeel van die instanties is betrokken in het voorstel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.4
    text: |-
      Bij de vaststelling van een kwalificatiedossier worden de referentieniveaus
      Nederlandse taal en de referentieniveaus rekenen in acht genomen die op grond van
      [artikel 2, tweede lid, aanhef en onderdeel d, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1] zijn
      vastgesteld voor de soorten opleiding als bedoeld in [artikel 7.2.2, eerste lid, onder a tot en met e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0027679
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de inhoud van een
      kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.6
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de termijnen bij de totstandkoming, vaststelling en
      geldigheidsduur van kwalificatiedossiers, keuzedelen en de koppeling van keuzedelen aan kwalificaties. Tevens
      worden bij ministeriële regeling een model voor een kwalificatiedossier, een model voor een keuzedeel en een
      toetsingskader voor de kwalificatiestructuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.7
    text: |-
      Deelnemers worden behoudens de tweede volzin opgeleid overeenkomstig het kwalificatiedossier dat voor de
      desbetreffende beroepsopleiding is vastgesteld voor de aanvang van het studiejaar waarin zij met het eerste jaar
      van die opleiding starten. Nadat de geldigheidsduur van een kwalificatiedossier, een keuzedeel, keuzedelen en de
      koppeling van keuzedelen aan kwalificaties is verstreken, kan een diploma op basis van dat kwalificatiedossier nog
      worden uitgereikt dan wel het behalen van een keuzedeel op het diploma worden vermeld, gedurende een periode die
      overeenkomt met de studieduur van de desbetreffende beroepsopleiding, vermeerderd met 2 jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4.8
    text: |-
      Onze Minister kan in bijzondere gevallen een kwalificatiedossier vaststellen zonder voorstel van de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven. Onze Minister gaat hiertoe niet over dan nadat de
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven in de gelegenheid is gesteld om binnen een door Onze
      Minister te stellen termijn een voorstel voor een kwalificatiedossier te doen dat aansluit bij de ontwikkelingen op
      de arbeidsmarkt en is afgestemd met het beroepsonderwijs en het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4
  - number: 7.2.4a.1
    text: |-
      Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de bij of krachtens het tweede en
      derde lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.2
    text: |-
      De studieduur van de opleiding wordt uitgedrukt in volledige studiejaren of gedeelten daarvan. Eén volledig
      studiejaar heeft een studielast van ten minste 1600 klokuren.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3
    text: 'De studieduur bedraagt:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3.a
    text: één volledig studiejaar voor de entreeopleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3.b
    text: ten minste één en ten hoogste twee volledige studiejaren voor de basisberoepsopleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3.c
    text: ten minste twee en ten hoogste drie volledige studiejaren voor de vakopleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3.d
    text: drie volledige studiejaren voor de middenkaderopleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.3.e
    text: één volledig studiejaar voor de specialistenopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.4a.4
    text: |-
      Indien dit in verband met de aard van de opleiding noodzakelijk is, kan Onze Minister bij ministeriële regeling
      bepalen dat voor de middenkaderopleiding een langere studieduur kan worden vastgesteld. Onze Minister geeft daarbij
      de betreffende opleiding aan en het aantal volledige studiejaren of gedeelten daarvan die de studieduur van die
      opleiding ten hoogste mag bedragen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.4a
  - number: 7.2.5a
    text: |-
      Bij ministeriële regeling worden op voorstel van de instellingen in overleg met de Samenwerkingsorganisatie
      beroepsonderwijs bedrijfsleven de opleidingsdomeinen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.5a
  - number: 7.2.6.1
    text: |-
      Indien voor een beroep bij of krachtens een wet, verdrag of bindend besluit van een volkenrechtelijke organisatie,
      vereisten zijn vastgesteld over de kwaliteiten onder meer op het gebied van kennis, inzicht, vaardigheden of
      beroepshoudingen waarover degenen die een opleiding gericht op dat beroep voltooien, moeten beschikken, of over de
      examinering bij de desbetreffende beroepsopleiding:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.6
  - number: 7.2.6.1.a
    text: |-
      draagt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven ervoor zorg dat deze vereisten verwerkt zijn bij
      het doen van het voorstel, bedoeld in [artikel 7.2.4, tweede en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6.1.b
    text: |-
      voegt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven een verklaring van Onze Minister die het aangaat
      dat deze vereisten correct zijn verwerkt in het voorstel, bedoeld in [artikel 7.2.4, tweede en derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6.1.c
    text: |-
      neemt Onze Minister deze vereisten in acht bij de vaststelling van de standaarden, bedoeld in
      [artikel 7.4.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.2.6.2
    text: |-
      De instelling draagt er bij het aanbieden van een beroepsopleiding zorg voor dat degenen die deze opleiding volgen,
      ten minste in de gelegenheid zijn aan de in het eerste lid bedoelde vereisten te voldoen en dat bij de examinering,
      zo nodig in afwijking van [titel 4 van dit hoofdstuk][ref1], aan die vereisten wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '4'
  - number: 7.2.7.1
    text: |-
      Het bevoegd gezag draagt er zorg voor dat beroepsopleidingen zodanig zijn ingericht dat deelnemers, ongeacht of
      zij eerst worden ingeschreven voor een opleidingsdomein of voor een kwalificatiedossier, de kwalificatie en daarbij
      behorende keuzedelen binnen de vastgestelde studieduur kunnen bereiken en dat het onderwijsprogramma evenwichtig is
      ingedeeld, alsmede voldoende begeleide onderwijsuren en uren beroepspraktijkvorming omvat.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.2
    text: |-
      Beroepsopleidingen in de beroepsopleidende leerweg en in de beroepsbegeleidende leerweg zijn voltijds ingericht en
      hebben per volledig studiejaar een studielast van ten minste 1600 klokuren.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.3
    text: |-
      Het onderwijsprogramma voor een opleiding in de beroepsopleidende leerweg voldoet aan de eisen met betrekking tot
      voldoende begeleide onderwijsuren en uren beroepspraktijkvorming, bedoeld in het eerste lid, indien het bevoegd
      gezag voor de deelnemer een onderwijsprogramma verzorgt dat:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.3.a
    text: voor de entreeopleiding ten minste 1000 klokuren omvat waarvan ten minste 600 begeleide onderwijsuren;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.3.b
    text: |-
      voor een eenjarige basisberoepsopleiding en voor de specialistenopleiding ten minste 1000 klokuren omvat, waarvan
      ten minste 700 begeleide onderwijsuren en ten minste 250 klokuren beroepspraktijkvorming;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.3.c
    text: |-
      voor een tweejarige basisberoepsopleiding en voor een tweejarige vakopleiding ten minste 2000 klokuren omvat,
      waarvan ten minste 1250 begeleide onderwijsuren en ten minste 450 klokuren beroepspraktijkvorming, met dien
      verstande dat in het eerste studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.3.d
    text: |-
      voor een driejarige vakopleiding en de middenkaderopleiding ten minste 3000 klokuren omvat, waarvan ten minste 1800
      begeleide onderwijsuren en ten minste 900 klokuren beroepspraktijkvorming, met dien verstande dat in het eerste
      studiejaar ten minste 700 begeleide onderwijsuren worden verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.4
    text: |-
      Het onderwijsprogramma voor een opleiding in de beroepsbegeleidende leerweg voldoet aan de eisen met betrekking
      tot voldoende begeleide onderwijsuren en uren beroepspraktijkvorming, bedoeld in het eerste lid, indien het bevoegd
      gezag voor de deelnemer een onderwijsprogramma verzorgt dat elk studiejaar ten minste 850 klokuren omvat, waarvan
      ten minste 200 begeleide onderwijsuren en ten minste 610 klokuren beroepspraktijkvorming. Het bevoegd gezag kan
      een onderwijsprogramma verzorgen dat minder uren omvat dan de genoemde aantallen mits de opleiding aantoonbaar
      van voldoende kwaliteit is. In het geval het onderwijsprogramma minder uren omvat, legt het bevoegd gezag
      hierover verantwoording af in het bestuursverslag, bedoeld in [artikel 2.5.4][ref1] dan wel, bij toepassing van
      [artikel 1.4.1, eerste lid][ref2], in het verslag, bedoeld in artikel 1.4.1, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.2.7.5
    text: |-
      Het onderwijsprogramma, bedoeld in het derde en vierde lid, omvat alle onderwijsactiviteiten, gericht op het
      bereiken van de onderwijs- en vormingsdoelen van de opleiding, waaraan door de deelnemer wordt deelgenomen onder
      verantwoordelijkheid en toezicht van het bevoegd gezag en bestaat uitsluitend uit begeleide onderwijsuren en
      beroepspraktijkvorming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.6
    text: |-
      De begeleide onderwijsuren, bedoeld in het eerste, derde, vierde en vijfde lid, zijn klokuren waarin onderwijs
      wordt gegeven onder verantwoordelijkheid en met actieve betrokkenheid van onderwijspersoneel als bedoeld in de
      [artikelen 4.2.1][ref1] en [4.2.2][ref2], niet zijnde uren die deel uit maken van de beroepspraktijkvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 7.2.7.7
    text: |-
      Indien in het laatste studiejaar van de basisberoepsopleiding of de vakopleiding de studieduur van de opleiding
      gerekend vanaf 1 september en naar boven afgerond op hele maanden minder is dan 10 maanden, worden het aantal
      begeleide onderwijsuren en het aantal klokuren beroepspraktijkvorming, genoemd in het derde lid, onder b, c en d
      en het vierde lid, in dat studiejaar evenredig verlaagd. De laatste twee volzinnen van het derde en vierde lid zijn
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
  - number: 7.2.7.8
    text: |-
      Voor opleidingen waarvan op grond van [artikel 7.2.4a, vierde lid][ref1], een studieduur is vastgesteld van
      meer dan drie volledige studiejaren wordt het onderwijsprogramma, bedoeld in het derde lid, onderdeel d, naar
      evenredigheid verhoogd met begeleide onderwijsuren en uren beroepspraktijkvorming. De laatste twee volzinnen van
      het derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.7.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent het aanbod van
      keuzedelen aan deelnemers alsmede de omvang van het keuzedeel of de keuzedelen die onderdeel uitmaken van de
      beroepsopleiding en de omvang van de onderdelen, bedoeld in [artikel 6.1.2a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.2.7.10
    text: |-
      Het bevoegd gezag kan op verzoek van de deelnemer bij het aanbod van keuzedelen bij een opleiding afwijken van de
      koppeling van keuzedelen aan de kwalificatie van de opleiding zoals opgenomen in de ministeriële regeling, bedoeld
      in [artikel 7.2.4, zesde lid, eerste volzin][ref1]. De keuzedelen die bij een opleiding worden aangeboden, vallen
      niet samen met een of meer onderdelen van de kwalificatie van de opleiding. Het bevoegd gezag legt verantwoording
      af over de toepassing van de in de eerste volzin bedoelde bevoegdheid in het bestuursverslag, bedoeld in
      [artikel 2.5.4][ref2], dan wel, bij toepassing van [artikel 1.4.1, eerste lid][ref3], in het verslag, bedoeld in
      artikel 1.4.1, zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.2.8.1
    text: |-
      Van elke beroepsopleiding maakt onderricht in de praktijk van het beroep deel uit. De beroepspraktijkvorming kan
      voor een deel plaatsvinden in de periode waarin de deelnemer is ingeschreven voor een opleidingsdomein of een
      kwalificatiedossier of tijdens het onderwijsprogramma op basis van een of meer keuzedelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst, gesloten door de in
      [artikel 7.2.9][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen van partijen en omvat
      met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste bepalingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.2.a
    text: |-
      de aanvangsdatum en einddatum van de beroepspraktijkvorming, alsmede het totale aantal te volgen praktijkuren en de
      verdeling daarvan over de studiejaren,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.8.2.b
    text: de begeleiding van de deelnemer,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.8.2.c
    text: |-
      het deel van de kwalificatie dan wel het keuzedeel, de keuzedelen of het deel daarvan dat de beroepspraktijkvorming
      omvat alsmede de wijze van beoordeling van de beroepspraktijkvorming, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.8.2.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de deelnemers binnen het bedrijf. Het bevoegd gezag beoordeelt of de deelnemer de beroepspraktijkvorming met een
      positieve beoordeling heeft voltooid. Het bevoegd gezag betrekt bij die beoordeling het oordeel van het bedrijf
      onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling op te
      nemen regels.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.8
  - number: 7.2.9.1
    text: |-
      Het bevoegd gezag van de instelling draagt zorg voor de beschikbaarheid van de praktijkplaats en de totstandkoming
      van de in [artikel 7.2.8][ref1] bedoelde overeenkomst. De overeenkomst wordt gesloten door de instelling, de
      deelnemer en het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.2
    text: |-
      Indien het bevoegd gezag en de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven na het sluiten van de in
      [artikel 7.2.8][ref1] bedoelde overeenkomst vaststellen dat de praktijkplaats niet of niet volledig beschikbaar
      is, de begeleiding tekortschiet of ontbreekt, het bedrijf of de organisatie niet langer beschikt over een gunstige
      beoordeling als bedoeld in [artikel 7.2.10][ref2], of sprake is van andere omstandigheden die maken dat de
      beroepspraktijkvorming niet naar behoren zal kunnen plaatsvinden, bevordert het bevoegd gezag, na overleg met het
      bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven, dat een toereikende vervangende voorziening
      beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.10.1
    text: |-
      Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven zorgt ervoor dat bedrijven en
      organisaties die de beroepspraktijkvorming verzorgen eenmaal in de vier jaar worden beoordeeld aan de hand van door
      de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven vast te stellen criteria. Indien daartoe door bijzondere
      omstandigheden aanleiding bestaat kan controle frequenter plaats vinden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.2
    text: |-
      Het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven erkent een bedrijf of organisatie als
      leerbedrijf voor de beroepspraktijkvorming of handhaaft de erkenning bij een gunstige beoordeling op grond van
      het eerste lid. Het bestuur weigert de erkenning of trekt de erkenning in, indien de in de eerste volzin bedoelde
      beoordeling ongunstig is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.3
    text: |-
      Het bestuur vraagt geen vergoeding voor de kosten van de beoordeling, bedoeld in het eerste lid, en de
      beschikkingen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.4
    text: |-
      De erkenning vervalt van rechtswege als het leerbedrijf gedurende een aaneengesloten periode van vier jaar geen
      beroepspraktijkvorming heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.5
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven maakt de in het eerste lid bedoelde criteria bekend. Van
      deze bekendmaking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.6
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven draagt zorg voor openbaarmaking van een overzicht van
      bedrijven en organisaties met een erkenning op grond van het tweede lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.2.10.7
    text: |-
      Tot het verzorgen van beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend bevoegd
      de bedrijven en organisaties met een erkenning op grond van het tweede lid, eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.2.10
  - number: 7.3.1.1
    text: 'De volgende opleidingen educatie worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.1.a
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma van onderwijs als
      bedoeld in de [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.3.1.1.b
    text: |-
      opleidingen Nederlandse taal en rekenen, gericht op alfabetisering en op het ingangsniveau van het
      beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.1.c
    text: |-
      de opleidingen Nederlands als tweede taal I en II die opleiden voor het diploma Nederlands als tweede taal, bedoeld
      in het Staatsexamenbesluit Nederlands als tweede taal,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.1.d
    text: de opleidingen Nederlands als tweede taal, gericht op beheersing van een basisniveau Nederlandse taal,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.1.e
    text: de opleidingen Nederlands als tweede taal, gericht op alfabetisering, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.1.f
    text: bij ministeriële regeling aan te wijzen andere opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.2
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder b, zijn afgestemd op het maatschappelijk functioneren van de
      deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.3
    text: Bij de opleidingen, bedoeld in het eerste lid, onder b, c en d, kunnen verschillende niveaus worden onderscheiden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
  - number: 7.3.1.4
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder c tot en met e, zijn gericht op volwassenen die niet
      inburgeringsplichtig zijn in de zin van [artikel 1, aanhef en onder b, van de Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '1'
  - number: 7.3.2.1
    text: |-
      De opleiding Nederlands als tweede taal I is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c][ref1], door hen voor wie het Nederlands niet de moedertaal is en die ten
      minste het niveau van het primair onderwijs hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2.2
    text: |-
      De opleiding Nederlands als tweede taal II is gericht op de beheersing van de Nederlandse taal met het oog op
      het volgen van opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het
      Nederlands niet de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het
      niveau van het middenkader.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.2
  - number: 7.3.3.1
    text: |-
      Bij ministeriële regeling worden eindtermen vastgesteld voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder c][ref1], en kunnen eindtermen worden vastgesteld voor de opleidingen, bedoeld in
      artikel 7.3.1, eerste lid, onder b, d, e en f.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3.2
    text: |-
      Het bevoegd gezag stelt eindtermen vast voor de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder b, d, e en f][ref1], indien daarvoor geen eindtermen zijn vastgesteld bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4.1
    text: |-
      Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het behalen
      van elk der in het eerste lid genoemde diploma’s noodzakelijke vakken en andere programma-onderdelen, en omtrent
      de cursusduur.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.3.4
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van opleidingen
      voortgezet algemeen volwassenenonderwijs en opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.1
  - number: 7.4.2.1
    text: Het bevoegd gezag van een instelling geeft de deelnemers de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.2
  - number: 7.4.2.2
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen of aan de hand van de kwalificatie-
      eisen in het kwalificatiedossier en de eisen van het keuzedeel of de keuzedelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.2
  - number: 7.4.3
    text: Het examen van een beroepsopleiding strekt zich uit over de kwalificatie en een of meer keuzedelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.3
  - number: 7.4.3a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de examens van
      beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.3a
  - number: 7.4.3a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen onderdelen van een beroepsopleiding worden aangewezen waarbij geheel
      of gedeeltelijk centrale examinering plaatsvindt. Voor onderdelen waarbij gedeeltelijk centrale examinering
      plaatsvindt, wordt bij ministeriële regeling bepaald over welk gedeelte het centraal examen zich uitstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.3a
  - number: 7.4.4
    text: |-
      Bij ministeriële regeling worden landelijke standaarden voor de kwaliteit van de examens van de beroepsopleidingen
      vastgesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4
  - number: 7.4.4.a
    text: |-
      de inhoud en het niveau van de examens, in relatie tot de kwalificatie-eisen in het kwalificatiedossier alsmede de
      eisen van de keuzedelen, bedoeld in [artikel 7.2.4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.4.b
    text: de procedures rond de examens en de voorwaarden waaronder examens worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4
  - number: 7.4.4a.1
    text: |-
      Het bevoegd gezag kan de examinering van een beroepsopleiding overdragen aan een andere instelling als bedoeld
      in [artikel 1.1.1, onder b,][ref1] of [1.4.1][ref2] of aan een exameninstelling, voor zover deze het recht op
      examinering van die beroepsopleiding hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.4a.2
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 6.1.5b, eerste lid][ref1],
      [6.2.3b, eerste lid][ref2], dan wel [6.3.2, eerste lid][ref3], is het bevoegd gezag voor die beroepsopleiding
      gehouden toepassing te geven aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.4.4a.3
    text: |-
      Het bevoegd gezag kan de examinering van examendeelnemers die op grond van een samenwerkingsovereenkomst als
      bedoeld in [artikel 8.4.2][ref1] een entreeopleiding volgen, onder zijn verantwoordelijkheid laten uitvoeren door
      het bevoegd gezag van een school voor voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.4.5.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt, al dan niet in samenwerking met een of meer
      bevoegde gezagsorganen van andere instellingen, ten behoeve van de examinering een examencommissie in voor elke
      door de instelling verzorgde opleiding of voor groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.2
    text: |-
      Het bevoegd gezag kan de taken en bevoegdheden, bedoeld in [artikel 7.4.5a][ref1] gedeeltelijk opdragen aan een
      centrale examencommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.5.3
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het onafhankelijk en deskundig functioneren van de examencommissie
      voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.4
    text: |-
      Het bevoegd gezag benoemt de leden van de examencommissie op basis van hun deskundigheid op het gebied van de
      desbetreffende opleiding of groepen van opleidingen of op het gebied van examinering.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.5
    text: |-
      Alvorens tot benoeming van een lid over te gaan, hoort het bevoegd gezag de leden van de desbetreffende
      examencommissie en toetst het de deskundigheid van het te benoemen lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.6
    text: |-
      Ten minste één lid van de examencommissie is afkomstig van buiten de opleiding of groep van opleidingen waarvoor de
      examencommissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.7
    text: |-
      Ten minste één lid van de examencommissie is als docent verbonden aan de opleiding of groep van opleidingen
      waarvoor de examencommissie is ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.8
    text: |-
      Ten minste één lid van de examencommissie is afkomstig uit de beroepspraktijk, voor zover hierin niet wordt
      voorzien met een lid als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5.9
    text: |-
      Leden van het bevoegd gezag en personen die anderszins financiële verantwoordelijkheid dragen binnen de
      instelling worden niet benoemd tot lid van de examencommissie. In afwijking van de eerste volzin kunnen
      personen die anderszins financiële verantwoordelijkheid dragen binnen de instelling worden benoemd tot lid van
      de examencommissie indien de examencommissie regels vaststelt ter voorkoming van belangenverstrengeling bij de
      toedeling en uitvoering van haar taken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5
  - number: 7.4.5a.1
    text: |-
      Een examencommissie heeft behoudens [artikel 7.4.5, tweede lid][ref1], ten minste de volgende taken en
      bevoegdheden:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.5a.1.a
    text: het borgen van de kwaliteit van de examinering en van de instellingsexamens,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.1.b
    text: het vaststellen van richtlijnen en aanwijzingen om instellingsexamens te beoordelen en vast te stellen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.1.c
    text: het vaststellen van de instellingsexamens,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.1.d
    text: |-
      het op objectieve en deskundige wijze vaststellen of een deelnemer voldoet aan de voorwaarden voor het verkrijgen
      van een diploma, een certificaat of een instellingsverklaring als bedoeld in [artikel 7.4.6a][ref1] alsmede het
      uitreiken of afgeven daarvan,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.5a.1.e
    text: het verlenen van vrijstelling van een instellingsexamen of een centraal examen en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.1.f
    text: |-
      het bij de uitslag betrekken van een keuzedeel waarin de deelnemer in het kader van een eerder door hem gevolgde
      beroepsopleiding examen heeft afgelegd maar dat niet met goed gevolg door hem is afgesloten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de taken en bevoegdheden,
      bedoeld in het eerste lid, en kunnen andere taken en bevoegdheden dan bedoeld in het eerste lid aan de
      examencommissie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.3
    text: |-
      De examencommissie stelt regels vast over de uitvoering van de taken en bevoegdheden, bedoeld in het eerste lid, en
      de maatregelen die zij in dat verband kan nemen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.4
    text: |-
      Indien een deelnemer bij het examen fraudeert, kan de examencommissie de deelnemer het recht ontnemen één of
      meer door de examencommissie aan te wijzen examens af te leggen, gedurende een door de examencommissie te bepalen
      termijn van ten hoogste een jaar. Bij ernstige fraude kan het bevoegd gezag op voorstel van de examencommissie de
      inschrijving voor de opleiding van de betrokkene definitief beëindigen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.5
    text: |-
      Indien een deelnemer bij de examencommissie een verzoek of een klacht indient waarbij een lid van de
      examencommissie is betrokken, neemt het betrokken lid geen deel aan de behandeling van het verzoek of de klacht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
  - number: 7.4.5a.6
    text: |-
      De examencommissie stelt jaarlijks een verslag op over de examenkwaliteit per opleiding, aan de hand van de
      standaarden, bedoeld in [artikel 7.4.4][ref1], en haar werkzaamheden en verstrekt dit verslag aan het bevoegd gezag
      van de instelling of de exameninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.6.1
    text: Ten bewijze dat een opleiding met goed gevolg is afgesloten, reikt de examencommissie een diploma uit.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.6
  - number: 7.4.6.2
    text: |-
      De opleiding is eerst dan met goed gevolg afgesloten wanneer met goed gevolg examen is afgelegd in de kwalificatie,
      examen is afgelegd in het keuzedeel of de keuzedelen en de beroepspraktijkvorming voor zover betrekking hebbend op
      de kwalificatie met een positieve beoordeling is voltooid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.6
  - number: 7.4.6.3
    text: |-
      Bij ministeriële regeling worden modellen en technische veiligheidseisen voor het diploma en de resultatenlijst van
      een beroepsopleiding vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.6
  - number: 7.4.6a
    text: |-
      Een deelnemer die één of meer onderdelen van de opleiding met goed gevolg heeft afgesloten waarvoor geen diploma
      als bedoeld in [artikel 7.4.6, eerste lid][ref1], of certificaat als bedoeld in [artikel 7.2.3, eerste lid][ref2],
      kan worden uitgereikt, ontvangt desgevraagd een door de desbetreffende examencommissie af te geven
      instellingsverklaring. Daarin zijn in elk geval opgenomen de onderdelen die op de datum van beëindiging van de
      opleiding met goed gevolg door de deelnemer zijn afgesloten en een lijst met examenresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.6a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.1
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het desgevraagd, aan belanghebbenden of aan de
      op grond van de [Algemene wet erkenning EU-beroepskwalificaties][ref1] bevoegde autoriteiten, verstrekken van op
      vergelijking van opleidingen berustende waarderingen of vergelijkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: 7.4.7.1.a
    text: van buitenlandse diploma’s of certificaten als bedoeld in die wet alsmede van andere buitenlandse diploma's, met
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.1.b
    text: de getuigschriften van overeenkomstige Nederlandse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.2
    text: |-
      Bij de vergelijkingen en waarderingen wordt zo mogelijk aangegeven tot welke soort in
      [artikel 7.2.2, eerste lid][ref1], bedoelde beroepsopleiding de desbetreffende opleiding kan worden gerekend
      en met welke in het Centraal register vermelde beroepsopleiding die opleiding vergelijkbaar is of kan worden
      gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.3
    text: 'De vergelijking of waardering wordt slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.3.a
    text: |-
      op verzoek van de op grond van de in het eerste lid genoemde [wet][ref1] bevoegde autoriteiten, ten behoeve van
      aanvragen tot het verlenen van erkenning van beroepskwalificaties als bedoeld in [artikel 5 van die wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0023066
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0023066
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 7.4.7.3.b
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan een
      Nederlandse beroepsopleiding, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.3.c
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan de
      Nederlandse arbeidsmarkt op een niveau dat overeenkomt met een in [artikel 7.2.2][ref1] bedoeld niveau van
      beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.4
    text: |-
      Onze minister kan beleidsregels stellen met het oog op een doelmatige vervulling van de in het eerste lid genoemde
      taken door de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.5
    text: |-
      De rechtspersoon verstrekt desgevraagd aan Onze Minister alle voor de uitoefening van diens taak redelijkerwijs
      benodigde inlichtingen. Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.6
    text: |-
      Indien naar het oordeel van Onze Minister de rechtspersoon zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen. De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder
      getroffen dan nadat de rechtspersoon in de gelegenheid is gesteld om binnen een door Onze Minister te stellen
      termijn alsnog zijn taak naar behoren uit te voeren. Onze Minister stelt de beide kamers der Staten-Generaal
      onverwijld in kennis van door hem getroffen voorzieningen als bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.7.7
    text: |-
      Onze minister verstrekt, onder door hem op te leggen verplichtingen, aan de rechtspersoon jaarlijks uit 's Rijks
      kas middelen ten behoeve van de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.7
  - number: 7.4.8.1
    text: Het bevoegd gezag zorgt voor een goede organisatie en kwaliteit van het onderwijsprogramma en de examinering.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
  - number: 7.4.8.2
    text: |-
      Het bevoegd gezag legt de beschrijving van het onderwijsprogramma, met vermelding van het aantal begeleide
      onderwijsuren als bedoeld in [artikel 7.2.7][ref1] per programmaonderdeel per studiejaar en het aantal klokuren
      beroepspraktijkvorming per studiejaar, en de regels met betrekking tot het examen tijdig voor aanvang van de
      opleiding vast in de onderwijs- en examenregeling van de instelling en zorgt ervoor dat deelnemers volledig en
      tijdig worden geïnformeerd over het onderwijsprogramma, examens en het ondersteuningsaanbod voor gehandicapte
      deelnemers die extra ondersteuning behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.3
    text: |-
      Het bevoegd gezag zorgt ervoor dat beroepsopleidingen aantoonbaar voldoen aan de eisen van
      [artikel 7.2.7, derde, vierde, zesde, zevende, achtste en negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.4
    text: |-
      Het bevoegd gezag zorgt ervoor dat de instelling beschikt over een deelnemersstatuut waarin de rechten en
      plichten van de deelnemers zijn opgenomen. In het deelnemersstatuut zijn in elk geval de nadere regels, bedoeld in
      [artikel 8.1.7a, vierde lid][ref1], opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.4.8.5
    text: |-
      De examencommissie stelt regels vast met betrekking tot de goede gang van zaken tijdens het afnemen van de toetsen,
      het examen of de examenonderdelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
  - number: 7.4.8.6
    text: |-
      Indien ten aanzien van een beroepsopleiding toepassing is gegeven aan [artikel 7.4.4a][ref1], dan treedt de
      examenregeling van de instelling of exameninstelling die de examinering verzorgt in de plaats van de examenregeling
      van de instelling die het onderwijs verzorgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.8a.1
    text: |-
      Het bevoegd gezag draagt zorg voor een behoorlijke behandeling van klachten van deelnemers, aspirant-
      deelnemers, voormalige deelnemers en examendeelnemers, personeel en overige betrokkenen bij het onderwijs of de
      praktijkbegeleiding van de instelling over gedragingen van het bevoegd gezag of ten behoeve van de instelling met
      taken belaste personen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8a
  - number: 7.4.8a.2
    text: |-
      Het bevoegd gezag voorziet in de klachtbehandeling met overeenkomstige
      toepassing van in elk geval de [artikelen 9:3 tot en met 9:7, eerste lid][ref1],
      [9:8, eerste lid, aanhef en onderdelen a tot en met e, en derde lid, eerste volzin][ref2], [9:9][ref3],
      [9:10, eerste lid, tweede lid, onderdelen b en c, en derde lid][ref4], [9:11][ref5], [9:12, eerste lid][ref6],
      [9:12a][ref7], [9:15][ref8] en [9:16 van de Algemene wet bestuursrecht][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 7.4.8a.3
    text: |-
      Het bevoegd gezag voorziet in een klachtencommissie die is belast met de behandeling van en advisering over
      klachten en die bestaat uit ten minste drie leden die geen deel uitmaken van een bevoegd gezag als bedoeld in
      [artikel 1.1.1, onder w][ref1], waaronder een voorzitter die niet werkzaam is voor of bij het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.4.8a.4
    text: |-
      Op een ieder die is betrokken bij de uitvoering van dit artikel is
      [artikel 2:5, eerste lid, van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 7.4.8a.5
    text: |-
      Het bevoegd gezag stelt voor de instelling een regeling vast waarin de klachtbehandeling met inachtneming van de
      voorgaande leden nader is uitgewerkt en maakt deze openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.8a
  - number: 7.4.9.1
    text: Het bevoegd gezag van een exameninstelling zorgt voor een goede organisatie en kwaliteit van de examinering.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.9
  - number: 7.4.9.2
    text: |-
      Het bevoegd gezag van een exameninstelling zorgt ervoor dat de deelnemers die in dat jaar examen willen afleggen
      volledig en tijdig geïnformeerd worden over de inhoud en inrichting van de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.9
  - number: 7.4.10
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.10
  - number: 7.4.11.1
    text: Aan de deelnemers wordt gelegenheid gegeven een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
  - number: 7.4.11.2
    text: |-
      [Artikel 7.4.5, eerste tot en met vijfde en negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de
      examens van de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als tweede taal
      I en II, bedoeld in [artikel 7.3.1, eerste lid, onder a en c][ref1]. Bij deze algemene maatregel
      van bestuur kunnen tevens voorschriften worden gegeven omtrent de examenprogramma’s en de verdeling
      daarvan in onderdelen. De examens van de opleidingen voortgezet algemeen volwassenenonderwijs omvatten
      een rekentoets. Bij de vaststelling van de opgaven van de rekentoets worden de referentieniveaus
      rekenen in acht genomen die voor de desbetreffende schoolsoorten zijn vastgesteld op grond van
      [artikel 2, tweede lid, aanhef en onderdeel c, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2]. Bij
      of krachtens algemene maatregel van bestuur worden nadere voorschriften omtrent deze toets vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0027679
        artikel: '2'
  - number: 7.4.11.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
  - number: 7.4.11.5
    text: |-
      [Artikel 7.4.6, eerste en derde lid][ref1], is van toepassing, met dien verstande dat degene die een onderdeel van
      een examen van de opleiding voortgezet algemeen volwassenenonderwijs of Nederlands als tweede taal I of II met goed
      gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene maatregel van bestuur wordt bepaald onder
      welke voorwaarden het bezit van certificaten aanspraak geeft op een diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.6
    text: |-
      De [artikelen 7.4.8, eerste, tweede, vierde en vijfde lid][ref1], en [7.4.8a][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.5.1.1
    text: |-
      Het bevoegd gezag van een instelling of exameninstelling stelt al dan niet in samenwerking met een of meer bevoegde
      gezagsorganen van andere instellingen of exameninstellingen een commissie van beroep voor de examens in, dan wel
      sluit zich bij een dergelijke commissie aan. Beslissingen van de examencommissie of van de examinatoren kunnen
      worden onderworpen aan het oordeel van een commissie van beroep voor de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.1
  - number: 7.5.1.2
    text: |-
      De commissie van beroep voor de examens bestaat uit een even aantal gewone leden en evenveel plaatsvervangende
      leden, een voorzitter, tevens lid, en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.1
  - number: 7.5.1.3
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden worden door
      het bevoegd gezag benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw
      benoembaar. De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag, van de inspectie
      of van een in [artikel 7.4.5][ref1] bedoelde examencommissie of examinator tegen de beslissing waarvan
      onderscheidenlijk van wie beroep kan worden ingesteld bij de commissie van beroep, noch zijn zij belast met de in
      [artikel 7.2.8, tweede lid, onder c][ref2], bedoelde beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.5.1.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van
      de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun
      functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn
      veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene
      van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.1
  - number: 7.5.2.1
    text: De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
  - number: 7.5.2.2
    text: |-
      De termijn voor het indienen van het beroepschrift bedraagt, wat de openbare instellingen betreft in afwijking van
      [artikel 6:7 van de Algemene wet bestuursrecht][ref1], twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.5.2.3
    text: |-
      De commissie beslist binnen vier weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het beroepschrift is verstreken, wat de openbare instellingen betreft in afwijking van
      [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1], tenzij de commissie deze termijn heeft
      verlengd met ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.2.4
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
  - number: 7.5.2.5
    text: |-
      De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
  - number: 7.5.2.6
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. De commissie
      is niet bevoegd in de plaats van de geheel of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen,
      wat de openbare instellingen betreft in afwijking van [artikel 7:25 van de Algemene wet bestuursrecht][ref1].
      Zij kan bepalen dat opnieuw of, indien de beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat
      het examen of enig onderdeel daarvan opnieuw wordt afgenomen onder door de commissie te stellen voorwaarden. De
      examencommissie of de examinator van wie de beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak
      met inachtneming van de uitspraak van de commissie van beroep voor de examens. De commissie kan daarvoor in haar
      uitspraak een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.3.1
    text: |-
      In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek
      na de desbetreffende examencommissie dan wel de desbetreffende examinator te hebben gehoord, althans te hebben
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.3
  - number: 7.5.3.2
    text: |-
      Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.3
  - number: 7.5.4
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.5.4
  - number: 7.7.1.1
    text: |-
      Het bevoegd gezag van een instelling is verplicht, studenten die zijn ingeschreven voor een opleiding voor
      het beroep van leraar waarop de Wet op het hoger onderwijs en wetenschappelijk onderzoek betrekking heeft, of
      die anderszins studeren voor een bewijs van voldoende pedagogische bekwaamheid, en die in opleiding zijn voor
      een functie in het onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de
      instelling te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 7.7.1.2
    text: |-
      De in het eerste lid bedoelde verplichting omvat 5% van het in het desbetreffende studiejaar door de instelling in
      totaal te verzorgen beroepsonderwijs en educatie. Het bevoegd gezag kan een hoger percentage vaststellen mits dat
      in overeenstemming is met de goede gang van zaken binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 7.7.1.3
    text: |-
      Het bevoegd gezag kan een student de verdere toegang tot de instelling ontzeggen, indien deze in de instelling in
      strijd handelt met de grondslag en doelstellingen van de instelling. Van een besluit tot ontzegging van de toegang
      tot de instelling wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag
      van de betrokken opleidingsinstelling dan wel aan de betrokken staatsexamencommissie, en aan de inspectie. Indien
      het bevoegd gezag van een bijzondere school een student de toegang weigert, maakt het dit besluit, schriftelijk en
      met redenen omkleed, bekend door toezending of uitreiking aan de student, onverminderd het bepaalde in de vorige
      volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 7.7.1.4
    text: |-
      Het bevoegd gezag van de instelling regelt de werkzaamheden in verband met de begeleiding door de leraren van
      de studenten in de instelling in overeenstemming met de leraren, alsmede in overeenstemming met de betrokken
      opleidingsinstellingen, dan wel, indien het betreft studenten die zich voorbereiden op het afleggen van een
      staatsexamen ter verkrijging van een bewijs van bekwaamheid of een bewijs van voldoende pedagogische en didactische
      voorbereiding, in overeenstemming met de betrokken staatsexamencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 7.7.1.5
    text: |-
      Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de in het eerste lid bedoelde verplichting verlenen. De ontheffing geldt voor een studiejaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 7.7.1.6
    text: |-
      De instellingen waarbij studenten als bedoeld in het eerste lid zijn toegelaten, zijn toegankelijk voor de
      inspectie, belast met het toezicht op de opleidingsinstellingen, voor de directieleden en de door deze aan te
      wijzen docenten van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies,
      een en ander voor zover dat voor de uitoefening van het toezicht op de praktische vorming onderscheidenlijk de
      begeleiding van de praktische vorming van de in de instelling aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel7.7.1
  - number: 8.0.1.1
    text: |-
      Uiterlijk op 1 april voorafgaand aan een studiejaar meldt degene die zich als deelnemer wenst te laten inschrijven
      voor een beroepsopleiding die start bij de aanvang van dat studiejaar, zich aan bij de desbetreffende instelling.
      Na de aanmelding kan de betrokkene zijn aanmelding nog wijzigen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.1
  - number: 8.0.1.2
    text: |-
      Bij ministeriële regeling kan een maximum aantal beroepsopleidingen worden vastgesteld waarvoor de betrokkene zich
      kan aanmelden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.1
  - number: 8.0.1.3
    text: 'Dit artikel is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.1
  - number: 8.0.1.3.a
    text: |-
      een deelnemer die zich aanmeldt bij een andere beroepsopleiding dan die waar hij oorspronkelijk was ingeschreven
      maar kan aantonen dat de aanmelding het gevolg is van een beëindiging van de inschrijving op grond van
      [artikel 8.1.7a][ref1], op een zodanig tijdstip dat hij zich niet kon aanmelden uiterlijk 1 april voorafgaand aan
      het studiejaar waarvoor hij zich wenst in te schrijven; en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.0.1.3.b
    text: |-
      deelnemers aan een experiment doorlopende leerlijnen vmbo-mbo als bedoeld in het
      [Besluit experimenten doorlopende leerlijnen vmbo-mbo 2014–2022][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033984
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.1
    references:
      - id: ref1
        bwb_id: BWBR0033984
  - number: 8.0.2.2
    text: |-
      Bij ministeriële regeling worden ter uitvoering van het eerste lid regels vastgesteld. Deze betreffen in ieder
      geval een specificatie van de bij de opgave te leveren gegevens, het tijdstip en de wijze waarop deze gegevens
      worden geleverd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.2
  - number: 8.0.3.1
    text: |-
      Bij de aanmelding, bedoeld in [artikel 8.0.1][ref1], legt de betrokkene of, als deze minderjarig is, diens ouders,
      voogden of verzorgers, zijn persoonsgebonden nummer over onder vermelding van, indien van toepassing, de school
      als bedoeld in de [Wet op het voorgezet onderwijs][ref2], de school of instelling als bedoeld in de Wet op de
      expertisecentra of de instelling als bedoeld in deze wet waar hij op het moment van aanmelding staat ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.0.3.2
    text: |-
      Het persoonsgebonden nummer wordt overgelegd door middel van een van overheidswege verstrekt document, waarop
      tevens de gegevens over de geslachtsnaam, de voorletters, de geboortedatum en het geslacht van betrokkene zijn
      vermeld. Indien geen persoonsgebonden nummer kan worden overgelegd, worden in plaats daarvan de geslachtsnaam, de
      voorletters, de geboortedatum en het geslacht van betrokkene vermeld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.3
  - number: 8.0.3.5
    text: |-
      Bij ministeriële regeling worden regels vastgesteld ter uitvoering van het derde en vierde lid. Deze betreffen in
      ieder geval een specificatie van de gegevens en het tijdstip en de wijze waarop deze gegevens worden geleverd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.3
  - number: 8.0.4.1
    text: |-
      Een betrokkene die uiterlijk 1 april is aangemeld in overeenstemming met [artikel 8.0.1, eerste lid][ref1],
      heeft desgevraagd recht op een studiekeuzeadvies. Dit recht geldt alleen als betrokkene deelneemt aan de
      intakeactiviteiten die het bevoegd gezag met het oog op dit studiekeuzeadvies organiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.0.4.2
    text: |-
      Bij ministeriële regeling kan een maximum aantal studiekeuzeadviezen worden vastgesteld waarop de betrokkene recht
      heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.0.4.3
    text: |-
      Het bevoegd gezag kan intakeactiviteiten organiseren en aan de hand daarvan een studiekeuzeadvies uitbrengen ten
      behoeve van andere dan de in het eerste lid bedoelde betrokkenen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.0.4.4
    text: De studiekeuzeadviezen zijn niet bindend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.0.4.5
    text: |-
      Het bevoegd gezag stelt ter uitvoering van dit artikel nadere regels vast die in elk geval betrekking hebben op de
      intakeactiviteiten die door de instelling, al dan niet per opleiding, worden georganiseerd, de aard en inhoud van
      de intakeactiviteiten, de termijn waarbinnen de intakeactiviteiten plaatsvinden en de gevallen waarin, de termijn
      waarbinnen en de wijze waarop studiekeuzeadviezen wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.0.4.6
    text: |-
      Bij het vaststellen van de nadere regels treft het bevoegd gezag voor betrokkenen afkomstig uit de openbare
      lichamen Bonaire, Sint Eustatius en Saba respectievelijk Aruba, Curaçao en Sint Maarten zodanige voorzieningen dat
      zij kunnen deelnemen aan de intakeactiviteiten zonder dat hun fysieke aanwezigheid op de instelling vereist is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.0.4.7
    text: |-
      Het bevoegd gezag stelt de in het vijfde lid bedoelde informatie voor een ieder beschikbaar uiterlijk 1 februari
      voorafgaand aan het studiejaar waarvoor deze geldt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.0.4
  - number: 8.1.1.1
    text: |-
      Een ieder die gebruik wenst te kunnen maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als deelnemer te laten inschrijven. Een ieder die uitsluitend wenst te worden toegelaten
      tot examenvoorzieningen, dient zich door het bevoegd gezag als examendeelnemer te laten inschrijven. Voor de
      inschrijving als examendeelnemer is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      Indien het een meerderjarige examendeelnemer betreft die het examengeld niet zelf voldoet, wordt niet overgegaan
      tot inschrijving dan nadat de deelnemer schriftelijk heeft verklaard dat hij ermee instemt dat een in die
      verklaring vermelde derde namens hem het examengeld voldoet. De inschrijving voor een opleiding of een onderdeel
      van een opleiding staat uitsluitend open voor degene waarvan de ouders, voogden of verzorgers aantonen, dan wel,
      indien hij meerderjarig en handelingsbekwaam is, degene die aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1.1.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1.1.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1.1.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding begint
      waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.1.1.1.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1.1a
    text: |-
      Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke
      grond dan ook niet in overeenstemming met de vijfde volzin van het eerste lid heeft plaatsgevonden, wordt de
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3][ref1], met onmiddellijke ingang ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.1b
    text: |-
      Voor de student die zich heeft ingeschreven voor een associate degree-opleiding als bedoeld in
      [artikel 1.1, onderdeel m, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] geldt
      niet de verplichting, bedoeld in de eerste volzin van het eerste lid, om gebruik te kunnen maken van de
      onderwijsvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 8.1.1.2
    text: |-
      De inschrijving geschiedt voor een opleiding educatie of een onderdeel daarvan of voor een beroepsopleiding. In
      geval van een beroepsopleiding geschiedt de inschrijving voor een opleidingsdomein, een kwalificatiedossier of
      een kwalificatie. Bij de inschrijving worden alle gegevens vermeld die het bevoegd gezag nodig heeft om te kunnen
      voldoen aan de verplichting, bedoeld in [artikel 2.3.6a, tweede lid][ref1], of ingeval van een beroepsopleiding,
      [artikel 2.5.5a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.1.1.3
    text: |-
      De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend
      open voor degenen voor wie de volledige leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref1], is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 8.1.1.4
    text: |-
      Het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden ingeschreven voor
      een entreeopleiding of een basisberoepsopleiding, geacht worden de grondslag en de doelstellingen van de instelling
      te respecteren. De inschrijving kan worden geweigerd dan wel beëindigd indien de betrokkene de grondslag en de
      doelstellingen van de instelling niet respecteert. Ten aanzien van degenen die wensen te worden ingeschreven voor
      een vakopleiding, middenkaderopleiding of een specialistenopleiding, kan het bevoegd gezag ook aangeven dat zij
      geacht worden de grondslag en de doelstellingen van de instelling te onderschrijven en kan de inschrijving van een
      betrokkene ook worden geweigerd dan wel beëindigd, indien deze de grondslag en de doelstellingen van de instelling
      niet onderschrijft. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel beëindigd
      indien gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal
      maken door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel beëindiging van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan
      niet worden beëindigd op grond van de tweede of derde volzin indien voor betrokkene geen gelegenheid bestaat de
      opleiding aan een andere instelling te volgen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1.5
    text: |-
      De inschrijving voor een opleidingsdomein kan uitsluitend geschieden voor een beroepsopleiding in de
      beroepsopleidende leerweg op het tweede, derde of vierde niveau, bedoeld in [artikel 7.2.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.1.6
    text: |-
      Bij ministeriële regeling kan een maximum worden vastgesteld voor het percentage van de deelnemers in het
      beroepsonderwijs dat in een jaar kan worden ingeschreven voor een opleidingsdomein.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1
  - number: 8.1.1a.1
    text: |-
      De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de deelnemer
      of, indien deze minderjarig is, door de ouders, voogden of verzorgers de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de deelnemer zijn overgelegd.
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de deelnemer kan worden overgelegd, vindt de inschrijving plaats met
      inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
  - number: 8.1.1a.3
    text: |-
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag binnen twee
      weken na de beslissing tot inschrijving aan Onze Minister de beschikbare gegevens van de deelnemer, bedoeld in het
      eerste lid, alsmede zijn adres en woonplaats en, indien aanwezig, het leerlingadministratienummer.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
  - number: 8.1.1a.4
    text: |-
      Onze Minister verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid, aan het bevoegd
      gezag het burgerservicenummer van de deelnemer, dan wel, indien is gebleken dat hem niet van overheidswege een
      burgerservicenummer is verstrekt, het onderwijsnummer van de deelnemer. Het onderwijsnummer is een door Onze
      Minister uitgegeven en aan de deelnemer toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
  - number: 8.1.1a.5
    text: Het bevoegd gezag neemt de in het eerste en vierde lid bedoelde gegevens op in de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
  - number: 8.1.1a.6
    text: |-
      Indien aan een deelnemer een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt over
      zijn burgerservicenummer, neemt het bevoegd gezag dit burgerservicenummer terstond als persoonsgebonden nummer
      op in de administratie van de instelling in de plaats van het onderwijsnummer. Het bevoegd gezag meldt deze
      wijziging binnen twee weken aan Onze Minister onder opgave van het burgerservicenummer en het onderwijsnummer van
      de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1a
  - number: 8.1.1b.1
    text: |-
      Onverminderd de [artikelen 8.1.1][ref1], [8.1.2][ref2] en [8.1.7b][ref3], staat de toelating tot de
      entreeopleiding uitsluitend open voor degenen die niet ten minste voldoen aan de vooropleidingseisen
      van de basisberoepsopleiding, bedoeld in [artikel 8.2.1, vierde lid][ref4], en op wie
      [paragraaf 2 van de Leerplichtwet 1969][ref5] niet meer van toepassing is, met uitzondering van degenen ten aanzien
      van wie toepassing is gegeven aan [artikel 3b van de Leerplichtwet 1969][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
      [ref6]: https://wetten.overheid.nl/BWBR0002628#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0002628
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0002628
        artikel: 3b
  - number: 8.1.1b.2
    text: |-
      Het bevoegd gezag kan de toelating tot de entreeopleiding slechts weigeren indien diegene die om toelating verzoekt
      in de afgelopen twee studiejaren bij een instelling was ingeschreven voor een entreeopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1b
  - number: 8.1.1c.1
    text: |-
      Onverminderd de [artikelen 8.1.1][ref1], [8.1.2][ref2] en [8.1.7b][ref3], staat de toelating tot een
      basisberoepsopleiding, een vakopleiding, een middenkaderopleiding en een specialistenopleiding open voor degene die
      voldoet aan de in de bij of krachtens de [artikelen 8.2.1][ref4], [8.2.2][ref5] en [8.2.2a][ref6] ten aanzien van
      die opleidingen gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1c.2
    text: |-
      Het bevoegd gezag kan het aantal deelnemers voor een opleiding beperken wegens de opleidingscapaciteit of uit
      oogpunt van arbeidsmarktperspectief.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
  - number: 8.1.1c.3
    text: 'Het bevoegd gezag kan de toelating van degene die om toelating verzoekt weigeren indien:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
  - number: 8.1.1c.3.a
    text: |-
      [paragraaf 2a van de Leerplichtwet 1969][ref1] niet meer van toepassing is op hem, zijn inschrijving reeds driemaal
      is beëindigd op grond van [artikel 8.1.7a, tweede lid][ref2] en sinds de laatste dag van inschrijving minder dan
      drie studiejaren zijn verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1c.3.b
    text: |-
      hij reeds zes jaar of langer in een beroepsopleiding ingeschreven is geweest zonder een diploma te hebben behaald
      en sinds de laatste dag van inschrijving minder dan drie studiejaren zijn verstreken; of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
  - number: 8.1.1c.3.c
    text: |-
      [paragraaf 2a van de Leerplichtwet 1969][ref1] niet meer op hem van toepassing is, en:


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
  - number: 8.1.1c.3.c.1°
    text: |-
      hij zich niet uiterlijk op de datum, genoemd in [artikel 8.0.1, eerste lid][ref1], heeft aangemeld, voor zover het
      een opleiding betreft die start bij de aanvang van het op die datum volgende studiejaar, en voor zover het derde
      lid van dat artikel niet van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1c.3.c.2°
    text: |-
      ten behoeve van hem geen studiekeuzeadvies is uitgebracht als bedoeld in [artikel 8.0.4][ref1], voor zover het
      bevoegd gezag daartoe voor diegene verplichte intakeactiviteiten organiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1c.4
    text: |-
      Indien een betrokkene niet kan worden ingeschreven op grond van het tweede lid, of omdat hij niet
      voldoet aan de voor die opleiding krachtens [artikel 8.2.2a][ref1] gestelde eisen, of, indien
      [paragraaf 2a van de Leerplichtwet 1969][ref2] op hem van toepassing is, omdat hij niet voldoet aan de in het
      derde lid, onderdeel c, onder 1° of 2° genoemde voorwaarden, biedt het bevoegd gezag deze de mogelijkheid zich te
      laten inschrijven aan een opleiding aan de instelling waarvoor de inschrijving wel mogelijk is, rekening houdend
      met diens voorkeuren. Dit geldt niet voor vakinstellingen als bedoeld in [artikel 1.3.2a][ref3] en agrarische
      opleidingscentra als bedoeld in [artikel 1.3.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002628
        paragraaf: 2a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 8.1.1c.5
    text: |-
      Bij een inschrijvingsbeperking als bedoeld in het tweede lid hanteert het bevoegd gezag geen toelatingscriteria
      waarbij aan betrokkenen die aan de vooropleidingseisen voor de desbetreffende opleiding voldoen, extra eisen
      worden gesteld aan hun geschiktheid. Onverminderd de vorige volzin, verleent het bevoegd gezag aan de inschrijving
      van betrokkenen die in overeenstemming met [artikel 8.0.1, eerste lid][ref1], uiterlijk op 1 april voor de
      desbetreffende opleiding zijn aangemeld, voorrang.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1c.6
    text: |-
      Het bevoegd gezag stelt met in achtneming van de voorgaande leden de toelatingsprocedure vast en stelt deze
      informatie voor een ieder beschikbaar uiterlijk 1 februari voorafgaand aan het studiejaar waarvoor deze geldt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1c
  - number: 8.1.1d.1
    text: De toelating tot opleidingen voortgezet algemeen volwassenenonderwijs staat uitsluitend open voor volwassenen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1d
  - number: 8.1.1d.2
    text: |-
      In afwijking van het eerste lid staat de toelating tot opleidingen voortgezet algemeen volwassenenonderwijs tevens
      open voor degenen die niet meer zijn ingeschreven bij een school voor voortgezet onderwijs, in de loop van het
      studiejaar de leeftijd van 18 jaren bereiken en op grond van [artikel 8.3.2][ref1] naar de desbetreffende opleiding
      zijn doorverwezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.1d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.2.1
    text: |-
      Indien binnen redelijke afstand van de woning van de deelnemer niet de gelegenheid bestaat tot het volgen van
      het onderwijs aan een openbare instelling, mag aan deze deelnemer de toelating tot een bijzondere instelling niet
      worden geweigerd op grond van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.2
  - number: 8.1.2.2
    text: Openbare instellingen zijn toegankelijk voor deelnemers zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.2
  - number: 8.1.3.1
    text: Aan de inschrijving ligt een overeenkomst tussen het bevoegd gezag en de deelnemer ten grondslag.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.2
    text: |-
      De overeenkomst wordt, overeenkomstig een door het bevoegd gezag vastgesteld model, schriftelijk aangegaan.
      De overeenkomst wordt gesloten voor de duur van de beroepsopleiding of een deel daarvan, dan wel de opleiding
      voortgezet algemeen volwassenenonderwijs of een deel daarvan waarop de inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3
    text: |-
      De overeenkomst regelt de rechten en verplichtingen van partijen, daaronder begrepen die, welke voortvloeien uit de
      wet, en omvat ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3.a
    text: |-
      de inhoud en inrichting van een opleiding, waaronder voor een beroepsopleiding begrepen de leerweg, de
      examenvoorzieningen en de kwalificatie, of, bij inschrijving voor een opleidingsdomein of een kwalificatiedossier,
      dat opleidingsdomein of dat kwalificatiedossier, het beoogde niveau van de te behalen kwalificatie en het
      keuzedeel, de keuzedelen en het onderdeel of de onderdelen, bedoeld in [artikel 6.1.2a, tweede lid][ref1], die deel
      uitmaken van de beroepsopleiding,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.1.3.3.b
    text: |-
      de tijdvakken waarbinnen en, de locatie, alsmede in voorkomend geval het samenwerkingscollege, waar de opleiding
      wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3.c
    text: de wijze waarop partijen uit de overeenkomst voortkomende prestaties gestalte zullen geven,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3.d
    text: |-
      in voorkomend geval, terugbetaling van voorschotten, verstrekt door het bevoegd gezag, ter voldoening van een bij
      of krachtens de wet geregelde geldelijke bijdrage als bedoeld in [artikel 8.1.4][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.3.3.e
    text: |-
      de terugbetaling van cursusgeld in andere gevallen dan bedoeld in
      [artikel 14, tweede lid onder a tot en met d, van het Uitvoeringsbesluit Les- en cursusgeldwet 2000][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel14
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '14'
  - number: 8.1.3.3.f
    text: het verzuimbeleid van het bevoegd gezag,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3.g
    text: indien sprake is van een gehandicapte deelnemer, de extra ondersteuning die voortvloeit uit zijn handicap, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.3.h
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.4
    text: |-
      Indien tot een bijzondere instelling andere deelnemers worden toegelaten dan voor wie de instelling in verband
      met de godsdienstige of levensbeschouwelijke richting wordt in stand gehouden, kunnen deze deelnemers niet worden
      verplicht tot het volgen van onderwijs dat in verband met die richting door de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
  - number: 8.1.3.5
    text: |-
      Definitieve verwijdering van een deelnemer waarop de [Leerplichtwet 1969][ref1] van toepassing is, vindt niet
      plaats dan nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere instelling, een school voor speciaal
      onderwijs of een school voor speciaal en voortgezet speciaal onderwijs, dan wel een instelling als bedoeld in
      [artikel 1, onder c, van de Leerplichtwet 1969][ref2] bereid is de deelnemer toe te laten. Indien aantoonbaar
      gedurende 8 weken zonder succes is gezocht naar een zodanige instelling of school waarnaar kan worden verwezen, kan
      in afwijking van de eerste volzin tot definitieve verwijdering worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0002628
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 8.1.3.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.4
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde geldelijke
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.4
  - number: 8.1.7.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de instelling ingeschreven deelnemer die valt onder de werking van de
      [Wet studiefinanciering 2000][ref1] of van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], vast,
      of deze deelnemer gedurende een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het
      onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van
      onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling wordt gedaan indien een ingeschreven
      deelnemer in een of meer vakken niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt
      verstaan afwezigheid wegens ziekte van de deelnemer, welke ziekte uitsluitend kan worden aangetoond door middel van
      een gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van vier weken aan
      de deelnemer dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de deelnemer om
      opgaaf van de reden van de afwezigheid. Het bevoegd gezag doet daarbij mededeling van de opgave van de gegevens van
      de deelnemer, bedoeld in [artikel 8.1.8a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.7.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.3.a
    text: |-
      of de reden die de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.3.b
    text: |-
      dat de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      deelnemer voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan Onze Minister de
      deelnemer die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden niet aan
      het onderwijs heeft deelgenomen. Tevens meldt het indien die deelnemer voor het einde van de periode van 8 weken
      weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift van de gegevens
      die over de betrokken deelnemer aan Onze Minister zijn verstrekt aan deze betrokkene. Het bevoegd gezag geeft
      daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid, gevolgen heeft voor de studiefinanciering van
      betrokkene op grond van de [Wet studiefinanciering 2000][ref1] of voor de tegemoetkoming onderwijsbijdrage en
      schoolkosten van betrokkene op grond van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], alsmede
      welke beroepsgang voor betrokkene tegen de mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.8
    text: |-
      Indien het bevoegd gezag aan Onze Minister de in het vijfde lid bedoelde mededeling heeft gedaan, kan de deelnemer
      binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid, bij het bevoegd gezag schriftelijk
      bedenkingen uiten tegen die mededeling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.9
    text: Onder «deelnemer» als bedoeld in het vijfde en zevende lid wordt verstaan de deelnemer die
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
  - number: 8.1.7.9.a
    text: |-
      een entreeopleiding of een basisberoepsopleiding volgt als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen a of b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.9.b
    text: |-
      voor 1 augustus 2005 studiefinanciering in de zin van de [Wet studiefinanciering 2000][ref1] ontving.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 8.1.7a.1
    text: |-
      Het bevoegd gezag brengt aan iedere deelnemer die zich inschrijft, advies uit over de voortzetting van
      zijn opleiding. Aan degenen die zijn ingeschreven voor een opleiding waarvan studieduur als bedoeld in
      [artikel 7.2.4a, derde lid][ref1], één volledig studiejaar bedraagt wordt dit advies uiterlijk binnen vier
      kalendermaanden na aanvang van de opleiding gegeven, doch niet eerder dan drie maanden na aanvang. Aan degenen die
      zijn ingeschreven voor een opleiding als bedoeld in artikel 7.2.4a, derde lid, die meer dan één volledig studiejaar
      bedraagt wordt dit advies na ten minste negen kalendermaanden en uiterlijk aan het eind van het eerste studiejaar
      van de opleiding gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7a.2
    text: |-
      Aan een advies als bedoeld in het eerste lid kan het bevoegd gezag een besluit tot ontbinding van de
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3][ref1], verbinden. Tot ontbinding wordt slechts overgaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.7a.2.a
    text: |-
      de deelnemer naar het oordeel van het bevoegd gezag, met inachtneming van zijn persoonlijke omstandigheden,
      onvoldoende vordering heeft gemaakt in de opleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
  - number: 8.1.7a.2.b
    text: |-
      het bevoegd gezag heeft gezorgd voor zodanige voorzieningen dat de mogelijkheden voor goede voortgang van de
      opleiding zijn gewaarborgd, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
  - number: 8.1.7a.2.c
    text: |-
      het bevoegd gezag de desbetreffende deelnemer een schriftelijke waarschuwing heeft gegeven onder bepaling van een
      redelijke termijn waarbinnen de studieresultaten ten genoegen van het bevoegd gezag dienen te zijn verbeterd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
  - number: 8.1.7a.3
    text: |-
      Van de deelnemer waarvan de onderwijsovereenkomst op grond van het tweede lid is ontbonden, wordt de inschrijving
      voor de desbetreffende opleiding aan de betrokken instelling beëindigd. De deelnemer kan niet opnieuw aan die
      instelling voor die opleiding worden ingeschreven. Het bevoegd gezag spant zich in de deelnemer te ondersteunen
      en begeleiden naar een andere opleiding al dan niet aan die instelling, rekening houdend met diens voorkeuren.
      [Artikel 8.1.3, vijfde lid][ref1], is daarbij van overeenkomstige toepassing op een deelnemer op wie de
      [Leerplichtwet 1969][ref2] niet meer van toepassing is. Het bevoegd gezag biedt de deelnemer in elk geval de
      mogelijkheid zich te laten inschrijven aan een andere opleiding aan die instelling waarvoor de inschrijving
      wel mogelijk is. De vorige volzin geldt niet voor vakinstellingen als bedoeld in [artikel 1.3.2a][ref3] en
      agrarische opleidingscentra als bedoeld in [artikel 1.3.3][ref4] of als het een deelnemer betreft op wie
      [artikel 8.1.1c, derde lid, onderdeel a of b][ref5], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002628
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002628
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.7a.4
    text: |-
      Het bevoegd gezag stelt ter uitvoering van de voorgaande leden nadere regels vast. Deze regels hebben in elk geval
      betrekking op de te behalen studieresultaten en de voorzieningen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
  - number: 8.1.7a.5
    text: |-
      Tegen het advies, bedoeld in het eerste lid, staat binnen twee weken na het uitbrengen van het
      advies, beroep open bij de Commissie van beroep voor de examens, bedoeld in [artikel 7.5.1][ref1]. De
      [artikelen 7.5.1 tot en met 7.5.4][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.1.7b.1
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen na advies van de examencommissie en na zorgvuldige afweging van
      de betrokken belangen de onderwijsovereenkomst met een deelnemer ontbinden dan wel weigeren, als die deelnemer
      door zijn gedragingen of uitlatingen blijk heeft gegeven van ongeschiktheid voor de uitoefening van een of meer
      beroepen waartoe de door hem gevolgde opleiding hem opleidt, dan wel voor de praktische voorbereiding op de
      beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7b
  - number: 8.1.7b.2
    text: |-
      Het bevoegd gezag dan wel het bevoegd gezag van een andere instelling die een zelfde of verwante opleiding
      verzorgt, kan besluiten de deelnemer niet opnieuw of niet voor die opleiding in te schrijven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.7b
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 8.1.8.1.b
    text: |-
      die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 7][ref2] onderscheidenlijk
      [artikel 8 van de Wet op het voortgezet onderwijs][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
