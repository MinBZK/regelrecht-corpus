    text: |-
      [Artikel 1.3.9][ref1] is van overeenkomstige toepassing op instellingen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4a.1
