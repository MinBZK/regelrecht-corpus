    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een in het tweede lid bedoelde instelling, dat
      aan de met goed gevolg afgelegde examens of onderdelen van examens van een opleiding educatie, verzorgd
      door die instelling, een diploma als bedoeld in [artikel 7.4.6][ref1] of, indien het betreft voortgezet
      algemeen volwassenenonderwijs of Nederlands als tweede taal I en II, een diploma of certificaat als
      bedoeld in [artikel 7.4.11, vijfde lid][ref2], is verbonden, indien die instelling in acht neemt hetgeen
      bij of krachtens deze wet voor die opleiding is bepaald ten aanzien van de kwaliteitszorg, bedoeld in
      [artikel 1.3.6][ref3], en ten aanzien van het onderwijs, bedoeld in [hoofdstuk 7][ref4], met uitzondering van
      [artikel 7.1.1][ref5], [titel 2][ref6] en [titel 4][ref7], voor zover het betreft de [artikelen 7.4.3][ref8],
      [7.4.4][ref9] en [7.4.7][ref10], en eveneens in acht neemt hetgeen is bepaald in [artikel 8.1.1d][ref11], en in
      [artikel 1.4a.2][ref12].


