        artikel: 58a
      - id: ref5
        bwb_id: BWBR0002399
        artikel: '56'
  - number: 1.4a.2.2
    text: |-
      Indien het bevoegd gezag van een ingevolge [artikel 56 van de Wet op het voorgezet onderwijs][ref1] aangewezen
      school ter uitvoering van [artikel 58a, eerste en tweede lid, van de Wet op het voortgezet onderwijs][ref2]
      leerlingen in het kader van het onderwijs waarvoor zij aan die school zijn ingeschreven, onderwijs wil kunnen laten
      volgen dat een instelling als bedoeld in [artikel 1.4a.1, tweede lid][ref3], van datzelfde bevoegd gezag verzorgt,
      regelt het bevoegd gezag op overeenkomstige wijze de onderwerpen, bedoeld in artikel 58a, derde lid, aanhef en
      onder a tot en met d, van de Wet op het voortgezet onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel58a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 58a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 1.5.1.1
    text: 'Bij ministeriële regeling wordt een rechtspersoon aangewezen die is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.a
    text: |-
      het ontwikkelen en onderhouden van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen het
      aanbod van beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de arbeidsmarkt voor
      afgestudeerden, en mede gelet op van belang zijnde ontwikkelingen in internationaal verband, onder meer door het
      doen van voorstellen aan Onze Minister voor de kwalificatiedossiers, bedoeld in [artikel 7.2.4, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 1.5.1.1.b
    text: |-
      het bijdragen aan een doelmatige en doelgerichte inzet van overheidsmiddelen door het ontwikkelen van voorstellen,
      welke beroepsopleidingen voor bekostiging uit ’s Rijks kas in aanmerking komen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.c
    text: het bevorderen van de kwaliteit van de beroepspraktijkvorming,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.d
    text: |-
      het ontwikkelen en vaststellen van kwaliteitscriteria voor beroepspraktijkvormingsplaatsen en het ten minste een
      maal per vier jaar beoordelen van bedrijven en organisaties die de beroepspraktijkvorming verzorgen aan de hand van
      deze criteria en het openbaar maken van een overzicht van bedrijven en organisaties die voldoen aan deze criteria,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.e
    text: |-
      het zoveel mogelijk zorg dragen voor de beschikbaarheid van een toereikend aantal bedrijven en organisaties van
      voldoende kwaliteit die de beroepspraktijkvorming verzorgen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.f
    text: het uitvoeren van onderzoek ter ondersteuning van de taken, genoemd in dit artikel, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.1.g
    text: het uitvoeren van aanvullende activiteiten ter bevordering van de aansluiting onderwijs en arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als
      Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.3
    text: |-
      Onze Minister verstrekt de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven binnen het raam van de door de
      begrotingswetgever beschikbaar gestelde middelen subsidie voor de uitvoering van de taken, bedoeld in het eerste
      lid, onder a tot en met f.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.4
    text: |-
      Onze Minister kan de Samenwerkingsorganisatie beroepsonderwijs op aanvraag subsidie verstrekken voor de uitvoering
      van taken als bedoeld in het eerste lid, onder g.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.5.1.5
    text: |-
      Het is de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven niet toegestaan andere activiteiten uit te voeren
      dan de aan haar door de wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.5.1
  - number: 1.6.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het recht
      heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in acht
      neemt hetgeen bij of krachtens deze wet is bepaald over:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.6.1
  - number: 1.6.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.6][ref1], voorzover het betreft de examinering,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 1.6.1.1.b
    text: de examens, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.6.1
  - number: 1.6.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 1.6.1.2
    text: Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.6.1
  - number: 1.7.1.1
    text: |-
      Aan een instelling kunnen contractactiviteiten worden verricht, bestaande uit werkzaamheden voor eigen rekening ten
      behoeve van derden. Deze activiteiten kunnen worden verricht indien zij verband houden met werkzaamheden waarvoor
      de instelling uit de openbare kas bekostigd wordt en voor zover de uitvoering van die werkzaamheden hierdoor niet
      wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.7.1
  - number: 1.7.1.2
    text: |-
      Het bevoegd gezag van een instelling draagt er zorg voor dat [artikel 2 van de Wet privatisering ABP][ref1] van
      toepassing blijft op het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '2'
  - number: 1.7.1.3
    text: |-
      De vereisten voor benoembaarheid, bedoeld in [artikel 4.2.1, eerste lid][ref1], zijn niet van toepassing op een
      docent voor zover deze is belast met het verrichten van contractactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.7.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 1.7.1.4
    text: |-
      Het bevoegd gezag voorziet in een regeling voor het verrichten van contractactiviteiten door het personeel van de
      instelling met het oog op het voorkomen van vermenging van belangen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.7.1
  - number: 2.1.1
    text: |-
      Onverminderd de [artikelen 1.3.2a][ref1], [1.3.3][ref2] en [6.1.1, tweede lid][ref3] komt een beroepsopleiding
      bij een instelling voor bekostiging in aanmerking indien zij is gericht op een kwalificatie of kwalificaties als
      bedoeld in [artikel 7.2.4, tweede lid, onder b3°][ref4], alsmede op een keuzedeel of keuzedelen en de rechten,
      genoemd in [artikel 1.3.1][ref5], met betrekking tot de desbetreffende beroepsopleiding niet zijn ontnomen op grond
      van [artikel 6.1.4][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 2.1.2.1
    text: |-
      Een opleiding voortgezet algemeen volwassenenonderwijs van een instelling als bedoeld in
      [artikel 1.1.1, onder b1°][ref1], komt voor bekostiging in aanmerking indien


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.1.2.1.a
    text: |-
      de instelling op 1 augustus 2012 een of meer opleidingen voortgezet algemeen volwassenenonderwijs verzorgde op
      grond van een overeenkomst als bedoeld in [artikel 2.3.4][ref1] zoals luidend op die datum, of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.2.1.b
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap op aanvraag van de instelling heeft bepaald dat opleidingen
      voortgezet algemeen volwassenenonderwijs van de instelling voor bekostiging in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Onze Minister beoordeelt de aanvraag, bedoeld in het eerste lid, onderdeel b, aan de hand van de maatschappelijke
      behoefte aan een of meer opleidingen voortgezet algemeen volwassenenonderwijs, in het licht van het onderwijsaanbod
      verzorgd door andere, al dan niet uit ’s Rijks kas bekostigde instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.2
  - number: 2.1.3.1
    text: |-
      Instellingen worden bij wet voor bekostiging in aanmerking gebracht.
      [Artikel 4:32 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de bekostiging van instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.1.3.2
    text: 'Het eerste lid is niet van toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
  - number: 2.1.3.2.a
    text: |-
      instellingen die op grond van [artikel 12.3.1][ref1] zoals dat luidde door de Wet van 11 april 2001, Stb. 207, of
      [artikel 12.3.3][ref2] zoals dat luidde ingevolge de Wet educatie en beroepsonderwijs (Stb. 1995, 501) door Onze
      Minister voor bekostiging in aanmerking zijn gebracht, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 2.1.3.2.b
    text: instellingen die zijn voortgekomen
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
  - number: 2.1.3.2.b.1°
    text: uit een samenvoeging of splitsing van bekostigde instellingen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
  - number: 2.1.3.2.b.2°
    text: |-
      uit een samenvoeging van een agrarisch opleidingscentrum met een school voor voorbereidend beroepsonderwijs waaraan
      het profiel groen, bedoeld in [artikel 10b, derde lid, onderdeel i, van de Wet op het voortgezet onderwijs][ref1],
      wordt verzorgd, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b
  - number: 2.1.3.2.b.3°
    text: uit een omzetting van een bijzondere instelling in een openbare of omgekeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      Indien aan een agrarisch opleidingscentrum gedurende twee achtereenvolgende jaren minder dan 1200 deelnemers zijn
      ingeschreven voor beroepsopleidingen of voor het voorbereidend beroepsonderwijs, bedoeld in [artikel 1.3.3][ref1],
      kan Onze Minister besluiten dat aan die instelling de rechten, genoemd in [artikel 1.3.1][ref2], ontnomen worden,
      onverminderd het overigens met betrekking tot ontneming van rechten in deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.3.4
    text: |-
      Onze Minister besluit binnen 26 weken na ontvangst van een aanvraag op grond van het tweede lid, onder b. Op het
      besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het tweede lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.1.3.5
    text: |-
      Bij een beschikking op grond van het derde lid bepaalt Onze Minister het tijdstip waarop aan die instelling de
      rechten, genoemd in [artikel 1.3.1][ref1], ontnomen worden zodanig dat de ingeschreven deelnemers de opleiding
      waarvoor zij zijn ingeschreven, aan dezelfde instelling of aan een andere instelling binnen een redelijke tijd
      kunnen voltooien.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.1.8
    text: |-
      In deze afdeling wordt verstaan onder: - *fusie:* een bestuurlijke of institutionele fusie,
        - *institutionele fusie:* een fusie waarbij een instelling ontstaat door samenvoeging van twee of meer
      instellingen,
        - *bestuurlijke fusie:* een fusie waarbij een of meer rechtspersonen de instandhouding van een instelling,
      een school als bedoeld in de [Wet op het voortgezet onderwijs][ref1], dan wel een instelling als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] overdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0005682
  - number: 2.1.9
    text: Fusies worden niet tot stand gebracht dan nadat daarvoor goedkeuring is verleend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.9
  - number: 2.1.10.1
    text: |-
      De rechtspersoon dient dan wel de rechtspersonen gezamenlijk dienen een aanvraag in bij Onze Minister voor het
      verkrijgen van de goedkeuring bedoeld in [artikel 2.1.9][ref1]. De aanvraag gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.10.1.a
    text: een door de rechtspersoon dan wel rechtspersonen opgestelde fusie-effectrapportage, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.1.b
    text: |-
      een schriftelijk advies over, of voor zover van toepassing de schriftelijke instemming met de fusie door de
      betrokken medezeggenschapsraden die is voorafgegaan door de kennisname van de fusie-effectrapportage door de
      medezeggenschapsraden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, is eveneens een aanvraag als bedoeld in [artikel 2.1.3, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.10.3
    text: 'De fusie-effectrapportage bevat ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.a
    text: de motieven van de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.b
    text: de alternatieven voor de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.c
    text: het tijdsbestek waarbinnen de fusie zal worden gerealiseerd,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.d
    text: de te bereiken doelen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.e
    text: |-
      de effecten van de fusie op de keuzevrijheid, in het bijzonder de effecten van de fusie op de spreiding en
      omvang van de betrokken rechtspersonen in de regio, de onderwijskundige en bestuurlijke diversiteit van het
      onderwijsaanbod in de regio,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.f
    text: de kosten en baten van de fusie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.g
    text: |-
      de personele en financiële gevolgen van de fusie, waaronder begrepen de gevolgen voor de dienstverlening aan
      deelnemers en de eventuele gevolgen voor andere belanghebbende partijen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.h
    text: de wijze waarop over de fusie wordt gecommuniceerd, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.3.i
    text: de wijze waarop de fusie wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.10.4
    text: Bij ministeriële regeling wordt een modelformulier voor de fusie-effectrapportage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.10
  - number: 2.1.11.1
    text: |-
      Onze Minister kan goedkeuring onthouden indien als gevolg van de fusie de daadwerkelijke variatie van het
      onderwijsaanbod, in het opzicht van de diversiteit van onderwijsaanbieders in het middelbaar beroepsonderwijs,
      gelet op het geheel van de voorzieningen op het gebied van het onderwijs op significante wijze wordt belemmerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.11
  - number: 2.1.11.2
    text: |-
      Onze Minister laat zich ten aanzien van de goedkeuring, bedoeld in het eerste lid, adviseren door een
      onafhankelijke adviescommissie, tenzij de noodzaak daartoe ontbreekt. Bij ministeriële regeling wordt bepaald
      wanneer er geen sprake is van de noodzaak bedoeld in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.11
  - number: 2.1.11.3
    text: Onze Minister stelt beleidsregels vast omtrent de uitoefening van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.11
  - number: 2.1.12.1
    text: |-
      Onze Minister besluit binnen 13 weken op een aanvraag als bedoeld in [artikel 2.1.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.12.2
    text: |-
      De termijn bedoeld in het eerste lid kan ten hoogste met 13 weken worden verlengd. Van deze verlenging wordt,
      binnen de 13 weken bedoeld in het eerste lid, mededeling gedaan aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.12
  - number: 2.1.12.3
    text: |-
      Op het besluit bedoeld in het eerste lid is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 2.2.1.1
    text: |-
      De rijksbijdrage voor het beroepsonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde aanspraak betrekking
      heeft wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, per instelling
      berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde berekeningswijze. Wat
      huisvestingskosten betreft wordt de rijksbijdrage berekend hetzij op grond van die berekeningswijze hetzij op grond
      van een andere bij of krachtens algemene maatregel van bestuur te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.2.1.2
    text: De rijksbijdrage bestaat uit bijdragen ten behoeve van exploitatiekosten en huisvestingskosten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3
    text: 'De bijdrage in de exploitatiekosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.a
    text: personeel,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.b
    text: onderhoud en vervanging van inventaris,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.c
    text: onderhoud van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.d
    text: energie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.e
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.g
    text: heffingen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.h
    text: inkoop van diensten,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.i
    text: |-
      kosten van werkloosheidsuitkeringen, suppleties inzake arbeidsongeschiktheid aan gewezen personeel alsmede
      uitkeringen wegens ziekte en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de
      [Ziektewet][ref1], waaronder mede begrepen gewezen personeel dat was belast met werkzaamheden op het gebied van de
      educatie, met inbegrip van educatieve programma's als bedoeld in [artikel 2.3.1, tweede lid][ref2], zoals luidend
      op 31 december 2008,


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.3.j
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.k
    text: gehandicapte deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.3.l
    text: |-
      ten behoeve van het voorbereidend beroepsonderwijs verzorgd in een agrarisch opleidingscentrum: lesmateriaal als
      bedoeld in [artikel 6e van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel6e
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 6e
  - number: 2.2.1.4
    text: 'De bijdrage in de huisvestingskosten heeft betrekking op:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.4.a
    text: huur van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.4.b
    text: investeringen in gebouwen en terreinen, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.4.c
    text: eerste inrichting.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.1.5
    text: |-
      Op de rijksbijdrage wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels een bedrag in
      mindering gebracht in verband met cursusgelden zoals bedoeld in de [Les- en cursusgeldwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004188
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0004188
  - number: 2.2.1.6
    text: |-
      Een in het eerste lid en in het vijfde lid bedoelde algemene maatregel van bestuur wordt aan de beide Kamers
      der Staten-Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn
      verstreken en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.2.2
    text: 'De maatstaven voorzien in bekostiging aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.2.a
    text: het aantal ingeschreven deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.2.b
    text: |-
      het aantal deelnemers dat een diploma als bedoeld in [artikel 7.4.6][ref1] heeft behaald, waaronder mede begrepen
      het aantal examendeelnemers dat een dergelijk diploma bij een instelling heeft behaald binnen twee kalenderjaren
      volgend op het kalenderjaar waarin de inschrijving als deelnemer bij een instelling voor een beroepsopleiding
      waarvoor de instelling bekostiging heeft of zal ontvangen, zonder het behalen van een dergelijk diploma is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 2.2.2.3
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, geldt inschrijving van een deelnemer voor
      twee of meer beroepsopleidingen in enig studiejaar als inschrijving voor één beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, geldt dat indien in enig kalenderjaar door
      een deelnemer of examendeelnemer een diploma wordt behaald van een beroepsopleiding die niet van een hoger niveau
      als bedoeld in [artikel 7.2.2, derde lid][ref1], is dan de beroepsopleiding waarvan die deelnemer al eerder in dat
      kalenderjaar een diploma heeft behaald, uitsluitend het eerstbehaalde van die diploma’s wordt meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.2.5
    text: |-
      Bij de toepassing van de maatstaf, bedoeld in het tweede lid, onder b, blijven de deelnemers aan de entreeopleiding
      buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.6
    text: |-
      In de maatstaven, bedoeld in het tweede lid, kan onderscheid gemaakt worden naar groepen van deelnemers, naar
      opleidingen, naar verblijfsduur van een deelnemer in één of meer opleidingen, naar soorten van instellingen en naar
      behaalde diploma’s.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.7
    text: 'Deelnemers die niet als ingezetene zijn ingeschreven in de basisregistratie personen tellen alleen mee, indien:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.7.a
    text: zij onderwijs, daaronder begrepen de beroepspraktijkvorming, in Nederland volgen, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.2.7.b
    text: |-
      zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister kan volgens bij ministeriële regeling te geven voorschriften aan de rijksbijdrage, berekend op
      grond van [artikel 2.2.2][ref1], een bedrag toevoegen in verband met een onevenredig grote toename van het aantal
      deelnemers ten opzichte van het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.2
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, volgens bij ministeriële regeling te
      geven voorschriften ten behoeve van de ontwikkeling van het bestel van het beroepsonderwijs een bedrag toevoegen
      aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2.3.3
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het beroepsonderwijs
      voor het daarop volgende jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en
      vermeldt daarbij afzonderlijk het bedrag voor gehandicapte deelnemers alsmede het bedrag voor de entreeopleiding,
      bedoeld in [artikel 7.2.2, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.4.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4
  - number: 2.2.4.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4
  - number: 2.2.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4
  - number: 2.2.4.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze,
      bedoeld in [artikel 2.2.2][ref1], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze gegevens en de verklaring worden
      ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2.4a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de besteding van de
      rijksbijdrage aan private activiteiten ten behoeve van het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4a
  - number: 2.2.4b
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.4b
  - number: 2.2.5
    text: |-
      De [artikelen 85c][ref1], [85c1][ref2], [89b][ref3] en [89b1 van de Wet op het voortgezet onderwijs][ref4] zijn
      van overeenkomstige toepassing ten aanzien van een agrarisch opleidingscentrum voor zover het betreft het in die
      instelling verzorgde voorbereidend beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85c
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel85c1
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel89b
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel89b1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 85c
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 85c1
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 89b
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 89b1
  - number: 2.2a.1.1
    text: |-
      De rijksbijdrage voor het voortgezet algemeen volwassenenonderwijs waarop de in [artikel 1.3.1][ref1] bedoelde
      aanspraak betrekking heeft wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde
      middelen, per instelling berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 2.2a.1.2
    text: |-
      [Artikel 2.2.1, derde lid, onder a tot en met k, en vierde lid][ref1], zijn van overeenkomstige toepassing,
      met dien verstande dat in onderdeel i onder gewezen personeel mede wordt begrepen personeel dat was belast met
      werkzaamheden op het gebied van het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.2a.2.1
    text: |-
      De in [artikel 2.2a.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding gelijkelijk
      geldende maatstaven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2a.2.2
    text: 'De maatstaven voorzien in bekostiging aan de hand van:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.2.a
    text: het aantal ingeschreven deelnemers,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.2.b
    text: |-
      het aantal deelnemers dat bij de instelling een diploma van onderwijs als bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1] heeft behaald en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 2.2a.2.2.c
    text: |-
      het aantal deelnemers dat bij de instelling een eindexamen of deeleindexamen heeft afgelegd in onderwijs als
      bedoeld in de [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 2.2a.2.3
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder a, blijven deelnemers die niet bij een
      instelling staan ingeschreven op een bij algemene maatregel van bestuur vastgesteld tijdstip buiten beschouwing en
      kan onderscheid worden gemaakt naar het aantal vakken waarvoor een deelnemer is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, onder c, kan onderscheid worden gemaakt naar het
      aantal vakken waarin de deelnemer met goed gevolg examen heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.5
    text: |-
      Deelnemers die niet zijn opgenomen in de basisregistratie personen tellen alleen mee voor de toepassing van dit
      artikel, indien:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.5.a
    text: zij onderwijs in Nederland volgen, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.5.b
    text: |-
      zij in Nederland, België of een van de bondsstaten Noord-Rijnland-Westfalen, Nedersaksen en Bremen van de
      Bondsrepubliek Duitsland wonen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.2.6
    text: Examendeelnemers tellen niet mee voor de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.2
  - number: 2.2a.3.1
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, volgens bij ministeriële regeling te
      geven voorschriften ten behoeve van de ontwikkeling van het bestel van het voortgezet algemeen volwassenenonderwijs
      een bedrag toevoegen aan de rijksbijdrage, berekend op grond van [artikel 2.2a.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2a.3.2
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.3
  - number: 2.2a.4.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het daarop volgende
      jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend en vermeldt daarbij
      afzonderlijk het bedrag voor gehandicapte deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.4
  - number: 2.2a.4.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.4
  - number: 2.2a.4.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.4
  - number: 2.2a.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze titel. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.4
  - number: 2.2a.4.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze,
      bedoeld in [artikel 2.2a.2][ref1] , gaan vergezeld van een verklaring omtrent de getrouwheid,
      afgegeven door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze gegevens en de verklaring worden
      ingediend voor een bij algemene maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.2a.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.3.1.1
    text: |-
      Het college van burgemeester en wethouders draagt zorg voor een aanbod van opleidingen educatie als bedoeld in
      [artikel 7.3.1, eerste lid, onder b tot en met f][ref1], met voldoende aandacht voor alle doelgroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 2.3.1.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taak werken de colleges van burgemeester en wethouders
      samen binnen bij ministeriële regeling vastgestelde regio’s. Bij ministeriële regeling wordt voor elke regio een
      contactgemeente aangewezen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.1.3
    text: |-
      Het college van burgemeester en wethouders van een contactgemeente vervult coördinerende taken met het oog op het
      aanbod van opleidingen educatie als bedoeld in het eerste lid. In dat verband
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.1.3.a
    text: |-
      draagt het college in overleg met de colleges van burgemeester en wethouders in de overige gemeenten in de regio
      zorg voor de totstandkoming van een regionaal programma van educatievoorzieningen,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.1.3.b
    text: |-
      maakt het college afspraken met aanbieders van opleidingen educatie, overeenkomstig het regionaal programma,
      bedoeld onder a, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.1.3.c
    text: coördineert het college de overige werkzaamheden die verband houden met de uitvoering van het regionaal programma.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.1.4
    text: |-
      Het overleg, bedoeld in het derde lid, onder a, heeft in elk geval betrekking op de behoefte aan
      educatievoorzieningen in de gemeenten in de regio en de wijze waarop in deze behoefte zal worden voorzien.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Onze Minister verstrekt ten behoeve van de taak van de colleges van burgemeester en wethouders in de betreffende
      regio aan de contactgemeenten een uitkering. De uitkering wordt, binnen het raam van de door de begrotingswetgever
      beschikbaar gestelde middelen, berekend aan de hand van voor elke gemeente gelijkelijk geldende maatstaven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.2
  - number: 2.3.2.2
    text: |-
      De contactgemeente draagt er zorg voor dat de doelgroepen in alle gemeenten in de betreffende regio overeenkomstig
      het regionaal programma, bedoeld in het [artikel 2.3.1, derde lid, onder a][ref1], gebruik kunnen maken van de
      educatievoorzieningen die met behulp van de uitkering, bedoeld in het eerste lid, tot stand zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.2.3
    text: De uitkering wordt vastgesteld in september voorafgaande aan het kalenderjaar waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.2
  - number: 2.3.2.4
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de berekeningswijze en de betaalbaarstelling van
      de uitkering.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.2
  - number: 2.3.3.1
    text: |-
      Het college van burgemeester en wethouders van de contactgemeente biedt aan personen uit de doelgroep opleidingen
      educatie aan overeenkomstig het regionaal programma. Daarbij geldt dat opleidingen educatie alleen kunnen worden
      aangeboden aan personen van achttien jaar of ouder die ingezetene zijn van een gemeente in de desbetreffende regio.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.3
  - number: 2.3.3.2
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorwaarden worden gesteld waaronder de kosten van opleidingen
      educatie, niet zijnde uitvoeringskosten, ten laste van de uitkering, bedoeld in [artikel 2.3.2, eerste lid][ref1],
      kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.4.1
    text: |-
      Het college van burgemeester en wethouders van de contactgemeente legt verantwoording af aan Onze Minister over de
      uitvoering van deze wet, op de wijze, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 2.3.4.2
    text: |-
      Indien uit de verantwoordingsinformatie, bedoeld in
      [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1], blijkt dat de uitkering, bedoeld in
      [artikel 2.3.2, eerste lid][ref2], niet volledig of onrechtmatig is besteed, wordt de uitkering ter hoogte van
      het niet of onrechtmatig bestede deel door Onze Minister teruggevorderd. Onze Minister doet binnen een jaar na
      ontvangst van de verantwoordingsinformatie mededeling van de terugvordering aan het college van burgemeester en
      wethouders van de contactgemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.4.3
    text: |-
      Indien de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1],
      niet volledig door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is ontvangen binnen dertien maanden
      na het kalenderjaar waarop zij betrekking heeft, wordt de uitkering teruggevorderd. Indien volledige terugvordering
      naar het oordeel van Onze Minister leidt tot een onbillijkheid van overwegende aard, stelt Onze Minister de
      terugvordering op een lager bedrag vast. Onze Minister doet binnen drie maanden na afloop van de dertien maanden,
      bedoeld in de eerste volzin, mededeling van terugvordering aan het college van burgemeester en wethouders van de
      contactgemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 2.3.4.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering, bedoeld in het tweede en
      derde lid, alsmede over de verdeling van de teruggevorderde gelden. Daarbij kan worden bepaald dat een gedeelte van
      het niet bestede deel van de uitkering niet wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.4
  - number: 2.3.5.1
    text: |-
      Het college van burgemeester en wethouders van de contactgemeente verstrekt desgevraagd aan Onze Minister gegevens
      die betrekking hebben op het aanbod bedoeld in [artikel 2.3.1, eerste lid][ref1], teneinde deze in staat te stellen
      een zorgvuldig en samenhangend beleid met betrekking tot educatie te voeren en zijn stelselverantwoordelijkheid te
      waarborgen. De gegevens worden kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.5.2
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.5
  - number: 2.3.5.2.a
    text: de verstrekking van de in het eerste lid bedoelde gegevens en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.5
  - number: 2.3.5.2.b
    text: |-
      de betaling van de uitkering, bedoeld in [artikel 2.3.2, eerste lid][ref1], indien het college van burgemeester en
      wethouders van de contactgemeente de in het eerste lid bedoelde gegevens niet of niet tijdig verstrekt dan wel de
      kwaliteit van die gegevens te kort schiet.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.6.1
    text: |-
      De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het voortgezet algemeen volwassenenonderwijs en verlenen desgevraagd
      medewerking aan door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is
      gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6
  - number: 2.3.6.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld over de wijze van beschikbaarstelling van de in
      het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6
  - number: 2.3.6a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een opleiding voortgezet algemeen
      volwassenenonderwijs gebruiken in het verkeer met de deelnemer op wie het nummer betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een opleiding voortgezet algemeen
      volwassenenonderwijs aan Onze Minister, tezamen de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.b
    text: de datum van inschrijving of einde inschrijving;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.c
    text: de opleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.d
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.e
    text: het programma voortgezet algemeen volwassenenonderwijs (vakken);
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.f
    text: |-
      de behaalde certificaten en de data waarop de certificaten zijn behaald, alsmede de vakken waarin examen is
      afgelegd, de cijfers van het schoolexamen en het centraal examen, de eindcijfers en de uitslag van het eindexamen
      of het deeleindexamen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.g
    text: |-
      het uitstroomniveau of het behaalde diploma en de datum waarop het diploma is behaald alsmede, voor zover het
      Nederlands als tweede taal (NT2) betreft, het startniveau;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.h
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.i
    text: indien van toepassing het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.j
    text: indien van toepassing het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.k
    text: het aantal uren per week dat onderwijs wordt gevolgd aan de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.l
    text: indien van toepassing de reden van het uitstromen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.m
    text: de locatie waar het onderwijs wordt gevolgd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.n
    text: indien van toepassing het samenwerkingscollege waar het onderwijs wordt gevolgd, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.2.o
    text: |-
      indien van toepassing op de deelnemer en voor zover de instelling dat wenst een organisatorische eenheid, bedoeld
      in [artikel 9.1.7, eerste lid, onderdeel c][ref1], waarbinnen de deelnemer zijn opleiding voortgezet algemeen
      volwassenonderwijs volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.3.6a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede en
      vijfde lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en vijfde lid, niet langer behoeven
      te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen en de
      wijze van verstrekking van de gegevens, bedoeld in het tweede en vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.4
    text: |-
      Het bevoegd gezag gebruikt bij de opgave aan burgemeester en wethouders, bedoeld in
      [artikel 8.0.2, eerste lid][ref1], en [artikel 8.1.8, eerste lid][ref2], het persoonsgebonden nummer van de
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6a.5
    text: |-
      Indien de gegevens over de nationaliteit van de deelnemer niet zijn opgenomen in de basisregistratie personen
      worden deze gegevens door het bevoegd gezag verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.6
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding in het kader van de
      uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.7
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een opleiding voortgezet algemeen
      volwassenenonderwijs in het contact met een andere instelling of een school of instelling voor ander onderwijs
      ten behoeve van de in- en uitschrijving van die deelnemer of ten behoeve van het volgen van onderwijs in een
      samenwerkingscollege. Onder dit contact wordt mede begrepen de uitwisseling van leergegevens en direct met het
      leren samenhangende begeleidingsgegevens. Bij algemene maatregel van bestuur worden de gegevens, bedoeld in de
      vorige volzin, gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.8
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een opleiding voortgezet algemeen
      volwassenenonderwijs ter uitvoering van [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan
      ter nakoming van verplichtingen als referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 2.3.6a.9
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze deelnemer met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van deelnemers. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de deelnemers zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.10
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het negende lid, gebruiken voor het genereren van een ander
      pseudoniem voor een deelnemer in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de deelnemers zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.11
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het tiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het negende lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.12
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      negende tot en met het elfde lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder geval
      de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6a.13
    text: |-
      De in het zevende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6a
  - number: 2.3.6b.1
    text: |-
      Onze Minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld in
      [artikel 2.3.6a, tweede en vijfde lid][ref1], op in het basisregister onderwijs, nadat zij deze gegevens heeft
      getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens, inclusief de gegevens, bedoeld in
      [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals zij voornemens is die
      gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onze Minister kan de door het bevoegd
      gezag verstrekte gegevens uitsluitend met instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
  - number: 2.3.6b.2
    text: |-
      Het bevoegd gezag verstrekt Onze Minister alle inlichtingen die zij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6b
  - number: 2.3.6c.1
    text: |-
      Gegevens inzake voortgezet algemeen volwassenenonderwijs uit het basisregister onderwijs kunnen worden gebruikt
      door:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6c.1.a
    text: |-
      Onze Minister voor zover deze gegevens noodzakelijk zijn voor de begrotings- en beleidsvoorbereiding en voor zover
      het betreft opleidingen voortgezet algemeen volwassenenonderwijs, de bekostiging van instellingen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6c.1.b
    text: de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6c.2
    text: |-
      Voor zover de door het bevoegd gezag op grond van [artikel 2.3.6a][ref1] verstrekte gegevens naar het oordeel
      van Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling van de bekostiging
      van opleidingen voortgezet algemeen volwassenenonderwijs van deze gegevens afwijken, in welk geval de door Onze
      Minister vastgestelde gewijzigde gegevens worden opgenomen in het basisregister onderwijs, nadat het desbetreffende
      besluit tot vaststelling van de bekostiging onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.6c.3
    text: |-
      Bij het gebruik, bedoeld in het eerste lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor de in het eerste lid genoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6c.4
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval omtrent
      de inhoud en de samenstelling van de desbetreffende gegevens, de wijze waarop de gegevens uit het basisregister
      onderwijs worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt en de perioden waarop de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6c.5
    text: |-
      Onze Minister kan, voor zover het betreft opleidingen voortgezet algemeen volwassenen onderwijs, in het verkeer
      met het bevoegd gezag ten behoeve van de vaststelling van de bekostiging het persoonsgebonden nummer gebruiken.
      In afwijking van het vierde lid wordt bij algemene maatregel van bestuur bepaald welke overige gegevens uit het
      basisregister onderwijs tezamen met het persoonsgebonden nummer hiervoor kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6c
  - number: 2.3.6d
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door de
      gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een opleiding voortgezet algemeen
      volwassenenonderwijs of een voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.a
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.b
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.3.6d.c
    text: |-
      verwerking van de gegevens, bedoeld in [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1]
      en in [artikel 8.1.8a, vierde lid][ref2], bij de registraties, bedoeld in onderdeel a, en het systeem van
      doorverwijzing, bedoeld in onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.3.6d
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.4.1
    text: |-
      De subsidie voor de uitvoering van de taken, bedoeld in [artikel 1.5.1, eerste lid, onder a tot en met f][ref1],
      wordt per boekjaar verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.4.2.1
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.a
    text: de aanvraag van een subsidie en de besluitvorming daarover,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.c
    text: de activiteiten waarvoor subsidie wordt verstrekt,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.d
    text: de voorwaarden waaronder subsidie wordt verleend,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.e
    text: de verplichtingen van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.f
    text: de vaststelling van de subsidie,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.g
    text: intrekking en wijziging van de subsidieverlening of subsidievaststelling,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.h
    text: de betaling van de subsidie en het verlenen van voorschotten,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.1.i
    text: |-
      het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.4.2.1.j
    text: andere criteria voor de verstrekking van subsidie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.2
    text: 'Bij de regels, bedoeld in het eerste lid, wordt voor zover nodig onderscheid gemaakt tussen subsidie voor:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
  - number: 2.4.2.2.a
    text: |-
      de taken, bedoeld in [artikel 1.5.1, eerste lid, onder a tot en met f][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.4.2.2.b
    text: |-
      de taken, bedoeld in [artikel 1.5.1, eerste lid, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.4.3
    text: |-
      Onze Minister kan jaarlijks het bedrag vaststellen dat ten hoogste beschikbaar is voor de activiteiten, genoemd in
      [artikel 1.5.1, eerste lid, onder g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 2.5.3.1
    text: Het bevoegd gezag stelt jaarlijks een jaarrekening vast over het afgelopen jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.2
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financiële beheer van de instelling voor
      zover het betreft de ingevolge deze wet uit ’s Rijks kas ontvangen middelen. Uit de jaarrekening dient te blijken
      dat sprake is van een rechtmatige en doelmatige aanwending van de rijksbijdrage. Van niet doelmatige aanwending
      van de rijksbijdrage is in ieder geval sprake voorzover bedragen daaruit worden aangewend voor het op enigerlei
      wijze compenseren van de deelnemers of examendeelnemers voor les- en cursusgeld respectievelijk examengeld.
      Bij ministeriële regeling kunnen met het oog op de verantwoording van de rechtmatigheid en doelmatigheid van de
      aanwending van de rijksbijdrage nadere voorschriften worden gegeven voor de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.3
    text: |-
      Het resultaat van het jaar waarop de jaarrekening betrekking heeft wordt verrekend met de algemene reserve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.4
    text: |-
      Het bevoegd gezag dient de jaarrekening voor 1 juli van het jaar volgend op het boekjaar bij Onze
      Minister in. De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven
      door een door de raad van toezicht of het bevoegd gezag aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.5.3.5
    text: Het bevoegd gezag maakt de jaarrekening, vergezeld van de verklaring, bedoeld in het vierde lid, openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.6
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de berekeningswijze,
      bedoeld in de [artikelen 2.2.2][ref1] en [2.2.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.5.3.7
    text: |-
      Het bevoegd gezag houdt per begrotingsjaar nauwkeurig boek van baten en lasten en draagt er zorg voor dat de baten
      en lasten nauwkeurig en herkenbaar zijn verwerkt in de in het zesde lid bedoelde informatieverzameling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.8
    text: |-
      Het bevoegd gezag bewaart de informatieverzameling en de desbetreffende boeken en bescheiden, bedoeld in het zesde
      en zevende lid, gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.3.9
    text: |-
      Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van beschikbaarstelling
      van de gegevens en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.3
  - number: 2.5.4.1
    text: |-
      Het bevoegd gezag stelt jaarlijks een bestuursverslag over het afgelopen jaar vast en maakt het openbaar. Het
      bestuursverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.6, tweede lid][ref1], voorzover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten van
      de bevindingen van de inspectie met betrekking tot de examens. Ook legt het bevoegd gezag in het bestuursverslag
      verantwoording af over de omgang met een branchecode voor goed bestuur. Bij ministeriële regeling kan een
      branchecode worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 2.5.4.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.4
  - number: 2.5.5.1
    text: |-
      De instellingen dragen er zorg voor dat zij beschikken over geordende gegevens ten behoeve van het door Onze
      Minister te voeren beleid met betrekking tot het beroepsonderwijs en verlenen desgevraagd medewerking aan door of
      namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5
  - number: 2.5.5.2
    text: |-
      Bij algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de wijze van beschikbaarstelling van de
      in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5
  - number: 2.5.5.3
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur worden tevens voorschriften vastgesteld over de
      wijze van ordening van de informatie en over de kengetallen waarover informatie beschikbaar is of wordt verstrekt,
      en kan worden bepaald dat Onze Minister een bijdrage in de kosten voor het verzamelen of verstrekken van deze
      gegevens is verschuldigd. Bij of krachtens de in het tweede lid bedoelde algemene maatregel van bestuur kan deze
      bijdrage worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5
  - number: 2.5.5a.1
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding gebruiken in het
      verkeer met de deelnemer op wie het nummer betrekking heeft, of, indien de deelnemer minderjarig is, met de ouders,
      voogden of verzorgers van deze deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2
    text: |-
      Het bevoegd gezag verstrekt het persoonsgebonden nummer van iedere deelnemer aan een beroepsopleiding aan Onze
      Minister, tezamen met de volgende gegevens van de deelnemer:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.a
    text: geslacht, geboortedatum en postcode van de woonplaats;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.b
    text: de datum van inschrijving of van de wijziging of beëindiging daarvan;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.c
    text: |-
      de code, bedoeld in [artikel 6.4.1, tweede lid, onder a][ref1], van het opleidingsdomein, het kwalificatiedossier
      of de kwalificatie waarvoor de deelnemer is ingeschreven en bij inschrijving voor een opleidingsdomein of een
      kwalificatiedossier het niveau, bedoeld in [artikel 7.2.2, derde lid][ref2], van de beroepsopleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.5.5a.2.d
    text: de leerweg;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.e
    text: het al dan niet hebben van een handicap of chronische ziekte die extra ondersteuning vraagt van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.f
    text: de hoogste vooropleiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.h
    text: |-
      het uitstroomniveau of het behaalde diploma of certificaat, de datum waarop het diploma of certificaat is behaald
      en de cijfers of het eindcijfer van bij ministeriële regeling aan te wijzen examenonderdelen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.i
    text: |-
      de omvang van beroepspraktijkvorming, de datum van begin en einde daarvan, de afsluitdatum van de
      beroepspraktijkvormingsovereenkomst, het betrokken bedrijf dat of de betrokken organisatie die de
      beroepspraktijkvorming verzorgt en het opleidingsdomein, het kwalificatiedossier, de kwalificatie of het keuzedeel
      waarop de beroepspraktijkvorming is gebaseerd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.j
    text: het registratienummer van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.l
    text: het volgen van de opleiding in voltijd of deeltijd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.m
    text: indien van toepassing het zijn van examendeelnemer;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.n
    text: het al dan niet voor bekostiging in aanmerking komen van de deelnemer of het diploma;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.o
    text: indien van toepassing de reden van het uitstromen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.p
    text: de locatie waar het onderwijs wordt gevolgd;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.q
    text: |-
      de keuzedelen waarin examen is afgelegd en die met goed gevolg zijn afgesloten alsmede de datum waarop de
      keuzedelen met goed gevolg zijn afgesloten;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.r
    text: |-
      de keuzedelen waarin examen is afgelegd en die niet met goed gevolg zijn afgesloten, alsmede de datum van de
      beëindiging van de inschrijving;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.s
    text: |-
      de onderdelen van een kwalificatie en de keuzedelen waarvoor toepassing is gegeven aan
      [artikel 7.2.3, eerste lid][ref1], en die met goed gevolg zijn afgesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.5.5a.2.t
    text: indien van toepassing het samenwerkingscollege waar het onderwijs wordt gevolgd, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.2.u
    text: |-
      indien van toepassing op de deelnemer en voor zover de instelling dat wenst een organisatorische eenheid, bedoeld
      in [artikel 9.1.7, eerste lid, onderdeel c][ref1], waarbinnen de deelnemer zijn beroepsopleiding volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 2.5.5a.3
    text: |-
      Bij ministeriële regeling kan een nadere specificatie worden gegeven van de gegevens, bedoeld in het tweede
      en zevende lid, en kan worden bepaald welke van de gegevens, bedoeld in het tweede en zevende lid, niet langer
      behoeven te worden verstrekt. Bij ministeriële regeling kunnen voorts regels worden gesteld omtrent de tijdstippen
      en de wijze van verstrekking van de gegevens, bedoeld in het tweede en zevende lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.4
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding, al dan niet tezamen
      met een of meer van de gegevens, bedoeld in het tweede en zevende lid, gebruiken in het verkeer met Onze Minister
      ten behoeve van de vaststelling van de bekostiging van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.5
    text: |-
      Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref1], gebruiken het
      persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in contacten met een gemeente in het kader van
      de [Leerplichtwet 1969][ref2], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van
      die wet door de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002628
  - number: 2.5.5a.6
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van de betrokkene bij de opgave, bedoeld in
      [artikel 8.0.3, derde en vierde lid][ref1], en bij de opgave, bedoeld in [artikel 8.1.8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5a.7
    text: |-
      Indien de gegevens over de nationaliteit van de deelnemer niet zijn opgenomen in de basisregistratie personen
      worden deze gegevens door het bevoegd gezag verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.8
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het kader van
      de uitvoering van subsidieregelingen van het Europees Sociaal Fonds.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.9
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding in het contact
      met een andere instelling of een school of instelling voor ander onderwijs ten behoeve van de in- en uitschrijving
      van die deelnemer of ten behoeve van het volgen van onderwijs in een samenwerkingscollege. Onder dit contact wordt
      mede begrepen de uitwisseling van leergegevens en direct met het leren samenhangende begeleidingsgegevens. Bij
      algemene maatregel van bestuur worden de gegevens, bedoeld in de vorige volzin, gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.10
    text: |-
      Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een deelnemer aan een beroepsopleiding ter uitvoering
      van [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1], anders dan ter nakoming van verplichtingen als
      referent in de zin van [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 2.5.5a.11
    text: |-
      Het bevoegd gezag gebruikt het persoonsgebonden nummer van een deelnemer in contacten met een school als bedoeld
      in de [Wet op de expertisecentra][ref1] in het kader van de ondersteuning die deze school biedt op grond van
      [artikel 8a, eerste lid, van de Wet op de expertisecentra][ref2] en [artikel 2.2.5, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003549
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
    references:
      - id: ref1
        bwb_id: BWBR0003549
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 8a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.5.5a.12
    text: |-
      Het bevoegd gezag kan het persoonsgebonden nummer van een deelnemer eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze deelnemer met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van deelnemers. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de deelnemers zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.13
    text: |-
      Het bevoegd gezag kan het pseudoniem, bedoeld in het twaalfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een deelnemer in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen en examens, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem
      wordt bewaard in de systemen waarin de deelnemers zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend
      verstrekt aan een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of
      toetsen en de daarmee samenhangende digitale diensten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.14
    text: |-
      Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het dertiende
      lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het twaalfde lid, een ander pseudoniem kan
      genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem aangewezen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.15
    text: |-
      Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      twaalfde tot en met het veertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5a.16
    text: |-
      De in het negende lid bedoelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een van beide kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5a
  - number: 2.5.5b.1
    text: |-
      Onze Minister neemt de door het bevoegd gezag verstrekte persoonsgebonden nummers en andere gegevens, bedoeld
      in [artikel 2.5.5a, tweede en zevende lid][ref1], op in het basisregister onderwijs, nadat hij deze gegevens
      heeft getoetst op juistheid en volledigheid. Onze Minister verstrekt de gegevens, inclusief de gegevens,
      bedoeld in [artikel 24c, eerste lid, onderdeel g, van de Wet op het onderwijstoezicht][ref2], zoals hij
      voornemens is die gegevens in het basisregister onderwijs op te nemen, aan het bevoegd gezag. Onverminderd
      [artikel 2.5.5c, tweede lid][ref3], kan Onze Minister de door het bevoegd gezag verstrekte gegevens uitsluitend met
      instemming van het bevoegd gezag wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel24c
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013800
        artikel: 24c
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5b.2
    text: |-
      Het bevoegd gezag verstrekt Onze Minister alle inlichtingen die hij nodig acht voor de uitvoering van de taak,
      bedoeld in het eerste lid. Het bevoegd gezag werkt eraan mee dat de in het basisregister onderwijs opgenomen
      gegevens juist en volledig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5b
  - number: 2.5.5b.3
    text: |-
      Indien Onze Minister naar aanleiding van de toetsing, bedoeld in het eerste lid, redenen heeft om aan te nemen dat
      een bevoegd gezag in strijd handelt of heeft gehandeld met het bepaalde bij of krachtens deze wet en een onderzoek
      daarnaar door de inspectie nodig acht, verstrekt Onze Minister ten behoeve van dit onderzoek de persoonsgebonden
      nummers en andere gegevens van deelnemers aan een beroepsopleiding aan de inspectie. De inspectie meldt de uitkomst
      van het onderzoek aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5b
  - number: 2.5.5b.4
    text: |-
      Onze Minister en de inspectie verstrekken ter uitvoering van
      [artikel 107, vijfde lid, van de Vreemdelingenwet 2000][ref1] geen gegevens die zij op grond van het derde lid
      hebben ontvangen, tenzij deze gegevens noodzakelijk zijn voor nakoming van verplichtingen als referent in de zin
      van [die wet][ref2] dan wel voor het toezicht op de naleving van de wettelijke voorschriften met betrekking tot
      referenten in de zin van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5b
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0011823
  - number: 2.5.5c.1
    text: 'Gegevens inzake beroepsonderwijs uit het basisregister onderwijs kunnen worden gebruikt door:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5c.1.a
    text: |-
      Onze Minister voor zover deze gegevens noodzakelijk zijn voor de bekostiging van instellingen en de begrotings-
      en beleidsvoorbereiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5c.1.b
    text: de inspectie voor zover deze gegevens noodzakelijk zijn voor het uitoefenen van het toezicht op het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5c.2
    text: |-
      Voor zover de door het bevoegd gezag op grond van [artikel 2.5.5a][ref1] verstrekte gegevens naar het oordeel van
      Onze Minister onjuist of onvolledig zijn, kan Onze Minister ten behoeve van de vaststelling van de bekostiging van
      deze gegevens afwijken, in welk geval de door Onze Minister vastgestelde gewijzigde gegevens worden opgenomen in
      het basisregister onderwijs, nadat het desbetreffende besluit tot vaststelling van de bekostiging onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.5c.3
    text: |-
      Bij het gebruik, bedoeld in het eerste lid, kunnen persoonsgegevens worden verwerkt, indien dat noodzakelijk
      is voor de in het eerste lid genoemde doelen, onverminderd de verplichting voor de verwerkingsverantwoordelijke
      om passende technische en organisatorische maatregelen te treffen als bedoeld in artikel 25 van de Algemene
      verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5c.4
    text: |-
      Bij ministeriële regeling worden regels gesteld ter uitvoering van het eerste en derde lid, in ieder geval omtrent
      de inhoud en de samenstelling van de desbetreffende gegevens, de wijze waarop de gegevens uit het basisregister
      onderwijs worden verstrekt, de tijdstippen waarop de gegevens worden verstrekt en de perioden waarop de gegevens
      betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5c.5
    text: |-
      Onze Minister kan in het verkeer met het bevoegd gezag ten behoeve van de vaststelling van de bekostiging het
      persoonsgebonden nummer gebruiken. In afwijking van het vierde lid wordt bij algemene maatregel van bestuur bepaald
      welke overige gegevens uit het basisregister onderwijs tezamen met het persoonsgebonden nummer hiervoor kunnen
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5c
  - number: 2.5.5e
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer door
      de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een deelnemer aan een beroepsopleiding of een
      voortijdige schoolverlater als bedoeld in [artikel 8.3.1][ref1] uitsluitend ten behoeve van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.a
    text: |-
      een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van de
      [Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 2.5.5e.b
    text: |-
      de registratie van gegevens van voortijdige schoolverlaters, bedoeld in
      [artikel 8.3.2, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.c
    text: |-
      het systeem van doorverwijzing van voortijdige schoolverlaters naar onderwijs of arbeidsmarkt, bedoeld in
      [artikel 8.3.2, eerste lid, tweede en derde volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.5e.d
    text: |-
      verwerking van de gegevens, bedoeld in [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1]
      en in [artikel 8.1.8a, vierde lid][ref2], bij de registraties, bedoeld in de onderdelen a en b, en het systeem van
      doorverwijzing, bedoeld in onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.5e
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.5.6
    text: |-
      Onze Minister kan naast het accountantsonderzoek, bedoeld in [artikel 2.5.3, vierde lid][ref1], een onderzoek
      instellen of doen instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 2.5.5][ref2], naar de
      rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.7a
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.7a
  - number: 2.5.9.1
    text: |-
      Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de
      correctie met de rijksbijdrage voor het desbetreffende jaar of betaalt uit in dat jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.9
  - number: 2.5.9.2
    text: |-
      Indien uit de jaarrekening, uit de verklaring van de accountant, bedoeld in [artikel 2.5.3, vierde lid][ref1],
      of uit de resultaten van het onderzoek, bedoeld in [artikel 2.5.6][ref2], blijkt dat de rijksbijdrage op onjuiste
      gronden is vastgesteld dan wel de besteding daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister
      correcties aanbrengen op de rijksbijdrage. Onze Minister verrekent een correctie met de rijksbijdrage voor het
      eerstvolgende jaar na het besluit tot correctie, of betaalt uit in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.5.9.3
    text: |-
      Onverminderd het eerste en tweede lid is Onze Minister bevoegd tot verrekening van vorderingen krachtens deze wet
      van of op het bevoegd gezag van een instelling met vorderingen krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.9
  - number: 2.5.9a
    text: |-
      De [artikelen 2.5.3][ref1], [2.5.4][ref2], [2.5.6][ref3], [2.5.7a][ref4] en [2.5.9][ref5] zijn van overeenkomstige
      toepassing op de rijksbijdrage voor het voortgezet algemeen volwassenenonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel2.5.9a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
