        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.1.1.a
    text: |-
      die het onderwijs of het voortgezet algemeen volwassenenonderwijs aan de instelling waaraan hij is ingeschreven
      gedurende een aaneengesloten periode van ten minste vier weken of een door het bevoegd gezag te bepalen kortere
      periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.1
  - number: 8.3.1.1.b
    text: |-
      die niet meer aan een instelling is ingeschreven en evenmin is ingeschreven aan een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.1.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater niet verstaan degene
      die in het bezit is van een diploma van een opleiding als bedoeld in [artikel 7.2.2, eerste lid onderdeel a][ref1],
      een getuigschrift van het arbeidsmarktgerichte uitstroomprofiel of het uitstroomprofiel dagbesteding als bedoeld in
      [artikel 14d][ref2] respectievelijk [artikel 14g van de Wet op de expertisecentra][ref3] dan wel een getuigschrift
      van het praktijkonderwijs als bedoeld in [artikel 10f van de Wet op het voortgezet onderwijs][ref4] en werkzaam is
      op grond van een aanstelling of arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel14d
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel14g
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: 14d
      - id: ref3
        bwb_id: BWBR0003549
        artikel: 14g
      - id: ref4
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 8.3.2.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 8.1.8][ref1] heeft gemeld of waarover zij op grond van [artikel 8.1.8a][ref2] of op grond van
      [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref3] beschikken. Burgemeester en
      wethouders dragen bovendien zorg voor een systeem van doorverwijzing naar onderwijs of arbeidsmarkt van de in
      [artikel 8.3.1][ref4] bedoelde voortijdige schoolverlaters en voor het onderhoud van dit systeem. Het systeem
      heeft mede betrekking op de gegevens waarover de gemeente beschikt in het kader van de uitvoering van de
      [Leerplichtwet 1969][ref5]. Burgemeester en wethouders volgen de deelname aan onderwijs en arbeidsmarkt van de
      personen, bedoeld in [artikel 8.3.1, tweede lid][ref6], die de leeftijd van 23 jaren nog niet hebben bereikt. Voor
      de uitvoering van de eerste, tweede en vierde volzin kunnen bij ministeriële regeling nadere voorschriften worden
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002628
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref5
        bwb_id: BWBR0002628
      - id: ref6
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.2.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met instellingen, scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.2.3
    text: |-
      De colleges van burgemeester en wethouders in een regio wijzen uit hun midden een contactgemeente aan. Deze
      aanwijzing wordt onverwijld gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen
      coördinerende taken met het oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.4
    text: |-
      Indien colleges van burgemeester en wethouders in een regio een andere contactgemeente aanwijzen, dragen
      burgemeester en wethouders van de vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van
      dit artikel over aan burgemeester en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing
      wordt onverwijld gemeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister onverminderd
      [artikel 8.3.4, vierde lid][ref1], binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen
      jaarlijks uiterlijk in september ten behoeve van de activiteiten van de colleges van burgemeester en wethouders
      in de regio aan de contactgemeente een specifieke uitkering toe. Deze uitkering heeft betrekking op het daarop
      volgende kalenderjaar. De contactgemeente draagt er zorg voor dat de colleges van burgemeester en wethouders in
      de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering zijn verwezenlijkt. Bij of
      krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en betaling van de uitkering.
      De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van de gemeenten in de regio
      op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening wordt gehouden met het
      opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een deel van de uitkering
      kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een vergoeding voor de
      bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze Minister hanteert het
      aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het Centraal Bureau voor de
      Statistiek op verzoek van Onze Minister daarover verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.2.6
    text: |-
      Het bevoegd gezag geeft aan de door burgemeester en wethouders aangewezen personen alle gevraagde bescheiden ter
      inzage en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.7
    text: |-
      De gemeenteraden in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
  - number: 8.3.2.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien uit de
      informatie, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1], niet blijkt dat de uitkering is
      besteed in overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 8.3.3.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 8.3.2, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.3.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.3
  - number: 8.3.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.3
  - number: 8.3.4.1
    text: |-
      Burgemeester en wethouders in een regio als bedoeld in [artikel 8.3.2, tweede lid][ref1], en de in dat lid bedoelde
      instellingen, scholen en organisaties stellen telkens voor een periode van vier jaren een regionaal programma
      op met maatregelen ter voorkoming en bestrijding van voortijdig schoolverlaten van jongeren tussen twaalf en
      drieëntwintig jaar. Het programma heeft mede betrekking op leer- en kwalificatieplichtigen en het volgen door
      burgemeester en wethouders van de deelname aan onderwijs en arbeidsmarkt van de personen, bedoeld in artikel 8.3.2,
      eerste lid, vierde volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.4.2
    text: |-
      Burgemeester en wethouders in een regio als bedoeld in [artikel 8.3.2, tweede lid][ref1], en de in dat lid bedoelde
      instellingen, scholen en organisaties voeren regionaal bestuurlijk overleg over het regionaal programma en de
      uitvoering en financiering van de daarin opgenomen maatregelen. Bij het overleg worden tevens de domeinen arbeid en
      zorg betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.4.3
    text: |-
      Burgemeester en wethouders van de contactgemeente coördineren het regionaal bestuurlijk overleg, de totstandkoming
      van het regionaal programma en de uitvoering en financiering van de daarin opgenomen regionale maatregelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.4
  - number: 8.3.4.4
    text: |-
      De specifieke uitkering, bedoeld in [artikel 8.3.2, vijfde lid][ref1], is mede bestemd voor de uitvoering van het
      regionaal programma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.4.5
    text: |-
      Burgemeester en wethouders van de contactgemeente geven in de effectrapportage, bedoeld in
      [artikel 8.3.2, zevende lid][ref1], aan hoe de domeinen arbeid en zorg bij het regionale bestuurlijk overleg zijn
      betrokken en welke resultaten hiermee zijn bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.5
    text: |-
      Het bevoegd gezag neemt deel aan het overleg, bedoeld in
      [artikel 17a, negende lid, tweede volzin, van de Wet op het voortgezet onderwijs][ref1], indien de instelling
      één of meer vestigingen heeft in het gebied van het desbetreffende samenwerkingsverband en stemt het
      ondersteuningsaanbod af op de afspraken die zijn gemaakt in dat overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.3.5
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 10b1 van de Wet op het voortgezet onderwijs][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een school voor voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref2] en het bevoegd gezag van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b7 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b7
  - number: 8.4.2.1
    text: |-
      De entreeopleiding, bedoeld in [artikel 10b8 van de Wet op het voortgezet onderwijs][ref1], wordt verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b8
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b8
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.2.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b9 van de Wet op het voorgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b9
  - number: 8.5.1.1
    text: |-
      Leer-werktrajecten, ingevolge [artikel 14a, tweede lid, van de Wet op de expertisecentra][ref1], dan wel ingevolge
      [artikel 59a, tweede lid, van de Wet op het voortgezet onderwijs][ref2], worden verzorgd op grondslag van een
      samenwerkingsovereenkomst tussen het bevoegd gezag van een school waar voortgezet speciaal onderwijs als bedoeld in
      de [Wet op de expertisecentra][ref3] wordt verzorgd en het bevoegd gezag van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.5.1
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0003549
  - number: 8.5.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b7 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.5.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b7
  - number: 8.5.2.1
    text: |-
      De entreeopleiding, ingevolge [artikel 14a, tweede lid, van de Wet op de expertisecentra][ref1], dan wel ingevolge
      [artikel 59a, tweede lid, van de Wet op het voortgezet onderwijs][ref2], wordt verzorgd op grondslag van een
      samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van een school waar
      voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref3] wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.5.2
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: 14a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 59a
      - id: ref3
        bwb_id: BWBR0003549
  - number: 8.5.2.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b9, eerste en tweede lid, van de Wet op de voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.5.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b9
  - number: 8.6.1
    text: |-
      Een samenwerkingscollege wordt gevormd op grondslag van een schriftelijke overeenkomst tussen de bevoegde
      gezagsorganen van de samenwerkende instellingen, waarbij in ieder geval afspraken zijn gemaakt over:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.a
    text: |-
      de beroepsopleidingen, waaronder de soorten leerwegen, dan wel de opleidingen voortgezet algemeen
      volwassenenonderwijs die in het samenwerkingscollege worden verzorgd, het onderwijsprogramma en de examinering van
      de desbetreffende opleidingen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.b
    text: |-
      de leiding van het samenwerkingscollege, waaronder de samenstelling, de wijze van benoeming en de taken en
      bevoegdheden die namens de deelnemende instellingen zijn opgedragen aan die leiding;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.c
    text: |-
      de wijze waarop de leiding van het samenwerkingscollege inlichtingen verstrekt en verantwoording aflegt aan de
      bevoegde gezagsorganen van de deelnemende instellingen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.d
    text: |-
      de organisatorische en onderwijskundige inrichting van het samenwerkingscollege, waaronder de inzet van personeel
      en het gebruik van faciliteiten van de deelnemende instellingen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.e
    text: de toerekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.f
    text: de wijze van geschillenbeslechting tussen de deelnemende instellingen over de uitvoering van de overeenkomst, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.1.g
    text: |-
      de voorwaarden waaronder een andere instelling partij kan worden bij de samenwerkingsovereenkomst, de overeenkomst
      kan worden opgezegd of ontbonden alsmede de wijze waarop de overeenkomst overigens kan worden gewijzigd, telkens
      met oog voor het zoveel mogelijk beperken van de gevolgen voor de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.1
  - number: 8.6.2.1
    text: |-
      Een instelling kan een of meer beroepsopleidingen of opleidingen voortgezet algemeen volwassenenonderwijs verzorgen
      binnen een samenwerkingscollege, zolang niet meer dan 40% van haar ingeschreven deelnemers onderwijs volgt in zo’n
      college.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.2
  - number: 8.6.2.2
    text: |-
      Een instelling die de grens nadert, bedoeld in het eerste lid, doet daarvan onverwijld schriftelijk melding aan
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.2
  - number: 8.6.2.3
    text: |-
      De verplichting, bedoeld in het tweede lid, is ook van toepassing op een instelling die voornemens is de
      samenwerking op te zeggen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.2
  - number: 8.6.3.1
    text: |-
      De onderwijs- en examenregeling, bedoeld in [artikel 7.4.8][ref1], is gelijkluidend voor iedere deelnemer die een
      beroepsopleiding of opleiding voortgezet algemeen volwassenenonderwijs aan een samenwerkingscollege volgt, ongeacht
      de instelling waar hij is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.6.3.2
    text: |-
      De bevoegde gezagsorganen van de deelnemende instellingen wijzen één examencommissie als bedoeld in
      [artikel 7.4.5][ref1] aan of stellen gezamenlijk een examencommissie in voor de examinering van opleidingen die in
      een samenwerkingscollege worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.6.3.3
    text: |-
      Er is slechts een commissie van beroep voor de examens als bedoeld in [artikel 7.5.1][ref1] bevoegd voor de
      beoordeling van examenbeslissingen omtrent deelnemers aan een samenwerkingscollege.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.6.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 8a.1.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.1
  - number: 8a.1.1.a
    text: |-
      deelnemersraad: de deelnemersraad, bedoeld in [artikel 8a.1.2, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.1.b
    text: |-
      reglement: het reglement voor de raad, bedoeld in [artikel 8a.3.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.1.c
    text: |-
      commissie: de landelijke geschillencommissie medezeggenschap, bedoeld in [artikel 8a.4.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.2.1
    text: |-
      Aan elke instelling is een deelnemersraad verbonden. De deelnemersraad behartigt de belangen van de deelnemers in
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.2.2
    text: De deelnemersraad bestaat uit een oneven aantal leden die uit en door de deelnemers worden gekozen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.2.3
    text: De verkiezing van de leden van de deelnemersraad geschiedt bij geheime schriftelijke stemming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.2.4
    text: |-
      Alle deelnemers die bij de instelling zijn ingeschreven, zijn kiesgerechtigd voor de deelnemersraad en kunnen zich
      daarvoor verkiesbaar stellen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.2.5
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de leden, voormalige leden en kandidaat-leden van de deelnemersraad niet
      uit hoofde van hun lidmaatschap of vroegere lidmaatschap daarvan, dan wel hun kandidatuur voor dat lidmaatschap,
      worden benadeeld in hun positie met betrekking tot de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.2.6
    text: |-
      De deelnemersraad kiest uit zijn midden een voorzitter en een of meer plaatsvervangende voorzitters. De voorzitter,
      of bij diens verhindering een plaatsvervangende voorzitter, vertegenwoordigt de deelnemersraad in rechte.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.2
  - number: 8a.1.3.1
    text: |-
      Indien ten minste 25 ouders van deelnemers van een regionaal opleidingencentrum daarom verzoeken, stelt het bevoegd
      gezag een ouderraad in. Indien van de eerste volzin gebruik wordt gemaakt, legt het bevoegd gezag de bevoegdheden
      van de ouderraad vast in het medezeggenschapsstatuut, na overleg met de ouders die het verzoek hebben ingediend. Op
      een ouderraad als bedoeld in de eerste volzin, is [artikel 8a.1.2][ref1], met uitzondering van het eerste lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.3.2
    text: |-
      Aan een agrarisch opleidingscentrum en aan een scholengemeenschap als bedoeld in [artikel 2.6, eerste lid][ref1],
      is een ouderraad verbonden. Een ouderraad als bedoeld in de eerste volzin, behartigt in het bijzonder de belangen
      van de deelnemers in de leeftijd tot 18 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.1.3.3
    text: |-
      Indien een school voor voortgezet onderwijs als bedoeld in de Wet op het voortgezet onderwijs zich met een
      regionaal opleidingencentrum verenigt tot een scholengemeenschap als bedoeld in [artikel 2.6, eerste lid][ref1],
      vormt het in de [Wet medezeggenschap op scholen][ref2] bedoelde, uit en door de ouders gekozen deel
      van de medezeggenschapsraad van die school voor voortgezet onderwijs de eerste ouderraad van de
      scholengemeenschap. Indien een school voor middelbaar algemeen voortgezet onderwijs als bedoeld in
      [artikel 9 van de Wet op het voortgezet onderwijs][ref3] zich met een agrarisch opleidingscentrum verenigt tot een
      scholengemeenschap als bedoeld in artikel 2.6, eerste lid, vormen de ouderraad van het agrarisch opleidingscentrum,
      bedoeld in het tweede lid, en het in de Wet medezeggenschap op scholen bedoelde, uit en door de ouders gekozen
      deel van de medezeggenschapsraad van die school voor middelbaar algemeen voortgezet onderwijs gezamenlijk de eerste
      ouderraad van de scholengemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020685
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020685
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '9'
  - number: 8a.1.3.4
    text: |-
      Het bevoegd gezag legt de bevoegdheden van een ouderraad vast in het medezeggenschapsstatuut. Voor de vaststelling
      is [artikel 8a.2.2, derde lid, aanhef en onderdeel a][ref1], van overeenkomstige toepassing op een ouderraad. Op
      een ouderraad zijn [artikel 8a.2.1, vierde lid][ref2], en [titel 4][ref3] van dit hoofdstuk van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: 8a
  - number: 8a.1.4.1
    text: |-
      Het bevoegd gezag zorgt ervoor dat binnen de instelling een volwaardige, goed functionerende en effectieve
      medezeggenschap van deelnemers en, in voorkomende gevallen, ouders plaats kan vinden waarbij ten minste wordt
      voldaan aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.4
  - number: 8a.1.4.1.a
    text: |-
      de verkiezingen zijn zodanig geregeld dat deze kunnen leiden tot een deelnemersraad of, in voorkomende gevallen,
      een ouderraad die een representatieve vertegenwoordiging van deelnemers of ouders vormt;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.4
  - number: 8a.1.4.1.b
    text: |-
      de medezeggenschapsstructuren sluiten zo veel mogelijk aan bij de organisatiestructuur, besluitvormingsprocedures
      en verantwoordelijkheidsverdelingen binnen de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.4
  - number: 8a.1.4.2
    text: |-
      Het bevoegd gezag legt de inrichting van de medezeggenschap telkens voor een periode
      van ten hoogste vier jaren vast in een medezeggenschapsstatuut. Voor de vaststelling is
      [artikel 8a.2.2, derde lid, aanhef en onderdeel a][ref1], van overeenkomstige toepassing op de ondernemingsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.5.1
    text: |-
      Het bevoegd gezag stelt de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad ten minste
      eenmaal per jaar in de gelegenheid gezamenlijk de algemene gang van zaken in de instelling met hem te bespreken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.5
  - number: 8a.1.5.2
    text: |-
      Het bevoegd gezag, de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad komen voorts
      met elkaar bijeen indien daarom onder opgave van redenen door één of meer der raden wordt verzocht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.5
  - number: 8a.1.5.3
    text: |-
      In geval van een voornemen tot een fusie als bedoeld in [artikel 2.1.8][ref1] komen het bevoegd gezag, de
      deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad bijeen om dat voornemen te bespreken.
      De bespreking is gericht op het bereiken van overeenstemming. Indien overeenstemming wordt bereikt, wordt dit
      aangemerkt als instemming met het voornemen tot fusie. Bij het ontbreken van overeenstemming wordt dit aangemerkt
      als het onthouden van instemming. In het laatste geval kan elk van de deelnemers aan de bespreking het geschil
      voorleggen aan de geschillencommissie, bedoeld in [artikel 8a.4.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.5.4
    text: |-
      Indien geen overeenstemming wordt bereikt, hebben de deelnemersraad, de ondernemingsraad en, in voorkomende
      gevallen, de ouderraad elk afzonderlijk adviesrecht ten aanzien van het voornemen tot fusie, onverminderd het recht
      het geschil voor te leggen aan de in het vorige lid bedoelde geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.5
  - number: 8a.1.5.5
    text: |-
      Het bevoegd gezag stelt de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad in de
      gelegenheid om tijdig voorafgaand aan de gezamenlijke bijeenkomst, bedoeld in het derde lid, kennis te nemen van de
      opgestelde fusie-effectrapportage, bedoeld in [artikel 2.1.10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.1.6.1
    text: |-
      Het bevoegd gezag behoeft de voorafgaande instemming over de hoofdlijnen van de jaarlijkse begroting van een
      gezamenlijke vergadering van de deelnemersraad, de ondernemingsraad en, in voorkomende gevallen, de ouderraad,
      waarbij in elk geval aandacht wordt besteed aan de beoogde verdeling van de middelen over de beleidsterreinen
      onderwijs, huisvesting en beheer, investeringen en personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
  - number: 8a.1.6.2
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de voorschriften bij of krachtens deze wet, een reglement voor de
      gezamenlijke vergadering vast. [Artikelen 8a. 3.1, tweede lid, aanhef en onderdeel f, en derde lid][ref1], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.1.6.3
    text: 'Bij algemene maatregel van bestuur kunnen regels of nadere regels worden vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
  - number: 8a.1.6.3.a
    text: hetgeen wordt verstaan onder hoofdlijnen van de jaarlijkse begroting;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
  - number: 8a.1.6.3.b
    text: situaties waarin het instemmingsrecht, bedoeld in het eerste lid, niet wordt uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
  - number: 8a.1.6.3.c
    text: de termijn waarbinnen tot instemming of onthouding van de instemming moet worden besloten.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.1.6
  - number: 8a.2.1.1
    text: |-
      Het bevoegd gezag stelt de deelnemersraad ten minste twee maal per jaar in de gelegenheid de algemene gang van
      zaken in de instelling met hem te bespreken. Het bevoegd gezag en de deelnemersraad komen met elkaar bijeen, indien
      daarom onder opgave van redenen wordt verzocht door het bevoegd gezag of de deelnemersraad. De besprekingen worden
      namens het bevoegd gezag gevoerd door een lid van het college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.1
  - number: 8a.2.1.2
    text: |-
      De deelnemersraad is bevoegd tot bespreking van alle aangelegenheden, de instelling betreffende. Hij is bevoegd
      over deze aangelegenheden aan het bevoegd gezag voorstellen te doen en standpunten kenbaar te maken, alsmede het
      bevoegd gezag te verplichten daarover een standpunt in te nemen en bekend te maken.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.1
  - number: 8a.2.1.3
    text: |-
      Het bevoegd gezag verstrekt de deelnemersraad desgevraagd tijdig alle inlichtingen die deze voor de vervulling van
      zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.1
  - number: 8a.2.1.4
    text: |-
      Het bevoegd gezag draagt zorg voor de voorzieningen die de deelnemersraad voor de vervulling van zijn taak
      redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.1
  - number: 8a.2.1.5
    text: |-
      De deelnemersraad doet jaarlijks schriftelijk verslag van zijn werkzaamheden en draagt er zorg voor dat alle bij de
      instelling betrokkenen van het verslag kennis kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.1
  - number: 8a.2.2.1
    text: 'De deelnemersraad heeft de volgende bijzondere bevoegdheden:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.1.a
    text: het verlenen van instemming aan een door het bevoegd gezag voorgenomen beslissing als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.1.b
    text: het uitbrengen van advies over een door het bevoegd gezag voorgenomen beslissing als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.2
    text: |-
      De bijzondere bevoegdheden zijn niet van toepassing, voor zover de desbetreffende aangelegenheid voor de instelling
      reeds inhoudelijk is geregeld in een bij of krachtens wet gegeven voorschrift.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3
    text: |-
      De deelnemersraad heeft instemmingsbevoegdheid met betrekking tot voorgenomen beslissingen van het bevoegd gezag
      ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.a
    text: het medezeggenschapsstatuut;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.b
    text: het deelnemersstatuut en de huisregels voor deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.c
    text: de beroeps- en klachtenregelingen voor deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.d
    text: |-
      de hoogte en de besteding van de vrijwillige ouder- of deelnemerbijdrage, alsmede de wijze waarop deze bijdrage
      tussen deelnemer en bevoegd gezag wordt overeengekomen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.e
    text: de wijze waarop informatie wordt gegeven over de inhoud, planning en organisatie van het onderwijs en de examens;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.f
    text: de besteding van stagefondsen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.g
    text: de model-onderwijsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.h
    text: de model-praktijkovereenkomst;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.i
    text: het beleid met betrekking tot toelating, schorsing en verwijdering van deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.j
    text: |-
      de wijze van vastleggen van studievorderingen van deelnemers en in dat verband het beleid met betrekking tot
      bescherming van de privacy van deelnemers;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.k
    text: de regels op het gebied van veiligheid, gezondheid en welzijn voor zover deze de deelnemers betreffen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.3.l
    text: |-
      het reglement voor de deelnemersraad, met inachtneming van [artikel 8a.3.1, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.2.2.3.m
    text: |-
      het onderwijsprogramma indien dit minder uren als bedoeld in [artikel 7.2.7, derde of vierde lid][ref1], omvat;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8a.2.2.3.n
    text: |-
      het beleid met betrekking tot het beperkt en beheersbaar houden van de middelen die van de deelnemers worden
      gevraagd voor schoolkosten die door het bevoegd gezag noodzakelijk worden bevonden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4
    text: |-
      De deelnemersraad heeft adviesbevoegdheid met betrekking tot voorgenomen beslissingen van het bevoegd gezag ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.a
    text: |-
      inkrimping, uitbreiding, fusie en overdracht van de instelling, beëindiging van opleidingen en samenwerking met
      andere instellingen bij de uitvoering van opleidingen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.b
    text: verandering van de grondslag van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.c
    text: werkomstandigheden en voorzieningen voor deelnemers binnen de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.d
    text: het beleid met betrekking tot intake- en assessmentprocedures;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.e
    text: de rol van deelnemers bij de interne kwaliteitszorg en zelfevaluatie;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.4.f
    text: |-
      de te verstrekken informatie aan aspirant-deelnemers van beroepsopleidingen, bedoeld in [artikel 6.1.3a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 8a.2.2.4.g
    text: |-
      de regeling die het bevoegd gezag vaststelt voor de selectiecriteria en de selectieprocedure, bedoeld in
      [artikel 8.2.2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8a.2.2.5
    text: |-
      In het reglement kunnen andere, nader te omschrijven onderwerpen worden opgenomen ten aanzien waarvan een van de
      bijzondere bevoegdheden aan de deelnemersraad wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2.6
    text: |-
      De deelnemersraad heeft adviesbevoegdheid met betrekking tot een voorgenomen beslissing van de raad van toezicht
      ten aanzien van de profielen, bedoeld in [artikel 9.1.4, vijfde lid][ref1]. De deelnemersraad heeft eveneens
      adviesbevoegdheid met betrekking tot benoeming of ontslag van de leden van het college van bestuur, bedoeld in
      artikel 9.1.4, derde lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 8a.2.2.7
    text: |-
      Alvorens de raad van toezicht tot benoeming of ontslag van een lid van het college van bestuur overgaat, wordt de
      deelnemersraad vertrouwelijk gehoord over de voorgenomen beslissing tot benoeming of ontslag. Het horen geschiedt
      op een zodanig tijdstip dat het van wezenlijke invloed kan zijn op de besluitvorming.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2
  - number: 8a.2.2a
    text: |-
      Indien een te nemen beslissing op grond van [artikel 8a.2.2][ref1] vooraf voor advies dient te worden voorgelegd
      aan de deelnemersraad, draagt het bevoegd gezag er zorg voor dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.2.2a.a
    text: advies wordt gevraagd op een zodanig tijdstip dat het advies van wezenlijke invloed kan zijn op de besluitvorming,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2a
  - number: 8a.2.2a.b
    text: |-
      de deelnemersraad in de gelegenheid wordt gesteld met het bevoegd gezag overleg te voeren voordat dit advies wordt
      uitgebracht,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2a
  - number: 8a.2.2a.c
    text: |-
      de deelnemersraad zo spoedig mogelijk schriftelijk in kennis wordt gesteld van de wijze waarop aan het uitgebrachte
      advies gevolg wordt gegeven, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2a
  - number: 8a.2.2a.d
    text: |-
      de deelnemersraad, indien het bevoegd gezag het advies niet of niet geheel wil volgen, in de gelegenheid wordt
      gesteld nader overleg met het bevoegd gezag te voeren alvorens de beslissing definitief wordt genomen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.2a
  - number: 8a.2.3
    text: |-
      De deelnemersraad neemt voorafgaand aan de uitoefening van de adviesbevoegdheid, bedoeld in
      [artikel 8a.2.2, vierde lid, onder a][ref1], voor zover het betreft fusie en overdracht van de instelling, kennis
      van de opgestelde fusie-effectrapportage, bedoeld in [artikel 2.1.10, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8a.3.1.1
    text: |-
      Het bevoegd gezag stelt, met inachtneming van de voorschriften in dit hoofdstuk, voor een periode van telkens vijf
      jaar een reglement voor de deelnemersraad vast. Het reglement kan tussentijds worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2
    text: 'In het reglement worden in ieder geval regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.a
    text: het aantal leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.b
    text: de wijze en organisatie van de verkiezingen van de leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.c
    text: de zittingsduur van de leden van de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.d
    text: |-
      de wijze waarop wordt gewaarborgd dat de leden van de deelnemersraad hun uit het lidmaatschap van de deelnemersraad
      voortvloeiende verplichtingen nakomen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.e
    text: |-
      de voorstellen van de deelnemersraad, bedoeld in [artikel 8a.2.1, tweede lid][ref1], waarover het bevoegd gezag een
      standpunt inneemt, en de termijnen daarvoor;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.3.1.2.f
    text: het verschaffen van informatie door het bevoegd gezag aan de deelnemersraad;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.g
    text: |-
      de termijnen binnen welke tot instemming of onthouding van instemming moet worden besloten, en de termijnen binnen
      welke advies moet worden uitgebracht;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.2.h
    text: het toekennen van eventuele andere bevoegdheden aan de deelnemersraad.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.3.1.3
    text: |-
      Het bevoegd gezag legt het reglement, alsmede elke wijziging ervan, als voorstel aan de deelnemersraad voor
      en stelt het slechts vast voor zover het voorstel de instemming van twee derden van het aantal leden van de
      deelnemersraad heeft verworven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.3.1
  - number: 8a.4.1.1
    text: |-
      Er is een landelijke geschillencommissie medezeggenschap, waarbij elke instelling is aangesloten. De commissie
      bestaat uit drie leden, waaronder de voorzitter, en drie plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.1
  - number: 8a.4.1.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap, in overeenstemming met Onze Minister van Economische Zaken,
      benoemt de leden en plaatsvervangende leden voor vier jaar. Zij zijn een keer herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.1
  - number: 8a.4.1.3
    text: |-
      Een lid en een plaatsvervangend lid worden benoemd op bindende voordracht van vertegenwoordigers van de
      gezamenlijke bevoegde gezagsorganen van de instellingen en een lid en een plaatsvervangend lid op bindende
      voordracht van vertegenwoordigers van de deelnemersraden van de instellingen. Deze twee leden doen een bindende
      voordracht voor het derde lid, tevens voorzitter, en diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.1
  - number: 8a.4.1.4
    text: |-
      Indien sprake is van een geschil als bedoeld in [artikel 8a.4.2, onderdeel a][ref1], voor zover het betreft
      het ontbreken van de vereiste instemming van de ondernemingsraad met het medezeggenschapsstatuut, wordt voor
      de duur van behandeling van dat geschil een lid benoemd op bindende voordracht van vertegenwoordigers van de
      ondernemingsraden van de instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.1.5
    text: |-
      De leden en de plaatsvervangende leden mogen geen deel uitmaken van het bevoegd gezag of van de deelnemersraad van
      een instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.1
  - number: 8a.4.2
    text: 'De commissie neemt kennis van de volgende geschillen:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.2
  - number: 8a.4.2.a
    text: |-
      op verzoek van het bevoegd gezag of van de deelnemersraad, indien het bevoegd gezag ten aanzien van een voorgenomen
      beslissing als bedoeld in [artikel 8a.2.2, derde lid][ref1], niet de vereiste instemming heeft verworven;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.2.b
    text: |-
      op verzoek van het bevoegd gezag of van de deelnemersraad, indien het bevoegd gezag en de raad van mening
      verschillen over de interpretatie van hoofdstuk 8a dan wel het reglement;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.2
  - number: 8a.4.2.c
    text: |-
      op verzoek van de deelnemersraad, indien het bevoegd gezag een beslissing heeft genomen waarover ingevolge
      [artikel 8a.2.2, vierde lid][ref1], of [artikel 8a.5.1][ref2] juncto artikel 8a.2.2 advies door de deelnemersraad
      is uitgebracht, het bevoegd gezag daarbij het uitgebrachte advies niet of niet geheel heeft gevolgd en de
      deelnemersraad van oordeel is dat daardoor de belangen van de deelnemers, van de deelnemersraad of van de
      instelling ernstig worden geschaad.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.1
    text: |-
      Voor zover aan een voorgenomen beslissing van het bevoegd gezag als bedoeld in [artikel 8a.2.2, derde lid][ref1],
      de vereiste instemming is onthouden, deelt het bevoegd gezag aan de deelnemersraad dan wel de deelnemersraad aan
      het bevoegd gezag binnen drie maanden mede of het voorstel wordt voorgelegd aan de commissie. Indien een dergelijke
      mededeling niet binnen drie maanden wordt gedaan, vervalt het voorstel. Het voorstel vervalt eveneens, indien door
      het bevoegd gezag aan de deelnemersraad dan wel door de deelnemersraad aan het bevoegd gezag is meegedeeld dat het
      voorstel wordt voorgelegd aan de commissie en het voorstel niet binnen zes weken na het doen van deze mededeling
      daadwerkelijk wordt voorgelegd aan de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.2
    text: |-
      Indien het bevoegd gezag een verzoek doet als bedoeld in [artikel 8a.4.2, onderdeel a][ref1], geschiedt dit onder
      overlegging van de door het bevoegd gezag gemaakte afweging van de belangen die daarbij voor het bevoegd gezag aan
      de orde zijn, en stelt de commissie de deelnemersraad in de gelegenheid om zijn argumenten voor het onthouden van
      zijn instemming bij de commissie naar voren te brengen. Indien de deelnemersraad een verzoek doet als bedoeld in
      artikel 8a.4.2, onderdeel a, wordt het verzoek met redenen omkleed en stelt de commissie het bevoegd gezag in de
      gelegenheid om zijn argumenten voor handhaving van het voorstel bij de commissie naar voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.3
    text: |-
      De commissie is bevoegd een bemiddelingsvoorstel aan het bevoegd gezag en de deelnemersraad voor te leggen, tenzij
      het bevoegd gezag of de deelnemersraad te kennen geeft daarop geen prijs te stellen. Indien de commissie van deze
      bevoegdheid geen gebruik maakt of indien haar voorstel niet de instemming verwerft van zowel het bevoegd gezag als
      de deelnemersraad, stelt zij vast, indien het betreft een geschil als bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
  - number: 8a.4.3.3.a
    text: |-
      artikel 8a.4.2, onderdeel a: of de deelnemersraad in redelijkheid tot het onthouden van instemming heeft
      kunnen komen of dat sprake is van bepaalde zwaarwegende omstandigheden die het voorstel van het bevoegd gezag
      rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
  - number: 8a.4.3.3.b
    text: 'artikel 8a.4.2, onderdeel b: welke interpretatie aan dit hoofdstuk of het reglement moet worden gegeven;'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
  - number: 8a.4.3.3.c
    text: |-
      artikel 8a.4.2, onderdeel c: of het bevoegd gezag bij afweging van betrokken belangen in redelijkheid tot de
      beslissing heeft kunnen komen en of de beslissing al dan niet in stand kan blijven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
  - number: 8a.4.3.4
    text: |-
      Voor zover de commissie van oordeel is dat het voorstel van het bevoegd gezag niet in redelijkheid tot stand is
      gekomen, geeft zij aan hoe het voorstel moet worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
  - number: 8a.4.3.5
    text: |-
      Onverminderd [artikel 8a.4.4][ref1] is een vaststelling van de commissie als bedoeld in het derde lid, voor het
      bevoegd gezag en de deelnemersraad bindend. Zo nodig neemt het bevoegd gezag met inachtneming van de vaststelling
      van de commissie een nieuwe beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.3.6
    text: |-
      Indien de ondernemingsraad ten aanzien van een voorstel tot vaststelling of wijziging van het
      medezeggenschapsstatuut zijn instemming heeft onthouden, zijn de [artikelen 27, vierde tot en met zesde lid][ref1],
      en [36 van de Wet op de ondernemingsraden][ref2] van overeenkomstige toepassing, met dien verstande dat de
      bevoegdheden van de bedrijfscommissie, bedoeld in het genoemde artikel 36, worden uitgeoefend door de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel36
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.3
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '36'
  - number: 8a.4.4.1
    text: |-
      De deelnemersraad kan in rechte optreden indien de vordering strekt tot naleving door het bevoegd gezag van
      de verplichtingen jegens de deelnemersraad, voortvloeiend uit [hoofdstuk 8a][ref1]. Tegen een uitspraak van de
      commissie op grond van [artikel 8a.4.3][ref2] staat beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.4.2
    text: |-
      Een vordering of beroep als bedoeld in het eerste lid, wordt ingediend bij de ondernemingskamer van het gerechtshof
      Amsterdam.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
  - number: 8a.4.4.3
    text: |-
      Het beroep wordt ingediend bij beroepschrift binnen een maand nadat het bevoegd gezag of de deelnemersraad van de
      uitspraak op de hoogte is gesteld. De wederpartij wordt van het beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
  - number: 8a.4.4.4
    text: |-
      Het beroep kan uitsluitend worden ingesteld op de grond dat de commissie een onjuiste toepassing heeft gegeven aan
      de wet.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
  - number: 8a.4.4.5
    text: Tegen een uitspraak van de ondernemingskamer kan geen beroep in cassatie worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
  - number: 8a.4.4.6
    text: |-
      In afwijking van [artikel 237 van het Wetboek van Burgerlijke Rechtsvordering][ref1] en
      [artikel 8:75 van de Algemene wet bestuursrecht][ref2] kan de deelnemersraad niet in de proceskosten worden
      veroordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '237'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 8a.4.4.7
    text: |-
      In dit artikel wordt onder «uitspraak» verstaan: een vaststelling of oordeel van de commissie als bedoeld in
      [artikel 8a.4.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.5
    text: |-
      Deze titel is van overeenkomstige toepassing op het advies, bedoeld in
      [artikel 8a.2.2, zesde lid, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.6
    text: |-
      Deze titel is van overeenkomstige toepassing op geschillen die voortvloeien uit [artikel 8a.1.6][ref1], met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.4.6.a
    text: 'onder «deelnemersraad» wordt verstaan: de gezamenlijke vergadering;'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.6
  - number: 8a.4.6.b
    text: |-
      voor zover de geschillencommissie de behandeling van het geschil niet voor 1 januari van het jaar waarop de
      begroting betrekking heeft, heeft afgerond, het bevoegd gezag totdat de geschillencommissie een besluit heeft
      genomen, voor het doen van uitgaven in dat jaar kan beschikken over ten hoogste vier twaalfde gedeelten van de
      bedragen die in de overeenkomstige begrotingsonderdelen van het voorgaande jaar waren opgenomen;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.6
  - number: 8a.4.6.c
    text: |-
      indien beroep is ingesteld tegen een uitspraak van de geschillencommissie en de ondernemingskamer op 1 januari
      van het jaar, waarop de begroting betrekking heeft, nog geen uitspraak heeft gedaan, het bevoegd gezag, totdat de
      ondernemingskamer uitspraak heeft gedaan of als de uitspraak van de ondernemingskamer leidt tot het opstellen van
      een nieuwe begroting, totdat een nieuwe begroting is vastgesteld, voor het doen van uitgaven kan beschikken over de
      bedragen die daarvoor zijn geraamd in de begroting waarover de ondernemingskamer oordeelt of heeft geoordeeld.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.4.6
  - number: 8a.5.1.1
    text: |-
      Op gronden die verband houden met de godsdienstige of levensbeschouwelijke overtuiging die aan de instelling
      ten grondslag ligt, kan het bevoegd gezag in het reglement een aan de deelnemersraad toekomend instemmingsrecht
      omzetten in een adviesrecht. In afwijking van [artikel 8a.2.2, derde lid, onderdeel l][ref1], juncto
      [artikel 8a.3.1][ref2] stelt het bevoegd gezag het reglement, daaronder elke wijziging ervan mede begrepen, slechts
      vast nadat het hierover advies heeft ontvangen van de deelnemersraad. Het bevoegd gezag kan slechts toepassing
      geven aan de eerste volzin indien een meerderheid van twee derden van de deelnemers dat ondersteunt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.5.1.2
    text: |-
      De mogelijkheid tot afwijking, bedoeld in het eerste lid, komt te vervallen indien de gronden waarop zij berustte
      niet langer aanwezig zijn dan wel indien zij niet langer worden ondersteund door een meerderheid van twee derden
      van de deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.5.1
  - number: 8a.5.1.3
    text: |-
      Het bevoegd gezag toetst elke vijf jaar de stand van zaken met betrekking tot de gronden van de afwijking en de
      ondersteuning ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8a.5.1
  - number: 9.1.1
    text: |-
      Bijzondere instellingen worden in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid niet zijnde
      een rechtspersoon als bedoeld in [artikel 2:1 van het Burgerlijk Wetboek][ref1], die zich blijkens de statuten
      of reglementen het geven van onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst
      te beogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.1.2.1
    text: |-
      Het bevoegd gezag van een openbare instelling kan de instandhouding van die instelling overdragen aan een ander
      orgaan dat tot de instandhouding van een openbare instelling bevoegd is.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.2
  - number: 9.1.2.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte
      van levering als bedoeld in [artikel 3:89 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen het personeel in gelijke betrekkingen aan de instelling aanstelt met
      ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 9.1.2.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de instelling,
      onverminderd hetgeen verder voor de overgang naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.2
  - number: 9.1.2.4
    text: |-
      Van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken kan Onze
      Minister in bijzondere omstandigheden ontheffing verlenen. Onze Minister besluit binnen zes maanden na ontvangst
      van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.2
  - number: 9.1.3.1
    text: |-
      De rechtspersoon die een bijzondere instelling in stand houdt, kan de instandhouding van die instelling overdragen
      aan een andere rechtspersoon die voldoet aan [artikel 9.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.2
    text: |-
      Op deze overdracht is [artikel 9.1.2, tweede tot en met vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.3
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere instelling in stand houdt, wordt in de splitsingsakte bepaald dat de voortbestaande splitsende
      rechtspersoon de instelling in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding
      van de instelling overgaat. In het laatste geval is [artikel 9.1.2, tweede tot en met vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.4.1
    text: Een bijzondere instelling heeft een college van bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.2
    text: |-
      Een lid van een raad van toezicht heeft geen directe belangen bij de instelling. Een lid van het college van
      bestuur kan niet tevens lid zijn van het college van bestuur van een andere instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3
    text: |-
      De raad van toezicht houdt, met het oog op de taken van de desbetreffende instelling, genoemd in
      [artikel 1.3.5][ref1], toezicht op de uitvoering van werkzaamheden en de uitoefening van bevoegdheden door het
      college van bestuur en staat dit college met raad ter zijde. De raad van toezicht is in elk geval belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '2'
  - number: 9.1.4.3.a
    text: het benoemen, schorsen, ontslaan en vaststellen van de beloning van de leden van het college van bestuur;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3.b
    text: |-
      het goedkeuren van het bestuursreglement en in voorkomend geval een samenwerkingsovereenkomst als bedoeld in
      [artikel 8.6.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 9.1.4.3.c
    text: |-
      het goedkeuren van de begroting, de jaarrekening, het bestuursverslag en, indien van toepassing, het strategisch
      meerjarenplan van de instelling;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3.d
    text: |-
      het toezien op de naleving van wettelijke verplichtingen en de omgang met de branchecode, bedoeld in
      [artikel 2.5.4, eerste lid][ref1], door het college van bestuur;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.1.4.3.e
    text: |-
      het toezien op de rechtmatige verwerving en op de doelmatige en rechtmatige bestemming en aanwending van de
      middelen van de instelling verkregen op grond van de [artikelen 2.2.1][ref1], [2.2.3][ref2] en [2.3.4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 9.1.4.3.f
    text: |-
      het aanwijzen van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] die verslag uitbrengt aan de raad, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 9.1.4.3.g
    text: |-
      het jaarlijks afleggen van verantwoording over de uitvoering van de taken en de uitoefening van de bevoegdheden,
      bedoeld onder a tot en met f, in het bestuursverslag van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3a
    text: |-
      Voor het benoemen van een lid van het college van bestuur stelt de raad van toezicht een sollicitatiecommissie in
      waarvan in elk geval deel uitmaken:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3a.a
    text: een lid van of namens de ondernemingsraad, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.3a.b
    text: een lid van of namens de deelnemersraad, of, in voorkomende gevallen, van of namens de ouderraad.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.4
    text: Het college van bestuur voorziet de raad van toezicht van onafhankelijke administratieve ondersteuning.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.5
    text: |-
      De samenstelling, taken en bevoegdheden van de raad van toezicht zijn zodanig dat de raad een deugdelijk en
      onafhankelijk toezicht kan uitoefenen. De leden van de raad van toezicht hebben daarin zitting op persoonlijke
      titel en oefenen hun functie uit zonder last of ruggespraak. De benoeming van de leden van het college van bestuur
      en van de raad van toezicht geschiedt op basis van vooraf openbaar gemaakte profielen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.6
    text: |-
      De statuten van de rechtspersoon die een bijzondere instelling in stand houdt, voorzien in een regeling die
      waarborgt dat de ondernemingsraad invloed kan uitoefenen op de samenstelling van de raad van toezicht van de
      desbetreffende instelling. De bedoelde regeling houdt ten minste in dat de ondernemingsraad in de gelegenheid wordt
      gesteld om
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.6.a
    text: aan de raad van toezicht advies uit te brengen over de profielen, bedoeld in het vijfde lid, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.6.b
    text: een bindende voordracht te doen voor één lid van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4.7
    text: |-
      De statuten van de rechtspersoon die een bijzondere instelling in stand houdt, voorzien in een regeling die
      waarborgt dat de raad van toezicht de ondernemingsraad vertrouwelijk hoort over een voorgenomen beslissing
      tot benoeming of ontslag van een lid van het college van bestuur, niet zijnde bestuurder in de zin van de
      [Wet op de ondernemingsraden][ref1]. Het horen geschiedt op een zodanig tijdstip dat het van wezenlijke invloed kan
      zijn op de besluitvorming.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
    references:
      - id: ref1
        bwb_id: BWBR0002747
  - number: 9.1.4.8
    text: |-
      De raad van toezicht pleegt ten minste tweemaal per jaar overleg met de deelnemersraad en de ondernemingsraad van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4
  - number: 9.1.4a.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister de raad van
      toezicht een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor
      zij wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.2
    text: 'Onder wanbeheer wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.2.a
    text: financieel wanbeleid;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.2.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met de [artikelen 1.3.6][ref1] en [1.3.6a][ref2], maatregelen
      te treffen die noodzakelijk zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de
      instelling en om te voorkomen dat de kwaliteit van het stelsel van beroepsonderwijs en educatie in gevaar komt;.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 9.1.4a.2.c
    text: |-
      ongerechtvaardigde verrijking, al dan niet beoogd, van de rechtspersoon die de instelling in stand houdt, een
      bestuurder of toezichthouder zelf dan wel een derde;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.2.d
    text: |-
      onrechtmatig handelen waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen in
      strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van de rechtspersoon die de
      instelling in stand houdt, een bestuurder of toezichthouder zelf dan wel een derde, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.2.e
    text: |-
      het in ernstige mate verwaarlozen van de zorg voor wat door redelijkheid en billijkheid wordt gevorderd in de
      omgang met betrokkenen binnen de instelling, waaronder wordt verstaan intimidatie of bedreiging van personeel of
      studenten door een bestuurder of toezichthouder.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.3
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.4
    text: Een aanwijzing bevat de termijn waarbinnen de raad van toezicht aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.5
    text: 'Voordat Onze Minister een aanwijzing als bedoeld in het eerste lid geeft:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.4a.5.a
    text: |-
      heeft de inspectie een onderzoek als bedoeld in [artikel 15 van de Wet op het onderwijstoezicht][ref1] verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel15
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '15'
  - number: 9.1.4a.5.b
    text: |-
      heeft de inspectie daarover een rapport als bedoeld in
      [artikel 20, eerste lid, van de Wet op het onderwijstoezicht][ref1] uitgebracht; en


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel20
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: '20'
  - number: 9.1.4a.5.c
    text: |-
      stelt Onze Minister de raad van toezicht vier weken in de gelegenheid zijn zienswijze met betrekking tot de
      voorgenomen aanwijzing naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.4a
  - number: 9.1.5
    text: |-
      Het bevoegd gezag van een openbare instelling kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden
      overdragen aan een alsdan in te stellen college van bestuur. [Artikel 9.1.4, eerste, tweede en vijfde lid][ref1],
      en [artikel 9.1.7, eerste en tweede lid][ref2], zijn in dat geval van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.7.1
    text: 'Het college van bestuur stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.a
    text: |-
      de verantwoordelijkheidsverdeling tussen het college van bestuur en de raad van toezicht en de wijze waarop
      conflicten tussen beide organen worden geregeld;
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.b
    text: de wijze waarop het college van bestuur zijn taken en bevoegdheden uitoefent, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.c
    text: 'indien de instelling een of meer organisatorische eenheden omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.c.1°
    text: de organisatorische eenheden die de instelling omvat,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.c.2°
    text: de taken en bevoegdheden die zijn op- of overgedragen aan het hoofd van de desbetreffende eenheid,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.c.3°
    text: de verhouding van het hoofd van de desbetreffende eenheid tot het college van bestuur en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.1.c.4°
    text: de samenstelling, de wijze van benoeming en de werkwijze van het hoofd van de desbetreffende eenheid.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.2
    text: |-
      Het college van bestuur zendt het bestuursreglement, alsmede elke wijziging daarvan, zo spoedig mogelijk aan Onze
      minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.7.3
    text: |-
      Indien de statuten van een bijzondere instelling de onderwerpen, bedoeld in het eerste lid, onder a en c regelen,
      is regeling daarvan in het bestuursreglement niet noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.7
  - number: 9.1.8
    text: |-
      In afwijking van [artikel 9.1.4, eerste lid][ref1], kan een functionele scheiding tussen bestuur en
      toezicht worden aangebracht binnen het bestuur van de rechtspersoon waarvan de instelling uitgaat. De
      [artikelen 9.1.4, tweede tot en met vijfde lid][ref2], [9.1.4a][ref3] en [9.1.7][ref4] zijn van overeenkomstige
      toepassing. Het bevoegd gezag draagt zorg voor een deugdelijke scheiding tussen bestuur en toezicht, vermeldt
      in de statuten of het bestuursreglement de wijze waarop deze wordt gewaarborgd en vermeldt jaarlijks in het
      bestuursverslag, bedoeld in [artikel 2.5.4][ref5], de redenen voor de afwijking.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 9.2.1.1
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven is een rechtspersoon met
      volledige rechtsbevoegdheid zonder winstoogmerk niet zijnde een rechtspersoon als bedoeld in
      [artikel 1, Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.2.1.2
    text: |-
      In het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven en de organen, ingesteld ter
      uitwerking van het vierde lid, eerste volzin, participeren vertegenwoordigers van het beroepsonderwijs en het
      bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.2.1
  - number: 9.2.1.3
    text: |-
      De voorzitter van het bestuur van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven en diens
      plaatsvervanger worden op voordracht van vertegenwoordigers van het beroepsonderwijs en van het bedrijfsleven
      benoemd door Onze Minister, voor een periode van ten hoogste vier jaar. Zij kunnen ten hoogste eenmaal worden
      herbenoemd voor een periode van ten hoogste vier jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.2.1
  - number: 9.2.1.4
    text: |-
      De statuten van de Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven bevatten een regeling voor de
      betrokkenheid van het beroepsonderwijs en het bedrijfsleven bij de totstandkoming van voorstellen voor
      kwalificatiedossiers en de criteria, bedoeld in [artikel 7.2.10, eerste lid][ref1], en bij de uitvoering van de
      overige taken van de organisatie. De regeling kan nader worden uitgewerkt in een bestuursreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 9.2.1.5
    text: De statuten en het bestuursreglement alsmede wijzigingen daarvan behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel9.2.1
  - number: '10.2'
    text: |-
      Indien de uitspraak op een beroep als bedoeld in artikel 2 van de bij de Algemene wet bestuursrecht behorende
      [Bevoegdheidsregeling bestuursrechtspraak][ref1] strekt tot onderscheidenlijk het toekennen van de rechten,
      genoemd in [artikel 1.3.1][ref2], diploma-erkenning als bedoeld in de [artikelen 1.4.1][ref3] of [1.4a.1][ref4],
      examinering als bedoeld in [artikel 1.6.1][ref5], of registratie in het Centraal register, treden de gevolgen
      daarvan in met ingang van het studiejaar dat aanvangt in het jaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 11.1.1
    text: |-
      Indien het bevoegd gezag van een instelling in strijd handelt met het bepaalde bij of krachtens deze wet dan wel
      indien de raad van toezicht een aanwijzing als bedoeld in [artikel 9.1.4a][ref1] niet opvolgt, kan Onze Minister
      bepalen dat de rijksbijdrage, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel
      opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 11.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een instelling in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 11.1.3
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het eerste
      of tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.1
  - number: 11.1.4
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing indien het bevoegd gezag van een agrarisch
      opleidingscentrum ten aanzien van het voorbereidend beroepsonderwijs dat in de instelling wordt verzorgd, in strijd
      handelt met het bepaalde bij of krachtens de [Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 11.2.1
    text: |-
      Het is anderen dan de instellingen die daartoe ingevolge deze wet gerechtigd zijn, verboden onderwijs aan te
      bieden of te verzorgen, dan wel examinering te verzorgen, onder de naam van een in het Centraal register opgenomen
      beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.2
  - number: 11.2.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.2
  - number: 11.2.3
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11.2
  - number: 11a.1.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het beroepsonderwijs kan bij
      wijze van experiment bij algemene maatregel van bestuur worden afgeweken van: - [titel 2 van hoofdstuk 2][ref1],
        - [hoofdstuk 6][ref2], en
        - [hoofdstuk 7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 11a.1.2
    text: 'In geval van toepassing van het eerste lid worden bij algemene maatregel van bestuur in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.2.b
    text: |-
      op welke wijze van welke artikelen van de in het eerste lid genoemde hoofdstukken, titels of paragrafen wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.4
    text: |-
      Een experiment duurt ten hoogste zes jaar, tenzij een langere duur gezien de bijzondere aard van het experiment
      noodzakelijk is. Alsdan wordt de duur van het experiment op ten hoogste acht jaar bepaald. Indien, voordat een
      experiment is afgelopen, een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten
      in een structurele wettelijke regeling, kan Onze Minister het experiment verlengen tot het tijdstip waarop het
      wetsvoorstel tot wet is verheven en in werking treedt.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.6
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, kan bij wijze van experiment tevens worden
      afgeweken van:
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
  - number: 11a.1.6.a
    text: |-
      [artikel 1 van de Leerplichtwet 1969][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '1'
  - number: 11a.1.6.b
    text: |-
      [artikel 1 de Les- en cursusgeldwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '1'
  - number: 11a.1.6.c
    text: |-
      [artikel 1.1 van de Wet studiefinanciering 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel11a.1
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '1'
  - number: 11a.1.6.d
    text: |-
      [artikel 1.1 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Artikel1
