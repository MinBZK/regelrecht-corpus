      Onverminderd [artikel 6.2.2][ref1] beëindigt Onze Minister de registratie bij een kwalificatie van een niet uit
      ’s Rijks kas bekostigde instelling, indien het bevoegd gezag te kennen geeft dat de instelling de desbetreffende
      beroepsopleiding niet langer zal verzorgen. Onverminderd [artikel 6.3.2][ref2] beëindigt Onze Minister de
      registratie bij een kwalificatie van de examinering door een exameninstelling, indien het bevoegd gezag te kennen
      geeft dat de exameninstelling de examinering van de desbetreffende beroepsopleiding niet langer zal verzorgen.


