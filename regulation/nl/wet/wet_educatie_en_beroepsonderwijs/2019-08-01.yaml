  - number: 12.1.1.1
    text: |-
      Het experiment leergang vm2, dat is onderverdeeld in zes leergangen van vier jaar die per opvolgend leerjaar zijn
      of worden gestart, wordt voor de toepassing van [artikel 11a.1, vierde lid][ref1], geacht te zijn gestart op
      1 augustus 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel11a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 11a
        hoofdstuk: 11a
  - number: 12.1.1.2
    text: |-
      [Artikel 11a.1, vierde lid][ref1], wordt ten aanzien van de duur van het experiment leergang vm2 zodanig toegepast
      dat een leerling die deelneemt aan een leergang die binnen de termijn van zes jaar is gestart, de leergang van vier
      jaar kan doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel11a
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel12.1.1
