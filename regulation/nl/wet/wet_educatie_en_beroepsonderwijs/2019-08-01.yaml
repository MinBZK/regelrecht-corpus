        paragraaf: '4'
  - number: 1.4a.2.1
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1, tweede lid][ref1], waarvoor wat betreft een
      opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in [artikel 7.3.1, eerste lid, onder a][ref2],
      toepassing is gegeven aan artikel 1.4a.1, eerste lid, kan, ten aanzien van genoemde opleiding, in afwijking van
      [artikel 8.1.1d, eerste volzin][ref3], in gevallen als geregeld in en met inachtneming van de voorschriften gegeven
      bij of krachtens [artikel 58a van de Wet op het voortgezet onderwijs][ref4] tot onderwijs- en examenvoorzieningen
      van de instelling toelaten zij die niet als deelnemer of examendeelnemer aan de instelling worden ingeschreven
      maar zijn ingeschreven als leerling aan een ingevolge [artikel 56 van de Wet op het voorgezet onderwijs][ref5]
      aangewezen school.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002399#Artikel58a
      [ref5]: https://wetten.overheid.nl/BWBR0002399#Artikel56
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel1.4a.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
