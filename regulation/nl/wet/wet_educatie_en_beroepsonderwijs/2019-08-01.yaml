        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.2.2
    text: |-
      In de ministeriële regeling kan onderscheid worden gemaakt naar groepen van deelnemers, dan wel kan worden bepaald
      dat de regeling niet van toepassing is op groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.2
  - number: 8.2.2a.1
    text: |-
      Indien de uitoefening van het beroep of de beroepen waarop een opleiding voorbereidt, dan wel de organisatie en de
      inrichting van het onderwijs, specifieke eisen stellen ten aanzien van kennis of vaardigheden die niet of niet in
      voldoende mate onderdeel zijn van het voortgezet onderwijs, bedoeld in de [Wet op het voortgezet onderwijs][ref1],
      of scholen en instellingen als bedoeld in de [Wet op de expertisecentra][ref2] respectievelijk specifieke
      eisen stellen ten aanzien van de eigenschappen van de deelnemer, kunnen bij ministeriële regeling opleidingen
      worden aangewezen die op daarbij aangegeven gronden eisen kunnen stellen in aanvulling op de eisen, bedoeld in
      [artikel 8.2.1][ref3] en [8.2.2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2019-08-01#Artikel8.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
