  - number: 10.2.1
    text: |-
      Indien de uitspraak op een beroep tegen een beschikking als bedoeld in de [artikelen 6.1.3][ref1], [6.1.6][ref2],
      [6.2.1][ref3], [6.3.1][ref4], [6.3.2][ref5], [6.4.2, vierde lid, derde volzin][ref6], en [6.5.1, tweede lid][ref7],
      juncto [6.4.2, vierde lid, derde volzin][ref8], strekt tot onderscheidenlijk het toekennen van de rechten, genoemd
      in [artikel 1.3.1][ref9], diploma-erkenning als bedoeld in [artikel 1.4.1, eerste lid][ref10], externe legitimering
      als bedoeld in [artikel 1.6.1, eerste lid][ref11], of registratie, treden de gevolgen daarvan in met ingang van het
      studiejaar dat aanvangt in het jaar waarin de uitspraak is gedaan.


