        paragraaf: '2'
  - number: 12.3.31.2
    text: |-
      Indien het in het eerste lid genoemd percentage van ten minste 25% resulteert in een gebroken aantal
      deelkwalificaties, wordt dat aantal rekenkundig afgerond.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.31
  - number: 12.3.32.1
    text: |-
      De [artikelen 8.1.1][ref1],[ 8.1.2][ref2] en [8.1.3][ref3] vinden voor het eerst toepassing ten aanzien van:


