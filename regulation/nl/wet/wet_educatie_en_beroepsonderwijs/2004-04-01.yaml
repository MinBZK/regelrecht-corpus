  - number: 1.2.1.1
    text: |-
      Educatie is gericht op de bevordering van de persoonlijke ontplooiing ten dienste van het maatschappelijk
      functioneren van volwassenen door de ontwikkeling van kennis, inzicht, vaardigheden en houdingen op een wijze die
      aansluit bij hun behoeften, mogelijkheden en ervaringen alsmede bij maatschappelijke behoeften. Waar mogelijk sluit
      de educatie aan op het ingangsniveau van het beroepsonderwijs. Educatie omvat niet activiteiten op het niveau van
      het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.2.1
  - number: 1.2.1.2
    text: |-
      Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen,
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de deelnemers en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.2.1
  - number: 1.3.1.1
    text: |-
      De daarvoor op grond van [artikel 2.1.3, eerste en tweede lid][ref1], in aanmerking komende regionale
      opleidingencentra, regionale opleidingencentra in een samenwerkingsverband en agrarische opleidingscentra, hebben
      ten behoeve van het verzorgen van beroepsonderwijs, voor zover het beroepsopleidingen betreft die op voet van
      [artikel 2.1.1][ref2] voor bekostiging in aanmerking komen, aanspraak op bekostiging uit ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.1.2
    text: |-
      Aan de met goed gevolg afgelegde examens of onderdelen van examens van opleidingen, verzorgd door de instellingen,
      bedoeld in het eerste lid, is een diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.1
    references:
