        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 12.3.25.1
    text: |-
      Een opleiding als bedoeld in [artikel II, onderdeel B, zesde lid, onder a, van de Wet van 23 mei 1990](onbekend)
      (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende op 31 december 1995
      geldende voorschriften verbonden blijven aan de in dat lid bedoelde school onderscheidenlijk aan de instelling
      waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
    references:
