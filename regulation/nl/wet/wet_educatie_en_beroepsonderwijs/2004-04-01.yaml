        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.8.1
    text: |-
      Het Christelijk Instituut voor Doven "Effatha" en het Instituut voor Doven "Sint-Michielsgestel" behouden in
      afwijking van [artikel 12.3.2][ref1] ten behoeve van het verzorgen van beroepsopleidingen die de voortzetting zijn
      van beroepsbegeleidend onderwijs dat deze instituten op 31 december 1995 verzorgden, aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.8.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde instituten. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of krachtens
      deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.8
  - number: 12.3.9.1
    text: |-
      Ten aanzien van de beroepsopleidingen die een voortzetting vormen van de opleidingen voor deeltijds middelbaar
      beroepsonderwijs in de sector dienstverlening en gezondheidszorg, op 31 december 1995 op grond van artikel 3.11
      van de Wet op het cursorisch beroepsonderwijs verbonden aan de Hogeschool Haarlem en aan de Hogeschool Tilburg,
      behouden deze hogescholen aanspraak op bekostiging uit ’s Rijks kas.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.9
  - number: 12.3.9.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid genoemde beroepsopleidingen. Daarbij kan, voor zover noodzakelijk, worden afgeweken van het bij of
      krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.9
  - number: 12.3.10.1
    text: |-
      Met ingang van 1 januari 1996 brengt Onze Minister op aanvraag van het landelijk orgaan voor bekostiging als
      landelijk orgaan uitsluitend in aanmerking landelijke organen voortgekomen uit een of meer ingevolge de Wet op
      het cursorisch beroepsonderwijs bekostigde landelijke organen van het leerlingwezen. Onze Minister stelt tegelijk
      met zijn besluit op de aanvraag om bekostiging ook het werkgebied van de onderscheiden landelijke organen vast, na
      de ingevolge de Wet op het cursorisch beroepsonderwijs bekostigde landelijke organen van het leerlingwezen in de
      gelegenheid te hebben gesteld hem daarover te adviseren.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.10
  - number: 12.3.10.2
    text: |-
      Onze Minister betrekt bij de beoordeling van de aanvraag in elk geval de samenhang van de beroepsopleidingen in
      relatie tot een bepaalde bedrijfstak en de omvang van het werkgebied van het landelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.10
  - number: 12.3.10.3
    text: |-
      De in het eerste lid bedoelde aanvraag wordt voor 15 november 1995 aan Onze Minister gezonden. Onze Minister
      besluit binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.10
  - number: 12.3.11.1
    text: |-
      Met ingang van 1 januari 1996 brengt Onze Minister op aanvraag van het desbetreffende bevoegd gezag voor
      bekostiging als agrarisch innovatie- en praktijkcentrum uitsluitend in aanmerking centra voortgekomen uit een of
      meer ingevolge de [Wet op het voortgezet onderwijs][ref1] bekostigde Innovatie- en praktijkcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.11
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 12.3.11.2
    text: |-
      De in het eerste lid bedoelde aanvraag wordt voor 15 november 1995 aan Onze Minister gezonden. Onze Minister
      besluit binnen vier weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.11
  - number: 12.3.12.1
    text: |-
      Een regionaal opleidingencentrum, een regionaal opleidingencentrum in een samenwerkingsverband, een instelling
      voor basiseducatie dan wel een school voor voortgezet algemeen volwassenenonderwijs dat onderscheidenlijk die
      in de periode van 1 januari 1996 tot en met 31 december 1997 personeel in dienst neemt dat onmiddellijk daaraan
      voorafgaand ten behoeve van de regionale ondersteuning in dienst was van een rechtspersoon ex artikel 41, tweede
      lid, van de Kaderwet Volwasseneneducatie 1991, zoals dat artikellid op 31 december 1995 luidde, dan wel bedoelde
      rechtspersoon zelf die nog dergelijk personeel in dienst heeft op 1 januari 1996, ontvangt ten behoeve van dat
      personeel tot uiterlijk 1 januari 1998 een vergoeding op basis van daartoe bij algemene maatregel van bestuur te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.12
  - number: 12.3.12.2
    text: |-
      [ Artikel 12.2.9][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.13
    text: |-
      Het met betrekking tot de landelijke ondersteuningsinstellingen bepaalde bij en krachtens de Kaderwet
      Volwasseneneducatie 1991 zoals luidend op 31 december 1995, blijft tot en met 1 augustus 1997 van overeenkomstige
      toepassing, waarbij met ingang van 1 januari 1997 de rechtspersoon die het Centrum voor Innovatie van Opleidingen
      in stand houdt in alle uit die wet voortvloeiende rechten en verplichtingen ten aanzien van die instellingen
      treedt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.13
  - number: 12.3.14
    text: |-
      Het met betrekking tot de landelijke organisaties bepaalde bij en krachtens het Besluit vormingswerk voor jeugdigen
      1994 zoals luidend op 31 december 1995, blijft tot en met 31 juli 1996 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.14
  - number: 12.3.15
    text: |-
      Onze Minister maakt voor 1 april 1998 een overzicht bekend van de instellingen, landelijke organen, agrarische
      innovatie- en praktijkcentra, alsmede de overige instellingen die ingevolge deze titel voor bekostiging in
      aanmerking zijn gebracht of waarvan de bekostiging is gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.15
  - number: 12.3.16.1
    text: |-
      In afwijking van [artikel 7.2.4, eerste lid][ref1], leggen de landelijke organen onderscheidenlijk de commissies
      onderwijs-bedrijfsleven voor 1 mei 1996 voor de eerste maal voorstellen voor de eindtermen, met het advies van
      de commissie, bedoeld in [artikel 6.1.2][ref2], aan Onze Minister voor, ten behoeve van het studiejaar 1997-1998.
      De landelijke organen, onderscheidenlijk de commissies onderwijs-bedrijfsleven, geven in voorkomend geval aan van
      welke opleiding leerlingwezen, middelbaar beroepsonderwijs, deeltijds middelbaar beroepsonderwijs, bedoeld in de
      Wet op het cursorisch beroepsonderwijs of de [Wet op het voortgezet onderwijs][ref3], of erkend onderwijs in de zin
      van de [Wet op de erkende onderwijsinstellingen][ref4], de beroepsopleiding de voortzetting vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002399
      [ref4]: https://wetten.overheid.nl/BWBR0003821
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0002399
      - id: ref4
        bwb_id: BWBR0003821
  - number: 12.3.16.2
    text: |-
      In afwijking van [artikel 7.2.4, eerste lid][ref1], worden de eindtermen van de beroepsopleidingen voor de
      eerste maal voor 1 augustus 1996 vastgesteld, onder aanduiding van de opleiding waarvan de beroepsopleiding de
      voortzetting vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 12.3.17.1
    text: |-
      Op het in [artikel 12.3.16, tweede lid][ref1], bedoelde tijdstip waarop de eindtermen van de beroepsopleidingen
      voor de eerste maal worden vastgesteld, stelt Onze Minister in afwijking van [artikel 2.1.1, eerste lid][ref2],
      tevens vast het eerste overzicht van beroepsopleidingen, bedoeld in [artikel 2.1.1, derde lid][ref3], die voor
      bekostiging in aanmerking komen. Het overzicht heeft in afwijking van [artikel 2.1.1, eerste lid][ref4], betrekking
      op de studiejaren 1997-1998 en 1998-1999.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.17
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.3.17.2
    text: |-
      Voor de landelijke organen bestaat tot 1 mei 1996 gelegenheid om een voorstel voor de vaststelling van het eerste
      overzicht aan Onze Minister te doen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.17
  - number: 12.3.18.1
    text: |-
      Voor 1 december 1996 stelt Onze Minister voor het studiejaar 1997-1998 het Centraal register beroepsopleidingen
      vast. In afwijking van [artikel 6.4.1, eerste lid][ref1], heeft het register zoals dat voor de eerste maal
      wordt vastgesteld, in elk geval betrekking op beroepsopleidingen, verzorgd door de instellingen, bedoeld in
      [artikel 1.3.1][ref2]. Het register omvat voor elke instelling de beroepsopleidingen, vermeld in het overzicht,
      bedoeld in [artikel 12.3.17][ref3], die een voortzetting vormen van de opleidingen leerlingwezen, middelbaar
      beroepsonderwijs en deeltijds middelbaar beroepsonderwijs, in het studiejaar 1996-1997 bekostigd ingevolge de
      Wet op het cursorisch beroepsonderwijs of de [Wet op het voortgezet onderwijs][ref4], verbonden aan de school of
      scholen voor beroepsbegeleidend onderwijs en middelbaar beroepsonderwijs waarvan de instelling de voortzetting
      vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
