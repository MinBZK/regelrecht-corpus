    text: |-
      In de gevallen, bedoeld in [artikel 6.3.2, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


