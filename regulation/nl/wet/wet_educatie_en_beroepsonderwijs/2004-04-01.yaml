        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.3.1.3
    text: |-
      Het eerste en tweede lid zijn uitsluitend van toepassing ten aanzien van opleidingen die in het Centraal register
      zijn geregistreerd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.1
  - number: 1.3.2.1
    text: |-
      In een regionaal opleidingencentrum in een samenwerkingsverband werken twee of meer instellingen samen op ten
      minste de volgende gebieden:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.1.a
    text: de kwaliteitszorg,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.1.b
    text: het financieel beheer,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.1.c
    text: het personeel, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.1.d
    text: het onderwijs en de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.2
    text: De in het eerste lid bedoelde instellingen staan onder bestuur van één bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.2
  - number: 1.3.2.3
    text: |-
      Voor de toepassing van de [artikelen 1.3.6][ref1], [1.7.1][ref2], [2.2.1 tot en met 2.2.11][ref3],
      [2.3.4][ref4], [2.5.2 tot en met 2.5.9][ref5], [2.6][ref6], [2.8.1 tot en met 2.8.3][ref7], [3.2.1][ref8],
      [4.1.1 tot en met 4.1.7][ref9], [7.4.2 tot en met 7.5.4][ref10] en [11.1][ref11] gelden de instellingen die deel
      uitmaken van een regionaal opleidingencentrum in een samenwerkingsverband als één instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
