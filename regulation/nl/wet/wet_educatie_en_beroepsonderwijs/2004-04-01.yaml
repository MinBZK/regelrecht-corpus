        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.25.2
    text: |-
      Artikel II, onderdeel M, van de Wet van 23 mei 1990 (*Stb.* 266) zoals luidend op 31 december 1995, vindt tot en
      met 31 juli 1997 overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
  - number: 12.3.25.3
    text: |-
      Een afdeling vooropleiding voor hoger beroepsonderwijs als bedoeld in [artikel II, onderdeel R, van de Wet van 23
      mei 1990](onbekend) (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende
      op 31 december 1995 geldende voorschriften verbonden blijven aan de dagschool voor middelbaar beroepsonderwijs
      onderscheidenlijk aan de instelling waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.25.4
    text: |-
      Een afdeling voor hoger algemeen voortgezet onderwijs als bedoeld in [artikel II, onderdeel S, van de Wet van 23
      mei 1990](onbekend) (*Stb.* 266), kan tot en met 31 juli 1997 met overeenkomstige toepassing van de desbetreffende
      op 31 december 1995 geldende voorschriften verbonden blijven aan de dagschool voor middelbaar beroepsonderwijs
      onderscheidenlijk aan de instelling waarin deze school met toepassing van [artikel 12.3.1][ref1] is opgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.25.5
    text: |-
      De artikelen F.16 tot en met F.19, F.33 tot en met F.36 en F.43 tot en met F.46 van artikel II van de Wet van 27
      mei 1992 (*Stb.* 337) zoals luidend op 31 december 1995, vinden op overeenkomstige wijze tot en met 31 juli 1997
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
  - number: 12.3.25.6
    text: |-
      De [artikelen 12.3.23][ref1] en [12.3.24][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.25
    references:
