  - number: 10.2.2
    text: |-
      Indien tegen de uitspraak hoger beroep openstaat, wordt de werking van de uitspraak, bedoeld in het eerste
      lid, opgeschort totdat de termijn voor het instellen van hoger beroep is verstreken, of, indien hoger beroep is
      ingesteld, op het hoger beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel10.2
  - number: 11.1.1
    text: |-
      Indien het bevoegd gezag van een instelling, een agrarisch innovatie- en praktijkcentrum of een landelijk orgaan
      in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze Minister bepalen dat de rijksbijdrage,
      voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.1
  - number: 11.1.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een instelling in
      strijd handelt met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 11.1.3
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het eerste
      of tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.1
  - number: 11.2.1
    text: |-
      Het is anderen dan de instellingen die daartoe ingevolge deze wet gerechtigd zijn, verboden onderwijs aan te
      bieden of te verzorgen, dan wel externe legitimering te verzorgen, onder de naam van een in het Centraal register
      opgenomen beroepsopleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.2
  - number: 11.2.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.2
  - number: 11.2.3
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel11.2
  - number: 12.1.1
    text: 'Met ingang van 1 januari 1996 worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.1
  - number: 12.1.1.a
    text: het Besluit vormingswerk voor jeugdigen 1994,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.1
  - number: 12.1.1.b
    text: |-
      het besluit van 21 februari 1994, houdende aanwijzing van Innovatie- en praktijkcentra op grond van artikel 61 van
      de Wet op het voortgezet onderwijs (*Stb.* 1994, 191), en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.1
  - number: 12.1.1.c
    text: het Besluit bekostiging Innovatie- en praktijkcentra.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.1
  - number: 12.1.2.1
    text: |-
      Indien dat voor een goede uitvoering van deze wet noodzakelijk is, kan bij algemene maatregel van bestuur worden
      afgeweken van de ingetrokken of vervallen wetten die ingevolge dit hoofdstuk van toepassing blijven.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.2
  - number: 12.1.2.2
    text: |-
      Van de ingetrokken of vervallen voorschriften die bij algemene maatregel van bestuur of ministeriële regeling zijn
      vastgesteld en die ingevolge dit hoofdstuk van toepassing blijven, kan worden afgeweken bij algemene maatregel van
      bestuur respectievelijk ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.1.2
  - number: 12.2.1
    text: |-
      Diploma’s en certificaten ingevolge de [Wet op het voortgezet onderwijs][ref1], de
      Wet op het cursorisch beroepsonderwijs, de Kaderwet Volwasseneneducatie 1991 of het
      [Staatsexamenbesluit Nederlands als tweede taal][ref2], verkregen op grond van een examen verbonden aan opleidingen
      basiseducatie, voortgezet algemeen volwassenenonderwijs, middelbaar beroepsonderwijs, deeltijds middelbaar
      beroepsonderwijs of leerlingwezen dan wel op grond van een staatsexamen Nederlands als tweede taal, gelden als de
      overeenkomstige diploma’s en certificaten, verkregen op grond van [artikel 7.4.6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0006192
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.1
    references:
