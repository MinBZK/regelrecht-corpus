  - number: 12.3.19.1
    text: Het bevoegd gezag stelt voor 1 januari 1997 voor de eerste maal eindtermen voor de opleidingen educatie vast.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.19
  - number: 12.3.19.2
    text: |-
      De ministeriële regeling houdende eindtermen voor de opleidingen Nederlands als tweede taal I en II wordt voor 1
      januari 1996 vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.19
  - number: 12.3.20.1
    text: |-
      De in [artikel 7.2.10, eerste lid][ref1], bedoelde criteria worden voor de eerste maal vastgesteld voor 1 januari
      1997.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.20
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 12.3.20.2
    text: |-
      Het in [artikel 7.2.10, derde lid][ref1], bedoelde overzicht van bedrijven en organisaties wordt voor de eerste
      maal vastgesteld voor 1 mei 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.20
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 12.3.21.1
    text: 'In afwijking van het ter zake bepaalde bij en krachtens deze wet:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.21
  - number: 12.3.21.1.a
    text: |-
      stelt Onze Minister de eindtermen voor de in [artikel 7.2.2, eerste lid, onderdeel ][ref1], bedoelde
      assistentopleidingen voor de eerste maal vast voor 1 februari 1996, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.21
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 12.3.21.1.b
    text: |-
      komen deze opleidingen met ingang van het studiejaar 1996-1997 voor bekostiging in aanmerking voor zover zij worden
      verzorgd door een regionaal opleidingencentrum, een regionaal opleidingencentrum in een samenwerkingsverband of een
      agrarisch opleidingscentrum.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.21
  - number: 12.3.21.2
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de toepassing van deze wet ten aanzien van de in het
      eerste lid bedoelde opleidingen in de periode tot en met 31 juli 1997. Daarbij kan, voor zover noodzakelijk, worden
      afgeweken van het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.21
  - number: 12.3.22.1
    text: |-
      Het bevoegd gezag stelt voor zover het opleidingen educatie betreft, voor 1 januari 1997 de onderwijs- en
      examenregeling, bedoeld in [artikel 7.4.8][ref1], vast, en geeft tijdig voorafgaand aan het jaar 1997 toepassing
      aan [artikel 7.4.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.22
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 12.3.22.2
    text: |-
      Het bevoegd gezag stelt voor zover het beroepsopleidingen betreft, voor 1 april 1997 de onderwijs- en
      examenregeling, bedoeld in [artikel 7.4.8][ref1], vast en geeft tijdig voorafgaand aan het studiejaar 1997-1998
      toepassing aan [artikel 7.4.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.22
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 12.3.23.1
    text: |-
      Tot 1 januari 1997 blijven van kracht de op 31 december 1995 geldende bij en krachtens de Wet op het voortgezet
      onderwijs, de Wet op het cursorisch beroepsonderwijs en de Kaderwet Volwasseneneducatie 1991 gegeven voorschriften
      met betrekking tot de scholen voor voortgezet algemeen volwassenenonderwijs, de instellingen voor basiseducatie en
      de opleidingen specifieke scholing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.23
  - number: 12.3.23.2
    text: |-
      Tot 1 augustus 1997 blijven van kracht de op 31 december 1995 geldende bij en krachtens de Wet op het voortgezet
      onderwijs en de Wet op het cursorisch beroepsonderwijs gegeven voorschriften met betrekking tot het middelbaar
      beroepsonderwijs, de opleidingen deeltijds middelbaar beroepsonderwijs en het vormingswerk voor jeugdigen,
      onderscheidenlijk de bij en krachtens de Wet op het cursorisch beroepsonderwijs gegeven voorschriften met
      betrekking tot het leerlingwezen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.23
  - number: 12.3.23.3
    text: |-
      De in het eerste en tweede lid bedoelde voorschriften hebben betrekking op het onderwijs, de deelnemers, de
      inschrijving en de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.23
  - number: 12.3.23.4
    text: |-
      De bevoegdheid van de commissie van beroep voor de examens, bedoeld in [artikel 7.5.1][ref1], strekt zich mede uit
      tot de examens, verbonden aan de in het eerste en tweede lid bedoelde opleidingen en programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.23
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 12.3.24.1
    text: |-
      Het bevoegd gezag stelt, voor zover van toepassing onverminderd de bevoegdheden van het desbetreffende landelijk
      orgaan volgens de op 31 december 1995 geldende voorschriften, deelnemers:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
  - number: 12.3.24.1.a
    text: |-
      die op 31 december 1996 zijn ingeschreven volgens een beschikking op grond van de artikelen 15, derde lid, 21 of
      24 van de Kaderwet Volwasseneneducatie 1991 zoals luidend op 31 december 1995, voor een opleiding basiseducatie,
      voortgezet algemeen volwassenenonderwijs, deeltijds middelbaar beroepsonderwijs of specifieke scholing, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
  - number: 12.3.24.1.b
    text: |-
      die op 31 juli 1997 zijn ingeschreven voor een opleiding beroepsbegeleidend onderwijs, een opleiding middelbaar
      beroepsonderwijs, of een programma aan een vormingsinstituut voor jeugdigen, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
  - number: 12.3.24.1.c
    text: |-
      die de onder *a* en *b* bedoelde opleiding onderscheidenlijk het onder *b* bedoelde programma nog niet hebben
      voltooid, in de gelegenheid hun opleiding onderscheidenlijk programma binnen een redelijke tijd te voltooien,
      overeenkomstig de op 31 december 1995 geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
  - number: 12.3.24.2
    text: |-
      Deelnemers die een in het eerste lid bedoelde opleiding of een in dat lid bedoeld programma of een deel daarvan
      behorend bij een certificaateenheid dan wel betrekking hebbend op het praktijkgedeelte met goed gevolg voltooien,
      ontvangen een diploma, certificaat of praktijkgetuigschrift overeenkomstig het op 31 december 1995 geldende model.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
  - number: 12.3.24.3
    text: |-
      De bevoegdheid van de commissie van beroep voor de examens, bedoeld in [artikel 7.5.1][ref1], strekt zich mede uit
      tot de examens, verbonden aan de in het eerste lid bedoelde opleidingen en programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.24
    references:
