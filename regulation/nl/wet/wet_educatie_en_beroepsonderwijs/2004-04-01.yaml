  - number: 12.3.35.1
    text: |-
      De [artikelen 2.3.1 tot en met 2.3.5][ref1] vinden voor het eerst toepassing met betrekking tot het jaar 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.35
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.3.35.2
    text: |-
      Het bepaalde bij of krachtens de Kaderwet Volwasseneneducatie 1991 en de Wet op het cursorisch beroepsonderwijs,
      zoals luidend op 31 december 1995, ten aanzien van de bekostiging van activiteiten volwasseneneducatie, blijft van
      toepassing op de bekostiging van die activiteiten in het jaar 1996.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.35
  - number: 12.3.35.3
    text: |-
      In afwijking van het eerste lid wat [artikel 2.3.1, eerste lid derde volzin][ref1], betreft kan de in die volzin
      bedoelde bijdrage reeds in het jaar 1996 worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.35
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.3.36.1
    text: |-
      Ten aanzien van deelnemers als bedoeld in [artikel 12.3.23, eerste lid][ref1], heeft het bevoegd gezag
      aanspraak op bekostiging, berekend overeenkomstig de op 31 december 1995 geldende voorschriften gedurende de in
      [artikel 12.3.23, eerste lid][ref2], bedoelde periode waarin de in dat lid bedoelde voorschriften van toepassing
      blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.36.2
    text: |-
      Ten aanzien van deelnemers als bedoeld in [artikel 12.3.23, tweede lid][ref1], heeft het bevoegd gezag aanspraak
      op bekostiging uit ’s Rijks kas, berekend overeenkomstig de op 31 december 1995 geldende voorschriften gedurende de
      in [artikel 12.3.23, tweede lid][ref2], bedoelde periode waarin de in dat lid bedoelde voorschriften van toepassing
      blijven. De eerste volzin is van overeenkomstige toepassing op deelnemers aan opleidingen en afdelingen als bedoeld
      in [artikel 12.3.25][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.36.3
    text: |-
      Voor zover de in [artikel 2.2.1][ref1] of [artikel 2.3.1][ref2] bedoelde algemene berekeningswijze daarin kan
      voorzien, vindt de berekening in afwijking van het eerste onderscheidenlijk tweede lid plaats overeenkomstig deze
      algemene berekeningswijze, met inachtneming van het bedrag waarop het bevoegd gezag aanspraak zou hebben op grond
      van de berekening volgens de in het eerste onderscheidenlijk tweede lid bedoelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.3.36.4
    text: |-
      Voor de periode van 1 januari 1997 tot en met 31 juli 1997 heeft een instelling die een opleiding deeltijds
      middelbaar beroepsonderwijs verzorgt, voor die opleiding aanspraak op bekostiging uit ’s Rijks kas ter grootte
      van 7/12 van het bedrag dat de desbetreffende instelling over het kalenderjaar 1996 bij of krachtens de Kaderwet
      Volwasseneneducatie 1991 en de Wet op het cursorisch beroepsonderwijs als bekostiging voor die opleiding heeft
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
  - number: 12.3.36.5
    text: 'De aanspraak, bedoeld in het eerste lid, geldt:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
  - number: 12.3.36.5.a
    text: |-
      wat opleidingen basiseducatie en opleidingen voortgezet algemeen volwassenenonderwijs betreft, jegens de
      gemeentebesturen, en, voor zover het huisvestingskosten betreft, jegens Onze Minister, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
  - number: 12.3.36.5.b
    text: |-
      wat opleidingen deeltijds middelbaar beroepsonderwijs en opleidingen specifieke scholing betreft, jegens het Rijk
      en jegens de Arbeidsvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.36
  - number: 12.3.37.1
    text: |-
      Voor de periode van 1 augustus 1997 tot en met 31 december 1997, voor het jaar 1998 en voor het jaar 1999 wordt de
      rijksbijdrage voor het beroepsonderwijs ten behoeve van een instelling, in afwijking van de [artikelen 2.2.1][ref1]
      en [2.2.2][ref2], telkens vastgesteld op de hoogte of op het overeenkomstige gedeelte van de hoogte van de
      rijksbijdrage waarop die instelling overeenkomstig de op 31 december 1995 geldende voorschriften aanspraak zou
      hebben voor het jaar 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.37
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.3.37.2
    text: |-
      De voor de in het eerste lid bedoelde periode en jaren vastgestelde rijksbijdrage kan volgens bij ministeriële
      regeling te geven voorschriften worden verhoogd of verlaagd in verband met:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.37
  - number: 12.3.37.2.a
    text: de door de begrotingswetgever beschikbaar gestelde middelen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.37
  - number: 12.3.37.2.b
    text: wijziging van het aantal deelnemers, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.37
  - number: 12.3.37.2.c
    text: |-
      maatregelen van overgangsrechtelijke of invoeringsrechtelijke aard die zijn getroffen bij of krachtens deze wet of
      die verband houden met de in [artikel 12.1.2][ref1] bedoelde wetten en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.37
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.38
    text: |-
      In afwijking van [artikel 2.2.12][ref1] zijn tot en met 31 december 1996 de op 31 december 1995 geldende bij en
      krachtens de Wet op het voortgezet onderwijs gegeven voorschriften met betrekking tot de bekostiging van Innovatie-
      en praktijkcentra van overeenkomstige toepassing met betrekking tot de agrarische innovatie- en praktijkcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.38
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.3.39
    text: |-
      In afwijking van [artikel 2.4.1][ref1] zijn tot en met 31 december 1996 de op 31 december 1995 geldende bij en
      krachtens de Wet op het cursorisch beroepsonderwijs gegeven voorschriften met betrekking tot de bekostiging van de
      landelijke organen voor het leerlingwezen van overeenkomstige toepassing met betrekking tot de landelijke organen
      voor het beroepsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.39
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.3.40
    text: |-
      Ten aanzien van beroepsopleidingen als bedoeld in [artikel 7.2.2][ref1] voorziet de algemene maatregel van
      bestuur, bedoeld in [artikel 2.2.1, eerste lid][ref2], gedurende de periode waarin voor de onderscheiden
      opleidingen nog niet kan worden beschikt over feitelijke gegevens die zijn vereist voor de toepassing van de in
      [artikel 2.2.2][ref3] bedoelde maatstaven, in overeenkomstige vervangende berekeningsnormen. Tevens kan de in de
      eerste volzin bedoelde algemene maatregel van bestuur voorschriften bevatten met betrekking tot de afbouw van de
      bekostiging van de in [artikel 12.3.24][ref4] bedoelde opleidingen en programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.40
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.41.1
    text: |-
      De in de [artikelen 2.3.6, eerste lid][ref1], en [2.5.5, eerste lid][ref2], bedoelde geordende gegevens zijn voor
      de eerste maal uiterlijk op 31 december 1996 beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.41
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.3.41.2
    text: |-
      De in de [artikelen 2.3.6][ref1] en [2.5.5][ref2] bedoelde bij of krachtens algemene maatregel van bestuur vast
      te stellen voorschriften worden vastgesteld voor 1 januari 1997. Bij ministeriële regeling worden voorschriften
      vastgesteld die in de desbetreffende onderwerpen voorzien tot het tijdstip waarop de in de eerste volzin bedoelde
      voorschriften in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.41
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 12.3.42.1
    text: |-
      In afwijking van [artikel 1.3.6, tweede lid][ref1], wordt het daar bedoelde verslag voor zover het betreft
      instellingen die op grond van [artikel 12.3.1][ref2] uiterlijk met ingang van 1 januari 1997 voor bekostiging in
      aanmerking zijn gebracht, voor de eerste maal openbaar gemaakt voor 1 mei 1997 en omvat dat eerste verslag een
      uiteenzetting over de te gebruiken methodes van kwaliteitsbeoordeling, de inrichting van de in het eerste lid
      bedoelde kwaliteitsbeoordeling met betrokkenheid van onafhankelijke deskundigen, en de voornemens ten aanzien
      van de kwaliteitsbeoordeling. Het bevoegd gezag maakt het eerste in [artikel 1.3.6, tweede lid][ref3], bedoelde
      volledige verslag openbaar voor 1 mei 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
