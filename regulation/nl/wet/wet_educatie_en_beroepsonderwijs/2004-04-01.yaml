  - number: 12.3.28.1
    text: |-
      Ten aanzien van deelnemers op wie [artikel 12.3.2, eerste lid][ref1], van toepassing is, blijft met betrekking
      tot de in dat lid bedoelde opleidingen voor zover daarop de Leerplichtwet 1969 zoals luidend op 31 december 1995
      van toepassing is, het bepaalde bij of krachtens die [wet][ref2] zoals luidend zonder de in [artikel 12.4.1][ref3]
      genoemde wijzigingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002628
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.28
    references:
