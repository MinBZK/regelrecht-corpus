    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.3.2, eerste lid, onder c][ref1], geeft hij
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn van ten minste tien dagen waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
