  - number: 12.3.7.2
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag toont ten genoegen van Onze Minister aan dat de noodzakelijke
      inspanningen zijn verricht om te bereiken dat de in het eerste lid bedoelde scholen, instellingen en instituten
      met toepassing van [artikel 12.3.1][ref1] deel uitmaken van een regionaal opleidingencentrum of een regionaal
      opleidingencentrum in een samenwerkingsverband, en dat aan de in het eerste lid bedoelde vereisten niet kan worden
      voldaan door het ontbreken van het desbetreffende onderwijs in het werkgebied van het Regionaal Bestuur voor de
      Arbeidsvoorziening waar de instelling is gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.7.3
    text: |-
      Voor de toepassing van deze wet geldt een in het eerste lid bedoelde instelling als een instelling als bedoeld
      in [artikel 1.3.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 12.3.7.4
    text: |-
      [Artikel 12.3.5, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.7
    references:
      - id: ref1
