  - number: 1.3.3
    text: |-
      Agrarische opleidingscentra zijn instellingen waarin beroepsonderwijs op het gebied van de landbouw en de
      natuurlijke omgeving en voorbereidend beroepsonderwijs in de afdeling landbouw en natuurlijke omgeving, bedoeld in
      [artikel 10c, onderdeel d, van de Wet op het voortgezet onderwijs][ref1], worden verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
  - number: 1.3.4
    text: |-
      Agrarische innovatie- en praktijkcentra zijn werkzaam ten behoeve van het beroepsonderwijs op het gebied van de
      landbouw en de natuurlijke omgeving. De centra die daarvoor op grond van [artikel 2.1.7][ref1] in aanmerking komen,
      hebben ten behoeve van het vervullen van de hun bij deze wet opgedragen werkzaamheden aanspraak op bekostiging uit
      ’s Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.5.1
    text: |-
      Instellingen en agrarische innovatie- en praktijkcentra hebben het verzorgen van educatie en van beroepsonderwijs
      tot taak.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.2
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.2.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.2.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen voor educatie en beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.2.c
    text: het bieden van mogelijkheden voor studiekeuze- en beroepskeuzevoorlichting, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.2.d
    text: |-
      de afstemming op de ontwikkelingen in de samenleving op nationaal en internationaal gebied in het algemeen en ten
      aanzien van de arbeidsmarkt in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.5.3
    text: |-
      Agrarische innovatie- en praktijkcentra dragen door het verlenen van diensten aan de agrarische opleidingscentra
      bij aan de inhoudelijke vernieuwing en de doelmatige uitvoering van het onderwijs. De centra ontwikkelen daartoe
      voorstellen voor de inhoud en inrichting van het onderwijs en verzorgen onderdelen van het onderwijs die vanwege
      de schaal waarop de desbetreffende activiteiten verricht moeten worden, de vereiste deskundigheid of de benodigde
      outillage of door de risico’s die de desbetreffende activiteiten meebrengen voor de bedrijfsvoering van het
      bedrijf of de organisatie waar de beroepspraktijkvorming wordt verzorgd, doelmatiger op centraal niveau dan door de
      agrarische opleidingscentra afzonderlijk verzorgd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.5
  - number: 1.3.6.1
    text: |-
      Het bevoegd gezag richt een stelsel van kwaliteitszorg voor de instelling dan wel voor het agrarisch innovatie-
      en praktijkcentrum in en draagt er in dat verband zorg voor dat, zo veel mogelijk in samenwerking met andere
      instellingen, wordt voorzien in een regelmatige beoordeling van de kwaliteit van het onderwijs. Het bevoegd gezag
      draagt er zorg voor dat de in de eerste volzin bedoelde beoordeling geschiedt met betrokkenheid van onafhankelijke
      deskundigen. De uitkomsten van de beoordeling zijn openbaar.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.6
  - number: 1.3.6.2
    text: |-
      Het bevoegd gezag maakt om het andere jaar een verslag omtrent de kwaliteitszorg openbaar en zendt dit voor 1 mei
      van dat jaar aan de inspectie. Het verslag wordt ingericht volgens bij ministeriële regeling te geven voorschriften
      en omvat een uiteenzetting over de gebruikte methodes van kwaliteitsbeoordeling, de inrichting van de in het
      eerste lid bedoelde kwaliteitsbeoordeling met betrokkenheid van onafhankelijke deskundigen, de resultaten van de
      in het eerste lid bedoelde regelmatige beoordeling, het voorgenomen beleid van de instelling in het licht van die
      resultaten en de voornemens ten aanzien van de kwaliteitsbeoordeling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.6
  - number: 1.3.6.3
    text: |-
      De in het tweede lid bedoelde ministeriële regeling treedt niet eerder in werking dan 12 maanden na haar
      bekendmaking.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.6
  - number: 1.3.7.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en met onderkenning
      van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.7
  - number: 1.3.7.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.7
  - number: 1.3.8.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling
      met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden
      als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een minderjarige deelnemer van
      de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.8.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van
      een redelijk vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf
      als bedoeld in het eerste lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd
      gezag onverwijld aangifte bij een opsporingsambtenaar als bedoeld in [artikel 127][ref1] juncto
      [artikel 141 van het Wetboek van Strafvordering][ref2], en stelt het bevoegd gezag de vertrouwensinspecteur daarvan
      onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van aangifte, stelt het de ouders van de
      betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de instelling met taken belaste persoon,
      hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 1.3.8.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      deelnemer van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.8
  - number: 1.3.8.4
    text: Het eerste tot en met derde lid zijn van overeenkomstige toepassing op agrarische innovatie- en praktijkcentra.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.3.8
  - number: 1.4.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een andere instelling dan bedoeld in
      [artikel 1.3.1][ref1], of van een instelling als bedoeld in [artikel 1.3.1][ref2], dat aan de met goed gevolg
      afgelegde examens of onderdelen van examens van een beroepsopleiding, verzorgd door die instelling, een diploma
      of certificaat als bedoeld in [artikel 7.4.6][ref3] is verbonden, indien de desbetreffende instelling voor die
      opleiding in acht neemt hetgeen bij of krachtens deze wet is bepaald ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
