  - number: 9.2.2.1
    text: |-
      De rechtspersoon die een landelijk orgaan in stand houdt, kan de instandhouding van dat orgaan overdragen aan een
      andere rechtspersoon die voldoet aan [artikel 9.2.1, eerste lid][ref1].


