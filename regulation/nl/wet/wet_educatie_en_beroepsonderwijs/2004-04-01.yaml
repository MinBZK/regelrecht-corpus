  - number: 12.3.42.5
    text: Dit artikel is van overeenkomstige toepassing op de agrarische innovatie- en praktijkcentra.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.42
  - number: 12.3.43
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van de
      [artikelen 12.3.36][ref1], [12.3.37][ref2] en [12.3.40][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
