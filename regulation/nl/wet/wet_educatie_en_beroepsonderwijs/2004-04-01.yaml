        hoofdstuk: I
        paragraaf: '1'
  - number: 12.3.45
    text: |-
      Ten aanzien van scholen, instellingen en instituten als bedoeld in [hoofdstuk 12, titel 3][ref1], voor zover op 31
      december 1995 daarop de [Wet medezeggenschap onderwijs 1992][ref2] van toepassing is, is laatstgenoemde wet zoals
      luidend met ingang van het tijdstip van inwerkingtreding van [artikel 12.4.4][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk12
      [ref2]: https://wetten.overheid.nl/BWBR0005746
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.45
    references:
      - id: ref1
        bwb_id: BWBR0007625
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0005746
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.46
    text: |-
      Het bevoegd gezag van een instelling stelt binnen 12 maanden nadat de instelling op grond van
      [artikel 12.3.1][ref1] voor bekostiging in aanmerking is gebracht, het in [artikel 9.1.7][ref2] bedoelde
      bestuursreglement vast.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.46
