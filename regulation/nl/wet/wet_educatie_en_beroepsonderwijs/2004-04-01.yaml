      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.2.7.a
    text: |-
      degene die in het studiejaar 1995-1996 bevoegd onderwijs heeft gegeven aan een school voor beroepsbegeleidend
      onderwijs, een school voor middelbaar beroepsonderwijs, dan wel wat deeltijds middelbaar beroepsonderwijs betreft
      aan een andere school, aan een vormingsinstituut voor jeugdigen of aan een instelling voor basiseducatie,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.7.b
    text: |-
      degene die in de periode van 1 augustus 1990 tot en met 31 juli 1995 gedurende ten minste 40 weken bevoegd
      onderwijs als bedoeld in onderdeel *a* heeft gegeven, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.7.c
    text: degene die
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.7.c.1°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen van de opleiding cultureel werk
      of de opleiding culturele en maatschappelijke vorming behorend tot het onderdeel gedrag en maatschappij van het
      Centraal register opleidingen hoger onderwijs, met de differentiatie basiseducatie, dat op grond van de artikelen
      4 en 5 van het Uitvoeringsbesluit KVE 1991 zoals dat luidde op 31 juli 1995 zou hebben geleid tot een bevoegdheid
      voor het verzorgen van activiteiten basiseducatie, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.7.c.2°
    text: |-
      voor 1 september 1997 een getuigschrift heeft behaald van een afsluitend examen binnen het hoger pedagogisch
      onderwijs met de differentiatie basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.7.c.3°
    text: uiterlijk aan het begin van het studiejaar 1994-1995 is gestart met de differentiatie basiseducatie.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.7
  - number: 12.2.8
    text: |-
      Voor degenen ten aanzien van wie voor 1 januari 1996 [artikel 114][ref1], dan wel de artikelen F.25 of F.38 van de
      Wet van 27 mei 1992 (*Stb.* 337) in samenhang met [artikel 114 ][ref2] is toegepast voor de voortzetting van een
      betrekking aan een school voor beroepsbegeleidend onderwijs, een school voor middelbaar beroepsonderwijs of wat
      deeltijds middelbaar beroepsonderwijs betreft aan een andere school, kan het bevoegd gezag voor onbepaalde tijd
      afwijken van [artikel 4.2.1, eerste lid, onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002595#Artikel114a
      [ref2]: https://wetten.overheid.nl/BWBR0002595#Artikel114a
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel4
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.8
    references:
      - id: ref1
        bwb_id: BWBR0002595
        artikel: 114a
      - id: ref2
        bwb_id: BWBR0002595
        artikel: 114a
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.2.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven met betrekking tot de gevolgen
      voor het personeel van de invoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.9
  - number: 12.2.10.1
    text: |-
      Op geschillen tussen personeel en bevoegd gezag van een school voor beroepsbegeleidend onderwijs, een school
      voor middelbaar beroepsonderwijs dan wel wat deeltijds middelbaar beroepsonderwijs betreft van een andere school,
      van een vormingsinstituut voor jeugdigen, van een instelling voor basiseducatie, een landbouwpraktijkschool of
      een landelijk orgaan die ingevolge de op 31 december 1995 geldende voorschriften aanhangig zijn gemaakt bij een
      commissie van beroep of bij de burgerlijke rechter, blijven de op die dag geldende regelingen van toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.10
  - number: 12.2.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot geschillen tussen het bevoegd gezag en een
      deelnemer met betrekking tot examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.2.10
  - number: 12.3.1.1
    text: |-
      Met ingang van 1 januari 1996 doch uiterlijk met ingang van 1 januari 1998 brengt Onze Minister op aanvraag
      van het bevoegd gezag voor bekostiging als regionaal opleidingencentrum uitsluitend in aanmerking instellingen,
      voortgekomen uit een samenvoeging van ingevolge de [Wet op het voortgezet onderwijs][ref1], de Wet op het
      cursorisch beroepsonderwijs of de Kaderwet Volwasseneneducatie 1991 bekostigde:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 12.3.1.1.a
    text: |-
      scholen voor middelbaar beroepsonderwijs waarvan tenminste drie sectoren, bedoeld in artikel 15*a*, eerste lid, van
      de Wet op het voortgezet onderwijs, zoals luidend op 31 december 1995, deel uitmaken,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.1.b
    text: |-
      scholen voor beroepsbegeleidend onderwijs, daaronder mede verstaan opleidingen voor beroepsbegeleidend onderwijs,
      verzorgd door een onder *a* bedoelde school voor middelbaar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.1.c
    text: scholen voor voortgezet algemeen volwassenenonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.1.d
    text: instellingen voor basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.1.e
    text: vormingsinstituten voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.2
    text: |-
      Met ingang van 1 januari 1996 doch uiterlijk met ingang van 1 januari 1998 brengt Onze Minister op aanvraag
      van het bevoegd gezag voor bekostiging als instelling die deel uitmaakt van een regionaal opleidingencentrum
      in een samenwerkingsverband uitsluitend in aanmerking instellingen die onder bestuur van één bevoegd
      gezag staan, in een samenwerkingsverband dat voldoet aan [artikel 1.3.2][ref1], voortgekomen uit ingevolge
      de [Wet op het voortgezet onderwijs][ref2], de Wet op het cursorisch beroepsonderwijs of de Kaderwet
      Volwasseneneducatie 1991 bekostigde:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002399
  - number: 12.3.1.2.a
    text: |-
      scholen voor middelbaar beroepsonderwijs waarvan tenminste drie sectoren, bedoeld in artikel 15*a*, eerste lid, van
      de Wet op het voortgezet onderwijs zoals luidend op 31 december 1995, deel uitmaken,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.2.b
    text: |-
      scholen voor beroepsbegeleidend onderwijs, daaronder mede verstaan opleidingen voor beroepsbegeleidend onderwijs,
      verzorgd door een onder *a* bedoelde school voor middelbaar beroepsonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.2.c
    text: scholen voor voortgezet algemeen volwassenenonderwijs,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.2.d
    text: instellingen voor basiseducatie, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.2.e
    text: vormingsinstituten voor jeugdigen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.3
    text: |-
      Met ingang van 1 januari 1996 doch uiterlijk met ingang van 1 januari 1998 brengt Onze Minister op aanvraag van het
      bevoegd gezag voor bekostiging als agrarisch opleidingscentrum uitsluitend in aanmerking instellingen voortgekomen
      uit een samenvoeging van ingevolge de [Wet op het voortgezet onderwijs][ref1] bekostigde:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 12.3.1.3.a
    text: scholen voor middelbaar beroepsonderwijs in de sector landbouw en natuurlijke omgeving,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.3.b
    text: scholen voor voorbereidend beroepsonderwijs met een afdeling landbouw en natuurlijke omgeving, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.3.c
    text: opleidingen leerlingwezen, verbonden aan deze scholen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4
    text: |-
      In afwijking van het eerste en tweede lid kan Onze Minister op aanvraag van het bevoegd gezag voor bekostiging als
      regionaal opleidingencentrum of als regionaal opleidingencentrum in een samenwerkingsverband in aanmerking brengen
      instellingen die
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4.a
    text: |-
      of door het ontbreken van ten hoogste één sector middelbaar beroepsonderwijs niet voldoen aan het vereiste, bedoeld
      in onderdeel *a* van het eerste onderscheidenlijk tweede lid,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4.b
    text: |-
      of door het ontbreken van voortgezet algemeen volwassenenonderwijs niet voldoen aan het vereiste, bedoeld in
      onderdeel *c* van het eerste onderscheidenlijk tweede lid,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4.c
    text: |-
      of door het ontbreken van basiseducatie niet voldoen aan het vereiste, bedoeld in onderdeel *d* van het eerste
      onderscheidenlijk tweede lid,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4.d
    text: |-
      of door het ontbreken van beroepsbegeleidend onderwijs niet voldoen aan het vereiste, bedoeld in onderdeel *b* van
      het eerste onderscheidenlijk tweede lid,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.4.e
    text: |-
      of, al dan niet in combinatie met onderdeel *a*, onderdeel *b*, onderdeel *c*, of onderdeel *d* door het ontbreken
      van een vormingsinstituut voor jeugdigen niet voldoen aan het vereiste, bedoeld in onderdeel *e* van het eerste
      onderscheidenlijk tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.5
    text: |-
      Onze Minister geeft uitsluitend toepassing aan het vierde lid indien het bevoegd gezag door het ontbreken van het
      desbetreffende onderwijs in het werkgebied van het Regionaal Bestuur voor de Arbeidsvoorziening waar de instelling
      is gevestigd, in de onmogelijkheid verkeert om aan die vereisten te voldoen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.6
    text: |-
      Het bevoegd gezag zendt een aanvraag om toepassing van het eerste, tweede of derde lid binnen vier maanden
      voorafgaand aan het jaar waarop de aanvraag betrekking heeft, doch voor 1 augustus 1997, aan Onze Minister. Onze
      Minister besluit binnen drie maanden op de aanvraag. Indien het een aanvraag betreft voor de periode met ingang
      van 1 januari 1996, zendt het bevoegd gezag in afwijking van de eerste volzin de aanvraag voor 15 november 1995 aan
      Onze Minister en besluit Onze Minister voor 15 december 1995. De tweede volzin is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.7
    text: |-
      Indien een aanvraag om toepassing van het eerste, tweede of derde lid, voor zover betrekking hebbend op het jaar
      1998, is afgewezen en het bevoegd gezag na de afwijzing ten genoegen van Onze Minister aantoont dat alsnog wordt
      voldaan aan de voorwaarden van het eerste, tweede onderscheidenlijk derde lid, kan Onze Minister het bevoegd gezag
      in de gelegenheid stellen, voor 1 december 1997 een hernieuwde aanvraag aan Onze Minister te zenden. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien, met dien verstande dat op
      de aanvraag wordt besloten voor 1 april 1998.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.8
    text: |-
      Het zevende lid is van overeenkomstige toepassing indien geen aanvraag als bedoeld in het zesde lid, betrekking
      hebbend op het jaar 1998, was ingediend.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.9
    text: |-
      In afwijking van het eerste en tweede lid kan daar bedoelde aanvraag er mede toe strekken dat een regionaal
      opleidingencentrum of een regionaal opleidingencentrum in een samenwerkingsverband ook instituten voor de opleiding
      tot verpleegkundige of ziekenverzorgende omvat. Indien reeds toepassing is gegeven aan het eerste of tweede lid,
      kan het bevoegd gezag een afzonderlijke aanvraag indienen met betrekking tot toevoeging aan de instelling van de
      in de eerste volzin bedoelde instituten. Bij ministeriële regeling kunnen voorschriften worden gegeven voor de
      toepassing van de eerste en tweede volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.1.10
    text: |-
      Een instelling die op grond van dit artikel voor bekostiging in aanmerking is gebracht en voornemens is om voor
      1 januari 1998 haar onderwijs op een andere plaats te verzorgen dan die waarop dat onderwijs werd verzorgd op het
      moment van de indiening van de aanvraag om bekostiging, behoeft daarvoor de toestemming van Onze Minister. Onze
      Minister besluit binnen vier weken na ontvangst van een aanvraag om toestemming. De toestemming wordt uitsluitend
      geweigerd indien het verzorgen van het onderwijs op die andere plaats kennelijk niet doelmatig kan worden geacht,
      gelet op het geheel en de spreiding van het desbetreffende onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.1
  - number: 12.3.2.1
    text: |-
      De aanspraak op bekostiging van scholen voor middelbaar beroepsonderwijs, scholen voor beroepsbegeleidend
      onderwijs, scholen voor voortgezet algemeen volwassenenonderwijs, instellingen voor basiseducatie en
      vormingsinstituten voor jeugdigen die geen deel uitmaken van een regionaal opleidingencentrum, van een regionaal
      opleidingencentrum in een samenwerkingsverband of van een agrarisch opleidingscentrum blijft in stand volgens de
      op 31 december 1995 geldende voorschriften en vervalt van rechtswege op 1 augustus 1998. Het bevoegd gezag treft de
      nodige voorzieningen om de deelnemers die op die datum hun opleiding nog niet hebben voltooid in staat te stellen
      hun opleiding binnen een redelijke tijd aan een andere instelling te voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.2
  - number: 12.3.2.2
    text: |-
      Voor de toepassing van deze wet gelden een school en instelling als bedoeld in het eerste lid, uitgezonderd
      vormingsinstituten voor jeugdigen, tot 1 augustus 1998 als een instelling als bedoeld in [artikel 1.3.1][ref1],
      met dien verstande dat de bekostigingsaanspraak voor beroepsonderwijs uitsluitend betrekking kan hebben op het
      onderwijs dat de voortzetting vormt van opleidingen leerlingwezen en opleidingen middelbaar beroepsonderwijs
      of deeltijds middelbaar beroepsonderwijs, bekostigd ingevolge de Wet op het cursorisch beroepsonderwijs of de
      [Wet op het voortgezet onderwijs][ref2], verbonden aan een school.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002399
  - number: 12.3.2.3
    text: |-
      In afwijking van het eerste lid kan Onze Minister in bijzondere gevallen op aanvraag van het bevoegd gezag
      besluiten dat de in dat lid bedoelde aanspraak op bekostiging ook na 31 juli 1998 doch uiterlijk tot 1 augustus
      2000 in stand blijft. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.2
  - number: 12.3.3
    text: |-
      Onze Minister kan tot 1 augustus 1998 voor bekostiging in aanmerking brengen een school, instelling of instituut
      als bedoeld in [artikel 12.3.2, eerste lid][ref1], die, al dan niet onder door hem te stellen voorwaarden, wordt
      opgericht door omzetting, splitsing of verplaatsing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.4
    text: |-
      De [artikelen 9.1.2][ref1] en [9.1.3][ref2]. zijn van overeenkomstige toepassing ten aanzien van de overdracht van
      de instandhouding van een in [artikel 12.3.2, eerste lid][ref3], bedoelde school, instelling of instituut, aan het
      bevoegd gezag van een openbare onderscheidenlijk bijzondere instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.5.1
    text: |-
      In afwijking van [artikel 12.3.2][ref1] kan Onze Minister op aanvraag van het bevoegd gezag voor
      bekostiging na 31 juli 1998 in aanmerking brengen instellingen, voortgekomen uit een of meer ingevolge de
      [Wet op het voortgezet onderwijs][ref2] en de Wet op het cursorisch beroepsonderwijs bekostigde scholen voor
      middelbaar beroepsonderwijs of voor beroepsbegeleidend onderwijs indien het bevoegd gezag ten genoegen van Onze
      Minister aantoont:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0002399
  - number: 12.3.5.1.a
    text: |-
      dat het onderwijs dat deze instellingen verzorgen, niet doelmatig verzorgd kan worden aan een instelling als
      bedoeld in [artikel 1.3.1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 12.3.5.1.b
    text: |-
      dat het anders dan met toepassing van [artikel 12.3.1][ref1] voortzetten van de bekostiging van die instellingen
      niet onverenigbaar is met de vorming van instellingen als bedoeld in [artikel 1.3.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 12.3.5.2
    text: |-
      Onze Minister willigt de in het eerste lid bedoelde aanvraag, in afwijking van het in dat lid onder *a* en *b*
      genoemde, in elk geval in, indien het betreft instellingen:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.2.a
    text: met een onderwijsaanbod dat ten hoogste twee afdelingen omvat,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.2.b
    text: |-
      waarvan het onderwijs van meer dan regionale betekenis is wat de deelname aan de opleiding of de behoefte aan
      gediplomeerden van die opleiding betreft,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.2.c
    text: waarvan het onderwijs landelijk gezien door ten hoogste vijf instellingen wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.2.d
    text: |-
      waarvan het bevoegd gezag voor ten minste de helft bestaat uit werkgevers en werknemers van de desbetreffende
      bedrijfstak, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.2.e
    text: waarvan de desbetreffende bedrijfstak in belangrijke mate bijdraagt aan de instandhouding van de opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.3
    text: |-
      Voor de toepassing van deze wet geldt een in het eerste lid bedoelde instelling als een instelling als bedoeld
      in [artikel 1.3.1][ref1], met dien verstande dat de bekostigingsaanspraak voor onderwijs uitsluitend betrekking
      kan hebben op het onderwijs dat een voortzetting is van het in het eerste onderscheidenlijk tweede lid bedoelde
      onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 12.3.5.4
    text: |-
      Het bevoegd gezag zendt een aanvraag om toepassing van het eerste of tweede lid voor 1 juni 1997 aan Onze Minister.
      Onze Minister besluit binnen drie maanden op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.5.5
    text: |-
      Indien een aanvraag om toepassing van het eerste of tweede lid is afgewezen en het bevoegd gezag na de datum van
      afwijzing aantoont dat alsnog wordt voldaan aan de voorwaarden van het eerste of tweede lid, kan Onze Minister het
      bevoegd gezag in de gelegenheid stellen, voor 1 december 1997 een hernieuwde aanvraag aan Onze Minister te zenden.
      Onze Minister besluit binnen drie maanden op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.5
  - number: 12.3.6.1
    text: |-
      In afwijking van [artikel 12.3.2][ref1] brengt Onze Minister op aanvraag van het bevoegd gezag voor
      bekostiging na 31 juli 1998 in aanmerking ten hoogste één instelling die uitgaat van een bepaalde richting,
      en voortkomt uit een of meer ingevolge de [Wet op het voortgezet onderwijs][ref2], de Wet op het cursorisch
      beroepsonderwijs of de Kaderwet Volwasseneneducatie 1991 bekostigde scholen, instellingen en instituten als
      bedoeld in [artikel 12.3.2, eerste lid][ref3], indien in Nederland geen regionaal opleidingcentrum of regionaal
      opleidingencentrum in een samenwerkingsverband aanwezig is dat uitgaat van die richting.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.6.2
    text: |-
      Voor de toepassing van deze wet geldt een in het eerste lid bedoelde instelling als een instelling als bedoeld
      in [artikel 1.3.1][ref1], met dien verstande dat de bekostigingsaanspraak voor beroepsonderwijs uitsluitend
      betrekking kan hebben op het onderwijs dat de voortzetting vormt van opleidingen leerlingwezen en opleidingen
      middelbaar beroepsonderwijs of deeltijds middelbaar beroepsonderwijs, bekostigd ingevolge de Wet op het cursorisch
      beroepsonderwijs of de [Wet op het voortgezet onderwijs][ref2], verbonden aan de in het eerste lid bedoelde school
      of scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
