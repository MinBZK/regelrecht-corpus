  - number: 12.3.27
    text: |-
      Ten aanzien van de deelnemer op wie [artikel 12.3.2, eerste lid][ref1], a[rtikel 12.3.23][ref2],
      [artikel 12.3.24][ref3] of [artikel 12.3.25][ref4] van toepassing is en die op 31 juli 1997
      aanspraak heeft op studiefinanciering ingevolge de Wet op de studiefinanciering zoals luidend op dat
      tijdstip, strekken de in [artikel 12.4.2][ref5] opgenomen wijzigingen van de [artikelen 9][ref6] en
      [11 van de Wet op de studiefinanciering][ref7] niet ten nadele, zolang hij de opleiding waarop deze aanspraak
      betrekking heeft zonder onderbreking voortzet.


