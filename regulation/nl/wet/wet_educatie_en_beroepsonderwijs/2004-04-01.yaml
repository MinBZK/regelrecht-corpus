    text: |-
      een diploma middelbaar algemeen voortgezet onderwijs, of een diploma voorbereidend middelbaar beroepsonderwijs voor
      zover het betreft de theoretische leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
  - number: 8.2.1.1.c
    text: |-
      een diploma mavo-vbo, of een diploma voorbereidend middelbaar beroepsonderwijs voor zover het betreft de gemengde
      leerweg,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
  - number: 8.2.1.1.d
    text: |-
      een bewijs dat de eerste drie leerjaren van een school voor hoger algemeen voortgezet onderwijs of van een school
      voor voorbereidend wetenschappelijk onderwijs met gunstig gevolg zijn doorlopen, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
  - number: 8.2.1.1.e
    text: een ander bij ministeriële regeling aangewezen diploma of bewijsstuk.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
  - number: 8.2.1.2
    text: |-
      Vereiste voor inschrijving voor een specialistenopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref1], is het
      bezit van een diploma vakopleiding voor eenzelfde beroep of beroepencategorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.2.1.3
    text: |-
      Indien een assistentopleiding en een basisberoepsopleiding voorbereiden op eenzelfde beroep of beroepencategorie,
      bedoeld in [artikel 6.4.1, vijfde lid, onderdeel k][ref1], is, met inachtneming van het bepaalde krachtens
      [artikel 8.2.2][ref2], voor de inschrijving voor de basisberoepsopleiding vereist het bezit van


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
    references:
