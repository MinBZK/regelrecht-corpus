      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
