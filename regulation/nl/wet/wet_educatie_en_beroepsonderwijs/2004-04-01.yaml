  - number: 12.2.6
    text: |-
      Personeelsleden die op 1 januari 1996 niet in dienst zijn van een instelling in de zin van deze wet, een
      agrarisch innovatie- en praktijkcentrum of een landelijk orgaan en die voor die datum ten laste van het Rijk
      verbonden waren aan een school voor beroepsbegeleidend onderwijs, een school voor middelbaar beroepsonderwijs, een
      school voor voortgezet algemeen volwassenenonderwijs, een vormingsinstituut voor jeugdigen, een instelling voor
      basiseducatie, een landbouwpraktijkschool, of een landelijk orgaan waaruit de instelling, het agrarisch innovatie-
      en praktijkcentrum of het landelijk orgaan voortkomt en die op dat tijdstip aan bij of krachtens de Wet op het
      cursorisch beroepsonderwijs, de [Wet op het voortgezet onderwijs][ref1] of de Kaderwet Volwasseneneducatie 1991
      gegeven voorschriften aanspraken, rechten en verplichtingen ontlenen of kunnen ontlenen, ontlenen of kunnen deze
      met ingang van 1 januari 1996 ontlenen aan [artikel 4.1.2][ref2] onderscheidenlijk [artikel 4.3.2][ref3].


