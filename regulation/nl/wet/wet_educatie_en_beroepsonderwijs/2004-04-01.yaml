        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.7.1
    text: |-
      In afwijking van [artikel 12.3.2][ref1] kan Onze Minister op aanvraag van het bevoegd gezag voor
      bekostiging na 31 juli 1998 in aanmerking brengen een instelling, voortgekomen uit een of meer
      ingevolge de [Wet op het voortgezet onderwijs][ref2], de Wet op het cursorisch beroepsonderwijs of
      de Kaderwet Volwasseneneducatie 1991 bekostigde scholen, instellingen en instituten als bedoeld in
      [artikel 12.3.2, eerste lid][ref3], indien deze instelling niet voldoet aan twee van de vereisten, bedoeld
      in de [onderdelen ][ref4], al dan niet in combinatie met het niet voldoen aan het vereiste, bedoeld in
      [onderdeel ][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.7
