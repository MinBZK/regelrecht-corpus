  - number: 12.3.29
    text: |-
      Ten aanzien van middelbaar beroepsonderwijs waarop [artikel 12.3.2][ref1] van toepassing is, blijft van toepassing
      het bepaalde bij of krachtens de Wet op de onderwijsverzorging zoals luidend zonder de in [artikel 12.4.7][ref2]
      genoemde wijziging.


