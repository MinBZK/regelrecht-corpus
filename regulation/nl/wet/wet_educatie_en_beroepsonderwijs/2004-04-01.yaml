        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002399
  - number: 12.3.6.3
    text: |-
      [Artikel 12.3.5, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.6
    references:
