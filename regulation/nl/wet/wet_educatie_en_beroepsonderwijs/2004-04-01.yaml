      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.26
    text: |-
      Instellingen als bedoeld in [artikel 1.4.1][ref1] die zijn vermeld in het Centraal register, op 31 juli 1997 zijn
      erkend op grond van de [Wet op de erkende onderwijsinstellingen][ref2] en op 31 december 1995 opleidden voor het
      staatsexamen middelbaar economisch en administratief onderwijs, zijn ten behoeve van deelnemers die op 31 juli
      1997 voor de desbetreffende opleiding zijn ingeschreven en die opleiding nog niet hebben voltooid, gerechtigd tot
      het afnemen van de examens van die opleidingen overeenkomstig de op 31 december 1995 geldende bij en krachtens de
      artikelen 29 en 29*a* van de Wet op het voortgezet onderwijs vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003821
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.26
