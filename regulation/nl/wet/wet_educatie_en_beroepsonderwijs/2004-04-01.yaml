  - number: 8.2.1.5
    text: |-
      Het bevoegd gezag kan in bijzondere gevallen afwijken van het eerste tot en met derde lid, indien de deelnemer naar
      verwachting het onderwijs in de desbetreffende beroepsopleiding met voldoende resultaat zal kunnen volgen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
  - number: 8.2.1.6
    text: |-
      Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in [artikel 8.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.2.1
    text: |-
      Op voorstel van organisaties in het voortgezet onderwijs, vertegenwoordigers van de instellingen, de
      landelijke organen, bedoeld in [artikel 9.2.1, tweede lid, onderdeel a][ref1], en de commissies onderwijs-
      bedrijfsleven, bedoeld in [artikel 9.2.1, derde lid][ref2], worden bij ministeriële regeling aangewezen de
      sectoren, bedoeld in de [artikelen 10][ref3], [10b][ref4] en [10d van de Wet op het voortgezet onderwijs][ref5],
      waarop het diploma middelbaar algemeen voortgezet onderwijs, het diploma voorbereidend beroepsonderwijs,
      het diploma mavo-vbo en de diploma's voorbereidend middelbaar beroepsonderwijs betrekking moeten hebben,
      alsmede vakken en andere programma-onderdelen die deel moeten hebben uitgemaakt van het examen ter
      verkrijging van een van deze diploma's, om te kunnen worden ingeschreven voor een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel10
