  - number: 12.3.44
    text: |-
      De op 31 december 1995 geldende voorschriften vastgesteld bij of krachtens de
      [Wet op het voortgezet onderwijs][ref1], de Wet op het cursorisch beroepsonderwijs of de Kaderwet
      Volwasseneneducatie 1991 blijven van toepassing ten aanzien van bedragen waarop de instellingen, bedoeld in
      [artikel 1.3.1][ref2], de agrarische innovatie- en praktijkcentra en de landelijke organen voor 1 januari 1996
      ingevolge de bedoelde voorschriften aanspraak hebben, maar die nog niet zijn vastgesteld of uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.44
