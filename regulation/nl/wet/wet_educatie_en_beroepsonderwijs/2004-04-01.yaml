  - number: 4.3.1
    text: |-
      Het bestuur van het landelijk orgaan stelt jaarlijks het beleid vast met betrekking tot de formatie van het
      landelijk orgaan. Zoveel mogelijk tegelijk met deze vaststelling bepaalt het bestuur functies en taken van het
      personeel van het landelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.1
  - number: 4.3.2.1
    text: |-
      Met inachtneming van bij of krachtens algemene maatregel van bestuur gestelde regels als bedoeld in het tweede
      en derde lid, draagt het bestuur van een landelijk orgaan zorg voor de regeling van de rechtspositie van het
      personeel.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      Bij algemene maatregel van bestuur onderscheidenlijk bij of krachtens algemene maatregel van bestuur kunnen
      voorschriften worden vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.2
  - number: 4.3.2.2.a
    text: salarisschalen en uitgangspunten waaraan een door het bestuur in te richten functiewaarderingssysteem moet voldoen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.2
  - number: 4.3.2.2.b
    text: |-
      rechten en plichten van het personeel en het bestuur bij ziekte, zwangerschap, bevalling, arbeidsongeschiktheid en
      ontslag, dan wel met betrekking tot bedrijfsgezondheidskundige begeleiding, voor zover deze bij wet voorgeschreven
      rechten en verplichtingen te boven gaan, dan wel de voorwaarden waaronder het bestuur deze rechten en plichten
      zelf regelt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.2
  - number: 4.3.2.3
    text: Bij algemene maatregel van bestuur kunnen voorschriften worden vastgesteld betreffende algemene arbeidsduur.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.2
  - number: 4.3.3.1
    text: |-
      Elk landelijk orgaan is aangesloten bij een commissie van beroep, waarbij door elk personeelslid van dat orgaan dat
      rechtstreeks in zijn belang is getroffen, beroep kan worden ingesteld tegen een beslissing, door het bestuur van
      het landelijk orgaan genomen, inhoudende:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.a
    text: een disciplinaire maatregel,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.b
    text: schorsing,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.c
    text: ontslag anders dan op eigen verzoek, voordat de pensioengerechtigde leeftijd is bereikt,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.d
    text: het direct of indirect onthouden van bevordering,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.e
    text: het verminderen van de omvang van de betrekking, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.1.f
    text: de beëindiging van een verlengd tijdelijk dienstverband.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.3.2
    text: |-
      Tijdens de behandeling door de commissie van beroep loopt geen verjaring met betrekking tot rechtsvorderingen ter
      zake van beslissingen die aan het oordeel van de commissie van beroep zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.3
  - number: 4.3.4.1
    text: Een commissie van beroep strekt haar werkzaamheden uit over ten minste drie landelijke organen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.2
    text: |-
      De commissie bestaat uit een even aantal gewone leden en evenveel plaatsvervangende leden. De besturen en
      het personeel van de landelijke organen kiezen elk de helft van het aantal gewone leden en plaatsvervangende
      leden. De gewone leden kiezen de voorzitter, tevens lid, en de plaatsvervangend voorzitter. De voorzitter, de
      plaatsvervangend voorzitter, de gewone leden en de plaatsvervangende leden worden benoemd voor een termijn van ten
      minste drie en ten hoogste vijf jaren. Zij zijn opnieuw benoembaar.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.3
    text: |-
      De leden en de plaatsvervangende leden, alsmede de voorzitter en de plaatsvervangend voorzitter, mogen geen lid
      zijn van het bestuur noch deel uitmaken van het personeel van een aangesloten landelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep ontslag verleend. Bij
      het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van de eerstvolgende maand.
      Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun functie te vervullen alsmede
      indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn veroordeeld. Alvorens het
      ontslag op grond van de derde volzin wordt verleend, wordt de betrokkene van het voornemen tot ontslag in kennis
      gesteld en wordt hem de gelegenheid gegeven zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.5
    text: De uitspraak van de commissie van beroep bindt het bestuur van het landelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.6
    text: |-
      De besturen van de aangesloten landelijke organen stellen voor de commissie van beroep een beroepsreglement
      vast, dat erin voorziet dat een onpartijdig en onafhankelijk functioneren van de commissie is gewaarborgd. In het
      beroepsreglement worden geregeld:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.6.a
    text: de omvang van de commissie van beroep,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.6.b
    text: de zittingstermijn van de leden en plaatsvervangende leden van de commissie,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.6.c
    text: |-
      de rechtsgang bij de commissie van beroep, daaronder begrepen de inhoud en indiening van het beroepschrift, de
      behandeling ter zitting en de voorbereiding daarvan, de uitspraak alsmede de mogelijkheden van verzet, voorlopige
      voorziening en herziening van uitspraken, alsmede,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.6.d
    text: de wijze waarop in het secretariaat wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.4.7
    text: |-
      Het beroepsreglement wordt niet gewijzigd dan nadat de commissie van beroep over de voorgenomen wijziging is
      gehoord.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.4
  - number: 4.3.5
    text: |-
      Het bestuur en het personeel van het landelijk orgaan verstrekken aan de commissie van beroep de inlichtingen die
      zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.3.5
  - number: 6.1.1
    text: |-
      Het bevoegd gezag bepaalt welke beroepsopleidingen de instelling verzorgt. Ten aanzien van die opleidingen geldt
      de aanspraak op bekostiging uitsluitend indien Onze Minister krachtens [artikel 2.1.1][ref1] heeft besloten dat de
      opleidingen voor bekostiging in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.1.2.1
    text: 'Onze Minister stelt een adviescommissie onderwijs-arbeidsmarkt in, belast met:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
  - number: 6.1.2.1.a
    text: |-
      de beoordeling van de doelmatigheid van de beroepsopleidingen die de instellingen voornemens zijn te verzorgen of
      reeds verzorgen, gelet op het geheel en de spreiding van het aanbod van beroepsonderwijs, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
  - number: 6.1.2.1.b
    text: |-
      de in [artikel 7.2.5][ref1] bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.2.2
    text: |-
      De commissie bestaat uit zes leden. Drie leden worden benoemd door Onze Minister. Van de overige leden wordt
      door Onze Minister een lid benoemd op voordracht van de landelijke organen, een lid op voordracht van de
      werkgeversorganisaties en werknemersorganisaties, en een lid op voordracht van de instellingen, bedoeld in de
      [artikelen 1.3.1][ref1] en [1.4.1][ref2]. Onze Minister benoemt voor elk lid een plaatsvervangend lid. De derde
      volzin is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.1.2.3
    text: |-
      De leden en plaatsvervangende leden worden door Onze Minister geschorst en ontslagen. De benoeming geschiedt
      voor een termijn van vier jaren. De leden en plaatsvervangende leden zijn opnieuw benoembaar. De leden en
      plaatsvervangende leden worden tussentijds op eigen verzoek of om zwaarwichtige redenen ontslagen. Aan het ontslag
      om zwaarwichtige redenen kan een schorsing voorafgaan. Degene die een tussentijds opengevallen plaats vervult,
      wordt benoemd voor de duur van de voor degene in wiens plaats hij treedt nog resterende benoemingstermijn.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
  - number: 6.1.2.4
    text: Onze Minister kan aan de leden een tegemoetkoming toekennen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.2
  - number: 6.1.3.1
    text: |-
      Onze Minister kan ten aanzien van een beroepsopleiding, vermeld in het overzicht, bedoeld in
      [artikel 2.1.1, derde lid][ref1], die de instelling voornemens is te verzorgen, de rechten, genoemd in
      [artikel 1.3.1][ref2], onthouden indien de verzorging van die opleiding kennelijk niet doelmatig kan worden geacht,
      gelet op het geheel en de spreiding van het aanbod van beroepsonderwijs. Onze Minister kan alvorens een beschikking
      als bedoeld in de eerste volzin te nemen, de commissie, bedoeld in [artikel 6.1.2][ref3], horen. Indien het betreft
      een beroepsopleiding waarvan Onze Minister ingevolge [artikel 7.2.4][ref4], derde lid, heeft besloten dat zij zowel
      in de beroepsopleidende als de beroepsbegeleidende leerweg kan worden verzorgd, zijn de eerste en tweede volzin van
      overeenkomstige toepassing ten aanzien van de afzonderlijke leerwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.1.3.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
  - number: 6.1.3.2.a
    text: |-
      geen aanspraak bestaat op bekostiging als bedoeld in [artikel 1.3.1][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.3.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.3.2.c
    text: de registratie in het Centraal register wordt geweigerd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
  - number: 6.1.3.3
    text: |-
      Onze Minister neemt een beschikking als bedoeld in het eerste lid voor 1 februari van het jaar waarin een aanvang
      zal worden gemaakt met het onderwijs en doet de commissie, bedoeld in [artikel 6.1.2][ref1], daarvan mededeling.
      Wanneer Onze Minister daarbij afwijkt van het standpunt van de commissie, doet hij de Tweede Kamer der Staten-
      Generaal daarvan mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.4.1
    text: |-
      Onze Minister, gehoord de in [artikel 6.1.2][ref1] genoemde commissie, kan besluiten dat ten aanzien van een
      beroepsopleiding die de instelling verzorgt, de rechten, genoemd in [artikel 1.3.1][ref2], ontnomen worden indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.1.a
    text: gebleken is dat de kwaliteit van die opleiding gedurende een reeks van jaren onvoldoende is geweest,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.1.b
    text: |-
      niet of niet meer wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg,
      het onderwijs of de examens, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.1.c
    text: |-
      indien de verzorging van die opleiding kennelijk niet langer doelmatig kan worden geacht, gelet op het geheel en de
      spreiding van het aanbod van beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.2
    text: 'Een beschikking op grond van het eerste lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.2.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 1.3.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.4.2.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] meer is
      verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.1.4.2.c
    text: de registratie in het Centraal register wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.3
    text: |-
      Bij een beschikking tot ontneming van rechten bepaalt Onze Minister het tijdstip waarop die beschikking van kracht
      wordt zodanig, dat de voor de opleiding ingeschreven deelnemers de opleiding aan een andere instelling binnen een
      redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Onze Minister neemt een beschikking als bedoeld in het eerste lid voor 1 november van het jaar voorafgaand aan het
      studiejaar waarin het in het derde lid bedoelde tijdstip valt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.4
  - number: 6.1.5.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder a][ref1], geeft
      hij aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit
      van de opleiding, en maakt deze in het Centraal register bekend. Onze Minister geeft eerst toepassing aan
      [artikel 6.1.4, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5.1.a
    text: na de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5
  - number: 6.1.5.1.b
    text: |-
      Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5
  - number: 6.1.5.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.1.4, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5a.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.1.4, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.5a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5a
  - number: 6.1.5a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.5a
  - number: 6.1.6.1
    text: |-
      Onze Minister kan ten aanzien van een beroepsopleiding, verzorgd door een instelling ten aanzien waarvan Onze
      Minister in de vier jaren voorafgaand aan de aanmelding voor registratie voor die opleiding toepassing heeft
      gegeven aan [artikel 6.1.4, eerste lid, onder a of onder b][ref1], de rechten, genoemd in [artikel 1.3.1][ref2],
      onthouden wanneer naar het oordeel van Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 6.1.6.1.a
    text: de kwaliteit van die opleiding onvoldoende zal zijn, onderscheidenlijk
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.6
  - number: 6.1.6.1.b
    text: |-
      niet wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg, het
      onderwijs of de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.6
  - number: 6.1.6.2
    text: |-
      [Artikel 6.1.4, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.1.6.3
    text: |-
      Onze Minister neemt een beschikking tot onthouding van rechten als bedoeld in het eerste lid voor 1 november van
      het jaar voorafgaand aan het studiejaar waarin een aanvang gemaakt zal worden met het onderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.1.6
  - number: 6.2.1.1
    text: |-
      De aanvraag om toepassing van [artikel 1.4.1][ref1] geldt mede als aanmelding voor registratie in het Centraal
      register. In aanvulling op de gegevens, bedoeld in [artikel 6.4.1, vijfde lid, onder ][ref2], verschaft het
      bevoegd gezag van een niet uit ’s Rijks kas bekostigde instelling bij de aanmelding de gegevens waaruit blijkt
      dat het onderwijs van voldoende kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde, bedoeld in
      [artikel 1.4.1, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.1.2
    text: |-
      Indien Onze Minister de aanvraag om toepassing van [artikel 1.4.1][ref1] inwilligt, registreert hij bij de
      eerstvolgende gelegenheid daartoe, de opleiding in het Centraal register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1
    text: |-
      Onze Minister kan ten aanzien van een beroepsopleiding, verzorgd door een niet uit ’s Rijks kas bekostigde
      instelling, het recht, bedoeld in [artikel 1.4.1][ref1], ontnemen indien


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1.a
    text: gebleken is dat de kwaliteit van de opleiding gedurende een reeks van jaren onvoldoende is geweest,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.2
  - number: 6.2.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarde, bedoeld in [artikel 1.4.1, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.2.2.1.c
    text: |-
      in strijd is gehandeld met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.2.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden en dat de registratie in het Centraal register wordt
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.2, eerste lid, onder a][ref1], geeft
      hij aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van
      de opleiding, en maakt hij deze in het Centraal register bekend. Onze Minister geeft eerst toepassing aan
      [artikel 6.2.2, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.1.a
    text: na de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3
  - number: 6.2.3.1.b
    text: |-
      Onze Minister aan de hand van een hernieuwd onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3
  - number: 6.2.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.2, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.3
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.2, eerste lid, onder c][ref1], geeft hij
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn van ten minste tien dagen waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3a.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.2.2, eerste lid, onder a en b][ref1], kan Onze Minister op verzoek van het
      bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3a
  - number: 6.2.3a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.2.3a
  - number: 6.3.1.1
    text: |-
      De aanvraag om toepassing van [artikel 1.6.1][ref1] geldt mede als aanmelding voor registratie in het Centraal
      register. Het bevoegd gezag van een exameninstelling verschaft bij de aanmelding de gegevens waaruit blijkt dat
      de externe legitimering van voldoende kwaliteit is of zal zijn, en dat wordt voldaan aan de voorwaarde, bedoeld in
      [artikel 1.6.1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.1.2
    text: |-
      Indien Onze Minister de aanvraag om toepassing van [artikel 1.6.1][ref1] inwilligt, registreert hij bij de
      eerstvolgende gelegenheid daartoe, de exameninstelling bij de desbetreffende opleiding in het Centraal register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.2.1
    text: |-
      Onze Minister kan aan een exameninstelling het recht, bedoeld in [artikel 1.6.1][ref1], ten aanzien van een
      beroepsopleiding ontnemen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.3.2.1.a
    text: gebleken is dat de kwaliteit van de externe legitimering onvoldoende is geweest,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.2
  - number: 6.3.2.1.b
    text: niet of niet meer voldaan wordt aan de voorwaarde, bedoeld in artikel 1.6.1, tweede lid, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.2
  - number: 6.3.2.1.c
    text: |-
      in strijd is gehandeld met [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.3.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat de exameninstelling niet langer gerechtigd is de externe
      legitimering van de beroepsopleiding te verzorgen en dat de registratie bij die opleiding in het Centraal register
      wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.2
  - number: 6.3.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.3.2, eerste lid, onder ][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing, op grond van zijn bevindingen ten aanzien van de kwaliteit van de externe
      legitimering van de opleiding en maakt hij deze in het Centraal register bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.3.2, eerste lid, onder ][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.3
    references:
