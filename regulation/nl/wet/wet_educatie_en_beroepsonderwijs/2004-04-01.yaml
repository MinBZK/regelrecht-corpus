  - number: 8.2.2.2
    text: |-
      In de ministeriële regeling kan onderscheid worden gemaakt naar groepen van deelnemers, dan wel kan worden bepaald
      dat de regeling niet van toepassing is op groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.2.2
  - number: 8.3.1.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 8.1.8, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.1.1.a
    text: |-
      die het onderwijs of de educatie aan de instelling waaraan hij is ingeschreven gedurende een aaneengesloten periode
      van ten minste een maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer
      volgt, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.1
  - number: 8.3.1.1.b
    text: |-
      die niet meer aan een instelling is ingeschreven en evenmin is ingeschreven aan een school als bedoeld
      in de [Wet op het voortgezet onderwijs][ref1] dan wel aan een school of instelling als bedoeld in de
      [Wet op de expertisecentra][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.1.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater
      niet verstaan degene die in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a][ref1], dan wel een getuigschrift van het praktijkonderwijs als bedoeld
      in [artikel 10f van de Wet op het voortgezet onderwijs][ref2] en werkzaam is op grond van een aanstelling of
      arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10f
  - number: 8.3.2.1
    text: |-
      Burgemeester en wethouders dragen zorg voor registratie van de gegevens die het bevoegd gezag ingevolge
      [artikel 8.1.8][ref1] heeft gemeld. Burgemeester en wethouders dragen bovendien zorg voor een systeem van
      doorverwijzing naar onderwijs of arbeidsmarkt van de in [artikel 8.3.1][ref2] bedoelde voortijdige schoolverlaters
      en voor het onderhoud van dit systeem. Het systeem heeft mede betrekking op de gegevens waarover de gemeente
      beschikt in het kader van de uitvoering van de [Leerplichtwet 1969][ref3]. Voor de uitvoering van de eerste en
      tweede volzin kunnen bij ministeriële regeling nadere voorschriften worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0002628
  - number: 8.3.2.2
    text: |-
      Voor de vervulling van hun in het eerste lid bedoelde taken werken de colleges van burgemeester en wethouders
      samen binnen bij of krachtens algemene maatregel van bestuur vastgestelde regio's. Zij maken tevens afspraken
      met instellingen, scholen als bedoeld in de [Wet op het voortgezet onderwijs][ref1], scholen en instellingen als
      bedoeld in de [Wet op de expertisecentra][ref2] en organisaties die zijn betrokken bij het voorkomen en bestrijden
      van voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0003549
  - number: 8.3.2.3
    text: |-
      De gemeentebesturen in een regio wijzen uit hun midden een contactgemeente aan. Deze aanwijzing wordt onverwijld
      gemeld aan Onze Minister. Burgemeester en wethouders van de contactgemeente vervullen coördinerende taken met het
      oog op het voorkomen en bestrijden van voortijdig schoolverlaten. In dat verband:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.3.a
    text: |-
      maken zij afspraken met de in het tweede lid bedoelde scholen, instellingen en organisaties over de inzet en
      verantwoordelijkheid bij het voorkomen en bestrijden van voortijdig schoolverlaten;
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.3.b
    text: dragen zij zorg voor de totstandkoming van een regionaal netwerk van die scholen, instellingen en organisaties;
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.3.c
    text: organiseren en coördineren zij de in het eerste lid bedoelde melding, registratie en doorverwijzing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.4
    text: |-
      Indien gemeentebesturen in een regio een andere contactgemeente aanwijzen, dragen burgemeester en wethouders van de
      vorige contactgemeente alle bescheiden die betrekking hebben op de uitvoering van dit artikel over aan burgemeester
      en wethouders van de opvolgende contactgemeente. De wijziging van de aanwijzing wordt onverwijld gemeld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.5
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het eerste tot en met derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in september ten
      behoeve van de activiteiten van de gemeentebesturen in de regio aan de contactgemeente een specifieke uitkering
      toe. Deze uitkering heeft betrekking op het daarop volgende kalenderjaar. De contactgemeente draagt er zorg voor
      dat de gemeentebesturen in de regio gebruik kunnen maken van de instrumenten die met behulp van deze uitkering
      zijn verwezenlijkt. Bij of krachtens algemene maatregel van bestuur worden regels gegeven voor de berekening en
      betaling van de uitkering. De berekening geschiedt in elk geval aan de hand van het aantal volwassen inwoners van
      de gemeenten in de regio op 1 januari van het jaar voorafgaande aan het jaar van de uitkering, waarbij rekening
      wordt gehouden met het opleidingsniveau en met de etnische achtergrond van die inwoners. Bij de berekening van een
      deel van de uitkering kunnen de volwassen inwoners van gemeenten die op grond van een andere regeling reeds een
      vergoeding voor de bestrijding van voortijdig schoolverlaten ontvangen, buiten beschouwing worden gelaten. Onze
      Minister hanteert het aantal volwassen inwoners van de gemeenten in de regio dat blijkt uit de gegevens die het
      Centraal Bureau voor de Statistiek op verzoek van Onze Minister daarover verstrekt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.6
    text: |-
      Het bevoegd gezag geeft aan de door de gemeenteraad aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.7
    text: |-
      De gemeentebesturen in een regio stellen streefcijfers vast voor de in die regio te behalen resultaten.
      Burgemeester en wethouders van de contactgemeente stellen mede namens de andere gemeenten in de regio jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.8
    text: |-
      Indien burgemeester en wethouders van de contactgemeente het bepaalde bij of krachtens het eerste tot en met
      zevende lid niet nakomen, kan Onze Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze
      Minister gaat niet over tot gehele of gedeeltelijke inhouding dan na overleg met burgemeester en wethouders van
      de contactgemeente. Onze Minister kan de uitkering wederom toekennen indien de reden voor inhouding of opschorting
      is vervallen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
  - number: 8.3.2.9
    text: |-
      Onze Minister kan de in het vijfde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien
      uit de rekening van de gemeente, bedoeld in [artikel 197 van de Gemeentewet][ref1], het gemeentelijk
      verslag omtrent het financieel beheer, bedoeld in [artikel 197 van de Gemeentewet][ref2], het
      verslag van de accountant, bedoeld in [artikel 213, tweede lid, van de Gemeentewet][ref3], dan wel
      uit een afzonderlijke verantwoording, voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4], niet blijkt dat de uitkering is besteed in
      overeenstemming met de bepalingen van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel213
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '197'
      - id: ref3
        bwb_id: BWBR0005416
        artikel: '213'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 8.3.3.1
    text: |-
      Burgemeester en wethouders van de contactgemeente zenden de in [artikel 8.3.2, zevende lid][ref1], bedoelde
      effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.3.2
    text: |-
      Burgemeester en wethouders zijn gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden
      ter inzage te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te
      voeren beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.3
  - number: 8.3.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.3.3
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 10b1 van de Wet op het voortgezet onderwijs][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een school voor voortgezet onderwijs als
      bedoeld in de [Wet op het voortgezet onderwijs][ref2] en het bevoegd gezag van een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b1
      [ref2]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b1
      - id: ref2
        bwb_id: BWBR0002399
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 10b7 van de Wet op het voortgezet onderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10b7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10b7
  - number: 9.1.1.1
    text: |-
      Bijzondere instellingen en agrarische innovatie- en praktijkcentra worden in stand gehouden door
      een rechtspersoon met volledige rechtsbevoegdheid niet zijnde een rechtspersoon als bedoeld in
      [artikel 2:1 van het Burgerlijk Wetboek][ref1], die zich blijkens de statuten of reglementen het geven van
      onderwijs in de zin van deze wet ten doel stelt zonder daarbij het maken van winst te beogen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.1.1.2
    text: |-
      Het bevoegd gezag zendt elke wijziging van de statuten of reglementen binnen vier weken na vaststelling aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.1
  - number: 9.1.2.1
    text: |-
      Het bevoegd gezag van een openbare instelling kan de instandhouding van die instelling overdragen aan een ander
      orgaan dat tot de instandhouding van een openbare instelling bevoegd is.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.2
  - number: 9.1.2.2
    text: |-
      De overdracht geschiedt bij notariële akte. Bij deze akte verbindt de overdragende rechtspersoon zich tevens de
      rechten ten aanzien van gebouwen, terreinen en roerende zaken over te dragen. Deze akte geldt tevens als akte
      van levering als bedoeld in [artikel 3:89 van het Burgerlijk Wetboek][ref1]. In de akte wordt tevens bepaald dat
      de rechtspersoon aan wie wordt overgedragen het personeel in gelijke betrekkingen aan de instelling aanstelt met
      ingang van de datum van overdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 9.1.2.3
    text: |-
      Door overdracht met inachtneming van het eerste en tweede lid treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger met betrekking tot de instelling,
      onverminderd hetgeen verder voor de overgang naar burgerlijk recht is vereist.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.2
  - number: 9.1.2.4
    text: |-
      Van de verplichting tot overdracht van de rechten ten aanzien van gebouwen, terreinen en roerende zaken kan Onze
      Minister in bijzondere omstandigheden ontheffing verlenen. Onze Minister besluit binnen zes maanden na ontvangst
      van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de
      aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.2
  - number: 9.1.3.1
    text: |-
      De rechtspersoon die een bijzondere instelling of een agrarisch innovatie- en praktijkcentrum in stand houdt, kan
      de instandhouding van die instelling onderscheidenlijk dat centrum overdragen aan een andere rechtspersoon die
      voldoet aan [artikel 9.1.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.2
    text: |-
      Op deze overdracht is [artikel 9.1.2, tweede tot en met vierde lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.3.3
    text: |-
      Bij een splitsing als bedoeld in [artikel 334a van Boek 2 van het Burgerlijk Wetboek][ref1] van een rechtspersoon
      die een bijzondere instelling of een agrarisch innovatie- en praktijkcentrum in stand houdt, wordt in de
      splitsingsakte bepaald dat de voortbestaande splitsende rechtspersoon de instelling onderscheidenlijk het centrum
      in stand zal houden of op welke verkrijgende rechtspersoon de instandhouding van de instelling of het centrum
      overgaat. In het laatste geval is [artikel 9.1.2, tweede tot en met vierde lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel334a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 334a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 9.1.4.1
    text: |-
      Elke instelling heeft hetzij een centrale directie hetzij een college van bestuur. Een centrale directie dan wel
      een college van bestuur bestaat uit ten hoogste drie leden, waarvan er een door het bevoegd gezag wordt benoemd
      tot voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.4
  - number: 9.1.4.2
    text: |-
      Een lid van de centrale directie, onderscheidenlijk college van bestuur, kan niet terzelfdertijd lid zijn van een
      centrale directie of college van bestuur van een tweede instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.4
  - number: 9.1.4.3
    text: |-
      De centrale directie heeft onder verantwoordelijkheid van het bevoegd gezag de leiding van de voorbereiding en
      de uitvoering van het beleid van de instelling alsmede de coördinatie van de dagelijkse gang van zaken en van het
      beheer van de instelling. Het college van bestuur is belast met de taken en bevoegdheden van de centrale directie
      alsmede met de door het bevoegd gezag aan het college overgedragen taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.4
  - number: 9.1.5.1
    text: |-
      Het bevoegd gezag van een instelling kan hem bij wettelijk voorschrift opgedragen taken en bevoegdheden overdragen
      aan een alsdan in de plaats van de centrale directie in te stellen college van bestuur.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.5
  - number: 9.1.5.2
    text: |-
      Het college van bestuur van een instelling kan hem bij wettelijk voorschrift opgedragen of door het bevoegd gezag
      overgedragen taken en bevoegdheden overdragen aan het bestuur van een organisatorische eenheid als bedoeld in
      [artikel 9.1.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.5.3
    text: |-
      Indien dat dienstig is voor een goede uitvoering van deze wet, kan het bevoegd gezag de uitoefening van hem bij
      wettelijk voorschrift opgedragen taken en bevoegdheden opdragen aan het bestuur van een landelijk orgaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.5
  - number: 9.1.6
    text: Het bevoegd gezag kan bij bestuursreglement een of meer organisatorische eenheden instellen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.6
  - number: 9.1.7.1
    text: 'Het bevoegd gezag stelt een bestuursreglement vast. In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.1.a
    text: |-
      de taken en bevoegdheden die het bevoegd gezag overdraagt aan het college van bestuur, indien het bevoegd gezag
      toepassing heeft gegeven aan [artikel 9.1.5, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.7.1.b
    text: de richtlijnen voor de uitoefening van de aan het college van bestuur overgedragen taken en bevoegdheden, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.1.c
    text: 'indien de instelling een of meer organisatorische eenheden omvat:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.1.c.1°
    text: |-
      welke bevoegdheden het college van bestuur heeft overgedragen aan het bestuur van de desbetreffende eenheid, indien
      het college van bestuur toepassing heeft gegeven aan [artikel 9.1.5, tweede lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 9.1.7.1.c.2°
    text: |-
      de verhouding van het bestuur van de desbetreffende eenheid tot het bevoegd gezag, het college van bestuur of de
      centrale directie,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.1.c.3°
    text: welke organisatorische eenheden de desbetreffende instelling omvat, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.1.c.4°
    text: welke beroepsopleidingen of opleidingen educatie in die organisatorische eenheden zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.2
    text: |-
      Indien de instelling organisatorische eenheden omvat, worden bij of krachtens het bestuursreglement de
      samenstelling en de werkwijze van het bestuur van de desbetreffende eenheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.3
    text: |-
      Het bevoegd gezag zendt het bestuursreglement, alsmede elke wijziging daarvan, zo spoedig mogelijk aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.1.7.4
    text: |-
      Indien de statuten van een bijzondere instelling de onderwerpen, bedoeld in het eerste lid, tweede volzin, onder
      *a* en *b*, regelen, kan het bevoegd gezag beslissen deze regeling niet op te nemen in het bestuursreglement.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.1.7
  - number: 9.2.1.1
    text: |-
      Een landelijk orgaan wordt in stand gehouden door een rechtspersoon met volledige rechtsbevoegdheid zonder
      winstoogmerk niet zijnde een rechtspersoon als bedoeld in [artikel 2:1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 9.2.1.2
    text: 'Het bestuur van het landelijk orgaan bestaat:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
  - number: 9.2.1.2.a
    text: |-
      ofwel voor een derde deel uit vertegenwoordigers van werkgeversorganisaties, voor een derde deel uit
      vertegenwoordigers van werknemersorganisaties en voor een derde deel uit vertegenwoordigers van de instellingen,
      bedoeld in de [artikelen 1.3.1][ref1] en [1.4.1][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.1.2.b
    text: |-
      ofwel voor de helft uit vertegenwoordigers van werkgeversorganisaties en voor de helft uit vertegenwoordigers van
      werknemersorganisaties.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
  - number: 9.2.1.3
    text: |-
      Aan het landelijk orgaan waarvan de samenstelling van het bestuur voldoet aan het tweede lid, onder *b*, is
      een commissie onderwijs-bedrijfsleven verbonden, die voor de helft bestaat uit vertegenwoordigers van het
      bedrijfsleven en voor de helft uit vertegenwoordigers van de instellingen, bedoeld in de [artikelen 1.3.1][ref1] en
      [1.4.1][ref2], die opleidingen verzorgen op het terrein waarop het landelijk orgaan werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 9.2.1.4
    text: |-
      Het bestuur van het landelijk orgaan kan indien dat dienstig is voor een goede uitvoering van deze wet, aan het
      bevoegd gezag van een instelling de uitoefening van hem bij wettelijk voorschrift opgedragen taken en bevoegdheden
      opdragen, met uitzondering van de in [artikel 7.2.4, eerste lid][ref1], bedoelde taak. Indien het bestuur gebruik
      maakt van deze mogelijkheid, stelt het een reglement vast waarin in elk geval worden vastgelegd de taken en
      bevoegdheden die het bestuur ter uitoefening opdraagt aan het bevoegd gezag, alsmede richtlijnen voor uitoefening
      van de aan het bevoegd gezag opgedragen taken en bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel9.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
