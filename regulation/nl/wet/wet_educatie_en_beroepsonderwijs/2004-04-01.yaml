        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.3.42.3
    text: |-
      Het bevoegd gezag van de instellingen waarop het tweede lid van toepassing is, maakt het eerste in
      [artikel 1.3.6, tweede lid][ref1], bedoelde volledige verslag openbaar voor 1 mei 1999.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.42
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '3'
  - number: 12.3.42.4
    text: |-
      In afwijking van [artikel 1.6.1, tweede lid][ref1], onderdeel *c*, wordt het in dat onderdeel bedoelde verslag
      voor de eerste maal openbaar gemaakt voor 1 mei volgend op het tijdstip met ingang waarvan de exameninstelling
      de externe legitimering met betrekking tot een beroepsopleiding kan verzorgen, en omvat dat eerste verslag een
      uiteenzetting over de te gebruiken methodes van kwaliteitsbeoordeling, de inrichting van de in het eerste lid
      bedoelde kwaliteitsbeoordeling met betrokkenheid van onafhankelijke deskundigen, en de voornemens ten aanzien van
      de kwaliteitsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.42
