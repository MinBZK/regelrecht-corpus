  - number: 12.3.31.1
    text: |-
      Het in [artikel 7.2.4, eerste lid][ref1], bedoelde aantal extern te legitimeren deelkwalificaties is voor de eerste
      maal van toepassing met ingang van 1 augustus 2000. Tot dat tijdstip bedraagt het aantal extern te legitimeren
      deelkwalificaties ten minste 25% van het aantal deelkwalificaties dat verplicht is voor het behalen van het diploma
      van de desbetreffende beroepsopleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.31
