    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      Het tweede lid, onder b en c, is niet van toepassing op een docent voor zover deze is belast met het geven van
      godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel4.2.1
  - number: 4.2.1.4
    text: |-
      Het bevoegd gezag kan, in afwijking van het tweede lid, in een vacature voorzien door de benoeming of
