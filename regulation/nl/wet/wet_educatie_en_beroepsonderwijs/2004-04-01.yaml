    text: deelnemers die zich met ingang van 1 januari 1997 voor een opleiding educatie inschrijven;
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.32
  - number: 12.3.32.1.b
    text: deelnemers die zich met ingang van het studiejaar 1997-1998 voor een beroepsopleiding inschrijven.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.32
  - number: 12.3.32.2
    text: Het eerste lid is van overeenkomstige toepassing op de inschrijving als examendeelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.32
  - number: 12.3.33
    text: |-
      Artikel 62 van de Kaderwet Volwasseneneducatie 1991, artikel 3.89 van de Wet op het cursorisch beroepsonderwijs
      en artikel 75*c* van de Wet op het voortgezet onderwijs zoals luidend op 31 december 1995, vinden tot en met
      31 december 1997 op overeenkomstige wijze toepassing ten aanzien van deelnemers of potentiële deelnemers van
      instellingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.33
  - number: 12.3.34
    text: |-
      Ten aanzien van deelnemers op wie de [artikelen 12.3.23][ref1], [12.3.24][ref2] en [12.3.25][ref3] van toepassing
      zijn, blijven tot het tijdstip waarop deze deelnemers op grond van [artikel 12.3.24, eerste lid][ref4], juncto
      [artikel 12.3.25, zesde lid][ref5], hun opleiding hebben kunnen voltooien, van toepassing de [artikelen 1][ref6],
      [2][ref7], [6][ref8] en [9 van de Les- en cursusgeldwet][ref9] zoals luidend zonder de in [artikel 12.4.6][ref10]
      opgenomen wijzigingen.


