  - number: 6.3.3a.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de instelling ter
      beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.3a
  - number: 6.3.3a.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voorzover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.3.3a
  - number: 6.4.1.1
    text: |-
      Het Centraal register beroepsopleidingen is een systematisch geordende verzameling gegevens met betrekking tot
      de beroepsopleidingen die door de instellingen, bedoeld in de [artikelen 1.3.1][ref1] en [1.4.1][ref2], worden
      verzorgd. Onze Minister is belast met de aanleg, het beheer en de bekendmaking van het register en met het
      verstrekken van informatie uit het register.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6.4.1.2
    text: |-
      Het Centraal register wordt jaarlijks voor 1 februari bekendgemaakt. Van deze bekendmaking wordt mededeling gedaan
      in de *Staatscourant*. Het register heeft betrekking op het studiejaar dat aanvangt in datzelfde jaar.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.3
    text: |-
      Onze Minister stelt de inrichting van het Centraal register vast. Onze Minister stelt de landelijke organen in de
      gelegenheid, hem een voorstel te doen voor de indeling van het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld met betrekking tot het verstrekken van informatie
      uit het Centraal register. Daarbij kan worden bepaald dat voor het verstrekken van informatie aan anderen dan de
      bevoegde gezagsorganen van de instellingen en exameninstellingen waarop deze wet betrekking heeft, een vergoeding
      verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5
    text: 'Het Centraal register bevat van elke beroepsopleiding de volgende gegevens, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.a
    text: |-
      de naam van de opleiding en van de instelling die de opleiding verzorgt, alsmede in welke leerweg of leerwegen de
      opleiding wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.b
    text: welke eindtermen van toepassing zijn,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.c
    text: de indeling in het register,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.d
    text: |-
      of de opleiding vermeld is in het overzicht, bedoeld in [artikel 2.1.1, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.4.1.5.e
    text: de studieduur,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.f
    text: |-
      of het een opleiding gericht op een bepaald beroep betreft, waarvoor bij of krachtens de wet vereisten zijn
      vastgesteld, daaronder mede begrepen vereisten welke zijn neergelegd in Richtlijnen van de Raad van Europese
      Gemeenschappen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.g
    text: de namen van de exameninstellingen die gerechtigd zijn tot het verzorgen van de externe legitimering,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.h
    text: |-
      de in [artikel 5.3, derde lid][ref1], bedoelde samenvatting,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel5
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '5'
        hoofdstuk: '5'
  - number: 6.4.1.5.i
    text: |-
      de waarschuwing, bedoeld in [artikel 6.1.5, eerste lid][ref1], [artikel 6.2.3, eerste lid][ref2], of
      [artikel 6.3.3, eerste lid][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.1.5.j
    text: de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
  - number: 6.4.1.5.k
    text: |-
      het beroep of de beroepencategorie, bedoeld in [artikel 7.2.4, eerste lid, tweede volzin][ref1], op de
      voorbereiding waarvan een assistentopleiding, basisberoepsopleiding, vakopleiding of specialistenopleiding is
      gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 6.4.2.1
    text: |-
      Het bevoegd gezag meldt elke beroepsopleiding met de verzorging waarvan de instelling voornemens is een aanvang te
      maken, voor registratie in het Centraal register aan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
  - number: 6.4.2.2
    text: |-
      De aanmelding geschiedt voor 1 december van het jaar voorafgaand aan het studiejaar met ingang
      waarvan een aanvang gemaakt zal worden met de opleiding, onder vermelding van de gegevens, bedoeld in
      [artikel 6.4.1, vijfde lid, onder ][ref1]. Bij de aanmelding van een nieuwe opleiding of van een wijziging van
      de gegevens, bedoeld in [artikel 6.4.1, vijfde lid, onder ][ref2], voegt het bevoegd gezag van een bekostigde
      instelling de schriftelijke bewijsstukken waaruit de juistheid van de overgelegde gegevens blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.3
    text: |-
      Onze Minister registreert de opleiding overeenkomstig de door het bevoegd gezag overgelegde gegevens in het
      Centraal register en doet de commissie, bedoeld in [artikel 6.1.2][ref1], daarvan mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.4
    text: |-
      Indien de gegevens onjuist of niet volledig zijn, stelt Onze Minister het bevoegd gezag in de gelegenheid om,
      binnen een door Onze Minister te bepalen termijn, alsnog te voorzien in de vereiste gegevens. Onze Minister stelt
      de gegevens, bedoeld in [artikel 6.4.1, vijfde lid, onder ][ref1], ambtshalve vast, wanneer het bevoegd gezag de
      juiste gegevens niet tijdig of niet volledig verstrekt. Onverminderd de [artikelen 6.1.3][ref2], [6.1.4][ref3] en
      [6.1.6][ref4] weigert Onze Minister registratie in het Centraal register uitsluitend wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.4.a
    text: hij de gegevens binnen deze termijn niet of niet volledig heeft ontvangen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
  - number: 6.4.2.4.b
    text: |-
      hij, in afwijking van het oordeel van de commissie, bedoeld in [artikel 6.1.2][ref1], in redelijkheid van oordeel
      is dat geen nieuwe opleiding wordt ingesteld,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.4.c
    text: een herziene indeling evenmin in redelijkheid passend geoordeeld kan worden voor de opleiding, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
  - number: 6.4.2.4.d
    text: |-
      hij de aanvraag, bedoeld in [artikel 6.2.1, eerste lid][ref1], afwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.2.5
    text: |-
      Onverminderd het in dit artikel bepaalde ten aanzien van de gegevens, bedoeld in
      [artikel 6.4.1, vijfde lid, onder ][ref1], is dit artikel van overeenkomstige toepassing bij wijziging van de
      gegevens, bedoeld in [artikel 6.4.1, vijfde lid, onder ][ref2]. Onze Minister wijzigt deze gegevens ambtshalve
      wanneer het bevoegd gezag deze niet tijdig of niet volledig verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.3
    text: |-
      Indien de aanmelding voor registratie betrekking heeft op een opleiding, verzorgd door een instelling ten
      aanzien waarvan Onze Minister in de vier jaren voorafgaand aan de aanmelding voor die opleiding toepassing
      heeft gegeven aan [artikel 6.1.3][ref1], verschaft het bevoegd gezag in aanvulling op de gegevens, bedoeld in
      [artikel 6.4.1, vijfde lid, onder ][ref2], gegevens waaruit blijkt dat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.3.a
    text: het onderwijs van voldoende kwaliteit is, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.3
  - number: 6.4.3.b
    text: |-
      wordt voldaan aan hetgeen bij of krachtens deze wet is bepaald ten aanzien van de kwaliteitszorg, het onderwijs en
      de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.3
  - number: 6.4.4.1
    text: |-
      Onverminderd de [artikelen 6.1.4][ref1] en [6.2.2][ref2] beëindigt Onze Minister de registratie van een opleiding
      indien het bevoegd gezag te kennen geeft dat de instelling de opleiding niet langer zal verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.4.4.2
    text: |-
      De kennisgeving, bedoeld in het eerste lid, geschiedt voor 1 oktober van het jaar voorafgaand aan het eerste
      studiejaar waarin de inschrijving voor de opleiding niet meer openstaat.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.4
  - number: 6.4.4.3
    text: |-
      Onze Minister beëindigt de registratie ambtshalve wanneer de instelling de opleiding niet langer verzorgt en het
      bevoegd gezag de kennisgeving, bedoeld in het eerste lid, niet of niet tijdig doet.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.4.4
  - number: 6.5.1.1
    text: |-
      Het bevoegd gezag van een exameninstelling meldt de externe legitimering die het bevoegd gezag ten aanzien van
      bepaalde deelkwalificaties voornemens is te verzorgen, voor registratie in het Centraal register aan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.1
  - number: 6.5.1.2
    text: |-
      [Artikel 6.4.2, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.5.2
    text: |-
      Indien de aanmelding voor registratie van een exameninstelling betrekking heeft op externe legitimering ten aanzien
      waarvan Onze Minister toepassing heeft gegeven aan [artikel 6.3.2][ref1], verschaft het bevoegd gezag in aanvulling
      op de krachtens [artikel 6.5.1][ref2] te verstrekken gegevens, gegevens waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.5.2.a
    text: de externe legitimering van voldoende kwaliteit is, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.2
  - number: 6.5.2.b
    text: wordt voldaan aan hetgeen overigens bij of krachtens deze wet is bepaald ten aanzien van de externe legitimering.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.2
  - number: 6.5.3.1
    text: |-
      Onverminderd [artikel 6.3.2][ref1] beëindigt Onze Minister de registratie van de externe legitimering voor een
      bepaalde deelkwalificatie met ingang van het tijdstip waarop de externe legitimering niet meer plaatsvindt, indien
      het bevoegd gezag te kennen geeft dat de exameninstelling de desbetreffende externe legitimering niet langer zal
      verzorgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.5.3.2
    text: |-
      [Artikel 6.4.4, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6.5.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 6a.1.1.1
    text: |-
      Onze Minister maakt jaarlijks voor de aanvang van het studiejaar bekend welke instellingen, bedoeld in
      [artikel 1.4a.1, eerste lid][ref1], voor welke opleidingen rechten hebben als bedoeld in dat lid. Deze bekendmaking
      vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.1.1.a
    text: de naam van de instelling en van de opleiding die de instelling verzorgt,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.1
  - number: 6a.1.1.1.b
    text: |-
      in voorkomende gevallen, een waarschuwing als bedoeld in [artikel 6a.1.3][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.1.1.c
    text: in voorkomende gevallen, de bepaling dat de registratie zal worden beëindigd, alsmede het tijdstip waarop.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.1
  - number: 6a.1.1.2
    text: |-
      Als peildatum voor de gegevens, bedoeld in het eerste lid, hanteert Onze Minister 1 juni voorafgaand aan de
      bekendmaking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.1
  - number: 6a.1.2.1
    text: |-
      Onze Minister kan ten aanzien van een opleiding educatie, verzorgd door een instelling als bedoeld in
      [artikel 1.4a.1][ref1], het recht, bedoeld in het eerste lid van dat artikel, ontnemen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.1.a
    text: |-
      gebleken is dat de kwaliteit van een of meer examens of een of meer onderdelen van een examen van die opleiding
      onvoldoende is geweest, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.2
  - number: 6a.1.2.1.b
    text: |-
      niet of niet meer voldaan wordt aan de voorwaarden, bedoeld in [artikel 1.4a.1, eerste lid][ref1], of aan de
      voorwaarde, bedoeld in [artikel 1.4a.1, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 6a.1.2.2
    text: |-
      Een beschikking op grond van het eerste lid houdt in dat aan de examens of onderdelen daarvan geen diploma of
      certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6a.1.3.1
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder a][ref1], geeft hij
      aan het bevoegd gezag een waarschuwing op grond van zijn bevindingen ten aanzien van de kwaliteit van een of
      meer examens of een of meer onderdelen van een examen van die opleiding. Onze Minister geeft eerst toepassing aan
      [artikel 6a.1.2, eerste lid, onder a][ref2], nadat


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.3.1.a
    text: na de waarschuwing ten minste een jaar is verstreken, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.3
  - number: 6a.1.3.1.b
    text: |-
      Onze Minister aan de hand van een hernieuwd onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.3
  - number: 6a.1.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6a.1.2, eerste lid, onder b][ref1], geeft hij aan
      het bevoegd gezag een waarschuwing, onder bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn
      gegeven en desgewenst overleg met hem dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing
      gevolg moet zijn gegeven bedraagt ten minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6a
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.1.4
    text: |-
      Indien het bevoegd gezag van een instelling als bedoeld in [artikel 1.4a.1][ref1], langer dan een studiejaar een
      opleiding educatie niet heeft verzorgd, vervalt van rechtswege het recht om voor de desbetreffende opleiding een
      diploma of certificaat als bedoeld in [artikel 1.4a.1, eerste lid][ref2], uit te reiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel6a.1.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.1.1
    text: |-
      Het onderwijs wordt gegeven en de examens worden afgenomen in het Nederlands. Onverminderd
      [artikel 7.3.4, derde lid][ref1], kan een andere taal worden gebezigd:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.1.1.a
    text: wanneer het onderwijs met betrekking tot die taal betreft, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.1
  - number: 7.1.1.b
    text: |-
      indien de specifieke aard, de inrichting of de kwaliteit van het onderwijs dan wel de herkomst van de deelnemers
      daartoe noodzaakt, overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.1
  - number: 7.1.2.1
    text: |-
      De instelling biedt het onderwijs aan in de vorm van opleidingen. Voor zover het een beroepsopleiding betreft,
      wordt deze opleiding door de instelling in het maatschappelijk verkeer aangeduid met de naam waaronder deze
      opleiding is vermeld in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.2
  - number: 7.1.2.2
    text: |-
      Een opleiding is een samenhangend geheel van onderwijseenheden, gericht op de verwezenlijking van eindtermen
      dan wel gericht op het behalen van een diploma, gelijkwaardig aan een diploma van scholen, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van een dergelijk diploma.
      Een of meer onderwijseenheden van een beroepsopleiding leiden tot een deelkwalificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.1.2.3
    text: |-
      Elke opleiding wordt afgesloten met een examen, uitgezonderd een educatief programma als bedoeld in
      [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref1]. Elke onderwijseenheid die, onderscheidenlijk
      elk samenstel van onderwijseenheden dat leidt tot een deelkwalificatie als bedoeld in [artikel 7.2.3][ref2], wordt
      afgesloten met een toets.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.2
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.1.3
    text: |-
      Eindtermen zijn als zodanig omschreven kwaliteiten op het gebied van kennis, inzicht, vaardigheden en
      in voorkomende gevallen beroepshoudingen, waarover degene die de opleiding voltooit, met het oog op het
      maatschappelijk en beroepsmatig functioneren dient te beschikken, en die in voorkomende gevallen betekenis hebben
      voor de doorstroming naar vervolgonderwijs.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.3
  - number: 7.1.4.1
    text: |-
      Bij het geven van onderwijs aan een leerling van een beroepsopleiding die bij de aanvang van die opleiding
      leerplichtig was en die is opgenomen in een ziekenhuis of die in verband met ziekte thuis verblijft, kan het
      bevoegd gezag van een instelling die de beroepsopleiding verzorgt, worden ondersteund.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.4
  - number: 7.1.4.2
    text: 'De ondersteuning bedoeld in het eerste lid wordt verzorgd door:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.4
  - number: 7.1.4.2.a
    text: |-
      een educatieve voorziening als bedoeld in
      [artikel 1.4, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] indien de leerling
      is opgenomen in een academisch ziekenhuis of


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: 7.1.4.2.b
    text: |-
      een schoolbegeleidingsdienst als bedoeld in [artikel 179 van de Wet op het primair onderwijs][ref1],
      [artikel 165 van de Wet op de expertisecentra][ref2] en [artikel 280 van de Wet op het voortgezet onderwijs][ref3]
      indien de leerling is opgenomen in een ziekenhuis niet zijnde een academisch ziekenhuis dan wel indien de leerling
      in verband met ziekte thuis verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel165
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel280
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '165'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: '280'
  - number: 7.1.4.3
    text: |-
      De ondersteuning bedoeld in het eerste lid kan in overeenstemming tussen de educatieve voorziening dan wel de
      schoolbegeleidingsdienst en de instelling waarbij de leerling is ingeschreven, mede het geven van onderwijs aan de
      leerling betreffen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.1.4
  - number: 7.2.1
    text: Deze titel is van toepassing op beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.1
  - number: 7.2.2.1
    text: 'De volgende beroepsopleidingen worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.a
    text: de assistentopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.b
    text: de basisberoepsopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.c
    text: de vakopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.d
    text: de middenkaderopleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.e
    text: de specialistenopleiding, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.1.f
    text: andere opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.2
    text: 'De in het eerste lid bedoelde opleidingen bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.2.a
    text: |-
      een beroepsopleidende leerweg, omvattend een praktijkdeel van ten minste 20% en minder dan 60% van de studieduur,
      of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.2.b
    text: een beroepsbegeleidende leerweg, omvattend een praktijkdeel van 60% of meer van de studieduur, dan wel
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.2.c
    text: zowel de onder *a* als de onder *b* bedoelde leerweg.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.3
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder *a* tot en met *e*, richten zich op de kwalificatie voor
      opeenvolgende niveaus van beroepsuitoefening, waarbij de assistentopleiding is gericht op het eerste en de
      middenkaderopleiding en de specialistenopleiding op het vierde en hoogste niveau van beroepsuitoefening.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.2.4
    text: |-
      Aan de in het eerste lid bedoelde opleidingen kunnen ten behoeve van individuele deelnemers voorbereidende
      en ondersteunende activiteiten worden toegevoegd ter bevordering van het kunnen instromen in en met gunstig
      gevolg voltooien van de opleiding. Deze activiteiten maken geen deel uit van de opleiding. Voorbereidende en
      ondersteunende activiteiten zijn bestemd voor deelnemers wier vooropleiding naar het oordeel van het bevoegd gezag
      onvoldoende uitzicht biedt op verwezenlijking van de eindtermen van de opleiding binnen redelijke tijd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.2
  - number: 7.2.3
    text: |-
      Eindtermen voor beroepsopleidingen zijn onderverdeeld in deelkwalificaties. Een deelkwalificatie is een combinatie
      van eindtermen, vastgesteld voor een bepaalde beroepsopleiding, die in het licht van de uitoefening van het beroep
      waarop de opleiding is gericht een zelfstandige betekenis hebben.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.3
  - number: 7.2.4.1
    text: |-
      Met het oog op de totstandkoming van een landelijke kwalificatiestructuur, gericht op de aansluiting tussen
      het aanbod van het beroepsonderwijs en de maatschappelijke behoeften daaraan, mede in het licht van de
      arbeidsmarktperspectieven voor afgestudeerden, draagt Onze Minister, in voorkomende gevallen in overeenstemming
      met Onze Minister wie het gezien de aard van de in [artikel 7.2.6][ref1] bedoelde vereisten mede aangaat,
      zorg voor het vaststellen en onderhouden van een samenhangend en gedifferentieerd geheel van eindtermen,
      onderverdeeld in deelkwalificaties, voor beroepsopleidingen die voor de desbetreffende bedrijfstakken of
      beroepencategorieën van betekenis zijn. Op voorstel van het landelijk orgaan worden daartoe voor 1 september bij
      ministeriële regeling per beroepsopleiding vastgesteld de eindtermen, de indeling daarvan in deelkwalificaties,
      de in [artikel 7.2.2, tweede lid][ref2], bedoelde leerwegen, en voor zover het betreft een assistentopleiding,
      basisberoepsopleiding, vakopleiding of specialistenopleiding, het beroep of de beroepencategorie op de
      voorbereiding waarvan de beroepsopleiding is gericht. In geval van een landelijk orgaan waarvan de samenstelling
      van het bestuur voldoet aan [artikel 9.2.1, tweede lid, onder ][ref3], wordt het voorstel gedaan door de
      commissie onderwijs-bedrijfsleven. Van het voorstel maakt mede onderdeel uit een voorstel, ten aanzien van welke
      deelkwalificaties die verplicht zijn voor het behalen van het diploma van de desbetreffende beroepsopleiding
      sprake dient te zijn van externe legitimering, met dien verstande dat de externe legitimering de kleinst mogelijke
      meerderheid omvat van het totale aantal verplichte deelkwalificaties van die opleiding. Het landelijk orgaan,
      onderscheidenlijk de commissie onderwijs-bedrijfsleven, doet zijn onderscheidenlijk haar voorstel voor 1 juni. De
      eindtermen hebben betrekking op opleidingen met de verzorging waarvan de instellingen in het studiejaar na het jaar
      van de vaststelling een aanvang kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.2.4.2
    text: |-
      Bij het voorstel voor de eindtermen voegt het landelijk orgaan, onderscheidenlijk de commissie onderwijs-
      bedrijfsleven, het advies van de commissie, bedoeld in [artikel 6.1.2][ref1], alsmede het voorstel, bedoeld in
      [artikel 1.5.2, tweede lid][ref2]. Uit het voorstel blijkt dat het landelijk orgaan, onderscheidenlijk de commissie
      onderwijs-bedrijfsleven, voldoende acht heeft geslagen op de aansluiting tussen de opleidingen voorbereidend
      beroepsonderwijs, de opleidingen middelbaar algemeen voortgezet onderwijs, de beroepsopleidingen en de opleidingen
      hoger beroepsonderwijs, in elk geval door raadpleging van vertegenwoordigers van die onderwijsvelden. Indien ook
      andere instanties nauw bij het voorstel voor de eindtermen zijn betrokken, maakt het landelijk orgaan in zijn
      voorstel, onderscheidenlijk maakt de commissie onderwijs-bedrijfsleven in haar voorstel melding van de wijze waarop
      het oordeel van die instanties is betrokken in het voorstel.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
  - number: 7.2.4.3
    text: |-
      Bij het vaststellen van de eindtermen besluit Onze Minister of de opleiding wordt verzorgd in de beroepsopleidende
      leerweg of in de beroepsbegeleidende leerweg, dan wel kan worden verzorgd in beide leerwegen. Onze Minister
      besluit bij die gelegenheid tevens welke deelkwalificaties van de beroepsopleiding zijn onderworpen aan externe
      legitimering.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.4
    text: |-
      Het bevoegd gezag stelt de studieduur van de opleiding vast met inachtneming van de studielast. De studieduur kan
      verschillen voor onderscheiden deelnemers of groepen van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5
    text: |-
      De studielast van elke opleiding wordt uitgedrukt in normatieve studiejaren. Een normatief studiejaar telt veertig
      weken van elk veertig uren studie, daaronder mede begrepen het onderricht in de praktijk. De studielast bedraagt
      voor de onderscheiden in [artikel 7.2.2, eerste lid, onder ][ref1], bedoelde opleidingen het volgende aantal
      normatieve studiejaren of het volgende gedeelte daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.4.5.a
    text: ten minste een half jaar en ten hoogste 1 jaar,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5.b
    text: ten minste 2 en ten hoogste 3 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5.c
    text: ten minste 2 en ten hoogste 4 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5.d
    text: ten minste 3 en ten hoogste 4 jaren,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5.e
    text: ten minste 1 jaar en ten hoogste 2 jaren, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.5.f
    text: ten minste 15 weken.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.4.6
    text: Dit artikel is van overeenkomstige toepassing bij wijzigingen van de eindtermen en de indeling daarvan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      De in [artikel 6.1.2, eerste lid, onder b][ref1], bedoelde taak van de in dat artikel bedoelde commissie
      behelst de advisering aan de landelijke organen onderscheidenlijk commissies onderwijs-bedrijfsleven over
      de in [artikel 7.2.4, eerste lid][ref2], bedoelde voorstellen voor de eindtermen. De advisering heeft in
      elk geval betrekking op de vraag of en in hoeverre deze voorstellen bijdragen aan de totstandkoming van een
      kwalificatiestructuur als bedoeld in [artikel 7.2.4, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.6
    text: |-
      Indien ten aanzien van een bepaald beroep bij of krachtens de wet vereisten zijn vastgesteld ten aanzien van de
      kwaliteiten op het gebied van kennis, inzicht, vaardigheden of beroepshoudingen waarover degenen die een opleiding
      gericht op dat beroep voltooien, moeten beschikken, neemt Onze Minister deze vereisten in acht bij de vaststelling
      van de eindtermen. Tot de in de eerste volzin bedoelde vereisten behoren die welke zijn neergelegd in Richtlijnen
      van de Raad van Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.6
  - number: 7.2.7
    text: |-
      Het bevoegd gezag draagt er zorg voor dat de opleidingen zodanig zijn ingericht dat de deelnemers de eindtermen
      binnen de vastgestelde studieduur kunnen bereiken.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.7
  - number: 7.2.8.1
    text: Van elke beroepsopleiding maakt onderricht in de praktijk van het beroep deel uit.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      De beroepspraktijkvorming wordt verzorgd op grondslag van een overeenkomst, gesloten door de in
      [artikel 7.2.9][ref1] genoemde partijen. De overeenkomst regelt de rechten en verplichtingen van partijen en omvat
      met inachtneming van het dienaangaande bij of krachtens deze wet bepaalde, ten minste bepalingen over:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.8.2.a
    text: de duur van de overeenkomst en de omvang van de periode van de beroepspraktijkvorming,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.8.2.b
    text: de begeleiding van de deelnemer,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.8.2.c
    text: |-
      dat deel van de eindtermen dat de deelnemer tijdens de praktijkperiode dient te realiseren en de beoordeling
      daarvan, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.8.2.d
    text: de gevallen waarin en de wijze waarop de overeenkomst voortijdig kan worden ontbonden.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      Het bedrijf dat of de organisatie die de beroepspraktijkvorming verzorgt, draagt zorg voor de begeleiding van
      de deelnemers binnen het bedrijf. Het bevoegd gezag beoordeelt of de deelnemer het in het tweede lid, onder *c*,
      bedoelde deel van de eindtermen heeft gerealiseerd. Met betrekking tot andere deelkwalificaties dan die waarop de
      externe legitimering betrekking heeft, betrekt het bevoegd gezag bij die beoordeling het oordeel van het bedrijf
      onderscheidenlijk de organisatie, met inachtneming van de desbetreffende in de onderwijs- en examenregeling op te
      nemen regels.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.8
  - number: 7.2.9.1
    text: |-
      Het bevoegd gezag van de instelling draagt zorg voor de totstandkoming van de in [artikel 7.2.8][ref1] bedoelde
      overeenkomst. De overeenkomst wordt gesloten door de instelling, de deelnemer en het bedrijf dat of de organisatie
      die de beroepspraktijkvorming verzorgt. De overeenkomst wordt voor zover het de beroepsbegeleidende leerweg
      betreft, mede ondertekend door het bestuur van het desbetreffende landelijk orgaan, dat daarmee verklaart:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.a
    text: |-
      dat het een bedrijf of organisatie betreft met een gunstige beoordeling als bedoeld in [artikel 7.2.10][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.9.1.b
    text: dat de gronden voor deze gunstige beoordeling nog steeds aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.9
  - number: 7.2.9.2
    text: |-
      Indien het bevoegd gezag en het betrokken landelijk orgaan na het sluiten van de in [artikel 7.2.8][ref1] bedoelde
      overeenkomst vaststellen dat de praktijkplaats niet of niet volledig beschikbaar is, de begeleiding tekortschiet
      of ontbreekt, het bedrijf of de organisatie niet langer beschikt over een gunstige beoordeling als bedoeld in het
      eerste lid, of sprake is van andere omstandigheden die maken dat de beroepspraktijkvorming niet naar behoren zal
      kunnen plaatsvinden, bevorderen het bevoegd gezag en het betrokken landelijk orgaan dat een toereikende vervangende
      voorziening beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.2.10.1
    text: |-
      Het landelijk orgaan draagt zorg voor een regelmatige beoordeling van bedrijven en organisaties die de
      beroepspraktijkvorming verzorgen, aan de hand van daartoe door dat orgaan vastgestelde criteria. In geval van een
      landelijk orgaan waarvan de samenstelling van het bestuur voldoet aan [artikel 9.2.1, tweede lid, onder b][ref1],
      worden deze criteria vastgesteld op voorstel van de commissie onderwijs-bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel9
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.10
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '9'
        hoofdstuk: '9'
  - number: 7.2.10.2
    text: |-
      Het landelijk orgaan maakt de in het eerste lid bedoelde criteria bekend. Van deze bekendmaking wordt mededeling
      gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.10
  - number: 7.2.10.3
    text: |-
      De landelijke organen dragen gezamenlijk zorg voor openbaarmaking van een overzicht van bedrijven en organisaties
      met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.10
  - number: 7.2.10.4
    text: |-
      Tot het verzorgen van de beroepspraktijkvorming voor een opleiding of groep van opleidingen zijn uitsluitend
      bevoegd de bedrijven en organisaties met een gunstige beoordeling op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.2.10
  - number: 7.3.1.1
    text: 'De volgende opleidingen educatie worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
  - number: 7.3.1.1.a
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma, bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van dat diploma,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: 7.3.1.1.b
    text: opleidingen gericht op breed maatschappelijk functioneren,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
  - number: 7.3.1.1.c
    text: de opleiding Nederlands als tweede taal I en II, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
  - number: 7.3.1.1.d
    text: andere opleidingen, gericht op sociale redzaamheid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
  - number: 7.3.1.2
    text: |-
      De opleidingen, bedoeld in het eerste lid, onder *b*, sluiten aan bij de basisberoepsopleiding, bedoeld in
      [artikel 7.2.2, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.3.2.1
    text: |-
      De opleiding Nederlands als tweede taal I is gericht op de beheersing van de Nederlandse taal met het oog op
      de uitoefening van functies boven het niveau van ongeschoolde arbeid door hen voor wie het Nederlands niet de
      moedertaal is en die het niveau van het primair onderwijs hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.2
  - number: 7.3.2.2
    text: |-
      De opleiding Nederlands als tweede taal II is gericht op de beheersing van de Nederlandse taal met het oog op de
      uitoefening van hogere functies door hen voor wie het Nederlands niet de moedertaal is en die functioneren op het
      niveau van het middenkader.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.2
  - number: 7.3.3.1
    text: Bij ministeriële regeling worden eindtermen vastgesteld voor de opleidingen Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.3
  - number: 7.3.3.2
    text: |-
      Bij ministeriële regeling kan worden bepaald welke opleidingen in elk geval behoren tot de opleidingen, bedoeld in
      [artikel 7.3.1, eerste lid, onder ][ref1], en kunnen daarvoor eindtermen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3.3
    text: |-
      Het bevoegd gezag stelt eindtermen vast voor de overige opleidingen educatie, met uitzondering van de opleidingen,
      bedoeld in [artikel 7.3.1, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.4.1
    text: |-
      Opleidingen voortgezet algemeen volwassenenonderwijs omvatten het onderwijs dat noodzakelijk is voor het behalen
      van het diploma voorbereidend wetenschappelijk onderwijs, het diploma hoger algemeen voortgezet onderwijs of het
      diploma middelbaar algemeen voortgezet onderwijs, dan wel voor het behalen van onderdelen van het diploma.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de voor het behalen
      van elk der in het eerste lid genoemde diploma’s of onderdelen daarvan noodzakelijke vakken en andere programma-
      onderdelen, en omtrent de cursusduur.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      Ten behoeve van deelnemers met een niet-Nederlandse culturele achtergrond kan onderwijs worden gegeven in de taal
      van het land van oorsprong van die deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.4
  - number: 7.3.4.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs kan Onze Minister toestaan dat wordt afgeweken van het
      bepaalde bij of krachtens dit artikel. Onze Minister besluit binnen zes maanden na ontvangst van een aanvraag.
      Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in
      kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.3.4
  - number: 7.4.1
    text: |-
      Deze paragraaf is van toepassing op beroepsopleidingen en opleidingen educatie, met uitzondering van
      opleidingen voortgezet algemeen volwassenenonderwijs, opleidingen Nederlands als tweede taal I en II en in
      [artikel 7.3.1, eerste lid, onder b en d][ref1], bedoelde opleidingen, voor zover deze deel uitmaken van educatieve
      programma's als bedoeld in [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 7.4.2.1
    text: Het bevoegd gezag van een instelling geeft de deelnemers de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.2
  - number: 7.4.2.2
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en, in voorkomende gevallen, de
      beroepshoudingen die de examinandus zich bij voltooiing van de opleiding moet hebben eigen gemaakt, alsmede de
      beoordeling van de uitkomsten van dat onderzoek aan de hand van de eindtermen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.2
  - number: 7.4.2.3
    text: |-
      Het examen kan bestaan uit afzonderlijke onderdelen. Het examen van een beroepsopleiding is met gunstig
      gevolg afgelegd indien alle toetsen van die opleiding met gunstig gevolg zijn afgelegd, onverminderd
      [artikel 7.4.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.2.4
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.4.3.1
    text: |-
      Het examen van een beroepsopleiding is niet met gunstig gevolg afgelegd dan na een gunstige beoordeling als bedoeld
      in [artikel 7.2.8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.3.2
    text: Het examen van beroepsopleidingen bestaat uit onderdelen die overeenkomen met de deelkwalificaties.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.3
  - number: 7.4.3.3
    text: |-
      Deelnemers die in het bezit zijn van een certificaat van een andere instelling zijn vrijgesteld van het daarmee
      overeenkomende examenonderdeel.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.3
  - number: 7.4.4.1
    text: |-
      Het bevoegd gezag draagt zorg voor de externe legitimering van de daartoe op grond van [artikel 7.2.4][ref1]
      aangewezen deelkwalificaties. Externe legitimering geschiedt door of vanwege exameninstellingen en houdt
      voorzieningen in die waarborgen dat de inhoud en het niveau van de examens ten minste zijn afgestemd op de
      eindtermen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.4.2
    text: |-
      Indien in bijzondere gevallen, verband houdend met [artikel 6.3.2][ref1] of [artikel 6.5.3][ref2], niet langer kan
      worden voorzien in externe legitimering, of ingeval voor een nieuwe in het Centraal register opgenomen opleiding de
      externe legitimering niet of nog niet volledig vorm heeft gekregen, bevordert Onze Minister dat een andere daarvoor
      in aanmerking komende exameninstelling, of indien deze ontbreekt, de desbetreffende instelling of instellingen de
      in verband daarmee noodzakelijke voorzieningen treffen ten behoeve van de deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
        hoofdstuk: '6'
  - number: 7.4.5.1
    text: |-
      Het bevoegd gezag stelt, al dan niet in samenwerking met een of meer bevoegde gezagsorganen van andere
      instellingen, een examencommissie in ten behoeve van de organisatie en het afnemen van de examens voor elke door de
      instelling verzorgde opleiding of voor groepen van opleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.5
  - number: 7.4.5.2
    text: |-
      Het bevoegd gezag benoemt de leden van de examencommissie uit de leden van het personeel van de instelling die met
      het verzorgen van onderwijs in die opleiding of opleidingen zijn belast, en wat de beroepspraktijkvorming betreft
      uit personen die met het verzorgen daarvan voor die opleiding of opleidingen zijn belast.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.5
  - number: 7.4.5.3
    text: |-
      Ten behoeve van het afnemen van het examen wijst de examencommissie examinatoren aan. Als examinator kunnen slechts
      worden aangewezen leden van het personeel van de instelling of van het agrarisch innovatie- en praktijkcentrum
      die met het verzorgen van het desbetreffende onderwijs in de desbetreffende onderwijseenheid zijn belast en wat de
      beroepspraktijkvorming betreft uit personen die met het verzorgen van het desbetreffende onderricht zijn belast.
      Het bevoegd gezag kan in afwijking van de tweede volzin bepalen dat een of meer toetsen worden afgenomen door
      andere examinatoren dan bedoeld in die volzin.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.5
  - number: 7.4.5.4
    text: |-
      Het eerste tot en met derde lid vinden geen toepassing voor zover dat voortvloeit uit de in
      [artikel 7.4.4, eerste lid][ref1], bedoelde voorzieningen waaruit de externe legitimering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.6.1
    text: |-
      Ten bewijze dat een toets of examenonderdeel met goed gevolg is afgelegd, reikt de examencommissie een bewijsstuk
      uit. Indien het examenonderdeel een deelkwalificatie betreft reikt de examencommissie een certificaat uit. Ten
      bewijze dat een examen met goed gevolg is afgelegd reikt de examencommissie een diploma uit. Het examen van
      beroepsopleidingen is eerst dan met goed gevolg afgesloten wanneer zowel de beroepspraktijkvorming als het overige
      deel van het onderricht met goed gevolg zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.6
  - number: 7.4.6.2
    text: |-
      De in het eerste lid bedoelde bewijsstukken vermelden, voor zover zij betrekking hebben op een beroepsopleiding, de
      naam van het landelijk orgaan op voorstel waarvan de eindtermen van die beroepsopleiding zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.6
  - number: 7.4.7.1
    text: |-
      Onze Minister kan een rechtspersoon aanwijzen die tot taak heeft het desgevraagd, aan belanghebbenden of aan de
      bevoegde autoriteit, bedoeld in [artikel 8 van de Algemene wet erkenning EG-beroepsopleidingen][ref1], verstrekken
      van op vergelijking van opleidingen berustende waarderingen of vergelijkingen:


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '8'
  - number: 7.4.7.1.a
    text: van buitenlandse diploma’s of certificaten als bedoeld in die wet alsmede van andere buitenlandse diploma's, met
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.7.1.b
    text: de getuigschriften van overeenkomstige Nederlandse beroepsopleidingen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.7.2
    text: |-
      Bij de vergelijkingen en waarderingen wordt zo mogelijk aangegeven tot welke soort in
      [artikel 7.2.2, eerste lid][ref1], bedoelde beroepsopleiding de desbetreffende opleiding kan worden gerekend
      en met welke in het Centraal register vermelde beroepsopleiding die opleiding vergelijkbaar is of kan worden
      gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.3
    text: 'De vergelijking of waardering wordt slechts verstrekt:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.7.3.a
    text: |-
      op verzoek van de autoriteit, bedoeld in [artikel 8 van de in het eerste lid genoemde wet][ref1], ten behoeve van
      aanvragen van EG-verklaringen als bedoeld in [artikel 10 van die wet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006781#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006781#Artikel10
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0006781
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006781
        artikel: '10'
  - number: 7.4.7.3.b
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan een
      Nederlandse beroepsopleiding, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.7.3.c
    text: |-
      indien deze noodzakelijk is voor deelneming van personen met een buitenlandse beroepskwalificatie aan de
      Nederlandse arbeidsmarkt op een niveau dat overeenkomt met een in [artikel 7.2.2][ref1] bedoeld niveau van
      beroepsuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.7.4
    text: |-
      Onze minister kan beleidsregels stellen met het oog op een doelmatige vervulling van de in het eerste lid genoemde
      taken door de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.7.5
    text: |-
      Onze minister verstrekt, onder door hem op te leggen verplichtingen, aan de rechtspersoon jaarlijks uit 's Rijks
      kas middelen ten behoeve van de uitvoering van de in het eerste lid genoemde taken.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.7
  - number: 7.4.8.1
    text: |-
      Het bevoegd gezag stelt voor elke door de instelling verzorgde opleiding een onderwijs- en examenregeling vast. De
      onderwijs- en examenregeling wordt vastgesteld voor 15 april voorafgaand aan het studiejaar en omvat ten minste:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.a
    text: de onderwijs- en vormingsdoelen, daaronder begrepen de eindtermen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.b
    text: de onderwijseenheden die deel uitmaken van de opleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.c
    text: |-
      de inhoud en inrichting van de opleiding, daaronder begrepen de onderscheiding van de opleiding in leerwegen als
      bedoeld in [artikel 7.2.2, tweede lid][ref1], en de inhoud en inrichting van de beroepspraktijkvorming,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.1.d
    text: de inhoud en, in voorkomende gevallen, de indeling in onderdelen van het examen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.e
    text: |-
      de studieduur van de opleiding en van de daarvan deel uitmakende onderwijseenheden en deelkwalificaties, voor zover
      de studieduur op grond van [artikel 7.2.4][ref1] is vastgesteld voor een groep of voor groepen van deelnemers,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.1.f
    text: |-
      de opleidingstrajecten van een opleiding die voldoen aan de eisen van de [Wet studiefinanciering 2000][ref1] of van
      de [hoofdstukken 3][ref2] en [4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: 7.4.8.1.g
    text: |-
      in voorkomende gevallen, de volgorde waarin, de tijdvakken waarbinnen en het aantal malen per studiejaar dat
      gelegenheid wordt geboden tot het afleggen van de toetsen, het examen of onderdelen daarvan,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.h
    text: |-
      de wijze waarop de toetsen en het examen of onderdelen daarvan worden afgenomen, daaronder begrepen de wijze
      waarop gehandicapte deelnemers in voorkomende gevallen in de gelegenheid worden gesteld de toetsen en het examen of
      onderdelen daarvan af te leggen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.i
    text: |-
      de deelkwalificaties ten aanzien waarvan externe legitimering plaatsvindt, de exameninstelling die de externe
      legitimering verzorgt en de wijze waarop de externe legitimering plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.j
    text: |-
      op welke andere gronden dan genoemd in [artikel 7.4.3, derde lid][ref1], de examencommissie vrijstelling van het
      afleggen van een of meer toetsen en examenonderdelen kan verlenen,


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.8.1.k
    text: |-
      waar nodig, dat het met goed gevolg afleggen van een of meer toetsen of examenonderdelen voorwaarde is voor het
      afleggen van andere toetsen of onderdelen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.l
    text: de wijze waarop en de termijn waarbinnen de deelnemer inzage verkrijgt in zijn beoordeelde schriftelijk werk,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.m
    text: de wijze waarop en de termijn waarbinnen kennis genomen kan worden van schriftelijke opgaven, en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.1.n
    text: de termijn waarbinnen de uitslag van een toets, examenonderdeel en examen bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
  - number: 7.4.8.2
    text: |-
      De examencommissie stelt, met inachtneming van de onderwijs- en examenregeling, regels vast met betrekking
      tot de goede gang van zaken tijdens het afnemen van de toetsen, het examen of de examenonderdelen. Zij
      kan aan de examinatoren richtlijnen en aanwijzingen geven met betrekking tot de beoordeling, onverminderd
      [artikel 7.2.8, derde lid][ref1], en met betrekking tot de vaststelling van de uitslag.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.4.8.3
    text: |-
      Het bevoegd gezag van een instelling als bedoeld in [artikel 1.3.2, eerste lid][ref1], die uitgaat van
      verschillende godsdienstige of levensbeschouwelijke overtuigingen, houdt bij de vaststelling van de onderwijs- en
      examenregeling rekening met die verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.8
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 7.4.9
    text: |-
      Het bevoegd gezag maakt tijdig voor de aanvang van het studiejaar en zodanig dat de aanstaande deelnemer zich een
      goed beeld kan vormen van de inhoud en inrichting van het onderwijs en de examens, de onderwijs- en examenregeling
      bekend.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.9
  - number: 7.4.10
    text: |-
      Deze paragraaf is van toepassing op opleidingen voortgezet algemeen volwassenenonderwijs en de opleidingen
      Nederlands als tweede taal I en II.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.10
  - number: 7.4.11.1
    text: Aan de deelnemers wordt gelegenheid gegeven een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
  - number: 7.4.11.2
    text: |-
      [Artikel 7.4.5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften vastgesteld omtrent de examens van
      de opleidingen voortgezet algemeen volwassenenonderwijs en Nederlands als tweede taal I en II, bedoeld in
      [artikel 7.3.1, eerste lid, onder ][ref1]. Bij deze algemene maatregel van bestuur kunnen tevens voorschriften
      worden gegeven omtrent de examenprogramma’s en de verdeling daarvan in onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.11.4
    text: |-
      Ten behoeve van de bijzondere inrichting van het onderwijs aan een instelling kan Onze Minister toestaan dat wordt
      afgeweken van het bepaalde bij of krachtens het tweede en derde lid. Onze Minister besluit binnen zes maanden na
      ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven, stelt Onze Minister
      de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden
      gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
  - number: 7.4.11.5
    text: |-
      [Artikel 7.4.6][ref1] is van toepassing, met dien verstande dat degene die een onderdeel van het examen Nederlands
      als tweede taal I of II met goed gevolg heeft afgelegd een certificaat ontvangt. Bij of krachtens algemene
      maatregel van bestuur wordt bepaald onder welke voorwaarden het bezit van certificaten aanspraak geeft op een
      diploma.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.11.6
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de artikelen [6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      de in dit artikel bedoelde examens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.4.12
    text: |-
      Deze paragraaf is van toepassing op educatieve programma's als bedoeld in
      [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.12
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 7.4.13
    text: |-
      De toets van een educatief programma omvat een onderzoek naar de kennis, het
      inzicht en de vaardigheden die de deelnemer zich door de deelname aan de in
      [artikel 6, eerste lid, onderdeel a, onder 1° en 2°, van de Wet inburgering nieuwkomers][ref1] bedoelde
      onderdelen van dat programma heeft eigen gemaakt. De toets is zodanig ingericht dat de resultaten die
      daaruit blijken, een indicatie geven van het niveau dat de deelnemer heeft bereikt ten opzichte van de in
      [artikel 11 van die wet][ref2] bedoelde niveaus.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel11
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.13
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '11'
  - number: 7.4.14
    text: |-
      Het bevoegd gezag stelt de inhoud van de toets vast met inachtneming van een door Onze Minister vastgestelde
      regeling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.14
  - number: 7.4.15.1
    text: |-
      Ten bewijze dat een toets is afgelegd, reikt het bevoegd gezag aan de deelnemer een verklaring uit. De verklaring
      vermeldt de in [artikel 7.4.13][ref1] bedoelde resultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.15
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.4.15.2
    text: |-
      Het bevoegd gezag zendt een afschrift van de verklaring aan het college van burgemeester en wethouders, bedoeld in
      [artikel 1, eerste lid, onder b, van de Wet inburgering nieuwkomers][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.15
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '1'
  - number: 7.4.16.1
    text: |-
      De [artikelen 7.4.5][ref1], [7.4.8][ref2] en [7.4.9][ref3] zijn van overeenkomstige toepassing op de educatieve
      programma's en de toetsen, met dien verstande dat de examencommissie als toetsingscommissie optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.4.16.2
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 6:7][ref1], [7:10][ref2] en
      [7:24 van de Algemene wet bestuursrecht][ref3], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      de indiening van een bezwaar- of beroepschrift en voor de daarop te nemen beslissing ter zake van de deelneming aan
      een toets.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.4.16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.1.1
    text: |-
      Het bevoegd gezag stelt al dan niet in samenwerking met een of meer bevoegde gezagsorganen van andere instellingen
      een commissie van beroep voor de examens in, dan wel sluit zich bij een dergelijke commissie aan. Beslissingen van
      de examencommissie of van de examinatoren kunnen worden onderworpen aan het oordeel van een commissie van beroep
      voor de examens.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.1
  - number: 7.5.1.2
    text: |-
      De commissie van beroep voor de examens bestaat uit een even aantal gewone leden en evenveel plaatsvervangende
      leden, een voorzitter, tevens lid, en een plaatsvervangend voorzitter.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.1
  - number: 7.5.1.3
    text: |-
      De voorzitter, de plaatsvervangend voorzitter en de overige leden en plaatsvervangende leden worden door
      het bevoegd gezag benoemd voor een termijn van ten minste drie en ten hoogste vijf jaar. Zij zijn opnieuw
      benoembaar. De leden en de plaatsvervangende leden maken geen deel uit van het bevoegd gezag, van de inspectie
      of van een in [artikel 7.4.5][ref1] bedoelde examencommissie of examinator tegen de beslissing waarvan
      onderscheidenlijk van wie beroep kan worden ingesteld bij de commissie van beroep, noch zijn zij belast met de in
      [artikel 7.2.8, tweede lid, onder c][ref2], bedoelde beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.5.1.4
    text: |-
      Op eigen verzoek wordt aan de leden en plaatsvervangende leden van de commissie van beroep voor de examens
      ontslag verleend. Bij het bereiken van de leeftijd van zeventig jaar wordt hun ontslag verleend met ingang van
      de eerstvolgende maand. Zij worden ontslagen indien zij uit hoofde van ziekte of gebreken ongeschikt zijn hun
      functie te vervullen alsmede indien zij bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf zijn
      veroordeeld. Alvorens het ontslag op grond van het in de derde volzin bepaalde wordt verleend, wordt de betrokkene
      van het voornemen tot ontslag in kennis gesteld en wordt hem de gelegenheid geboden zich ter zake te doen horen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.1
  - number: 7.5.2.1
    text: De commissie van beroep voor de examens oordeelt over beslissingen van de examencommissie of van de examinatoren.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
  - number: 7.5.2.2
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het beroepschrift 3 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 7.5.2.3
    text: |-
      In afwijking van [artikel 7:24, tweede lid, van de Algemene wet bestuursrecht][ref1] beslist de commissie binnen
      twee weken na ontvangst van het beroepschrift tenzij zij deze termijn heeft verlengd met ten hoogste twee weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.2.4
    text: |-
      De commissie stelt een onderzoek in alvorens te beslissen. Zij stelt bij haar beslissing zo nodig vast op welke
      wijze de kandidaat alsnog in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
  - number: 7.5.2.5
    text: |-
      De commissie maakt haar beslissing bekend aan de kandidaat, aan de ouders, voogden of verzorgers van de
      kandidaat indien deze minderjarig is, aan het bevoegd gezag, aan het bedrijf dat of de organisatie die de
      beroepspraktijkvorming verzorgt, en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
  - number: 7.5.2.6
    text: |-
      Indien de commissie het beroep gegrond acht, vernietigt zij de beslissing geheel of gedeeltelijk. In afwijking
      van [artikel 7:25 van de Algemene wet bestuursrecht][ref1] is de commissie niet bevoegd in de plaats van de geheel
      of gedeeltelijk vernietigde beslissing een nieuwe beslissing te nemen. Zij kan bepalen dat opnieuw of, indien de
      beslissing is geweigerd, alsnog in de zaak wordt beslist, dan wel dat het examen of enig onderdeel daarvan opnieuw
      wordt afgenomen onder door de commissie te stellen voorwaarden. De examencommissie of de examinator van wie de
      beslissing is vernietigd, voorziet voor zover nodig opnieuw in de zaak met inachtneming van de uitspraak van de
      commissie van beroep voor de examens. De commissie kan daarvoor in haar uitspraak een termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 7.5.3.1
    text: |-
      In zaken waarin het belang van de appellant een onverwijlde voorziening bij voorraad vordert, kan deze bij
      met redenen omkleed verzoekschrift, in afwachting van de uitspraak in de hoofdzaak, aan de voorzitter van de
      commissie van beroep voor de examens een voorlopige voorziening vragen. De voorzitter beslist op dat verzoek
      na de desbetreffende examencommissie dan wel de desbetreffende examinator te hebben gehoord, althans te hebben
      opgeroepen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.3
  - number: 7.5.3.2
    text: |-
      Herziening van een uitspraak van de commissie kan op verzoek van elk van beide partijen plaatsvinden op grond van
      nader gebleken feiten of omstandigheden die indien deze eerder bekend waren geweest tot een andere uitspraak zouden
      hebben kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.3
  - number: 7.5.4
    text: |-
      De leden van de examencommissie en de examinatoren verstrekken aan de commissie van beroep voor de examens de
      inlichtingen die zij voor de uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.4
  - number: 7.5.5
    text: |-
      De [artikelen 7.5.1 tot en met 7.5.4][ref1] zijn van overeenkomstige toepassing op de toetsen, bedoeld in
      [titel 4][ref2], met dien verstande dat de commissie van beroep voor de examens tevens als commissie van beroep
      voor de toetsen optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.5.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007625
        hoofdstuk: '7'
  - number: 7.6.1.1
    text: |-
      Het bevoegd gezag van een exameninstelling stelt in samenwerking met een of meer bevoegde gezagsorganen van
      andere exameninstellingen een commissie van beroep voor de externe examens in. Beslissingen, genomen door of onder
      verantwoordelijkheid van de exameninstellingen met betrekking tot het afnemen van toetsen kunnen worden onderworpen
      aan het oordeel van de commissie van beroep.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.6.1
  - number: 7.6.1.2
    text: De artikelen 7.5.1, tweede tot en met vierde lid, 7.5.2, 7.5.3 en 7.5.4 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel7.6.1
  - number: 8.1.1.1
    text: |-
      Een ieder die gebruik wenst te kunnen maken van onderwijsvoorzieningen en examenvoorzieningen, dient zich door
      het bevoegd gezag als deelnemer te laten inschrijven. Een ieder die uitsluitend wenst te worden toegelaten
      tot examenvoorzieningen, dient zich door het bevoegd gezag als examendeelnemer te laten inschrijven. Voor de
      inschrijving als examendeelnemer is aan het bevoegd gezag een door dat gezag te bepalen vergoeding verschuldigd.
      De inschrijving voor een opleiding of een onderdeel van een opleiding staat uitsluitend open voor degene waarvan
      de ouders, voogden of verzorgers aantonen, dan wel, indien hij meerderjarig en handelingsbekwaam is, degene die
      aantoont dat hij:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
  - number: 8.1.1.1.a
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
  - number: 8.1.1.1.b
    text: |-
      vreemdeling is en jonger is dan 18 jaar op de eerste dag waarop de opleiding of het onderdeel van de opleiding
      begint waarvoor voor de eerste maal inschrijving wordt gewenst,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
  - number: 8.1.1.1.c
    text: |-
      vreemdeling is, 18 jaar of ouder is op de eerste dag waarop de opleiding of het onderdeel van de opleiding begint
      waarvoor voor de eerste maal inschrijving wordt gewenst en op die dag rechtmatig verblijft houdt in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 8.1.1.1.d
    text: |-
      vreemdeling is, niet meer voldoet aan een van de voorwaarden genoemd onder b of c, en eerder in overeenstemming
      met een van die onderdelen is ingeschreven voor een opleiding of het onderdeel van de opleiding van een instelling,
      welke opleiding of welk onderdeel van de opleiding nog steeds wordt gevolgd en nog niet is voltooid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
  - number: 8.1.1.1a
    text: |-
      Indien na de inschrijving voor de opleiding of een onderdeel van de opleiding blijkt dat deze op welke
      grond dan ook niet in overeenstemming met de vierde volzin van het eerste lid heeft plaatsgevonden, wordt de
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3][ref1], met onmiddellijke ingang ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.2
    text: |-
      De inschrijving geschiedt voor een opleiding, dan wel een onderdeel daarvan. Indien het verzoek om inschrijving
      betrekking heeft op een beroepsopleiding, wordt daarbij aangegeven op welke leerweg het verzoek van toepassing is.
      Tevens wordt bij de inschrijving vastgelegd of sprake is van inschrijving voor een opleidingstraject als bedoeld in
      [artikel 7.4.8, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.1.1.3
    text: |-
      De inschrijving staat uitsluitend open voor degenen ten aanzien van wie het bevoegd gezag beslist dat zij
      tot de instelling worden toegelaten, onverminderd de vierde volzin van het eerste lid, het vijfde lid en
      [artikel 8.1.6][ref1]. Het bevoegd gezag kan het nemen van de beslissing over de toelating opdragen aan een
      door hem in te stellen toelatingscommissie. Het bevoegd gezag regelt de bevoegdheden en de werkzaamheden van de
      toelatingscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1.4
    text: |-
      De toelating tot beroepsopleidingen staat voor zover het de beroepsbegeleidende leerweg betreft, uitsluitend
      open voor degenen voor wie de volledige leerplicht, bedoeld in [paragraaf 2 van de Leerplichtwet 1969][ref1], is
      geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: '2'
  - number: 8.1.1.5
    text: |-
      In afwijking van het derde lid en met inachtneming van [artikel 8.2.1][ref1] en het krachtens [artikel 8.2.2][ref2]
      bepaalde”doch onverminderd de vierde volzin van het eerste lid, staat de inschrijving voor een assistentopleiding
      of basisberoepsopleiding als bedoeld in [artikel 7.2.2, eerste lid][ref3] alsmede voor een educatief programma
      als bedoeld in [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref4], open voor een ieder, met dien
      verstande dat het bevoegd gezag van een bijzondere instelling kan aangeven dat degenen die wensen te worden
      ingeschreven, geacht worden de grondslag en de doelstellingen van de instelling te respecteren. De inschrijving
      kan worden geweigerd dan wel ingetrokken indien de betrokkene de grondslag en de doelstellingen van de instelling
      niet respecteert. De inschrijving aan een bijzondere instelling kan eveneens worden geweigerd dan wel ingetrokken
      indien gegronde vrees bestaat dat de betrokkene van die inschrijving en de daaraan verbonden rechten misbruik zal
      maken door in ernstige mate afbreuk te doen aan de eigen aard van die instelling, dan wel indien is gebleken dat de
      betrokkene van die inschrijving en de daaraan verbonden rechten een dergelijk misbruik heeft gemaakt. De weigering
      dan wel intrekking van de inschrijving geschiedt schriftelijk en is met redenen omkleed. De inschrijving kan niet
      worden ingetrokken op grond van de tweede volzin indien voor betrokkene geen gelegenheid bestaat de opleiding aan
      een andere instelling te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 8.1.1.6
    text: |-
      De toelating tot opleidingen educatie staat uitsluitend open voor volwassenen. Het bevoegd gezag neemt bij de
      toelating tot opleidingen educatie de overeenkomst, bedoeld in [artikel 2.3.4][ref1], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel2
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.1.7
    text: |-
      Bij algemene maatregel van bestuur kunnen in afwijking van de [artikelen 7:10][ref1] en
      [7:24 van de Algemene wet bestuursrecht][ref2], kortere termijnen dan in die artikelen vermeld, worden bepaald voor
      het op een bezwaar- of beroepschrift te nemen besluit ter zake van de toelating van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '7'
  - number: 8.1.1a.1
    text: |-
      De inschrijving bij een instelling, bedoeld in [artikel 8.1.1][ref1], vindt slechts plaats nadat door de deelnemer
      of, indien deze minderjarig is, door de ouders, voogden of verzorgers de gegevens betreffende de geslachtsnaam,
      de voorletters, de geboortedatum, het geslacht en het persoonsgebonden nummer van de deelnemer zijn overgelegd.
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de deelnemer kan worden overgelegd, vindt de inschrijving plaats met
      inachtneming van het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.1a.2
    text: |-
      De in het eerste lid bedoelde gegevens worden overgelegd door middel van een van overheidswege verstrekt
      document dan wel een door een andere school of een school of instelling voor ander onderwijs verstrekt bewijs van
      uitschrijving, waarin de desbetreffende gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
  - number: 8.1.1a.3
    text: |-
      Indien door de deelnemer of, indien deze minderjarig is, door de ouders, voogden of verzorgers aannemelijk wordt
      gemaakt dat geen persoonsgebonden nummer van de leerling kan worden overgelegd, meldt het bevoegd gezag binnen
      twee weken na het besluit tot inschrijving aan de Informatie Beheer Groep de beschikbare gegevens van de deelnemer,
      bedoeld in het eerste lid, alsmede zijn adres en woonplaats.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
  - number: 8.1.1a.4
    text: |-
      De Informatie Beheer Groep verstrekt binnen acht weken na ontvangst van de melding, bedoeld in het derde lid,
      aan het bevoegd gezag het sociaal-fiscaalnummer van de deelnemer, dan wel, indien is gebleken dat hem niet van
      overheidswege een sociaal-fiscaalnummer is verstrekt, het onderwijsnummer van de deelnemer. Het onderwijsnummer is
      een door de Informatie Beheer Groep uitgegeven en aan de deelnemer toegekend persoonsgebonden nummer.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
  - number: 8.1.1a.5
    text: Het bevoegd gezag neemt de in het eerste lid bedoelde gegevens op in de administratie van de instelling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
  - number: 8.1.1a.6
    text: |-
      Indien aan een deelnemer een onderwijsnummer is toegekend en het bevoegd gezag daarna de beschikking krijgt
      over zijn sociaal-fiscaalnummer, neemt het bevoegd gezag dit sociaal-fiscaalnummer terstond als persoonsgebonden
      nummer op in de administratie van de instelling in de plaats van het onderwijsnummer. Het bevoegd gezag meldt
      deze wijziging binnen twee weken aan de Informatie Beheer Groep onder opgave van het sociaal-fiscaalnummer en het
      onderwijsnummer van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.1a
  - number: 8.1.2.1
    text: |-
      Indien binnen redelijke afstand van de woning van de deelnemer niet de gelegenheid bestaat tot het volgen van
      het onderwijs aan een openbare instelling, mag aan deze deelnemer de toelating tot een bijzondere instelling niet
      worden geweigerd op grond van godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.2
  - number: 8.1.2.2
    text: Openbare instellingen zijn toegankelijk voor deelnemers zonder onderscheid naar godsdienst of levensbeschouwing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.2
  - number: 8.1.3.1
    text: Aan de inschrijving ligt een overeenkomst tussen het bevoegd gezag en de deelnemer ten grondslag.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.2
    text: |-
      De overeenkomst wordt, overeenkomstig een door het bevoegd gezag vastgesteld model, schriftelijk aangegaan.
      De overeenkomst wordt gesloten voor de duur van de opleiding dan wel voor het deel van de opleiding waarop de
      inschrijving betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3
    text: |-
      De overeenkomst regelt de rechten en verplichtingen van partijen, daaronder begrepen die, welke voortvloeien uit de
      wet, en omvat ten minste bepalingen over:
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.a
    text: de inhoud en inrichting van het onderwijs waarop de overeenkomst betrekking heeft, alsmede de examenvoorzieningen,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.b
    text: de tijdvakken waarbinnen en, voor zover mogelijk, de lokaties waarop het onderwijs verzorgd wordt,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.c
    text: de wijze waarop partijen uit de overeenkomst voortkomende prestaties gestalte zullen geven,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.d
    text: |-
      de studie- en beroepskeuzevoorlichting en de studiebegeleiding, daaronder begrepen een regelmatige advisering over
      de voortzetting van de studie binnen of buiten de opleiding,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.e
    text: schorsing en verwijdering,
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.f
    text: |-
      tussentijdse beëindiging van de overeenkomst en onmiddellijke ontbinding van de overeenkomst in het geval, bedoeld
      in artikel 8.1.1, lid 1a en
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.3.g
    text: |-
      de schadevergoeding waarop de deelnemer bij beëindiging van de bekostiging of ontneming van rechten als bedoeld in
      artikel 2.1.3 onderscheidenlijk in de artikelen 6.1.4 of 6.2.2 jegens de instelling aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.4
    text: |-
      Indien tot een bijzondere instelling andere deelnemers worden toegelaten dan voor wie de instelling in verband
      met de godsdienstige of levensbeschouwelijke richting wordt in stand gehouden, kunnen deze deelnemers niet worden
      verplicht tot het volgen van onderwijs dat in verband met die richting door de instelling wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.5
    text: Artikel 8.1.1, zevende lid, is van overeenkomstige toepassing op de schorsing en verwijdering van deelnemers.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.6
    text: |-
      Definitieve verwijdering van een deelnemer waarop de Leerplichtwet 1969 van toepassing is, vindt niet plaats dan
      nadat het bevoegd gezag ervoor heeft zorggedragen dat een andere instelling, een school voor speciaal onderwijs of
      een school voor speciaal en voortgezet speciaal onderwijs, dan wel een instelling als bedoeld in artikel 1, onder
      *c*, van de Leerplichtwet 1969 bereid is de deelnemer toe te laten. Indien aantoonbaar gedurende 8 weken zonder
      succes is gezocht naar een zodanige instelling of school waarnaar kan worden verwezen, kan in afwijking van de
      eerste volzin tot definitieve verwijdering worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.7
    text: Dit artikel is van overeenkomstige toepassing op examendeelnemers als bedoeld in artikel 8.1.1, eerste lid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
  - number: 8.1.3.8
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het educatieve programma, bedoeld in
      [artikel 6, eerste lid, van de Wet inburgering nieuwkomers][ref1] voor de desbetreffende deelnemer aanvangt binnen
      vier maanden na de melding, bedoeld in [artikel 2 van die wet][ref2]. De in het eerste lid bedoelde overeenkomst
      tussen het bevoegd gezag en deze deelnemer bevat geen bepalingen over de onderwerpen die zijn geregeld bij
      of krachtens de [Wet inburgering nieuwkomers][ref3]. Het derde lid, onder f en g, blijft ten aanzien van deze
      overeenkomst buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009544
  - number: 8.1.4
    text: |-
      De inschrijving wordt niet afhankelijk gesteld van een andere dan een bij of krachtens de wet geregelde geldelijke
      bijdrage.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.4
  - number: 8.1.5.1
    text: |-
      Indien de omvang van de door de begrotingswetgever beschikbaar gestelde middelen, daaronder voor de toepassing van
      dit artikel mede begrepen middelen ten behoeve van studiefinanciering en tegemoetkoming in de studiekosten, daartoe
      naar het oordeel van Onze Minister aanleiding geeft, overlegt Onze Minister in maart, in het kader van het in
      [artikel 3.1.1][ref1] geregelde overleg, met de bevoegde gezagsorganen en de landelijke organen over de aantallen
      deelnemers voor:


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel3
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.1.5.1.a
    text: |-
      de beroepsbegeleidende leerweg van een bepaalde beroepsopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b en c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.5
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.5.1.b
    text: de beroepsopleidende leerweg van die opleiding.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.5
  - number: 8.1.5.2
    text: |-
      Het overleg strekt ertoe, tot afspraken te komen over de aantallen voor de in het eerste lid bedoelde leerwegen ten
      hoogste in te schrijven deelnemers. Indien deze afspraken tot stand komen, stellen de bevoegde gezagsorganen van de
      desbetreffende instellingen met inachtneming van de overeengekomen aantallen deelnemers gezamenlijk een onderlinge
      verdeling van deze aantallen vast. De inschrijving voor de in het eerste lid bedoelde beroepsopleidende leerweg aan
      de onderscheiden instellingen vindt vervolgens plaats tot ten hoogste het voor elke instelling op de voet van de
      tweede volzin vastgestelde aantal.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.5
  - number: 8.1.5.3
    text: |-
      Indien het in het eerste lid bedoelde overleg naar het oordeel van Onze Minister niet of onvoldoende leidt tot
      afspraken als bedoeld in het tweede lid, kunnen bij ministeriële regeling voor 1 mei volgend op dat overleg de
      aantallen deelnemers worden vastgesteld die in de daarop volgende twee studiejaren ten hoogste voor de eerste maal
      kunnen worden ingeschreven voor de in het eerste lid bedoelde beroepsopleidende leerweg aan al de instellingen die
      deze leerweg verzorgen. In dat geval is het tweede lid, tweede en derde volzin, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.5
  - number: 8.1.6
    text: |-
      Het bevoegd gezag kan de inschrijving voor een bepaalde assistentopleiding of basisberoepsopleiding als bedoeld
      in [artikel 7.2.2, eerste lid][ref1], opschorten voor zover en voor zolang de organisatorische en technische
      capaciteit voor het verzorgen van die opleiding, ook na aantoonbare inspanningen van het bevoegd gezag om te komen
      tot een toereikende capaciteit, daartoe naar zijn oordeel noodzaakt. Met inachtneming van de in de eerste volzin
      bedoelde beperkingen geschiedt de inschrijving in de volgorde van aanmelding voor de desbetreffende opleiding,
      volgens in de onderwijs- en examenregeling te geven regels van procedurele aard.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.6
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 8.1.7.1
    text: |-
      Het bevoegd gezag stelt van iedere aan de instelling ingeschreven deelnemer die valt onder de werking van de
      [Wet studiefinanciering 2000][ref1] of van de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], vast,
      of deze deelnemer gedurende een aaneengesloten periode van ten minste 5 weken zonder geldige reden niet aan het
      onderwijs heeft deelgenomen. In afwijking van de vorige volzin kan Onze Minister bepalen dat voor soorten van
      onderwijs als bedoeld in deze wet, de in die volzin bedoelde vaststelling wordt gedaan indien een ingeschreven
      deelnemer in een of meer vakken niet aan het onderwijs heeft deelgenomen. Onder afwezigheid met geldige reden wordt
      verstaan afwezigheid wegens ziekte van de deelnemer, welke ziekte uitsluitend kan worden aangetoond door middel van
      een gedagtekende verklaring van een arts, en afwezigheid wegens bijzondere familie-omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.2
    text: |-
      Het bevoegd gezag meldt uiterlijk op de derde werkdag na afloop van een periode van afwezigheid van 5 weken aan
      de deelnemer dat daarvan in de administratie van de instelling aantekening is gemaakt en verzoekt de deelnemer om
      opgaaf van de reden van de afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.3
    text: 'Uiterlijk op de vijfde werkdag na de periode van 8 weken stelt het bevoegd gezag vast:'
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.3.a
    text: |-
      of de reden die de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken gaf voor zijn afwezigheid, een
      geldige is, of
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.3.b
    text: |-
      dat de deelnemer binnen 8 weken na de aanvang van de periode van 5 weken geen reden heeft opgegeven voor zijn
      afwezigheid.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.4
    text: |-
      Het bevoegd gezag stelt tevens uiterlijk op de vijfde werkdag na afloop van de periode van 8 weken vast of de
      deelnemer voor het einde van die periode weer aan het onderwijs is gaan deelnemen.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.5
    text: |-
      Het bevoegd gezag meldt uiterlijk de vijfde werkdag na afloop van een periode van 8 weken aan de Informatie Beheer
      Groep de deelnemer die gedurende een aaneengesloten periode van ten minste 5 weken zonder opgave van geldige reden
      niet aan het onderwijs heeft deelgenomen. Tevens meldt het indien die deelnemer voor het einde van de periode van 8
      weken weer aan het onderwijs is gaan deelnemen de datum ervan.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.6
    text: |-
      De periode van 5 weken en de periode van 8 weken worden verlengd met de weken waarin vanwege vakantie geen
      onderwijs werd verzorgd. Zij wordt geacht niet te zijn onderbroken door deze vakantieweken.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.7.7
    text: |-
      Het bevoegd gezag stuurt gelijktijdig met de mededelingen, bedoeld in het vijfde lid, een afschrift
      van de gegevens die over de betrokken deelnemer aan de Informatie Beheer Groep zijn verstrekt aan deze
      betrokkene. Het bevoegd gezag geeft daarbij tevens aan dat afwezigheid als bedoeld in het eerste lid,
      gevolgen heeft voor de studiefinanciering van betrokkene op grond van de [Wet studiefinanciering 2000][ref1]
      of voor de tegemoetkoming onderwijsbijdrage en schoolkosten van betrokkene op grond van de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], alsmede welke beroepsgang voor betrokkene tegen de
      mededeling, bedoeld in het vijfde lid, open staat.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
  - number: 8.1.7.8
    text: |-
      Indien het bevoegd gezag van een bijzondere instelling aan de Informatie Beheer Groep de in het vijfde lid bedoelde
      mededeling heeft gedaan, kan de deelnemer binnen 6 weken na ontvangst van de gegevens, bedoeld in het zevende lid,
      bij het bevoegd gezag schriftelijk bedenkingen uiten tegen die mededeling.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.7
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan burgemeester en wethouders van de gemeente waar de betrokkene woon- of
      verblijfplaats heeft van de gegevens van degene
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet 1969][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002628
