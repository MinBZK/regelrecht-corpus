        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.1.1.a
    text: |-
      een diploma lager beroepsonderwijs, een diploma voorbereidend beroepsonderwijs, of een diploma voorbereidend
      middelbaar beroepsonderwijs voor zover het betreft de kaderberoepsgerichte leerweg,
