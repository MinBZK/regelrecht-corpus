  - number: 12.3.42.2
    text: |-
      In afwijking van [artikel 1.3.6, tweede lid][ref1], wordt het daar bedoelde verslag voor zover het betreft
      instellingen die op grond van [artikel 12.3.1][ref2] op een later tijdstip dan met ingang van 1 januari 1997 voor
      bekostiging in aanmerking zijn gebracht, voor de eerste maal openbaar gemaakt voor 1 mei 1998 en omvat dat eerste
      verslag een uiteenzetting over de te gebruiken methodes van kwaliteitsbeoordeling, de inrichting van de in het
      eerste lid bedoelde kwaliteitsbeoordeling met betrokkenheid van onafhankelijke deskundigen, en de voornemens ten
      aanzien van de kwaliteitsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel12
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel12.3.42
    references:
