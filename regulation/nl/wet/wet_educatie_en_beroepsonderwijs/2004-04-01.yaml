  - number: 1.4.1.1.f
    text: de opneming in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
  - number: 1.4.1.3
    text: |-
      Het in het eerste lid bedoelde bevoegd gezag verstrekt Onze Minister de nodige inlichtingen omtrent de instelling.
      Het bevoegd gezag doet Onze Minister jaarlijks voor 1 maart een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op beroepsopleidingen. Het verslag bevat tevens het aantal deelnemers per
      beroepsopleiding en het aantal uitgereikte certificaten en diploma's, bedoeld in [artikel 7.4.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.4
    text: |-
      Voor zover ten aanzien van een instelling als bedoeld in [artikel 1.3.1][ref1] toepassing is gegeven aan het eerste
      lid, wordt die instelling voor de toepassing van deze wet aangemerkt als een niet uit ’s Rijks kas bekostigde
      instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 1.4.1.5
    text: |-
      [Artikel 1.3.8, eerste tot en met derde lid][ref1], is van overeenkomstige toepassing op instellingen als bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0007625/2004-04-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
        hoofdstuk: I
        paragraaf: '4'
  - number: 1.4a.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een in het tweede lid bedoelde instelling, dat
      aan de met goed gevolg afgelegde examens of onderdelen van examens van een opleiding educatie, verzorgd door
      die instelling, een diploma of certificaat als bedoeld in [artikel 7.4.6][ref1] is verbonden, indien die
      instelling in acht neemt hetgeen bij of krachtens deze wet voor die opleiding is bepaald ten aanzien van de
      kwaliteitszorg, bedoeld in [artikel 1.3.6][ref2], en ten aanzien van het onderwijs, bedoeld in [hoofdstuk 7][ref3],
      met uitzondering van [artikel 7.1.1][ref4], [titel 2][ref5], [titel 4][ref6] voor zover het betreft de
      [artikelen 7.4.3][ref7], [7.4.4][ref8], [7.4.7][ref9] en [paragraaf 3][ref10], en [titel 6][ref11], en eveneens in
      acht neemt hetgeen is bepaald in [artikel 8.1.1, zesde lid, eerste volzin][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Hoofdstuk7
