        artikel: '31'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '34'
  - number: '7.2'
    text: 'In het eerste lid wordt in de definitie van «middelen» tot 1 januari 2011 in plaats van «k en n» gelezen: k en o.'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel7
  - number: '8'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *kinderbijslag:* kinderbijslag op grond van
      de [Algemene Kinderbijslagwet][ref1];
        - *premies volksverzekeringen:* premies volksverzekeringen als bedoeld in de
      [Wet financiering sociale verzekeringen][ref2];
        - *premie werknemersverzekeringen:* werknemersaandeel in de premie, bedoeld in
      [afdeling 2 van hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Afdeling2
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0017745
        afdeling: '2'
  - number: '9.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder netto minimumloon: het minimumloon per
      maand, genoemd in [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1],
      verhoogd met de aanspraak op vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref2]
      over dat minimumloon ten minste aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting,
      premies volksverzekeringen, premies werknemersverzekeringen en de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van de Zorgverzekeringswet][ref3], en vermeerderd met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
