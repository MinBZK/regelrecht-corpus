        artikel: '7'
  - number: '7.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *inkomen:* inkomen als bedoeld in de
      [artikelen 32, eerste en tweede lid][ref1], en [33, eerste tot en met derde lid, van de Wet werk en bijstand][ref2];
        - *middelen:* middelen als bedoeld in [artikel 31 van de Wet werk en bijstand][ref3], met dien verstande dat de
      onderdelen c, j, k en n, van het tweede lid van dat artikel niet van toepassing zijn.
        - *vermogen:* vermogen als bedoeld in [artikel 34, eerste tot en met derde lid, van de Wet werk en bijstand][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '33'
      - id: ref3
