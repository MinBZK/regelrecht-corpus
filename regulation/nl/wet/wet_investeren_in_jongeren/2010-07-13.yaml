  - number: '2.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder jongere: een hier te lande woonachtige
      Nederlander van 16 jaar of ouder doch jonger dan 27 jaar.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2
  - number: '2.2'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      woonachtige vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], met uitzondering van de gevallen,
      bedoeld in artikel 24, tweede lid, van [Richtlijn 2004/38/EG](32004L0038) van het Europees Parlement en de Raad
      van 29 april 2004 betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten voor
      de burgers van de Unie en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en tot
      intrekking van [Richtlijnen 64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194), [73/148/
      EEG](31973L0148), [75/34/EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG]
      (31990L0365) en [93/96/EEG](31993L0096) (*PbEU* L 158).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '2.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere hier te lande woonachtige vreemdelingen dan de in het tweede lid
      bedoelde voor de toepassing van deze wet en de daarop berustende bepalingen met de Nederlander, bedoeld in het
      eerste lid, worden gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2
  - number: 2.3.a
    text: ter uitvoering van een verdrag, dan wel van een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2
  - number: 2.3.b
    text: |-
      indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onderdeel g of h, van die wet][ref2] en zij aan de in die algemene maatregel van
      bestuur gestelde voorwaarden voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2a
    text: In deze wet en de daarop berustende bepalingen wordt onder een woning mede verstaan een woonwagen of een woonschip.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel2a
  - number: '3.1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.1.b
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: '3.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.2.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde die met een ander een gezamenlijke huishouding voert,
      tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in de tweede graad indien er bij één van
      de bloedverwanten in de tweede graad sprake is van zorgbehoefte;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.2.b
    text: als ongehuwd mede aangemerkt de persoon die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: '3.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding, dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: '3.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.4.a
    text: |-
      zij met elkaar gehuwd zijn geweest of in de periode van twee jaar voorafgaande aan de aanvraag, bedoeld in
      [artikel 14][ref1], in het kader van de uitvoering van deze wet als gehuwden zijn aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel14
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '14'
        hoofdstuk: '3'
  - number: 3.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: 3.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: '3.5'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel3
  - number: '4'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *alleenstaande:* de ongehuwde die geen
      tot zijn last komende kinderen heeft en geen gezamenlijke huishouding voert met een ander, tenzij het betreft een
      bloedverwant in de eerste graad of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in
      de tweede graad sprake is van zorgbehoefte;
        - *alleenstaande ouder:* de ongehuwde die de volledige zorg heeft voor een of meer tot zijn last komende kinderen
      en geen gezamenlijke huishouding voert met een ander, tenzij het betreft een bloedverwant in de eerste graad
      of een bloedverwant in de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van
      zorgbehoefte;
        - *gezin:* 1°. de gehuwden tezamen; 2°. de gehuwden met de tot hun last komende kinderen; 3°. de alleenstaande
      ouder met de tot zijn last komende kinderen;
        - *kind:* het in Nederland woonachtige eigen kind of stiefkind of, voor de toepassing van de [artikelen 17][ref1]
      en [35, tweede lid][ref2], het in Nederland woonachtige pleegkind;
        - *ten laste komend kind:* het kind voor wie de alleenstaande ouder of de gehuwde aanspraak op kinderbijslag kan
      maken;
        - *zelfstandige:* de persoon die voor de voorziening in het bestaan is aangewezen op arbeid in eigen bedrijf of
      zelfstandig beroep hier te lande en die: 1°. voldoet aan de wettelijke vereisten voor de uitoefening daarvan; 2°.
      voldoet aan het urencriterium, bedoeld in [artikel 3.6 van de Wet inkomstenbelasting 2001][ref3], en 3°. alleen of
      samen met degenen met wie hij het bedrijf of zelfstandig beroep uitoefent de volledige zeggenschap in dat bedrijf
      of zelfstandig beroep heeft en de financiële risico’s daarvan draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '17'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '35'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *inkomensvoorziening:* de
      inkomensvoorziening, bedoeld in [artikel 24][ref1];
        - *werkleeraanbod:* het aanbieden van algemeen geaccepteerde arbeid, een voorziening gericht op
      arbeidsinschakeling, waaronder begrepen scholing, opleiding of sociale activering alsmede ondersteuning bij
      arbeidsinschakeling;
        - *inkomensvoorzieningsnorm:* de op grond van de [artikelen 26 tot en met 29][ref2] op de jongere van toepassing
      zijnde norm, vermeerderd of verminderd met de op grond van de [artikelen 30 tot en met 35][ref3] door het college
      vastgestelde verhoging of verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '26'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: '5.2'
    text: Onder scholing of opleiding als bedoeld in het eerste lid wordt niet verstaan uit ’s Rijks kas bekostigd onderwijs.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel5
  - number: '6.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *arbeidsinschakeling:* het verkrijgen
      van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref1];
        - *sociale activering:* het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
  - number: '6.2'
    text: |-
      Voor de toepassing van deze wet wordt niet als algemeen geaccepteerde arbeid beschouwd arbeid op grond van
      een dienstbetrekking als bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2]. Voor
      personen die blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoren van de
      [Wet sociale werkvoorziening][ref3] wordt onder een voorziening gericht op arbeidsinschakeling mede verstaan een
      voorziening gericht op het verkrijgen van arbeid in een dienstbetrekking als bedoeld in de [artikelen 2][ref4]
      en [7 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0008903
      [ref4]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel6
    references:
      - id: ref1
