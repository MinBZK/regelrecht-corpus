        artikel: '41'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '9.2'
    text: |-
      De in het eerste lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref1], over het minimumloon en de aanspraak op vakantiebijslag
      daarover, vermeerderd met de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2], en verminderd
      met de premies werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '9.3'
    text: |-
      Indien op grond van de [Wet financiering sociale verzekeringen][ref1] een premie wordt ingehouden waarvan het
      percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen
      regels bij ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: '10'
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet in de plaats van de betrokken
      colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
  - number: '11.1'
    text: Het college is verantwoordelijk voor het doen van een werkleeraanbod.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel11
  - number: '11.2'
    text: Het college is verantwoordelijk voor het verstrekken van een inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel11
  - number: '11.3'
    text: Het college werkt bij de uitvoering van het eerste lid samen met het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel11
  - number: '11.4'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de jongere en
      de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het college kan de in
      de eerste zin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel11
  - number: '11.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het vierde lid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel11
  - number: '12.1'
    text: 'De gemeenteraad stelt bij verordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.1.a
    text: de inhoud van een werkleeraanbod;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.1.b
    text: |-
      het verlagen van het bedrag van de inkomensvoorziening, bedoeld in [artikel 41, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel41
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '41'
        hoofdstuk: '4'
  - number: 12.1.c
    text: het bestrijden van misbruik en oneigenlijk gebruik van deze wet;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.1.d
    text: de wijze waarop jongeren, of hun vertegenwoordigers worden betrokken bij de uitvoering van deze wet;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.1.e
    text: |-
      het verhogen en verlagen van de norm, bedoeld in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel35
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '35'
        hoofdstuk: '4'
  - number: '12.2'
    text: 'De regels bedoeld in het eerste lid, onderdeel d, hebben in ieder geval betrekking op de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.2.a
    text: periodiek overleg wordt gevoerd met de jongeren of hun vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.2.b
    text: de jongeren of vertegenwoordigers onderwerpen voor de agenda van dit overleg kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: 12.2.c
    text: |-
      de jongeren of vertegenwoordigers worden voorzien van de voor een adequate deelname aan het overleg benodigde
      informatie.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel12
  - number: '13.1'
    text: 'Recht op een werkleeraanbod heeft desgevraagd:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
  - number: 13.1.a
    text: |-
      de jongere die zich in de leeftijdscategorie van 16 tot en met 17 jaar bevindt, geen scholing of opleiding
      volgt, minder dan 16 uur per week arbeid verricht en die heeft voldaan aan de kwalificatieplicht, bedoeld in
      [paragraaf 2a van de Leerplichtwet 1969][ref1], dan wel aan wie een vrijstelling van die kwalificatieplicht is
      verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Paragraaf2a
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002628
        paragraaf: 2a
  - number: 13.1.b
    text: |-
      de jongere die zich in de leeftijdscategorie van 18 tot en met 26 jaar bevindt en wiens in aanmerking te nemen
      inkomen lager is dan de inkomensvoorzieningsnorm, waarbij voor het in aanmerking te nemen inkomen het inkomen van
      de echtgenoot buiten beschouwing wordt gelaten.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
  - number: '13.2'
    text: |-
      Het recht, bedoeld in het eerste lid, bestaat jegens het college van de gemeente waar de jongere woonplaats heeft
      als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
  - number: '13.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat het recht op een werkleeraanbod van een jongere zonder
      adres als bedoeld in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] bestaat jegens
      het college van een bij die maatregel aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '13.4'
    text: |-
      Het college, bedoeld in het derde lid, verbindt aan het werkleeraanbod aan een jongere zonder adres als bedoeld
      in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] de verplichting dat hij aangifte
      doet van een door het college ter beschikking gesteld briefadres als bedoeld in artikel 1 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '14.1'
    text: Het college stelt het recht op een werkleeraanbod op aanvraag vast.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel14
  - number: '14.2'
    text: |-
      Het college legt in een rapportage de wensen van de jongere ten aanzien van het werkleeraanbod vast alsmede de
      wijze waarop deze wensen bij de vaststelling van aard, omvang en plaats van het werkleeraanbod zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel14
  - number: '15.1'
    text: |-
      De aanvraag voor een werkleeraanbod is gericht tot het college jegens wie het recht op een werkleeraanbod
      bestaat en wordt overeenkomstig [artikel 30c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ingediend bij het Uitvoeringsinstituut werknemersverzekeringen. Na de overdracht van de
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen aan het college op grond van
      [artikel 30c, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag
      verder behandeld door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '15.2'
    text: |-
      Indien het een aanvraag betreft van een jongere die in een inrichting verblijft, dan wel van een jongere zonder
      adres als bedoeld in [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] wordt, in
      afwijking van het eerste lid, de aanvraag ingediend bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '15.3'
    text: |-
      De gemeenteraad kan, in overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede lid, bij het Uitvoeringsinstituut
      werknemersverzekeringen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel15
  - number: '16.1'
    text: |-
      Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en dat college van
      oordeel is dat het evenmin de aanvraag dient te behandelen, terwijl geen zekerheid kan worden verkregen over het
      college van de gemeente jegens wie het recht op een werkleeraanbod bestaat, draagt het college dat de doorgezonden
      aanvraag heeft ontvangen er zorg voor dat het geschil aanhangig wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel16
  - number: '16.2'
    text: |-
      In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      een werkleeraanbod, of het recht op een inkomensvoorziening jegens het college van de gemeente waar de jongere
      werkelijk verblijft.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel16
  - number: '16.3'
    text: |-
      Kosten verbonden aan het werkleeraanbod, of de inkomensvoorziening, gemaakt door het college van de gemeente,
      bedoeld in het tweede lid, worden vergoed door het college van de gemeente waarvan de taak is waargenomen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel16
  - number: '17.1'
    text: |-
      Het college stemt het werkleeraanbod af op de omstandigheden, krachten en bekwaamheden van de jongere, wiens recht
      op een werkleeraanbod is vastgesteld en stelt hierbij de jongere in de gelegenheid om schriftelijk of mondeling
      zijn wensen omtrent het werkleeraanbod kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
  - number: '17.2'
    text: |-
      Indien het college van oordeel is dat om redenen van lichamelijke, geestelijke of sociale aard van een jongere
      niet kan worden gevergd dat hij uitvoering geeft aan een werkleeraanbod, doet het college aan die jongere geen
      werkleeraanbod. Wanneer het college vaststelt dat de redenen, bedoeld in de eerste zin, niet langer aanwezig zijn,
      wordt aan de jongere alsnog een werkleeraanbod gedaan.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
  - number: '17.3'
    text: |-
      Zorgtaken, voor zover daarmee geen rekening kan worden gehouden door middel van een voorziening gericht op
      arbeidsinschakeling, kunnen worden aangemerkt als een reden van sociale aard als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
  - number: '17.4'
    text: |-
      Aan een jongere die alleenstaande ouder is en die de volledige zorg heeft voor een te zijnen laste komend kind
      tot vijf jaar, doet het college desgevraagd een werkleeraanbod dat gericht is op scholing of een opleiding die de
      toegang tot de arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding
      de krachten of bekwaamheden van die jongere te boven gaat. Indien het college tot dat oordeel is gekomen, biedt het
      college een andere voorziening gericht op arbeidsinschakeling aan.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
  - number: '17.5'
    text: |-
      Het college doet aan een jongere geen werkleeraanbod indien en zolang de jongere niet voldoet aan de verplichting,
      bedoeld in [artikel 45, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel45
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '45'
        hoofdstuk: '5'
  - number: '17.6'
    text: |-
      Aan een jongere die voornemens is een bedrijf of zelfstandig beroep te beginnen kan het college desgevraagd een
      werkleeraanbod doen dat, in afwijking van [artikel 5, eerste lid][ref1], bestaat uit een voorbereidingsperiode van
      ten hoogste twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel5
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '5'
        hoofdstuk: '1'
  - number: '18.1'
    text: |-
      Het besluit van het college, inhoudende dat aan de jongere een werkleeraanbod wordt gedaan, bevat in ieder geval
      een omschrijving van de in het kader van het werkleeraanbod te verrichten activiteit naar aard, omvang en plaats.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel18
  - number: '18.2'
    text: |-
      Indien door buiten de jongere gelegen omstandigheden niet onmiddellijk uitvoering kan worden gegeven aan het
      werkleeraanbod, stelt het college een termijn waarbinnen de uitvoering van het werkleeraanbod in ieder geval zal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel18
  - number: '18.3'
    text: |-
      De termijn, bedoeld in het tweede lid, bedraagt ten hoogste twee maanden, te rekenen vanaf de datum van het
      besluit, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel18
  - number: '19'
    text: |-
      Indien de jongere na afronding van de uitvoering van het werkleeraanbod een in aanmerking te nemen inkomen heeft
      dat lager is dan de inkomensvoorzieningsnorm, doet het college, aansluitend op dat werkleeraanbod ambtshalve aan
      die jongere een nieuw werkleeraanbod.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel19
  - number: '20.1'
    text: |-
      Indien het college vaststelt dat het door een jongere verstrekte adres van hemzelf, van zijn echtgenoot of van
      een kind afwijkt van het adres waaronder die jongere in de gemeentelijke basisadministratie persoonsgegevens staat
      ingeschreven, schort het college het recht op een werkleeraanbod op.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: '20.2'
    text: 'Geen opschorting vindt plaats indien:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: 20.2.a
    text: de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op een werkleeraanbod;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: 20.2.b
    text: de jongere van de afwijking redelijkerwijs geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: 20.2.c
    text: daarvoor naar het oordeel van het college dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: '20.3'
    text: |-
      Het college doet schriftelijk mededeling van de opschorting, bedoeld in het eerste lid, aan de jongere en stelt
      hem daarbij in de gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen adresgegevens te
      doen aanpassen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: '20.4'
    text: |-
      De opschorting wordt beëindigd met ingang van de datum waarop het college gebleken is dat de afwijking, bedoeld in
      het eerste lid, niet meer bestaat.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel20
  - number: '21'
    text: 'Het college kan een aan de jongere gedaan werkleeraanbod intrekken of herzien, indien:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel21
  - number: 21.a
    text: wijziging optreedt in de omstandigheden, krachten of bekwaamheden van de jongere;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel21
  - number: 21.b
    text: |-
      de jongere niet voldoet aan een of meer op hem rustende verplichtingen als bedoeld in [hoofdstuk 5][ref1] en hem
      dit te verwijten valt.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '5'
  - number: '22.1'
    text: |-
      Indien de jongere zich jegens het college herhaaldelijk zeer ernstig misdraagt en hem dit te verwijten valt, kan
      het college die jongere van het recht op een werkleeraanbod uitsluiten.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel22
  - number: '22.2'
    text: |-
      Het college heroverweegt het besluit tot uitsluiting binnen een door hem te bepalen termijn, die ten hoogste een
      maand bedraagt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel22
  - number: '23.1'
    text: 'Geen recht op een werkleeraanbod heeft de jongere, die:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
  - number: 23.1.a
    text: uit ’s Rijks kas bekostigd onderwijs volgt;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
  - number: 23.1.b
    text: rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
  - number: 23.1.c
    text: zijn militaire of vervangende dienstplicht vervult;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
  - number: 23.1.d
    text: |-
      onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
  - number: 23.1.e
    text: |-
      een zelfstandige is die aanspraak kan maken op bijstand op grond van
      [artikel 78f van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel78f
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 78f
  - number: '23.2'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op de jongere die een opleiding als bedoeld in
      [artikel 7.3.1, eerste lid, onderdelen b, c of d, van de Wet educatie en beroepsonderwijs][ref1] volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '23.3'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt binnen of
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden of een inrichting
      als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '24.1'
    text: |-
      De jongere van 18 jaar of ouder, die een aanvraag als bedoeld in [artikel 14][ref1] heeft ingediend, heeft recht op
      een inkomensvoorziening indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel14
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '14'
        hoofdstuk: '3'
  - number: 24.1.a
    text: er geen in aanmerking te nemen vermogen is, en
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
  - number: 24.1.b
    text: het in aanmerking te nemen inkomen lager is dan de inkomensvoorzieningsnorm.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
  - number: '24.2'
    text: |-
      De inkomensvoorziening wordt toegekend vanaf de dag waarop het recht is ontstaan, te rekenen vanaf de datum van de
      aanvraag, bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel14
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '14'
        hoofdstuk: '3'
  - number: '24.3'
    text: |-
      [Artikel 13, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel13
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '13'
        hoofdstuk: '3'
  - number: '24.4'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de jongere zonder hulp niet in staat is tot een
      verantwoorde besteding van zijn bestaansmiddelen, kan het college:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
  - number: 24.4.a
    text: |-
      aan de inkomensvoorziening de verplichting verbinden dat de jongere eraan meewerkt dat het college in naam van de
      jongere noodzakelijke betalingen uit de toegekende inkomensvoorziening verricht;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
  - number: 24.4.b
    text: de inkomensvoorziening in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel24
  - number: '25.1'
    text: |-
      Het college stelt het recht op een inkomensvoorziening ambtshalve vast, gelijktijdig met de vaststelling van het
      recht op een werkleeraanbod.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel25
  - number: '25.2'
    text: |-
      Indien na de ambtshalve vaststelling, bedoeld in het eerste lid, feiten en omstandigheden die van invloed zijn
      op het recht op een inkomensvoorziening wijzigen, stelt het college uit eigen beweging, dan wel op een daartoe
      strekkend verzoek van de jongere, het recht op een inkomensvoorziening opnieuw vast.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel25
  - number: '26'
    text: 'Voor een jongere die alleenstaande is, is de norm per kalendermaand:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel26
  - number: 26.a
    text: 'indien hij zich in de leeftijdscategorie van 18 jaar tot en met 20 jaar bevindt: € 220,01;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel26
  - number: 26.b
    text: 'indien hij zich in de leeftijdscategorie van 21 jaar tot en met 26 jaar bevindt: € 636,69 .'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel26
  - number: '27'
    text: 'Voor een jongere die alleenstaande ouder is, is de norm per kalendermaand:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel27
  - number: 27.a
    text: 'indien hij zich in de leeftijdscategorie van 18 jaar tot en met 20 jaar bevindt: € 474,68 ;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel27
  - number: 27.b
    text: 'indien hij zich in de leeftijdscategorie van 21 jaar tot en met 26 jaar bevindt: € 891,36 .'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel27
  - number: '28.1'
    text: |-
      Voor jongeren die gehuwd zijn en geen te hunnen laste komende kinderen hebben, is de norm per kalendermaand, indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.1.a
    text: 'gehuwden waarvan beide echtgenoten zich in de leeftijdscategorie van 18 tot en met 20 jaar bevinden: € 440,02 ;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.1.b
    text: |-
      gehuwden waarvan een echtgenoot zich in de leeftijdscategorie van 18 tot en met 20 jaar bevindt en de andere zich
      in de leeftijdscategorie van 21 tot en met 26 jaar bevindt: € 856,70 ;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.1.c
    text: 'gehuwden waarvan beide echtgenoten zich in de leeftijdscategorie van 21 tot en met 26 jaar bevinden: € 1 273,37 .'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: '28.2'
    text: |-
      Voor jongeren die gehuwd zijn en een of meer te hunnen laste komende kinderen hebben, is de norm per kalendermaand,
      indien het betreft:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.2.a
    text: 'gehuwden waarvan beide echtgenoten zich in de leeftijdscategorie van 18 tot en met 20 jaar bevinden: € 694,69 ;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.2.b
    text: |-
      gehuwden waarvan een echtgenoot zich in de leeftijdscategorie van 18 tot en met 20 jaar bevindt en de andere zich
      in de leeftijdscategorie van 21 tot en met 26 jaar bevindt: € 1 111,37 ;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.2.c
    text: 'gehuwden waarvan beide echtgenoten zich in de leeftijdscategorie van 21 tot en met 26 jaar bevinden: € 1 273,37 .'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: '28.3'
    text: |-
      Indien een van de gehuwden geen recht op inkomensvoorziening heeft, is voor de rechthebbende echtgenoot de norm
      gelijk aan de norm die voor hem als alleenstaande of als alleenstaande ouder zou gelden.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: '28.4'
    text: |-
      In afwijking van het derde lid wordt, indien gehuwden een of meer te hunnen laste komende kinderen hebben en een
      van de gehuwden algemene bijstand op grond van de [Wet werk en bijstand][ref1] ontvangt, de op die gehuwde van
      toepassing zijnde bijstandsnorm in mindering gebracht op:


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 28.4.a
    text: |-
      de norm, bedoeld in het tweede lid, onderdeel b, indien de jongste echtgenoot zich in de leeftijdscategorie van 18
      tot en met 20 jaar bevindt;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: 28.4.b
    text: |-
      de norm, bedoeld in het tweede lid, onderdeel c, indien de jongste echtgenoot zich in de leeftijdscategorie van 21
      tot en met 26 jaar bevindt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel28
  - number: '29.1'
    text: 'Bij een verblijf in een inrichting is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: 29.1.a
    text: 'een jongere die alleenstaande of een alleenstaande ouder is: € 283,55 ;'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: 29.1.b
    text: 'jongeren die gehuwd zijn: € 441,04 .'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: '29.2'
    text: 'Het bedrag van de norm, bedoeld in het eerste lid, wordt verhoogd:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: 29.2.a
    text: voor een alleenstaande of een alleenstaande ouder met € 54,00 ;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: 29.2.b
    text: voor gehuwden met € 77,00 .
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
  - number: '29.3'
    text: |-
      Indien beide gehuwden recht op inkomensvoorziening hebben en een van de gehuwden in een inrichting verblijft, is
      de norm voor beide gehuwden de som van de norm, bedoeld in het eerste lid, onderdeel a, verhoogd met het bedrag,
      bedoeld in het tweede lid, onderdeel a, en de op de andere echtgenoot van toepassing zijnde norm, bedoeld in de
      [artikelen 26][ref1] en [27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel27
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '27'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      Het college verhoogt de norm, bedoeld in de [artikelen 26, onderdeel b][ref1], en [27, onderdeel b][ref2], met
      een toeslag voor zover de jongere hogere algemeen noodzakelijke kosten van het bestaan heeft dan waarin de norm
      voorziet, als gevolg van het niet of niet geheel kunnen delen van deze kosten met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel27
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '27'
        hoofdstuk: '4'
  - number: '30.2'
    text: De toeslag bedraagt ten hoogste € 254,67  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel30
  - number: '31'
    text: |-
      Het college kan de norm, bedoeld in [artikel 28, eerste, tweede en derde lid][ref1], verlagen voor zover de
      jongeren lagere algemeen noodzakelijke kosten van het bestaan hebben dan waarin de norm voorziet als gevolg van het
      geheel of gedeeltelijk kunnen delen van deze kosten met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
  - number: '32'
    text: |-
      Het college kan de norm, bedoeld in de [artikelen 26][ref1], [27][ref2] en [28][ref3], of de toeslag, bedoeld in
      [artikel 30][ref4], lager vaststellen voor zover de jongere lagere algemeen noodzakelijke kosten van het bestaan
      heeft dan waarin de norm of de toeslag voorziet als gevolg van zijn woonsituatie, waaronder begrepen het niet
      aanhouden van een woning.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '27'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: '33'
    text: |-
      Het college kan voor de jongere die recent de deelname heeft beëindigd aan onderwijs of een beroepsopleiding, de
      norm of de toeslag, bedoeld in [artikel 30][ref1], gedurende zes maanden na het tijdstip van die beëindiging lager
      vaststellen, indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering op grond van
      de [Wet studiefinanciering 2000][ref2] of op een tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond
      van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0011453
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '34.1'
    text: |-
      Het college kan de toeslag, bedoeld in [artikel 30][ref1], voor een alleenstaande van 21 of 22 jaar afwijkend
      vaststellen voorzover het van oordeel is dat, gezien de hoogte van het minimumjeugdloon, de hoogte van deze toeslag
      een belemmering kan vormen voor de aanvaarding van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: '34.2'
    text: |-
      Onder het minimumjeugdloon bedoeld in het eerste lid wordt verstaan het voor de desbetreffende leeftijd geldende
      minimumloon, bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], verminderd
      met de daarover verschuldigde loonheffing en de daarover verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '35.1'
    text: |-
      In de verordening, bedoeld in [artikel 12, eerste lid, onderdeel e][ref1], stelt de gemeenteraad vast voor welke
      categorieën de norm wordt verhoogd of verlaagd en op grond van welke criteria de hoogte van die verhoging of
      verlaging wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel12
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '12'
        hoofdstuk: '2'
  - number: '35.2'
    text: 'In deze verordening stelt de gemeenteraad in elk geval vast dat:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
  - number: 35.2.a
    text: |-
      onverminderd de [artikelen 32][ref1], [33][ref2] en [34][ref3], de toeslag, bedoeld in [artikel 30][ref4], voor
      de alleenstaande en de alleenstaande ouder met zijn ten laste komende kinderen in wiens woning geen ander zijn
      hoofdverblijf heeft, wordt bepaald op het in dat artikel genoemde maximumbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '32'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '33'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '34'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: 35.2.b
    text: |-
      jegens een jongere niet gelijktijdig gebruik gemaakt wordt van de bevoegdheden bedoeld in de [artikelen 33][ref1]
      en [34, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel34
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '33'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '34'
        hoofdstuk: '4'
  - number: '35.3'
    text: |-
      In de verordening worden uitsluitend verhogingen of verlagingen vastgesteld als bedoeld in de
      [artikelen 30 tot en met 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: '35.4'
    text: |-
      Verhoging of verlaging van de norm of afwijkende vaststelling van de toeslag vindt plaats onverminderd
      [artikel 17, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel17
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '17'
        hoofdstuk: '3'
  - number: '36.1'
    text: De hoogte van de inkomensvoorziening is het verschil tussen het inkomen en de inkomensvoorzieningsnorm.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: '36.2'
    text: In de inkomensvoorziening is een vakantietoeslag begrepen ter hoogte van 5 procent van die inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: '36.3'
    text: |-
      De inkomensvoorziening wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente
      die de inkomensvoorziening verleent, op grond van de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is,
      alsmede met de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '36.4'
    text: |-
      Indien een van de gehuwden geen recht op inkomensvoorziening heeft, wordt zijn inkomen slechts in aanmerking
      genomen voor zover het inkomen van de gehuwden tezamen, met inbegrip van de inkomensvoorziening die zou worden
      verleend indien zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.4.a
    text: |-
      indien de echtgenoot die geen recht heeft op inkomensvoorziening jonger is dan 27 jaar, de norm voor gehuwden die
      van toepassing zou zijn geweest indien beide echtgenoten recht op inkomensvoorziening zouden hebben;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.4.b
    text: 'indien de echtgenoot die geen recht heeft op inkomensvoorziening 27 jaar of ouder is:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.4.b.1°
    text: 'indien de gehuwden geen te hunnen laste komende kinderen hebben:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.4.b.1°.a
    text: |-
      indien de jongste echtgenoot zich in de leeftijdscategorie van 18 tot en met 20 jaar bevindt, de norm, bedoeld in
      [artikel 28, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
  - number: 36.4.b.1°.b
    text: |-
      indien de jongste echtgenoot zich in de leeftijdscategorie van 21 tot en met 26 jaar bevindt, de norm, bedoeld in
      [artikel 28, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
  - number: 36.4.b.2°
    text: 'indien de gehuwden een of meer te hunnen laste komende kinderen hebben:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.4.b.2°.a
    text: |-
      indien de jongste echtgenoot zich in de leeftijdscategorie van 18 tot en met 20 jaar bevindt, de norm, bedoeld in
      [artikel 28, tweede lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
  - number: 36.4.b.2°.b
    text: |-
      indien de jongste echtgenoot zich in de leeftijdscategorie van 21 tot en met 26 jaar bevindt, de norm, bedoeld in
      [artikel 28, tweede lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
  - number: '36.5'
    text: |-
      In afwijking van het vierde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voor zover het:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.5.a
    text: |-
      indien hij geen ten laste komende kinderen heeft, de inkomensvoorzieningsnorm niet te boven gaat die van toepassing
      zou zijn indien hij een rechthebbende alleenstaande van 26 jaar was;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: 36.5.b
    text: |-
      indien hij ten laste komende kinderen heeft, de inkomensvoorzieningsnorm niet te boven gaat die van toepassing zou
      zijn indien hij een rechthebbende alleenstaande ouder van 26 jaar was.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: '36.6'
    text: |-
      Indien een jongere die recht heeft op een inkomensvoorziening in de omstandigheid verkeert dat hij, op basis
      van een overeenkomst met een ander persoon, met die ander persoon een kind overwegend in gelijke mate verzorgt
      en onderhoudt, zonder met die andere persoon een gezamenlijke huishouding te voeren, stemt het college de
      inkomensvoorziening af op die omstandigheid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel36
  - number: '37.1'
    text: |-
      Het college verleent uiterlijk binnen vier weken na de datum waarop de aanvraag, bedoeld in [artikel 14][ref1], is
      ingediend, en vervolgens telkens na vier weken, bij wijze van voorschot een inkomensvoorziening in de vorm van een
      renteloze geldlening, zolang het recht op een inkomensvoorziening niet is vastgesteld. De eerste zin is niet van
      toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel14
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '14'
        hoofdstuk: '3'
  - number: 37.1.a
    text: |-
      de jongere de voor de vaststelling van het recht op inkomensvoorziening van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      jongere anderszins onvoldoende medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel37
  - number: 37.1.b
    text: bij de aanvraag duidelijk is dat geen recht op inkomensvoorziening bestaat.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel37
  - number: '37.2'
    text: |-
      De hoogte van het voorschot, bedoeld in het eerste lid, bedraagt in ieder geval 90% van de hoogte van de
      inkomensvoorziening, bedoeld in [artikel 36, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel36
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '36'
        hoofdstuk: '4'
  - number: '37.3'
    text: |-
      Indien de inkomensvoorziening wordt verleend over een periode waarover met toepassing van het eerste lid een
      voorschot is verleend, wordt deze inkomensvoorziening zonder machtiging van de jongere verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel37
  - number: '38.1'
    text: |-
      De inkomensvoorziening wordt per kalendermaand vastgesteld en betaald. In afwijking van de eerste zin wordt de
      vakantietoeslag, voor zover niet reeds eerder betaald, jaarlijks betaald in de maand juni over de aan die maand
      voorafgaande maanden waarin de inkomensvoorziening aan de jongere is verstrekt, tot een maximum van twaalf maanden
      of zo veel eerder als de vakantietoeslag over deze periode vaststaat, dan wel binnen drie maanden volgend op de
      maand waarin de inkomensvoorziening is beëindigd.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: '38.2'
    text: |-
      Indien naar het oordeel van het college bijzondere omstandigheden daartoe aanleiding geven, kan het college
      besluiten de inkomensvoorziening over een andere periode dan als bedoeld in het eerste lid vast te stellen of te
      betalen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: '38.3'
    text: |-
      De inkomensvoorziening wordt vastgesteld over het deel van de kalendermaand waarover recht op inkomensvoorziening
      bestaat, indien de alleenstaande of het gezin voorafgaand aan of volgend op de vaststelling van het recht op
      inkomensvoorziening:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: 38.3.a
    text: gedurende een periode van ten minste 30 dagen geen inkomensvoorziening ontvangt; of
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: 38.3.b
    text: anderszins geen recht op inkomensvoorziening heeft.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: '38.4'
    text: |-
      De inkomensvoorziening wordt uitbetaald aan ieder van de rechthebbende echtgenoten voor de helft, dan wel op hun
      gezamenlijk verzoek aan een van hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: '38.5'
    text: |-
      In geval van overlijden van een van de echtgenoten die rechthebbend is, van de alleenstaande ouder, van het laatste
      ten laste komende kind van gehuwden waarvan de leeftijd van een echtgenoot of beide echtgenoten 18, 19 of 20 jaar
      is, of van het laatste ten laste komende kind van de alleenstaande ouder, wordt de inkomensvoorziening tot en
      met één maand na de dag van het overlijden, betaald naar de op het moment van overlijden van toepassing zijnde
      inkomensvoorzieningsnorm aan de andere echtgenoot, de ten laste komende kinderen, de echtgenoten, onderscheidenlijk
      de gewezen alleenstaande ouder.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel38
  - number: '39.1'
    text: De inkomensvoorziening is niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39
  - number: '39.2'
    text: |-
      Beslag op de inkomensvoorziening is slechts geldig voor zover de jongere blijft beschikken over een inkomen gelijk
      aan de beslagvrije voet, bedoeld in [artikel 475d van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '39.3'
    text: |-
      Een machtiging tot het in ontvangst nemen van de inkomensvoorziening, onder welke vorm of welke benaming ook
      verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39
  - number: '39.4'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39
  - number: 39a.1
    text: Tenzij in deze wet anders is bepaald, wordt de inkomensvoorziening verleend om niet.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39a
  - number: 39a.2
    text: |-
      Indien het college de inkomensvoorziening verleent in de vorm van een geldlening kan het college hieraan
      verplichtingen verbinden die zijn gericht op meer zekerheid voor de nakoming van de aan deze inkomensvoorziening
      verbonden rente- en aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39a
  - number: 39a.3
    text: |-
      Indien de jongere aan wie een inkomensvoorziening in de vorm van een geldlening wordt verleend een
      inkomensvoorziening, algemene bijstand op grond van de [Wet werk en bijstand][ref1] of een uitkering op grond van
      het [Besluit bijstandverlening zelfstandigen 2004][ref2] of de [Wet werk en inkomen kunstenaars][ref3] ontvangt, is
      het college bevoegd tot verrekening van die geldlening met die inkomensvoorziening, algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015711
      [ref3]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0015711
      - id: ref3
        bwb_id: BWBR0017837
  - number: '40.1'
    text: |-
      Het college kan het recht op een inkomensvoorziening opschorten indien de jongere te verwijten valt dat hij de voor
      de vaststelling van het recht op een inkomensvoorziening van belang zijnde gegevens of de gevorderde bewijsstukken
      niet, niet tijdig of onvolledig heeft verstrekt, dan wel anderszins onvoldoende medewerking verleent aan het
      onderzoek van het college met betrekking tot zijn recht op een werkleeraanbod of een inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
  - number: '40.2'
    text: |-
      Het college doet mededeling van de opschorting aan de jongere en nodigt hem uit binnen een door het college
      gestelde termijn het verzuim, bedoeld in het eerste lid, te herstellen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
  - number: '40.3'
    text: 'Het college kan een besluit tot vaststelling van de inkomensvoorziening herzien of intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
  - number: 40.3.a
    text: |-
      het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 30c, tweede of derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van inkomensvoorziening; of


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 40.3.b
    text: anderszins de inkomensvoorziening ten onrechte of tot een te hoog bedrag is verleend.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
  - number: '40.4'
    text: |-
      Als na het verstrijken van een periode van drie maanden de opschorting, bedoeld in [artikel 20, eerste lid][ref1],
      niet is beëindigd, trekt het college het besluit tot vaststelling van de inkomensvoorziening in met ingang van
      de dag waarop de opschorting, bedoeld in dat artikel inging. Als de jongere het verzuim, bedoeld in het eerste
      lid, niet herstelt binnen de daarvoor gestelde termijn, trekt het college na het verstrijken van deze termijn
      het besluit tot vaststelling van de inkomensvoorziening in met ingang van de eerste dag waarover het recht op de
      inkomensvoorziening is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel20
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '20'
        hoofdstuk: '3'
  - number: '41.1'
    text: |-
      Indien de jongere naar het oordeel van het college de op hem rustende
      verplichtingen, bedoeld in [hoofdstuk 5][ref1], dan wel de uit
      [artikel 30c, tweede lid of derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]
      voortvloeiende verplichtingen, niet of onvoldoende nakomt, dan wel zich jegens het college zeer ernstig
      misdraagt, verlaagt het college het bedrag van de aan de jongere toegekende inkomensvoorziening, overeenkomstig de
      verordening, bedoeld in [artikel 12, eerste lid, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel12
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '12'
        hoofdstuk: '2'
  - number: '41.2'
    text: Van een verlaging wordt afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel41
  - number: '41.3'
    text: |-
      Het college heroverweegt een besluit tot verlaging van de inkomensvoorziening binnen een door hem te bepalen
      termijn die ten hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel41
  - number: '42.1'
    text: 'Geen recht op de inkomensvoorziening bestaat:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.a
    text: indien de jongere het werkleeraanbod heeft geweigerd;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.b
    text: |-
      voor zover de jongere of zijn gezin een beroep kan doen op een naar zijn aard en doel als passend en toereikend aan
      te merken voorziening buiten deze wet, ter verwerving van middelen of ter bekostiging van specifieke uitgaven;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.c
    text: |-
      voor zover uit houding en gedragingen van de jongere ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [hoofdstuk 5][ref1], niet wil nakomen;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '5'
  - number: 42.1.d
    text: |-
      indien de jongere wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voor zover diens gebrek aan
      middelen daarvan het gevolg is;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.e
    text: |-
      indien de jongere per kalenderjaar langer dan dertien weken verblijf houdt buiten Nederland, dan wel een
      aaneengesloten periode van langer dan vier weken verblijf houdt buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.f
    text: |-
      indien het werkleeraanbod op grond van [artikel 21][ref1] is ingetrokken, tenzij het werkleeraanbod is ingetrokken
      uitsluitend omdat het college van oordeel is dat om redenen van lichamelijke, geestelijke of sociale aard niet kan
      worden gevergd dat de jongere uitvoering geeft aan het werkleeraanbod;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel21
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '21'
        hoofdstuk: '3'
  - number: 42.1.g
    text: indien de jongere rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.h
    text: indien de jongere zijn militaire of vervangende dienstplicht vervult;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.i
    text: gedurende de periode dat het recht op een werkleeraanbod is opgeschort;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.j
    text: indien de jongere 18, 19 of 20 jaar is en in een inrichting verblijft;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
  - number: 42.1.k
    text: |-
      indien de jongere een uitkering op grond van de [Wet werk en inkomen kunstenaars][ref1] ontvangt of indien hij is
      gehuwd met een persoon die een zodanige uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: 42.1.l
    text: |-
      indien de jongere onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1]
      of indien de jongere gehuwd is met een zodanig persoon, voor zover diens gebrek aan middelen
      daarvan het gevolg is, tenzij de jongere alleenstaande ouder is en hij verlof geniet als bedoeld in
      [hoofdstuk 6 van de Wet arbeid en zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: 42.1.m
    text: |-
      indien de jongere een zelfstandige is die aanspraak kan maken op bijstand op grond van
      [artikel 78f van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel78f
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 78f
  - number: 42.1.n
    text: |-
      indien de jongere van het werkleeraanbod is uitgesloten op grond van [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel22
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '22'
        hoofdstuk: '3'
  - number: '42.2'
    text: |-
      Het eerste lid, onderdeel g, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten
      een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '42.3'
    text: |-
      De [Wet werk en inkomen kunstenaars][ref1] geldt niet als een voorziening als bedoeld in het eerste lid, onderdeel
      b.


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: 42a.1
    text: |-
      De jongere die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft recht
      op een inkomensvoorziening voor zover tegeldemaking, bezwaring of verdere bezwaring, van het in de woning met
      bijbehorend erf gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42a
  - number: 42a.2
    text: |-
      Indien voor de jongere, bedoeld in het eerste lid, recht op een inkomensvoorziening bestaat, heeft die
      inkomensvoorziening de vorm van een geldlening:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42a
  - number: 42a.2.a
    text: |-
      indien de inkomensvoorziening over een periode van een jaar, te rekenen vanaf de eerste dag waarover de
      inkomensvoorziening wordt verleend, naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in
      [artikel 9, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel9
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '9'
        hoofdstuk: '1'
  - number: 42a.2.b
    text: |-
      voor zover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 34, tweede lid, onderdeel d, van de Wet werk en bijstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
  - number: '43.1'
    text: 'Met ingang van de dag waarop het netto minimumloon wijzigt, worden herzien:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
  - number: 43.1.a
    text: |-
      met het percentage van deze wijziging, de normen, genoemd in de [artikelen 26 tot en met 28][ref1], en het bedrag,
      genoemd in [artikel 30, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel30
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '30'
        hoofdstuk: '4'
  - number: 43.1.b
    text: |-
      het percentage, genoemd in [artikel 36, tweede lid][ref1], zodanig dat dit gelijk is aan de procentuele verhouding
      tussen de netto aanspraak op de minimum vakantiebijslag over het minimumloon en het netto minimumloon. Onder netto
      aanspraak op de minimum vakantiebijslag wordt verstaan het verschil tussen het netto minimumloon en het netto
      minimumloon zoals dat overeenkomstig [artikel 9, eerste lid][ref2], zou zijn berekend zonder rekening te houden met
      de aanspraak op vakantiebijslag, bedoeld in [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '9'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '43.2'
    text: |-
      Met ingang van de dag waarop het netto minimumloon wijzigt, worden de normen, genoemd in
      [artikel 29, eerste lid][ref1], herzien met het percentage van deze wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel29
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '29'
        hoofdstuk: '4'
  - number: '43.3'
    text: |-
      De bedragen, genoemd in [artikel 29, tweede lid][ref1], worden herzien, indien het drempelinkomen, bedoeld in de
      [Wet op de zorgtoeslag][ref2], wordt aangepast, de percentages, bedoeld in [artikel 2 van die wet][ref3], worden
      gewijzigd of het bedrag van de standaardpremie op grond van [artikel 4 van die wet][ref4] op een ander bedrag wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018451
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '29'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018451
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0018451
        artikel: '4'
  - number: '43.4'
    text: |-
      Van de herziene normen en bedragen en van de dag waarop de herziening plaatsvindt wordt door Onze Minister
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
  - number: '43.5'
    text: |-
      Onze Minister kan de normen, het percentage en de bedragen, genoemd in het eerste tot en met het derde lid,
      eenmalig aanpassen na de datum van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel43
  - number: '44.1'
    text: |-
      De jongere doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten en
      omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn recht
      op een werkleeraanbod of zijn recht op inkomensvoorziening. Deze verplichting geldt niet indien die feiten en
      omstandigheden door het college kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek
      aangemerkte bij ministeriële regeling aan te wijzen gegevens of kunnen worden verkregen uit bij ministeriële
      regeling aan te wijzen administraties.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel44
  - number: '44.2'
    text: |-
      De jongere is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel44
  - number: '44.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '44.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voor zover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '45'
    text: 'De jongere is verplicht:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.a
    text: |-
      mee te werken aan het opstellen van een plan met betrekking tot zijn arbeidsinschakeling, waaronder begrepen mee te
      werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.b
    text: |-
      geen onredelijke eisen te stellen in verband met door hem te verrichten algemeen geaccepteerde arbeid, die het
      aanvaarden of verkrijgen van algemeen geaccepteerde arbeid belemmeren;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.c
    text: mee te werken aan het behoud of bevorderen van zijn arbeidsbekwaamheid;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.d
    text: mee te werken aan activiteiten of werkzaamheden, gericht op zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.e
    text: opgedragen werkzaamheden of activiteiten naar beste vermogen te verrichten;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: 45.f
    text: op advies van een arts zich te onderwerpen aan een noodzakelijke behandeling van medische aard.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel45
  - number: '46.1'
    text: |-
      Onverminderd
      [artikel 30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens voor het doen van een werkleeraanbod, dan wel de voortzetting daarvan,
      of voor het verstrekken van een inkomensvoorziening, dan wel de voortzetting daarvan, door de jongere in
      ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede de wijze en het tijdstip
      waarop de verstrekking van gegevens plaatsvindt. De gegevens en bewijsstukken worden door het college
      niet verkregen van de jongere voor zover ze anderszins zijn verkregen door het Uitvoeringsinstituut
      werknemersverzekeringen, dan wel voor zover zij verkregen kunnen worden uit de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], de verzekerdenadministratie,
      bedoeld in [artikel 35 van die wet][ref3], alsmede uit de gemeentelijke basisadministratie persoonsgegevens, tenzij
      hierdoor een goede vervulling van de taak van het college op grond van dit artikel wordt belet of bij wettelijk
      voorschrift anders is bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere administraties
      worden aangewezen waarvoor de tweede zin van toepassing is, worden regels gesteld over de gegevens die het betreft
      en kunnen administraties worden aangewezen waarvoor de tweede zin tijdelijk niet van toepassing is. Indien het
      authentieke gegevens uit andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
  - number: '46.2'
    text: |-
      Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor het doen van een werkleeraanbod, dan wel de voortzetting
      daarvan, of voor het verstrekken van een inkomensvoorziening, dan wel de voortzetting daarvan. Indien het onderzoek
      daartoe aanleiding geeft kan het college besluiten tot herziening van het werkleeraanbod of de inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel46
  - number: '46.3'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel46
  - number: '47.1'
    text: |-
      Indien de inkomensvoorziening wordt verleend over een periode, waarover een uitkering op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5]
      of de [Toeslagenwet][ref6] of een inkomensvoorziening op grond van de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref7] als voorschot op grond van
      [artikel 4:95 van de Algemene wet bestuursrecht][ref8] betaalbaar is gesteld en dit voorschot door het
      Uitvoeringsinstituut werknemersverzekeringen wordt teruggevorderd, kan deze inkomensvoorziening op grond
      van deze wet zonder machtiging van de jongere tot het bedrag van dit voorschot aan het Uitvoeringsinstituut
      werknemersverzekeringen worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0004043
      [ref7]: https://wetten.overheid.nl/BWBR0008657
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0004043
      - id: ref7
        bwb_id: BWBR0008657
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '47.2'
    text: |-
      In het geval, bedoeld in het eerste lid, vergoedt de gemeente aan het Uitvoeringsinstituut werknemersverzekeringen
      tevens de over de te verlenen inkomensvoorziening verschuldigde loonbelasting, premies volksverzekeringen en de
      vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '48.1'
    text: |-
      Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen
      te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte
      van een jongere aan wie een werkleeraanbod is of zal worden gedaan, dan wel aan wie een inkomensvoorziening is
      of zal worden verstrekt, en die in zijn dienst, dan wel voor hem, arbeid verricht, heeft verricht of zou kunnen
      gaan verrichten. De verplichting strekt zich mede uit tot de inkomsten van een persoon van wie kosten van de
      inkomensvoorziening op grond van [hoofdstuk 7][ref1] worden of kunnen worden teruggevorderd of op wie die kosten
      worden of kunnen worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '7'
  - number: '48.2'
    text: |-
      De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel48
  - number: '49.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college of, indien het college aan
      het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake
      doen van een werkleeraanbod of het verstrekken van een inkomensvoorziening, aan het Uitvoeringsinstituut
      werknemersverzekeringen, kosteloos opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering
      van deze wet:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.b
    text: het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.c
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van
      [artikel 1, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 49.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
  - number: 49.1.f
    text: |-
      de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 49.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 49.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister voor Wonen, Wijken en Integratie betreffende
      de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 49.1.i
    text: |-
      de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref1],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] en de [Wet inburgering][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0005682
      [ref4]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
      - id: ref3
        bwb_id: BWBR0005682
      - id: ref4
        bwb_id: BWBR0020611
  - number: 49.1.j
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit betreffende de omvang van de productiebeperkende maatregelen
      voor het bedrijf van de ondernemer in de agrarische sector;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.k
    text: Onze Minister van Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.l
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.m
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.1.n
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.2'
    text: |-
      Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde opgaven en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.3'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college
      of, indien het college aan het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het
      nemen van besluiten inzake doen van een werkleeraanbod of het verstrekken van een inkomensvoorziening, aan het
      Uitvoeringsinstituut werknemersverzekeringen, kosteloos alle gegevens en uittreksels of afschriften van uitspraken,
      registers en andere stukken te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.4'
    text: 'De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot de personen:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.4.a
    text: |-
      van wie kosten van de inkomensvoorziening op grond van [hoofdstuk 7][ref1] worden of kunnen worden teruggevorderd
      of op wie die kosten worden of kunnen worden verhaald;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '7'
  - number: 49.4.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed, als
      de persoon:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.4.b.1°
    text: te wiens behoeve de inkomensvoorziening is gevraagd of wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: 49.4.b.2°
    text: |-
      van wie kosten van de inkomensvoorziening op grond van [hoofdstuk 7][ref1] worden of kunnen worden teruggevorderd
      of op wiens kosten die kosten worden of kunnen worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0026054
        hoofdstuk: '7'
  - number: '49.5'
    text: |-
      De in het eerste lid en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.6'
    text: |-
      De in het eerste lid, onderdeel *a* tot en met *k*, genoemde instanties treffen desgevraagd met het college en met
      het Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de inhoud en vormgeving van de
      in het zesde lid bedoelde regeling.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Bij toepassing van de eerste zin wordt bij of krachtens algemene maatregel van bestuur bepaald op welke wijze en
      gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde lid
      worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met zevende lid, eveneens gelden,
      voor zover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen
      en opgaven.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.10'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het achtste lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '49.11'
    text: |-
      Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen,
      onverwijld en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed
      kunnen zijn op het recht op een werkleeraanbod of een inkomensvoorziening, aan het college, of, indien het
      college aan het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten
      inzake doen van een werkleeraanbod of het verstrekken van een inkomensvoorziening, aan het Uitvoeringsinstituut
      werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik kan maken van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel49
  - number: '50.1'
    text: |-
      Onverminderd [artikel 107 van de Vreemdelingenwet 2000][ref1], is het college bevoegd uit eigen beweging en
      verplicht desgevraagd, uit de administratie ter zake van de uitvoering van deze wet aan de hieronder vermelde
      instanties kosteloos de gegevens te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 50.1.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref2], en [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 50.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 50.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de [Wet werk en bijstand][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], het
      [Besluit bijstandverlening zelfstandigen 2004][ref4] en de [Wet werk en inkomen kunstenaars][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0015711
      [ref5]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0015711
      - id: ref5
        bwb_id: BWBR0017837
  - number: 50.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van
      [artikel 1, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref4], voor de uitvoering van de
      [Zorgverzekeringswet][ref5] of de [Algemene Wet Bijzondere Ziektekosten][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0018450
      - id: ref6
        bwb_id: BWBR0002614
  - number: 50.1.e
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: 50.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: 50.1.g
    text: |-
      bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: 50.1.h
    text: |-
      de Informatie Beheer Groep voor de uitvoering van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '50.2'
    text: |-
      Het verstrekken door het college aan de in het eerste lid bedoelde instanties van de in het eerste lid bedoelde
      gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: '50.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkenen daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: '50.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: '50.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel50
  - number: '51.1'
    text: |-
      In de administratie van de gemeente terzake van de uitvoering van deze wet wordt het burgerservicenummer of, bij
      het ontbreken daarvan, het sociaal-fiscaalnummer opgenomen waaronder een natuurlijk persoon is geregistreerd bij
      de belastingdienst.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel51
  - number: '51.2'
    text: |-
      Bij de verstrekking van gegevens door het college en de in de [artikelen 49][ref1] en [50][ref2] bedoelde
      instanties wordt, indien daartoe bevoegd, gebruik gemaakt van dit burgerservicenummer, onderscheidenlijk dit
      sociaal-fiscaalnummer. Derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling
      van personen bevorderen gebruiken het burgerservicenummer, onderscheidenlijk het sociaal-fiscaalnummer,
      slechts voor zover dat noodzakelijk is voor het verrichten van werkzaamheden die in het kader van
      [artikel 11, eerste en derde lid][ref3], worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel11
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '49'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '50'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '11'
        hoofdstuk: '2'
  - number: '51.3'
    text: |-
      Ten behoeve van het gebruik van het sociaal-fiscaalnummer bij het ontbreken van het burgerservicenummer kan
      Onze Minister van Financiën aan personen aan wie een werkleeraanbod wordt gedaan of een inkomensvoorziening
      wordt verstrekt, een sociaal-fiscaalnummer toekennen, indien aan die personen nog geen sociaal-fiscaalnummer is
      toegekend.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel51
  - number: '52'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voor zover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen, dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel52
  - number: '53.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is, dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: '53.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: 53.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: 53.2.b
    text: |-
      de persoon op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze
      gegevens geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: 53.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: '53.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer van de betrokkenen daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
  - number: '53.4'
    text: |-
      De persoon die op grond van dit artikel of de [artikelen 48][ref1], [49][ref2], [51][ref3] of [52][ref4] gegevens
      verstrekt dient na te gaan of de persoon aan wie de gegevens worden verstrekt redelijkerwijs bevoegd is te achten
      om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel51
      [ref4]: https://wetten.overheid.nl/BWBR0026054#Artikel52
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '48'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '49'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '51'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0026054
        artikel: '52'
        hoofdstuk: '6'
  - number: '54.1'
    text: 'Het college kan de kosten van de inkomensvoorziening terugvorderen, voor zover die inkomensvoorziening:'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: 54.1.a
    text: ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: 54.1.b
    text: |-
      op grond van [artikel 37][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      inkomensvoorziening bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel37
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '37'
        hoofdstuk: '4'
  - number: 54.1.c
    text: |-
      in de vorm van geldlening is verleend en de uit de geldlening voortvloeiende verplichtingen niet of niet behoorlijk
      worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: 54.1.d
    text: |-
      anderszins onverschuldigd is betaald, omdat de jongere naderhand met betrekking tot de periode waarover de
      inkomensvoorziening is verleend, over in aanmerking te nemen vermogen of inkomen beschikt of kan beschikken; of
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: 54.1.e
    text: anderszins onverschuldigd is betaald voor zover de belanghebbende dit redelijkerwijs had kunnen begrijpen.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: '54.2'
    text: |-
      Indien het college op grond van [artikel 16, derde lid][ref1], gehouden is kosten verbonden aan een werkleeraanbod,
      of een inkomensvoorziening over een bepaalde periode aan een andere gemeente te vergoeden, geschiedt de
      terugvordering over die periode, voor zover zij nog niet heeft plaatsgehad, door het college van eerstgenoemde
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel16
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '16'
        hoofdstuk: '3'
  - number: '54.3'
    text: |-
      Het college is bevoegd tot verrekening van in de voorafgaande drie maanden ontvangen middelen met de
      inkomensvoorziening.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: '54.4'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering betrekking hebbende
      kosten. Loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de inkomensvoorziening verstrekt
      krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede de vergoeding, bedoeld
      in [artikel 46 van de Zorgverzekeringswet][ref2], kunnen worden teruggevorderd, voor zover deze belasting,
      premies en vergoeding niet verrekend kunnen worden met de door het college af te dragen loonbelasting, premies
      volksverzekeringen en vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '54.5'
    text: |-
      Terugvordering als bedoeld in het eerste lid, onderdeel e, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel54
  - number: '55.1'
    text: |-
      Indien de inkomensvoorziening overeenkomstig een norm als bedoeld in [artikel 28][ref1] had moeten worden
      verleend maar zulks achterwege is gebleven, omdat de jongere de verplichtingen, bedoeld in [artikel 44][ref2], of
      [artikel 30c, tweede lid of derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of
      niet behoorlijk is nagekomen, kunnen de kosten van de inkomensvoorziening mede worden teruggevorderd van de persoon
      met wiens middelen bij de verlening van de inkomensvoorziening rekening had moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '28'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '44'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '55.2'
    text: |-
      De in het eerste lid bedoelde persoon is mede hoofdelijk aansprakelijk voor de terugbetaling van kosten van de
      inkomensvoorziening die worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel55
  - number: '56.1'
    text: |-
      De persoon van wie kosten van de inkomensvoorziening worden teruggevorderd is verplicht desgevraagd aan het college
      de inlichtingen te verstrekken die voor terugvordering op grond van dit hoofdstuk van belang zijn.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
  - number: '56.2'
    text: |-
      Het college kan de kosten van de inkomensvoorziening, bedoeld in de [artikelen 54][ref1] en [55][ref2] invorderen
      bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel55
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '54'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '55'
        hoofdstuk: '7'
  - number: '56.3'
    text: |-
      Indien de persoon van wie kosten van de inkomensvoorziening, bedoeld in de
      [artikelen 54][ref1] en [55][ref2], worden teruggevorderd een inkomensvoorziening, algemene
      bijstand op grond van de [Wet werk en bijstand][ref3] of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5], het
      [Besluit bijstandverlening zelfstandigen 2004][ref6] of de [Wet werk en inkomen kunstenaars][ref7] ontvangt, is het
      college bevoegd tot verrekening van die kosten met die inkomensvoorziening, die algemene bijstand of die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0015711
      [ref7]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '54'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '55'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0015711
      - id: ref7
        bwb_id: BWBR0017837
  - number: '56.4'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan de
      persoon van wie kosten van de inkomensvoorziening worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '56.5'
    text: |-
      Zolang de persoon van wie kosten van de inkomensvoorziening worden teruggevorderd zijn verplichting, bedoeld in het
      eerste lid, niet of niet behoorlijk nakomt:
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
  - number: 56.5.a
    text: |-
      is het college, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot
      verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 56.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij invordering van kosten van de inkomensvoorziening
      bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '56.6'
    text: |-
      Terugvordering van kosten van de inkomensvoorziening, bedoeld in de [artikelen 54][ref1]
      en [55][ref2], is bevoorrecht en volgt onmiddellijk na de vorderingen omschreven in
      [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0026054#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '54'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0026054
        artikel: '55'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '57'
    text: |-
      Op verhaal van kosten van de inkomensvoorziening is [paragraaf 6.5 van de Wet werk en bijstand][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.5
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0015703
        paragraaf: '6.5'
  - number: '86.1'
    text: |-
      Op de jongere die op de dag voor de datum van inwerkingtreding van deze wet algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] ontvangt, blijft de [Wet werk en bijstand][ref2] van toepassing tot het tijdstip
      waarop die jongere zijn recht op algemene bijstand verliest, met dien verstande dat die jongere in ieder geval met
      ingang van 1 juli 2010 het recht op algemene bijstand verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0015703
  - number: '86.2'
    text: |-
      Gedurende de periode dat de jongere op grond van het eerste lid recht op algemene bijstand op grond van de
      [Wet werk en bijstand][ref1] heeft, is deze wet niet een voorliggende voorziening in het kader van de uitvoering
      van de [Wet werk en bijstand][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0015703
  - number: '86.3'
    text: |-
      Onverminderd het eerste lid blijft de [Wet werk en bijstand][ref1] van toepassing tot en met 31 december 2010 op de
      jongere die:


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 86.3.a
    text: alleenstaande ouder is;
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
  - number: 86.3.b
    text: |-
      in een gemeente woont die deelneemt aan het experiment dat op het moment van inwerkingtreding van deze wet bestaat
      op grond van [artikel 83 van de Wet werk en bijstand][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel83
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '83'
  - number: 86.3.c
    text: |-
      op de dag voor de datum van inwerkingtreding van deze wet algemene bijstand ontvangt op grond van de
      [Wet werk en bijstand][ref1] en deze algemene bijstand sindsdien onafgebroken ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '86.4'
    text: |-
      [Artikel 7, eerste lid][ref1], zoals dat luidde op de dag voor inwerkingtreding van
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________ (Kamerstukken 32 260) nadat dat tot wet is verheven, blijft tot en met die dag van toepassing met
      betrekking tot inkomen uit studiefinanciering of tegemoetkoming in de onderwijsbijdrage en de schoolkosten dat
      minder bedraagt dan het op grond van artikel 7, eerste lid, in aanmerking te nemen inkomen uit die bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0027779#ArtikelI
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '7'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0027779
        artikel: I
  - number: '87'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het gedurende acht weken in de gelegenheid is gesteld zijn zienswijze naar
      voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele gevallen.
      In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft
      gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel87
  - number: '88'
    text: Met het toezicht op de naleving van deze wet zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel88
  - number: '89.1'
    text: |-
      Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '89.2'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel89
  - number: '89.3'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel89
  - number: '90.1'
    text: |-
      Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het toezicht,
      de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel90
  - number: '90.2'
    text: |-
      Onze Minister stelt een beleidsplan op dat het kader biedt waarbinnen hij de inlichtingen, bedoeld in het eerste
      lid, vraagt. Over het beleidsplan of een wijziging daarvan overlegt hij met de daartoe door hem aangewezen
      rechtspersoon die de gemeenten vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel90
  - number: '90.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel90
  - number: '90.4'
    text: |-
      De inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in [artikel 89][ref1], worden
      kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel89
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '89'
        hoofdstuk: '9'
  - number: '91'
    text: |-
      De [artikelen 79][ref1], [80][ref2] en [81 van de Wet werk en bijstand][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel80
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel81
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '80'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '81'
  - number: '92'
    text: |-
      Onze Minister zendt binnen twee jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel92
  - number: '93'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen en onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel93
  - number: '94'
    text: 'Deze wet wordt aangehaald als: Wet investeren in jongeren.'
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel94
