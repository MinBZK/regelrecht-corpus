preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de duurzame arbeidsinschakeling voor jongeren tot 27
    jaar te vergroten door hen te stimuleren tot deelname aan het arbeidsproces en maatschappelijke activiteiten en te
    investeren in hun kennis en vaardigheden en daartoe een nieuwe wet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *college:* het college van burgemeester
      en wethouders;
        - *Inlichtingenbureau:* het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];
        - *inrichting:* 1°. een instelling die zich blijkens haar doelstelling en feitelijke werkzaamheden richt op het
      bieden van verpleging of verzorging aan aldaar verblijvende hulpbehoevenden; 2°. een instelling die zich blijkens
      haar doelstelling en feitelijke werkzaamheden richt op het bieden van slaapgelegenheid, waarbij de mogelijkheid van
      hulpverlening of begeleiding gedurende meer dan de helft van ieder etmaal aanwezig is;
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *Sociale verzekeringsbank:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];
        - *Uitvoeringsinstituut werknemersverzekeringen:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0026054/2010-07-13#Artikel1
