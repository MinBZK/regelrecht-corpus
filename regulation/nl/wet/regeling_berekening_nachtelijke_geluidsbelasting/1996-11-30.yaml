preamble:
  text: |-
    Gelet op artikel 25g van de Luchtvaartwet;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De geluidsbelasting als bedoeld in [artikel 20, tweede lid, onder d ten tweede, van de Luchtvaartwet][ref1],
      veroorzaakt door luchtvaartuigen in de nachtelijke periode, wordt berekend met de formule:

      op de manier die is beschreven in rapport RLD/BV-02, Voorschrift voor de berekening van de LAeq-geluidsbelasting
      in dB(A) ten gevolge van structureel uitgevoerd nachtelijk vliegverkeer, dat als bijlage 1 bij deze regeling is
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel20
    url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '20'
  - number: '2'
    text: |-
      Bij het berekenen van de in [artikel 1][ref1] genoemde geluidsbelasting wordt gebruik gemaakt van de gegevens in
      rapport NLR CR 96650 L, Appendices van de voorschriften voor de berekening van geluidsbelasting, oktober 1996,
      met latere wijzigingen, dat als bijlage 2 bij deze regeling is opgenomen, en de door de opdrachtgever verstrekte
      luchtvaartterrein gebonden gegevens. Van de in de eerste volzin bedoelde latere wijzigingen zal mededeling worden
      gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0008336#Artikel1
    url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008336
        artikel: '1'
  - number: '3'
    text: |-
      Deze regeling zal in de Staatscourant worden geplaatst met uitzondering van de bijlagen, die ter inzage worden
      gelegd. Van deze terinzagelegging zal mededeling worden gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst en werkt terug tot en met 1 oktober 1996.
    url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling berekening nachtelijke geluidsbelasting.'
    url: https://wetten.overheid.nl/BWBR0008336/1996-11-30#Artikel5
