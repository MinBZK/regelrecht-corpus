  - number: '41'
    text: |-
      1 Een toelating, verleend krachtens [artikel 8a van de Ziekenfondswet][ref1] of
      [artikel 8 van de Algemene Wet Bijzondere Ziektekosten][ref2], zoals die artikelen luidden tot het tijdstip van
      inwerkingtreding van deze wet, wordt gelijkgesteld met een toelating als bedoeld in [artikel 5, eerste lid][ref3],
      voor zover het betreft instellingen die op het grondgebied van het Europese deel van Nederland werkzaam zijn.

      2 Een aanvraag om een toelating, waarop op het tijdstip van inwerkingtreding van deze wet nog niet is beslist,
      wordt gelijkgesteld met een aanvraag om een toelating als bedoeld in [artikel 5, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel8a
