preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging hebben genomen, dat het ter bevordering van de overgang van een centraal aanbod gestuurd
    naar een decentraal vraaggericht zorgstelsel wenselijk is de regels inzake de toelating van zorginstellingen en die
    inzake de bouwprocedure te vereenvoudigen en samen te voegen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. College bouw: het College bouw zorginstellingen, genoemd in [artikel 19][ref1];

      c. College sanering: het College sanering zorginstellingen, genoemd in [artikel 32][ref2];

      d. Zorginstituut: het Zorginstituut Nederland, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref3];

      e. Fonds langdurige zorg: het Fonds langdurige zorg, genoemd in
      [artikel 89 van de Wet financiering sociale verzekeringen][ref4];

      f. instelling: een organisatorisch verband dat een toelating heeft als bedoeld in [artikel 5, eerste lid][ref5];

      g. exploitatie van een instelling: het in bedrijf hebben van een instelling.

      2 Bij algemene maatregel van bestuur kan met betrekking tot daarbij aan te wijzen categorieën van instellingen
      worden bepaald dat delen van deze wet op die instellingen of een deel daarvan niet van toepassing zijn.

      3 Bij algemene maatregel van bestuur kan met betrekking tot daarbij aan te wijzen categorieën van
      instellingen worden bepaald dat zij, al dan niet onder voorwaarden of beperkingen, voor de toepassing van
      [artikel 5, eerste lid][ref6], worden aangemerkt als in het bezit van een toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel19
