  - number: '27'
    text: |-
      1 Na de goedkeuring, bedoeld in [artikel 26, eerste lid][ref1], stelt het College bouw het jaarplan en de
      jaarverantwoording algemeen verkrijgbaar.

      2 Onze Minister brengt zijn oordeel over het functioneren van het College bouw ter kennis van beide Kamers der
      Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel26
