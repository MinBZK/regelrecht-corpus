  - number: '9'
    text: |-
      1 Onze Minister verleent een toelating waarop hij niet beslist met toepassing van [artikel 7][ref1], indien:

      a. de exploitatie past in de beleidsregels, bedoeld in [artikel 4][ref2];

      b. het organisatorisch verband voldoet aan bij algemene maatregel van bestuur te stellen eisen omtrent de
      bestuursstructuur, alsmede omtrent waarborgen voor een ordelijke en controleerbare bedrijfsvoering.

      2 Van de verleende toelatingen doet Onze Minister mededeling in de Staatscourant en aan de beheerder van het
      register van zorgaanbieders, bedoeld in [artikel 14 van de Wet gebruik burgerservicenummer in de zorg][ref3]
      alsmede, indien de toelating een instelling met artsen of psychotherapeuten betreft, de beheerder van de
      autorisatielijst van jeugdzorgaanbieders, bedoeld in [artikel 2y van de Wet op de jeugdzorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
