  - number: '14'
    text: |-
      1 Onze Minister kan op grond van de beleidsregels, bedoeld in [artikel 4][ref1]:

      a. een toelating onder beperkingen verlenen;

      b. aan een verleende toelating alsnog beperkingen stellen;

      c. beperkingen wijzigen of intrekken;

      d. een toelating intrekken.

      2 Alvorens over te gaan tot een maatregel als bedoeld in het eerste lid, onder b of d, stelt Onze Minister de
      zorgverzekeraars in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref2], waarmee de instelling
      een overeenkomst heeft gesloten, het college van burgemeester en wethouders van de gemeente waarin de instelling
      zich bevindt, en het bestuur en medewerkers van de betrokken instelling de gelegenheid om binnen een door Onze
      Minister te bepalen termijn hun opmerkingen omtrent dit voornemen aan hem kenbaar te maken.

      3 Onze Minister doet van een beslissing tot beperking of intrekking van een toelating op grond
      van het eerste lid, onder b of d, mededeling in de Staatscourant en zendt een afschrift van deze
      beschikking aan het College sanering en aan de beheerder van het register van zorgaanbieders, bedoeld in
      [artikel 14 van de Wet gebruik burgerservicenummer in de zorg][ref3] alsmede, indien het een beslissing tot
      beperking of intrekking van een toelating van een instelling met artsen of psychotherapeuten betreft, de beheerder
      van de autorisatielijst van jeugdzorgaanbieders, bedoeld in [artikel 2y van de Wet op de jeugdzorg][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel4
