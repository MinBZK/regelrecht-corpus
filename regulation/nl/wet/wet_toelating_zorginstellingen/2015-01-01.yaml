        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0018906
        artikel: '14'
        hoofdstuk: IV
  - number: '44'
    text: |-
      Het voorschrift, opgenomen in [artikel 13, eerste lid, eerste volzin][ref1], geldt ten aanzien van instellingen die
      worden geëxploiteerd op het tijdstip van inwerkingtreding van [dat artikel][ref2], eerst een jaar na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel13
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel44
    references:
