  - number: '33'
    text: |-
      Het College bouw en het College sanering verstrekken desgevraagd aan elkaar, aan de Nederlandse Zorgautoriteit,
      bedoeld in de [Wet marktordening gezondheidszorg][ref1], de voor de uitoefening van hun taak benodigde
      inlichtingen. De genoemde colleges kunnen inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor
      de invulling van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '34'
    text: >-
      Het College bouw en het College sanering verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn
      taak benodigde inlichtingen en gegevens. Zij verlenen aan door Onze Minister aangewezen personen toegang tot en
      inzage in alle gegevens die Onze Minister nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel34
  - number: '35'
    text: >-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid alsmede de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel35
  - number: '36'
    text: |-
      De in [artikel 35][ref1] bedoelde personen beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
