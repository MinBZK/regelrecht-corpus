  - number: '47'
    text: |-
      Afwikkeling van de maatregelen, bedoeld in [artikel 18a, eerste lid, van de Wet ziekenhuisvoorzieningen][ref1],
      zoals dat lid luidde tot het tijdstip van inwerkingtreding van deze wet, met inbegrip van daartegen ingesteld
      beroep, vindt plaats met inachtneming van de daarop betrekking hebbende bepalingen van [die wet][ref2] zoals die
      luidden tot bedoeld tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel47
