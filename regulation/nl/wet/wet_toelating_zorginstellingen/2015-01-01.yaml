  - number: '12'
    text: |-
      In de beslissing tot toelating met toepassing van [artikel 7][ref1] of in de vergunning op grond van
      [artikel 11][ref2] kan Onze Minister onderscheidenlijk het College bouw opnemen dat voor de eindverantwoording
      van bouw goedkeuring is vereist van het College bouw. Het College bouw toetst daarbij aan hetgeen waarvoor
      het vergunning heeft verleend dan wel, indien een vergunning niet was vereist, aan hetgeen waarvoor
      Onze Minister een toelating heeft verleend. Het College bouw zendt afschrift van zijn beschikkingen aan
      Onze Minister en van zijn beschikkingen die betrekking hebben op academische ziekenhuizen als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3], een afschrift aan Onze
      Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel1.13
