  - number: '42'
    text: |-
      De [Wet ziekenhuisvoorzieningen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: '43'
    text: |-
      Een vergunning, verleend op grond van [artikel 6 van de Wet ziekenhuisvoorzieningen][ref1], zoals die wet
      luidde tot het tijdstip van inwerkingtreding van deze wet, wordt gelijkgesteld met een toelating als bedoeld
      in [artikel 5][ref2]. De aan de vergunning verbonden voorschriften en beperkingen gelden als voorschriften en
      beperkingen op grond van de [artikelen 13][ref3] onderscheidenlijk [14][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel14
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel43
    references:
