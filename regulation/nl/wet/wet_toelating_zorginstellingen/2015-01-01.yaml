  - number: '18'
    text: |-
      1 Het bestuur van een instelling, met uitzondering van een academisch ziekenhuis als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dat voornemens is om gebouwen
      of terreinen, of delen daarvan, blijvend niet meer voor de instelling te gebruiken, doet hiervan onverwijld
      mededeling aan het College sanering.

      2 Het College sanering beslist binnen acht weken na ontvangst van de mededeling of het bestuur van de instelling de
      gebouwen of terreinen kan verhuren, vervreemden of aan enig beperkt recht kan onderwerpen zonder zijn goedkeuring.
      Bij de goedkeuring kan het College sanering bepalen dat bij verkoop een meeropbrengst ten opzichte van de
      boekwaarde wordt gestort in het Fonds langdurige zorg.

      3 Een rechtshandeling die is verricht in strijd met dit artikel, is vernietigbaar. De vernietigbaarheid kan worden
      ingeroepen door het College sanering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.13
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1.13'
  - number: '19'
    text: >-
      1 Er is een College bouw zorginstellingen, dat rechtspersoonlijkheid bezit. Het College bouw is gevestigd in een
      door Onze Minister te bepalen plaats.


      2 Het College bouw is belast met de taken die hem bij of krachtens de wet zijn opgedragen.


      3 Het College bouw wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel19
  - number: '20'
    text: >-
      1 Het College bouw bestaat uit ten hoogste drie leden, onder wie de voorzitter.


      2 Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt op persoonlijke
      titel plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College bouw
      alsmede op grond van maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt
      mededeling gedaan in de Staatscourant.


      3 Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College bouw.


      4 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.


      5 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Minister.


      6 Onze Minister stelt de bezoldiging en de regels ten aanzien van de rechtspositie van de leden van het College
      bouw vast.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel20
  - number: '21'
    text: |-
      1 Het College bouw stelt een bestuursreglement vast.

      2 Vergaderingen van het College bouw zijn niet openbaar, behoudens voor zover in het bestuursreglement anders is
      bepaald.

      3 In het bestuursreglement legt het College bouw in ieder geval vast hoe hij voldoet aan de verplichting ingevolge
      [artikel 3:2 van de Algemene wet bestuursrecht][ref1].

      4 Het bestuursreglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden indien het
      doelmatig en doeltreffend functioneren van het College bouw onvoldoende wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel32
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:2
  - number: '22'
    text: >-
      1 Het College bouw benoemt, schorst en ontslaat het personeel.


      2 Op de rechtspositie van het personeel van het College bouw zijn de regels die gelden voor ambtenaren die zijn
      aangesteld bij ministeries van toepassing, met dien verstande dat waar in deze regels een bevoegdheid is toegekend
      aan een andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid wordt
      uitgeoefend door het College bouw.


      3 Bij algemene maatregel van bestuur kan worden afgeweken van de in het tweede lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel22
  - number: '23'
    text: >-
      1 Het College bouw zendt jaarlijks voor 1 oktober aan Onze Minister een jaarplan voor het volgende kalenderjaar.


      2 Het jaarplan omvat:


      a. een werkprogramma met een beschrijving van de activiteiten die het College bouw voornemens is ter uitvoering van
      zijn taken te verrichten,


      b. een begroting van de beheerskosten voor de uitvoering van de voorgenomen activiteiten, en


      c. een meerjarenraming voor de vier kalenderjaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel23
  - number: '24'
    text: >-
      1 Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het College bouw voor het
      volgende kalenderjaar vast.


      2 Onze Minister kan besluiten het budget voor de beheerskosten van het College bouw te wijzigen.


      3 Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten, doet het College bouw daarvan onverwijld mededeling aan Onze Minister, onder vermelding
      van de oorzaak van de verschillen.


      4 Het College bouw gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.


      5 Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de
      begroting betrekking heeft, is het College bouw bevoegd, teneinde zijn activiteiten gaande te houden, te beschikken
      over ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.


      6 Onze Minister kan besluiten dat het College bouw in een geval als bedoeld in het vijfde lid, kan beschikken over
      meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.


      7 Het door Onze Minister vastgestelde budget voor de beheerskosten van het College bouw wordt gedekt uit 's Rijks
      kas.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel24
  - number: '25'
    text: |-
      1 Het College bouw zendt jaarlijks voor 15 maart aan Onze Minister een jaarverantwoording over het afgelopen
      kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.

      2 De jaarverantwoording omvat:

      a. een jaarrekening, en

      b. een jaarverslag omtrent het door het College bouw gevoerde beleid, de doeltreffendheid van dat beleid, de
      bedrijfsvoering en de uitvoering van het werkprogramma in het afgelopen kalenderjaar.

      3 Het College bouw legt in zijn jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over zijn
      beheerskosten en over de rechtmatigheid en doelmatigheid van het beheer in het afgelopen kalenderjaar.

      4 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2], die bereid is Onze Minister desgevraagd
      inzicht te geven in zijn controlewerkzaamheden.

      5 De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen door het College
      bouw.

      6 De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '26'
    text: |-
      1 De onderdelen «werkprogramma» en «begroting» van het jaarplan, bedoeld in [artikel 23][ref1], en het onderdeel
      «jaarrekening» van de jaarverantwoording, bedoeld in [artikel 25][ref2], behoeven de goedkeuring van Onze Minister.

      2 Het eerste lid geldt niet voor wijzigingen in een goedgekeurde begroting, mits:

      a. de totale omvang van de begroting geen wijziging ondergaat, en

      b. de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van 5 procent van het in [artikel 24][ref3] bedoelde budget niet te boven gaat.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en de inrichting van:

      a. het jaarplan, bedoeld in [artikel 23][ref4];

      b. de jaarverantwoording, bedoeld in [artikel 25][ref5];

      c. de verklaring, bedoeld in [artikel 25, vierde lid][ref6], en het verslag van bevindingen, bedoeld in
      [artikel 25, zesde lid][ref7], alsmede het aan die verklaring en dat verslag ten grondslag liggende onderzoek.

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 24][ref8], wordt vastgesteld.


