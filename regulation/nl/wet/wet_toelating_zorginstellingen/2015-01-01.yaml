        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '13'
        hoofdstuk: IV
  - number: '45'
    text: |-
      1 Bouw waarvoor vóór het tijdstip van inwerkingtreding van deze wet een verklaring is afgegeven als bedoeld
      in [artikel 7 van de Wet ziekenhuisvoorzieningen][ref1], zoals die wet luidde tot bedoeld tijdstip, bij welke
      verklaring op grond van [artikel 10, vijfde lid, van die wet][ref2] is bepaald dat een aanvraag om goedkeuring van
      stukken als bedoeld in [artikel 7, eerste lid, onder b of c, van die wet][ref3] of om een vergunning als bedoeld
      in [artikel 6 van die wet][ref4], binnen een daarbij aangegeven termijn niet in behandeling wordt genomen, welke
      termijn op bovenbedoeld tijdstip nog niet is verstreken, wordt gelijkgesteld met bouw waarvoor een aanvraag om
      een toelating als bedoeld in [artikel 5, eerste lid][ref5], van deze wet is ingediend. Het bepaalde krachtens
      [artikel 7, derde lid, onder a][ref6], is op die aanvraag niet van toepassing.

      2 Een verklaring ter zake van bouw als bedoeld in [artikel 7 van de Wet ziekenhuisvoorzieningen][ref7], zoals
      die wet luidde tot het tijdstip van inwerkingtreding van deze wet, waarbij niet een bepaling is opgenomen als
      bedoeld in het eerste lid of waarbij de daarbedoelde termijn reeds is verstreken, en die nog niet is gevolgd door
      een vergunning als bedoeld in [artikel 6 van die wet][ref8], wordt gelijkgesteld met een toelating als bedoeld
      in [artikel 5, eerste lid][ref9], van deze wet. De [artikelen 11][ref10] en [12][ref11] zijn van overeenkomstige
      toepassing.

      3 Een aanvraag om een verklaring, waarop op het tijdstip van inwerkingtreding van deze wet nog niet is beslist,
      wordt gelijkgesteld met een aanvraag om een toelating als bedoeld in [artikel 5, eerste lid][ref12].


