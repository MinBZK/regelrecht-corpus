  - number: '13'
    text: |-
      1 Een instelling voldoet, voorzover van toepassing, aan de eisen, bedoeld in [artikel 5, tweede lid][ref1], en in
      [artikel 7, derde lid, onder c][ref2], onderscheidenlijk [artikel 9, eerste lid, onder b][ref3]. Onze Minister kan
      aan een toelating andere voorschriften verbinden. De voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe
      voorschriften kunnen worden gesteld.

      2 Onze Minister kan de toelating intrekken indien niet wordt voldaan aan de voorschriften, gesteld bij of krachtens
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel9
