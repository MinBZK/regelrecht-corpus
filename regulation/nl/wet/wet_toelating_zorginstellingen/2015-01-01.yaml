  - number: '15'
    text: >-
      Het bestuur van een instelling stelt overeenkomstig door Onze Minister, voor zoveel nodig in overeenstemming met
      Onze Ministers die het mede aangaat, te stellen regelen de begroting, de balans en de resultatenrekening alsmede
      de daarbij behorende toelichting met betrekking tot de instelling vast en legt volledige afschriften daarvan ter
      inzage voor een ieder ter plaatse, door Onze Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel15
  - number: '16'
    text: >-
      Het bestuur van een instelling, behorende tot een bij algemene maatregel van bestuur aangewezen categorie,
      verstrekt aan Onze Minister of aan een bij die maatregel aangewezen bestuursorgaan de bij of krachtens die
      maatregel omschreven gegevens betreffende de exploitatie van de instelling.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel16
  - number: '17'
    text: |-
      1 Het bestuur van een instelling wendt zich tot het College sanering binnen zes weken na bekendmaking van een
      beslissing tot:

      a. beperking of intrekking van een toelating op grond van [artikel 14, eerste lid, onder b of d][ref1];

      b. beëindiging van de uitvoering van bijzondere medische verrichtingen of beëindiging van het gebruik van
      apparatuur op grond van [artikel 6, vijfde lid, van de Wet op bijzondere medische verrichtingen][ref2].

      2 Het College sanering stelt de financiële gevolgen van sanering vast ter zake van een beslissing als bedoeld in
      het eerste lid, alsmede ter uitvoering van een beslissing als bedoeld in [artikel 18][ref3].

      3 De in het tweede lid bedoelde vaststelling kan inhouden dat het College sanering subsidie verstrekt ter
      voorziening in de financiële gevolgen van de sanering.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:

      a. hetgeen onder financiële gevolgen van sanering moet worden verstaan;

      b. de hoogte, de opbouw en wijze van berekening van de subsidie;

      c. de aanvraag van de subsidie en de besluitvorming daarover;

      d. de voorwaarden waaronder de subsidie wordt verleend;

      e. de verplichtingen van de subsidie-ontvanger;

      f. de vaststelling van de subsidie;

      g. de betaling en terugvordering van de subsidie en het verlenen van voorschotten.

      5 In de algemene maatregel van bestuur, bedoeld in het vierde lid, kan worden bepaald dat het College sanering
      nadere regels stelt over daarbij aangewezen onderwerpen. De door het College sanering gestelde regels behoeven de
      goedkeuring van Onze Minister.

      6 Een beschikking tot subsidievaststelling wordt niet genomen dan nadat het Zorginstituut hieromtrent is gehoord.

      7 De betaling van de subsidie of het voorschot geschiedt door het Zorginstituut ten laste van het Fonds langdurige
      zorg. Onze Minister kan hieromtrent nadere regelen stellen.

      8 Indien het College sanering vaststelt dat de financiële gevolgen van de sanering een positief saldo voor de
      betrokken instelling inhouden, kan het College sanering bepalen dat het saldo wordt gestort in het Fonds langdurige
      zorg. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het vierde lid, kunnen hieromtrent regels
      worden gesteld.

      9 Van besluiten als bedoeld in het tweede lid doet het College sanering mededeling aan Onze Minister.

      10 Onze Minister doet jaarlijks verslag aan de Staten-Generaal omtrent de door het College sanering ingevolge het
      tweede lid genomen besluiten.

      11 Het College sanering is tevens belast met het toezicht op de sanering. Bij de algemene maatregel van bestuur,
      bedoeld in het vierde lid, kunnen hieromtrent regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008974#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel18
