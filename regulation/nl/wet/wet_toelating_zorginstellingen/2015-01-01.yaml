  - number: '29'
    text: >-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College bouw.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel29
  - number: '30'
    text: >-
      1 Een besluit van het College bouw kan bij koninklijk besluit worden vernietigd.


      2 Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel30
  - number: '31'
    text: |-
      1 Het College bouw:

      a. rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid van voorgenomen beleid met
      betrekking tot instellingen;

      b. geeft aan Onze Minister inlichtingen met betrekking tot de bouwkundige en functionele staat van de instellingen;

      c. geeft aan Onze Minister desgevraagd advies over beslissingen op aanvragen om toelating als bedoeld in
      [artikel 7][ref1];

      d. geeft voorlichting omtrent het beleid op het terrein van de bouw van instellingen.

      2 Het College bouw signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het terrein van
      de infrastructuur van de gezondheidszorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '7'
        hoofdstuk: III
  - number: '32'
    text: |-
      1 Er is een College sanering zorginstellingen, dat rechtspersoonlijkheid bezit. Het College sanering is gevestigd
      in een door Onze Minister te bepalen plaats.

      2 Het College sanering is belast met de taken die hem bij of krachtens de wet zijn opgedragen.

      3 De [artikelen 19, derde lid][ref1], en [20 tot en met 30][ref2] zijn ten aanzien van het College sanering van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel20
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel32
