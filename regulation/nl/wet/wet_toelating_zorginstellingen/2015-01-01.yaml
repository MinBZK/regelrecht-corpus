  - number: '7'
    text: |-
      1 Indien een organisatorisch verband, behorende tot een bij algemene maatregel van bestuur aangewezen
      categorie, een toelating vraagt voor het verlenen van zorg ten behoeve waarvan een bij die maatregel aangewezen
      vorm van bouw plaatsvindt, beslist Onze Minister vóór het eind van de tweejaarlijkse periode, bedoeld in
      [artikel 6, onder c][ref1], waarin de aanvraag in behandeling is genomen. Onze Minister stelt de zorgverzekeraars
      in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref2] gezamenlijk in de gelegenheid hun
      zienswijze kenbaar te maken.

      2 Onze Minister wint over een aanvraag om een toelating als bedoeld in het eerste lid het advies in van het College
      bouw. Het College bouw beziet de aanvraag onder meer in het licht van de eisen, bedoeld in [artikel 10][ref3].

      3 Onze Minister verleent een toelating indien:

      a. de exploitatie past in de beleidsregels, bedoeld in [artikel 4][ref4];

      b. na toepassing van de beleidsregels, bedoeld in [artikel 4][ref5], het verlenen van een toelating niet zou leiden
      tot overschrijding van het financieel kader dat blijkens [artikel 3, eerste lid][ref6], daarvoor beschikbaar is; en

      c. het organisatorisch verband voldoet aan bij algemene maatregel van bestuur te stellen eisen omtrent de
      bestuursstructuur, alsmede omtrent waarborgen voor een ordelijke en controleerbare bedrijfsvoering.

      4 Van de verleende toelatingen doet Onze Minister mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel6
