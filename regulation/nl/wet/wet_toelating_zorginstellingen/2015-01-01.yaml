  - number: '8'
    text: |-
      Indien het verlenen van een toelating niet mogelijk is op grond van [artikel 7, derde lid, onderdeel b][ref1],
      houdt Onze Minister op verzoek van de aanvrager van de toelating de beslissing op diens aanvraag aan tot de
      eerstvolgende keer dat op grond van [artikel 7][ref2] over aanvragen moet worden beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel7
