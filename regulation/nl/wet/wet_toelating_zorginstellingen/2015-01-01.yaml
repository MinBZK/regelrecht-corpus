  - number: '37'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      [artikel 5, eerste lid][ref1], van de bij of krachtens [artikel 13][ref2] aan een toelating verbonden
      voorschriften, alsmede van de [artikelen 15][ref3] en [16][ref4]. Het College bouw is bevoegd tot oplegging van een
      last onder bestuursdwang ter handhaving van het bepaalde bij of krachtens de [artikelen 11][ref5] en [12][ref6].
      Het College sanering is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij
      of krachtens de [artikelen 17, eerste en achtste lid][ref7], en [18, eerste en tweede lid][ref8].


