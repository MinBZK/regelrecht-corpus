  - number: '46'
    text: |-
      Na de inwerkingtreding van deze wet berusten de regels, vastgesteld krachtens de [artikelen 2a, zevende lid][ref1],
      [18b, vierde lid][ref2], [22][ref3] en [23 van de Wet ziekenhuisvoorzieningen][ref4], zoals [die wet][ref5] tot
      die inwerkingtreding luidde, achtereenvolgens op de [artikelen 20, zevende lid][ref6], [17, vierde lid][ref7],
      [16][ref8] en [15][ref9] van deze wet.


