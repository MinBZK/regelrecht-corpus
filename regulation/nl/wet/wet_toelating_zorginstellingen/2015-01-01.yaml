        artikel: '57'
  - number: '3'
    text: |-
      1 Onze Minister maakt, gelet op de ontwikkelingen in de gezondheidszorg, ten minste eenmaal in de vier jaar zijn
      visie op een kwalitatief goed, doelmatig, evenwichtig en voor eenieder toegankelijk stelsel van gezondheidszorg
      bekend. In deze visie is tevens opgenomen hoe de bereikbaarheid van de acute zorg, daaronder begrepen de daaraan
      verbonden basiszorg, en van andere vormen van zorg ten aanzien waarvan aan de bereikbaarheid een bijzonder belang
      wordt gehecht, is gewaarborgd. Deze visie bevat tevens het financieel kader dat beschikbaar is voor de kosten
      voortvloeiend uit toelatingen die Onze Minister verleent met toepassing van [artikel 7][ref1].

      2 Onze Minister zendt een afschrift van zijn visie aan beide kamers der Staten-Generaal en aan het College bouw.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '7'
        hoofdstuk: III
  - number: '4'
    text: |-
      Onze Minister stelt, gezien zijn visie, bedoeld in [artikel 3][ref1], beleidsregels vast omtrent de beoordeling
      van aanvragen om toelating als bedoeld in [artikel 5, eerste lid][ref2]. Deze beleidsregels bevatten in ieder
      geval criteria omtrent de spreiding van de in [artikel 3][ref3] bedoelde vormen van zorg ten aanzien waarvan aan
      de bereikbaarheid een bijzonder belang wordt gehecht. In de beleidsregels stelt Onze Minister voorts criteria
      vast voor het bepalen van de prioriteit van aanvragen om een toelating waarop Onze Minister beslist met toepassing
      van [artikel 7][ref4]; deze criteria hebben in ieder geval betrekking op de bouwkundige en functionele staat van
      de instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel3
