      - id: ref2
        bwb_id: BWBR0002753
  - number: '48'
    text: |-
      Het College bouw ziekenhuisvoorzieningen, bedoeld in [artikel 2 van de Wet ziekenhuisvoorzieningen][ref1], zoals
      [die wet][ref2] luidde tot het tijdstip van inwerkingtreding van deze wet, wordt als rechtspersoon gehandhaafd en
      is het College bouw zorginstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002753
  - number: '49'
    text: |-
      Het College sanering ziekenhuisvoorzieningen, bedoeld in [artikel 2m van de Wet ziekenhuisvoorzieningen][ref1],
      zoals [die wet][ref2] luidde tot het tijdstip van inwerkingtreding van deze wet, wordt als rechtspersoon
      gehandhaafd en is het College sanering zorginstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2m
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 2m
      - id: ref2
        bwb_id: BWBR0002753
  - number: '50'
    text: |-
      De [Overgangswet verzorgingshuizen][ref1] wordt ingetrokken, met dien verstande dat:

      a. in wettelijke procedures en rechtsgedingen tegen besluiten die op grond van [die wet][ref2] zijn genomen, dan
      wel op tegen die besluiten in te stellen of ingestelde beroepen, zowel in eerste aanleg als in verdere instantie,
      de regels van toepassing blijven die golden voor 1 januari 2001;

      b. [die wet][ref3] van toepassing blijft op de financiële verantwoording, vaststelling en uitbetaling van op grond
      van [die wet][ref4] verleende subsidies en uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008252
      [ref2]: https://wetten.overheid.nl/BWBR0008252
      [ref3]: https://wetten.overheid.nl/BWBR0008252
      [ref4]: https://wetten.overheid.nl/BWBR0008252
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008252
      - id: ref2
        bwb_id: BWBR0008252
      - id: ref3
        bwb_id: BWBR0008252
      - id: ref4
        bwb_id: BWBR0008252
  - number: '53'
    text: |-
      De [Tijdelijke Verstrekkingenwet maatschappelijke dienstverlening][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002957
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002957
  - number: '63'
    text: |-
      De vaststelling van de algemene maatregelen van bestuur, bedoeld in [artikel 1, tweede en derde lid][ref1], de visie
      en het daarin opgenomen financieel kader, bedoeld in [artikel 3, eerste lid][ref2], het geven van beschikkingen
      door Onze Minister als bedoeld in de [artikelen 7][ref3], [13][ref4] en [14][ref5], alsmede de goedkeuring van
      de prestatie-eisen, bedoeld in [artikel 10][ref6], een en ander voor zover zij betrekking hebben op academische
      ziekenhuizen als bedoeld in [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7],
      vinden plaats in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0018906#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0018906#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0005682#Artikel1.13
