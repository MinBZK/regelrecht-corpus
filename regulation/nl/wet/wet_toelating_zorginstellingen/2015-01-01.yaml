  - number: '6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld:

      a. de wijze waarop een aanvraag om een toelating bij Onze Minister wordt ingediend;

      b. welke gegevens bij de aanvraag worden overgelegd;

      c. met betrekking tot aanvragen waarop Onze Minister beslist met toepassing van [artikel 7][ref1]: de termijn na
      de aanvang van een periode van telkens twee jaar, waarbinnen aanvragen in behandeling worden genomen met het oog
      op het toepassen van de beleidsregels, bedoeld in [artikel 4][ref2]. De eerste periode van twee jaar vangt aan op
      het tijdstip van inwerkingtreding van deze wet dan wel, indien dat tijdstip niet 1 januari van enig jaar is, op
      1 januari van het jaar, volgend op dat waarin deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel4
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel6
