  - number: '10'
    text: >-
      1 Het College bouw stelt op verzoek van Onze Minister prestatie-eisen vast die bij bouw in acht moeten worden
      genomen. De eisen behoeven de goedkeuring van Onze Minister.


      2 Onze Minister weigert goedkeuring indien de prestatie-eisen niet passen in een doelmatig, voor eenieder
      toegankelijk en evenwichtig stelsel van gezondheidszorg.


      3 Het besluit omtrent goedkeuring wordt binnen acht weken na verzending bekendgemaakt. Het nemen van een besluit
      omtrent goedkeuring kan eenmaal voor ten hoogste vier weken worden verdaagd.


      4 Indien binnen de in het derde lid genoemde termijn geen besluit tot goedkeuring of verdaging, dan wel binnen
      de termijn waarvoor het besluit is verdaagd, geen besluit omtrent goedkeuring is genomen, wordt een besluit tot
      goedkeuring geacht te zijn genomen.


      5 De prestatie-eisen liggen voor een ieder bij het College bouw ter inzage. Het College bouw doet van de
      goedkeuring en de terinzagelegging mededeling in de Staatscourant en in één of meer dag- of nieuwsbladen die
      landelijk worden verspreid.
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel10
  - number: '11'
    text: |-
      1 Voor bouw waarvoor Onze Minister met toepassing van [artikel 7][ref1] toelating heeft verleend, is een vergunning
      vereist van het College bouw.

      2 Het College bouw verleent de vergunning voor zover de beoogde bouw:

      a. overeenkomt met hetgeen waarvoor de toelating, bedoeld in [artikel 7][ref2], is verleend; en

      b. voldoet aan de prestatie-eisen.

      3 Het College bouw bepaalt welke gegevens ten behoeve van zijn beslissing moeten worden ingediend.

      4 Het College bouw kan aan de vergunning voorschriften verbinden met het oog op een goed verloop van de bouw.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel7
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel11
