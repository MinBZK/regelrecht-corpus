  - number: '5'
    text: |-
      1 Een organisatorisch verband dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie van
      instellingen die zorg verlenen waarop aanspraak bestaat ingevolge [artikel 3.1.1 van de Wet langdurige zorg][ref1]
      of ingevolge een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2], moet
      voor het verlenen van die zorg een toelating hebben van Onze Minister.

      2 Een toelating kan aan instellingen met een winstoogmerk slechts worden verleend indien die instelling behoort tot
      een bij algemene maatregel van bestuur aangewezen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel5
