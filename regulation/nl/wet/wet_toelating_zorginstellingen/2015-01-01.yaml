  - number: '2'
    text: |-
      1 Met het oog op de totstandkoming van een beleidsregel van de Nederlandse Zorgautoriteit op grond van
      [artikel 57 van de Wet marktordening gezondheidszorg][ref1], kan bij ministeriële regeling met betrekking tot
      de instelling of instellingen waarvoor die beleidsregel geldt, worden bepaald dat delen van deze wet op die
      instellingen of een deel daarvan niet van toepassing zijn voor de duur van het in die beleidsregel bedoelde
      experiment.

      2 Alvorens overeenkomstig het eerste lid een ministeriële regeling wordt vastgesteld, wordt het ontwerp daarvan
      schriftelijk meegedeeld aan de beide kamers der Staten-Generaal. De regeling wordt niet eerder vastgesteld dan
      nadat tien dagen zijn verstreken na die mededeling.

      3 De regeling vervalt op het tijdstip waarop ingevolge de beleidsregel het experiment is geëindigd.

      4 Onze Minister evalueert de toepassing van dit artikel tijdig en tijdens de uitvoering van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0018906/2015-01-01#Artikel2
