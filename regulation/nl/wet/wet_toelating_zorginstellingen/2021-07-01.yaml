$id: wet_toelating_zorginstellingen
regulatory_layer: WET
publication_date: '2020-06-19'
valid_from: '2021-07-01'
bwb_id: BWBR0018906
url: https://wetten.overheid.nl/BWBR0018906/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het ter bevordering van de overgang van een centraal aanbod gestuurd
    naar een decentraal vraaggericht zorgstelsel wenselijk is de regels inzake de toelating van zorginstellingen en die
    inzake de bouwprocedure te vereenvoudigen en samen te voegen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
  - number: 1.1.c
    text: |-
      College sanering: het College sanering zorginstellingen, genoemd in [artikel 19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel19
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '19'
        hoofdstuk: VI
  - number: 1.1.d
    text: |-
      Zorginstituut: het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
  - number: 1.1.e
    text: |-
      Fonds langdurige zorg: het Fonds langdurige zorg, genoemd in
      [artikel 89 van de Wet financiering sociale verzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel89
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '89'
  - number: 1.1.f
    text: |-
      instelling: een organisatorisch verband dat een toelating heeft als bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
        hoofdstuk: III
  - number: 1.1.g
    text: 'exploitatie van een instelling: het in bedrijf hebben van een instelling.'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kan met betrekking tot daarbij aan te wijzen categorieën van instellingen worden
      bepaald dat delen van deze wet op die instellingen of een deel daarvan niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kan met betrekking tot daarbij aan te wijzen categorieën van
      instellingen worden bepaald dat zij, al dan niet onder voorwaarden of beperkingen, voor de toepassing van
      [artikel 5, eerste lid][ref1], worden aangemerkt als in het bezit van een toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
        hoofdstuk: III
  - number: '2.1'
    text: |-
      Met het oog op de totstandkoming van een beleidsregel van de Nederlandse Zorgautoriteit op grond van
      [artikel 57 van de Wet marktordening gezondheidszorg][ref1], kan bij ministeriële regeling met betrekking tot
      de instelling of instellingen waarvoor die beleidsregel geldt, worden bepaald dat delen van deze wet op die
      instellingen of een deel daarvan niet van toepassing zijn voor de duur van het in die beleidsregel bedoelde
      experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel57
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '57'
  - number: '2.2'
    text: |-
      Alvorens overeenkomstig het eerste lid een ministeriële regeling wordt vastgesteld, wordt het ontwerp daarvan
      schriftelijk meegedeeld aan de beide kamers der Staten-Generaal. De regeling wordt niet eerder vastgesteld dan
      nadat tien dagen zijn verstreken na die mededeling.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel2
  - number: '2.3'
    text: De regeling vervalt op het tijdstip waarop ingevolge de beleidsregel het experiment is geëindigd.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel2
  - number: '2.4'
    text: Onze Minister evalueert de toepassing van dit artikel tijdig en tijdens de uitvoering van het experiment.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister maakt, gelet op de ontwikkelingen in de gezondheidszorg, ten minste eenmaal in de vier jaar zijn
      visie op een kwalitatief goed, doelmatig, evenwichtig en voor eenieder toegankelijk stelsel van gezondheidszorg
      bekend. In deze visie is tevens opgenomen hoe de bereikbaarheid van de acute zorg, daaronder begrepen de daaraan
      verbonden basiszorg, en van andere vormen van zorg ten aanzien waarvan aan de bereikbaarheid een bijzonder belang
      wordt gehecht, is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel3
  - number: '3.2'
    text: Onze Minister zendt een afschrift van zijn visie aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister stelt, gezien zijn visie, bedoeld in [artikel 3][ref1], beleidsregels vast omtrent de beoordeling
      van aanvragen om toelating als bedoeld in [artikel 5, eerste lid][ref2]. Deze beleidsregels bevatten in ieder
      geval criteria omtrent de spreiding van de in [artikel 3][ref3] bedoelde vormen van zorg ten aanzien waarvan aan de
      bereikbaarheid een bijzonder belang wordt gehecht.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel3
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '5'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0018906
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Een organisatorisch verband dat behoort tot een bij algemene maatregel van bestuur aangewezen categorie van
      instellingen die zorg verlenen waarop aanspraak bestaat ingevolge [artikel 3.1.1 van de Wet langdurige zorg][ref1]
      of ingevolge een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2], moet
      voor het verlenen van die zorg een toelating hebben van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '5.2'
    text: |-
      Een toelating kan aan instellingen met een winstoogmerk slechts worden verleend indien die instelling behoort tot
      een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel5
  - number: '6'
    text: 'Bij algemene maatregel van bestuur wordt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel6
  - number: 6.a
    text: de wijze waarop een aanvraag om een toelating bij Onze Minister wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel6
  - number: 6.b
    text: welke gegevens bij de aanvraag worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel6
  - number: '9.1'
    text: 'Onze Minister verleent een toelating, indien:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel9
  - number: 9.1.a
    text: |-
      de exploitatie past in de beleidsregels, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel4
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '4'
        hoofdstuk: II
  - number: 9.1.b
    text: |-
      het organisatorisch verband voldoet aan bij algemene maatregel van bestuur te stellen eisen omtrent de
      bestuursstructuur, alsmede omtrent waarborgen voor een ordelijke en controleerbare bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel9
  - number: '9.2'
    text: |-
      Van de verleende toelatingen doet Onze Minister mededeling in de Staatscourant
      en aan de beheerder van het register van zorgaanbieders, bedoeld in
      [artikel 14 van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1] alsmede, indien de
      toelating een instelling met artsen, psychotherapeuten of orthopedagogen-generalist betreft, de beheerder van de
      autorisatielijst van jeugdhulpaanbieders, bedoeld in [artikel 7.2.7 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
  - number: '13.1'
    text: |-
      Een instelling voldoet, voorzover van toepassing, aan de eisen, bedoeld in [artikel 5, tweede lid][ref1], en
      [artikel 9, eerste lid, onder b][ref2]. Onze Minister kan aan een toelating andere voorschriften verbinden. De
      voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe voorschriften kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel9
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '9'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Onze Minister kan de toelating intrekken indien niet wordt voldaan aan de voorschriften, gesteld bij of krachtens
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan op grond van de beleidsregels, bedoeld in [artikel 4][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel4
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '4'
        hoofdstuk: II
  - number: 14.1.a
    text: een toelating onder beperkingen verlenen;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
  - number: 14.1.b
    text: aan een verleende toelating alsnog beperkingen stellen;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
  - number: 14.1.c
    text: beperkingen wijzigen of intrekken;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
  - number: 14.1.d
    text: een toelating intrekken.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Alvorens over te gaan tot een maatregel als bedoeld in het eerste lid, onder b of d, stelt Onze Minister de
      zorgverzekeraars in de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1], waarmee de instelling
      een overeenkomst heeft gesloten, het college van burgemeester en wethouders van de gemeente waarin de instelling
      zich bevindt, en het bestuur en medewerkers van de betrokken instelling de gelegenheid om binnen een door Onze
      Minister te bepalen termijn hun opmerkingen omtrent dit voornemen aan hem kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '14.3'
    text: |-
      Onze Minister doet van een beslissing tot beperking of intrekking van een toelating op grond van het
      eerste lid, onder b of d, mededeling in de Staatscourant en zendt een afschrift van deze beschikking
      aan het College sanering en aan de beheerder van het register van zorgaanbieders, bedoeld in
      [artikel 14 van de Wet aanvullende bepalingen verwerking persoonsgegevens in de zorg][ref1] alsmede, indien het
      een beslissing tot beperking of intrekking van een toelating van een instelling met artsen, psychotherapeuten
      of orthopedagogen-generalist betreft, de beheerder van de autorisatielijst van jeugdhulpaanbieders, bedoeld in
      [artikel 7.2.7 van de Jeugdwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023864#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023864
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
  - number: '15'
    text: |-
      Het bestuur van een instelling stelt overeenkomstig door Onze Minister, voor zoveel nodig in overeenstemming met
      Onze Ministers die het mede aangaat, te stellen regelen de begroting, de balans en de resultatenrekening alsmede
      de daarbij behorende toelichting met betrekking tot de instelling vast en legt volledige afschriften daarvan ter
      inzage voor een ieder ter plaatse, door Onze Minister te bepalen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel15
  - number: '16'
    text: |-
      Het bestuur van een instelling, behorende tot een bij algemene maatregel van bestuur aangewezen categorie,
      verstrekt aan Onze Minister of aan een bij die maatregel aangewezen bestuursorgaan de bij of krachtens die
      maatregel omschreven gegevens betreffende de exploitatie van de instelling.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      Het bestuur van een instelling wendt zich tot het College sanering binnen zes weken na bekendmaking van een
      beslissing tot:
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.1.a
    text: |-
      beperking of intrekking van een toelating op grond van [artikel 14, eerste lid, onder b of d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel14
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '14'
        hoofdstuk: IV
  - number: 17.1.b
    text: |-
      beëindiging van de uitvoering van bijzondere medische verrichtingen of beëindiging van het gebruik van apparatuur
      op grond van [artikel 6, vijfde lid, van de Wet op bijzondere medische verrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel6
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008974
        artikel: '6'
  - number: '17.2'
    text: |-
      Het College sanering stelt de financiële gevolgen van sanering vast ter zake van een beslissing als bedoeld in het
      eerste lid, alsmede ter uitvoering van een beslissing als bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel18
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '18'
        hoofdstuk: V
  - number: '17.3'
    text: |-
      De in het tweede lid bedoelde vaststelling kan inhouden dat het College sanering subsidie verstrekt ter voorziening
      in de financiële gevolgen van de sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.4'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.a
    text: hetgeen onder financiële gevolgen van sanering moet worden verstaan;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.b
    text: de hoogte, de opbouw en wijze van berekening van de subsidie;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.c
    text: de aanvraag van de subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.d
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.e
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.f
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: 17.4.g
    text: de betaling en terugvordering van de subsidie en het verlenen van voorschotten.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.5'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het vierde lid, kan worden bepaald dat het College sanering
      nadere regels stelt over daarbij aangewezen onderwerpen. De door het College sanering gestelde regels behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.6'
    text: Een beschikking tot subsidievaststelling wordt niet genomen dan nadat het Zorginstituut hieromtrent is gehoord.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.7'
    text: |-
      De betaling van de subsidie of het voorschot geschiedt door het Zorginstituut ten laste van het Fonds langdurige
      zorg. Onze Minister kan hieromtrent nadere regelen stellen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.8'
    text: |-
      Indien het College sanering vaststelt dat de financiële gevolgen van de sanering een positief saldo voor de
      betrokken instelling inhouden, kan het College sanering bepalen dat het saldo wordt gestort in het Fonds langdurige
      zorg. Bij of krachtens de algemene maatregel van bestuur, bedoeld in het vierde lid, kunnen hieromtrent regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.9'
    text: Van besluiten als bedoeld in het tweede lid doet het College sanering mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.10'
    text: |-
      Onze Minister doet jaarlijks verslag aan de Staten-Generaal omtrent de door het College sanering ingevolge het
      tweede lid genomen besluiten.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '17.11'
    text: |-
      Het College sanering is tevens belast met het toezicht op de sanering. Bij de algemene maatregel van bestuur,
      bedoeld in het vierde lid, kunnen hieromtrent regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel17
  - number: '18.1'
    text: |-
      Het bestuur van een instelling, met uitzondering van een academisch ziekenhuis als bedoeld in
      [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dat voornemens is om gebouwen
      of terreinen, of delen daarvan, blijvend niet meer voor de instelling te gebruiken, doet hiervan onverwijld
      mededeling aan het College sanering.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '18.2'
    text: |-
      Het College sanering beslist binnen acht weken na ontvangst van de mededeling of het bestuur van de instelling de
      gebouwen of terreinen kan verhuren, vervreemden of aan enig beperkt recht kan onderwerpen zonder zijn goedkeuring.
      Bij de goedkeuring kan het College sanering bepalen dat bij verkoop een meeropbrengst ten opzichte van de
      boekwaarde wordt gestort in het Fonds langdurige zorg.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      Een rechtshandeling die is verricht in strijd met dit artikel, is vernietigbaar. De vernietigbaarheid kan worden
      ingeroepen door het College sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel18
  - number: '19.1'
    text: |-
      Er is een College sanering zorginstellingen, dat rechtspersoonlijkheid bezit. Het College sanering is gevestigd in
      een door Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel19
  - number: '19.2'
    text: Het College sanering is belast met de taken die hem bij of krachtens de wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel19
  - number: '19.3'
    text: Het College sanering wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel19
  - number: '20.1'
    text: Het College sanering bestaat uit ten hoogste drie leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '20.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt op persoonlijke
      titel plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College sanering
      alsmede op grond van maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '20.5'
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '20.6'
    text: |-
      Onze Minister stelt de bezoldiging en de regels ten aanzien van de rechtspositie van de leden van het College
      sanering vast.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel20
  - number: '21.1'
    text: Het College sanering stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      Vergaderingen van het College sanering zijn niet openbaar, behoudens voor zover in het bestuursreglement anders
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel21
  - number: '21.3'
    text: |-
      In het bestuursreglement legt het College sanering in ieder geval vast hoe hij voldoet aan de verplichting
      ingevolge [artikel 3:2 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '21.4'
    text: |-
      Het bestuursreglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden indien het
      doelmatig en doeltreffend functioneren van het College sanering onvoldoende wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel21
  - number: '22.1'
    text: |-
      Voor het personeel van het College sanering gelden de arbeidsvoorwaarden die zijn opgenomen in de collectieve
      arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het
      ministerie, waaronder het College sanering ressorteert.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald voor welke aangelegenheden van het eerste lid kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel22
  - number: '23.1'
    text: Het College sanering zendt jaarlijks voor 1 oktober aan Onze Minister een jaarplan voor het volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel23
  - number: '23.2'
    text: 'Het jaarplan omvat:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel23
  - number: 23.2.a
    text: |-
      een werkprogramma met een beschrijving van de activiteiten die het College sanering voornemens is ter uitvoering
      van zijn taken te verrichten,
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel23
  - number: 23.2.b
    text: een begroting van de beheerskosten voor de uitvoering van de voorgenomen activiteiten, en
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel23
  - number: 23.2.c
    text: een meerjarenraming voor de vier kalenderjaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel23
  - number: '24.1'
    text: |-
      Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het College sanering voor het
      volgende kalenderjaar vast.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.2'
    text: Onze Minister kan besluiten het budget voor de beheerskosten van het College sanering te wijzigen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.3'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      de begrote baten en lasten, doet het College sanering daarvan onverwijld mededeling aan Onze Minister, onder
      vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.4'
    text: |-
      Het College sanering gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.5'
    text: |-
      Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de begroting
      betrekking heeft, is het College sanering bevoegd, teneinde zijn activiteiten gaande te houden, te beschikken over
      ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.6'
    text: |-
      Onze Minister kan besluiten dat het College sanering in een geval als bedoeld in het vijfde lid, kan beschikken
      over meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '24.7'
    text: |-
      Het door Onze Minister vastgestelde budget voor de beheerskosten van het College sanering wordt gedekt uit 's Rijks
      kas.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel24
  - number: '25.1'
    text: |-
      Het College sanering zendt jaarlijks voor 15 maart aan Onze Minister een jaarverantwoording over het afgelopen
      kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: '25.2'
    text: 'De jaarverantwoording omvat:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: 25.2.a
    text: een jaarrekening, en
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: 25.2.b
    text: |-
      een jaarverslag omtrent het door het College sanering gevoerde beleid, de doeltreffendheid van dat beleid, de
      bedrijfsvoering en de uitvoering van het werkprogramma in het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: '25.3'
    text: |-
      Het College sanering legt in zijn jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over zijn
      beheerskosten en over de rechtmatigheid en doelmatigheid van het beheer in het afgelopen kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '25.4'
    text: |-
      De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld
      in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], die bereid is Onze Minister desgevraagd inzicht te
      geven in zijn controlewerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '25.5'
    text: |-
      De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen door het College
      sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: '25.6'
    text: |-
      De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel25
  - number: '26.1'
    text: |-
      De onderdelen «werkprogramma» en «begroting» van het jaarplan, bedoeld in [artikel 23][ref1], en het onderdeel
      «jaarrekening» van de jaarverantwoording, bedoeld in [artikel 25][ref2], behoeven de goedkeuring van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel25
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '23'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '25'
        hoofdstuk: VI
  - number: '26.2'
    text: 'Het eerste lid geldt niet voor wijzigingen in een goedgekeurde begroting, mits:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
  - number: 26.2.a
    text: de totale omvang van de begroting geen wijziging ondergaat, en
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
  - number: 26.2.b
    text: |-
      de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag van
      5 procent van het in [artikel 24][ref1] bedoelde budget niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel24
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '24'
        hoofdstuk: VI
  - number: '26.3'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en de inrichting van:'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
  - number: 26.3.a
    text: |-
      het jaarplan, bedoeld in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel23
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '23'
        hoofdstuk: VI
  - number: 26.3.b
    text: |-
      de jaarverantwoording, bedoeld in [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel25
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '25'
        hoofdstuk: VI
  - number: 26.3.c
    text: |-
      de verklaring, bedoeld in [artikel 25, vierde lid][ref1], en het verslag van bevindingen, bedoeld in
      [artikel 25, zesde lid][ref2], alsmede het aan die verklaring en dat verslag ten grondslag liggende onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel25
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '25'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '25'
        hoofdstuk: VI
  - number: '26.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 24][ref1], wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel24
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '24'
        hoofdstuk: VI
  - number: '27.1'
    text: |-
      Na de goedkeuring, bedoeld in [artikel 26, eerste lid][ref1], stelt het College sanering het jaarplan en de
      jaarverantwoording algemeen verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel26
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '26'
        hoofdstuk: VI
  - number: '27.2'
    text: |-
      Onze Minister brengt zijn oordeel over het functioneren van het College sanering ter kennis van beide Kamers der
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel27
  - number: '29'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel29
  - number: '30.1'
    text: Een besluit van het College sanering kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel30
  - number: '30.2'
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel30
  - number: '33'
    text: |-
      Het College sanering verstrekt desgevraagd aan de Nederlandse Zorgautoriteit, bedoeld in de
      [Wet marktordening gezondheidszorg][ref1], de voor de uitoefening van diens taak benodigde inlichtingen. De
      Nederlandse Zorgautoriteit kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      invulling van zijn taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '34'
    text: |-
      Het College sanering verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen en gegevens. Het College sanering verleent aan door Onze Minister aangewezen personen toegang tot en
      inzage in alle gegevens die Onze Minister nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel34
  - number: '35'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd alsmede de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel35
  - number: '36'
    text: |-
      De in [artikel 35][ref1] bedoelde personen beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '35'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '37'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van
      [artikel 5, eerste lid][ref1], van de bij of krachtens [artikel 13][ref2] aan een toelating verbonden
      voorschriften, alsmede van de [artikelen 15][ref3] en [16][ref4]. Het College sanering is bevoegd
      tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde bij of krachtens de
      [artikelen 17, eerste en achtste lid][ref5], en [18, eerste en tweede lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0018906#Artikel17
      [ref6]: https://wetten.overheid.nl/BWBR0018906#Artikel18
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '13'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0018906
        artikel: '15'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0018906
        artikel: '16'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0018906
        artikel: '17'
        hoofdstuk: V
      - id: ref6
        bwb_id: BWBR0018906
        artikel: '18'
        hoofdstuk: V
  - number: '63'
    text: |-
      De vaststelling van de algemene maatregelen van bestuur, bedoeld in [artikel 1, tweede en derde lid][ref1], en de
      visie, bedoeld in [artikel 3, eerste lid][ref2], en het geven van beschikkingen door Onze Minister als bedoeld in
      de [artikelen 13][ref3] en [14][ref4], een en ander voor zover zij betrekking hebben op academische ziekenhuizen
      als bedoeld in [artikel 1.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], vinden plaats
      in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0018906
        artikel: '13'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0018906
        artikel: '14'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '64'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College sanering zijn uit de wet voortvloeiende verplichtingen niet naar behoren
      nakomt.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel64
  - number: '65'
    text: |-
      Een krachtens deze wet vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Zij treedt in werking op een tijdstip dat nadat dertig dagen na de overlegging zijn verstreken, bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der Kamers de wens te kennen
      wordt gegeven dat het in de algemene maatregel geregelde onderwerp bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en wordt de algemene maatregel ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel65
  - number: '66.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel66
  - number: '66.2'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan
      de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het College
      sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel66
  - number: '67'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel67
  - number: '68'
    text: 'Deze wet wordt aangehaald als: Wet toelating zorginstellingen.'
    url: https://wetten.overheid.nl/BWBR0018906/2021-07-01#Artikel68
