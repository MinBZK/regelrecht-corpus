      1 Na de goedkeuring, bedoeld in [artikel 26, eerste lid][ref1], stelt het College sanering het jaarplan en de
      jaarverantwoording algemeen verkrijgbaar.

      2 Onze Minister brengt zijn oordeel over het functioneren van het College sanering ter kennis van beide Kamers der
      Staten-Generaal.


