  - number: '39'
    text: |-
      1 De [artikelen 15][ref1], [16][ref2] en [37][ref3], zoals die artikelen
      luidden onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel E, van de Aanpassingswet Wet toetreding zorgaanbieders][ref4], blijven ten aanzien van
      een instelling van toepassing voor zover die instelling in de periode, voorafgaand aan dat tijdstip aan de in de
      artikelen 15 en 16 opgenomen verplichtingen diende te voldoen.

      2 Ten aanzien van bezwaar en beroep tegen een besluit dat ter handhaving van
      [artikel 13][ref5] is genomen voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I, onderdeel E, van de Aanpassingswet Wet toetreding zorgaanbieders][ref6], is het recht zoals dat gold
      onmiddellijk voorafgaand aan dat tijdstip van toepassing.


