  - number: '29'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van het
      College sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel29
  - number: '30'
    text: |-
      1 Een besluit van het College sanering kan bij koninklijk besluit worden vernietigd.

      2 Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel30
  - number: '33'
    text: |-
      Het College sanering verstrekt desgevraagd aan de Nederlandse Zorgautoriteit, bedoeld in de
      [Wet marktordening gezondheidszorg][ref1], de voor de uitoefening van diens taak benodigde inlichtingen. De
      Nederlandse Zorgautoriteit kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de
      invulling van zijn taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '34'
    text: |-
      Het College sanering verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde
      inlichtingen en gegevens. Het College sanering verleent aan door Onze Minister aangewezen personen toegang tot en
      inzage in alle gegevens die Onze Minister nodig acht voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel34
  - number: '35'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, behoudens [artikel 5][ref1], zijn
      belast de bij besluit van Onze Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel35
