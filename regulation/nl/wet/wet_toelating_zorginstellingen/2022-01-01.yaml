  - number: '26'
    text: |-
      1 De onderdelen «werkprogramma» en «begroting» van het jaarplan, bedoeld in [artikel 23][ref1], en het onderdeel
      «jaarrekening» van de jaarverantwoording, bedoeld in [artikel 25][ref2], behoeven de goedkeuring van Onze Minister.

      2 Het eerste lid geldt niet voor wijzigingen in een goedgekeurde begroting, mits:

      a. de totale omvang van de begroting geen wijziging ondergaat, en

      b. de wijziging per groep van kostensoorten en baten, gerekend over het desbetreffende begrotingsjaar, een bedrag
      van 5 procent van het in [artikel 24][ref3] bedoelde budget niet te boven gaat.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de inhoud en de inrichting van:

      a. het jaarplan, bedoeld in [artikel 23][ref4];

      b. de jaarverantwoording, bedoeld in [artikel 25][ref5];

      c. de verklaring, bedoeld in [artikel 25, vierde lid][ref6], en het verslag van bevindingen, bedoeld in
      [artikel 25, zesde lid][ref7], alsmede het aan die verklaring en dat verslag ten grondslag liggende onderzoek.

      4 Bij ministeriële regeling worden regels gesteld over de wijze waarop en de voorwaarden waaronder het budget,
      bedoeld in [artikel 24][ref8], wordt vastgesteld.


