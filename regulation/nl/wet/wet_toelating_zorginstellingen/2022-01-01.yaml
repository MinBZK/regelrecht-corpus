  - number: '64'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College sanering zijn uit de wet voortvloeiende verplichtingen niet naar behoren
      nakomt.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel64
  - number: '65'
    text: |-
      Een krachtens deze wet vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal
      overgelegd. Zij treedt in werking op een tijdstip dat nadat dertig dagen na de overlegging zijn verstreken, bij
      koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der Kamers de wens te kennen
      wordt gegeven dat het in de algemene maatregel geregelde onderwerp bij wet wordt geregeld. In dat geval wordt een
      daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend en wordt de algemene maatregel ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel65
  - number: '66'
    text: |-
      1 Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.

      2 Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar
      aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van het College
      sanering.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel66
  - number: '67'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel67
  - number: '68'
    text: 'Deze wet wordt aangehaald als: Wet toelating zorginstellingen.'
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel68
