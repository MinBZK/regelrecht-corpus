  - number: '19'
    text: |-
      1 Er is een College sanering zorginstellingen, dat rechtspersoonlijkheid bezit. Het College sanering is gevestigd
      in een door Onze Minister te bepalen plaats.

      2 Het College sanering is belast met de taken die hem bij of krachtens de wet zijn opgedragen.

      3 Het College sanering wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel19
  - number: '20'
    text: |-
      1 Het College sanering bestaat uit ten hoogste drie leden, onder wie de voorzitter.

      2 Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt op persoonlijke
      titel plaats op grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College sanering
      alsmede op grond van maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt
      mededeling gedaan in de Staatscourant.

      3 Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College sanering.

      4 De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.

      5 Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige
      redenen door Onze Minister.

      6 Onze Minister stelt de bezoldiging en de regels ten aanzien van de rechtspositie van de leden van het College
      sanering vast.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel20
  - number: '21'
    text: |-
      1 Het College sanering stelt een bestuursreglement vast.

      2 Vergaderingen van het College sanering zijn niet openbaar, behoudens voor zover in het bestuursreglement anders
      is bepaald.

      3 In het bestuursreglement legt het College sanering in ieder geval vast hoe hij voldoet aan de verplichting
      ingevolge [artikel 3:2 van de Algemene wet bestuursrecht][ref1].

      4 Het bestuursreglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden indien het
      doelmatig en doeltreffend functioneren van het College sanering onvoldoende wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel32
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:2
  - number: '22'
    text: |-
      1 Voor het personeel van het College sanering gelden de arbeidsvoorwaarden die zijn opgenomen in de collectieve
      arbeidsovereenkomst voor ambtenaren die krachtens een arbeidsovereenkomst met de Staat werkzaam zijn bij het
      ministerie, waaronder het College sanering ressorteert.

      2 Bij algemene maatregel van bestuur kan worden bepaald voor welke aangelegenheden van het eerste lid kan worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het College sanering zendt jaarlijks voor 1 oktober aan Onze Minister een jaarplan voor het volgende
      kalenderjaar.

      2 Het jaarplan omvat:

      a. een werkprogramma met een beschrijving van de activiteiten die het College sanering voornemens is ter uitvoering
      van zijn taken te verrichten,

      b. een begroting van de beheerskosten voor de uitvoering van de voorgenomen activiteiten, en

      c. een meerjarenraming voor de vier kalenderjaren volgend op het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel23
  - number: '24'
    text: |-
      1 Onze Minister stelt jaarlijks voor 1 december het budget voor de beheerskosten van het College sanering voor het
      volgende kalenderjaar vast.

      2 Onze Minister kan besluiten het budget voor de beheerskosten van het College sanering te wijzigen.

      3 Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en
      de begrote baten en lasten, doet het College sanering daarvan onverwijld mededeling aan Onze Minister, onder
      vermelding van de oorzaak van de verschillen.

      4 Het College sanering gaat met betrekking tot de beheerskosten geen verplichtingen aan en doet geen uitgaven die
      leiden tot overschrijding van het vastgestelde budget voor de beheerskosten.

      5 Indien het budget voor de beheerskosten niet is vastgesteld voor 1 januari van het kalenderjaar waarop de
      begroting betrekking heeft, is het College sanering bevoegd, teneinde zijn activiteiten gaande te houden, te
      beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is
      vastgesteld.

      6 Onze Minister kan besluiten dat het College sanering in een geval als bedoeld in het vijfde lid, kan beschikken
      over meer dan een derde gedeelte van het budget dat laatstelijk voor hem voor een geheel jaar is vastgesteld.

      7 Het door Onze Minister vastgestelde budget voor de beheerskosten van het College sanering wordt gedekt uit 's
      Rijks kas.
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel24
  - number: '25'
    text: |-
      1 Het College sanering zendt jaarlijks voor 15 maart aan Onze Minister een jaarverantwoording over het afgelopen
      kalenderjaar, alsmede het verslag van bevindingen, bedoeld in het zesde lid.

      2 De jaarverantwoording omvat:

      a. een jaarrekening, en

      b. een jaarverslag omtrent het door het College sanering gevoerde beleid, de doeltreffendheid van dat beleid, de
      bedrijfsvoering en de uitvoering van het werkprogramma in het afgelopen kalenderjaar.

      3 Het College sanering legt in zijn jaarrekening, die zoveel mogelijk met overeenkomstige toepassing van
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] wordt ingericht, rekening en verantwoording af over zijn
      beheerskosten en over de rechtmatigheid en doelmatigheid van het beheer in het afgelopen kalenderjaar.

      4 De jaarrekening gaat vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref2], die bereid is Onze Minister desgevraagd
      inzicht te geven in zijn controlewerkzaamheden.

      5 De verklaring heeft mede betrekking op de rechtmatige verkrijging en besteding van de middelen door het College
      sanering.

      6 De accountant voegt bij de verklaring een verslag van zijn bevindingen over de vraag of het beheer en de
      organisatie voldoen aan eisen van rechtmatigheid, ordelijkheid, controleerbaarheid en doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#Artikel25
