preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het ter bevordering van de overgang van een centraal aanbod gestuurd
    naar een decentraal vraaggericht zorgstelsel wenselijk is de regels inzake de toelating van zorginstellingen en die
    inzake de bouwprocedure te vereenvoudigen en samen te voegen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018906/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b.

      c. College sanering: het College sanering zorginstellingen, genoemd in [artikel 19][ref1];

      d. Zorginstituut: het Zorginstituut Nederland, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2];

      e. Fonds langdurige zorg: het Fonds langdurige zorg, genoemd in
      [artikel 89 van de Wet financiering sociale verzekeringen][ref3];

      f. instelling: een organisatorisch verband dat zorg of een andere dienst verleent waarop aanspraak bestaat
      ingevolge [artikel 3.1.1 van de Wet langdurige zorg][ref4] of ingevolge een zorgverzekering als bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref5].

      2 Bij algemene maatregel van bestuur kan met betrekking tot daarbij aan te wijzen categorieën van instellingen
      worden bepaald dat delen van deze wet op die instellingen of een deel daarvan niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel19
