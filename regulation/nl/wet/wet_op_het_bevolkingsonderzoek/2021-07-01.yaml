  - number: '14'
    text: |-
      1 Voor degene die op het tijdstip waarop deze wet of krachtens artikel 2, tweede lid, genomen besluit in werking
      treedt, reeds een bevolkingsonderzoek verricht, waarvoor op grond van [artikel 3, eerste lid][ref1], een vergunning
      is vereist, blijft die bepaling alsmede het krachtens [artikel 3, tweede, derde of vijfde lid][ref2], bepaalde
      buiten toepassing gedurende dertien weken na dat tijdstip en indien binnen die termijn een aanvraag om de vereiste
      vergunning is ingediend, ook nadien tot vier weken nadat de beschikking waarbij op die aanvraag wordt beslist, van
      kracht is geworden.

      2 Indien naar zijn oordeel het belang van de volksgezondheid een onverwijlde voorziening vordert, kan Onze Minister
      ten aanzien van degene die onderzoek verricht als bedoeld in het eerste lid, bepalen dat de termijn als bedoeld in
      het eerste lid, buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005699#Artikel3
