  - number: '4'
    text: |-
      1 Een aanvraag om een vergunning als bedoeld in [artikel 3, eerste lid][ref1], bevat een nauwkeurige beschrijving
      van:

      a. de toe te passen onderzoeksmethoden;

      b. de op te sporen ziekten of risico-indicatoren;

      c. de te onderzoeken categorie van de bevolking;

      d. de organisatie van het bevolkingsonderzoek;

      e. de maatregelen die genomen worden om de kwaliteit van het bevolkingsonderzoek te waarborgen.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld betreffende andere gegevens die bij een aanvraag
      worden overgelegd. Deze regels kunnen verschillen voor de onderscheidene categorieën van bevolkingsonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel3
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel4
