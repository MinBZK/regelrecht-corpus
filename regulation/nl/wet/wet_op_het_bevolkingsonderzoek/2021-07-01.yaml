        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: Alvorens op een aanvraag te beslissen, hoort Onze Minister de Gezondheidsraad.
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel6
  - number: '7'
    text: |-
      1 Een vergunning wordt geweigerd indien:

      a. het bevolkingsonderzoek naar wetenschappelijke maatstaven ondeugdelijk is;

      b. het bevolkingsonderzoek niet in overeenstemming is met wettelijke regels voor medisch handelen;

      c. het te verwachten nut van het bevolkingsonderzoek niet opweegt tegen de risico's daarvan voor de gezondheid van
      de te onderzoeken personen.

      2 Bij bevolkingsonderzoek als bedoeld in [artikel 3, derde lid][ref1], kan een vergunning worden geweigerd indien
      het belang van de volksgezondheid een dergelijk onderzoek niet vordert.

      3 Voor bevolkingsonderzoek naar ernstige ziekten of afwijkingen waarvoor geen behandeling of preventie mogelijk is,
      wordt een vergunning slechts verleend indien bijzondere omstandigheden daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel3
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005699
        artikel: '3'
        hoofdstuk: II
  - number: '8'
    text: |-
      1 Van de beschikking op de aanvraag wordt mededeling gedaan aan de in [artikel 10][ref1] bedoelde inspecteurs voor
      zover zij ter plaatse bevoegd zijn.

      2 Van de beschikking wordt voorts mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel10
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005699
        artikel: '10'
        hoofdstuk: III
  - number: '9'
    text: |-
      1 Een vergunning kan slechts worden ingetrokken indien:

      a. de te harer verkrijging verstrekte gegevens zodanig onjuist of onvoldoende blijken, dat op de aanvraag een
      andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste omstandigheden volledig bekend
      zouden zijn geweest;

      b. een beperking waaronder de vergunning is verleend, wordt overschreden;

      c. een aan de vergunning verbonden voorschrift niet wordt nageleefd;

      d. op de aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan nadien bekend geworden
      wetenschappelijke kennis met betrekking tot het bevolkingsonderzoek waarvoor een vergunning is verleend, bekend zou
      zijn geweest;

      e. aan het bevolkingsonderzoek na de vergunningverlening een wetenschappelijk onderzoek op het gebied van de
      geneeskunst wordt toegevoegd en op de aanvraag een andere beslissing zou zijn genomen indien dit bij de beoordeling
      van de aanvraag bekend zou zijn geweest.

      2 In gevallen waarin de vergunning kan worden ingetrokken, kunnen in plaats daarvan beperkingen of voorschriften
      aan de vergunning worden toegevoegd dan wel aan de vergunning verbonden beperkingen of voorschriften worden
      gewijzigd.

      3 Alvorens toepassing te geven aan het eerste lid of het tweede lid, hoort Onze Minister de Gezondheidsraad.
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel10
  - number: '11'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


