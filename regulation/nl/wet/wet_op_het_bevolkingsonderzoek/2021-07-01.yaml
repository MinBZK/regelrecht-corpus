  - number: '3'
    text: |-
      1 Het is verboden een bevolkingsonderzoek als bedoeld in [artikel 2, eerste lid][ref1], of dat krachtens
      [artikel 2, tweede lid][ref2], is aangewezen, te verrichten zonder vergunning van Onze Minister.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld die noodzakelijk zijn voor de bescherming van de
      te onderzoeken personen tegen de risico's van bevolkingsonderzoek als bedoeld in [artikel 2, eerste lid][ref3], dan
      wel bevolkingsonderzoek dat krachtens [artikel 2, tweede lid][ref4], is aangewezen. Deze regels kunnen verschillen
      voor de onderscheidene categorieën van bevolkingsonderzoek.

      3 Met betrekking tot bevolkingsonderzoek als bedoeld in [artikel 2, eerste lid][ref5], dan wel bevolkingsonderzoek
      dat krachtens [artikel 2, tweede lid][ref6], is aangewezen, en dat tevens wetenschappelijk onderzoek op het gebied
      van de geneeskunst is, kunnen bij algemene maatregel van bestuur regels worden gesteld met betrekking tot de wijze
      waarop toestemming wordt gegeven en betrokkenen worden ingelicht over het doel, de aard en de gevolgen van het
      onderzoek en de bescherming van de persoonlijke levenssfeer van te onderzoeken personen.

      4 Een vergunning kan onder beperkingen worden verleend en aan een vergunning kunnen voorschriften worden verbonden;
      een en ander ter bescherming van de te onderzoeken personen tegen de risico's of ter verzekering van een voldoende
      nut van het desbetreffende bevolkingsonderzoek, en uitsluitend voor zover noodzakelijk in verband met de aard van
      het bevolkingsonderzoek waarvoor de vergunning wordt verleend.

      5 Bij een aanwijzing als bedoeld in [artikel 2, tweede lid][ref7], kan Onze Minister regels stellen als bedoeld
      in artikel 3, tweede en derde lid; die regels vervallen, behoudens eerdere intrekking, twaalf maanden na hun
      inwerkingtreding.


