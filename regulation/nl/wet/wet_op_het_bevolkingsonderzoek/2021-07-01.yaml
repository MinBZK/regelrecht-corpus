  - number: '13'
    text: |-
      1 Met een geldboete van de vierde categorie wordt gestraft, degene die handelt in strijd met:

      a. het bij [artikel 3, eerste lid][ref1], bepaalde;

      b. het krachtens [artikel 3, tweede, derde of vijfde lid][ref2], bepaalde;

      c. een krachtens [artikel 3, vierde lid][ref3], aan een vergunning verbonden voorschrift.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005699#Artikel3
