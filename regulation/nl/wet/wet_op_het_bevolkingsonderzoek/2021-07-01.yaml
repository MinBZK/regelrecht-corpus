preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op de bescherming van de bevolking de
    uitvoering van bevolkingsonderzoek dat een gevaar kan vormen voor de gezondheid van de te onderzoeken personen aan
    een vergunningstelsel te onderwerpen, en dat geen behoefte meer bestaat aan een afzonderlijke regeling betreffende
    het röntgenologisch borstonderzoek op tuberculose, zoals neergelegd in de Wet bevolkingsonderzoek op tuberculose
    (Stb. 1951, 288);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;

      b. de Gezondheidsraad: de Gezondheidsraad, bedoeld in [artikel 21 van de Gezondheidswet][ref1] (*Stb.* 1956, 51);

      c. bevolkingsonderzoek: geneeskundig onderzoek van personen dat wordt verricht ter uitvoering van een aan de gehele
      bevolking of aan een categorie daarvan gedaan aanbod dat gericht is op het ten behoeve of mede ten behoeve van de
      te onderzoeken personen opsporen van ziekten van een bepaalde aard of van bepaalde risico-indicatoren.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel21
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '21'
  - number: '2'
    text: |-
      1 Bevolkingsonderzoek waarbij gebruik wordt gemaakt van ioniserende straling, bevolkingsonderzoek naar kanker en
      bevolkingsonderzoek naar ernstige ziekten of afwijkingen waarvoor geen behandeling of preventie mogelijk is, moeten
      met de waarborgen bedoeld in [artikel 3][ref1] worden omgeven.

      2 Indien vanwege de aard van de toe te passen onderzoeksmethode of vanwege de aard van de op te sporen ziekte of
      risico-indicator naar het oordeel van Onze Minister het belang van de volksgezondheid een onverwijlde voorziening
      vordert, kan hij bevolkingsonderzoek aanwijzen dat met de waarborgen, bedoeld in [artikel 3][ref2], moet worden
      omgeven.

      3 Binnen twaalf maanden na inwerkingtreding van een besluit als bedoeld in het tweede lid, wordt bij de Tweede
      Kamer der Staten-Generaal een voorstel van wet tot regeling van het onderwerp van dat besluit ingediend. Indien het
      voorstel van wet wordt ingetrokken of door een der Kamers der Staten-Generaal wordt verworpen, wordt het besluit
      onverwijld ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005699#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005699#Artikel3
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel2
