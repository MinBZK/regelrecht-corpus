  - number: '16'
    text: De Wet bevolkingsonderzoek op tuberculose (*Stb.* 1951, 288) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel16
  - number: '17'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005699/2021-07-01#Artikel17
