  - number: '2.1'
    text: |-
      Voor zover niet anders bepaald, wordt onder "gedeputeerde staten" in deze wet verstaan het college, bedoeld in
      [artikel 17, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel17
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: '2.2'
    text: |-
      Het college, bedoeld in het eerste lid, neemt de besluiten, bedoeld in de [artikelen 4, zesde lid][ref1],
      [22, zevende lid][ref2], en [28, tweede lid][ref3], niet dan in overeenstemming met gedeputeerde staten van de
      andere provincie, waarin het gebied, waarop het herinrichtingsplan betrekking heeft, of het deelgebied mede is
      gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel28
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '4'
        hoofdstuk: I
        afdeling: '3'
