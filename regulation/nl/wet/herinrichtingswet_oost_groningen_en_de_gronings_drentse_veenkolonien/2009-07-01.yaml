      - id: ref3
        bwb_id: BWBR0003143
        artikel: '28'
        hoofdstuk: III
        afdeling: '3'
  - number: '3.1'
    text: |-
      Ter bevordering van een goed woon-, leef- en werkklimaat en de economische en maatschappelijke ontwikkeling van
      Oost-Groningen en de Gronings-Drentse Veenkoloniën vindt van dit gebied een herinrichting plaats op de voet van het
      bepaalde in deze wet.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      De herinrichting omvat de gecoördineerde en waar mogelijk geïntegreerde uitvoering van de volgende maatregelen
      en voorzieningen:
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.a
    text: verbetering van de infrastructuur en de landbouwkundige structuur;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.b
    text: herverkaveling van de in Oost-Groningen en de Gronings-Drentse Veenkoloniën gelegen onroerende zaken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.c
    text: opheffing van de stadsmeierrechten;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.d
    text: overdracht van wegen en kanalen van de gemeente Groningen buiten haar grenzen gelegen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.e
    text: het treffen van voorzieningen ten behoeve van het landschap en de openluchtrecreatie;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.f
    text: veiligstelling en ontwikkeling van natuurgebieden en cultuurhistorische elementen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.g
    text: de opstelling en tenuitvoerlegging van een sociaal-cultureel plan;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.h
    text: bijdragen aan de totstandkoming van de vernieuwing van stads- en dorpskernen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.i
    text: afbraak of vernieuwing van krotten en slechte woningen en het verlenen van bijdragen daarin;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: 3.2.j
    text: het treffen van voorzieningen in het openbaar belang voor de afvoer en behandeling van afvalwater.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Er is een herinrichtingscommissie, die belast is met de uitvoering van de herinrichting van Oost-Groningen en de
      Gronings-Drentse Veenkoloniën.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      De commissie bestaat uit een oneven aantal van ten hoogste 31 leden. Onze Minister en Onze Minister van
      Volkshuisvesting en Ruimtelijke Ordening benoemen in overeenstemming met Onze Ministers van Binnenlandse Zaken,
      van Verkeer en Waterstaat, van Economische Zaken en van Cultuur, Recreatie en Maatschappelijk Werk, gehoord
      gedeputeerde staten van Groningen en van Drenthe, de voorzitter en de overige leden van de commissie. Onze Minister
      en Onze Minister van Volkshuisvesting en Ruimtelijke Ordening kunnen in overeenstemming met Onze in de tweede zin
      genoemde Ministers adviserende leden benoemen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.3'
    text: De herinrichtingscommissie is bevoegd al dan niet uit haar midden sub-commissies in te stellen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      De herinrichtingscommissie kan geen besluiten nemen, indien niet tenminste drievijfde van het aantal leden aanwezig
      is. De voorzitter en de secretaris voeren de besluiten uit; zij kunnen daartoe rechtshandelingen verrichten en in
      rechte optreden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.5'
    text: |-
      De Staat garandeert de nakoming der uit de in het vorige lid bedoelde rechtshandelingen voortvloeiende
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.6'
    text: |-
      Gedeputeerde staten benoemen op voorstel van de herinrichtingscommissie, gehoord de betrokken gemeenten en
      waterschappen, voor elk deelgebied een deelgebiedscommissie van ten hoogste elf leden. Gedeputeerde staten wijzen
      een der leden als voorzitter aan. De deelgebiedscommissie dient de herinrichtingscommissie van advies in zaken de
      herinrichting van het deelgebied betreffende.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.7'
    text: |-
      Onze Minister stelt in overeenstemming met Onze in het tweede lid genoemde Ministers een instructie voor de
      herinrichtingscommissie en de deelgebiedscommissie vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.8'
    text: |-
      De herinrichtingscommissie kan aan de deelgebiedscommissie onder door haar te stellen voorwaarden een gedeelte van
      haar taken opdragen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.9'
    text: |-
      Het bestuur van de Dienst voor het kadaster en de openbare registers wijst in overeenstemming met Onze Minister een
      ingenieur van het kadaster en één of meer plaatsvervangers aan, die de herinrichtingscommissie bijstaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '4.10'
    text: Onze Minister voegt aan de herinrichtingscommissie en aan de deelgebiedscommissie een secretaris toe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister zendt bericht van de benoeming van de herinrichtingscommissie aan gedeputeerde staten van Groningen
      en van Drenthe en aan de arrondissementsrechtbanken in Groningen en Assen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel5
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde arrondissementsrechtbanken benoemen elk na ontvangst van dit bericht een of meer
      rechter-commissarissen en doen hiervan mededeling aan gedeputeerde staten van Groningen en van Drenthe, aan de
      herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel5
  - number: '6.1'
    text: |-
      Zonder voorafgaande verklaring bij de wet, dat het algemeen nut onteigening vordert, kan onteigening plaatsvinden
      van onroerende zaken en rechten als bedoeld in [artikel 4, eerste lid, van de onteigeningswet][ref1] (*Stb.*
      1922, 25) in Oost-Groningen en de Gronings-Drentse Veenkoloniën, waarover de beschikking moet worden verkregen ter
      verwezenlijking van een herinrichtingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde onteigening mag ten behoeve van de landschappelijke en recreatieve voorzieningen,
      alsmede ten behoeve van de veiligstelling en ontwikkeling van natuurgebieden en cultuurhistorische elementen niet
      meer dan 5600 hectare betreffen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel6
  - number: '6.3'
    text: De onteigening geschiedt ten name van de Staat.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel6
  - number: '6.4'
    text: De onteigening heeft plaats uit kracht van een door Ons, de Raad van State gehoord, genomen besluit.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel6
  - number: '7'
    text: |-
      De bepalingen van de[ artikelen 62-64 van de onteigeningswet][ref1] zijn toepasselijk met dien verstande, dat, waar
      in de toepasselijk verklaarde artikelen gesproken wordt van "plan van werk", daarvoor kan worden gelezen "plan"
      en dat [artikel 15, tweede lid, van de onteigeningswet][ref2] voor zoveel betreft de vermelding van de aard en de
      strekking van het werk en [artikel 61 van de onteigeningswet][ref3] slechts in zoverre toepassing vinden, als de
      onteigening dient teneinde uitvoering te geven aan een werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0001842#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0001842
        artikel: '61'
  - number: '8'
    text: |-
      Voor Oost-Groningen en de Gronings-Drentse Veenkoloniën wordt een herinrichtingsprogramma vastgesteld, inhoudende
      de uitgangspunten voor de herinrichting als bedoeld in [artikel 3][ref1], de verdeling van Oost-Groningen en de
      Gronings-Drentse Veenkoloniën in deelgebieden, een omschrijving van de voor de verwezenlijking van de herinrichting
      aan te wenden middelen, alsmede uitgangspunten voor een verdeling van de kosten van de herinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel3
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: '9.1'
    text: |-
      De herinrichtingscommissie stelt een voorontwerp van het herinrichtingsprogramma voorlopig vast en maakt dit
      alom in Oost-Groningen en de Gronings-Drentse Veenkoloniën bekend onder vermelding van het adres, alwaar ter zake
      inlichtingen kunnen worden ingewonnen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      De herinrichtingscommissie verschaft gedurende tenminste drie maanden nadien gelegenheid zienswijze en denkbeelden
      over het voorontwerp naar voren te brengen en daarover zowel onderling als met vertegenwoordigers van de
      herinrichtingscommissie van gedachte te wisselen. Van dit overleg en de uitkomsten daarvan wordt een rapport
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel9
  - number: '9.3'
    text: |-
      Het rapport wordt uiterlijk negen maanden na de bekendmaking, bedoeld in eerste lid, afgesloten. Het bevat onder
      meer een overzicht van de naar voren gebrachte zienswijzen en denkbeelden en een uiteenzetting, in hoeverre
      daarmede al dan niet rekening is gehouden bij de vaststelling van het in het volgende lid bedoelde voorontwerp van
      het herinrichtingsprogramma.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel9
  - number: '9.4'
    text: |-
      De herinrichtingscommissie stelt uiterlijk negen maanden na de bekendmaking, bedoeld in het eerste lid, het
      voorontwerp voor het herinrichtingsprogramma vast en zendt het met het in het vorige lid bedoelde rapport
      onverwijld aan de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel9
  - number: '10.1'
    text: |-
      De centrale commissie zendt het voorontwerp, vergezeld van haar advies, aan gedeputeerde staten van Groningen en
      van Drenthe. Gedeputeerde staten van Groningen en van Drenthe leggen een afschrift daarvan gedurende twee maanden
      ter kosteloze inzage van een ieder neder ter provinciale griffie en ter secretarie van de gemeenten, welke geheel
      of gedeeltelijk zijn gelegen in het gebied waarop het voorontwerp betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel10
  - number: '10.2'
    text: |-
      Gedeputeerde staten van Groningen en van Drenthe doen van de nederlegging tevoren openbare kennisgeving in de
      *Staatscourant*, in ten minste twee dagbladen die in de streek worden verspreid en in de gemeenten op de aldaar
      gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag, waarop het voorontwerp ter inzage heeft gelegen, kan een ieder
      schriftelijk zijn bedenkingen naar voren brengen bij provinciale staten van Groningen, bij provinciale staten van
      Drenthe, dan wel bij beide.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel11
  - number: '11.2'
    text: |-
      Deze bevoegdheid wordt in de kennisgeving, bedoeld in [artikel 10, tweede lid][ref1], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel10
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
  - number: '12.1'
    text: |-
      Provinciale staten van Groningen en van Drenthe stellen het herinrichtingsprogramma, voor zover dit betrekking
      heeft op hun provincie, in ontwerp vast, waarbij zij zodanig acht slaan op de naar voren gebrachte bedenkingen als
      zij menen te moeten doen. Indien provinciale staten van Groningen of van Drenthe voornemens zijn af te wijken van
      het voorontwerp, winnen zij advies in van de centrale commissie. Zij leggen hun standpunt ten aanzien van de naar
      voren gebrachte bedenkingen in een rapport vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      Provinciale staten van Groningen en van Drenthe zenden het ontwerpherinrichtingsprogramma, voor zover dit
      betrekking heeft op hun provincie, alsmede afschriften van de naar voren gebrachte bedenkingen en het daaromtrent
      opgemaakte rapport naar Onze Minister en Onze Minister van Volkshuisvesting en Ruimtelijke Ordening.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer stellen, in
      overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, van Verkeer en Waterstaat,
      van Economische Zaken, van Financiën en van Onderwijs, Cultuur en Wetenschap, het herinrichtingsprogramma vast
      binnen zes maanden nadat zij het ontwerp herinrichtingsprogramma of het laatst vastgestelde gedeelte daarvan
      hebben ontvangen. Indien en voor zover Onze Minister en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer bij de vaststelling afwijken van het ontwerp, zoals dit door provinciale staten is vastgesteld,
      geven zij de redenen daarvoor aan. Onze Minister doet hiervan schriftelijk mededeling aan gedeputeerde staten van
      Groningen en van Drenthe, uiterlijk dertig dagen nadat het in dit lid bedoelde besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel13
  - number: '13.2'
    text: |-
      De vaststelling van het herinrichtingsprogramma vindt niet eerder plaats dan nadat de
      structuurvisies voor Oost-Groningen en de Gronings-Drentse Veenkoloniën als bedoeld in
      [artikel 2.2, eerste of tweede lid, van de Wet ruimtelijke ordening][ref1] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '13.3'
    text: |-
      Onze Minister deelt zijn standpunt naar aanleiding van de ingebrachte bedenkingen en het in
      [eerste lid van artikel 12][ref1] bedoelde rapport schriftelijk en met redenen omkleed aan degenen die bedenkingen
      hebben ingebracht mede, uiterlijk dertig dagen nadat het in het eerste lid bedoelde besluit is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel12
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '13.4'
    text: |-
      Tegen een besluit als bedoeld in het eerste lid kunnen uitsluitend provinciale staten van Groningen en van Drenthe
      beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State. De werking van het besluit, bedoeld
      in het eerste lid, wordt opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het
      beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel13
  - number: '13.5'
    text: |-
      Zodra het herinrichtingsprogramma is vastgesteld, wordt het op de provinciale griffie en op de secretarie van
      de gemeenten in Oost-Groningen en de Gronings-Drentse Veenkoloniën gedurende acht weken voor een ieder ter
      inzage gelegd. Gedeputeerde staten van Groningen en van Drenthe geven van de terinzageligging kennis in de
      *Staatscourant*, in ten minste twee dagbladen die in de streek worden verspreid en in de gemeente op de aldaar
      gebruikelijke manier.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      Het herinrichtingsprogramma kan worden gewijzigd. De [artikelen 9-13][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel9
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '9'
        hoofdstuk: III
        afdeling: '1'
  - number: '14.2'
    text: |-
      Een in gang gezette procedure tot wijziging van het herinrichtingsprogramma ontneemt aan het tot dan toe
      geldende programma, voor zover niet tot voorwerp van wijziging gemaakt, niet de betekenis van grondslag voor de
      herinrichtingsplannen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel14
  - number: '14.3'
    text: |-
      Bij een herziening van het herinrichtingsprogramma wordt rekening gehouden met een structuurvisie als bedoeld in
      [artikel 2.2, eerste of tweede lid, van de Wet ruimtelijke ordening][ref1], die betrekking heeft op Oost-Groningen
      en de Gronings-Drentse Veenkoloniën.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel2
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '2'
  - number: '15'
    text: Het herinrichtingsprogramma dient als grondslag voor de herinrichtingsplannen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel15
  - number: '16.1'
    text: |-
      De herinrichtingscommissie stelt, gehoord de betrokken gemeenten en waterschappen, voor elk deelgebied een
      voorontwerp van een of meer herinrichtingsplannen op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: '16.2'
    text: 'Het herinrichtingsplan bevat:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.2.a
    text: een beschrijving van de ruimtelijke, economische en maatschappelijke toestand in het deelgebied;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.2.b
    text: een beschrijving van de algemene landbouwkundige toestand in de te herverkavelen blokken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.2.c
    text: het plan van voorzieningen met bijbehorende kaarten;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.2.d
    text: |-
      de overige maatregelen en voorzieningen als bedoeld in [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel3
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: 16.2.e
    text: een raming van de totale kosten en de verdeling daarvan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: '16.3'
    text: 'In het plan van voorzieningen kunnen worden opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.3.a
    text: wijzigingen in het stelsel van wegen, waterlopen, dijken en kaden met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.3.b
    text: veiligstelling en ontwikkeling van natuurgebieden en landschappelijke, recreatieve en cultuurhistorische elementen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.3.c
    text: de uitvoering van andere werken in het belang van de herinrichting.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: '16.4'
    text: 'Op de kaarten worden zo nauwkeurig mogelijk aangegeven:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.4.a
    text: de begrenzing van het deelgebied;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.4.b
    text: de begrenzing van de te herverkavelen blokken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.4.c
    text: de te handhaven natuurgebieden en landschappelijke en cultuurhistorische elementen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.4.d
    text: 'de in het derde lid bedoelde voorzieningen, onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: 16.4.d.1
    text: |-
      voorzieningen voor de verwezenlijking waarvan [hoofdstuk II][ref1] zal worden toegepast;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003143
        hoofdstuk: II
  - number: 16.4.d.2
    text: |-
      voorzieningen voor de verwezenlijking waarvan [artikel 55, tweede lid][ref1], zal worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
  - number: '16.5'
    text: |-
      Voor zover in het deelgebied stadsmeierrechten voorkomen, rustend op onroerende zaken die niet deel uitmaken van
      een blok, houdt het herinrichtingsplan mede in de aanwijzing door de herinrichtingscommissie van een blok op de
      lijst van rechthebbenden waarvan de gerechtigden tot deze stadsmeierrechten worden vermeld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: '16.6'
    text: |-
      In afwijking van het bepaalde in [artikel 3, tweede lid, onder ][ref1], vindt in gebieden, waarin ten tijde
      van de verzending, bedoeld in het zevende lid, een ruilverkaveling uit kracht van de wet in uitvoering is, geen
      herverkaveling plaats; de herinrichtingscommissie kan in het herinrichtingsplan aangeven, dat in andere dan de in
      de eerste zin bedoelde gebieden geen herverkaveling zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel3
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '3'
        hoofdstuk: I
        afdeling: '2'
  - number: '16.7'
    text: De herinrichtingscommissie zendt het in het eerste lid bedoelde voorontwerp aan de centrale commissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel16
  - number: '17.1'
    text: De centrale commissie stelt het herinrichtingsplan in ontwerp vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel17
  - number: '17.2'
    text: |-
      De centrale commissie zendt het herinrichtingsplan, zoals dit door haar in ontwerp is vastgesteld, aan gedeputeerde
      staten van de provincie, waarin het betrokken deelgebied of het grootste gedeelte daarvan is gelegen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel17
  - number: '18.1'
    text: |-
      Gedeputeerde staten leggen een afschrift van het ontwerp en de daarbij behorende kaarten gedurende een maand ter
      kosteloze inzage van een ieder neder ter provinciale griffie en ter secretarie van de gemeenten, welke geheel of
      gedeeltelijk gelegen zijn in het gebied, waarop het herinrichtingsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel18
  - number: '18.2'
    text: |-
      Gedeputeerde staten doen van de nederlegging tevoren openbare kennisgeving in de *Staatscourant*, in tenminste twee
      dagbladen die in de streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel18
  - number: '18.3'
    text: |-
      Indien het gebied, waarop het herinrichtingsplan betrekking heeft, zowel in de provincie Groningen als in de
      provincie Drenthe is gelegen, zijn het eerste en tweede lid van toepassing met dien verstande, dat in plaats van
      "gedeputeerde staten" wordt gelezen: gedeputeerde staten van Groningen en van Drenthe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel18
  - number: '19.1'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag, waarop de in [artikel 18, eerste lid][ref1], bedoelde stukken ter
      inzage hebben gelegen, kan een ieder zijn bedenkingen schriftelijk bij provinciale staten naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel18
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '19.2'
    text: |-
      Deze bevoegdheid wordt in de kennisgeving bedoeld in [artikel 18, tweede lid][ref1], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel18
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '20.1'
    text: |-
      Provinciale staten stellen het herinrichtingsplan of een gedeelte hiervan vast, waarbij zij zodanig acht slaan op
      de naar voren gebrachte bedenkingen als zij menen te moeten doen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
  - number: '20.2'
    text: |-
      Indien provinciale staten voornemens zijn af te wijken van het ontwerp, bedoeld in [artikel 17][ref1], winnen zij
      advies in bij de centrale commissie. Vaststelling in afwijking van dit advies geschiedt niet dan nadat Onze in
      [artikel 4][ref2] genoemde Ministers daarin hebben toegestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel4
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '4'
        hoofdstuk: I
        afdeling: '3'
  - number: '20.3'
    text: De toestemming, bedoeld in het tweede lid, kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
  - number: '20.4'
    text: |-
      Voor zover het deelgebied, waarop het herinrichtingsplan betrekking heeft, in meer dan één provincie is gelegen,
      nemen provinciale staten het besluit tot vaststelling niet dan in overeenstemming met provinciale staten van die
      andere provincie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
  - number: '20.5'
    text: |-
      Indien in het in het derde lid bedoelde geval provinciale staten van Groningen en van Drenthe niet tot
      overeenstemming kunnen komen, wordt het herinrichtingsplan vastgesteld bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
  - number: '20.6'
    text: |-
      Gedeputeerde staten delen het standpunt van provinciale staten naar aanleiding van de naar voren gebrachte
      bedenkingen schriftelijk en met redenen omkleed aan de belanghebbende mede, uiterlijk dertig dagen nadat
      provinciale staten het in het eerste lid bedoelde besluit tot vaststelling hebben genomen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
  - number: '20.7'
    text: |-
      [Artikel 13, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel13
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '21.1'
    text: |-
      Het herinrichtingsplan of een gedeelte hiervan kan worden gewijzigd tot het tijdstip waarop het in
      [artikel 72, eerste lid][ref1], bedoelde besluit wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel72
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '72'
        hoofdstuk: III
        afdeling: '8'
  - number: '21.2'
    text: |-
      De [artikelen 16-20][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '22.1'
    text: |-
      Bij het herinrichtingsplan kan worden bepaald, dat, indien het belang der herverkaveling zulks vordert,
      gedeputeerde staten bevoegd zijn op voorstel van de herinrichtingscommissie, met instemming van Onze
      Minister en met inachtneming van in het plan vervatte regelen het herinrichtingsplan uit te werken en de in
      [artikel 16, derde lid onder ][ref1], bedoelde voorzieningen uit te breiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde uitwerking, onderscheidenlijk uitbreiding, wordt geacht deel uit te maken van het
      herinrichtingsplan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.3'
    text: |-
      Alvorens de uitwerking, onderscheidenlijk de uitbreiding, bedoeld in het eerste lid, vast te stellen, leggen
      gedeputeerde staten een afschrift van het ontwerp daartoe gedurende veertien dagen ter kosteloze inzage van een
      ieder neder ter provinciale griffie en ter secretarie van de gemeenten, welke geheel of gedeeltelijk gelegen zijn
      in het gebied, waarop het herinrichtingsplan betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.4'
    text: |-
      Van de nederlegging geschiedt openbare kennisgeving op de wijze in [artikel 18, tweede lid][ref1], voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel18
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '22.5'
    text: |-
      Indien het gebied, waarop het uit te werken dan wel uit te breiden herinrichtingsplan betrekking heeft, zowel in
      de provincie Groningen als in de provincie Drenthe is gelegen, zijn het derde en vierde lid van toepassing met dien
      verstande, dat in plaats van "gedeputeerde staten" wordt gelezen: gedeputeerde staten van Groningen en van Drenthe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.6'
    text: |-
      Belanghebbenden kunnen hun bedenkingen binnen dertig dagen na de in het vierde lid bedoelde openbare kennisgeving
      schriftelijk bij gedeputeerde staten naar voren brengen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.7'
    text: |-
      Gedeputeerde staten stellen het plan tot uitwerking dan wel uitbreiding vast, waarbij zij zodanig acht slaan op de
      naar voren gebrachte bedenkingen als zij menen te moeten doen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.8'
    text: |-
      Indien in het in het vijfde lid bedoelde geval gedeputeerde staten van Groningen en van Drenthe niet tot
      overeenstemming kunnen komen, wordt het plan tot uitwerking dan wel uitbreiding vastgesteld bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.9'
    text: |-
      Gedeputeerde staten delen hun standpunt naar aanleiding van de op grond van het zesde lid naar voren gebrachte
      bedenkingen schriftelijk en met redenen omkleed aan belanghebbenden mede.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
  - number: '22.10'
    text: |-
      [Artikel 13, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel13
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '23.1'
    text: |-
      Wanneer de herinrichtingscommissie het ten behoeve van de voorbereiding van het herinrichtingsprogramma of van
      een herinrichtingsplan nodig acht, dat op iemands grond gravingen of opmetingen worden verricht of tekens gesteld,
      moet hij, die de eigendom van de grond heeft of hij, aan wie een beperkt recht toebehoort, waaraan de grond is
      onderworpen dan wel de gebruiker van de grond dit gedogen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel23
  - number: '23.2'
    text: |-
      De burgemeester is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de in het eerste lid
      bedoelde gedoogplicht.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel23
  - number: '23.3'
    text: |-
      De schade, welke uit de toepassing van het eerste lid mocht voortvloeien, wordt uit ’s Rijks kas betaald. Het
      verzoek om schadevergoeding wordt ingediend bij de herinrichtingscommissie. Bij geschil over het beloop der schade
      wordt dit op verzoek van de meest gerede partij, nadat de wederpartij de gelegenheid heeft gehad haar belangen te
      verdedigen, door de kantonrechter bij beschikking vastgesteld. Tegen de uitspraak staat geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel23
  - number: '24.1'
    text: |-
      Nadat een herinrichtingsplan is vastgesteld, mogen eigenaren en gebruiksgerechtigden van tot het blok behorende
      onroerende zaken geen handelingen verrichten noch die handelingen, welke door een normale bedrijfsvoering worden
      geëist, achterwege laten, indien daardoor de waarde van hun onroerende zaken zou veranderen, tenzij hun daartoe
      door de herinrichtingscommissie toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel24
  - number: '24.2'
    text: Overtreding van het bepaalde in het vorige lid wordt gestraft met geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel24
  - number: '24.3'
    text: Het strafbare feit wordt als een overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel24
  - number: '25'
    text: |-
      Waardevermeerdering van tot een blok behorende onroerende zaken, ontstaan nadat het herinrichtingsplan is
      vastgesteld, behoeft niet te worden vergoed tenzij deze waardevermeerdering het gevolg is van handelingen, waarvoor
      de herinrichtingscommissie toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel25
  - number: '26'
    text: |-
      Aan een werknemer wordt door de herinrichtingscommissie uit ’s Rijks kas een geldelijke bijdrage verleend, in door
      Onze Minister te bepalen gevallen en volgens door hem te stellen regelen, indien het bedrijf waarin de werknemer
      werkzaam is ten gevolge van de toepassing van [hoofdstuk II][ref1] of [artikel 58][ref2] wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel58
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003143
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '58'
        hoofdstuk: III
        afdeling: '5'
  - number: '27'
    text: |-
      Indien en voor zover voor de doeleinden van de herinrichting beperkingen aan de uitoefening van de landbouw worden
      gesteld, kan op voorstel van de herinrichtingscommissie Onze Minister volgens door hem in overeenstemming met Onze
      Ministers van Cultuur, Recreatie en Maatschappelijk Werk en van Volkshuisvesting en Ruimtelijke Ordening te stellen
      regelen subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel27
  - number: '28.1'
    text: |-
      Zodra provinciale staten een herinrichtingsplan of een gedeelte hiervan hebben vastgesteld, kan de
      herinrichtingscommissie de uitvoering hiervan ter hand nemen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.2'
    text: |-
      Gedeputeerde staten kunnen in overeenstemming met de herinrichtingscommissie bepalen, dat met name genoemde werken
      worden uitgevoerd door de door hen aan te wijzen openbare lichamen of andere rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      Op de terreinen kunnen tekens worden gesteld en kan houtgewas worden geplant en gekapt; zoden, aarde, grind en
      andere specie kunnen aan de terreinen worden onttrokken of daarop worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.4'
    text: |-
      Gronden kunnen worden drooggelegd, ontgonnen, herontgonnen, begreppeld of gedraineerd, ontwikkeld tot
      natuurterrein, tijdelijk geëxploiteerd en tijdelijk in gebruik gegeven, in welk laatste geval de ter zake van pacht
      geldende wettelijke bepalingen niet toepasselijk zijn.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.5'
    text: |-
      Opstallen kunnen worden afgebroken, verbouwd, verplaatst, gebouwd of herbouwd, indien naar het oordeel der
      herinrichtingscommissie het belang der herinrichting zulks vordert.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.6'
    text: |-
      Hij die de eigendom heeft van een onroerende zaak of hij, aan wie een beperkt recht toebehoort, waaraan
      een onroerende zaak is onderworpen dan wel de gebruiker van een onroerende zaak, moet gedogen, dat het
      bepaalde in de voorgaande leden wordt uitgevoerd en dat daartoe zijn gebouwen en terreinen worden betreden.
      [Artikel 23, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel23
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '23'
        hoofdstuk: III
        afdeling: '2'
  - number: '28.7'
    text: |-
      De schade, welke uit de toepassing van de vorige leden mocht voortvloeien, wordt uit ’s Rijks kas betaald. Het
      verzoek om schadevergoeding wordt ingediend bij de herinrichtingscommissie. Bij geschil over het beloop der schade
      wordt dit op verzoek van de meest gerede partij, nadat de wederpartij de gelegenheid heeft gehad haar belangen
      te verdedigen, door de arrondissementsrechtbank bij beschikking vastgesteld. Tegen de uitspraak staat geen
      rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.8'
    text: |-
      Aan de belanghebbende, bedoeld in het zesde lid, wordt op zijn verzoek een voorschot op de schadevergoeding
      toegekend. Het bedrag van het voorschot wordt op verzoek van de belanghebbende door de rechter-commissaris
      vastgesteld, gehoord de herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.9'
    text: |-
      De uitvoering der werken, bedoeld in de leden 1-5 mag niet ter hand worden genomen, alvorens door de zorg van de
      herinrichtingscommissie een beschrijving is gemaakt van de betrokken onroerende zaak, waarvan de toestand tevens
      moet zijn vastgelegd door middel van tekeningen, foto’s of andere daartoe geschikte middelen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
  - number: '28.10'
    text: |-
      Met uitzondering van de ontgrondingen, welke geschieden ter verkrijging van het voor de werken nodige
      bodemmateriaal, zijn de bepalingen van de [Ontgrondingenwet][ref1] niet van toepassing op de uitvoering van het
      herinrichtingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0002505
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002505
  - number: '30.1'
    text: |-
      De herinrichtingscommissie stelt voor elk blok een zo volledig mogelijke lijst samen van de rechthebbenden, met de
      omschrijving van de aard en de omvang van ieders recht.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel30
  - number: '30.2'
    text: |-
      Ten aanzien van een natuurlijk persoon, die gerechtigde is tot een stadsmeierrecht, houdt de in het eerste lid
      bedoelde omschrijving mede in de hoegrootheid van de jaarlijkse vaste huur of pacht of de vermelding dat het
      gebruik gratis is.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel30
  - number: '30.3'
    text: |-
      Ten aanzien van een rechtspersoon, die gerechtigde is tot een stadsmeierrecht, houdt de in het eerste lid bedoelde
      omschrijving mede in:
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel30
  - number: 30.3.a
    text: of de 20e of 30e penning, dan wel een andere of geen vergoeding bij overgang is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel30
  - number: 30.3.b
    text: de eerstvolgende vaste vervaldag van het overgangsrecht.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel30
  - number: '31'
    text: |-
      Voor zover in een deelgebied stadsmeierrechten voorkomen, rustend op onroerende zaken die niet deel uitmaken
      van een blok, vermeldt de herinrichtingscommissie op de lijst van rechthebbenden van het daartoe ingevolge
      [artikel 16, vijfde lid][ref1], aangewezen blok alle gerechtigden tot op zodanige onroerende zaken rustende
      stadsmeierrechten. [Artikel 30, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel30
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '30'
        hoofdstuk: III
        afdeling: '4'
  - number: '32.1'
    text: |-
      De herinrichtingscommissie benoemt de schatters, die onder haar leiding de waarde van de in een blok gelegen
      onroerende zaken zullen schatten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel32
  - number: '32.2'
    text: De herinrichtingscommissie verdeelt het werk der schatters; deze treden steeds in oneven getale op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel32
  - number: '33.1'
    text: |-
      Bij regeling van Onze Minister wordt het stelsel van classificatie vastgesteld, waarbij regels worden gesteld
      betreffende de classificatie van de grond, de waarde per hectare binnen elke klasse, welke als grondslag voor
      de toedeling zal dienen, alsmede de grondslagen voor de bepaling van de verandering in waarde als gevolg van de
      herinrichting. Andere dan agrarische factoren blijven bij de schatting buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel33
  - number: '33.2'
    text: De schatters delen de grond aan de hand van het stelsel van classificatie in klassen in.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel33
  - number: '34.1'
    text: |-
      De door de herinrichtingscommissie samengestelde lijst van rechthebbenden, een register van uitkomsten der
      schattingen en een kaart, waarop de klassengrenzen staan aangegeven, worden door de herinrichtingscommissie
      gedurende een maand voor een ieder ter kosteloze inzage gelegd op een door de herinrichtingscommissie te bepalen
      plaats.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel34
  - number: '34.2'
    text: |-
      Van de nederlegging geschiedt tevoren openbare kennisgeving door de herinrichtingscommissie in tenminste twee
      dagbladen die in de streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze, alsmede bijzondere
      kennisgeving bij aangetekende brief aan de bekende belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel34
  - number: '34.3'
    text: De kennisgeving houdt mededeling in van de bevoegdheid tot het indienen van bezwaren.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel34
  - number: '34.4'
    text: Op het niet-ontvangen zijn van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel34
  - number: '34.5'
    text: De lijst van rechthebbenden wordt in haar geheel of in uittreksel tegen betaling der kosten verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel34
  - number: '35'
    text: |-
      Na de nederlegging, bedoeld in [artikel 34, eerste lid][ref1], kunnen de grenzen van een blok niet meer worden
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel34
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '34'
        hoofdstuk: III
        afdeling: '4'
  - number: '36.1'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag, waarop de in [artikel 34][ref1] bedoelde stukken ter inzage hebben
      gelegen, kan iedere belanghebbende zijn bezwaren tegen de toekenning en omschrijving van rechten op de lijst van
      rechthebbenden en tegen de schatting schriftelijk bij de herinrichtingscommissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel34
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '34'
        hoofdstuk: III
        afdeling: '4'
  - number: '36.2'
    text: |-
      Na verloop van de in het eerste lid bepaalde termijn kunnen slechts zij als rechthebbenden worden erkend, die
      voorkomen op de lijst van rechthebbenden of die tegen de daarop voorkomende toekenning of omschrijving van rechten
      bezwaren hebben ingediend of hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel36
  - number: '37'
    text: |-
      Voor zover daartegen binnen de termijn en op de wijze in [artikel 36][ref1] bepaald geen bezwaren zijn ingediend,
      staan de rechten, zoals zij op de lijst van rechthebbenden zijn omschreven en toegekend, en de uitkomsten van de
      schattingen vast. Daarvan maakt de herinrichtingscommissie proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel36
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '36'
        hoofdstuk: III
        afdeling: '4'
  - number: '38.1'
    text: |-
      Indien binnen de termijn en op de wijze in [artikel 36][ref1] bepaald bezwaren zijn ingediend, onderzoekt de
      herinrichtingscommissie de bezwaren en tracht zij overeenstemming te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel36
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '36'
        hoofdstuk: III
        afdeling: '4'
  - number: '38.2'
    text: |-
      Voor zover overeenstemming is verkregen, vinden de bepalingen van [artikel 37][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel37
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '37'
        hoofdstuk: III
        afdeling: '4'
  - number: '39'
    text: |-
      Voor zover geen overeenstemming is verkregen of voor zover de herinrichtingscommissie van oordeel is, dat de
      bezwaren niet tijdig zijn ingediend, maakt zij omtrent die bezwaren en het daaromtrent verhandelde proces-verbaal
      op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel39
  - number: '40'
    text: |-
      De herinrichtingscommissie zendt zo spoedig mogelijk een afschrift van de lijst van rechthebbenden,
      van het register van uitkomsten der schattingen, van de ingediende bezwaarschriften en van de krachtens
      de[ artikelen 37][ref1], [38][ref2] en [39][ref3] opgemaakte processen-verbaal aan de rechter-commissaris van de
      arrondissementsrechtbank binnen welker rechtsgebied het blok of het grootste gedeelte daarvan is gelegen en aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel39
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '37'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '38'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '39'
        hoofdstuk: III
        afdeling: '4'
  - number: '41.1'
    text: |-
      Indien geen overeenstemming is verkregen, bepaalt de rechter-commissaris terstond tijd en plaats der bijeenkomst,
      waarop de belanghebbenden bij de in het proces-verbaal vermelde bezwaren voor hem kunnen verschijnen. De rechter-
      commissaris doet hiervan mededeling aan de herinrichtingscommissie en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel41
  - number: '41.2'
    text: |-
      Zij, die bezwaren hebben ingediend, en de op de lijst van rechthebbenden voorkomende bekende belanghebbenden bij
      die bezwaren worden door de rechter-commissaris bij aangetekende brief opgeroepen om in persoon of bij schriftelijk
      gemachtigde de bijeenkomst bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel41
  - number: '41.3'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg door de wet aan het niet-bijwonen der bijeenkomst en
      aan het vaststellen van de lijst van rechthebbenden verbonden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel41
  - number: '41.4'
    text: |-
      De bijeenkomst wordt niet gehouden dan nadat tenminste veertien dagen na het verzenden der oproepingen zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel41
  - number: '41.5'
    text: Op het niet-ontvangen zijn van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel41
  - number: '42.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de griffier der arrondissementsrechtbank.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.2'
    text: |-
      De bijeenkomst wordt bijgewoond door een vertegenwoordiger van Onze Minister, één of meer vertegenwoordigers van de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de rechter-commissaris de bijeenkomst zonder dat
      een nadere oproeping zal worden gezonden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.4'
    text: |-
      Tijdens de bijeenkomst worden eerst de toekenningen en de vaststelling van de rechten en daarna de schattingen
      behandeld. Van het verhandelde omtrent elk van beide onderwerpen maakt de rechter-commissaris een afzonderlijk
      proces-verbaal op waarvan hij afschrift zendt aan de herinrichtingscommissie en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.5'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde op de bijeenkomst aanwezig zijn, wanneer hun bezwaren
      behandeld worden, worden geacht die bezwaren te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.6'
    text: |-
      Het vijfde lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet-verschijnen op de bijeenkomst verklaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '42.7'
    text: |-
      Indien de rechter-commissaris het beroep op overmacht gegrond acht, stelt hij een nadere dag van de behandeling van
      de bezwaren vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel42
  - number: '43.1'
    text: |-
      Voor zover omtrent de toekenning, de aard en de omvang der rechten overeenstemming is verkregen, dan wel het in het
      vijfde lid van het vorige artikel bedoelde geval zich voordoet, staan de rechten vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel43
  - number: '43.2'
    text: |-
      Partijen tussen wie geen overeenstemming is verkregen worden, voor zover haar geschil niet reeds aanhangig is,
      door de rechter-commissaris naar een door hem te bepalen zitting van de arrondissementsrechtbank verwezen. Deze
      verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel43
  - number: '44.1'
    text: Voor zover overeenstemming is verkregen omtrent de schattingen, staan deze vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel44
  - number: '44.2'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een nader te bepalen zitting
      van de arrondissementsrechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel44
  - number: '44.3'
    text: |-
      De arrondissementsrechtbank behandelt de zaken betreffende de toekenning en de vaststelling van de rechten en de
      schattingen vóór elke andere met uitzondering van die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel44
  - number: '45.1'
    text: |-
      Op de dienende dag geven zij, wier zaken ingevolge het bepaalde in [artikel 43, tweede lid][ref1], verwezen zijn,
      de gronden hunner beweringen en de middelen tot staving daarvan op bij conclusie, door een advocaat getekend.
      Afschrift der conclusie wordt ter terechtzitting aan de advocaat der wederpartij gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel43
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '43'
        hoofdstuk: III
        afdeling: '4'
  - number: '45.2'
    text: |-
      Op een uiterlijk veertien dagen hierna te stellen, door de arrondissementsrechtbank te bepalen, dag kunnen partijen
      haar conclusies bij pleidooi door een advocaat doen toelichten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel45
  - number: '46.1'
    text: |-
      Uiterlijk dertig dagen na de dienende dag of, indien een dag voor pleidooi werd vastgesteld, na de daarvoor
      bepaalde dag, doet de arrondissementsrechtbank uitspraak over de rechten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel46
  - number: '46.2'
    text: Tegen de uitspraak staat behalve cassatie geen rechtsmiddel open.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel46
  - number: '47.1'
    text: |-
      Met betrekking tot het rechtsmiddel van cassatie zijn de [artikelen 52][ref1] en [53 der onteigeningswet][ref2]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel53
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '53'
  - number: '47.2'
    text: De Hoge Raad zendt een afschrift van de uitspraak aan de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel47
  - number: '48'
    text: |-
      Zodra omtrent alle geschillen over de rechten betreffende de in het blok gelegen onroerende zaken onherroepelijk is
      beslist, wordt de lijst van rechthebbenden door de arrondissementsrechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel48
  - number: '49'
    text: |-
      Nadat alle rechten betreffende de bij de herverkaveling betrokken onroerende zaken zijn komen vast te staan,
      worden zij met wie geen overeenstemming omtrent de schattingen is verkregen, Onze Minister, alsmede de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger door de
      griffier der arrondissementsrechtbank opgeroepen om te verschijnen op een door de arrondissementsrechtbank bepaalde
      zitting.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel49
  - number: '50.1'
    text: |-
      Op de dienende dag lichten zij, wier zaken ingevolge het bepaalde in [artikel 44, tweede lid][ref1], verwezen zijn,
      hun standpunt hetzij in persoon, hetzij bij schriftelijk gemachtigde mondeling toe.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel44
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '44'
        hoofdstuk: III
        afdeling: '4'
  - number: '50.2'
    text: |-
      De arrondissementsrechtbank hoort de vertegenwoordiger van Onze Minister, de vertegenwoordigers van de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel50
  - number: '50.3'
    text: Uiterlijk dertig dagen na het horen doet de arrondissementsrechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel50
  - number: '50.4'
    text: |-
      Indien deze uitspraak van invloed is op de uitkomsten van andere schattingen, is de arrondissementsrechtbank
      bevoegd die uitkomsten te wijzigen na de bij de wijziging betrokken belanghebbenden daarover te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel50
  - number: '50.5'
    text: Het register van de uitkomsten der schattingen wordt door de arrondissementsrechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel50
  - number: '51'
    text: |-
      Tegen de uitspraak van de arrondissementsrechtbank staat geen rechtsmiddel open, onverminderd de bevoegdheid van de
      procureur-generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel51
  - number: '52.1'
    text: |-
      Voor een geding, voortvloeiende uit een verwijzing door de rechter-commissaris als bedoeld in
      [artikel 43, tweede lid][ref1], en in [artikel 44, tweede lid][ref2], is alleen door de belanghebbende, met
      wie geen overeenstemming is verkregen, vast recht als bedoeld in de [Wet tarieven in burgerlijke zaken][ref3]
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '43'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '44'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0001852
  - number: '52.2'
    text: |-
      De kosten van het geding als bedoeld in het eerste lid komen ten laste van de belanghebbende met wie geen
      overeenstemming is verkregen, indien deze in het ongelijk is gesteld, ten laste van de staat, indien hij in het
      gelijk wordt gesteld. Indien de rechter daartoe termen vindt in de omstandigheden van het geding, kan hij de kosten
      geheel of voor een deel compenseren.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel52
  - number: '53'
    text: |-
      Zodra de lijst van rechthebbenden en het register van de uitkomsten der schattingen zijn gesloten, geeft de
      rechter-commissaris hiervan kennis aan de herinrichtingscommissie; hij zendt een afschrift van de lijst van
      rechthebbenden aan de herinrichtingscommissie en aan de het desbetreffende kantoor van de Dienst voor het kadaster
      en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel53
  - number: '54.1'
    text: 'Geen wijziging wordt gebracht in het recht van de eigenaar en in de gebruikstoestand ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: 54.1.a
    text: |-
      begraafplaatsen, crematoria en bewaarplaatsen als bedoeld in onderscheidenlijk de [artikelen 23][ref1], [49][ref2]
      en [60, eerste lid, onder c, van de Wet op de lijkbezorging][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel60
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '60'
  - number: 54.1.b
    text: |-
      gesloten begraafplaatsen dan wel graven of grafkelders als bedoeld in
      [artikel 85 van de Wet op de lijkbezorging][ref1], binnen de termijnen en anders dan op de wijze, omschreven in
      [artikel 46, tweede lid en derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel46
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '46'
  - number: '54.2'
    text: |-
      Zonder toestemming van Onze Minister van Defensie wordt geen wijziging gebracht in de rechten en de
      gebruikstoestand ten aanzien van onroerende zaken, welke een militaire bestemming hebben.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: '54.3'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] wordt zonder toestemming van de eigenaar geen
      wijziging gebracht in diens recht ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003143#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003143
        hoofdstuk: II
  - number: 54.3.a
    text: gebouwen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: 54.3.b
    text: parken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: 54.3.c
    text: gedenktekenen met bijbehorende terreinen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: 54.3.d
    text: |-
      onroerende zaken van rechtspersonen, die bevordering van natuurschoon ten doel hebben of die deze zaken in stand
      houden om hun natuurwetenschappelijke waarde, indien en zolang zij als zodanig door Ons erkend zijn.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: '54.4'
    text: |-
      De herinrichtingscommissie kan in overeenstemming met gedeputeerde staten van de provincie, waarin de onroerende
      zaak is gelegen, afwijken van het bepaalde in het derde lid in het belang van de totstandkoming van een doelmatige
      herinrichting.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel54
  - number: '55.1'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] heeft iedere eigenaar aanspraak op het
      verkrijgen van een recht van dezelfde aard als hij had op in een blok gelegen onroerende zaken op de voet van het
      in de volgende leden bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003143
        hoofdstuk: II
  - number: '55.2'
    text: |-
      De totale waarde van alle in een blok gelegen onroerende zaken wordt tot een maximum van drie procent verminderd
      met de waarde der onroerende zaken benodigd voor de in het belang der herverkaveling noodzakelijke openbare
      wegen en waterlopen, alsmede met de waarde der onroerende zaken benodigd voor de aanleg van de met die wegen en
      waterlopen samenhangende voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel55
  - number: '55.3'
    text: |-
      De aan een eigenaar toe te delen waarde in kavels staat tot de na toepassing van het tweede lid verkregen totale
      waarde als de waarde van zijn in een blok gelegen onroerende zaken tot de waarde van alle in dat blok gelegen
      onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel55
  - number: '55.4'
    text: |-
      Van de bepaling van het derde lid mag worden afgeweken, indien zij de totstandkoming van een behoorlijke
      herverkaveling in de weg zou staan. Deze afwijking mag, tegen de wil van de eigenaar en van degene die op de
      onroerende zaak een recht van hypotheek of van grondrente heeft, niet meer bedragen dan vijf procent van de waarde,
      waarop de eigenaar ingevolge het derde lid aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel55
  - number: '56'
    text: |-
      Onder waarde wordt in [artikel 55][ref1] verstaan de waarde bedoeld in [artikel 33, eerste lid][ref2], zoals deze
      op grond van de schatting is komen vast te staan. Indien evenwel tengevolge van de in [artikel 28][ref3] genoemde
      werkzaamheden een waardeverandering ontstaat, kan de herinrichtingscommissie hiermede bij de toedeling rekening
      houden. Op verzoek van de eigenaar vindt echter verrekening in geld plaats op grondslag van die waardeverandering,
      voor zover het belang van de herinrichting zich hiertegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel28
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '33'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '28'
        hoofdstuk: III
        afdeling: '3'
  - number: '57'
    text: |-
      Het verschil tussen de waarde der van de eigenaar in een blok gelegen onroerende zaken en de waarde van de
      hem toegedeelde onroerende zaken, zoals deze overeenkomstig [artikel 107][ref1] is vastgesteld, wordt in geld
      verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel107
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '107'
        hoofdstuk: III
        afdeling: '12'
  - number: '58.1'
    text: |-
      De herinrichtingscommissie is, nadat Onze Minister daarin heeft toegestemd, bevoegd te bepalen dat een eigenaar, in
      afwijking van het bepaalde in [artikel 55][ref1], algehele vergoeding in geld zal ontvangen, wanneer de waarde van
      de van hem in een blok gelegen onroerende zaken zo gering is, dat de toepassing van [artikel 55][ref2] zou leiden
      tot de vorming van een niet behoorlijk te exploiteren kavel en hij geen redelijk belang heeft bij het verkrijgen
      van een zodanige kavel.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel55
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
  - number: '58.2'
    text: De toestemming, bedoeld in het eerste lid, kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
  - number: '58.3'
    text: |-
      De eigenaar, die zulks vóór een door Onze Minister te bepalen tijdstip schriftelijk aan de herinrichtingscommissie
      verzoekt, ontvangt, in afwijking van het bepaalde in [artikel 55][ref1], algehele vergoeding in geld.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
  - number: '58.4'
    text: |-
      De herinrichtingscommissie maakt het in het tweede lid bedoelde tijdstip bekend in de Staatscourant, in tenminste
      twee dagbladen die in de streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
  - number: '58.5'
    text: |-
      Zodra de lijst van rechthebbenden te zijnen aanzien vaststaat, ontvangt de in het tweede lid bedoelde eigenaar,
      die schriftelijk afstand heeft gedaan van het gebruik van de hem toebehorende onroerende zaak, op zijn verzoek een
      voorschot op de algehele vergoeding in geld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
  - number: '58.6'
    text: |-
      Het bedrag van het voorschot wordt op verzoek van de eigenaar door de rechter-commissaris vastgesteld, gehoord
      de herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel58
  - number: '59'
    text: 'Elke kavel moet zo worden gevormd, dat hij:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel59
  - number: '59.1'
    text: uitweg heeft op een openbare land- of waterweg en zo mogelijk daaraan belendt;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel59
  - number: '59.2'
    text: zo nodig en mogelijk de gelegenheid tot behoorlijke afwatering en watervoorziening heeft.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel59
  - number: '60'
    text: |-
      In afwijking van het bepaalde in [artikel 55, eerste lid][ref1], verliest de gemeente Groningen de bezwaarde
      eigendom van de van een blok deel uitmakende onroerende zaken, waarop een stadsmeierrecht rust, en wordt
      dat stadsmeierrecht opgeheven en voor de toepassing van [artikel 55, tweede tot en met vierde lid][ref2],
      en de [artikelen 56-59][ref3] vervangen door een recht van eigendom ten gunste van de gerechtigden tot het
      stadsmeierrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel56
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '56'
        hoofdstuk: III
        afdeling: '5'
  - number: '61.1'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] heeft iedere pachter van in een blok gelegen
      onroerende zaken recht op het in pacht verkrijgen van een waarde in kavels naar dezelfde maatstaven als in
      [artikel 55][ref2] voor de toedeling in eigendom bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel55
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003143
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
  - number: '61.2'
    text: |-
      De herinrichtingscommissie kan een bestaande pachtverhouding opheffen en een nieuwe pachtverhouding vestigen in
      dier voege, dat aan een verpachter een pachter uit de in het eerste lid bedoelde pachters kan worden toegewezen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel61
  - number: '61.3'
    text: |-
      De herinrichtingscommissie bepaalt tot welk tijdstip de uit een nieuw gevestigde pachtverhouding voortvloeiende
      pachtovereenkomst zal gelden en of deze overeenkomst, indien zij voor kortere dan de wettelijke duur zal gelden,
      voor verlenging vatbaar zal zijn. Zij draagt daarbij zorg, dat de pachter en de verpachter, wat het einde en de
      verlengbaarheid der overeenkomst betreft, zoveel mogelijk dezelfde aanspraken behouden als zij aan de opgeheven
      pachtverhouding konden ontlenen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel61
  - number: '61.4'
    text: |-
      Het bepaalde in [artikel 58][ref1] is ten aanzien van de pachter van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel58
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '58'
        hoofdstuk: III
        afdeling: '5'
  - number: '62.1'
    text: |-
      Op het recht, bedoeld in [het eerste en vierde lid van artikel 61][ref1], kan de pachter slechts aanspraak maken,
      indien de pachtovereenkomst aan de herinrichtingscommissie ter registratie is ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '62.2'
    text: |-
      De inzending ter registratie dient plaats te vinden binnen dertig dagen na een door de herinrichtingscommissie te
      bepalen tijdstip of, indien de pachtovereenkomst na deze dag is aangegaan, binnen dertig dagen na het aangaan van
      de overeenkomst, doch uiterlijk tot een door de herinrichtingscommissie vast te stellen tijdstip. Deze tijdstippen
      worden ter openbare kennis gebracht in tenminste twee dagbladen die in de streek worden verspreid en in de
      gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel62
  - number: '62.3'
    text: Van de registratie wordt door de herinrichtingscommissie een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel62
  - number: '63.1'
    text: |-
      De herinrichtingscommissie zendt aan de wederpartij van degene, die een pachtovereenkomst ter registratie heeft
      ingezonden, bij aangetekende brief bericht van de inzending ter registratie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel63
  - number: '63.2'
    text: |-
      De wederpartij kan zijn bezwaren tegen de registratie binnen veertien dagen na de dagtekening van de in het vorige
      lid bedoelde brief schriftelijk aan de herinrichtingscommissie kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel63
  - number: '64.1'
    text: |-
      Indien overeenkomstig het bepaalde in het [tweede lid van artikel 63][ref1] bezwaren kenbaar zijn gemaakt, stelt
      de herinrichtingscommissie, onder vastlegging van die bezwaren, bij aangetekende brief partijen ervan in kennis,
      dat binnen dertig dagen na de dagtekening van deze brief bij de herinrichtingscommissie dient te worden ingezonden,
      hetzij een door beide partijen ondertekende akte, waaruit blijkt dat overeenstemming is verkregen, hetzij een
      gewaarmerkt afschrift van het verzoekschrift, waarbij de meest gerede partij de beslissing van de pachtkamer van de
      rechtbank heeft ingeroepen. De waarmerking van het afschrift geschiedt door de griffier van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel63
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '63'
        hoofdstuk: III
        afdeling: '6'
  - number: '64.2'
    text: |-
      Indien de herinrichtingscommissie bevindt, dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      [artikel 318, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht is genomen, draagt zij voor
      zover nodig partijen bij aangetekende brief op de beslissing van de grondkamer in te roepen en binnen dertig
      dagen na de dagtekening van deze brief een door de secretaris van de grondkamer gewaarmerkt afschrift van het
      verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel318
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '318'
  - number: '64.3'
    text: |-
      Indien de herinrichtingscommissie bevindt, dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      [artikel 317, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht is genomen, draagt zij voor
      zover nodig partijen bij aangetekende brief op de beslissing van de pachtkamer van de rechtbank in te roepen en
      binnen dertig dagen na de dagtekening van deze brief een door de griffier van de rechtbank gewaarmerkt afschrift
      van het verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel317
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '317'
  - number: '64.4'
    text: |-
      Indien aan het bepaalde in de vorige leden geen gevolg is gegeven, is de herinrichtingscommissie bevoegd met het
      bestaan der pachtovereenkomst geen rekening te houden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel64
  - number: '64.5'
    text: |-
      De grondkamer en de pachtkamer van de rechtbank en in beroep de Centrale Grondkamer en de pachtkamer van het
      Gerechtshof te Arnhem behandelen de verzoeken en vorderingen, bedoeld in deze wet vóór alle andere zaken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel64
  - number: '65'
    text: |-
      De herinrichtingscommissie deelt binnen veertien dagen, nadat het plan van toedeling is komen vast te staan, aan de
      grondkamer mede welke pachtverhoudingen gehandhaafd, welke opgeheven en welke nieuw gevestigd zijn onder vermelding
      van de namen en woonplaatsen van partijen in de pachtverhoudingen, de onroerende zaken waarop deze betrekking
      hebben en de bepalingen op grond van [artikel 61][ref1] inzake de duur en de verlengbaarheid der uit de gevestigde
      pachtverhoudingen voortvloeiende pachtovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '66.1'
    text: |-
      De grondkamer ontwerpt de pachtovereenkomsten, welke uit de gevestigde pachtverhoudingen voortvloeien, en neemt
      daarin op de in het [derde lid van artikel 61][ref1] bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '66.2'
    text: |-
      Indien ingevolge het bepaalde in [artikel 61][ref1] een overeenkomst, geldende voor kortere dan de wettelijke duur,
      verlengbaar zal zijn, doet de grondkamer daarvan blijken door een op de ontwerp-overeenkomst gestelde en door haar
      ondertekende verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '66.3'
    text: |-
      De grondkamer zendt de ontwerp-pachtovereenkomst aan hen, die daarbij partijen zullen zijn, en stelt hen in de
      gelegenheid binnen dertig dagen na toezending de ondertekende overeenkomst aan de grondkamer te doen toekomen.
      Betrokkenen kunnen de door hen overeengekomen pachtprijs, alsmede bijzondere bepalingen in de overeenkomst opnemen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel66
  - number: '66.4'
    text: |-
      Op de in het vorige lid bedoelde pachtovereenkomsten vinden de bepalingen van [titel 7.5 van het Burgerlijk
      Wetboek](onbekend) toepassing, met dien verstande dat de grondkamer niet treedt in de beoordeling van de bepalingen
      der overeenkomst, welke voortvloeien uit de pachtverhouding, zoals deze door het plan van toedeling is komen vast
      te staan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel66
  - number: '67'
    text: |-
      Indien partijen niet binnen de in [het derde lid van artikel 66][ref1] gestelde termijn tot inzending van de
      getekende pachtovereenkomst bij de grondkamer zijn overgegaan, maakt de grondkamer een akte in drievoud op,
      gelijkluidend aan de aan partijen gezonden ontwerp-pachtovereenkomst en bepaalt daarin de pachtprijs. De grondkamer
      ondertekent de akte en zendt een exemplaar daarvan bij aangetekende brief aan ieder der partijen toe.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel66
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '66'
        hoofdstuk: III
        afdeling: '6'
  - number: '68.1'
    text: De akte heeft dezelfde kracht als een tussen partijen gesloten, door de grondkamer goedgekeurde, pachtovereenkomst.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel68
  - number: '68.2'
    text: |-
      Het opmaken en ondertekenen van de akte is een beschikking van de grondkamer, waartegen partijen beroep kunnen
      instellen. Het beroep moet worden ingesteld binnen dertig dagen na de verzending van de in [artikel 67][ref1]
      bedoelde aangetekende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel67
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '67'
        hoofdstuk: III
        afdeling: '6'
  - number: '68.3'
    text: |-
      De Centrale Grondkamer, beslissende op een beroep als bedoeld in het tweede lid, kan de akte wijzigen met
      uitzondering van bepalingen, welke voortvloeien uit de pachtverhouding, zoals deze door het plan van toedeling is
      komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel68
  - number: '69.1'
    text: |-
      Partijen in een gehandhaafde pachtverhouding zenden, indien de pachtovereenkomst tengevolge van de herinrichting
      gewijzigd of door een nieuwe vervangen moet worden, binnen dertig dagen, nadat het plan van toedeling is komen vast
      te staan, een desbetreffende overeenkomst ter goedkeuring bij de grondkamer in.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel69
  - number: '69.2'
    text: |-
      De nieuwe overeenkomst eindigt op hetzelfde tijdstip als waarop de overeenkomst, waarvoor zij in de plaats treedt,
      zou zijn geëindigd. Indien laatstbedoelde overeenkomst voor de wettelijke duur gold, tekent de grondkamer op de
      nieuwe overeenkomst aan, dat deze verlengbaar zal zijn.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel69
  - number: '69.3'
    text: |-
      Indien aan het bepaalde in het eerste lid niet is voldaan, vinden op verzoek van de meest gerede partij de
      [artikelen 67][ref1] en [68][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel68
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '67'
        hoofdstuk: III
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '68'
        hoofdstuk: III
        afdeling: '6'
  - number: '70.1'
    text: |-
      Alle pachtovereenkomsten, welke ingevolge de bepalingen van deze afdeling tot stand komen, treden van rechtswege in
      werking op het tijdstip, waarop de in [artikel 95][ref1] bedoelde akte in de openbare registers wordt ingeschreven.
      Op hetzelfde tijdstip eindigen de pachtovereenkomsten, voor welke de eerstgenoemde pachtovereenkomsten in de plaats
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel95
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '70.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de rechtsverhoudingen, geregeld
      bij een akte als bedoeld in [artikel 67][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel67
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '67'
        hoofdstuk: III
        afdeling: '6'
  - number: '71.1'
    text: |-
      In elk blok worden de beperkte rechten, het recht van huur en lasten welke met betrekking tot de onroerende zaken
      bestaan, geregeld of opgeheven onder regeling van de geldelijke gevolgen daarvan; ruilverkavelingsrenten worden
      afgekocht overeenkomstig de daaromtrent geldende wettelijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel71
  - number: '71.2'
    text: In het belang der herverkaveling kunnen beperkte rechten worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel71
  - number: '71.3'
    text: |-
      De hypotheken gaan met behoud van haar rang over op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij rusten, worden toegedeeld. In de gevallen, voorzien in [artikel 58][ref1], oefenen de
      hypotheekhouder en degene, die op de zaak een recht van grondrente had, hun rechten uit op de wijze als omschreven
      in [artikel 43 van de onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel43
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '58'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '43'
  - number: '71.4'
    text: |-
      Conservatoire en executoriale beslagen gaan over op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij gelegd zijn, worden toegedeeld, alsmede op de geldsommen, welke in de plaats van kavels
      of ter zake van onderbedeling worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel71
  - number: '72.1'
    text: |-
      De herinrichtingscommissie stelt voor elk deelgebied in zijn geheel of bij gedeelten het inventarisatieplan vast.
      Zij vervaardigt daartoe één of meer kaarten, waarop zo nauwkeurig mogelijk worden aangegeven:
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
  - number: 72.1.a
    text: |-
      de wijzigingen in het stelsel van wegen, waterlopen, dijken en kaden met de daartoe behorende kunstwerken, alsmede
      de voorzieningen samenhangende met de wegen en waterlopen, bedoeld in [artikel 55, tweede lid][ref1], zoals deze
      zijn opgenomen in het vastgestelde herinrichtingsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel55
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '55'
        hoofdstuk: III
        afdeling: '5'
  - number: 72.1.b
    text: |-
      de landschappelijke en recreatieve elementen, alsmede de natuurgebieden en cultuurhistorische elementen, zoals deze
      krachtens [artikel 16, derde lid][ref1], zijn opgenomen in het vastgestelde herinrichtingsplan;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: 72.1.c
    text: de in elk blok gehandhaafde wegen, waterlopen, dijken, kaden, met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
  - number: 72.1.d
    text: |-
      indien aanwezig de wegen en kanalen met de daartoe behorende kunstwerken van de gemeente Groningen buiten haar
      grenzen gelegen voor zover niet begrepen onder *a* of c.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
  - number: '72.2'
    text: |-
      De herinrichtingscommissie zendt een afschrift van haar in het eerste lid bedoelde besluit met de daarbij behorende
      kaart of kaarten, vergezeld van een voorstel omtrent de toewijzing van de eigendom, het beheer en het onderhoud van
      de openbare wegen, waterlopen, dijken en kaden met de daartoe behorende kunstwerken aan gedeputeerde staten van de
      provincie, waarin het betrokken deelgebied is gelegen, onderscheidenlijk aan gedeputeerde staten van Groningen en
      van Drenthe, indien het betrokken deelgebied is gelegen in beide provincies.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
  - number: '72.3'
    text: |-
      De herinrichtingscommissie zendt een afschrift van haar in het eerste lid bedoelde besluit met de daarbij behorende
      kaart of kaarten aan de belanghebbende openbare lichamen en, voor zover in het inventarisatieplan wegen en kanalen
      met de daartoe behorende kunstwerken als bedoeld in [artikel 74, vijfde lid][ref1], zijn opgenomen, eveneens aan
      Onze Minister van Binnenlandse Zaken, Onze Minister van Financiën en Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
  - number: '73.1'
    text: |-
      In elk blok worden de wegen met de daartoe behorende kunstwerken, welke voorheen voor het openbaar verkeer
      waren opengesteld en niet in het inventarisatieplan zijn opgenomen, in afwijking van het bepaalde in de
      [artikelen 8][ref1]en [9 van de Wegenwet][ref2] door het enkele feit van de niet-opneming aan het openbaar verkeer
      onttrokken. In elk blok wordt aan wegen met de daartoe behorende kunstwerken, welke in het inventarisatieplan zijn
      opgenomen, maar die voorheen niet voor het openbaar verkeer waren opengesteld, in afwijking van het bepaalde in de
      [artikelen 4][ref3] en [5 van de Wegenwet][ref4] door het enkele feit van de opneming in het inventarisatieplan de
      bestemming van openbare weg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel5
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0001948
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '5'
  - number: '73.2'
    text: |-
      Aan wegen met de daartoe behorende kunstwerken gelegen buiten een blok wordt in afwijking van het bepaalde in de
      [artikelen 4][ref1] en [5 van de Wegenwet][ref2] door het enkele feit van de opneming in het inventarisatieplan de
      bestemming van openbare weg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel5
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '5'
  - number: '74.1'
    text: |-
      Na ontvangst van de in [artikel 72, tweede lid][ref1], bedoelde stukken wijzen gedeputeerde staten de eigendom
      van de openbare wegen, waterlopen en dijken met de daartoe behorende kunstwerken en het beheer en het onderhoud
      van de in het inventarisatieplan opgenomen wegen toe aan de naar hun oordeel daarvoor in aanmerking komende
      openbare lichamen of andere rechtspersonen met dien verstande, dat de toewijzing aan andere rechtspersonen dan
      openbare lichamen slechts op hun verzoek kan geschieden en dat de gemeente Groningen de eigendom, het beheer en
      het onderhoud van de aan haar toebehorende en buiten de gemeente gelegen wegen en kanalen met de daartoe behorende
      kunstwerken verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel72
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '72'
        hoofdstuk: III
        afdeling: '8'
  - number: '74.2'
    text: |-
      Gedeputeerde staten regelen het beheer en het onderhoud van de in het inventarisatieplan opgenomen waterlopen,
      dijken en kaden met de daartoe behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.3'
    text: |-
      Gelijktijdig met de toewijzing, bedoeld in het eerste lid, wijzen gedeputeerde staten op voorstel van de
      herinrichtingscommissie de eigendom van natuurgebieden, van onroerende zaken bestemd voor landschappelijke en
      recreatieve doeleinden, alsmede de eigendom van onroerende zaken met cultuurhistorische waarde toe aan de naar
      hun oordeel daarvoor in aanmerking komende openbare lichamen of andere rechtspersonen met dien verstande, dat de
      toewijzing aan andere rechtspersonen dan openbare lichamen slechts op hun verzoek kan geschieden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.4'
    text: |-
      Alvorens te besluiten horen gedeputeerde staten de in het eerste en derde lid bedoelde openbare lichamen en
      rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.5'
    text: |-
      Onze Minister van Binnenlandse Zaken stelt in overeenstemming met Onze Ministers van Financiën en van Verkeer en
      Waterstaat ter zake van de overgang van de eigendom, het beheer en het onderhoud van aan de gemeente Groningen
      toebehorende en buiten deze gemeente gelegen wegen en kanalen met de daartoe behorende kunstwerken een financiële
      regeling vast, welke ten laste komt van de gemeente Groningen, voor zover de gemeente Groningen door de overgang
      een financiële last kwijt raakt, en welke ten goede komt aan de openbare lichamen, voor zover zij de lasten,
      samenhangend met de overgegane wegen en kanalen met de daartoe behorende kunstwerken, overnemen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.6'
    text: |-
      De eigendom, het beheer en het onderhoud van de openbare wegen, waterlopen, dijken en kaden met de daartoe
      behorende kunstwerken, de eigendom van natuurgebieden, van onroerende zaken, bestemd voor landschappelijke en
      recreatieve doeleinden, alsmede de eigendom van onroerende zaken met cultuurhistorische waarde kunnen niet aan de
      Staat worden toegewezen of onttrokken dan nadat Onze betrokken Minister daarin heeft toegestemd.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.7'
    text: De toestemming, bedoeld in het zesde lid, kan worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.8'
    text: |-
      De in het eerste, tweede en derde lid bedoelde besluiten worden genomen door gedeputeerde staten van de provincie,
      waarin het betrokken deelgebied is gelegen, onderscheidenlijk indien het betrokken deelgebied is gelegen in meer
      dan één provincie door gedeputeerde staten van Groningen en van Drenthe, ieder afzonderlijk voor het gedeelte van
      het deelgebied dat in hun provincie is gelegen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
  - number: '74.9'
    text: |-
      Bij het besluit, bedoeld in het vijfde lid, worden de wijzigingen die zijn opgetreden krachtens de
      [Wet herverdeling wegenbeheer][ref1] (*Stb.* 1992, 563), buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005697
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005697
  - number: '75.1'
    text: |-
      Op door Ons, op voordracht van Onze Minister, te bepalen tijdstippen zijn geheel of gedeeltelijk en in de mate
      waarin dat in het besluit wordt bepaald ontbonden:
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: 75.1.a
    text: |-
      het "Convenant voor de inlating in de Kanalen der stad Groningen en over den afvoer langs dezelve, van de producten
      der na te meldene Veenen" op 17 mei 1817 gesloten tussen de "stad Groningen" en de "Drentsche veengenoten der
      markten Eext, Gieten, Bonnen, Gasselter Boereveen, Gasselter Nieuwveen, Drouwen, Buinen, Exelo en Valthe;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: 75.1.b
    text: |-
      het Contract van 7 maart 1872 tussen de gemeente Groningen en de marktgenoten van Weerdinge "ter inlating van de
      Weerdinger veenen in de stadskanalen";
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: 75.1.c
    text: |-
      het Contract van 20 februari 1875 tussen de gemeente Groningen en de eigenaren van de Muntersche stukken en de
      naamloze vennootschap Het Emmer Compascuum "nopens de doortrekking van het Stads Ter Apelerkanaal naar het Emmer
      Compascuum en den inlaat der aldaar gelegen Veenen".
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: '75.2'
    text: |-
      Op de in het eerste lid vermelde wijze wordt het Contract van 9 september 1871 tussen de gemeente Groningen en de
      geïnteresseerden van het Kielsterverlaat met den aankleve van dien, ontbonden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: '75.3'
    text: |-
      De herinrichtingscommissie doet door tussenkomst van gedeputeerde staten van Groningen en van Drenthe aan Onze
      Minister voorstellen omtrent de in het eerste lid bedoelde tijdstippen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: '75.4'
    text: |-
      Een ingevolge het eerste en tweede lid door Ons genomen besluit wordt door Onze Minister bekend gemaakt in de
      *Nederlandse Staatscourant* alsmede in tenminste twee dagbladen die in de streek worden verspreid.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel75
  - number: '76'
    text: |-
      Aan degene die in de kwaliteit van opvolgende gerechtigde tot een stadsmeierrecht rechtsopvolger is van een in
      [artikel 75, tweede lid][ref1], bedoelde geïnteresseerde, kent de herinrichtingscommissie op diens verzoek een in
      de lijst der geldelijke regelingen op te nemen en uit ’s Rijks kas te betalen schadevergoeding toe, voor zover hij
      schade lijdt ten gevolge van de toepassing van de [artikelen 74][ref2] en [75][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel75
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '75'
        hoofdstuk: III
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '75'
        hoofdstuk: III
        afdeling: '8'
  - number: '77.1'
    text: |-
      Gedeputeerde staten doen van een besluit als bedoeld in [artikel 74, eerste, tweede en derde lid][ref1], mededeling
      door toezending van een afschrift aan de herinrichtingscommissie alsmede, voor zover het besluit betrekking heeft
      op wegen en kanalen met de daartoe behorende kunstwerken als bedoeld in [artikel 74, vijfde lid][ref2], aan Onze
      Ministers van Binnenlandse Zaken, van Financiën en van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel74
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
  - number: '77.2'
    text: |-
      Van de besluiten van gedeputeerde staten inzake de toewijzing van de eigendom van de openbare wegen, waterlopen en
      dijken met de daartoe behorende kunstwerken, van natuurgebieden, van onroerende zaken bestemd voor landschappelijke
      en recreatieve doeleinden en van onroerende zaken met cultuurhistorische waarde, een en ander voor zover zij
      gelegen zijn buiten een blok, wordt een akte opgemaakt door een door de herinrichtingscommissie aan te wijzen
      notaris en ondertekend door de voorzitter en de secretaris van de herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
  - number: '77.3'
    text: Door de inschrijving van de akte wordt de daarin omschreven eigendom verkregen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
  - number: '77.4'
    text: |-
      Tegen een besluit als bedoeld in [artikel 74, eerste, tweede of derde lid][ref1], kunnen uitsluitend de aldaar
      bedoelde openbare lichamen en andere rechtspersonen beroep instellen bij de Afdeling bestuursrechtspraak van de
      Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
  - number: '77.5'
    text: 'Gedeputeerde staten doen van de uitspraak in beroep mededeling door toezending van een afschrift ervan:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
  - number: 77.5.a
    text: |-
      in geval van beroep tegen de toewijzing van de eigendom, het beheer of het onderhoud van de in het tweede lid
      bedoelde onroerende zaken, aan de herinrichtingscommissie en, indien door de uitspraak in beroep de eigendom aan
      een ander openbaar lichaam of rechtspersoon wordt toegewezen dan in de in het tweede lid bedoelde akte is vermeld,
      ter inschrijving in de openbare registers aan het desbetreffende kantoor van de Dienst voor het kadaster en de
      openbare registers;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
  - number: 77.5.b
    text: |-
      in geval van beroep tegen de toewijzing van de eigendom, het beheer of het onderhoud van de in
      [artikel 95, derde lid, onderdeel ][ref1], bedoelde onroerende zaken, aan de herinrichtingscommissie en, indien de
      in [artikel 95, eerste lid][ref2], bedoelde akte is ingeschreven in de openbare registers en door de uitspraak in
      beroep de eigendom aan een ander openbaar lichaam of rechtspersoon dan in die akte is vermeld wordt toegewezen, ter
      inschrijving in de openbare registers aan het desbetreffende kantoor van de Dienst voor het kadaster en de openbare
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel95
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '77.6'
    text: |-
      Door de inschrijving van de uitspraak in beroep in de openbare registers wordt de in die uitspraak omschreven
      eigendom verkregen door de in die uitspraak genoemde openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel77
  - number: '78'
    text: |-
      Tegen een besluit als bedoeld in [artikel 74, vijfde lid][ref1], kunnen uitsluitend belanghebbende openbare
      lichamen beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
  - number: '79'
    text: |-
      Voor zover het openbare lichaam voorheen niet was belast met het beheer en het onderhoud van wegen, waterlopen,
      dijken en kaden met de daartoe behorende kunstwerken gaan in afwijking van het bepaalde in de [artikelen 1][ref1]en
      [2 van de Waterstaatswet 1900][ref2] en de [artikelen 18][ref3], [19][ref4] en [20 van de Wegenwet][ref5] het
      beheer en het onderhoud over door het enkele feit van de aanwijzing in beheer en onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0001948#Artikel20
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0001948
        artikel: 18a
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '19'
      - id: ref5
        bwb_id: BWBR0001948
        artikel: '20'
  - number: '80.1'
    text: Zodra met betrekking tot een blok
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel80
  - number: 80.1.a
    text: |-
      de processen-verbaal, bedoeld in de [artikelen 37][ref1], [38][ref2] en [39][ref3], zijn opgemaakt en


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel39
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '37'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '38'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '39'
        hoofdstuk: III
        afdeling: '4'
  - number: 80.1.b
    text: het inventarisatieplan voor het blok geheel is vastgesteld en
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel80
  - number: 80.1.c
    text: |-
      het in het [tweede lid van artikel 62][ref1] laatstbedoelde tijdstip is verstreken gaat de herinrichtingscommissie
      over tot het opmaken van het plan van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel62
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '62'
        hoofdstuk: III
        afdeling: '6'
  - number: '80.2'
    text: |-
      De herinrichtingscommissie stelt op de door haar te bepalen plaats en tijd de bekende belanghebbenden in de
      gelegenheid hun wensen ten aanzien van het plan van toedeling kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel80
  - number: '81'
    text: 'Het plan van toedeling houdt in:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
  - number: '81.1'
    text: de kavelindeling;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
  - number: '81.2'
    text: |-
      de toedeling van de op grond van [artikel 74, eerste en derde lid][ref1], toegewezen, binnen het blok gelegen
      kavels, bestemd voor voorzieningen als bedoeld in [artikel 16, vierde lid onder ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '81.3'
    text: de toedeling der overige kavels;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
  - number: '81.4'
    text: |-
      de ingevolge [artikel 61][ref1] gehandhaafde, opgeheven en gevestigde pachtverhoudingen, onder vermelding
      van de in het [derde lid van artikel 61][ref2] bedoelde bepalingen inzake de duur en de verlengbaarheid der
      pachtovereenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '81.5'
    text: |-
      de in [artikel 71][ref1] bedoelde regeling, opheffing of vestiging van beperkte rechten, het recht van huur en de
      lasten welke met betrekking tot de onroerende zaken bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel71
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '71'
        hoofdstuk: III
        afdeling: '7'
  - number: '81.6'
    text: bepalingen omtrent de ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel81
  - number: '82'
    text: |-
      In het plan van toedeling kunnen met toestemming van hen, die bevoegd zijn te beschikken ten aanzien van niet
      in het blok gelegen onroerende zaken, regelingen worden opgenomen betreffende grenswijziging, burenrechten en
      erfdienstbaarheden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel82
  - number: '83.1'
    text: De herinrichtingscommissie zet overeenkomstig het plan van toedeling de grenzen der kavels uit op het terrein.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel83
  - number: '83.2'
    text: |-
      De herinrichtingscommissie legt het plan van toedeling gedurende een maand voor een ieder ter kosteloze inzage op
      een door de herinrichtingscommissie te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel83
  - number: '83.3'
    text: |-
      De herinrichtingscommissie doet van de nederlegging tevoren openbare kennisgeving in twee dagbladen die in de
      streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze, alsmede bijzondere kennisgeving bij
      aangetekende brief aan de bekende belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel83
  - number: '83.4'
    text: De kennisgeving houdt mededeling in van de bevoegdheid tot het indienen van bezwaren.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel83
  - number: '83.5'
    text: Op het niet-ontvangen zijn van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel83
  - number: '84'
    text: |-
      Uiterlijk de veertiende dag na de laatste dag, waarop het in [artikel 83][ref1] bedoelde plan van toedeling ter
      inzage heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren bij de herinrichtingscommissie indienen
      met dien verstande, dat tegen de toedeling, bedoeld in [artikel 81, onder 2][ref2], geen bezwaren kunnen worden
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel81
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '83'
        hoofdstuk: III
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '81'
        hoofdstuk: III
        afdeling: '9'
  - number: '85.1'
    text: |-
      Indien binnen de termijn en op de wijze in [artikel 84][ref1] bepaald geen bezwaren zijn ingediend, staat het plan
      van toedeling vast. Daarvan maakt de herinrichtingscommissie proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel84
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '84'
        hoofdstuk: III
        afdeling: '9'
  - number: '85.2'
    text: |-
      Indien binnen de termijn en op de wijze in [artikel 84][ref1] bepaald bezwaren zijn ingediend, onderzoekt de
      herinrichtingscommissie de bezwaren en tracht zij overeenstemming te bereiken; voor zover overeenstemming is
      verkregen, vinden de bepalingen van het eerste lid overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel84
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '84'
        hoofdstuk: III
        afdeling: '9'
  - number: '85.3'
    text: |-
      Voor zover geen overeenstemming is verkregen of voor zover de herinrichtingscommissie van oordeel is, dat de
      bezwaren niet tijdig zijn ingediend, maakt zij omtrent die bezwaren en het daaromtrent verhandelde proces-verbaal
      op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel85
  - number: '85.4'
    text: |-
      De herinrichtingscommissie zendt zo spoedig mogelijk een afschrift van de processen-verbaal en van de ingediende
      bezwaarschriften aan de rechter-commissaris van de arrondissementsrechtbank binnen welker rechtsgebied het blok of
      het grootste gedeelte daarvan is gelegen en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel85
  - number: '86.1'
    text: |-
      Indien geen overeenstemming is verkregen, bepaalt de rechter-commissaris de tijd en plaats der bijeenkomst,
      waarop de belanghebbenden bij de in het proces-verbaal vermelde bezwaren voor hem kunnen verschijnen. De rechter-
      commissaris doet hiervan mededeling aan de herinrichtingscommissie en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel86
  - number: '86.2'
    text: |-
      Zij, die bezwaren hebben ingediend, en de bekende belanghebbenden bij die bezwaren worden door de rechter-
      commissaris bij aangetekende brief opgeroepen om in persoon of bij schriftelijk gemachtigde de bijeenkomst bij
      te wonen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel86
  - number: '86.3'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg door de wet aan het niet-bijwonen der bijeenkomst
      verbonden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel86
  - number: '86.4'
    text: |-
      De bijeenkomst wordt niet gehouden dan nadat tenminste veertien dagen na het verzenden der oproepingen zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel86
  - number: '86.5'
    text: Op het niet-ontvangen zijn van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel86
  - number: '87.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de griffier der arrondissementsrechtbank.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.2'
    text: |-
      De bijeenkomst wordt bijgewoond door een vertegenwoordiger van Onze Minister, één of meer vertegenwoordigers van de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de rechter-commissaris de bijeenkomst zonder dat
      een nadere oproeping zal worden gezonden.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.4'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde op de bijeenkomst aanwezig zijn, wanneer hun bezwaren
      worden behandeld, worden geacht die bezwaren te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.5'
    text: |-
      Het vierde lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet-verschijnen op de bijeenkomst verklaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.6'
    text: |-
      Indien de rechter-commissaris het beroep op overmacht gegrond acht, stelt hij een nadere dag voor de behandeling
      van de bezwaren vast.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '87.7'
    text: |-
      Van het verhandelde maakt de rechter-commissaris proces-verbaal op waarvan hij afschrift zendt aan de
      herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel87
  - number: '88.1'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een door hem te bepalen zitting
      van de arrondissementsrechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel88
  - number: '88.2'
    text: |-
      De arrondissementsrechtbank behandelt de zaken betreffende het plan van toedeling vóór elke andere met uitzondering
      van die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel88
  - number: '89.1'
    text: |-
      Op de dienende dag lichten zij, wier zaken verwezen zijn, hun standpunt hetzij in persoon, hetzij bij schriftelijk
      gemachtigde mondeling toe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel89
  - number: '89.2'
    text: |-
      De arrondissementsrechtbank hoort de vertegenwoordiger van Onze Minister, de vertegenwoordigers van de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel89
  - number: '89.3'
    text: Uiterlijk dertig dagen na het horen doet de arrondissementsrechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel89
  - number: '89.4'
    text: |-
      Indien deze uitspraak van invloed is op het plan van toedeling, is de arrondissementsrechtbank bevoegd dit plan te
      wijzigen na de bij de wijziging betrokken belanghebbenden daarover te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel89
  - number: '89.5'
    text: |-
      Ten aanzien van de kosten van het geding vindt het bepaalde in [artikel 52][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel52
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '52'
        hoofdstuk: III
        afdeling: '4'
  - number: '90'
    text: |-
      Tegen de uitspraak van de arrondissementsrechtbank staat geen rechtsmiddel open, onverminderd de bevoegdheid van de
      procureur-generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel90
  - number: '91'
    text: |-
      Wanneer tengevolge van de behandeling van de bezwaren tegen de lijst van rechthebbenden door de rechter wijzigingen
      in die lijst worden aangebracht, alsmede wanneer ingevolge het bepaalde in [artikel 64][ref1] wijzigingen worden
      aangebracht in de registratie, bedoeld in [artikel 62][ref2], brengt de rechter de daardoor noodzakelijk geworden
      wijzigingen in het plan van toedeling aan.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel62
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '64'
        hoofdstuk: III
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '62'
        hoofdstuk: III
        afdeling: '6'
  - number: '92'
    text: |-
      Indien de herinrichtingscommissie zulks verzoekt, wordt degene, aan wie krachtens het plan van toedeling enige
      onroerende zaak in eigendom of in gebruik toekomt, op bevelschrift van de rechter-commissaris desnoods door middel
      van de sterke arm bij voorraad in de macht daarvan gesteld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel92
  - number: '93.1'
    text: |-
      De herinrichtingscommissie kan in afwijking van het bepaalde in [artikel 80, eerste lid onder ][ref1], bepalen,
      dat de lijst van rechthebbenden, het register van uitkomsten der schattingen en het plan van toedeling gelijktijdig
      zullen worden opgemaakt en ter visie gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel80
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '80'
        hoofdstuk: III
        afdeling: '9'
  - number: '93.2'
    text: |-
      In het in het eerste lid bedoelde geval worden eerst de bezwaren tegen de lijst van rechthebbenden en tegen het
      register van uitkomsten der schattingen en vervolgens die tegen het plan van toedeling behandeld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel93
  - number: '94.1'
    text: |-
      Indien de behandeling van de bezwaren tegen de lijst van rechthebbenden en tegen het register van uitkomsten
      der schattingen wijzigingen in het ter visie gelegde plan van toedeling noodzakelijk maakt, brengt de
      herinrichtingscommissie die wijzigingen in dat plan aan zodra de arrondissementsrechtbank over de bezwaren tegen de
      lijst van rechthebbenden en het register van uitkomsten der schattingen uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel94
  - number: '94.2'
    text: |-
      De herinrichtingscommissie doet aan de betrokken belanghebbenden schriftelijk mededeling van de door haar in het
      plan van toedeling aangebrachte wijzigingen. Zij stelt de betrokken belanghebbenden in de gelegenheid schriftelijk
      bezwaren tegen de aangebrachte wijzigingen in te dienen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel94
  - number: '94.3'
    text: |-
      Voor zover in het geval, bedoeld in het tweede lid, bezwaren zijn ingediend, worden deze bezwaren tezamen met de
      eerder tegen het plan van toedeling ingediende bezwaren behandeld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel94
  - number: '95.1'
    text: |-
      Zodra het plan van toedeling vaststaat en de lijst van rechthebbenden door de arrondissementsrechtbank is gesloten,
      maakt een door de herinrichtingscommissie aangewezen notaris de akte van toedeling op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
  - number: '95.2'
    text: In de akte wordt opgenomen een kaart van het blok met aanwijzing van de kavels en de wegen en waterlopen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
  - number: '95.3'
    text: 'In de akte worden voorts opgenomen:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
  - number: 95.3.a
    text: |-
      de in [artikel 71][ref1] bedoelde regeling, opheffing of vestiging van beperkte rechten en van de lasten welke
      met betrekking tot de onroerende zaken bestaan, met uitzondering van de bepalingen betreffende geldelijke
      verrekeningen;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel71
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '71'
        hoofdstuk: III
        afdeling: '7'
  - number: 95.3.b
    text: |-
      het in [artikel 74, eerste lid][ref1], bedoelde besluit inzake de toewijzing van de eigendom van
      openbare wegen, waterlopen en dijken met de daartoe behorende kunstwerken, voor zover zij binnen het
      blok zijn gelegen, met uitzondering van het gedeelte dat betrekking heeft op voorzieningen als bedoeld in
      [artikel 16, vierde lid onder ][ref2] .


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '74'
        hoofdstuk: III
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '95.4'
    text: |-
      De omschrijving van de kavels, de wegen en de waterlopen, die op de in het tweede lid bedoelde kaart zijn afgebeeld
      en die daarop voorzien zijn van een nummer, geschiedt door vermelding van het nummer waarmee zij op die kaart
      voorkomen. [Artikel 20, eerste lid, van de Kadasterwet][ref1] is niet van toepassing voor zover het betreft het
      vermelden van de aard en de plaatselijke aanduiding zo deze er is, van onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel20
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '20'
  - number: '95.5'
    text: |-
      In de akte van toedeling worden tevens vermeld de hypotheken en de beslagen die door de inschrijving van de akte
      van toedeling niet meer blijven bestaan.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
  - number: '95.6'
    text: |-
      Het bepaalde in de [artikelen 18][ref1], eerste en vijfde lid, en [24, tweede lid onder ][ref2], is van
      overeenkomstige toepassing op de akte van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel24
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '24'
  - number: '96'
    text: |-
      Indien op de in [artikel 31][ref1] bedoelde lijst een stadsmeierrecht vermeld staat rustende op een onroerende
      zaak, dat niet deel uitmaakt van het in dat artikel bedoelde blok, wordt in de akte van toedeling van dat blok
      het stadsmeierrecht vervangen door een recht van eigendom ten gunste van de gerechtigde tot dat stadsmeierrecht en
      verliest de gemeente Groningen de bezwaarde eigendom van die onroerende zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel31
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '31'
        hoofdstuk: III
        afdeling: '4'
  - number: '97.1'
    text: |-
      De akte van toedeling wordt ondertekend door de rechter-commissaris en de voorzitter en de secretaris van de
      herinrichtingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel97
  - number: '97.2'
    text: |-
      Zij geldt als titel voor de daarin omschreven rechten. Door de inschrijving van de akte in de openbare registers
      worden de daarin omschreven onroerende zaken en beperkte rechten verkregen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel97
  - number: '97.3'
    text: |-
      De bewaarder van het kadaster en de openbare registers tekent op grond van de akte bij elke hypothecaire
      inschrijving, onderscheidenlijk bij elke inschrijving van een beslag aan, dat de hypotheek onderscheidenlijk het
      beslag in het vervolg zal rusten op de in de akte aangewezen kavels, of gedeelten daarvan, dan wel op de rechten
      waaraan die kavels of gedeelten daarvan zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel97
  - number: '97.4'
    text: |-
      De bewaarder van het kadaster en de openbare registers haalt ambtshalve door de door de inschrijving van de akte
      van toedeling niet meer bestaande inschrijvingen van de in [artikel 95, vijfde lid][ref1], bedoelde hypotheken
      en beslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel95
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '97.5'
    text: |-
      De bewaarder van het kadaster en de openbare registers zendt zo spoedig mogelijk per brief aan elke eigenaar van,
      alsmede aan elk beperkt gerechtigde met betrekking tot de onroerende zaak een kennisgeving van het resultaat van
      de bijhouding van de basisregistratie kadaster die op grond van de inschrijving van de akte plaatsvindt. De brief
      vermeldt de dag van de verzending alsmede de in de basisregistratie kadaster vermeld staande gegevens omtrent de
      rechten, de rechthebbenden, als bedoeld in de [Kadasterwet][ref1], de grootte en de kadastrale aanduiding van de
      onroerende zaak, waarop de kennisgeving betrekking heeft. De [artikelen 60 tot en met 63 van de Kadasterwet][ref2]
      zijn niet van toepassing op de in de eerste zin bedoelde bijhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel60
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0004541
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '60'
  - number: '98'
    text: |-
      De rechten en verplichtingen voortvloeiend uit een overeenkomst, waarbij een stadsmeierrecht is gevestigd,
      vervallen van rechtswege op het tijdstip waarop de in [artikel 95][ref1] bedoelde akte in de openbare registers
      wordt ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel95
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '99.1'
    text: |-
      Onverminderd het bepaalde in [artikel 82][ref1] blijven in afwijking van het bepaalde in
      [artikel 97, tweede lid eerste zin][ref2], en [artikel 97, derde lid][ref3], de beperkte rechten ten laste
      van de in [artikel 96][ref4] bedoelde stadsmeierrechten dan wel ten laste van de onroerende zaken, waarop die
      stadsmeierrechten rusten, gehandhaafd. Deze beperkte rechten rusten na de inschrijving van de akte van toedeling in
      de openbare registers op de onroerende zaken, waarop de stadsmeierrechten betrekking hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel97
      [ref4]: https://wetten.overheid.nl/BWBR0003143#Artikel96
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '82'
        hoofdstuk: III
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '97'
        hoofdstuk: III
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '97'
        hoofdstuk: III
        afdeling: '11'
      - id: ref4
        bwb_id: BWBR0003143
        artikel: '96'
        hoofdstuk: III
        afdeling: '11'
  - number: '99.2'
    text: |-
      In afwijking van het bepaalde in [artikel 97, vierde lid][ref1], rusten de conservatoire en executoriale beslagen
      ten laste van de in [artikel 96][ref2] bedoelde stadsmeierrechten na de inschrijving van de akte van toedeling in
      de openbare registers op de onroerende zaken, waarop de stadsmeierrechten betrekking hadden.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel96
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '97'
        hoofdstuk: III
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '96'
        hoofdstuk: III
        afdeling: '11'
  - number: '99.3'
    text: |-
      In afwijking van het in [artikel 98][ref1] bepaalde blijven ten aanzien van onroerende zaken, die niet
      deel uitmaken van een blok, gehandhaafd de uit een overeenkomst, waarbij een stadsmeierrecht is gevestigd,
      voortvloeiende rechten en verplichtingen betrekking hebbende op achtvoetspaden, voet- en kruipaden, wegen,
      uitzicht, verbod van bebouwing of van opslag, waterafvoer, rioolrecht en andere door Ons bij algemene maatregel van
      bestuur aan te wijzen rechten en verplichtingen van soortgelijke strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel98
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '98'
        hoofdstuk: III
        afdeling: '11'
  - number: '100'
    text: |-
      Na de inschrijving van de in [artikel 95][ref1] bedoelde akte wordt hij, aan wie daarbij enige onroerende zaak in
      eigendom of gebruik is toegedeeld, desnoods op bevelschrift van de rechter-commissaris door middel van de sterke
      arm in de macht daarvan gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel95
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '101.1'
    text: |-
      De gemeente Groningen ontvangt van de Staat voor het verlies van de bezwaarde eigendom van de onroerende zaken
      als bedoeld in de [artikelen 60][ref1] en [96][ref2] de gekapitaliseerde waarde van de jaarlijkse inkomsten
      voortvloeiende uit die onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel96
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '60'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '96'
        hoofdstuk: III
        afdeling: '11'
  - number: '101.2'
    text: |-
      Het bedrag van de in het eerste lid bedoelde jaarlijkse inkomsten wordt vastgesteld door de
      herinrichtingscommissie. Bij de vaststelling van de jaarlijkse inkomsten wordt rekening gehouden met de invloed
      die de opheffing van de stadsmeierrechten heeft gehad op het aantal overdrachten en de overdrachtsprijs van de
      stadsmeierrechten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel101
  - number: '101.3'
    text: |-
      Bij de berekening van de in het eerste lid genoemde gekapitaliseerde waarde wordt uitgegaan van een rentevoet,
      vastgesteld door Onze Minister van Binnenlandse Zaken in overeenstemming met Onze Minister van Financiën,
      gehoord de gemeente Groningen. Bij de vaststelling van de rentevoet wordt rekening gehouden met de in de toekomst
      te verwachten toeneming van het aantal overdrachten van de stadsmeierrechten en reële waardestijging van de
      stadsmeierrechten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel101
  - number: '101.4'
    text: |-
      Onze Minister van Binnenlandse Zaken zendt een afschrift van het in het derde lid bedoelde besluit aan de
      herinrichtingscommissie en de gemeente Groningen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel101
  - number: '102'
    text: |-
      Op degene die krachtens de inschrijving van de akte van toedeling de eigendom van onroerende zaken heeft verkregen
      en krachtens zodanige inschrijving niet langer gerechtigde tot een stadsmeierrecht is, rust een schuldplichtigheid
      ten behoeve van de Staat, die op de voet van de [artikelen 103-106][ref1] wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel103
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '103'
        hoofdstuk: III
        afdeling: '12'
  - number: '103.1'
    text: |-
      De in [artikel 102][ref1] bedoelde schuldplichtigheid bestaat voor een natuurlijk persoon voor iedere onroerende
      zaak, met betrekking waartoe hij krachtens de inschrijving van de akte van toedeling niet langer gerechtigde tot
      een stadsmeierrecht is, uit het 50-voud van de jaarlijks ter zake van die onroerende zaak verschuldigde huur of
      pacht.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: '103.2'
    text: |-
      De in [artikel 102][ref1] bedoelde schuldplichtigheid bestaat voor een rechtspersoon voor iedere onroerende
      zaak, met betrekking waartoe hij krachtens de inschrijving van de akte van toedeling niet langer gerechtigde tot
      een stadsmeierrecht is, uit de op het tijdstip van die inschrijving contante waarde van het overgangsrecht, dat
      bij voortbestaan van het stadsmeierrecht ter zake van die onroerende zaak verschuldigd zou zijn geweest op de
      eerstvolgende vaste vervaldag na de dag van inschrijving van de akte van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: '103.3'
    text: |-
      De in [artikel 102][ref1] bedoelde schuldplichtigheid bestaat voor een rechtspersoon, die krachtens de inschrijving
      van de akte van toedeling de eigendom van onroerende zaken heeft verkregen, niet, voor zover het betreft gebouwen:


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: 103.3.a
    text: in hoofdzaak bestemd voor de openbare eredienst;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.b
    text: |-
      bestemd voor het houden van openbare bezinningssamenkomsten in de zin van de artikelen 13 en 14 van de Wet Premie
      Kerkenbouw;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.c
    text: behorende tot een klooster;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.d
    text: behorende tot een diaconie;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.e
    text: behorende tot een weldadigheidsinstelling;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.f
    text: behorende tot een ziekenhuis;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.3.g
    text: in hoofdzaak bestemd voor het geven van onderwijs;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: '103.4'
    text: 'Voor de bepaling van de in het tweede lid bedoelde contante waarde worden de grondslagen gevormd door:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
  - number: 103.4.a
    text: |-
      de met inachtneming van de [artikelen 104-106][ref1] bepaalde verkoopwaarde van het stadsmeierrecht;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel104
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '104'
        hoofdstuk: III
        afdeling: '12'
  - number: 103.4.b
    text: |-
      de in [artikel 119 van Boek 6 van het Burgerlijk Wetboek][ref1] bedoelde wettelijke rente, ten tijde van de in
      [artikel 104][ref2] bedoelde schatting.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel104
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '104'
        hoofdstuk: III
        afdeling: '12'
  - number: '104.1'
    text: |-
      Op verzoek van de herinrichtingscommissie benoemt de voorzieningenrechter van de rechtbank te Groningen voor
      elk deelgebied waarvan onroerende zaken deel uitmaken, met betrekking waartoe een rechtspersoon gerechtigde tot
      een stadsmeierrecht is, een schattingscommissie om met inachtneming van het bepaalde in [artikel 105][ref1] de
      verkoopwaarde te schatten van het stadsmeierrecht dat rust op de onroerende zaak, met inbegrip van de zich daarop
      bevindende opstallen en beplantingen, en met betrekking waartoe een rechtspersoon gerechtigd is. De schattingen
      vinden plaats onderscheidenlijk naar stadsmeierrecht, waarvoor de 20e of 30e penning, dan wel een andere vergoeding
      bij overgang is verschuldigd. De voorzieningenrechter wijst uit de leden van de schattingscommissie een voorzitter
      aan en regelt de aan de leden van de schattingscommissie toe te kennen vergoedingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel105
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '105'
        hoofdstuk: III
        afdeling: '12'
  - number: '104.2'
    text: |-
      De in het eerste lid bedoelde schatting vindt plaats voor elk blok afzonderlijk. De schatting van de verkoopwaarde
      van stadsmeierrechten rustend op niet van een blok deel uitmakende onroerende zaken vindt plaats tegelijkertijd met
      de schatting van de verkoopwaarde van de stadsmeierrechten rustend op onroerende zaken deel uitmakende van het in
      [artikel 16, vijfde lid][ref1], bedoelde blok.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel16
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '104.3'
    text: De herinrichtingscommissie voegt een secretaris aan de schattingscommissie toe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
  - number: '104.4'
    text: |-
      De voorzitter van de schattingscommissie kan aan de voorzieningenrechter van de rechtbank benoeming van nog een
      of meer andere leden verzoeken, indien de schatting van een bepaald object of van bepaalde objecten bijzondere
      deskundigheid vereist, welke de reeds benoemde leden niet bezitten.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
  - number: '104.5'
    text: De voorzitter van de schattingscommissie regelt de werkzaamheden van de schattingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
  - number: '104.6'
    text: Iedere schatting geschiedt door drie leden van de schattingscommissie.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel104
  - number: '105.1'
    text: |-
      Bij de schatting van de verkoopwaarde van de stadsmeierrechten, welke rusten op niet van een blok deel uitmakende
      onroerende zaken, wordt uitgegaan van de toestand ten tijde van de inschrijving van de akte van toedeling van het
      in [artikel 31][ref1] bedoelde blok. Bij de schatting van de verkoopwaarde van de stadsmeierrechten, welke rusten
      op van een blok deel uitmakende onroerende zaken, wordt uitgegaan van de toestand ten tijde van de inschrijving van
      de akte van toedeling van dat blok.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel31
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '31'
        hoofdstuk: III
        afdeling: '4'
  - number: '105.2'
    text: |-
      Bij de schatting bedoeld in lid 1 worden mede in aanmerking genomen de zaken die vóór het in werking treden van de
      [Boeken 3][ref1], [5][ref2] en [6 van het Burgerlijk Wetboek][ref3] onroerend waren door bestemming. Ten aanzien
      van deze zaken wordt in aanmerking genomen de waarde welke zij ontlenen aan hun gebruiksmogelijkheden ter plaatse.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
      [ref2]: https://wetten.overheid.nl/BWBR0005288
      [ref3]: https://wetten.overheid.nl/BWBR0005289
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005291
      - id: ref2
        bwb_id: BWBR0005288
      - id: ref3
        bwb_id: BWBR0005289
  - number: '105.3'
    text: |-
      Waardeveranderingen tengevolge van de herinrichting blijven bij het schatten van de verkoopwaarde buiten
      beschouwing.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel105
  - number: '106.1'
    text: |-
      De schattingscommissie geeft de gerechtigde tot een stadsmeierrecht en de gemeente Groningen gelegenheid om haar
      alle feiten en omstandigheden mede te delen, die van belang zijn voor een juiste schatting. Zij roept hen daartoe
      met inachtneming van een termijn van tenminste een week op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel106
  - number: '106.2'
    text: Zij verstrekken aan de schattingscommissie alle door deze nodig geachte gegevens om tot schatting te komen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel106
  - number: '106.3'
    text: |-
      De schattingscommissie doet haar schatting niet dan na de onroerende zaken in ogenschouw te hebben genomen. De
      gerechtigden tot een stadsmeierrecht en de eventuele gebruikers zijn verplicht de schattingscommissie toegang tot
      de onroerende zaken te verlenen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel106
  - number: '107.1'
    text: |-
      De herinrichtingscommissie geeft op een door haar te bepalen tijdstip aan de schatters, bedoeld in
      [artikel 32][ref1], opdracht tot het schatten van:


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel32
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '32'
        hoofdstuk: III
        afdeling: '4'
  - number: 107.1.a
    text: |-
      de waardeveranderingen, bedoeld in de [artikelen 24][ref1] en [25][ref2], voor zover deze voor verrekening in
      aanmerking komen en daarmede bij de schatting, bedoeld in [artikel 33][ref3], nog geen rekening is gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel33
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '24'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '25'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '33'
        hoofdstuk: III
        afdeling: '4'
  - number: 107.1.b
    text: |-
      de verandering van de ingevolge [artikel 33][ref1] vastgestelde waarde van iedere kavel als gevolg van de
      herinrichting;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel33
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '33'
        hoofdstuk: III
        afdeling: '4'
  - number: 107.1.c
    text: zo nodig de gebouwen, werken en beplantingen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
  - number: 107.1.d
    text: zo nodig de waarde, voor zover deze bepaald wordt door andere dan agrarische factoren.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
  - number: '107.2'
    text: Bij regeling van Onze Minister worden regels gesteld over de wijze waarop de schatting wordt verricht.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel107
  - number: '108.1'
    text: |-
      De herinrichtingscommissie gaat daarna zo spoedig mogelijk over tot het opmaken van de lijst der geldelijke
      regelingen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel108
  - number: '108.2'
    text: |-
      De lijst der geldelijke regelingen van het in [artikel 31][ref1] bedoelde blok houdt mede de vermelding in van de
      in [artikel 109, onder 6 en 7][ref2], bedoelde gegevens, voor zover verband houdende met onroerende zaken, die niet
      deel uitmaken van een blok.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel109
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '31'
        hoofdstuk: III
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '109'
        hoofdstuk: III
        afdeling: '12'
  - number: '109'
    text: 'De lijst der geldelijke regelingen houdt in:'
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
  - number: '109.1'
    text: |-
      de uitkomsten der schattingen volgens [artikel 107][ref1], alsmede de daaruit voortvloeiende geldelijke
      verrekeningen ten aanzien van de daarbij betrokken eigenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel107
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '107'
        hoofdstuk: III
        afdeling: '12'
  - number: '109.2'
    text: |-
      de geldelijke verrekeningen, voortvloeiende uit de toepassing van de [artikelen 57][ref1] en [58][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel58
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '57'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '58'
        hoofdstuk: III
        afdeling: '5'
  - number: '109.3'
    text: |-
      de geldelijke verrekeningen, voortvloeiende uit de toepassing van [artikel 61][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel61
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '61'
        hoofdstuk: III
        afdeling: '6'
  - number: '109.4'
    text: |-
      de bepaling der geldelijke gevolgen, bedoeld in [artikel 71, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel71
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '71'
        hoofdstuk: III
        afdeling: '7'
  - number: '109.5'
    text: de afkoopsom van de ruilverkavelingsrenten;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
  - number: '109.6'
    text: |-
      de uitkomsten van de schattingen, bedoeld in [artikel 104][ref1], alsmede de op grond van [artikel 102][ref2] te
      betalen bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '104'
        hoofdstuk: III
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: '109.7'
    text: toe te kennen schadevergoedingen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
  - number: '109.8'
    text: de vergoedingen voor zaken, welke in verband met de overgang der onroerende zaken moeten worden verrekend.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel109
  - number: '110'
    text: |-
      De herinrichtingscommissie wijst in elk deelgebied een blok aan op de lijst der geldelijke regelingen waarvan de in
      [artikel 101, eerste lid][ref1], bedoelde gekapitaliseerde waarde wordt vermeld van de jaarlijkse inkomsten van de
      gemeente Groningen, voortvloeiende uit de aan haar in bezwaarde eigendom toebehorende en in het deelgebied gelegen
      onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel101
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '101'
        hoofdstuk: III
        afdeling: '12'
  - number: '111.1'
    text: |-
      De lijst der geldelijke regelingen wordt door de herinrichtingscommissie gedurende een maand voor een ieder ter
      kosteloze inzage gelegd op een door haar te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel111
  - number: '111.2'
    text: |-
      [Het derde tot en met het vijfde lid van artikel 83][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel83
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '83'
        hoofdstuk: III
        afdeling: '9'
  - number: '111.3'
    text: |-
      De lijst der geldelijke regelingen wordt in haar geheel of in uittreksel tegen betaling der kosten verkrijgbaar
      gesteld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel111
  - number: '112'
    text: |-
      Uiterlijk de dertigste dag na de laatste dag, waarop de in [artikel 111][ref1] bedoelde lijst der
      geldelijke regelingen ter inzage heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren bij de
      herinrichtingscommissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel111
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '111'
        hoofdstuk: III
        afdeling: '12'
  - number: '113'
    text: |-
      Voor zover binnen de termijn en op de wijze in [artikel 112][ref1] bepaald geen bezwaren zijn ingediend, staat de
      lijst der geldelijke regelingen vast. Daarvan maakt de herinrichtingscommissie proces-verbaal op.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel112
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '112'
        hoofdstuk: III
        afdeling: '12'
  - number: '114.1'
    text: |-
      Indien binnen de termijn en op de wijze in [artikel 112][ref1] bepaald bezwaren zijn ingediend, onderzoekt de
      herinrichtingscommissie de bezwaren en tracht zij overeenstemming te bereiken.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel112
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '112'
        hoofdstuk: III
        afdeling: '12'
  - number: '114.2'
    text: |-
      Voor zover overeenstemming is verkregen, vinden de bepalingen van [artikel 113][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel113
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '113'
        hoofdstuk: III
        afdeling: '12'
  - number: '115'
    text: |-
      Voor zover geen overeenstemming is verkregen, maakt de herinrichtingscommissie van het omtrent die bezwaren
      verhandelde proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel115
  - number: '116'
    text: |-
      De herinrichtingscommissie zendt zo spoedig mogelijk een afschrift van de lijst der geldelijke regelingen en van de
      in de [artikelen 113][ref1], [114][ref2] en [115][ref3] bedoelde processen-verbaal aan de rechter-commissaris van
      de arrondissementsrechtbank binnen welker rechtsgebied het blok of het grootste gedeelte daarvan is gelegen en aan
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel114
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel115
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '113'
        hoofdstuk: III
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '114'
        hoofdstuk: III
        afdeling: '12'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '115'
        hoofdstuk: III
        afdeling: '12'
  - number: '117.1'
    text: |-
      Indien geen overeenstemming is verkregen, bepaalt de rechter-commissaris terstond tijd en plaats der bijeenkomst,
      waarop de belanghebbenden bij de in het proces-verbaal vermelde bezwaren voor hem kunnen verschijnen. De rechter-
      commissaris doet hiervan mededeling aan de herinrichtingscommissie en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel117
  - number: '117.2'
    text: |-
      [Artikel 86, tweede tot en met vijfde lid][ref1], en [artikel 87][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel87
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '86'
        hoofdstuk: III
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '87'
        hoofdstuk: III
        afdeling: '9'
  - number: '118.1'
    text: |-
      Voor zover overeenstemming is verkregen omtrent de lijst der geldelijke regelingen dan wel het in het
      [vierde lid van artikel 87][ref1] bedoelde geval zich voordoet, staat de lijst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel87
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '87'
        hoofdstuk: III
        afdeling: '9'
  - number: '118.2'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een door hem te bepalen zitting
      van de arrondissementsrechtbank. Deze verwijzing vervangt de dagvaarding. De arrondissementsrechtbank behandelt
      zaken betreffende de lijst der geldelijke regelingen vóór elke andere met uitzondering van die betreffende
      onteigening.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel118
  - number: '119.1'
    text: |-
      Op de dienende dag lichten zij, wier zaken verwezen zijn, hun standpunt hetzij in persoon, hetzij bij schriftelijke
      gemachtigde mondeling toe.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel119
  - number: '119.2'
    text: |-
      De arrondissementsrechtbank hoort de vertegenwoordiger van Onze Minister, de vertegenwoordigers van de
      herinrichtingscommissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel119
  - number: '119.3'
    text: Uiterlijk dertig dagen na het horen doet de arrondissementsrechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel119
  - number: '119.4'
    text: |-
      Indien deze uitspraak van invloed is op de lijst der geldelijke regelingen, is de arrondissementsrechtbank bevoegd
      deze lijst te wijzigen na de bij de wijziging betrokken belanghebbenden daarover te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel119
  - number: '119.5'
    text: |-
      Ten aanzien van de kosten van het geding vindt het in [artikel 52][ref1] bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel52
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '52'
        hoofdstuk: III
        afdeling: '4'
  - number: '120'
    text: |-
      Tegen de uitspraak van de arrondissementsrechtbank staat behalve cassatie geen rechtsmiddel open.
      [Artikel 47][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel47
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '47'
        hoofdstuk: III
        afdeling: '4'
  - number: '121.1'
    text: |-
      Nadat zij omtrent alle geschillen betreffende de lijst der geldelijke regelingen heeft beslist, sluit de
      arrondissementsrechtbank zo spoedig mogelijk de lijst der geldelijke regelingen, behoudens voor zover omtrent een
      geschil nog niet onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel121
  - number: '121.2'
    text: |-
      Indien [artikel 120][ref1] is toegepast, sluit de arrondissementsrechtbank de lijst der geldelijke regelingen ten
      aanzien van de betrokken onderdelen zodra omtrent een geschil over een zodanig onderdeel onherroepelijk is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel120
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '120'
        hoofdstuk: III
        afdeling: '12'
  - number: '121.3'
    text: |-
      Indien ten gevolge van de toepassing van [artikel 120][ref1] wijziging van een in het tweede lid bedoeld onderdeel
      leidt tot een vermindering van de schuldplichtigheid, worden de geldelijke gevolgen daarvan door de Staat gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel120
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '120'
        hoofdstuk: III
        afdeling: '12'
  - number: '122'
    text: |-
      De lijst der geldelijke regelingen, zoals zij door de arrondissementsrechtbank is gesloten, geldt als titel voor de
      daarin omschreven vorderingen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel122
  - number: '123.1'
    text: |-
      De herinrichtingscommissie kan bepalen dat het plan van toedeling en de lijst der geldelijke regelingen
      gelijktijdig zullen worden opgemaakt en ter visie gelegd. Alsdan worden eerst de bezwaren tegen het plan van
      toedeling en vervolgens die tegen de lijst der geldelijke regelingen behandeld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel123
  - number: '123.2'
    text: |-
      In de lijst der geldelijke regelingen dienen te worden opgenomen de geldelijke gevolgen van de behandeling van de
      bezwaren tegen het plan van toedeling.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel123
  - number: '124.1'
    text: |-
      Indien de gelijktijdige tervisielegging van het plan van toedeling en de lijst der geldelijke regelingen
      gepaard gaat met toepassing van [artikel 93][ref1], doet de herinrichtingscommissie de betrokken belanghebbenden
      schriftelijk mededeling van de geldelijke gevolgen, welke de behandeling van de bezwaren tegen het plan van
      toedeling heeft voor de lijst der geldelijke regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel93
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '93'
        hoofdstuk: III
        afdeling: '10'
  - number: '124.2'
    text: |-
      De herinrichtingscommissie stelt in dat geval de betrokken belanghebbenden in de gelegenheid schriftelijk bezwaren
      tegen die geldelijke gevolgen in te dienen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel124
  - number: '124.3'
    text: |-
      Voor zover in het geval, bedoeld in het tweede lid, bezwaren zijn ingediend, worden deze bezwaren tezamen met de
      eerder tegen de lijst der geldelijke regelingen ingediende bezwaren behandeld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel124
  - number: 124a
    text: |-
      De [hoofdstukken 6][ref1] en 7 van de Algemene wet bestuursrecht zijn niet van toepassing ten aanzien
      van de bezwaren, bedoeld in de [artikelen 36, eerste lid][ref2], [63, tweede lid][ref3], [84][ref4],
      [93, tweede lid][ref5], [112][ref6] en [123, eerste lid][ref7], noch ten aanzien van het beroep, bedoeld in
      [artikel 68, tweede lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0003143#Artikel63
      [ref4]: https://wetten.overheid.nl/BWBR0003143#Artikel84
      [ref5]: https://wetten.overheid.nl/BWBR0003143#Artikel93
      [ref6]: https://wetten.overheid.nl/BWBR0003143#Artikel112
      [ref7]: https://wetten.overheid.nl/BWBR0003143#Artikel123
      [ref8]: https://wetten.overheid.nl/BWBR0003143#Artikel68
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel124a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '36'
        hoofdstuk: III
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003143
        artikel: '63'
        hoofdstuk: III
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0003143
        artikel: '84'
        hoofdstuk: III
        afdeling: '9'
      - id: ref5
        bwb_id: BWBR0003143
        artikel: '93'
        hoofdstuk: III
        afdeling: '10'
      - id: ref6
        bwb_id: BWBR0003143
        artikel: '112'
        hoofdstuk: III
        afdeling: '12'
      - id: ref7
        bwb_id: BWBR0003143
        artikel: '123'
        hoofdstuk: III
        afdeling: '13'
      - id: ref8
        bwb_id: BWBR0003143
        artikel: '68'
        hoofdstuk: III
        afdeling: '6'
  - number: '125'
    text: |-
      Ten laste van de Staat komen alle kosten der herinrichting, voor zover deze niet ingevolge de bepalingen van deze
      wet of krachtens overeenkomst door anderen worden gedragen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel125
  - number: '126.1'
    text: |-
      Ter zake van de op grond van de lijst der geldelijke regelingen, zoals zij door de arrondissementsrechtbank is
      gesloten, door de eigenaren andere dan op grond van [artikel 102][ref1] verschuldigde bedragen, rust op de hun
      toegedeelde kavels onder de naam van "herinrichtingsrente" een schuldplichtigheid ten behoeve van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: '126.2'
    text: Op zijn verzoek kan een eigenaar de door hem verschuldigde, in het eerste lid bedoelde, bedragen ineens voldoen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel126
  - number: '127'
    text: |-
      De rente bedraagt zes procent van de volgens [artikel 126][ref1] verschuldigde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel126
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '126'
        hoofdstuk: III
        afdeling: '14'
  - number: '129'
    text: |-
      De rente is verschuldigd over zes en twintig achtereenvolgende jaren, te beginnen met het jaar volgende op dat,
      waarin de herinrichtingsrente ter opneming in de basisregistratie kadaster door het desbetreffende kantoor van de
      Dienst voor het kadaster en de openbare registers is ontvangen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel129
  - number: '130.1'
    text: |-
      Bij splitsing van een perceel wordt de rente van de nog niet ingetreden jaren verdeeld naar verhouding van de
      grootte van die percelen volgens de basisregistratie kadaster.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel130
  - number: '130.2'
    text: |-
      Wordt een perceel of een gedeelte van een perceel met andere grond samengevoegd dan gaat de rente of het
      betreffende gedeelte van de rente voor de nog niet ingetreden jaren op het door die samenvoeging gevormde perceel
      over.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel130
  - number: '131.1'
    text: |-
      De rente is verschuldigd door hem, die het genot heeft van het perceel als bezitter, eigenaar of beperkt
      gerechtigde.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel131
  - number: '131.2'
    text: |-
      In geval van vruchtgebruik is degene aan wie de bezwaarde eigendom toebehoort verplicht de vruchtgebruiker bij
      het eindigen van zijn vruchtgebruik te vergoeden, hetgeen deze in verband met de vermindering van de waarde van de
      rente, berekend volgens [artikel 134][ref1], geacht moet worden voor aflossing te hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel134
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '134'
        hoofdstuk: III
        afdeling: '14'
  - number: '131.3'
    text: |-
      In geval van het recht van opstal is de rente slechts verschuldigd, voor zover zodanig recht niet betreft het
      leggen en houden van leidingen in, op of boven de onroerende zaak van een ander.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel131
  - number: '132'
    text: |-
      Het bedrag van de rente wordt door de zorg van het bestuur van de Dienst voor het kadaster en de openbare registers
      bij ieder daaraan onderworpen perceel in de basisregistratie kadaster opgenomen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel132
  - number: '133.1'
    text: De rente wordt geheven en ingevorderd door of vanwege Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: '133.2'
    text: |-
      De heffing en de invordering van de rente geschieden met toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) en de [Invorderingswet 1990][ref2] (*Stb.* 221) als
      ware die rente een rijksbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '133.3'
    text: |-
      De rente wordt geheven bij wege van aanslag. Indien met betrekking tot een zelfde perceel twee of meer personen
      renteplichtig zijn kan de rente bij wege van één aanslag worden geheven ten name van één van hen.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: '133.4'
    text: |-
      Bezwaar en beroep bedoeld in [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] kunnen niet zijn
      gegrond op de stelling dat de op grond van [artikel 126][ref2] verschuldigde bedragen ten onrechte of te hoog zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003143#Artikel126
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003143
        artikel: '126'
        hoofdstuk: III
        afdeling: '14'
  - number: '133.5'
    text: |-
      Indien met toepassing van de tweede volzin van het derde lid de aanslag ten name van één renteplichtige is gesteld
      kan:
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: 133.5.a
    text: |-
      de ontvanger de aanslag op het gehele perceel verhalen ten name van degene te wiens name de aanslag is gesteld,
      zonder rekening te houden met de rechten van de overige renteplichtigen;
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: 133.5.b
    text: |-
      de renteplichtige die de aanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn renteplicht
      verhalen op de overige renteplichtigen naar evenredigheid van ieders renteplicht.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: '133.6'
    text: Van het vijfde lid, aanhef en onderdeel *b*, kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel133
  - number: '134.1'
    text: |-
      Vóór of op 1 juli van elk jaar kan de rente over de nog niet ingetreden jaren worden afgekocht voor haar waarde op
      genoemde dag.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel134
  - number: '134.2'
    text: |-
      Ter berekening van die waarde wordt het over een jaar verschuldigde bedrag geacht op de eerste juli van dat jaar te
      verschijnen. De berekening geschiedt voorts naar de rentevoet van 3 5/8 procent.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel134
  - number: '134.3'
    text: De verdere bepalingen omtrent de afkoop worden door Onze Minister van Financiën vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel134
  - number: '135.1'
    text: |-
      Zodra en voor zover de lijst der geldelijke regelingen door de rechtbank is gesloten, wordt de schuldplichtigheid,
      bedoeld in [artikel 102][ref1], vastgesteld door een door Onze Minister aan te wijzen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003143#Artikel102
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0003143
        artikel: '102'
        hoofdstuk: III
        afdeling: '12'
  - number: '135.2'
    text: |-
      Indien de schuldplichtige na de aanmaning in gebreke blijft, kan de invordering van het verschuldigde bedrag
      geschieden bij een door de ambtenaar uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
  - number: '135.3'
    text: |-
      De betekening en de tenuitvoerlegging van een dwangbevel geschieden door de zorg van de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1] en door de belastingdeurwaarder,
      bedoeld in [artikel 2, eerste lid, onderdeel j, van die wet][ref2] met toepassing van de [artikelen 13][ref3] en
      [14 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '14'
  - number: '135.4'
    text: |-
      Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref1] alsmede verrekenen op grond van [artikel 24 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '135.5'
    text: |-
      Met betrekking tot het verzet tegen de tenuitvoerlegging van een dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref1] van overeenkomstige toepassing met dien verstande dat in dat artikel
      voor "de ontvanger die het dwangbevel heeft uitgevaardigd" telkens moet worden gelezen: de met de tenuitvoerlegging
      van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '135.6'
    text: |-
      Met betrekking tot de kosten van aanmaning en verdere invordering zijn de [artikelen 6][ref1] en
      [7 van de Invorderingswet 1990][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel7
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '7'
  - number: '136'
    text: Onze Minister is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel136
  - number: '137'
    text: |-
      De medewerking van de bewaarder van het kadaster en de openbare registers bij de uitvoering van deze wet geschiedt
      kosteloos.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel137
  - number: '138.1'
    text: |-
      Na beëindiging der werkzaamheden draagt de herinrichtingscommissie alle stukken, op de herinrichting betrekking
      hebbende, over aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel138
  - number: '138.2'
    text: |-
      Na overdracht van de in het eerste lid bedoelde stukken wordt de herinrichtingscommissie door Ons ontbonden op
      voordracht van Onze Minister en Onze Minister van Volkshuisvesting en Ruimtelijke Ordening.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel138
  - number: '141.1'
    text: |-
      Deze wet kan worden aangehaald onder de titel: Herinrichtingswet Oost-Groningen en de Gronings-Drentse
      Veenkoloniën.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel141
  - number: '141.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#Artikel141
