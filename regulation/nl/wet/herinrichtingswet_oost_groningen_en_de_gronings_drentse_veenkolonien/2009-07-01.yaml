preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot de herinrichting
    van Oost-Groningen en de Gronings-Drentse Veenkoloniën;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003143/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: "Onze Minister": Onze Minister van Landbouw, Natuur en Voedselkwaliteit; "centrale
      commissie": de centrale cultuurtechnische commissie, bedoeld in artikel 3, eerste lid, van de Ruilverkavelingswet
      1954; "herinrichtingscommissie": de commissie, genoemd in [artikel 4, eerste lid][ref1]; "deelgebied": het gedeelte
      van Oost-Groningen en de Gronings-Drentse Veenkoloniën, bedoeld in [artikel 8][ref2]; "deelgebiedscommissie":
      de commissie, bedoeld in [artikel 4, zesde lid][ref3]; "herinrichtingsplan": het plan, bedoeld in
      [artikel 16, eerste lid][ref4]; "blok": geheel van in een herverkaveling begrepen onroerende zaken; "Oost-
      Groningen en de Gronings-Drentse Veenkoloniën": het gebied Oost-Groningen en de Gronings-Drentse Veenkoloniën,
      zoals dit in hoofdlijnen is aangegeven op de bij deze wet behorende kaart en door Ons nader zal worden vastgesteld;
      "stadsmeierrecht": elk altijddurend gebruiksrecht, dat voortvloeit uit een overeenkomst tussen de gemeente
      Groningen en een persoon aan wie daarbij door die gemeente een altijddurend gebruiksrecht is toegekend op aan de
      gemeente toebehorende onroerende zaken gelegen in Oost-Groningen en de Gronings-Drentse Veenkoloniën; "eigenaar":
      hij, die eigenaar is van een tot het blok behorende onroerende zaak en hij aan wie een recht van opstal, erfpacht,
      beklemming, vruchtgebruik, gebruik of bewoning toebehoort dan wel gerechtigd is tot een stadsmeierrecht, waaraan
      een in het blok begrepen onroerende zaak is onderworpen, met dien verstande, dat onder het recht van opstal niet
      wordt begrepen dat recht voor zover het betreft het leggen en houden van leidingen in, op of boven de onroerende
      zaak van een ander; "rechthebbende": de eigenaar en hij aan wie een niet onder de omschrijving van eigenaar
      genoemd beperkt recht toebehoort, waaraan een tot het blok behorende onroerende zaak is onderworpen, hij aan wie
      met betrekking tot zulk een zaak een recht van huur toebehoort of hij aan wie met betrekking tot zulk een zaak een
      recht als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref5] toebehoort; "landbouw": akkerbouw,
      weidebouw, veehouderij, pluimveehouderij, tuinbouw en bosbouw; "openbare registers": de openbare registers, bedoeld
      in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref6].


