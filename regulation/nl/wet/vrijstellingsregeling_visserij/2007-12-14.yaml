  - number: '2.1'
    text: |-
      1 Van het bepaalde in [artikel 6c, eerste lid, van het Reglement zee- en kustvisserij 1977][ref1] wordt
      vrijstelling verleend:

      a. voor het uitoefenen van de visserij met de boomkor met vaartuigen, andere dan vissersvaartuigen met een lengte
      over alles kleiner dan 8 meter, in de visserijzone, het zeegebied en de Westerschelde, alsmede voor het in deze
      wateren aan boord van zodanige vaartuigen aanwezig hebben van een boomkor;

      b. voor het uitoefenen van de riviervisserij met de boomkor met vaartuigen met een lengte over alles kleiner dan
      20 meter en met een motorvermogen van ten hoogste 221 kW waarmee uitsluitend de riviervisserij wordt uitgeoefend,
      alsmede voor het aan boord van zodanige vaartuigen aanwezig hebben van een boomkor.

      2 Van het bepaalde in
      [artikel 7, eerste lid, van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref2] wordt
      vrijstelling verleend voor het vissen in de visserijzone en het zeegebied:

      a. met vaartuigen met een lengte over alles kleiner dan 8 meter, voor zover het betreft de visserij met een
      boomkor;

      b. met vaartuigen met een lengte over alles kleiner dan 10 meter, voor zover het betreft de visserij met een
      bordennet.

      3 Van het bepaalde in [artikel 3, eerste lid, van de Regeling vangstbeperking][ref3] wordt vrijstelling verleend
      voor vaartuigen, andere dan vissersvaartuigen:

      a. met een lengte over alles kleiner dan 8 meter, voor zover het betreft het verbod om een boomkor aan boord te
      hebben in de visserijzone, het zeegebied en de Westerschelde;

      b. met een lengte over alles kleiner dan 10 meter, voor zover het betreft het verbod om een bordennet aan boord te
      hebben in de visserijzone, het zeegebied en de Westerschelde.

      4 De vrijstelling, bedoeld in [artikel 2.1, eerste lid, aanhef en onder a][ref4], wordt slechts verleend voor
      vaartuigen met één boomkor met een maximale breedte van 150 centimeter, gemeten tussen de uiteinden van de
      constructie, zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden uitgeschoven of verlengd.

      5 De vrijstellingen, bedoeld in het tweede en derde lid, worden slechts verleend voor vaartuigen met één boomkor
      als bedoeld in het vierde lid, of met één bordennet waarvan de hoogte van de visborden niet meer bedraagt dan
      70 centimeter en waarvan de lengte van de bovenpees, inclusief stroppen en kabels, niet meer bedraagt dan 225
      centimeter, gemeten vanaf de achterzijde van het ene tot de achterzijde van het andere bord.

      6 De vrijstelling, bedoeld in [artikel 2.1, onderdeel b][ref5], wordt slechts verleend

      a. aan een ondernemer te wiens naam het vaartuig in de Officiële lijst der Belgische Vissersvaartuigen, bedoeld in
      het ministeriële besluit van 21 februari 1934, is geregistreerd,

      b. voor vaartuigen:

        - met ten hoogste twee boomkorren waarvan de individuele lengte niet meer bedraagt dan 4.5 meter, gemeten tussen
      de uiteinden van de constructie, zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden
      uitgeschoven en verlengd,
        - ten behoeve waarvan aan de ondernemer, bedoeld in onderdeel a, een akte van consent is afgegeven door het
      Waterschoutsambt te Antwerpen voor de visserij op de Westerschelde als bedoeld in het Reglement van 20 mei 1843 ter
      uitvoering van artikel 9 van het Verdrag van 19 april 1839 betreffende de uitoefening van het recht der visscherij
      en van den vischhandel.

      7 In afwijking van het zesde lid, onderdeel a, eerste streepje, wordt voor de gerichte riviervisserij op garnalen
      de vrijstelling, bedoeld in [artikel 2.1, eerste lid, aanhef en onder b][ref6], verleend voor vaartuigen met ten
      hoogste twee boomkorren waarvan de individuele lengte niet meer bedraagt dan 12 meter, gemeten tussen de uiteinden
      van de constructie, zonder dat er voorzieningen zijn getroffen waardoor de boomkor kan worden uitgeschoven of
      verlengd.


