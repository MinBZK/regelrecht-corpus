      a. [Regeling vrijstelling sleepnetvisserij][ref1];

      b. [Vrijstellingsregeling Westerschelde][ref2];

      c. [Vrijstellingsregeling mossel- en oestervisserij][ref3];

      d. [Regeling van de Staatssecretaris van Landbouw en Visserij van 3 juni 1985, nr. J. 2746 (Stcrt. 106)][ref4];

      e. [Regeling vrijstelling verbod nachtvisserij][ref5];

