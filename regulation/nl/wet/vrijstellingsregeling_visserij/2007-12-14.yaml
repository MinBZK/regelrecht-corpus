  text: |-
    Gelet op de artikelen 3, eerste lid, onder a, en 6d van het Reglement zee- en kustvisserij 1977;

    Gelet op de artikelen 12 en 13 van de Beschikking visserij, visserijzone, zeegebied en kustwateren;

    Gelet op artikel 11 van het Reglement voor de Binnenvisserij;

    Gelet op artikel 2, tweede en derde lid, van de Regeling visserij-inspanning IJsselmeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. zeegebied: de als zodanig bij het [Besluit aanwijzing zeegebied en kustwateren 1970][ref1] aangewezen wateren;

      b. kustwateren: de als zodanig bij het [Besluit aanwijzing zeegebied en kustwateren 1970][ref2] aangewezen wateren;

      c. riviervisserij: visserij die op de Westerschelde ten oosten van de lijn van de lichtopstand de Nolle nabij
      Vlissingen naar de lichtopstand Nieuwe Sluis in Zeeuws Vlaanderen wordt uitgeoefend;

      d. bordennet: vistuig dat bestaat uit één net dat bij het vissen wordt opengehouden door twee aan het net verbonden
      visborden;

      e. handzeef: zeef met een lengte en breedte van ten minste 80 centimeter respectievelijk 60 centimeter, in de
      lengterichting voorzien van gladde draadvormige spijlen, die op gelijke hoogte en met een onderlinge afstand van
      ten minste 7 millimeter zijn aangebracht;

      f. functionaris: functionaris als bedoeld in
      [artikel 1 van de Regeling stelselmatige controle bij aanlanding 1988][ref3].

      g. visvak: een in een tussen het Rijk en de huurder gesloten overeenkomst tot verhuur van het visrecht
      nader aangeduid visgebied, waarin op grond van deze overeenkomst met vaste vistuigen als bedoeld in
      [artikel 3 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref4] mag worden gevist.


