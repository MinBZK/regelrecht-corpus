  - number: '2.2'
    text: |-
      1 Aan de vrijstellingen, bedoeld in [artikel 2.1, eerste lid, aanhef en onder a][ref1], en
      [artikel 2.1, tweede en derde lid][ref2], worden de volgende voorschriften verbonden:

      a. vissoorten als genoemd in de [bijlagen 2][ref3], [3][ref4] en [4 bij de Regeling vangstbeperking][ref5],
      met uitzondering van schar en bot gevangen in de bij die vissoorten genoemde wateren, dienen onmiddellijk na het
      ophalen ervan in hetzelfde water te worden teruggezet;

      b. indien de visserij op garnalen wordt uitgeoefend, dient de vangst direct na aan boord te zijn gehaald, te worden
      gesorteerd met behulp van een handzeef;

      c. het is verplicht een handzeef aan boord te hebben van het vaartuig waarmee de garnalenvisserij wordt
      uitgeoefend.

      2 Aan de vrijstelling, bedoeld in [artikel 2.1, eerste lid, aanhef en onder b][ref6], worden de volgende
      voorschriften verbonden:

      a. [Verordening (EG) nr. 850/98](31998R0850) van de Raad van de Europese Unie van 30 maart 1998 voor de
      instandhouding van visbestanden via technische maatregelen voor de bescherming van jonge exemplaren van mariene
      organismen (PbEG L125) wordt met uitzondering van artikel 29 bij de uitoefening van de visserij in acht genomen;

      b. aanlandingen in Nederlandse havens vinden slechts overeenkomstig de
      [Regeling stelselmatige controle bij aanlanding 1988][ref7] plaats;

      c. bij aanlanding in een Nederlandse haven is de ondernemer verplicht onverwijld maar uiterlijk binnen een half uur
      na aanlanding per vissoort opgave van de vangsthoeveelheden te doen.

      3 De opgave, bedoeld in het tweede lid, onderdeel c, vindt plaats door middel van het indienen van het logboek-,
      tevens vangstopgaveformulier, bedoeld in bijlage I van [verordening (EEG) nr. 2807/83](31983R2807) van de Commissie
      van de Europese Gemeenschappen van 22 september 1983 houdende uitvoeringsbepalingen inzake de registratie van
      gegevens over de visvangst van de Lid-Staten (PbEG L 276), waarop per vissoort de vangsthoeveelheden in het
      gedeelte van het formulier dat betrekking heeft op de aangifte van aanvoer, zijn ingevuld.

      4 Het indienen van het logboek-, tevens vangstopgaveformulier, bedoeld in het derde lid, vindt plaats door
      overhandiging aan een functionaris of aan een ambtenaar van de Algemene Inspectiedienst van het Ministerie van
      Landbouw, Natuur en Voedselkwaliteit of deponering van het formulier in een opgavebus als bedoeld in de Regeling
      eisen, administratie en registratie inzake uitoefening visserij.


