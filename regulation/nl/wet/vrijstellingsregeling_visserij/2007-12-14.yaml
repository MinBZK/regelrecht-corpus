        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.7'
    text: |-
      Van het bepaalde in [artikel 3 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref1] wordt
      vrijstelling verleend aan de rechthebbende op het visrecht met vaste vistuigen in een visvak, voor het vissen in
      dit visvak met die vistuigen waarop het visrecht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel3
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '3'
  - number: '2.8'
    text: |-
      1 Aan de vrijstelling, bedoeld in [artikel 2.7][ref1] zijn de volgende voorschriften verbonden:

      a. De vistuigen zijn boven het waterpeil voorzien van een bordje, waarop duidelijk leesbaar het letterteken
      en nummer van het vissersvaartuig is vermeld dan wel, voor zover zonder vaartuig wordt gevist, de naam en
      adresgegevens van de visser;

      b. Een fuik is voorzien van een deugdelijke keerwant met een maaswijdte van 14 centimeter, aangebracht in de
      voorste hoepel of voorste inkeling;

      c. Elke maas van iedere rand van het keerwant is dusdanig aan het basisnet van de fuik bevestigd, dat alle
      organismen in de fuik door de mazen van het keerwant heen moeten kunnen komen;

      d. Eidragende kreeften die zijn gevangen in de Oosterschelde, pas verschaalde kreeften die zijn gevangen in de
      Oosterschelde en kreeften die zijn gevangen in de Oosterschelde tussen 15 juli en 1 april, worden onmiddellijk na
      de vangst teruggezet;

      e. De vistuigen worden in spuikommen en havens minimaal 10 meter en in de overige visvakken minimaal 25 meter vanaf
      de scheidingslijn van 2 visvakken geplaatst;

      f. Indien overeenstemming is bereikt met de rechthebbende op het visrecht in het naastgelegen visvak over de
      afstand waarop de vistuigen vanaf de scheidingslijn tussen de visvakken worden geplaatst, worden de vistuigen,
      in afwijking van het bepaalde in onderdeel e, minimaal de overeengekomen afstand vanaf de scheidslijn tussen de
      visvakken geplaatst.

      2 Onderdeel b is niet van toepassing op permanent onder water staande schietfuiken in de kustwateren, genoemd in
      [artikel 2, tweede tot en met het zevende lid, van het Besluit aanwijzing zeegebied en kustwateren 1970][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020734#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.8
