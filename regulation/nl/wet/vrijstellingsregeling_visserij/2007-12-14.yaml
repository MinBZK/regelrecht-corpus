  - number: '2.3'
    text: |-
      Vaartuigen ten aanzien waarvan de in [artikel 2.1, eerste lid, aanhef en onder b][ref1], bedoelde vrijstelling
      is verleend, worden vermeld op [bijlage 1][ref2] van deze regeling die op voordracht van de bevoegde Belgische
      autoriteiten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020734#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0020734
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.3
