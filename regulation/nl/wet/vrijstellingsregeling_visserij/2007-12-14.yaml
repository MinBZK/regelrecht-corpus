  - number: '2.4'
    text: |-
      1 Van het bepaalde in [artikel 4 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref1] wordt
      vrijstelling verleend voor het vissen met enig vistuig geschikt voor het vangen van:

      a. mosselen en zeesterren door de visrechthebbende op de mosselpercelen gelegen in de kustwateren;

      b. mosselen en zeesterren door de visrechthebbende dan wel degene die daartoe toestemming heeft gekregen van de
      visrechthebbende op verwaterpercelen;

      c. oesters door de visrechthebbende op de oesterpercelen in de Oosterschelde.

      2 Van het bepaalde in [artikel 9 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref2]
      wordt vrijstelling verleend voor zover het betreft het uitzaaien van mosselen, afkomstig uit de Waddenzee, in de
      Oosterschelde aan:

      a. de visrechthebbende op de mosselpercelen gelegen in de kustwateren;

      b. de visrechthebbende dan wel degene die daartoe toestemming heeft gekregen van de visrechthebbende op
      verwaterpercelen gelegen in de Oosterschelde.


      [ref1]: https://wetten.overheid.nl/BWBR0003150#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003150#Artikel9
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0003150
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0003150
        artikel: '9'
  - number: '2.5'
    text: |-
      De vrijstellingen, bedoeld in [artikel 2.4][ref1], worden slechts verleend voor zover het betreft het vissen met:

      a. een vissersvaartuig;

      b. korren, waarvan de opening niet breder is dan 1.90 meter; en

      c. vistuigen waarmee geen schelpdieren kunnen worden opgezogen.


      [ref1]: https://wetten.overheid.nl/BWBR0020734#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0020734
        artikel: '2.4'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '2.6'
    text: |-
      Onverminderd het bepaalde in [artikel 2.5][ref1] is het vissen van mosselen, zeesterren en oesters, met
      uitzondering van het vissen op verwaterpercelen, verboden:

      a. tussen zonsondergang en zonsopgang;

      b. op zaterdagen en zondagen en algemeen erkende christelijke feestdagen;

      c. bij een zicht van 250 meter of minder.


      [ref1]: https://wetten.overheid.nl/BWBR0020734#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel2.6
