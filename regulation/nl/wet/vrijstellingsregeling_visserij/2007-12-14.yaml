  - number: '3.1'
    text: |-
      Van het bepaalde in [artikel 2, eerste lid][ref1] en
      [artikel 5, eerste lid, van het Reglement voor de Binnenvisserij 1985][ref2] wordt vrijstelling verleend voor zover
      het betreft het vissen met de oesterkor in het Grevelingenmeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009027#Artikel5
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009027
        artikel: '5'
  - number: '3.2'
    text: |-
      Van het bepaalde in [artikel 7, eerste lid, van het Reglement voor de binnenvisserij 1985][ref1] (Stb. 283) wordt
      vrijstelling verleend voor zover het betreft het vissen met de hengel tussen twee uur na zonsondergang en één uur
      voor zonsopgang in de wateren die zijn vermeld in [bijlage 2][ref2] van deze regeling in de periode van 1 september
      tot en met 31 mei.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020734
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020734
  - number: '3.3'
    text: |-
      1 Van het bepaalde in [artikel 4, tweede lid, van het Reglement voor de binnenvisserij 1985][ref1]
      wordt voor de spieringvisserij op het IJsselmeer een vrijstelling verleend voor de periode
      die door de Minister van Landbouw, Natuur en Voedselkwaliteit kan worden vastgesteld krachtens
      [artikel 2, vierde lid, van de Regeling IJsselmeervisserij][ref2].

      2 Vis van andere soorten dan spiering dient onmiddellijk nadat deze is opgehaald weer in hetzelfde water te worden
      teruggezet.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005886#Artikel2
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0009027
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005886
        artikel: '2'
  - number: '3.4'
    text: |-
      Aan de aangeslotenen bij de Coöperatieve Producentenorganisatie Nederlandse Vissersbond-IJsselmeer U.A. wordt
      vrijstelling verleend als bedoeld in [artikel 2, tweede lid, van de Regeling visserij-inspanning IJsselmeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008072#Artikel2
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0008072
        artikel: '2'
  - number: '3.5'
    text: |-
      Van het bepaalde in [artikel 6, eerste lid, onderdeel a, van het Reglement voor de binnenvisserij 1985][ref1]
      wordt vrijstelling verleend voor zover het betreft het vissen met de hengel, geaasd met enig kunstaas, in het
      Oostvoornsemeer.


      [ref1]: https://wetten.overheid.nl/BWBR0009027#Artikel6
    url: https://wetten.overheid.nl/BWBR0020734/2007-12-14#Artikel3.5
