valid_from: '1997-05-01'
bwb_id: BWBR0003734
url: https://wetten.overheid.nl/BWBR0003734/1997-05-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheid te openen tot het stellen van regelen
    op het gebied van de prijzen van goederen en diensten in geval van buitengewone omstandigheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: goederen: roerende
      of onroerende zaken of vermogensrechten; diensten: alle diensten, in de ruimste zin, met inbegrip van de
      verrichtingen, welke het voorwerp zijn van een verzekerings- of garantieovereenkomst, doch met uitzondering van
      die, welke het voorwerp zijn van een arbeidsovereenkomst; Onze Minister: Onze Minister van Economische Zaken;
      College: het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder prijzen niet verstaan de vergoedingen
      voor diensten op het gebied van het bankwezen, in de ruimste zin, en van de geld- en kapitaalmarkt, voor zover zij
      het karakter van een rentevergoeding dragen.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel1
  - number: '2'
    text: |-
      De bij deze wet aan Onze Minister van Economische Zaken verleende bevoegdheden worden door deze uitgeoefend in
      overeenstemming met Onze Minister, wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, voor het gehele land of een gedeelte daarvan de [artikelen 5][ref2] tot en met [15][ref3] in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003734#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003734#Artikel15
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003734
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003734
        artikel: '15'
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel3
  - number: '16.1'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen, die, zolang de verbinding tussen
      Onze Minister en enig gebied verbroken is, in dat gebied met inachtneming van de bij die maatregel gestelde
      regelen de bevoegdheden uitoefenen, welke krachtens deze wet, de [Distributiewet 1939][ref1] (*Stb.* 633),
      de [Hamsterwet][ref2] (*Stb.* 1962, 542), de [Noodwet voedselvoorziening][ref3] (*Stb.* 1962, 566), de
      [Vorderingswet 1962][ref4] (*Stb.* 587), de [Landbouwwet][ref5] (*Stb.* 1957, 342) en de [In- en uitvoerwet][ref6]
      (*Stb.* 1962, 295) aan Onze Minister toekomen. Ons besluit wordt mede in de *Staatscourant* bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001997
      [ref2]: https://wetten.overheid.nl/BWBR0002389
      [ref3]: https://wetten.overheid.nl/BWBR0002392
      [ref4]: https://wetten.overheid.nl/BWBR0002393
      [ref5]: https://wetten.overheid.nl/BWBR0002252
      [ref6]: https://wetten.overheid.nl/BWBR0002376
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel16
    references:
      - id: ref1
