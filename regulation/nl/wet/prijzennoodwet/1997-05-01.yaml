  - number: '17'
    text: Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel17
  - number: '20'
    text: |-
      Informatie, verkregen op grond van deze wet, wordt, voor zover die betrekking heeft op afzonderlijke natuurlijke
      personen of rechtspersonen, dan wel daaruit gevolgtrekkingen ten aanzien van zodanige personen kunnen worden
      gemaakt, zonder toestemming van die personen niet verstrekt aan anderen dan degenen, die belast zijn met de
      uitvoering van een of meer bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel20
  - number: '23.1'
    text: 'Deze wet kan worden aangehaald als: Prijzennoodwet.'
    url: https://wetten.overheid.nl/BWBR0003734/1997-05-01#Artikel23
  - number: '23.2'
    text: |-
      Met uitzondering van de [artikelen 5][ref1]-[15][ref2] treedt zij in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003734#Artikel5
