  - number: '16.2'
    text: |-
      Bij die maatregel worden tevens de autoriteiten aangewezen, die, zolang de verbinding tussen een Onzer andere bij
      de uitvoering van deze wet, de [Vorderingswet 1962][ref1] of de [In- en uitvoerwet][ref2] betrokken Ministers,
      niet zijnde Onze Minister-President of Onze Minister van Landbouw en Visserij, en enig gebied verbroken is, in dat
      gebied met inachtneming van de bij die maatregel gestelde regelen de bevoegdheden uitoefenen, welke krachtens deze
      wet, de [Vorderingswet 1962][ref3] en de [In- en uitvoerwet][ref4] aan Onze betrokken Minister toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002393
      [ref2]: https://wetten.overheid.nl/BWBR0002376
      [ref3]: https://wetten.overheid.nl/BWBR0002393
