  - number: '20'
    text: |-
      Informatie, verkregen op grond van deze wet, wordt, voor zover die betrekking heeft op afzonderlijke natuurlijke
      personen of rechtspersonen, dan wel daaruit gevolgtrekkingen ten aanzien van zodanige personen kunnen worden
      gemaakt, zonder toestemming van die personen niet verstrekt aan anderen dan degenen, die belast zijn met de
      uitvoering van een of meer bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel20
  - number: '23'
    text: |-
      1 Deze wet kan worden aangehaald als: Prijzennoodwet.

      2 Met uitzondering van de [artikelen 5-15][ref1] treedt zij in werking met ingang van de dag na de datum van
      uitgifte van het *Staatsblad*, waarin zij wordt geplaatst.

      3 De [artikelen 5 tot en met 15][ref2] treden in werking op een bij koninklijk besluit te bepalen tijdstip.


