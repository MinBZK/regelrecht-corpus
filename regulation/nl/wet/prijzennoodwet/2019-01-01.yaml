        artikel: '8'
  - number: '5'
    text: |-
      Onze Minister kan, voor zover de binnenlandse markt betreft, regelen vaststellen, strekkende tot de beheersing van
      de prijzen van goederen en diensten.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel5
  - number: '8'
    text: |-
      1 Onze Minister kan, ter bevordering van een bevredigende ontwikkeling van de prijzen van goederen en diensten,
      ten aanzien van een door hem aangewezen categorie van ondernemers een prijzenfonds instellen en met betrekking
      tot zodanig fonds in overeenstemming met Onze Minister van Financiën regelen vaststellen. [Artikel 7][ref1] is van
      overeenkomstige toepassing.

      2 In de in het eerste lid bedoelde regelen kan worden bepaald, dat een fonds afzonderlijk wordt beheerd door Onze
      Minister of door een in die regelen aangewezen orgaan, en kunnen voorschriften worden gegeven met betrekking tot
      dit beheer.

      3 In zodanige regelen kan worden afgeweken van het bij of krachtens de [artikelen 4.6 tot en met 4.8][ref2] en
      [4.20, eerste lid, aanhef en onderdeel f, van de Comptabiliteitswet 2016][ref3] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003734#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel4.6
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel4.20
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel8
