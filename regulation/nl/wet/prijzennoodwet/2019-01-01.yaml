preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheid te openen tot het stellen van regelen
    op het gebied van de prijzen van goederen en diensten in geval van buitengewone omstandigheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      goederen: roerende of onroerende zaken of vermogensrechten;

      diensten: alle diensten, in de ruimste zin, met inbegrip van de verrichtingen, welke het voorwerp zijn van
      een verzekerings- of garantieovereenkomst, doch met uitzondering van die, welke het voorwerp zijn van een
      arbeidsovereenkomst;

      Onze Minister: Onze Minister van Economische Zaken en Klimaat.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder prijzen niet verstaan de vergoedingen
      voor diensten op het gebied van het bankwezen, in de ruimste zin, en van de geld- en kapitaalmarkt, voor zover zij
      het karakter van een rentevergoeding dragen.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel1
  - number: '2'
    text: |-
      De bij deze wet aan Onze Minister van Economische Zaken en Klimaat verleende bevoegdheden worden door deze
      uitgeoefend in overeenstemming met Onze Minister, wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of
      een gedeelte daarvan de [artikelen 5][ref3] en [8][ref4] gezamenlijk of afzonderlijk in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


