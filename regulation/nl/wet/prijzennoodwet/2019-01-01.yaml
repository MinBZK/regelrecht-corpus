$id: prijzennoodwet
regulatory_layer: WET
publication_date: '2017-04-07'
valid_from: '2019-01-01'
bwb_id: BWBR0003734
url: https://wetten.overheid.nl/BWBR0003734/2019-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de mogelijkheid te openen tot het stellen van regelen
    op het gebied van de prijzen van goederen en diensten in geval van buitengewone omstandigheden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: goederen: roerende
      of onroerende zaken of vermogensrechten; diensten: alle diensten, in de ruimste zin, met inbegrip van de
      verrichtingen, welke het voorwerp zijn van een verzekerings- of garantieovereenkomst, doch met uitzondering van
      die, welke het voorwerp zijn van een arbeidsovereenkomst; Onze Minister: Onze Minister van Economische Zaken en
      Klimaat.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden onder prijzen niet verstaan de vergoedingen
      voor diensten op het gebied van het bankwezen, in de ruimste zin, en van de geld- en kapitaalmarkt, voor zover zij
      het karakter van een rentevergoeding dragen.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel1
  - number: '2'
    text: |-
      De bij deze wet aan Onze Minister van Economische Zaken en Klimaat verleende bevoegdheden worden door deze
      uitgeoefend in overeenstemming met Onze Minister, wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, voor het gehele land of
      een gedeelte daarvan de [artikelen 5][ref3] en [8][ref4] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003734#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003734#Artikel8
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003734
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003734
        artikel: '8'
  - number: '3.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
  - number: '3.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
  - number: '3.5'
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
  - number: '3.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel3
  - number: '5'
    text: |-
      Onze Minister kan, voor zover de binnenlandse markt betreft, regelen vaststellen, strekkende tot de beheersing van
      de prijzen van goederen en diensten.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel5
  - number: '8.1'
    text: |-
      Onze Minister kan, ter bevordering van een bevredigende ontwikkeling van de prijzen van goederen en diensten, ten
      aanzien van een door hem aangewezen categorie van ondernemers een prijzenfonds instellen en met betrekking tot
      zodanig fonds in overeenstemming met Onze Minister van Financiën regelen vaststellen. [Artikel 7][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003734#Artikel7
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003734
        artikel: '7'
  - number: '8.2'
    text: |-
      In de in het eerste lid bedoelde regelen kan worden bepaald, dat een fonds afzonderlijk wordt beheerd door Onze
      Minister of door een in die regelen aangewezen orgaan, en kunnen voorschriften worden gegeven met betrekking tot
      dit beheer.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel8
  - number: '8.3'
    text: |-
      In zodanige regelen kan worden afgeweken van het bij of krachtens de [artikelen 4.6 tot en met 4.8][ref1] en
      [4.20, eerste lid, aanhef en onderdeel f, van de Comptabiliteitswet 2016][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '4'
  - number: '16.1'
    text: |-
      Bij algemene maatregel van bestuur worden de autoriteiten aangewezen die krachtens algemeen mandaat of krachtens
      mandaat voor een bepaald geval en met inachtneming van de bij die maatregel gestelde regelen, in enig gebied de
      bevoegdheden uitoefenen welke krachtens deze wet, de [Hamsterwet][ref1], de [Noodwet voedselvoorziening][ref2], de
      [Vorderingswet][ref3], de [Landbouwwet][ref4] en de [Algemene douanewet][ref5] toekomen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002389
      [ref2]: https://wetten.overheid.nl/BWBR0002392
      [ref3]: https://wetten.overheid.nl/BWBR0002393
      [ref4]: https://wetten.overheid.nl/BWBR0002252
      [ref5]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002389
      - id: ref2
        bwb_id: BWBR0002392
      - id: ref3
        bwb_id: BWBR0002393
      - id: ref4
        bwb_id: BWBR0002252
      - id: ref5
        bwb_id: BWBR0023746
  - number: '16.2'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden tevens de autoriteiten aangewezen die
      krachtens algemeen mandaat of krachtens mandaat voor een bepaald geval en met inachtneming van de bij die maatregel
      gestelde regelen, in enig gebied de bevoegdheden uitoefenen welke krachtens deze wet, de [Vorderingswet][ref1] en
      de [Algemene douanewet][ref2] toekomen aan een van Onze andere Ministers, niet zijnde Onze Minister-President.


      [ref1]: https://wetten.overheid.nl/BWBR0002393
      [ref2]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002393
      - id: ref2
        bwb_id: BWBR0023746
  - number: '16.3'
    text: |-
      Een algemeen mandaat als bedoeld in het eerste en het tweede lid wordt niet voor onbepaalde tijd gegeven. Zij bevat
      tenminste de naam of de functie van de mandataris, de bevoegdheid die wordt gemandateerd en de periode waarin het
      mandaat geldt.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel16
  - number: '16.4'
    text: |-
      Een mandaat voor een bepaald geval als bedoeld in het eerste en het tweede lid bevat tenminste de naam of de
      functie van de mandataris, de bevoegdheid die wordt gemandateerd, de periode waarin het mandaat geldt en het geval
      waarin de bevoegdheid kan worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel16
  - number: '20'
    text: |-
      Informatie, verkregen op grond van deze wet, wordt, voor zover die betrekking heeft op afzonderlijke natuurlijke
      personen of rechtspersonen, dan wel daaruit gevolgtrekkingen ten aanzien van zodanige personen kunnen worden
      gemaakt, zonder toestemming van die personen niet verstrekt aan anderen dan degenen, die belast zijn met de
      uitvoering van een of meer bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel20
  - number: '23.1'
    text: 'Deze wet kan worden aangehaald als: Prijzennoodwet.'
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel23
  - number: '23.2'
    text: |-
      Met uitzondering van de [artikelen 5-15][ref1] treedt zij in werking met ingang van de dag na de datum van uitgifte
      van het *Staatsblad*, waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003734#Artikel5
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003734
        artikel: '5'
  - number: '23.3'
    text: |-
      De [artikelen 5 tot en met 15][ref1] treden in werking op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003734#Artikel5
    url: https://wetten.overheid.nl/BWBR0003734/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003734
        artikel: '5'
