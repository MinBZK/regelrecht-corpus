  - number: '16'
    text: |-
      1 Bij algemene maatregel van bestuur worden de autoriteiten aangewezen die krachtens algemeen mandaat of krachtens
      mandaat voor een bepaald geval en met inachtneming van de bij die maatregel gestelde regelen, in enig gebied de
      bevoegdheden uitoefenen welke krachtens deze wet, de [Hamsterwet][ref1], de [Noodwet voedselvoorziening][ref2], de
      [Vorderingswet][ref3], de [Landbouwwet][ref4] en de [Algemene douanewet][ref5] toekomen aan Onze Minister.

      2 Bij de algemene maatregel van bestuur, bedoeld in het eerste lid, worden tevens de autoriteiten aangewezen die
      krachtens algemeen mandaat of krachtens mandaat voor een bepaald geval en met inachtneming van de bij die maatregel
      gestelde regelen, in enig gebied de bevoegdheden uitoefenen welke krachtens deze wet, de [Vorderingswet][ref6] en
      de [Algemene douanewet][ref7] toekomen aan een van Onze andere Ministers, niet zijnde Onze Minister-President.

      3 Een algemeen mandaat als bedoeld in het eerste en het tweede lid wordt niet voor onbepaalde tijd gegeven. Zij
      bevat tenminste de naam of de functie van de mandataris, de bevoegdheid die wordt gemandateerd en de periode waarin
      het mandaat geldt.

      4 Een mandaat voor een bepaald geval als bedoeld in het eerste en het tweede lid bevat tenminste de naam of de
      functie van de mandataris, de bevoegdheid die wordt gemandateerd, de periode waarin het mandaat geldt en het geval
      waarin de bevoegdheid kan worden uitgeoefend.


