  - number: '6'
    text: |-
      Van toezicht van een dierenarts van het centrum als bedoeld in Bijlage D, Hoofdstuk I, onderdeel I, punt 1, van
      [richtlijn 92/65/EEG](31992L0065) is sprake, indien die dierenarts overeenkomstig de krachtens [artikel 5][ref1]
      vastgestelde procedures en protocollen erop toeziet dat de voorschriften bedoeld in [artikel 2][ref2], [3][ref3]
      en [4][ref4] in acht worden genomen en dat door betrokkenen de krachtens [artikel 5][ref5] vastgestelde procedures
      en protocollen correct worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012615#Artikel2
