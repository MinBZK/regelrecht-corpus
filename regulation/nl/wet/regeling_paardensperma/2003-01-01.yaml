  - number: '7'
    text: |-
      1 Aan Bijlage D, Hoofdstuk I, onderdeel I, punt 2, van [richtlijn 92/65/EEG](31992L0065) is voldaan, indien
      het paardenspermawincentrum binnen de kadastrale eenheden waarop het paardenspermawincentrum is gesitueerd, de
      beschikking heeft over:

      a. een stalruimte voor de dagelijkse huisvesting en verzorging van de paardachtigen, die op efficiënte wijze fysiek
      is afgesloten van de overige ruimten binnen het paardenspermawincentrum;

      b. een voorziening voor de tijdelijke afzondering van hengsten die wegens veterinaire redenen van productie zijn
      uitgesloten, die op efficiënte wijze fysiek is afgesloten van de in onderdeel a bedoelde stalruimte;

      c. een voor het winnen van sperma ingerichte ruimte, die zich bevindt in de in onderdeel a bedoelde stalruimte,
      dan wel in een afzonderlijke hiertoe bestemde ruimte, die op efficiënte wijze fysiek is afgesloten van de overige
      ruimten binnen het paardenspermawincentrum en waarvan zich in de directe omgeving faciliteiten voor de reiniging en
      ontsmetting van de bij de spermawinning te gebruiken voorzieningen bevinden;

      d. een voorziening voor de reiniging en ontsmetting van de gebruikte materialen, en

      e. een ruimte voor de behandeling van sperma met een voorziening voor de opslag sperma, welke ruimte op efficiënte
      wijze is fysiek afgesloten van de in onderdeel c bedoelde ruimte.

      2 In afwijking van het eerste lid kan de onder e bedoelde ruimte zich bevinden op een afzonderlijke kadastrale
      eenheid.

      3 In afwijking van het eerste lid is de onder b bedoelde voorziening niet vereist, indien de in
      [artikel 5, eerste lid][ref1], bedoelde voorschriften, procedures en protocollen erin voorzien dat hengsten
      die wegens veterinaire redenen van productie zijn uitgesloten terstond van het paardenspermawincentrum worden
      afgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel5
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '5'
  - number: '8'
    text: >-
      1 Het paardenspermawincentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, onderdeel
      II, punt 2, van [richtlijn 92/65/EEG](31992L0065), over een door de keuringsdierenarts en de geaccrediteerde
      keuringsinstantie vanuit één plaats op het paardenspermawincentrum te raadplegen register dat dagelijks wordt
      bijgehouden en dat zodanig is ingericht, dat daaruit te allen tijde op eenvoudige wijze met betrekking tot elk dier
      kan worden afgeleid:


      a. het ras;


      b. de geboortedatum;


      c. het identificatienummer;


      d. de gegevens inzake de uitgevoerde vaccinaties;


      e. de gegevens uit het ziekte/gezondheidsdossier;


      f. de datum van toelating op het paardenspermawincentrum;


      g. het beslag of het bedrijf van herkomst;


      h. de verplaatsingen, onder vermelding van de datum van aankomst in of vertrek uit het paardenspermawincentrum, en


      i. de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende in Bijlage D,
      Hoofdstuk II, onder A van [richtlijn 92/65/EEG](31992L0065) voorgeschreven tests.


      2 De in het eerste lid bedoelde gegevens worden 3 jaar bewaard.


      3 Aan Bijlage D, Hoofdstuk I, onderdeel II, punt 7, van [richtlijn 92/65/EEG](31992L0065) is voldaan, indien op de
      verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens zijn vermeld:


      a. het identificatienummer van het betrokken sperma;


      b. de datum waarop het sperma is verkregen;


      c. de identiteit van de hengst waarvan het sperma is gewonnen, en


      d. het identificatienummer van het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel8
  - number: '9'
    text: >-
      Als laboratorium, bedoeld in Bijlage D, hoofdstuk II, onderdeel A, punt 6, van [richtlijn 92/65/EEG](31992L0065),
      wordt erkend het Instituut voor Dierhouderij en Diergezondheid te Lelystad.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel9
  - number: '10'
    text: >-
      1 De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger laat één maal
      per twaalf maanden ten genoegen van de keuringsdierenarts door een geaccrediteerde keuringsinstantie een
      bedrijfsrapport opstellen waaruit blijkt in hoeverre op het paardenspermawincentrum wordt voldaan aan de ingevolge
      deze regeling geldende voorschriften en welke voorzieningen eventueel zouden moeten worden getroffen, indien het
      bedrijf niet of niet volledig aan die voorschriften voldoet.


      2 Een exemplaar van het in het eerste lid bedoelde bedrijfsrapport wordt op het paardenspermawincentrum bewaard.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel10
  - number: '11'
    text: >-
      1 De eigenaar of exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      vanuit één plaats op het paardenspermawincentrum te raadplegen register, dat dagelijks wordt bijgehouden en
      dat zodanig is ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking elke winning kan worden
      afgeleid:


      a. het aan de winning toegekende identificatienummer;


      b. de datum van de winning en behandeling;


      c. de eventuele calamiteiten die zich bij de winning hebben voorgedaan.


      d. het identificatienummer van de hengst waarvan het sperma is gewonnen, en


      e. het aantal doses waarin de winning is verdeeld.


      2 De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat de laatste dosis van de betrokken
      winning van het paardenspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel11
  - number: '12'
    text: >-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      administratie waarmee de keuringsdierenarts en de geaccrediteerde keuringsinstantie op elk moment een overzicht
      kan worden geboden van het sperma dat in het paardenspermawincentrum gewonnen dan wel opgeslagen is, en die de
      tracering van contacten tussen het paardenspermawincentrum met inseminatoren, dierenartsen, vervoerders, handelaren
      en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel12
  - number: '13'
    text: |-
      1 De in [artikel 12][ref1] bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige
      wijze met betrekking tot elke transactie kan worden afgeleid:

      a. de datum van de transactie;

      b. het identificatienummer van het betrokken sperma;

      c. het ontvangen of afgeleverde aantal doses sperma;

      d. naam en adres van de ontvanger of de leverancier;

      e. het paardenspermawincentrum waar het sperma gewonnen is, en

      f. indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel c][ref2], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref3], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.

      2 Voor zover het sperma op het paardenspermawincentrum is geïnsemineerd, is de in [artikel 12][ref4] bedoelde
      administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking tot elke
      inseminatie kan worden afgeleid:

      a. de datum van de inseminatie;

      b. het identificatienummer van het betrokken sperma, en

      c. het identificatienummer van het geïnsemineerde dier.

      3 De in het eerste en tweede lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van het
      paardenspermawincentrum is afgevoerd respectievelijk op het paardenspermawincentrum is geïnsemineerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9.5
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel9.6
      [ref4]: https://wetten.overheid.nl/BWBR0012615#Artikel12
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '12'
      - id: ref2
