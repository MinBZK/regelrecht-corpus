        artikel: '12'
  - number: '14'
    text: |-
      Behoudens indien het sperma bestemd is om overeenkomstig de
      [Regeling handel levende dieren en levende producten][ref1] buiten Nederland te worden gebracht, gaat een partij
      sperma bij afvoer van de kadastrale eenheid, waarop het paardenspermawincentrum is gelegen, vergezeld van een
      geleidebiljet, waarop met betrekking tot de partij de volgende gegevens zijn vermeld:

      a. de datum van afvoer;

      b. het identificatienummer van het betrokken sperma;

      c. het identificatienummer van de hengst waarvan het sperma is gewonnen;

      d. het aantal doses sperma;

      e. de naam en het adres van de ontvanger, en

      f. indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel c][ref2], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref3], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9.5
      [ref3]: https://wetten.overheid.nl/BWBR0007049#Artikel9.6
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9.5'
      - id: ref3
        bwb_id: BWBR0007049
        artikel: '9.6'
  - number: '15'
    text: |-
      Het is de eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger
      uitsluitend toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in
      [artikel 8, derde lid][ref1], bedoelde gegevens zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel8
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '8'
  - number: '16'
    text: |-
      1 Degene die paardensperma vervoert of verhandelt dient te beschikken over een administratie waarmee de
      keuringsdierenarts op elk moment een overzicht kan worden geboden van het sperma dat hij in voorraad heeft en
      heeft gehad en die de tracering van contacten met het paardenspermawincentrum waar het sperma gewonnen alsmede met
      inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt.

      2 [Artikel 13, eerste en derde lid][ref1], is op de in het eerste lid bedoelde administratie van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel13
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '13'
  - number: '17'
    text: |-
      Behoudens indien het sperma bestemd is om overeenkomstig de
      [Regeling handel levende dieren en levende producten][ref1] buiten Nederland te worden gebracht, is een partij
      sperma gedurende het vervoer en de verhandeling voorzien van het in [artikel 14][ref2] bedoelde geleidebiljet.


      [ref1]: https://wetten.overheid.nl/BWBR0007049
      [ref2]: https://wetten.overheid.nl/BWBR0012615#Artikel14
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007049
      - id: ref2
        bwb_id: BWBR0012615
        artikel: '14'
  - number: '18'
    text: >-
      Het uitsluitend toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de navolgende
      gegevens zijn vermeld:


      a. het identificatienummer van het betrokken sperma;


      b. de datum van de winning;


      c. de identiteit van de hengst waarvan het sperma is gewonnen, en


      d. het identificatienummer van het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel18
  - number: '19'
    text: >-
      1 Degene die ingevolge deze regeling gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.


      2 Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens
      bekend zijn bij degene die zij ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel19
  - number: '20'
    text: >-
      Een wijziging van een of meer onderdelen van [richtlijn 92/65/EEG](31992L0065) gaat voor de toepassing van de
      artikelen van deze regeling, waarin naar die onderdelen wordt verwezen, gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel20
  - number: '21'
    text: |-
      [Artikel 5, eerste lid][ref1], is gedurende de periode van 9 maanden vanaf het tijdstip van inwerkingtreding
      van deze regeling niet van toepassing op de eigenaar of de exploitant van een paardenspermawincentrum die op het
      tijdstip van inwerkingtreding van deze regeling beschikt over een ingevolge artikel 2, tweede lid, onderdeel a,
      van de Verordening K.I. bij dieren 1985 door het Landbouwschap verleende toestemming tot het winnen van sperma
      van paarden.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel5
