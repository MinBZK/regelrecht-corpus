preamble:
  text: >-
    Gelet op de artikelen 15 en 18 van het Besluit eisen dierlijk sperma en spermawincentra;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            besluit:

              Besluit eisen dierlijk sperma en spermawincentra;



            b
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            c
            VWA:

              de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);



            d
            keuringsdierenarts:

              dierenarts verbonden aan de VWA;



            e
            winning:

              hoeveelheid sperma die op een bepaald moment van een donor is verkregen;



            f
            dierenarts van het centrum:

              dierenarts verbonden aan het paardenspermawincentrum;



            g
            hengst:

              geslachtsrijpe paardachtige van het mannelijk geslacht die kennelijk bestemd is voor de fokkerij;



            h

              [richtlijn 92/65/EEG](31992L0065):

              [Richtlijn 92/65/EEG](31992L0065) van de Raad van Europese Gemeenschappen van 13 juli 1992 tot vaststelling
      van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren,
      sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke
      communautaire regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG
      L 268);



            i
            geaccrediteerde keuringsinstantie:

              keuringsinstantie, waarvan
              door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat
      de keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op het opstellen van het in artikel 10 genoemde bedrijfsrapport, dan
      wel,
      door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de
      keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de
      Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie heeft verzocht te verklaren dat de
      keuringsinstantie aan genoemde criteria voldoet met betrekking tot de in artikel 10 genoemde bedrijfsrapport en dit
      verzoek niet is afgewezen.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel1
  - number: '2'
    text: Het paardenspermawincentrum voldoet aan Bijlage D, hoofdstuk I, van [Richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel2
  - number: '3'
    text: >-
      1 De op het paardenspermawincentrum aanwezige hengsten voldoen aan Bijlage D, hoofdstuk II, onderdeel A en
      onderdeel C van [Richtlijn 92/65/EEG](31992L0065).


      2 De op het paardenspermawincentrum aanwezige overige dan in het eerste lid bedoelde paardachtigen voldoen aan
      Bijlage D, hoofdstuk II, onderdeel A, punt 1, 2, 3 en 4, van [Richtlijn 92/65/EEG](31992L0065).


      3 Paardenspermawincentra die overeenkomstig de door het bestuur van het Productschap Vee en Vlees op 9
      februari 2000 vastgestelde Algemene voorwaarden certificering hengstenhouderij zijn ingeschreven in het in deze
      algemene voorwaarden genoemde certificeringsregister, zijn vrijgesteld van de verplichting om bij de op het
      paardenspermawincentrum aanwezige hengsten de in Bijlage D, Hoofdstuk II, onderdeel A, punt 6 en 7 genoemde tests
      en testsprogramma's te verrichten.


      4 De in het derde lid bedoelde algemene voorwaarden liggen ter inzage in de bibliotheek van het Ministerie van
      Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel3
  - number: '4'
    text: >-
      Het winnen, bewerken en opslaan van paardensperma geschiedt voor zover van toepassing overeenkomstig Bijlage D,
      hoofdstuk III, van [Richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel4
  - number: '5'
    text: |-
      1 Ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk II, van [richtlijn 92/65/EEG](31992L0065), heeft
      de eigenaar of exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger voorzien in het opstellen
      van:

      a. voorschriften inzake:

      - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in contact komt met het sperma
      of met het donordier;
      - het winnen, bewerken en opslaan van sperma;
      - de reiniging en ontsmetting van de in [artikel 7][ref1] bedoelde ruimten en voorzieningen;
      - de toegang tot de in [artikel 7][ref2] bedoelde werkruimten, en
      - de wijze van kleding van personeel en bezoekers;

      b. een productieprotocol, waarin voor de in [artikel 7, eerste lid][ref3], bedoelde ruimten en voorzieningen, de
      productieprocessen chronologisch en gedetailleerd beschreven zijn, en

      c. een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.

      2 De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger zorgt dat het
      personeel zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en daarop gebaseerde interne
      procedures en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte
      uitvoering van de werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde
      instructies.

      3 De in het eerste lid bedoelde voorschriften, procedures en protocollen en de wijzigingen daarvan, behoeven de
      goedkeuring van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0012615#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012615#Artikel7
    url: https://wetten.overheid.nl/BWBR0012615/2003-01-01#Artikel5
