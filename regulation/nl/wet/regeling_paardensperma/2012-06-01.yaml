preamble:
  text: |-
    Gelet op de artikelen 15 en 18 van het Besluit eisen dierlijk sperma en spermawincentra;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            besluit:

              [ Besluit eisen dierlijk sperma en spermawincentra][ref1];



            b
            Minister:

              Minister van Economische Zaken, Landbouw en Innovatie;



            c
            NVWA:

              Nederlandse Voedsel- en Warenautoriteit;



            d
            keuringsdierenarts:

              dierenarts verbonden aan de NVWA;



            e
            winning:

              hoeveelheid sperma die op een bepaald moment van een donor is verkregen;



            f
            dierenarts van het centrum:

              dierenarts verbonden aan het paardenspermawincentrum;



            g
            hengst:

              geslachtsrijpe paardachtige van het mannelijk geslacht die kennelijk bestemd is voor de fokkerij;



            h

              [richtlijn 92/65/EEG](31992L0065):

              [Richtlijn 92/65/EEG](31992L0065) van de Raad van Europese Gemeenschappen van 13 juli 1992 tot vaststelling
      van de veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren,
      sperma, eicellen en embryo's waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke
      communautaire regelgeving als bedoeld in bijlage A, onder I, van [Richtlijn 90/425/EEG](31990L0425) geldt (PbEG
      L 268);



            i
            geaccrediteerde keuringsinstantie:

              keuringsinstantie, waarvan
              door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat
      de keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op het opstellen van het in [artikel 10][ref2] genoemde bedrijfsrapport,
      dan wel,
      door de Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie is verklaard dat de
      keuringsinstantie voldoet aan de criteria van EN 45004 en ISO 17020 en de relevante criteria van ISO 9001/9002,
      voorzover deze verklaring betrekking heeft op verrichtingen in de veehouderij, en de keuringsinstantie aan de
      Nederlandse Raad voor Accreditatie of een gelijkwaardige buitenlandse instantie heeft verzocht te verklaren
      dat de keuringsinstantie aan genoemde criteria voldoet met betrekking tot de in [artikel 10][ref3] genoemde
      bedrijfsrapport en dit verzoek niet is afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010619
      [ref2]: https://wetten.overheid.nl/BWBR0012615#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0012615#Artikel10
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010619
      - id: ref2
        bwb_id: BWBR0012615
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0012615
        artikel: '10'
  - number: '2'
    text: Het paardenspermawincentrum voldoet aan Bijlage D, hoofdstuk I, van [Richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel2
  - number: '3.1'
    text: |-
      De op het paardenspermawincentrum aanwezige hengsten voldoen aan Bijlage D, Hoofdstuk II, onderdeel I van
      [Richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel3
  - number: '3.2'
    text: |-
      De op het paardenspermawincentrum aanwezige overige dan in het eerste lid bedoelde paardachtigen voldoen aan
      Bijlage D, Hoofdstuk II, onderdeel I, subonderdeel 1, punt 1.1, punt 1.2 en punt 1.3, van [Richtlijn 92/65/EEG]
      (31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel3
  - number: '3.3'
    text: |-
      Paardenspermawincentra die overeenkomstig de door het bestuur van het Productschap Vee en Vlees op 9 februari
      2000 vastgestelde Algemene voorwaarden certificering hengstenhouderij zijn ingeschreven in het in deze
      algemene voorwaarden genoemde certificeringsregister, zijn vrijgesteld van de verplichting om bij de op het
      paardenspermawincentrum aanwezige hengsten de in Bijlage D, Hoofdstuk II, onderdeel I, punt 1.5 en 1.6 genoemde
      tests en testsprogramma's te verrichten.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel3
  - number: '3.4'
    text: |-
      De in het derde lid bedoelde algemene voorwaarden liggen ter inzage in de bibliotheek van het Ministerie van
      Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel3
  - number: '4'
    text: |-
      Het winnen, bewerken en opslaan van paardensperma geschiedt voor zover van toepassing overeenkomstig Bijlage D,
      hoofdstuk III, van [Richtlijn 92/65/EEG](31992L0065).
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel4
  - number: '5.1'
    text: |-
      Ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, van [richtlijn 92/65/EEG](31992L0065), heeft de
      eigenaar of exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger voorzien in het opstellen
      van:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: 5.1.a
    text: |-
      voorschriften inzake: - de reiniging en ontsmetting van de apparatuur die bij het verkrijgen en behandelen in
      contact komt met het sperma of met het donordier;
        - het winnen, bewerken en opslaan van sperma;
        - de reiniging en ontsmetting van de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van richtlijn 92/65/EEG
      bedoelde ruimten en voorzieningen;
        - de toegang tot de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van richtlijn 92/65/EEG bedoelde werkruimten,
      en
        - de wijze van kleding van personeel en bezoekers;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: 5.1.b
    text: |-
      een productieprotocol, waarin voor de in Bijlage D, Hoofdstuk I, onderdeel 1, punt 1.2, van richtlijn 92/65/EEG,
      bedoelde ruimten en voorzieningen, de productieprocessen chronologisch en gedetailleerd beschreven zijn, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: 5.1.c
    text: |-
      een kwaliteitsbeheersingsplan, waarin ter waarborging van een correcte uitvoering en registratie van de in
      onderdeel b bedoelde productieprocessen, de in acht te nemen werkwijzen chronologisch en gedetailleerd zijn
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: '5.2'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger zorgt dat het
      personeel zijn werkzaamheden verricht overeenkomstig de wettelijke bepalingen en daarop gebaseerde interne
      procedures en voorschriften, draagt er zorg voor dat de dierenarts van het centrum toeziet op een correcte
      uitvoering van de werkzaamheden door het personeel en geeft de dierenarts van het centrum de hiervoor benodigde
      instructies.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde voorschriften, procedures en protocollen en de wijzigingen daarvan, behoeven de
      goedkeuring van de minister.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel5
  - number: '6'
    text: |-
      Van toezicht van een dierenarts van het centrum als bedoeld in Bijlage D, Hoofdstuk I, onderdeel I, subonderdeel
      1, punt 1.1, van [richtlijn 92/65/EEG](31992L0065) is sprake, indien die dierenarts overeenkomstig de
      krachtens [artikel 5][ref1] vastgestelde procedures en protocollen erop toeziet dat de voorschriften bedoeld
      in [artikel 2][ref2], [3][ref3] en [4][ref4] in acht worden genomen en dat door betrokkenen de krachtens
      [artikel 5][ref5] vastgestelde procedures en protocollen correct worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012615#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0012615#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0012615#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0012615#Artikel5
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012615
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0012615
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0012615
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0012615
        artikel: '5'
  - number: '8.1'
    text: |-
      Het paardenspermawincentrum beschikt ten behoeve van het toezicht, bedoeld in Bijlage D, Hoofdstuk I, onderdeel II,
      subonderdeel 1, punt 1.2, onderdeel a, van [richtlijn 92/65/EEG](31992L0065), over een door de keuringsdierenarts
      en de geaccrediteerde keuringsinstantie vanuit één plaats op het paardenspermawincentrum te raadplegen register
      dat dagelijks wordt bijgehouden en dat zodanig is ingericht, dat daaruit te allen tijde op eenvoudige wijze met
      betrekking tot elk dier kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.a
    text: het ras;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.c
    text: het identificatienummer;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.d
    text: de gegevens inzake de uitgevoerde vaccinaties;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.e
    text: de gegevens uit het ziekte/gezondheidsdossier;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.f
    text: de datum van toelating op het paardenspermawincentrum;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.g
    text: het beslag of het bedrijf van herkomst;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.h
    text: de verplaatsingen, onder vermelding van de datum van aankomst in of vertrek uit het paardenspermawincentrum, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.1.i
    text: |-
      de gegevens, waaronder de laboratoriumuitslagen, onder vermelding van de datum, betreffende in Bijlage D, Hoofdstuk
      II, onderdeel I, subonderdeel 1, van [richtlijn 92/65/EEG](31992L0065) voorgeschreven tests.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: '8.2'
    text: De in het eerste lid bedoelde gegevens worden 3 jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: '8.3'
    text: |-
      Aan Bijlage D, Hoofdstuk I, onderdeel II, subonderdeel 1, punt 1.2, onderdeel h, van [richtlijn 92/65/EEG]
      (31992L0065) is voldaan, indien op de verpakking van iedere dosis sperma onuitwisbaar de navolgende gegevens zijn
      vermeld:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.3.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.3.b
    text: de datum waarop het sperma is verkregen;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.3.c
    text: de identiteit van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: 8.3.d
    text: het identificatienummer van het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel8
  - number: '9'
    text: |-
      Als laboratorium, bedoeld in Bijlage D, Hoofdstuk II, onderdeel I, subonderdeel 1, punt 1.5, van [richtlijn 92/65/
      EEG](31992L0065), wordt erkend het Centraal Veterinair Instituut, te Lelystad.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel9
  - number: '10.1'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger laat één maal
      per twaalf maanden ten genoegen van de keuringsdierenarts door een geaccrediteerde keuringsinstantie een
      bedrijfsrapport opstellen waaruit blijkt in hoeverre op het paardenspermawincentrum wordt voldaan aan de ingevolge
      deze regeling geldende voorschriften en welke voorzieningen eventueel zouden moeten worden getroffen, indien het
      bedrijf niet of niet volledig aan die voorschriften voldoet.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel10
  - number: '10.2'
    text: Een exemplaar van het in het eerste lid bedoelde bedrijfsrapport wordt op het paardenspermawincentrum bewaard.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel10
  - number: '11.1'
    text: |-
      De eigenaar of exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een vanuit
      één plaats op het paardenspermawincentrum te raadplegen register, dat dagelijks wordt bijgehouden en dat zodanig is
      ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking elke winning kan worden afgeleid:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: 11.1.a
    text: het aan de winning toegekende identificatienummer;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: 11.1.b
    text: de datum van de winning en behandeling;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: 11.1.c
    text: de eventuele calamiteiten die zich bij de winning hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: 11.1.d
    text: het identificatienummer van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: 11.1.e
    text: het aantal doses waarin de winning is verdeeld.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde gegevens worden bewaard tot drie jaar nadat de laatste dosis van de betrokken winning
      van het paardenspermawincentrum is afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel11
  - number: '12'
    text: |-
      De eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger beschikt over een
      administratie waarmee de keuringsdierenarts en de geaccrediteerde keuringsinstantie op elk moment een overzicht
      kan worden geboden van het sperma dat in het paardenspermawincentrum gewonnen dan wel opgeslagen is, en die de
      tracering van contacten tussen het paardenspermawincentrum met inseminatoren, dierenartsen, vervoerders, handelaren
      en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel12
  - number: '13.1'
    text: |-
      De in [artikel 12][ref1] bedoelde administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze
      met betrekking tot elke transactie kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel12
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '12'
  - number: 13.1.a
    text: de datum van de transactie;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.1.c
    text: het ontvangen of afgeleverde aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.1.d
    text: naam en adres van de ontvanger of de leverancier;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.1.e
    text: het paardenspermawincentrum waar het sperma gewonnen is, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel c][ref1], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '13.2'
    text: |-
      Voor zover het sperma op het paardenspermawincentrum is geïnsemineerd, is de in [artikel 12][ref1] bedoelde
      administratie is zodanig ingericht, dat daaruit op elk moment op eenvoudige wijze met betrekking tot elke
      inseminatie kan worden afgeleid:


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel12
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '12'
  - number: 13.2.a
    text: de datum van de inseminatie;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.2.b
    text: het identificatienummer van het betrokken sperma, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: 13.2.c
    text: het identificatienummer van het geïnsemineerde dier.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: '13.3'
    text: |-
      De in het eerste en tweede lid bedoelde gegevens worden bewaard tot drie jaar nadat het betrokken sperma van het
      paardenspermawincentrum is afgevoerd respectievelijk op het paardenspermawincentrum is geïnsemineerd.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel13
  - number: '14.1'
    text: |-
      Een partij sperma gaat bij afvoer van de kadastrale eenheid, waarop het paardenspermawincentrum is gelegen,
      vergezeld van een geleidebiljet, waarop met betrekking tot de partij de volgende gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.a
    text: de datum van afvoer;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.b
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.c
    text: het identificatienummer van de hengst waarvan het sperma is gewonnen;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.d
    text: het aantal doses sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.e
    text: de naam en het adres van de ontvanger, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.1.f
    text: |-
      indien het buiten Nederland gewonnen sperma betreft, het nummer van het
      gezondheidscertificaat, bedoeld in [artikel 9.5, onderdeel c][ref1], of in
      [artikel 9.6, derde lid, onderdeel c, van de Regeling handel levende dieren en levende producten][ref2], alsmede de
      datum waarop dit sperma binnen Nederland is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '14.2'
    text: |-
      In afwijking van het eerste lid gaat een partij sperma bij afvoer van de kadastrale eenheid, waarop het
      paardenspermawincentrum is gelegen, vergezeld van:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
  - number: 14.2.a
    text: |-
      een nationaal document, overeenkomstig de eisen op grond van 11, tweede lid, vierde
      gedachtestreepje, van richtlijn 92/65/EEG, indien een partij sperma bestemd is om overeenkomstig de
      [Regeling handel levende dieren en levende producten][ref1] buiten Nederland te worden gebracht, en voorafgaand
      daaraan in Nederland vervoerd wordt naar een nationaal spermawincentrum of nationaal spermaopslagcentrum of
      meerdere spermawincentra of spermaopslagcentra, of


      [ref1]: https://wetten.overheid.nl/BWBR0007049
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
  - number: 14.2.b
    text: |-
      een document als bedoeld in
      [artikel 9.2, onderdeel c, van de Regeling handel levende dieren en levende producten][ref1], indien een partij
      sperma overeenkomstig die regeling rechtstreeks buiten Nederland wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel9
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '9'
  - number: '15'
    text: |-
      Het is de eigenaar of de exploitant van een paardenspermawincentrum dan wel diens vertegenwoordiger
      uitsluitend toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de in
      [artikel 8, derde lid][ref1], bedoelde gegevens zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel8
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '8'
  - number: '16.1'
    text: |-
      Degene die paardensperma vervoert of verhandelt dient te beschikken over een administratie waarmee de
      keuringsdierenarts op elk moment een overzicht kan worden geboden van het sperma dat hij in voorraad heeft en
      heeft gehad en die de tracering van contacten met het paardenspermawincentrum waar het sperma gewonnen alsmede met
      inseminatoren, dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel16
  - number: '16.2'
    text: |-
      [Artikel 13, eerste en derde lid][ref1], is op de in het eerste lid bedoelde administratie van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel13
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '13'
  - number: '17'
    text: |-
      Een partij sperma is gedurende het vervoer en de verhandeling voorzien van het document, bedoeld in
      [artikel 14, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel14
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '14'
  - number: '18'
    text: |-
      Het uitsluitend toegestaan paardensperma voorhanden te hebben, in voorraad te hebben, te bewaren, op te slaan, te
      gebruiken, te ontvangen of af te leveren indien op de verpakking van iedere dosis sperma onuitwisbaar de navolgende
      gegevens zijn vermeld:
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel18
  - number: 18.a
    text: het identificatienummer van het betrokken sperma;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel18
  - number: 18.b
    text: de datum van de winning;
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel18
  - number: 18.c
    text: de identiteit van de hengst waarvan het sperma is gewonnen, en
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel18
  - number: 18.d
    text: het identificatienummer van het paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel18
  - number: '19.1'
    text: |-
      Degene die ingevolge deze regeling gegevens moet bijhouden of vermelden op daartoe bestemde bescheiden, doet dit
      volledig, juist en naar waarheid.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel19
  - number: '19.2'
    text: |-
      Het bijhouden of vermelden van de in het eerste lid bedoelde gegevens geschiedt onverwijld nadat de gegevens bekend
      zijn bij degene die zij ingevolge deze regeling moet bijhouden of vermelden.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel19
  - number: '20'
    text: |-
      Een wijziging van een of meer onderdelen van [richtlijn 92/65/EEG](31992L0065) gaat voor de toepassing van de
      artikelen van deze regeling, waarin naar die onderdelen wordt verwezen, gelden met ingang van de dag waarop
      aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel20
  - number: '21'
    text: |-
      [Artikel 5, eerste lid][ref1], is gedurende de periode van 9 maanden vanaf het tijdstip van inwerkingtreding
      van deze regeling niet van toepassing op de eigenaar of de exploitant van een paardenspermawincentrum die op het
      tijdstip van inwerkingtreding van deze regeling beschikt over een ingevolge artikel 2, tweede lid, onderdeel a,
      van de Verordening K.I. bij dieren 1985 door het Landbouwschap verleende toestemming tot het winnen van sperma
      van paarden.


      [ref1]: https://wetten.overheid.nl/BWBR0012615#Artikel5
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012615
        artikel: '5'
  - number: '22'
    text: Deze regeling treedt in werking met ingang van 1 juli 2001.
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Regeling paardensperma.'
    url: https://wetten.overheid.nl/BWBR0012615/2012-06-01#Artikel23
