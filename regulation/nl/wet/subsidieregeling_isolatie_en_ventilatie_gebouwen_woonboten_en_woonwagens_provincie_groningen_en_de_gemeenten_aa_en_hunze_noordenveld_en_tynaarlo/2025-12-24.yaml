  - number: '2.1'
    text: |-
      Deze regeling heeft tot doel verduurzaming van gebouwen, woonboten en woonwagens in de provincie Groningen en de
      gemeenten Aa en Hunze, Noordenveld en Tynaarlo te stimuleren door middel van het verstrekken van subsidie aan de
      doelgroep, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel2
  - number: '2.2'
    text: |-
      De doelgroep van deze regeling zijn woningeigenaars, eigenaar-bewoners, verhuurders, wooncoöperaties,
      woonverenigingen, VvE’s en woningcorporaties met een minderheid van het totaal aantal gebouwen in een gemengde
      VvE, die eigenaar zijn van of opgericht zijn voor een gebouw, woonboot of woonwagen in de provincie Groningen en de
      gemeenten Aa en Hunze, Noordenveld en Tynaarlo.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel2
  - number: '3.1'
    text: |-
      Bij de verstrekking van een subsidie op grond van [hoofdstuk 2][ref1] van deze regeling, wordt toepassing gegeven
      aan de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Bij de verstrekking van een subsidie op grond van [hoofdstuk 3][ref1] van deze regeling, wordt
      toepassing gegeven aan hoofdstukken I en II en artikel 38bis, leden 11, 14 tot en met 16, van de algemene
      groepsvrijstellingsverordening of de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '3'
  - number: '4.1'
    text: |-
      De minister verstrekt op aanvraag van een woningeigenaar, eigenaar-bewoner, het bestuur van een VvE,
      verhuurder, bestuur van een wooncoöperatie of bestuur van een woonvereniging die behoort tot de doelgroep uit
      [artikel 2, tweede lid][ref1], subsidie voor de volgende activiteiten:


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel2
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '2'
        hoofdstuk: '1'
  - number: 4.1.a
    text: 'isolatiemaatregelen, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.1°
    text: het aanbrengen van spouwmuurisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.2°
    text: het aanbrengen van zolder- of vlieringisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.3°
    text: het aanbrengen van binnen- of buitengevelisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.4°
    text: het aanbrengen van vloerisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.5°
    text: het aanbrengen van bodemisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.6°
    text: het aanbrengen van schuimbeton met een Rd-waarde van minimaal 3,5 m2K/W;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.7°
    text: het aanbrengen van dakisolatie bij een plat dak, of bij een hellend dak van binnenuit;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.8°
    text: het vervangen van bestaand glas door HR++-glas zonder nieuwe kozijnen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.9°
    text: |-
      het vervangen van bestaand glas door HR++-glas met nieuwe kozijnen, waarvoor uitsluitend subsidie kan worden
      aangevraagd indien een opdracht daarvoor is verleend of, in het geval van een doe-het-zelver, de uitvoering daarvan
      is gestart vanaf 25 april 2023 en vóór 10 maart 2025;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.10°
    text: |-
      het vervangen van een dak, gevel of vloer, waarvoor uitsluitend subsidie kan worden aangevraagd indien een opdracht
      daarvoor is verleend of, in het geval van een doe-het-zelver, de uitvoering daarvan is gestart vanaf 25 april 2023
      en vóór 10 maart 2025;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.11°
    text: het vervangen van bestaand glas door triple glas met nieuwe kozijnen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.12°
    text: het plaatsen van voor- of achterzetbeglazing;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.13°
    text: |-
      indien sprake is van een rijksmonument, provinciaal dan wel gemeentelijk monument, het vervangen van glas door
      monumentenglas of vacuümglas;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.14°
    text: |-
      indien sprake is van een karakteristiek, beeldbepalend dan wel beeldondersteunend gebouw, het vervangen van glas
      door HR++-glas, dan wel het vervangen van glas door vacuümglas indien HR++-glas niet toegepast kan worden;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.15°
    text: het aanbrengen van kierdichting;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.16°
    text: het aanbrengen van een kozijnpaneel of deurisolatie; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.a.17°
    text: het vervangen van een buitendeur door een nieuwe isolerende deur;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.b
    text: 'ventilatiemaatregelen, waaronder:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.b.1°
    text: natuurlijke ventilatie (type A);
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.b.2°
    text: mechanische ventilatie (type C+); of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.b.3°
    text: centrale dan wel decentrale balansventilatie (type D);
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.1.c
    text: |-
      het natuurvrij maken van het gebouw, de woonboot of woonwagen door het nemen van noodzakelijke, mitigerende
      maatregelen, uitgevoerd door een isolatiebedrijf met het keurmerk natuurvriendelijk isoleren.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: '4.2'
    text: 'Van subsidie is uitgesloten:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.2.a
    text: |-
      het aanschaffen en installeren van installaties, waaronder in ieder geval vloerverwarming of -koeling, radiatoren,
      warmtepompen, biomassaketels, thuisbatterijen, rolluiken, zonneboilers, airconditioning en zonnepanelen vallen; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: 4.2.b
    text: |-
      in het geval van een subsidie voor het aanbrengen van bodemisolatie, het aanbrengen van schuimbeton, het
      vervangen van bestaand glas door triple glas met nieuwe kozijnen, of een maatregel als bedoeld in artikel
      4, eerste lid, onderdeel a, waarmee een hogere isolatiewaarde wordt behaald dan noodzakelijk is om de
      standaard voor woningisolatie te behalen: de kosten uit categorie 2 en categorie 3 van de isolatie- en
      ventilatiemaatregelencatalogus.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: '4.3'
    text: De over de in het eerste lid genoemde activiteiten verschuldigde btw komt tevens voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: '4.4'
    text: |-
      Doe-het-zelvers kunnen subsidie aanvragen voor de maatregelen die zijn opgenomen in de isolatie- en
      ventilatiemaatregelencatalogus voor doe-het-zelf. Andere aanvragers kunnen subsidie aanvragen voor de maatregelen
      die zijn opgenomen in de isolatie- en ventilatiemaatregelencatalogus.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel4
  - number: '5.1'
    text: 'Het subsidieplafond bedraagt:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.a
    text: in 2025 € 234,9 miljoen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.b
    text: in 2026 € 124,718 miljoen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.c
    text: in 2027 € 124,536 miljoen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.d
    text: in 2028 € 124,186 miljoen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.e
    text: in 2029 € 122,584 miljoen; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5.1.f
    text: in 2030 € 122,401 miljoen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: '5.2'
    text: |-
      In de beschikking tot subsidieverlening verleent de minister een voorschot van maximaal 100% voor de isolatie-
      en ventilatiemaatregelen, bedoeld in [artikel 4, eerste lid][ref1], indien door de aanvrager bij de aanvraag een
      factuur daarvan is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
  - number: '5.3'
    text: |-
      De minister kan na de beschikking tot subsidieverlening en vóór de beschikking tot subsidievaststelling een
      voorschot van maximaal 100% voor de isolatie- en ventilatiemaatregelen, bedoeld in [artikel 4, eerste lid][ref1],
      verlenen, indien een aanvrager hierom verzoekt en bij de aanvraag daartoe een deel- dan wel eindfactuur van deze
      isolatie of ventilatiemaatregelen overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
  - number: '5.4'
    text: De minister verdeelt het subsidieplafond op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: '5.5'
    text: |-
      Indien op de dag dat het subsidieplafond wordt bereikt meer dan één volledige aanvraag is ontvangen, stelt de
      minister de onderlinge rangschikking van aanvragen vast op volgorde van binnenkomst.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: '5.6'
    text: |-
      Indien gedurende een kalenderjaar voortijdig het subsidieplafond wordt bereikt, worden de aanvragen aan een
      wachtlijst toegevoegd om in aanmerking te komen voor een subsidie op grond van deze regeling in het daaropvolgende
      jaar en op 1 januari van het nieuwe jaar op volgorde van binnenkomst in behandeling genomen. De beslistermijn wordt
      dienovereenkomstig verlengd. Dit is niet van toepassing op het laatste subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5
  - number: 5a.1
    text: |-
      De minister beslist binnen dertien weken nadat een aanvraag voor subsidie door een woningeigenaar, eigenaar-
      bewoner, verhuurder, bestuur van een wooncoöperatie, bestuur van een woonvereniging, bestuur van een VvE of een
      woningcorporatie met een minderheid van het totaal aantal gebouwen in een gemengde VvE, behorende tot de doelgroep,
      bedoeld in [artikel 2, tweede lid][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel2
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '2'
        hoofdstuk: '1'
  - number: 5a.2
    text: De minister kan de termijn eenmalig verlengen met acht weken.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel5a
  - number: '6.1'
    text: |-
      De subsidie wordt uitbetaald aan de aanvrager, bedoeld in [artikel 4, eerste lid][ref1], indien het
      een subsidie op grond van [hoofdstuk 2][ref2] van deze regeling betreft, of een subsidie op grond van
      [artikel 13, vierde lid][ref3], of [artikel 17, vierde lid][ref4], of indien de aanvrager een doe-het-zelver is.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0051079#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0051079#Artikel17
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0051079
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0051079
        artikel: '13'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Indien het een andere subsidie betreft dan de subsidies, bedoeld in het eerste lid, wordt de subsidie uitbetaald
      aan:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel6
  - number: 6.2.a
    text: |-
      het Nationaal Warmtefonds, indien dit op verzoek is van de aanvrager en diegene daarmee een lening heeft
      afgesloten;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel6
  - number: 6.2.b
    text: de gemeente, indien zij deze subsidie heeft voorgefinancierd; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel6
  - number: 6.2.c
    text: |-
      het branchegerelateerd bedrijf dat de isolatie- en ventilatiemaatregelen waarvoor subsidie wordt verstrekt zal gaan
      uitvoeren of al dan niet deels heeft uitgevoerd, indien de factuur van deze maatregelen nog niet door de aanvrager,
      het Warmtefonds of de gemeente is betaald.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel6
  - number: '7.1'
    text: |-
      Alleen de isolatie- en ventilatiemaatregelen die binnen de bestaande thermische schil vallen zijn subsidiabel,
      uitgaande van de situatie tot 25 april 2023.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.2'
    text: |-
      Het gebouw is geregistreerd als woonfunctie in de BAG. De ligplaats van de woonboot is geregistreerd in de BAG of
      de standplaats van de woonwagen is geregistreerd in de BAG.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.3'
    text: De subsidie is gebonden aan het gebouw, de woonboot of woonwagen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.4'
    text: |-
      In afwijking van het derde lid is de aanvullende subsidie die aan aanvragers met een verzamelinkomen tot 140%
      van het sociaal minimum wordt verstrekt op grond van [artikelen 13, vierde lid, onderdelen a en b][ref1],
      of [17, vierde lid, onderdelen a en b][ref2], persoonsgebonden en bedoeld voor het treffen van isolatie- en
      ventilatiemaatregelen die onder deze regeling vallen en waartoe een aanvraag is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel17
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
  - number: '7.5'
    text: |-
      Als op grond van deze regeling al subsidie is verstrekt voor het treffen van maatregelen aan een gebouw, woonboot
      of woonwagen en deze van eigenaar verandert, heeft de nieuwe eigenaar alleen recht op het eventuele restant van het
      subsidiebedrag, bedoeld in de [artikelen 13, tweede en vierde lid][ref1], of [17, tweede en vierde lid][ref2], voor
      de isolatie- en ventilatiemaatregelen waarvoor niet eerder subsidie is verstrekt op grond van deze regeling, indien
      ook wordt voldaan aan de overige voorwaarden die hieraan verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel17
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
  - number: '7.6'
    text: |-
      Een nieuwe eigenaar heeft geen recht op de aanvullende subsidie van € 1.000, bedoeld in de
      [artikelen 13 vierde lid, onderdeel b][ref1], of [17, vierde lid, onderdeel b][ref2], als die al aan een vorige
      eigenaar is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel17
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
  - number: '7.7'
    text: |-
      Voor subsidie komen alle bestaande woongedeelten van een gebouw, woonboot of woonwagen met een bouwjaar van vóór
      1 juli 2012 met een adres dat is ontstaan op of vóór 25 april 2023 in aanmerking.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.8'
    text: |-
      In afwijking van het zevende lid komt een gebouw, woonboot of woonwagen met een bouwjaar na 1 juli 2012 wel in
      aanmerking voor subsidie als de aanvrager met een omgevingsvergunning aantoont dat deze vergunning is verleend
      voorafgaand aan de inwerkingtreding van het [Bouwbesluit 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030461
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0030461
  - number: '7.9'
    text: Alle sloop-nieuwbouw gebouwen met een bouwjaar na 1 juli 2012 zijn uitgesloten van subsidie.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.10'
    text: |-
      Een aanvrager overlegt bij de aanvraag een isolatieplan, bedoeld in [artikel 8][ref1], tenzij [artikel 9][ref2] op
      hem van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel9
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '8'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '9'
        hoofdstuk: '1'
  - number: '7.11'
    text: |-
      Een aanvrager kan het uitvoeren van een isolatie- en ventilatiemaatregel niet over meerdere subsidieaanvragen
      verdelen, tenzij de verduurzaming gefaseerd wordt uitgevoerd in verschillende delen van het gebouw, de woonboot
      of woonwagen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.12'
    text: |-
      Er wordt alleen subsidie verstrekt voor het deel van de isolatie- en ventilatiemaatregelen dat is of wordt
      uitgevoerd en waarvoor subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.13'
    text: |-
      Een verhuurder, VvE, wooncoöperatie of woonvereniging kan een aanvraag voor subsidie op grond van
      [hoofdstuk 2][ref1] van deze regeling indienen na ontvangst van een vaststellingsbeschikking gedateerd vanaf
      25 april 2023 op grond van de [SVOH][ref2] dan wel de [SVVE][ref3], tenzij subsidiëring op grond van die regelingen
      niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0046234
      [ref3]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046234
      - id: ref3
        bwb_id: BWBR0047596
  - number: '7.14'
    text: |-
      Een verhuurder, VvE, wooncoöperatie of woonvereniging kan een aanvraag voor subsidie op grond
      van [hoofdstuk 3][ref1] van deze regeling, waarbij toepassing wordt gegeven aan de algemene
      groepsvrijstellingsverordening, indienen na ontvangst van een verleningsbeschikking op grond van de [SVOH][ref2]
      dan wel de [SVVE][ref3], tenzij subsidiëring op grond van die regelingen niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0046234
      [ref3]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046234
      - id: ref3
        bwb_id: BWBR0047596
  - number: '7.15'
    text: |-
      Een verhuurder, VvE, wooncoöperatie of woonvereniging kan een aanvraag voor subsidie op grond van
      [hoofdstuk 3][ref1] van deze regeling, waarbij toepassing wordt gegeven aan de de-minimisverordening, indienen
      na ontvangst van een vaststellingsbeschikking op grond van de [SVOH][ref2] dan wel de [SVVE][ref3], tenzij
      subsidiëring op grond van die regelingen niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0046234
      [ref3]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046234
      - id: ref3
        bwb_id: BWBR0047596
  - number: '7.16'
    text: |-
      Ten aanzien van een aanvraag voor subsidie door een VvE of wooncoöperatie geldt de aanvullende voorwaarde
      dat het bestuur daarvan middels de notulen van de algemene ledenvergadering aantoont dat is besloten in de
      VvE of wooncoöperatie isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw waarop de
      subsidieaanvraag ziet uit te voeren of uitgevoerd te hebben.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.17'
    text: |-
      Ten aanzien van een aanvraag voor subsidie door een woonvereniging geldt de aanvullende voorwaarde dat het
      bestuur daarvan middels de statuten of de notulen van de algemene ledenvergadering aantoont dat is besloten
      in de woonvereniging isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw waarop de
      subsidieaanvraag ziet uit te voeren of uitgevoerd te hebben.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '7.18'
    text: |-
      Een eigenaar-bewoner in een VvE kan individueel een subsidie aanvragen voor de uit te voeren of uitgevoerde
      isolatie- en ventilatiemaatregelen aan delen van het gebouw die volgens de akte van splitsing bestemd zijn als
      afzonderlijk geheel te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel7
  - number: '8.1'
    text: |-
      Indien het totaal aan kosten van de isolatie- en ventilatiemaatregelen van een aanvraag meer dan € 10.000 bedraagt
      of eerder op grond van deze regeling subsidie is verstrekt en het aangevraagde bedrag uit de nieuwe aanvraag,
      opgeteld bij het bedrag dat is toegekend op basis van de eerdere aanvraag, hoger is dan € 10.000, overlegt de
      aanvrager alsnog bij de aanvraag voor subsidie een isolatieplan ook al was dit oorspronkelijk niet verplicht.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.2'
    text: |-
      In geval van isolatie van een muur aan de buitenzijde van een gebouw, woonboot of woonwagen, overlegt de aanvrager
      bij de aanvraag voor subsidie een isolatieplan.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.3'
    text: 'Het isolatieplan bij een gebouw, woonboot, of woonwagen met een bouwjaar:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: 8.3.a
    text: voor 1 januari 1945 wordt opgesteld door een isolatieadviseur uitgebreid; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: 8.3.b
    text: vanaf 1 januari 1945 wordt opgesteld door een isolatieadviseur basis of een isolatieadviseur uitgebreid.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.4'
    text: |-
      In afwijking van het derde lid wordt er voor een gebouw zijnde een rijksmonument, provinciaal dan wel gemeentelijk
      monument een isolatieadvies voor monumenten opgesteld door een isolatieregisseur voor monumenten.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.5'
    text: Het isolatieplan wordt opgesteld volgens het formulier dat beschikbaar wordt gesteld door de minister.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.6'
    text: |-
      In geval het bestuur van een VvE, wooncoöperatie of woonvereniging de aanvrager voor subsidie is, wordt het
      isolatieplan aangevuld met een specificatie per type gebouw. Het isolatieplan wordt opgesteld volgens de BRL9500-
      MWA-W, aangevuld met een overzicht van de uit te voeren isolatie- en ventilatiemaatregelen om te voldoen aan de
      standaard voor woningisolatie per gebouw.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.7'
    text: |-
      De minister zorgt ervoor dat er geen kosten zijn gemoeid voor de aanvrager met de werkzaamheden van degene die het
      isolatieplan opstelt.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '8.8'
    text: |-
      Bij het treffen van isolatie- en ventilatiemaatregelen voor een bepaald onderdeel van de thermische schil op
      grond van deze regeling mag worden afgeweken van het isolatieplan, mits de maatregel wordt genomen voor hetzelfde
      onderdeel ervan en voldoet aan de doelwaarde voor isolatie. De maximale subsidiebedragen die voor deze maatregelen
      in het isolatieplan zijn opgenomen blijven gelden.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel8
  - number: '9.1'
    text: |-
      Er hoeft geen isolatieplan te worden overgelegd bij de aanvraag voor subsidie op grond van deze regeling voor een
      isolatie- of ventilatiemaatregel, indien aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.a
    text: het totaal aan kosten van de isolatie- en ventilatiemaatregelen van een aanvraag bedraagt minder dan € 10.000;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.b
    text: het bouwjaar van het gebouw ligt tussen 1 januari 1965 en 31 december 1991;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.c
    text: het gebouw betreft geen rijksmonument, provinciaal dan wel gemeentelijk monument;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.d
    text: er is niet eerder subsidie aangevraagd voor één of meer maatregelen met een isolatieplan; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e
    text: 'de isolatie- of ventilatiemaatregelen uit de aanvraag voldoen aan de volgende doelwaarden bij het:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.1°
    text: 'isoleren van het dak: een Rc-waarde van 3,8 m2K/W;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.2°
    text: 'aanbrengen van vloerisolatie: een Rc-waarde van 3,5 m2K/W;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.3°
    text: 'plaatsen van gevel- spouwmuurisolatie: een Rc-waarde van 1,7 m2K/W;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.4°
    text: 'vervangen van de voordeur: een U-waarde van 1,4 W/m2K;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.5°
    text: 'vervangen van bestaand glas: een U-waarde van 1,2 W/m2K;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.6°
    text: 'plaatsen van een paneel in een kozijn: een U-waarde van 1,2 W/m2K;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.7°
    text: |-
      plaatsen van ventilatieroosters en voor de hoofdverblijfruimte decentrale mechanische ventilatie met
      warmteterugwinning: NEN 8087; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.1.e.8°
    text: 'plaatsen van voor- of achterzetbeglazing: een U-waarde van 2,7 W/m2K.'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: '9.2'
    text: |-
      Er hoeft geen isolatieplan te worden overgelegd bij de aanvraag voor subsidie voor een isolatie- of
      ventilatiemaatregel, als de aanvraag voor subsidie uitsluitend ziet op:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.2.a
    text: het vervangen van bestaand glas door triple glas met nieuwe kozijnen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.2.b
    text: het isoleren van de bodem; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: 9.2.c
    text: het isoleren met schuimbeton.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
  - number: '9.3'
    text: |-
      Er hoeft geen isolatieplan te worden overgelegd indien het een subsidieaanvraag op grond van [hoofdstuk 2][ref1]
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0051079
        hoofdstuk: '2'
  - number: '9.4'
    text: |-
      Er hoeft geen isolatieplan te worden overgelegd voor gemeenschappelijke delen van de thermische schil als subsidie
      op grond van de [SVVE][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0047596
  - number: '9.5'
    text: |-
      Er hoeft geen isolatieplan te worden overgelegd indien het een subsidieaanvraag van een woningeigenaar of eigenaar-
      bewoner betreft waarbij toepassing wordt gegeven aan [artikel 17, derde lid, aanhef en onderdelen c en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel17
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
  - number: '10.1'
    text: |-
      Voor zover noodzakelijk voor de bepaling van het recht op subsidie, de subsidiehoogte en om dubbele subsidie
      te voorkomen op grond van deze regeling kunnen uitsluitend de volgende gegevens worden uitgewisseld tussen de
      minister, de provincies Groningen en Drenthe, de gemeenten, ontzorgende partijen die in opdracht van een gemeente
      subsidieaanvragers begeleiden en ondersteunen, de Minister van Binnenlandse Zaken en Koninkrijksrelaties, de
      Minister van Klimaat en Groene Groei en het Nationaal Warmtefonds:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.a
    text: het adres van het gebouw, de woonboot of woonwagen waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.b
    text: de gesubsidieerde activiteiten;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.c
    text: |-
      de naam van de regeling waarvoor eerder subsidie is verkregen die ziet op dezelfde subsidiabele activiteiten als
      deze regeling, het subsidiebedrag dat toen is verstrekt en de datum van de beschikking tot subsidieverlening en
      -vaststelling, intrekking, wijziging of afwijzing;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.d
    text: de facturen en offertes van de gesubsidieerde activiteiten;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.e
    text: het projectnummer of het contractnummer;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.f
    text: het isolatieplan met betrekking tot de gesubsidieerde activiteiten; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.1.g
    text: de hoogte van het voorgefinancierde bedrag door de gemeente.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: '10.2'
    text: |-
      Als het voor de uitvoering van deze regeling noodzakelijk is om vast te stellen of een gebouw de status van een
      monument heeft, kunnen daartoe de volgende gegevens worden uitgewisseld tussen de minister, het Cultuurfonds en het
      Nationaal Restauratiefonds:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.2.a
    text: het adres van het gebouw, de woonboot of woonwagen waarvoor subsidie wordt aangevraagd; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: 10.2.b
    text: |-
      de status van het gebouw, de woonboot of woonwagen waarvoor subsidie wordt aangevraagd als rijksmonument,
      gemeentelijk monument of provinciaal monument.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: '10.3'
    text: |-
      Ten behoeve van het monitoren van de voortgang van de activiteiten op basis van deze regeling kunnen gegevens
      worden uitgewisseld die daartoe noodzakelijk zijn tussen de minister, de provincie Groningen en de provincie
      Drenthe.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: '10.4'
    text: |-
      Ten behoeve van het begeleiden en ondersteunen van subsidieaanvragers kunnen ontzorgende partijen die in opdracht
      van een gemeente subsidieaanvragers begeleiden en ondersteunen onderling informatie over isolatieplannen en de
      voortgang in de uitvoering uitwisselen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel10
  - number: '11.1'
    text: |-
      Een aanvraag tot vaststelling van de subsidie kan door een aanvrager van 3 juni 2025 vanaf 12.00 uur tot en met
      1 oktober 2026 17.00 uur worden ingediend, indien vanaf 25 april 2023 en vóór 3 juni 2025 een opdracht is verstrekt
      tot uitvoering van de subsidiabele activiteiten of die door een doe-het-zelver zijn gestart. In afwijking van de
      vorige zin geldt voor het vervangen van bestaand glas door HR++-glas met nieuwe kozijnen, of het vervangen van
      een vloer, gevel of dak dat de opdracht moet zijn verstrekt of, in het geval van een doe-het-zelver, de uitvoering
      daarvan moet zijn gestart vanaf 25 april 2023 en vóór 10 maart 2025.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: '11.2'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het aanvraagformulier dat door de minister ter beschikking wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: '11.3'
    text: 'Een aanvraag bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.a
    text: een beschrijving van de uitgevoerde isolatie- en ventilatiemaatregelen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.b
    text: |-
      de voorletters en achternaam, het telefoonnummer, het e-mailadres, het correspondentieadres en het
      bankrekeningnummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.c
    text: |-
      het adres van het gebouw, de woonboot of woonwagen dan wel gebouwen in geval van een VvE, wooncoöperatie of
      woonvereniging, waarvoor subsidie wordt aangevraagd en, indien van toepassing, de akte van splitsing, bedoeld in
      [artikel 108 van Boek 5 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel108
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '108'
  - number: 11.3.d
    text: |-
      in het geval van een gemachtigde: de voorletters en achternaam of naam van de persoon of rechtspersoon, het
      telefoonnummer, het e-mailadres, het correspondentieadres en het machtigingsfomulier;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.e
    text: 'de facturen en betaalbewijzen van de uitgevoerde isolatie- en ventilatiemaatregelen, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.e.1°
    text: 'bij contante betaling: de kwitantie; of'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.e.2°
    text: |-
      bij elektronische betaling: een betaalbewijs met bankrekeningnummer van de aanvrager, het bedrag, het
      betalingskenmerk, de datum van de overboeking, de naam en het bankrekeningnummer van de ontvangende partij;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.f
    text: 'indien van toepassing: het KVK-nummer van de aanvrager;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.g
    text: 'indien van toepassing: een de-minimisverklaring;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.h
    text: |-
      indien van toepassing: een bewijs van betalingen die gedaan zijn uit het bouwdepot van het Warmtefonds dan wel bij
      voorfinanciering door de gemeenten;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.i
    text: |-
      indien van toepassing: de beschikking tot subsidieverlening, intrekking, wijziging of -vaststelling op grond van
      de ISDE, [SVOH][ref1], [SVVE][ref2] of een andere regeling die ziet op dezelfde subsidiabele activiteiten als deze
      regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 11.3.j
    text: |-
      in geval van een VvE of wooncoöperatie: de notulen van de algemene ledenvergadering waaruit blijkt dat is besloten
      in de VvE of wooncoöperatie om isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw
      uitgevoerd te hebben en op grond waarvan het bestuur bevoegd is om een aanvraag voor subsidie op grond van deze
      regeling in te dienen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.k
    text: |-
      in geval van een VvE of wooncoöperatie: een verdeelsleutel waaruit blijkt welk subsidiebedrag voor welk gebouw
      wordt aangevraagd en de notulen van de algemene ledenvergadering waaruit blijkt dat is ingestemd met deze
      verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.l
    text: |-
      in geval van een woonvereniging: de statuten of de notulen van de algemene ledenvergadering waaruit blijkt dat
      is besloten in de woonvereniging om isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw
      uitgevoerd te hebben en op grond waarvan het bestuur bevoegd is om een aanvraag voor subsidie op grond van deze
      regeling in te dienen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.m
    text: |-
      in geval van een woonvereniging: een verdeelsleutel waaruit blijkt welk subsidiebedrag voor welk gebouw wordt
      aangevraagd en de statuten of de notulen van de algemene ledenvergadering waaruit blijkt dat is ingestemd met deze
      verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.n
    text: |-
      in geval van een woningcorporatie met een minderheid van het totaal aantal gebouwen in een gemengde VvE: een
      verklaring dat de woningcorporatie aan deze voorwaarde voldoet;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.o
    text: |-
      in geval van een doe-het-zelver: een verklaring van de isolatieadviseur uitgebreid dan wel isolatieadviseur
      basis, waarvoor een format beschikbaar wordt gesteld door de minister, waaruit blijkt dat de isolatie- en
      ventilatiemaatregelen waarvoor subsidie wordt aangevraagd op grond van deze regeling zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.p
    text: |-
      in geval van een rijksmonument, provinciaal dan wel gemeentelijk monument, mits van toepassing: de
      omgevingsvergunning voor het treffen van isolatie- en ventilatiemaatregelen op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.q
    text: |-
      indien de aanvrager een verzamelinkomen heeft tot 140% van het sociaal minimum: een inkomensverklaring van de
      aanvrager en indien van toepassing diens echtgenoot, geregistreerd partner, of fiscaal partner op een andere wijze,
      waaruit blijkt dat de aanvrager in het jaar voorafgaande aan de aanvraag binnen deze categorie valt; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: 11.3.r
    text: |-
      in geval subsidie wordt aangevraagd voor het treffen van isolatie- en ventilatiemaatregelen voor een woonboot of
      woonwagen: de omgevingsvergunning voor de ligplaats respectievelijk standplaats ervan.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
  - number: '11.4'
    text: |-
      Een aanvraag tot vaststelling van de aanvullende subsidie, bedoeld in
      [artikel 13, vierde lid, onderdeel a of b][ref1], kan door een aanvrager worden ingediend tegelijk met of nadat de
      aanvraag, bedoeld in het eerste lid, is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel13
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '13'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Onverminderd de [artikelen 12][ref1] en [13 van het Kaderbesluit BZK-subsidies][ref2] wijst de minister een
      aanvraag voor een subsidie af voor zover op grond van deze regeling de subsidiabele kosten voor meer dan 100%
      zouden worden gesubsidieerd vanwege samenloop met subsidie die is verstrekt aan de aanvrager voor dezelfde
      isolatie- en ventilatiemaatregelen op grond van de ISDE, [SVOH][ref3], [SVVE][ref4] of een andere subsidieregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0033530#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0046234
      [ref4]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0033530
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0046234
      - id: ref4
        bwb_id: BWBR0047596
  - number: '13.1'
    text: |-
      De subsidiehoogte voor de uitgevoerde isolatie- en ventilatiemaatregelen waartoe een aanvraag op grond van deze
      regeling is ingediend, wordt bepaald op basis van bij de aanvraag aangeleverde facturen en betaalbewijzen, met
      uitzondering van aanvragen van doe-het-zelvers, waarbij de subsidiehoogte wordt bepaald op basis van de in de
      isolatie- en ventilatiemaatregelencatalogus voor doe-het-zelf bepaalde eenheidsprijzen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: '13.2'
    text: |-
      De subsidie waartoe een aanvraag op grond van deze regeling is ingediend, bedraagt per gebouw, woonboot of
      woonwagen voor:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.a
    text: 'woningeigenaars:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.a.1°
    text: |-
      in het versterkingsgebied: 100% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een
      maximum van € 40.000, inclusief eventuele subsidie op grond van de ISDE;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.a.2°
    text: |-
      met een verzamelinkomen tot 140% van het sociaal minimum: 100% van de kosten voor de uitgevoerde isolatie- en
      ventilatiemaatregelen tot een maximum van € 40.000, inclusief eventuele subsidie op grond van de ISDE; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.a.3°
    text: |-
      in het aangewezen gebied: 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximum
      van € 20.000, inclusief eventuele subsidie op grond van de ISDE;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.b
    text: 'verhuurders die maximaal één gebouw verhuren:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.b.1°
    text: |-
      in het versterkingsgebied, met uitzondering van verhuurders die maximaal één gebouw verhuren in gemengde VvE’s,
      gemengde wooncoöperaties en gemengde woonverenigingen: 100% van de kosten voor de uitgevoerde isolatie- en
      ventilatiemaatregelen tot een maximum van € 40.000, inclusief eventuele subsidie op grond van de [SVOH][ref1],
      [SVVE][ref2] met uitzondering van de subsidieverhoging voor realisatie van een zeer energiezuinig pakket; of


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 13.2.b.2°
    text: |-
      in het aangewezen gebied: 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximum
      van € 20.000, inclusief eventuele subsidie op grond van de [SVOH][ref1], [SVVE][ref2] met uitzondering van de
      subsidieverhoging voor realisatie van een zeer energiezuinig pakket;


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 13.2.c
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, niet zijnde een gemengde VvE, gemengde
      wooncoöperatie, of gemengde woonvereniging:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.2.c.1°
    text: |-
      in het versterkingsgebied: 100% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot
      een maximum van € 40.000, inclusief eventuele subsidie op grond van de ISDE, [SVOH][ref1], [SVVE][ref2] met
      uitzondering van de subsidieverhoging voor realisatie van een zeer energiezuinig pakket; of


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 13.2.c.2°
    text: |-
      in het aangewezen gebied: 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximum
      van € 20.000, inclusief eventuele subsidie op grond van de ISDE, [SVOH][ref1], [SVVE][ref2] met uitzondering van de
      subsidieverhoging voor realisatie van een zeer energiezuinig pakket; en


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 13.2.d
    text: |-
      eigenaar-bewoners en verhuurders die maximaal één gebouw verhuren in een gemengde VvE, gemengde wooncoöperatie,
      of gemengde woonvereniging, woningcorporaties met een minderheid van het totaal aantal gebouwen in een
      gemengde VvE, verhuurders die meer dan één gebouw verhuren: 50% van de kosten voor de uitgevoerde isolatie-
      en ventilatiemaatregelen tot een maximum van € 20.000, inclusief eventuele subsidie op grond van de ISDE,
      [SVOH][ref1], [SVVE][ref2] met uitzondering van de subsidieverhoging voor realisatie van een zeer energiezuinig
      pakket.


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: '13.3'
    text: |-
      In afwijking van het tweede lid wordt het te verstrekken subsidiebedrag niet meegerekend ten behoeve van het voor
      de betreffende doelgroep geldende maximumbedrag dat aan subsidie kan worden ontvangen op grond van het tweede en
      vierde lid, en bedraagt de subsidie 30% van de kosten van de uitgevoerde isolatie- en ventilatiemaatregelen op
      basis van de in de isolatie- en ventilatiemaatregelencatalogus bepaalde eenheidsprijzen of, in het geval van een
      aanvraag van een doe-het-zelver, op basis van de in de isolatie- en ventilatiemaatregelencatalogus voor doe-het-
      zelf bepaalde eenheidsprijzen, voor het vervangen van bestaand glas door triple glas met nieuwe kozijnen, indien
      vanaf 10 maart 2025 een opdracht is verstrekt tot uitvoering daarvan of, in het geval van een doe-het-zelver, de
      uitvoering daarvan is gestart en waarbij de voorwaarde geldt dat het triple glas een U-waarde heeft van maximaal
      0,7 W/m2K en de kozijnen een Uf-waarde hebben van maximaal 1,5 W/m2K.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: '13.4'
    text: 'In aanvulling op het tweede lid wordt de subsidie verhoogd:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.a
    text: |-
      met 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximale verhoging van
      € 20.000, inclusief eventuele subsidie op grond van de ISDE, [SVOH][ref1] of [SVVE][ref2] met uitzondering van de
      subsidieverhoging voor realisatie van een zeer energiezuinig pakket, voor:


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 13.4.a.1°
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, niet zijnde een gemengde VvE, gemengde
      wooncoöperatie, of gemengde woonvereniging die in het aangewezen gebied vallen en een verzamelinkomen hebben tot
      140% van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.a.2°
    text: |-
      eigenaar-bewoners in een gemengde VvE, gemengde wooncoöperatie, of gemengde woonvereniging in het
      versterkingsgebied;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.a.3°
    text: |-
      verhuurders die maximaal één gebouw verhuren in een gemengde VvE, wooncoöperatie, of woonvereniging in het
      versterkingsgebied; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.a.4°
    text: |-
      eigenaar-bewoners in een gemengde VvE, gemengde wooncoöperatie, of gemengde woonvereniging in het aangewezen
      gebied, die een verzamelinkomen hebben tot 140% van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.b
    text: 'met € 1.000 per gebouw ter ondersteuning bij de uit te voeren subsidiabele activiteiten voor:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.b.1°
    text: woningeigenaars in het versterkingsgebied;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.b.2°
    text: woningeigenaars in het aangewezen gebied met een verzamelinkomen tot 140% van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.b.3°
    text: eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, in het versterkingsgebied; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: 13.4.b.4°
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, in het aangewezen gebied die een verzamelinkomen
      hebben tot 140% van het sociaal minimum.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: '13.5'
    text: |-
      Als een subsidie is toegekend aan het bestuur van een VvE, het bestuur van een wooncoöperatie of het bestuur van
      een woonvereniging, dan wordt het subsidiebedrag toegewezen per gebouw op basis van de door het bestuur van een
      VvE, wooncoöperatie of woonvereniging bij de aanvraag aangeleverde verdeelsleutel. Dat per gebouw toegewezen bedrag
      wordt in mindering gebracht op het voor de betreffende doelgroep geldende maximumbedrag uit het tweede en vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel13
  - number: '14'
    text: |-
      De subsidieontvanger bewaart gedurende vijf jaar de facturen en betaalbewijzen van de gesubsidieerde activiteiten,
      bedoeld in [artikel 4, eerste lid][ref1], gerekend vanaf de dag na de verzenddatum van de beschikking tot
      subsidievaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
  - number: '15.1'
    text: |-
      Indien vanaf de datum van inwerkingtreding van deze regeling een opdracht is verstrekt tot uitvoering van
      de subsidiabele activiteiten of, in het geval van een doe-het-zelver, de uitvoering daarvan is gestart, kan
      een aanvraag tot verlening van de subsidie door een aanvrager worden ingediend vanaf het moment, bedoeld in
      [bijlage I][ref1], op basis van de postcode waartoe het gebouw, de woonboot of woonwagen van de aanvrager behoort
      tot en met 3 juni 2035.


      [ref1]: https://wetten.overheid.nl/BWBR0051079
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0051079
  - number: '15.2'
    text: |-
      Een aanvraag wordt ingediend met gebruikmaking van het aanvraagformulier dat door de minister ter beschikking wordt
      gesteld.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: '15.3'
    text: 'Een aanvraag, bedoeld in het eerste lid, bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.a
    text: |-
      de voorletters en achternaam, het telefoonnummer, het e-mailadres, het correspondentieadres en het
      bankrekeningnummer van de aanvrager of het bankrekeningnummer van degene aan wie de subsidie moet worden
      uitbetaald;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.b
    text: |-
      het adres van het gebouw, de woonboot of woonwagen waarvoor subsidie wordt aangevraagd dan wel gebouwen in
      geval van een VvE, wooncoöperatie of woonvereniging en, indien van toepassing, de akte van splitsing, bedoeld in
      [artikel 108 van Boek 5 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel108
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '108'
  - number: 15.3.c
    text: |-
      in het geval van een gemachtigde: de voorletters en achternaam of naam van de persoon of rechtspersoon, het
      telefoonnummer, het e-mailadres, het correspondentieadres, en het machtigingsformulier;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.d
    text: 'indien van toepassing: het isolatieplan;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.e
    text: een beschrijving van de isolatie- en ventilatiemaatregelen die worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.f
    text: 'indien van toepassing: het KVK-nummer van de aanvrager;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.g
    text: |-
      indien van toepassing: een factuur of offerte van de isolatie- en ventilatiemaatregelen waarvoor subsidie op grond
      van deze regeling wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.h
    text: |-
      in geval van een VvE of wooncoöperatie: de notulen van de algemene ledenvergadering waaruit blijkt dat is besloten
      om in de VvE of wooncoöperatie isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw uit te
      voeren en waartoe het bestuur bevoegd is om een aanvraag voor subsidie op grond van deze regeling in te dienen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.i
    text: |-
      in geval van een VvE of wooncoöperatie: een verdeelsleutel waaruit blijkt welk subsidiebedrag voor welk gebouw
      wordt aangevraagd en de notulen van de algemene ledenvergadering waaruit blijkt dat is ingestemd met deze
      verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.j
    text: |-
      in geval van een woonvereniging: de statuten of de notulen van de algemene ledenvergadering waaruit blijkt dat is
      besloten om in de woonvereniging isolatie- en ventilatiemaatregelen aan de gezamenlijke delen van het gebouw uit te
      voeren en waartoe het bestuur bevoegd is om een aanvraag voor subsidie op grond van deze regeling in te dienen;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.k
    text: |-
      in geval van een woonvereniging: een verdeelsleutel waaruit blijkt welk subsidiebedrag voor welk gebouw wordt
      aangevraagd en de statuten of de notulen van de algemene ledenvergadering waaruit blijkt dat is ingestemd met deze
      verdeelsleutel;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.l
    text: |-
      in geval van een woningcorporatie met een minderheid van het totaal aantal gebouwen in een gemengde VvE: een
      verklaring dat zij aan deze voorwaarde voldoet;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.m
    text: |-
      in geval van een rijksmonument, provinciaal dan wel gemeentelijk monument, mits van toepassing: de
      omgevingsvergunning voor het treffen van isolatie- en ventilatiemaatregelen op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.n
    text: |-
      indien de aanvrager een verzamelinkomen heeft tot 140% van het sociaal minimum: een inkomensverklaring van de
      aanvrager en indien van toepassing diens echtgenoot, geregistreerd partner, of fiscaal partner op een andere wijze,
      waaruit blijkt dat de aanvrager in het jaar voorafgaande aan de aanvraag binnen deze categorie valt;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.o
    text: |-
      in geval subsidie wordt aangevraagd voor het treffen van isolatie- en ventilatiemaatregelen voor een woonboot of
      woonwagen: de omgevingsvergunning voor de ligplaats respectievelijk standplaats ervan;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.p
    text: |-
      indien toepassing wordt gegeven aan de algemene groepsvrijstellingsverordening: een verleningsbeschikking op grond
      van de [SVOH][ref1] dan wel de [SVVE][ref2], mits hiervoor subsidie kan worden aangevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 15.3.q
    text: |-
      indien toepassing wordt gegeven aan de de-minimisverordening: een vaststellingsbeschikking op grond van de
      [SVOH][ref1] dan wel de [SVVE][ref2], mits hiervoor subsidie kan worden aangevraagd; en


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 15.3.r
    text: |-
      indien van toepassing: een de-minimisverklaring of, indien toepassing wordt gegeven aan hoofdstukken I en II en
      artikel 38bis, leden 11, 14 tot en met 16, van de algemene groepsvrijstellingsverordening, een verklaring dat er
      geen sprake is van:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.r.1°
    text: een onderneming in moeilijkheden als bedoeld in de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.r.2°
    text: |-
      een onderneming ten aanzien waarvan een bevel tot terugvordering van steun uitstaat als bedoeld in de algemene
      groepsvrijstellingsverordening; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: 15.3.r.3°
    text: ongeoorloofde cumulatie van steun op grond van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
  - number: '15.4'
    text: |-
      Een aanvraag tot vaststelling van de aanvullende subsidie, bedoeld in
      [artikel 17, vierde lid, onderdeel a of b][ref1], kan door een aanvrager worden ingediend tegelijk met of nadat de
      aanvraag, bedoeld in het eerste lid, of de aanvraag, bedoeld in [artikel 19, tweede lid][ref2], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel19
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '17'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '19'
        hoofdstuk: '3'
  - number: '16'
    text: |-
      Onverminderd de [artikelen 12][ref1] en [13 van het Kaderbesluit BZK-subsidies][ref2] wijst de minister een
      aanvraag voor een subsidie af voor zover op grond van deze regeling de subsidiabele kosten voor meer dan 100%
      zouden worden gesubsidieerd vanwege samenloop met subsidie die is verstrekt aan de aanvrager voor dezelfde
      isolatie- en ventilatiemaatregelen op grond van de ISDE, [SVOH][ref3], [SVVE][ref4] of een andere subsidieregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0033530#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0046234
      [ref4]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0033530
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0046234
      - id: ref4
        bwb_id: BWBR0047596
  - number: '17.1'
    text: |-
      De subsidiehoogte voor het nemen van isolatie- en ventilatiemaatregelen waartoe een aanvraag op grond van deze
      regeling is ingediend, wordt bepaald op basis van de in de isolatie- en ventilatiemaatregelencatalogus bepaalde
      eenheidsprijzen, of, in het geval van een aanvraag van een doe-het-zelver, op basis van de in de isolatie- en
      ventilatiemaatregelencatalogus voor doe-het-zelf bepaalde eenheidsprijzen, of, indien de kosten van de uitgevoerde
      isolatie- en ventilatiemaatregelen lager zijn, op basis van bij de aanvraag tot subsidieverlening of de aanvraag
      tot subsidievaststelling aangeleverde facturen en betaalbewijzen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: '17.2'
    text: |-
      De subsidie waartoe een aanvraag op grond van deze regeling is ingediend, bedraagt per gebouw, woonboot of
      woonwagen voor:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.a
    text: 'woningeigenaars:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.a.1°
    text: |-
      in het versterkingsgebied: 100% van de kosten voor het nemen van isolatie- en ventilatiemaatregelen tot een maximum
      van € 40.000;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.a.2°
    text: |-
      met een verzamelinkomen tot 140% van het sociaal minimum: 100% van de kosten voor het nemen van isolatie- en
      ventilatiemaatregelen tot een maximum van € 40.000; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.a.3°
    text: |-
      in het aangewezen gebied: 50% van de kosten voor het nemen van isolatie- en ventilatiemaatregelen tot een maximum
      van € 20.000;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.b
    text: 'verhuurders die maximaal één gebouw verhuren:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.b.1°
    text: |-
      in het versterkingsgebied, met uitzondering van verhuurders die maximaal één gebouw verhuren in gemengde VvE’s,
      gemengde wooncoöperaties en gemengde woonverenigingen: 100% van de kosten voor het nemen van isolatie- en
      ventilatiemaatregelen tot een maximum van € 40.000, inclusief eventuele subsidie op grond van de [SVOH][ref1],
      [SVVE][ref2] met uitzondering van de subsidieverhoging voor realisatie van een zeer energiezuinig pakket; of


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 17.2.b.2°
    text: |-
      in het aangewezen gebied: 50% tot een maximum van € 20.000 van de kosten voor het nemen van isolatie- en
      ventilatiemaatregelen, inclusief eventuele subsidie op grond van de [SVOH][ref1], [SVVE][ref2] met uitzondering van
      de subsidieverhoging voor realisatie van een zeer energiezuinig pakket;


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 17.2.c
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, niet zijnde een gemengde VvE, gemengde
      wooncoöperatie, of gemengde woonvereniging:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.2.c.1°
    text: |-
      in het versterkingsgebied: 100% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot
      een maximum van € 40.000, inclusief eventuele subsidie op grond van de [SVVE][ref1] met uitzondering van de
      subsidieverhoging voor realisatie van een zeer energiezuinig pakket; of


      [ref1]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047596
  - number: 17.2.c.2°
    text: |-
      in het aangewezen gebied: 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximum
      van € 20.000, inclusief eventuele subsidie op grond van de [SVVE][ref1] met uitzondering van de subsidieverhoging
      voor realisatie van een zeer energiezuinig pakket; en


      [ref1]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0047596
  - number: 17.2.d
    text: |-
      eigenaar-bewoners en verhuurders die maximaal één gebouw verhuren in een gemengde VvE, gemengde wooncoöperatie,
      of gemengde woonvereniging, woningcorporaties met een minderheid van het totaal aantal gebouwen in een
      gemengde VvE en verhuurders die meer dan één gebouw verhuren: 50% van de kosten voor het nemen van isolatie- en
      ventilatiemaatregelen tot een maximum van € 20.000, inclusief eventuele subsidie op grond van de [SVOH][ref1],
      [SVVE][ref2] met uitzondering van de subsidieverhoging voor realisatie van een zeer energiezuinig pakket.


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: '17.3'
    text: |-
      In afwijking van het tweede lid wordt het te verstrekken subsidiebedrag niet meegerekend ten behoeve van het voor
      de betreffende doelgroep geldende maximumbedrag dat aan subsidie kan worden ontvangen op grond van het tweede en
      vierde lid, en bedraagt de subsidie 30% van de kosten van de uitgevoerde isolatie- en ventilatiemaatregelen op
      basis van de in de isolatie- en ventilatiemaatregelencatalogus bepaalde eenheidsprijzen of, in het geval van een
      aanvraag van een doe-het-zelver, op basis van de in de isolatie- en ventilatiemaatregelencatalogus voor doe-het-
      zelf bepaalde eenheidsprijzen voor:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.3.a
    text: het aanbrengen van bodemisolatie;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.3.b
    text: het aanbrengen van schuimbeton;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.3.c
    text: |-
      een maatregel als bedoeld in [artikel 4, eerste lid, onderdeel a][ref1], waarmee een hogere isolatiewaarde wordt
      behaald dan noodzakelijk is om de standaard voor woningisolatie te behalen;


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
  - number: 17.3.d
    text: |-
      het vervangen van bestaand glas door triple glas met nieuwe kozijnen, waarbij de voorwaarde geldt dat het triple
      glas een U-waarde heeft van maximaal 0,7 W/m2K en de kozijnen een Uf-waarde hebben van maximaal 1,5 W/m2K; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.3.e
    text: |-
      een maatregel als bedoeld in [artikel 4, eerste lid, onderdeel a][ref1], voor de kosten boven de maximale
      subsidiehoogte van € 20.000 of € 40.000 die voor een gebouw, woonboot of woonwagen van een woningeigenaar of
      eigenaar-bewoner zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel4
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '4'
        hoofdstuk: '1'
  - number: '17.4'
    text: 'In aanvulling op het tweede lid wordt de subsidie verhoogd:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.a
    text: |-
      met 50% van de kosten voor de uitgevoerde isolatie- en ventilatiemaatregelen tot een maximale verhoging van
      € 20.000, inclusief eventuele subsidie op grond van de [SVOH][ref1] of [SVVE][ref2] met uitzondering van de
      subsidieverhoging voor realisatie van een zeer energiezuinig pakket, voor:


      [ref1]: https://wetten.overheid.nl/BWBR0046234
      [ref2]: https://wetten.overheid.nl/BWBR0047596
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046234
      - id: ref2
        bwb_id: BWBR0047596
  - number: 17.4.a.1°
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, niet zijnde een gemengde VvE, gemengde
      wooncoöperatie, of gemengde woonvereniging die in het aangewezen gebied vallen en een verzamelinkomen hebben tot
      140% van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.a.2°
    text: eigenaar-bewoners in een gemengde VvE, wooncoöperatie, of woonvereniging in het versterkingsgebied;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.a.3°
    text: |-
      verhuurders die maximaal één gebouw verhuren in een gemengde VvE, wooncoöperatie, of woonvereniging in het
      versterkingsgebied; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.a.4°
    text: |-
      eigenaar-bewoners in een gemengde VvE, wooncoöperatie, of woonvereniging, die een verzamelinkomen hebben tot 140%
      van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.b
    text: 'met € 1.000 per gebouw ter ondersteuning bij de uit te voeren subsidiabele activiteiten, voor:'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.b.1°
    text: woningeigenaars in het versterkingsgebied;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.b.2°
    text: woningeigenaars met een verzamelinkomen tot 140% van het sociaal minimum;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.b.3°
    text: eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, in het versterkingsgebied; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.4.b.4°
    text: |-
      eigenaar-bewoners in een VvE, wooncoöperatie, of woonvereniging, die een verzamelinkomen hebben tot 140% van het
      sociaal minimum.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: '17.5'
    text: |-
      Als een subsidie is toegekend aan het bestuur van een VvE, het bestuur van een wooncoöperatie of het bestuur van
      een woonvereniging, dan wordt het subsidiebedrag toegewezen per gebouw op basis van de door het bestuur van een
      VvE, wooncoöperatie of woonvereniging bij de aanvraag aangeleverde verdeelsleutel. Dat per gebouw toegewezen bedrag
      wordt in mindering gebracht op het voor de betreffende doelgroep geldende maximumbedrag uit het tweede en derde
      lid.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: '17.6'
    text: |-
      Voor het bepalen van de hoogte van de subsidie geldt dat de subsidiabele kosten betrekking hebben op ten hoogste de
      volgende te isoleren oppervlakten bij:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.a
    text: 'het aanbrengen van bodemisolatie: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.b
    text: 'het aanbrengen van schuimbeton: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.c
    text: 'het vervangen van bestaand glas door triple glas met nieuwe kozijnen: ten hoogste 45 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d
    text: |-
      de volgende maatregelen, als de maatregel geen deel uitmaakt van de set van maatregelen die op grond van een
      isolatieplan nodig is om de standaard voor woningisolatie te behalen:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.1°
    text: 'het aanbrengen van spouwmuurisolatie: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.2°
    text: 'het aanbrengen van zolder- of vlieringisolatie: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.3°
    text: 'het aanbrengen van binnen- of buitengevelisolatie: ten hoogste 170 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.4°
    text: 'het aanbrengen van vloerisolatie: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.5°
    text: 'het aanbrengen van dakisolatie bij een plat dak: ten hoogste 130 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.6°
    text: 'het aanbrengen van dakisolatie bij een hellend dak van binnenuit: ten hoogste 200 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.7°
    text: 'het vervangen van bestaand glas door HR++-glas zonder nieuwe kozijnen: ten hoogste 45 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.8°
    text: 'het plaatsen van voor- of achterzetbeglazing: ten hoogste 45 vierkante meter;'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.9°
    text: |-
      indien sprake is van een rijksmonument, provinciaal dan wel gemeentelijk monument, het vervangen van glas door
      monumentenglas of vacuümglas: ten hoogste 45 vierkante meter; of
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: 17.6.d.10°
    text: |-
      indien sprake is van een karakteristiek, beeldbepalend dan wel beeldondersteunend gebouw, het vervangen van glas
      door HR++-glas, dan wel het vervangen van glas door vacuümglas indien HR++-glas niet toegepast kan worden: ten
      hoogste 45 vierkante meter.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel17
  - number: '18.1'
    text: |-
      De aanvrager voltooit de uitvoering van de gesubsidieerde activiteiten binnen vierentwintig maanden, gerekend vanaf
      de dag na de verzenddatum van de beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel18
  - number: '18.2'
    text: |-
      De minister kan op verzoek van de aanvrager de in het eerste lid genoemde termijn met ten hoogste twaalf maanden
      verlengen, indien sprake is van onvoorziene omstandigheden op grond waarvan het aannemelijk is dat deze termijn
      niet kan worden gehaald.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel18
  - number: '18.3'
    text: |-
      De subsidieontvanger bewaart gedurende vijf jaar de facturen en betaalbewijzen van de gesubsidieerde activiteiten,
      gerekend vanaf de dag na de verzenddatum van de beschikking tot subsidievaststelling.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel18
  - number: '18.4'
    text: |-
      De aanvrager laat maatregelen alleen uitvoeren door een branchegerelateerd bedrijf indien dit bedrijf zich heeft
      gecommitteerd aan de isolatie- en ventilatiemaatregelencatalogus. Dat bedrijf hanteert maximaal de in die catalogus
      genoemde bedragen voor het uitvoeren van de maatregelen.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel18
  - number: '19.1'
    text: |-
      Een subsidieontvanger dient binnen 6 maanden na het verstrijken van de uitvoeringstermijn, bedoeld in
      [artikel 18, eerste lid][ref1], een aanvraag tot subsidievaststelling in, die ten minste de volgende gegevens
      bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel18
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '18'
        hoofdstuk: '3'
  - number: 19.1.a
    text: het adres van het gebouw, de woonboot of woonwagen waarvoor subsidie is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.b
    text: |-
      voor- en achternaam of naam de rechtspersoon, correspondentieadres, contactgegevens en het bankrekeningnummer van
      de partij aan wie de subsidie moet worden uitbetaald;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.c
    text: |-
      in geval van een doe-het-zelver: het overleggen van foto’s die aantonen dat de isolatie- en ventilatiemaatregelen
      waarvoor subsidie is aangevraagd op grond van deze regeling zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.d
    text: |-
      in geval van een uitgevoerde energiebesparende maatregel: de naam, het type, de dikte en de Rc-waarde of U-waarde
      ervan, inclusief vermelding van de locatie binnen het gebouw waar de activiteit is uitgevoerd en de oppervlakte die
      is geïsoleerd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.e
    text: |-
      in geval een ventilatiesysteem als bedoeld in [artikel 3, eerste lid, onderdeel b][ref1],is geplaatst: de naam en
      het type ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel3
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '3'
        hoofdstuk: '1'
  - number: 19.1.f
    text: |-
      in geval van glas- of deurisolatie: de glasmaat en de netto afmetingen van het glas, inclusief vermelding van de
      locatie binnen het gebouw waar de activiteit is uitgevoerd en de oppervlakte die is geïsoleerd;
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.g
    text: |-
      de facturen en betaalbewijzen van de uitgevoerde isolatie- en ventilatiemaatregelen en indien van toepassing het
      betaalbewijs van het uitgevoerde isolatieplan dat daaraan vooraf is gegaan, inhoudende:
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.g.1°
    text: 'bij contante betaling: de kwitantie; of'
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.g.2°
    text: |-
      bij elektronische betaling: een betaalbewijs met bankrekeningnummer van de aanvrager of van de in onderdeel
      d bedoelde persoon of rechtspersoon, het bedrag, betalingskenmerk, de datum van de overboeking, naam en
      bankrekeningnummer van de ontvangende partij; en
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: 19.1.h
    text: |-
      indien van toepassing: een bewijs van betalingen aan het branchegerelateerd bedrijf, een bewijs van betalingen die
      gedaan zijn uit het bouwdepot van het Warmtefonds dan wel bij voorfinanciering door de gemeenten.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
  - number: '19.2'
    text: |-
      In afwijking van het eerste lid en van [artikel 15][ref1] dient een aanvrager direct een aanvraag tot
      subsidievaststelling in binnen vierentwintig maanden na de datum van de laatste factuur of het laatste betaalbewijs
      met betrekking tot de isolatie- en ventilatiemaatregelen. De aanvraag bevat ten minste de gegevens, bedoeld in
      [artikel 11, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0051079#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0051079#Artikel11
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0051079
        artikel: '15'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0051079
        artikel: '11'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      Op verzoek van de minister verleent de aanvrager medewerking en verstrekt deze informatie ten behoeve van de
      voortgang en evaluatie van de doelmatigheid en doeltreffendheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel20
  - number: '21'
    text: |-
      De minister zendt binnen één jaar na de inwerkingtreding van deze regeling aan de Staten-Generaal een verslag over
      de doeltreffendheid en de doelmatigheid van deze regeling.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel21
  - number: '22'
    text: Deze regeling treedt in werking met ingang van 3 juni 2025.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel22
  - number: '23'
    text: |-
      Deze regeling vervalt met ingang van 3 juni 2035, met dien verstande dat deze van toepassing blijft op aanvragen om
      subsidies die voor deze datum zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel23
  - number: '24'
    text: |-
      Deze regeling wordt aangehaald als: Subsidieregeling isolatie en ventilatie gebouwen, woonboten en woonwagens
      provincie Groningen en de gemeenten Aa en Hunze, Noordenveld en Tynaarlo.
    url: https://wetten.overheid.nl/BWBR0051079/2025-12-24#Artikel24
