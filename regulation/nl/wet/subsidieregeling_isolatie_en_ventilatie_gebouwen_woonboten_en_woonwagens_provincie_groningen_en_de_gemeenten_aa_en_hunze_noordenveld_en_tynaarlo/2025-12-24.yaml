articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *aangewezen gebied:* gebied, bestaande uit alle postcodes in de provincie
      Groningen en de gemeenten Aa en Hunze, Noordenveld en Tynaarlo, met uitzondering van het versterkingsgebied;
        - *adres:* adres als bedoeld in [artikel 1, onderdeel a, van de Wet basisregistratie adressen en gebouwen][ref1];
        - *A:* de totale oppervlakte van het gebouw binnen de thermische schil;
        - *algemene groepsvrijstellingsverordening:* [Verordening (EU) nr. 651/2014](32014R0651) van de Commissie van
      17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne
      markt verenigbaar worden verklaard (PbEU 2014, L 187), laatstelijk gewijzigd door [Verordening (EU) 2023/1315]
      (32023R1315) (PbEU 2023, L 167);
        - *A:* de totale verliesoppervlakte van het gebouw binnen de thermische schil;
        - *BAG:* basisregistratie adressen en gebouwen als bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref2];
        - *biobased milieuvriendelijk isolatiemateriaal: isolatiemateriaal:* a. waarvan ten minste 70% van de massa bestaat
      uit biobased materiaal, zoals blijkt uit de materiaalsamenstelling van het product genoemd in de environmental
      product declaration van de fabrikant; en b. met een maximale milieukostenindicator van 0,85, genoemd in de
      categorie 1-productkaart als bedoeld in de Nationale Milieudatabase van het betreffende product, bij een Rd-waarde
      van 3,5 m2K/W;
        - *bodemisolatie:* maatregel waarbij een laag isolatiemateriaal op de bodem van de kruipruimte wordt aangebracht;
        - *branchegerelateerd bedrijf:* bedrijf dat is ingeschreven in de sectie bouwnijverheid, bouwinstallatiebedrijf of
      een vergelijkbare sectie in een handelsregister van een lidstaat van de Europese Unie of een van de overige staten
      die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte;
        - *BRL9500-MWA-W:* door de Stichting Kwaliteit voor Installaties Nederland bindend verklaarde Nationale
      Beoordelingsrichtlijn 9500, zoals vastgesteld op 1 juli 2023, inclusief latere wijzigingen;
        - *de-minimisverklaring:* verklaring als bedoeld in artikel 7, vierde lid, van de de-minimisverordening;
        - *de-minimisverordening:* Verordening (EU) van de Commissie van 13 december 2023 betreffende de toepassing van
      de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-minimissteun (PbEU 2023,
      L 2023/2831);
        - *doe-het-zelvers:* woningeigenaars, eigenaar-bewoners of verhuurders die maximaal één gebouw verhuren, die niet
      in de hoedanigheid van ondernemer, zelf de isolatie- en ventilatiemaatregelen uitvoeren;
        - *eigenaar-bewoner:* eigenaar van een gebouw, woonboot dan wel woonwagen, dat onderdeel is van een VvE,
      wooncoöperatie, of woonvereniging en daar zijn hoofdverblijf heeft;
        - *erfgoedgedragen isolatieplan:* isolatieplan voor een rijks-, provinciaal- of gemeentelijk monument dat getoetst
      is aan cultuurhistorische waarden en wordt aangeboden vanuit het ontzorgingsprogramma maatregel 29;
        - *gebouw:* voor bewoning bestemde gebouwde onroerende zaak of een gedeelte daarvan dan wel een recreatiewoning met
      een woonfunctie in de BAG;
        - *gemeentelijk monument:* gebouw of deel van een gebouw dat is ingeschreven in het gemeentelijk erfgoedregister,
      bedoeld in [artikel 3.16, derde lid, van de Erfgoedwet][ref3];
        - *gemengde VvE:* vereniging van eigenaars, bestaande uit een combinatie van eigenaar-bewoners, woningcorporaties
      of verhuurders als leden;
        - *ISDE:* investeringssubsidie duurzame energie en energiebesparing als bedoeld in
      [titel 4.5. van de Regeling nationale EZK- en LNV-subsidies][ref4];
        - *isolatieadviseur basis:* natuurlijke persoon of ondernemer die bewoners, verhuurders, bewonerscollectieven
      of organisaties adviseert bij het isoleren of ventileren van gebouwen, die een opleiding heeft voltooid die
      passend is voor een bekwame uitvoering van zijn rol binnen deze regeling, en die voldoet aan de eisen die voor de
      isolatieadviseur basis zijn opgenomen op [https://www.nijbegun.nl/themas/isolatieaanpak/eisenisolatieadviseurs]
      (https://www.nijbegun.nl/themas/isolatieaanpak/eisenisolatieadviseurs);
        - *isolatieadviseur uitgebreid:* natuurlijke persoon of ondernemer die bewoners, verhuurders, bewonerscollectieven
      of organisaties adviseert bij het isoleren of ventileren van gebouwen, die een opleiding heeft voltooid die
      passend is voor een bekwame uitvoering van zijn rol binnen deze regeling, die berekeningen kan uitvoeren
      volgens NTA 8800 en die voldoet aan de eisen die voor de isolatieadviseur uitgebreid zijn opgenomen op [https://
      www.nijbegun.nl/themas/isolatieaanpak/eisenisolatieadviseurs](https://www.nijbegun.nl/themas/isolatieaanpak/
      eisenisolatieadviseurs);
        - *isolatieregisseur voor monumenten:* natuurlijke persoon of ondernemer die bewoners, verhuurders,
      bewonerscollectieven of organisaties adviseert bij het isoleren of ventileren van een gebouw zijnde een
      rijksmonument, provinciaal dan wel gemeentelijk monument, die een opleiding heeft voltooid die passend is voor een
      bekwame uitvoering van zijn rol binnen deze regeling, en die voldoet aan de eisen die voor de isolatieregisseur
      voor monumenten zijn opgenomen op [https://www.nijbegun.nl/themas/isolatieaanpak/eisenisolatieadviseurs](https://
      www.nijbegun.nl/themas/isolatieaanpak/eisenisolatieadviseurs);
        - *isolatie- en ventilatiemaatregelencatalogus:* catalogus van maatregelen en marktconforme prijzen voor de
      subsidiabele activiteiten, gepubliceerd op [https://www.nijbegun.nl/themas/isolatieaanpak/maatregelencatalogus]
      (https://www.nijbegun.nl/themas/isolatieaanpak/maatregelencatalogus);
        - *isolatie- en ventilatiemaatregelencatalogus voor doe-het-zelf:* catalogus van maatregelen en marktconforme
      prijzen voor de subsidiabele activiteiten voor doe-het-zelvers, gepubliceerd op [https://www.nijbegun.nl/themas/
      isolatieaanpak/maatregelencatalogus](https://www.nijbegun.nl/themas/isolatieaanpak/maatregelencatalogus);
        - *kierdichting:* afdichting van openingen rondom bouwkundige elementen waar lucht ongecontroleerd naar binnen of
      buiten kan stromen, door middel van onder andere borstelstrips, kit, schuimband, tape of tochtstrips;
        - *KVK-nummer:* nummer waarmee het branchegerelateerd bedrijf of de aanvrager
      staat ingeschreven in het Handelsregister van de Kamer van Koophandel, bedoeld in
      [artikel 12, onderdeel a, van de Handelsregisterwet 2007][ref5];
        - *minister:* Minister van Volkshuisvesting en Ruimtelijke Ordening;
        - *provinciaal monument:* gebouw of deel van een gebouw dat is ingeschreven in het provinciaal erfgoedregister,
      genoemd in [artikel 3.17, vierde lid, van de Erfgoedwet][ref6];
        - *regionale steunkaart:* Besluit van de Europese Commissie van 27 januari 2022 inzake Steunmaatregel SA.100273
      (2021/N) inhoudende een regionale steunkaart voor Nederland die specifieke steunopslagen mogelijk maakt voor
      regionale steungebieden in onder meer de provincies Groningen en Drenthe;
        - *rijksmonument:* gebouw of deel van een gebouw dat is ingeschreven in het rijksmonumentenregister, bedoeld in
      [artikel 3.3 van de Erfgoedwet][ref7];
        - *sociaal minimum:* door de Rijksoverheid aangegeven halfjaarlijks bepaalde bedrag in de Normenbrief, ontleend aan
      de [Toeslagenwet][ref8] en gebaseerd op iemands leeftijd en burgerlijke staat, dat iemand minimaal nodig heeft om
      van te leven;
        - *standaard voor woningisolatie:* standaard voor de maximale warmtebehoefte om een gebouw aardgasvrij te maken,
      opgenomen in [bijlage II][ref9] bij deze regeling;
        - *SVOH:* [Subsidieregeling Verduurzaming en Onderhoud Huurwoningen][ref10];
        - *SVVE:* [Subsidieregeling Verduurzaming voor Verenigingen van Eigenaars][ref11];
        - *thermische schil:* thermische schil als beschreven in de meest recente druk van ISSO-publicatie 82.1;
        - *uitvoeringsinstantie:* Samenwerkingsverband Noord-Nederland;
        - *verhuurder:* een natuurlijke persoon of rechtspersoon die één of meer huurwoningen in eigendom heeft, niet
      zijnde een woningcorporatie;
        - *versterkingsgebied:* gebied, gepubliceerd op [https://www.nijbegun.nl/themas/isolatieaanpak/
      definitieversterkingsgebied](https://www.nijbegun.nl/themas/isolatieaanpak/definitieversterkingsgebied);
        - *vloerisolatie:* maatregel waarbij isolatiemateriaal wordt aangebracht aan de bovenkant of aan de onderkant van
      de vloer, of waarbij de gehele kruipruimte wordt gevuld met isolatiemateriaal;
        - *VvE:* vereniging van eigenaars als bedoeld in
      [artikel 112, eerste lid, onderdeel e, van Boek 5 van het Burgerlijk Wetboek][ref12];
        - *warmteverliesberekening:* berekening van het thermisch verlies van een gebouw, zodat kan worden bepaald wat het
      benodigde vermogen van een verwarmingssysteem moet zijn gelet op een bepaalde buitentemperatuur in de winter;
        - *wooncoöperatie:* wooncoöperatie als bedoeld in [artikel 18a, eerste lid, van de Woningwet][ref13];
        - *woningcorporatie:* toegelaten instelling als bedoeld in [artikel 19 van de Woningwet][ref14];
        - *woningeigenaar:* eigenaar van een gebouw, woonboot dan wel woonwagen, niet zijnde onderdeel van een VvE,
      wooncoöperatie of woonvereniging of eigendom van een verhuurder of woningcorporatie;
        - *woonvereniging:* vereniging die eigenaar is van één of meer gebouwen en waarvan de leden het recht hebben om in
      een bepaalde woning die deel uitmaakt van dat gebouw of die gebouwen te wonen.


