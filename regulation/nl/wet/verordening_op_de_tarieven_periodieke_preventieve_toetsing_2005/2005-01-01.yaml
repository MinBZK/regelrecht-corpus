preamble:
  text: |-
    Gelet op artikel 24, eerste lid, van de Wet de op de Accountants-Administratieconsulenten,

    stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0016838/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het tarief voor de toetsing als bedoeld in
      [artikel 18 van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt:

        - - voor een eerste toetsing € 640.- per toetser per dagdeel
        - - voor een hertoetsing € 770.- per toetser per dagdeel
        - - voor een marginale toetsing € 640.- per dagdeel


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel18
    url: https://wetten.overheid.nl/BWBR0016838/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '18'
  - number: '2'
    text: |-
      Het tarief voor een accreditatie als bedoeld in
      [artikel 18 van de Verordening op de Periodieke Preventieve Toetsing][ref1] bedraagt € 640,- per toetser per
      dagdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel18
    url: https://wetten.overheid.nl/BWBR0016838/2005-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '18'
  - number: '3'
    text: |-
      1 Toetsers die voor een toetsing of accreditatie worden ingeschakeld, ontvangen voor de bij het te toetsen
      accountantskantoor of de te accrediteren koepelorganisatie bestede tijd een vergoeding ten bedrage van € 280,-
      per dagdeel.

      2 Toetsers ontvangen een vergoeding van reis- en verblijfkosten overeenkomstig de regeling van de
      [artikelen 1][ref1], [2][ref2] en [3 van de Verordening op de Kostenvergoedingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006183#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006183#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006183#Artikel3
    url: https://wetten.overheid.nl/BWBR0016838/2005-01-01#Artikel3
    references:
      - id: ref1
