        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006183
        artikel: '3'
  - number: '4'
    text: |-
      1 Deze verordening treedt in werking met ingang van 1 januari 2005.

      2 De Verordening op de Tarieven periodieke preventieve toetsing 2004 wordt ingetrokken op het tijdstip bedoeld in
      het eerste lid, maar blijft van toepassing voor de periode waarin deze heeft gegolden.

      3 Deze verordening kan worden aangehaald als: Verordening op de tarieven periodieke preventieve toetsing 2005.

      Goedgekeurd bij beschikking van de Minister van Financiën van 13 juli 2004, nr. FM 2004-798 M.
    url: https://wetten.overheid.nl/BWBR0016838/2005-01-01#Artikel4
