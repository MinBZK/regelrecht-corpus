        artikel: 60a
  - number: III
    text: |-
      Indien een concessiehouder als bedoeld in [artikel 69, eerste lid, van de Wet personenvervoer 2000][ref1]
      op het tijdstip waarop zowel [dat artikel][ref2] als artikel I, onderdeel PP, van deze wet in werking
      zijn getreden, werkzaamheden verricht die op grond daarvan niet zijn toegestaan, worden die werkzaamheden
      binnen twaalf maanden na dat tijdstip beëindigd of overgedragen aan een privaatrechtelijke rechtspersoon.
      [Artikel 69, eerste lid, van de Wet personenvervoer 2000][ref3] geldt in die periode niet ten aanzien van die
      werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel69
