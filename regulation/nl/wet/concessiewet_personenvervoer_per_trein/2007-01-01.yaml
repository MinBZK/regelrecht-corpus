preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is gezien de verantwoordelijkheid van de minister voor het
    openbaar personenvervoer de toegang tot de markt van het openbaar vervoer per trein te ordenen door de invoering
    van een concessiestelsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015008/2007-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Tot zes maanden na het tijdstip waarop artikel I, onderdeel A, van deze wet in werking is getreden is
      [artikel 19 van de Wet personenvervoer 2000][ref1] niet van toepassing op openbaar vervoer per trein dat gedurende
      die periode wordt verricht ter uitvoering van een voor dat tijdstip tot stand gekomen openbare-dienstcontract als
      bedoeld in artikel 14 van [verordening (EEG) nr. 1191/69](31969R1191) van de Raad van de Europese Gemeenschappen
      van 26 juni 1969 betreffende het optreden van de lidstaten ten aanzien van met het begrip openbare dienst verbonden
      verplichtingen op het gebied van het vervoer per spoor, over de weg en over de binnenwateren (PbEG L 156).

      2 Tot zes maanden na het tijdstip waarop artikel I, onderdeel A, van deze wet in werking is getreden is
      [artikel 60a van de Wet personenvervoer 2000][ref2] niet van toepassing op concessies voor openbaar vervoer per
      trein dat voordien werd verricht ter uitvoering van een openbare-dienstcontract als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0011470#Artikel60a
    url: https://wetten.overheid.nl/BWBR0015008/2007-01-01#ArtikelII
    references:
