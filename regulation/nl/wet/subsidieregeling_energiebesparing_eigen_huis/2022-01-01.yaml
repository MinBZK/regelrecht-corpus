  - number: '14.2'
    text: |-
      Indien het een aanvraag voor een subsidie als bedoeld in [artikel 12, tweede lid, onderdeel a][ref1], betreft,
      wordt het bedrag dat berekend is op grond van het eerste lid vermenigvuldigd met een breuk waarvan de teller het
      percentage, bedoeld in artikel 12, derde lid, onderdeel d, is en de noemer 100.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
    references:
