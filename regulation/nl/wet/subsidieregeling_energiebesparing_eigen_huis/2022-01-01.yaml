        artikel: '12'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Indien het een aanvraag voor een subsidie als bedoeld in
      [artikel 12, tweede lid, onderdeel b, subonderdeel 1° of 2°][ref1], betreft, dan wordt in aanvulling op het
      bedrag dat resulteert uit de berekening uit het tweede lid, daarbij het bedrag opgeteld dat resulteert uit
      de volgende berekening: het bedrag dat berekend is op grond van het eerste lid wordt vermenigvuldigd met een
      breuk waarvan de teller het aantal huurwoningen waarvoor een verklaring als bedoeld in artikel 12, vierde of
      vijfde lid, is aangeleverd en die aan de voor die verklaring op grond van de de-minimisverordening of algemene
      groepsvrijstelling geldende voorwaarden voldoet, uitgedrukt als percentage van het totaal aantal appartementen in
      het gebouw, is en de noemer 100.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
