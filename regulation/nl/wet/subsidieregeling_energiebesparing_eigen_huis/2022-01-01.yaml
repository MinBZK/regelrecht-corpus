  - number: '5'
    text: 'Aanvullende energiebesparende maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: 5.a
    text: |-
      het vervangen van voor- en achterdeuren in de thermische schil door isolerende deuren met een maximale U-waarde van
      1,5 [W/m2K];
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: 5.b
    text: het voor de eerste keer aanleggen van een systeem voor CO-gestuurde ventilatie;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: 5.c
    text: |-
      het voor de eerste keer aanleggen van een systeem voor balansventilatie met wtw met een rendement van ten minste
      90%;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: 5.d
    text: het waterzijdig inregelen van het verwarmingssysteem;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: 5.e
    text: |-
      het in de woning plaatsen van een energiedisplay die verbonden is met een slimme meter en inzicht geeft in het
      gehele actuele energieverbruik in de woning of een thermostaat die het energieverbruik binnen de woning afstemt
      op het leefgedrag van de bewoners en verbonden is met een energiemanagementsysteem dat inzicht geeft in het gehele
      actuele energieverbruik in de woning, dan wel een thermostaat die voorzien is van een temperatuurregeling voor
      afzonderlijke ruimten in de woning.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een zeer energiezuinig pakket is een samenhangend pakket maatregelen, uitgevoerd in de gehele woning of het gehele
      gebouw, dat bestaat uit:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.1.a
    text: triple-glas in de thermische schil,
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.1.b
    text: een systeem voor CO-gestuurde ventilatie of balansventilatie met wtw,
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.1.c
    text: |-
      de overige energiebesparende maatregelen en aanvullende energiebesparende maatregelen, waarvan de elementen voldoen
      aan de isolatiewaarden, genoemd in het tweede lid en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.1.d
    text: een kierdichtheid die blijkens een luchtdichtheidstest (Qv_10) kar [l/s m2] ten hoogste 0,4 bedraagt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: '6.2'
    text: 'De isolatiewaarden in een zeer energiezuinig pakket zijn:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.2.a
    text: 'voor het dak: ten minste Rc 6,5 [m2K/W];'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.2.b
    text: 'voor de gevel: ten minste Rc 5,0 [m2K/W];'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.2.c
    text: 'voor de vloer of bodem: ten minste Rc 4,0 [m2K/W]; en'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: 6.2.d
    text: 'voor de kozijnen en deuren in de gevel: ten hoogste U 1,5 [W/m2K].'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel6
  - number: '7.1'
    text: 'De minister kan aan een eigenaar-bewoner ten behoeve van zijn woning subsidie verstrekken voor:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het na 14 augustus 2019 door een bouwbedrijf laten uitvoeren van twee of meer energiebesparende maatregelen over
      de gehele daarvoor in aanmerking komende oppervlakten van de woning of over ten minste de oppervlakten, genoemd in
      [artikel 4, tweede, derde, vierde of vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel4
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '4'
        hoofdstuk: II
  - number: 7.1.b
    text: |-
      het na 14 augustus 2019 door een bouwbedrijf laten uitvoeren van een of meer aanvullende energiebesparende
      maatregelen;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: 7.1.c
    text: het na 14 augustus 2019 door een bouwbedrijf laten uitvoeren van een zeer energiezuinig pakket, en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: 7.1.d
    text: een na 14 augustus 2019 opgeleverd maatwerkadviesrapport.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: '7.2'
    text: |-
      Subsidie op grond van het eerste lid, onderdelen b en d, wordt uitsluitend verstrekt in combinatie met subsidie op
      grond van het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: '7.3'
    text: Per woning wordt per maatregel slechts eenmaal subsidie op grond van dit artikel verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: '7.4'
    text: |-
      Op grond van het eerste lid, onderdelen a, b en c, kan ook subsidie worden verstrekt, indien de in die onderdelen
      bedoelde activiteiten ook uit andere hoofde zijn of worden gesubsidieerd of gefinancierd.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor een maatwerkadviesrapport wordt op grond van het eerste lid, onderdeel d, geen subsidie verstrekt, indien
      daarvoor reeds door een ander bestuursorgaan subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een aanvraag voor subsidie op grond van [artikel 7, eerste lid][ref1], wordt uiterlijk op 31 december 2020
      ingediend met gebruikmaking van een door de minister elektronisch beschikbaar gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel7
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '7'
        hoofdstuk: III
  - number: '8.2'
    text: |-
      In plaats van de gegevens en bescheiden, bedoeld in [artikel 11, derde lid, van het Kaderbesluit][ref1], bevat de
      aanvraag in ieder geval de volgende gegevens en verklaringen:


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '11'
  - number: 8.2.a
    text: |-
      het adres, de postcode en het huisnummer en toevoeging van de woning ten behoeve waarvan subsidie wordt
      aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: 8.2.b
    text: vermelding van het type woning ten behoeve waarvan subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: 8.2.c
    text: het bankrekeningnummer waarop het subsidiebedrag dient te worden overgemaakt;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: 8.2.d
    text: indien van toepassing, de vermelding dat de aanvraag subsidie voor een zeer energiezuinig pakket betreft;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: 8.2.e
    text: |-
      indien van toepassing, de naam en het adres van de EPA-adviseur die de woning heeft opgenomen ten behoeve van het
      maatwerkadviesrapport, alsmede de naam, het adres, het inschrijfnummer bij de Kamer van Koophandel en het nummer
      van het certificaat van de certificaathouder waarvoor hij werkt;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: 8.2.f
    text: |-
      als ook subsidie wordt aangevraagd voor een maatwerkadviesrapport, een verklaring dat daarvoor niet reeds subsidie
      is aangevraagd bij of verstrekt door een ander bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij de aanvraag wordt meegezonden een door de minister beschikbaar gesteld formulier dat is ingevuld en ondertekend
      door het bouwbedrijf dat een of meer in [hoofdstuk II][ref1] bedoelde maatregelen heeft uitgevoerd. Het formulier
      betreft een omschrijving van de op het adres van de subsidieaanvrager uitgevoerde maatregelen onder vermelding,
      voor zover van belang voor de subsidieverstrekking, van de aantallen en de oppervlakten waarover de onderscheiden
      maatregelen zijn uitgevoerd alsmede van de energetische kwaliteit van de uitgevoerde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0038472
        hoofdstuk: II
  - number: '8.4'
    text: |-
      Bij de aanvraag wordt tevens een afschrift van de factuur of facturen, een betalingsbewijs of betalingsbewijzen van
      de uitgevoerde maatregelen en nader bewijs dat maatregelen zijn uitgevoerd meegezonden.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien ook subsidie wordt aangevraagd voor een maatwerkadviesrapport, wordt bij de aanvraag tevens een afschrift
      van de factuur en een betalingsbewijs meegezonden.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel8
  - number: '9.1'
    text: |-
      De minister kan aan een vereniging ten behoeve van een gebouw of groep van gebouwen waarvoor de vereniging is
      opgericht of mede is opgericht subsidie verstrekken voor:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: 9.1.a
    text: |-
      een energieadvies of een energieadvies en procesbegeleiding, mits het energieadvies voldoet aan de eisen, bedoeld
      in het tweede lid en de vergadering van eigenaars of de algemene ledenvergadering van de vereniging heeft besloten
      tot het binnen zestig maanden in uitvoering nemen van ten minste twee maatregelen, genoemd in het vierde lid;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: 9.1.b
    text: |-
      een mjop en procesbegeleiding in combinatie met een energieadvies, mits het mjop voldoet aan de eisen, bedoeld in
      het derde lid, bij besluit van de vergadering van eigenaars of de algemene ledenvergadering van een vereniging is
      vastgesteld en het energieadvies voldoet aan de eisen, genoemd in het tweede lid, of
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: 9.1.c
    text: een energieadvies, mits het energieadvies voldoet aan de eisen, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het energieadvies is na 1 september 2016 opgesteld door een certificaathouder en bevat een nauwkeurige
      omschrijving van de bestaande situatie op basis van een ter plekke door een EPA-adviseur uitgevoerde technische
      en bouwkundige beoordeling van de schil en de installaties van het gebouw of van de groep van gebouwen, alsmede
      een beschrijving van de mogelijke energiebesparingsmaatregelen met voor- en nadelen en de keuzemogelijkheden per
      maatregel, een inschatting van de investering en van de te realiseren energiebesparing. Een energieadvies maakt de
      terugverdientijd van de voorgenomen investeringen inzichtelijk en geeft een uitleg over de mogelijkheden voor het
      realiseren van een zeer energiezuinig pakket of een NulopdeMeter-woning met een beeld van de typen maatregelen die
      nodig zouden zijn om dit niveau in het betrokken gebouw of groep van gebouwen te bereiken.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het mjop is na 1 september 2016 vastgesteld en bevat, behalve de onderhouds-, herstel- en vernieuwingswerkzaamheden
      die gedurende de looptijd van het plan nodig worden geacht, ook de uitvoering binnen tien jaar van ten minste twee
      maatregelen, genoemd in vierde lid. Een mjop bevat tevens een kostenberekening van de geplande werkzaamheden en een
      gelijkmatige toerekening van de kosten aan de onderscheiden jaren.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '9.4'
    text: |-
      De maatregelen, bedoeld in het eerste lid, onderdeel a, en het derde lid zijn: energiebesparende maatregelen, het
      aanbrengen van zonnepanelen en het installeren van zonneboilers, biomassaketels, warmtepompen en pelletkachels.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '9.5'
    text: Subsidie op grond van het eerste lid wordt slechts eenmaal per gebouw of groep van gebouwen verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '9.6'
    text: |-
      Op grond van het eerste lid wordt geen subsidie verstrekt, indien voor in dat lid bedoelde activiteiten reeds door
      een ander bestuursorgaan subsidie is verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een aanvraag voor subsidie op grond van [artikel 9, eerste lid][ref1], wordt voor 3 februari 2021 of in de periode
      van 1 april 2021 tot 1 januari 2023 ingediend met gebruikmaking van een door de minister elektronisch beschikbaar
      gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '10.2'
    text: |-
      In plaats van de gegevens en bescheiden, bedoeld in [artikel 11, derde lid, van het Kaderbesluit][ref1], bevat de
      aanvraag in ieder geval de volgende gegevens, bescheiden en verklaring:


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '11'
  - number: 10.2.a
    text: het inschrijfnummer van de vereniging bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.b
    text: het adres of de kadastrale aanduiding van het gebouw of de gebouwen ten behoeve waarvan subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.c
    text: het aantal appartementen in het gebouw of de groep van gebouwen dat een koopwoning is;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.d
    text: het bankrekeningnummer waarop het subsidiebedrag dient te worden overgemaakt;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.e
    text: |-
      de naam, het adres en het inschrijfnummer bij de Kamer van Koophandel van de certificaathouder die het
      energieadvies heeft opgesteld, alsmede het nummer van het certificaat;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.f
    text: |-
      de naam en het adres van de EPA-adviseur die het gebouw heeft opgenomen ten behoeve van het energieadvies alsmede
      de naam, het adres, het inschrijfnummer bij de Kamer van Koophandel en het nummer van het certificaat van de
      certificaathouder waarvoor hij werkt, indien dit niet de certificaathouder is, bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.g
    text: |-
      een factuur en een betalingsbewijs van het energieadvies en, indien van toepassing, het mjop en de
      procesbegeleiding;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
  - number: 10.2.h
    text: |-
      een afschrift van het besluit van de vergadering van eigenaars of de algemene ledenvergadering, bedoeld in
      [artikel 9, eerste lid, onderdeel a of b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 10.2.i
    text: |-
      een verklaring dat niet reeds subsidie voor de activiteiten, bedoeld in [artikel 9, eerste lid][ref1], is
      aangevraagd bij of verstrekt door een ander bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '11.1'
    text: |-
      De minister kan aan een vereniging ten behoeve van een gebouw waarvoor de vereniging is opgericht of mede is
      opgericht en waarin zich ten minste één koopwoning bevindt subsidie verstrekken voor het na de datum van indiening
      van de subsidieaanvraag door een bouwbedrijf laten uitvoeren van:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: 11.1.a
    text: |-
      twee of meer energiebesparende maatregelen over de gehele daarvoor in aanmerking komende oppervlakten van
      het gebouw of over ten minste de oppervlakten, bedoeld in [artikel 4, zesde lid][ref1], of een of meer
      energiebesparende maatregelen over de gehele daarvoor in aanmerking komende oppervlakten van het gebouw of
      over ten minste de oppervlakten, bedoeld in artikel 4, zesde lid, in combinatie met een andere gelijkwaardige
      energiebesparende maatregel die voor wat betreft de mate van energiebesparing overeenkomt met een dergelijke
      energiebesparende maatregel;


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel4
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '4'
        hoofdstuk: II
  - number: 11.1.b
    text: een of meer aanvullende energiebesparende maatregelen, en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: 11.1.c
    text: een zeer energiezuinig pakket.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: '11.2'
    text: |-
      Subsidie op grond van het eerste lid, onderdeel b, wordt uitsluitend verstrekt in combinatie met subsidie op grond
      van het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: '11.3'
    text: Subsidie op grond van het eerste lid wordt per maatregel slechts eenmaal per gebouw verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: '11.4'
    text: |-
      Op grond van het eerste lid, onderdelen a, b en c, kan ook subsidie worden verstrekt, indien de in die onderdelen
      bedoelde activiteiten ook uit andere hoofde zijn of worden gesubsidieerd of gefinancierd.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het vierde lid wordt geen subsidie verstrekt ten behoeve van huurwoningen in het gebouw indien
      de aanvraag is gedaan op grond van [artikel 12, tweede lid, onderdeel b, onder 1°][ref1], als blijkt dat een
      begunstigde van staatssteun meer steun ontvangt dan is toegestaan op basis van de de-minimisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '11.6'
    text: |-
      In afwijking van het vierde lid wordt geen subsidie verstrekt indien de begunstigde van de subsidie reeds
      subsidie heeft ontvangen voor de activiteiten bedoeld in het eerste lid, onderdelen a, b of c, op grond van de
      [Regeling vermindering verhuurderheffing 2014][ref1] of de [Stimuleringsregeling energieprestatie huursector][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034548
      [ref2]: https://wetten.overheid.nl/BWBR0035224
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0034548
      - id: ref2
        bwb_id: BWBR0035224
  - number: '11.7'
    text: |-
      Voor zover de subsidie die verstrekt wordt aan een vereniging toekomt aan eigenaren van huurwoningen en bij
      de aanvraag gebruik wordt gemaakt van [artikel 12, tweede lid, onderdeel b, subonderdeel 2°][ref1], dienen de
      voor subsidie in aanmerking komende kosten voor energiebesparende en aanvullende energiebesparende maatregelen
      en zeer energiezuinig pakket rechtstreeks verband te houden met het behalen van een hoger niveau van energie-
      efficiëntie en de kosten dienen voor de investering in energie-efficiëntie binnen de totale investeringskosten als
      een afzonderlijke investering te kunnen worden vastgesteld als bedoeld in artikel 38, derde lid, van de algemene
      groepsvrijstellingsverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '11.8'
    text: |-
      De aanvrager toont de gelijkwaardigheid van de andere maatregel, bedoeld in het eerste lid, onderdeel a, aan door
      middel van een verklaring van een certificaathouder als bedoeld in BRL 9500, deel 02, of een certificaathouder
      als bedoeld in BRL 9500 W, die een gelijkwaardigheidsberekening en een oordeel van de certificaathouder over de
      gelijkwaardigheid bevat.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11
  - number: 11a
    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], geldt dat de minister subsidie kan verstrekken aan een vereniging
      die reeds voor de datum van indiening van de subsidieaanvraag is begonnen met het door een bouwbedrijf laten
      uitvoeren van activiteiten als bedoeld in artikel 11, eerste lid, indien de aanvang van de uitvoering van die
      activiteiten heeft plaatsgevonden in het tijdvak van 3 februari 2021 tot 1 april 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Een aanvraag voor subsidie op grond van [artikel 11, eerste lid][ref1], wordt voor 3 februari 2021 of in de periode
      van 1 april 2021 en 1 januari 2023 ingediend met gebruikmaking van een door de minister elektronisch beschikbaar
      gesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Een vereniging kan ten behoeve van een gebouw waarvoor de vereniging is opgericht of mede is opgericht een aanvraag
      op grond van [artikel 11, eerste lid][ref1], doen voor een subsidie waarvoor:


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 12.2.a
    text: |-
      op grond van [artikel 14, tweede lid][ref1], enkel subsidie wordt verstrekt voor het aandeel koopwoningen binnen de
      vereniging; of


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '14'
        hoofdstuk: V
  - number: 12.2.b
    text: |-
      op grond van [artikel 14, derde lid][ref1], subsidie wordt verstrekt voor het aandeel koopwoningen en het aandeel
      huurwoningen binnen de vereniging. De subsidie die wordt verstrekt ten behoeve van het aandeel huurwoningen binnen
      de vereniging, kan staatssteun bevatten en gerechtvaardigd worden door inachtneming van de voorwaarden van:


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '14'
        hoofdstuk: V
  - number: 12.2.b.1°
    text: de de-minimisverordening; of
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.2.b.2°
    text: artikel 38 van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      In plaats van de gegevens en bescheiden, bedoeld in [artikel 11, derde lid, van het Kaderbesluit][ref1] bevat de
      aanvraag bedoeld in het tweede lid, onderdeel a, in ieder geval de volgende gegevens en bescheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0033530
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0033530
  - number: 12.3.a
    text: het inschrijfnummer van de vereniging bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.b
    text: het adres of de kadastrale aanduiding van het gebouw ten behoeve waarvan subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.c
    text: het aantal appartementen in het gebouw;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.d
    text: |-
      als het een vereniging betreft waarvan niet alle leden eigenaar-bewoner zijn, een opgave van het als percentage
      uitgedrukte aandeel appartements- of woonrechten in de vereniging van de leden die eigenaar-bewoner zijn, zulks
      gerelateerd aan het gebouw ten behoeve waarvan de subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.e
    text: indien van toepassing, de vermelding dat de aanvraag subsidie voor een zeer energiezuinig pakket betreft;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.f
    text: |-
      als het een vereniging betreft waarvan niet alle leden eigenaar-bewoner zijn, het aantal appartementen in het
      gebouw dat koopwoning is;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.g
    text: het bankrekeningnummer waarop het subsidiebedrag dient te worden overgemaakt; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.3.h
    text: |-
      een verklaring dat de vergadering van eigenaars of de algemene ledenvergadering van de vereniging besloten heeft
      tot uitvoering van de energiebesparende en, indien van toepassing, aanvullende energiebesparende maatregelen of
      het zeer energiezuinige pakket waarvoor subsidie wordt gevraagd en dat namens de vereniging met betrekking tot de
      uitvoering van die maatregelen of het zeer energiezuinig pakket overeenkomstig de omschrijving in het formulier,
      bedoeld in het derde lid, een offerte is geaccepteerd van het bouwbedrijf dat dit formulier heeft ondertekend.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: '12.4'
    text: |-
      Een aanvraag als bedoeld in het tweede lid, onderdeel b, subonderdeel 1°, bevat naast de gegevens en bescheiden
      bedoeld in het derde lid, tevens een verklaring per eigenaar van een of meerdere huurwoningen, waaruit blijkt dat
      deze begunstigde van staatssteun niet meer steun ontvangt dan is toegestaan op grond van de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: '12.5'
    text: |-
      Een aanvraag als bedoeld in het tweede lid, onderdeel b, subonderdeel 2°, bevat naast de gegevens en bescheiden
      bedoeld in het derde lid, tevens:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.5.a
    text: 'een verklaring per eigenaar van een of meerdere huurwoningen dat er geen sprake is van:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.5.a.1°
    text: een onderneming in moeilijkheden als bedoeld in de algemene groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.5.a.2°
    text: |-
      een onderneming ten aanzien waarvan een bevel tot terugvordering van steun uitstaat als bedoeld in de algemene
      groepsvrijstellingsverordening; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.5.a.3°
    text: ongeoorloofde cumulatie van steun op grond van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: 12.5.b
    text: de offertes waarin de maatregelen en de kosten daarvan zijn opgenomen waarvoor subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
  - number: '12.6'
    text: |-
      Bij de aanvraag wordt meegezonden een door de minister beschikbaar gesteld formulier dat is ingevuld en ondertekend
      door het bouwbedrijf dat een of meer in [hoofdstuk II][ref1] bedoelde maatregelen zal uitvoeren. Het formulier
      betreft een omschrijving van de in het gebouw van de vereniging uit te voeren maatregelen onder vermelding, voor
      zover van belang voor de subsidieverstrekking, van de aantallen en de oppervlakten waarover de onderscheiden
      maatregelen worden uitgevoerd alsmede van de energetische kwaliteit van de uit te voeren maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        hoofdstuk: II
  - number: '12.7'
    text: |-
      In geval de aanvraag tevens betrekking heeft op een of meer andere gelijkwaardige energiebesparende maatregelen
      als bedoeld in [artikel 11, eerste lid, onderdeel a][ref1], dan bevat de aanvraag een verklaring waarin aanvrager
      aangeeft dat hij beschikt over een verklaring als bedoeld in artikel 11, achtste lid, welke verklaring kan worden
      opgevraagd door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: 12a.1
    text: |-
      De Minister kan aan een vereniging subsidie verstrekken voor advisering door een bij de Kamer van Koophandel
      ingeschreven adviseur over de realisatie van één of meer oplaadpunten op de parkeergelegenheid van het gebouw of
      groep van gebouwen waarvoor die vereniging is opgericht en waarin zich ten minste één koopwoning bevindt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12a
  - number: 12a.2
    text: Subsidie op grond van het eerste lid wordt slechts eenmaal per gebouw of groep van gebouwen verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Een subsidie kan worden verstrekt voor advisering waarbij het schriftelijk advies als bedoeld in
      [artikel 12b, eerste lid, onder b][ref1], is verstrekt na 5 oktober 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12b
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '3'
  - number: 12b.1
    text: |-
      De advisering, bedoeld in [artikel 12a, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12a
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 12b.1.a
    text: |-
      is mede gebaseerd op het ter plaatse beschouwen van de parkeergelegenheid waarop het oplaadpunt of de oplaadpunten
      gerealiseerd zouden worden; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.1.b
    text: resulteert in een schriftelijk advies.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2
    text: 'Het schriftelijk advies omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.a
    text: een prognose van de laadbehoefte van de vereniging voor ten minste tien jaar;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.b
    text: |-
      aanbevelingen voor de borging van de brandveiligheid in relatie tot het plaatsen van één of meer oplaadpunten, als
      de parkeergelegenheid geheel of gedeeltelijk is gelegen in een gebouw;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.c
    text: |-
      aanbevelingen voor de verdeling van de kosten van de oplaadpunten tussen de vereniging en de gebruikers van de
      oplaadpunten;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.d
    text: |-
      aanbevelingen voor de benodigde elektrische aansluiting en installatie van de oplaadpunten, waarbij in ieder geval
      wordt ingegaan op:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.d.1°
    text: |-
      de mogelijkheid tot optimale verdeling van de beschikbare stroom over de op te laden voertuigen en het laden op
      optimale momenten;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.d.2°
    text: |-
      de mogelijkheid om het laden tijdelijk te vertragen of te stoppen ter voorkoming van overbelasting van het
      stroomnetwerk in het gebouw; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.d.3°
    text: borging van de fysieke en digitale veiligheid van de oplaadpunten; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12b.2.e
    text: |-
      een duiding van de relevante wet- en regelgeving en de wijze waarop deze van invloed is op de aanbevelingen,
      bedoeld onder b en d.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12b
  - number: 12c.1
    text: |-
      Een aanvraag voor een subsidie als bedoeld in [artikel 12a][ref1] kan worden ingediend van 24 januari 2022 tot en
      met 30 september 2023.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12a
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '3'
  - number: 12c.2
    text: 'De aanvraag bevat:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
  - number: 12c.2.a
    text: |-
      het schriftelijke advies, bedoeld in [artikel 12b, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12b
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '3'
  - number: 12c.2.b
    text: een factuur van de adviseur en een betalingsbewijs van de vereniging;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
  - number: 12c.2.c
    text: het inschrijfnummer bij de Kamer van Koophandel van de adviseur; en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
  - number: 12c.2.d
    text: |-
      indien niet alle leden van de vereniging eigenaar-bewoners zijn: een verklaring waaruit blijkt dat die leden niet
      meer subsidie ontvangen dan is toegestaan op basis van de de-minimisverordening.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
  - number: 12c.3
    text: |-
      De aanvraag hoeft niet te bevatten de gegevens en bescheiden, genoemd in
      [artikel 11, derde lid, onder c, d, en e van het Kaderbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '11'
  - number: 12c.4
    text: |-
      Een aanvraag wordt ingediend na afronding van het schriftelijk advies, bedoeld in [artikel 12b, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12b
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12b
        hoofdstuk: IV
        paragraaf: '3'
  - number: 12c.5
    text: Een aanvraag wordt ingediend met gebruikmaking van een door de Minister elektronisch beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel12c
  - number: '13.1'
    text: |-
      De subsidie, bedoeld in [artikel 7, eerste lid, onderdeel d][ref1], bedraagt € 150.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel7
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '7'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      De subsidie, bedoeld in [artikel 9, eerste lid, onderdeel a][ref1], bedraagt 75% van de kosten (inclusief btw) van
      het energieadvies of van de totale kosten (inclusief btw) van het energieadvies en de procesbegeleiding, maar voor
      een gebouw of een groep van gebouwen met een tot vier koopwoningen ten hoogste € 1.000 en voor een gebouw of groep
      van gebouwen met vijf tot acht koopwoningen ten hoogste € 1.600; voor een gebouw of groep van gebouwen met meer dan
      acht koopwoningen bedraagt die subsidie € 1.600 plus € 110 per extra koopwoning tot een maximumbedrag van € 4.020.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.3'
    text: |-
      De subsidie, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], bedraagt 75% van de totale kosten (inclusief
      btw) van het energieadvies en het mjop of van de totale kosten (inclusief btw) van het energieadvies, het mjop en
      de procesbegeleiding, maar voor een gebouw of groep van gebouwen met een tot vier koopwoningen ten hoogste € 1.500
      en voor een gebouw of groep van gebouwen met vijf tot acht koopwoningen ten hoogste € 2.600; voor een gebouw of
      groep van gebouwen met meer dan acht koopwoningen bedraagt die subsidie € 2.600 plus € 160 per extra koopwoning,
      tot een maximumbedrag van € 6.120.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '13.4'
    text: |-
      De subsidie, bedoeld in [artikel 9, eerste lid, onderdeel c][ref1], bedraagt 75% van de kosten (inclusief btw) van
      het energieadvies, maar voor een gebouw of een groep van gebouwen met een tot vier koopwoningen ten hoogste € 400
      en voor een gebouw of groep van gebouwen met vijf tot acht koopwoningen ten hoogste € 800; voor een gebouw of groep
      van gebouwen met meer dan acht koopwoningen bedraagt die subsidie € 800 plus € 80 per extra koopwoning tot een
      maximumbedrag van € 2.560.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '14.1'
    text: |-
      Onverminderd [artikel 17][ref1] en met inachtneming van het tweede lid, bedraagt de subsidie voor:


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel17
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '17'
        hoofdstuk: V
  - number: 14.1.a
    text: 'spouwmuurisolatie: € 5 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.b
    text: 'gevelisolatie: € 25 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.c
    text: 'isolatie van het dak in de thermische schil: € 20 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.d
    text: 'isolatie van de zolder- of vlieringvloer, indien de zolder of vliering onverwarmd is: € 5 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.e
    text: 'vloerisolatie: € 7 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.f
    text: 'bodemisolatie eventueel in combinatie met vloerisolatie: € 4 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.g
    text: 'HR++ glas: € 35 per m2;'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14
  - number: 14.1.h
    text: |-
