  - number: '15'
    text: |-
      Voor realisatie van een zeer energiezuinig pakket wordt de subsidie met overeenkomstige toepassing van
      [artikel 14][ref1] berekend en vervolgens verhoogd met € 4.000 per woning.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '14'
        hoofdstuk: V
  - number: '17.1'
    text: |-
      De totale subsidie voor een eigenaar-bewoner op grond van [artikel 7, eerste lid][ref1], bedraagt ten hoogste
      € 10.000 en op grond van [artikel 6][ref2] ten hoogste € 15.000.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel6
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0038472
        artikel: '6'
        hoofdstuk: II
  - number: '17.2'
    text: |-
      De subsidie voor een vereniging bedraagt per koopwoning gemiddeld ten hoogste € 10.000 op grond van
      [artikel 11, eerste lid][ref1], en ten hoogste € 15.000 op grond van [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel6
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0038472
        artikel: '6'
        hoofdstuk: II
  - number: '17.3'
    text: |-
      De totale subsidie voor een vereniging op grond van [artikel 11, eerste lid][ref1], bedraagt ten hoogste
      € 2.500.000.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '17.4'
    text: |-
      Indien het een aanvraag voor een subsidie als bedoeld in
      [artikel 12, tweede lid, onderdeel b, subonderdeel 2°][ref1] betreft, dan bedraagt de totale subsidie voor een
      vereniging op grond van [artikel 11, eerste lid][ref2], ten hoogste 30% van de voor staatssteun in aanmerking
      komende kosten van de te treffen energiebesparende en aanvullende energiebesparende maatregelen of het zeer
      energiezuinige pakket.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel11
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '12'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0038472
        artikel: '11'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '17.5'
    text: |-
      De subsidie voor een vereniging als bedoeld in [artikel 12a][ref1] bedraagt ten hoogste 75 procent van de kosten
      voor de advisering, met een maximum van € 1.500.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel12a
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: 12a
        hoofdstuk: IV
        paragraaf: '3'
  - number: '18.1'
    text: |-
      Bij de verstrekking van een subsidie op grond van deze regeling van minder dan € 25.000 wordt toepassing gegeven
      aan [artikel 16, tweede lid, onderdeel a, van het Kaderbesluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
  - number: '18.2'
    text: |-
      Bij de verstrekking van een subsidie op grond van deze regeling van meer dan € 125 000 is
      [artikel 17 van het Kaderbesluit][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel17
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '17'
  - number: '19.1'
    text: |-
      Indien de subsidieontvanger een vereniging is, is hij verplicht, te rekenen vanaf de datum van de dagtekening van
      de subsidiebeschikking:
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19
  - number: 19.1.a
    text: |-
      de energiebesparende maatregelen en de aanvullende energiebesparende maatregelen waarvoor subsidie wordt verstrekt,
      te laten uitvoeren binnen een termijn van twaalf maanden, en
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19
  - number: 19.1.b
    text: |-
      het zeer energiezuinige pakket waarvoor subsidie wordt verstrekt, te laten uitvoeren binnen een termijn van
      vierentwintig maanden.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien de uitvoering van de maatregelen binnen de termijn, genoemd in het eerste lid, buiten de schuld van de
      subsidieontvanger niet mogelijk is, kan de minister die termijn op schriftelijk en gemotiveerd verzoek van de
      subsidieontvanger een maal met ten hoogste twaalf maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19
  - number: 19a.1
    text: |-
      De minister maakt binnen zes maanden na de datum van subsidieverlening overeenkomstig
      [artikel 9, eerste lid, onderdeel c][ref1], van de algemene groepsvrijstellingsverordening, de gegevens openbaar,
      als de subsidie aan een aanvrager voor het aandeel huurwoningen binnen een of meerdere verenigingen meer bedraagt
      dan € 500.000,-.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel9
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0038472
        artikel: '9'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 19a.2
    text: De gegevens, bedoeld in dit artikel, blijven voor ten minste tien jaar openbaar beschikbaar.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel19a
  - number: '21'
    text: |-
      Deze regeling treedt in werking met ingang van 15 september 2016 en vervalt op 1 januari 2024, met dien verstande
      dat zij van toepassing blijft op subsidies die op grond van deze regeling vóór laatstgenoemde datum zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel21
  - number: '22'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling energiebesparing eigen huis.'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel22
