  - number: '3.5'
    text: Het beschikbare bedrag per subsidieplafond wordt verdeeld op volgorde van ontvangst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel3
  - number: '3.6'
    text: |-
      Indien er meer aanvragen zijn ontvangen op één dag, waarbij toekenning van al deze aanvragen zou leiden tot
      overschrijding van het betreffende subsidieplafond wordt, in afwijking van het vierde lid, de onderlinge rangorde
      van die aanvragen door loting vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel3
  - number: '3.7'
    text: |-
      Indien het subsidieplafond, genoemd in het tweede lid, op de in dat lid bedoelde dag niet geheel is besteed, wordt
      het subsidieplafond, genoemd in het derde lid, verhoogd met het resterende bedrag.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Energiebesparende maatregelen zijn: spouwmuurisolatie, gevelisolatie, dakisolatie, vloer- of bodemisolatie en
      hoogrendementsglas, waarbij wordt verstaan onder: - *spouwmuurisolatie:* het isoleren van bestaande spouwmuren in
      de thermische schil met isolatiemateriaal met een minimale Rd-waarde van 1,1 [m2K/W];
        - *gevelisolatie:* het isoleren van de bestaande binnen- en buitengevel met isolatiemateriaal met een minimale Rd-
      waarde van 3,5 [m2K/W];
        - *dakisolatie:* het isoleren van het bestaande dak in de thermische schil of van de bestaande zolder- of
      vlieringvloer, indien de zolder of vliering onverwarmd is met isolatiemateriaal met een minimale Rd-waarde van 3,5
      [m2K/W];
        - *vloer- of bodemisolatie:* het isoleren van de bestaande vloer of de bestaande bodem in de thermische schil met
      isolatiemateriaal met een minimale Rd-waarde van 3,5 [m2K/W];
        - *hoogrendementsglas:* het vervangen van glas in de thermische schil door HR++ glas, of door triple-glas in
      combinatie met het vervangen van het kozijn door een isolerend kozijn met een maximale U-waarde van 1,5 [W/m2K], al
      dan niet in combinatie met panelen;
        - *HR++ glas:* glas met een maximale U-waarde van 1,2 [W/m2K];
        - *triple-glas:* glas met een maximale U-waarde van 0,7 [W/m2K];
        - *panelen:* panelen met minimaal dezelfde U-waarde als de glassoort waarmee deze worden gecombineerd.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel4
