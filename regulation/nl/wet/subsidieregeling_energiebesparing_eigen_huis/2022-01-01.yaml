        artikel: '14'
        hoofdstuk: V
  - number: 14b
    text: |-
      In afwijking van [artikel 14, eerste lid][ref1], bedraagt de subsidie aan een vereniging door wie de aanvraag
      is ingediend in de periode van 1 januari 2022 tot en met 31 december 2023 voor: a. spouwmuurisolatie: € 8 per
      m2; b. gevelisolatie: € 38 per m2; c. isolatie van het dak in de thermische schil: € 30 per m2; d. isolatie
      van de zolder- of vlieringvloer, indien de zolder of vliering onverwarmd is: € 8 per m2; e. vloerisolatie: € 11
      per m2; f. bodemisolatie, eventueel in combinatie met vloerisolatie: € 6 per m2; g. HR++ glas: € 53 per m2; h.
      triple-glas in combinatie met het vervangen van het kozijn door een isolerend kozijn met een maximale U-waarde
      van 1,5 [W/m2K]: € 150 per m2; i. het vervangen van voor- en achterdeuren in de thermische schil overeenkomstig
      [artikel 5, onderdeel a][ref2]: € 120 per m2; j. het aanleggen van een ventilatiesysteem overeenkomstig
      [artikel 5, onderdelen c, of d][ref3], per appartement 30% van de kosten van het ventilatiesysteem met een maximum
      van: '€ 1.200; k. panelen in combinatie met HR++ glas: € 23 per m2; l. panelen in combinatie met triple-glas: € 115'
      per m2; m. het waterzijdig inregelen van een verwarmingssysteem overeenkomstig [artikel 5, onderdeel d][ref4],
      per appartement: € 90; n. het plaatsen van een energiedisplay of een thermostaat overeenkomstig
      [artikel 5, onderdeel e][ref5]: € 120. 2. In afwijking van [artikel 14, tweede en derde lid][ref6], worden voor de
      aanvragen waarop het eerste lid van toepassing is de subsidiebedragen, genoemd in het eerste lid, gebruikt in de
      berekeningen, bedoeld in artikel 14, tweede en derde lid, in plaats van de subsidiebedragen, genoemd in artikel 14,
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0038472#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0038472#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0038472#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0038472#Artikel14
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14b
