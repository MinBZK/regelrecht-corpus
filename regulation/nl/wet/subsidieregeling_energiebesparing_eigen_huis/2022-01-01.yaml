  - number: 14a.2
    text: |-
      In afwijking van [artikel 14, tweede en derde lid][ref1], worden voor de aanvragen waarop het eerste lid van
      toepassing is de subsidiebedragen genoemd in het eerste lid gebruikt in de berekeningen, bedoeld in artikel 14,
      tweede en derde lid, in plaats van de in artikel 14, eerste lid genoemde subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14a
