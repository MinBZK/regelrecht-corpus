articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanvullende energiebesparende maatregelen:* maatregelen, genoemd in
      [artikel 5][ref1];
        - *appartementsrecht:* appartementsrecht, bedoeld in
      [artikel 106, eerste lid, van Boek 5 van het Burgerlijk Wetboek][ref2];
        - *bouwbedrijf:* bedrijf dat in een handelsregister van een lidstaat van de Europese Unie of een van de overige
      staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte is ingeschreven in de sectie
      bouwnijverheid;
        - *certificaathouder:* certificaathouder als bedoeld in BRL 9500, deel 02;
        - *energiebesparende maatregelen:* maatregelen, genoemd in [artikel 4, eerste lid][ref3];
        - *BRL 9500:* door de Stichting Kwaliteit voor Installaties Nederland bindend verklaarde Nationale
      Beoordelingsrichtlijn 9500, zoals vastgesteld op 31 augustus 2011, inclusief latere wijzigingen;
        - *EPA-adviseur:* een persoon die voldoet aan de eisen aan de vakbekwaamheid van ‘EPA-adviseur’ conform bijlage 2
      van BRL 9500, deel 2;
        - *gebouw:* bestaand, voor bewoning of mede voor bewoning bestemd gebouwde onroerende zaak of een gedeelte daarvan,
      waarvoor of mede waarvoor een vereniging van eigenaars of een wooncoöperatie is opgericht of waarvan de eigenaar
      een woonvereniging is;
        - *huurwoning:* gebouwde onroerende zaak die als zelfstandige woonruimte is verhuurd en waarop
      [afdeling 5 van Boek 7 van het Burgerlijk Wetboek][ref4] van toepassing is;
        - *Kaderbesluit:* [Kaderbesluit BZK-subsidies][ref5];
        - *koopwoning:* woning van een eigenaar-bewoner;
        - *maatwerkadviesrapport:* maatwerkadviesrapport als bedoeld in BRL 9500, deel 02;
        - *minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *mjop:* meerjaren onderhoudsplan voor de delen van een gebouw of groep van gebouwen waarvoor een vereniging
      verantwoordelijk is voor het beheer en het onderhoud;
        - *NulopdeMeterwoning:* woning waarvan de som van de ingaande en uitgaande energiestromen voor gebouwgebonden
      energie bij een normaal leefpatroon op jaarbasis gelijk aan of lager is dan nul en met een additionele
      energieopwekkingscapaciteit voor gebruikersgebonden energie van ten minste 3.150 kWh indien het een vrijstaande
      of halfvrijstaande woning betreft, 2.700 kWh indien het een tussenwoning betreft of 1.780 kWh indien het een
      appartement betreft;
        - *oplaadpunt:* oplaadpunt als bedoeld in [artikel 1 van het Besluit infrastructuur alternatieve brandstoffen][ref6],
      inclusief de bijbehorende kabels;
        - *procesbegeleiding:* externe begeleiding van het besluitvormingsproces binnen een vereniging;
        - *vereniging:* vereniging van eigenaars, woonvereniging of wooncoöperatie;
        - *vereniging van eigenaars:* vereniging van de eigenaars als bedoeld in
      [artikel 112, eerste lid, onderdeel e, van Boek 5 van het Burgerlijk Wetboek][ref7];
        - *woning:* bestaande gebouwde onroerende zaak, die een zelfstandige woongelegenheid
      vormt alvorens renovatie plaatsvindt en in de basisregistratie als bedoeld in
      [artikel 2 van de Wet basisregistratie adressen en gebouwen][ref8] met een woonfunctie is geregistreerd, niet
      zijnde een woonwagen of een woonboot, dan wel een bestaand appartement, dat een zelfstandige woongelegenheid vormt
      alvorens renovatie plaatsvindt en in voornoemde basisregistratie met een woonfunctie is geregistreerd;
        - *woningcorporatie:* woningcorporatie als bedoeld in [artikel 19 van de Woningwet][ref9];
        - *wooncoöperatie:* wooncoöperatie als bedoeld in [artikel 18a van de Woningwet][ref10];
        - *woonvereniging:* vereniging die eigenaar is van een of meer gebouwen en waarvan de leden het recht hebben om in
      een bepaalde woning die onderdeel uitmaakt van dat gebouw of die gebouwen te wonen;
        - *wtw:* warmteterugwinning;
        - *zeer energiezuinig pakket:* pakket, bedoeld in [artikel 6][ref11].


