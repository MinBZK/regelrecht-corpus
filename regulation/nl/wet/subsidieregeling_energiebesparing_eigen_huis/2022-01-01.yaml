  - number: '1.2'
    text: 'Onder *eigenaar-bewoner* wordt in deze regeling verstaan een natuurlijke persoon die:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.2.a
    text: |-
      een woning in eigendom heeft waarin hij zijn hoofdverblijf heeft of direct na renovatie van deze woning, waaronder
      mede begrepen de realisatie van de activiteiten waarvoor subsidie op grond van deze regeling is aangevraagd, zal
      hebben;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.2.b
    text: |-
      gerechtigde is van een bestaand appartementsrecht en in het desbetreffende appartement zijn hoofdverblijf heeft
      of direct na renovatie van dat appartement, waaronder mede begrepen de realisatie van de activiteiten waarvoor
      subsidie op grond van deze regeling is aangevraagd, zal hebben;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.2.c
    text: |-
      zijn hoofdverblijf heeft of direct na renovatie van deze woning, waaronder mede begrepen de realisatie van
      de activiteiten waarvoor subsidie op grond van deze regeling is aangevraagd, zal hebben in een woning van een
      wooncoöperatie en in verband daarmee lid is van die wooncoöperatie, of
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.2.d
    text: |-
      op basis van zijn lidmaatschap van een woonvereniging het recht heeft om in een woning te wonen en daarin
      zijn hoofdverblijf heeft of direct na renovatie van deze woning, waaronder mede begrepen de realisatie van de
      activiteiten waarvoor subsidie op grond van deze regeling is aangevraagd, zal hebben.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: '1.3'
    text: 'Onder *appartement* wordt in deze regeling verstaan:'
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.3.a
    text: deel van een gebouw waarvoor een vereniging van eigenaars is opgericht, waarop een appartementsrecht rust;
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.3.b
    text: woning in een gebouw, waarvoor een wooncoöperatie is opgericht, of
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: 1.3.c
    text: woning in een gebouw waarvoor een woonvereniging is opgericht.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel1
  - number: '2'
    text: |-
      Deze regeling heeft tot doel energiebesparing te stimuleren in bestaande koopwoningen van eigenaar-bewoners, en
      energiebesparing en het realiseren van oplaadpunten te stimuleren in gebouwen van verenigingen van eigenaars,
      woonverenigingen en wooncoöperaties, waarvan een of meer leden eigenaar-bewoner zijn.
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor subsidieverstrekking op grond van [hoofdstuk III][ref1] geldt tot 1 januari 2021 een subsidieplafond van
      € 129.200.000. Indien het subsidieplafond op 31 december 2020 niet geheel besteed is, geldt bij de afhandeling van
      de aanvragen op grond van [artikel 8, eerste lid][ref2], in 2021 een subsidieplafond ter hoogte van het resterende
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0038472#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel8
