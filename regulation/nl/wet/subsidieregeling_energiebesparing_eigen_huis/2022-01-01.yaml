  - number: 14a.1
    text: |-
      In afwijking van [artikel 14, eerste lid][ref1] bedraagt de subsidie aan een eigenaar-bewoner bij een aanvraag
      waarvan ten minste één van de maatregelen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref2], is uitgevoerd en
      betaald in de periode van 1 juni 2020 tot en met 31 december 2020 en de subsidie aan een vereniging, door wie de
      aanvraag is ingediend in de periode van 1 juni 2020 tot en met 31 december 2020:


      [ref1]: https://wetten.overheid.nl/BWBR0038472#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0038472#Artikel7
    url: https://wetten.overheid.nl/BWBR0038472/2022-01-01#Artikel14a
