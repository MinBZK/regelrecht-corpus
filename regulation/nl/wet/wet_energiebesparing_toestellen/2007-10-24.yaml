preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, in het belang van de energiebesparing, regels
    te stellen met betrekking tot toestellen en installaties, alsmede met betrekking tot het in rekening brengen van
    kosten van energieverbruik, welke mede als grondslag kunnen dienen voor de uitvoering van voorschriften ter zake,
    vastgesteld door de Raad of de Commissie van de Europese Gemeenschappen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *toestel:* een technisch hulpmiddel, met inbegrip van een vervoermiddel, bij het gebruik waarvan energie wordt
      gebezigd of dat naar zijn aard geschikt is om energie op te slaan, over te brengen dan wel om te vormen;

      *installatie:* een samenstel van een of meer toestellen, voorwerpen of materialen, bestemd om als een geheel te
      functioneren, bij het gebruik waarvan energie wordt gebezigd of dat naar zijn aard geschikt is om energie op te
      slaan, over te brengen of om te vormen;

      *Onze Minister:* Onze Minister van Economische Zaken.

      2 In deze wet en de daarop berustende bepalingen worden onder toestel of installatie mede begrepen voorwerpen en
      materialen, welke bestemd zijn om deel uit te maken van een toestel of een installatie.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel1
  - number: '2'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van het doelmatig gebruik van energie,
      regels worden gesteld met betrekking tot toestellen en installaties.

      2 Hiertoe kunnen behoren regels, inhoudende een verbod een toestel of een installatie, behorende tot een bij de
      maatregel aangewezen categorie, in- of uit te voeren, ten verkoop voorhanden te hebben, ten verkoop aan te bieden,
      ten toon te stellen, te verkopen, te verhuren, af te leveren of te installeren, dan wel te gebruiken:

      a. indien het toestel of de installatie niet voldoet aan de bij of krachtens de maatregel gestelde eisen;

      b. indien het toestel of de installatie dan wel het type, waartoe het toestel of de installatie behoort, niet bij
      een keuring aan de hand van de bij of krachtens de maatregel daartoe vastgestelde voorschriften is goedgekeurd.

      3 Tot de in het eerste lid bedoelde regels kunnen eveneens behoren regels, inhoudende het verbod een toestel of
      installatie, behorende tot een bij de maatregel aangewezen categorie, te installeren of te gebruiken op een plaats
      of wijze of onder omstandigheden, aangewezen bij die maatregel.

      4 De regels, bedoeld in het eerste lid, zijn niet van toepassing op het gebruik van toestellen of installaties in
      woningen of op erven in de sfeer van de particuliere huishouding of een daarmee bij algemene maatregel van bestuur
      gelijk te stellen huishouding.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel2
  - number: '3'
    text: |-
      Indien regels als bedoeld in [artikel 2][ref1] worden gesteld, wordt daarbij tevens een termijn bepaald, eerst bij
      het verstrijken waarvan die regels ten aanzien van toestellen of installaties, die bij het in werking treden van de
      maatregel reeds vervaardigd en hier te lande ten verkoop voorhanden zijn, van toepassing worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003916#Artikel2
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003916
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 2, tweede lid, onder ][ref1], wijzen Onze Minister en Onze krachtens
      [artikel 18][ref2] aangewezen Ministers te zamen de instellingen aan, die de in die bepaling bedoelde keuringen
      verrichten.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het aanvragen van
      een goedkeuring, de wijze waarop de keuringen plaatshebben, het gebruiken van aanduidingen inzake de goedkeuring,
      alsmede de gevallen waarin en de wijze waarop een goedkeuring kan worden geschorst of ingetrokken. Daarbij kan een
      termijn worden bepaald, voor welke een goedkeuring van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0003916#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003916#Artikel18
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel4
