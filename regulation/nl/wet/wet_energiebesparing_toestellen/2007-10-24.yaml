  - number: '8'
    text: |-
      1 Bij algemene maatregel van bestuur kan degene, die warm tapwater of warmte in enige vorm ten behoeve van
      ruimteverwarming levert of toevoert, worden verplicht om in de bij de maatregel aangewezen gevallen de kosten van
      het verbruik in een gebouw of een gedeelte daarvan in rekening te brengen op basis van het gemeten verbruik in dat
      gebouw of gedeelte daarvan.

      2 De eigenaar en de gebruiker van een gebouw of een gedeelte daarvan, alsmede de rechthebbende met betrekking tot
      een gebouw of een gedeelte daarvan dienen de nodige medewerking te verlenen met het oog op de nakoming van een
      verplichting als bedoeld in het eerste lid met betrekking tot dat gebouw of gedeelte daarvan. Hiertoe behoort het
      verlenen van medewerking aan:

      a. het aanbrengen, in stand houden en gebruiken van de noodzakelijke technische voorzieningen door of vanwege
      degene, op wie de eerderbedoelde verplichting rust;

      b. het tot stand brengen van de noodzakelijke overeenkomst of rechtsverhouding dan wel de noodzakelijke wijzigingen
      in een overeenkomst of rechtsverhouding, op grond waarvan het in het eerste lid bedoelde verbruik in rekening wordt
      gebracht.

      3 Bij de maatregel, bedoeld in het eerste lid, kunnen regels worden gegeven aangaande het in rekening brengen van
      de kosten van het verbruik en met betrekking tot de technische voorzieningen waarmee het verbruik wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel8
  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur kan degene, die gas of elektriciteit levert of toevoert aan verbruikers
      daarvan, worden verplicht om de rekeningen met betrekking tot het verbruik van afnemers in te richten op een bij of
      krachtens de maatregel aan te geven wijze en daarbij de bij de maatregel aangewezen gegevens over de ontwikkeling
      van dat verbruik te verstrekken.

      2 Bij algemene maatregel van bestuur kan degene, die warm tapwater of warmte in enige vorm ten behoeve van
      ruimteverwarming levert of toevoert aan verbruikers daarvan worden verplicht om de rekeningen met betrekking tot
      het verbruik in te richten op een bij of krachtens de maatregel aan te geven wijze en daarbij de bij de maatregel
      aangewezen gegevens over de ontwikkeling van dat verbruik te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel9
  - number: '10'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel10
  - number: '11'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van
      Onze Minister, in overeenstemming met Onze bij algemene maatregel van bestuur aangewezen Ministers, aangewezen
      ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel11
  - number: '12'
    text: |-
      Van elk krachtens [artikel 5:18 van de Algemene wet bestuursrecht][ref1] onderzocht toestel of elke krachtens dat
      artikel onderzochte installatie, wordt aan de belanghebbende op diens verzoek een vergoeding gegeven ter grootte
      van het bedrag waarmee de verkoopwaarde daarvan ten gevolge van het onderzoek is verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '17'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald, dat, ingeval aan [artikel 6, derde lid][ref1], toepassing
      is gegeven of in andere bij die maatregel aangewezen categorieën van gevallen de krachtens [artikel 11][ref2]
      aangewezen ambtenaren volgens bij of krachtens die maatregel gestelde regels aan de hand van een onderzoek van
      een deel, dat als steekproef is genomen uit een bij die maatregel omschreven groep van toestellen of installaties,
      kunnen vaststellen of die groep voldoet aan de bij die maatregel aangewezen eisen of voorschriften, gesteld
      krachtens de [artikelen 2][ref3] of [6][ref4].

      2 Bij een maatregel als in het eerste lid bedoeld kunnen tevens regels worden gesteld:

      a. omtrent de mededeling of de openbaarmaking van de uitslag van een onderzoek, dat met toepassing van het
      krachtens het eerste lid bepaalde is verricht;

      b. inhoudende, dat het degene onder wie alle tot de steekproef behorende toestellen of installaties zijn
      aangetroffen, is verboden nadat de steekproef is genomen, toestellen of installaties, behorende tot de krachtens
      het eerste lid omschreven groep, waartoe de steekproef behoort, af te leveren, zolang hem een mededeling als onder
      *a* bedoeld niet is gedaan.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat, ingeval met toepassing van het krachtens het eerste
      lid bepaalde wordt vastgesteld dat een groep niet aan de bij die maatregel aangewezen eisen of voorschriften,
      bedoeld in het eerste lid, voldoet:

      a. volgens bij die maatregel gestelde regels aan de betrokkene of de betrokkenen de gelegenheid wordt geboden om
      tegenbewijs te leveren;

      b. de desbetreffende groep of een deel daarvan niet mag worden afgeleverd alvorens ten aanzien daarvan de
      maatregelen zijn genomen, die bij of krachtens die maatregel zijn voorgeschreven;

      c. in de bij de maatregel aangewezen gevallen er geen sprake is van een strafbaar feit wegens overtreding van het
      krachtens de [artikelen 2][ref5] of [6][ref6] bepaalde.


