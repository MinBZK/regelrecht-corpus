  - number: '5'
    text: |-
      1 Indien met betrekking tot het type, waartoe een toestel of installatie behoort, goedkeuring is voorgeschreven
      en verkregen, is de vervaardiger of de importeur van de betrokken toestellen of installaties gehouden de ingevolge
      [artikel 4][ref1] aangewezen instelling in de gelegenheid te stellen te controleren of toestellen of installaties
      overeenkomstig het goedgekeurde type zijn of worden vervaardigd.

      2 Bij algemene maatregel van bestuur kunnen, indien met betrekking tot enige categorie van toestellen of
      installaties goedkeuring van het type is voorgeschreven, regels worden gegeven omtrent de wijze waarop de in het
      eerste lid bedoelde controle wordt uitgeoefend, omtrent de normen volgens welke de controle plaatsvindt en omtrent
      de vergoeding van de voor de controle gemaakte kosten van de ingevolge [artikel 4][ref2] aangewezen instelling.

      3 De ingevolge [artikel 4][ref3] aangewezen instelling wijst de personen aan, die met de controle zullen zijn
      belast.

      4 De vervaardiger of de importeur van de toestellen of installaties is gehouden aan de ingevolge het derde lid
      aangewezen personen, indien deze zich behoorlijk als zodanig hebben bekendgemaakt, alle medewerking te verlenen en
      alle inlichtingen met betrekking tot die toestellen en installaties te verstrekken, die zij redelijkerwijs bij de
      vervulling van hun taak behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003916#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003916#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003916#Artikel4
