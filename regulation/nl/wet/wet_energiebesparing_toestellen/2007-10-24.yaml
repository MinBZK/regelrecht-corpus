  - number: '6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen, in het belang van een doelmatig gebruik van energie,
      regels worden gesteld ten aanzien van gegevens en aanwijzingen met betrekking tot het energieverbruik van
      toestellen en installaties, alsmede daarmee samenhangende gegevens over andere eigenschappen daarvan en bepaalde
      identificatiegegevens.

      2 Hiertoe kunnen behoren regels, inhoudende:

      a. de verplichting in de bij de maatregel aangegeven gevallen met betrekking tot toestellen of installaties,
      behorende tot een bij de maatregel aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid
      beschikbaar te hebben of te verstrekken, die voldoen aan bij of krachtens de maatregel gestelde eisen;

      b. het verbod om in de bij de maatregel aangegeven gevallen met betrekking tot toestellen of installaties,
      behorende tot een bij de maatregel aangewezen categorie, gegevens of aanwijzingen als bedoeld in het eerste lid
      beschikbaar te hebben of te verstrekken, indien die gegevens of aanwijzingen niet voldoen aan bij of krachtens de
      maatregel gestelde eisen;

      c. de verplichting om in de gevallen, bedoeld onder *a* of *b*, gegevens of aanwijzingen als bedoeld in het eerste
      lid, beschikbaar te hebben of te verstrekken op een bij of krachtens de maatregel aangegeven wijze;

      d. de verplichting aan de hand van bij of krachtens de maatregel gestelde regels onderzoek te verrichten ter
      vaststelling of ter toetsing van gegevens als bedoeld in het eerste lid omtrent toestellen of installaties,
      behorende tot een bij de maatregel aangewezen categorie;

      e. de verplichting op een bij of krachtens de maatregel aangegeven wijze een administratie te voeren van het
      onderzoek, bedoeld onder *d*, en van de daarbij verkregen resultaten, alsmede de verplichting om de bescheiden,
      behorende tot die administratie, gedurende een bepaalde termijn te bewaren;

      f. het verbod in de onder *a* of *b* bedoelde gevallen gegevens als bedoeld in het eerste lid beschikbaar te hebben
      of te verstrekken, welke niet overeenstemmen met de resultaten van een onderzoek als bedoeld onder *d* dan wel niet
      overeenstemmen met de resultaten van een keuring, verricht aan de hand van de bij of krachtens de maatregel daartoe
      vastgestelde voorschriften;

      g. de verplichting om in de bij de maatregel aangegeven gevallen op een bij of krachtens die maatregel
      aangegeven wijze het bij of krachtens de maatregel aangegeven kenmerk te vermelden of gegevens te verstrekken ter
      identificatie van de partij of serie, waartoe toestellen of installaties behoren, of van het type van toestellen of
      installaties, dan wel de bij de maatregel aangewezen gegevens ter identificatie van de vervaardiger, de importeur
      of een ander van wie de toestellen of installaties afkomstig zijn.

      3 De eisen, bedoeld in het tweede lid, onder *a* of *b*, kunnen worden gesteld met betrekking tot een bij of
      krachtens de maatregel aangegeven groep van toestellen of installaties. Daarbij kunnen regels worden gegeven
      volgens welke bij een onderzoek als bedoeld in het tweede lid, onder *d*, aan de hand van onderzoek met betrekking
      tot een uit die groep genomen steekproef kan worden getoetst of aan de eisen is voldaan.

      4 Met betrekking tot keuringen als bedoeld in het tweede lid, onder *f*, is [artikel 5][ref1] van overeenkomstige
      toepassing.

      5 De regels, bedoeld in het eerste lid, zijn niet van toepassing, voor zover de toestellen, waarop de in dat
      lid bedoelde gegevens betrekking hebben, zich bevinden in woningen of op erven in de sfeer van de particuliere
      huishouding of een daarmee bij algemene maatregel van bestuur gelijk te stellen huishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0003916#Artikel5
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel6
