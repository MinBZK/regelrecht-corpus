  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald dat de voordracht voor algemene maatregelen van bestuur krachtens
      bij die maatregel aangewezen bepalingen van deze wet met betrekking tot daarbij aangewezen onderwerpen door
      Onze Minister wordt gedaan in overeenstemming met Onze bij die maatregel aangewezen Ministers. De voordracht
      voor de eerstbedoelde maatregel wordt Ons gedaan door Onze Minister, in overeenstemming met Onze Ministers van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Verkeer en Waterstaat, van Landbouw en Visserij en van
      Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel18
  - number: '19'
    text: |-
      1 Bij algemene maatregel van bestuur kan aan Onze bij die maatregel aan te wijzen Minister de bevoegdheid worden
      verleend om vrijstelling en, op aanvrage, ontheffing te verlenen van voorschriften, vastgesteld op grond van deze
      wet.

      2 Een vrijstelling en een ontheffing als in het eerste lid bedoeld kan onder beperkingen worden verleend. Aan een
      zodanige vrijstelling en ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel19
  - number: '20'
    text: |-
      Bij algemene maatregel van bestuur kan een bedrag worden vastgesteld, dat ter zake van een verzoek, gedaan op grond
      van op deze wet berustende bepalingen, door de verzoeker dient te worden betaald. Daarbij wordt aangewezen degene,
      aan wie het bedrag dient te worden voldaan, en kunnen regels worden gesteld omtrent het tijdstip en de wijze van
      de betaling.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel20
  - number: '21'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van een krachtens het
      Verdrag tot oprichting van de Europese Economische Gemeenschap met betrekking tot toestellen of installaties tot
      stand gekomen bindende regeling, welke het belang van een doelmatig gebruik van energie betreft.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel21
  - number: '22'
    text: |-
      Voor zover voor toestellen en installaties bij of krachtens [titel 9.4 van de Wet milieubeheer][ref1] voorschriften
      zijn vastgesteld, die op dezelfde onderwerpen betrekking hebben als waarvoor bij of krachtens deze wet
      voorschriften zijn vastgesteld, blijven laatstgenoemde voorschriften buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '24'
    text: |-
      1 Deze wet kan worden aangehaald als: Wet energiebesparing toestellen.

      2 Zij treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0003916/2007-10-24#Artikel24
