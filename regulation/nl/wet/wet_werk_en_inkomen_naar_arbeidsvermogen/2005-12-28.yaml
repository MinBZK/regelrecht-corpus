        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '66.1'
    text: |-
      Een aanvraag voor een verkorte wachttijd als bedoeld in [artikel 23, zesde lid][ref1], wordt tevens aangemerkt als
      aanvraag, bedoeld in [artikel 64, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '66.2'
    text: Een aanvraag voor een verkorte wachttijd kan slechts eenmaal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
  - number: '66.3'
    text: |-
      Op verzoek van de werknemer verstrekt de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1], die belast is met de bijstand, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van die wet][ref2], een verklaring waaruit de medische situatie alsmede
      de vooruitzichten van de werknemer blijken. De verklaring wordt mede opgesteld op basis van gegevens inzake de
      medische specialistische onderzoeken of behandelingen die de aanvrager heeft ondergaan, tenzij in redelijkheid niet
      van de bedrijfsarts kan worden gevergd dat hij deze gegevens aan zijn verklaring ten grondslag legt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '66.4'
    text: Een aanvraag voor een verkorte wachttijd gaat vergezeld van de verklaring, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
  - number: '66.5'
    text: |-
      Indien de aanvraag voor een verkorte wachttijd niet vergezeld gaat van een verklaring als bedoeld in het derde lid,
      wordt de aanvraag niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
  - number: '66.6'
    text: |-
      [Artikel 65][ref1] is niet van toepassing op een aanvraag voor een verkorte wachttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel65
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
