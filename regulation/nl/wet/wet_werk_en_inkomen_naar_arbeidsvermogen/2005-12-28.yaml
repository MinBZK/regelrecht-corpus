preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om werknemers die gedeeltelijk arbeidsgeschikt
    worden deel te laten blijven nemen aan het arbeidsproces alsmede om een inkomensverzekering te regelen voor deze
    werknemers en voor werknemers die volledig en duurzaam arbeidsongeschikt zijn geworden en in verband daarmee een
    nieuwe wet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#ArtikelAanhef
articles:
  - number: '25.3'
    text: |-
      Uiterlijk vijftien weken voor het verstrijken van de wachttijd stelt de werkgever, bedoeld in het eerste lid, in
      overleg met de verzekerde een reïntegratieverslag op en verstrekt hiervan een afschrift aan de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel25
  - number: '64.1'
    text: Het UWV stelt op aanvraag vast of recht op een uitkering op grond van deze wet ontstaat.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
  - number: '64.2'
    text: |-
      Het UWV stelt de verzekerde van de mogelijkheid van het doen van een aanvraag schriftelijk in kennis uiterlijk
      20 maanden na aanvang van de wachttijd. Indien [artikel 24, derde lid][ref1], van toepassing is doet het UWV deze
      kennisgeving bij de bekendmaking van de in dat artikellid bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '64.3'
    text: |-
      De verzekerde doet zijn aanvraag binnen 21 maanden na aanvang van de wachttijd, tenzij
      [artikel 24, derde lid,][ref1] van toepassing is, in welk geval het UWV bij de bekendmaking van de in dat
      artikellid genoemde beschikking aangeeft binnen welke termijn de aanvraag door verzekerde wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '64.4'
    text: |-
      Indien het UWV de in het eerste lid bedoelde aanvraag afwijst omdat een uitsluitingsgrond als bedoeld in
      [artikel 43, onderdeel b, d of e][ref1], van toepassing is maakt het UWV melding van de mogelijkheid tot het doen
      van een nieuwe aanvraag alsmede van de termijn waarbinnen een nieuwe aanvraag dient te worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '64.5'
    text: |-
      Indien het vierde lid van toepassing is doet de verzekerde zijn nieuwe aanvraag binnen de op grond van dat lid door
      het UWV aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
  - number: '64.6'
    text: |-
      Indien de toepassing van het eerste lid zou leiden tot kennelijke hardheid, is het UWV bevoegd het recht op een
      uitkering op grond van deze wet ambtshalve vast te stellen.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
  - number: '64.7'
    text: |-
      Het recht op een uitkering op grond van deze wet kan niet worden vastgesteld over perioden gelegen voor 52 weken
      voorafgaand aan de dag waarop de aanvraag om een uitkering werd ingediend. Het UWV kan voor bijzondere gevallen van
      de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
  - number: '64.8'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gegevens die door de verzekerde bij de
      aanvraag worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel64
  - number: '65'
    text: |-
      De aanvraag voor een uitkering op grond van deze wet gaat vergezeld van een reïntegratieverslag als bedoeld in
      [artikel 25, derde lid][ref1]. De eerste zin is niet van toepassing voorzover [artikel 26, eerste lid][ref2],
      toepassing vindt. Het UWV beoordeelt of de werkgever en de verzekerde dan wel de eigenrisicodrager,
      bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3] en de personen, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref4], die laatstelijk tot hem in dienstbetrekking
      stonden in redelijkheid hebben kunnen komen tot de reïntegratie-inspanningen, die zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0019057/2005-12-28#Artikel65
    references:
      - id: ref1
