preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om werknemers die gedeeltelijk arbeidsgeschikt
    worden deel te laten blijven nemen aan het arbeidsproces alsmede om een inkomensverzekering te regelen voor deze
    werknemers en voor werknemers die volledig en duurzaam arbeidsongeschikt zijn geworden en in verband daarmee een
    nieuwe wet vast te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: -
      *arbeidsongeschiktheidsuitkering*: de arbeidsongeschiktheidsuitkering, bedoeld in [hoofdstuk 6][ref1];
        - *arbodienst*: een dienst als bedoeld in de [Arbeidsomstandighedenwet 1998][ref2];
        - *eigenrisicodrager*: de werkgever aan wie op grond van
      [artikel 40, aanhef en eerste lid, onderdeel b of c, van de Wet financiering sociale verzekeringen][ref3]
      toestemming is verleend om zelf het risico te dragen van betaling van het daarvoor in aanmerking komende deel van
      de arbeidsongeschiktheidsuitkering of de WGA-uitkering;
        - *justitiële inrichting*: een penitentiaire inrichting, een inrichting voor
      verpleging van ter beschikking gestelden, of een inrichting als bedoeld in
      [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref4];
        - *lichaam*: publiekrechtelijke of privaatrechtelijke rechtspersoon, maat- en vennootschap, samenwerkingsvorm
      zonder rechtspersoonlijkheid die maatschappelijk kan worden gelijkgesteld met een vereniging, onderneming van
      publiekrechtelijke rechtspersonen en doelvermogens;
        - *maatmaninkomen*: hetgeen gezonde personen met soortgelijke opleiding en ervaring, ter plaatse waar hij arbeid
      verricht of het laatst heeft verricht, of in de omgeving daarvan met arbeid gewoonlijk verdienen;
        - *onbetaald verlof*: een tussen werkgever en werknemer voor een gedeelte of het geheel van de arbeidstijd
      overeengekomen verlof, waarin de werknemer geen arbeid jegens de werkgever verricht;
        - *Onze Minister*: Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *reïntegratie*: herstel, behoud en bevordering van de mogelijkheden tot het verrichten van arbeid en bevordering
      van inschakeling in de arbeid;
        - *reïntegratiebedrijf:* een natuurlijke persoon dan wel rechtspersoon die in het kader van de uitoefening van
      beroep of bedrijf de inschakeling van personen in de arbeid bevordert;
        - *reïntegratieplan*: het plan, bedoeld in [artikel 39, derde lid][ref5];
        - *reïntegratievisie*: de reïntegratievisie, bedoeld in [artikel 39, eerste lid][ref6];
        - *sociaal-fiscaalnummer*: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref7];
        - *UWV*: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref8];
        - *vreemdeling*: de persoon, bedoeld in de [Vreemdelingenwet 2000][ref9];
        - *wachttijd*: de wachttijd, bedoeld in [artikel 23][ref10];
        - *WGA-uitkering*: de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in [hoofdstuk 7][ref11];
        - *zelfstandige*: de persoon, jonger dan 65 jaar: 1°. die in Nederland woont en die belastbare winst uit
      onderneming als bedoeld in [paragraaf 3.2.1 van de Wet inkomstenbelasting 2001][ref12] vermeerderd met de
      ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref13], geniet, tenzij hij de onderneming niet
      voor eigen rekening feitelijk drijft; 2°. die niet in Nederland woont en die belastbare winst uit Nederlandse
      onderneming als bedoeld in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref14] vermeerderd met de
      ondernemersaftrek, bedoeld in [paragraaf 3.2.4 van die wet][ref15], geniet, tenzij hij de onderneming niet
      voor eigen rekening feitelijk drijft; of 3°. die directeur-grootaandeelhouder is, en het werk tot stand
      brengt uitsluitend voor rekening en risico van de onderneming van de rechtspersoon waarvan hij directeur-
      grootaandeelhouder is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
