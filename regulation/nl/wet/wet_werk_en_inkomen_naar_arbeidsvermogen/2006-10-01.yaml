      [artikel 16 van de Wet op de (re)integratie arbeidsgehandicapten][ref1] op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] vervalt, was
      toegekend op grond van [artikel 16 van de Wet op de (re)integratie arbeidsgehandicapten][ref3] wordt voor de duur
      van het tijdvak waarvoor die subsidie op grond van de [Wet op de (re)integratie arbeidsgehandicapten][ref4] is
      toegekend aangemerkt als subsidie als bedoeld in [artikel 35][ref5].


