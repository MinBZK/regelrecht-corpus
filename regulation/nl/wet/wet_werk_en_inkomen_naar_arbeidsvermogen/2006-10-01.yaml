  - number: '131.2'
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip wordt aan [artikel 90][ref1] een lid toegevoegd, luidende: 4.
      Het UWV stelt nadere regels met betrekking tot het eerste lid, voorzover dat betrekking heeft op nadere regels
      omtrent een maatregel als bedoeld in [artikel 88][ref2], waarbij in ieder geval kan worden geregeld in welke
      gevallen het UWV kan afzien van het opleggen van een maatregel.


