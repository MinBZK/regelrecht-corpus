    text: |-
      De hoogte van de arbeidsongeschiktheiduitkering, bedoeld in [artikel 51, eerste lid][ref1], wordt op 75% van het
      maandloon vastgesteld op een bij koninklijk besluit te bepalen tijdstip, waarin tevens kan worden bepaald dat die
      verhoging terugwerkt tot en met een in dat besluit te bepalen tijdstip.


