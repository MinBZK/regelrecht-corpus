  - number: '2.1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.1.b
    text: 'gehuwd: als partner geregistreerd.'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '2.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.2.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.2.b
    text: als ongehuwd mede aangemerkt de persoon die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '2.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '2.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning en:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.4.a
    text: zij met elkaar gehuwd zijn geweest of eerder voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding krachtens een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: 2.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '2.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel2
  - number: '3.1'
    text: Waar iemand woont en waar een lichaam gevestigd is, wordt naar de omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de toepassing van het eerste lid worden schepen die binnen Nederland hun thuishaven hebben, als deel van
      Nederland beschouwd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel3
  - number: '4.1'
    text: |-
      Volledig en duurzaam arbeidsongeschikt is hij die als rechtstreeks en objectief medisch vast te stellen gevolg van
      ziekte, gebrek, zwangerschap of bevalling duurzaam slechts in staat is om met arbeid ten hoogste 20% te verdienen
      van het maatmaninkomen per uur.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel4
  - number: '4.2'
    text: In het eerste lid wordt onder duurzaam verstaan een medisch stabiele of verslechterende situatie.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel4
  - number: '4.3'
    text: |-
      Onder duurzaam wordt mede verstaan een medisch situatie waarbij op lange termijn een geringe kans op herstel
      bestaat.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel4
  - number: '5'
    text: |-
      Gedeeltelijk arbeidsgeschikt is hij die als rechtstreeks en objectief medisch vast te stellen gevolg van
      ziekte, gebrek, zwangerschap of bevalling slechts in staat is met arbeid ten hoogste 65% te verdienen van het
      maatmaninkomen per uur, doch die niet volledig en duurzaam arbeidsongeschikt is.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel5
  - number: '6.1'
    text: |-
      De beoordeling of iemand volledig en duurzaam arbeidsongeschikt of gedeeltelijk arbeidsgeschikt is, wordt gebaseerd
      op een verzekeringsgeneeskundig en een arbeidskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
  - number: '6.2'
    text: |-
      Bij het vaststellen van volledige en duurzame arbeidsongeschiktheid of gedeeltelijke arbeidsgeschiktheid wordt,
      zo mogelijk, rekening gehouden met verkregen nieuwe bekwaamheden, maar wordt buiten beschouwing gelaten of de
      verzekerde de arbeid feitelijk kan verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
  - number: '6.3'
    text: |-
      Onder arbeid als bedoeld in [artikel 4, eerste lid][ref1], en [5][ref2] wordt verstaan alle algemeen geaccepteerde
      arbeid waartoe de verzekerde met zijn krachten en bekwaamheden in staat is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel5
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het eerste, tweede en derde lid, en de
      [artikelen 4][ref1] en [5][ref2] nadere en zo nodig afwijkende regels worden gesteld die voor volledig en duurzaam
      arbeidsongeschikten en gedeeltelijk arbeidsgeschikten verschillend kunnen zijn. Hierbij kan tevens onderscheid
      worden gemaakt tussen de situaties, bedoeld in [artikel 4, tweede en derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '6.5'
    text: |-
      De voordracht tot respectievelijk de vaststelling, wijziging of intrekking van een op grond van het vierde lid
      vast te stellen algemene maatregel van bestuur of ministeriële regeling wordt pas gedaan nadat het ontwerp in de
      Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop
      de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister te brengen. Gelijktijdig met de
      bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
  - number: '6.6'
    text: |-
      Bij de beoordeling, bedoeld in het eerste lid, maakt de verzekeringsarts zo veel mogelijk gebruik van de bij
      ministeriële regeling vastgelegde wetenschappelijke inzichten die de beoordeling van de arbeidsongeschiktheid of de
      gedeeltelijke arbeidsgeschiktheid kunnen ondersteunen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel6
  - number: '7.1'
    text: Verplicht verzekerd is de werknemer.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel7
  - number: '7.2'
    text: |-
      Een aanvraag tot het geven van een beschikking over het verplicht verzekerd zijn op grond van deze wet kan door de
      werknemer uitsluitend bij het UWV worden ingediend.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel7
  - number: '8.1'
    text: |-
      Werknemer is de werknemer in de zin van de [Ziektewet][ref1] met uitzondering van de werknemer die zijn
      werknemerschap ontleent aan [artikel 4, eerste lid, onderdeel g, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel4
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '4'
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat personen die buiten Nederland wonen ook als werknemer
      worden aangemerkt, voorzover zij hun dienstbetrekking buiten Nederland vervullen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel8
  - number: '8.3'
    text: |-
      Bij de toepassing van het eerste lid blijft [artikel 6, tweede lid, van de Ziektewet][ref1] buiten toepassing ten
      aanzien van de persoon die geen arbeid verricht wegens het genieten van ononderbroken onbetaald verlof tot een
      maximum van achttien maanden, waarbij perioden van onbetaald verlof die elkaar met een onderbreking van minder dan
      vier weken opvolgen als ononderbroken onbetaald verlof worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
  - number: '9'
    text: 'Als werknemer wordt mede beschouwd:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel9
  - number: 9.a
    text: |-
      in bij ministeriële regeling aan te wijzen gevallen de persoon, die ten minste vijf of
      ten minste de helft van zijn arbeidsuren per kalenderweek heeft verloren als bedoeld in
      [artikel 16, eerste lid, onderdeel a, van de Werkloosheidswet][ref1], doch aan wie geen uitkering wordt verleend op
      grond van enige bepaling van [die wet][ref2] of van een regeling als bedoeld in onderdeel b;


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004045
  - number: 9.b
    text: |-
      de persoon, die wegens werkloosheid niet werkt en die op grond van een bij ministeriële regeling aan te wijzen, van
      overheidswege getroffen regeling, uitkering ontvangt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel9
  - number: '10.1'
    text: 'De persoon, die:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
  - number: 10.1.a
    text: gedurende twee maanden onafgebroken op alle dagen verzekerd is geweest, of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
  - number: 10.1.b
    text: |-
      in de loop van de twee maanden, voorafgaande aan het einde van zijn verzekering, op ten minste 16 dagen verzekerd
      is geweest,
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid, onderdeel a, genoemde termijn van twee maanden wordt geacht niet te zijn onderbroken, indien
      de betrokkene gedurende niet meer dan zeven dagen niet verzekerd is geweest. Voor de toepassing van dit en het
      eerste lid wordt arbeid, in een aaneengesloten nachtdienst op twee dagen verricht, gerekend als arbeid op één dag.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
  - number: '10.3'
    text: |-
      Het eerste lid blijft buiten toepassing ten aanzien van de persoon, die op grond van
      [artikel 6, eerste lid, onderdeel a of b van de Ziektewet][ref1], niet verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
  - number: '10.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld, op grond waarvan personen, die niet
      verzekerd zijn en die volledig en duurzaam arbeidsongeschikt of gedeeltelijk arbeidsgeschikt worden als gevolg
      van bij die maatregel aan te wijzen beroepsziekten, voor het recht op een uitkering worden beschouwd alsof zij
      verzekerd zijn.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel10
  - number: '11.1'
    text: |-
      Werkgever is de werkgever in de zin van de [Ziektewet][ref1] behoudens voorzover deze zijn werkgeverschap ontleent
      aan [artikel 10, onder 1°, onder g, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel10
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '10'
  - number: '11.2'
    text: |-
      In de gevallen, bedoeld in [artikel 8, tweede lid][ref1], is werkgever de natuurlijke persoon tot wie, het lichaam
      of het orgaan van een lichaam tot welk, de werknemer in dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '11.3'
    text: |-
      In de gevallen, bedoeld in [artikel 9][ref1], wordt als werkgever aangemerkt de persoon of instantie, die door Onze
      Minister als werkgever wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel9
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '12.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel12
  - number: 12.1.a
    text: |-
      loon: het loon in de zin van [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017745
        hoofdstuk: '3'
  - number: 12.1.b
    text: |-
      minimumloon: het minimumloon, bedoeld in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] of, indien het een werknemer jonger
      dan 23 jaar betreft, het voor zijn leeftijd geldende minimumloon, bedoeld in [artikel 7, derde lid][ref2], en
      [artikel 8, derde lid, van laatstgenoemde wet][ref3], beide vermeerderd met de daarover berekende vakantietoeslag,
      bedoeld in [artikel 15 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '12.2'
    text: |-
      Loon, door verschillende personen tezamen onverdeeld genoten, wordt, voorzover niet blijkt van een andere
      verdeling, geacht door ieder van hen voor een gelijk deel te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel12
  - number: '12.3'
    text: |-
      De persoon die op grond van een regeling als bedoeld in [artikel 9, aanhef en onderdeel b][ref1], een uitkering
      ontvangt, wordt geacht op elke dag waarover hij die uitkering ontvangt, loon te ontvangen, ter hoogte van die
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel9
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '13.1'
    text: |-
      Voor de berekening van een uitkering waarop op grond van deze wet recht bestaat, wordt als dagloon beschouwd 1/261
      deel van het loon dat de werknemer verdiende in de periode van één jaar, die eindigt op de laatste dag van het
      aangiftetijdvak voorafgaande aan het aangiftetijdvak waarin de ziekte, het gebrek, de zwangerschap of de bevalling,
      die tot volledig en duurzame arbeidsongeschiktheid of gedeeltelijke arbeidsgeschiktheid heeft geleid, is ingetreden
      doch ten hoogste het in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] bedoelde
      bedrag met betrekking tot een loontijdvak van een dag.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid wordt in het in [artikel 21][ref1] bedoelde geval het dagloon op de daar genoemde
      wijze vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel21
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '13.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden met betrekking tot de vaststelling van het dagloon, bedoeld
      in het eerste lid, en de herziening ervan nadere en zonodig afwijkende regels gesteld. Daarbij kunnen tevens regels
      worden gesteld ter bepaling van het dagloon ten behoeve van de vaststelling van de hoogte van de vervolguitkering
      van de WGA-uitkering, bedoeld in [artikel 62, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel62
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '13.4'
    text: 'Het maandloon bedraagt:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
  - number: 13.4.a
    text: 'indien recht op een uitkering bestaat over een volledige kalendermaand: 21,75 maal het dagloon; of'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
  - number: 13.4.b
    text: |-
      indien niet over een volledige kalendermaand recht op een uitkering bestaat: de uitkomst van het aantal dagen in
      de betreffende kalendermaand waarover recht op een uitkering bestaat gedeeld door het totaal aantal dagen in de
      betreffende kalendermaand vermenigvuldigd met 21,75 maal het dagloon. Bij het bepalen van het aantal dagen worden
      de zaterdagen en zondagen buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel13
  - number: '14.1'
    text: |-
      De daglonen worden herzien met ingang van de dag waarop en in de mate waarin het bedrag genoemd in
      [artikel 8, eerste lid, onderdeel c, van de Wet minimumloon en minimumvakantiebijslag][ref1] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '14.2'
    text: |-
      Onze Minister maakt in de Staatscourant bekend met ingang van welke dag en met welk percentage een herziening als
      bedoeld in het eerste lid plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel14
  - number: '14.3'
    text: |-
      Op een beschikking als gevolg van een herziening van het dagloon op grond van dit artikel zijn de
      [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '15.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder arbeidsverleden verstaan de periode die wordt berekend
      door samentelling van:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.1.a
    text: |-
      het aantal kalenderjaren, gelegen in de periode vanaf en met inbegrip van 1998 tot en met het kalenderjaar
      voorafgaand aan het kalenderjaar waarin de dag is gelegen waarop het recht op een uitkering op grond van deze
      wet is ontstaan, of zou zijn ontstaan als [artikel 23, zesde lid][ref1], of [64, elfde lid][ref2], niet zou zijn
      toegepast, waarover de werknemer aantoont over 52 of meer dagen per jaar loon te hebben ontvangen; en


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 15.1.b
    text: |-
      het aantal kalenderjaren vanaf en met inbegrip van het jaar waarin de werknemer zijn 18e verjaardag bereikte tot
      1998.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: '15.2'
    text: |-
      Een kalenderjaar wordt in aanmerking genomen bij de berekening, bedoeld in het eerste lid, onderdeel a, indien
      volgens de beschikking, bedoeld in [artikel 83c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      de werknemer in dat jaar over 52 of meer dagen loon heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83c
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83c
  - number: '15.3'
    text: |-
      Bij de toepassing van het eerste lid, onderdeel a, wordt, indien over een kalenderjaar een beschikking als bedoeld
      in het tweede lid niet is afgegeven, dat kalenderjaar in aanmerking genomen indien de werknemer aantoont daarin
      over 52 of meer dagen loon te hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: '15.4'
    text: 'Voor de toepassing van het eerste lid, onderdeel a, worden met dagen waarover loon is ontvangen, gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.4.a
    text: |-
      dagen waarover recht bestond op een uitkering die naar aard en strekking overeenkomt met een uitkering op grond van
      de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of met een uitkering op grond van deze wet voor zover deze
      uitkering wordt toegekend naar een arbeidsongeschiktheid van ten minste 80% respectievelijk wordt toegekend over
      periodes waarin de verzekerde slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen
      per uur;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 15.4.b
    text: |-
      dagen waarover een persoon een uitkering ontvangt op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1], berekend naar een
      arbeidsongeschiktheid van ten minste 80% of een toelage op grond van dat hoofdstuk, die al dan niet
      vermeerderd met de arbeidsongeschiktheidsuitkering 70% of meer bedraagt van het dagloon, waarnaar de
      arbeidsongeschiktheidsuitkering is of zou zijn berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: '15.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, worden niet reeds in aanmerking genomen kalenderjaren
      waarin een persoon recht heeft op kinderbijslag op grond van [artikel 7 van de Algemene Kinderbijslagwet][ref1]
      of een andere gezinsbijslag als bedoeld in artikel 4, eerste lid, onderdeel h, van [verordening (EG) nr.
      1408/71](31971R1408) van de Raad van de Europese Gemeenschap van 14 juni 1971 betreffende de toepassing van
      socialezekerheidsregelingen op werknemers en zelfstandigen, alsmede op hun gezinsleden, die zich binnen de
      Gemeenschap verplaatsen (PbEG L 149) voor een tot zijn huishouden behorend kind dat bij de aanvang van dat
      kalenderjaar de leeftijd van vijf jaar niet heeft bereikt, voor de helft gelijkgesteld met kalenderjaren waarin
      over 52 of meer dagen loon is ontvangen. De in de eerste zin bedoelde persoon wordt aangemerkt als verzorgend
      persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '15.6'
    text: |-
      In afwijking van het vijfde lid worden over de periode tot 1 januari 2005, waarin een persoon recht heeft op
      kinderbijslag op grond van [artikel 7 van de Algemene Kinderbijslagwet][ref1] of een andere gezinsbijslag als
      bedoeld in artikel 4, eerste lid, onderdeel h, van [verordening (EG) nr. 1408/71](31971R1408) van de Raad van de
      Europese Gemeenschap van 14 juni 1971 betreffende de toepassing van socialezekerheidsregelingen op werknemers en
      zelfstandigen, alsmede op hun gezinsleden, die zich binnen de Gemeenschap verplaatsen (PbEG L 149) voor een tot
      zijn huishouden behorend kind dat bij de aanvang van dat kalenderjaar de leeftijd van vijf jaar niet heeft bereikt,
      gelijkgesteld met, en worden dergelijke kalenderjaren over de periode van 1 januari 2005 tot 1 januari 2007 voor
      drie kwart gelijkgesteld met, kalenderjaren waarin over 52 of meer dagen loon is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
  - number: '15.7'
    text: |-
      Het vijfde en zesde lid vinden geen toepassing indien de verzorgende persoon in een kalenderjaar voor een periode
      langer dan een half jaar als werknemer in de zin van een wettelijke regeling inzake werkloosheid recht heeft op
      een uitkering ter zake van werkloosheid of op de loongerelateerde uitkering op grond van [hoofdstuk 7][ref1] van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: '15.8'
    text: 'Voor de toepassing van het vijfde en zesde lid wordt onder:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.8.a
    text: een kind verstaan een eigen, aangehuwd of pleegkind;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.8.b
    text: een pleegkind verstaan een kind dat als een eigen kind wordt onderhouden en opgevoed.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: '15.9'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, worden dagen, tot een maximum van achttien maanden, waarover de
      werknemer onbetaald verlof heeft genoten, gelijkgesteld met dagen, waarover loon is ontvangen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: '15.10'
    text: |-
      Voor de toepassing van dit artikel wordt niet als loon beschouwd een uitkering op grond van de
      [Werkloosheidswet][ref1], met uitzondering van een uitkering op grond van [hoofdstuk IV van die wet][ref2],
      een uitkering op grond van [hoofdstuk 7][ref3] van deze wet met uitzondering van een uitkering aan de
      persoon die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen per uur,
      alsmede een uitkering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref4], berekend naar een
      arbeidsongeschiktheid van minder dan 80%.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0002524
  - number: '15.11'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.11.a
    text: |-
      ter vaststelling van het aantal dagen waarover loon is ontvangen, bedoeld in het eerste lid, onderdeel a, en tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: 15.11.b
    text: |-
      op grond waarvan voor het bepalen van het aantal van 52 dagen, bedoeld in het eerste lid, onderdeel a, en tweede
      lid, dagen waarover, anders dan bedoeld in het negende lid, geen loon is ontvangen, worden gelijkgesteld met dagen
      waarover loon is ontvangen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel15
  - number: '16'
    text: |-
      Naast de op grond van [artikel 7][ref1] verplicht verzekerde personen en de op grond van [artikel 10][ref2] als
      verzekerd beschouwde personen zijn op grond van deze wet en de daarop berustende bepalingen eveneens verzekerd
      personen die zich vrijwillig hebben verzekerd op grond van [paragraaf 2][ref3] van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen gelden aaneensluitende verzekeringen op grond
      van deze wet als één verzekering.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel17
  - number: '18.1'
    text: 'Het UWV laat op grond van deze paragraaf tot de vrijwillige verzekering toe, mits hij hier te lande woont:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.a
    text: |-
      de persoon, wiens verplichte verzekering is geëindigd en van wie op grond van gebleken
      omstandigheden redelijkerwijze valt aan te nemen dat onderbreking van die verplichte verzekering
      van korte duur zal zijn, dan wel die beschikbaar is om arbeid te aanvaarden als bedoeld in
      [artikel 16, eerste lid, onderdeel b, van de Werkloosheidswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 18.1.b
    text: |-
      de persoon, die, terwijl hij hier te lande woonde, in het buitenland verplicht verzekerd was tegen geldelijke
      gevolgen van langdurige arbeidsongeschiktheid, mits:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.b.1°
    text: hij niet meer in het buitenland verzekerd is, omdat hij niet langer werkzaamheden verricht in het buitenland; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.b.2°
    text: |-
      op grond van gebleken omstandigheden redelijkerwijze valt aan te nemen, dat het zijn bedoeling is bij geboden
      gelegenheid opnieuw een dienstbetrekking aan te gaan;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.c
    text: |-
      de persoon, wiens verplichte verzekering is geëindigd en die als zelfstandige werkzaamheden verricht of gaat
      verrichten, of als echtgenoot van de zelfstandige meewerkt of gaat meewerken, indien gedurende één jaar,
      onmiddellijk voorafgaande aan het einde van zijn verplichte verzekering, onafgebroken, al dan niet in Nederland, op
      grond van een wettelijke regeling een voorziening tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid op
      hem van toepassing is geweest;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.d
    text: |-
      de persoon, die uit hoofde van een dienstbetrekking op grond waarvan slechts een gedeelte van een normale werkweek
      arbeid wordt verricht verplicht verzekerd is, indien op hem gedurende de drie jaren, onmiddellijk voorafgaande aan
      de dag van aanvang van de vrijwillige verzekering, onafgebroken een wettelijke regeling tegen geldelijke gevolgen
      van langdurige arbeidsongeschiktheid van toepassing is geweest;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.1.e
    text: |-
      de persoon, wiens arbeidsverhouding op grond van [artikel 6, eerste lid, onderdeel c, van de Ziektewet][ref1] niet
      als dienstbetrekking wordt beschouwd;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
  - number: 18.1.f
    text: |-
      de persoon, die op grond van [artikel 7 van de Ziektewet][ref1] als werknemer wordt beschouwd en tevens als
      zelfstandige werkzaamheden gaat verrichten of als echtgenoot van die zelfstandige meewerkt of gaat meewerken,
      indien gedurende de drie jaren, onmiddellijk voorafgaand aan de dag van aanvang van zijn vrijwillige verzekering,
      onafgebroken, al dan niet in Nederland, op grond van een wettelijke regeling een voorziening tegen geldelijke
      gevolgen van volledig duurzame arbeidsongeschiktheid of verminderde arbeidsgeschiktheid op hem van toepassing is
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
  - number: '18.2'
    text: |-
      De in het eerste lid bedoelde verplichting bestaat eveneens ten aanzien van de persoon, jonger dan 65 jaar, die op
      grond van [artikel 3, tweede of vijfde lid, van de Ziektewet][ref1], niet als werknemer wordt beschouwd, en


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '3'
  - number: 18.2.a
    text: |-
      wiens verplichte verzekering is geëindigd en die buiten Nederland woont, aldaar direct aansluitend op de
      beëindiging van de verplichte verzekering een dienstbetrekking vervult voor de duur van maximaal vijf jaar en wiens
      werkgever binnen Nederland woont of gevestigd is;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.2.b
    text: |-
      die Nederlander is en die is uitgezonden om door de Minister voor Ontwikkelingssamenwerking aan te wijzen
      werkzaamheden in het kader van ontwikkelingssamenwerking te verrichten;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.2.c
    text: |-
      die Nederlander is en die is uitgezonden om, in of buiten Nederland, werkzaamheden te verrichten voor een
      volkenrechtelijke organisatie, waarvan Nederland lid is dan wel waarvan de werkzaamheden door Nederland worden
      ondersteund;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.2.d
    text: die in Nederland woont, en buiten Nederland een dienstbetrekking vervult; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.2.e
    text: |-
      die Nederlander is en buiten Nederland werkzaamheden verricht die worden bekostigd door het Rijk en die tevens in
      opdracht van het Rijk worden verricht in het kader van een wettelijke taakomschrijving of ter uitvoering van een
      internationaal verdrag dan wel een daarmee gelijk te stellen overeenkomst of een besluit van een volkenrechtelijke
      organisatie.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: '18.3'
    text: |-
      Aan het vervullen van een dienstbetrekking als bedoeld in het tweede lid, onderdeel a, dient een aaneengesloten
      periode van verplichte verzekering van ten minste één jaar te zijn voorafgegaan.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: '18.4'
    text: |-
      Met de Nederlander, bedoeld in het tweede lid, onderdelen b, c en e, wordt gelijkgesteld de persoon, die onderdaan
      is van een van de lidstaten van de Europese Gemeenschap of onderdaan is van een Staat, waarmee Nederland een
      verdrag inzake sociale zekerheid heeft gesloten, mits hij voor hij werd uitgezonden in Nederland woonde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: '18.5'
    text: |-
      De in het eerste lid, onderdelen c en d, genoemde termijn van één jaar respectievelijk van drie jaren wordt geacht
      niet te zijn onderbroken:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.5.a
    text: indien de betrokkene gedurende niet meer dan zestig dagen niet verzekerd is geweest;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: 18.5.b
    text: |-
      gedurende de wachttijd als bedoeld in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
  - number: '18.6'
    text: |-
      De in het eerste lid, onderdelen c respectievelijk d, genoemde voorwaarde van een verzekeringsduur van één jaar
      respectievelijk van drie jaren wordt geacht te zijn vervuld, indien de betrokkene een uitkering ontvangt op grond
      van deze wet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel18
  - number: '19.1'
    text: 'Het verzoek om toelating tot de vrijwillige verzekering wordt ingediend bij het UWV:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
  - number: 19.1.a
    text: |-
      door de in [artikel 18, eerste lid, onderdelen a, b en c][ref1], bedoelde personen binnen vier weken na het einde
      van hun verplichte verzekering;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.b
    text: |-
      door de in [artikel 18, eerste lid, onderdeel f][ref1], bedoelde persoon: binnen vier weken na de dag, waarop
      zijn werkzaamheden als zelfstandige of zijn werkzaamheden als echtgenoot van de zelfstandige in diens bedrijfs- of
      beroepsuitoefening, een aanvang hebben genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.c
    text: |-
      door de in [artikel 18, tweede lid, onderdeel a][ref1], bedoelde persoon: binnen vier weken na de dag, waarop de
      verplichte verzekering is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.d
    text: |-
      door de in [artikel 18, tweede lid, onderdelen b, c en e][ref1], bedoelde persoon: binnen vier weken na de dag
      van zijn vertrek naar het buitenland dan wel, indien de in [artikel 18, tweede lid, onderdeel c][ref2], bedoelde
      werkzaamheden worden verricht in Nederland, binnen vier weken na de dag waarop die werkzaamheden een aanvang hebben
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.e
    text: |-
      door de in [artikel 18, tweede lid, onderdeel d][ref1], bedoelde persoon: binnen vier weken na de dag, waarop zijn
      werkzaamheden buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '19.2'
    text: |-
      Het UWV kan bepalen dat een verzoek om toelating tot de vrijwillige verzekering, ingediend na de daartoe op grond
      van deze wet of de daarop berustende bepalingen gestelde termijn, geacht wordt tijdig te zijn ingekomen, indien de
      persoon die het verzoek heeft gedaan, redelijkerwijs niet geacht kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
  - number: '19.3'
    text: 'De vrijwillige verzekering vangt aan:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
  - number: 19.3.a
    text: |-
      voor de in [artikel 18, eerste lid, onderdelen a, b en c, en tweede lid, onderdeel a][ref1], bedoelde persoon: op
      de dag na die, waarop de verplichte verzekering is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.3.b
    text: |-
      voor de in [artikel 18, eerste lid, onderdelen d, e en f][ref1], bedoelde persoon: op de dag van ontvangst van zijn
      verzoek om toelating;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.3.c
    text: |-
      voor de in [artikel 18, tweede lid, onderdelen b, c en e][ref1], bedoelde persoon: op de dag van zijn vertrek naar
      het buitenland dan wel, indien de in [artikel 18, tweede lid, onderdeel c][ref2], bedoelde werkzaamheden worden
      verricht in Nederland, op de dag waarop die werkzaamheden een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.3.d
    text: |-
      voor de in [artikel 18, tweede lid, onderdeel d][ref1], bedoelde persoon: op de dag, waarop zijn werkzaamheden
      buiten Nederland een aanvang hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '20'
    text: 'Het UWV beëindigt de vrijwillige verzekering:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
  - number: 20.a
    text: op verzoek van de vrijwillig verzekerde met ingang van een door hem te bepalen datum;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
  - number: 20.b
    text: |-
      met ingang van de dag, waarop de termijn van vijf jaar, bedoeld in [artikel 18, tweede lid, onderdeel a][ref1],
      is verstreken;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 20.c
    text: |-
      met ingang van de dag, waarop de werkzaamheden, bedoeld in [artikel 18, tweede lid][ref1], worden beëindigd en de
      vrijwillig verzekerde niet langer geacht kan worden inkomsten te verkrijgen wegens eindiging van die werkzaamheden
      dan wel inkomsten te derven in geval van ziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 20.d
    text: met ingang van de dag, waarop de vrijwillig verzekerde verplicht verzekerd wordt op grond van deze wet;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
  - number: 20.e
    text: |-
      indien de verschuldigde premie over een periode van twee volle kalendermaanden niet, niet volledig of niet tijdig
      wordt betaald; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
  - number: 20.f
    text: |-
      indien niet langer wordt voldaan aan andere vereisten voor toelating tot de vrijwillige verzekering, bedoeld in
      [artikel 18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '21.1'
    text: |-
      De persoon, die om toelating tot de vrijwillige verzekering verzoekt, bepaalt bij de aanvang van de vrijwillige
      verzekering de hoogte van het dagloon, met dien verstande dat dit niet meer kan bedragen dan:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
  - number: 21.1.a
    text: |-
      het in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref1] genoemde bedrag met betrekking
      tot een loontijdvak van een dag eventueel verhoogd of verlaagd krachtens [artikel 18 van die wet][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '18'
  - number: 21.1.b
    text: |-
      het loon of het inkomen dat hij in geval van volledig en duurzame arbeidsongeschiktheid naar het oordeel van het
      UWV derft.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
  - number: '21.2'
    text: |-
      Voor de persoon die verzekerde is op grond van deze paragraaf blijven bij het vaststellen van het recht op
      een WGA-uitkering en de duur en hoogte daarvan de [artikelen 54, derde en vierde lid][ref1], [58][ref2], en
      [59 tot en met 62][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel59
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '59'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '21.3'
    text: |-
      De hoogte van de WGA-uitkering op grond van de vrijwillige verzekering bedraagt per kalendermaand: I × J waarbij: -
      I staat voor maandloon; en
        - J staat voor het uitkeringspercentage, dat bij een arbeidsongeschiktheid van a. 35–45%, 28%; b. 45–55%, 35%; c.
      55–65%, 42%; d. 65–80%, 50,75%; en bij e. 80% of meer 70%, bedraagt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
  - number: '21.4'
    text: |-
      De hoogte van de uitkering, bedoeld in het derde lid, wordt eerst nadat een wijziging in de mate van
      arbeidsongeschiktheid ten minste twee kalendermaanden heeft voortgeduurd, herzien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
  - number: '21.5'
    text: |-
      Op de WGA-uitkering, bedoeld in het derde lid, wordt, indien de persoon, die op grond van deze paragraaf verzekerd
      is, meer verdient dan zijn resterende verdiencapaciteit als bedoeld in [artikel 60, vierde en vijfde lid][ref1],
      per kalendermaand 70% van dat meerdere in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 21a
    text: |-
      Het UWV stelt nadere regels met betrekking tot de vrijwillige verzekering. Deze regels bevatten in ieder geval
      bepalingen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21a
  - number: 21a.a
    text: de toelating tot de vrijwillige verzekering;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21a
  - number: 21a.b
    text: het einde van de vrijwillige verzekering; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21a
  - number: 21a.c
    text: |-
      het dagloon, bedoeld in [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel21
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '22'
    text: |-
      Voorzover daarvan in deze paragraaf niet wordt afgeweken zijn de overige artikelen van deze wet en de daarop
      berustende bepalingen van overeenkomstige toepassing op deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel22
  - number: '23.1'
    text: |-
      Voordat de verzekerde aanspraak kan maken op een uitkering op grond van deze wet geldt voor hem een wachttijd van
      104 weken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: '23.2'
    text: |-
      Als eerste dag van de wachttijd geldt de eerste werkdag al dan niet in een dienstbetrekking waarop door de
      verzekerde wegens ziekte niet is gewerkt of het werken tijdens de werktijd is gestaakt. Bij ministeriële regeling
      kunnen nadere en afwijkende regels worden gesteld in verband met het voor bijzondere gevallen vaststellen van welke
      dag als eerste werkdag wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: '23.3'
    text: 'Bij het bepalen van de wachttijd worden de volgende perioden in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: 23.3.a
    text: |-
      perioden waarin recht bestaat op ziekengeld als bedoeld in de [Ziektewet][ref1] en de daarop berustende bepalingen
      worden in aanmerking genomen en worden samengeteld, indien zij:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 23.3.a.1°
    text: elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: 23.3.a.2°
    text: |-
      direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op
      grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt
      genoten, tenzij de ongeschiktheid voorafgaande aan en de ongeschiktheid aansluitende op die periode redelijkerwijs
      niet geacht kunnen worden voort te vloeien uit dezelfde oorzaak; en


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 23.3.b
    text: |-
      perioden die niet al op grond van onderdeel a meetellen maar waarin de verzekerde ongeschikt is geweest voor zijn
      arbeid. Deze perioden worden samengeteld, indien zij:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: 23.3.b.1°
    text: elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: 23.3.b.2°
    text: |-
      direct voorafgaan aan en aansluiten op een periode waarin uitkering in verband met zwangerschap of bevalling op
      grond van [artikel 3:7, eerste lid][ref1], [3:8][ref2] of [3:10, eerste lid, van de Wet arbeid en zorg][ref3] wordt
      genoten, tenzij de ongeschiktheid voorafgaande aan en de ongeschiktheid aansluitende op die periode redelijkerwijs
      niet geacht kunnen worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '23.4'
    text: |-
      Met recht op ziekengeld als bedoeld in het derde lid, wordt gelijkgesteld de situatie dat aan een verzekerde geen
      ziekengeld wordt betaald als gevolg van de toepassing van de [artikelen 19a][ref1] en [19b van de Ziektewet][ref2]
      en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel19b
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 19b
  - number: '23.5'
    text: |-
      Voor het bepalen van de wachttijd worden niet in aanmerking genomen perioden gedurende welke een uitkering wordt
      genoten als bedoeld in het derde lid, onderdeel a, onder 2°.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
  - number: '23.6'
    text: |-
      Op aanvraag van de verzekerde stelt het UWV, in afwijking van het eerste lid, een verkorte wachttijd vast indien
      de verzekerde volledig en duurzaam arbeidsongeschikt is als bedoeld in [artikel 4, tweede lid][ref1], en bij de
      aanvraag [artikel 65][ref2] in acht is genomen. Een verkorte wachttijd bedraagt ten minste 13 weken en ten hoogste
      78 weken. Het einde van een verkorte wachttijd wordt niet eerder vastgesteld dan tien weken na de dag waarop de
      aanvraag daartoe is ingediend. Dit lid is niet van toepassing op de verzekerde aan wie ziekengeld als bedoeld in
      [artikel 29, tweede lid, van de Ziektewet][ref3] wordt uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '24.1'
    text: |-
      Na afloop van de wachttijd wordt het tijdvak, gedurende welke de verzekerde jegens zijn werkgever, recht heeft
      op loon of bezoldiging, op gezamenlijk verzoek van de verzekerde en die werkgever door het UWV verlengd tenzij
      zwaarwegende omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel24
  - number: '24.2'
    text: |-
      Het verlengde tijdvak, bedoeld in het eerste lid, eindigt op de door het UWV aangegeven datum en kan op verzoek
      van de werkgever of de verzekerde worden verkort, of wordt op hun gezamenlijk verzoek verder verlengd tenzij
      zwaarwegende omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel24
  - number: '24.3'
    text: |-
      Het UWV stelt bij toepassing van het tweede lid een nieuwe datum vast waarop het verlengde tijdvak eindigt, met
      dien verstande dat dit tijdvak niet eerder eindigt dan vijftien weken na het verzoek, bedoeld in het tweede lid,
      tenzij de werkgever voor het verstrijken van het tijdvak van die vijftien weken geen loon meer verschuldigd is,
      omdat de dienstbetrekking is geëindigd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel24
  - number: '25.1'
    text: |-
      De werkgever jegens wie de verzekerde, bij ongeschiktheid tot het verrichten van arbeid wegens ziekte, recht
      heeft op loon als bedoeld in [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref1] dan wel aanspraak heeft op
      bezoldiging op grond van [artikel 76a, eerste lid, van de Ziektewet][ref2] houdt aantekening van het verloop van de
      ziekte en de reïntegratie van de verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '25.2'
    text: |-
      De werkgever, bedoeld in het eerste lid, stelt binnen een bij ministeriële regeling nader te bepalen termijn, in
      overeenstemming met de verzekerde een plan van aanpak op. De afspraken die in het plan van aanpak zijn gemaakt
      worden door werkgever en verzekerde nageleefd. Het plan van aanpak wordt periodiek geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.3'
    text: |-
      Uiterlijk vijftien weken voor het verstrijken van de wachttijd stelt de werkgever, bedoeld in het eerste lid, in
      overleg met de verzekerde een reïntegratieverslag op en verstrekt hiervan een afschrift aan de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.4'
    text: |-
      Indien [artikel 24, eerste lid][ref1], toepassing heeft gevonden:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: 25.4.a
    text: |-
      stelt de werkgever in overleg met de verzekerde, indien hij nog geen reïntegratieverslag heeft opgesteld, in
      afwijking van het derde lid, het reïntegratieverslag uiterlijk vijftien weken voor het verstrijken van het door
      het UWV vastgestelde verlengde tijdvak, bedoeld in [artikel 24, eerste lid][ref1], op en verstrekt een afschrift
      daarvan aan de verzekerde;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: 25.4.b
    text: |-
      vult de werkgever in overleg met de verzekerde, indien hij al een reïntegratieverslag heeft opgesteld dit
      reïntegratieverslag uiterlijk vijftien weken voor het verstrijken van het door het UWV vastgestelde verlengde
      tijdvak, bedoeld in [artikel 24, eerste lid][ref1], aan en verstrekt een afschrift daarvan aan de verzekerde,
      tenzij de verzekerde verzoekt dit, in verband met het doen van een aanvraag als bedoeld in [artikel 64][ref2]
      eerder te doen. De werkgever komt binnen twee weken aan dit verzoek tegemoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '25.5'
    text: |-
      Bij de uitvoering van het eerste tot en met het vierde lid laat de werkgever zich bijstaan door een persoon als
      bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met de bijstand,
      bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref2] of door een arbodienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '25.6'
    text: |-
      De verzekerde verleent zijn medewerking bij het opstellen van het plan van aanpak en het opstellen van het
      reïntegratieverslag.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.7'
    text: Bij ministeriële regeling kunnen regels met betrekking tot het eerste tot en met zesde lid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.8'
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 64][ref1] blijkt dat de werkgever zijn verplichting
      om een reïntegratieverslag op te stellen niet of niet volledig is nagekomen, stelt het UWV aan de werkgever een
      termijn waarbinnen het reïntegratieverslag wordt verstrekt of aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '25.9'
    text: |-
      Indien bij de behandeling van de aanvraag, bedoeld in [artikel 64][ref1] en de beoordeling, bedoeld in
      [artikel 65][ref2] blijkt dat de werkgever zonder deugdelijke grond zijn verplichtingen op grond van
      het eerste, tweede, derde, vierde of vijfde lid dan wel de krachtens het zevende lid gestelde regels
      niet of niet volledig nakomt of onvoldoende reïntegratie-inspanningen heeft verricht, verlengt het
      UWV het tijdvak gedurende welke de verzekerde jegens die werkgever recht heeft op loon op grond van
      [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref3] dan wel aanspraak op bezoldiging op grond van
      [artikel 76a, eerste lid, van de Ziektewet][ref4], opdat de werkgever zijn tekortkoming ten aanzien van de in de
      eerste zin bedoelde verplichtingen of reïntegratie-inspanningen kan herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '25.10'
    text: |-
      Het UWV geeft de beschikking omtrent de toepassing van het negende lid zes weken voor de afloop van
      de wachttijd, bedoeld in [artikel 23][ref1], of indien toepassing is gegeven aan [artikel 24][ref2]
      voor de afloop van het verlengde tijdvak, indien de aanvraag, bedoeld in [artikel 64][ref3], tijdig
      is gedaan. Indien de aanvraag, bedoeld in [artikel 64][ref4], niet tijdig is gedaan, wordt de in
      de vorige zin bedoelde beschikking uiterlijk zes weken voor de afloop van het tijdvak, bedoeld in
      [artikel 629, elfde lid, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref5] gegeven dan wel van het tijdvak,
      bedoeld in [artikel 76a, zesde lid, onderdeel b, van de Ziektewet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref5
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '25.11'
    text: |-
      Verlenging van het tijdvak als bedoeld in het negende lid vindt niet plaats indien het UWV de beschikking
      omtrent de toepassing van het negende lid niet geeft voor de afloop van de wachttijd, bedoeld in
      [artikel 23][ref1], of indien toepassing is gegeven aan [artikel 24][ref2] van deze wet dan wel aan het
      [elfde lid, onderdeel b, van artikel 629 van Titel 10 van Boek 7 van het Burgerlijk Wetboek][ref3] of
      [artikel 76a, zesde lid, onderdeel b, van de Ziektewet][ref4], voor afloop van het verlengde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: 76a
  - number: '25.12'
    text: |-
      Indien de werkgever na toepassing van het negende lid van mening is dat hij zijn tekortkoming ten aanzien van de
      in het negende lid bedoelde verplichtingen of reïntegratie-inspanningen heeft hersteld, meldt hij dit aan het UWV,
      waarbij hij aantoont dat hij de tekortkoming heeft hersteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.13'
    text: |-
      Het UWV geeft de beschikking waarin wordt vastgesteld of de tekortkoming, bedoeld in het negende lid, is hersteld
      binnen drie weken na de ontvangst van de melding, bedoeld in het twaalfde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.14'
    text: |-
      Het tijdvak, bedoeld in het negende lid, eindigt zes weken nadat het UWV heeft vastgesteld dat de werkgever zijn
      tekortkoming ten aanzien van de in het negende lid bedoelde verplichtingen of reïntegratie-inspanningen heeft
      hersteld, maar niet later dan na 52 weken. Indien het UWV de beschikking omtrent de toepassing van het negende
      lid of de beschikking waarin wordt vastgesteld dat een tekortkoming is hersteld te laat geeft, eindigt het tijdvak
      zoveel weken eerder als de beschikking later is afgegeven.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '25.15'
    text: |-
      Indien het UWV heeft vastgesteld dat de tekortkoming, bedoeld in het negende lid, is hersteld, geeft het UWV binnen
      zes weken een beschikking over het ontstaan van het recht op een uitkering als bedoeld in [hoofdstuk 6][ref1] en
      [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: '25.16'
    text: |-
      Bij ministeriële regeling kunnen voor de toepassing van het negende tot en met het vijftiende lid nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel25
  - number: '26.1'
    text: |-
      In afwijking van artikel 25, is op het UWV ten aanzien van de verzekerde die op grond van
      [artikel 29, tweede lid, onderdelen a, b, c of d, van de Ziektewet][ref1] recht heeft op ziekengeld,
      [artikel 25, tweede tot en met zestiende lid][ref2], niet van toepassing en is [artikel 25, eerste lid][ref3],
      van overeenkomstige toepassing. Het UWV stelt, binnen een bij ministeriële regeling nader te bepalen termijn, in
      overleg met die verzekerde, een plan van aanpak op. Het plan van aanpak wordt periodiek geëvalueerd. Artikel 30a,
      derde en vierde lid, van de Wet structuur uitvoeringsorganisatie werknemersverzekeringen is van overeenkomstige
      toepassing, waarbij voor «de reïntegratievisie» telkens wordt gelezen: het plan van aanpak.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: '26.2'
    text: |-
      [Artikel 25, vierde, achtste tot en met zestiende lid][ref1], is niet van toepassing op de werkgever van de
      verzekerde die op grond van [artikel 29, tweede lid, onderdeel e, f of g, van de Ziektewet][ref2] dan wel op grond
      van [artikel 29a, eerste of vierde lid, van die wet][ref3] recht heeft op ziekengeld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29a
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 29a
  - number: '26.3'
    text: |-
      In afwijking van het eerste lid is [artikel 25, eerste, tweede, derde, vijfde, zesde, zevende en achtste lid][ref1],
      van overeenkomstige toepassing op de eigenrisicodrager, bedoeld in
      [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref2] ten aanzien van de personen, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref3], die laatstelijk tot hem in dienstbetrekking
      stonden. Indien bij de behandeling van de aanvraag, bedoeld in [artikel 64][ref4] en de beoordeling, bedoeld
      in [artikel 65][ref5] blijkt dat de eigenrisicodrager, bedoeld in de eerste zin, zonder deugdelijke grond de
      uit die zin voortvloeiende verplichtingen niet of niet volledig nakomt of onvoldoende reïntegratie-inspanningen
      heeft verricht, verlengt het UWV het tijdvak gedurende welke de persoon, bedoeld in de eerste zin recht op
      ziekengeld heeft op grond van [artikel 29 van de Ziektewet][ref6], op dat de werkgever zijn tekortkoming
      ten aanzien van de in de tweede zin bedoelde verplichtingen of reïntegratie-inspanningen kan herstellen.
      [Artikel 25, tiende tot en met zestiende lid][ref7], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel65
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref7]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref7
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: '26.4'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld voor de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel26
  - number: '27.1'
    text: |-
      De verzekerde die een aanvraag voor een uitkering heeft ingediend of een recht heeft op een uitkering op grond
      van deze wet en de instelling waaraan op grond van [artikel 71][ref1] een uitkering op grond van deze wet wordt
      uitbetaald, verstrekt op verzoek of uit eigen beweging zo spoedig mogelijk alle informatie, waarvan het hem
      redelijkerwijs duidelijk moet zijn dat die van invloed kan zijn op het recht op uitkering, de hoogte van de
      uitkering of de betaling van de uitkering, waaronder mede is begrepen informatie in het kader van reïntegratie, aan
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel71
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '71'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '27.2'
    text: |-
      De verzekerde die een aanvraag voor een uitkering heeft ingediend of een recht heeft op een uitkering op grond van
      deze wet is verplicht:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.2.a
    text: |-
      te voldoen aan elke oproep van het UWV of van een of meer door het UWV aangewezen personen om aanwezig te zijn
      op een door of vanwege het UWV te bepalen plaats voor beantwoording van vragen als bedoeld in onderdeel b het
      meewerken aan onderzoek als bedoeld in onderdeel c of het naleven van de controlevoorschriften, bedoeld in
      onderdeel d;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.2.b
    text: |-
      vragen te beantwoorden die door het UWV of door een of meer door het UWV aangewezen personen in verband met het
      recht op uitkering op grond van deze wet worden gesteld;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.2.c
    text: |-
      mee te werken door zich te laten onderzoeken door het UWV of door een of meer daartoe door het UWV aangewezen
      personen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.2.d
    text: |-
      tot naleving van door het UWV vastgestelde controlevoorschriften die noodzakelijk zijn voor een juiste uitvoering
      van deze wet;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.2.e
    text: |-
      op verzoek onverwijld inzage te geven aan het UWV in een op hem betrekking hebbend document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '27.3'
    text: |-
      De verplichtingen, bedoeld in het eerste en tweede lid, zijn van overeenkomstige toepassing op oproepen, vragen en
      onderzoeken door:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.3.a
    text: de Centrale organisatie werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.3.b
    text: het reïntegratiebedrijf dat in opdracht van het UWV of de eigenrisicodrager werkzaamheden, verricht; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: 27.3.c
    text: |-
      personen die met toestemming van het UWV of de eigenrisicodrager zijn aangewezen door een reïntegratiebedrijf als
      bedoeld in onderdeel b, voorzover dit noodzakelijk is voor de uitvoering van de bij wet of overeenkomst aan deze
      personen en rechtspersonen opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: '27.4'
    text: |-
      De verzekerde die recht heeft op een uitkering op grond van deze wet en die bij deelname aan een
      reïntegratietraject zijn reïntegratieverplichtingen niet naleeft, deelt de reden daarvan onmiddellijk mede aan
      het reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: '27.5'
    text: |-
      De verzekerde die een aanvraag voor een uitkering heeft ingediend of een recht heeft op een uitkering op grond
      van deze wet is verplicht te voldoen aan het voorschrift, gegeven door het UWV of de door hem daartoe aangewezen
      deskundige, om zich ter observatie te doen opnemen of te verblijven in een aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: '27.6'
    text: |-
      De eigenrisicodrager treedt voor de toepassing van het eerste en tweede lid, voorzover het betreft de naleving door
      zijn werknemer of gewezen werknemer van plichten die reïntegratie betreffen, in de plaats van het UWV.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: '27.7'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de persoon die tijdens de wachttijd, met uitzondering van de
      eerste dag van die wachttijd, geen verzekerde is op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
  - number: '27.8'
    text: |-
      De werkgever die een aanvraag heeft ingediend voor of recht heeft op een subsidie als bedoeld in artikel 36 en de
      persoon, niet zijnde verzekerde, bedoeld in het eerste lid, die een aanvraag heeft ingediend voor of recht heeft
      op een voorziening als bedoeld in [artikel 35][ref1], verstrekken op verzoek van het UWV of uit eigen beweging zo
      spoedig mogelijk alle informatie, waarvan het hem redelijkerwijs duidelijk moet zijn dat zij van invloed kan zijn
      op de verstrekking of toekenning of op de duur of de hoogte van het reïntegratie-instrument, aan het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '28.1'
    text: |-
      De verzekerde voorkomt het ontstaan van arbeidsongeschiktheid of verminderde arbeidsgeschiktheid en beperkt het
      bestaan van arbeidsongeschiktheid of verminderde arbeidsgeschiktheid, voorzover dit redelijkerwijs van hem verwacht
      mag worden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
  - number: '28.2'
    text: |-
      De verzekerde is gedurende de wachttijd alsmede het verlengde tijdvak, bedoeld in [artikel 24, eerste lid][ref1],
      en het tijdvak, bedoeld in [artikel 25, negende lid][ref2], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: 28.2.a
    text: |-
      mee te werken aan door zijn werkgever of door een door die werkgever aangewezen deskundige gegeven redelijke
      voorschriften of getroffen maatregelen die erop gericht zijn om hem in staat te stellen passende arbeid te
      verrichten; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
  - number: 28.2.b
    text: voldoende reïntegratie-inspanningen te verrichten;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
  - number: 28.2.c
    text: een naar algemeen medische maatstaven adequate behandeling te ondergaan voor zijn ziekte of gebrek.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
  - number: '28.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing op de persoon die tijdens de wachttijd, met uitzondering van de
      eerste dag van die wachttijd, geen verzekerde is op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel28
  - number: '29.1'
    text: |-
      De verzekerde die recht heeft op een WGA-uitkering is verplicht in voldoende mate te trachten mogelijkheden tot het
      verrichten van passende arbeid te behouden of te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: '29.2'
    text: |-
      Ter naleving van de plicht, bedoeld in het eerste lid, is de verzekerde die recht heeft op een WGA-uitkering in elk
      geval verplicht:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: 29.2.a
    text: |-
      zich geneeskundig te laten behandelen of aanwijzingen van een arts op te volgen indien het UWV of de
      eigenrisicodrager of het reïntegratiebedrijf in opdracht van het UWV of de eigenrisicodrager, daartoe opdracht
      geeft en zijn genezing niet te belemmeren;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: 29.2.b
    text: |-
      mee te werken aan activiteiten of werkzaamheden, gericht op zijn inschakeling in de arbeid, die het UWV of de
      eigenrisicodrager wenselijk acht voor verkrijging van mogelijkheden tot verrichten van passende arbeid;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: 29.2.c
    text: |-
      mee te werken aan aanpassing van de arbeidsplaats en aan persoonsgebonden voorzieningen die het UWV of de
      eigenrisicodrager verstrekt voor verkrijging van mogelijkheden tot verrichten van passende arbeid en zo nodig
      trachten die aanpassing en die voorzieningen te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: 29.2.d
    text: mee te werken aan het opstellen van de reïntegratievisie en het reïntegratieplan;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: 29.2.e
    text: te voldoen aan verplichtingen die zijn opgenomen in de reïntegratievisie en het reïntegratieplan.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel29
  - number: '30.1'
    text: 'De verzekerde die recht heeft op een WGA-uitkering is verplicht:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: 30.1.a
    text: passende arbeid te verrichten indien hij daartoe in de gelegenheid wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: 30.1.b
    text: in voldoende mate te trachten passende arbeid te verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: 30.1.c
    text: |-
      geen eisen te stellen in verband met door hem te verrichten arbeid die het aanvaarden of verkrijgen van passende
      arbeid belemmeren.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: '30.2'
    text: |-
      De verzekerde die zijn resterende verdiencapaciteit als bedoeld in [paragraaf 7.2][ref1] niet volledig
      benut en die recht heeft op een WGA-uitkering, is verplicht zich als werkzoekende bij de Centrale
      organisatie werk en inkomen te laten registreren, indien hem daartoe het recht toekomt op grond van
      [artikel 25, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] en het UWV of de
      eigenrisicodrager hem dit opdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '25'
  - number: '30.3'
    text: |-
      De verzekerde die recht heeft op een loongerelateerde uitkering van de WGA-uitkering en arbeid in dienstbetrekking
      verricht is verplicht:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: 30.3.a
    text: |-
      zich te onthouden van verwijtbaar gedrag dat aangemerkt kan worden als een dringende reden in de zin van
      [artikel 678 van boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 30.3.b
    text: |-
      de dienstbetrekking niet door of op zijn verzoek te laten beëindigen zonder dat aan de voortzetting ervan zodanige
      bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem kon worden gevergd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: '30.4'
    text: |-
      In dit hoofdstuk wordt onder passende arbeid verstaan alle arbeid die voor de krachten en bekwaamheden van de
      verzekerde is berekend, tenzij aanvaarding om redenen van lichamelijke, geestelijke of sociale aard niet van hem
      kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: '30.5'
    text: |-
      Het door de verzekerde, bedoeld in het derde lid, niet voeren van verweer tegen of het instemmen met een
      beëindiging van de dienstbetrekking door of op verzoek van de werkgever leidt niet tot overtreding van de
      verplichting, bedoeld in het derde lid, aanhef en onderdeel a.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel30
  - number: '31'
    text: |-
      De plichten, bedoeld in [artikel 27][ref1], [28][ref2], [29][ref3], [30][ref4] en [64, derde lid][ref5], worden,
      indien de in die artikelen genoemde verzekerde een wettelijk vertegenwoordiger heeft, door die vertegenwoordiger
      nageleefd. Voorzover de plichten slechts door de verzekerde kunnen worden nageleefd, bevordert de wettelijk
      vertegenwoordiger die naleving.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '32.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de [artikelen 27][ref1],
      [28][ref2], [29][ref3] en [30, eerste tot en met derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '32.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld waarbij bepaalde groepen werknemers, voor een bij die
      regeling te bepalen maximale periode, worden vrijgesteld van verplichtingen, hun op grond van [artikel 29][ref1] en
      [30, eerste lid][ref2], opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '32.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan werknemers
      in individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hun op grond van
      [artikel 30, eerste lid][ref1], opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '33'
    text: |-
      De verzekerde die een aanvraag voor een uitkering heeft ingediend, of een recht heeft op een uitkering op grond van
      deze wet wordt door zijn werkgever in de gelegenheid gesteld tot het geldend maken van de hem op grond van deze wet
      en de daarop berustende bepalingen toekomende aanspraken en tot het nakomen van de hem op grond van deze wet en de
      daarop berustende bepalingen opgelegde verplichtingen, voorzover de uitoefening van die bevoegdheden en de nakoming
      van die verplichtingen niet buiten de arbeidstijd kan geschieden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel33
  - number: '34.1'
    text: |-
      De verzekerde die recht heeft op een WGA-uitkering en wiens uitkering door het UWV wordt betaald, heeft recht
      op ondersteuning bij arbeidsinschakeling en, met inachtneming van de daarvoor geldende wettelijke bepalingen,
      op de naar het oordeel van het UWV noodzakelijk geachte voorziening gericht op arbeidsinschakeling, tenzij
      [artikel 42][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '34.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld op
      grond waarvan het UWV op aanvraag van de verzekerde, bedoeld in het eerste lid, of een verzekerde met naar het
      oordeel van het UWV structurele functionele beperkingen, in het kader van de bevordering en ondersteuning bij de
      inschakeling in de arbeid als zelfstandige, voorzieningen kan verstrekken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel34
  - number: '34.3'
    text: |-
      Dit artikel is niet van toepassing op de verzekerde, die werkzaam is als werknemer in de
      zin van de [Wet sociale werkvoorziening][ref1] of op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
  - number: '35.1'
    text: |-
      Het UWV kan aan de persoon met een naar het oordeel van het UWV structurele functionele beperking, en die arbeid
      in dienstbetrekking verricht of die arbeid in dienstbetrekking gaat verrichten, doch niet werkzaam is of zal zijn
      als werknemer in de zin van de [Wet sociale werkvoorziening][ref1] of op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van die wet][ref2], of die scholing of opleiding in het kader van de bevordering van de inschakeling in
      het arbeidsproces volgt of gaat volgen of arbeid op een proefplaats verricht of gaat verrichten, met uitzondering
      van de persoon, bedoeld in [artikel 34, derde lid][ref3], op aanvraag voorzieningen toekennen die strekken tot
      behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid, het volgen van de scholing of
      opleiding of het verrichten van arbeid op die proefplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel34
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '35.2'
    text: 'Onder voorzieningen als bedoeld in het eerste lid worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: 35.2.a
    text: |-
      vervoersvoorzieningen die er toe strekken dat de persoon, bedoeld in het eerste lid, zijn werkplek of
      opleidingslocatie kan bereiken;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: 35.2.b
    text: intermediaire activiteiten ten behoeve van personen met een visuele, auditieve of motorische handicap;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: 35.2.c
    text: |-
      meeneembare voorzieningen ten behoeve van de inrichting van de arbeidsplaats, de productie- en werkmethoden, de
      inrichting van de opleidingsplaats of de proefplaats en de bij de arbeid of opleiding te gebruiken hulpmiddelen,
      die in overwegende mate op het individu van de persoon, bedoeld in het eerste lid, zijn afgestemd; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: 35.2.d
    text: |-
      noodzakelijke persoonlijke ondersteuning bij het verrichten van de aan de persoon opgedragen taken, indien die
      ondersteuning een compensatie vormt voor zijn beperkingen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: '35.3'
    text: |-
      Het UWV kan aan de persoon, bedoeld in het eerste lid, op aanvraag vervoersvoorzieningen toekennen die strekken tot
      verbetering van zijn leefomstandigheden en die deel uitmaken van dan wel rechtstreeks samenhangen met voorzieningen
      als bedoeld in het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: '35.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel35
  - number: '36.1'
    text: |-
      Het UWV kan op aanvraag van de werkgever die met een werknemer een dienstbetrekking, anders dan
      een dienstbetrekking in de zin van de [WSW][ref1] of op een arbeidsovereenkomst als bedoeld in
      [artikel 7 van de Wet sociale werkvoorziening][ref2], van ten minste zes maanden is aangegaan of waarmee door
      elkaar opvolgende dienstbetrekkingen gedurende ten minste zes maanden een dienstbetrekking blijkt te bestaan,
      subsidie verstrekken voor meerkosten voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0008903
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008903
      - id: ref2
        bwb_id: BWBR0008903
        artikel: '7'
  - number: 36.1.a
    text: |-
      die werkgever aantoont dat het totaal van de kosten die hij maakt of heeft gemaakt ten behoeve van het in dienst
      houden of in dienst nemen van een werknemer met een naar het oordeel van het UWV structurele functionele beperking
      meer bedraagt dan bij algemene maatregel van bestuur te bepalen bedragen, die in hoogte verschillen afhankelijk van
      de hoogte van het loon van de werknemer;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
  - number: 36.1.b
    text: |-
      die werkgever, na ommekomst van de periode van 3 respectievelijk 1 jaar, genoemd in
      [artikel 49 van de Wet financiering sociale verzekeringen][ref1], kosten maakt of heeft gemaakt ten behoeve van het
      in dienst houden van een werknemer als bedoeld in onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel49
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '49'
  - number: '36.2'
    text: |-
      Onder de kosten, bedoeld in het eerste lid, worden verstaan de kosten van voorzieningen, bedoeld in
      [artikel 35, tweede lid][ref1], voorzover die naar de aard der zaak duurzaam zijn verenigd met het bedrijf van
      de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '36.3'
    text: |-
      Een subsidie als bedoeld in het eerste lid wordt niet verstrekt, indien de subsidie wordt aangevraagd voor
      een werknemer voor wie reeds eerder aan de werkgever subsidie op grond van dit artikel is verstrekt, tenzij de
      subsidieaanvraag:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
  - number: 36.3.a
    text: geen verband houdt met feiten en omstandigheden die aanleiding zijn geweest voor het verstrekken van de subsidie;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
  - number: 36.3.b
    text: |-
      betrekking heeft op door de werkgever gemaakte kosten ter vervanging van de bij de arbeid te gebruiken hulpmiddelen
      door de werknemer.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
  - number: '36.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere en zo nodig afwijkende regels worden gesteld met
      betrekking tot dit artikel. Daarbij kunnen regels worden gesteld met betrekking tot subsidie in geval van overgang
      van onderneming als bedoeld in [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1] alsmede met betrekking tot
      de te verstrekken gegevens bij een aanvraag voor subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: '37.1'
    text: |-
      Het UWV en de eigenrisicodrager kunnen, in het kader van de bevordering van de inschakeling in de arbeid,
      toestemming verlenen aan de gedeeltelijk arbeidsgeschikte die recht heeft op een uitkering op grond van deze wet om
      op een proefplaats bij een werkgever gedurende maximaal drie maanden onbeloonde werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: '37.2'
    text: 'De onbeloonde werkzaamheden op een proefplaats zijn:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: 37.2.a
    text: werkzaamheden, waartoe de gedeeltelijk arbeidsgeschikte met zijn krachten en bekwaamheden in staat is;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: 37.2.b
    text: |-
      werkzaamheden, waarbij de werkgever, bij wie de proefplaatsing geschiedt, een aansprakelijkheids- en
      ongevallenverzekering ten behoeve van de gedeeltelijk arbeidsgeschikte heeft afgesloten;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: 37.2.c
    text: |-
      werkzaamheden, die de gedeeltelijk arbeidsgeschikte niet reeds eerder onbeloond op een proefplaats bij die
      werkgever of diens rechtsvoorganger heeft verricht; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: 37.2.d
    text: |-
      werkzaamheden, waarbij er, naar het oordeel van het UWV of de eigenrisicodrager, een reëel uitzicht is op een op de
      onbeloonde werkzaamheden aansluitende dienstbetrekking van dezelfde of grotere omvang voor ten minste 6 maanden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: '37.3'
    text: |-
      De gedeeltelijk arbeidsgeschikte die werkzaamheden verricht als bedoeld in het eerste lid, doet daarvan onverwijld
      mededeling aan het UWV of de eigenrisicodrager.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: '37.4'
    text: |-
      Indien de werkzaamheden, bedoeld in het eerste lid, wegens ziekte worden onderbroken, wordt de periode waarin een
      uitkering bij ziekte wordt ontvangen, voor de toepassing van dat lid buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: '37.5'
    text: |-
      In afwijking van [artikel 30, eerste lid, onderdeel b][ref1], is de gedeeltelijk arbeidsgeschikte die onbeloonde
      werkzaamheden op een proefplaats als bedoeld in het eerste of tweede lid verricht, voor de duur van de
      proefplaatsing niet verplicht passende arbeid te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '37.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel37
  - number: '38'
    text: |-
      Het UWV kan controlevoorschriften vaststellen. Deze voorschriften gaan niet verder dan strikt noodzakelijk is voor
      een juiste uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel38
  - number: '39.1'
    text: |-
      Nadat het recht op een WGA-uitkering is vastgesteld, stelt het UWV in samenspraak met de verzekerde een
      reïntegratievisie vast waarin verplichtingen en rechten van de verzekerde zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.2'
    text: Het UWV evalueert, in samenspraak met de verzekerde, periodiek de reïntegratievisie en stelt deze zo nodig bij.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.3'
    text: |-
      Indien de reïntegratievisie daartoe aanleiding geeft laat het UWV ten behoeve van de verzekerde, bedoeld in
      het eerste lid, een plan gericht op behoud en verkrijging van mogelijkheden tot het verrichten van arbeid en
      inschakeling in arbeid opstellen door een reïntegratiebedrijf. Het reïntegratieplan wordt in samenspraak met de
      verzekerde opgesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.4'
    text: |-
      In het reïntegratieplan worden verplichtingen en rechten van de verzekerde vermeld voorzover die niet in de
      reïntegratievisie zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.5'
    text: |-
      Indien een reïntegratiebedrijf aan het UWV heeft gemeld dat het gegronde vermoeden bestaat dat een persoon aan wie
      een WGA-uitkering is toegekend onvoldoende medewerking verleent aan de op hem betrekking hebbende werkzaamheden van
      het reïntegratiebedrijf, neemt het UWV een beschikking met betrekking tot de gehele of gedeeltelijke opschorting of
      schorsing van de betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.6'
    text: |-
      Het UWV stelt het reïntegratiebedrijf in kennis van een beschikking tot opschorting of schorsing als bedoeld in het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
  - number: '39.7'
    text: |-
      Dit artikel is niet van toepassing indien [artikel 42][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '40.1'
    text: |-
      Het UWV maakt per werkgever, die behoort tot een bij ministeriële regeling te bepalen categorie, het percentage
      werknemers van die werkgever dat in een kalenderjaar recht heeft gekregen op een WGA-uitkering openbaar. Dat
      percentage wordt verkregen door het aantal werknemers dat in dienstbetrekking stond tot die werkgever, dat recht
      heeft gekregen op een WGA-uitkering in het kalenderjaar dat voorafgaat aan het kalenderjaar waarin openbaarmaking
      plaatsvindt, te delen door het gemiddelde aantal werknemers dat in dienstbetrekking stond tot die werkgever
      gedurende het kalenderjaar dat voorafgaat aan eerstgenoemd kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel40
  - number: '40.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder recht krijgen op een WGA-uitkering verstaan het voor de eerste
      maal betaald krijgen van die uitkering.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel40
  - number: '40.3'
    text: |-
      Indien een werkgever, met toepassing van de [artikelen 96][ref1] en
      [97 van de Wet financiering sociale verzekeringen][ref2] is aangesloten bij verschillende sectoren, vindt voor elk
      bedrijfsonderdeel van de werkgever, waar werkzaamheden worden verricht die behoren tot een afzonderlijke sector, de
      in het eerste lid bedoelde openbaarmaking afzonderlijk plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel97
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '96'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '97'
  - number: '40.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de wijze van openbaarmaking van gegevens
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel40
  - number: '41'
    text: |-
      Het UWV beoordeelt met inachtneming van [artikel 6][ref1] en de daarop berustende bepalingen gedurende de eerste
      vijf jaar nadat recht op een arbeidsongeschiktheidsuitkering is ontstaan jaarlijks of de verzekerde die volledig en
      duurzaam arbeidsongeschikt is als bedoeld in [artikel 4, derde lid][ref2], nog volledig arbeidsongeschikt is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel4
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 41a
    text: |-
      In door het UWV vast te stellen gevallen worden reiskosten, verblijfkosten en tijdverlies vergoed van personen
      die door het UWV zijn opgeroepen en van hun begeleiders indien de toestand van de persoon begeleiding noodzakelijk
      maakt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel41a
  - number: '42.1'
    text: |-
      De eigenrisicodrager bevordert ten aanzien van de verzekerde, bedoeld in [artikel 82, eerste en tweede lid][ref1],
      die recht heeft op een WGA-uitkering, de inschakeling in de arbeid in zijn bedrijf of in het bedrijf van een andere
      werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '42.2'
    text: |-
      Uit hoofde van de uitoefening van zijn taak, bedoeld in het eerste lid, treft de eigenrisicodrager maatregelen
      gericht op behoud, herstel of bevordering van de mogelijkheid tot het verrichten van arbeid van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
  - number: '42.3'
    text: |-
      De eigenrisicodrager verstrekt aan een reïntegratiebedrijf gegevens voorzover deze noodzakelijk zijn voor de
      uitvoering van werkzaamheden, die de eigenrisicodrager in verband met de taak, bedoeld in het eerste lid, aan
      dat reïntegratiebedrijf heeft opgedragen, alsmede het sociaal-fiscaalnummer van de persoon wiens inschakeling in
      de arbeid door dat reïntegratiebedrijf wordt bevorderd. Het reïntegratiebedrijf verwerkt deze gegevens slechts
      voorzover dat noodzakelijk is voor deze werkzaamheden en gebruikt slechts met dat doel het sociaal-fiscaalnummer
      bij die verwerking.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
  - number: '42.4'
    text: |-
      Indien [artikel 72][ref1] van toepassing is overlegt de eigenrisicodrager met het UWV of met een andere
      eigenrisicodrager, indien de verzekerde meer werkgevers heeft gehad die ook eigenrisicodrager zijn, over de
      uitoefening van de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel72
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '72'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '42.5'
    text: |-
      De eigenrisicodrager evalueert periodiek het plan van aanpak dat is opgesteld op grond
      [artikel 25, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: '42.6'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel42
  - number: '43'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen worden de volgende uitsluitingsgronden
      onderscheiden:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: 43.a
    text: 'het recht hebben op een uitkering:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: 43.a.1°
    text: |-
      op grond van [hoofdstuk 6][ref1] of [hoofdstuk 7][ref2] van deze wet; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '7'
  - number: 43.a.2°
    text: |-
      op grond van [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1] als gevolg van de toepassing
      van [artikel 3:6, eerste lid, onderdeel b, onder 2° van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
  - number: 43.b
    text: |-
      het nog niet geëindigd zijn van het tijdvak waarin recht bestaat op loon op grond van
      [artikel 629, elfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] of op bezoldiging op
      grond van [artikel 76a, zesde lid, van de Ziektewet][ref2] of op ziekengeld op grond van
      [artikel 29, negende lid, van de Ziektewet][ref3], tenzij dit loon of deze bezoldiging uitsluitend wordt genoten
      uit hoofde van een andere dienstbetrekking dan de dienstbetrekking, bedoeld in [artikel 23, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel76a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 76a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
  - number: 43.c
    text: |-
      volledige arbeidsongeschiktheid als bedoeld in [artikel 46, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel46
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '46'
        hoofdstuk: '5'
  - number: 43.d
    text: het rechtens zijn vrijheid zijn ontnomen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: 43.e
    text: het niet in Nederland wonen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: 43.f
    text: |-
      het bereiken of bereikt hebben van de eerste dag van de kalendermaand waarin de verzekerde de leeftijd van 65 jaar
      bereikt;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: 43.g
    text: overlijden van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel43
  - number: '44.1'
    text: |-
      [Artikel 43, onderdeel d][ref1], is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: 44.1.a
    text: |-
      de gevallen, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1] en in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '37'
  - number: 44.1.b
    text: |-
      bij algemene maatregel van bestuur aan te wijzen categorieën personen waarbij tenuitvoerlegging van een
      vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een justitiële inrichting.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel44
  - number: '44.2'
    text: |-
      In afwijking van [artikel 49, eerste lid, onderdeel b][ref1], en [56, eerste lid, onderdeel b][ref2], is
      [artikel 43, onderdeel d][ref3], eerst van toepassing met ingang van de dag dat de persoon één maand rechtens zijn
      vrijheid is ontnomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '44.3'
    text: |-
      Voor de toepassing van het tweede lid, worden perioden van vrijheidsontneming samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel44
  - number: '45.1'
    text: |-
      [Artikel 43, onderdeel e][ref1], is niet van toepassing op de verzekerde die woont in een land waarin op grond
      van een verdrag of een besluit van een volkenrechtelijke organisatie recht op een uitkering op grond van deze wet
      kan bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '45.2'
    text: |-
      Onze Minister deelt mee in welke landen op grond van een verdrag of een besluit van een volkenrechtelijke
      organisatie recht op een uitkering op grond van deze wet kan bestaan. In deze mededeling wordt tevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: 45.2.a
    text: de vindplaats van het desbetreffende verdrag of besluit, en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: 45.2.b
    text: de eventueel in dat verdrag of besluit aanwezige beperkingen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: '45.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot [artikel 43, onderdeel e][ref1],
      afwijkende regels worden gesteld ten gunste van:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: 45.3.a
    text: de verzekerde, die werkzaamheden verricht in het algemeen belang en niet in Nederland woont;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: 45.3.b
    text: de verzekerde, die in de Nederlandse Antillen of Aruba woont; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: 45.3.c
    text: de gezinsleden van de in de onderdelen a of b bedoelde verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel45
  - number: '46.1'
    text: |-
      In dit artikel wordt verstaan onder volledige arbeidsongeschiktheid het als rechtstreeks en objectief medisch vast
      te stellen gevolg van ziekte, gebrek, zwangerschap of bevalling slechts in staat zijn om met arbeid ten hoogste 20%
      te verdienen van het maatmaninkomen per uur.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: '46.2'
    text: |-
      [Artikel 43, onderdeel c][ref1], is van toepassing indien er sprake is van volledige arbeidsongeschiktheid:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: 46.2.a
    text: |-
      die bestond op het tijdstip van aanvang van de verzekering of ontstond tijdens een periode waarin de verzekerde op
      grond van [artikel 64 Wet financiering sociale verzekeringen][ref1] een ontheffing van de verplichtingen op grond
      van deze wet had wegens gemoedsbezwaren; of


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: 46.2.b
    text: |-
      die binnen een half jaar na het tijdstip van aanvang van de verzekering of na het tijdstip van eindiging van de
      periode, bedoeld in onderdeel a, is ingetreden, terwijl de gezondheidstoestand van de verzekerde op dat tijdstip
      het intreden van die arbeidsongeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: '46.3'
    text: |-
      Bij de vaststelling van het maatmaninkomen worden buiten aanmerking gelaten verdiensten die meer bedragen dan gelet
      op de gedeeltelijke arbeidsgeschiktheid kan worden verdiend door de verzekerde die:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: 46.3.a
    text: |-
      gedeeltelijk arbeidsgeschikt, doch niet volledig arbeidsongeschikt is op het tijdstip van aanvang van de
      verzekering of op het moment van eindiging van de in het tweede lid, onderdeel a, bedoelde periode; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: 46.3.b
    text: |-
      gedeeltelijk arbeidsgeschikt, doch niet volledig arbeidsongeschikt wordt binnen een half jaar na het tijdstip
      van aanvang van verzekering of na het tijdstip van eindiging van de in het tweede lid, onderdeel a, bedoelde
      periode, terwijl de gezondheidstoestand van de verzekerde op dat tijdstip het intreden van deze gedeeltelijke
      arbeidsgeschiktheid binnen een half jaar kennelijk moest doen verwachten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: '46.4'
    text: |-
      Het tweede lid, onderdeel b, en derde lid, onderdeel b, blijven buiten toepassing ten aanzien van de
      verzekerde, die onmiddellijk voorafgaande aan het tijdstip van aanvang van de verzekering, in verband met
      [artikel 6, eerste lid, onderdeel a of b, van de Ziektewet][ref1] niet verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '6'
  - number: '46.5'
    text: |-
      Indien de bij de aanvang van de verzekering, bedoeld in het tweede en derde lid, aanwezige arbeidsongeschiktheid
      nadien is afgenomen of aanwezige gedeeltelijke arbeidsgeschiktheid nadien is toegenomen, wordt in plaats van de
      aanvang van de verzekering gelezen het tijdstip waarop de arbeidsongeschiktheid is afgenomen respectievelijk de
      gedeeltelijke arbeidsgeschiktheid toenam.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
  - number: '46.6'
    text: |-
      [Artikel 6][ref1] en de daarop berustende bepalingen zijn van overeenkomstige toepassing op dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '47.1'
    text: 'Recht op een arbeidsongeschiktheidsuitkering ontstaat voor de verzekerde die ziek wordt indien:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel47
  - number: 47.1.a
    text: hij de wachttijd heeft doorlopen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel47
  - number: 47.1.b
    text: hij volledig en duurzaam arbeidsongeschikt is; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel47
  - number: 47.1.c
    text: er op hem geen uitsluitingsgrond van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel47
  - number: '47.2'
    text: |-
      Het recht op een arbeidsongeschiktheidsuitkering ontstaat niet eerder dan op de eerste dag na afloop van de
      wachttijd of indien op die dag de uitsluitingsgrond, bedoeld in [artikel 43, onderdeel b][ref1], van toepassing is,
      op de dag dat zich die uitsluitingsgrond niet meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '48.1'
    text: |-
      Indien op de dag, bedoeld in [artikel 47, tweede lid][ref1], geen recht op een arbeidsongeschiktheidsuitkering is
      ontstaan omdat de verzekerde op die dag niet volledig en duurzaam arbeidsongeschikt is, ontstaat alsnog recht op
      die uitkering met ingang van de dag dat hij wel volledig en duurzaam arbeidsongeschikt wordt indien hij op de dag
      hieraan voorafgaand:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel47
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 48.1.a
    text: recht had op een WGA-uitkering;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel48
  - number: 48.1.b
    text: |-
      geen recht had op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt was en de volledige en duurzame
      arbeidsongeschiktheid intreedt binnen vijf jaar na de in [artikel 47, tweede lid][ref1], bedoelde dag en voortkomt
      uit dezelfde oorzaak als op grond waarvan hij gedurende de wachttijd ongeschikt was tot het verrichten van zijn
      arbeid; of


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel47
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 48.1.c
    text: |-
      geen recht had op een WGA-uitkering omdat hij minder dan 35% arbeidsongeschikt was en de volledige en duurzame
      arbeidsongeschiktheid intreedt binnen vier weken na de in [artikel 47, tweede lid][ref1], bedoelde dag en voortkomt
      uit een andere oorzaak als op grond waarvan hij gedurende de wachttijd ongeschikt was tot het verrichten van zijn
      arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel47
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '48.2'
    text: |-
      Indien op de dag, bedoeld in [artikel 47, tweede lid][ref1], geen recht op een arbeidsongeschiktheidsuitkering
      is ontstaan omdat op die dag op de verzekerde een of beide uitsluitingsgronden, bedoeld in
      [artikel 43, onderdeel d of e][ref2], van toepassing waren, ontstaat alsnog recht op die uitkering op de dag dat
      zich geen van deze uitsluitingsgronden meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '49.1'
    text: 'Het recht op een arbeidsongeschiktheidsuitkering eindigt op de dag dat:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel49
  - number: 49.1.a
    text: de persoon die recht heeft op die uitkering niet meer volledig arbeidsongeschikt is; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel49
  - number: 49.1.b
    text: |-
      er op hem een uitsluitingsgrond als bedoeld in [artikel 43, onderdeel d, e, f of g][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '49.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, eindigt het recht op een arbeidsongeschiktheidsuitkering van de
      persoon die aansluitend aan het recht op een arbeidsongeschiktheidsuitkering als gevolg van het feit dat hij niet
      gedeeltelijk arbeidsgeschikt is geen recht krijgt op een WGA-uitkering, na twee maanden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel49
  - number: '50.1'
    text: |-
      Indien op grond van [artikel 49, eerste lid, onderdeel a][ref1], het recht op een arbeidsongeschiktheidsuitkering
      is geëindigd, herleeft het recht op die uitkering op de dag dat de verzekerde weer volledig en duurzaam
      arbeidsongeschikt wordt indien hij op de dag hieraan voorafgaand:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel49
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 50.1.a
    text: recht had op een WGA-uitkering; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel50
  - number: 50.1.b
    text: |-
      geen recht had op een WGA-uitkering en de volledige en duurzame arbeidsongeschiktheid intreedt binnen vijf jaar
      na die dag van eindiging en voortkomt uit dezelfde oorzaak als op grond waarvan hij eerder recht had op een
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel50
  - number: '50.2'
    text: |-
      Indien op grond van [artikel 49, eerste lid, onderdeel b][ref1], het recht op een arbeidsongeschiktheidsuitkering
      is geëindigd omdat op de persoon die recht had op die uitkering een of beide uitsluitingsgronden, bedoeld in
      [artikel 43, onderdeel d of e][ref2], van toepassing waren, herleeft het recht op die uitkering op de dag dat zich
      geen van deze uitsluitingsgronden meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '51'
    text: De arbeidsongeschiktheidsuitkering bedraagt per kalendermaand 70% van het maandloon.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel51
  - number: '52.1'
    text: |-
      Op de arbeidsongeschiktheidsuitkering wordt per kalendermaand 70% van het in die kalendermaand verworven inkomen in
      mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel52
  - number: '52.2'
    text: |-
      Indien de volledig en duurzaam arbeidsongeschikte gedurende een aaneengesloten termijn van twaalf kalendermaanden
      per kalendermaand een inkomen verwerft dat meer bedraagt dan 20% van het maatmaninkomen per kalendermaand, roept
      het UWV de verzekerde op voor een onderzoek naar het voortbestaan van volledige en duurzame arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel52
  - number: '52.3'
    text: |-
      Het tweede lid is niet van toepassing op bij ministeriële regeling te bepalen groepen volledig en duurzaam
      arbeidsongeschikten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel52
  - number: '52.4'
    text: In dit artikel wordt onder inkomen verstaan het inkomen uit arbeid in het bedrijfs- en beroepsleven.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel52
  - number: '52.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere en zonodig afwijkende regels gesteld met betrekking tot het
      inkomen, bedoeld in dit artikel. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot de
      vaststelling van dat inkomen alsmede van de periode waarop die vaststelling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel52
  - number: '53'
    text: |-
      Indien de verzekerde verkeert in een blijvende of voorlopig blijvende toestand van hulpbehoevendheid die
      geregeld oppassing en verzorging nodig maakt, wordt de arbeidsongeschiktheidsuitkering voor de duur van die
      hulpbehoevendheid verhoogd door vermenigvuldiging met ten hoogste een factor 100/70. De eerste zin vindt geen
      toepassing, indien de verzekerde in een inrichting is opgenomen en de kosten van verblijf ten laste van een
      zorgverzekering of een verzekering inzake ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel53
  - number: '54.1'
    text: 'Recht op een WGA-uitkering ontstaat voor de verzekerde die ziek wordt indien:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
  - number: 54.1.a
    text: hij de wachttijd heeft doorlopen;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
  - number: 54.1.b
    text: hij gedeeltelijk arbeidsgeschikt is; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
  - number: 54.1.c
    text: er op hem geen uitsluitingsgrond van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
  - number: '54.2'
    text: |-
      Het recht op een WGA-uitkering ontstaat niet eerder dan op de eerste dag na afloop van de wachttijd of indien op
      die dag de uitsluitingsgrond, bedoeld in [artikel 43, onderdeel b][ref1], van toepassing is, op de dag dat zich die
      uitsluitingsgrond niet meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '54.3'
    text: |-
      De WGA-uitkering bestaat voor de verzekerde die voldoet aan de referte-eis, bedoeld in [artikel 58][ref1] uit een
      loongerelateerde uitkering en na afloop hiervan uit een loonaanvullingsuitkering of een vervolguitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel58
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '54.4'
    text: |-
      De WGA-uitkering bestaat voor de verzekerde die niet voldoet aan de referte-eis, bedoeld in [artikel 58][ref1] uit
      een loonaanvullingsuitkering of een vervolguitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel58
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '55.1'
    text: |-
      Indien op de dag, bedoeld in [artikel 54, tweede lid][ref1], geen recht op een WGA-uitkering is ontstaan omdat de
      verzekerde op die dag niet gedeeltelijk arbeidsgeschikt is, ontstaat alsnog recht op die uitkering met ingang van
      de dag dat hij wel gedeeltelijk arbeidsgeschikt wordt indien hij op de dag hieraan voorafgaand:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel54
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 55.1.a
    text: recht had op een arbeidsongeschiktheidsuitkering;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
  - number: 55.1.b
    text: |-
      minder dan 35% arbeidsongeschikt was en de gedeeltelijke arbeidsgeschiktheid voortkomt uit dezelfde oorzaak als die
      op grond waarvan hij gedurende de wachttijd ongeschikt was tot het verrichten van zijn arbeid; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
  - number: 55.1.c
    text: |-
      minder dan 35% arbeidsongeschikt was en de gedeeltelijke arbeidsgeschiktheid voortkomt uit een andere oorzaak als
      die op grond waarvan hij gedurende de wachttijd ongeschikt was tot het verrichten van zijn arbeid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
  - number: '55.2'
    text: |-
      Indien op de dag, bedoeld in [artikel 54, tweede lid][ref1], geen recht op een WGA-uitkering is ontstaan omdat
      op die dag op de verzekerde een of beide uitsluitingsgronden als bedoeld in [artikel 43, onderdeel d of e][ref2],
      van toepassing waren, ontstaat alsnog recht op deze uitkering op de dag dat zich geen van deze uitsluitingsgronden
      meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '55.3'
    text: |-
      Het recht op een WGA-uitkering kan in de situatie, bedoeld in het eerste lid, onderdeel b, en het tweede lid niet
      later ingaan dan vijf jaar na de dag, bedoeld in [artikel 54, tweede lid][ref1], en in de situatie, bedoeld in het
      eerste lid, onderdeel c, niet later dan vier weken na de dag, bedoeld in [artikel 54, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel54
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '56.1'
    text: 'Het recht op een WGA-uitkering eindigt op de dag dat:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel56
  - number: 56.1.a
    text: de verzekerde niet meer gedeeltelijk arbeidsgeschikt is; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel56
  - number: 56.1.b
    text: |-
      er op hem een uitsluitingsgrond als bedoeld in [artikel 43, onderdeel a, onder 2°, d, e, f of g][ref1] van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '56.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, eindigt het recht op een WGA-uitkering van de verzekerde wiens mate
      van arbeidsongeschiktheid lager is dan 35%, twee maanden na de dag dat hij niet langer gedeeltelijk arbeidsgeschikt
      is, doch niet eerder dan op de dag dat de loongerelateerde uitkering van de WGA-uitkering eindigt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel56
  - number: '56.3'
    text: |-
      In afwijking van het tweede lid, eindigt het recht op een WGA-uitkering van de verzekerde wiens mate van
      arbeidsongeschiktheid lager is dan 35%, omdat hij met arbeid meer verdient dan 65% van het maatmaninkomen per uur,
      één jaar na de dag waarop hij niet langer gedeeltelijk arbeidsgeschikt is, doch niet eerder dan op de dag dat de
      loongerelateerde uitkering van de WGA-uitkering eindigt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel56
  - number: '57.1'
    text: |-
      Indien op grond van [artikel 56, eerste lid, onderdeel a, tweede of derde lid][ref1] het recht op een WGA-uitkering
      is geëindigd, herleeft het recht op die uitkering op de dag dat de verzekerde weer gedeeltelijk arbeidsgeschikt
      wordt indien hij op de dag hieraan voorafgaand:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel56
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 57.1.a
    text: recht had op een arbeidsongeschiktheidsuitkering; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel57
  - number: 57.1.b
    text: |-
      een mate van arbeidsongeschiktheid had van minder dan 35% en de gedeeltelijke arbeidsgeschiktheid voortkomt uit
      dezelfde oorzaak op grond waarvan hij eerder recht had op een WGA-uitkering.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel57
  - number: '57.2'
    text: |-
      Indien op grond van [artikel 56, eerste lid, onderdeel b][ref1], geen recht op een WGA-uitkering meer
      bestaat omdat op de persoon die recht had op die uitkering een of meer uitsluitingsgronden als bedoeld in
      [artikel 43, onderdeel a, onder 2°, d of e][ref2], van toepassing waren, herleeft het recht op die uitkering op de
      dag dat zich geen van deze uitsluitingsgronden meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '57.3'
    text: |-
      Het recht op een WGA-uitkering kan in de situatie, bedoeld in het eerste lid, onderdeel b, en het tweede lid, niet
      later herleven dan vijf jaar na de dag, bedoeld in [artikel 56][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel56
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '56'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '58.1'
    text: 'De verzekerde voldoet aan de referte-eis indien hij:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: 58.1.a
    text: |-
      in 36 weken onmiddellijk voorafgaande aan de eerste dag na de dag waarop het recht op loon op grond
      van [artikel 629 van Boek 7 van het van het Burgerlijk Wetboek][ref1] of bezoldiging op grond van
      [hoofdstuk IV, vierde afdeling, van de Ziektewet][ref2] of het recht op ziekengeld op grond van
      [artikel 29 van de Ziektewet][ref3] is geëindigd, in ten minste 26 weken als verzekerde arbeid heeft verricht: of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0001888#AfdelingVierde
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0001888
        afdeling: Vierde
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '29'
  - number: 58.1.b
    text: |-
      onmiddellijk voorafgaande aan de eerste dag van de wachttijd recht heeft op een uitkering op grond van de
      [Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '58.2'
    text: |-
      Voor de vaststelling van het aantal van 36 weken als bedoeld in het eerste lid, onderdeel a worden niet in
      aanmerking genomen weken gedurende welke de verzekerde:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: 58.2.a
    text: wegens ziekte of arbeidsongeschiktheid geen arbeid kon verrichten;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: 58.2.b
    text: |-
      werkzaamheden heeft verricht uit hoofde waarvan hij op grond van de [Werkloosheidswet][ref1] niet als werknemer
      wordt beschouwd als bedoeld in [artikel 8 van die wet][ref2] en hij op grond van dat artikel de hoedanigheid van
      werknemer heeft herkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '8'
  - number: 58.2.c
    text: wegens het genieten van onbetaald verlof geen arbeid heeft verricht, tot een maximum van achttien maanden; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: 58.2.d
    text: |-
      geen arbeid heeft verricht maar wel recht op uitkering heeft op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0013008
        paragraaf: '1'
  - number: '58.3'
    text: |-
      Bij algemene maatregel van bestuur kan voor bepaalde groepen werknemers het in het eerste lid bedoelde aantal van
      36 weken hoger worden vastgesteld en het in dat lid bedoelde aantal van 26 weken lager worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: '58.4'
    text: |-
      Bij ministeriële regeling worden regels worden gesteld met betrekking tot de berekening van het aantal van 26
      weken, bedoeld in het eerste lid, onderdeel a. Deze regels hebben betrekking op de gelijkstelling van weken waarin
      geen arbeid is verricht met weken waarin hij als verzekerde arbeid heeft verricht.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel58
  - number: '59.1'
    text: |-
      De duur van de loongerelateerde uitkering van de WGA-uitkering is bij een arbeidsverleden van: minder dan 5 jaar
      zes maanden en bij een arbeidsverleden van ten minste:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.a
    text: 5 jaren, negen maanden;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.b
    text: 10 jaren, een jaar;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.c
    text: 15 jaren, anderhalf jaar;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.d
    text: 20 jaren, twee jaar;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.e
    text: 25 jaren, tweeënhalf jaar;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.f
    text: 30 jaren, drie jaar;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.g
    text: 35 jaren, vier jaar; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: 59.1.h
    text: 40 jaren, vijf jaar.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: '59.2'
    text: |-
      De duur van de loongerelateerde uitkering, bedoeld in het eerste lid, wordt indien de verzekerde onmiddellijk
      voorafgaand aan deze loongerelateerde uitkering recht had op een arbeidsongeschiktheidsuitkering, verminderd met de
      duur van de ontvangen arbeidsongeschiktheidsuitkering, doch bedraagt ten minste een jaar.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
  - number: '59.3'
    text: |-
      De duur van de loongerelateerde uitkering, bedoeld in het eerste lid, wordt indien de verzekerde onmiddellijk
      voorafgaand aan de eerste dag van de wachttijd uitsluitend verzekerd was als gevolg van het ontvangen van een
      uitkering op grond van de verplichte verzekering op grond van de [Werkloosheidswet][ref1], verminderd met de duur
      van de ontvangen loongerelateerde uitkering op grond van de [Werkloosheidswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
  - number: '59.4'
    text: |-
      De duur van de loongerelateerde uitkering, bedoeld in het eerste lid, wordt verlengd indien als gevolg van de
      uitsluitingsgrond, bedoeld in [artikel 43, onderdeel a, onder 1°][ref1], geen recht op een uitkering is ontstaan
      indien de eerste dag van de wachttijd van dit niet ontstane recht op een uitkering is gelegen voor de dag dat recht
      op de loongerelateerde uitkering is ontstaan en dit niet ontstane recht op een uitkering tot een langere duur van
      de loongerelateerde uitkering zou hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '60.1'
    text: |-
      Indien de duur van de loongerelateerde uitkering van de WGA-uitkering is verstreken of als gevolg van
      [artikel 54, vierde lid][ref1], geen aanspraak heeft bestaan op deze uitkering, bestaat de WGA-uitkering uit:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel54
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 60.1.a
    text: |-
      een loonaanvullingsuitkering voor de verzekerde die per kalendermaand een inkomen uit arbeid in het bedrijfs- en
      beroepsleven verdient dat ten minste gelijk is aan de inkomenseis, bedoeld in het tweede lid of voor wie op grond
      van het derde lid geen inkomenseis geldt; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
  - number: 60.1.b
    text: een vervolguitkering.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
  - number: '60.2'
    text: |-
      De inkomenseis wordt vastgesteld op de dag dat recht ontstaat op een WGA-uitkering en is voor de verzekerde
      die in staat is met arbeid meer dan 20% te verdienen van het maatmaninkomen per uur, gelijk aan 50% van de
      resterende verdiencapaciteit. De inkomenseis wordt herzien nadat een wijziging in de resterende verdiencapaciteit
      twee kalendermaanden heeft voortgeduurd. De inkomenseis geldt niet meer nadat de verzekerde ten minste twee
      kalendermaanden slechts in staat is geweest om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen per
      uur.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
  - number: '60.3'
    text: |-
      Voor de verzekerde die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen
      per uur geldt geen inkomenseis tot de dag dat zijn resterende verdiencapaciteit 24 kalendermaanden lang hoger is
      geweest dan 20% van zijn maatmaninkomen per uur.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
  - number: '60.4'
    text: |-
      Onder resterende verdiencapaciteit als bedoeld in het tweede en derde lid wordt verstaan: de op maandbasis
      berekende respectievelijk op uurbasis berekende resterende verdiencapaciteit zoals vastgesteld op grond van
      [artikel 6][ref1] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '60.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld ter bepaling van het inkomen uit arbeid, bedoeld in
      het eerste lid, onderdeel a. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot de vaststelling
      van dat inkomen alsmede van de periode waarop die vaststelling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel60
  - number: '61.1'
    text: |-
      De loongerelateerde uitkering van de WGA-uitkering bedraagt per kalendermaand: 0,7 × (C–D) waarbij: C staat voor
      het maandloon; en D staat voor het in de betreffende kalendermaand verworven inkomen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de loonaanvullingsuitkering van de WGA-uitkering indien de
      verzekerde ten minste zijn overblijvende verdiencapaciteit als bedoeld in het derde lid benut of indien voor hem
      geen inkomenseis als bedoeld in [artikel 60][ref1] geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '61.3'
    text: |-
      De overblijvende verdiencapaciteit, bedoeld in het twee lid, is gelijk aan twee maal de inkomenseis, bedoeld in
      [artikel 60, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '61.4'
    text: |-
      De loonaanvullingsuitkering van de WGA-uitkering bedraagt voor de verzekerde die ten minste 50% van doch minder dan
      zijn overblijvende verdiencapaciteit benut, per kalendermaand: 0,7 × (E–F) waarbij: - E staat voor het maandloon;
      en
        - F staat voor de overblijvende verdiencapaciteit.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.5'
    text: |-
      Indien de hoogte van de uitkering, bedoeld in het vierde lid, per kalendermaand minder bedraagt dan G × H waarbij:
        - G staat voor het uitkeringspercentage, bedoeld in het zesde lid; en
        - H staat voor het minimumloon per maand of het maandloon in het geval het minimumloon per maand hoger is dan het
      maandloon, wordt de hoogte van de uitkering, bedoeld in het vierde lid, vastgesteld op G × H, doch ten hoogste op
      0,7 × (C–D), als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.6'
    text: 'Het uitkeringspercentage, bedoeld in het vijfde lid, bedraagt bij een arbeidsongeschiktheid van:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.a
    text: 0–35%, 0%
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.b
    text: 35–45%, 28%;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.c
    text: 45–55%, 35%;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.d
    text: 55–65%, 42%;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.e
    text: 65–80%, 50,75%; en bij
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: 61.6.f
    text: 80% of meer, 70%.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.7'
    text: |-
      De hoogte van de uitkering, bedoeld in het vijfde lid, wordt eerst nadat een wijziging in de mate van
      arbeidsongeschiktheid ten minste twee kalendermaanden heeft voortgeduurd, herzien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.8'
    text: Onder inkomen als bedoeld in het eerste lid wordt verstaan het inkomen uit arbeid in het bedrijfs- en beroepsleven.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '61.9'
    text: |-
      Bij algemene maatregel van bestuur worden nadere en zonodig afwijkende regels gesteld met betrekking tot het
      inkomen, bedoeld in het achtste lid. Daarbij kunnen tevens nadere regels worden gesteld met betrekking tot de
      vaststelling van dat inkomen alsmede van de periode waarop die vaststelling betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel61
  - number: '62.1'
    text: |-
      De vervolguitkering van de WGA-uitkering bedraagt per kalendermaand: G × H waarbij: - G staat voor het
      uitkeringspercentage, bedoeld in [artikel 61, zesde lid][ref1]; en
        - H staat voor het minimumloon per maand of het maandloon in het geval het minimumloon per maand hoger is dan het
      maandloon.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel61
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '62.2'
    text: |-
      [Artikel 61, zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel61
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '62.3'
    text: 'De hoogte van de vervolguitkering wordt voor de verzekerde:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel62
  - number: 62.3.a
    text: die na het ontstaan van recht op uitkering op grond van dit hoofdstuk ziek is geworden, en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel62
  - number: 62.3.b
    text: |-
      voor wie als gevolg van de toepassing van [artikel 43, onderdeel a, onder 1°][ref1], geen tweede recht op een
      uitkering op grond van dit hoofdstuk ontstaat omdat de eerste dag van de wachttijd is gelegen op een dag dat al
      recht op een uitkering op grond van dit hoofdstuk bestaat of indien op die eerste dag het recht op een dergelijke
      uitkering herleeft;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '63'
    text: |-
      Indien de verzekerde, die slechts in staat is om met arbeid ten hoogste 20% te verdienen van het maatmaninkomen
      per uur, verkeert in een blijvende of voorlopig blijvende toestand van hulpbehoevendheid welke geregeld
      oppassing en verzorging nodig maakt, wordt de WGA-uitkering voor de duur van die hulpbehoevendheid verhoogd door
      vermenigvuldiging met ten hoogste de factor 100/70. De eerste zin vindt geen toepassing, indien de verzekerde in
      een inrichting is opgenomen en de kosten van verblijf ten laste van een zorgverzekering of een verzekering inzake
      ziektekosten komen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel63
  - number: '64.1'
    text: |-
      Het UWV stelt op aanvraag vast of recht op een uitkering op grond van [artikel 47][ref1] of [artikel 54][ref2]
      ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel54
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '47'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '54'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '64.2'
    text: |-
      Het UWV stelt de verzekerde van de mogelijkheid van het doen van een aanvraag schriftelijk in kennis uiterlijk
      20 maanden na aanvang van de wachttijd. Indien [artikel 24, derde lid][ref1], van toepassing is doet het UWV deze
      kennisgeving bij de bekendmaking van de in dat artikellid bedoelde beschikking. Het UWV verstrekt aan de werkgever
      een afschrift van de kennisgeving bedoeld in de eerste en tweede zin.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '64.3'
    text: |-
      De verzekerde doet zijn aanvraag uiterlijk dertien weken voor afloop van de wachttijd of indien toepassing is
      gegeven aan [artikel 24, derde lid][ref1], dertien weken voor afloop van het in dat lid bedoelde verlengde tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '64.4'
    text: |-
      Indien het UWV de in het eerste lid bedoelde aanvraag afwijst omdat een uitsluitingsgrond als bedoeld in
      [artikel 43, onderdeel d of e][ref1], van toepassing is maakt het UWV melding van de mogelijkheid tot het doen van
      een nieuwe aanvraag alsmede van de termijn waarbinnen een nieuwe aanvraag dient te worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '64.5'
    text: |-
      Indien het vierde lid van toepassing is doet de verzekerde zijn nieuwe aanvraag binnen de op grond van dat lid door
      het UWV aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: '64.6'
    text: |-
      Een aanvraag wordt geacht tijdig te zijn ingediend indien het UWV de kennisgeving als bedoeld in het tweede
      lid niet heeft gedaan dan wel indien bij een latere kennisgeving dan bedoeld in het tweede lid of vierde lid de
      aanvraag wordt ingediend binnen vier weken nadat deze kennisgeving is ontvangen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: '64.7'
    text: |-
      Indien het UWV toepassing geeft aan [artikel 25, negende lid][ref1], of [artikel 26, derde lid][ref2], tweede zin,
      wordt de behandeling van de aanvraag opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel26
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '26'
        hoofdstuk: '3'
  - number: '64.8'
    text: 'Het UWV hervat de behandeling van de aanvraag in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: 64.8.a
    text: |-
      indien het UWV heeft vastgesteld dat de tekortkoming, bedoeld in [artikel 25, negende lid][ref1], of
      [artikel 26, derde lid][ref2], is hersteld;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel26
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '26'
        hoofdstuk: '3'
  - number: 64.8.b
    text: op verzoek van de werknemer in verband met de beëindiging van zijn dienstbetrekking; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: 64.8.c
    text: |-
      tenminste zes weken voordat het tijdvak, bedoeld in [artikel 25, negende lid][ref1], of
      [artikel 26, derde lid][ref2], van 52 weken is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel26
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '26'
        hoofdstuk: '3'
  - number: '64.9'
    text: |-
      [Artikel 25, vijftiende lid][ref1], is van overeenkomstige toepassing op de situatie, bedoeld in het achtste lid,
      onderdelen b en c.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: '64.10'
    text: |-
      Indien de toepassing van het eerste lid zou leiden tot kennelijke hardheid, is het UWV bevoegd het recht op een
      uitkering op grond van deze wet ambtshalve vast te stellen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: '64.11'
    text: |-
      Het recht op een uitkering op grond van deze wet kan niet worden vastgesteld over perioden gelegen voor 52 weken
      voorafgaand aan de dag waarop de aanvraag om een uitkering werd ingediend. Het UWV kan voor bijzondere gevallen van
      de eerste zin afwijken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: '64.12'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de gegevens die door de verzekerde bij de
      aanvraag worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel64
  - number: '65'
    text: |-
      De aanvraag voor een uitkering op grond van deze wet gaat vergezeld van een reïntegratieverslag als bedoeld in
      [artikel 25, derde lid][ref1]. De eerste zin is niet van toepassing voorzover [artikel 26, eerste lid][ref2],
      toepassing vindt. Het UWV beoordeelt of de werkgever en de verzekerde dan wel de eigenrisicodrager,
      bedoeld in [artikel 1, eerste lid, onderdeel h, van de Ziektewet][ref3] en de personen, bedoeld in
      [artikel 29, tweede lid, onderdelen a, b en c, van die wet][ref4], die laatstelijk tot hem in dienstbetrekking
      stonden in redelijkheid hebben kunnen komen tot de reïntegratie-inspanningen, die zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001888#Artikel29
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '26'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0001888
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0001888
        artikel: '29'
  - number: '66.1'
    text: |-
      Een aanvraag voor een verkorte wachttijd als bedoeld in [artikel 23, zesde lid][ref1], wordt tevens aangemerkt als
      aanvraag, bedoeld in [artikel 64, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '66.2'
    text: Een aanvraag voor een verkorte wachttijd kan slechts eenmaal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
  - number: '66.3'
    text: |-
      Op verzoek van de werknemer verstrekt de persoon, bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1], die belast is met de bijstand, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van die wet][ref2], een verklaring waaruit de medische situatie alsmede
      de vooruitzichten van de werknemer blijken. De verklaring wordt mede opgesteld op basis van gegevens inzake de
      medische specialistische onderzoeken of behandelingen die de aanvrager heeft ondergaan, tenzij in redelijkheid niet
      van de bedrijfsarts kan worden gevergd dat hij deze gegevens aan zijn verklaring ten grondslag legt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '66.4'
    text: Een aanvraag voor een verkorte wachttijd gaat vergezeld van de verklaring, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
  - number: '66.5'
    text: |-
      Indien de aanvraag voor een verkorte wachttijd niet vergezeld gaat van een verklaring als bedoeld in het derde lid,
      wordt de aanvraag niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
  - number: '66.6'
    text: |-
      [Artikel 65][ref1] is niet van toepassing op een aanvraag voor een verkorte wachttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel65
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '67.1'
    text: |-
      Het UWV betaalt de uitkering waarop op grond van deze wet recht bestaat. De betaling geschiedt in termijnen van
      een kalendermaand.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '67.2'
    text: |-
      Het UWV kan een uitkering over een door hem te bepalen tijdvak als voorschot betaalbaar stellen, indien onzekerheid
      bestaat over het recht op of de hoogte van die uitkering of de hoogte van het te betalen bedrag aan uitkering. Een
      verleend voorschot wordt verrekend met het definitief vastgestelde bedrag aan uitkering dat over het desbetreffende
      tijdvak wordt betaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '67.3'
    text: |-
      Onverminderd het tweede lid, schort het UWV de betaling van de uitkering op of schorst het de betaling, indien het
      op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoeden heeft dat:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: 67.3.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: 67.3.b
    text: recht op een lagere uitkering bestaat;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: 67.3.c
    text: |-
      de persoon, die recht heeft op een uitkering of zijn wettelijke vertegenwoordiger een verplichting als bedoeld in
      [artikel 27][ref1], [28][ref2], [29][ref3] of [30][ref4] of een instelling als bedoeld in [artikel 71][ref5] een
      verplichting als bedoeld in [artikel 27][ref6], niet of niet behoorlijk is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel30
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel71
      [ref6]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '71'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref6
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '67.4'
    text: |-
      In geval de uitkering, bedoeld in het eerste lid, in het buitenland wordt uitbetaald worden de daaraan verbonden
      kosten van overmaking op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '67.5'
    text: |-
      Wanneer de persoon, die recht heeft op een uitkering op grond van deze wet, een ander machtigt om de uitkering in
      ontvangst te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van
      een betalingstermijn, aanvangende na de dag waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening
      onderscheidenlijk intrekking van die machtiging.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '67.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake de betaalbaarstelling van de uitkeringen op grond van
      deze wet door organen die belast zijn met de uitbetaling van invaliditeitsuitkering of pensioen uit andere hoofde
      dan op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '67.7'
    text: |-
      Het UWV kan onder door hem te stellen voorwaarden, op verzoek van de in het zesde lid bedoelde organen,
      gelijktijdig met een uitkering op grond van deze wet, invaliditeitsuitkeringen of pensioenen verschuldigd door die
      organen, betaalbaar stellen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel67
  - number: '68.1'
    text: |-
      In afwijking van [artikel 67, eerste lid][ref1], betaalt het UWV een gedeelte van de uitkering waarop op grond
      van deze wet recht bestaat als vakantiebijslag jaarlijks in de maand mei over de aan die maand voorafgaande twaalf
      kalendermaanden, of, indien het recht op uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende
      kalendermaand. De vakantiebijslag bedraagt 8/108 van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel67
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '68.2'
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, wijzigt de in
      het eerste lid genoemde breuk dienovereenkomstig. Het gewijzigde percentage wordt in aanmerking genomen over de
      uitkering waarop op grond van deze wet recht bestaat vanaf de dag waarop de wijziging ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '68.3'
    text: |-
      Op de toekenning van vakantiebijslag zijn de [artikelen 3:41][ref1] en
      [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '68.4'
    text: Bij ministeriële regeling kunnen met betrekking tot het eerste lid nadere of afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel68
  - number: '69.1'
    text: |-
      Het UWV schort de betaling van een uitkering op grond van deze wet op indien de persoon die recht heeft
      op die uitkering een vreemdeling is die niet rechtmatig in Nederland verblijf houdt als bedoeld in
      [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '69.2'
    text: |-
      De betaling van de uitkering op grond van deze wet wordt hervat indien de betrokkene daartoe een aanvraag indient
      en het UWV is gebleken dat hij feitelijk buiten Nederland woont of verblijf houdt en aan de overige voorwaarden
      voor het recht op uitkering voldoet.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel69
  - number: '70'
    text: |-
      Voorzover het betreft het in ontvangst nemen van een uitkering op grond van deze wet en het verlenen van kwijting
      voor de betaling daarvan, wordt een minderjarige met een meerderjarige gelijkgesteld. Indien de wettelijke
      vertegenwoordiger zich tegen de betaling aan de minderjarige schriftelijk verzet bij het UWV geschiedt de
      uitbetaling aan de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel70
  - number: '71.1'
    text: |-
      Indien de persoon aan wie een uitkering op grond van deze wet is toegekend, aanspraak heeft op verstrekking of
      vergoeding van zorg als bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] en op grond van die wet een
      bijdrage voor die zorg verschuldigd is, is het UWV bevoegd de uitkering tot het bedrag van die bijdrage in plaats
      van aan degene aan wie de uitkering is toegekend, zonder diens machtiging uit te betalen aan het College voor
      zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '71.2'
    text: |-
      Indien de persoon die recht heeft op een uitkering op grond van deze wet in een inrichting ter verpleging van
      geesteszieken of van zwakzinnigen is opgenomen en het UWV, van de desbetreffende inrichting of van het college
      van burgemeester en wethouders van de gemeente die de opnamekosten betaalt, het verzoek ontvangt om de uitkering
      aan die inrichting of die gemeente uit te betalen, is het UWV bevoegd dat verzoek zonder het stellen van andere
      voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel71
  - number: '71.3'
    text: |-
      Indien het eerste lid toepassing vindt, heeft de in het tweede lid bedoelde bevoegdheid betrekking op het gedeelte
      van de uitkering op grond van deze wet, dat niet aan het College voor zorgverzekeringen wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel71
  - number: '71.4'
    text: |-
      Op de herziening van een beschikking op grond van het eerste lid als gevolg van een wijziging van de verschuldigde
      bijdrage zijn de [artikelen 3:41][ref1] en [3:45 van de Algemene wet bestuursrecht][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '72.1'
    text: |-
      Indien de persoon die recht heeft op een uitkering op grond van deze wet bij aanvang van de wachttijd meer dan een
      werkgever heeft, wordt de uitkering betaald door het UWV, ook indien een of meer werkgevers eigenrisicodrager zijn.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel72
  - number: '72.2'
    text: |-
      In de situatie, bedoeld in het eerste lid, verhaalt het UWV op de eigenrisicodrager, naar rato van de loonsom
      de door hem verschuldigde uitkering op grond van deze wet, alsmede de op grond van enige wet over deze uitkering
      verschuldigde premies die niet op deze uitkering in mindering kunnen worden gebracht en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref1], over deze uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '72.3'
    text: |-
      De uitkering op grond van deze wet wordt niet verhaald op de eigenrisicodrager, indien de persoon die recht heeft
      op die uitkering met behoud van hetzelfde loon bij die werkgever arbeid is blijven verrichten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel72
  - number: '73.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van een
      uitkering op grond van deze wet met een uitkering in verband met volledig en duurzame arbeidsongeschiktheid of
      gedeeltelijke arbeidsgeschiktheid op grond van andere wetten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel73
  - number: '73.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ter voorkoming of beperking van samenloop van
      uitkering op grond van deze wet met uitkering op grond van de sociale wetgeving van de Nederlandse Antillen, Aruba
      of van een andere Mogendheid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel73
  - number: '74.1'
    text: |-
      Na het overlijden van de persoon, die recht had op een uitkering op grond van deze wet, wordt met ingang van de dag
      na het overlijden een overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: 74.1.a
    text: aan de langstlevende van de echtgenoten;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: 74.1.b
    text: |-
      bij ontstentenis van de in onderdeel a bedoelde persoon, aan de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: 74.1.c
    text: |-
      bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan de persoon ten aanzien van wie de overledene
      grotendeels in de kosten van het bestaan voorzag en met wie hij in gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: '74.2'
    text: |-
      Met de persoon die recht had op een uitkering op grond van deze wet, wordt voor de toepassing van dit artikel
      gelijkgesteld, de persoon wiens overlijden heeft plaats gevonden in de kalendermaand waarin hij de leeftijd van 65
      jaar zou hebben bereikt doch voor het bereiken van deze leeftijd is overleden, en die uitsluitend als gevolg van
      [artikel 43, onderdeel f][ref1], over de dag van zijn overlijden geen recht op een uitkering had.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '74.3'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering op grond van deze wet over één kalendermaand,
      berekend naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van de persoon.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: '74.4'
    text: |-
      In verband met het overlijden van de persoon die recht had op een uitkering op grond van deze wet, is
      [artikel 43, onderdeel f][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel43
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '43'
        hoofdstuk: '5'
  - number: '74.5'
    text: |-
      De overlijdensuitkering wordt op verzoek aan de rechthebbende of rechthebbenden genoemd in het eerste lid door het
      UWV uitbetaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: '74.6'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: '74.7'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan uitkering op grond van deze wet dat,
      over na het overlijden gelegen dagen reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel74
  - number: '75'
    text: |-
      Uitkeringen op grond van deze wet die niet in ontvangst zijn genomen of zijn ingevorderd binnen twee jaar na de dag
      van betaalbaarstelling worden door het UWV niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel75
  - number: '76.1'
    text: 'Het UWV herziet beschikkingen op grond van deze wet of trekt dergelijke beschikkingen in, indien:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
  - number: 76.1.a
    text: |-
      als gevolg van het niet of niet volledig nakomen van de [artikelen 27 tot en met 32][ref1] en de daarop berustende
      bepalingen het recht op een uitkering op grond van deze wet niet of niet meer kan worden vastgesteld of ten
      onrechte is vastgesteld of de hoogte van de uitkering ten onrechte op een te hoog bedrag is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 76.1.b
    text: |-
      de verstrekking van een voorziening als bedoeld in [artikel 34, tweede lid][ref1], of [35][ref2] ten onrechte of
      tot een te hoog bedrag is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 76.1.c
    text: anderszins de uitkering ten onrechte of tot een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
  - number: '76.2'
    text: |-
      Indien een voorziening als bedoeld in [artikel 34, tweede lid][ref1], of [36][ref2] in
      de vorm van een subsidie wordt verstrekt, wijzigt of trekt het UWV de beschikking tot
      vaststelling van de subsidie in, indien sprake is van een omstandigheid als bedoeld in
      [artikel 4:49, eerste lid, onderdeel a, b of c, van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '76.3'
    text: Indien daarvoor dringende redenen zijn, kan het UWV geheel of gedeeltelijk van herziening of intrekking afzien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel76
  - number: '77.1'
    text: |-
      Een uitkering die op grond van deze wet onverschuldigd is betaald en hetgeen als gevolg van een beschikking
      als bedoeld in [artikel 76][ref1] door het UWV onverschuldigd is betaald of verstrekt wordt door het UWV
      teruggevorderd. Ook een uitkering die op grond van [artikel 67, tweede lid][ref2], als voorschot onverschuldigd
      betaalbaar is gesteld wordt door het UWV teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel67
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '76'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '77.2'
    text: |-
      In afwijking van het eerste lid kan het UWV besluiten van terugvordering of van verdere terugvordering af te zien,
      indien degene van wie wordt teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: 77.2.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: 77.2.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: 77.2.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: 77.2.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: '77.3'
    text: 'De in het tweede lid, onderdelen a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: 77.3.a
    text: |-
      het gemiddeld inkomen van degene van wie wordt teruggevorderd in die periode de beslagvrije voet, bedoeld in de
      [artikelen 475c][ref1] en [475d van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: 77.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '77.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van terugvordering af
      te zien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: '77.5'
    text: |-
      De beschikking tot terugvordering vermeldt hetgeen wordt teruggevorderd, de termijn of termijnen waarbinnen moet
      worden betaald, alsmede dat de beschikking bij gebreke van tijdige betaling zal worden tenuitvoergelegd op de wijze
      als omschreven in [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel77
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '77.6'
    text: |-
      Degene van wie wordt teruggevorderd is verplicht desgevraagd aan het UWV de inlichtingen te verstrekken die voor de
      terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: '77.7'
    text: |-
      In afwijking van het eerste lid kan het UWV, onder bij ministeriële regeling te stellen voorwaarden, besluiten van
      terugvordering af te zien indien het terug te vorderen bedrag een bij ministeriële regeling vast te stellen bedrag
      niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel77
  - number: '78.1'
    text: |-
      De beschikking tot terugvordering levert een executoriale titel op in de zin van
      [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '78.2'
    text: |-
      [Artikel 96][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het gemiddeld
      inkomen van de persoon gedurende drie jaar de beslagvrije voet, bedoeld in de [artikelen 475c][ref2] en
      [475d van het Wetboek van Burgerlijke Rechtsvordering][ref3] niet te boven is gegaan, het UWV de aflossingsbedragen
      lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '96'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '79'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de
      [artikelen 77, eerste, tweede, derde, vierde, vijfde en zesde lid][ref1], en [78][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel78
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '77'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '78'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '80.1'
    text: |-
      Een uitkering op grond van deze wet en een voorziening als bedoeld in [artikel 34, tweede lid][ref1], of
      [artikel 35][ref2] zijn onvervreemdbaar en niet vatbaar voor verpanding of belening.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '80.2'
    text: |-
      Volmacht tot ontvangst van een uitkering op grond van deze wet onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel80
  - number: '80.3'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel80
  - number: '81'
    text: |-
      De voorzieningen, bedoeld in de [artikelen 34, tweede lid][ref1], en [35][ref2], de verhoging, bedoeld in de
      [artikelen 53][ref3] en [63][ref4], alsmede de overlijdensuitkering, bedoeld in [artikel 74][ref5], zijn niet
      vatbaar voor beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel74
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '63'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '82.1'
    text: 'De eigenrisicodrager draagt gedurende:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: 82.1.a
    text: de periode van vier jaar nadat het recht op een arbeidsongeschiktheidsuitkering is ontstaan; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: 82.1.b
    text: |-
      een bij ministeriële regeling te bepalen periode nadat het recht op een WGA-uitkering is ontstaan, het risico
      van de betaling van die uitkering aan de verzekerde die op de eerste dag van de bij die uitkering in acht genomen
      wachttijd tot de eigenrisicodrager in dienstbetrekking stond.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: '82.2'
    text: |-
      Indien met betrekking tot een verzekerde ten laste van één eigenrisicodrager verschillende uitkeringen op grond van
      deze wet elkaar opvolgen, draagt de eigenrisicodrager in afwijking van het eerste lid, gedurende:
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: 82.2.a
    text: |-
      de periode van vier jaar te rekenen vanaf de dag waarop het recht op een uitkering op grond van deze wet voor de
      verzekerde is ontstaan, het risico van betaling van de arbeidsongeschiktheidsuitkering aan die verzekerde; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: 82.2.b
    text: |-
      de periode die op grond van het eerste lid, onderdeel b, geldt op de dag waarop recht op uitkering op grond van
      deze wet is ontstaan, te rekenen vanaf die dag, het risico van betaling van de WGA-uitkering aan die verzekerde.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
  - number: '82.3'
    text: |-
      Indien [artikel 24][ref1] is toegepast wordt de van toepassing zijnde periode bekort met de duur van het verlengde
      tijdvak, bedoeld in [artikel 24, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '82.4'
    text: |-
      Het eerste lid is niet van toepassing indien de uitkering wordt toegekend in aansluiting op een voordien
      op grond van de [Ziektewet][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] of de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3] toegekende uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: '83.1'
    text: |-
      De eigenrisicodrager is bevoegd, met inachtneming van [artikel 72][ref1], de door het UWV toegekende
      arbeidsongeschiktheidsuitkering of WGA-uitkering namens het UWV te betalen aan de verzekerde, bedoeld in
      [artikel 82, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '72'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '83.2'
    text: |-
      De door de eigenrisicodrager op grond van het eerste lid aan de verzekerde betaalde loonaanvullingsuitkering,
      bedoeld in [hoofdstuk 7][ref1], alsmede de op grond van enige wet hierover verschuldigde premies die daarop niet
      in mindering kunnen worden gebracht en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2],
      over deze uitkering, kunnen door hem op het UWV worden verhaald, met uitzondering van een bedrag overeenkomende
      met het bedrag van de vervolguitkering, bedoeld in [hoofdstuk 7][ref3], waar de verzekerde, zonder toepassing
      van [artikel 62, derde lid][ref4], recht op zou hebben indien hij geen recht zou hebben gehad op de
      loonaanvullingsuitkering, bedoeld in [hoofdstuk 7][ref5], vermeerderd met de premies die op grond van enige wet
      daarover verschuldigd zouden zijn en die daarop niet in mindering kunnen worden gebracht en de vergoeding, bedoeld
      in [artikel 46 van de Zorgverzekeringswet][ref6], over deze uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref5
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '83.3'
    text: |-
      Indien de eigenrisicodrager de uitkering niet betaalt, betaalt het UWV deze uitkering en verhaalt het UWV de
      uitkering, alsmede de op grond van enige wet over deze uitkering verschuldigde premies die niet op deze uitkering
      in mindering kunnen worden gebracht en de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1],
      over deze uitkering, op de eigenrisicodrager. Op de eigenrisicodrager wordt evenwel niet verhaald hetgeen deze, als
      hij de uitkering wel had betaald, op grond van het tweede lid op het UWV had kunnen verhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '84.1'
    text: |-
      De eigenrisicodrager draagt vanaf het moment dat hij eigenrisicodrager wordt overeenkomstig [artikel 82][ref1]
      het risico van de betaling van de arbeidsongeschiktheidsuitkering of de WGA-uitkering aan de verzekerde die op
      de eerste dag van de bij die uitkering in acht genomen wachttijd tot hem in dienstbetrekking stond, ook als die
      wachttijd is ingegaan vóór de dag waarop deze werkgever eigenriscodrager werd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.2'
    text: |-
      Indien het eigenrisicodragen eindigt blijft de werkgever het risico, bedoeld in [artikel 82][ref1], eerste
      lid, dragen, voorzover de eerste dag van ongeschiktheid tot werken wegens ziekte is gelegen voor het
      einde van het eigenrisicodragen. Indien de eigenrisicodrager in staat van faillissement is verklaard, of
      indien ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard,
      dan wel indien hij ophoudt werkgever te zijn, betaalt het UWV de arbeidsongeschiktheidsuitkering of
      de WGA-uitkering en verhaalt het deze uitkering, alsmede de op grond van enige wet over deze uitkering
      verschuldigde premies die niet op deze uitkering in mindering kunnen worden gebracht en de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2], over deze uitkering, voorzover deze is betaald
      over de periode, bedoeld in [artikel 82][ref3], op de kredietinstelling of verzekeraar, bedoeld in
      [artikel 40, tweede lid van de Wet financiering sociale verzekeringen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0017745
        artikel: '40'
  - number: '84.3'
    text: |-
      In geval van overgang van een onderneming in de zin van [artikel 662 van Boek 7 van het Burgerlijk Wetboek][ref1],
      alsmede in geval van een dergelijke overgang bij faillissement, wordt het risico van de betaling van de
      arbeidsongeschiktheidsuitkering of de WGA-uitkering aan de verzekerde, die op de eerste dag van de bij die
      uitkering in acht genomen wachttijd in dienstbetrekking stond tot de werkgever die de onderneming heeft
      overgedragen, in afwijking van het tweede lid gedragen door de werkgever die de onderneming verkrijgt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
  - number: 84.3.a
    text: |-
      de werkgever die de onderneming overdraagt geen eigenrisicodrager is en de werkgever die de onderneming verkrijgt
      eigenrisicodrager is of wordt;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
  - number: 84.3.b
    text: de werkgever die de onderneming overdraagt eigenrisicodrager is; of
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
  - number: 84.3.c
    text: |-
      de werkgever die de onderneming overdraagt een werkgever is wiens eigenrisicodragen is beëindigd als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
  - number: '84.4'
    text: |-
      Indien in de in het derde lid, onderdeel a, bedoelde situatie slechts een deel van de onderneming overgaat,
      vindt het derde lid, onderdeel a, toepassing naar rato van het deel van de loonsom dat het overgegane deel van
      de onderneming deel uitmaakte van de gehele onderneming in het kalenderjaar voorafgaande aan dat van overgang,
      doch berust de betaling van de uitkering bij het UWV. Het UWV verhaalt op de eigenrisicodrager de door hem
      op grond van de eerste zin verschuldigde uitkering, alsmede de op grond van enige wet over deze uitkering
      verschuldigde premies die niet op deze uitkering in mindering kunnen worden gebracht en de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref1], over deze uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '84.5'
    text: |-
      Indien in de in het derde lid, onderdeel b of c, bedoelde situatie slechts een deel van de onderneming overgaat,
      blijft het risico van de betaling van de uitkering berusten bij de werkgever die een deel van de onderneming
      overdraagt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
  - number: '84.6'
    text: |-
      Voor de toepassing van het eerste lid en het tweede lid, eerste zin, draagt de eigenrisicodrager
      voorzover het betaling van de WGA-uitkering betreft, het risico gedurende de periode die op grond van
      [artikel 82, eerste lid, onderdeel b][ref1], geldt op de dag waarop het recht op uitkering is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '84.7'
    text: |-
      In de situatie, bedoeld in het tweede lid, verhaalt het UWV de
      kosten die rechtstreeks verband houden met de uitvoering van
      __REF000___________________________________________________________________________________________________________
      _____________________ op de werkgever, bedoeld in het tweede lid. Bij ministeriële regeling kunnen regels worden
      gesteld met betrekking tot de soort en de omvang van de kosten, bedoeld in de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '85.1'
    text: |-
      De eigenrisicodrager is niet verplicht tot het doen van de aangifte van ongeschiktheid tot werken, bedoeld in
      [artikel 38 van de Ziektewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: '85.2'
    text: |-
      De eigenrisicodrager doet, uiterlijk acht maanden nadat de ongeschiktheid tot werken van een werknemer voor
      wie hij het risico, bedoeld in [artikel 82][ref1], draagt zijn verstreken, aangifte van die ongeschiktheid bij
      het UWV. De werkgever geeft daarbij de eerste dag van de ongeschiktheid tot werken op. Voor het bepalen van
      het tijdvak van acht maanden worden tijdvakken van ongeschiktheid tot werken samengeteld, indien zij elkaar met
      een onderbreking van minder dan vier weken opvolgen of indien zij direct voorafgaan aan en aansluiten op een
      periode waarin uitkering in verband met zwangerschap of bevalling op grond van [artikel 3:7, eerste lid][ref2],
      [3:8][ref3] of [3:10, eerste lid, van de Wet arbeid en zorg][ref4] wordt genoten, tenzij de ongeschiktheid
      redelijkerwijs niet geacht kan worden voort te vloeien uit dezelfde oorzaak. Bij de vaststelling van het tijdvak
      van acht maanden blijven perioden, waarin uitkering in verband met zwangerschap of bevalling op grond van
      [artikel 3:7, eerste lid][ref5], [3:8][ref6], of [3:10, eerste lid, van de Wet arbeid en zorg][ref7] wordt genoten,
      buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref7]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref6
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref7
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '85.3'
    text: |-
      Onverminderd het tweede lid doet de eigen risicodrager aangifte van de ongeschiktheid tot werken van een werknemer
      voor wie hij het in [artikel 82][ref1], bedoelde risico draagt, op de laatste werkdag voordat de dienstbetrekking
      eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '86.1'
    text: |-
      Het UWV brengt bij de eigenrisicodrager de kosten in rekening ter zake van de betaling van de uitkering door het
      UWV en het verhaal op de eigenrisicodrager, bedoeld in [artikel 82, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
  - number: '86.2'
    text: |-
      Het UWV vergoedt aan de eigenrisicodrager op aanvraag de schade die deze lijdt door toepassing van
      [artikel 117, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel117
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '117'
        hoofdstuk: '12'
        paragraaf: '12.4'
  - number: '87'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere en zonodig afwijkende regels worden gesteld met betrekking tot
      dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel87
  - number: '88.1'
    text: 'Het UWV weigert een uitkering op grond van deze wet geheel of gedeeltelijk, blijvend of tijdelijk indien:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
  - number: 88.1.a
    text: |-
      de verzekerde verplichtingen, bedoeld in [artikel 27, tweede tot en met vijfde lid][ref1], [28][ref2], [29][ref3],
      of [30][ref4] niet of niet behoorlijk is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 88.1.b
    text: |-
      de verzekerde de verplichting, bedoeld in [artikel 27, eerste lid][ref1], niet binnen de door het UWV daarvoor
      vastgestelde termijn is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 88.1.c
    text: |-
      de verzekerde zich niet houdt aan de verplichting, bedoeld in [artikel 64, derde lid][ref1], of [artikel 65][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel65
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 88.1.d
    text: |-
      de verzekerde tijdens het tijdvak, bedoeld in [artikel 25, negende lid][ref1], zonder deugdelijke grond heeft
      nagelaten verweer te voeren tegen of heeft ingestemd met een beëindiging van de dienstbetrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel25
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
  - number: '88.2'
    text: |-
      Onverminderd het eerste lid kan het UWV de uitkering blijvend geheel weigeren, indien de verzekerde door het niet
      nakomen van de verplichting, bedoeld in [artikel 28, eerste lid][ref1], het ontstaan van de arbeidsongeschiktheid
      opzettelijk heeft veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel28
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '88.3'
    text: |-
      Het eerste lid is niet van toepassing indien de eigenrisicodrager, op grond van [artikel 89][ref1], de bevoegdheid
      heeft de WGA-uitkering te weigeren.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel89
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '89'
        hoofdstuk: '10'
  - number: '88.4'
    text: |-
      Indien het niet tijdig nakomen van de verplichting, bedoeld in [artikel 27, eerste lid][ref1], niet heeft
      geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering, of indien de belanghebbende
      zich niet houdt aan de voorschriften, bedoeld in [artikel 64, derde lid][ref2], of [artikel 65][ref3] kan het
      UWV afzien van het opleggen van een maatregel als bedoeld in het eerste lid en volstaan met het geven van een
      schriftelijke waarschuwing ter zake van het niet tijdig nakomen van de verplichting, of het zich niet houden aan
      de voorschriften, tenzij het niet tijdig nakomen van de verplichting, of het zich niet houden aan de voorschriften,
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een
      zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel65
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '64'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '65'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: '88.5'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten van het opleggen van een maatregel af te
      zien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel88
  - number: '89.1'
    text: |-
      De eigenrisicodrager kan in verband met de uitvoering van [artikel 42][ref1] de WGA-uitkering gedeeltelijk en
      blijvend, geheel en tijdelijk of gedeeltelijk en tijdelijk weigeren indien:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel42
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 89.1.a
    text: |-
      de verzekerde, bedoeld in [artikel 82][ref1], verplichtingen als bedoeld in
      [artikel 27, tweede juncto zesde lid en het vierde lid][ref2], [28, eerste lid][ref3], [29][ref4], of [30][ref5]
      niet of niet behoorlijk is nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel30
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 89.1.b
    text: |-
      de verzekerde, bedoeld in [artikel 82][ref1], de verplichting, bedoeld in
      [artikel 27, eerste juncto zesde lid][ref2], niet binnen de door de eigenrisicodrager daarvoor vastgestelde termijn
      is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '82'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '89.2'
    text: |-
      Indien de verzekerde de verplichting, bedoeld in [artikel 28][ref1], [29][ref2] of [30][ref3], niet heeft nageleefd
      als bedoeld in [artikel 88, tweede lid][ref4], is het eerste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel88
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '88'
        hoofdstuk: '10'
  - number: '89.3'
    text: |-
      Indien op grond van het eerste lid de uitkering geheel wordt geweigerd is [artikel 83, derde lid][ref1], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel83
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '83'
        hoofdstuk: '9'
  - number: '89.4'
    text: |-
      De eigenrisicodrager is bevoegd [artikel 67, derde lid, onderdeel c][ref1], toe te passen voor de duur van ten
      hoogste acht weken, waarbij de betaling ook gedeeltelijk kan worden opgeschort of geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel67
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '67'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '89.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel89
  - number: '90.1'
    text: |-
      Een maatregel als bedoeld in [artikel 88][ref1] of [89][ref2] wordt afgestemd op de ernst van de gedraging en de
      mate waarin de verzekerde de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in elk geval
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel89
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '88'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '89'
        hoofdstuk: '10'
  - number: '90.2'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een boete als bedoeld in
      [artikel 91][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel91
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '91'
        hoofdstuk: '10'
  - number: '90.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste
      lid, voorzover dat betrekking heeft op nadere regels omtrent een maatregel als bedoeld in [artikel 89][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel89
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '89'
        hoofdstuk: '10'
  - number: '90.4'
    text: |-
      Het UWV stelt nadere regels met betrekking tot het eerste lid, voorzover dat betrekking heeft op nadere regels
      omtrent een maatregel als bedoeld in [artikel 88][ref1], waarbij in ieder geval kan worden geregeld in welke
      gevallen het UWV kan afzien van het opleggen van een maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel88
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '88'
        hoofdstuk: '10'
  - number: '91.1'
    text: |-
      Indien de verzekerde of zijn wettelijke vertegenwoordiger of de werkgever of de persoon, bedoeld in
      [artikel 27, achtste lid][ref1], de verplichting, bedoeld in [artikel 27, eerste of achtste lid][ref2], niet of
      niet behoorlijk is nagekomen, legt het UWV hem een boete op van ten hoogste € 2 269.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '91.2'
    text: |-
      De hoogte van de boete wordt afgestemd op de ernst van de gedraging, de mate waarin de de belanghebbende de
      gedraging verweten kan worden en de omstandigheden waarin hij verkeert. Van het opleggen van een boete wordt in elk
      geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
  - number: '91.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 27, eerste lid][ref1], niet
      heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van uitkering op grond van deze wet of
      toekennen of verstrekken van een reïntegratie-instrument, kan het UWV afzien van het opleggen van een boete als
      bedoeld in het eerste lid en volstaan met het geven van een schriftelijke waarschuwing ter zake van het niet
      of niet behoorlijk nakomen van de verplichting, tenzij het niet of niet behoorlijk nakomen van de verplichting
      plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum waarop eerder aan de verzekerde of zijn
      wettelijke vertegenwoordiger een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel27
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '91.4'
    text: Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten van het opleggen van een boete af te zien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
  - number: '91.5'
    text: |-
      De persoon aan wie een boete is opgelegd is verplicht desgevraagd aan het UWV de inlichtingen te verstrekken die
      voor de tenuitvoerlegging van de boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
  - number: '91.6'
    text: Voorzover de boete nog niet is geïnd vervalt zij door het overlijden van de persoon aan wie zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
  - number: '91.7'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel91
  - number: '92.1'
    text: |-
      Indien het UWV jegens de verzekerde of zijn wettelijke vertegenwoordiger een handeling verricht waaraan deze
      in redelijkheid de gevolgtrekking kan verbinden dat aan hem wegens een bepaalde gedraging een boete zal worden
      opgelegd, is de verzekerde of zijn wettelijke vertegenwoordiger niet langer verplicht terzake van die gedraging
      enige verklaring af te leggen, voorzover het betreft de boeteoplegging. De verzekerde of zijn wettelijke
      vertegenwoordiger wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel92
  - number: '92.2'
    text: |-
      Indien het UWV voornemens is om aan de verzekerde of zijn wettelijke vertegenwoordiger een boete op te leggen,
      wordt hiervan kennis gegeven aan de verzekerde of zijn wettelijke vertegenwoordiger onder vermelding van de gronden
      waarop het voornemen berust. De kennisgeving is een handeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel92
  - number: '92.3'
    text: |-
      Op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger die de in het vorige lid bedoelde kennisgeving
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het UWV er zoveel mogelijk zorg
      voor dat de in die kennisgeving vermelde gronden aan de verzekerde of zijn wettelijke vertegenwoordiger worden
      medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel92
  - number: '92.4'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt het UWV de verzekerde of zijn
      wettelijke vertegenwoordiger in de gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren
      te brengen voordat de boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '92.5'
    text: |-
      Indien de verzekerde of zijn wettelijke vertegenwoordiger zijn zienswijze mondeling naar voren brengt, draagt
      het UWV er op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger die de Nederlandse taal onvoldoende
      begrijpt, zorg voor dat een tolk wordt benoemd die de verzekerde of zijn wettelijke vertegenwoordiger kan bijstaan,
      tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel92
  - number: '93.1'
    text: |-
      De beschikking waarbij de boete wordt opgelegd vermeldt de termijn of de termijnen waarbinnen deze moet worden
      betaald, alsmede de wijze waarop de beschikking bij gebreke van tijdige betaling, overeenkomstig [artikel 96][ref1]
      zal worden tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel96
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '96'
        hoofdstuk: '10'
  - number: '93.2'
    text: |-
      Op verzoek van de verzekerde of zijn wettelijke vertegenwoordiger die de in het eerste lid bedoelde beschikking
      wegens zijn gebrekkige kennis van de Nederlandse taal onvoldoende begrijpt, draagt het UWV er zoveel mogelijk zorg
      voor dat de in die beschikking vermelde informatie aan de verzekerde of zijn wettelijke vertegenwoordiger wordt
      medegedeeld in een voor hem begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel93
  - number: '93.3'
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel93
  - number: '94.1'
    text: Een boete wordt niet opgelegd zolang de gedraging wordt onderzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel94
  - number: '94.2'
    text: |-
      De oplegging van een boete blijft definitief achterwege indien ter zake van de gedraging tegen de
      verzekerde of zijn wettelijke vertegenwoordiger een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen op grond van
      [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '94.3'
    text: |-
      Het openbaar ministerie doet van een omstandigheid als bedoeld in het eerste en het tweede lid mededeling aan het
      UWV.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel94
  - number: '95.1'
    text: |-
      Een boete wordt opgelegd binnen een jaar nadat het UWV de verzekerde of zijn wettelijke vertegenwoordiger
      overeenkomstig [artikel 92, vierde lid][ref1], in de gelegenheid heeft gesteld zijn zienswijze naar voren te
      brengen. Indien terzake aangifte is gedaan of proces-verbaal is opgemaakt en ingezonden vangt de termijn van een
      jaar aan op de dag na die waarop het openbaar ministerie aan het UWV heeft medegedeeld dat geen strafvervolging
      wordt ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel92
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '92'
        hoofdstuk: '10'
  - number: '95.2'
    text: |-
      Een boete wordt in elk geval niet opgelegd na verloop van vijf jaren nadat de desbetreffende gedraging heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel95
  - number: '96.1'
    text: |-
      De beschikking waarbij een boete is opgelegd levert een executoriale titel op in de zin van het
      [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]. De titel heeft mede betrekking op de rente en
      kosten, bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '96.2'
    text: |-
      Indien de persoon aan wie een boete is opgelegd uitkering ontvangt op grond van deze wet, de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref4], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref5] of de [Wet arbeid en zorg][ref6] of een toeslag op grond
      van de [Toeslagenwet][ref7], wordt de beschikking waarbij de boete is opgelegd tenuitvoergelegd door verrekening
      met die uitkering of toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0008656
      [ref4]: https://wetten.overheid.nl/BWBR0008657
      [ref5]: https://wetten.overheid.nl/BWBR0002822
      [ref6]: https://wetten.overheid.nl/BWBR0013008
      [ref7]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0008656
      - id: ref4
        bwb_id: BWBR0008657
      - id: ref5
        bwb_id: BWBR0002822
      - id: ref6
        bwb_id: BWBR0013008
      - id: ref7
        bwb_id: BWBR0004043
  - number: '96.3'
    text: |-
      Indien de persoon aan wie een boete is opgelegd een uitkering ontvangt op grond van de
      [Algemene Ouderdomswet][ref1], de [Algemene nabestaandenwet][ref2], de [Wet werk en bijstand][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] of de Wet werk en
      inkomensvoorziening kunstenaars, betaalt de Sociale verzekeringsbank, onderscheidenlijk de betrokken gemeente het
      bedrag van die boete, zonder dat daarvoor een machtiging nodig is van hem, op zijn verzoek aan het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: '96.4'
    text: |-
      Indien de persoon aan wie een boete is opgelegd geen uitkering als bedoeld in het derde lid ontvangt, of
      meer ontvangt, dan wel ten aanzien van zodanige uitkering toepassing van het derde lid niet mogelijk is,
      wordt de beschikking waarbij de boete is opgelegd bij gebreke van tijdige betaling met toepassing van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] op zijn kosten betekend tenuitvoergelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '96.5'
    text: |-
      De tenuitvoerlegging van een beschikking waarbij een boete is opgelegd vindt plaats met toepassing van het tweede
      of derde lid, dan wel van het vierde lid, dan wel van het tweede of derde lid in combinatie met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
  - number: '96.6'
    text: |-
      Bij gebreke van tijdige betaling wordt de verschuldigde boete verhoogd met de wettelijke rente en de op de
      invordering betrekking hebbende kosten.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
  - number: '96.7'
    text: |-
      Op het executoriaal beslag op grond van dit artikel door het UWV op loon, sociale uitkeringen
      of andere periodieke betalingen, welke derden verschuldigd zijn of worden aan de persoon
      aan wie een boete is opgelegd, zijn de [artikelen 479b tot en met 479g][ref1], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '96.8'
    text: |-
      De tenuitvoerlegging van een beschikking met toepassing van dit artikel geschiedt zodanig dat de verzekerde of
      zijn wettelijke vertegenwoordiger blijft beschikken over een inkomen gelijk aan de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '96.9'
    text: |-
      Het achtste lid geldt niet, zolang de verzekerde of zijn wettelijke vertegenwoordiger zijn verplichting bedoeld in
      [artikel 91, vijfde lid][ref1], niet of niet behoorlijk nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel91
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '91'
        hoofdstuk: '10'
  - number: '97'
    text: |-
      Indien het UWV de verzekerde de uitkering op grond van deze wet geheel of gedeeltelijk heeft geweigerd dan wel hem
      een boete heeft opgelegd, stelt het UWV het reïntegratiebedrijf dat ten behoeve van die verzekerde werkzaamheden
      gericht op vergroting van de mogelijkheden tot het verrichten van arbeid of op inschakeling in arbeid verricht,
      van die beschikking in kennis, voorzover dat noodzakelijk is voor de uitvoering van de werkzaamheden door het
      reïntegratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel97
  - number: '98'
    text: |-
      Bij de vaststelling van de schadevergoeding waarop een persoon, die recht heeft op een uitkering op grond van deze
      wet, naar burgerlijk recht aanspraak kan maken in verband met zijn volledig en duurzame arbeidsongeschiktheid of
      gedeeltelijke arbeidsgeschiktheid, houdt de rechter rekening met de aanspraken, die hij op grond van deze wet en de
      daarop berustende bepalingen heeft.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel98
  - number: '99.1'
    text: |-
      Het UWV heeft voor de op grond van deze wet en de daarop berustende bepalingen gemaakte kosten verhaal op
      de persoon, die naar burgerlijk recht verplicht is schade te vergoeden aan de persoon die recht heeft op een
      uitkering op grond van deze wet, doch ten hoogste tot het bedrag, waarvoor deze bij het ontbreken van de aanspraken
      krachtens deze wet naar burgerlijk recht aansprakelijk zou zijn, verminderd met een bedrag, gelijk aan dat van de
      schadevergoeding tot betaling waarvan de aansprakelijke persoon jegens de persoon die recht heeft op een uitkering
      op grond van deze wet naar burgerlijk recht is gehouden.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel99
  - number: '99.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het UWV in plaats van het bedrag van de periodieke verstrekkingen
      de contante waarde daarvan kan vorderen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel99
  - number: '99.3'
    text: |-
      De eigenrisicodrager treedt voor de toepassing van het eerste en het tweede lid in de plaats van het UWV voorzover
      hij het risico van de betaling van uitkering op grond van deze wet draagt.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel99
  - number: '100.1'
    text: |-
      [Artikel 99][ref1] geldt ten aanzien van de naar burgerlijk recht tot schadevergoeding verplichte werkgever van
      de persoon die recht heeft op een uitkering op grond van deze wet, onderscheidenlijk ten aanzien van de naar
      burgerlijk recht tot schadevergoeding verplichte verzekerde, die in dienstbetrekking staat tot dezelfde werkgever
      als de verzekerde jegens wie naar burgerlijk recht een verplichting tot schadevergoeding bestaat, slechts indien de
      volledig en duurzame arbeidsongeschiktheid of gedeeltelijke arbeidsgeschiktheid is te wijten aan opzet of bewuste
      roekeloosheid van die werkgever onderscheidenlijk die verzekerde.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel99
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '99'
        hoofdstuk: '11'
  - number: '100.2'
    text: |-
      Voor de toepassing van het eerste lid wordt mede als werkgever beschouwd de inlener, bedoeld in
      [artikel 34 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel34
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '34'
  - number: '101.1'
    text: |-
      Onverminderd [artikel 102][ref1], worden de beschikkingen op grond van deze wet en de daarop berustende bepalingen
      gegeven binnen een redelijke termijn na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel102
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '102'
        hoofdstuk: '12'
        paragraaf: '12.1'
  - number: '101.2'
    text: |-
      De redelijke termijn is in ieder geval verstreken wanneer binnen acht weken na ontvangst van de aanvraag geen
      beschikking is gegeven, noch een kennisgeving als bedoeld in het derde of vierde lid is gedaan.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel101
  - number: '101.3'
    text: |-
      Indien een beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel101
  - number: '101.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste lid informatie is gevraagd aan een
      persoon of instantie buiten Nederland en om die reden de beschikking niet binnen acht weken gegeven kan worden,
      wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van deze verlenging schriftelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel101
  - number: '102.1'
    text: |-
      Een beschikking over het verzekerd zijn als bedoeld in [artikel 7, tweede lid][ref1], wordt door het UWV gegeven
      binnen dertien weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '102.2'
    text: |-
      Een beschikking over verlenging van het tijdvak gedurende welke de verzekerde jegens zijn werkgever recht op
      loon heeft dan wel aanspraak op bezoldiging als bedoeld in [artikel 24][ref1] wordt gegeven binnen twee weken
      na ontvangst van de aanvraag. Indien de beschikking, bedoeld in de eerste zin niet binnen twee weken kan worden
      gegeven wordt de aanvrager daarvan schriftelijk in kennis gesteld onder vermelding van een zo kort mogelijke
      termijn waarbinnen de beschikking wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel24
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '24'
        hoofdstuk: '3'
  - number: '102.3'
    text: |-
      Een beschikking over het ontstaan, later ontstaan of herleven van het recht op een uitkering als bedoeld
      in [hoofdstuk 6][ref1] en [7][ref2], en een beschikking over een verkorting van de wachttijd als bedoeld
      in [artikel 66, eerste lid][ref3], wordt gegeven binnen tien weken na ontvangst van de aanvraag, tenzij
      [artikel 25, negende lid][ref4], of [26, derde lid, tweede zin][ref5], toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel26
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0019057
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0019057
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '66'
        hoofdstuk: '8'
        paragraaf: '8.1'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '25'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '26'
        hoofdstuk: '3'
  - number: '102.4'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het eerste of derde lid informatie is gevraagd
      aan een persoon of instantie buiten Nederland en om die reden de beschikking niet binnen dertien respectievelijk
      tien weken gegeven kan worden, wordt die termijn verlengd met ten hoogste zes maanden en wordt de aanvrager van
      deze verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
  - number: '102.5'
    text: |-
      Indien in verband met het geven van een beschikking als bedoeld in het derde lid advies is gevraagd aan een
      deskundige die niet onder verantwoordelijkheid van het UWV werkzaam is en om die reden de beschikking niet binnen
      tien weken gegeven kan worden, wordt die termijn verlengd met ten hoogste vier weken en wordt de aanvrager van die
      verlenging schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
  - number: '102.6'
    text: |-
      Indien een beschikking als bedoeld in het eerste lid niet binnen dertien weken of de beschikking, bedoeld in het
      derde lid niet binnen tien weken kan worden gegeven om andere dan de in het vierde respectievelijk vierde of vijfde
      lid bedoelde redenen wordt de aanvrager daarvan schriftelijk in kennis gesteld onder vermelding van een zo kort
      mogelijke termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel102
  - number: '103'
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel103
  - number: 103.a
    text: 'medische beschikking: een beschikking, waaraan een beoordeling van medische gegevens ten grondslag ligt;'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel103
  - number: 103.b
    text: 'werknemer: de persoon, op wiens medische gegevens de beoordeling betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel103
  - number: 103.c
    text: 'de werkgever: de belanghebbende bij een medische beschikking, die niet de werknemer is.'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel103
  - number: '104.1'
    text: |-
      Stukken die medische gegevens bevatten worden door het UWV niet aan de werkgever ter inzage of ter kennisname
      gegeven of toegezonden, tenzij de werknemer hiervoor schriftelijk toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel104
  - number: '104.2'
    text: De toestemming kan te allen tijde schriftelijk worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel104
  - number: '104.3'
    text: Tijdens het horen in bezwaar kan de toestemming ook mondeling worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel104
  - number: '105.1'
    text: |-
      Indien door de werknemer geen toestemming is gegeven als bedoeld in [artikel 104][ref1], is de inzage in, dan
      wel kennisname of toezending van stukken die medische gegevens bevatten, voorbehouden aan een gemachtigde van de
      werkgever, die advocaat of arts is danwel daarvoor van het UWV bijzondere toestemming heeft gekregen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel104
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '104'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '105.2'
    text: 'De gemachtigde, bedoeld in het eerste lid, treedt in de plaats van de werkgever bij:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
  - number: 105.2.a
    text: de voorbereiding van een medische beschikking;
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
  - number: 105.2.b
    text: het opstellen van een bezwaar- of beroepschrift; en
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
  - number: 105.2.c
    text: de behandeling van een bezwaar,
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
  - number: '105.3'
    text: |-
      [Artikel 7:4, tweede, vierde en zesde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op
      stukken of inlichtingen die medische gegevens bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel105
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '106.1'
    text: |-
      Het UWV vermeldt de motivering van een medische beschikking, voorzover betrekking hebbend op medische gegevens, op
      een aparte bijlage.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel106
  - number: '106.2'
    text: |-
      Indien door de werknemer geen toestemming is gegeven als bedoeld in [artikel 104][ref1] wordt de bijlage, bedoeld
      in het eerste lid, niet aan de werkgever verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel104
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '104'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '106.3'
    text: |-
      De bijlage wordt verstrekt aan de gemachtigde van de werkgever, bedoeld in [artikel 105][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel105
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '105'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '106.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een rapport of een advies van een arts of een
      psycholoog, waarnaar bij de motivering van een medische beschikking wordt verwezen.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel106
  - number: '107'
    text: |-
      Bij de bekendmaking van een medische beschikking wordt gewezen op de [artikelen 104][ref1], [105][ref2],
      [106][ref3] en [108][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel106
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel108
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '104'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '105'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '106'
        hoofdstuk: '12'
        paragraaf: '12.2'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '108'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '108'
    text: |-
      De gronden van het bezwaar of beroep, bedoeld in
      [artikel 6:5, eerste lid, onderdeel d, van de Algemene wet bestuursrecht][ref1], worden in een aparte bijlage
      vermeld voorzover ze betrekking hebben op medische gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '109.1'
    text: |-
      Indien [artikel 8:32, tweede lid van de Algemene wet bestuursrecht][ref1] is toegepast, vindt in afwijking van
      [artikel 8:62, eerste lid, van de Algemene wet bestuursrecht][ref2] het onderzoek ter zitting, voorzover betrekking
      hebbend op medische gegevens, met gesloten deuren plaats, tenzij de rechtbank ambtshalve of op verzoek van een van
      de partijen bepaalt dat het onderzoek openbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '109.2'
    text: |-
      In de uitnodiging, bedoeld in [artikel 8:56 van de Algemene wet bestuursrecht][ref1] wordt mededeling gedaan van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '110'
    text: |-
      [Artikel 109][ref1] is van overeenkomstige toepassing bij de behandeling van het hoger beroep en bij de behandeling
      van een verzoek om een voorlopige voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel109
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '109'
        hoofdstuk: '12'
        paragraaf: '12.2'
  - number: '111'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het UWV binnen dertien
      weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '112'
    text: |-
      Indien bezwaar wordt gemaakt tegen een beschikking waaraan een verzekeringsgeneeskundige
      of arbeidskundige beoordeling ten grondslag ligt, beslist het UWV, in afwijking van
      [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1], binnen zeventien weken of, indien het advies
      vraagt aan een deskundige die niet onder zijn verantwoordelijkheid werkzaam is binnen eenentwintig weken, na
      ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '113'
    text: |-
      In afwijking van [artikel 7:3 van de Algemene wet bestuursrecht][ref1] kan van het horen van een belanghebbende
      worden afgezien indien de belanghebbende niet binnen een door het UWV gestelde redelijke termijn, verklaart dat hij
      gebruik wil maken van het recht te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '114'
    text: |-
      In afwijking van [artikel 1:2 van de Algemene wet bestuursrecht][ref1] is de werkgever geen belanghebbende bij een
      beschikking van het UWV over het verzekerd zijn op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '115'
    text: |-
      Het bezwaar of beroep van een werkgever tegen de in [artikel 83][ref1] bedoelde betaling danwel tegen de in
      [artikel 37, tweede of derde lid, van de Wet financiering sociale verzekeringen][ref2], bedoelde opslag of korting
      kan niet zijn gegrond op de grief, dat een uitkering op grond van deze wet ten onrechte of tot een te hoog bedrag
      is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel37
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '83'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '37'
  - number: '116.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van [artikel 2, tweede tot en met zesde lid][ref1], en [8][ref2] en [9][ref3]
      en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel9
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '116.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel116
  - number: '117.1'
    text: |-
      Intrekking van het recht op een uitkering op grond van deze wet of verlaging van de hoogte ervan, die voortvloeien
      uit het door de werkgever ingesteld bezwaar of beroep, vinden niet eerder plaats dan zes weken na de dag waarop de
      beslissing op bezwaar is bekendgemaakt of de uitspraak is gedaan. De eerste zin is van overeenkomstige toepassing
      in geval van intrekking van het bezwaar of beroep omdat het UWV geheel of gedeeltelijk is tegemoet gekomen aan het
      bezwaar of beroep van de werkgever.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel117
  - number: '117.2'
    text: |-
      Het eerste lid geldt niet, indien de uitkering door eigen schuld of toedoen van de werknemer ten onrechte of tot
      een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel117
  - number: '118'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de boete is vastgesteld ook ten nadele van de belanghebbende of zijn wettelijke vertegenwoordiger
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '119'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op aanspraken op grond van
      [artikel 34, tweede lid][ref2], en [35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '34'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '120'
    text: 'Geen recht op uitkering op grond van deze wet heeft de persoon die:'
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel120
  - number: 120.a
    text: |-
      verzekerd is op grond van [artikel 16 van de Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel16
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '16'
  - number: 120.b
    text: |-
      de persoon die recht heeft op toekenning of heropening van arbeidsongeschiktheidsuitkering op grond
      van de [artikelen 19a][ref1], [20][ref2], [43a][ref3], onderscheidenlijk [47][ref4], [47a][ref5] of
      [47b van die wet][ref6]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel43a
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel47a
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel47b
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 19a
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 43a
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '47'
      - id: ref5
        bwb_id: BWBR0002524
        artikel: 47a
      - id: ref6
        bwb_id: BWBR0002524
        artikel: 47b
  - number: 120.c
    text: |-
      de persoon die belanghebbende is als bedoeld in
      [artikel 1 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002822#Artikel1
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0002822
        artikel: '1'
  - number: '121.1'
    text: |-
      Indien een persoon voorafgaand aan zijn verzekering, verzekerd was op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt voor de toepassing van
      [artikel 10, eerste lid, onderdelen a en b, en tweede lid][ref2] mede verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel10
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 121.1.a
    text: |-
      verzekerd is geweest: verzekerd is geweest op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 121.1.b
    text: |-
      verzekering: verzekering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '121.2'
    text: |-
      Indien het eerste lid toepassing vindt, wordt in [artikel 10, eerste lid][ref1], voor «beschouwd alsof hij
      verzekerd was gebleven» gelezen: beschouwd alsof hij verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel10
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '10'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: '122'
    text: |-
      Voor de toepassing van [artikel 17][ref1] wordt mede verstaan onder «verzekeringen op grond van deze wet»:
      verzekeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '123.1'
    text: |-
      Een vrijwillige verzekering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] die op het tijdstip waarop
      __REF001___________________________________________________________________________________________________________
      ____ in werking treden, op grond van
      [artikel 83b, onderdeel d, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] wordt beëindigd, wordt
      aangemerkt als een vrijwillige verzekering op grond van [artikel 18][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel83b
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel18
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 83b
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '123.2'
    text: |-
      Indien het eerste lid toepassing vindt, wordt op verzoek van de vrijwillig verzekerde de hoogte van het dagloon op
      grond waarvan de uitkering van de vrijwillige verzekering wordt berekend, gewijzigd dan wel wordt de vrijwillige
      verzekering beëindigd met ingang van het tijdstip, bedoeld in het eerste lid. [Artikel 21][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel21
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '123.3'
    text: |-
      Het verzoek, bedoeld in het tweede lid, wordt binnen drie maanden na het tijdstip, bedoeld in het eerste lid bij
      het UWV gedaan.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
  - number: '123.4'
    text: |-
      In afwijking van [artikel 18][ref1] wordt tot de vrijwillige verzekering op grond van dat artikel niet toegelaten,
      de persoon die op grond van [artikel 81 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] moet worden
      toegelaten tot de vrijwillige verzekering op grond van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel81
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '81'
  - number: '123.5'
    text: |-
      Voor de toepassing van [artikel 18, eerste lid, onderdelen a en c, tweede lid, onderdeel a, en derde lid][ref1], en
      [artikel 19, eerste lid, onderdelen a en c, en derde lid, onderdeel a][ref2], wordt mede verstaan onder «verplichte
      verzekering»: verplichte verzekering op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0002524
  - number: '123.6'
    text: |-
      Voor de toepassing van [artikel 18, vijfde lid][ref1], wordt mede verstaan onder «verzekerd is geweest»: verzekerd
      is geweest op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '123.7'
    text: |-
      Voor de toepassing van [artikel 18, zesde lid][ref1], wordt mede verstaan onder «een uitkering ontvangt op grond
      van deze wet»: een uitkering ontving op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0002524
  - number: 123a
    text: |-
      In afwijking van [artikel 23, derde lid][ref1], worden bij het bepalen van de wachttijd tot 1 september 2005 de
      volgende perioden in aanmerking genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel23
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '23'
        hoofdstuk: '3'
  - number: 123a.a
    text: |-
      perioden waarin recht bestaat op ziekengeld als bedoeld in de [Ziektewet][ref1] en de daarop berustende bepalingen
      worden in aanmerking genomen en worden samengeteld, indien zij elkaar met een onderbreking van minder dan vier
      weken opvolgen;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123a
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 123a.b
    text: |-
      perioden die niet al op grond van onderdeel a meetellen, maar waarin de verzekerde ongeschikt is geweest voor zijn
      arbeid.
    url: https://wetten.overheid.nl/BWBR0019057/2006-10-01#Artikel123a
  - number: 123b.1
    text: |-
      De [artikelen 25, negende, tiende tot en met vijftiende lid][ref1], [26, derde lid][ref2],
      [64, tweede lid, derde zin, derde, vierde, zesde tot en met negende lid][ref3] en [102, derde lid][ref4],
      van deze wet en de [artikelen 629, derde lid, onderdeel f, en elfde lid, onderdeel b][ref5], en
      [670, tiende lid, onderdeel b, van Titel 10 van Boek 7 van het Burgerlijk Wetboek][ref6] zijn niet van toepassing
      op personen die voor 15 augustus 2004 arbeidsongeschikt zijn geworden.


