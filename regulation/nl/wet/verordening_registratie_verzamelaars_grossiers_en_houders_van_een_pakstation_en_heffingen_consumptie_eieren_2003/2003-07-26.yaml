  - number: '12'
    text: |-
      Een ingevolge deze verordening verschuldigd heffingsbedrag dient uiterlijk binnen 14 dagen nadat dit bedrag aan de
      betrokken ondernemer in rekening is gebracht, aan het productschap te worden voldaan.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel12
  - number: '13'
    text: |-
      1 Een schuldenaar, die enig door hem uit hoofde van het bij of krachtens een heffingsverordening bepaalde
      verschuldigde heffing niet tijdig volledig heeft betaald is, na bij aangetekend schrijven aangemaand om binnen een
      termijn van 10 dagen de heffing te voldoen, aan het productschap deze heffing verschuldigd, verhoogd met de op de
      invordering vallende kosten, waaronder begrepen de wettelijke rente.

      2 De in het eerste lid bedoelde rente wordt berekend vanaf de dag waarop de in dat lid genoemde termijn is
      verstreken tot aan de dag van de algehele voldoening.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel13
  - number: '14'
    text: |-
      Het niet nakomen van een verplichting, gesteld in de [artikelen 2 tot en met 5][ref1] en [11][ref2], waaronder mede
      verstaan wordt het verstrekken van geheel of gedeeltelijk onjuiste gegevens, is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0014278#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014278#Artikel11
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014278
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014278
        artikel: '11'
  - number: '15'
    text: |-
      1 De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden
      in handen gesteld van de voorzitter van het productschap; zij worden, behoudens aan personeelsleden van het
      secretariaat van het productschap, niet bekendgemaakt.

      2 De voorzitter van het productschap kan, in afwijking van het gestelde in het eerste lid, besluiten tot
      bekendmaking van getotaliseerde gegevens omtrent groepen van ondernemingen, doch nimmer op zodanige wijze dat
      daaruit gegevens omtrent een bepaalde onderneming kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel15
  - number: '16'
    text: |-
      De voorzitter van het productschap is bevoegd, onder door het bestuur te stellen regelen, van het bepaalde in of
      krachtens deze verordening ontheffing te verlenen en daaraan voorwaarden te verbinden.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel16
  - number: '17'
    text: |-
      De voorzitter kan [artikel 11][ref1], [12][ref2], [13][ref3] en [14][ref4] buiten toepassing laten of daarvan
      afwijken voor zover toepassing gelet op het belang dat deze verordening beoogt te beschermen zal leiden tot een
      onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0014278#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014278#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0014278#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0014278#Artikel14
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel17
