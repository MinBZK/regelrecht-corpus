preamble:
  text: |-
    gelet op artikel 126 van de Wet op de Bedrijfsorganisatie, en de artikelen 5 en 9 van de Instellingsverordening
    Productschap Pluimvee en Eieren 1998-I,

    op 14 november 2002 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:









                  productschap


                  :


                  het Productschap Pluimvee en Eieren;




                  onderneming


                  :


                  een onderneming waarvoor het productschap is ingesteld;




                  ondernemer


                  :


                  de natuurlijke of rechtspersoon die een onderneming drijft;




                  eieren


                  :


                  kippeneieren in de schaal, met uitzondering van eieren die zich ter verkrijging van kuikens in een
      broedmachine bevinden, dan wel kennelijk bestemd zijn om voor dit doel in een broedmachine te worden ingelegd;




                  verzamelaar


                  :


                  de ondernemer die ongesorteerde eieren ophaalt bij of koopt van een pluimveehouder teneinde deze eieren
      af te (doen) leveren of te (doen) verkopen aan de houder van een pakstation of de industrie;




                  houder van een pakstation


                  :


                  de ondernemer die ongesorteerde eieren koopt van een pluimveehouder of van een verzamelaar teneinde
      deze eieren, gesorteerd naar kwaliteit en gewicht te leveren aan anderen dan consumenten;




                  grossier


                  :


                  de ondernemer, die naar kwaliteit en gewicht gesorteerde eieren koopt, teneinde deze eieren te leveren
      aan anderen dan consumenten;




                  eiproducten


                  :


                  producten die zijn verkregen uit eieren, uit bestanddelen van eieren of mengsels daarvan, na
      verwijdering van schaal en vliezen en die bestemd zijn voor menselijke consumptie;




                  eiproductenfabrikant


                  :


                  ondernemer als bedoeld in de [Verordening heffingen eiproducten 2003][ref1];




                  sorteren


                  :


                  het indelen van eieren in gewichts- en kwaliteitsklassen;




                  legpluimveebedrijf


                  :


                  inrichting die wordt gebruikt voor het houden van kippen voor de productie van consumptie-eieren;




                  consument


                  :


                  degene die eieren koopt uitsluitend bestemd voor en in overeenstemming met zijn persoonlijke behoefte.


      [ref1]: https://wetten.overheid.nl/BWBR0014283
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014283
  - number: '2'
    text: |-
      Ondernemers die in de hoedanigheid van verzamelaar en/of houder van een pakstation en/of grossier een onderneming
      drijven zijn verplicht zich ter registratie bij het productschap aan te melden.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel2
  - number: '3'
    text: |-
      1 De aanmelding ter registratie dient te geschieden door middel van een registratieformulier dat door het
      secretariaat van het productschap wordt verstrekt.

      2 Het model van het in het eerste lid bedoelde formulier wordt door de voorzitter van het productschap bij
      uitvoeringsbesluit vastgesteld ter verkrijging van onder meer de volgende gegevens:

      a. naam, adres en rechtsvorm van de onderneming, alsmede van eventuele filialen;

      b. datum van vestiging of overneming der onderneming;

      c. gegevens omtrent de hoeveelheid door de ondernemer te sorteren eieren.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel3
  - number: '4'
    text: |-
      De in [artikel 2][ref1] bedoelde ondernemer dient binnen 14 dagen nadat hij de hoedanigheid van verzamelaar en/of
      houder van een pakstation heeft verkregen het in [artikel 3][ref2] bedoelde registratieformulier, volledig en naar
      waarheid ingevuld en ondertekend, bij het secretariaat van het productschap in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0014278#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014278#Artikel3
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014278
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014278
        artikel: '3'
  - number: '5'
    text: |-
      De in [artikel 2][ref1] bedoelde ondernemer is gehouden bij de opheffing van zijn onderneming, dan wel bij enige
      wijziging van de in [artikel 3, tweede lid][ref2] bedoelde gegevens, daarvan uiterlijk binnen 14 dagen nadat zich
      het desbetreffende feit of de wijziging heeft voorgedaan schriftelijk mededeling te doen aan het secretariaat van
      het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014278#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014278#Artikel3
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014278
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014278
        artikel: '3'
  - number: '6'
    text: |-
      Het productschap doet aan de betrokken ondernemer onverwijld schriftelijk een bevestiging toekomen van de ontvangst
      van de registratie, door toezending van één gewaarmerkt exemplaar van het registratieformulier. De mededeling
      bedoeld in [artikel 5][ref1] wordt onverwijld schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014278#Artikel5
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014278
        artikel: '5'
  - number: '7'
    text: |-
      1 a. Houders van een pakstation zijn aan het productschap over het kalenderjaar 2003 een vaste heffing verschuldigd
      van € 249,57.

      b. In afwijking van het bepaalde onder a. is de houder van een pakstation, indien zijn bedrijf in het kalenderjaar
      2003 is beëindigd, een vaste heffing verschuldigd van € 20,80 per maand of gedeelte daarvan, dat de betrokken
      ondernemer bij het productschap staat geregistreerd als houder van een pakstation met een maximum van € 249,57
      per jaar.

      2 Houders van een pakstation zijn aan het productschap voorts een heffing verschuldigd over de door hen in het
      kalenderjaar 2003 van een legpluimveebedrijf ontvangen eieren ten bedrage van € 0,00003 per ei.

      3 Houders van een pakstation zijn aan het productschap voorts een heffing verschuldigd over de door hen in het
      kalenderjaar 2003 afgeleverde eieren ten bedrage van

      € 0,00004 per ei waarvan:

      € 0,0000255 voor de dekking van huishoudelijke uitgaven,

      € 0,00001 voor het afzetbevorderingsfondsen

      € 0,0000045 voor het kwaliteitsverbeteringsfonds is bestemd.

      4 De in het derde lid bedoelde heffingen zijn, in zoverre zij daarin bestemd zijn voor de daarin genoemde fondsen,
      niet verschuldigd voor die eieren ten aanzien waarvan naar genoegen van het productschap wordt aangetoond dat zij
      niet in Nederland zijn geproduceerd.

      5 De in het derde lid bedoelde heffing is niet verschuldigd voor die eieren ten aanzien waarvan naar genoegen van
      het productschap wordt aangetoond dat zij gesorteerd ontvangen zijn van een andere houder van een pakstation, als
      zodanig geregistreerd bij het productschap.

      6 De in het derde lid bedoelde heffing is niet verschuldigd voor die eieren ten aanzien waarvan naar genoegen van
      het productschap wordt aangetoond dat zij afgeleverd zijn aan een eiproductenfabrikant.

      7 De in het tweede lid bedoelde heffing is niet verschuldigd voor die eieren ten aanzien waarvan naar genoegen van
      het productschap wordt aangetoond dat zij ontvangen zijn van een verzamelaar.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel7
  - number: '8'
    text: |-
      Verzamelaars zijn aan het productschap een heffing verschuldigd over de door hen in het kalenderjaar 2003 van een
      legpluimveebedrijf ontvangen eieren ten bedrage van € 0,00003 per ei.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel8
  - number: '9'
    text: |-
      1 Grossiers, met uitzondering van eigen-formule detaillisten, zijn aan het productschap over het kalenderjaar 2003
      een vaste heffing verschuldigd van € 68,06.

      2 In afwijking van het bepaalde onder het eerste lid is een grossier, indien zijn bedrijf in het kalenderjaar 2003
      is beëindigd, een vaste heffing verschuldigd van € 5,67 per maand of gedeelte daarvan, dat de betrokken ondernemer
      bij het productschap staat geregistreerd als grossier met een maximum van € 68,06 per jaar.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel9
  - number: '10'
    text: |-
      Ondernemers die een legpluimveebedrijf exploiteren zijn aan het productschap over de door hen geproduceerde eieren
      welke zij in het kalenderjaar 2003 niet in Nederland aan een houder van een pakstation, een verzamelaar, een
      eiproductenfabrikant en/of consument hebben afgeleverd een heffing verschuldigd ten bedrage van € 0,00003 per ei.
    url: https://wetten.overheid.nl/BWBR0014278/2003-07-26#Artikel10
  - number: '11'
    text: |-
      1 De in [artikel 2][ref1] en [artikel 10][ref2] bedoelde ondernemer is verplicht uiterlijk binnen 10 dagen na het
      verstrijken van elke kalendermaand, door middel van invulling en ondertekening van een hem door het productschap
      verstrekt opgaveformulier, naar waarheid opgave te doen van die bedrijfsgegevens over de verstreken kalendermaand
      waarvan de opgave in dat formulier wordt verlangd. Indien in het voorgaande jaar het totale aantal ontvangen
      eieren, als bedoeld in [artikel 7, tweede lid][ref3], onderscheidenlijk [artikel 8][ref4], dan wel het totaal
      aantal afgeleverde eieren, als bedoeld in [artikel 10][ref5], minder dan 4 miljoen stuks bedroeg kan de ondernemer
      volstaan met het doen van de even bedoelde opgave binnen 10 dagen na afloop van het betreffende kalenderjaar.

      2 De in het opgaveformulier te verstrekken gegevens hebben betrekking op de in de desbetreffende kalendermaand
      ontvangen, afgeleverde en/of in voorraad gehouden eieren.

      3 De heffing die aan de ondernemer wordt opgelegd kan worden aangemerkt als voorschotbetaling. Na afloop van
      het kalenderjaar vindt dan een definitieve heffingsoplegging plaats en zo nodig verrekening tussen feitelijk
      verschuldigd bedrag en betaalde voorschotten.

      4 Iedere ondernemer is verplicht van dag tot dag een zodanige administratie te voeren, dat de gegevens, benodigd
      voor de vaststelling van de heffing, te alle tijde op een eenvoudige wijze kunnen worden gekend.

      5 Het bestuur van het productschap is bevoegd bij uitvoeringsbesluit minimumeisen te stellen waaraan de door
      verzamelaar, houder van een pakstation, grossier en/of legpluimveebedrijf, met betrekking tot de ontvangst, de
      aflevering en de voorraad eieren te voeren administratie dient de voldoen.

      6 Voor het geval een ondernemer, als bedoeld in [artikel 2][ref6], onderscheidenlijk [artikel 10][ref7] niet heeft
      voldaan aan een ingevolge [titel II][ref8] op hem rustende verplichting waaronder begrepen het verstrekken van
      onvolledige en/of onjuiste gegevens, kan te zijnen aanzien de in onder onderscheidenlijk de [artikelen 7][ref9],
      [8][ref10], [9][ref11] en [10][ref12] omschreven heffing ambtshalve door het productschap worden vastgesteld aan de
      hand van aan het productschap ten dienste staande gegevens, zo nodig door middel van een schatting.


