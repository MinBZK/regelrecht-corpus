$id: regeling_specifieke_uitkering_voor_gemeenten_appingedam_delfzijl_midden_groningen_en_groningen_versterking_gebouwen_in_batch_1588
regulatory_layer: WET
publication_date: '2019-06-19'
valid_from: '2019-06-20'
bwb_id: BWBR0042306
url: https://wetten.overheid.nl/BWBR0042306/2019-06-20
preamble:
  text: |-
    Gelet op de artikelen 2, onderdelen a en b, van de Kaderwet EZK- en LNV-subsidies en 17, tweede lid, van de
    Financiële-verhoudingswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *minister:* Minister van Economische Zaken en Klimaat;
        - *gemeenten:* gemeenten Appingedam, Delfzijl, Midden-Groningen en Groningen;
        - *batch 1.588:* door de Nationaal Coördinator Groningen benoemde batch van 1.588 woningen in de gemeenten waarvoor
      versterkingsadviezen zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel1
  - number: '2.1'
    text: |-
      De minister verleent een eenmalige specifieke uitkering aan de gemeenten voor de aanloopkosten van de eerste te
      versterken gebouwen in batch 1.588.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: '2.2'
    text: 'De specifieke uitkering bedraagt per gemeente:'
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: 2.2.a
    text: gemeente Appingedam 44 miljoen;
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: 2.2.b
    text: gemeente Delfzijl 28 miljoen;
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: 2.2.c
    text: gemeente Midden-Groningen 5 miljoen;
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: 2.2.d
    text: gemeente Groningen 7 miljoen.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel2
  - number: '3.1'
    text: 'De gemeenten besteden de specifieke uitkering uitsluitend aan:'
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel3
  - number: 3.1.a
    text: voorbereidende werkzaamheden voor de versterking van de gebouwen in batch 1.588;
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel3
  - number: 3.1.b
    text: het verstrekken van subsidies voor de versterking van de gebouwen in batch 1.588.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel3
  - number: '3.2'
    text: |-
      De gemeenten nemen de artikelen 107 tot en met 108 van het Verdrag betreffende de Werking van de Europese Unie in
      acht bij de besteding van de specifieke uitkering.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel3
  - number: '4'
    text: Op 15 juni 2019 wordt aan de gemeenten een voorschot betaald van 100% van de specifieke uitkering.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel4
  - number: '5'
    text: |-
      De gemeenten leggen verantwoording af over de besteding van de specifieke uitkering op de wijze bepaald in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '6'
    text: De minister stelt een uitkering overeenkomstig de verlening vast, tenzij
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel6
  - number: 6.a
    text: de activiteiten waarvoor de uitkering is verleend niet of niet geheel hebben plaatsgevonden, of
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel6
  - number: 6.b
    text: |-
      de gemeente niet heeft voldaan aan de voorwaarden, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042306#Artikel3
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0042306
        artikel: '3'
  - number: '7'
    text: |-
      Onverschuldigd betaalde uitkeringsbedragen en voorschotten kunnen worden teruggevorderd, voorzover na de dag waarop
      de beschikking waarbij de uitkering wordt vastgesteld is bekendgemaakt, nog geen vijf jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0042306/2019-06-20#Artikel8
