  - number: '11'
    text: |-
      1 Bij wet kunnen daarin aangewezen politietaken voor Bonaire, Sint Eustatius en Saba worden opgedragen aan de
      Koninklijke marechaussee volgens nader bij wet te stellen regels.

      2 De Koninklijke marechaussee kan bijstand verlenen aan de politie van Bonaire, Sint Eustatius en Saba volgens
      nader bij wet te stellen regels.

      3 In bijzondere gevallen kan bijstand worden verleend aan de politie van Bonaire, Sint Eustatius en Saba door
      andere onderdelen van de krijgsmacht volgens nader bij wet te stellen regels.

      4 De militair van de Koninklijke marechaussee die optreedt in de rechtmatige uitoefening van zijn bediening en
      de militair van enig ander onderdeel van de krijgsmacht die op grond van deze rijkswet bijstand verleent aan de
      politie, beschikken over de bevoegdheden, bedoeld in [artikel 13][ref1]. De ambtsinstructie is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel11
