  - number: '2'
    text: |-
      Deze rijkswet is van toepassing op de politie van Curaçao, de politie van Sint Maarten en de politie van Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Ambtenaren van politie in de zin van deze rijkswet en de daarop berustende bepalingen zijn:

      a. ambtenaren aangesteld voor de uitvoering van de politietaak;

      b. ambtenaren aangesteld voor de uitvoering van technische, administratieve en ander taken ten dienste van de
      politie;

      c. vrijwillige ambtenaren aangesteld voor de uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel3
  - number: '4'
    text: |-
      Curaçao en Sint Maarten hebben elk een politiekorps. Er is een politiekorps voor Bonaire, Sint Eustatius en Saba
      gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel4
  - number: '5'
    text: |-
      Het politiekorps heeft tot taak in ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de daarvoor
      geldende rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan
      hen die deze behoeven.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel5
  - number: '6'
    text: Aan het hoofd van het politiekorps staat een korpschef, belast met de dagelijkse leiding van het korps.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Elk van de landen draagt zorg voor een kwalitatief volwaardig en professioneel politiekorps.

      2 Elk van de landen stelt bij of krachtens landsverordening of bij of krachtens wet regels over de inrichting
      en organisatie van het politiekorps met het oog op een zo effectief en efficiënt mogelijke uitvoering van de
      politietaak. In ieder geval wordt voorzien in de volgende taakgebieden:

      a. recherche ten behoeve van de opsporing van misdrijven met voorzieningen op het gebied van tactisch, technisch,
      financieel en digitaal onderzoek, informatie en analyse;

      b. observatie;

      c. aanhouding van vuurwapengevaarlijke verdachten;

      d. voorziening voor het optreden ter handhaving van de openbare orde en hulpverlening.

      3 De in het tweede lid bedoelde taakgebieden kunnen samen met de politiekorpsen van de andere landen worden
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel7
  - number: '8'
    text: |-
      1 Gegeven de taakgebieden in [artikel 7, tweede lid][ref1], zorgt het politiekorps voor het verrichten van
      onderzoeken:

      a. naar grensoverschrijdende criminaliteit bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________;

      b. naar misdrijven, die gezien de ernst of frequentie dan wel het georganiseerd verband waarin ze worden gepleegd
      een ernstige inbreuk op de rechtsorde maken;

      c. ter uitvoering van interregionale en internationale verzoeken tot rechtshulp met betrekking tot strafbare feiten
      bedoeld onder a en b.

      2 De onderzoeken omvatten mede het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van
      operationele informatie en bestuursinformatie ten behoeve van de korpsen.

      3 De onderzoeken worden verricht door een onderdeel van het korps, waarin ambtenaren van politie van het korps en
      ambtenaren van politie die beschikbaar worden gesteld door middel van de gemeenschappelijke voorziening politie op
      leidinggevend en uitvoerend niveau in een evenredige samenstelling op basis van gelijkwaardigheid nauw met elkaar
      samenwerken.

      4 De onderzoeken worden door de korpschef, de procureur-generaal en de directeur van de gemeenschappelijke
      voorziening politie voor wat betreft inzet van personeel, middelen en materieel en de kwaliteit daarvan, periodiek
      geëvalueerd op voortgang en resultaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028072#Artikel33
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel8
