  - number: '57'
    text: |-
      Totdat het [vierde respectievelijk vijfde lid van artikel 39][ref1] in werking is getreden worden politiegegevens
      met inachtneming van de daarvoor geldende voorschriften uitgewisseld tussen de politie van het Europese deel van
      het Koninkrijk en de politie van Curaçao respectievelijk de politie van Sint Maarten op grond van een daartoe
      tussen de landen getroffen onderlinge regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel39
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel57
    references:
      - id: ref1
