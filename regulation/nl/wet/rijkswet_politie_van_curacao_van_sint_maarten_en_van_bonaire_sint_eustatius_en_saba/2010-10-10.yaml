  - number: '15'
    text: |-
      Alle ambtenaren die zijn belast met een politietaak verlenen elkaar de nodige hulp en betrachten voortdurend een
      eendrachtige samenwerking.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel15
  - number: '16'
    text: |-
      1 Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van justitie, staat zij onder het gezag van de procureur-generaal.

      2 De procureur-generaal kan ambtenaren van politie algemene en bijzondere aanwijzingen geven voor de vervulling van
      de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel16
  - number: '17'
    text: |-
      1 Indien de politie optreedt ter handhaving van de openbare orde en ter uitvoering van de hulpverleningstaak staat
      zij in Curaçao en Sint Maarten onder het gezag van Onze Minister van Justitie van Curaçao respectievelijk Onze
      Minister van Justitie van Sint Maarten en op Bonaire, Sint Eustatius respectievelijk Saba onder het gezag van de
      gezaghebber.

      2 Onze Minister, bedoeld in het eerste lid, respectievelijk de gezaghebber kan ambtenaren van politie algemene en
      bijzondere aanwijzingen geven voor de vervulling van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De korpschef ziet er op toe dat de ambtenaren van politie die onder zijn leiding werkzaam zijn zich gedragen naar
      en dat zij gevolg geven aan de vorderingen en aanwijzingen van de daartoe bevoegde autoriteiten en ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel18
  - number: '19'
    text: |-
      Onze Minister van Justitie van Curaçao respectievelijk Onze Minister van Justitie van Sint Maarten overlegt
      respectievelijk de gezaghebbers van Bonaire, van Sint Eustatius en Saba gezamenlijk overleggen ten minste een keer
      per twee maanden met de korpschef, de hoofdofficier van justitie en de procureur-generaal over de taakuitvoering
      door de politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Er is een gemeenschappelijke voorziening politie van Curaçao, Sint Maarten en Nederland.

      2 Door middel van de gemeenschappelijke voorziening politie worden ambtenaren van politie, materieel en
      middelen beschikbaar gesteld aan de korpsen voor de uitvoering van in ieder geval de onderzoeken, bedoeld in
      [artikel 8, eerste lid, onder a tot en met c][ref1], overeenkomstig de daartoe in het jaarplan, bedoeld in
      [artikel 32][ref2], gemaakte afspraken.

      3 In onderling overleg tussen Onze Ministers kunnen andere politietaken dan bedoeld in het tweede lid worden
      verricht door ambtenaren van politie die beschikbaar worden gesteld door middel van de gemeenschappelijke
      voorziening politie.

      4 De ambtenaren die op grond van het derde lid beschikbaar zijn gesteld aan een politiekorps worden in de
      desbetreffende onderdelen van dat korps te werk gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel32
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '32'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '21'
    text: |-
      1 Aan het hoofd van de gemeenschappelijke voorziening politie staat de directeur van de gemeenschappelijke
      voorziening politie.

      2 De directeur van de gemeenschappelijke voorziening politie voert het dagelijks beheer van de gemeenschappelijke
      voorziening politie. Hij is in het bijzonder belast met het bewaken van de doelgerichte inzet door de korpsen
      van de ambtenaren van politie, het materieel en de middelen die beschikbaar worden gesteld door middel van de
      gemeenschappelijke voorziening overeenkomstig de in het jaarplan van de gemeenschappelijke voorziening politie
      neergelegde afspraken.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel21
  - number: '22'
    text: |-
      De ambtenaar van politie die door de gemeenschappelijke voorziening politie wordt beschikbaar gesteld aan een
      politiekorps voert zijn werkzaamheden in dat korps uit onder leiding van de korpschef.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel22
  - number: '23'
    text: |-
      1 De korpschef rapporteert viermaandelijks aan Onze Minister en de procureur-generaal over de inzet en resultaten
      van ambtenaren van politie die door middel van de gemeenschappelijke voorziening politie aan het korps beschikbaar
      zijn gesteld. Afschrift van de rapportage wordt gezonden aan de directeur van de gemeenschappelijke voorziening
      politie.

      2 De directeur van de gemeenschappelijke voorziening politie rapporteert viermaandelijks aan Onze Ministers en aan
      de procureur-generaal over de inzet en resultaten van de ambtenaren van politie die aan het korps beschikbaar zijn
      gesteld door middel van de gemeenschappelijke voorziening politie. Afschrift van de rapportage wordt gezonden aan
      de korpschef.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel23
  - number: '24'
    text: |-
      1 Een geschil tussen de korpschef en de directeur van de gemeenschappelijk voorziening politie over de inzet van
      ambtenaren van politie die beschikbaar zijn gesteld door middel van de gemeenschappelijke voorziening politie aan
      het politiekorps wordt voorgelegd aan de procureur-generaal.

      2 De procureur-generaal tracht het geschil te beslechten. Als dat niet lukt legt de procureur-generaal het geschil
      ter beslissing voor aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel24
  - number: '25'
    text: |-
      De procureur-generaal kan voor de strafrechtelijke handhaving van de rechtsorde of voor het verrichten van taken
      ten dienste van justitie in bijzondere gevallen medewerking vorderen van de gemeenschappelijke voorziening politie,
      zo nodig in afwijking van het jaarplan van de gemeenschappelijke voorziening politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel25
  - number: '26'
    text: |-
      Bij onderlinge regeling als bedoeld in [artikel 38 van het Statuut][ref1] kan worden bepaald dat door middel van
      de gemeenschappelijke voorziening politie ondersteunende en specialistische diensten aan de politiekorpsen van de
      landen ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
  - number: '27'
    text: |-
      De directeur van de gemeenschappelijke voorziening politie

      a. bewaakt en bevordert de kwaliteit en integriteit van ambtenaren van politie die beschikbaar zijn gesteld door
      middel van de gemeenschappelijke voorziening politie en draagt zorg voor hun opleiding en training met inachtneming
      van de op grond van [artikel 41][ref1] gestelde regels;

      b. draagt zorg voor de uitrusting met inachtneming van de op grond van [artikel 42][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel42
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '41'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '42'
        hoofdstuk: '6'
  - number: '28'
    text: |-
      Op de behandeling van klachten over gedragingen van ambtenaren die beschikbaar worden gesteld door middel van de
      gemeenschappelijke voorziening politie zijn de regels, bedoeld in [artikel 43][ref1], van het land van het korps
      waaraan ze beschikbaar worden gesteld van toepassing, met dien verstande dat:

      a. een klacht wordt ingediend bij de korpschef van het korps waarin betrokkene werkzaam is of bij de directeur van
      de gemeenschappelijke voorziening politie.

      b. de korpschef en de directeur van de gemeenschappelijke voorziening politie elkaar onverwijld op de hoogte
      stellen van een ingediende klacht.

      c. de directeur van de gemeenschappelijke voorziening politie in de gelegenheid wordt gesteld om over de klacht
      advies uit te brengen aan degene die bevoegd is op de klacht te beslissen en een afschrift ontvangt van de
      beslissing op de klacht.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel43
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '43'
        hoofdstuk: '6'
  - number: '29'
    text: |-
      1 De directeur van de gemeenschappelijke voorziening politie wordt benoemd, bevorderd, geschorst en ontslagen bij
      besluit van Onze Ministers, gehoord de procureur-generaal en de korpschefs.

      2 Op de directeur van de gemeenschappelijke voorziening politie is de wettelijke regeling inzake
      vertrouwensfuncties en veiligheidsonderzoeken van het land waarvan hij ingezetene is, van toepassing. Onze
      Ministers kunnen beslissen dat de wettelijke regeling inzake vertrouwensfuncties en veiligheidsonderzoeken van
      een van de andere landen van toepassing is, indien het desbetreffende land geen wettelijke regeling als hiervoor
      bedoeld heeft.

      3 Onze Ministers dragen zorg voor openbaarmaking van de vacature voor de functie van directeur van de
      gemeenschappelijke voorziening politie.

      4 Het aanstellingsbesluit van de directeur van de gemeenschappelijke voorziening politie bepaalt het land van
      zijn aanstelling. Op hem zijn de rechtspositieregels van ambtenaren van politie van het land van aanstelling van
      toepassing.

      5 De overige ambtenaren van politie werkzaam via de gemeenschappelijke voorziening politie, worden beschikbaar
      gesteld door de landen overeenkomstig de daartoe in de raad van ministers van het Koninkrijk gemaakte afspraken. Op
      hen zijn de rechtspositieregels voor ambtenaren van politie van het land dat hen beschikbaar stelt van toepassing.

      6 Onze Ministers maken afspraken over de uitzend- en detacheringsvoorwaarden van ambtenaren van politie die
      beschikbaar worden gesteld aan de gemeenschappelijke voorziening politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel29
  - number: '30'
    text: |-
      1 De procureur-generaal, de hoofdofficieren van justitie, de korpschefs van Curaçao, Sint Maarten en van Bonaire,
      Sint Eustatius en Saba en de directeur van de gemeenschappelijke voorziening politie voeren ten minste een keer
      per twee maanden overleg over de bestrijding van de grensoverschrijdende criminaliteit en van de misdrijven, die
      gezien de ernst of frequentie dan wel het georganiseerd verband waarin ze worden gepleegd een ernstige inbreuk op
      de rechtsorde maken.

      2 Ten minste een keer per jaar nemen Onze Ministers deel aan dit overleg.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel30
  - number: '31'
    text: |-
      Onze Ministers oefenen wat het beheer betreft, het bevoegde gezag uit over de gemeenschappelijke voorziening
      politie en kunnen terzake de nodige aanwijzingen geven aan de directeur van de gemeenschappelijke voorziening
      politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel31
  - number: '32'
    text: |-
      1 De directeur van de gemeenschappelijke voorziening politie stelt voor 15 maart van het aan het begrotingsjaar
      voorafgaande jaar een ontwerpjaarplan met een daarbij behorende ontwerpbegroting op na overleg met de korpschefs en
      de hoofdofficieren van justitie en in overeenstemming met de procureur-generaal. De ontwerpbegroting gaat vergezeld
      van een meerjarenraming voor ten minste vier op het begrotingsjaar volgende jaren. Hij zendt de ontwerpbegroting en
      het ontwerpjaarplan toe aan Onze Ministers.

      2 Aan het ontwerpjaarplan liggen de jaarplannen van de openbare ministeries van de landen, de jaarplannen van
      de politiekorpsen en het beleidsprogramma voor de bestrijding van grensoverschrijdende criminaliteit, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________ ten grondslag. Daarbij wordt rekening gehouden met de analyse van het criminaliteitsbeeld
      van de landen dat tweejaarlijks wordt opgesteld onder verantwoordelijkheid van de procureur-generaal.

      3 Het jaarplan bevat in ieder geval:

      a. een overzicht van de vervolging- en opsporingsactiviteiten van de landen waarvoor ambtenaren van politie,
      materieel en middelen via de gemeenschappelijke voorziening worden ingezet;

      b. de daartoe noodzakelijke capaciteit en de aard van de capaciteit van de gemeenschappelijke voorziening;

      c. de inzet van ambtenaren van politie, middelen en materieel via de gemeenschappelijke voorziening in de
      onderscheiden politiekorpsen van de landen;

      d. een overzicht van de met de onder c bedoelde inzet te behalen resultaten;

      e. een opleidings- en trainingsplan voor de ambtenaren van politie die beschikbaar worden gesteld door middel van
      de gemeenschappelijke voorziening politie.

      4 Onze Ministers voeren jaarlijks voor 15 april overleg over het ontwerpjaarplan en de ontwerpbegroting. Indien
      de in het eerste lid bedoelde overeenstemming niet kan worden bereikt, legt de directeur van de gemeenschappelijke
      voorziening politie de verschillen in zienswijze schriftelijk vast. Onze Ministers beslissen daarop gehoord de
      procureur-generaal.

      5 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister van Justitie
      van Nederland, draagt er voor zorg dat de ontwerpbegroting na onderlinge overeenstemming daarover van Onze
      Ministers ter vaststelling wordt ingediend bij de raad van ministers van het Koninkrijk. Bij de ontwerpbegroting
      wordt het ontwerpjaarplan gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028072#Artikel34
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0028072
        artikel: '34'
  - number: '33'
    text: |-
      1 De raad van ministers van het Koninkrijk stelt de begroting van de gemeenschappelijke voorziening politie vast.

      2 Onze Ministers stellen het jaarplan van de gemeenschappelijke voorziening politie vast met inachtneming van de in
      het eerste lid bedoelde begroting.

      3 De landen dragen gezamenlijk ieder ten laste van de eigen begroting de financiële middelen bij ten behoeve
      van de gemeenschappelijke voorziening politie overeenkomstig de besluitvorming in de raad van ministers van het
      Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel33
  - number: '34'
    text: |-
      1 De procureur-generaal ziet toe op de uitvoering van het jaarplan van de gemeenschappelijke voorziening politie,
      voor zover dat betrekking heeft op de strafrechtelijke handhaving van de rechtsorde.

      2 Onze Ministers zien toe op de uitvoering van de overige delen van het jaarplan en op het in acht nemen van de
      begroting.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel34
  - number: '35'
    text: |-
      1 De directeur van de gemeenschappelijke voorziening politie dient jaarlijks voor 1 april bij Onze Ministers een
      jaarverslag in over de gemeenschappelijke voorziening politie. Het jaarverslag bevat een verantwoording over de
      activiteiten, de doelstellingen en de prestatieafspraken zoals neergelegd in het jaarplan. Het jaarverslag bevat
      tevens de jaarrekening met bijbehorende begroting en overige financiële gegevens van het daaraan voorafgaande jaar.

      2 Het jaarverslag gaat vergezeld van een verklaring omtrent de getrouwheid afgegeven door een door de directeur van
      de gemeenschappelijke voorziening politie in overeenstemming met Onze Ministers aangewezen accountant.

      3 Bij de aanwijzing van de accountant bedingt de directeur van de gemeenschappelijke voorziening politie dat
      aan Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten en Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties desgevraagd inzicht wordt geboden in de controlewerkzaamheden van de
      accountant.

      4 Over het toezicht op de gemeenschappelijke voorziening politie treden de Algemene Rekenkamers van de landen met
      elkaar in overleg.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel35
  - number: '36'
    text: |-
      1 De korpschefs van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba voeren regelmatig overleg.

      2 Ten minste vier keer per jaar neemt de directeur van de gemeenschappelijke voorziening politie op uitnodiging van
      de korpschefs deel aan dit overleg.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel36
  - number: '37'
    text: |-
      1 Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten, Onze Minister van Justitie
      van Nederland en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voeren regelmatig overleg over de
      politie.

      2 Onze Ministers maken na overleg met de korpschefs afspraken over samenwerking tussen de korpsen.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel37
  - number: '38'
    text: |-
      1 Indien een politiekorps bijstand behoeft voor de handhaving van de openbare orde en het verlenen van hulp aan
      hen die deze behoeven, richt Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten
      respectievelijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties op aanvraag van de gezaghebber, na
      overleg met de korpschef, een verzoek daartoe aan het bevoegd gezag van het politiekorps van een van de andere
      landen, dat daarop beslist.

      2 Indien een politiekorps bijstand behoeft voor de strafrechtelijke handhaving van de rechtsorde of voor het
      verrichten van taken ten dienste van de justitie, richt de hoofdofficier van justitie na overleg met de korpschef,
      een verzoek daartoe aan de procureur-generaal.

      3 Het verzoek om bijstand voor de strafrechtelijke handhaving van de rechtsorde wordt gedaan door Onze Minister van
      Justitie van het desbetreffende land aan Onze Minister van Justitie van een van de andere landen. Onze Minister van
      Justitie van het land waartoe het verzoek zich richt beslist op dat verzoek na overleg met de procureur-generaal,
      gehoord de korpschef.

      4 Een verzoek om bijstand wordt slechts geweigerd na overleg met degene die het verzoek heeft gedaan, indien:

      a. de gevraagde capaciteit niet beschikbaar is;

      b. de gevraagde bijstand niet binnen de gevraagde termijn kan worden geleverd of

      c. in redelijkheid de bijstand niet kan worden verleend.

      5 Van een weigering een verzoek om bijstand in te willigen wordt degene die om bijstand verzocht onverwijld
      schriftelijk en gemotiveerd in kennis gesteld.

      6 De bijstand wordt beëindigd

      a. op het daartoe afgesproken tijdstip,

      b. zodra de reden waarom bijstand werd verzocht vervalt of

      c. indien voortzetting van de bijstand in strijd is met het belang van het land dat de bijstand verleent.

      7 Beëindiging van de bijstand op grond van het zesde lid, onder b en c, vindt pas plaats na overleg met degene die
      om bijstand verzocht.

      8 Onze Ministers maken afspraken over de vergoeding van de kosten van onderlinge bijstand.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel38
  - number: '39'
    text: |-
      1 Politiegegevens worden indien dat noodzakelijk is voor een goede uitoefening van de politietaken en met
      inachtneming van de daarvoor geldende voorschriften uitgewisseld tussen de politie van Curaçao, van Sint Maarten en
      van Bonaire, Sint Eustatius en Saba.

      2 De landen treffen met het oog op de uitwisselbaarheid van politiegegevens een onderlinge regeling over de wijze
      waarop politiegegevens worden verwerkt, daaronder begrepen de schrijfwijze en de classificatie van gegevens en de
      wijze van vermelding van de herkomst van gegevens. Elk van de landen treft regels met het oog op de uitwisseling
      van politiegegevens met inachtneming van de onderlinge regeling.

      3 De politiekorpsen registreren gegevens voor door Onze Ministers te bepalen doeleinden en door hen te bepalen
      categorieën.

      4

      5
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel39
  - number: '40'
    text: De landen voorzien gezamenlijk in politieonderwijs.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel40
  - number: '41'
    text: |-
      1 De landen treffen onderling een regeling die kwaliteitscriteria en opleidings- en trainingsvereisten voor
      ambtenaren van politie bevat. Deze kwaliteitscriteria en opleidings- en trainingsvereisten worden in elk van de
      landen vastgesteld bij landsbesluit, houdende algemene maatregelen, respectievelijk algemene maatregel van bestuur.

      2 Elk van de landen kan bij of krachtens landsbesluit, houdende algemene maatregelen respectievelijk bij of
      krachtens algemene maatregel van bestuur aanvullende kwaliteitscriteria en opleidings- en trainingsvereisten
      stellen voor de ambtenaren van politie van het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel41
  - number: '42'
    text: |-
      1 De landen treffen onderling een regeling houdende regels voor de uitrusting van ambtenaren van politie. Deze
      regels worden in elk van de landen vastgesteld bij landsbesluit, houdende algemene maatregelen, of algemene
      maatregel van bestuur.

      2 Elk van de landen kan bij of krachtens landsbesluit, houdende algemene maatregelen, of bij of krachtens algemene
      maatregel van bestuur aanvullende regels over de uitrusting van ambtenaren van politie van het politiekorps
      stellen.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel42
  - number: '43'
    text: |-
      Bij of krachtens landsverordening of bij of krachtens wet stellen de landen regels voor de behandeling van klachten
      over gedragingen van ambtenaren van politie van het politiekorps en van buitengewone agenten van politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel43
  - number: '44'
    text: |-
      1 De korpschefs van het politiekorps van Curaçao en van het politiekorps van Sint Maarten worden benoemd, geschorst
      en ontslagen bij landbesluit op voordracht van Onze Minister van Justitie van Curaçao respectievelijk Onze Minister
      van Justitie van Sint Maarten, gehoord de procureur-generaal.

      2 De korpschef van het politiekorps van Bonaire, Sint Eustatius en Saba wordt benoemd, geschorst en ontslagen
      bij koninklijk besluit op voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met Onze Minister van Justitie van Nederland, gehoord de procureur-generaal.

      3 De functie van korpschef wordt aangemerkt als een vertrouwensfunctie als bedoeld in de wettelijke regeling inzake
      vertrouwensfuncties en veiligheidsonderzoeken van het land van aanstelling.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel44
  - number: '45'
    text: |-
      1 Bij landsverordening of wet wijzen de landen het gezag aan dat bevoegd is tot aanstelling, bevordering, schorsing
      en ontslag van ambtenaren van politie.

      2 Het tot aanstelling bevoegd gezag van ambtenaren van politie:

      a. voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in ieder geval
      aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van bevoegdheden,
      belangenverstrengeling en discriminatie;

      b. zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder geval door
      integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van scholing en
      vorming op het gebied van integriteit;

      c. draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen.

      3 De gedragscode bevat in ieder geval regels over:

      a. financiële belangen;

      b. het aannemen van giften en geschenken;

      c. het doen van beloftes en toezeggingen;

      d. nevenfuncties;

      e. de omgang met vertrouwelijke informatie;

      f. functiegerelateerde uitgaven en declaraties;

      g. gebruik van publieke voorzieningen.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel45
  - number: '46'
    text: |-
      1 De landen treffen onderling een regeling houdende een limitatieve opsomming van de hoofdrangen voor de politie.
      Deze hoofdrangen worden in elk van de landen vastgesteld bij landsbesluit, houdende algemene maatregelen,
      respectievelijk algemene maatregel van bestuur.

      2 Elk van de landen kan bij of krachtens landsbesluit, houdende algemene maatregelen, of algemene maatregel van
      bestuur subrangen voor ambtenaren van politie van het politiekorps vaststellen.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel46
  - number: '47'
    text: |-
      1 Onze Minister van Justitie van Curaçao oefent wat het beheer betreft, het bevoegde gezag uit over het
      politiekorps van Curaçao en kan terzake de nodige aanwijzingen geven aan de korpschef van dit politiekorps.

      2 Onze Minister van Justitie van Sint Maarten oefent wat het beheer betreft, het bevoegde gezag uit over het
      politiekorps van Sint Maarten en kan terzake de nodige aanwijzingen geven aan de korpschef van dit politiekorps.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties oefent wat het beheer betreft, het bevoegde gezag
      uit over het politiekorps van Bonaire, Sint Eustatius en Saba en kan terzake de nodige aanwijzingen geven aan de
      korpschef van dit politiekorps.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel47
  - number: '48'
    text: |-
      1 De korpschef stelt jaarlijks in overeenstemming met de procureur-generaal en met inachtneming van de aanwijzingen
      van de korpsbeheerder een ontwerpjaarplan voor het politiekorps op met een daarbij behorende ontwerpbegroting.

      2 Aanwijzingen als bedoeld in het eerste lid aan de korpschef van het politiekorps van Bonaire, Sint Eustatius en
      Saba die verband houden met de strafrechtelijke rechtshandhaving van de rechtsorde of de vervulling van taken ten
      dienste van de justitie worden gegeven in overeenstemming met Onze Minister van Justitie van Nederland.

      3 De korpschefs van Curaçao en van Sint Maarten zenden het ontwerpjaarplan en de ontwerpbegroting ter vaststelling
      toe aan Onze Minister van Justitie van Curaçao respectievelijk Onze Minister van Justitie van Sint Maarten.
      Indien de in het eerste lid vereiste overeenstemming niet kan worden bereikt, legt de korpschef de verschillen in
      zienswijze schriftelijk vast. Onze Minister van Justitie van Curaçao respectievelijk Onze Minister van Justitie van
      Sint Maarten beslist daarop gehoord de procureur-generaal.

      4 De korpschef van Bonaire, Sint Eustatius en Saba zendt de ontwerpbegroting ter vaststelling toe aan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties en het ontwerpjaarplan aan Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Justitie van Nederland. De tweede volzin van het derde lid is van
      overeenkomstige toepassing.

      5 De korpsbeheerder overlegt regelmatig met de procureur-generaal en de korpschef over het beheer van de politie.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel48
  - number: '49'
    text: |-
      Onze Minister stelt de minimale sterkte van de politie van zijn land vast overeenkomstig de bij algemene maatregel
      van rijksbestuur in de zin van [artikel 38, tweede lid, van het Statuut][ref1] vastgestelde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel38
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '38'
  - number: '50'
    text: |-
      1 De korpsbeheerder draagt zorg voor de kwaliteit van de taakuitoefening, de resultaten en het beheer van het
      politiekorps.

      2 De korpsbeheerder draagt zorg voor regelmatige evaluatie van de kwaliteit. Hij maakt daarbij in ieder geval
      gebruik van systematische zelfevaluaties en onafhankelijke visitaties.

      3 De landen treffen onderling een regeling houdende regels voor de kwaliteitszorg en de evaluatie daarvan.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel50
  - number: '51'
    text: |-
      1 Bij of krachtens landsverordening kunnen nadere regels worden gesteld over het financieel beheer, de financiële
      verantwoording en verslaglegging van het politiekorps van Curaçao respectievelijk het politiekorps van Sint
      Maarten.

      2 Bij of krachtens wet kunnen nadere regels worden gesteld over het financieel beheer, de financiële verantwoording
      en verslaglegging van het politiekorps van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel51
  - number: '52'
    text: |-
      Indien de samenwerking, vastgelegd bij of krachtens deze rijkswet, niet of onvoldoende tot stand komt, kan vanwege
      het Koninkrijk, gehoord de betrokken landen, bij algemene maatregel van rijksbestuur een voorziening worden
      getroffen overeenkomstig [artikel 51 van het Statuut][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel51
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '51'
  - number: '53'
    text: |-
      Elk van de landen draagt ervoor zorg dat de landsbesluiten, houdende algemene maatregelen en de
      algemene maatregelen van bestuur die het land treft op grond van [artikel 10, vierde lid][ref1],
      [artikel 14, eerste en tweede lid][ref2], [artikel 41, eerste lid][ref3], [artikel 42, eerste lid][ref4], artikel
      en [46, eerste lid][ref5], in werking treden op het tijdstip van inwerkingtreding van de [artikelen I][ref6] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref7].


