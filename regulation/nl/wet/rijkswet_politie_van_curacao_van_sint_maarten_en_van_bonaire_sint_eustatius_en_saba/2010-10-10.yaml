preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de regeringen van Nederland en de Nederlandse Antillen en de
    bestuurscolleges van Curaçao en Sint Maarten binnen het Koninkrijk willen samenwerken door de inrichting, de
    organisatie, het gezag en het beheer van de politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en
    Saba en de onderlinge samenwerking tussen de politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius
    en Saba te regelen bij of krachtens een rijkswet op grond van artikel 38, tweede lid, van het Statuut voor het
    Koninkrijk der Nederlanden, dat de Minister van Justitie van Curaçao en de Minister van Justitie van Sint Maarten
    verantwoordelijk zijn voor de politie van hun land en daarover verantwoording afleggen in de Staten van hun land
    en dat de regeringen van Nederland en de Nederlandse Antillen en de bestuurscolleges van Curaçao en Sint Maarten
    instemmen met de inhoud van deze regeling;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze rijkswet en de daarop berustende bepalingen wordt verstaan onder:

        - *ambtsinstructie:* ambtsinstructie als bedoeld in [artikel 14][ref1];
        - *gezaghebber:* gezaghebber van Bonaire, van Sint Eustatius of van Saba;
        - *directeur van de gemeenschappelijke voorziening politie:* directeur van de gemeenschappelijke voorziening
      politie als bedoeld in [artikel 21, eerste lid][ref2];
        - *korpsbeheerder:* degene die op grond van [artikel 47][ref3] wat betreft het beheer het bevoegd gezag uitoefent
      over het politiekorps;
        - *gemeenschappelijke voorziening politie:* gemeenschappelijke voorziening politie als bedoeld in
      [artikel 20, eerste lid][ref4];
        - *korpschef:* korpschef als bedoeld in [artikel 6][ref5];
        - *landen:* Curaçao, Sint Maarten en Nederland, voor zover het Bonaire, Sint Eustatius en Saba betreft;
        - *Onze Minister:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten of Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in overeenstemming met Onze Minister van Justitie van
      Nederland.
        - *Onze Ministers:* Onze Minister van Justitie van Curaçao, Onze Minister van Justitie van Sint Maarten, Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie van Nederland gezamenlijk;
        - *politiegegeven:* elk gegeven betreffende een geïdentificeerde of identificeerbare natuurlijke persoon dat in het
      kader van de uitoefening van de politietaak overeenkomstig de wetgeving van de landen wordt verwerkt;
        - *politietaak:* taken, bedoeld in [artikel 5][ref6];
        - *procureur-generaal:* procureur-generaal als bedoeld in
      __REF006___________________________________________________________________________________________________________
      ______________________;
        - *Statuut:* [Statuut voor het Koninkrijk][ref8];
        - *taken ten dienste van de justitie:* 1°. de uitvoering van wettelijke voorschriften waarmee Onze Minister van
      Justitie van Nederland is belast; 2°. de betekening van gerechtelijke mededelingen in strafzaken, het vervoer van
      rechtens van hun vrijheid beroofde personen, en de dienst bij de gerechten.

      2 In deze wet en de daarop berustende bepalingen wordt onder de strafrechtelijke handhaving van de rechtsorde mede
      verstaan: het waken voor de veiligheid van personen.


