  - number: '54'
    text: |-
      1 Voor Nederland, voor zover het Bonaire, Sint Eustatius en Saba betreft, wordt de voordracht van de algemene
      maatregel van bestuur, bedoeld in:

      a. de [artikelen 41, eerste en tweede lid][ref1], [42, eerste en tweede lid][ref2], en
      [46, eerste en tweede lid][ref3], gedaan door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      b. de [artikelen 3, tweede lid][ref4], en [10, vijfde lid][ref5], gedaan door Onze Minister van Justitie van
      Nederland en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      c. de [artikelen 14, eerste en tweede lid][ref6], en [39, tweede lid][ref7], gedaan door Onze Minister van Justitie
      van Nederland en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in overeenstemming met Onze Minister
      van Defensie voor zover het de Koninklijke marechaussee betreft;

      d. [artikel 10, vierde lid][ref8], gedaan door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met Onze Minister van Justitie van Nederland.

      2 Voor zover de algemene maatregel van bestuur, bedoeld in [artikel 41, eerste en tweede lid][ref9], mede
      betrekking heeft op specifieke vaardigheid of kennis in verband met de werkzaamheden ten behoeve van de
      strafrechtelijke handhaving van de rechtsorde en de taken ten dienste van de justitie, vindt de voordracht plaats
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister van Justitie van Nederland.


