  - number: '9'
    text: |-
      1 De procureur-generaal beschikt in elk van de landen over een recherche die hij kan belasten met onderzoeken
      naar feiten of gedragingen die de integriteit van de overheid van de landen kunnen aantasten en zijn begaan door
      natuurlijke personen of rechtspersonen belast met een publieke taak, of betrokken bij de uitvoering daarvan.

      2 Het hoofd van de recherche van Curaçao en Sint Maarten wordt benoemd bij landsbesluit op voordracht van de
      procureur-generaal.

      3 Op Bonaire, Sint Eustatius en Saba verricht de rijksrecherche de recherchewerkzaamheden, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister kan buitengewone agenten van politie aanstellen, bevorderen, schorsen en ontslaan.

      2 De buitengewoon agent van politie beschikt over de bevoegdheden, bedoeld in [artikel 13][ref1] voor zover dat in
      zijn aanstellingsbesluit is bepaald. De ambtsinstructie is van toepassing.

      3 Het tweede lid is niet van toepassing op degenen die op grond van de
      [Rijkswet Kustwacht voor de Nederlandse Antillen en Aruba][ref2] bevoegd zijn om in de rechtmatige uitoefening van
      bevoegdheden ter uitvoering van de taken van de Kustwacht, geweld te gebruiken.

      4 De landen stellen bij of krachtens landsbesluit, houdende algemene maatregelen, respectievelijk bij of krachtens
      algemene maatregel van bestuur regels over de aanstelling, bevordering, schorsing en het ontslag als buitengewone
      agenten van politie alsmede over de eisen van bekwaamheid, geschiktheid en betrouwbaarheid waaraan zij moeten
      voldoen. Zij nemen daarbij de onderlinge regeling, bedoeld in [artikel 41, eerste lid][ref3], in acht.

      5 De landen kunnen bij of krachtens landsbesluit, houdende algemene maatregelen, respectievelijk bij of krachtens
      algemene maatregel van bestuur de taken regelen van buitengewone agenten van politie.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0023731
      [ref3]: https://wetten.overheid.nl/BWBR0028079#Artikel41
