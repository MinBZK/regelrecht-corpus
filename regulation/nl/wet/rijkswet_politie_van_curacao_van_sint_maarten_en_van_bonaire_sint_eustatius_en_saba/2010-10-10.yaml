  - number: '58'
    text: |-
      1 Deze rijkswet treedt in werking op het tijdstip waarop de [artikelen I][ref1] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref2] in werking
      treedt, met uitzondering van [artikel 39, vierde en vijfde lid][ref3].

      2 Bij koninklijk besluit wordt het tijdstip vastgesteld waarop [artikel 39, vierde lid][ref4], respectievelijk
      [artikel 39, vijfde lid][ref5], in werking treedt. Dit tijdstip is gelegen op het moment dat de bescherming van
      persoonsgegevens in Curaçao en Sint Maarten afdoende is geregeld.

      3 [Artikel 57a][ref6] vervalt op een bij koninklijk besluit te bepalen tijdstip. De voordracht voor het koninklijk
      besluit wordt niet eerder gedaan dan acht weken nadat het ontwerp aan beide kamers der Staten-Generaal, de Staten
      van Curaçao en de Staten van Sint Maarten is overgelegd.


