        artikel: '39'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 57a
    text: |-
      1 In de landen is het protocol inzake gespecialiseerde recherchesamenwerking tussen de landen van het Koninkrijk
      van 30 november 2001 van overeenkomstige toepassing, met dien verstande dat:

      a. in plaats van de korpschef van het Korps Landelijke Politiediensten, de teamchef en de directeur van de
      gemeenschappelijke voorziening politie deel uitmaken van de adviesgroep;

      b. Nederland, Curaçao en Sint Maarten er zorg voor dragen dat de personele inzet van elk van de landen ten behoeve
      van het recherchesamenwerkingsteam evenredig is.

      2 De door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties aangewezen ambtenaren die deel uitmaken van
      het recherchesamenwerkingsteam beschikken in elk van de landen over de bevoegdheden, bedoeld in [artikel 13][ref1].
      De ambtsinstructie is van toepassing.

      3 Het recherchesamenwerkingsteam heeft uitsluitend tot taak zorg te dragen voor het verrichten van de onderzoeken,
      bedoeld in [artikel 8, eerste lid][ref2]. De ambtenaren, bedoeld in het tweede lid, zijn in elk van de landen
      bevoegd tot de opsporing van strafbare feiten, met inachtneming van de wettelijke voorschriften van de landen.

      4 Onverminderd het eerste tot en met derde lid kunnen de landen in onderling overleg wijzigingen in het protocol
      aanbrengen.

      5 Vier jaar na de inwerkingtreding van deze rijkswet en daarna na twee jaar beoordelen Onze Ministers of de korpsen
      van de landen voldoende in staat zijn invulling te geven aan [artikel 8, derde lid][ref3], aan de hand van daartoe
      door Onze Ministers vastgestelde objectieve criteria.

      6 Indien na toepassing van het vijfde lid naar het oordeel van Onze Ministers de landen nog niet voldoende in
      staat zijn invulling te geven aan [artikel 8, derde lid][ref4], wordt een voorziening getroffen als bedoeld in
      [artikel 52][ref5].

      7 De [artikelen 8, derde en vierde lid][ref6], [artikel 20, tweede lid][ref7], en [artikel 30][ref8] blijven buiten
      toepassing.


