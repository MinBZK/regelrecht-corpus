        artikel: '155'
  - number: '14'
    text: |-
      1 De landen treffen onderling een regeling houdende een ambtsinstructie voor de politie, die regels bevat ter
      uitvoering van de [artikelen 12][ref1] en [13][ref2].

      2 Elk van de landen stelt bij landsbesluit, houdende algemene maatregelen, of bij algemene maatregel van bestuur
      regels vast ter uitvoering van de [artikelen 12][ref3] en [13][ref4], waarbij in ieder geval de regeling, bedoeld
      in het eerste lid, wordt opgenomen.

      3 Elk van de landen stelt bij of krachtens landsbesluit, houdende algemene maatregelen, of bij of krachtens
      algemene maatregel van bestuur regels waaraan rechtens van hun vrijheid beroofde personen met het oog op hun
      insluiting kunnen worden onderworpen, voor zover dit noodzakelijk is in het belang van hun veiligheid of de
      veiligheid van anderen.


