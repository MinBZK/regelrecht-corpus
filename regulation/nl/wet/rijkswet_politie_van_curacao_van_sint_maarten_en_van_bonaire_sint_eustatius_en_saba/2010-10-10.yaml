  - number: '12'
    text: |-
      1 De ambtenaren van politie aangesteld voor de uitvoering van de politietaak in een van de landen zijn bevoegd hun
      taak uit te oefenen in elk van de landen.

      2 De ambtenaren van politie werkzaam voor een politiekorps onthouden zich van optreden buiten hun gebied van
      aanstelling tenzij het bevoegde gezag hiertoe opdracht of toestemming geeft.
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel12
  - number: '13'
    text: |-
      1 De ambtenaar van politie aangesteld voor de uitvoering van de politietaak, is bevoegd in de rechtmatige
      uitoefening van zijn taak geweld te gebruiken tegen personen en goederen of vrijheidsbeperkende beperkende middelen
      te gebruiken tegen personen, wanneer het daarmee beoogde doel dit, mede gelet op de hieraan verbonden gevaren,
      rechtvaardigt en dat doel niet op andere wijze kan worden bereikt. Aan het gebruik van geweld gaat zo mogelijk een
      waarschuwing vooraf.

      2 De ambtenaar van politie aangesteld voor de uitvoering van de politietaak, heeft toegang tot elke plaats, voor
      zover dat voor het verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.

      3 Voor zover de uitoefening van de bevoegdheid, bedoeld in het tweede lid, het binnentreden van een woning betreft,
      zijn de [artikelen 155 tot en met 163 van het Wetboek van Strafvordering][ref1] van het desbetreffende land van
      overeenkomstige toepassing, met dien verstande dat indien de naleving van de verplichtingen in die artikelen naar
      redelijke verwachting ernstig en onmiddellijk gevaar oplevert voor de veiligheid van personen of goederen dan wel
      feitelijk onmogelijk is, deze verplichtingen slechts gelden voor zover de naleving daarvan in die omstandigheden
      kan worden gevergd.

      4 De ambtenaar van politie aangesteld voor de uitvoering van de politietaak, is bevoegd tot het onderzoek aan
      de kleding van personen bij de uitoefening van een hem wettelijk toegekende bevoegdheid of bij een handeling ter
      uitvoering van de politietaak, indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor
      hun leven of veiligheid, die van de ambtenaar zelf of van derden en dit onderzoek noodzakelijk is ter afwending van
      dit gevaar.

      5 De officier van justitie voor wie aangehouden of rechtens van hun vrijheid beroofde verdachten of veroordeelden
      worden geleid, is bevoegd te bepalen dat deze aan hun lichaam zullen worden onderzocht, indien uit feiten of
      omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid, die van de ambtenaar zelf of
      van derden en dit onderzoek noodzakelijk is ter afwending van dit gevaar.

      6 De uitoefening van bevoegdheden, bedoeld in het eerste tot en met het vierde lid, dient in verhouding tot het
      beoogde doel redelijk en gematigd te zijn.

      7 De ambtenaar van politie aangesteld voor de uitvoering van de politietaak, is bevoegd tot het vorderen van inzage
      van een bij landsverordening of wet aangewezen identiteitsbewijs, voor zover dat redelijkerwijs noodzakelijk is
      voor de uitoefening van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel155
    url: https://wetten.overheid.nl/BWBR0028079/2010-10-10#Artikel13
    references:
      - id: ref1
