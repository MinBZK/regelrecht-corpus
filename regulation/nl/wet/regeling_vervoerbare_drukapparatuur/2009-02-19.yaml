  - number: '10'
    text: |-
      1 Een instantie die met toepassing van [artikel 9][ref1] wenst te worden aangemeld, overlegt daartoe aan de
      Minister:

      a. een bewijs van rechtspersoonlijkheid;

      b. een verklaring waarin de instantie ten genoegen van de Minister aantoont dat zij voldoet aan de bijlagen I en II
      bij de richtlijn;

      c. een bewijs van gevestigd zijn in de Europese Gemeenschap;

      d. een verklaring van een verzekeraar, dat de instantie verzekerd is tegen wettelijke aansprakelijkheid voor ten
      minste € 5.000.000 per gebeurtenis en voor ten minste € 10.000.000 per jaar.

      2 Het eerste lid, onderdeel d, is niet van toepassing op de Dienst Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0011832#Artikel9
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel10
    references:
