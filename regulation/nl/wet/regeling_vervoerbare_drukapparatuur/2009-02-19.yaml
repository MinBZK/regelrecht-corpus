        artikel: '10'
        paragraaf: '5'
  - number: '12'
    text: |-
      1 De Minister kan een instantie erkennen. De [artikelen 9, tweede en derde lid][ref1], [10][ref2],
      [10a][ref3] en [11][ref4] zijn van overeenkomstige toepassing, met dien verstande dat in
      [artikel 10, eerste lid, onderdeel b][ref5] en in [artikel 10a][ref6] in plaats van ‘II’ wordt gelezen: III

      2 Een erkende instantie werkt uitsluitend voor de organisatie waarvan zij deel uitmaakt.


