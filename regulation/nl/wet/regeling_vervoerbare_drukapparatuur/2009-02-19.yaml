preamble:
  text: |-
    Gelet op de richtlijn 1999/36/EG van de Raad van de Europese Unie van 29 april 1999 betreffende vervoerbare
    drukapparatuur (PbEG L 138), en artikel 2 van het Besluit vervoer gevaarlijke stoffen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *richtlijn:*


              [richtlijn 1999/36/EG](31999L0036) van de Raad van 29 april 1999 betreffende vervoerbare drukapparatuur
      (PbEG L 138);



            b

              *vervoerbare drukapparatuur:*


              vervoerbare drukapparatuur als bedoeld in artikel 2, eerste lid, van de richtlijn, te onderscheiden in
      recipiënten en tanks als bedoeld in randnummer 1.2.1 van het ADR;



            c

              *Commissie:*


              Commissie van de Europese Gemeenschappen;



            d

              *aangemelde instantie:*


              instantie, bedoeld in [artikel 9][ref1];



            e

              *erkende instantie:*


              instantie, bedoeld in [artikel 12][ref2];



            f

              *overeenstemmingsbeoordeling:*


              beoordeling als bedoeld in [artikel 4, eerste lid][ref3];



            g

              *hernieuwde overeenstemmingsbeoordeling:*


              hernieuwde overeenstemmingsbeoordeling als bedoeld in [artikel 7][ref4];



            h

              *ADR:*


              Accord Européen relatif au transport international des marchandises dangereuses par route, Genève 1957
      (Trb. 1959, 81);



            i

              *RID:*


              Règlement concernant le transport international ferroviaire des marchandises dangereuses (Trb. 1993, 15);



            j

              *richtlijn 84/525/EEG:*


              [richtlijn 84/525/EEG](31984L0525) van de Raad van 17 september 1984 betreffende de onderlinge aanpassing
      van de wetgevingen der Lid-Staten inzake naadloze stalen gasflessen (PbEG L 300);



            k

              *richtlijn 84/526/EEG:*


              [richtlijn 84/526/EEG](31984L0526) van de Raad van 17 september 1984 betreffende de onderlinge
      aanpassing van de wetgevingen der Lid-Staten inzake naadloze gasflessen van niet-gelegeerd aluminium en van een
      aluminiumlegering (PbEG L 300);



            l

              *richtlijn 84/527/EEG:*


              [richtlijn 84/527/EEG](31984L0527) van de Raad van 17 september 1984 betreffende de onderlinge aanpassing
      van de wetgevingen der Lid-Staten inzake gelaste gasflessen van ongelegeerd staal (PbEG L 300).



            m

              *richtlijn 94/55/EG:*


              [richtlijn 94/55/EG](31994L0055) van de Raad van de Europese Gemeenschappen van 21 november 1994
      betreffende de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het vervoer van gevaarlijke goederen
      over de weg (PbEG L 319);



            n

              *richtlijn 96/49/EG:*


              [richtlijn 96/49/EG](31996L0049) van de Raad van de Europese Gemeenschappen van 23 juli 1996 betreffende de
      onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het vervoer van gevaarlijke goederen per spoor (PbEG
      L 235);



            o

              *richtlijn 97/23/EG:*


              [richtlijn 97/23/EG](31997L0023) van het Europees Parlement en de Raad van 29 mei 1997 inzake de onderlinge
      aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur (PbEG L 181);



            p

              *Minister:*


              de Minister van Verkeer en Waterstaat.


