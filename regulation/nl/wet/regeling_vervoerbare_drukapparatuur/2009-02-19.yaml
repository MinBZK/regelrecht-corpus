  - number: '2'
    text: |-
      1 Het vervoer met een voertuig over de weg of per spoor van gevaarlijke stoffen in vervoerbare drukapparatuur die
      niet voldoet aan deze regeling is verboden.

      2 Behoudens het derde lid is zonder nadere beperking toegestaan het gebruik van vervoerbare drukapparatuur die:

      a. een markering draagt als bedoeld in artikel 10 van de richtlijn; of

      b. een gasfles betreft die is voorzien van de markering van overeenstemming, bedoeld in de [richtlijnen 84/525/EEG]
      (31984L0525), [84/526/EEG](31984L0526) of [84/527/EEG](31984L0527).

      3 De Minister kan het in de handel brengen, vervoeren of gebruiken van vervoerbare drukapparatuur verbieden, indien
      naar zijn oordeel het vervoer of gebruik ervan de gezondheid of veiligheid van mensen, huisdieren of goederen in
      gevaar dreigt te brengen. De Minister doet daarvan onverwijld mededeling aan de Commissie.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel2
  - number: '3'
    text: |-
      1 Deze regeling is niet van toepassing op vervoerbare drukapparatuur die uitsluitend wordt gebruikt voor
      vervoer van gevaarlijke goederen tussen het grondgebied van de Gemeenschap en het grondgebied van derde landen
      overeenkomstig de artikelen 6, eerste lid, en 7 van [richtlijn 94/55/EG](31994L0055) of de artikelen 6, eerste lid,
      en 7, eerste en tweede lid, van [richtlijn 96/49/EG](31996L0049).

      2 Deze regeling laat onverlet voorschriften met betrekking tot de voorzieningen voor aansluiting op andere
      apparatuur en de kleurencodes die van toepassing zijn op vervoerbare drukapparatuur.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel3
  - number: '4'
    text: |-
      1 Vervoerbare drukapparatuur alsmede de bijbehorende kranen en andere toebehoren worden slechts voor het eerst
      in de handel gebracht of in bedrijf gesteld, indien een aangemelde instantie heeft vastgesteld aan de hand van de
      procedures, bedoeld in bijlage IV, deel 1, en bijlage V bij de richtlijn, dat deze voldoet aan het ADR of het RID
      (overeenstemmingsbeoordeling).

      2 Vervoerbare drukapparatuur die voldoet aan het eerste lid, wordt voorzien van een markering als bedoeld in
      artikel 10, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel4
  - number: '5'
    text: |-
      1 In afwijking van [artikel 4][ref1] worden kranen en andere toebehoren die rechtstreeks dienen voor de veiligheid
      van vervoerbare drukapparatuur, in het bijzonder veiligheidskleppen, kranen voor het vullen en het legen, en kranen
      op flessen, onderworpen aan een overeenstemmingsbeoordeling van een niveau dat gelijk is aan of hoger dan het
      niveau voor de recipiënt of de tank waarop zij zijn gemonteerd.

      2 Indien het ADR of het RID geen specifieke technische bepalingen bevatten voor de kranen en toebehoren, bedoeld
      in het eerste lid, voldoen deze kranen en toebehoren aan de eisen van [Richtlijn 97/23/EG](31997L0023) en
      worden onderworpen aan een overeenstemmingsbeoordeling van categorie II, III of IV als bedoeld in artikel 10 van
      [Richtlijn 97/23/EG](31997L0023), afhankelijk van de vraag of de recipiënt of de tank valt onder categorie 1, 2 of
      3 als bedoeld in bijlage V bij de richtlijn.

      3 Op de kranen en andere toebehoren, bedoeld in het eerste lid, wordt de in bijlage VII of de in bijlage VI bij
      [Richtlijn 97/23/EG](31997L0023) bedoelde markering aangebracht. Deze markering hoeft niet vergezeld te gaan van
      het identificatienummer van de aangemelde instantie die de overeenstemmingsbeoordeling van de kranen en ander
      toebehoren gebruikt voor het vervoer, heeft uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011832#Artikel4
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel5
    references:
