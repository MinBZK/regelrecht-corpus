        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 In afwijking van de [artikelen 4][ref1] en [5][ref2] mag vervoerbare drukapparatuur waarvan een erkende
      instantie heeft vastgesteld dat deze voldoet aan het ADR of het RID, overeenkomstig zijn bestemming uitsluitend
      binnen Nederland in de handel worden gebracht, vervoerd of in gebruik worden genomen.

      2 De erkende instantie past voor de in het eerste lid bedoelde overeenstemmingsbeoordeling de procedures toe,
      bedoeld in bijlage IV, deel I, modulen A1, C1, F en G bij de richtlijn.

      3 De vervoerbare drukapparatuur die ingevolge dit artikel is beoordeeld, krijgt geen markering als bedoeld in
      artikel 10, eerste lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011832#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011832#Artikel5
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel6
