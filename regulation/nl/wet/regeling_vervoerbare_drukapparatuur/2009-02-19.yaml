  - number: '13'
    text: |-
      1 Het is verboden:

      a. markeringen aan te brengen die misleidend kunnen zijn wat de betekenis of grafische voorstelling betreft, dan
      wel anderszins niet in overeenstemming zijn met deze regeling; of

      b. de leesbaarheid of zichtbaarheid van de in artikel 10, eerste lid, van de richtlijn, bedoelde markeringen aan
      te tasten.

      2 Indien naar het oordeel van de Minister de markering in strijd met de richtlijn of deze regeling is aangebracht,
      kan hij verbieden de betrokken vervoerbare drukapparatuur in de handel te brengen, te vervoeren of te gebruiken.

      3 De Minister doet van toepassing van het tweede lid onverwijld mededeling aan de Commissie en de overige
      lidstaten.

      4 Alvorens toepassing te geven aan het tweede lid, kan de Minister de eigenaar, de fabrikant of zijn gemachtigde
      verplichten de apparatuur in overeenstemming te brengen met de voorschriften inzake markering.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel13
  - number: '14'
    text: |-
      1 Tot 1 juli 2003 mag:

      a. vervoerbare drukapparatuur die voldoet aan de regelgeving die van kracht is op 1 juli 2001, in de handel worden
      gebracht en in bedrijf worden gesteld;

      b. vóór 1 juli 2001 in de handel gebrachte vervoerbare drukapparatuur in bedrijf worden gesteld.

      2 Tot 1 juli 2005 is deze regeling niet van toepassing op drukvaten en flessenbatterijen als bedoeld in randnummer
      1.2.1 van het ADR.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel14
  - number: '15'
    text: |-
      1 Deze regeling treedt in werking op 1 juli 2001.

      2 Een wijziging van de richtlijn alsmede van de [richtlijnen 84/525/EEG](31984L0525), [84/526/EEG](31984L0526),
      [84/527/EEG](31984L0527), [94/55/EG](31994L0055), [96/49/EG](31996L0049) of [97/23/EG](31997L0023) gaat voor de
      toepassing van deze regeling gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel15
  - number: '16'
    text: 'Deze regeling wordt aangehaald als: Regeling vervoerbare drukapparatuur.'
