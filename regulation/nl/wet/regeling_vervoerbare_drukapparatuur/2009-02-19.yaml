  - number: '7'
    text: |-
      1 Van vervoerbare drukapparatuur die ten tijde van de inwerkingtreding van deze regeling reeds in gebruik was
      genomen, kan een aangemelde instantie vaststellen dat deze voldoet aan het ADR of het RID aan de hand van de
      procedure, bedoeld in bijlage IV, deel II, bij de richtlijn (hernieuwde overeenstemmingsbeoordeling).

      2 Voorzover de hernieuwde overeenstemmingsbeoordeling recipiënten betreft, met inbegrip van kranen en andere
      toebehoren, kan deze door een erkende instantie worden uitgevoerd, indien de betrokken vervoerbare drukapparatuur
      in serie is gefabriceerd en een aangemelde instantie heeft vastgesteld dat het betrokken type voldoet aan het ADR
      of het RID.

      3 De vervoerbare drukapparatuur die voldoet aan het eerste of tweede lid, wordt voorzien van een markering als
      bedoeld in artikel 10, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel7
  - number: '8'
    text: |-
      1 De in het ADR en het RID bedoelde periodieke keuring van recipiënten, met inbegrip van kranen en ander voor
      het vervoer gebruikt toebehoren, wordt aan de hand van de procedures van bijlage IV, deel III, bij de richtlijn
      uitgevoerd door een aangemelde of erkende instantie.

      2 De periodieke keuring van tanks, met inbegrip van kranen en ander voor het vervoer gebruikt toebehoren, wordt
      aan de hand van de procedures van bijlage IV, deel III, module 1, uitgevoerd door een aangemelde instantie of aan
      de hand van de procedures van bijlage IV, deel III, module 2, door een erkende instantie die is erkend voor de
      uitvoering van de periodieke keuring van de tanks en die handelt onder toezicht van een aangemelde instantie.

      3 Vervoerbare drukapparatuur uit andere lidstaten van de Europese Unie kan in Nederland aan een periodieke keuring
      worden onderworpen.

      4 Op gasflessen die onder het toepassingsgebied van de [richtlijnen 84/525/EEG](31984L0525), [84/526/EEG]
      (31984L0526) en [84/527/EEG](31984L0527) vallen, wordt bij de eerste periodieke keuring die overeenkomstig deze
      regeling wordt verricht, het identificatienummer aangebracht, voorafgegaan door de markering, bedoeld in artikel
      10, eerste lid, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel8
  - number: '9'
    text: |-
      1 De Minister kan besluiten een instantie die voldoet aan de [artikelen 10][ref1] en [10a][ref2] bij de Commissie
      aan te melden, voor het verrichten van activiteiten als bedoeld in [artikel 8, eerste lid][ref3], eerste alinea,
      van de richtlijn.

      2 Na de aanmelding wijst de Minister de aangemelde instantie aan voor het verrichten van activiteiten, bedoeld in
      het eerste lid, en deelt de instantie haar identificatienummer mee.

      3 De Minister doet van zijn aanwijzing, bedoeld in het tweede lid, mededeling aan de Commissie en de overige
      lidstaten onder vermelding van het identificatienummer.

      4 De aangewezen instantie, bedoeld in het tweede lid, wordt opgenomen in [bijlage 1][ref4] bij deze regeling.


