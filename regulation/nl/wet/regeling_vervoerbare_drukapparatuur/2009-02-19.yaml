        artikel: '9'
        paragraaf: '5'
  - number: 10a
    text: |-
      Een instantie die met toepassing van artikel 9 wenst te worden aangemeld, verstrekt de Minister desgevraagd alle
      informatie over en bewijzen van haar naleving van de criteria van de bijlagen I en II bij de Richtlijn, die de
      Minister ter aanvulling op artikel 10, eerste lid, nodig acht.
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel10a
  - number: '11'
    text: |-
      1 In ieder geval besluit de Minister tot het intrekken van een aanmelding, indien de instantie niet voldoet aan
      [artikel 10][ref1], en doet daarvan onverwijld mededeling aan de Commissie en de overige lidstaten.

      2 Een intrekking kan voorwaardelijk geschieden; de Minister kan daarbij nadere voorwaarden of beperkingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0011832#Artikel10
    url: https://wetten.overheid.nl/BWBR0011832/2009-02-19#Artikel11
