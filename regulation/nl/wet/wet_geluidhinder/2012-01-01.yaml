      1 Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 5.3 tot en met 5.16][ref1] en [5.18 tot en met 5.25 van de Wet algemene bepalingen omgevingsrecht][ref2]
      van toepassing, met dien verstande dat met het toezicht op de naleving van het bij of krachtens deze wet bepaalde
      ten aanzien van inrichtingen als bedoeld in [artikel 170, eerste lid][ref3], uitsluitend belast zijn de daartoe bij
      besluit van Onze Minister aangewezen ambtenaren.

      2 Het in [artikel 5.2, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref4] bedoelde bestuursorgaan
      heeft tot taak zorg te dragen voor de bestuursrechtelijke handhaving van de op grond van het bepaalde bij of
      krachtens deze wet voor degene die het project, bedoeld in dat lid, uitvoert, geldende voorschriften.


