  - number: 1b
    text: |-
      1 In afwijking van [artikel 1][ref1] wordt in deze wet en de daarop berustende bepalingen bij de bepaling van
      de geluidsbelasting vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg, van de gevel van
      onderwijsgebouwen en medische kleuterdagverblijven, de waarde van de geluidsbelasting over de periode 19.00–23.00
      uur (avond) of de periode 23.00–07.00 uur (nacht) buiten beschouwing gelaten voor zover genoemde gebouwen in de
      betrokken periode niet als zodanig worden gebruikt.

      2 In afwijking van [artikel 1][ref2] wordt in deze wet en de daarop berustende bepalingen bij de bepaling van de
      geluidsbelasting in dB(A) vanwege een industrieterrein buiten beschouwing gelaten:

      a. het geluid van windturbines welke duurzame energie opwekken;

      b. het geluid vanwege een internationaal racecircuit gedurende ten hoogste 12 dagen per kalenderjaar.

      3 In deze wet en de daarop berustende bepalingen is de geluidsbelasting L vanwege een industrieterrein, vanwege
      een weg en vanwege een spoorweg, niet van toepassing ten aanzien van de gevel van onderwijsgebouwen en medische
      kleuterdagverblijven voor zover genoemde gebouwen in de betrokken periode niet als zodanig worden gebruikt.

      4 In afwijking van [artikel 1][ref3] wordt onder wijziging van een spoorweg in deze wet en de daarop berustende
      bepalingen niet verstaan de afzonderlijke omstandigheid die bestaat uit:

      a. een wijziging van de intensiteit, de verkeerssnelheid of een combinatie van beiden in het toekomstig maatgevende
      jaar van door Onze Minister te bepalen categorieën spoorvoertuigen op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten als gevolg waarvan de geluidemissie van de betreffende spoorgedeelten of de
      combinatie daarvan onafgerond niet meer dan 1,0 dB toeneemt ten opzichte van de gemiddelde geluidemissie, bepaald
      volgens bij ministeriële regeling te stellen regels, van de drie jaren voorafgaand aan de wijziging;

      b. een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;

      c. een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel

      d. het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister
      op grond van [artikel 107][ref4] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.

      5 In afwijking van [artikel 1][ref5] wordt onder een gevel in de zin van deze wet en de daarop berustende
      bepalingen niet verstaan:

      a. een bouwkundige constructie waarin geen te openen delen aanwezig zijn en met een in NEN 5077 bedoelde
      karakteristieke geluidwering die ten minste gelijk is aan het verschil tussen de geluidsbelasting van die
      constructie en 33 dB onderscheidenlijk 35 dB(A), alsmede

      b. een bouwkundige constructie waarin alleen bij uitzondering te openen delen aanwezig zijn, mits de delen niet
      direct grenzen aan een geluidsgevoelige ruimte.

      6 In afwijking van [artikel 1][ref6] wordt onder een wijziging op of aan een weg in deze wet en de daarop
      berustende bepalingen niet verstaan een wijziging die slechts bestaat uit:

      a. een snelheidsverlaging;

      b. de vervanging van een wegdeklaag door een wegdeklaag met dezelfde of een grotere geluidsreducerende werking, of

      c. een snelheidsverhoging tot ten hoogste de maximumsnelheid, zoals die gold vóór een tijdelijke snelheidsverlaging
      die als maatregel is opgenomen in een programma als bedoeld in [artikel 5.12 van de Wet milieubeheer][ref7].

      7 In het geval van een tijdelijke snelheidsverlaging als bedoeld in het zesde lid, onder c, wordt als heersende
      waarde aangemerkt de waarde van de geluidsbelasting, zoals die zou zijn zonder de tijdelijke snelheidsverlaging.


