    text: |-
      In het belang van het voorkomen of beperken van geluidhinder vanwege spoorwegen kunnen bij of krachtens algemene
      maatregel van bestuur, voor gevallen waarin geen toepassing wordt gegeven aan [hoofdstuk VI, afdeling 2a][ref1], of
      [hoofdstuk VII, afdeling 2][ref2], omtrent de onderwerpen die ter beperking van de geluidsbelasting vanwege wegen
      geregeld zijn in de [hoofdstukken VI][ref3] of [VIIIA][ref4], regels worden gesteld. Daarbij kunnen bepalingen van
      dat hoofdstuk van overeenkomstige toepassing worden verklaard.


