  - number: 111a
    text: |-
      1 Indien met toepassing van [artikel 87e, tweede lid of derde lid][ref1], [87f, vierde of vijfde lid][ref2], of
      [87h, derde lid][ref3], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen voor de eerste
      maal een hogere geluidsbelasting dan 48 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, onderscheidenlijk een hogere geluidsbelasting dan 55 dB vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen in geval van geluidsbelasting vanwege wegen ten hoogste 33 dB, onderscheidenlijk vanwege spoorwegen ten
      hoogste 35 dB bedraagt.

      2 Indien met toepassing van [artikel 87g, derde tot en met zesde lid][ref4], of
      [87i, derde tot en met vijfde lid][ref5], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen
      een hogere geluidsbelasting dan 53 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, onderscheidenlijk een hogere geluidsbelasting dan 63 dB vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste 43 dB bedraagt.

      3 Indien met toepassing van [artikel 87e, zesde lid][ref6], [87f, achtste lid][ref7] of [87h, zesde lid][ref8],
      met betrekking tot de gevels van andere geluidsgevoelige gebouwen voor de eerste maal een hogere geluidsbelasting
      dan 48 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, onderscheidenlijk een
      hogere geluidsbelasting dan 53 dB vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, als de ten hoogste
      toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevels
      maatregelen om te bevorderen dat de geluidsbelasting bij gesloten ramen binnen:

      a. leslokalen en theorielokalen van onderwijsgebouwen,

      b. onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 87b, eerste lid, onder e, 2°][ref9],

      c. onderzoeks-, behandelings-, recreatie- en conversatieruimten, alsmede woon- en slaapruimten van gebouwen,
      bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref10], ten hoogste 28 dB bedraagt, onderscheidenlijk binnen:

      a. theorievaklokalen van onderwijsgebouwen,

      b. ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen
      als bedoeld in [artikel 87b, eerste lid, onder e, 2°][ref11], ten hoogste 33 dB bedraagt.

      4 Het derde lid is van overeenkomstige toepassing, indien met toepassing van [artikel 87g, negende lid][ref12]
      of [87i, achtste lid][ref13], met betrekking tot de gevels van andere geluidsgevoelige gebouwen een hogere
      geluidsbelasting dan 48 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen,
      onderscheidenlijk een hogere geluidsbelasting dan 53 dB vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, als de ten hoogste toelaatbare is vastgesteld, met dien verstande dat in plaats van «28 dB» wordt
      gelezen «38 dB» en in plaats van «33 dB» wordt gelezen: 43 dB.

      5 Indien met toepassing van [artikel 106d, tweede lid of derde lid][ref14], [106e, derde lid][ref15], of
      [106g, vierde of vijfde lid][ref16], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen voor
      de eerste maal een hogere geluidsbelasting dan 55 dB vanwege de landelijke spoorweg of vanwege binnen het tracé
      van die landelijke spoorweg gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 48 dB vanwege
      binnen het tracé van die landelijke spoorweg gelegen wegen, als de ten hoogste toelaatbare is vastgesteld, treffen
      burgemeester en wethouders met betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de
      geluidsbelasting binnen de woning bij gesloten ramen in geval van geluidsbelasting vanwege spoorwegen ten hoogste
      35 dB, onderscheidenlijk vanwege wegen ten hoogste 33 dB bedraagt.

      6 Indien met toepassing van [artikel 106f, derde tot en met vijfde lid][ref17], of
      [106h, derde tot en met zesde lid][ref18], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen
      een hogere geluidsbelasting dan 63 dB vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 53 dB vanwege binnen het tracé
      van die landelijke spoorweg gelegen wegen als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en
      wethouders met betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting
      binnen de woning bij gesloten ramen ten hoogste 43 dB bedraagt.

      7 Indien met toepassing van [artikel 106d, zesde lid][ref19], [106e, zesde lid][ref20] of
      [106g, achtste lid][ref21], met betrekking tot de gevels van in aanbouw zijnde of aanwezige andere geluidsgevoelige
      gebouwen voor de eerste maal een hogere geluidsbelasting dan 53 dB vanwege de landelijke spoorweg of vanwege binnen
      het tracé van die landelijke spoorweg gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 48 dB
      vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, als de ten hoogste toelaatbare is vastgesteld,
      treffen burgemeester en wethouders met betrekking tot de geluidwering van die gevels maatregelen om te bevorderen
      dat de geluidsbelasting bij gesloten ramen binnen:

      a. leslokalen en theorielokalen van onderwijsgebouwen,

      b. onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 106b, eerste lid, onder e, 2°][ref22],

      c. onderzoeks-, behandelings-, recreatie- en conversatieruimten, alsmede woon- en slaapruimten van gebouwen,
      bedoeld in [artikel 106b, eerste lid, onder e, 3°][ref23], ten hoogste 28 dB bedraagt, onderscheidenlijk binnen:

      a. theorievaklokalen van onderwijsgebouwen,

      b. ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen
      als bedoeld in [artikel 106b, eerste lid, onder e, 2°][ref24], ten hoogste 33 dB bedraagt.

      8 Het zevende lid is van overeenkomstige toepassing, indien met toepassing van [artikel 106f, achtste lid][ref25],
      of [106h, negende lid][ref26], met betrekking tot de gevels van andere geluidsgevoelige gebouwen een hogere
      geluidsbelasting dan 53 dB vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg
      gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 48 dB vanwege binnen het tracé van die
      landelijke spoorweg gelegen wegen, als de ten hoogste toelaatbare is vastgesteld, met dien verstande dat in plaats
      van «28 dB» wordt gelezen «38 dB» en in plaats van «33 dB» wordt gelezen: 43 dB.

      9 Indien met betrekking tot de gevels van woningen of andere geluidsgevoelige gebouwen
      waarvan de geluidsbelasting vanwege de weg op 1 maart 1986 hoger was dan 55 dB(A) en
      waarvoor met toepassing van [artikel 87f, vierde, vijfde, zevende of achtste lid][ref27], of
      [artikel 106g, vierde, vijfde, zevende of achtste lid][ref28], voor de eerste maal een hogere geluidsbelasting
      dan 48 dB, vanwege de weg als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders
      met betrekking tot de geluidwering van die gevels in afwijking van het eerste, derde, vijfde en zevende lid,
      maatregelen om te bevorderen dat de geluidsbelasting:

      a. binnen de woning bij gesloten ramen ten hoogste 43 dB bedraagt,

      b. binnen de leslokalen en theorielokalen van onderwijsgebouwen, de onderzoeks- en behandelruimten van
      ziekenhuizen en verpleegtehuizen, bedoeld in [87b, eerste lid, onder e, 2°][ref29], en de onderzoeks,
      behandelings-, recreatie- en conversatieruimten, alsmede woon- en slaapruimten van gebouwen, bedoeld in
      [artikel 87b, eerste lid, onder 3°][ref30], bij gesloten ramen ten hoogste 38 dB bedraagt, onderscheidenlijk

      c. binnen de theorievaklokalen van onderwijsgebouwen en de ruimten voor patiëntenhuisvesting,
      alsmede recreatie- en conversatieruimten voor ziekenhuizen en verpleeghuizen als bedoeld in
      [artikel 87b, eerste lid, onder e, 2°][ref31], bij gesloten ramen ten hoogste 43 dB bedraagt.

      10 Ingeval voor de betrokken woningen of andere geluidsgevoelige gebouwen eerder een hogere waarde voor de
      geluidsbelasting is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die
      gevels in afwijking van het eerste, derde, vijfde, zevende en negende lid, maatregelen om te bevorderen dat de
      geluidsbelasting, binnen de woning bij gesloten ramen na de aanpassing ten hoogste de waarde die voor de aanpassing
      van de weg ingevolge het bij of krachtens deze wet voor de onderscheiden situaties bepaalde, dan wel ingevolge het
      krachtens [artikel 3 van de Woningwet][ref32] bepaalde ten hoogste toelaatbaar was, bedraagt.


