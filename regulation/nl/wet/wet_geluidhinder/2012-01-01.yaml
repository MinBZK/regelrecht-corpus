        artikel: '24'
  - number: '111'
    text: |-
      1 Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting,
      vanwege een industrieterrein, als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met
      betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning
      bij gesloten ramen ten hoogste bedraagt:

      a. ingeval met toepassing van [artikel 63, tweede lid][ref1], een hogere geluidsbelasting dan 55 dB(A) als de ten
      hoogste toelaatbare is vastgesteld: 40 dB(A);

      b. in andere gevallen: 35 dB(A).

      2 Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting dan
      48 dB vanwege een weg, als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met
      betrekking tot de geluidwering van die gevels, ingeval het een weg betreft die na 1 januari 1982 is of wordt
      aangelegd en is opgenomen in een overeenkomstig de [artikelen 76][ref2] en [77][ref3] vastgesteld bestemmingsplan,
      dan wel na dat tijdstip ingevolge een besluit, genomen met toepassing van de [artikelen 79 tot en met 81][ref4], is
      aangelegd, maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten ramen ten hoogste 33
      dB bedraagt.

      3 Indien met betrekking tot de gevels van woningen waarvan de geluidsbelasting vanwege de weg op 1 maart 1986
      hoger was dan 55 dB(A) en met toepassing van [artikel 90, tweede lid][ref5], een hogere geluidsbelasting dan 48 dB,
      vanwege de weg als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste 43 dB bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel63
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel90
