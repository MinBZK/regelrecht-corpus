  - number: 87h
    text: |-
      1 Behoudens het tweede en derde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden hoofdweg
      ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare
      geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, indien:

      a. de geluidsbelasting vanwege binnen het tracé van die hoofdweg gelegen spoorwegen op 1 juli 1987, van de gevel
      van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze spoorwegen lager was dan of gelijk
      was aan 65 dB(A), of

      b. binnen het tracé van die hoofdweg gelegen spoorwegen na 1 juli 1987 zijn aangelegd op grond van een
      bestemmingsplan dat is vastgesteld of herzien met toepassing van het bij of krachtens deze wet bepaalde,

      de voor de wijziging of verbreding van de hoofdweg ter plaatse heersende geluidsbelasting, met dien verstande dat
      een geluidsbelasting waarvan de waarde 55 dB niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft.

      2 In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1] of de
      [Interimwet stad-en-milieubenadering][ref2] een hogere waarde voor de ten hoogst toelaatbare geluidsbelasting,
      vanwege de betrokken spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de zone van een te wijzigen
      of te verbreden hoofdweg ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, de laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde
      55 dB niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste of tweede lid bedoelde waarde vaststellen, met
      dien verstande dat de waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder op grond van de
      [Experimentenwet Stad en Milieu][ref3] of de [Interimwet stad-en-milieubenadering][ref4] een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.

      4 Onze Ministers kunnen slechts toepassing geven aan het derde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken
      woningen, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, tot de ingevolge het eerste of tweede lid
      geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedenbouwkundige,
      verkeerskundige, landschappelijke of financiële aard.

      5 De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen.

      6 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het eerste lid in
      plaats van «65 dB(A)» wordt gelezen «60 dB(A)» en in plaats van «de waarde 55dB» wordt gelezen: de waarde 53 dB.

      7 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het derde lid in plaats
      van «de waarde 71 dB» wordt gelezen: de waarde indien het woonwagenstandplaatsen betreft 63 dB en in de overige
      gevallen 66 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0010041
