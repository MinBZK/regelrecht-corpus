  - number: '115'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      geluidsbelasting L: geluidsbelasting op een plaats en vanwege een bron als omschreven in bijlage I, onderdeel 1,
      van [richtlijn 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002
      inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 07.00 uur tot 19.00
      uur, van 19.00 uur tot 23.00 uur en van 23.00 tot 7.00 uur van een jaar; verzameling van inrichtingen:

      a. inrichtingen op een industrieterrein;

      b. bij algemene maatregel van bestuur aangewezen inrichtingen, die zijn gelegen binnen een daarbij aangegeven
      gebied; stille gebieden: bij algemene maatregel van bestuur of overeenkomstig de maatregel als zodanig aangewezen
      categorieën van gebieden.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel115
  - number: '116'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat en gedeputeerde staten melden vóór 1 april 2005 aan Onze Minister op
      welke delen van rijkswegen, onderscheidenlijk provinciale wegen naar verwachting in het kalenderjaar 2006 meer dan
      zes miljoen maal een motorvoertuig zal passeren.

      2 Onze Minister van Verkeer en Waterstaat meldt voor de in het eerste lid genoemde datum tevens aan Onze Minister
      op welke delen van hoofdspoorwegen naar verwachting in 2006 meer dan 60 000 maal een trein zal passeren.

      3 Onze Minister van Verkeer en Waterstaat en gedeputeerde staten melden vóór 30 september 2008, vóór 1 april
      2010 en vervolgens elke vijf jaar vóór 1 april aan Onze Minister op welke delen van rijkswegen, onderscheidenlijk
      provinciale wegen naar verwachting in het daaropvolgende kalenderjaar meer dan drie miljoen maal een motorvoertuig
      zal passeren.

      4 Onze Minister van Verkeer en Waterstaat meldt voor de in het derde lid genoemde data tevens aan Onze Minister op
      welke delen van hoofdspoorwegen naar verwachting meer dan 30 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel116
  - number: '117'
    text: |-
      1 Onze Minister publiceert vóór 30 juni 2005 in de Staatscourant op welke delen van rijkswegen en provinciale wegen
      naar verwachting in 2006 meer dan zes miljoen maal een motorvoertuig zal passeren.

      2 Het eerste lid is van overeenkomstige toepassing op delen van hoofdspoorwegen waarop naar verwachting in 2006
      meer dan 60 000 maal een trein zal passeren.

      3 Onze Minister publiceert vóór 31 december 2008, voor 30 juni 2010 en vervolgens elke vijf jaar voor 30 juni
      in de Staatscourant op welke delen van rijkswegen en provinciale wegen naar verwachting in het daaropvolgende
      kalenderjaar meer dan drie miljoen maal een motorvoertuig zal passeren.

      4 Het derde lid is van overeenkomstige toepassing op delen van hoofdspoorwegen waarop naar verwachting in het
      daaropvolgende kalenderjaar meer dan 30 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel117
  - number: 117a
    text: |-
      1 Onze Minister wijst vóór 30 juni 2005 als agglomeratie aan verstedelijkte gebieden met ten minste 250 000
      inwoners.

      2 Onze Minister wijst vóór 31 december 2008, voor 30 juni 2010 en vervolgens elke vijf jaar voor 30 juni als
      agglomeratie aan verstedelijkte gebieden met ten minste 100 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel117a
  - number: '118'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten, stellen vóór 30 juni 2007 en
      vervolgens vóór 30 juni van ten minste elk vijfde kalenderjaar, geluidsbelastingkaarten vast. Deze kaarten hebben
      betrekking op:

      a. de geluidsbelasting L en de geluidsbelasting L op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen vanwege delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale wegen als bedoeld in
      [artikel 117][ref1];

      b. stille gebieden in de omgeving van delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale wegen
      als bedoeld in [artikel 117][ref2].

      2 Het eerste lid is van overeenkomstige toepassing op burgemeester en wethouders van gemeenten die behoren
      tot krachtens [artikel 117a][ref3] aangewezen agglomeraties met dien verstande dat de geluidsbelastingkaarten
      betrekking hebben op de geluidsbelasting L en de geluidsbelasting L vanwege:

      a. wegen,

      b. spoorwegen die niet deel uitmaken van een weg,

      c. luchthavens als bedoeld in de [Wet luchtvaart][ref4], en

      d. inrichtingen of verzamelingen van inrichtingen.

      3 De geluidsbelastingkaarten geven ten minste een weergave van:

      a. de geluidsbelasting L en de geluidsbelasting L veroorzaakt door de in het eerste, onderscheidenlijk tweede lid,
      bedoelde geluidsbronnen in het kalenderjaar voorafgaand aan dat van de vaststelling van de geluidsbelastingkaart en

      b. het aantal woningen, andere geluidsgevoelige gebouwen, geluidsgevoelige terreinen en bewoners van woningen die
      aan bepaalde waarden van de geluidsbelasting L en de geluidsbelasting L worden blootgesteld.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud, vormgeving
      en inrichting van geluidsbelastingkaarten, welke regels kunnen verschillen voor rijkswegen, provinciale wegen,
      hoofdspoorwegen en agglomeraties.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel117a
      [ref4]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel118
