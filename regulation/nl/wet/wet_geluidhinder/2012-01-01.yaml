  - number: '126'
    text: |-
      1 Voor zover in de kosten van maatregelen die met het oog op de beperking van de geluidsbelasting van woningen
      binnen zones langs wegen als bedoeld in [artikel 74][ref1] krachtens [Afdeling 3 van hoofdstuk VI][ref2] zijn
      vastgesteld, niet op andere wijze wordt voorzien, komen deze kosten in gevallen waarin op 1 maart 1986 de woningen
      aanwezig of in aanbouw waren, terwijl de weg aanwezig was: ten laste van het Rijk.

      2 Het eerste lid is niet van toepassing met betrekking tot maatregelen met het oog op de beperking van de
      geluidsbelasting van woningen:

      a. die op 1 maart 1986 een geluidsbelasting vanwege een weg ondervonden van ten minste 65 dB(A), dan wel ten
      minste 60 dB(A) indien zij deel uitmaken van een verzameling van woningen waarvan ten minste één woning een
      geluidsbelasting vanwege een weg ondervond van ten minste 65 dB(A),

      b. die door het gemeentebestuur voor 1 januari 1998 op grond van [artikel 88, eerste lid][ref3], aan Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zijn gemeld, en

      c. ten aanzien waarvan het gemeentebestuur bij die gelegenheid heeft verklaard dat het treffen van geluidwerende
      maatregelen de enige oplossing is die in aanmerking komt.

      3 Indien door een reconstructie de geluidsbelasting, vanwege de gereconstrueerde weg, van de gevel van woningen
      binnen een zone met meer dan 5 dB is toegenomen en voor die woningen nog niet eerder toepassing is gegeven aan
      [artikel 90, vierde lid][ref4], komen de kosten, bedoeld in het eerste lid, ten laste van de wegbeheerder.

      4 Met betrekking tot andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen zijn het eerste en derde lid
      van overeenkomstige toepassing.

      5 In afwijking van het eerste lid komen de kosten van maatregelen in gevallen waarin op 1 maart 1986 de woningen
      aanwezig of in aanbouw waren, terwijl de weg aanwezig was, maar de woningen niet tijdig overeenkomstig artikel 88
      zijn gemeld, ten laste van de gemeente waarin de woningen zijn gelegen.

      6 Indien toepassing wordt gegeven aan [artikel 98][ref5] komt het gedeelte van de kosten van de maatregelen dat
      verband houdt met de reconstructie van de weg voor rekening van de wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel90
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel98
