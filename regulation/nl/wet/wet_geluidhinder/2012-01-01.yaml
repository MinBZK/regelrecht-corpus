  - number: 87e
    text: |-
      1 Behoudens het tweede en derde lid is de voor woningen binnen de zone van een aan te leggen hoofdweg, ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te
      leggen wegen of spoorwegen, 48 dB vanwege deze wegen, onderscheidenlijk 55 dB vanwege deze spoorwegen.

      2 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze waarde in geval van geluidsbelasting vanwege wegen 58 dB, onderscheidenlijk vanwege spoorwegen 68 dB niet te
      boven mag gaan.

      3 Voor zover het woningen in stedelijk gebied betreft kunnen Onze Ministers een hogere waarde dan 58 dB voor de ten
      hoogste toelaatbare geluidsbelasting vanwege de in het eerste lid bedoelde wegen vaststellen, met dien verstande
      dat deze waarde 63 dB niet te boven mag gaan.

      4 Onze Ministers kunnen slechts toepassing geven aan het tweede of derde lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen of spoorwegen, tot de
      ingevolge het eerste lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet
      van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      5 De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een te
      wijzigen of te verbreden hoofdweg, vanwege binnen het tracé van die hoofdweg aan te leggen wegen of spoorwegen.

      6 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:

      a. in het eerste lid in plaats van «55 dB» wordt gelezen« 53 dB»;

      b. in het tweede lid in plaats van «58 dB» wordt gelezen «58 dB voor zover het andere geluidsgevoelige gebouwen
      als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1], betreft, of 53 dB voor zover het andere
      geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref2], betreft» en

      c. in het derde lid in plaats van «woningen in stedelijk gebied» wordt gelezen: andere geluidsgevoelige gebouwen
      als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref3], in stedelijk gebied.

      7 De in het eerste, tweede, vierde en vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:

      a. in het eerste lid in plaats van «48 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 48 dB en in de
      overige gevallen 53 dB» en

      b. in het tweede lid in plaats van «58 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 53 dB en in de
      overige gevallen 58 dB» en in plaats van «68 dB» wordt gelezen: indien het woonwagenstandplaatsen betreft 63 dB en
      in de overige gevallen 66 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
