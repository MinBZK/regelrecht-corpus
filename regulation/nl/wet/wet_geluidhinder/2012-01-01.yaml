  - number: '83'
    text: |-
      1 Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, eerste lid][ref1], kan
      een hogere dan de in dat artikel genoemde waarde worden vastgesteld, met dien verstande dat deze waarde, buiten de
      in de volgende leden bedoelde gevallen, voor woningen in buitenstedelijk gebied 53 dB en voor woningen in stedelijk
      gebied 58 dB niet te boven mag gaan.

      2 Bij toepassing van het eerste lid met betrekking tot in stedelijk gebied nog te bouwen woningen die nog niet zijn
      geprojecteerd, kan voor de aanwezige of te verwachten geluidsbelasting vanwege een aanwezige weg een hogere dan de
      in dat lid genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 63 dB niet te boven mag gaan.

      3 Bij toepassing van het eerste lid met betrekking tot woningen die reeds aanwezig of in aanbouw zijn, kan voor de
      toekomstige geluidsbelasting vanwege een weg die nog niet geprojecteerd is:

      a. voor zover het woningen in stedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 63 dB niet te boven mag gaan;

      b. voor zover het woningen in buitenstedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 58 dB niet te boven mag gaan.

      4 Bij toepassing van het eerste lid met betrekking tot in buitenstedelijk gebied nog te bouwen woningen die nog
      niet zijn geprojecteerd en die ter plaatse noodzakelijk zijn vanwege de uitoefening van een agrarisch bedrijf, kan
      een hogere waarde worden vastgesteld die de waarde van 58 dB niet te boven mag gaan.

      5 Bij toepassing van het eerste lid met betrekking tot in het stedelijk gebied nog te bouwen woningen die nog
      niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige gebouwen,
      kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 68 dB worden
      vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.

      6 Bij toepassing van het eerste lid met betrekking tot binnen de bebouwde kom nog te bouwen woningen binnen de
      zone langs een autoweg of autosnelweg als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref2],
      die nog niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige
      gebouwen, kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 63 dB
      worden vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.

      7 Bij toepassing van het eerste lid met betrekking tot buiten de bebouwde kom nog te bouwen woningen die nog
      niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige gebouwen,
      kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 58 dB worden
      vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.

      8 Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0004825
