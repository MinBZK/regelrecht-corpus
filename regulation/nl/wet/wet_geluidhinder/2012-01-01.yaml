        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '55'
    text: |-
      1 Bij wijziging van een bestaande zone of bij vaststelling van een bestemmingsplan voor gronden die krachtens
      die vaststelling deel blijven uitmaken van de bestaande zone kan met betrekking tot de woningen in dat gebied, de
      waarde van de op grond van [artikel 53, tweede lid][ref1], geldende ten hoogste toelaatbare geluidsbelasting worden
      gewijzigd.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.

      3 Een verhoging van de in het eerste lid bedoelde waarde mag ten hoogste 5 dB(A) bedragen, met dien verstande dat:

      a. degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met
      de verhoging financiële middelen ter beschikking stelt ten behoeve van de uitvoering van maatregelen om de
      geluidsbelasting vanwege het industrieterrein, van de gevels van woningen die door de wijziging van de bestaande
      zone dan wel vaststelling van het bestemmingsplan een hogere geluidsbelasting ondervinden te beperken en te voldoen
      aan [artikel 111, eerste lid, onder a of b][ref2], en

      b. de waarde wat ten tijde van de eerste zonevaststelling geprojecteerde woningen betreft 55 dB(A) en wat ten tijde
      van de eerste zonevaststelling aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.

      4 Bij wijziging van een bestaande zone, bij vaststelling van een bestemmingsplan voor gronden die krachtens die
      vaststelling deel gaan uitmaken van de bestaande zone, kan in bij algemene maatregel van bestuur aan te geven
      gevallen met betrekking tot geprojecteerde, aanwezige of in aanbouw zijnde woningen in dat gebied, een hogere
      waarde dan 50 dB(A) worden vastgesteld, met dien verstande dat deze waarde voor geprojecteerde woningen de waarde
      55 dB(A) en voor wat aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel55
