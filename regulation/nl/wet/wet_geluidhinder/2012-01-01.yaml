  - number: 87i
    text: |-
      1 Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, indien de geluidsbelasting vanwege binnen het tracé van die hoofdweg gelegen spoorwegen op 1 juli 1987,
      van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze spoorwegen hoger was
      dan 65 dB(A), de waarde 55 dB.

      2 In geval eerder bij of krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting
      vanwege de betrokken spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de zone van een te wijzigen
      of te verbreden hoofdweg ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, de laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde
      55 dB niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 71 dB niet te boven mag gaan.

      4 Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat
      deze waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder bij of krachtens deze wet een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.

      5 In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 71 dB vaststellen.

      6 Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, tot de ingevolge het eerste
      of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      7 De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen.

      8 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat in het eerste lid in plaats van «hoger was dan 65 dB(A), de waarde 55 dB» wordt gelezen: hoger was dan 60
      dB(A), de waarde 58 dB.

      9 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat
      in het eerste lid in plaats van «de waarde 55 dB» wordt gelezen: de waarde 63 dB.


