  - number: '56'
    text: |-
      1 Bij wijziging van een bestaande zone of bij vaststelling van een bestemmingplan, geldende voor tot de zone
      behorende gronden, kan met betrekking tot andere geluidsgevoelige gebouwen alsmede geluidsgevoelige terreinen
      in dat gebied, de waarde van de op grond van [artikel 53, tweede lid][ref1], geldende ten hoogste toelaatbare
      geluidsbelasting worden gewijzigd.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.

      3 Een verhoging van de in het eerste lid bedoelde waarde mag ten hoogste 5 dB(A) bedragen, met dien verstande dat:

      a. degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met de
      verhoging financiële middelen ter beschikking stelt ten behoeve van de uitvoering van maatregelen als bedoeld in
      [artikel 113][ref2], met betrekking tot de andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen die door
      de wijziging van de bestaande zone of vaststelling van het bestemmingsplan een hogere geluidsbelasting ondervinden,
      en

      b. de waarde wat ten tijde van de eerste zonevaststelling geprojecteerde andere geluidsgevoelige gebouwen of
      geluidsgevoelige terrein betreft 55 dB(A) en wat ten tijde van de eerste zonevaststelling aanwezig of in aanbouw
      zijnde andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen betreft 60 dB(A) niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel113
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel56
    references:
