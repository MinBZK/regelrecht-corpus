  - number: '75'
    text: |-
      1 De afstanden, genoemd in [artikel 74, eerste lid][ref1], worden aan weerszijden van de weg gemeten vanaf de
      buitenste begrenzing van de buitenste rijstrook.

      2 Indien zich langs een weg een zone bevindt die bestaat uit delen met een onderling verschillende breedte, geldt
      voor de aansluiting van de verschillende zonedelen dat het breedste zonedeel over een afstand gelijk aan een derde
      van de breedte van dat zonedeel, gemeten vanaf het punt van versmalling van de zonebreedte, nog langs de wegas
      doorloopt en met een loodlijn aansluit op de smalste zone.

      3 Aan de uiteinden van een weg loopt de zone door over een afstand gelijk aan de breedte van de zone ter hoogte van
      het einde van de weg. De zone loopt door langs een lijn die is gelegen in het verlengde van de wegas. Zij behoudt
      de breedte die zij had ter hoogte van het einde van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel75
