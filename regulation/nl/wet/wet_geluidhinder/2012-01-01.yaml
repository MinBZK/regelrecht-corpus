  - number: '105'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder, veroorzaakt door het gebruik van een spoor-, tram-,
      of metroweg, kunnen bij of krachtens algemene maatregel van bestuur eisen worden gesteld met betrekking tot aard,
      samenstelling, wijze van aanleg of gebruik van de spoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel105
  - number: 105a
    text: |-
      [Afdeling 1 van hoofdstuk VIIIA][ref1] is niet van toepassing op deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel105a
    references:
