  - number: '166'
    text: |-
      1 In het belang van het verkrijgen van gegevens ten behoeve van het instellen van geluidszones en ten behoeve
      van de bepaling van binnen geluidszones te nemen maatregelen ter beperking van de geluidhinder aldaar kan
      Onze Minister, voor zover het betreft een geluidszone als bedoeld in [hoofdstuk VIII][ref1] dan wel een
      met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld in [hoofdstuk 8][ref2] of
      [artikel 10.17 van de Wet luchtvaart][ref3], binnen een door hem aan te geven termijn gegevens betreffende de
      geluiduitstraling verlangen van beheerders van inrichtingen, welke binnen een zodanige zone werkzaam zijn of zullen
      zijn.

      2 Onze Minister kan omtrent de bepaling en de vastlegging van de in het eerste lid bedoelde gegevens regels
      stellen.


