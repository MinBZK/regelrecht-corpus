  - number: '123'
    text: |-
      1 Een actieplan wordt voorbereid met overeenkomstige toepassing van de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure, met dien verstande dat in afwijking van
      [artikel 3:15 van de Algemene wet bestuursrecht][ref2], eenieder zienswijzen naar voren kan brengen.

      2 Burgemeester en wethouders stellen een actieplan niet vast dan nadat de gemeenteraad een ontwerp van het
      actieplan is toegezonden en deze in de gelegenheid is gesteld zijn wensen en zienswijze ter kennis van burgemeester
      en wethouders te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel315
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel123
    references:
