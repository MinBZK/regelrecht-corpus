  - number: '63'
    text: |-
      1 Gedeputeerde staten leggen het ingevolge [artikel 62, eerste lid][ref1], opgestelde programma van maatregelen
      onverwijld voor aan Onze Minister.

      2 Onze Minister stelt voor de woningen waarop het programma betrekking heeft, binnen zes maanden na ontvangst
      daarvan de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege het industrieterrein, van de gevel
      vast, met dien verstande dat deze waarde de 65 dB(A) niet te boven mag gaan. De gelding van deze waarde kan aan
      voorwaarden worden gebonden.

      3 Onze Minister doet van zijn besluit mededeling aan gedeputeerde staten en aan burgemeester en wethouders.
      Gelijktijdig met deze mededeling deelt hij ten aanzien van elk der gevallen waarop het besluit betrekking heeft
      en die naar zijn aanvankelijk oordeel voor toepassing van het vierde lid in aanmerking komen, aan gedeputeerde
      staten en aan burgemeester en wethouders mede in hoeverre en op welke termijn hij overweegt aan dat lid ter zake
      toepassing te geven.

      4 Onze Minister stelt ten aanzien van elk der daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van de gevels van de betrokken
      woningen tot de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde. Deze maatregelen strekken
      tevens, afhankelijk van de hoogte van deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege het
      industrieterrein, binnen de woning. Op de door Onze Minister vastgestelde maatregelen zijn [artikel 125][ref2]
      en [artikel 15.20, eerste lid, onder b, van de Wet milieubeheer][ref3] van toepassing. Hij doet van zijn besluit,
      houdende de vaststelling van maatregelen, mededeling aan gedeputeerde staten en aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel125
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel15.20
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel63
