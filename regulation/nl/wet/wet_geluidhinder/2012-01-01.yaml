  - number: 114a
    text: |-
      1 Indien de rechthebbende ten aanzien van een woning of een ander geluidsgevoelig gebouw niet heeft toegestemd
      mee te werken aan maatregelen die moeten worden getroffen ingevolge het bij of krachtens dit hoofdstuk bepaalde,
      vervalt de verplichting om overeenkomstig het bij of krachtens dit hoofdstuk bepaalde maatregelen te treffen ten
      aanzien van die woning onderscheidenlijk dat andere geluidsgevoelige gebouw.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van:

      a. de wijze waarop aan de rechthebbende wordt verzocht om mee te werken aan de realisatie van de maatregelen;

      b. de wijze waarop de rechthebbende zijn toestemming verleent of onthoudt aan de realisatie van de maatregelen;

      c. de wijze waarop burgemeester en wethouders aan de rechthebbende mededeling doen over het vervallen van de
      verplichting, bedoeld in het eerste lid.

      3 [Artikel 110i, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110i
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel114a
