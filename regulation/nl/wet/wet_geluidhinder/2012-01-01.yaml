  - number: '119'
    text: |-
      1 Ten behoeve van de bepaling van de geluidsbelasting L en de geluidsbelasting L vanwege een weg, spoorweg,
      inrichting of verzameling van inrichtingen kunnen bij regeling van Onze Minister regels worden gesteld.

      2 Ten behoeve van de bepaling van de geluidsbelasting L en de geluidsbelasting L vanwege een luchthaven kunnen
      bij regeling van Onze Minister in overeenstemming met Onze Minister van Verkeer en Waterstaat en Onze Minister van
      Defensie regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel119
  - number: '120'
    text: |-
      1 Binnen één maand na de vaststelling van een geluidsbelastingkaart als bedoeld in
      [artikel 118, eerste en tweede lid][ref1], geven Onze Minister van Verkeer en Waterstaat, gedeputeerde staten,
      onderscheidenlijk burgemeester en wethouders van deze vaststelling kennis in één of meer dag- , nieuws-, of huis-
      aan-huisbladen, dan wel op andere geschikte wijze. Hierbij geven zij aan op welke wijze kennis kan worden gekregen
      van de inhoud van de geluidsbelastingkaart.

      2 De in het eerste lid bedoelde bestuursorganen:

      a. stellen de geluidsbelastingkaart zo mogelijk elektronisch ter beschikking van eenieder;

      b. voegen bij de geluidsbelastingkaart een overzicht van de belangrijkste punten van die kaart.

      3 Onze Minister van Verkeer en Waterstaat, gedeputeerde staten, onderscheidenlijk burgemeester en wethouders zenden
      de geluidsbelastingkaart binnen één maand na vaststelling aan Onze Minister.

      4 Bij regeling van Onze Minister kunnen regels worden gesteld over de wijze waarop de geluidsbelastingkaart ter
      beschikking van Onze Minister wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel120
    references:
