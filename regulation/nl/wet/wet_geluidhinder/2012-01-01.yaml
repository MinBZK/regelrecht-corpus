  - number: '46'
    text: |-
      1 Bij wijziging van een zone kan de ingevolge [artikel 44][ref1] of [45][ref2] geldende waarde voor woningen in dat
      gebied worden gewijzigd.

      2 Een verhoging van de in het eerste lid bedoelde waarde mag ten hoogste 5 dB(A) bedragen, met dien verstande dat:

      a. degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met
      de verhoging financiële middelen ter beschikking stelt ten behoeve van de uitvoering van maatregelen om de
      geluidsbelasting vanwege het industrieterrein, van de gevels van woningen die door de wijziging van de zone dan
      wel vaststelling van het bestemmingsplan een hogere geluidsbelasting ondervinden te beperken en te voldoen aan
      [artikel 111, eerste lid, onder b][ref3], en

      b. de waarde van wat ten tijde van de eerste zonevaststelling geprojecteerde woningen betreft 55 dB(A) en wat ten
      tijde van de eerste zonevaststelling aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag
      gaan.

      3 Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel46
