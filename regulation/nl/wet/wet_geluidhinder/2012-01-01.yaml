  - number: '108'
    text: |-
      1 Bij algemene maatregel van bestuur kan een gebied waar ernstige geluidhinder optreedt of is te verwachten, welke
      niet of niet voldoende door toepassing van de voorgaande hoofdstukken kan worden bestreden, worden aangewezen als
      geluidszone. Ten aanzien van deze zone zijn de bepalingen van dit hoofdstuk van toepassing.

      2 Onze Minister doet van een maatregel als bedoeld in het eerste lid mededeling aan de raden der betrokken
      gemeenten en aan de staten der betrokken provincies.

      3 Een maatregel als bedoeld in het eerste lid heeft geen betrekking op het bestrijden van de geluidhinder vanwege
      luchthavens waarop de [hoofdstukken 8][ref1] en [10 van de Wet luchtvaart][ref2] van toepassing zijn.


