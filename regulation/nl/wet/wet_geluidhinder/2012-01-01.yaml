  - number: '76'
    text: |-
      1 Bij de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of gedeeltelijk
      betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref2], worden ter zake van de
      geluidsbelasting, vanwege de weg waarlangs die zone ligt, van de gevel van woningen, van andere geluidsgevoelige
      gebouwen en van geluidsgevoelige terreinen binnen die zone de waarden in acht genomen, die ingevolge
      [artikel 82][ref3] en [100][ref4] als de ten hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan als in dat lid bedoeld hogere waarden in acht genomen, voor zover:

      a. met toepassing van [artikel 83][ref5], [85][ref6] of [100a][ref7] voor de vaststelling van het bestemmingsplan
      of het wijzigings- of uitwerkingsplan zodanige waarden zijn vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling van het plan in afwijking van het ontwerp,
      zoals dit ter inzage heeft gelegen, welke waarden redelijkerwijs met toepassing van [artikel 83][ref8], [85][ref9]
      of [100a][ref10], zullen worden vastgesteld.

      3 Indien op het tijdstip van de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan
      een weg reeds aanwezig of in aanleg is, gelden het eerste en tweede lid niet met betrekking tot de daarbij in het
      plan of in de zone van de betreffende weg opgenomen woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen, die op dat tijdstip reeds aanwezig of in aanbouw zijn.


