  - number: 106g
    text: |-
      1 Behoudens het tweede tot en met vierde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten gevolge waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, ten
      hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen
      wegen 48 dB, indien:

      a. de geluidsbelasting vanwege binnen het tracé van deze landelijke spoorweg gelegen wegen op 1 maart 1986, van
      de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze wegen lager was dan of
      gelijk was aan 60 dB(A), of

      b. binnen het tracé van die landelijke spoorweg gelegen wegen na 1 januari 1982 zijn aangelegd op grond van een
      overeenkomstig de [artikelen 76][ref1] en [77][ref2] vastgesteld of herzien bestemmingsplan.

      2 In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref3], de
      [Interimwet stad-en-milieubenadering][ref4] of de [Spoedwet wegverbreding][ref5] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de betrokken wegen is vastgesteld dan 48 dB en de heersende waarde
      hoger is dan 48 dB, is de voor woningen binnen de zone van een te wijzigen landelijke spoorweg ten gevolge
      waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, ten hoogste toelaatbare
      geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, de laagste van
      de volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Ingeval de betrokken wegen op 1 januari 2007 aanwezig, in aanleg of geprojecteerd waren en niet eerder een hogere
      waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege de betrokken wegen van de gevel van woningen
      is vastgesteld dan 48 dB en de heersende waarde is hoger dan 48 dB, geldt voor de woningen die op 1 januari 2007
      aanwezig, in aanbouw of geprojecteerd waren binnen de zone van een te wijzigen of te verbreden landelijke spoorweg
      ten gevolge waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, als de ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, de
      heersende waarde.

      4 Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid bedoelde waarde vaststellen, met dien
      verstande dat de verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:

      1°. ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal
      woningen elders met een ten minste gelijke waarde zal verminderen, en

      2°. de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, vijfde, zevende of negende lid][ref6], met
      betrekking tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden.

      5 De krachtens het vierde lid vast te stellen waarde wordt niet hoger vastgesteld dan 58 dB bij een aanpassing
      van een weg in buitenstedelijk gebied en 63 dB bij een aanpassing van een weg in stedelijk gebied, indien voor
      de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref7] of [84, tweede lid][ref8], zoals dat
      luidde voor 1 september 1991 of de heersende waarde 53 dB niet te boven gaat. Voor andere dan de in de eerste
      volzin bedoelde woningen wordt de krachtens het vierde lid vast te stellen waarde niet hoger vastgesteld dan 68
      dB. In afwijking van de eerste en tweede volzin wordt de krachtens het vierde lid vast te stellen waarde voor
      woningen met betrekking waartoe eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref9], de
      [Interimwet stad-en-milieubenadering][ref10] of de [Spoedwet wegverbreding][ref11] een hogere waarde is vastgesteld
      dan de krachtens die volzinnen ten hoogste toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde
      waarde.

      6 Onze Ministers kunnen slechts toepassing geven aan het vierde en vijfde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege binnen het tracé van de landelijke spoorweg gelegen wegen, tot de ingevolge het eerste, tweede of derde
      lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedenbouwkundige,
      verkeerskundige, landschappelijke of financiële aard.

      7 De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen.

      8 Het eerste tot en met zevende lid zijn mede van toepassing met betrekking tot de ten hoogste toelaatbare
      geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:

      a. het vierde lid wordt gelezen als «Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid,
      bedoelde waarde vaststellen, met dien verstande dat een verhoging 5 dB niet te boven mag gaan», en

      b. het vijfde lid wordt gelezen als: Indien voor het betrokken andere geluidsgevoelige gebouw eerder bij of
      krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld of indien
      de heersende waarde 53 dB niet te boven gaat, wordt de krachtens het vierde lid vast te stellen waarde niet hoger
      vastgesteld dan:

      1°. 58 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref12]
      in buitenstedelijk gebied,

      2°. 63 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref13]
      in stedelijk gebied, en

      3°. 53 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref14].

      Voor andere dan de in de eerste volzin bedoelde andere geluidsgevoelige gebouwen wordt de krachtens het vierde
      lid vast te stellen waarde niet hoger vastgesteld dan 68 dB voor andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 87b, eerste lid, onder e, 1° en 2°][ref15], en 58 dB voor andere geluidsgevoelige gebouwen als bedoeld
      in [artikel 87b, eerste lid, onder e, 3°][ref16]. In afwijking van de eerste en tweede volzin wordt de krachtens
      het vierde lid vast te stellen waarde voor andere geluidsgevoelige gebouwen met betrekking waartoe eerder bij of
      krachtens deze wet, de [Experimentenwet Stad en Milieu][ref17], de [Interimwet stad-en-milieubenadering][ref18]
      of de [Spoedwet wegverbreding][ref19] een hogere waarde is vastgesteld dan de krachtens die volzinnen ten hoogste
      toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde waarde.

      9 De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:

      a. in het eerste, tweede en derde lid in plaats van «48 dB» telkens wordt gelezen «indien het
      woonwagenstandplaatsen betreft 48 dB en in de overige gevallen 53 dB»;

      b. het in het vierde lid, onder 1° en 2°, gestelde niet van toepassing is, en

      c. in het vijfde lid in plaats van «58 dB bij een wijziging van een weg in buitenstedelijk gebied en 63 dB bij
      een wijziging van een weg in stedelijk gebied, indien voor de betrokken woning eerder toepassing is gegeven aan
      [artikel 83][ref20] of [84, tweede lid][ref21], zoals dat luidde voor 1 september 1991 of de heersende waarde 53 dB
      niet te boven gaat» wordt gelezen «53 dB indien het woonwagenstandplaatsen betreft en 58 dB in de overige gevallen»
      en de tweede volzin van dat lid niet van toepassing is.


