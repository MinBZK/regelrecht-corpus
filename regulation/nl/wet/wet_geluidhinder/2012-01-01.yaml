  - number: '98'
    text: |-
      Ten behoeve van een reconstructie van een weg met betrekking waartoe ingevolge [artikel 88][ref1],
      zoals dat luidde voor 1 januari 2007 aan Onze Minister uiterlijk twee jaar na 1 januari 2007 melding
      is gedaan of is gedaan, is deze afdeling niet van toepassing en geeft Onze Minister toepassing aan
      [artikel 90, tweede tot en met vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel90
