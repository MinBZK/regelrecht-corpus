  - number: '99'
    text: |-
      1 Tot reconstructie van een weg wordt, indien binnen de aanwezige of toekomstige zone van die weg woningen,
      andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn,
      niet overgegaan dan in overeenstemming met een bestemmingsplan of een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1] dat in de reconstructie voorziet dan wel met een besluit
      van burgemeester en wethouders, met overeenkomstige toepassing van [artikel 81][ref2] genomen naar aanleiding
      van een door de wegbeheerder aan burgemeester en wethouders gedane mededeling van zijn voornemen en na een met
      overeenkomstige toepassing van [artikel 80][ref3] ingesteld onderzoek.

      2 Indien redelijkerwijs kan worden aangenomen dat de reconstructie van een weg zal leiden tot een toename van de
      geluidsbelasting van 2 dB of meer vanwege andere wegen dan de te reconstrueren weg of – als een weg gedeeltelijk
      wordt gereconstrueerd – vanwege de niet te reconstrueren gedeelten daarvan, heeft het in het eerste lid bedoelde
      onderzoek tevens betrekking op die andere wegen of de niet te reconstrueren gedeelten van de betrokken weg.

      3 Bij het nemen van een besluit als bedoeld in het eerste lid worden de waarden die ingevolge de
      [artikelen 100][ref4], [100a][ref5] en [100b][ref6] als de ten hoogste toelaatbare worden aangemerkt, in acht
      genomen.

      4 Ingeval bij de reconstructie het aantal rijstroken zal worden verhoogd, wordt de zone in aanmerking genomen, die
      uit het hogere aantal rijstroken zal voortvloeien.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
