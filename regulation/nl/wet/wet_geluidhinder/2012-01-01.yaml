  - number: 106a
    text: |-
      Zodra dat van belang is voor de aanleg of wijziging van een landelijke spoorweg, geeft Onze Minister in
      overeenstemming met Onze Minister van Verkeer en Waterstaat na overleg met de betrokken spoorwegexploitant
      en de betrokken gemeenteraden en colleges van burgemeester en wethouders landelijke spoorwegen aan op een bij
      ministeriële regeling vast te stellen kaart.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel106a
  - number: 106b
    text: |-
      Langs een landelijke spoorweg bevindt zich een zone, waarvan de breedte, gemeten vanuit de buitenste spoorstaaf, is
      aangegeven op de in [artikel 106a][ref1] bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106a
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 106a
        hoofdstuk: VII
        afdeling: '2'
  - number: 106c
    text: |-
      1 Bij het voorbereiden van de aanleg van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die
      landelijke spoorweg aan te leggen wegen of spoorwegen zou worden ondervonden zonder de invloed van maatregelen die
      de geluidsoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen, om te voorkomen dat de in de toekomst binnen
      de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg aan te leggen wegen of spoorwegen optredende geluidsbelasting van de onder a bedoelde objecten, de waarden
      die ingevolge de [artikelen 106d tot en met 106h][ref1] als de ten hoogste toelaatbare worden aangemerkt, te boven
      gaan.

      2 Bij het voorbereiden van een wijziging van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek als bedoeld in het eerste lid ingesteld. Dit onderzoek geeft tevens inzicht in:

      a. de voor de wijziging ter plaatse heersende geluidsbelasting die door woningen, door andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of
      vanwege binnen het tracé van die landelijke spoorweg gelegen wegen of spoorwegen wordt ondervonden;

      b. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die
      landelijke spoorweg gelegen spoorwegen werd ondervonden op 1 juli 1987;

      c. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege binnen het tracé van die landelijke spoorweg gelegen wegen werd
      ondervonden op 1 maart 1986.

      3 Indien redelijkerwijs kan worden aangenomen dat de wijziging van een landelijke spoorweg zal leiden tot een
      aanpassing van wegen, heeft het in het eerste lid bedoelde onderzoek tevens betrekking op die wegen.

      4 De in het eerste lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een te wijzigen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg aan te leggen
      wegen en spoorwegen.

      5 De in het tweede lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een aan te leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen
      en spoorwegen.

      6 Onze Minister kan nadere regels stellen omtrent akoestische onderzoeken als bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
