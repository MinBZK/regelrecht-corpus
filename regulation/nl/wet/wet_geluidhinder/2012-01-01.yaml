  - number: 76a
    text: |-
      Bij het nemen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan wordt afgeweken, die geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone als
      bedoeld in [artikel 74][ref2], worden ter zake van de geluidsbelasting, vanwege de weg waarlangs die zone ligt, van
      de gevel van woningen, van andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen binnen
      die zone de waarden in acht genomen, die ingevolge de [artikelen 82][ref3], [83][ref4], [85][ref5], [100][ref6] en
      [100a ][ref7] als de ten hoogste toelaatbare worden aangemerkt.


