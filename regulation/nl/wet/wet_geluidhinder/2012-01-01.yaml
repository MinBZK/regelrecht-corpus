  - number: '45'
    text: |-
      1 Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting, bedoeld in [artikel 44][ref1], kan een hogere
      dan de in dat artikel genoemde waarde worden vastgesteld, met dien verstande dat deze waarde voor geprojecteerde
      woningen 55 dB(A) en voor aanwezige of in aanbouw zijnde woningen 60 dB(A) niet te boven mag gaan.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel45
