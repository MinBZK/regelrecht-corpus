  - number: '77'
    text: |-
      1 Bij het voorbereiden van de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan
      als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of
      gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref2], of bij
      het voorbereiden van een omgevingsvergunning als bedoeld in [artikel 76a][ref3], wordt vanwege burgemeester en
      wethouders een akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen binnen de zone, alsmede door andere geluidsgevoelige gebouwen of door
      geluidsgevoelige terreinen, vanwege de weg zou worden ondervonden zonder de invloed van maatregelen die de
      geluidsbelasting beperken;

      b. de doeltreffendheid van de in aanmerking komende verkeersmaatregelen en andere maatregelen om te voorkomen
      dat de in de toekomst vanwege de weg optredende geluidsbelasting van de onder a bedoelde objecten de waarden die
      ingevolge [artikel 82][ref4] of [artikel 100][ref5] als ten hoogste toelaatbare worden aangemerkt, te boven zou
      gaan.

      2 Indien wordt overwogen toepassing te geven aan [artikel 83][ref6], [85][ref7] of [100a][ref8] heeft het
      akoestisch onderzoek tevens betrekking op de doeltreffendheid van de maatregelen om te voldoen aan de vast te
      stellen hogere waarden voor de ten hoogste toelaatbare geluidsbelasting.

      3 Indien de vaststelling van het bestemmingsplan of van het wijzigings- of uitwerkingsplan of het besluit
      tot vrijstelling als bedoeld in het eerste lid betrekking heeft op de reconstructie van een weg, wordt tevens
      akoestisch onderzoek ingesteld naar de heersende waarde.


