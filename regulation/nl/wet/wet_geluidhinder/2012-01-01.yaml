      1 In het belang van het verkrijgen van gegevens ten behoeve van het instellen van geluidszones rond
      industrieterreinen en ten behoeve van de bepaling van binnen die geluidszones te nemen maatregelen ter beperking
      van de geluidhinder aldaar kunnen burgemeester en wethouders, binnen een door hen aan te geven termijn gegevens
      betreffende de geluiduitstraling verlangen van beheerders van inrichtingen, welke binnen een zodanige zone werkzaam
      zijn.

      2 Onze Minister kan omtrent de bepaling en de vastlegging van de in het eerste lid bedoelde gegevens regels
      stellen.

      3 Het eerste lid is niet van toepassing op industrieterreinen van regionaal belang die zijn aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref1] of de [Wet ruimtelijke ordening][ref2]. In dat geval
      hebben gedeputeerde staten de in het eerste lid genoemde bevoegdheden.

      4 Het eerste lid is niet van toepassing wanneer burgemeester en wethouders in overeenstemming met gedeputeerde
      staten besluiten dat gedeputeerde staten voor de [artikel 163, eerste lid][ref3], genoemde taken zorgdragen. In dat
      geval hebben gedeputeerde staten de in het eerste lid genoemde bevoegdheden.

      5 Het eerste lid is niet van toepassing op industrieterreinen waarop zich inrichtingen bevinden als bedoeld in
      [artikel 170, eerste lid][ref4]. In dat geval heeft Onze Minister de in het eerste lid genoemde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
