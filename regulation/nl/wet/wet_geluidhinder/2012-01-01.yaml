  - number: '50'
    text: |-
      Met betrekking tot nieuw te bouwen woningen in een gebied gelegen binnen een zone van een industrieterrein met
      activiteiten die zeehavengebonden zijn en die noodzakelijkerwijs in de openlucht plaatsvinden, kan in afwijking
      van [artikel 48][ref1] voor woningen waarvan de geluidsbelasting in hoofdzaak wordt bepaald door die activiteiten,
      een waarde worden vastgesteld van ten hoogste 60 dB(A), indien deze woningen worden gebouwd in het kader van een
      herstructurering, of planmatige verdichting van een bestaand woongebied, of wanneer de woningen worden gebouwd
      aansluitend aan het bestaande woongebied en slechts sprake is van een beperkte uitbreiding van het bestaande
      woongebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel48
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '48'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
  - number: '51'
    text: |-
      Met betrekking tot nieuw te bouwen woningen, die dienen ter vervanging van bestaande woningen of van andere
      geluidsgevoelige gebouwen waarvoor toepassing is gegeven aan [artikel 47, eerste lid][ref1], kan in afwijking van
      [artikel 48][ref2] een waarde worden vastgesteld van ten hoogste 65 dB(A), met dien verstande dat de vervanging
      niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedenbouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel48
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel51
