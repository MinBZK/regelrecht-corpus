  - number: 87b
    text: |-
      1 In deze afdeling wordt verstaan onder:

      a. Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat dan wel Onze Minister van Verkeer
      en Waterstaat, indien dat volgt uit de beslissing, bedoeld in [artikel 2, tweede lid, onderdeel e][ref1], of
      [artikel 4, eerste lid, onderdeel d, van de Tracéwet][ref2];

      b. hoofdweg: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, van de Tracéwet][ref3];

      c. aanleg, wijziging of verbreding van een hoofdweg: aanleg, wijziging of verbreding van een hoofdweg in de zin van
      [artikel 8 van de Tracéwet][ref4];

      d. woonwagenstandplaats: een standplaats als bedoeld in [artikel 1, eerste lid, onder h, van de Woningwet][ref5];

      e. andere geluidsgevoelige gebouwen:

      1°. onderwijsgebouwen;

      2°. ziekenhuizen en verpleeghuizen;

      3°. bij algemene maatregel van bestuur aan te wijzen andere gezondheidszorggebouwen dan bedoeld onder 2°;

      f. geluidsgevoelige terreinen:

      1°. terreinen die behoren bij gebouwen als bedoeld onder e, 3°, voor zover deze bestemd zijn of worden gebruikt
      voor de in die gebouwen verleende zorg, of

      2°. woonwagenstandplaatsen;

      g. tracé: tracé als omschreven in [artikel 10, eerste en tweede lid, van de Tracéwet][ref6];

      h. aanpassing van een weg: een aanpassing met betrekking tot een aanwezige weg waarvan uit akoestisch onderzoek als
      bedoeld in [artikel 87d][ref7] blijkt dat ten gevolge van die aanpassing de berekende geluidsbelasting vanwege de
      weg in het toekomstig maatgevende jaar zonder het treffen van maatregelen ten opzichte van de geluidsbelasting die
      op grond van deze afdeling en [afdeling 2 van hoofdstuk VII][ref8] als de ten hoogste toelaatbare geluidsbelasting
      geldt met 2 dB of meer wordt verhoogd;

      i. equivalent geluidsniveau in dB(A) met betrekking tot een spoorweg: het equivalente geluidsniveau in dB(A),
      bepaald volgens op grond van [artikel 107][ref9] vastgestelde regels;

      j. etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: de hoogste van de
      volgende drie waarden:

      1°. de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dagwaarde),

      2°. de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur
      (avondwaarde),

      3°. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur
      (nachtwaarde);

      k. geluidsbelasting in dB(A) vanwege een spoorweg: de etmaalwaarde van het equivalente geluidsniveau in dB(A)
      op een bepaalde plaats, veroorzaakt door het gezamenlijke spoorwegverkeer op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten;

      l. aanpassing van een spoorweg: een aanpassing met betrekking tot een aanwezige spoorweg, die verandering brengt
      in de omstandigheden welke ingevolge de regels die gelden bij de vaststelling van de geluidsbelasting vanwege die
      spoorweg in acht genomen moeten worden en waarvan uit akoestisch onderzoek blijkt dat de berekende geluidsbelasting
      vanwege de spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen hoger zal zijn dan 63
      dB of, indien die berekende geluidsbelasting vanwege de spoorweg in het toekomstig maatgevende jaar 63 dB of lager
      zal zijn maar hoger dan de geluidsbelasting die op grond van deze afdeling en [afdeling 2 van hoofdstuk VII][ref10]
      als de ten hoogste toelaatbare geluidsbelasting geldt, uit het onderzoek blijkt dat de geluidsbelasting vanwege de
      spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen ten opzichte van de geluidsbelasting
      voorafgaand aan de wijziging zal toenemen met ten minste 3 dB.

      2 Een gymnastieklokaal maakt voor de toepassing van deze afdeling geen deel uit van de in het eerste lid, onder e,
      1°, bedoelde scholen.

      3 Onder aanpassing van een spoorweg wordt in deze afdeling niet verstaan de afzonderlijke omstandigheid die bestaat
      uit:

      a. een verhoging van de intensiteit in het toekomstig maatgevende jaar van minder dan 45% ten opzichte van het
      driejaars gemiddelde voorafgaand aan de verandering, van door Onze Minister te bepalen categorieën spoorvoertuigen
      op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten, in één of meer perioden van het etmaal;

      b. een verhoging van 20% of minder van de verkeerssnelheid van door Onze Minister te bepalen categorieën
      spoorvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten, in één of meer perioden
      van het etmaal;

      c. een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;

      d. een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel

      e. het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister
      op grond van [artikel 107][ref11] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.

      4 Overwegende bezwaren van financiële aard bestaan voor de toepassing van deze afdeling niet tegen maatregelen
      gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige
      gebouwen, onderscheidenlijk aan de grens van geluidsgevoelige terreinen, waarvan de kosten in redelijke verhouding
      staan tot kwaliteit, aard en gebruik van de woning, het andere geluidsgevoelige gebouw of het geluidsgevoelige
      terrein en tot de doeltreffendheid van die maatregelen.

      5 Bij ministeriële regeling kunnen Onze Minister en Onze Minister van Verkeer en Waterstaat nadere regels stellen
      voor de toepassing van het criterium, bedoeld in het vierde lid.


