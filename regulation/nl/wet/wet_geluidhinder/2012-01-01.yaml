  - number: '90'
    text: |-
      1 Burgemeester en wethouders of indien toepassing wordt gegeven aan [artikel 98][ref1] burgemeester en wethouders
      of de wegaanlegger leggen het ingevolge [artikel 89, eerste lid][ref2], vastgestelde programma van maatregelen
      onverwijld voor aan Onze Minister.

      2 Behoudens het derde lid stelt Onze Minister na ontvangst van zodanig programma voor de woningen waarop het
      betrekking heeft, als de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege de weg, van de gevels
      een waarde van 48 dB vast. Onze Minister doet van zijn besluit mededeling aan burgemeester en wethouders en de
      wegbeheerder.

      3 In bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te stellen regels kan bij een
      besluit als bedoeld in het tweede lid voor de ten hoogste toelaatbare geluidsbelasting een hogere dan de in dat lid
      genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 68 dB niet te boven mag gaan.

      4 In afwijking van het derde lid kan in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij
      te stellen regels voor de ten hoogste toelaatbare geluidsbelasting een hogere dan de in dat lid genoemde waarde
      worden vastgesteld.

      5 Onze Minister stelt ten aanzien van elk van de daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege de weg, van de gevels van de betrokken woningen tot
      de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde. Deze maatregelen strekken tevens, afhankelijk
      van de hoogte van deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege de weg, binnen de woning.
      Op de door Onze Minister vastgestelde maatregelen is [hoofdstuk X][ref3] van toepassing. Hij doet van zijn
      besluit, houdende vaststelling van maatregelen, mededeling aan burgemeester en wethouders en aan de wegbeheerder
      of wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukX
