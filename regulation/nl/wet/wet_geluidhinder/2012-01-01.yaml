  - number: 100a
    text: |-
      1 Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting van de gevel van woningen kan een hogere waarde dan
      de ingevolge [artikel 100][ref1] geldende worden vastgesteld, met dien verstande dat:

      a. de verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:

      1°. ten gevolge van de reconstructie de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en

      2°. de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      reconstructie ten behoeve van de toepassing van [artikel 90][ref2] of [artikel 111, tweede of derde lid][ref3], met
      betrekking tot woningen die door de reconstructie een hogere geluidsbelasting ondervinden, en

      b. ingeval voor de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref4] of
      [artikel 84, tweede lid][ref5], zoals dat luidde voor 1 september 1991 of, indien geen toepassing is gegeven aan
      het betrokken artikel en de heersende waarde 53 dB niet te boven gaat, de waarde niet hoger mag worden gesteld dan:

      1°. 58 dB bij een reconstructie van een weg in buitenstedelijk gebied en

      2°. 63 dB bij een reconstructie van een weg in stedelijk gebied.

      2 De krachtens het eerste lid, onder a, te stellen hogere waarde mag niet hoger worden gesteld dan 68 dB.

      3 In afwijking van het tweede lid mag de waarde ingeval eerder bij of krachtens deze wet, de
      [Experimentenwet Stad en Milieu][ref6] of de [Interimwet stad- en milieubenadering][ref7] een hogere waarde dan 68
      dB is vastgesteld, niet hoger worden gesteld dan de eerder vastgestelde waarde.


