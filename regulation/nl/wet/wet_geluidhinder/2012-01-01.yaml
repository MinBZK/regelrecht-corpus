  - number: '58'
    text: |-
      Bij het nemen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan wordt afgeweken, die geheel of gedeeltelijk betrekking heeft op gronden die behoren tot een
      bestaande zone, worden ter zake van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen,
      van andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone, de waarden in
      acht genomen, die op het tijdstip van de vaststelling van de bestaande zone als de ten hoogste toelaatbare werden
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: '59'
    text: |-
      1 Met betrekking tot de ten hoogste toelaatbare geluidsbelasting, vanwege een industrieterrein, van de gevel van
      binnen de zone nieuw te bouwen en nog niet geprojecteerde woningen, zijn de [artikelen 44][ref1] en [45][ref2] van
      overeenkomstige toepassing met dien verstande dat de vast te stellen waarde 55 dB(A) niet te boven mag gaan.

      2 Met betrekking tot de ten hoogste toelaatbare geluidsbelasting vanwege een industrieterrein, van de gevel van
      binnen de zone nieuw te bouwen andere geluidsgevoelige gebouwen en aan de grens van binnen de zone nieuw aan te
      leggen geluidsgevoelige terreinen, is [artikel 47][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel47
