  - number: '82'
    text: |-
      1 Behoudens het in de [artikelen 83][ref1], [100][ref2] en [100a][ref3] bepaalde is de voor woningen binnen een
      zone ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de weg, 48 dB.

      2 Bij algemene maatregel van bestuur worden waarden vastgesteld voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege een weg, van de gevel van andere geluidsgevoelige gebouwen, alsmede aan de grens van geluidsgevoelige
      terreinen binnen een zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel100
