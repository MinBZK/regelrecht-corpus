  - number: '42'
    text: |-
      1 Bij het voorbereiden van de vaststelling of wijziging van een zone, wordt vanwege burgemeester en wethouders een
      akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen binnen de ontworpen zone, alsmede door andere geluidsgevoelige gebouwen of
      door geluidsgevoelige terreinen, vanwege het industrieterrein ten hoogste zou kunnen worden ondervonden zonder de
      invloed van maatregelen die de geluidsbelasting beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege
      het industrieterrein optredende geluidsbelasting van de onder a bedoelde objecten de waarden die ingevolge de
      [artikelen 44][ref1] en [47, eerste lid][ref2], als ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.

      2 Indien wordt overwogen toepassing te geven aan [artikel 45][ref3], [46][ref4] of [47, tweede lid][ref5], heeft
      het akoestisch onderzoek tevens betrekking op de doeltreffendheid van de maatregelen om te voldoen aan de vast te
      stellen hogere waarde voor de ten hoogste toelaatbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel45
