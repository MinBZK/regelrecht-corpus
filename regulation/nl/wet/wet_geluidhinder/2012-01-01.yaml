  - number: '100'
    text: |-
      1 Behoudens het tweede en derde lid is de ten hoogste toelaatbare geluidsbelasting vanwege een te reconstrueren
      weg, van de gevel van woningen binnen de zone 48 dB.

      2 Ingeval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1], de
      [Interimwet stad-en-milieubenadering][ref2], of de [Spoedwet wegverbreding][ref3] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de te reconstrueren weg, van de gevel van woningen binnen de zone is
      vastgesteld dan 48 dB, en de heersende waarde hoger is dan 48 dB, geldt de laagste van de volgende twee waarden als
      de ten hoogste toelaatbare:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Ingeval de weg op 1 januari 2007 aanwezig, in aanleg of geprojecteerd was en niet eerder een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting vanwege de te reconstrueren weg is vastgesteld dan 48 dB,
      en de heersende waarde hoger is dan 48 dB, geldt als de ten hoogste toelaatbare geluidsbelasting vanwege de
      te reconstrueren weg, van de gevel van woningen binnen de zone die op 1 januari 2007 aanwezig, in aanbouw of
      geprojecteerd waren de heersende waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0015158
