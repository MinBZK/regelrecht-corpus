  - number: 110d
    text: |-
      Ten behoeve van de vaststelling van de geluidsbelasting vanwege een industrieterrein, weg of spoorweg wordt voor
      het bepalen van het equivalente geluidsniveau bij ministeriële regeling aangegeven:

      a. op welke wijze en met inachtneming van welke bestaande of te verwachten omstandigheden, de afwisselende niveaus
      van het ter plaatse optredende geluid worden vastgesteld, en

      b. op welke wijze uit de over een bepaalde periode verkregen uitkomsten het in vorengenoemde omschrijving bedoelde
      gemiddelde wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel110d
  - number: 110e
    text: |-
      Onze Minister kan regels stellen omtrent al hetgeen betrekking heeft op de wijze waarop de akoestische onderzoeken,
      bedoeld in deze wet, worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003227/2012-01-01#Artikel110e
  - number: 110f
    text: |-
      1 Indien een van de volgende onderdelen van deze wet of van het krachtens deze onderdelen bepaalde:

      a. [Afdeling 1][ref1] en [afdeling 2 van hoofdstuk V][ref2],

      b. [Afdeling 2][ref3], [2a][ref4], [3][ref5] en [4 van hoofdstuk VI][ref6],

      c. [hoofdstuk VII][ref7], en

      d. [hoofdstuk VIII][ref8],

      van toepassing is op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen gelegen in twee
      of meer aanwezige of toekomstige geluidszones als bedoeld in de [artikelen 40][ref9], [52][ref10], [74][ref11],
      [106b][ref12] en [108][ref13], of als vastgesteld krachtens [artikel 107][ref14], dan wel in één of meer hiervoor
      genoemde geluidszones alsmede in een met het oog op de geluidsbelasting vastgesteld beperkingengebied als bedoeld
      in [hoofdstuk 8][ref15] of [artikel 10.17 van de Wet luchtvaart][ref16], dient degene, die bij of krachtens
      deze wet verplicht is tot het verrichten van een akoestisch onderzoek, ter plaatse van die woningen, andere
      geluidsgevoelige gebouwen en geluidsgevoelige terreinen, overeenkomstig de door Onze Minister gestelde regels,
      tevens onderzoek te doen naar de effecten van de samenloop van de verschillende geluidsbronnen. Aangegeven dient te
      worden op welke wijze met de samenloop rekening is gehouden bij de te treffen maatregelen.

      2 Indien in een bepaald gebied een of meer van de in het eerste lid genoemde onderdelen van deze wet of van het
      krachtens die onderdelen bepaalde van toepassing zijn, terwijl voor dat gebied tevens uit anderen hoofde van
      Rijkswege een saneringsprogramma ter zake van het voorkomen of bestrijden van geluidhinder moet worden opgesteld,
      draagt Onze Minister zorg voor de noodzakelijke onderlinge afstemming en samenhang van de te treffen maatregelen.

      3 Het eerste en tweede lid zijn uitsluitend van toepassing indien voor een woning, ander geluidgevoelig gebouw of
      geluidgevoelig terrein:

      a. een hogere waarde zal worden vastgesteld, en

      b. voor dezelfde woning, ander geluidsgevoelig gebouw of geluidsgevoelig terrein, de geluidsbelasting, vanwege
      tenminste een andere geluidsbron als bedoeld in het eerste lid, in de toekomstige situatie de voorkeurswaarde
      overschrijdt.

      4 Het eerste en tweede lid worden alleen toegepast ten aanzien van geluidsbronnen als bedoeld in het eerste lid
      waarvan de geluidsbelasting in de toekomstige situatie de voorkeurswaarde overschrijdt.

      5 Ten behoeve van de uitvoering van het eerste lid kan Onze Minister bepalen, dat bij de berekening en meting van
      de onderscheidene geluidsbelastingen van de gevels van de woningen en andere geluidsgevoelige gebouwen en de grens
      van geluidsgevoelige terreinen op de resultaten een door hem aan te geven correctie kan worden toegepast.


