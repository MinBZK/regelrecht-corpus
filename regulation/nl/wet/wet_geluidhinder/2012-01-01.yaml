  - number: '65'
    text: |-
      Bij de toepassing van [artikel 2.14, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref1]
      kan het bevoegd gezag, in afwijking van de [artikelen 40][ref2], [44 tot en met 47][ref3], [50][ref4], [51][ref5],
      [53 tot en met 56][ref6], [59 tot en met 61][ref7], [63, tweede lid][ref8], of [64][ref9] de in die artikelen
      bedoelde waarden 2 dB(A) hoger vaststellen, indien:

      a. op een of meer plaatsen binnen de zone of op de zonegrens de geluidsbelasting gelijk is aan de ten hoogste
      toegestane geluidsbelasting;

      b. voorzover van toepassing, de beschikbaarheid van grond voor de vestiging of wijziging van een inrichting, dit
      mogelijk maakt;

      c. de geluidsbelasting in belangrijke mate wordt bepaald door inrichtingen waartoe
      [artikel 8.40 van de Wet milieubeheer][ref10] is toegepast, en

      d. redelijkerwijs kan worden aangenomen dat de geluidsbelasting binnen een afzienbare termijn teruggebracht zal
      worden op het niveau van de eerder geldende waarden.


