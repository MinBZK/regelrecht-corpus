  - number: 87g
    text: |-
      1 Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé
      van die hoofdweg gelegen wegen, indien de geluidsbelasting vanwege deze hoofdweg of vanwege binnen het tracé van
      die hoofdweg gelegen wegen op 1 maart 1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk
      na ingebruikneming van de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen hoger was dan 60 dB(A), de
      waarde 48 dB.

      2 Ingeval eerder bij of krachtens deze wet of de [Spoedwet wegverbreding][ref1] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de betrokken weg of wegen is vastgesteld dan 48 dB, is de voor
      woningen binnen de zone van een te wijzigen of te verbreden hoofdweg ten gevolge waarvan de hoofdweg of binnen
      het tracé van die hoofdweg gelegen wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel,
      vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen:

      a. 48 dB als de heersende waarde lager is dan of gelijk is aan 48 dB, en

      b. de laagste van de volgende twee waarden als de heersende waarde hoger is dan 48 dB:

      1°. de heersende waarde;

      2°. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 68 dB niet te boven mag gaan.

      4 Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat de
      verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:

      1°. ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal
      woningen elders met een ten minste gelijke waarde zal verminderen, en

      2°. de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, tweede of vierde lid][ref2], met betrekking
      tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden. De krachtens dit lid vast
      te stellen waarde mag de waarde 68 dB niet te boven gaan.

      5 In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref3], een hogere waarde dan 68 dB vaststellen.

      6 Indien eerder bij of krachtens deze wet of de [Spoedwet wegverbreding][ref4] een hogere waarde dan 68 dB is
      vastgesteld, mag de vast te stellen hogere waarde, in afwijking van het vierde lid, niet hoger worden vastgesteld
      dan de eerder vastgestelde waarde.

      7 Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, tot de
      ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren
      ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      8 De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen.

      9 De in het eerste tot en met vierde en zevende en achtste lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat:

      a. in het derde en vierde lid in plaats van «de waarde 68 dB» telkens wordt gelezen «met betrekking tot
      andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref5],
      de waarde 68 dB, onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 87b, eerste lid, onder e, 3°][ref6], de waarde 58 dB», en

      b. het vierde lid, onder 1° en 2°, niet van toepassing is.


