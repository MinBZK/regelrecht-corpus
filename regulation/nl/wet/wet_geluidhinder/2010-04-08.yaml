      zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met toepassing van
      [artikel 55, eerste en tweede lid][ref1], zullen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel55
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '55'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '2'
  - number: '57.3'
    text: |-
      De [artikelen 42][ref1] en [43][ref2] zijn van overeenkomstige toepassing in geval van vaststelling van een
      bestemmingsplan of van een wijzigings- of uitwerkingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      reeds behorende tot een bestaande zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel43
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '42'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '43'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '58'
    text: |-
      Bij het nemen van een projectbesluit, dat geheel of gedeeltelijk betrekking heeft op gronden die behoren tot een
      bestaande zone, worden ter zake van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen,
      van andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone, de waarden in
      acht genomen, die op het tijdstip van de vaststelling van de bestaande zone als de ten hoogste toelaatbare werden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel58
  - number: '59.1'
    text: |-
      Met betrekking tot de ten hoogste toelaatbare geluidsbelasting, vanwege een industrieterrein, van de gevel van
      binnen de zone nieuw te bouwen en nog niet geprojecteerde woningen, zijn de [artikelen 44][ref1] en [45][ref2] van
      overeenkomstige toepassing met dien verstande dat de vast te stellen waarde 55 dB(A) niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel45
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '44'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '45'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '59.2'
    text: |-
      Met betrekking tot de ten hoogste toelaatbare geluidsbelasting vanwege een industrieterrein, van de gevel van
      binnen de zone nieuw te bouwen andere geluidsgevoelige gebouwen en aan de grens van binnen de zone nieuw aan te
      leggen geluidsgevoelige terreinen, is [artikel 47][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '47'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '60'
    text: |-
      Bij toepassing van [artikel 59][ref1] met betrekking tot nieuw te bouwen woningen in een gebied gelegen binnen
      een bestaande zone van een industrieterrein met activiteiten die zeehavengebonden zijn en die noodzakelijkerwijs
      in de open lucht plaatsvinden, kan voor woningen waarvan de geluidsbelasting in hoofdzaak wordt bepaald door die
      activiteiten, een waarde worden vastgesteld van ten hoogste 60 dB(A), indien deze woningen worden gebouwd in het
      kader van een herstructurering, of planmatige verdichting van een bestaand woongebied, of wanneer de woningen
      worden gebouwd aansluitend aan het bestaande woongebied en slechts sprake is van een beperkte uitbreiding van het
      bestaande woongebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel59
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '59'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '2'
  - number: '61'
    text: |-
      Bij toepassing van [artikel 59][ref1] met betrekking tot nieuw te bouwen woningen, die dienen ter vervanging
      van bestaande woningen of van andere geluidsgevoelige gebouwen waarvoor een hogere waarde dan de ten hoogste
      toelaatbare waarde is vastgesteld, kan een waarde worden vastgesteld van ten hoogste 65 dB(A), met dien verstande
      dat de vervanging niet zal leiden tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel59
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '59'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '2'
  - number: 61.a
    text: een ingrijpende wijziging van de bestaande stedenbouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel61
  - number: 61.b
    text: |-
      een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel61
  - number: '62.1'
    text: |-
      Gedeputeerde staten stellen uitsluitend ten aanzien van de woningen die op grond van artikel 62, eerste lid,
      zoals dat luidde voor 1 januari 2007 aan gedeputeerde staten zijn gemeld, met inachtneming van de regels,
      gegeven krachtens het tweede lid, en gelet op de maatregelen, in verband met andere woningen binnen de zone
      voortvloeiend uit de zonevaststelling, bedoeld in [afdeling 2, §§ 2][ref1] en [3, van hoofdstuk V][ref2] van
      de Wet geluidhinder zoals deze luidden op 1 januari 2007, een programma op van maatregelen die naar hun oordeel
      in aanmerking komen om de geluidsbelasting, vanwege het industrieterrein, van de gevels van de in het eerste lid
      bedoelde woningen te beperken tot 55 dB(A) en te voldoen aan [artikel 111, eerste lid, onder a][ref3]. Bij algemene
      maatregel van bestuur kan worden bepaald dat tevens één of meer overeenkomstige programma's dienen te worden
      opgesteld, gericht op een beperking van de geluidsbelasting van de gevels van de bedoelde woningen tot bij de
      maatregel aangegeven hogere waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: V
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '111'
        hoofdstuk: VIIIb
  - number: '62.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven omtrent de aard van de maatregelen die in aanmerking komen
      en omstandigheden waaronder dit het geval is, alsmede met betrekking tot de opzet van een programma als bedoeld in
      het tweede lid en het tijdstip van uitvoering daarvan. Hierbij kan tevens worden aangegeven dat gedeputeerde staten
      in aangegeven categorieën van gevallen bij het opstellen van een programma kunnen uitgaan van een geluidsbelasting
      die het gevolg is van te verwachten ontwikkelingen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel62
  - number: '63.1'
    text: |-
      Gedeputeerde staten leggen het ingevolge [artikel 62, eerste lid][ref1], opgestelde programma van maatregelen
      onverwijld voor aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '62'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '2'
  - number: '63.2'
    text: |-
      Onze Minister stelt voor de woningen waarop het programma betrekking heeft, binnen zes maanden na ontvangst daarvan
      de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege het industrieterrein, van de gevel vast, met
      dien verstande dat deze waarde de 65 dB(A) niet te boven mag gaan. De gelding van deze waarde kan aan voorwaarden
      worden gebonden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel63
  - number: '63.3'
    text: |-
      Onze Minister doet van zijn besluit mededeling aan gedeputeerde staten en aan burgemeester en wethouders.
      Gelijktijdig met deze mededeling deelt hij ten aanzien van elk der gevallen waarop het besluit betrekking heeft
      en die naar zijn aanvankelijk oordeel voor toepassing van het vierde lid in aanmerking komen, aan gedeputeerde
      staten en aan burgemeester en wethouders mede in hoeverre en op welke termijn hij overweegt aan dat lid ter zake
      toepassing te geven.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel63
  - number: '63.4'
    text: |-
      Onze Minister stelt ten aanzien van elk der daarvoor in aanmerking komende gevallen maatregelen vast die strekken
      tot het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van de gevels van de betrokken
      woningen tot de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde. Deze maatregelen strekken
      tevens, afhankelijk van de hoogte van deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege het
      industrieterrein, binnen de woning. Op de door Onze Minister vastgestelde maatregelen zijn [artikel 125][ref1]
      en [artikel 15.20, eerste lid, onder c, van de Wet milieubeheer][ref2] van toepassing. Hij doet van zijn besluit,
      houdende de vaststelling van maatregelen, mededeling aan gedeputeerde staten en aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '125'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15'
  - number: '64'
    text: |-
      Met betrekking tot andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen worden bij algemene maatregel
      van bestuur omtrent de onderwerpen die met betrekking tot woningen geregeld zijn in de [artikelen 62][ref1] en
      [63][ref2] regels gesteld. Daarbij kunnen bepalingen van die artikelen van overeenkomstige toepassing worden
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel63
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel64
