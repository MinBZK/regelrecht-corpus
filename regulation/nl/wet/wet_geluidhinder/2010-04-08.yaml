  - number: '67.1'
    text: |-
      Indien de geluidbelasting buiten een bestaande zone vanwege een industrieterrein de waarde van 50 dB(A)
      overschrijdt of op een of meer plaatsen binnen de zone of op de zonegrens de geluidsbelasting hoger is dan de ten
      hoogste toegestane geluidsbelasting, stellen burgemeester en wethouders voor het betreffende industrieterrein een
      geluidreductieplan vast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
  - number: '67.2'
    text: 'Een geluidreductieplan bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
  - number: 67.2.a
    text: het te voeren beleid om de geluidbelasting binnen en buiten de bestaande zone te beperken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
  - number: 67.2.b
    text: |-
      de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om de geluidbelasting binnen die periode voor
      het hele industrieterrein te verminderen tot beneden de bedoelde grenswaarden;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
  - number: 67.2.c
    text: |-
      de wijze waarop de vermindering van de geluidsbelasting van het betreffende industrieterrein zal worden
      gerealiseerd indien de geluidsbelasting binnen de onder b genoemde periode niet is verminderd tot beneden de
      grenswaarden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
  - number: '67.3'
    text: |-
      [Artikel 123][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel123
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '123'
        hoofdstuk: IX
        paragraaf: '3'
  - number: '74.1'
    text: |-
      Een weg heeft een zone die zich uitstrekt vanaf de as van de weg tot de volgende breedte aan weerszijden van de
      weg:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.a
    text: 'in stedelijk gebied:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.a.1°
    text: 'voor een weg, bestaande uit drie of meer rijstroken: 350 meter;'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.a.2°
    text: 'voor een weg, bestaande uit een of twee rijstroken: 200 meter;'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.b
    text: 'in buitenstedelijk gebied:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.b.1°
    text: 'voor een weg, bestaande uit vijf of meer rijstroken: 600 meter;'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.b.2°
    text: 'voor een weg, bestaande uit drie of vier rijstroken: 400 meter;'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.1.b.3°
    text: 'voor een weg, bestaande uit een of twee rijstroken: 250 meter.'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: '74.2'
    text: 'Het eerste lid geldt niet met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.2.a
    text: wegen die gelegen zijn binnen een als woonerf aangeduid gebied;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: 74.2.b
    text: wegen waarvoor een maximum snelheid van 30 km per uur geldt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: '74.3'
    text: |-
      Voor de toepassing van [artikel 76][ref1] wordt, indien het een nog aan te leggen weg betreft, de daarbij behorende
      zone geacht aanwezig te zijn, zodra die weg in een ontwerp-bestemmingsplan is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: '74.4'
    text: De ruimte boven en onder de weg behoort tot de zone langs de weg.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel74
  - number: '75.1'
    text: |-
      De afstanden, genoemd in [artikel 74, eerste lid][ref1], worden aan weerszijden van de weg gemeten vanaf de
      buitenste begrenzing van de buitenste rijstrook.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
  - number: '75.2'
    text: |-
      Indien zich langs een weg een zone bevindt die bestaat uit delen met een onderling verschillende breedte, geldt
      voor de aansluiting van de verschillende zonedelen dat het breedste zonedeel over een afstand gelijk aan een derde
      van de breedte van dat zonedeel, gemeten vanaf het punt van versmalling van de zonebreedte, nog langs de wegas
      doorloopt en met een loodlijn aansluit op de smalste zone.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel75
  - number: '75.3'
    text: |-
      Aan de uiteinden van een weg loopt de zone door over een afstand gelijk aan de breedte van de zone ter hoogte van
      het einde van de weg. De zone loopt door langs een lijn die is gelegen in het verlengde van de wegas. Zij behoudt
      de breedte die zij had ter hoogte van het einde van de weg.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel75
  - number: '76.1'
    text: |-
      Bij de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of gedeeltelijk
      betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref2], worden ter zake van de
      geluidsbelasting, vanwege de weg waarlangs die zone ligt, van de gevel van woningen, van andere geluidsgevoelige
      gebouwen en van geluidsgevoelige terreinen binnen die zone de waarden in acht genomen, die ingevolge
      [artikel 82][ref3] en [100][ref4] als de ten hoogste toelaatbare worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel100
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '76.2'
    text: |-
      In afwijking van het eerste lid worden bij de vaststelling van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan als in dat lid bedoeld hogere waarden in acht genomen, voor zover:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76
  - number: 76.2.a
    text: |-
      met toepassing van [artikel 83][ref1], [85][ref2] of [100a][ref3] voor de vaststelling van het bestemmingsplan
      zodanige waarden zijn vastgesteld, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: 76.2.b
    text: |-
      zodanige waarden noodzakelijk zijn als gevolg van een vaststelling van het plan in afwijking van het ontwerp, zoals
      dit ter inzage heeft gelegen, welke waarden redelijkerwijs met toepassing van [artikel 83][ref1], [85][ref2] of
      [100a][ref3], zullen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '76.3'
    text: |-
      Indien op het tijdstip van de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan een
      weg reeds aanwezig of in aanleg is, gelden het eerste en tweede lid niet met betrekking tot de daarbij in het
      plan of in de zone van de betreffende weg opgenomen woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen, die op dat tijdstip reeds aanwezig of in aanbouw zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76
  - number: 76a
    text: |-
      Bij het nemen van een projectbesluit dat geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone
      als bedoeld in [artikel 74][ref1], worden ter zake van de geluidsbelasting, vanwege de weg waarlangs die zone ligt,
      van de gevel van woningen, van andere geluidsgevoelige gebouwen of aan de grens van geluidsgevoelige terreinen
      binnen die zone de waarden in acht genomen, die ingevolge de [artikelen 82][ref2], [83][ref3], [85][ref4],
      [100][ref5] en [100a ][ref6] als de ten hoogste toelaatbare worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel100
      [ref6]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel76a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '85'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '77.1'
    text: |-
      Bij het voorbereiden van de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan
      als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of
      gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref2], of bij het
      voorbereiden van een besluit als bedoeld in [artikel 76a][ref3], wordt vanwege burgemeester en wethouders een
      akoestisch onderzoek ingesteld naar:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel76a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 76a
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: 77.1.a
    text: |-
      de geluidsbelasting die door woningen binnen de zone, alsmede door andere geluidsgevoelige gebouwen of door
      geluidsgevoelige terreinen, vanwege de weg zou worden ondervonden zonder de invloed van maatregelen die de
      geluidsbelasting beperken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel77
  - number: 77.1.b
    text: |-
      de doeltreffendheid van de in aanmerking komende verkeersmaatregelen en andere maatregelen om te voorkomen dat de
      in de toekomst vanwege de weg optredende geluidsbelasting van de onder a bedoelde objecten de waarden die ingevolge
      [artikel 82][ref1] of [artikel 100][ref2] als ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel100
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '77.2'
    text: |-
      Indien wordt overwogen toepassing te geven aan [artikel 83][ref1], [85][ref2] of [100a][ref3] heeft het akoestisch
      onderzoek tevens betrekking op de doeltreffendheid van de maatregelen om te voldoen aan de vast te stellen hogere
      waarden voor de ten hoogste toelaatbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '85'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '77.3'
    text: |-
      Indien de vaststelling van het bestemmingsplan of van het wijzigings- of uitwerkingsplan of het besluit tot
      vrijstelling als bedoeld in het eerste lid betrekking heeft op de reconstructie van een weg, wordt tevens
      akoestisch onderzoek ingesteld naar de heersende waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel77
  - number: '79'
    text: |-
      Tot aanleg van een weg anders dan op grondslag van een overeenkomstig de [artikelen 76][ref1] en [77][ref2]
      vastgesteld of herzien bestemmingsplan wordt, indien binnen de aanwezige of toekomstige zone woningen, dan wel
      andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn, niet
      overgegaan dan in overeenstemming met een besluit van burgemeester en wethouders, krachtens [artikel 81][ref3]
      genomen naar aanleiding van een door de wegaanlegger aan burgemeester en wethouders gedane mededeling van zijn
      voornemen en na een overeenkomstig [artikel 80][ref4] ingesteld onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel81
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel80
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '81'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '80'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '80.1'
    text: |-
      Vanwege de wegaanlegger wordt binnen de zone een akoestisch onderzoek van de in [artikel 77][ref1] omschreven
      strekking ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel77
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: '80.2'
    text: |-
      De resultaten van het ingestelde onderzoek worden door de wegaanlegger aan burgemeester en wethouders
      overgelegd te zamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in
      [artikel 81, eerste lid][ref1], omschreven doel.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel81
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '81'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '81.1'
    text: |-
      Binnen drie maanden nadat de resultaten van het in [artikel 80][ref1] bedoelde onderzoek zijn verkregen,
      nemen burgemeester en wethouders een besluit, bepalende welke maatregelen nodig zijn om te voorkomen dat
      de geluidsbelasting die de weg na zijn aanleg binnen de zone zal veroorzaken, de waarden die ingevolge de
      [artikelen 82][ref2], [83][ref3] en [85][ref4] als de ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel85
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '80'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '85'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: '81.2'
    text: Van het besluit wordt mededeling gedaan aan de wegaanlegger.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel81
  - number: '82.1'
    text: |-
      Behoudens het in de [artikelen 83][ref1], [100][ref2] en [100a][ref3] bepaalde is de voor woningen binnen een zone
      ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de weg, 48 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel100
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '82.2'
    text: |-
      Bij algemene maatregel van bestuur worden waarden vastgesteld voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege een weg, van de gevel van andere geluidsgevoelige gebouwen, alsmede aan de grens van geluidsgevoelige
      terreinen binnen een zone.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel82
  - number: '83.1'
    text: |-
      Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, eerste lid][ref1], kan een
      hogere dan de in dat artikel genoemde waarde worden vastgesteld, met dien verstande dat deze waarde, buiten de in
      de volgende leden bedoelde gevallen, voor woningen in buitenstedelijk gebied 53 dB en voor woningen in stedelijk
      gebied 58 dB niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: '83.2'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot in stedelijk gebied nog te bouwen woningen die nog niet zijn
      geprojecteerd, kan voor de aanwezige of te verwachten geluidsbelasting vanwege een aanwezige weg een hogere dan de
      in dat lid genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 63 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.3'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot woningen die reeds aanwezig of in aanbouw zijn, kan voor de
      toekomstige geluidsbelasting vanwege een weg die nog niet geprojecteerd is:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.3.a
    text: |-
      voor zover het woningen in stedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 63 dB niet te boven mag gaan;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.3.b
    text: |-
      voor zover het woningen in buitenstedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 58 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.4'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot in buitenstedelijk gebied nog te bouwen woningen die nog niet
      zijn geprojecteerd en die ter plaatse noodzakelijk zijn vanwege de uitoefening van een agrarisch bedrijf, kan een
      hogere waarde worden vastgesteld die de waarde van 58 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.5'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot in het stedelijk gebied nog te bouwen woningen die nog
      niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige gebouwen,
      kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 68 dB worden
      vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.5.a
    text: een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.5.b
    text: |-
      een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.6'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot binnen de bebouwde kom nog te bouwen woningen binnen de
      zone langs een autoweg of autosnelweg als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref1],
      die nog niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige
      gebouwen, kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 63 dB
      worden vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 83.6.a
    text: een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.6.b
    text: |-
      een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.7'
    text: |-
      Bij toepassing van het eerste lid met betrekking tot buiten de bebouwde kom nog te bouwen woningen die nog niet
      zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of andere geluidsgevoelige gebouwen,
      kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde van ten hoogste 58 dB worden
      vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.7.a
    text: een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: 83.7.b
    text: |-
      een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '83.8'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel83
  - number: '85.1'
    text: |-
      Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, tweede lid][ref1], kunnen
      hogere dan de krachtens dat lid bepaalde waarden worden vastgesteld, met dien verstande dat deze waarden bij
      algemene maatregel van bestuur te stellen grenzen niet te boven mogen gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: '85.2'
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid,
      enkel in bij die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel85
  - number: 87b.1
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.a
    text: |-
      Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat dan wel Onze Minister van Verkeer en
      Waterstaat, indien dat volgt uit de beslissing, bedoeld in [artikel 2, tweede lid, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 87b.1.b
    text: |-
      hoofdweg: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder c, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 87b.1.c
    text: |-
      aanleg, wijziging of verbreding van een hoofdweg: aanleg, wijziging of verbreding van een hoofdweg in de zin van
      [artikel 2 van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 87b.1.d
    text: |-
      woonwagenstandplaats: een standplaats als bedoeld in [artikel 1, eerste lid, onder h, van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 87b.1.e
    text: 'andere geluidsgevoelige gebouwen:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.e.1°
    text: onderwijsgebouwen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.e.2°
    text: ziekenhuizen en verpleeghuizen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.e.3°
    text: bij algemene maatregel van bestuur aan te wijzen andere gezondheidszorggebouwen dan bedoeld onder 2°;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.f
    text: 'geluidsgevoelige terreinen:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.f.1°
    text: |-
      terreinen die behoren bij gebouwen als bedoeld onder e, 3°, voor zover deze bestemd zijn of worden gebruikt voor de
      in die gebouwen verleende zorg, of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.f.2°
    text: woonwagenstandplaatsen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.g
    text: |-
      tracé: tracé als bedoeld in [artikel 1, eerste lid, onder h, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 87b.1.h
    text: |-
      aanpassing van een weg: een aanpassing met betrekking tot een aanwezige weg waarvan uit akoestisch onderzoek als
      bedoeld in [artikel 87d][ref1] blijkt dat ten gevolge van die aanpassing de berekende geluidsbelasting vanwege de
      weg in het toekomstig maatgevende jaar zonder het treffen van maatregelen ten opzichte van de geluidsbelasting die
      op grond van deze afdeling en [afdeling 2 van hoofdstuk VII][ref2] als de ten hoogste toelaatbare geluidsbelasting
      geldt met 2 dB of meer wordt verhoogd;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87d
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87d
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VII
        afdeling: '2'
  - number: 87b.1.i
    text: |-
      equivalent geluidsniveau in dB(A) met betrekking tot een spoorweg: het equivalente geluidsniveau in dB(A), bepaald
      volgens op grond van [artikel 107][ref1] vastgestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '107'
        hoofdstuk: VII
        afdeling: '3'
  - number: 87b.1.j
    text: |-
      etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: de hoogste van de volgende
      drie waarden:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.j.1°
    text: de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dagwaarde),
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.j.2°
    text: de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur (avondwaarde),
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.j.3°
    text: de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur (nachtwaarde);
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.k
    text: |-
      geluidsbelasting in dB(A) vanwege een spoorweg: de etmaalwaarde van het equivalente geluidsniveau in dB(A) op
      een bepaalde plaats, veroorzaakt door het gezamenlijke spoorwegverkeer op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.1.l
    text: |-
      aanpassing van een spoorweg: een aanpassing met betrekking tot een aanwezige spoorweg, die verandering brengt in
      de omstandigheden welke ingevolge de regels die gelden bij de vaststelling van de geluidsbelasting vanwege die
      spoorweg in acht genomen moeten worden en waarvan uit akoestisch onderzoek blijkt dat de berekende geluidsbelasting
      vanwege de spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen hoger zal zijn dan 63
      dB of, indien die berekende geluidsbelasting vanwege de spoorweg in het toekomstig maatgevende jaar 63 dB of lager
      zal zijn maar hoger dan de geluidsbelasting die op grond van deze afdeling en [afdeling 2 van hoofdstuk VII][ref1]
      als de ten hoogste toelaatbare geluidsbelasting geldt, uit het onderzoek blijkt dat de geluidsbelasting vanwege de
      spoorweg in het toekomstig maatgevende jaar zonder het treffen van maatregelen ten opzichte van de geluidsbelasting
      voorafgaand aan de wijziging zal toenemen met ten minste 3 dB.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VII
        afdeling: '2'
  - number: 87b.2
    text: |-
      Een gymnastieklokaal maakt voor de toepassing van deze afdeling geen deel uit van de in het eerste lid, onder e,
      1°, bedoelde scholen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3
    text: |-
      Onder aanpassing van een spoorweg wordt in deze afdeling niet verstaan de afzonderlijke omstandigheid die bestaat
      uit:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3.a
    text: |-
      een verhoging van de intensiteit in het toekomstig maatgevende jaar van minder dan 45% ten opzichte van het
      driejaars gemiddelde voorafgaand aan de verandering, van door Onze Minister te bepalen categorieën spoorvoertuigen
      op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten, in één of meer perioden van het etmaal;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3.b
    text: |-
      een verhoging van 20% of minder van de verkeerssnelheid van door Onze Minister te bepalen categorieën
      spoorvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten, in één of meer perioden
      van het etmaal;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3.c
    text: een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3.d
    text: een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.3.e
    text: |-
      het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister op
      grond van [artikel 107][ref1] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '107'
        hoofdstuk: VII
        afdeling: '3'
  - number: 87b.4
    text: |-
      Overwegende bezwaren van financiële aard bestaan voor de toepassing van deze afdeling niet tegen maatregelen
      gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige
      gebouwen, onderscheidenlijk aan de grens van geluidsgevoelige terreinen, waarvan de kosten in redelijke verhouding
      staan tot kwaliteit, aard en gebruik van de woning, het andere geluidsgevoelige gebouw of het geluidsgevoelige
      terrein en tot de doeltreffendheid van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87b.5
    text: |-
      Bij ministeriële regeling kunnen Onze Minister en Onze Minister van Verkeer en Waterstaat nadere regels stellen
      voor de toepassing van het criterium, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87b
  - number: 87c
    text: |-
      De [afdelingen 2][ref1], [3][ref2], [4][ref3] en [6][ref4] van dit hoofdstuk, alsmede
      [afdeling 1 van hoofdstuk VIIIA][ref5], zijn niet van toepassing op deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref5]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0003227
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 87d.1
    text: |-
      Bij het voorbereiden van de aanleg van een hoofdweg wordt vanwege Onze Ministers een akoestisch onderzoek ingesteld
      naar:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.1.a
    text: |-
      de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen of
      spoorwegen zou worden ondervonden zonder de invloed van maatregelen die de geluidsoverdracht beperken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.1.b
    text: |-
      de doeltreffendheid van de in aanmerking komende maatregelen, om te voorkomen dat de in de toekomst binnen
      de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen
      of spoorwegen optredende geluidsbelasting van de onder a bedoelde objecten, de waarden die ingevolge de
      [artikelen 87e tot en met 87i][ref1] als de ten hoogste toelaatbare worden aangemerkt, te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
        hoofdstuk: VI
        afdeling: 2A
  - number: 87d.2
    text: |-
      Bij het voorbereiden van een wijziging of verbreding van een hoofdweg wordt vanwege Onze Ministers een akoestisch
      onderzoek als bedoeld in het eerste lid ingesteld. Dit onderzoek geeft tevens inzicht in:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.2.a
    text: |-
      de voor de wijziging of verbreding ter plaatse heersende geluidsbelasting die door woningen, door andere
      geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen de zone van de hoofdweg vanwege de hoofdweg of
      vanwege binnen het tracé van die hoofdweg gelegen wegen of spoorwegen wordt ondervonden;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.2.b
    text: |-
      de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen werd
      ondervonden op 1 maart 1986;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.2.c
    text: |-
      geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen de
      zone van de hoofdweg vanwege binnen het tracé van die hoofdweg gelegen spoorwegen werd ondervonden op 1 juli 1987.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.3
    text: |-
      Indien redelijkerwijs kan worden aangenomen dat de wijziging of verbreding van een hoofdweg zal leiden tot een
      aanpassing van andere wegen dan de te wijzigen of te verbreden hoofdweg of tot aanpassing van de niet te wijzigen
      of te verbreden gedeelten van de hoofdweg, heeft het in het eerste lid bedoelde onderzoek tevens betrekking op die
      andere wegen of de niet te wijzigen of te verbreden gedeelten van de betrokken hoofdweg.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.4
    text: |-
      De in het eerste lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een te wijzigen of te verbreden hoofdweg, vanwege binnen het tracé van die hoofdweg aan te leggen wegen
      en spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87d.5
    text: |-
      De in het tweede lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de zone
      van een aan te leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen en spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87d
  - number: 87e.1
    text: |-
      Behoudens het tweede en derde lid is de voor woningen binnen de zone van een aan te leggen hoofdweg, ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te
      leggen wegen of spoorwegen, 48 dB vanwege deze wegen, onderscheidenlijk 55 dB vanwege deze spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.2
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      waarde in geval van geluidsbelasting vanwege wegen 58 dB, onderscheidenlijk vanwege spoorwegen 68 dB niet te boven
      mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.3
    text: |-
      Voor zover het woningen in stedelijk gebied betreft kunnen Onze Ministers een hogere waarde dan 58 dB voor de ten
      hoogste toelaatbare geluidsbelasting vanwege de in het eerste lid bedoelde wegen vaststellen, met dien verstande
      dat deze waarde 63 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.4
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het tweede of derde lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen of spoorwegen, tot de
      ingevolge het eerste lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet
      van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.5
    text: |-
      De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een te wijzigen
      of te verbreden hoofdweg, vanwege binnen het tracé van die hoofdweg aan te leggen wegen of spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.6
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.6.a
    text: in het eerste lid in plaats van «55 dB» wordt gelezen« 53 dB»;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.6.b
    text: |-
      in het tweede lid in plaats van «58 dB» wordt gelezen «58 dB voor zover het andere geluidsgevoelige gebouwen
      als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1], betreft, of 53 dB voor zover het andere
      geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref2], betreft» en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87e.6.c
    text: |-
      in het derde lid in plaats van «woningen in stedelijk gebied» wordt gelezen: andere geluidsgevoelige gebouwen als
      bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1], in stedelijk gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87e.7
    text: |-
      De in het eerste, tweede, vierde en vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.7.a
    text: |-
      in het eerste lid in plaats van «48 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 48 dB en in de
      overige gevallen 53 dB» en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87e.7.b
    text: |-
      in het tweede lid in plaats van «58 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 53 dB en in de
      overige gevallen 58 dB» en in plaats van «68 dB» wordt gelezen: indien het woonwagenstandplaatsen betreft 63 dB en
      in de overige gevallen 66 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87e
  - number: 87f.1
    text: |-
      Behoudens het tweede tot en met vierde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten gevolge waarvan de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen worden aangepast, ten
      hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg
      gelegen wegen 48 dB, indien:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.1.a
    text: |-
      de geluidsbelasting vanwege deze hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen op 1 maart
      1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze hoofdweg of
      wegen lager was dan of gelijk was aan 60 dB(A), of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.1.b
    text: |-
      deze hoofdweg na 1 januari 1982 is aangelegd op grond van een overeenkomstig de [artikelen 76][ref1] en [77][ref2]
      vastgesteld of herzien bestemmingsplan, of


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: 87f.1.c
    text: |-
      binnen het tracé van die hoofdweg gelegen wegen na 1 januari 1982 zijn aangelegd op grond van een overeenkomstig de
      [artikelen 76][ref1] en [77][ref2] vastgesteld of herzien bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: 87f.2
    text: |-
      In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1], de
      [Interimwet stad-en-milieubenadering][ref2] of de [Spoedwet wegverbreding][ref3] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de betrokken weg of wegen is vastgesteld dan 48 dB en de heersende
      waarde hoger is dan 48 dB, is de voor woningen binnen de zone van een te wijzigen of te verbreden hoofdweg ten
      gevolge waarvan de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen worden aangepast, ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, de laagste van de volgende twee waarden:


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
      - id: ref3
        bwb_id: BWBR0015158
  - number: 87f.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.3
    text: |-
      Ingeval de betrokken hoofdweg of wegen op 1 januari 2007 aanwezig, in aanleg of geprojecteerd waren en niet eerder
      een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege de betrokken hoofdweg of wegen van de
      gevel van woningen is vastgesteld dan 48 dB en de heersende waarde is hoger dan 48 dB, geldt voor de woningen die
      op 1 januari 2007 aanwezig, in aanbouw of geprojecteerd waren binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten gevolge waarvan die hoofdweg of binnen het tracé van die hoofdweg gelegen wegen worden aangepast, als
      de ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of binnen het tracé van die hoofdweg
      gelegen wegen, de heersende waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid bedoelde waarde vaststellen, met dien
      verstande dat de verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.4.1°
    text: |-
      ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.4.2°
    text: |-
      de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, eerste, derde of negende lid][ref1], met
      betrekking tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 111a
        hoofdstuk: VIIIb
  - number: 87f.5
    text: |-
      De krachtens het vierde lid vast te stellen waarde wordt niet hoger vastgesteld dan 58 dB bij een aanpassing
      van een weg in buitenstedelijk gebied en 63 dB bij een aanpassing van een weg in stedelijk gebied indien voor
      de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref1] of [84, tweede lid][ref2], zoals dat
      luidde voor 1 september 1991 of de heersende waarde 53 dB niet te boven gaat. Voor andere dan de in de eerste
      volzin bedoelde woningen wordt de krachtens het vierde lid vast te stellen waarde niet hoger vastgesteld dan 68
      dB. In afwijking van de eerste en tweede volzin wordt de krachtens het vierde lid vast te stellen waarde voor
      woningen met betrekking waartoe eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref3], de
      [Interimwet stad-en-milieubenadering][ref4] of de [Spoedwet wegverbreding][ref5] een hogere waarde is vastgesteld
      dan de krachtens die volzinnen ten hoogste toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0010041
      [ref4]: https://wetten.overheid.nl/BWBR0019466
      [ref5]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0010041
      - id: ref4
        bwb_id: BWBR0019466
      - id: ref5
        bwb_id: BWBR0015158
  - number: 87f.6
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het vierde en vijfde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, tot de ingevolge het eerste,
      tweede of derde lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.7
    text: |-
      De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te leggen
      hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.8
    text: |-
      Het eerste tot en met zevende lid zijn mede van toepassing met betrekking tot de ten hoogste toelaatbare
      geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.8.a
    text: |-
      het vierde lid wordt gelezen als «Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid
      bedoelde waarde vaststellen, met dien verstande dat een verhoging 5 dB niet te boven mag gaan» en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.8.b
    text: |-
      het vijfde lid wordt gelezen als: Indien voor het betrokken andere geluidsgevoelige gebouw eerder bij of krachtens
      deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld of indien de heersende
      waarde 53 dB niet te boven gaat, wordt de krachtens het vierde lid vast te stellen waarde niet hoger vastgesteld
      dan:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.8.b.1°
    text: |-
      58 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1] in
      buitenstedelijk gebied,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87f.8.b.2°
    text: |-
      63 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1] in
      stedelijk gebied, en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87f.8.b.3°
    text: |-
      53 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87f.9
    text: |-
      De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.9.a
    text: |-
      in het eerste, tweede en derde lid in plaats van «48 dB» telkens wordt gelezen «indien het woonwagenstandplaatsen
      betreft 48 dB en in de overige gevallen 53 dB»,
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.9.b
    text: het vierde lid, onder 1° en 2°, niet van toepassing is, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
  - number: 87f.9.c
    text: |-
      in het vijfde lid in plaats van «58 dB bij een aanpassing van een weg in buitenstedelijk gebied en 63 dB bij
      een aanpassing van een weg in stedelijk gebied indien voor de betrokken woning eerder toepassing is gegeven aan
      [artikel 83][ref1] of [84, tweede lid][ref2], zoals dat luidde voor 1 september 1991 of de heersende waarde 53 dB
      niet te boven gaat» wordt gelezen «53 dB indien het woonwagenstandplaatsen betreft en 58 dB in de overige gevallen»
      en de tweede volzin van dat lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel84
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 87g.1
    text: |-
      Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé
      van die hoofdweg gelegen wegen, indien de geluidsbelasting vanwege deze hoofdweg of vanwege binnen het tracé van
      die hoofdweg gelegen wegen op 1 maart 1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk
      na ingebruikneming van de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen hoger was dan 60 dB(A), de
      waarde 48 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.2
    text: |-
      Ingeval eerder bij of krachtens deze wet of de [Spoedwet wegverbreding][ref1] een hogere waarde voor de ten hoogste
      toelaatbare geluidsbelasting, vanwege de betrokken weg of wegen is vastgesteld dan 48 dB, is de voor woningen
      binnen de zone van een te wijzigen of te verbreden hoofdweg ten gevolge waarvan de hoofdweg of binnen het tracé
      van die hoofdweg gelegen wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de
      hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen:


      [ref1]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0015158
  - number: 87g.2.a
    text: 48 dB als de heersende waarde lager is dan of gelijk is aan 48 dB, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.2.b
    text: 'de laagste van de volgende twee waarden als de heersende waarde hoger is dan 48 dB:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.2.b.1°
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.2.b.2°
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      de waarde 68 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat de
      verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.4.1°
    text: |-
      ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.4.2°
    text: |-
      de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, tweede of vierde lid][ref1], met betrekking
      tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden. De krachtens dit lid vast
      te stellen waarde mag de waarde 68 dB niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 111a
        hoofdstuk: VIIIb
  - number: 87g.5
    text: |-
      In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 68 dB vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: 87g.6
    text: |-
      Indien eerder bij of krachtens deze wet of de [Spoedwet wegverbreding][ref1] een hogere waarde dan 68 dB is
      vastgesteld, mag de vast te stellen hogere waarde, in afwijking van het vierde lid, niet hoger worden vastgesteld
      dan de eerder vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0015158
  - number: 87g.7
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, tot de
      ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren
      ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.8
    text: |-
      De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.9
    text: |-
      De in het eerste tot en met vierde en zevende en achtste lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87g.9.a
    text: |-
      in het derde en vierde lid in plaats van «de waarde 68 dB» telkens wordt gelezen «met betrekking tot
      andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1],
      de waarde 68 dB, onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 87b, eerste lid, onder e, 3°][ref2], de waarde 58 dB», en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 87g.9.b
    text: het vierde lid, onder 1° en 2°, niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87g
  - number: 87h.1
    text: |-
      Behoudens het tweede en derde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden hoofdweg
      ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare
      geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, indien:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.1.a
    text: |-
      de geluidsbelasting vanwege binnen het tracé van die hoofdweg gelegen spoorwegen op 1 juli 1987, van de gevel van
      deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze spoorwegen lager was dan of gelijk was
      aan 65 dB(A), of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.1.b
    text: |-
      binnen het tracé van die hoofdweg gelegen spoorwegen na 1 juli 1987 zijn aangelegd op grond van een bestemmingsplan
      dat is vastgesteld of herzien met toepassing van het bij of krachtens deze wet bepaalde,
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.2
    text: |-
      In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1] of de
      [Interimwet stad-en-milieubenadering][ref2] een hogere waarde voor de ten hoogst toelaatbare geluidsbelasting,
      vanwege de betrokken spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de zone van een te wijzigen
      of te verbreden hoofdweg ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, de laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde
      55 dB niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft:


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
  - number: 87h.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste of tweede lid bedoelde waarde vaststellen, met
      dien verstande dat de waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder op grond van de
      [Experimentenwet Stad en Milieu][ref1] of de [Interimwet stad-en-milieubenadering][ref2] een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
  - number: 87h.4
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde lid in die gevallen waarin toepassing van maatregelen
      gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen, vanwege
      binnen het tracé van die hoofdweg gelegen spoorwegen, tot de ingevolge het eerste of tweede lid geldende waarde,
      onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedenbouwkundige, verkeerskundige,
      landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.5
    text: |-
      De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.6
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het eerste lid in
      plaats van «65 dB(A)» wordt gelezen «60 dB(A)» en in plaats van «de waarde 55dB» wordt gelezen: de waarde 53 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87h.7
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het derde lid in plaats
      van «de waarde 71 dB» wordt gelezen: de waarde indien het woonwagenstandplaatsen betreft 63 dB en in de overige
      gevallen 66 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87h
  - number: 87i.1
    text: |-
      Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, indien de geluidsbelasting vanwege binnen het tracé van die hoofdweg gelegen spoorwegen op 1 juli 1987,
      van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze spoorwegen hoger was
      dan 65 dB(A), de waarde 55 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.2
    text: |-
      In geval eerder bij of krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting
      vanwege de betrokken spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de zone van een te wijzigen
      of te verbreden hoofdweg ten gevolge waarvan binnen het tracé van die hoofdweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen, de laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde
      55 dB niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      de waarde 71 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat
      deze waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder bij of krachtens deze wet een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.5
    text: |-
      In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 71 dB vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: 87i.6
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen, tot de ingevolge het eerste
      of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.7
    text: |-
      De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te leggen
      hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.8
    text: |-
      De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met betrekking
      tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het
      eerste lid in plaats van «hoger was dan 65 dB(A), de waarde 55 dB» wordt gelezen: hoger was dan 60 dB(A), de waarde
      58 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87i.9
    text: |-
      De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met betrekking
      tot de ten hoogste toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het
      eerste lid in plaats van «de waarde 55 dB» wordt gelezen: de waarde 63 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87i
  - number: 87j.1
    text: |-
      [Afdeling 1 van hoofdstuk VIIIA][ref1] is niet van toepassing op deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87j
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 87j.2
    text: |-
      Op de voorbereiding van een saneringsprogramma door burgemeester en wethouders of door de wegaanlegger is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel87j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '89.1'
    text: |-
      Burgemeester en wethouders of indien toepassing wordt gegeven aan [artikel 98][ref1] burgemeester en wethouders of
      de wegaanlegger stellen uitsluitend ten aanzien van de woningen die op grond van [artikel 88, eerste lid][ref2],
      zoals dat luidde voor 1 januari 2007 aan Onze Minister zijn gemeld, met inachtneming van de regels, gegeven
      krachtens het derde lid, een programma op van maatregelen die naar hun oordeel in aanmerking komen om de
      geluidsbelasting, vanwege de weg, van de gevels van de op grond van [artikel 88][ref3], zoals dat luidde
      voor 1 januari 2007 gemelde woningen zoveel mogelijk te beperken tot 48 dB en om zo nodig te voldoen aan
      [artikel 111, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '98'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '111'
        hoofdstuk: VIIIb
  - number: '89.2'
    text: |-
      Met betrekking tot gevallen, bedoeld in [artikel 88][ref1], worden bij of krachtens algemene maatregel van bestuur
      regels gegeven omtrent het tijdstip van melding van die gevallen, de aard van de maatregelen die in aanmerking
      komen, en de omstandigheden waaronder dit het geval is, alsmede omtrent de opzet en het tijdstip van vaststelling
      van een programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
  - number: '90.1'
    text: |-
      Burgemeester en wethouders of indien toepassing wordt gegeven aan [artikel 98][ref1] burgemeester en wethouders
      of de wegaanlegger leggen het ingevolge [artikel 89, eerste lid][ref2], vastgestelde programma van maatregelen
      onverwijld voor aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel89
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '98'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '89'
        hoofdstuk: VI
        afdeling: '3'
  - number: '90.2'
    text: |-
      Behoudens het derde lid stelt Onze Minister na ontvangst van zodanig programma voor de woningen waarop het
      betrekking heeft, als de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege de weg, van de gevels
      een waarde van 48 dB vast. Onze Minister doet van zijn besluit mededeling aan burgemeester en wethouders en de
      wegbeheerder.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel90
  - number: '90.3'
    text: |-
      In bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te stellen regels kan bij een
      besluit als bedoeld in het tweede lid voor de ten hoogste toelaatbare geluidsbelasting een hogere dan de in dat lid
      genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 68 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel90
  - number: '90.4'
    text: |-
      In afwijking van het derde lid kan in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij
      te stellen regels voor de ten hoogste toelaatbare geluidsbelasting een hogere dan de in dat lid genoemde waarde
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel90
  - number: '90.5'
    text: |-
      Onze Minister stelt ten aanzien van elk van de daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege de weg, van de gevels van de betrokken woningen tot
      de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde. Deze maatregelen strekken tevens, afhankelijk
      van de hoogte van deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege de weg, binnen de woning.
      Op de door Onze Minister vastgestelde maatregelen is [hoofdstuk X][ref1] van toepassing. Hij doet van zijn
      besluit, houdende vaststelling van maatregelen, mededeling aan burgemeester en wethouders en aan de wegbeheerder
      of wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukX
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: X
  - number: '98'
    text: |-
      Ten behoeve van een reconstructie van een weg met betrekking waartoe ingevolge [artikel 88][ref1],
      zoals dat luidde voor 1 januari 2007 aan Onze Minister uiterlijk twee jaar na 1 januari 2007 melding
      is gedaan of is gedaan, is deze afdeling niet van toepassing en geeft Onze Minister toepassing aan
      [artikel 90, tweede tot en met vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: '99.1'
    text: |-
      Tot reconstructie van een weg wordt, indien binnen de aanwezige of toekomstige zone van die weg woningen,
      andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn,
      niet overgegaan dan in overeenstemming met een bestemmingsplan of een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1] dat in de reconstructie voorziet dan wel met een besluit
      van burgemeester en wethouders, met overeenkomstige toepassing van [artikel 81][ref2] genomen naar aanleiding
      van een door de wegbeheerder aan burgemeester en wethouders gedane mededeling van zijn voornemen en na een met
      overeenkomstige toepassing van [artikel 80][ref3] ingesteld onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel80
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '81'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '80'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '99.2'
    text: |-
      Indien redelijkerwijs kan worden aangenomen dat de reconstructie van een weg zal leiden tot een toename van de
      geluidsbelasting van 2 dB of meer vanwege andere wegen dan de te reconstrueren weg of – als een weg gedeeltelijk
      wordt gereconstrueerd – vanwege de niet te reconstrueren gedeelten daarvan, heeft het in het eerste lid bedoelde
      onderzoek tevens betrekking op die andere wegen of de niet te reconstrueren gedeelten van de betrokken weg.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel99
  - number: '99.3'
    text: |-
      Bij het nemen van een besluit als bedoeld in het eerste lid worden de waarden die ingevolge de
      [artikelen 100][ref1], [100a][ref2] en [100b][ref3] als de ten hoogste toelaatbare worden aangemerkt, in acht
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel100b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 100b
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '99.4'
    text: |-
      Ingeval bij de reconstructie het aantal rijstroken zal worden verhoogd, wordt de zone in aanmerking genomen, die
      uit het hogere aantal rijstroken zal voortvloeien.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel99
  - number: '100.1'
    text: |-
      Behoudens het tweede en derde lid is de ten hoogste toelaatbare geluidsbelasting vanwege een te reconstrueren weg,
      van de gevel van woningen binnen de zone 48 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100
  - number: '100.2'
    text: |-
      Ingeval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1], de
      [Interimwet stad-en-milieubenadering][ref2], of de [Spoedwet wegverbreding][ref3] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de te reconstrueren weg, van de gevel van woningen binnen de zone is
      vastgesteld dan 48 dB, en de heersende waarde hoger is dan 48 dB, geldt de laagste van de volgende twee waarden als
      de ten hoogste toelaatbare:


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
      - id: ref3
        bwb_id: BWBR0015158
  - number: 100.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100
  - number: 100.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100
  - number: '100.3'
    text: |-
      Ingeval de weg op 1 januari 2007 aanwezig, in aanleg of geprojecteerd was en niet eerder een hogere waarde voor de
      ten hoogste toelaatbare geluidsbelasting vanwege de te reconstrueren weg is vastgesteld dan 48 dB, en de heersende
      waarde hoger is dan 48 dB, geldt als de ten hoogste toelaatbare geluidsbelasting vanwege de te reconstrueren weg,
      van de gevel van woningen binnen de zone die op 1 januari 2007 aanwezig, in aanbouw of geprojecteerd waren de
      heersende waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100
  - number: 100a.1
    text: |-
      Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting van de gevel van woningen kan een hogere waarde dan de
      ingevolge [artikel 100][ref1] geldende worden vastgesteld, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: 100a.1.a
    text: 'de verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
  - number: 100a.1.a.1°
    text: |-
      ten gevolge van de reconstructie de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen elders
      met een ten minste gelijke waarde zal verminderen, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
  - number: 100a.1.a.2°
    text: |-
      de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      reconstructie ten behoeve van de toepassing van [artikel 90][ref1] of [artikel 111, tweede of derde lid][ref2], met
      betrekking tot woningen die door de reconstructie een hogere geluidsbelasting ondervinden, en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '111'
        hoofdstuk: VIIIb
  - number: 100a.1.b
    text: |-
      ingeval voor de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref1] of
      [artikel 84, tweede lid][ref2], zoals dat luidde voor 1 september 1991 of, indien geen toepassing is gegeven aan
      het betrokken artikel en de heersende waarde 53 dB niet te boven gaat, de waarde niet hoger mag worden gesteld dan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel84
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 100a.1.b.1°
    text: 58 dB bij een reconstructie van een weg in buitenstedelijk gebied en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
  - number: 100a.1.b.2°
    text: 63 dB bij een reconstructie van een weg in stedelijk gebied.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
  - number: 100a.2
    text: De krachtens het eerste lid, onder a, te stellen hogere waarde mag niet hoger worden gesteld dan 68 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
  - number: 100a.3
    text: |-
      In afwijking van het tweede lid mag de waarde ingeval eerder bij of krachtens deze wet, de
      [Experimentenwet Stad en Milieu][ref1] of de [Interimwet stad- en milieubenadering][ref2] een hogere waarde dan 68
      dB is vastgesteld, niet hoger worden gesteld dan de eerder vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100a
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
  - number: 100b
    text: |-
      Bij algemene maatregel van bestuur kunnen voor andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      overeenkomstige regels worden gesteld met betrekking tot de onderwerpen die zijn geregeld in:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100b
  - number: 100b.a
    text: |-
      [artikel 100][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '100'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: 100b.b
    text: |-
      [artikel 100a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel100b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: '104'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      met betrekking tot de in de [artikelen 88 tot en met 90][ref1], [98][ref2] en [99][ref3] geregelde onderwerpen
      overeenkomstige regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel99
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '98'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '99'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '4'
  - number: '105'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder, veroorzaakt door het gebruik van een spoor-, tram-,
      of metroweg, kunnen bij of krachtens algemene maatregel van bestuur eisen worden gesteld met betrekking tot aard,
      samenstelling, wijze van aanleg of gebruik van de spoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel105
  - number: 105a
    text: |-
      [Afdeling 1 van hoofdstuk VIIIA][ref1] is niet van toepassing op deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: '106.1'
    text: 'In deze afdeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.a
    text: |-
      Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat dan wel Onze Minister van Verkeer en
      Waterstaat, indien dat volgt uit de beslissing, bedoeld in [artikel 2, tweede lid, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 106.1.b
    text: |-
      landelijke spoorweg: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder d, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 106.1.c
    text: |-
      aanleg of wijziging van een landelijke spoorweg: aanleg of wijziging van een landelijke spoorweg in de zin van
      [artikel 2 van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '2'
  - number: 106.1.d
    text: |-
      woonwagenstandplaats: een standplaats als bedoel in [artikel 1, eerste lid, onder h, van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 106.1.e
    text: 'andere geluidsgevoelige gebouwen:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.e.1°
    text: onderwijsgebouwen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.e.2°
    text: ziekenhuizen en verpleeghuizen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.e.3°
    text: bij algemene maatregel van bestuur aan te wijzen andere gezondheidszorggebouwen dan bedoeld onder 2°;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.f
    text: 'geluidsgevoelige terreinen:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.f.1°
    text: |-
      terreinen die behoren bij gebouwen als bedoeld onder e, 3°, voor zover deze bestemd zijn of worden gebruikt voor de
      in die gebouwen verleende zorg, of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.f.2°
    text: woonwagenstandplaatsen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.g
    text: |-
      tracé: tracé als bedoeld in [artikel 1, eerste lid, onder h, van de Tracéwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0006147
        artikel: '1'
  - number: 106.1.h
    text: |-
      aanpassing van een weg: hetgeen daaronder wordt verstaan in [artikel 87b, eerste lid, onder h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 106.1.i
    text: |-
      equivalent geluidsniveau in dB(A) met betrekking tot een spoorweg: het equivalente geluidsniveau in dB(A), bepaald
      volgens de op grond van [artikel 107][ref1] vastgestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '107'
        hoofdstuk: VII
        afdeling: '3'
  - number: 106.1.j
    text: |-
      etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: de hoogste van de volgende
      drie waarden:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.j.1°
    text: de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dagwaarde),
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.j.2°
    text: de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur (avondwaarde),
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.j.3°
    text: de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur (nachtwaarde);
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.k
    text: |-
      geluidsbelasting in dB(A) vanwege een spoorweg: de etmaalwaarde van het equivalente geluidsniveau in dB(A) op
      een bepaalde plaats, veroorzaakt door het gezamenlijke spoorwegverkeer op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: 106.1.l
    text: |-
      aanpassing van een spoorweg: hetgeen daaronder wordt verstaan in [artikel 87b, eerste lid, onder l][ref1], onder
      toepasselijkheid van het [derde lid van dat artikel][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: '106.2'
    text: |-
      Een gymnastieklokaal maakt voor de toepassing van deze afdeling geen deel uit van de in het eerste lid, onder 1° en
      2°, bedoelde scholen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: '106.3'
    text: |-
      In afwijking van het eerste lid, onder k, is de geluidsbelasting, vanwege een spoorweg, van de gevel van scholen en
      van medische kleuterdagverblijven de dagwaarde van het equivalente geluidsniveau in dB(A).
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
  - number: '106.4'
    text: |-
      [Artikel 87b, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 106a
    text: |-
      Zodra dat van belang is voor de aanleg of wijziging van een landelijke spoorweg, geeft Onze Minister in
      overeenstemming met Onze Minister van Verkeer en Waterstaat na overleg met de betrokken spoorwegexploitant
      en de betrokken gemeenteraden en colleges van burgemeester en wethouders landelijke spoorwegen aan op een bij
      ministeriële regeling vast te stellen kaart.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106a
  - number: 106b
    text: |-
      Langs een landelijke spoorweg bevindt zich een zone, waarvan de breedte, gemeten vanuit de buitenste spoorstaaf, is
      aangegeven op de in [artikel 106a][ref1] bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 106a
        hoofdstuk: VII
        afdeling: '2'
  - number: 106c.1
    text: |-
      Bij het voorbereiden van de aanleg van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek ingesteld naar:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.1.a
    text: |-
      de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg aan te leggen wegen of spoorwegen zou worden ondervonden zonder de invloed van maatregelen die de
      geluidsoverdracht beperken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.1.b
    text: |-
      de doeltreffendheid van de in aanmerking komende maatregelen, om te voorkomen dat de in de toekomst binnen de zone
      van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg
      aan te leggen wegen of spoorwegen optredende geluidsbelasting van de onder a bedoelde objecten, de waarden die
      ingevolge de [artikelen 106d tot en met 106h][ref1] als de ten hoogste toelaatbare worden aangemerkt, te boven
      gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 106d
        hoofdstuk: VII
        afdeling: '2'
  - number: 106c.2
    text: |-
      Bij het voorbereiden van een wijziging van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek als bedoeld in het eerste lid ingesteld. Dit onderzoek geeft tevens inzicht in:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.2.a
    text: |-
      de voor de wijziging ter plaatse heersende geluidsbelasting die door woningen, door andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of
      vanwege binnen het tracé van die landelijke spoorweg gelegen wegen of spoorwegen wordt ondervonden;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.2.b
    text: |-
      de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg gelegen spoorwegen werd ondervonden op 1 juli 1987;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.2.c
    text: |-
      de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege binnen het tracé van die landelijke spoorweg gelegen wegen werd
      ondervonden op 1 maart 1986.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.3
    text: |-
      Indien redelijkerwijs kan worden aangenomen dat de wijziging van een landelijke spoorweg zal leiden tot een
      aanpassing van wegen, heeft het in het eerste lid bedoelde onderzoek tevens betrekking op die wegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.4
    text: |-
      De in het eerste lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de zone
      van een te wijzigen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg aan te leggen wegen
      en spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.5
    text: |-
      De in het tweede lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een aan te leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen
      en spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106c.6
    text: Onze Minister kan nadere regels stellen omtrent akoestische onderzoeken als bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106c
  - number: 106d.1
    text: |-
      Behoudens het tweede lid is de voor woningen, binnen de zone van een aan te leggen landelijke spoorweg ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen het tracé van die
      landelijke spoorweg aan te leggen wegen of spoorwegen, 48 dB vanwege deze wegen, onderscheidenlijk 55dB vanwege
      deze spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.2
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      waarde in geval van geluidsbelasting vanwege wegen 58 dB, onderscheidenlijk vanwege spoorwegen 68 dB niet te boven
      mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.3
    text: |-
      Voor zover het woningen in stedelijk gebied betreft kunnen Onze Ministers een hogere waarde dan 58 dB voor de ten
      hoogste toelaatbare geluidsbelasting vanwege de in het eerste lid bedoelde wegen vaststellen, met dien verstande
      dat deze waarde 63 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.4
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het tweede of derde lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg aan te leggen wegen of
      spoorwegen, tot de ingevolge het eerste lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende
      bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.5
    text: |-
      De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een te wijzigen
      landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg aan te leggen wegen of spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.6
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.6.a
    text: in het eerste lid in plaats van «55 dB» wordt gelezen« 53 dB»;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.6.b
    text: |-
      in het tweede lid in plaats van «58 dB» wordt gelezen «58dB voor zover het andere geluidsgevoelige gebouwen
      als bedoeld in [artikel 106, eerste lid, onder e, 1° en 2°][ref1] betreft, of 53 dB voor zover het andere
      geluidsgevoelige gebouwen als bedoeld in [artikel 106, eerste lid, onder e, 3°][ref2], betreft» en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '106'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '106'
        hoofdstuk: VII
        afdeling: '2'
  - number: 106d.6.c
    text: |-
      in het derde lid in plaats van «woningen in stedelijk gebied» wordt gelezen: andere geluidsgevoelige gebouwen als
      bedoeld in [artikel 106, eerste lid, onder e, 1° en 2°][ref1], in stedelijk gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '106'
        hoofdstuk: VII
        afdeling: '2'
  - number: 106d.7
    text: |-
      De in het eerste, tweede, vierde en vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.7.a
    text: |-
      in het eerste lid in plaats van «48 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 48 dB en in de
      overige gevallen 53 dB»;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106d.7.b
    text: |-
      in het tweede lid in plaats van «58 dB» wordt gelezen« indien het woonwagenstandplaatsen betreft 53 dB en in de
      overige gevallen 58 dB» en in plaats van «68 dB» wordt gelezen: indien het woonwagenstandplaatsen betreft 63 dB en
      in de overige gevallen 66 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106d
  - number: 106e.1
    text: |-
      Behoudens het tweede en derde lid is de voor woningen binnen de zone van een te wijzigen landelijke spoorweg ten
      gevolge waarvan de landelijke spoorweg of de binnen het tracé van die landelijke spoorweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen
      het tracé van die landelijke spoorweg gelegen spoorwegen, indien:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.1.a
    text: |-
      de geluidsbelasting vanwege deze landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg
      gelegen spoorwegen op 1 juli 1987, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na
      ingebruikneming van deze landelijke spoorweg of spoorwegen lager was dan of gelijk was aan 65 dB(A), of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.1.b
    text: |-
      deze landelijke spoorweg na 1 juli 1987 is aangelegd op grond van een bestemmingsplan dat is vastgesteld of herzien
      met toepassing van het bij of krachtens deze wet bepaalde, of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.1.c
    text: |-
      binnen de zone van die landelijke spoorweg gelegen spoorwegen na 1 juli 1987 zijn aangelegd op grond van een
      bestemmingsplan dat is vastgesteld of herzien met toepassing van het bij of krachtens deze wet bepaalde,
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.2
    text: |-
      In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1] of de
      [Interimwet stad-en-milieubenadering][ref2] een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege de betrokken landelijke spoorweg of spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de
      zone van een te wijzigen landelijke spoorweg ten gevolge waarvan de landelijke spoorweg of binnen het tracé van
      die landelijke spoorweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel,
      vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen, de
      laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde 55 dB niet te
      boven gaat, in elk geval als toelaatbaar aangemerkt blijft:


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
  - number: 106e.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste of tweede lid bedoelde waarde vaststellen, met
      dien verstande dat de waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder op grond van de
      [Experimentenwet Stad en Milieu][ref1] of de [Interimwet stad-en-milieubenadering][ref2] een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
  - number: 106e.4
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde lid in die gevallen waarin toepassing van maatregelen
      gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen, vanwege de
      landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen, tot de ingevolge
      het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet
      van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.5
    text: |-
      De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.6
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het eerste lid in
      plaats van «65 dB(A)» wordt gelezen «60 dB(A)» en in plaats van «de waarde 55 dB» wordt gelezen: de waarde 53 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106e.7
    text: |-
      De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het derde lid in plaats
      van «de waarde 71 dB» wordt gelezen: de waarde indien het woonwagenstandplaatsen betreft 63 dB en in de overige
      gevallen 66 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106e
  - number: 106f.1
    text: |-
      Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen
      het tracé van die landelijke spoorweg gelegen spoorwegen, indien de geluidsbelasting vanwege deze landelijke
      spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen op 1 juli 1987, van de gevel
      van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van de landelijke spoorweg of binnen het
      tracé van die landelijke spoorweg gelegen spoorwegen hoger was dan 65 dB(A), de waarde 55 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.2
    text: |-
      In geval eerder bij of krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege de betrokken landelijke spoorweg of spoorwegen is vastgesteld dan 55 dB, is de voor woningen binnen de
      zone van een te wijzigen landelijke spoorweg ten gevolge waarvan de landelijke spoorweg of binnen het tracé van
      die landelijke spoorweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de
      gevel, vanwege de landelijke spoorweg of vanwegebinnen het tracé van die landelijke spoorweg gelegen spoorwegen, de
      laagste van de volgende twee waarden, met dien verstande dat een geluidsbelasting waarvan de waarde 55 dB niet te
      boven gaat, in elk geval als toelaatbaar aangemerkt blijft:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      de waarde 71 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat
      deze waarde 71 dB niet te boven mag gaan, behoudens ingeval eerder bij of krachtens deze wet een hogere waarde dan
      71 dB is vastgesteld. In dat geval mag de vast te stellen hogere waarde niet hoger worden gesteld dan de eerder
      vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.5
    text: |-
      In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 71 dB vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: 106f.6
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen
      spoorwegen, tot de ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel
      overwegende bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.7
    text: |-
      De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te leggen
      landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.8
    text: |-
      De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met betrekking
      tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het
      eerste lid in plaats van «hoger was dan 65 dB(A), de waarde 55 dB» wordt gelezen: hoger was dan 60 dB(A), de waarde
      58 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106f.9
    text: |-
      De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met betrekking
      tot de ten hoogste toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het
      eerste lid in plaats van «de waarde 55 dB» wordt gelezen: de waarde 63 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106f
  - number: 106g.1
    text: |-
      Behoudens het tweede tot en met vierde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten gevolge waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, ten
      hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen
      wegen 48 dB, indien:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.1.a
    text: |-
      de geluidsbelasting vanwege binnen het tracé van deze landelijke spoorweg gelegen wegen op 1 maart 1986, van de
      gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze wegen lager was dan of
      gelijk was aan 60 dB(A), of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.1.b
    text: |-
      binnen het tracé van die landelijke spoorweg gelegen wegen na 1 januari 1982 zijn aangelegd op grond van een
      overeenkomstig de [artikelen 76][ref1] en [77][ref2] vastgesteld of herzien bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: 106g.2
    text: |-
      In geval eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref1], de
      [Interimwet stad-en-milieubenadering][ref2] of de [Spoedwet wegverbreding][ref3] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de betrokken wegen is vastgesteld dan 48 dB en de heersende waarde
      hoger is dan 48 dB, is de voor woningen binnen de zone van een te wijzigen landelijke spoorweg ten gevolge
      waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, ten hoogste toelaatbare
      geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, de laagste van
      de volgende twee waarden:


      [ref1]: https://wetten.overheid.nl/BWBR0010041
      [ref2]: https://wetten.overheid.nl/BWBR0019466
      [ref3]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0010041
      - id: ref2
        bwb_id: BWBR0019466
      - id: ref3
        bwb_id: BWBR0015158
  - number: 106g.2.a
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.2.b
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.3
    text: |-
      Ingeval de betrokken wegen op 1 januari 2007 aanwezig, in aanleg of geprojecteerd waren en niet eerder een hogere
      waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege de betrokken wegen van de gevel van woningen
      is vastgesteld dan 48 dB en de heersende waarde is hoger dan 48 dB, geldt voor de woningen die op 1 januari 2007
      aanwezig, in aanbouw of geprojecteerd waren binnen de zone van een te wijzigen of te verbreden landelijke spoorweg
      ten gevolge waarvan binnen het tracé van die landelijke spoorweg gelegen wegen worden aangepast, als de ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, de
      heersende waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid bedoelde waarde vaststellen, met dien
      verstande dat de verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.4.1°
    text: |-
      ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.4.2°
    text: |-
      de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, vijfde, zevende of negende lid][ref1], met
      betrekking tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 111a
        hoofdstuk: VIIIb
  - number: 106g.5
    text: |-
      De krachtens het vierde lid vast te stellen waarde wordt niet hoger vastgesteld dan 58 dB bij een aanpassing
      van een weg in buitenstedelijk gebied en 63 dB bij een aanpassing van een weg in stedelijk gebied, indien voor
      de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref1] of [84, tweede lid][ref2], zoals dat
      luidde voor 1 september 1991 of de heersende waarde 53 dB niet te boven gaat. Voor andere dan de in de eerste
      volzin bedoelde woningen wordt de krachtens het vierde lid vast te stellen waarde niet hoger vastgesteld dan 68
      dB. In afwijking van de eerste en tweede volzin wordt de krachtens het vierde lid vast te stellen waarde voor
      woningen met betrekking waartoe eerder bij of krachtens deze wet, de [Experimentenwet Stad en Milieu][ref3], de
      [Interimwet stad-en-milieubenadering][ref4] of de [Spoedwet wegverbreding][ref5] een hogere waarde is vastgesteld
      dan de krachtens die volzinnen ten hoogste toelaatbare waarde, niet hoger vastgesteld dan die eerder vastgestelde
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0010041
      [ref4]: https://wetten.overheid.nl/BWBR0019466
      [ref5]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0010041
      - id: ref4
        bwb_id: BWBR0019466
      - id: ref5
        bwb_id: BWBR0015158
  - number: 106g.6
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het vierde en vijfde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege binnen het tracé van de landelijke spoorweg gelegen wegen, tot de ingevolge het eerste, tweede of derde
      lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van stedenbouwkundige,
      verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.7
    text: |-
      De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te leggen
      landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.8
    text: |-
      Het eerste tot en met zevende lid zijn mede van toepassing met betrekking tot de ten hoogste toelaatbare
      geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.8.a
    text: |-
      het vierde lid wordt gelezen als «Onze Ministers kunnen een hogere dan de in het eerste, tweede of derde lid,
      bedoelde waarde vaststellen, met dien verstande dat een verhoging 5 dB niet te boven mag gaan», en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.8.b
    text: |-
      het vijfde lid wordt gelezen als: Indien voor het betrokken andere geluidsgevoelige gebouw eerder bij of krachtens
      deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting is vastgesteld of indien de heersende
      waarde 53 dB niet te boven gaat, wordt de krachtens het vierde lid vast te stellen waarde niet hoger vastgesteld
      dan:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.8.b.1°
    text: |-
      58 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1] in
      buitenstedelijk gebied,


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 106g.8.b.2°
    text: |-
      63 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1° en 2°][ref1] in
      stedelijk gebied, en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 106g.8.b.3°
    text: |-
      53 dB voor andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 3°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87b
        hoofdstuk: VI
        afdeling: 2A
  - number: 106g.9
    text: |-
      De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.9.a
    text: |-
      in het eerste, tweede en derde lid in plaats van «48 dB» telkens wordt gelezen «indien het woonwagenstandplaatsen
      betreft 48 dB en in de overige gevallen 53 dB»;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.9.b
    text: het in het vierde lid, onder 1° en 2°, gestelde niet van toepassing is, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
  - number: 106g.9.c
    text: |-
      in het vijfde lid in plaats van «58 dB bij een wijziging van een weg in buitenstedelijk gebied en 63 dB bij
      een wijziging van een weg in stedelijk gebied, indien voor de betrokken woning eerder toepassing is gegeven aan
      [artikel 83][ref1] of [84, tweede lid][ref2], zoals dat luidde voor 1 september 1991 of de heersende waarde 53 dB
      niet te boven gaat» wordt gelezen «53 dB indien het woonwagenstandplaatsen betreft en 58 dB in de overige gevallen»
      en de tweede volzin van dat lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel84
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106g
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '83'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '84'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: 106h.1
    text: |-
      Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke
      spoorweg gelegen wegen, indien de geluidsbelasting vanwege binnen het tracé van die landelijke spoorweg gelegen
      wegen op 1 maart 1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van de
      wegen hoger was dan 60 dB(A), de waarde 48 dB.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.2
    text: |-
      In geval eerder bij of krachtens deze wet of de [Spoedwet wegverbreding][ref1] een hogere waarde voor de ten
      hoogste toelaatbare geluidsbelasting, vanwege de betrokken wegen, is vastgesteld dan 48 dB, is de voor woningen
      binnen het tracé van een te wijzigen landelijke spoorweg ten gevolge waarvan binnen het tracé van die landelijke
      spoorweg gelegen wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het
      tracé van die landelijke spoorweg gelegen wegen:


      [ref1]: https://wetten.overheid.nl/BWBR0015158
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
    references:
      - id: ref1
        bwb_id: BWBR0015158
  - number: 106h.2.a
    text: 48 dB als de heersende waarde lager is dan of gelijk is aan 48 dB en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.2.b
    text: 'de laagste van de volgende twee waarden als de heersende waarde hoger is dan 48 dB:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.2.b.1°
    text: de heersende waarde;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.2.b.2°
    text: de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.3
    text: |-
      Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat deze
      de waarde 68 dB niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.4
    text: |-
      Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat de
      verhoging 5 dB niet te boven mag gaan, behoudens in gevallen waarin:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.4.1°
    text: |-
      ten gevolge van de aanpassing van de weg de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.4.2°
    text: |-
      de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      aanpassing van de weg ten behoeve van de toepassing van [artikel 111a, zesde of achtste lid][ref1], met betrekking
      tot woningen die door de aanpassing van de weg een hogere geluidsbelasting ondervinden. De krachtens dit lid vast
      te stellen waarde mag 68 dB niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 111a
        hoofdstuk: VIIIb
  - number: 106h.5
    text: |-
      In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 68 dB vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: 106h.6
    text: |-
      Indien eerder bij of krachtens deze wet een hogere waarde dan 68 dB is vastgesteld, mag de vast te stellen hogere
      waarde, in afwijking van het vierde lid, niet hoger worden vastgesteld dan de eerder vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.7
    text: |-
      Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege binnen het tracé van de landelijke spoorweg gelegen wegen, tot de ingevolge het
      eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.8
    text: |-
      De in het eerste tot en met zevende lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.9
    text: |-
      De in het eerste tot en met vierde en zevende en achtste lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: 106h.9.a
    text: |-
      in het derde en vierde lid in plaats van «de waarde 68 dB» telkens wordt gelezen: met betrekking tot
      andere geluidsgevoelige gebouwen als bedoeld in [artikel 106, eerste lid, onder e, 1° en 2°][ref1],
      de waarde 68 dB, onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 106, eerste lid, onder e, 3°][ref2], de waarde 58 dB, en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '106'
        hoofdstuk: VII
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '106'
        hoofdstuk: VII
        afdeling: '2'
  - number: 106h.9.b
    text: het in het vierde lid, onder 1° en 2°, gestelde niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel106h
  - number: '107'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder vanwege spoorwegen kunnen bij of krachtens algemene
      maatregel van bestuur, voor gevallen waarin geen toepassing wordt gegeven aan [hoofdstuk VI, afdeling 2a][ref1], of
      [hoofdstuk VII, afdeling 2][ref2], omtrent de onderwerpen die ter beperking van de geluidsbelasting vanwege wegen
      geregeld zijn in de [hoofdstukken VI][ref3] of [VIIIA][ref4], regels worden gesteld. Daarbij kunnen bepalingen van
      dat hoofdstuk van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VII
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: VIIIa
  - number: '108.1'
    text: |-
      Bij algemene maatregel van bestuur kan een gebied waar ernstige geluidhinder optreedt of is te verwachten, welke
      niet of niet voldoende door toepassing van de voorgaande hoofdstukken kan worden bestreden, worden aangewezen als
      geluidszone. Ten aanzien van deze zone zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel108
  - number: '108.2'
    text: |-
      Onze Minister doet van een maatregel als bedoeld in het eerste lid mededeling aan de raden der betrokken gemeenten
      en aan de staten der betrokken provincies.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel108
  - number: '108.3'
    text: |-
      Een maatregel als bedoeld in het eerste lid kan niet betrekking hebben op het bestrijden van de geluidhinder
      vanwege luchtvaartterreinen waarop [artikel 25a van de Luchtvaartwet][ref1] of [hoofdstuk 8 van de Wet luchtvaart]
      (onbekend) van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
  - number: '109'
    text: |-
      Bij intrekking of wijziging van een algemene maatregel van bestuur als bedoeld in [artikel 108, eerste lid][ref1],
      is het tweede van dat artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
        hoofdstuk: VIII
  - number: '110.1'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 108, eerste lid][ref1], worden in het belang
      van het voorkomen of beperken van geluidhinder in en buiten de zone omtrent de onderwerpen die ter beperking
      van de geluidsbelasting vanwege industrieterreinen, vanwege wegen of vanwege spoorwegen geregeld zijn in de
      [hoofdstukken V][ref2], [VI][ref3] of [VII][ref4], regels gesteld. Daarbij kunnen bepalingen van die hoofdstukken
      van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: VII
  - number: '110.2'
    text: |-
      Bij een maatregel als bedoeld in [artikel 108, eerste lid][ref1], kan tevens worden bepaald dat de
      [hoofdstukken V][ref2], [VI][ref3] en [VII][ref4] geheel of ten dele niet van toepassing zijn met betrekking tot
      het bij de maatregel aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: VII
  - number: 110a.1
    text: |-
      Burgemeester en wethouders zijn binnen de grenzen van de gemeente bevoegd tot het vaststellen van een hogere waarde
      voor de ten hoogste toelaatbare geluidsbelasting.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
  - number: 110a.2
    text: |-
      In afwijking van het eerste lid zijn indien ten behoeve van een activiteit in meer dan één gemeente een hogere
      waarde voor de bij of krachtens de wet genoemde ten hoogste toelaatbare geluidsbelasting dient te worden
      vastgesteld, burgemeester en wethouders van de gemeente binnen wier grenzen deze activiteit zal worden uitgevoerd
      bevoegd een hogere waarde vast te stellen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
  - number: 110a.3
    text: |-
      De in het eerste en tweede lid bedoelde waarde kan ambtshalve of op verzoek van degenen die daartoe bij algemene
      maatregel van bestuur zijn aangewezen, worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
  - number: 110a.4
    text: |-
      De vaststelling van de in het eerste en tweede lid bedoelde waarde vindt plaats volgens bij algemene maatregel van
      bestuur gestelde regels.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
  - number: 110a.5
    text: |-
      Het eerste en tweede lid vinden slechts toepassing indien toepassing van maatregelen, gericht op het terugbrengen
      van de geluidsbelasting vanwege het industrieterrein, de weg of spoorweg, van de gevel van de betrokken woningen of
      andere geluidsgevoelige gebouwen onderscheidenlijk aan de grens van de betrokken geluidsgevoelige terreinen tot de
      ten hoogste toelaatbare geluidsbelasting onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, vervoerskundige, landschappelijke of financiële aard. Bij algemene maatregel
      van bestuur kan worden bepaald dat de in dit lid bedoelde bevoegdheid enkel in bij die maatregel aan te geven
      gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
  - number: 110a.6
    text: |-
      Indien [artikel 110f][ref1] van toepassing is geven burgemeester en wethouders slechts toepassing
      aan het derde en vierde lid voorzover de gecumuleerde geluidsbelastingen na de correctie op grond van
      [artikel 110f, derde lid][ref2], niet leiden tot een naar hun oordeel onaanvaardbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110f
        hoofdstuk: VIIIa
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 110f
        hoofdstuk: VIIIa
        afdeling: '2'
  - number: 110a.7
    text: |-
      Wanneer het besluit, bedoeld in het eerste lid, benodigd is in verband met de aanleg of wijziging van een
      hoofdspoorweg of de aanleg of reconstructie van een weg in beheer bij het Rijk of een provincie of de vaststelling
      of wijziging van een zone rond een industrieterrein dat als industrieterrein van regionaal belang is aangewezen
      bij provinciale verordening krachtens de [Wet milieubeheer][ref1] of de [Wet ruimtelijke ordening][ref2], zijn
      gedeputeerde staten van de provincie waarbinnen de weg of spoorweg dan wel het industrieterrein van regionaal
      belang is gelegen bevoegd tot vaststelling van de hogere waarde. Het tweede tot en met zesde lid is van
      overeenkomstige toepassing, met dien verstande dat in het tweede en zesde lid in plaats van «burgemeester en
      wethouders» moet worden gelezen «gedeputeerde staten» en in het tweede lid in plaats van «gemeente» telkens moet
      worden gelezen: provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0020449
  - number: 110b.1
    text: |-
      Wanneer de in [artikel 110a, eerste lid][ref1], genoemde activiteit tot gevolg heeft dat voor een woning, een ander
      geluidsgevoelig gebouw of geluidsgevoelig terrein gelegen buiten de grenzen van de gemeente binnen wier grenzen
      de activiteit wordt uitgevoerd een hogere waarde dan de bij of krachtens deze wet genoemde ten hoogste toelaatbare
      waarde dient te worden vastgesteld, kunnen burgemeester en wethouders hiertoe slechts overgaan na overleg met
      burgemeester en wethouders van de gemeente binnen wier grenzen de woning, het andere geluidsgevoelige gebouw of
      geluidsgevoelige terrein is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 110b.2
    text: |-
      Wanneer de in [artikel 110a, zevende lid][ref1], genoemde activiteit tot gevolg heeft dat voor een woning, een
      ander geluidsgevoelig gebouw of geluidsgevoelig terrein gelegen buiten de grenzen van de provincie binnen wier
      grenzen de activiteit wordt uitgevoerd een hogere waarde dan de bij of krachtens deze wet genoemde ten hoogste
      toelaatbare waarde dient te worden vastgesteld, kunnen gedeputeerde staten hiertoe slechts overgaan na overleg
      met gedeputeerde staten van de provincie binnen wier grenzen de woning, het andere geluidsgevoelige gebouw of
      geluidsgevoelige terrein is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 110c.1
    text: |-
      Op de voorbereiding van een besluit als bedoeld in [artikel 110a][ref1] is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure van toepassing, met dien verstande dat
      indien burgemeester en wethouders bevoegd zijn de hogere waarde vast te stellen en het besluit ten behoeve van de
      vaststelling of herziening van een bestemmingsplan wordt genomen, het ontwerp van het besluit tegelijkertijd met
      het ontwerp van het bestemmingsplan ter inzage wordt gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 110c.3
    text: 'Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110c
  - number: 110c.3.a
    text: |-
      de bij een verzoek als bedoeld in [artikel 110a][ref1] over te leggen gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 110c.3.b
    text: |-
      de voorbereiding van een besluit als bedoeld in [artikel 110a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
  - number: 110d
    text: |-
      Ten behoeve van de vaststelling van de geluidsbelasting vanwege een industrieterrein, weg of spoorweg wordt voor
      het bepalen van het equivalente geluidsniveau bij ministeriële regeling aangegeven:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110d
  - number: 110d.a
    text: |-
      op welke wijze en met inachtneming van welke bestaande of te verwachten omstandigheden, de afwisselende niveaus van
      het ter plaatse optredende geluid worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110d
  - number: 110d.b
    text: |-
      op welke wijze uit de over een bepaalde periode verkregen uitkomsten het in vorengenoemde omschrijving bedoelde
      gemiddelde wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110d
  - number: 110e
    text: |-
      Onze Minister kan regels stellen omtrent al hetgeen betrekking heeft op de wijze waarop de akoestische onderzoeken,
      bedoeld in deze wet, worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110e
  - number: 110f.1
    text: 'Indien een van de volgende onderdelen van deze wet of van het krachtens deze onderdelen bepaalde:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.1.a
    text: |-
      [Afdeling 1][ref1] en [afdeling 2 van hoofdstuk V][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: V
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: V
        afdeling: '2'
  - number: 110f.1.b
    text: |-
      [Afdeling 2][ref1], [2a][ref2], [3][ref3] en [4 van hoofdstuk VI][ref4],


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: 2A
      - id: ref3
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '4'
  - number: 110f.1.c
    text: |-
      [hoofdstuk VII][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VII
  - number: 110f.1.d
    text: |-
      [hoofdstuk VIII][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VIII
  - number: 110f.2
    text: |-
      Indien in een bepaald gebied een of meer van de in het eerste lid genoemde onderdelen van deze wet of van het
      krachtens die onderdelen bepaalde van toepassing zijn, terwijl voor dat gebied tevens uit anderen hoofde van
      Rijkswege een saneringsprogramma ter zake van het voorkomen of bestrijden van geluidhinder moet worden opgesteld,
      draagt Onze Minister zorg voor de noodzakelijke onderlinge afstemming en samenhang van de te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.3
    text: |-
      Het eerste en tweede lid zijn uitsluitend van toepassing indien voor een woning, ander geluidgevoelig gebouw of
      geluidgevoelig terrein:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.3.a
    text: een hogere waarde zal worden vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.3.b
    text: |-
      voor dezelfde woning, ander geluidsgevoelig gebouw of geluidsgevoelig terrein, de geluidsbelasting, vanwege
      tenminste een andere geluidsbron als bedoeld in het eerste lid, in de toekomstige situatie de voorkeurswaarde
      overschrijdt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.4
    text: |-
      Het eerste en tweede lid worden alleen toegepast ten aanzien van geluidsbronnen als bedoeld in het eerste lid
      waarvan de geluidsbelasting in de toekomstige situatie de voorkeurswaarde overschrijdt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110f.5
    text: |-
      Ten behoeve van de uitvoering van het eerste lid kan Onze Minister bepalen, dat bij de berekening en meting van de
      onderscheidene geluidsbelastingen van de gevels van de woningen en andere geluidsgevoelige gebouwen en de grens van
      geluidsgevoelige terreinen op de resultaten een door hem aan te geven correctie kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110f
  - number: 110g
    text: |-
      Onze Minister stelt regels op grond waarvan telkens voor een bepaalde periode, al naar gelang de geluidproductie
      van motorvoertuigen in de betrokken periode hoger ligt dan voor de toekomst redelijkerwijs is te verwachten, bij
      de berekening en meting van de geluidsbelasting van de gevel van woningen of van andere geluidsgevoelige gebouwen
      of aan de grens van geluidsgevoelige terreinen op het resultaat een door hem bepaalde aftrek van niet meer dan 5 dB
      wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110g
  - number: 110h
    text: |-
      Indien voorafgaand aan 1 januari 2007 een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting vanwege
      een weg of een spoorweg in dB(A) is vastgesteld en die waarde ook na 1 januari 2007 geldt, wordt die waarde
      omgerekend tot de waarde voor de geluidsbelasting L overeenkomstig een bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110h
  - number: 110i.1
    text: |-
      Een bestuursorgaan doet een door hem genomen onherroepelijk geworden besluit, houdende een beslissing tot het
      vaststellen van een hogere waarde dan de bij of krachtens deze wet genoemde waarden, zo spoedig mogelijk inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van dat wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110i
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: 110i.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing als een besluit als bedoeld in het eerste lid, ingevolge
      een besluit of uitspraak in rechte waarbij dat besluit is ingetrokken of gewijzigd, of anderszins zijn waarde
      heeft verloren, in die zin dat op grond van de betrokken mededeling van het bestuursorgaan de vermelding van de
      desbetreffende korte aanduiding in de basisregistratie kadaster wordt verwijderd bij de betrokken percelen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel110i
  - number: '111.1'
    text: |-
      Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting, vanwege
      een industrieterrein, als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met
      betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning
      bij gesloten ramen ten hoogste bedraagt:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111
  - number: 111.1.a
    text: |-
      ingeval met toepassing van [artikel 63, tweede lid][ref1], een hogere geluidsbelasting dan 55 dB(A) als de ten
      hoogste toelaatbare is vastgesteld: 40 dB(A);


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel63
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '63'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '2'
  - number: 111.1.b
    text: 'in andere gevallen: 35 dB(A).'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111
  - number: '111.2'
    text: |-
      Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting dan 48 dB
      vanwege een weg, als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking
      tot de geluidwering van die gevels, ingeval het een weg betreft die na 1 januari 1982 is of wordt aangelegd en
      is opgenomen in een overeenkomstig de [artikelen 76][ref1] en [77][ref2] vastgesteld bestemmingsplan, dan wel
      na dat tijdstip ingevolge een besluit, genomen met toepassing van de [artikelen 79 tot en met 81][ref3], is
      aangelegd, maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten ramen ten hoogste 33
      dB bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel79
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '77'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '79'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '111.3'
    text: |-
      Indien met betrekking tot de gevels van woningen waarvan de geluidsbelasting vanwege de weg op 1 maart 1986 hoger
      was dan 55 dB(A) en met toepassing van [artikel 90, tweede lid][ref1], een hogere geluidsbelasting dan 48 dB,
      vanwege de weg als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste 43 dB bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: 111a.1
    text: |-
      Indien met toepassing van [artikel 87e, tweede lid of derde lid][ref1], [87f, vierde of vijfde lid][ref2], of
      [87h, derde lid][ref3], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen voor de eerste
      maal een hogere geluidsbelasting dan 48 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, onderscheidenlijk een hogere geluidsbelasting dan 55 dB vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen in geval van geluidsbelasting vanwege wegen ten hoogste 33 dB, onderscheidenlijk vanwege spoorwegen ten
      hoogste 35 dB bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87f
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel87h
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 87e
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        artikel: 87f
        hoofdstuk: VI
        afdeling: 2A
      - id: ref3
        bwb_id: BWBR0003227
        artikel: 87h
        hoofdstuk: VI
        afdeling: 2A
  - number: 111a.2
    text: |-
      Indien met toepassing van [artikel 87g, derde tot en met zesde lid][ref1], of
      [87i, derde tot en met vijfde lid][ref2], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen
      een hogere geluidsbelasting dan 53 dB vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, onderscheidenlijk een hogere geluidsbelasting dan 63 dB vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen als de ten hoogste toelaatbare is vastgesteld, treffen burgemeester en wethouders met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste 43 dB bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87g
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel87i
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111a
