      woningen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel51
  - number: '52'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder: bestaande zone: een zone rond een op 1
      januari 2007 bestaand industrieterrein.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel52
  - number: '53.1'
    text: |-
      Buiten een bestaande zone mag de geluidbelasting vanwege het industrieterrein de waarde van 50 dB(A) niet te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel53
  - number: '53.2'
    text: |-
      De op 1 januari 2007 geldende ten hoogste toelaatbare geluidsbelastingen voor woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen blijven gelden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel53
  - number: '54'
    text: |-
