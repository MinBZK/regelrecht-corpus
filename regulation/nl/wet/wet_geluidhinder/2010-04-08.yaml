      waarde dan 50 dB(A) worden vastgesteld, met dien verstande dat deze waarde voor geprojecteerde woningen de waarde
      55 dB(A) en voor wat aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel55
  - number: '56.1'
    text: |-
