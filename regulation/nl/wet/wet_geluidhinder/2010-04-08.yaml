  - number: 1a
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder een woning als bedoeld in [artikel 1][ref1] niet verstaan
      een opvangcentrum als bedoeld in [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1a
    references:
      - id: ref1
