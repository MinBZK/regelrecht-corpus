  - number: '48.2'
    text: |-
      In afwijking van het eerste lid worden bij de vaststelling van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan als in dat lid bedoeld hogere waarden in acht genomen, voor zover:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel48
  - number: 48.2.a
    text: |-
      eerder bij of krachtens [artikel 45][ref1], [46][ref2], [47, tweede lid][ref3], de
      [Experimentenwet Stad en Milieu][ref4] of de [Interimwet stad-en-milieubenadering][ref5] voor de vaststelling van
      het bestemmingsplan zodanige waarden zijn vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0010041
      [ref5]: https://wetten.overheid.nl/BWBR0019466
