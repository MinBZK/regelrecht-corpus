        afdeling: '1'
  - number: '46.2'
    text: 'Een verhoging van de in het eerste lid bedoelde waarde mag ten hoogste 5 dB(A) bedragen, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel46
  - number: 46.2.a
    text: |-
      degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met de
      verhoging financiële middelen ter beschikking stelt ten behoeve van de uitvoering van maatregelen om de
      geluidsbelasting vanwege het industrieterrein, van de gevels van woningen die door de wijziging van de zone dan
      wel vaststelling van het bestemmingsplan een hogere geluidsbelasting ondervinden te beperken en te voldoen aan
      [artikel 111, eerste lid, onder b][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '111'
        hoofdstuk: VIIIb
  - number: 46.2.b
    text: |-
      de waarde van wat ten tijde van de eerste zonevaststelling geprojecteerde woningen betreft 55 dB(A) en wat ten
      tijde van de eerste zonevaststelling aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag
      gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel46
  - number: '46.3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel46
  - number: '47.1'
    text: |-
      Bij algemene maatregel van bestuur worden waarden vastgesteld voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege het industrieterrein, van de gevel van andere geluidsgevoelige gebouwen alsmede aan de grens van
      geluidsgevoelige terreinen binnen een zone.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel47
  - number: '47.2'
    text: |-
      Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting, bedoeld in het eerste lid, kunnen hogere dan de
      krachtens het eerste lid bepaalde waarden worden vastgesteld, met dien verstande dat deze waarden bij algemene
      maatregel van bestuur te stellen grenzen niet te boven mogen gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel47
  - number: '47.3'
    text: |-
      Bij de maatregel, bedoeld in het tweede lid, kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid,
      enkel in bij die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel47
  - number: '48.1'
    text: |-
      Bij de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of gedeeltelijk
      betrekking heeft op gronden die krachtens die vaststelling gaan of blijven behoren tot een zone, worden ter zake
      van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere geluidsgevoelige
      gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone de waarden in acht genomen, die ingevolge
      [artikel 44][ref2], onderscheidenlijk [47, eerste lid][ref3], als de ten hoogste toelaatbare worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel48
