        artikel: '1'
  - number: 1b.1
    text: |-
      In afwijking van [artikel 1][ref1] wordt in deze wet en de daarop berustende bepalingen bij de bepaling van
      de geluidsbelasting vanwege een industrieterrein, vanwege een weg of vanwege een spoorweg, van de gevel van
      onderwijsgebouwen en medische kleuterdagverblijven, de waarde van de geluidsbelasting over de periode 19.00–23.00
      uur (avond) of de periode 23.00–07.00 uur (nacht) buiten beschouwing gelaten voor zover genoemde gebouwen in de
      betrokken periode niet als zodanig worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: 1b.2
    text: |-
      In afwijking van [artikel 1][ref1] wordt in deze wet en de daarop berustende bepalingen bij de bepaling van de
      geluidsbelasting in dB(A) vanwege een industrieterrein buiten beschouwing gelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: 1b.2.a
    text: het geluid van windturbines welke duurzame energie opwekken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.2.b
    text: het geluid vanwege een internationaal racecircuit gedurende ten hoogste 12 dagen per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.3
    text: |-
      In deze wet en de daarop berustende bepalingen is de geluidsbelasting L vanwege een industrieterrein, vanwege
      een weg en vanwege een spoorweg, niet van toepassing ten aanzien van de gevel van onderwijsgebouwen en medische
      kleuterdagverblijven voor zover genoemde gebouwen in de betrokken periode niet als zodanig worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.4
    text: |-
      In afwijking van [artikel 1][ref1] wordt onder wijziging van een spoorweg in deze wet en de daarop berustende
      bepalingen niet verstaan de afzonderlijke omstandigheid die bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: 1b.4.a
    text: |-
      een wijziging van de intensiteit, de verkeerssnelheid of een combinatie van beiden in het toekomstig maatgevende
      jaar van door Onze Minister te bepalen categorieën spoorvoertuigen op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten als gevolg waarvan de geluidemissie van de betreffende spoorgedeelten of de
      combinatie daarvan onafgerond niet meer dan 1,0 dB toeneemt ten opzichte van de gemiddelde geluidemissie, bepaald
      volgens bij ministeriële regeling te stellen regels, van de drie jaren voorafgaand aan de wijziging;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.4.b
    text: een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.4.c
    text: een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.4.d
    text: |-
      het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister op
      grond van [artikel 107][ref1] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '107'
        hoofdstuk: VII
        afdeling: '3'
  - number: 1b.5
    text: |-
      In afwijking van [artikel 1][ref1] wordt onder een gevel in de zin van deze wet en de daarop berustende bepalingen
      niet verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: 1b.5.a
    text: |-
      een bouwkundige constructie waarin geen te openen delen aanwezig zijn en met een in NEN 5077 bedoelde
      karakteristieke geluidwering die ten minste gelijk is aan het verschil tussen de geluidsbelasting van die
      constructie en 33 dB onderscheidenlijk 35 dB(A), alsmede
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.5.b
    text: |-
      een bouwkundige constructie waarin alleen bij uitzondering te openen delen aanwezig zijn, mits de delen niet direct
      grenzen aan een geluidsgevoelige ruimte.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.6
    text: |-
      In afwijking van [artikel 1][ref1] wordt onder een wijziging op of aan een weg in deze wet en de daarop berustende
      bepalingen niet verstaan een wijziging die slechts bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: 1b.6.a
    text: een snelheidsverlaging;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.6.b
    text: de vervanging van een wegdeklaag door een wegdeklaag met dezelfde of een grotere geluidsreducerende werking, of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1b.6.c
    text: |-
      een snelheidsverhoging tot ten hoogste de maximumsnelheid, zoals die gold vóór een tijdelijke snelheidsverlaging
      die als maatregel is opgenomen in een programma als bedoeld in [artikel 5.12 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 1b.7
    text: |-
      In het geval van een tijdelijke snelheidsverlaging als bedoeld in het zesde lid, onder c, wordt als heersende
      waarde aangemerkt de waarde van de geluidsbelasting, zoals die zou zijn zonder de tijdelijke snelheidsverlaging.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1b
  - number: 1c.1
    text: |-
      De bevoegdheid tot afwijking van een milieukwaliteitsnorm op grond van
      [artikel 2 van de Interimwet stad-en-milieubenadering][ref1] bestaat voor de onderhavige wet slechts voor zover
      het de maximale waarde betreft die bij of krachtens deze wet als de ten hoogste toelaatbare geluidsbelasting kan
      worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
  - number: 1c.2
    text: |-
      [Artikel 5, eerste lid, onder c, van de Interimwet stad-en-milieubenadering][ref1] wordt zo toegepast dat per
      woning, ander geluidsgevoelig gebouw of geluidsgevoelig terrein de in het eerste lid bedoelde waarde wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel5
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '5'
  - number: '2.1'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder kunnen bij algemene maatregel van bestuur regels
      worden gesteld omtrent:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.1.a
    text: het vervaardigen, invoeren, in voorraad hebben, te koop aanbieden, afleveren of vervoeren van toestellen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.1.b
    text: het gebruiken van toestellen, anders dan in particuliere huishoudens.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: '2.2'
    text: 'Hiertoe kunnen behoren regels, inhoudende:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.2.a
    text: |-
      een verbod in het eerste lid genoemde handelingen, bij de maatregel aangewezen, met betrekking tot toestellen,
      behorende tot een bij de maatregel aangewezen categorie, te verrichten;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.2.b
    text: een verbod zulks te doen zonder vergunning, verleend door een bij de maatregel aangewezen orgaan;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.2.c
    text: |-
      een verbod zulks te doen indien de geluidproduktie van het toestel een hogere waarde heeft dan bij of krachtens de
      maatregel vastgesteld of het toestel anderszins niet voldoet aan de bij de maatregel gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.2.d
    text: |-
      een verbod zulks te doen indien het toestel niet behoort tot een type dat bij een keuring, verricht aan de hand van
      de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: 2.2.e
    text: |-
      een verbod een toestel, behorende tot een bij de maatregel aangewezen categorie, te gebruiken indien niet het
      bewijs kan worden overgelegd dat het binnen een bij de maatregel bepaalde voorafgaande termijn bij een keuring,
      verricht aan de hand van de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid kan het vaststellen van regels als in dat lid bedoeld ter uitvoering van voor
      Nederland verbindende verdragen en besluiten van volkenrechtelijke organisaties geschieden door Onze Minister in
      overeenstemming met Onze Ministers wie het mede aangaat. De [artikelen 3][ref1], [4][ref2], [5][ref3], [6][ref4]
      en [7][ref5] zijn van toepassing op een ministeriële regeling die ingevolge dit lid wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel7
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0003227
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] kan, behoudens in geval van toepassing van
      [artikel 2, tweede lid, onder ][ref2], tevens de verplichting inhouden te voldoen aan door bestuursorganen die bij
      de maatregel zijn aangewezen, omtrent onderwerpen die in de maatregel zijn geregeld, aan de betrokkene gestelde
      nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip bepaald waarop ten aanzien van die eis de
      verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '4'
    text: |-
      In een algemene maatregel van bestuur waarbij regels van de in [artikel 2, tweede lid, onder ][ref1], bedoelde
      strekking worden gesteld, worden tevens termijnen vastgesteld, tot het verstrijken waarvan die regels niet van
      toepassing zijn ten aanzien van toestellen die bij het in werking treden van de maatregel reeds vervaardigd en hier
      te lande aanwezig waren, en ten aanzien van toestellen, behorende tot een reeks die op dat tijdstip reeds hier te
      lande in produktie was genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.1'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 2, tweede lid, onder b][ref1], zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3]
      van toepassing op de voorbereiding van de beschikking op de aanvraag om een vergunning.
      [Artikel 8.7 van de Wet milieubeheer][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '5.2'
    text: De vergunning kan slechts in het belang van het voorkomen of beperken van geluidhinder worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: '5.3'
    text: |-
      Aan een vergunning kunnen in het belang van het voorkomen of beperken van geluidhinder voorschriften worden
      verbonden. De voorschriften kunnen voor zover bij de maatregel niet anders is bepaald, de verplichting inhouden
      te voldoen aan door bestuursorganen die bij het voorschrift zijn aangewezen, in het belang van het voorkomen
      of beperken van geluidhinder gestelde nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip
      bepaald, waarop ten aanzien van die eis de verplichting ingaat.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: '5.4'
    text: Voor zover zulks bij algemene maatregel van bestuur is bepaald, kan de vergunning worden gewijzigd en ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: '5.5'
    text: 'Intrekking kan slechts geschieden:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: 5.5.a
    text: indien de vergunning niet wordt nageleefd, of
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: 5.5.b
    text: |-
      indien het toestel ontoelaatbare geluidhinder veroorzaakt en wijziging of aanvulling van de aan de vergunning
      verbonden voorschriften redelijkerwijs geen oplossing kan bieden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
  - number: '5.6'
    text: |-
      Op de voorbereiding van een wijziging van een vergunning of intrekking van een vergunning op de grond,
      bedoeld in het vijfde lid, onder b, zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] van toepassing. [Artikel 8.7 van de Wet milieubeheer][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '6'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 2, tweede lid, onder ][ref1], worden bij of krachtens de maatregel de
      instanties aangewezen, die de in die bepalingen bedoelde keuringen verrichten. Bij of krachtens algemene maatregel
      van bestuur worden regels gesteld ten aanzien van de wijze waarop die keuringen plaatshebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.1'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] kunnen ter zake van de toepasselijkheid van
      daarbij gestelde regels beperkingen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7.2'
    text: 'Zodanige beperking kan onder meer inhouden:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel7
  - number: 7.2.a
    text: dat de regel slechts geldt in de bij de maatregel aangewezen gebieden;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel7
  - number: 7.2.b
    text: |-
      dat de regel niet geldt met betrekking tot inrichtingen, behorende tot een daartoe bij de maatregel aangewezen
      categorie.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel7
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van het voorkomen of beperken van geluidhinder worden
      verboden toestellen, behorende tot een bij de maatregel aangewezen categorie, te verhandelen anders dan met
      inachtneming van de voorschriften, bij de maatregel gesteld met betrekking tot hun aanduiding of benaming.
      [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van het voorkomen of beperken van geluidhinder worden verboden
      voor gebruik als geluidwerende voorziening bestemde of geschikte materialen of andere zaken, welke behoren tot
      een bij de maatregel aangewezen categorie, te verhandelen anders dan met inachtneming van de voorschriften,
      bij de maatregel gesteld met betrekking tot hun aanduiding of benaming. [Artikel 2, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder kan bij algemene maatregel van bestuur worden verboden
      een uitlaatsysteem, behorende tot een bij de maatregel aangewezen categorie, te vervaardigen, in te voeren, in
      voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren, indien de geluidwerende eigenschappen
      ervan niet voldoen aan de bij of krachtens de maatregel gestelde eisen. [Artikel 2, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '40'
    text: |-
      Indien bij de vaststelling van een bestemmingsplan aan gronden een zodanige bestemming wordt gegeven dat daardoor
      een industrieterrein ontstaat, wordt daarbij tevens een rond het betrokken terrein gelegen zone vastgesteld,
      waarbuiten de geluidsbelasting vanwege dat terrein de waarde van 50 dB(A) niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel40
  - number: '41.1'
    text: |-
      Een krachtens [artikel 40][ref1] vastgestelde zone kan uitsluitend worden gewijzigd of opgeheven bij vaststelling
      of wijziging van een bestemmingsplan, met dien verstande dat opheffing alleen kan plaatsvinden wanneer de
      bestemming van het betrokken terrein zodanig is gewijzigd dat het geen industrieterrein meer is.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '41.2'
    text: |-
      Een wijziging van een zone kan er niet toe strekken dat enig gebied waarbinnen met inachtneming van de al
      krachtens de [Wet milieubeheer][ref1] verleende vergunningen en de daaraan verbonden voorschriften een hogere
      geluidsbelasting, vanwege het industrieterrein, optreedt dan 50 dB(A), ophoudt van de zone deel uit te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '41.3'
    text: |-
      Een opgeheven zone bestaat voort zolang zich op het terrein een of meer inrichtingen bevinden, behorende tot een
      bij algemene maatregel van bestuur aan te wijzen categorie van inrichtingen die in belangrijke mate geluidhinder
      kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel41
  - number: '41.4'
    text: |-
      Onverminderd het eerste lid kan de gemeenteraad bij besluit de begrenzing van een industrieterrein, waarop de
      vastgestelde zone is gebaseerd, vastleggen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel41
  - number: '42.1'
    text: |-
      Bij het voorbereiden van de vaststelling of wijziging van een zone, wordt vanwege burgemeester en wethouders een
      akoestisch onderzoek ingesteld naar:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel42
  - number: 42.1.a
    text: |-
      de geluidsbelasting die door woningen binnen de ontworpen zone, alsmede door andere geluidsgevoelige gebouwen of
      door geluidsgevoelige terreinen, vanwege het industrieterrein ten hoogste zou kunnen worden ondervonden zonder de
      invloed van maatregelen die de geluidsbelasting beperken;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel42
  - number: 42.1.b
    text: |-
      de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege
      het industrieterrein optredende geluidsbelasting van de onder a bedoelde objecten de waarden die ingevolge de
      [artikelen 44][ref1] en [47, eerste lid][ref2], als ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '44'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '47'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '42.2'
    text: |-
      Indien wordt overwogen toepassing te geven aan [artikel 45][ref1], [46][ref2] of [47, tweede lid][ref3], heeft
      het akoestisch onderzoek tevens betrekking op de doeltreffendheid van de maatregelen om te voldoen aan de vast te
      stellen hogere waarde voor de ten hoogste toelaatbare geluidsbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '45'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '46'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '47'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '44'
    text: |-
      De ten hoogste toelaatbare geluidsbelasting vanwege het betrokken industrieterrein, van de gevel van woningen
      binnen een krachtens [artikel 40][ref1] vast te stellen zone is, behoudens [artikel 45][ref2], 50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel45
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '40'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '45'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '45.1'
    text: |-
      Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting, bedoeld in [artikel 44][ref1], kan een hogere dan de
      in dat artikel genoemde waarde worden vastgesteld, met dien verstande dat deze waarde voor geprojecteerde woningen
      55 dB(A) en voor aanwezige of in aanbouw zijnde woningen 60 dB(A) niet te boven mag gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '44'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '45.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid, enkel in bij
      die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel45
  - number: '46.1'
    text: |-
      Bij wijziging van een zone kan de ingevolge [artikel 44][ref1] of [45][ref2] geldende waarde voor woningen in dat
      gebied worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel45
