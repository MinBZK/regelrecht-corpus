  - number: '49'
    text: |-
      Bij het nemen van een projectbesluit, dat geheel of gedeeltelijk betrekking heeft op gronden die behoren tot een
      zone, worden ter zake van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere
      geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone de waarden in acht genomen,
      die bij of krachtens de [artikelen 44 tot en met 47][ref1], de [Experimentenwet Stad en Milieu][ref2] alsmede de
      [Interimwet stad-en-milieubenadering][ref3] als de ten hoogste toelaatbare worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0010041
      [ref3]: https://wetten.overheid.nl/BWBR0019466
