        bwb_id: BWBR0003227
        artikel: '112'
        hoofdstuk: VIIIb
  - number: '114.1'
    text: |-
      Indien toepassing wordt gegeven aan [hoofdstuk VII][ref1] of [VIII][ref2], kunnen bij algemene maatregel van
      bestuur voor aanwezige of in aanbouw zijnde woningen en andere geluidsgevoelige gebouwen met betrekking tot de in
      de [artikelen 111][ref3] en [112][ref4] geregelde onderwerpen overeenkomstige regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel112
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '111'
        hoofdstuk: VIIIb
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '112'
        hoofdstuk: VIIIb
  - number: '114.2'
    text: |-
      In afwijking van het eerste lid hebben, ingeval toepassing wordt gegeven aan [hoofdstuk VIII][ref1] met betrekking
      tot geluidhinder vanwege luchtvaartterreinen, de regels van een in het eerste lid bedoelde maatregel betrekking op
      de waarde van de geluidwering die de gevels van aanwezige of in aanbouw zijnde woningen en andere geluidsgevoelige
      bestemmingen ten minste moeten bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VIII
  - number: 114a.1
    text: |-
      Indien de rechthebbende ten aanzien van een woning of een ander geluidsgevoelig gebouw niet heeft toegestemd mee te
      werken aan maatregelen die moeten worden getroffen ingevolge het bij of krachtens dit hoofdstuk bepaalde, vervalt
      de verplichting om overeenkomstig het bij of krachtens dit hoofdstuk bepaalde maatregelen te treffen ten aanzien
      van die woning onderscheidenlijk dat andere geluidsgevoelige gebouw.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
  - number: 114a.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
  - number: 114a.2.a
    text: de wijze waarop aan de rechthebbende wordt verzocht om mee te werken aan de realisatie van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
  - number: 114a.2.b
    text: de wijze waarop de rechthebbende zijn toestemming verleent of onthoudt aan de realisatie van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
  - number: 114a.2.c
    text: |-
      de wijze waarop burgemeester en wethouders aan de rechthebbende mededeling doen over het vervallen van de
      verplichting, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
  - number: 114a.3
    text: |-
      [Artikel 110i, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110i
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel114a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110i
        hoofdstuk: VIIIa
        afdeling: '2'
  - number: '115'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: geluidsbelasting L: geluidsbelasting op
      een plaats en vanwege een bron als omschreven in bijlage I, onderdeel 1, van [richtlijn 2002/49/EG](32002L0049)
      van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing
      van omgevingslawaai (PbEG L 189) over alle perioden van 07.00 uur tot 19.00 uur, van 19.00 uur tot 23.00 uur en van
      23.00 tot 7.00 uur van een jaar; verzameling van inrichtingen:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel115
  - number: 115.a
    text: inrichtingen op een industrieterrein;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel115
  - number: 115.b
    text: |-
      bij algemene maatregel van bestuur aangewezen inrichtingen, die zijn gelegen binnen een daarbij aangegeven
      gebied; stille gebieden: bij algemene maatregel van bestuur of overeenkomstig de maatregel als zodanig aangewezen
      categorieën van gebieden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel115
  - number: '116.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat en gedeputeerde staten melden vóór 1 april 2005 aan Onze Minister op welke
      delen van rijkswegen, onderscheidenlijk provinciale wegen naar verwachting in het kalenderjaar 2006 meer dan zes
      miljoen maal een motorvoertuig zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel116
  - number: '116.2'
    text: |-
      Onze Minister van Verkeer en Waterstaat meldt voor de in het eerste lid genoemde datum tevens aan Onze Minister op
      welke delen van hoofdspoorwegen naar verwachting in 2006 meer dan 60 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel116
  - number: '116.3'
    text: |-
      Onze Minister van Verkeer en Waterstaat en gedeputeerde staten melden vóór 30 september 2008, vóór 1 april 2010
      en vervolgens elke vijf jaar vóór 1 april aan Onze Minister op welke delen van rijkswegen, onderscheidenlijk
      provinciale wegen naar verwachting in het daaropvolgende kalenderjaar meer dan drie miljoen maal een motorvoertuig
      zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel116
  - number: '116.4'
    text: |-
      Onze Minister van Verkeer en Waterstaat meldt voor de in het derde lid genoemde data tevens aan Onze Minister op
      welke delen van hoofdspoorwegen naar verwachting meer dan 30 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel116
  - number: '117.1'
    text: |-
      Onze Minister publiceert vóór 30 juni 2005 in de Staatscourant op welke delen van rijkswegen en provinciale wegen
      naar verwachting in 2006 meer dan zes miljoen maal een motorvoertuig zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117
  - number: '117.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op delen van hoofdspoorwegen waarop naar verwachting in 2006 meer
      dan 60 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117
  - number: '117.3'
    text: |-
      Onze Minister publiceert vóór 31 december 2008, voor 30 juni 2010 en vervolgens elke vijf jaar voor 30 juni
      in de Staatscourant op welke delen van rijkswegen en provinciale wegen naar verwachting in het daaropvolgende
      kalenderjaar meer dan drie miljoen maal een motorvoertuig zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117
  - number: '117.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing op delen van hoofdspoorwegen waarop naar verwachting in het
      daaropvolgende kalenderjaar meer dan 30 000 maal een trein zal passeren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117
  - number: 117a.1
    text: Onze Minister wijst vóór 30 juni 2005 als agglomeratie aan verstedelijkte gebieden met ten minste 250 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117a
  - number: 117a.2
    text: |-
      Onze Minister wijst vóór 31 december 2008, voor 30 juni 2010 en vervolgens elke vijf jaar voor 30 juni als
      agglomeratie aan verstedelijkte gebieden met ten minste 100 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel117a
  - number: '118.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten, stellen vóór 30 juni 2007 en
      vervolgens vóór 30 juni van ten minste elk vijfde kalenderjaar, geluidsbelastingkaarten vast. Deze kaarten hebben
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118.1.a
    text: |-
      de geluidsbelasting L en de geluidsbelasting L op woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige
      terreinen vanwege delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale wegen als bedoeld in
      [artikel 117][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel117
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '117'
        hoofdstuk: IX
        paragraaf: '1'
  - number: 118.1.b
    text: |-
      stille gebieden in de omgeving van delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale wegen als
      bedoeld in [artikel 117][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel117
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '117'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '118.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op burgemeester en wethouders van gemeenten die behoren tot
      krachtens [artikel 117a][ref1] aangewezen agglomeraties met dien verstande dat de geluidsbelastingkaarten
      betrekking hebben op de geluidsbelasting L en de geluidsbelasting L vanwege:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel117a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 117a
        hoofdstuk: IX
        paragraaf: '1'
  - number: 118.2.a
    text: wegen,
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118.2.b
    text: spoorwegen die niet deel uitmaken van een weg,
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118.2.c
    text: |-
      luchtvaartterreinen als bedoeld in [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1] en de luchthaven
      Schiphol, bedoeld in [hoofdstuk 8 van de Wet luchtvaart][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: '8'
  - number: 118.2.d
    text: inrichtingen of verzamelingen van inrichtingen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: '118.3'
    text: 'De geluidsbelastingkaarten geven ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118.3.a
    text: |-
      de geluidsbelasting L en de geluidsbelasting L veroorzaakt door de in het eerste, onderscheidenlijk tweede lid,
      bedoelde geluidsbronnen in het kalenderjaar voorafgaand aan dat van de vaststelling van de geluidsbelastingkaart en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118.3.b
    text: |-
      het aantal woningen, andere geluidsgevoelige gebouwen, geluidsgevoelige terreinen en bewoners van woningen die aan
      bepaalde waarden van de geluidsbelasting L en de geluidsbelasting L worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: '118.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud, vormgeving en
      inrichting van geluidsbelastingkaarten, welke regels kunnen verschillen voor rijkswegen, provinciale wegen,
      hoofdspoorwegen en agglomeraties.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118
  - number: 118a.1
    text: |-
      Ten behoeve van de vaststelling van een geluidsbelastingkaart als bedoeld in [artikel 118, eerste lid][ref1],
      verschaffen burgemeester en wethouders aan Onze Minister van Verkeer en Waterstaat en gedeputeerde staten op hun
      verzoek, alle inlichtingen en gegevens waarover zij kunnen beschikken, voor zover die voor het opstellen van die
      kaart noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
  - number: 118a.2
    text: |-
      Ten behoeve van de vaststelling van een geluidsbelastingkaart als bedoeld in [artikel 118, tweede lid][ref1],
      verschaffen Onze Minister, Onze Minister van Verkeer en Waterstaat, gedeputeerde staten en burgemeester
      en wethouders aan betrokken burgemeester en wethouders op hun verzoek, alle inlichtingen en gegevens
      waarover zij kunnen beschikken, voor zover die voor het opstellen van die kaart noodzakelijk zijn.
      Op een dergelijk verzoek verschaft Onze Minister van Defensie de contourenkaarten, bedoeld in
      [artikel 30c, tweede lid, van de Luchtvaartwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel30c
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 30c
  - number: 118a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de te verschaffen
      inlichtingen en gegevens, waaronder de wijze waarop en de termijn waarbinnen of de datum waarvoor deze verschaft
      worden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel118a
  - number: '119.1'
    text: |-
      Ten behoeve van de bepaling van de geluidsbelasting L en de geluidsbelasting L vanwege een weg, spoorweg,
      inrichting of verzameling van inrichtingen kunnen bij regeling van Onze Minister regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel119
  - number: '119.2'
    text: |-
      Ten behoeve van de bepaling van de geluidsbelasting L en de geluidsbelasting L vanwege een luchtvaartterrein of een
      luchthaven kunnen bij regeling van Onze Minister in overeenstemming met Onze Minister van Verkeer en Waterstaat en
      Onze Minister van Defensie regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel119
  - number: '120.1'
    text: |-
      Binnen één maand na de vaststelling van een geluidsbelastingkaart als bedoeld in
      [artikel 118, eerste en tweede lid][ref1], geven Onze Minister van Verkeer en Waterstaat, gedeputeerde staten,
      onderscheidenlijk burgemeester en wethouders van deze vaststelling kennis in één of meer dag- , nieuws-, of huis-
      aan-huisbladen, dan wel op andere geschikte wijze. Hierbij geven zij aan op welke wijze kennis kan worden gekregen
      van de inhoud van de geluidsbelastingkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '120.2'
    text: 'De in het eerste lid bedoelde bestuursorganen:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
  - number: 120.2.a
    text: stellen de geluidsbelastingkaart zo mogelijk elektronisch ter beschikking van eenieder;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
  - number: 120.2.b
    text: voegen bij de geluidsbelastingkaart een overzicht van de belangrijkste punten van die kaart.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
  - number: '120.3'
    text: |-
      Onze Minister van Verkeer en Waterstaat, gedeputeerde staten, onderscheidenlijk burgemeester en wethouders zenden
      de geluidsbelastingkaart binnen één maand na vaststelling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
  - number: '120.4'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over de wijze waarop de geluidsbelastingkaart ter
      beschikking van Onze Minister wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel120
  - number: '121.1'
    text: |-
      Indien gedeputeerde staten niet of niet tijdig voldoen aan een verplichting als bedoeld in
      [artikel 118, eerste lid][ref1], is [artikel 121 van de Provinciewet][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '121'
  - number: '121.2'
    text: |-
      Indien burgemeester en wethouders niet of niet tijdig voldoen aan een verplichting als bedoeld in
      [artikel 118, tweede lid][ref1], is [artikel 124 van de Gemeentewet][ref2] van overeenkomstige toepassing met dien
      verstande dat Onze Minister in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel124
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel121
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '124'
  - number: '122.1'
    text: |-
      Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten stellen vóór 18 juli 2008 aan de
      hand van de geluidsbelastingkaarten, bedoeld in [artikel 118][ref1], een actieplan vast met betrekking tot de
      krachtens [artikel 117][ref2] gepubliceerde delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale
      wegen. Indien er sprake is van een belangrijke ontwikkeling die van invloed is op de geluidhindersituatie,
      en daarnaast ten minste elke vijf jaar na de vaststelling wordt het actieplan opnieuw overwogen, en zo nodig
      aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel117
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '117'
        hoofdstuk: IX
        paragraaf: '1'
  - number: '122.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op burgemeester en wethouders van gemeenten die behoren tot
      krachtens [artikel 117a][ref1] aangewezen agglomeraties, met dien verstande dat het actieplan betrekking heeft op
      de in [artikel 118, tweede lid][ref2], bedoelde geluidsbronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel117a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel118
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 117a
        hoofdstuk: IX
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '118'
        hoofdstuk: IX
        paragraaf: '2'
  - number: '122.3'
    text: 'Een actieplan bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
  - number: 122.3.a
    text: het te voeren beleid om de geluidsbelasting L en de geluidsbelasting L te beperken, en
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
  - number: 122.3.b
    text: |-
      de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om overschrijding van overeenkomstig algemene
      maatregel van bestuur vast te stellen waarden van de geluidsbelasting L of de geluidsbelasting L te voorkomen of
      ongedaan te maken en de te verwachten effecten van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
  - number: '122.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud, vormgeving en
      inrichting van actieplannen. Deze regels kunnen verschillen voor rijkswegen, provinciale wegen, hoofdspoorwegen
      en agglomeraties.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel122
  - number: '123.1'
    text: |-
      Een actieplan wordt voorbereid met overeenkomstige toepassing van de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure, met dien verstande dat in afwijking van
      [artikel 3:15 van de Algemene wet bestuursrecht][ref2], eenieder zienswijzen naar voren kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '123.2'
    text: |-
      Burgemeester en wethouders stellen een actieplan niet vast dan nadat de gemeenteraad een ontwerp van het actieplan
      is toegezonden en deze in de gelegenheid is gesteld zijn wensen en zienswijze ter kennis van burgemeester en
      wethouders te brengen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel123
  - number: 123a
    text: Artikel 120 is van overeenkomstige toepassing op de vaststelling van actieplannen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel123a
  - number: 123b.1
    text: |-
      Onze Minister van Verkeer en Waterstaat, gedeputeerde staten en burgemeester en wethouders verschaffen op verzoek
      van een bevoegde autoriteit van een van de lidstaten van de Europese Unie alle inlichtingen en gegevens waarover
      zij kunnen beschikken, voor zover die voor het opstellen van een geluidsbelastingkaart in de desbetreffende
      lidstaat noodzakelijk zijn. Op een dergelijk verzoek verschaft Onze Minister van Defensie de contourenkaarten,
      bedoeld in [artikel 30c, tweede lid, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel30c
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 30c
  - number: 123b.2
    text: |-
      [Artikel 118a, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel123b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 118a
        hoofdstuk: IX
        paragraaf: '2'
  - number: '124'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref2] van toepassing op subsidies die krachtens dit hoofdstuk
      uitsluitend worden verstrekt aan rechtspersonen die krachtens publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: '125.1'
    text: |-
      Voor zover in de kosten van de maatregelen die in verband met de vaststelling van een bij een industrieterrein
      behorende zone krachtens of met overeenkomstige toepassing van [artikel 53][ref1] zoals dat luidde op 1 januari
      2007 dan wel in verband met het toepassing geven aan [artikel 46][ref2] of [55, eerste lid][ref3], met het oog op
      de beperking van de geluidsbelasting van woningen binnen die zone krachtens [Afdeling 2, van hoofdstuk V][ref4]
      zijn vastgesteld, niet op andere wijze wordt voorzien, komen deze kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '53'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '46'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003227
        artikel: '55'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003227
        hoofdstuk: V
        afdeling: '2'
  - number: 125.1.a
    text: |-
      voor zover het maatregelen betreft ten behoeve van op het tijdstip van de vaststelling van de zone al aanwezige of
      in aanbouw zijnde woningen ten aanzien waarvan [Afdeling 2, § 5, van hoofdstuk V][ref1], van toepassing is: ten
      laste van het Rijk;


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '2'
  - number: 125.1.b
    text: |-
      voor zover het maatregelen betreft ten behoeve van op het tijdstip van de vaststelling van de zone geprojecteerde
      woningen: ten laste van de exploitanten van de op het industrieterrein op dat tijdstip al gevestigde inrichtingen
      en de betrokken gemeente, ieder voor de helft, met dien verstande dat het ten laste van de exploitanten van
      bedoelde inrichtingen komende gedeelte der kosten over hen verdeeld wordt zoveel mogelijk naar evenredigheid van
      het aandeel der onderscheidene inrichtingen in de geluidproduktie van het industrieterrein op bedoeld tijdstip;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
  - number: 125.1.c
    text: |-
      voor zover het maatregelen betreft ten behoeve van woningen binnen de zone ingeval toepassing wordt gegeven aan
      [artikel 46][ref1] of [55, eerste lid][ref2]: ten laste van degene ten behoeve van wie de ten hoogste toelaatbare
      geluidsbelasting wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel55
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '46'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '55'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '2'
  - number: '125.2'
    text: |-
      Tot de kosten, bedoeld in het eerste lid, worden mede gerekend de kosten, voortvloeiende uit het treffen van de
      krachtens de [Woningwet][ref1] of [hoofdstuk VIII B][ref2] vereiste maatregelen met betrekking tot de geluidwering
      van de gevels van de in dat lid bedoelde woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIb
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005181
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VIIIb
  - number: '125.3'
    text: Met betrekking tot andere geluidsgevoelige gebouwen is het eerste lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel125
  - number: '126.1'
    text: |-
      Voor zover in de kosten van maatregelen die met het oog op de beperking van de geluidsbelasting van woningen binnen
      zones langs wegen als bedoeld in [artikel 74][ref1] krachtens [Afdeling 3 van hoofdstuk VI][ref2] zijn vastgesteld,
      niet op andere wijze wordt voorzien, komen deze kosten in gevallen waarin op 1 maart 1986 de woningen aanwezig of
      in aanbouw waren, terwijl de weg aanwezig was: ten laste van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '74'
        hoofdstuk: VI
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '3'
  - number: '126.2'
    text: |-
      Het eerste lid is niet van toepassing met betrekking tot maatregelen met het oog op de beperking van de
      geluidsbelasting van woningen:
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
  - number: 126.2.a
    text: |-
      die op 1 maart 1986 een geluidsbelasting vanwege een weg ondervonden van ten minste 65 dB(A), dan wel ten minste 60
      dB(A) indien zij deel uitmaken van een verzameling van woningen waarvan ten minste één woning een geluidsbelasting
      vanwege een weg ondervond van ten minste 65 dB(A),
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
  - number: 126.2.b
    text: |-
      die door het gemeentebestuur voor 1 januari 1998 op grond van [artikel 88, eerste lid][ref1], aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zijn gemeld, en


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '88'
        hoofdstuk: VI
        afdeling: '3'
  - number: 126.2.c
    text: |-
      ten aanzien waarvan het gemeentebestuur bij die gelegenheid heeft verklaard dat het treffen van geluidwerende
      maatregelen de enige oplossing is die in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
  - number: '126.3'
    text: |-
      Indien door een reconstructie de geluidsbelasting, vanwege de gereconstrueerde weg, van de gevel van woningen
      binnen een zone met meer dan 5 dB is toegenomen en voor die woningen nog niet eerder toepassing is gegeven aan
      [artikel 90, vierde lid][ref1], komen de kosten, bedoeld in het eerste lid, ten laste van de wegbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '90'
        hoofdstuk: VI
        afdeling: '3'
  - number: '126.4'
    text: |-
      Met betrekking tot andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen zijn het eerste en derde lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
  - number: '126.5'
    text: |-
      In afwijking van het eerste lid komen de kosten van maatregelen in gevallen waarin op 1 maart 1986 de woningen
      aanwezig of in aanbouw waren, terwijl de weg aanwezig was, maar de woningen niet tijdig overeenkomstig artikel 88
      zijn gemeld, ten laste van de gemeente waarin de woningen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
  - number: '126.6'
    text: |-
      Indien toepassing wordt gegeven aan [artikel 98][ref1] komt het gedeelte van de kosten van de maatregelen dat
      verband houdt met de reconstructie van de weg voor rekening van de wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '98'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '4'
  - number: 126a
    text: |-
      In afwijking van de [artikelen 125][ref1] of [126][ref2] kan Onze Minister volgens bij ministeriële regeling te
      stellen regels in gevallen waarin een maatregel als bedoeld in die artikelen tevens wordt getroffen met een ander
      oogmerk dan in die artikelen genoemd, de subsidies verstrekken ten behoeve van die maatregel op basis van door hem
      vastgestelde normbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel126
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel126a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '125'
        hoofdstuk: X
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '126'
        hoofdstuk: X
        paragraaf: '2'
  - number: '127'
    text: |-
      In geval van reconstructie van een weg komen de kosten van de maatregelen, vastgesteld krachtens Afdeling 4 van
      hoofdstuk VI, voor zover deze kosten verband houden met de reconstructie, ten laste van de wegaanlegger.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel127
  - number: 127a.1
    text: |-
      In geval van de aanleg, wijziging of verbreding van een hoofdweg als bedoeld in
      [afdeling 2a van hoofdstuk VI][ref1], komen de kosten van maatregelen gericht op het terugbrengen van de verwachte
      geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, vastgesteld krachtens de [Tracéwet][ref2], voor zover deze kosten verband houden met
      de aanleg of wijziging, ten laste van de wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0006147
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0006147
  - number: 127a.2
    text: |-
      In geval van de aanleg of wijziging van een landelijke spoorweg als bedoeld in
      [afdeling 2 van hoofdstuk VII][ref1], komen kosten van maatregelen gericht op het terugbrengen van de verwachte
      geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, vastgesteld krachtens de [Tracéwet][ref2], voor zover deze kosten verband houden met
      de aanleg of wijziging, ten laste van de spoorwegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0006147
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VI
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006147
  - number: 127a.3
    text: |-
      [Artikel 126, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel126
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel127a
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '126'
        hoofdstuk: X
        paragraaf: '2'
  - number: '128.1'
    text: |-
      Indien een wegaanlegger, onderscheidenlijk wegbeheerder, of een gemeente zich ten gevolge van de toepassing van
      [artikel 126][ref1] of [127][ref2] voor kosten ziet gesteld, die redelijkerwijs niet of niet geheel te zijnen laste
      behoren te blijven, kan Onze Minister hem, voor zover op andere wijze in een redelijke vergoeding niet is of kan
      worden voorzien, op diens verzoek een naar billijkheid te bepalen vergoeding toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel127
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '126'
        hoofdstuk: X
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '127'
        hoofdstuk: X
        paragraaf: '2'
  - number: '128.2'
    text: |-
      Het eerste lid is niet van toepassing indien het betreft kosten met betrekking tot maatregelen als bedoeld in
      [artikel 126, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel126
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '126'
        hoofdstuk: X
        paragraaf: '2'
  - number: '129'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 107][ref1] worden regels gegeven met betrekking tot
      de toerekening van de kosten welke voor de aanlegger of beheerder van de spoor- of tramweg of voor de gemeenten
      binnen de zone zijn verbonden aan maatregelen ter voldoening aan het bij of krachtens die maatregel bepaalde, en
      kan worden bepaald dat de kosten van maatregelen welke met instemming van Onze Minister worden getroffen, ten laste
      komen van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '107'
        hoofdstuk: VII
        afdeling: '3'
  - number: '130'
    text: |-
      Bij een algemene maatregel van bestuur als bedoeld in [artikel 108][ref1] worden regels gegeven met betrekking
      tot de toerekening van de kosten welke voor de gemeenten binnen de aangewezen zone zijn verbonden aan maatregelen
      ter voldoening aan het bij of krachtens die maatregel bepaalde, en kan, afhankelijk van de geluidsbronnen die
      aanleiding zijn voor de aanwijzing krachtens [artikel 108][ref2], worden bepaald dat de kosten van maatregelen
      welke met instemming van Onze Minister worden getroffen ter voldoening aan het bij of krachtens de algemene
      maatregel van bestuur bepaalde, ten laste komen van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '108'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '108'
        hoofdstuk: VIII
  - number: '145.1'
    text: |-
      Indien het besluit in de zin van [artikel 110a, eerste lid][ref1], wordt genomen door burgemeester
      en wethouders en gepaard gaat met de vaststelling van een bestemmingsplan vangt, in afwijking van
      [artikel 6:8 van de Algemene wet bestuursrecht][ref2], de termijn voor het indienen van een beroepschrift tegen
      dat besluit aan met ingang van de dag waarop beroep kan worden ingesteld tegen het besluit tot vaststelling van het
      bestemmingsplan. Indien niet binnen die termijn is beslist, vangt de beroepstermijn aan met ingang van de dag na
      die waarop de termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '145.2'
    text: |-
      Indien het besluit in de zin van [artikel 110a, eerste lid][ref1], wordt genomen door burgemeester en
      wethouders en gepaard gaat met een besluit overeenkomstig [artikel 81][ref2], vangt in afwijking van
      [artikel 6:8 van de Algemene wet bestuursrecht][ref3], de termijn voor het indienen van een beroepschrift
      tegen dat besluit aan met ingang van de dag waarop beroep kan worden ingesteld tegen het besluit overeenkomstig
      [artikel 81][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel81
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 110a
        hoofdstuk: VIIIa
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '81'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '81'
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '2'
  - number: '146'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel146
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '148.1'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de
      [artikelen 18.3 tot en met 18.14][ref1], [18.15, onder b][ref2], en [18.16 van de Wet milieubeheer][ref3] van
      toepassing, met dien verstande dat met het toezicht op de naleving van het bij of krachtens deze wet bepaalde ten
      aanzien van inrichtingen als bedoeld in [artikel 170, derde lid][ref4], uitsluitend belast zijn de daartoe bij
      besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel170
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref4
        bwb_id: BWBR0003227
        artikel: '170'
        hoofdstuk: XV
  - number: '148.2'
    text: |-
      Het in [artikel 18.2 van de Wet milieubeheer][ref1] bedoelde bestuursorgaan heeft tot taak zorg te dragen voor de
      bestuursrechtelijke handhaving van het ten aanzien van de betrokken inrichting bij of krachtens deze wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
  - number: '163.1'
    text: |-
      Burgemeester en wethouders van de gemeente waarin een industrieterrein geheel of in hoofdzaak is gelegen zorgen
      ervoor dat er voldoende informatie beschikbaar is over de geluidsruimte binnen de zone.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel163
  - number: '163.2'
    text: |-
      Het eerste lid is niet van toepassing op industrieterreinen van regionaal belang die zijn aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref1] of de [Wet ruimtelijke ordening][ref2]. In dat geval
      dragen gedeputeerde staten voor de in het eerste lid genoemde taken zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0020449
  - number: '163.3'
    text: |-
      Het eerste lid is niet van toepassing wanneer burgemeester en wethouders in overeenstemming met gedeputeerde staten
      besluiten dat gedeputeerde staten voor de in het eerste lid genoemde taken zorgdragen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel163
  - number: '163.4'
    text: |-
      Het eerste tot en met derde lid is niet van toepassing op industrieterreinen waarop zich inrichtingen bevinden als
      bedoeld in [artikel 170, derde lid][ref1]. Voor die industrieterreinen draagt Onze Minister voor de in het eerste
      lid genoemde taken zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel170
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '170'
        hoofdstuk: XV
  - number: '164'
    text: |-
      Ter vervulling van de in [artikel 163][ref1] bedoelde taak kan een zonebeheerplan worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel163
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '163'
        hoofdstuk: XIV
  - number: '165.1'
    text: |-
      In het belang van het verkrijgen van gegevens ten behoeve van het instellen van geluidszones rond
      industrieterreinen en ten behoeve van de bepaling van binnen die geluidszones te nemen maatregelen ter beperking
      van de geluidhinder aldaar kunnen burgemeester en wethouders, binnen een door hen aan te geven termijn gegevens
      betreffende de geluiduitstraling verlangen van beheerders van inrichtingen, welke binnen een zodanige zone werkzaam
      zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel165
  - number: '165.2'
    text: Onze Minister kan omtrent de bepaling en de vastlegging van de in het eerste lid bedoelde gegevens regels stellen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel165
  - number: '165.3'
    text: |-
      Het eerste lid is niet van toepassing op industrieterreinen van regionaal belang die zijn aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref1] of de [Wet ruimtelijke ordening][ref2]. In dat geval
      hebben gedeputeerde staten de in het eerste lid genoemde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0020449
  - number: '165.4'
    text: |-
      Het eerste lid is niet van toepassing wanneer burgemeester en wethouders in overeenstemming met gedeputeerde staten
      besluiten dat gedeputeerde staten voor de [artikel 163, eerste lid][ref1], genoemde taken zorgdragen. In dat geval
      hebben gedeputeerde staten de in het eerste lid genoemde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel163
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '163'
        hoofdstuk: XIV
  - number: '165.5'
    text: |-
      Het eerste lid is niet van toepassing op industrieterreinen waarop zich inrichtingen bevinden als bedoeld in
      [artikel 170, derde lid][ref1]. In dat geval heeft Onze Minister de in het eerste lid genoemde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel170
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '170'
        hoofdstuk: XV
  - number: '166.1'
    text: |-
      In het belang van het verkrijgen van gegevens ten behoeve van het instellen van geluidszones en ten behoeve van de
      bepaling van binnen geluidszones te nemen maatregelen ter beperking van de geluidhinder aldaar kan Onze Minister,
      voor zover het betreft een geluidszone als bedoeld in [hoofdstuk VIII][ref1] of een geluidszone als bedoeld in
      [artikel 25a van de Luchtvaartwet][ref2] dan wel een gebied waarvoor met het oog op de geluidsbelasting toepassing
      is gegeven aan [artikel 8.5, derde lid, van de Wet luchtvaart][ref3], binnen een door hem aan te geven termijn
      gegevens betreffende de geluiduitstraling verlangen van beheerders van inrichtingen, welke binnen een zodanige zone
      werkzaam zijn of zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0003227
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002267
        artikel: 25a
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
  - number: '166.2'
    text: Onze Minister kan omtrent de bepaling en de vastlegging van de in het eerste lid bedoelde gegevens regels stellen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel166
  - number: '170.1'
    text: |-
      Wij kunnen in het belang van de landsverdediging van de bij of krachtens [artikel 2][ref1] of [10][ref2] gestelde
      verboden en verplichtingen:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel10
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 170.1.a
    text: bij algemene maatregel van bestuur vrijstelling verlenen;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
  - number: 170.1.b
    text: op daartoe strekkend verzoek ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
  - number: '170.2'
    text: |-
      Aan een vrijstelling of ontheffing worden de voorschriften verbonden, die naar Ons oordeel in het belang van het
      voorkomen of beperken van geluidhinder nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
  - number: '170.3'
    text: |-
      In afwijking van het bepaalde in [artikel 62, tweede lid][ref1], stelt Onze Minister het programma van aktiviteiten
      als omschreven in dat artikellid op, voor zover het programma betrekking heeft op inrichtingen, die in gebruik of
      mede in gebruik zijn ten behoeve van de landsverdediging. Onze Minister stelt het programma op na overleg met Onze
      Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '62'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '2'
  - number: '170.4'
    text: |-
      Bij de vaststelling van het programma deelt Onze Minister aan burgemeester en wethouders van de gemeente, waarin
      de in het derde lid bedoelde inrichting is gelegen, en aan gedeputeerde staten mede de geluidsbelasting vanwege die
      inrichting na de volledige uitvoering van het programma.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
  - number: '170.5'
    text: |-
      Onze Minister van Defensie is ermee belast dat het programma, bedoeld in [artikel 62][ref1], ten aanzien van
      inrichtingen als bedoeld in het derde lid, wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel62
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '62'
        hoofdstuk: V
        paragraaf: '5'
        afdeling: '2'
  - number: '173.1'
    text: |-
      Met het toezicht op de uitvoering en de handhaving van het bij of krachtens deze wet bepaalde zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel173
  - number: '173.2'
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20 van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '173.3'
    text: |-
      Onze Minister kan bij ministeriële regeling bepalen dat bestuursorganen die met de uitvoering of de handhaving
      van het bij of krachtens deze wet bepaalde zijn belast, daarbij aan te geven gegevens verstrekken aan de krachtens
      het eerste lid aangewezen ambtenaren. Bij de regeling kunnen regels worden gesteld met betrekking tot het tijdstip
      waarop, de frequentie waarmee en de vorm waarin de gegevens worden verstrekt. Tevens kan bij de regeling worden
      bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven gevallen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel173
  - number: '174'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel174
  - number: '175'
    text: |-
      Een gedraging in strijd met een voorschrift, krachtens [artikel 5, derde lid][ref1], aan een vergunning verbonden,
      is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel5
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel175
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '176'
    text: |-
      Alle - anders dan met toepassing van de [Wet milieubeheer][ref1] of de [Algemene wet bestuursrecht][ref2] -
      krachtens de onderhavige wet ter inzage te leggen, te publiceren of aan belanghebbenden toe te zenden stukken, die
      in een vreemde taal zijn gesteld en waarbij niet een vertaling in de Nederlandse taal wordt gevoegd, of die wegens
      hun omvang, hun inhoud dan wel om andere redenen niet geacht kunnen worden voor de beoordeling ervan voldoende
      inzicht te geven aan een algemeen publiek, gaan vergezeld van een in de Nederlandse taal gestelde samenvatting.
      Onze Minister kan nadere regels geven over de wijze waarop deze samenvatting dient te worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0005537
  - number: '180'
    text: |-
      De bevoegdheid van gemeenten en van waterschappen tot het maken van verordeningen blijft ten aanzien van het
      onderwerp waarin deze wet voorziet, gehandhaafd voorzover deze verordeningen niet met het bij of krachtens deze wet
      bepaalde in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel180
  - number: '182.1'
    text: |-
      Bij algemene maatregel van bestuur wordt voor de gevallen waarin een algemene maatregel van bestuur waarbij
      categorieën van inrichtingen die in belangrijke mate geluidhinder kunnen veroorzaken worden aangewezen in werking
      treedt, ten aanzien van daarbij aangewezen categorieën van inrichtingen bepaald binnen welke termijn en volgens
      welke normstelling en procedures moet worden voorzien in de vaststelling van een zone rond terreinen met een
      bestemming die de mogelijkheid insluit van vestiging van inrichtingen die tot die categorieën behoren.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel182
  - number: '182.2'
    text: |-
      Het in het eerste lid bepaalde geldt niet met betrekking tot terreinen waaromheen op het tijdstip van het in
      werking treden van de wijziging reeds een zone is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel182
  - number: '184'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie, worden voorzover
      nodig bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die de in deze wet
      vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij de uitvoering dienen te worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel184
  - number: '185'
    text: 'Deze wet kan worden aangehaald als: Wet geluidhinder.'
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel185
  - number: '186'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel186
