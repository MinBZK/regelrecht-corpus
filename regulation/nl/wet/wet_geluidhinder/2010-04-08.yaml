  - number: 65.a
    text: |-
      op een of meer plaatsen binnen de zone of op de zonegrens de geluidsbelasting gelijk is aan de ten hoogste
      toegestane geluidsbelasting;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel65
  - number: 65.b
    text: |-
      voorzover van toepassing, de beschikbaarheid van grond voor de vestiging of wijziging van een inrichting, dit
      mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel65
  - number: 65.c
    text: |-
      de geluidsbelasting in belangrijke mate wordt bepaald door inrichtingen waartoe
      [artikel 8.40 van de Wet milieubeheer][ref1] is toegepast, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 65.d
    text: |-
      redelijkerwijs kan worden aangenomen dat de geluidsbelasting binnen een afzienbare termijn teruggebracht zal worden
      op het niveau van de eerder geldende waarden.
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel65
  - number: '66'
    text: |-
      Onverminderd [artikel 65][ref1] kan het bevoegd gezag bij de toepassing van
      [artikel 8.8, derde lid, van de Wet milieubeheer][ref2] besluiten tot afwijking van de [artikelen 40][ref3],
      [44 tot en met 47][ref4], [50][ref5], [51][ref6], [53 tot en met 56][ref7], [59 tot en met 61][ref8],
      [63, tweede lid][ref9], of [64][ref10]. De [artikelen 2][ref11], [4, eerste lid, onder c, en derde lid][ref12],
      [5 tot en met 8][ref13] en [11 tot en met 19 van de Interimwet stad-en-milieubenadering][ref14] zijn van
      overeenkomstige toepassing.


