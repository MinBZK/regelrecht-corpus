  - number: 111a.10
    text: |-
      Ingeval voor de betrokken woningen of andere geluidsgevoelige gebouwen eerder een hogere waarde voor de
      geluidsbelasting is vastgesteld, treffen burgemeester en wethouders met betrekking tot de geluidwering van die
      gevels in afwijking van het eerste, derde, vijfde, zevende en negende lid, maatregelen om te bevorderen dat de
      geluidsbelasting, binnen de woning bij gesloten ramen na de aanpassing ten hoogste de waarde die voor de aanpassing
      van de weg ingevolge het bij of krachtens deze wet voor de onderscheiden situaties bepaalde, dan wel ingevolge het
      krachtens [artikel 3 van de Woningwet][ref1] bepaalde ten hoogste toelaatbaar was, bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel111a
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
  - number: '112'
    text: |-
      Indien met betrekking tot aanwezige of in aanbouw zijnde woningen toepassing is gegeven aan [artikel 100a][ref1]
      treffen burgemeester en wethouders met betrekking tot de geluidwering van de gevels van de betrokken woningen
      maatregelen om te bevorderen dat de geluidsbelasting, vanwege de weg, binnen de woning bij gesloten ramen na de
      reconstructie ten hoogste bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 100a
        hoofdstuk: VI
        paragraaf: '2'
        afdeling: '4'
  - number: 112.a
    text: |-
      ingeval voor de betrokken woningen bij de reconstructie voor de eerste maal een hogere waarde dan 48 dB, voor de
      geluidsbelasting van de gevel, vanwege de weg, is vastgesteld: 33 dB;
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel112
  - number: 112.b
    text: |-
      ingeval voor de betrokken woningen eerder een hogere waarde voor de geluidsbelasting is vastgesteld: de waarde die
      voor de reconstructie ingevolge het bij of krachtens deze wet voor de onderscheiden situaties bepaalde, dan wel
      ingevolge het krachtens [artikel 3 van de Woningwet][ref1] bepaalde ten hoogste toelaatbaar was.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel3
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '3'
  - number: '113'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor daarbij aan te wijzen andere geluidsgevoelige gebouwen met
      betrekking tot de in de [artikelen 111][ref1] en [112][ref2] geregelde onderwerpen overeenkomstige regels worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel111
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel112
    url: https://wetten.overheid.nl/BWBR0003227/2010-04-08#Artikel113
    references:
