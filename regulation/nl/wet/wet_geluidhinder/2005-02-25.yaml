  - number: '167'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald dat in het belang van het verkrijgen van een goed
      overzicht van de over het gehele land voorkomende geluidsbelastingen door bij de maatregel aangewezen
      besturen van provincies, gemeenten, andere openbare lichamen of gemeenschappelijke organen als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] op een bij de maatregel aan te geven wijze de
      geluidsbelastingen binnen het onder het gezag van genoemde besturen ressorterende gebied worden vastgesteld.

      2 Onze Minister kan omtrent de bepaling en de vastlegging van de geluidsbelastingen regels stellen.

      3 Ambtenaren die op grond van de hun bij of krachtens de [Wet milieubeheer][ref2] of de [Luchtvaartwet][ref3]
      toegekende bevoegdheden beschikken over gegevens die voor de vaststelling van de heersende geluidsbelastingen
      van belang zijn, zijn gehouden deze gegevens aan de krachtens het eerste lid aangewezen besturen op hun verzoek
      te verstrekken.

      4 Indien aan het eerste lid toepassing is gegeven, draagt Onze Minister zorg voor openbare bekendmaking van de
      vastgestelde geluidsbelastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0002267
