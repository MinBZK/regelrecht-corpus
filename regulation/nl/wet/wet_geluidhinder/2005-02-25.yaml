  - number: '110'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in [artikel 108, eerste lid][ref1], worden in het belang
      van het voorkomen of beperken van geluidhinder in en buiten de zone omtrent de onderwerpen die ter beperking van
      de geluidsbelasting vanwege industrieterreinen, vanwege wegen of vanwege spoor-, tram- en metrowegen geregeld
      zijn in de [hoofdstukken V][ref2], [VI][ref3] of [VII][ref4], regels gesteld. Daarbij kunnen bepalingen van die
      hoofdstukken van overeenkomstige toepassing worden verklaard.

      2 Bij een maatregel als bedoeld in [artikel 108, eerste lid][ref5], kan tevens worden bepaald dat de
      [hoofdstukken V][ref6], [VI][ref7] en [VII][ref8] geheel of ten dele niet van toepassing zijn met betrekking tot
      het bij de maatregel aangewezen gebied.


