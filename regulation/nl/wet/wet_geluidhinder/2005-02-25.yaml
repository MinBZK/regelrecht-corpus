        afdeling: '1'
  - number: '67'
    text: |-
      1 Bij wijziging van een zone, bij vaststelling of herziening van een bestemmingsplan voor gronden die krachtens
      die vaststelling of herziening deel blijven uitmaken van een zone, kan in bij algemene maatregel van bestuur aan
      te geven gevallen met betrekking tot de woningen in dat gebied, voor de ten hoogste toelaatbare geluidsbelasting
      waarvan reeds een waarde ingevolge [artikel 65][ref1], [66][ref2] of [72, tweede lid][ref3], gold, deze waarde met
      ten hoogste 5 dB(A) worden verhoogd, met dien verstande dat:

      a. degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met de
      verhoging financiële middelen ter beschikking stelt ten behoeve van de toepassing van maatregelen als bedoeld in
      [artikel 71, tweede lid][ref4], met betrekking tot woningen die door de wijziging van de zone of herziening van het
      bestemmingsplan een hogere geluidsbelasting ondervinden, en

      b. de waarde wat ten tijde van de eerste zonevaststelling geprojecteerde woningen betreft 55 dB(A) en wat ten tijde
      van de eerste zonevaststelling aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.

      2 In geval van wijziging van een zone krachtens [artikel 61][ref5] zijn met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting, vanwege het industrieterrein, van de gevel van op het tijdstip van de wijziging van
      de zone aanwezige, in aanbouw zijnde of geprojecteerde woningen binnen het gebied dat door de wijziging van de zone
      gaat deel uitmaken, de [artikelen 46][ref6], [47][ref7], [48][ref8] en [51][ref9] van overeenkomstige toepassing.

      3 Met betrekking tot de ten hoogste toelaatbare geluidsbelasting, vanwege een industrieterrein, van de gevel
      van binnen de zone nieuw te bouwen woningen, die niet behoren tot de geprojecteerde woningen als bedoeld in het
      tweede lid of in [artikel 65][ref10], zijn de [artikelen 46][ref11], [47][ref12], [48][ref13] en [51][ref14] van
      overeenkomstige toepassing.

      4 Bij toepassing van het derde lid met betrekking tot nieuw te bouwen woningen in een gebied gelegen binnen een
      zone van een industrieterrein met activiteiten die zeehavengebonden zijn en die noodzakelijkerwijs in de open
      lucht plaatsvinden, kan voor woningen waarvan de geluidsbelasting in hoofdzaak wordt bepaald door die activiteiten,
      een waarde worden vastgesteld tot ten hoogste 60 dB(A), indien deze woningen worden gebouwd in het kader van een
      herstrukturering of planmatige verdichting van bestaande woongebieden.

      5 Bij toepassing van het derde lid met betrekking tot nieuw te bouwen woningen, die dienen ter vervanging van
      bestaande woningen of van gebouwen waarvoor toepassing is gegeven aan [artikel 68, eerste lid][ref15], kan een
      waarde worden vastgesteld tot ten hoogste 65 dB(A), met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.


