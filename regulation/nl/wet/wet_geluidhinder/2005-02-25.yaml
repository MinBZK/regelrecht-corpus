  - number: '89'
    text: |-
      1 Burgemeester en wethouders stellen met inachtneming van de regels, gegeven krachtens het tweede lid, een
      programma vast van maatregelen die naar hun oordeel in aanmerking komen om de geluidsbelasting, vanwege de weg, van
      de gevels van de in [artikel 88][ref1] bedoelde woningen zoveel mogelijk te beperken tot 55 dB(A) en om zo nodig te
      voldoen aan [artikel 111, tweede of derde lid][ref2].

      2 Met betrekking tot gevallen, bedoeld in [artikel 88][ref3], worden bij algemene maatregel van bestuur regels
      gegeven omtrent het tijdstip van melding van die gevallen, de aard van de maatregelen die in aanmerking komen, en
      de omstandigheden waaronder dit het geval is, alsmede omtrent de opzet en het tijdstip van vaststelling van een
      programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel88
