  - number: 87d
    text: |-
      1 Bij het voorbereiden van de aanleg van een hoofdweg wordt vanwege Onze Ministers een akoestisch onderzoek
      ingesteld naar:

      a. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen
      of spoorwegen zou worden ondervonden zonder de invloed van maatregelen die de geluidsoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen, om te voorkomen dat de in de toekomst binnen
      de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg aan te leggen wegen
      of spoorwegen optredende geluidsbelasting van de onder a bedoelde objecten, de waarden die ingevolge de
      [artikelen 87e tot en met 87i][ref1] als de ten hoogste toelaatbare worden aangemerkt, te boven gaan.

      2 Bij het voorbereiden van een wijziging of verbreding van een hoofdweg wordt vanwege Onze Ministers een akoestisch
      onderzoek als bedoeld in het eerste lid ingesteld. Dit onderzoek geeft tevens inzicht in:

      a. de voor de wijziging of verbreding ter plaatse heersende geluidsbelasting die door woningen, door andere
      geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen de zone van de hoofdweg vanwege de hoofdweg of
      vanwege binnen het tracé van die hoofdweg gelegen wegen of spoorwegen wordt ondervonden;

      b. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de hoofdweg vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen werd
      ondervonden op 1 maart 1986;

      c. geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen binnen
      de zone van de hoofdweg vanwege binnen het tracé van die hoofdweg gelegen spoorwegen werd ondervonden op 1 juli
      1987.

      3 Indien redelijkerwijs kan worden aangenomen dat de wijziging of verbreding van een hoofdweg zal leiden tot een
      aanpassing van andere wegen dan de te wijzigen of te verbreden hoofdweg of tot aanpassing van de niet te wijzigen
      of te verbreden gedeelten van de hoofdweg, heeft het in het eerste lid bedoelde onderzoek tevens betrekking op die
      andere wegen of de niet te wijzigen of te verbreden gedeelten van de betrokken hoofdweg.

      4 De in het eerste lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een te wijzigen of te verbreden hoofdweg, vanwege binnen het tracé van die hoofdweg aan te leggen wegen
      en spoorwegen.

      5 De in het tweede lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een aan te leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen en spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel87e
