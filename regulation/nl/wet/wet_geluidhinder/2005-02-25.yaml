        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5'
    text: |-
      1 Indien toepassing wordt gegeven aan [artikel 2, tweede lid, onder ][ref1], zijn
      de [paragrafen 3.5.2 tot en met 3.5.5 van de Algemene wet bestuursrecht][ref2] en
      [afdeling 13.2 van de Wet milieubeheer][ref3] van toepassing met betrekking tot de totstandkoming van de
      beschikking op de aanvraag om een vergunning. [Artikel 8.7 van de Wet milieubeheer][ref4] is van overeenkomstige
      toepassing.

      2 De vergunning kan slechts in het belang van het voorkomen of beperken van geluidhinder worden geweigerd.

      3 Aan een vergunning kunnen in het belang van het voorkomen of beperken van geluidhinder voorschriften worden
      verbonden. De voorschriften kunnen voor zover bij de maatregel niet anders is bepaald, de verplichting inhouden
      te voldoen aan door bestuursorganen die bij het voorschrift zijn aangewezen, in het belang van het voorkomen
      of beperken van geluidhinder gestelde nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip
      bepaald, waarop ten aanzien van die eis de verplichting ingaat.

      4 Voor zover zulks bij algemene maatregel van bestuur is bepaald, kan de vergunning worden gewijzigd en
      ingetrokken.

      5 Intrekking kan slechts geschieden:

      a. indien de vergunning niet wordt nageleefd, of

      b. indien het toestel ontoelaatbare geluidhinder veroorzaakt en wijziging of aanvulling van de aan de vergunning
      verbonden voorschriften redelijkerwijs geen oplossing kan bieden.

      6 Met betrekking tot een wijziging van een vergunning of intrekking van een vergunning op de grond,
      bedoeld in het vijfde lid, onder *b,* zijn [paragraaf 3.5.6 van de Algemene wet bestuursrecht][ref5] en
      [afdeling 13.2 van de Wet milieubeheer][ref6] van toepassing. [Artikel 8.7 van de Wet milieubeheer][ref7] is van
      overeenkomstige toepassing.


