  - number: '160'
    text: |-
      Alvorens wordt besloten tot instelling van regionaal werkende onderdelen van de geluidhinderdienst, stellen
      gedeputeerde staten de inspecteur in de gelegenheid terzake zijn zienswijze bekend te maken.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel160
  - number: '161'
    text: |-
      Indien de geluidhinderdienst uit regionaal werkende onderdelen is samengesteld, kunnen provinciale staten,
      op verzoek van één of meer gemeenten of van een openbaar lichaam of gemeenschappelijk orgaan als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] (*Stb.* 1984, 667), tevens bepalen - onder regeling
      van een geldelijke tegemoetkoming - dat de taken waarmee het provinciaal bestuur krachtens [artikel 158][ref2] is
      belast, in dat gebied zullen worden vervuld door het bestuur van de betrokken gemeenten tezamen of door het bestuur
      van het betrokken ander openbaar lichaam of gemeenschappelijk orgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel158
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel161
