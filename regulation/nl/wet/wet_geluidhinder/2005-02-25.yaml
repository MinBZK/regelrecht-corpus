  - number: '122'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten stellen vóór 18 mei 2008 aan
      de hand van de geluidsbelastingkaarten, bedoeld in [artikel 118][ref1], een actieplan vast met betrekking tot de
      krachtens [artikel 117][ref2] gepubliceerde delen van rijkswegen en hoofdspoorwegen, onderscheidenlijk provinciale
      wegen. Indien er sprake is van een belangrijke ontwikkeling die van invloed is op de geluidhindersituatie,
      en daarnaast ten minste elke vijf jaar na de vaststelling wordt het actieplan opnieuw overwogen, en zo nodig
      aangepast.

      2 Het eerste lid is van overeenkomstige toepassing op burgemeester en wethouders van gemeenten die behoren tot
      krachtens [artikel 117a][ref3] aangewezen agglomeraties, met dien verstande dat het actieplan betrekking heeft op
      de in [artikel 118, tweede lid][ref4], bedoelde geluidsbronnen.

      3 Een actieplan bevat ten minste een beschrijving van:

      a. het te voeren beleid om de geluidsbelasting L en de geluidsbelasting L te beperken, en

      b. de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om overschrijding van overeenkomstig
      algemene maatregel van bestuur vast te stellen waarden van de geluidsbelasting L of de geluidsbelasting L te
      voorkomen of ongedaan te maken en de te verwachten effecten van die maatregelen.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inhoud, vormgeving en
      inrichting van actieplannen. Deze regels kunnen verschillen voor rijkswegen, provinciale wegen, hoofdspoorwegen
      en agglomeraties.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel117
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel117a
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel118
