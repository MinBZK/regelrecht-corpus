  - number: '3'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] kan, behoudens in geval van toepassing van
      [artikel 2, tweede lid, onder ][ref2], tevens de verplichting inhouden te voldoen aan door bestuursorganen die bij
      de maatregel zijn aangewezen, omtrent onderwerpen die in de maatregel zijn geregeld, aan de betrokkene gestelde
      nadere eisen. Bij het stellen van zodanige eis wordt tevens het tijdstip bepaald waarop ten aanzien van die eis de
      verplichting ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel3
