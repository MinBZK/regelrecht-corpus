  - number: 118a
    text: |-
      1 Ten behoeve van de vaststelling van een geluidsbelastingkaart als bedoeld in [artikel 118, eerste lid][ref1],
      verschaffen burgemeester en wethouders aan Onze Minister van Verkeer en Waterstaat en gedeputeerde staten op hun
      verzoek, alle inlichtingen en gegevens waarover zij kunnen beschikken, voor zover die voor het opstellen van die
      kaart noodzakelijk zijn.

      2 Ten behoeve van de vaststelling van een geluidsbelastingkaart als bedoeld in [artikel 118, tweede lid][ref2],
      verschaffen Onze Minister, Onze Minister van Verkeer en Waterstaat, gedeputeerde staten en burgemeester
      en wethouders aan betrokken burgemeester en wethouders op hun verzoek, alle inlichtingen en gegevens
      waarover zij kunnen beschikken, voor zover die voor het opstellen van die kaart noodzakelijk zijn.
      Op een dergelijk verzoek verschaft Onze Minister van Defensie de contourenkaarten, bedoeld in
      [artikel 30c, tweede lid, van de Luchtvaartwet][ref3].

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake de te verschaffen
      inlichtingen en gegevens, waaronder de wijze waarop en de termijn waarbinnen of de datum waarvoor deze verschaft
      worden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel30c
