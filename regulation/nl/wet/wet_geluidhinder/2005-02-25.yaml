  - number: 87f
    text: |-
      1 Behoudens het tweede en derde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden hoofdweg
      ten gevolge waarvan de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen worden aangepast, ten hoogste
      toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen
      wegen, indien:

      a. de geluidsbelasting vanwege deze hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen op 1 maart
      1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van deze hoofdweg of
      wegen lager was dan of gelijk was aan 55 dB(A), of

      b. deze hoofdweg na 1 januari 1982 is aangelegd op grond van een overeenkomstig de
      [artikelen 76 tot en met 78][ref1] vastgesteld of herzien bestemmingsplan, of

      c. binnen het tracé van die hoofdweg gelegen wegen na 1 januari 1982 zijn aangelegd op grond van een overeenkomstig
      de [artikelen 76][ref2] en [77][ref3] vastgesteld of herzien bestemmingsplan,

      de voor de wijziging of verbreding ter plaatse heersende geluidsbelasting, met dien verstande dat een
      geluidsbelasting waarvan de waarde 50 dB(A) niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft.

      2 In geval eerder met toepassing van deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege de betrokken weg of wegen is vastgesteld dan 50 dB(A), is de voor woningen binnen de zone van een te
      wijzigen of te verbreden hoofdweg ten gevolge waarvan de hoofdweg of binnen het tracé van die hoofdweg gelegen
      wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege
      binnen het tracé van die hoofdweg gelegen wegen, de laagste van de volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste of tweede lid bedoelde waarde vaststellen, met dien
      verstande dat de verhoging 5 dB(A) en met betrekking tot woningen in buitenstedelijk gebied de waarde 60 dB(A),
      onderscheidenlijk met betrekking tot woningen in stedelijk gebied de waarde 65 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen slechts toepassing geven aan het derde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, tot de ingevolge het eerste
      of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      5 De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen.

      6 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het derde
      lid in plaats van «met betrekking tot woningen in buitenstedelijk gebied de waarde 60 dB(A), onderscheidenlijk
      met betrekking tot woningen in stedelijk gebied de waarde 65 dB(A)» wordt gelezen: voor zover het andere
      geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1°, 2°, 3° en 4°][ref4],
      betreft met betrekking tot deze andere geluidsgevoelige gebouwen in buitenstedelijk gebied de waarde 60
      dB(A), onderscheidenlijk met betrekking tot deze andere geluidsgevoelige gebouwen in stedelijk gebied
      de waarde 65 dB(A), onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 87b, eerste lid, onder e, 5°][ref5], de waarde 55 dB(A).

      7 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:

      a. in het eerste en tweede lid in plaats van «50 dB(A)» telkens wordt gelezen «indien het woonwagenstandplaatsen
      betreft 50 dB(A) en in de overige gevallen 55 dB(A)» en

      b. in het derde lid in plaats van «de verhoging 5 dB(A) en met betrekking tot woningen in buitenstedelijk gebied
      de waarde 60 dB(A), onderscheidenlijk met betrekking tot woningen in stedelijk gebied de waarde 65 dB(A)» wordt
      gelezen: deze waarde indien het woonwagenstandplaatsen betreft 55 dB(A) en in de overige gevallen 60 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
