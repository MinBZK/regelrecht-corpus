  - number: '49'
    text: |-
      Bij algemene maatregel van bestuur kunnen waarden worden vastgesteld voor de ten hoogste toelaatbare
      geluidsbelasting, vanwege het industrieterrein, van de gevel van andere gebouwen dan woningen alsmede van andere
      geluidsgevoelige objecten binnen een zone.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel49
  - number: '50'
    text: |-
      1 Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te
      stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen en - ingeval de zone door hen
      wordt vastgesteld - uit eigen beweging, voor de ter plaatste ten hoogste toelaatbare geluidsbelasting als bedoeld
      in [artikel 49][ref1] hogere dan de krachtens dat artikel bepaalde waarden vaststellen, met dien verstande dat deze
      waarden bij algemene maatregel van bestuur te stellen grenzen niet te boven mogen gaan.

      2 [Artikel 47, tweede tot en met vierde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel50
