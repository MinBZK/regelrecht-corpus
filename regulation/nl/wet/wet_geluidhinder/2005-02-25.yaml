  - number: '68'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen waarden worden vastgesteld voor de ten hoogste toelaatbare
      geluidsbelasting, vanwege een industrieterrein, van de gevel van andere gebouwen dan woningen, alsmede van andere
      geluidsgevoelige objecten binnen de zone.

      2 Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te
      stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen, en - ingeval de zone door hen
      wordt vastgesteld - uit eigen beweging, voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld
      in het eerste lid hogere dan de krachtens dat lid bepaalde waarden vaststellen, met dien verstande dat deze waarden
      bij algemene maatregel van bestuur te stellen grenzen niet te boven mogen gaan.

      3 Met betrekking tot gebouwen en andere objecten ten aanzien waarvan toepassing is gegeven aan het eerste
      lid, worden bij algemene maatregel van bestuur omtrent de onderwerpen die met betrekking tot woningen geregeld
      zijn in de [artikelen 71][ref1] en [72][ref2] regels gesteld. Daarbij kunnen bepalingen van die artikelen van
      overeenkomstige toepassing worden verklaard.

      4 [Artikel 48][ref3] is van overeenkomstige toepassing. Bij toepassing van het tweede lid zijn voorts de
      [artikelen 47, tweede tot en met vierde lid][ref4], en [51][ref5] van overeenkomstige toepassing.

      5 Bij toepassing van het tweede lid kan worden bepaald, dat met betrekking tot bij de maatregel aangeduide gebouwen
      en andere objecten, het derde lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel51
