  - number: 76a
    text: |-
      1 Bij het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1] dat geheel of gedeeltelijk betrekking heeft op gronden,
      behorende tot een zone als bedoeld in [artikel 74][ref2], worden ter zake van de geluidsbelasting, vanwege de weg
      waarlangs die zone ligt, van de gevel van woningen, van andere gebouwen dan woningen of van andere geluidsgevoelige
      objecten binnen die zone de waarden in acht genomen, die ingevolge de [artikelen 82][ref3], [82][ref4], [83][ref5],
      [85][ref6], [100][ref7] en [100][ref8] als de ten hoogste toelaatbare worden aangemerkt.

      2 Gedeputeerde staten nemen bij hun beslissing over het verlenen van een verklaring van geen bezwaar ten behoeve
      van het nemen van een besluit als bedoeld in het eerste lid, het bepaalde in dat lid in acht.


