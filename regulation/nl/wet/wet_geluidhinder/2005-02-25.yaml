        afdeling: '1'
  - number: '76'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      behorende tot een zone als bedoeld in [artikel 74][ref1], worden ter zake van de geluidsbelasting, vanwege de weg
      waarlangs die zone ligt, van de gevel van woningen, van andere gebouwen dan woningen en van andere geluidsgevoelige
      objecten binnen die zone de waarden in acht genomen, die ingevolge [artikel 82][ref2] en [100][ref3] als de ten
      hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan als in dat lid
      bedoeld hogere waarden in acht genomen, voor zover:

      a. gedeputeerde staten met toepassing van [artikel 82a ][ref4], [83][ref5], [85][ref6] of [100a ][ref7] voor de
      vaststelling of herziening van het bestemmingsplan zodanige waarden hebben vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met
      toepassing van [artikel 82a][ref8], [83][ref9], [85][ref10] of [100a][ref11], zullen worden vastgesteld.

      3 Gedeputeerde staten nemen bij hun beslissing over de goedkeuring van een bestemmingsplan of de herziening hiervan
      dat geheel of gedeeltelijk betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref12],
      ter zake van de geluidsbelasting, vanwege de weg waarlangs die zone ligt, van de gevel van woningen, van andere
      gebouwen dan woningen of van andere geluidsgevoelige objecten binnen de zone de waarden in acht, die ingevolge de
      [artikelen 82][ref13], [82a][ref14], [83][ref15], [85][ref16], [100][ref17] en [100a][ref18] als de ten hoogste
      toelaatbare worden aangemerkt.

      4 Indien op het tijdstip van de vaststelling of herziening van een bestemmingsplan een weg reeds aanwezig of in
      aanleg is, gelden het eerste, tweede en derde lid niet met betrekking tot de daarbij in het plan of in de zone van
      de betreffende weg opgenomen bebouwing en andere geluidsgevoelige objecten, die op dat tijdstip reeds aanwezig of
      in aanbouw zijn.

      5 Voorschriften als bedoeld in [artikel 36 van de Wet op de Ruimtelijke Ordening][ref19] kunnen mede worden gegeven
      met het oog op de inachtneming van de ingevolge de [artikelen 82][ref20], [82a][ref21], [83][ref22], [85][ref23],
      [100][ref24] en [100a][ref25] geldende waarden.


