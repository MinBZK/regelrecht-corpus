preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het belang van de bescherming van het milieu en van de
    volksgezondheid noodzakelijk is regels te stellen inzake het voorkomen of beperken van geluidhinder;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      geluid: met het menselijk oor waarneembare luchttrillingen;

      geluidhinder: gevaar, schade of hinder, als gevolg van geluid;

      trillingen: niet met het menselijk oor waarneembare lucht- en contacttrillingen;

      trillinghinder: gevaar, schade of hinder, als gevolg van trillingen;

      geluidsapparaat: een apparaat, bestemd of mede bestemd voor het voortbrengen van geluid;

      toestel:

      a. een geluidsapparaat;

      b. een toestel dat bij gebruik anders dan door menselijke energie geluidhinder kan veroorzaken, een luchtvaartuig
      daaronder niet begrepen;

      motorvoertuig: een motorvoertuig in de zin van het [Reglement verkeersregels en verkeerstekens 1990][ref1];

      bromfiets: een bromfiets in de zin van het [Reglement verkeersregels en verkeerstekens 1990][ref2];

      woning: een gebouw dat voor bewoning gebruikt wordt of daartoe bestemd is;

      NEN: door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;

      gevel: de bouwkundige constructie die een ruimte in een woning of gebouw scheidt van de buitenlucht, daaronder
      begrepen het dak, met uitzondering van een constructie zonder te openen delen en met een in NEN 5077 bedoelde
      karakteristieke geluidwering die ten minste gelijk is aan het verschil tussen de geluidsbelasting van die
      constructie en 35 dB(A);

      bouwvergunning: een bouwvergunning in de zin van de [Woningwet][ref3];

      geprojecteerde woning of gebouw: een nog niet aanwezige woning of nog niet aanwezig gebouw, waarvoor het geldende
      bestemmingsplan verlening van de bouwvergunning toelaat, maar deze nog niet is afgegeven;

      woning of gebouw in aanbouw: een nog niet aanwezige woning of nog niet aanwezig gebouw, waarvoor de bouwvergunning
      is afgegeven;

      geluidsniveau in dB(A): het gemeten of berekende geluidsniveau, uitgedrukt in dB(A) overeenkomstig de door de
      Internationale Electrotechnische Commissie terzake opgestelde regels;

      equivalent geluidsniveau in dB(A): het gemiddelde - te bepalen op een door Onze Minister krachtens toepassing van
      [artikel 73, eerste lid][ref4], of [102, eerste lid][ref5], aangegeven wijze - van de afwisselende niveaus van
      het ter plaatse in de loop van een bepaalde periode optredende geluid, vastgesteld volgens de door Onze Minister
      krachtens toepassing van één van die artikelleden gestelde regels;

      industrieterrein: een terrein waaraan een bestemming is gegeven als omschreven in de [artikelen 41][ref6] en
      [53][ref7];

      geluidsniveaukaart: een kaart die met behulp van een verkeersmilieumodel is vervaardigd en waarop met betrekking
      tot de wegen, die deel uit maken van het gehele wegennet of een verkeerskundig zelfstandig gedeelte daarvan binnen
      het grondgebied van de gemeente, de geluidsbelastingen zijn weergegeven die het gevolg zijn van een uit akoestisch
      oogpunt gewenste afwikkeling van het verkeer;

      etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een industrieterrein: de hoogste van de
      volgende drie waarden:

      a. de waarde van het equivalente geluidsniveau over de periode 07.00- 19.00 uur (dag);

      b. de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00-23.00 uur (avond);

      c. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00-07.00 uur (nacht);

      geluidsbelasting vanwege een industrieterrein: de etmaalwaarde van het equivalente geluidsniveau in dB(A) op een
      bepaalde plaats, veroorzaakt door de gezamenlijke inrichtingen en toestellen aanwezig op een industrieterrein,
      daaronder niet begrepen het geluid van motorvoertuigen op de openbare weg;

      weg: een voor het openbaar rij- of ander verkeer openstaande weg of pad, met inbegrip van de daarin liggende
      bruggen of duikers;

      rijstrook: een strook van de rijbaan van een weg, welke voldoende plaats biedt aan een enkele rij rijdende
      motorvoertuigen op meer dan drie wielen, of, indien door middel van markering een bredere strook als rijstrook is
      aangegeven, die strook;

      geprojecteerde weg: een nog niet in aanleg zijnde weg, in de aanleg waarvan door een geldend bestemmingsplan wordt
      voorzien;

      weg in aanleg: een weg met de aanleg waarvan een begin van uitvoering is gemaakt;

      reconstructie van een weg: een of meer wijzigingen op of aan een aanwezige weg, ten gevolge waarvan de
      geluidsbelasting vanwege de weg met 2 dB(A) of meer wordt verhoogd;

      wegaanlegger: de opdrachtgever tot aanleg of reconstructie van een weg;

      bebouwde kom: de bebouwde kom, vastgesteld krachtens de [Wegenverkeerswet 1994][ref8];

      buitenstedelijk gebied: het gebied buiten de bebouwde kom alsmede, voor de toepassing van de
      [hoofdstukken VI][ref9] en [VII][ref10], het gebied binnen de bebouwde kom, voor zover liggend binnen de zone langs
      een autoweg of autosnelweg als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref11];

      stedelijk gebied: het gebied binnen de bebouwde kom, doch, voor de toepassing van de [hoofdstukken VI][ref12] en
      [VII][ref13], met uitzondering van het gebied binnen de bebouwde kom, voor zover liggend binnen de zone langs een
      autoweg of autosnelweg als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref14];

      etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een weg: de hoogste van de volgende
      twee waarden:

      a. de waarde van het equivalente geluidsniveau over de periode 07.00- 19.00 uur (dag);

      b. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00-07.00 uur (nacht);

      geluidsbelasting binnen een woning: de geluidsbelasting binnen de ruimten van een woning, welke op grond van door
      Onze Minister te stellen regels als geluidsgevoelig zijn aan te merken;

      geluidsvermogen: de hoeveelheid geluidsenergie die door een toestel of inrichting per tijdseenheid naar de
      omgevende lucht kan worden uitgestraald;

      Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

      inspecteur: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;

      spoorweg: spoorweg als bedoeld in [artikel 1 van de Spoorwegwet][ref15].

      2 Een opvangcentrum als bedoeld in [artikel 1, onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref16]
      is geen woning als bedoeld in deze wet.

      3 In deze wet en de daarop berustende bepalingen, met uitzondering van [hoofdstuk IX][ref17] en de daarop
      berustende bepalingen wordt verstaan onder geluidsbelasting vanwege een weg: etmaalwaarde van het equivalente
      geluidsniveau in dB(A) op een bepaalde plaats, veroorzaakt door het gezamenlijke wegverkeer op een bepaald
      weggedeelte of een combinatie van weggedeelten.

      4 In afwijking van het eerste lid wordt bij de bepaling van de etmaalwaarde, vanwege een industrieterrein of
      vanwege een weg, van de gevel van

        - basisscholen,
        - scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref18],
        - instellingen voor hoger beroepsonderwijs en
        - medische kleuterdagverblijven

      de waarde van het equivalente geluidsniveau over de periode 19.00-23.00 uur (avond) of de periode 23.00-07.00 uur
      (nacht) buiten beschouwing gelaten voor zover genoemde gebouwen in de betrokken periode niet als zodanig worden
      gebruikt.

      5 Bij algemene maatregel van bestuur kan worden bepaald dat trillingen en trillinghinder voor de toepassing van
      de daarbij aan te wijzen hoofdstukken van deze wet of van onderdelen daarvan met onderscheidenlijk geluid en
      geluidhinder worden gelijkgesteld.


