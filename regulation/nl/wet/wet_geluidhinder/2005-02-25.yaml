  - number: 106h
    text: |-
      1 Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van die landelijke
      spoorweg gelegen wegen, indien de geluidsbelasting vanwege binnen het tracé van die landelijke spoorweg gelegen
      wegen op 1 maart 1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van de
      wegen hoger was dan 55 dB(A), de waarde 50 dB(A).

      2 In geval eerder met toepassing van [artikel 90, tweede lid][ref1], een hogere waarde voor de ten hoogste
      toelaatbare geluidsbelasting, vanwege de betrokken wegen, is vastgesteld dan 50 dB(A), is de voor woningen binnen
      het tracé van een te wijzigen landelijke spoorweg ten gevolge waarvan binnen het tracé van die landelijke spoorweg
      gelegen wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege binnen het tracé van
      die landelijke spoorweg gelegen wegen, de laagste van de volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 70 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat de
      verhoging 5 dB(A) en de waarde 70 dB(A) niet te boven mag gaan.

      5 In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref2], een hogere waarde dan 70 dB(A) vaststellen.

      6 Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege binnen het tracé van de landelijke spoorweg gelegen wegen, tot de ingevolge het
      eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      7 De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen.

      8 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat in het derde en vierde lid in plaats van «de waarde 70 dB(A)» telkens wordt gelezen: met betrekking tot
      andere geluidsgevoelige gebouwen als bedoeld in [artikel 106, eerste lid, onder e, 1°, 2°, 3° en 4°][ref3],
      de waarde 70 dB(A), onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 106, eerste lid, onder e, 5°][ref4], de waarde 60 dB(A).


