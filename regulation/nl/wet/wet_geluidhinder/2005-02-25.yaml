        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder kan bij algemene maatregel van bestuur worden verboden
      een uitlaatsysteem, behorende tot een bij de maatregel aangewezen categorie, te vervaardigen, in te voeren, in
      voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren, indien de geluidwerende eigenschappen
      ervan niet voldoen aan de bij of krachtens de maatregel gestelde eisen. [Artikel 2, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '41'
    text: |-
      Indien bij de vaststelling of herziening van een bestemmingsplan aan gronden een bestemming wordt gegeven, die de
      mogelijkheid van vestiging van inrichtingen, behorende tot een bij algemene maatregel van bestuur aan te wijzen
      categorie van inrichtingen die in belangrijke mate geluidhinder kunnen veroorzaken, insluit, wordt daarbij tevens
      een rond het betrokken terrein gelegen zone vastgesteld, waarbuiten de geluidsbelasting vanwege dat terrein de
      waarde van 50 dB(A) niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel41
  - number: '42'
    text: |-
      1 Een bestemmingsplan, bij de vaststelling of herziening waarvan krachtens [artikel 41][ref1] een zone werd
      vastgesteld, kan te allen tijde een herziening ondergaan, strekkende tot wijziging van die zone.

      2 Een wijziging of opheffing van een zone kan er niet toe strekken dat enig gebied waarbinnen met inachtneming van
      de al krachtens de [Wet milieubeheer][ref2] verleende vergunningen en de daaraan verbonden voorschriften een hogere
      geluidsbelasting, vanwege het terrein, optreedt dan 50 dB(A), ophoudt van de zone deel uit te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003245
  - number: '43'
    text: |-
      Bij het voorbereiden van de vaststelling of wijziging van een zone wordt vanwege burgemeester en wethouders een
      akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen binnen de ontworpen zone alsmede door gebouwen of andere objecten binnen
      die zone, ten aanzien waarvan toepassing is gegeven aan [artikel 49][ref1], vanwege het industrieterrein, ten
      hoogste zou kunnen worden ondervonden zonder de invloed van maatregelen die de geluidoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege
      het industrieterrein optredende geluidsbelasting van de onder *a* bedoelde objecten de waarden die ingevolge de
      [artikelen 46 tot en met 50][ref2] als de ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel46
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '49'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '46'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
  - number: '45'
    text: |-
      Voorschriften als bedoeld in [artikel 36 van de Wet op de Ruimtelijke Ordening][ref1] (*Stb.* 1985, 626) kunnen
      mede worden gegeven met het oog op de inachtneming van de ingevolge § 2 geldende waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel36
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '36'
  - number: '46'
    text: |-
      Behoudens het bepaalde in [artikel 47][ref1] is de voor woningen binnen een krachtens [artikel 41][ref2]
      vastgestelde zone ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege het betrokken industrieterrein,
      50 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '47'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '47'
    text: |-
      1 Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te
      stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen en - ingeval de zone door hen
      wordt vastgesteld - uit eigen beweging, voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in
      [artikel 46][ref1] een hogere dan de in dat artikel genoemde waarde vaststellen, met dien verstande dat deze waarde
      55 dB(A) en voor wat aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten beslissen op een verzoek als bedoeld in het eerste lid binnen dertien weken na de datum van
      ontvangst van het verzoek.

      3 Indien toepassing is gegeven aan [artikel 52, tweede lid, onder ][ref2], wordt het verzoek binnen vier weken na
      de dagtekening van het raadsbesluit tot vaststelling of herziening van het bestemmingsplan bij gedeputeerde staten
      ingediend. In afwijking van het tweede lid beslissen gedeputeerde staten op een verzoek als bedoeld in de eerste
      volzin voordat zij over de goedkeuring van het bestemmingsplan of de herziening hiervan beslissen.

      4 Een verzoek wordt geacht te zijn ingewilligd, indien gedeputeerde staten:

      a. niet binnen de in het tweede lid bedoelde termijn, of

      b. ingeval toepassing wordt gegeven aan het derde lid, tweede volzin, niet uiterlijk tegelijk met het toezenden van
      de beslissing over de goedkeuring van het bestemmingsplan of de herziening hiervan,

      een besluit met betrekking tot het verzoek aan de verzoeker hebben toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel52
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel47
    references:
      - id: ref1
