  - number: '162'
    text: |-
      1 Door of vanwege burgemeester en wethouders worden de voor een goede uitvoering van de taken, door deze wet aan
      het gemeentebestuur opgedragen, noodzakelijke geluidmetingen verricht.

      2 Het eerste lid geldt niet, indien de bedoelde metingen op verzoek van het gemeentebestuur krachtens
      [artikel 158, tweede lid][ref1], door of vanwege gedeputeerde staten worden verricht.

      3 Behoudens in het geval, bedoeld in het tweede lid, draagt de gemeenteraad zorg dat een gemeentelijke meetdienst
      functioneert.

      4 De gemeenteraad stelt bij verordening regels vast betreffende de organisatie en de uitvoering van de in het
      eerste lid omschreven taak.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel158
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel162
