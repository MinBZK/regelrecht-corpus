  - number: 100a
    text: |-
      1 Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij
      te stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen, voor de ten hoogste
      toelaatbare geluidsbelasting van de gevel van woningen een hogere waarde dan de ingevolge [artikel 100][ref1]
      geldende vaststellen, met dien verstande dat:

      a. de verhoging 5 dB(A) niet te boven mag gaan, behoudens in gevallen waarin:

      1°. ten gevolge van de reconstructie de geluidsbelasting van de gevel van ten minste een gelijk aantal woningen
      elders met een ten minste gelijke waarde zal verminderen, en

      2°. de wegbeheerder heeft verklaard dat hij financiële middelen ter beschikking stelt uiterlijk voor afloop van de
      reconstructie ten behoeve van de toepassing van [artikel 90][ref2] of [artikel 111, tweede of derde lid][ref3], met
      betrekking tot woningen die door de reconstructie een hogere geluidsbelasting ondervinden, en

      b. ingeval voor de betrokken woning eerder toepassing is gegeven aan [artikel 83][ref4] of
      [artikel 84, tweede lid][ref5], zoals dat luidde voor 1 september 1991 of, indien geen toepassing is gegeven aan
      het betrokken artikel en de heersende waarde 55 dB(A) niet te boven gaat, de waarde niet hoger mag worden gesteld
      dan:

      1°. 60 dB(A) bij een reconstructie van een weg in buitenstedelijk gebied en

      2°. 65 dB(A) bij een reconstructie van een weg in stedelijk gebied.

      2 De krachtens het eerste lid te stellen hogere waarde mag niet hoger worden gesteld dan 70 dB(A).

      3 Met betrekking tot een besluit van gedeputeerde staten ingevolge het eerste lid zijn de [artikelen 86][ref6] en
      [87][ref7] van overeenkomstige toepassing.


