  - number: 99a
    text: |-
      Ten behoeve van de reconstructie van een weg met betrekking waartoe ingevolge [artikel 88][ref1] aan Onze Minister
      een melding moet worden gedaan, wordt geen toepassing gegeven aan [artikel 99][ref2], voordat Onze Minister met
      betrekking tot die weg toepassing heeft gegeven aan [artikel 90, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
