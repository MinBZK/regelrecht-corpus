  - number: '166'
    text: |-
      1 In het belang van het verkrijgen van gegevens ten behoeve van het instellen van geluidszones en ten behoeve
      van de bepaling van binnen geluidszones te nemen maatregelen ter beperking van de geluidhinder aldaar kan
      Onze Minister, voor zover het betreft een geluidszone als bedoeld in [hoofdstuk VIII][ref1] of een geluidszone
      als bedoeld in [artikel 25a van de Luchtvaartwet][ref2], en kunnen gedeputeerde staten, voor zover het
      betreft een geluidszone ingevolge [hoofdstuk V][ref3], binnen een door hen aan te geven termijn gegevens
      betreffende de geluiduitstraling verlangen van beheerders van inrichtingen die zijn aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4], alsmede van de beheerders van bij algemene maatregel van
      bestuur aan te wijzen categorieën van verplaatsbare inrichtingen en categorieën van toestellen, welke binnen een
      zodanige zone werkzaam zijn of zullen zijn.

      2 Burgemeester en wethouders kunnen gedeputeerde staten, ingeval het een geluidszone ingevolge [hoofdstuk V][ref5]
      betreft, verzoeken aan het in het eerste lid gestelde toepassing te geven.

      3 Onze Minister kan omtrent de bepaling en de vastlegging van de in het eerste lid bedoelde gegevens regels
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
      [ref5]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
