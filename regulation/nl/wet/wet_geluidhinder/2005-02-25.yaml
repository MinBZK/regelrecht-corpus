  - number: 106a
    text: |-
      Zodra dat van belang is voor de aanleg of wijziging van een landelijke spoorweg, geeft Onze Minister in
      overeenstemming met Onze Minister van Verkeer en Waterstaat na overleg met de betrokken spoorwegexploitant en de
      betrokken gemeentebesturen landelijke spoorwegen aan op een bij ministeriële regeling vast te stellen kaart.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel106a
  - number: 106b
    text: |-
      Langs een landelijke spoorweg bevindt zich een zone, waarvan de breedte, gemeten vanuit de buitenste spoorstaaf, is
      aangegeven op de in [artikel 106a][ref1] bedoelde kaart.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106a
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel106b
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 106a
        hoofdstuk: VII
        afdeling: '2'
  - number: 106c
    text: |-
      1 Bij het voorbereiden van de aanleg van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die
      landelijke spoorweg aan te leggen wegen of spoorwegen zou worden ondervonden zonder de invloed van maatregelen die
      de geluidsoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen, om te voorkomen dat de in de toekomst binnen
      de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg aan te leggen wegen of spoorwegen optredende geluidsbelasting van de onder a bedoelde objecten, de waarden
      die ingevolge de [artikelen 106d tot en met 106h][ref1] als de ten hoogste toelaatbare worden aangemerkt, te boven
      gaan.

      2 Bij het voorbereiden van een wijziging van een landelijke spoorweg wordt vanwege Onze Ministers een akoestisch
      onderzoek als bedoeld in het eerste lid ingesteld. Dit onderzoek geeft tevens inzicht in:

      a. de voor de wijziging ter plaatse heersende geluidsbelasting die door woningen, door andere geluidsgevoelige
      gebouwen of geluidsgevoelige terreinen binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of
      vanwege binnen het tracé van die landelijke spoorweg gelegen wegen of spoorwegen wordt ondervonden;

      b. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege de landelijke spoorweg of vanwege binnen het tracé van die
      landelijke spoorweg gelegen spoorwegen werd ondervonden op 1 juli 1987;

      c. de geluidsbelasting die door woningen, door andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen
      binnen de zone van de landelijke spoorweg vanwege binnen het tracé van die landelijke spoorweg gelegen wegen werd
      ondervonden op 1 maart 1986.

      3 Indien redelijkerwijs kan worden aangenomen dat de wijziging van een landelijke spoorweg zal leiden tot een
      aanpassing van wegen, heeft het in het eerste lid bedoelde onderzoek tevens betrekking op die wegen.

      4 De in het eerste lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een te wijzigen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg aan te leggen
      wegen en spoorwegen.

      5 De in het tweede lid gestelde regels zijn mede van toepassing met betrekking tot de geluidsbelasting binnen de
      zone van een aan te leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen wegen
      en spoorwegen.

      6 Onze Minister kan nadere regels stellen omtrent akoestische onderzoeken als bedoeld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106d
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel106c
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: 106d
        hoofdstuk: VII
        afdeling: '2'
  - number: 106d
    text: |-
      1 Behoudens het tweede lid is de voor woningen, binnen de zone van een aan te leggen landelijke spoorweg ten
      hoogste toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen het tracé van
      die landelijke spoorweg aan te leggen wegen of spoorwegen, 50 dB(A) vanwege deze wegen, onderscheidenlijk 57dB(A)
      vanwege deze spoorwegen.

      2 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze waarde in geval van geluidsbelasting vanwege wegen 60 dB(A), onderscheidenlijk vanwege spoorwegen 70 dB(A)
      niet te boven mag gaan.

      3 Voor zover het woningen in stedelijk gebied betreft kunnen Onze Ministers een hogere waarde dan 60 dB(A) voor
      de ten hoogste toelaatbare geluidsbelasting vanwege de in het eerste lid bedoelde wegen vaststellen, met dien
      verstande dat deze waarde 65 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen slechts toepassing geven aan het tweede of derde lid in die gevallen waarin toepassing van
      maatregelen, gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg aan te leggen wegen of
      spoorwegen, tot de ingevolge het eerste lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende
      bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      5 De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een te
      wijzigen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg aan te leggen wegen of
      spoorwegen.

      6 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat:

      a. in het eerste lid in plaats van «57 dB(A)» wordt gelezen« 55 dB(A)»;

      b. in het tweede lid in plaats van «60 dB(A)» wordt gelezen« 60 dB(A) voor zover het andere geluidsgevoelige
      gebouwen als bedoeld in [artikel 106, eerste lid, onder e, 1°, 2°, 3° en 4°][ref1], betreft, of 55 dB(A) voor
      zover het andere geluidsgevoelige gebouwen als bedoeld in [artikel 106, eerste lid, onder e, 5°][ref2], betreft»
      en

      c. in het derde lid in plaats van «woningen in stedelijk gebied» wordt gelezen: andere geluidsgevoelige gebouwen
      als bedoeld in [artikel 106, eerste lid, onder e, 1°, 2°, 3° en 4°][ref3], in stedelijk gebied.

      7 De in het eerste, tweede, vierde en vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten
      hoogste toelaatbare geluidsbelasting aan de grens van geluidsgevoelige terreinen, met dien verstande dat:

      a. in het eerste lid in plaats van «50 dB(A)» wordt gelezen« indien het woonwagenstandplaatsen betreft 50 dB(A) en
      in de overige gevallen 55 dB(A)»;

      b. in het tweede lid in plaats van «60 dB(A)» wordt gelezen« indien het woonwagenstandplaatsen betreft 55 dB(A)
      en in de overige gevallen 60 dB(A)» en in plaats van «70 dB(A)» wordt gelezen: indien het woonwagenstandplaatsen
      betreft 65 dB(A) en in de overige gevallen 68 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel106
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel106
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel106
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel106d
    references:
      - id: ref1
