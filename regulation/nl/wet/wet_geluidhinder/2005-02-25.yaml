  - number: '64'
    text: |-
      1 In de gevallen waarin blijkens het onderzoek, bedoeld in [artikel 62][ref1], het gebied rond een
      terrein als bedoeld in [artikel 53, eerste lid][ref2], waarbinnen met inachtneming van de al krachtens de
      [Wet milieubeheer][ref3] verleende vergunningen en de daaraan verbonden voorschriften een hogere geluidsbelasting,
      vanwege het terrein, dan 50 dB(A) optreedt, gelegen is in het gebied van meer dan één gemeente, wordt de zone,
      met overeenkomstige toepassing van de [artikelen 53][ref4] en [54][ref5], door provinciale staten vastgesteld.
      [Artikel 57, tweede lid][ref6], is van overeenkomstige toepassing.

      2 Indien provinciale staten nalaten toepassing te geven aan het eerste lid of aan
      [artikel 30, eerste lid, van de Wet op de Ruimtelijke Ordening][ref7] - ingeval die bepaling op grond van
      [artikel 57, tweede lid][ref8], van overeenkomstige toepassing is - wordt daarin door Ons voorzien. De in
      [artikel 56][ref9] genoemde artikelen van de [Wet op de Ruimtelijke Ordening][ref10], met uitzondering van de
      [artikelen 27][ref11], [28, eerste tot en met vierde lid, en negende lid][ref12], en [30][ref13], zijn alsdan van
      overeenkomstige toepassing.


