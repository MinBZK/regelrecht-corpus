  - number: '53'
    text: |-
      1 Behoudens het bepaalde in [artikel 64][ref1] stelt de gemeenteraad binnen twee jaar na het tijdstip
      van in werking treden van dit hoofdstuk voor elk binnen zijn gemeente gelegen terrein dat op dat tijdstip
      reeds een bestemming heeft, die de mogelijkheid van vestiging van inrichtingen, behorende tot een krachtens
      [artikel 41][ref2] aangewezen categorie, insluit, een rond dat terrein gelegen zone vast, waarbuiten de
      geluidsbelasting vanwege dat terrein de waarde van 50 dB(A) niet te boven mag gaan.

      2 Gedeputeerde staten kunnen de in het eerste lid genoemde termijn éénmaal met ten hoogste twee jaar verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '64'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003227
        artikel: '41'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '1'
  - number: '54'
    text: |-
      De zone wordt zodanig vastgesteld dat zij ten minste het gehele gebied omvat, waarbinnen met inachtneming van de
      al krachtens de [Wet milieubeheer][ref1] verleende vergunningen en de daaraan verbonden voorschriften een hogere
      geluidsbelasting, vanwege het industrieterrein, dan 50 dB(A) optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '55'
    text: |-
      De vaststelling van een zone krachtens [artikel 53][ref1] kan deel uitmaken van de vaststelling of herziening van
      een bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '2'
  - number: '56'
    text: |-
      In gevallen waarin de vaststelling van een zone krachtens [artikel 53][ref1] niet deel uitmaakt van de
      vaststelling of herziening van een bestemmingsplan, zijn, onverminderd de bepalingen van deze paragraaf, ter zake
      van de totstandkoming van het daartoe strekkende besluit de [artikelen 23 tot en met 28][ref2], [30][ref3], en
      [31 van de Wet op de Ruimtelijke Ordening][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002375#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002375#Artikel31
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0002375
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0002375
        artikel: '31'
  - number: '57'
    text: |-
      1 Ingeval een besluit van de gemeenteraad, houdende vaststelling van een zone, binnen
      de ingevolge [artikel 53, eerste lid][ref1], geldende termijn of, bij toepassing van
      [artikel 30 van de Wet op de Ruimtelijke Ordening][ref2], binnen de krachtens laatstgenoemd artikel geldende
      termijn, niet is tot stand gekomen, wordt de zone door gedeputeerde staten vastgesteld.

      2 Ter zake van het besluit van gedeputeerde staten zijn de in [artikel 56][ref3] genoemde artikelen
      van de [Wet op de Ruimtelijke Ordening][ref4], met uitzondering van de [artikelen 27][ref5],
      [28, tweede tot en met vierde lid, en negende lid][ref6], van overeenkomstige toepassing, met dien verstande dat:

      a. gedeputeerde staten in de plaats treden van de gemeenteraad en van burgemeester en wethouders;

      b. Wij in de plaats treden van gedeputeerde staten.


