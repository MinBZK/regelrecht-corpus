  - number: '174'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel174
  - number: '175'
    text: |-
      Een gedraging in strijd met een voorschrift, krachtens [artikel 5, derde lid][ref1], aan een vergunning verbonden,
      is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel5
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel175
