  - number: 82a
    text: |-
      1 Op verzoek van burgemeester en wethouders kunnen gedeputeerde staten voor het stedelijk gebied van
      de betrokken gemeente of voor een bij hun besluit aan te geven gedeelte daarvan een hogere dan de in
      [artikel 82, eerste lid][ref1], genoemde waarde vaststellen, voor zover voor die gemeente of dat gedeelte daarvan
      het terugbrengen van de geluidsbelasting van de gevel, vanwege de weg, tot ten hoogste 50 dB(A) redelijkerwijs niet
      mogelijk is, met dien verstande dat deze waarde 55 dB(A) niet te boven mag gaan.

      2 Een verzoek als bedoeld in het eerste lid gaat vergezeld van de resultaten van akoestisch en verkeerskundig
      onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel82a
