  - number: 87b
    text: |-
      1 In deze afdeling wordt verstaan onder:

      a. Onze Ministers: Onze Minister en Onze Minister van Verkeer en Waterstaat;

      b. hoofdweg: hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, onder c, van de Tracéwet][ref1];

      c. aanleg, wijziging of verbreding van een hoofdweg: aanleg, wijziging of verbreding van een hoofdweg in de zin van
      [artikel 2 van de Tracéwet][ref2];

      d. woonwagenstandplaats: een standplaats als bedoeld in [artikel 1, eerste lid, onder h, van de Woningwet][ref3];

      e. andere geluidsgevoelige gebouwen:

      1°. basisscholen;

      2°. scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref4];

      3°. instellingen voor hoger beroepsonderwijs;

      4°. algemene, categorale en academische ziekenhuizen, alsmede verpleeghuizen;

      5°. andere gezondheidszorggebouwen dan bedoeld onder 4°;

      f. geluidsgevoelige terreinen:

      1°. terreinen die behoren bij gebouwen als bedoeld onder e, 5°, voor zover deze bestemd zijn of worden gebruikt
      voor de in die gebouwen verleende zorg, of

      2°. woonwagenstandplaatsen;

      g. tracé: tracé als bedoeld in [artikel 1, eerste lid, onder h, van de Tracéwet][ref5];

      h. aanpassing van een weg: een aanpassing met betrekking tot een aanwezige weg die leidt tot een toename van de
      geluidsbelasting vanwege die weg van 2 dB(A) of meer;

      i. equivalent geluidsniveau in dB(A) met betrekking tot een spoorweg: het equivalente geluidsniveau in dB(A),
      bepaald volgens op grond van [artikel 107][ref6] vastgestelde regels;

      j. etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een spoorweg: de hoogste van de
      volgende drie waarden:

      1°. de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dagwaarde),

      2°. de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur
      (avondwaarde),

      3°. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur
      (nachtwaarde);

      k. geluidsbelasting vanwege een spoorweg: de etmaalwaarde van het equivalente geluidsniveau in dB(A) op een
      bepaalde plaats, veroorzaakt door het gezamenlijke spoorwegverkeer op een bepaald spoorweggedeelte of een
      combinatie van spoorweggedeelten;

      l. aanpassing van een spoorweg: een aanpassing met betrekking tot een aanwezige spoorweg, die verandering brengt
      in de omstandigheden welke ingevolge de regels die gelden bij de vaststelling van de geluidsbelasting vanwege die
      spoorweg in acht genomen moeten worden.

      2 Een gymnastieklokaal maakt voor de toepassing van deze afdeling geen deel uit van de in het eerste lid, onder e,
      1°, 2° en 3°, bedoelde scholen.

      3 Onder aanpassing van een spoorweg wordt in deze afdeling niet verstaan de afzonderlijke omstandigheid die bestaat
      uit:

      a. een verhoging van minder dan 45% in de maatgevende intensiteit van door Onze Minister te bepalen categorieën
      spoorvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten in de ingevolge
      [artikel 106, eerste lid, onder j][ref7], in acht te nemen etmaalperiode;

      b. een verhoging van 20% of minder van de verkeerssnelheid van door Onze Minister te bepalen categorieën
      railvoertuigen op een bepaald spoorweggedeelte of een combinatie van spoorweggedeelten in de ingevolge
      [artikel 106, eerste lid, onder j][ref8], in acht te nemen etmaalperiode;

      c. een horizontale verplaatsing van de spoorstaven over een afstand kleiner dan twee meter;

      d. een verticale verplaatsing van de spoorstaven over een afstand kleiner dan één meter, dan wel

      e. het ter vervanging aanbrengen van een baanconstructie, die, bepaald met inachtneming van de door Onze Minister
      op grond van [artikel 107][ref9] gestelde regels, niet meer geluid emitteert dan de te vervangen constructie.

      4 Onverminderd het bepaalde in het derde lid wordt onder aanpassing van een spoorweg in deze afdeling niet verstaan
      een aanpassing die een verhoging van de geluidsbelasting vanwege de spoorweg van 2 dB(A) of minder tot gevolg
      heeft, en tengevolge waarvan de geluidsbelasting van de gevel van woningen of van andere geluidsgevoelige gebouwen
      niet hoger zal zijn dan 65 dB(A).

      5 Overwegende bezwaren van financiële aard bestaan voor de toepassing van deze afdeling niet tegen maatregelen
      gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige
      gebouwen, onderscheidenlijk aan de grens van geluidsgevoelige terreinen, waarvan de kosten in redelijke verhouding
      staan tot kwaliteit, aard en gebruik van de woning, het andere geluidsgevoelige gebouw of het geluidsgevoelige
      terrein en tot de doeltreffendheid van die maatregelen.

      6 Bij ministeriële regeling kunnen Onze Ministers nadere regels stellen voor de toepassing van het criterium,
      bedoeld in het vijfde lid.


