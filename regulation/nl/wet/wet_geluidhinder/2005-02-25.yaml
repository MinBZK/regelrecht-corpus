  - number: '170'
    text: |-
      1 Wij kunnen in het belang van de landsverdediging van de bij of krachtens [artikel 2][ref1] of [10][ref2] gestelde
      verboden en verplichtingen:

      a. bij algemene maatregel van bestuur vrijstelling verlenen;

      b. op daartoe strekkend verzoek ontheffing verlenen.

      2 Aan een vrijstelling of ontheffing worden de voorschriften verbonden, die naar Ons oordeel in het belang van het
      voorkomen of beperken van geluidhinder nodig zijn.

      3 In afwijking van het bepaalde in [artikel 71, tweede lid][ref3], stelt Onze Minister het programma van
      aktiviteiten als omschreven in dat artikellid op, voor zover het programma betrekking heeft op inrichtingen, die
      in gebruik of mede in gebruik zijn ten behoeve van de landsverdediging. Onze Minister stelt het programma op na
      overleg met Onze Minister van Defensie.

      4 Bij de vaststelling van het programma deelt Onze Minister aan burgemeester en wethouders van de gemeente, waarin
      de in het derde lid bedoelde inrichting is gelegen, en aan gedeputeerde staten mede de geluidsbelasting vanwege die
      inrichting na de volledige uitvoering van het programma.

      5 Onze Minister van Defensie is ermee belast dat het programma, bedoeld in [artikel 71][ref4], ten aanzien van
      inrichtingen als bedoeld in het derde lid, wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel71
