  - number: '88'
    text: |-
      1 Burgemeester en wethouders zijn gehouden na een ingesteld akoestisch onderzoek aan Onze Minister de in de
      gemeente voorkomende gevallen te melden, waarin op 1 maart 1986 een weg aanwezig was, terwijl op dat tijdstip
      binnen de zone van die weg reeds woningen aanwezig waren en de geluidsbelasting, vanwege de weg, van de gevel van
      deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van de weg hoger was dan 55 dB(A).

      2 Het eerste lid is niet van toepassing:

      a. ingeval de woningen of de weg zijn geprojecteerd in een na 1 januari 1982 overeenkomstig de [artikelen 76][ref1]
      en [77][ref2] vastgesteld bestemmingsplan;

      b. ingeval tot aanleg of reconstructie van de weg na 1 januari 1982 is besloten met toepassing van de
      [artikelen 79 tot en met 81][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel77
