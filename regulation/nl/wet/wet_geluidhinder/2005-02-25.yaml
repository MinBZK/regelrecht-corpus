        artikel: '47'
        hoofdstuk: V
        paragraaf: '2'
        afdeling: '1'
  - number: '52'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op
      gronden die krachtens die vaststelling of herziening gaan of blijven behoren tot een zone, worden ter zake van
      de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere gebouwen dan woningen en
      van andere geluidsgevoelige objecten binnen de zone de waarden in acht genomen, die ingevolge [artikel 46][ref1],
      onderscheidenlijk [49][ref2] als de ten hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan als in dat lid
      bedoeld hogere waarden in acht genomen, voor zover:

      a. gedeputeerde staten met toepassing van [artikel 47][ref3], [48][ref4] of [50][ref5] voor de vaststelling of
      herziening van het bestemmingsplan zodanige waarden hebben vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met
      toepassing van [artikel 47][ref6], [48][ref7] of [50][ref8] zullen worden vastgesteld.

      3 Gedeputeerde staten nemen bij de beslissing over de goedkeuring van een bestemmingsplan of de herziening
      hiervan dat geheel of gedeeltelijk betrekking heeft op gronden als bedoeld in het eerste lid ter zake
      van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere gebouwen
      dan woningen en van andere geluidsgevoelige objecten binnen de zone de waarden in acht, die ingevolge de
      [artikelen 46 tot en met 50][ref9] als de ten hoogste toelaatbare worden aangemerkt.

      4 De [artikelen 43 tot en met 45][ref10] zijn van overeenkomstige toepassing in geval van vaststelling of
      herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op gronden, reeds behorende tot een
      krachtens [artikel 41][ref11] vastgestelde zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel47
