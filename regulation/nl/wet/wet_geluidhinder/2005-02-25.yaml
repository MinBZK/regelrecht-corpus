  - number: 100b
    text: |-
      Bij algemene maatregel van bestuur kunnen voor daarbij aan te wijzen andere geluidsgevoelige gebouwen en objecten
      met betrekking tot de in de [artikelen 100][ref1] en [100][ref2] geregelde onderwerpen overeenkomstige regels
      worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100
