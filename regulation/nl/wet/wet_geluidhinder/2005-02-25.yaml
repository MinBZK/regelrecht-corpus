  - number: '85'
    text: |-
      Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te
      stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen, voor de ter plaatse ten
      hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, tweede lid][ref1], hogere dan de krachtens dat
      lid bepaalde waarden vaststellen, met dien verstande dat die waarden bij algemene maatregel van bestuur te stellen
      grenzen niet te boven mogen gaan.


