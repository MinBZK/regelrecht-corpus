  - number: '60'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter zake van de voorbereiding en
      inrichting van besluiten tot vaststelling van een zone krachtens deze paragraaf, welke geen deel uitmaakt van de
      vaststelling of herziening van een bestemmingsplan.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel60
  - number: '61'
    text: |-
      1 Een krachtens deze paragraaf vastgestelde zone kan uitsluitend worden gewijzigd of opgeheven bij de vaststelling
      of herziening van een bestemmingsplan.

      2 Een wijziging of opheffing van de zone kan er niet toe strekken dat enig gebied waarbinnen met inachtneming van
      de al krachtens de [Wet milieubeheer][ref1] verleende vergunningen en de daaraan verbonden voorschriften een hogere
      geluidsbelasting, vanwege het industrieterrein, optreedt dan 50 dB(A), ophoudt van de zone deel uit te maken.

      3 Ter zake van het vaststellen van een zone krachtens [artikel 53][ref2] bij de vaststelling of herziening van
      een bestemmingsplan, of van het wijzigen of opheffen van een zone krachtens [artikel 61, eerste lid][ref3], is
      [artikel 45][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel61
