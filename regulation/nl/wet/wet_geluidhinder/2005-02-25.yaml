  - number: 87g
    text: |-
      1 Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen of te verbreden
      hoofdweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de hoofdweg of vanwege binnen het tracé
      van die hoofdweg gelegen wegen, indien de geluidsbelasting vanwege deze hoofdweg of vanwege binnen het tracé van
      die hoofdweg gelegen wegen op 1 maart 1986, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk
      na ingebruikneming van de hoofdweg of binnen het tracé van die hoofdweg gelegen wegen hoger was dan 55 dB(A), de
      waarde 50 dB(A).

      2 In geval eerder met toepassing van [artikel 90, tweede lid][ref1], een hogere waarde voor de ten hoogste
      toelaatbare geluidsbelasting, vanwege de betrokken weg of wegen is vastgesteld dan 50 dB(A), is de voor woningen
      binnen de zone van een te wijzigen of te verbreden hoofdweg ten gevolge waarvan de hoofdweg of binnen het tracé
      van die hoofdweg gelegen wegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de
      hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, de laagste van de volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 70 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen een hogere waarde dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande
      dat de verhoging 5 dB(A) en de waarde 70 dB(A) niet te boven mag gaan.

      5 In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref2], een hogere waarde dan 70 dB(A) vaststellen.

      6 Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, tot de
      ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren
      ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      7 De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen hoofdweg, vanwege binnen het tracé van die hoofdweg gelegen wegen.

      8 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat in het derde en vierde lid in plaats van «de waarde 70 dB(A)» telkens wordt gelezen: met betrekking tot
      andere geluidsgevoelige gebouwen als bedoeld in [artikel 87b, eerste lid, onder e, 1°, 2°, 3° en 4°][ref3],
      de waarde 70 dB(A), onderscheidenlijk met betrekking tot andere geluidsgevoelige gebouwen als bedoeld in
      [artikel 87b, eerste lid, onder e, 5°][ref4], de waarde 60 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel87b
