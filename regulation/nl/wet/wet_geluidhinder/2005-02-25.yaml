  - number: '70'
    text: |-
      1 Ingeval de vaststelling van een zone krachtens § 1 niet deel uitmaakt van de vaststelling of herziening van een
      bestemmingsplan, worden bij het besluit tot vaststelling van de zone tevens ten behoeve van de op dat tijdstip
      binnen die zone aanwezige, in aanbouw zijnde of geprojecteerde woningen, van andere gebouwen en van andere
      geluidsgevoelige objecten binnen die zone, maatregelen vastgesteld, waardoor ter zake van de geluidsbelasting van
      de bedoelde objecten, vanwege het industrieterrein, de waarden die ingevolge de [artikelen 65 tot en met 68][ref1]
      als de ten hoogste toelaatbare worden aangemerkt, in acht worden genomen.

      2 Indien op grond van het eerste lid maatregelen worden vastgesteld, welke door middel van de
      vaststelling of herziening van een bestemmingsplan, geldende voor tot de zone behorende gronden,
      moeten worden tot stand gebracht, neemt de raad van de gemeente binnen wier gebied de zone of een deel
      daarvan is gelegen, zo spoedig mogelijk doch in elk geval binnen vier weken na de totstandkoming van
      het besluit tot vaststelling van de zone een daartoe strekkend voorbereidingsbesluit als bedoeld in
      [artikel 21, eerste lid, van de Wet op de Ruimtelijke Ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel70
