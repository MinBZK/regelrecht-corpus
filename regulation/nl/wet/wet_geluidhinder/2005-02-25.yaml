  - number: '172'
    text: |-
      1 Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 2][ref1], [10][ref2], [41][ref3],
      [47][ref4], [50][ref5], [66][ref6], [83][ref7], [85][ref8] of [100][ref9] wordt overgelegd aan de beide kamers der
      Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een ieder wordt de gelegenheid geboden gedurende een
      bij die bekendmaking vast te stellen termijn van ten minste vier weken opmerkingen over het ontwerp schriftelijk
      ter kennis van Onze Minister te brengen.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
