  - number: '73'
    text: |-
      1 Ten behoeve van de vaststelling van de geluidsbelasting, vanwege een industrieterrein, stelt Onze Minister voor
      het bepalen van het equivalente geluidsniveau als omschreven in [artikel 1][ref1], regels, inhoudende op welke
      wijze en met inachtneming van welke bestaande of te verwachten omstandigheden, de afwisselende niveaus van het
      ter plaatse optredende geluid worden vastgesteld, en op welke wijze uit de over een bepaalde periode verkregen
      uitkomsten het in vorengenoemde omschrijving bedoelde gemiddelde wordt afgeleid.

      2 Onze Minister kan regels stellen omtrent al hetgeen betrekking heeft op de wijze waarop de akoestische
      onderzoeken, bedoeld in dit hoofdstuk, worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: '74'
    text: |-
      1 Langs een weg bevindt zich een zone die aan weerszijden van de weg de volgende breedte heeft:

      a. in stedelijk gebied:

      1°. voor een weg, bestaande uit drie of meer rijstroken: 350 meter;

      2°. voor een weg, bestaande uit een of twee rijstroken: 200 meter;

      b. in buitenstedelijk gebied:

      1°. voor een weg, bestaande uit vijf of meer rijstroken: 600 meter;

      2°. voor een weg, bestaande uit drie of vier rijstroken: 400 meter;

      3°. voor een weg, bestaande uit een of twee rijstroken: 250 meter.

      2 Het eerste lid geldt niet met betrekking tot:

      a. wegen die gelegen zijn binnen een als woonerf aangeduid gebied;

      b. wegen waarvoor een maximum snelheid van 30 km per uur geldt.

      3 Het eerste lid geldt niet met betrekking tot wegen waarvan op grond van een door de gemeenteraad vastgestelde
      geluidsniveaukaart vaststaat dat de geluidsbelasting op 10 meter uit de as van de meest nabij gelegen rijstrook 50
      dB(A) of minder bedraagt.

      4 Van een voornemen tot een vaststelling als bedoeld in het derde lid wordt in één of meer dag- of nieuwsbladen
      die in de gemeente verspreid worden, door middel van niet op naam gestelde kennisgeving aan de gebruikers van de
      woningen gelegen langs de betrokken weg en voorts op de gebruikelijke wijze mededeling gedaan.

      5 De gemeenteraad stelt de geluidsniveaukaart niet eerder vast dan nadat vier weken zijn vestreken nadat van het
      voornemen, bedoeld in het vierde lid, mededeling is gedaan. Afschrift van de geluidsniveaukaart wordt gezonden aan
      gedeputeerde staten en aan de inspecteur.

      6 Een geluidsniveaukaart heeft, behoudens het in de volgende volzin bepaalde, een geldingsduur van 10 jaar. De
      kaart vervalt in elk geval wanneer redelijkerwijs aannemelijk is dat zij niet meer de uit akoestisch oogpunt
      gewenste verkeersafwikkeling weergeeft.

      7 Voor de toepassing van [artikel 76][ref1] wordt, indien het een nog aan te leggen weg betreft, de daarbij
      behorende zone geacht aanwezig te zijn, zodra die weg in een ontwerp-bestemmingsplan is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel76
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '76'
        hoofdstuk: VI
        paragraaf: '1'
        afdeling: '2'
  - number: '75'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen omtrent de breedte van de zone voor bijzondere gevallen regels worden
      gesteld, welke kunnen afwijken van [artikel 74, eerste lid][ref1].

      2 Onze Minister stelt regels voor het bepalen van de grenslijn aan weerszijden van de weg, waar de zone begint.

      3 Indien een weg bestaat uit weggedeelten met een onderling verschillend aantal rijstroken, is de breedte van de
      zone langs de weg per weggedeelte afhankelijk van het aantal rijstroken van dat weggedeelte. Onze Minister stelt
      regels met betrekking tot de aansluiting van de in de vorige volzin bedoelde zonedelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel75
