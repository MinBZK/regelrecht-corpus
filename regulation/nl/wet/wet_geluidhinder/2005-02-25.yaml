  - number: 106f
    text: |-
      1 Behoudens het tweede tot en met vijfde lid is de voor woningen binnen de zone van een te wijzigen landelijke
      spoorweg ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen
      het tracé van die landelijke spoorweg gelegen spoorwegen, indien de geluidsbelasting vanwege deze landelijke
      spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen op 1 juli 1987, van de gevel
      van deze woningen op dat tijdstip, onderscheidenlijk na ingebruikneming van de landelijke spoorweg of binnen het
      tracé van die landelijke spoorweg gelegen spoorwegen hoger was dan 65 dB(A), de waarde 57 dB(A).

      2 In geval eerder krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege de
      betrokken landelijke spoorweg of spoorwegen is vastgesteld dan 57 dB(A), is de voor woningen binnen de zone van een
      te wijzigen landelijke spoorweg ten gevolge waarvan de landelijke spoorweg of binnen het tracé van die landelijke
      spoorweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de
      landelijke spoorweg of vanwegebinnen het tracé van die landelijke spoorweg gelegen spoorwegen, de laagste van de
      volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 73 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen een hogere dan de in het tweede lid bedoelde waarde vaststellen, met dien verstande dat
      deze de waarde 73 dB(A) niet te boven mag gaan.

      5 In afwijking van het derde lid kunnen Onze Ministers met overeenkomstige toepassing van
      [artikel 90, vierde lid][ref1], een hogere waarde dan 73 dB(A) vaststellen.

      6 Onze Ministers kunnen slechts toepassing geven aan het derde tot en met vijfde lid in die gevallen waarin
      toepassing van maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de
      betrokken woningen, vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen
      spoorwegen, tot de ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel
      overwegende bezwaren ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      7 De in het eerste tot en met zesde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen.

      8 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande
      dat in het eerste lid in plaats van «hoger was dan 65 dB(A), de waarde 57 dB(A)» wordt gelezen: hoger was dan 60
      dB(A), de waarde 60 dB(A).

      9 De in het eerste tot en met vierde en zesde en zevende lid gestelde regels zijn mede van toepassing met
      betrekking tot de ten hoogste toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat
      in het eerste lid in plaats van «de waarde 57 dB(A)» wordt gelezen: de waarde 65 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel90
