      1 Indien een van de volgende onderdelen van deze wet of van het krachtens deze onderdelen bepaalde:

      a. [Afdeling 1, § 2][ref1] en [Afdeling 2, § 2][ref2] en[ 4 van hoofdstuk V][ref3],

      b. [Afdeling 2][ref4], [2a][ref5], [3][ref6] en [4 van hoofdstuk VI][ref7],

      c. [hoofdstuk VII][ref8], en

      d. [hoofdstuk VIII][ref9],

      van toepassing is op woningen gelegen in twee of meer aanwezige of toekomstige geluidszones als bedoeld
      in de [artikelen 41][ref10], [53][ref11], [74][ref12], [107][ref13] en [108][ref14] van deze wet en
      [artikel 25a van de Luchtvaartwet][ref15], dragen gedeputeerde staten ervoor zorg dat voldoende aandacht wordt
      geschonken aan de noodzakelijke onderlinge afstemming en samenhang van de onderscheiden te treffen maatregelen.
      De voorgaande zin is van overeenkomstige toepassing op woningen ten aanzien waarvan maatregelen in verband met
      de geluidbelasting getroffen kunnen worden op grond van [hoofdstuk 8 van de Wet luchtvaart][ref16]. Voor zover
      het maatregelen in saneringssituaties betreft, doen zij hun voorstellen voor deze maatregelen aan Onze Minister
      vergezeld gaan van hun desbetreffende advies.

      2 Indien in een bepaald gebied één of meer van de in het eerste lid genoemde onderdelen van deze wet of van het
      krachtens die onderdelen bepaalde van toepassing zijn, terwijl voor dat gebied tevens uit anderen hoofde van
      Rijkswege een saneringsprogramma ter zake van het voorkomen of bestrijden van geluidhinder moet worden opgesteld,
      draagt Onze Minister zorg voor de noodzakelijke onderlinge afstemming en samenhang van de te treffen maatregelen.

      3 Ten behoeve van de uitvoering van het bepaalde in het eerste lid, kan Onze Minister bepalen, dat bij de
      berekening en meting van de onderscheidene geluidsbelastingen van de gevels van woningen op de resultaten een door
      hem aan te geven correctie kan worden toegepast.


