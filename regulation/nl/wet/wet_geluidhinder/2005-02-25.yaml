  - number: '164'
    text: |-
      1 Wanneer door het Rijk, een provincie, een gemeente, een ander openbaar lichaam of gemeenschappelijk orgaan als
      bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref1] ten behoeve van geluidmetingen duurzaam of
      tijdelijk gebruik moet worden gemaakt van onroerende zaken, kan Onze Minister aan ieder die enig recht ten aanzien
      van die zaken heeft, doch met wie in voorafgaand overleg terzake geen overeenstemming is bereikt, de verplichting
      opleggen bedoeld gebruik, behoudens recht op schadevergoeding, te gedogen, indien naar het oordeel van Onze
      Minister de belangen van de rechthebbenden redelijkerwijs onteigening niet vorderen en in hun gebruik van die zaken
      niet meer belemmering wordt gebracht dan redelijkerwijs nodig is.

      2 Onze Minister doet de beslissing waarbij die verplichting wordt opgelegd,
      zo spoedig mogelijk inschrijven in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2].__REF001______________________________________
      _____________ is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
