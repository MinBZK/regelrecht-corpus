  - number: '82'
    text: |-
      1 Behoudens het in de [artikelen 82][ref1], [83][ref2] en [100][ref3] bepaalde is de voor woningen binnen een zone
      ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de weg, 50 dB(A).

      2 Bij algemene maatregel van bestuur kunnen waarden worden vastgesteld voor de ten hoogste toelaatbare
      geluidsbelasting, vanwege een weg, van de gevel van andere gebouwen dan woningen, alsmede van andere
      geluidsgevoelige objecten binnen een zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel83
