  - number: '62'
    text: |-
      Bij het voorbereiden van de vaststelling of wijziging van een zone krachtens deze paragraaf wordt vanwege
      burgemeester en wethouders, onderscheidenlijk - in geval van toepassing van de [artikelen 57][ref1], [59][ref2] of
      [64][ref3] - vanwege gedeputeerde staten of Ons een akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen binnen de ontworpen zone, alsmede door gebouwen of andere objecten binnen
      die zone, ten aanzien waarvan toepassing is gegeven aan [artikel 68][ref4], vanwege het industrieterrein ten
      hoogste zou kunnen worden ondervonden zonder de invloed van maatregelen die de geluidoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende maatregelen om te voorkomen dat de in de toekomst vanwege
      het industrieterrein optredende geluidsbelasting van de onder *a* bedoelde objecten de waarden die ingevolge de
      [artikelen 65 tot en met 68][ref5] als de ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel57
