      In afwijking van de [artikelen 125][ref1] of [126][ref2] kan Onze Minister volgens bij algemene maatregel van
      bestuur te stellen regels in gevallen waarin een maatregel als bedoeld in die artikelen tevens wordt getroffen met
      een ander oogmerk dan in die artikelen genoemd, de subsidies verstrekken ten behoeve van die maatregel op basis van
      door hem vastgestelde normbedragen.


