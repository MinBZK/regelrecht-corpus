        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7'
    text: |-
      1 Bij een algemene maatregel van bestuur als bedoeld in [artikel 2][ref1] kunnen ter zake van de toepasselijkheid
      van daarbij gestelde regels beperkingen worden gesteld.

      2 Zodanige beperking kan onder meer inhouden:

      a. dat de regel slechts geldt in de bij de maatregel aangewezen gebieden;

      b. dat de regel niet geldt met betrekking tot inrichtingen, behorende tot een daartoe bij de maatregel aangewezen
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van het voorkomen of beperken van geluidhinder worden
      verboden toestellen, behorende tot een bij de maatregel aangewezen categorie, te verhandelen anders dan met
      inachtneming van de voorschriften, bij de maatregel gesteld met betrekking tot hun aanduiding of benaming.
      [Artikel 2, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van het voorkomen of beperken van geluidhinder worden verboden
      voor gebruik als geluidwerende voorziening bestemde of geschikte materialen of andere zaken, welke behoren tot
      een bij de maatregel aangewezen categorie, te verhandelen anders dan met inachtneming van de voorschriften,
      bij de maatregel gesteld met betrekking tot hun aanduiding of benaming. [Artikel 2, derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel2
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel9
    references:
