  - number: '114'
    text: |-
      1 Indien toepassing wordt gegeven aan [hoofdstuk VII][ref1] of [VIII][ref2], kunnen bij algemene maatregel van
      bestuur voor aanwezige of in aanbouw zijnde woningen en andere geluidsgevoelige gebouwen en objecten met betrekking
      tot de in de [artikelen 111][ref3] en [112][ref4] geregelde onderwerpen overeenkomstige regels worden gesteld.

      2 In afwijking van het eerste lid hebben, ingeval toepassing wordt gegeven aan [hoofdstuk VIII][ref5] met
      betrekking tot geluidhinder vanwege luchtvaartterreinen, de regels van een in het eerste lid bedoelde maatregel
      betrekking op de waarde van de geluidwering die de gevels van aanwezige of in aanbouw zijnde woningen en andere
      geluidsgevoelige bestemmingen ten minste moeten bieden.


