  - number: '112'
    text: |-
      Indien met betrekking tot aanwezige of in aanbouw zijnde woningen toepassing is gegeven aan [artikel 100][ref1],
      treft de gemeenteraad met betrekking tot de geluidwering van de gevels van de betrokken woningen maatregelen om
      te bevorderen dat de geluidsbelasting, vanwege de weg, binnen de woning bij gesloten ramen na de reconstructie ten
      hoogste bedraagt:

      a. ingeval voor de betrokken woningen bij de reconstructie voor de eerste maal een hogere waarde dan 50 dB(A), voor
      de geluidsbelasting van de gevel, vanwege de weg, is vastgesteld: 35 dB(A);

      b. ingeval voor de betrokken woningen eerder een hogere waarde voor de geluidsbelasting is vastgesteld: de
      waarde die voor de reconstructie ingevolge het in [artikel 111, tweede of derde lid][ref2], voor de onderscheiden
      situaties bepaalde, dan wel ingevolge het krachtens [artikel 3 van de Woningwet][ref3] bepaalde ten hoogste
      toelaatbaar was.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel3
