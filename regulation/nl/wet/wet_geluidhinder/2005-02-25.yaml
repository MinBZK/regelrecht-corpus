  - number: 111a
    text: |-
      1 Indien met toepassing van [artikel 87e, tweede lid of derde lid][ref1], [87f, derde lid][ref2],
      of [87h, derde lid][ref3], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen een hogere
      geluidsbelasting dan 50 dB(A) vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen,
      onderscheidenlijk een hogere geluidsbelasting dan 57 dB(A) vanwege binnen het tracé van die hoofdweg gelegen
      spoorwegen als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot de geluidwering
      van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten ramen in geval
      van geluidsbelasting vanwege wegen ten hoogste 35 dB(A), onderscheidenlijk vanwege spoorwegen ten hoogste 37 dB(A)
      bedraagt.

      2 Indien met toepassing van [artikel 87g, derde tot en met vijfde lid][ref4], of 87i, derde tot en met vijfde
      lid, met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting dan 55
      dB(A) vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg gelegen wegen, onderscheidenlijk een hogere
      geluidsbelasting dan 65 dB(A) vanwege binnen het tracé van die hoofdweg gelegen spoorwegen als de ten hoogste
      toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot de geluidwering van die gevels maatregelen om
      te bevorderen dat de geluidsbelasting binnen de woning bij gesloten ramen ten hoogste 45 dB(A) bedraagt.

      3 Indien met toepassing van [artikel 87e, zesde lid][ref5], [87f, zesde lid][ref6], [87g, achtste lid][ref7],
      [87h, zesde lid][ref8], of [87i, achtste lid][ref9], met betrekking tot de gevels van andere geluidsgevoelige
      gebouwen een hogere geluidsbelasting dan 50 dB(A) vanwege de hoofdweg of vanwege binnen het tracé van die hoofdweg
      gelegen wegen, onderscheidenlijk een hogere geluidsbelasting dan 55 dB(A) vanwege binnen het tracé van die hoofdweg
      gelegen spoorwegen, als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot de
      geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting bij gesloten ramen binnen:

      a. leslokalen van basisscholen,

      b. theorielokalen van scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref10],

      c. theorielokalen van instellingen voor hoger beroepsonderwijs,

      d. onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 87b, eerste lid, onder e][ref11], 4°,

      e. onderzoeks-, behandelings-, recreatie- en conversatieruimten, alsmede woon- en slaapruimten van gebouwen,
      bedoeld in [artikel 87b, eerste lid, onder e, 5°][ref12],

      ten hoogste 30 dB(A) bedraagt, onderscheidenlijk binnen:

      a. theorievaklokalen voor scholen voor voorgezet onderwijs als bedoeld in de
      [Wet op het voortgezet onderwijs][ref13],

      b. theorievaklokalen van instellingen voor hoger beroepsonderwijs,

      c. ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen
      als bedoeld in [artikel 87b, eerste lid, onder e, 4°][ref14],

      ten hoogste 35 dB(A) bedraagt.

      4 Indien met toepassing van [artikel 106d, tweede lid of derde lid][ref15], [106e, derde lid][ref16],
      of [106g, derde lid][ref17], met betrekking tot de gevels van in aanbouw zijnde of aanwezige woningen een hogere
      geluidsbelasting dan 57 dB(A) vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke
      spoorweg gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 50 dB(A) vanwege binnen het tracé
      van die landelijke spoorweg gelegen wegen, als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met
      betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning
      bij gesloten ramen in geval van geluidsbelasting vanwege spoorwegen ten hoogste 37 dB(A), onderscheidenlijk vanwege
      wegen ten hoogste 35 dB(A) bedraagt.

      5 Indien met toepassing van [artikel 106f, derde tot en met vijfde lid][ref18],
      of [106h, derde tot en met vijfde lid][ref19], met betrekking tot de gevels van in aanbouw zijnde of aanwezige
      woningen een hogere geluidsbelasting dan 65 dB(A) vanwege de landelijke spoorweg of vanwege binnen het tracé van
      die landelijke spoorweg gelegen spoorwegen, onderscheidenlijk een hogere geluidsbelasting dan 55 dB(A) vanwege
      binnen het tracé van die landelijke spoorweg gelegen wegen als de ten hoogste toelaatbare is vastgesteld, treft de
      gemeenteraad met betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting
      binnen de woning bij gesloten ramen ten hoogste 45 dB(A) bedraagt.

      6 Indien met toepassing van [artikel 106d, zesde lid][ref20], [106e, zesde lid][ref21], [106f, achtste lid][ref22],
      [106g, zesde lid][ref23], of [106h, achtste lid][ref24], met betrekking tot de gevels van in aanbouw zijnde
      of aanwezige andere geluidsgevoelige gebouwen een hogere geluidsbelasting dan 55 dB(A) vanwege de landelijke
      spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen, onderscheidenlijk een
      hogere geluidsbelasting dan 50 dB(A) vanwege binnen het tracé van die landelijke spoorweg gelegen wegen, als de
      ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot de geluidwering van die gevels
      maatregelen om te bevorderen dat de geluidsbelasting bij gesloten ramen binnen:

      a. leslokalen van basisscholen,

      b. theorielokalen van scholen voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref25],

      c. theorielokalen van instellingen voor hoger beroepsonderwijs,

      d. onderzoeks- en behandelingsruimten van ziekenhuizen en verpleeghuizen, bedoeld in
      [artikel 106, eerste lid, onder e, 4°][ref26], onderzoeks-, behandelings-, recreatie- en conversatieruimten,
      alsmede woon- en slaapruimten van gebouwen, bedoeld in [artikel 106, eerste lid, onder e, 5°][ref27],

      ten hoogste 30 dB(A) bedraagt, onderscheidenlijk binnen:

      a. theorievaklokalen van scholen voor voortgezet onderwijs als bedoeld in de
      [Wet op het voorgezet onderwijs][ref28],

      b. theorievaklokalen van instellingen voor hoger beroepsonderwijs,

      c. ruimten voor patiëntenhuisvesting, alsmede recreatie- en conversatieruimten van ziekenhuizen en verpleeghuizen
      als bedoeld in [artikel 106, eerste lid, onder e, 4°][ref29],

      ten hoogste 35 dB(A) bedraagt.


