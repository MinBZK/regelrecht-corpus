  - number: '77'
    text: |-
      Bij het voorbereiden van de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk
      betrekking heeft op gronden, behorende tot een zone als bedoeld in [artikel 74][ref1], of bij het voorbereiden
      van een besluit tot vrijstelling als bedoeld in [artikel 76][ref2], wordt vanwege burgemeester en wethouders een
      akoestisch onderzoek ingesteld naar:

      a. de geluidsbelasting die door woningen binnen de zone, alsmede door gebouwen of andere objecten binnen de zone,
      ten aanzien waarvan toepassing is gegeven aan [artikel 82, tweede lid][ref3], vanwege de weg zou worden ondervonden
      zonder de invloed van maatregelen die de geluidoverdracht beperken;

      b. de doeltreffendheid van de in aanmerking komende verkeersmaatregelen en andere maatregelen om te voorkomen
      dat de in de toekomst vanwege de weg optredende geluidsbelasting van de onder *a* bedoelde objecten de waarden
      die ingevolge de [artikelen 82][ref4], [82][ref5], [83][ref6] en [85][ref7] als de ten hoogste toelaatbare worden
      aangemerkt, te boven zou gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel76a
