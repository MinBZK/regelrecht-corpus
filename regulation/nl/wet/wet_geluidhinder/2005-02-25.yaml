  - number: '121'
    text: |-
      1 Indien gedeputeerde staten niet of niet tijdig voldoen aan een verplichting als bedoeld in
      [artikel 118, eerste lid][ref1], is [artikel 121 van de Provinciewet][ref2] van overeenkomstige toepassing.

      2 Indien burgemeester en wethouders niet of niet tijdig voldoen aan een verplichting als bedoeld in
      [artikel 118, tweede lid][ref3], is [artikel 124 van de Gemeentewet][ref4] van overeenkomstige toepassing met dien
      verstande dat Onze Minister in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel121
