  - number: '72'
    text: |-
      1 Gedeputeerde staten leggen het ingevolge [artikel 71, tweede lid][ref1], opgestelde programma van maatregelen
      onverwijld voor aan Onze Minister.

      2 Onze Minister stelt voor de woningen waarop het programma betrekking heeft, binnen zes maanden na ontvangst
      daarvan de ten hoogste toelaatbare waarde van de geluidsbelasting, vanwege het industrieterrein, van de gevels
      vast, met dien verstande dat deze waarde 65 dB(A) niet te boven mag gaan. De gelding van een krachtens de vorige
      volzin vastgestelde waarde kan aan voorwaarden worden gebonden.

      3 Onze Minister doet van een besluit als bedoeld in het tweede lid mededeling aan gedeputeerde staten en aan
      burgemeester en wethouders. Gelijktijdig met deze kennisgeving deelt hij ten aanzien van elk der gevallen waarop
      bedoeld besluit betrekking heeft en die naar zijn aanvankelijk oordeel voor toepassing van het vierde lid in
      aanmerking komen, aan gedeputeerde staten en aan burgemeester en wethouders mede in hoeverre en op welke termijnen
      hij overweegt aan dat lid terzake toepassing te geven.

      4 Onze Minister stelt ten aanzien van elk der daarvoor in aanmerking komende gevallen maatregelen vast die
      strekken tot het terugbrengen van de geluidsbelasting, vanwege het industrieterrein, van de gevels van de betrokken
      woningen tot de bij het besluit, bedoeld in het tweede lid, vastgestelde waarde. Deze maatregelen strekken
      tevens, afhankelijk van de hoogte van deze waarde, tot het terugbrengen van de geluidsbelasting, vanwege het
      industrieterrein, binnen de woning. Op de door Onze Minister vastgestelde maatregelen zijn [artikel 125](onbekend)
      en [artikel 15.20, eerste lid, onder ][ref2] van toepassing. Hij doet van zijn besluit, houdende de vaststelling
      van maatregelen, mededeling aan gedeputeerde staten en aan burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15.20
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel72
