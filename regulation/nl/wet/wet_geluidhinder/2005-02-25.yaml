  - number: '158'
    text: |-
      1 Door of vanwege gedeputeerde staten worden de voor een goede uitvoering van de door deze wet aan het provinciaal
      bestuur opgedragen taken noodzakelijke geluidmetingen verricht en worden klachten behandeld, die betrekking hebben
      op het bij of krachtens deze wet bepaalde.

      2 Gedeputeerde staten oefenen op een daartoe strekkend verzoek de in het eerste lid omschreven taken mede uit ten
      behoeve van andere bestuursorganen die met de uitvoering van het bij of krachtens deze wet bepaalde dan wel met
      handhaving van de bij of krachtens deze wet strafbaar gestelde feiten zijn belast.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel158
  - number: '159'
    text: |-
      1 Provinciale staten dragen zorg dat met het oog op de in [artikel 158][ref1] omschreven taken een provinciale
      geluidhinderdienst functioneert die in elk geval een meetdienst en een klachtendienst omvat. De geluidhinderdienst
      kan uit regionaal werkende onderdelen samengesteld zijn.

      2 Provinciale staten stellen, de inspecteur gehoord, bij verordening regels vast betreffende de organisatie en de
      uitvoering van de in [artikel 158][ref2] omschreven taken.

      3 De in het tweede lid bedoelde verordening houdt in elk geval regels in, die betrekking hebben op:

      a. het adviseren van andere bestuursorganen ter zake van ingekomen klachten;

      b. de registratie van de ingekomen klachten en de verwerking van de uitkomsten van de behandeling daarvan;

      c. de regelmatige openbaarmaking van de onder *b* bedoelde gegevens.

      4 Tevens houdt de verordening in elk geval regels in, die bij de toepassing van [artikel 158, tweede lid][ref3], in
      acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel158
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel159
