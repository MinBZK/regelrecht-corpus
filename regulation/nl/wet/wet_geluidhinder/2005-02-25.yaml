  - number: '102'
    text: |-
      1 Ten behoeve van de vaststelling van de geluidsbelasting, vanwege een weg, stelt Onze Minister voor het bepalen
      van het equivalente geluidsniveau als omschreven in [artikel 1][ref1], regels, inhoudende op welke wijze en met
      inachtneming van welke bestaande of te verwachten omstandigheden, de afwisselende niveaus van het ter plaatse
      optredende geluid worden vastgesteld, en op welke wijze uit de over een bepaalde periode verkregen uitkomsten het
      in vorengenoemde omschrijving bedoelde gemiddelde wordt afgeleid.

      2 Onze Minister kan regels stellen omtrent de onderzoeken, bedoeld in dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel1
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '1'
        hoofdstuk: I
  - number: '103'
    text: |-
      Onze Minister kan bij toepassing van [artikel 102][ref1], telkens voor een bepaalde periode, al naar gelang de
      geluidproduktie van motorvoertuigen in de betrokken periode hoger ligt dan voor de toekomst redelijkerwijs is te
      verwachten, bepalen dat bij de berekening en meting van de geluidsbelasting van de gevel van woningen of van andere
      gebouwen dan woningen of andere geluidsgevoelige objecten op het resultaat een door hem aan te geven aftrek mag
      worden toegepast. Deze aftrek mag niet hoger zijn dan 5 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel102
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel103
