  - number: '2'
    text: |-
      1 In het belang van het voorkomen of beperken van geluidhinder kunnen bij algemene maatregel van bestuur regels
      worden gesteld omtrent:

      a. het vervaardigen, invoeren, in voorraad hebben, te koop aanbieden, afleveren of vervoeren van toestellen;

      b. het gebruiken van toestellen, anders dan in particuliere huishoudens.

      2 Hiertoe kunnen behoren regels, inhoudende:

      a. een verbod in het eerste lid genoemde handelingen, bij de maatregel aangewezen, met betrekking tot toestellen,
      behorende tot een bij de maatregel aangewezen categorie, te verrichten;

      b. een verbod zulks te doen zonder vergunning, verleend door een bij de maatregel aangewezen orgaan;

      c. een verbod zulks te doen indien de geluidproduktie van het toestel een hogere waarde heeft dan bij of krachtens
      de maatregel vastgesteld of het toestel anderszins niet voldoet aan de bij de maatregel gestelde eisen;

      d. een verbod zulks te doen indien het toestel niet behoort tot een type dat bij een keuring, verricht aan de hand
      van de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd;

      e. een verbod een toestel, behorende tot een bij de maatregel aangewezen categorie, te gebruiken indien niet het
      bewijs kan worden overgelegd dat het binnen een bij de maatregel bepaalde voorafgaande termijn bij een keuring,
      verricht aan de hand van de bij of krachtens de maatregel daartoe vastgestelde voorschriften, is goedgekeurd.

      3 In afwijking van het eerste lid kan het vaststellen van regels als in dat lid bedoeld ter uitvoering van voor
      Nederland verbindende verdragen en besluiten van volkenrechtelijke organisaties geschieden door Onze Minister in
      overeenstemming met Onze Ministers wie het mede aangaat. De [artikelen 3][ref1], [4][ref2], [5][ref3], [6][ref4]
      en [7][ref5] zijn van toepassing op een ministeriële regeling die ingevolge dit lid wordt vastgesteld.


