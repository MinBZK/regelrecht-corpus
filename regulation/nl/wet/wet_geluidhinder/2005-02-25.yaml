  - number: '65'
    text: |-
      De ten hoogste toelaatbare geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen die op het
      tijdstip van de vaststelling van een zone krachtens of met overeenkomstige toepassing van [artikel 53][ref1] binnen
      de zone aanwezig, in aanbouw of geprojecteerd zijn, is 55 dB(A), tenzij op dat tijdstip de geluidsbelasting van
      bedoelde woningen lager is dan of gelijk is aan 50 dB(A), in welk geval de ten hoogste toelaatbare geluidsbelasting
      50 dB(A) is. Het in de vorige volzin bepaalde geldt niet met betrekking tot binnen de zone aanwezige of in aanbouw
      zijnde woningen die op het bedoelde tijdstip reeds een hogere geluidsbelasting, vanwege het industrieterrein,
      ondervinden dan 55 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '53'
        hoofdstuk: V
        paragraaf: '1'
        afdeling: '2'
  - number: '66'
    text: |-
      Gedeputeerde staten kunnen in bij algemene maatregel van bestuur aan te geven gevallen en volgens daarbij te
      stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen en - ingeval de zone door
      hen wordt vastgesteld - uit eigen beweging, voor de ten hoogste toelaatbare geluidsbelasting van de gevels van
      de in [artikel 65][ref1] bedoelde woningen een hogere dan de in dat artikel genoemde waarde vaststellen, met dien
      verstande dat deze waarde voor wat geprojecteerde woningen betreft 55 dB(A) en voor wat aanwezige of in aanbouw
      zijnde woningen betreft 60 dB(A) niet te boven mag gaan. De [artikelen 47, tweede tot en met vierde lid][ref2], en
      [51][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel51
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel66
