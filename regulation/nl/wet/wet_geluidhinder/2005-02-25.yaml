  - number: '69'
    text: |-
      1 Bij de vaststelling of herziening van een bestemmingsplan dat geheel of gedeeltelijk betrekking heeft op gronden
      die krachtens die vaststelling of herziening gaan of blijven behoren tot een zone als bedoeld in § 1, worden
      ter zake van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere gebouwen
      dan woningen en van andere geluidsgevoelige objecten binnen de zone de waarden in acht genomen, die ingevolge
      [artikel 65][ref1], onderscheidenlijk [68, eerste lid][ref2], als de ten hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling of herziening van een bestemmingsplan als in dat lid
      bedoeld hogere waarden in acht genomen, voor zover:

      a. gedeputeerde staten met toepassing van [artikel 66][ref3], [67, eerste lid][ref4], of [68, tweede lid][ref5],
      voor de vaststelling of herziening van het bestemmingsplan zodanige waarden hebben vastgesteld, dan wel

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling of herziening van het plan in afwijking
      van het ontwerp, zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met
      toepassing van [artikel 66][ref6],[ 67, eerste lid][ref7], of [68, tweede lid][ref8], zullen worden vastgesteld.

      3 Gedeputeerde staten nemen bij de beslissing over de goedkeuring van een bestemmingsplan of de herziening
      hiervan dat geheel of gedeeltelijk betrekking heeft op gronden als bedoeld in het eerste lid ter zake
      van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere gebouwen
      dan woningen of van andere geluidsgevoelige objecten binnen de zone de waarden in acht, die ingevolge de
      [artikelen 65 tot en met 68][ref9] als de ten hoogste toelaatbare worden aangemerkt.

      4 Ter zake van de toepassing van het eerste lid is [artikel 62][ref10] van overeenkomstige toepassing.


