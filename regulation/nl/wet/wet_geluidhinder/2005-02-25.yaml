    text: |-
      Bij algemene maatregel van bestuur kunnen voor daarbij aan te wijzen andere geluidsgevoelige gebouwen en objecten
      met betrekking tot de in de [artikelen 111][ref1] en [112][ref2] geregelde onderwerpen overeenkomstige regels
      worden gesteld.


