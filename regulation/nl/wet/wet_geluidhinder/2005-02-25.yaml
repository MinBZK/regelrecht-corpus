  - number: '87'
    text: |-
      1 Gedeputeerde staten beslissen op een verzoek als bedoeld in [artikel 82a, eerste lid][ref1],
      [83, eerste lid][ref2], of [85][ref3], binnen dertien weken na de datum van ontvangst van het verzoek.

      2 Indien toepassing is gegeven aan [artikel 76, tweede lid, onder b][ref4], wordt het verzoek binnen vier weken na
      de dagtekening van het raadsbesluit tot vaststelling of herziening van het bestemmingsplan bij gedeputeerde staten
      ingediend. In afwijking van het eerste lid beslissen gedeputeerde staten op een verzoek als bedoeld in de eerste
      volzin voordat zij over de goedkeuring van het bestemmingsplan of de herziening hiervan beslissen.

      3 Een verzoek wordt geacht te zijn ingewilligd, indien gedeputeerde staten:

      a. niet binnen de in het eerste lid bedoelde termijn, of

      b. ingeval toepassing wordt gegeven aan het tweede lid, tweede volzin, niet uiterlijk tegelijk met het toezenden
      van de beslissing over de goedkeuring van het bestemmingsplan of de herziening hiervan,

      een besluit met betrekking tot het verzoek hebben bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
