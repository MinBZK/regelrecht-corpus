  - number: '115'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      **geluidsbelasting L**: geluidsbelasting op een plaats en vanwege een bron als omschreven in bijlage I, onderdeel
      1, van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van
      25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 07.00 tot
      19.00 uur, van 19.00 tot 23.00 uur en van 23.00 tot 07.00 uur van een jaar;

      **geluidsbelasting L**: geluidsbelasting op een plaats en vanwege een bron als omschreven in bijlage I, onderdeel
      2, van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de Europese Unie van
      25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 23.00 tot
      07.00 uur van een jaar;

      **hoofdspoorweg**: krachtens [artikel 2 van de Spoorwegwet][ref1] aangewezen hoofdspoorweg, niet zijnde een
      spoorwegemplacement;

      **verzameling van inrichtingen**:

      a. inrichtingen op een industrieterrein dat is gezoneerd krachtens [artikel 41][ref2], [53, eerste lid][ref3],
      [57, eerste lid][ref4] of [59, eerste lid][ref5];

      b. bij algemene maatregel van bestuur aangewezen inrichtingen, die zijn gelegen binnen een daarbij aangegeven
      gebied;

      **andere geluidsgevoelige gebouwen**: bij algemene maatregel van bestuur als zodanig aangewezen categorieën van
      andere gebouwen dan woningen;

      **geluidsgevoelige terreinen**: bij algemene maatregel van bestuur als zodanig aangewezen categorieën van
      terreinen;

      **stille gebieden**: bij algemene maatregel van bestuur of overeenkomstig de maatregel als zodanig aangewezen
      categorieën van gebieden.


