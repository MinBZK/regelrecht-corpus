        artikel: '82'
        hoofdstuk: VI
        paragraaf: '3'
        afdeling: '2'
  - number: '83'
    text: |-
      1 Onverminderd [artikel 82][ref1] kunnen gedeputeerde staten in bij algemene maatregel van bestuur aan te geven
      gevallen en volgens daarbij te stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen,
      voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, eerste lid][ref2], een
      hogere dan de in dat artikel genoemde waarde vaststellen, met dien verstande dat deze waarde, buiten de in de
      volgende leden bedoelde gevallen, voor woningen in buitenstedelijk gebied 55 dB(A) en voor woningen in stedelijk
      gebied 60 dB(A) niet te boven mag gaan.

      2 Bij toepassing van het eerste lid met betrekking tot in stedelijk gebied nog te bouwen woningen die nog niet zijn
      geprojecteerd, kan voor de aanwezige of te verwachten geluidsbelasting vanwege een aanwezige weg een hogere dan de
      in dat lid genoemde waarde worden vastgesteld, met dien verstande dat deze waarde 65 dB(A) niet te boven mag gaan.

      3 Bij toepassing van het eerste lid met betrekking tot woningen die reeds aanwezig of in aanbouw zijn, kan voor de
      toekomstige geluidsbelasting vanwege een weg die nog niet geprojecteerd is:

      a. voor zover het woningen in stedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 65 dB(A) niet te boven mag gaan;

      b. voor zover het woningen in buitenstedelijk gebied betreft, een hogere dan de in dat lid genoemde waarde worden
      vastgesteld, met dien verstande dat deze waarde 60 dB(A) niet te boven mag gaan.

      4 Bij toepassing van het eerste lid met betrekking tot in buitenstedelijk gebied nog te bouwen woningen die nog
      niet zijn geprojecteerd en die ter plaatse noodzakelijk zijn vanwege de uitoefening van een agrarisch bedrijf, kan
      een waarde worden vastgesteld die ten hoogste 5 dB(A) hoger is dan in dat lid is genoemd.

      5 Bij toepassing van het eerste lid met betrekking tot in het stedelijk gebied nog te bouwen woningen die nog niet
      zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of gebouwen waarvoor toepassing is gegeven
      aan [artikel 82, tweede lid][ref3], kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde
      van ten hoogste 70 dB(A) worden vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.

      6 Bij toepassing van het eerste lid met betrekking tot binnen de bebouwde kom nog te bouwen woningen binnen de zone
      langs een autoweg of autosnelweg als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref4], die
      nog niet zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of gebouwen waarvoor toepassing is
      gegeven aan [artikel 82, tweede lid][ref5], kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg
      een waarde van ten hoogste 65 dB(A) worden vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.

      7 Bij toepassing van het eerste lid met betrekking tot buiten de bebouwde kom nog te bouwen woningen die nog niet
      zijn geprojecteerd en die dienen ter vervanging van bestaande woningen of gebouwen waarvoor toepassing is gegeven
      aan [artikel 82, tweede lid][ref6], kan voor de te verwachten geluidsbelasting vanwege een aanwezige weg een waarde
      van ten hoogste 60 dB(A) worden vastgesteld, met dien verstande dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedebouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel82a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel82
