        hoofdstuk: VI
        afdeling: 2A
      - id: ref2
        bwb_id: BWBR0003227
        hoofdstuk: VI
  - number: '108'
    text: |-
      1 Bij algemene maatregel van bestuur kan een gebied waar ernstige geluidhinder optreedt of is te verwachten, welke
      niet of niet voldoende door toepassing van de voorgaande hoofdstukken kan worden bestreden, worden aangewezen als
      geluidszone. Ten aanzien van deze zone zijn de bepalingen van dit hoofdstuk van toepassing.

      2 Onze Minister doet van een maatregel als bedoeld in het eerste lid mededeling aan de raden der betrokken
      gemeenten en aan de staten der betrokken provincies.

      3 Een maatregel als bedoeld in het eerste lid kan niet betrekking hebben op het bestrijden van de geluidhinder
      vanwege luchtvaartterreinen waarop [artikel 25a van de Luchtvaartwet][ref1] of [hoofdstuk 8 van de Wet luchtvaart]
      (onbekend) van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel25a
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 25a
  - number: '109'
    text: |-
      Bij intrekking of wijziging van een algemene maatregel van bestuur als bedoeld in [artikel 108, eerste lid][ref1],
      is het tweede van dat artikel van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel108
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel109
