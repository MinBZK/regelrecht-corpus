  - number: 106e
    text: |-
      1 Behoudens het tweede en derde lid is de voor woningen binnen de zone van een te wijzigen landelijke spoorweg ten
      gevolge waarvan de landelijke spoorweg of de binnen het tracé van die landelijke spoorweg gelegen spoorwegen worden
      aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de landelijke spoorweg of vanwege binnen
      het tracé van die landelijke spoorweg gelegen spoorwegen, indien:

      a. de geluidsbelasting vanwege deze landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg
      gelegen spoorwegen op 1 juli 1987, van de gevel van deze woningen op dat tijdstip, onderscheidenlijk na
      ingebruikneming van deze landelijke spoorweg of spoorwegen lager was dan of gelijk was aan 65 dB(A), of

      b. deze landelijke spoorweg na 1 juli 1987 is aangelegd op grond van een krachtens [artikel 107][ref1] vastgesteld
      of herzien bestemmingsplan, of

      c. binnen de zone van die landelijke spoorweg gelegen spoorwegen na 1 juli 1987 zijn aangelegd op grond van een
      krachtens [artikel 107][ref2] vastgesteld of herzien bestemmingsplan,

      de voor de wijziging ter plaatse heersende geluidsbelasting, met dien verstande dat een geluidsbelasting waarvan de
      waarde 57 dB(A) niet te boven gaat, in elk geval als toelaatbaar aangemerkt blijft.

      2 In geval eerder krachtens deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege de
      betrokken landelijke spoorweg of spoorwegen is vastgesteld dan 57 dB(A), is de voor woningen binnen de zone van een
      te wijzigen landelijke spoorweg ten gevolge waarvan de landelijke spoorweg of binnen het tracé van die landelijke
      spoorweg gelegen spoorwegen worden aangepast, ten hoogste toelaatbare geluidsbelasting van de gevel, vanwege de
      landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen, de laagste van de
      volgende twee waarden:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.

      3 Onze Ministers kunnen een hogere dan de in het eerste of tweede lid bedoelde waarde vaststellen, met dien
      verstande dat deze de waarde 73 dB(A) niet te boven mag gaan.

      4 Onze Ministers kunnen slechts toepassing geven aan het derde lid in die gevallen waarin toepassing van
      maatregelen gericht op het terugbrengen van de verwachte geluidsbelasting van de gevel van de betrokken woningen,
      vanwege de landelijke spoorweg of vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen, tot de
      ingevolge het eerste of tweede lid geldende waarde, onvoldoende doeltreffend zal zijn, dan wel overwegende bezwaren
      ontmoet van stedenbouwkundige, verkeerskundige, landschappelijke of financiële aard.

      5 De in het eerste tot en met vierde lid gestelde regels zijn mede van toepassing binnen de zone van een aan te
      leggen landelijke spoorweg, vanwege binnen het tracé van die landelijke spoorweg gelegen spoorwegen.

      6 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van andere geluidsgevoelige gebouwen, met dien verstande dat in het eerste lid in
      plaats van «65 dB(A)» wordt gelezen «60 dB(A)» en in plaats van «de waarde 57 dB(A)» wordt gelezen: de waarde 55
      dB(A).

      7 De in het eerste tot en met vijfde lid gestelde regels zijn mede van toepassing met betrekking tot de ten hoogste
      toelaatbare geluidsbelasting van geluidsgevoelige terreinen, met dien verstande dat in het derde lid in plaats van
      «de waarde 73 dB(A)» wordt gelezen: de waarde indien het woonwagenstandplaatsen betreft 65 dB(A) en in de overige
      gevallen 68 dB(A).


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel107
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel106e
