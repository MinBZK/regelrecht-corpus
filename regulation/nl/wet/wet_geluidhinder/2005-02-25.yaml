  - number: '100'
    text: |-
      1 Behoudens het tweede lid en [artikel 100][ref1] geldt als de ten hoogste toelaatbare geluidsbelasting, vanwege
      een te reconstrueren weg, van de gevel van woningen binnen een zone, de voor de reconstructie ter plaatse heersende
      geluidsbelasting, met dien verstande dat een geluidsbelasting waarvan de waarde 50 dB(A) niet te boven gaat, in elk
      geval als toelaatbaar aangemerkt blijft.

      2 Ingeval eerder op grond van deze wet een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting, vanwege
      de te reconstrueren wet, van de gevel van woningen is vastgesteld dan 50 dB(A), geldt de laagste van de volgende
      twee waarden als de ten hoogste toelaatbare:

      a. de heersende waarde;

      b. de eerder vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel100a
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel100
