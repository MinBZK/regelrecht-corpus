      Bij een algemene maatregel van bestuur als bedoeld in [artikel 107][ref1] worden regels gegeven met betrekking tot
      de toerekening van de kosten welke voor de aanlegger of beheerder van de spoor- of tramweg of voor de gemeenten
      binnen de zone zijn verbonden aan maatregelen ter voldoening aan het bij of krachtens die maatregel bepaalde, en
      kan worden bepaald dat de kosten van maatregelen welke met instemming van Onze Minister worden getroffen, ten laste
      komen van het Rijk.


