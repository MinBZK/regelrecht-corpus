  - number: 69a
    text: |-
      1 Bij het nemen van een besluit tot vrijstelling als bedoeld in
      [artikel 19 van de Wet op de Ruimtelijke Ordening][ref1], dat geheel of gedeeltelijk betrekking heeft op gronden
      die behoren tot een zone als bedoeld in § 1, worden ter zake van de geluidsbelasting, vanwege het industrieterrein,
      van de gevel van woningen, van andere gebouwen dan woningen en van andere geluidsgevoelige objecten binnen de zone,
      de waarden in acht genomen, die ingevolge de [artikelen 65 tot en met 68][ref2] als de ten hoogste toelaatbare
      worden aangemerkt.

      2 Gedeputeerde staten nemen bij hun beslissing over het verlenen van een verklaring van geen bezwaar ten behoeve
      van het nemen van een besluit als bedoeld in het eerste lid, het bepaalde in dat lid in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel65
