  - number: '127'
    text: |-
      In geval van reconstructie van een weg komen de kosten van de maatregelen, vastgesteld krachtens Afdeling 4 van
      hoofdstuk VI, voor zover deze kosten verband houden met de reconstructie, ten laste van de wegaanlegger.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel127
  - number: 127a
    text: |-
      1 In geval van de aanleg, wijziging of verbreding van een hoofdweg als bedoeld in
      [afdeling 2a van hoofdstuk VI][ref1], komen de kosten van maatregelen gericht op het terugbrengen van de verwachte
      geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, vastgesteld krachtens de [Tracéwet][ref2], voor zover deze kosten verband houden met
      de aanleg of wijziging, ten laste van de wegaanlegger.

      2 In geval van de aanleg of wijziging van een landelijke spoorweg als bedoeld in
      [afdeling 2 van hoofdstuk VII][ref3], komen kosten van maatregelen gericht op het terugbrengen van de verwachte
      geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen, onderscheidenlijk aan de grens van
      geluidsgevoelige terreinen, vastgesteld krachtens de [Tracéwet][ref4], voor zover deze kosten verband houden met
      de aanleg of wijziging, ten laste van de spoorwegaanlegger.

      3 [Artikel 126a, derde lid][ref5], is van overeenkomstige toepassing.


