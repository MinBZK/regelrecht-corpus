  - number: '59'
    text: |-
      1 Indien op 1 juli 1993 geen zone krachtens of met overeenkomstige toepassing van [artikel 53][ref1] is
      vastgesteld, bevindt zich rond de betrokken terreinen een zone, waarbuiten de geluidsbelasting vanwege die
      terreinen de waarde van 50 dB(A) niet te boven mag gaan.

      2 De in het eerste lid bedoelde zone omvat het gebied waarbinnen op 1 juli 1993 een hogere geluidsbelasting,
      vanwege het industrieterrein, dan 50 dB(A) optreedt.

      3 Een zone als bedoeld in het eerste lid wordt voor de toepassing van Afdeling 2, paragraaf 4, en
      [hoofdstuk X][ref2], paragraaf 1, gelijkgesteld met een zone rond een industrieterrein, die is vastgesteld
      krachtens of met overeenkomstige toepassing van [artikel 53][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukX
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel53
