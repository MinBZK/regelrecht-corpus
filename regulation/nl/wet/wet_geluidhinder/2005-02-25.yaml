        afdeling: '1'
  - number: '51'
    text: |-
      Bij toepassing van [artikel 47, eerste lid][ref1], kan de gelding van een daarbij vastgestelde waarde aan
      voorwaarden worden gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel51
    references:
