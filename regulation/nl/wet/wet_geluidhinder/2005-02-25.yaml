  - number: '71'
    text: |-
      1 Burgemeester en wethouders zijn gehouden na een ingesteld akoestisch onderzoek aan gedeputeerde staten de
      binnen de gemeente voorkomende gevallen te melden, waarin op het tijdstip van de vaststelling van een zone
      krachtens of met overeenkomstige toepassing van [artikel 53][ref1], de geluidsbelasting van de gevel, vanwege het
      industrieterrein, van binnen de zone aanwezige of in aanbouw zijnde woningen hoger is dan 55 dB(A). Een afschrift
      van deze kennisgeving wordt aan Onze Minister toegezonden.

      2 Gedeputeerde staten stellen, na overleg met het gemeentebestuur, met inachtneming van de regels,
      gegeven krachtens het derde lid, en gelet op de maatregelen, in verband met andere woningen binnen de
      zone voortvloeiend uit de toepassing van Afdeling 2, §§ 2 en 3, van dit hoofdstuk, een programma op van
      maatregelen die naar hun oordeel in aanmerking komen om de geluidsbelasting, vanwege het industrieterrein,
      van de gevels van de in het eerste lid bedoelde woningen te beperken tot 55 dB(A) en te voldoen aan het in
      [artikel 111, eerste lid, onder ][ref2], bepaalde. Bij algemene maatregel van bestuur kan worden bepaald dat tevens
      één of meer overeenkomstige programma’s dienen te worden opgesteld, onderscheidenlijk gericht op een beperking van
      de geluidsbelasting van de gevels van de bedoelde woningen tot bij de maatregel aangegeven hogere waarden.

      3 Bij algemene maatregel van bestuur worden regels gegeven omtrent de aard van de maatregelen die in aanmerking
      komen en de omstandigheden waaronder dit het geval is, alsmede met betrekking tot de opzet van een programma als
      bedoeld in het tweede lid, en het tijdstip van uitvoering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel111
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel71
