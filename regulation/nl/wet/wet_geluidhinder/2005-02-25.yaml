  - number: '80'
    text: |-
      1 Vanwege de wegaanlegger wordt binnen de zone een akoestisch onderzoek van de in [artikel 77][ref1] omschreven
      strekking ingesteld.

      2 De resultaten van het ingestelde onderzoek worden door de wegaanlegger aan burgemeester en wethouders
      overgelegd te zamen met een beschrijving van de maatregelen die naar zijn oordeel nodig zijn voor het in
      [artikel 81, eerste lid][ref2], omschreven doel.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel77
