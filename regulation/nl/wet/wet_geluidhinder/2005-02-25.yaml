        afdeling: '1'
  - number: '48'
    text: |-
      1 Bij wijziging van een zone of bij herziening van een bestemmingsplan, geldende voor tot de zone behorende
      gronden, kunnen gedeputeerde staten in bij algemene maatregel van bestuur aan te geven gevallen en volgens
      daarbij te stellen regels, op verzoek van degenen die daartoe bij de maatregel zijn aangewezen en - ingeval de
      zone door hen wordt gewijzigd of het bestemmingsplan door hen wordt herzien - uit eigen beweging de ingevolge
      [artikel 46][ref1] of [47][ref2] geldende waarde voor woningen in dat gebied met ten hoogste 5 dB(A) verhogen, met
      dien verstande dat:

      a. degene ten behoeve van wie de waarde wordt verhoogd heeft verklaard dat hij uiterlijk gelijktijdig met de
      verhoging financiële middelen ter beschikking stelt ten behoeve van de toepassing van maatregelen als bedoeld in
      [artikel 71, tweede lid][ref3], met betrekking tot woningen die door de wijziging van de zone of herziening van het
      bestemmingsplan een hogere geluidsbelasting ondervinden, en

      b. de waarde wat ten tijde van de eerste zonevaststelling geprojecteerde woningen betreft 55 dB(A) en wat ten tijde
      van de eerste zonevaststelling aanwezige of in aanbouw zijnde woningen betreft 60 dB(A) niet te boven mag gaan.

      2 [Artikel 47, tweede tot en met vierde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel47
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel48
