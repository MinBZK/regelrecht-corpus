  - number: '107'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder vanwege spoorwegen, niet zijnde landelijke spoorwegen
      of waarvoor geen regels zijn gesteld in [hoofdstuk VI, afdeling 2a][ref1], kunnen bij of krachtens algemene
      maatregel van bestuur omtrent de onderwerpen die ter beperking van de geluidsbelasting vanwege wegen geregeld zijn
      in [hoofdstuk VI][ref2], regels worden gesteld. Daarbij kunnen bepalingen van dat hoofdstuk van overeenkomstige
      toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel107
