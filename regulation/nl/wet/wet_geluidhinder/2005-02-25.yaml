        artikel: '158'
        hoofdstuk: XIII
        paragraaf: '3'
  - number: '163'
    text: |-
      1 Bij algemene maatregel van bestuur kan worden bepaald:

      a. dat bij het van overheidswege verrichten van geluidmetingen, niet zijnde metingen als bedoeld in
      [hoofdstuk V][ref1], [VI][ref2], [VII][ref3], [VIII][ref4] of [VIII A][ref5], de bij de maatregel gestelde regels
      moeten worden in acht genomen;

      b. dat bij de maatregel aangewezen besturen van provincies, gemeenten, andere openbare lichamen of
      gemeenschappelijke organen als bedoeld in [artikel 8 van de Wet gemeenschappelijke regelingen][ref6] gehouden zijn
      in hun gezagsgebied met inachtneming van de bij de maatregel gestelde regels metingen als bedoeld onder *a* te
      verrichten of mede te werken aan zodanige metingen die van Rijkswege worden verricht.

      2 Regels als bedoeld in het eerste lid, onder *a* en *b*, kunnen onder meer betrekking hebben op:

      a. de dichtheid van het net van meetpunten;

      b. de frequentie van de metingen;

      c. de toe te passen meetmethoden;

      d. het doen van weerkundige waarnemingen;

      e. de verwerking en registratie van de uitkomsten van metingen;

      f. de terbeschikkingstelling van uitkomsten en de verstrekking van inlichtingen daaromtrent aan bij de maatregel
      aangewezen bestuursorganen.

      3 De uitkomsten van de van Rijkswege verrichte metingen worden door Onze Minister, en de uitkomsten van de
      metingen, verricht op grond van het krachtens het eerste lid, onder *b*, bepaalde, worden door het bestuursorgaan
      dat die metingen heeft verricht, overeenkomstig bij algemene maatregel van bestuur gestelde regels voor ieder
      bereikbaar gemaakt.

      4 Onze Minister kan omtrent het krachtens de voorgaande leden geregelde onderwerp nadere regels stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref3]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVII
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII
      [ref5]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIII_A
      [ref6]: https://wetten.overheid.nl/BWBR0003740#Artikel8
