        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '176'
    text: |-
      Alle - anders dan met toepassing van de [Wet milieubeheer][ref1] of de [Algemene wet bestuursrecht][ref2] -
      krachtens de onderhavige wet ter inzage te leggen, te publiceren of aan belanghebbenden toe te zenden stukken, die
      in een vreemde taal zijn gesteld en waarbij niet een vertaling in de Nederlandse taal wordt gevoegd, of die wegens
      hun omvang, hun inhoud dan wel om andere redenen niet geacht kunnen worden voor de beoordeling ervan voldoende
      inzicht te geven aan een algemeen publiek, gaan vergezeld van een in de Nederlandse taal gestelde samenvatting.
      Onze Minister kan nadere regels geven over de wijze waarop deze samenvatting dient te worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0005537
  - number: '180'
    text: |-
      De bevoegdheid van gemeenten en van waterschappen, veenschappen en veenpolders tot het maken van verordeningen
      blijft ten aanzien van het onderwerp waarin deze wet voorziet, gehandhaafd voorzover deze verordeningen niet met
      het bij of krachtens deze wet bepaalde in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2005-02-25#Artikel180
  - number: '182'
    text: |-
      1 Bij algemene maatregel van bestuur wordt voor de gevallen waarin een algemene maatregel van bestuur krachtens
      [artikel 41][ref1] in werking treedt, ten aanzien van daarbij aangewezen categorieën van inrichtingen bepaald
      binnen welke termijn moet worden voorzien in de vaststelling van een zone rond terreinen met een bestemming die de
      mogelijkheid insluit van vestiging van inrichtingen die tot die categorieën behoren.

      2 Het in het eerste lid bepaalde geldt niet met betrekking tot terreinen waaromheen op het tijdstip van het in
      werking treden van de wijziging reeds een zone krachtens of met overeenkomstige toepassing van [artikel 41][ref2]
      of [53][ref3] is tot stand gekomen of ten aanzien waarvan op dat tijdstip reeds een verplichting tot
      zonevaststelling op grond van genoemde artikelen van kracht is.

      3 Ter zake van zones als bedoeld in het eerste lid is Afdeling 2 van hoofdstuk V van overeenkomstige toepassing,
      tenzij bij de maatregel krachtens het eerste lid anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel53
