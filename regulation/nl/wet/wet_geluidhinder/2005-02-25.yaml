  - number: '111'
    text: |-
      1 Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting, vanwege
      een industrieterrein, als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot de
      geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste bedraagt:

      a. ingeval met toepassing van [artikel 72, tweede lid][ref1], een hogere geluidsbelasting dan 55 dB(A) als de ten
      hoogste toelaatbare is vastgesteld: 40 dB(A);

      b. in andere gevallen: 35 dB(A).

      2 Indien met betrekking tot gevels van in aanbouw zijnde of aanwezige woningen een hogere geluidsbelasting dan 50
      dB(A), vanwege een weg, als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad met betrekking tot
      de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de woning bij gesloten
      ramen ten hoogste bedraagt:

      a. ingeval het een weg betreft die na 1 januari 1982 is aangelegd en is opgenomen in een overeenkomstig de
      [artikelen 76][ref2] en [77][ref3] vastgesteld bestemmingsplan, dan wel na dat tijdstip ingevolge een besluit,
      genomen met toepassing van de [artikelen 79 tot en met 81][ref4], is aangelegd: 35 dB(A);

      b. ingeval het een weg betreft, niet bedoeld onder *a*, die op 1 maart 1986 in aanleg of geprojecteerd was: 40
      dB(A).

      3 Ingeval op 1 maart 1986 een weg, niet bedoeld onder *a* van het tweede lid, en woningen aanwezig waren en,
      met toepassing van [artikel 90, tweede lid][ref5], met betrekking tot de gevels van de woningen een hogere
      geluidsbelasting dan 50 dB(A), vanwege de weg, als de ten hoogste toelaatbare is vastgesteld, treft de gemeenteraad
      met betrekking tot de geluidwering van die gevels maatregelen om te bevorderen dat de geluidsbelasting binnen de
      woning bij gesloten ramen ten hoogste 45 dB(A) bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel79
      [ref5]: https://wetten.overheid.nl/BWBR0003227#Artikel90
