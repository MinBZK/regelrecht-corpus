  - number: '81'
    text: |-
      1 Binnen zes maanden nadat de resultaten van het in [artikel 80][ref1] bedoelde onderzoek zijn verkregen, neemt
      de gemeenteraad, tenzij hij burgemeester en wethouders hiertoe bevoegd heeft verklaard, een besluit, bepalende
      welke maatregelen nodig zijn om te voorkomen dat de geluidsbelasting die de weg na zijn aanleg binnen de zone zal
      veroorzaken, de waarden die ingevolge de [artikelen 82][ref2], [82a][ref3], [83][ref4] en [85][ref5] als de ten
      hoogste toelaatbare worden aangemerkt, te boven zou gaan.

      2 Van het besluit wordt mededeling gedaan aan de wegaanlegger.


