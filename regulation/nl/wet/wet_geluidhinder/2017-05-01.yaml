  - number: 1c
    text: |-
      1 De bevoegdheid tot afwijking van een milieukwaliteitsnorm op grond van
      [artikel 2 van de Interimwet stad-en-milieubenadering][ref1] bestaat voor de onderhavige wet slechts voor zover
      het de maximale waarde betreft die bij of krachtens deze wet als de ten hoogste toelaatbare geluidsbelasting kan
      worden vastgesteld.

      2 [Artikel 5, eerste lid, onder c, van de Interimwet stad-en-milieubenadering][ref2] wordt zo toegepast dat
      per woning, ander geluidsgevoelig gebouw of geluidsgevoelig terrein de in het eerste lid bedoelde waarde wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel5
