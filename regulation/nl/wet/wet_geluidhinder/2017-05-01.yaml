  - number: '163'
    text: |-
      1 Burgemeester en wethouders van de gemeente waarin een industrieterrein geheel of in hoofdzaak is gelegen zorgen
      ervoor dat er voldoende informatie beschikbaar is over de geluidsruimte binnen de zone.

      2 Het eerste lid is niet van toepassing op industrieterreinen van regionaal belang die zijn aangewezen bij
      provinciale verordening krachtens de [Wet milieubeheer][ref1] of de [Wet ruimtelijke ordening][ref2]. In dat geval
      dragen gedeputeerde staten voor de in het eerste lid genoemde taken zorg.

      3 Het eerste lid is niet van toepassing wanneer burgemeester en wethouders in overeenstemming met gedeputeerde
      staten besluiten dat gedeputeerde staten voor de in het eerste lid genoemde taken zorgdragen.

      4 Het eerste tot en met derde lid is niet van toepassing op industrieterreinen waarop zich inrichtingen bevinden
      als bedoeld in [artikel 170, eerste lid][ref3]. Voor die industrieterreinen draagt Onze Minister voor de in het
      eerste lid genoemde taken zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0020449
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel170
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel163
    references:
