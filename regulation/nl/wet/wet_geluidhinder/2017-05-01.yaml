        artikel: '170'
        hoofdstuk: XV
  - number: '164'
    text: |-
      Ter vervulling van de in [artikel 163][ref1] bedoelde taak kan een zonebeheerplan worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel163
