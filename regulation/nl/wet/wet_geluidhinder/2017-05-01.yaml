  - number: 104a
    text: |-
      1 Indien de aanleg of wijziging van een hoofdweg waarop de [Tracéwet][ref1] van toepassing is, leidt tot aanleg,
      reconstructie of wijziging van een weg of spoorweg, en daartoe binnen het betrokken tracé een hogere waarde vereist
      is voor de ten hoogste toelaatbare geluidsbelasting vanwege die weg of spoorweg, zijn de [artikelen 79][ref2] en
      [99, eerste lid][ref3], niet van toepassing en wordt door Onze Minister:

      a. die hogere waarde, in afwijking van [artikel 110a, eerste, tweede en zevende lid][ref4], vastgesteld als
      onderdeel van het tracébesluit, en

      b. het akoestisch onderzoek, bedoeld in [artikel 77][ref5], dan wel als voorgeschreven op grond van
      [artikel 107][ref6], ingesteld.

      2 Indien de uitvoering van een in de [bijlage bij de Spoedwet wegverbreding](onbekend), onder A, opgenomen
      wegaanpassingsproject, leidt tot aanleg, reconstructie of wijziging van een weg of spoorweg, en daartoe binnen de
      grens van het gebied dat is begrepen in een wegaanpassingsbesluit een hogere waarde vereist is voor de ten hoogste
      toelaatbare geluidsbelasting vanwege die weg of spoorweg, zijn de [artikelen 79][ref7] en [99, eerste lid,][ref8]
      niet van toepassing en wordt door Onze Minister:

      a. die hogere waarde, in afwijking van [artikel 110a, eerste, tweede en zevende lid][ref9], vastgesteld als
      onderdeel van het wegaanpassingsbesluit, en

      b. het akoestisch onderzoek, bedoeld in [artikel 77][ref10], dan wel als voorgeschreven op grond van
      [artikel 107][ref11], ingesteld.

      3 Indien een in de [bijlage bij de Spoedwet wegverbreding](onbekend), onder B, opgenomen wegaanpassingsproject,
      leidt tot aanleg, reconstructie of wijziging van een weg of spoorweg, en daartoe binnen de grens van het gebied dat
      is begrepen in een geluidplan een hogere waarde vereist is voor de ten hoogste toelaatbare geluidsbelasting vanwege
      die weg of spoorweg, zijn de [artikelen 79][ref12] en [99, eerste lid][ref13], niet van toepassing en wordt door
      Onze Minister:

      a. die hogere waarde, in afwijking van [artikel 110a, eerste, tweede en zevende lid][ref14], vastgesteld als
      onderdeel van het geluidplan, en

      b. het akoestisch onderzoek, bedoeld in [artikel 77][ref15], dan wel als voorgeschreven op grond van
      [artikel 107][ref16], ingesteld.

      4 Indien toepassing wordt gegeven aan het eerste lid, wordt:

      a. in [artikel 83, eerste lid][ref17], voor «53 dB» gelezen: 58 dB;

      b. in [artikel 110a, zesde lid][ref18], in plaats van «geven burgemeester en wethouders» gelezen «geeft Onze
      Minister» en wordt in plaats van «naar hun oordeel» gelezen «naar zijn oordeel»;

      c. in [artikel 110b, eerste lid][ref19], in plaats van «kunnen burgemeester en wethouders» gelezen «kan Onze
      Minister»;

      d. in [artikel 110b, tweede lid][ref20], in plaats van «kunnen gedeputeerde staten» gelezen «kan Onze Minister»;

      e. in [artikel 111b][ref21] in plaats van «treffen burgemeester en wethouders» gelezen «treft de beheerder», en

      f. in [artikel 112][ref22] in plaats van «treffen burgemeester en wethouders» gelezen «treft Onze Minister»;

      g. in [artikel 114a, tweede lid, onderdeel c][ref23], in plaats van «burgemeester en wethouders aan de
      rechthebbende mededeling doen» gelezen «Onze Minister aan de rechthebbende mededeling doet».

      5 Bij de toepassing van het eerste tot en met derde lid neemt het bevoegd gezag een maatregel gericht op het
      terugbrengen van de verwachte geluidsbelasting van de gevel van woningen of andere geluidsgevoelige gebouwen, niet
      in aanmerking, indien het treffen daarvan:

      a. financieel niet doelmatig is met betrekking tot het beperken van de geluidsbelasting, dan wel

      b. stuit op overwegende bezwaren van stedenbouwkundige, verkeerskundige, vervoerskundige, landschappelijke of
      technische aard.

      Onze Minister stelt regels voor de toepassing van het criterium, bedoeld onder a.


