  - number: 100b
    text: |-
      Bij algemene maatregel van bestuur kunnen voor andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      overeenkomstige regels worden gesteld met betrekking tot de onderwerpen die zijn geregeld in:

      a. [artikel 100][ref1];

      b. [artikel 100a][ref2].


