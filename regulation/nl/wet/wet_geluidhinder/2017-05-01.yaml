$id: wet_geluidhinder
regulatory_layer: WET
publication_date: '2015-04-16'
valid_from: '2017-05-01'
bwb_id: BWBR0003227
url: https://wetten.overheid.nl/BWBR0003227/2017-05-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het belang van de bescherming van het milieu en van de
    volksgezondheid noodzakelijk is regels te stellen inzake het voorkomen of beperken van geluidhinder;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      *ander geluidsgevoelig gebouw*: bij algemene maatregel van bestuur als zodanig aangewezen gebouw,
      niet zijnde een woning, dat vanwege de bestemming daarvan bijzondere bescherming tegen geluid behoeft,
      waarbij wat betreft de bestemming wordt uitgegaan van het gebruik dat is toegestaan op grond van het
      bestemmingsplan, de beheersverordening, bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref1], of,
      indien met toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref2]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning, bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref3];

      *bebouwde kom*: bebouwde kom, vastgesteld krachtens de [Wegenverkeerswet 1994](onbekend);

      *bestemmingsplan*: bestemmingsplan als bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref4], een
      inpassingsplan als bedoeld in [artikel 3.26][ref5] of [3.28 van die wet][ref6] hieronder mede begrepen;

      *buitenstedelijk gebied*: gebied buiten de bebouwde kom alsmede, voor de toepassing van de
      [hoofdstukken VI][ref7] en [VII][ref8] voor zover het betreft een autoweg of autosnelweg als bedoeld in het
      [Reglement verkeersregels en verkeerstekens 1990][ref9], het gebied binnen de bebouwde kom, voor zover liggend
      binnen de zone langs die autoweg of autosnelweg;

      *equivalent geluidsniveau*: gemiddelde – te bepalen op een door Onze Minister krachtens toepassing van
      [artikel 110d][ref10] aangegeven wijze – van de afwisselende niveaus van het ter plaatse in de loop van een
      bepaalde periode optredende geluid, vastgesteld volgens de door Onze Minister krachtens toepassing van dat artikel
      gestelde regels;

      *etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een industrieterrein*: hoogste van de
      volgende drie waarden:

      1°. de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dag);

      2°. de met 5 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 19.00–23.00 uur (avond);

      3°. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur (nacht);

      *etmaalwaarde van het equivalente geluidsniveau in dB(A) met betrekking tot een weg*: hoogste van de volgende twee
      waarden:

      1°. de waarde van het equivalente geluidsniveau over de periode 07.00–19.00 uur (dag);

      2°. de met 10 dB(A) verhoogde waarde van het equivalente geluidsniveau over de periode 23.00–07.00 uur (nacht);

      *geluid*: met het menselijk oor waarneembare luchttrillingen;

      *geluidhinder*: gevaar, schade of hinder, als gevolg van geluid;

      *geluidplafondkaart*: kaart met daarop aangegeven de wegen en spoorwegen, alsmede de geprojecteerde wegen en
      spoorwegen, waarop [titel 11.3 van de Wet milieubeheer][ref11] en de daarop berustende bepalingen van toepassing
      zijn;

      *geluidsbelasting binnen een woning*: geluidsbelasting binnen een geluidsgevoelige ruimte;

      *geluidsbelasting in dB(A) vanwege een industrieterrein*: etmaalwaarde van het equivalente geluidsniveau in dB(A)
      op een bepaalde plaats, veroorzaakt door de gezamenlijke inrichtingen op een industrieterrein;

      *geluidsbelasting in dB(A) vanwege een weg*: etmaalwaarde van het equivalente geluidsniveau in dB(A) op een
      bepaalde plaats, veroorzaakt door het gezamenlijke wegverkeer op een bepaald weggedeelte of een combinatie van
      weggedeelten;

      *geluidsbelasting in dB*: op een geheel getal af te ronden geluidsbelasting in L op een plaats en vanwege een bron
      over alle perioden van 07.00–19.00 uur, van 19.00–23.00 uur en van 23.00–07.00 uur van een jaar als omschreven in
      bijlage I, onderdeel 1, van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees Parlement en de Raad van de
      Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189);

      *geluidsbelasting L*: geluidsbelasting op een plaats en vanwege een bron over alle perioden van 23.00–07.00 uur
      van een jaar als omschreven in bijlage I, onderdeel 2, van [richtlijn nr. 2002/49/EG](32002L0049) van het Europees
      Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai
      (PbEG L 189);

      *geluidsgevoelige ruimte*: ruimte binnen een woning voor zover die kennelijk als slaap-, woon-, of eetkamer wordt
      gebruikt of voor een zodanig gebruik is bestemd, alsmede een keuken van ten minste 11 m2;

      *geluidsgevoelig terrein*: bij algemene maatregel van bestuur als zodanig aangewezen terrein dat
      vanwege de bestemming daarvan bijzondere bescherming tegen geluid behoeft, waarbij wat betreft de
      bestemming wordt uitgegaan van het gebruik dat is toegestaan op grond van het bestemmingsplan, de
      beheersverordening, bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref12], of, indien
      met toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref13]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning, bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref14];

      *geluidsniveau in dB(A)*: gemeten of berekende geluidsniveau, uitgedrukt in dB(A) overeenkomstig de door de
      Internationale Electrotechnische Commissie terzake opgestelde regels;

      *geluidsvermogen*: hoeveelheid geluidsenergie die door een toestel of inrichting per tijdseenheid naar de omgevende
      lucht kan worden uitgestraald;

      *geprojecteerde weg*: nog niet in aanleg zijnde weg, in de aanleg waarvan door een geldend bestemmingsplan wordt
      voorzien;

      *geprojecteerde woning of gebouw*: nog niet aanwezige woning of nog niet aanwezig gebouw, waarvoor het
      geldende bestemmingsplan verlening van de omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref15] toelaat, maar deze nog
      niet is afgegeven;

      *gevel*: bouwkundige constructie die een ruimte in een woning of gebouw scheidt van de buitenlucht, daaronder
      begrepen het dak;

      *hoofdspoorweg*: krachtens [artikel 2 van de Spoorwegwet][ref16] aangewezen hoofdspoorweg, niet zijnde een
      spoorwegemplacement;

      *hoofdweg*: een weg waarvoor een verbinding is aangegeven op een kaart van indicatieve
      en limitatieve hoofdwegverbindingen, die behoort tot een structuurvisie als bedoeld in
      [artikel 2.3 van de Wet ruimtelijke ordening][ref17];

      *industrieterrein:* terrein waaraan in hoofdzaak een bestemming is gegeven voor de vestiging van inrichtingen en
      waarvan de bestemming voor het gehele terrein of een gedeelte daarvan de mogelijkheid insluit van vestiging van
      inrichtingen, behorende tot een bij algemene maatregel van bestuur aan te wijzen categorie van inrichtingen, die in
      belangrijke mate geluidhinder kunnen veroorzaken;

      *inrichting*: inrichting als aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref18];

      *inspecteur*: als zodanig bij besluit van Onze Minister aangewezen ambtenaar;

      *internationaal racecircuit:* TT-Circuit Assen, Circuit Park Zandvoort of een ander bij ministeriële regeling
      aan te wijzen verhard circuit voor het houden van grootschalige internationale wedstrijden voor gemotoriseerde
      voertuigen;

      *motorvoertuig*: motorvoertuig als bedoeld in het [Reglement verkeersregels en verkeerstekens 1990][ref19];

      *NEN*: door de Stichting Nederlands Normalisatie-instituut uitgegeven norm;

      *Onze Minister*: Onze Minister van Infrastructuur en Milieu;

      *reconstructie van een weg*: een of meer wijzigingen op of aan een aanwezige weg ten gevolge waarvan uit akoestisch
      onderzoek als bedoeld in [artikel 77, eerste lid, onder a][ref20], en [artikel 77, derde lid][ref21], blijkt dat
      de berekende geluidsbelasting vanwege de weg in het toekomstig maatgevende jaar zonder het treffen van maatregelen
      ten opzichte van de geluidsbelasting die op grond van [artikel 100][ref22] dan wel het bepaalde krachtens
      [artikel 100b, aanhef en onder a][ref23], als de ten hoogste toelaatbare geluidsbelasting geldt met 2 dB of meer
      wordt verhoogd;

      *rijstrook*: strook van de rijbaan van een weg, welke voldoende plaats biedt aan een enkele rij rijdende
      motorvoertuigen op meer dan drie wielen, of, indien door middel van markering een bredere strook als rijstrook is
      aangegeven, die strook;

      *spoorweg*: spoorweg als bedoeld in [artikel 1 van de Spoorwegwet][ref24];

      *stedelijk gebied*: gebied binnen de bebouwde kom, doch, voor de toepassing van de [hoofdstukken VI][ref25]
      en [VII][ref26] voor zover het betreft een autoweg of autosnelweg als bedoeld in het
      [Reglement verkeersregels en verkeerstekens 1990][ref27], met uitzondering van het gebied binnen de bebouwde kom,
      voor zover liggend binnen de zone langs die autoweg of autosnelweg;

      *toestel*: toestel dat bij gebruik anders dan door menselijke energie geluidhinder kan veroorzaken, een
      luchtvaartuig daaronder niet begrepen;

      *tracébesluit*: tracébesluit als bedoeld in de [Tracéwet][ref28];

      *vaststellen van een bestemmingsplan*: vaststellen of herzien van een bestemmingsplan;

      *weg*: voor het openbaar rij- of ander verkeer openstaande weg of openstaand pad, met inbegrip van de
      daarin liggende bruggen of duikers, alsmede een spoorweg die niet is aangegeven op de kaart, bedoeld in
      [artikel 106][ref29], of de geluidplafondkaart;

      *wegaanlegger*: opdrachtgever tot aanleg of reconstructie van een weg;

      *weg in aanleg*: weg met de aanleg waarvan een begin van uitvoering is gemaakt;

      *woning*: gebouw of gedeelte van een gebouw waar bewoning is toegestaan op grond van het bestemmingsplan,
      de beheersverordening, bedoeld in [artikel 3.38 van de Wet ruimtelijke ordening][ref30], of, indien
      met toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref31]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning, bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref32];

      *woning of gebouw in aanbouw*: nog niet aanwezige woning of nog niet aanwezig
      gebouw, waarvoor de omgevingsvergunning voor een bouwactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref33] is afgegeven.


