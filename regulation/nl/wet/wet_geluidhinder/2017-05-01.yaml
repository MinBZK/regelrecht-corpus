  - number: '47'
    text: |-
      1 Bij algemene maatregel van bestuur worden waarden vastgesteld voor de ten hoogste toelaatbare geluidsbelasting,
      vanwege het industrieterrein, van de gevel van andere geluidsgevoelige gebouwen alsmede aan de grens van
      geluidsgevoelige terreinen binnen een zone.

      2 Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting, bedoeld in het eerste lid, kunnen hogere dan de
      krachtens het eerste lid bepaalde waarden worden vastgesteld, met dien verstande dat deze waarden bij algemene
      maatregel van bestuur te stellen grenzen niet te boven mogen gaan.

      3 Bij de maatregel, bedoeld in het tweede lid, kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid,
      enkel in bij die maatregel aan te geven gevallen kan worden toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel47
  - number: '48'
    text: |-
      1 Bij de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of gedeeltelijk
      betrekking heeft op gronden die krachtens die vaststelling gaan of blijven behoren tot een zone, worden ter zake
      van de geluidsbelasting, vanwege het industrieterrein, van de gevel van woningen, van andere geluidsgevoelige
      gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone de waarden in acht genomen, die ingevolge
      [artikel 44][ref2], onderscheidenlijk [47, eerste lid][ref3], als de ten hoogste toelaatbare worden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan als in dat lid bedoeld hogere waarden in acht genomen, voor zover:

      a. eerder bij of krachtens [artikel 45][ref4], [46][ref5], [47, tweede lid][ref6], de
      [Experimentenwet Stad en Milieu][ref7] of de [Interimwet stad-en-milieubenadering][ref8] voor de vaststelling van
      het bestemmingsplan of het wijzigings- of uitwerkingsplan zodanige waarden zijn vastgesteld;

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling van het plan in afwijking van het ontwerp,
      zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met toepassing van de
      [artikelen 45][ref9], [46][ref10] of [47, tweede lid][ref11], zullen worden vastgesteld.

      3 De [artikelen 42][ref12] en [43][ref13] zijn van overeenkomstige toepassing in geval van vaststelling van een
      bestemmingsplan of van een wijzigings- of uitwerkingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      reeds behorende tot een krachtens [artikel 40][ref14] vastgestelde zone.


