      1 Binnen drie maanden nadat de resultaten van het in [artikel 80][ref1] bedoelde onderzoek zijn verkregen,
      nemen burgemeester en wethouders een besluit, bepalende welke maatregelen nodig zijn om te voorkomen dat
      de geluidsbelasting die de weg na zijn aanleg binnen de zone zal veroorzaken, de waarden die ingevolge de
      [artikelen 82][ref2], [83][ref3] en [85][ref4] als de ten hoogste toelaatbare worden aangemerkt, te boven zou gaan.

      2 Van het besluit wordt mededeling gedaan aan de wegaanlegger.


