  - number: '174'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel174
  - number: '176'
    text: |-
      Alle – anders dan met toepassing van de [Algemene wet bestuursrecht][ref1], de
      [Wet algemene bepalingen omgevingsrecht][ref2] of de [Wet milieubeheer][ref3] – krachtens de onderhavige wet ter
      inzage te leggen, te publiceren of aan belanghebbenden toe te zenden stukken, die in een vreemde taal zijn gesteld
      en waarbij niet een vertaling in de Nederlandse taal wordt gevoegd, of die wegens hun omvang, hun inhoud dan wel
      om andere redenen niet geacht kunnen worden voor de beoordeling ervan voldoende inzicht te geven aan een algemeen
      publiek, gaan vergezeld van een in de Nederlandse taal gestelde samenvatting. Onze Minister kan nadere regels geven
      over de wijze waarop deze samenvatting dient te worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0024779
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0024779
      - id: ref3
        bwb_id: BWBR0003245
  - number: '180'
    text: |-
      De bevoegdheid van gemeenten en van waterschappen tot het maken van verordeningen blijft ten aanzien van het
      onderwerp waarin deze wet voorziet, gehandhaafd voorzover deze verordeningen niet met het bij of krachtens deze wet
      bepaalde in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel180
  - number: '182'
    text: |-
      1 Bij algemene maatregel van bestuur wordt voor de gevallen waarin een algemene maatregel van bestuur waarbij
      categorieën van inrichtingen die in belangrijke mate geluidhinder kunnen veroorzaken worden aangewezen in werking
      treedt, ten aanzien van daarbij aangewezen categorieën van inrichtingen bepaald binnen welke termijn en volgens
      welke normstelling en procedures moet worden voorzien in de vaststelling van een zone rond terreinen met een
      bestemming die de mogelijkheid insluit van vestiging van inrichtingen die tot die categorieën behoren.

      2 Het in het eerste lid bepaalde geldt niet met betrekking tot terreinen waaromheen op het tijdstip van het in
      werking treden van de wijziging reeds een zone is tot stand gekomen.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel182
  - number: '184'
    text: |-
      Voor de uitvoering van deze wet ten aanzien van gebieden die niet deel uitmaken van een provincie, worden voorzover
      nodig bij algemene maatregel van bestuur regels gesteld ten aanzien van de bestuursorganen die de in deze wet
      vervatte bevoegdheden uitoefenen, en ten aanzien van de bestuursorganen die bij de uitvoering dienen te worden
      betrokken.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel184
  - number: '185'
    text: 'Deze wet kan worden aangehaald als: Wet geluidhinder.'
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel185
  - number: '186'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
