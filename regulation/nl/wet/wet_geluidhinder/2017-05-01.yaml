  - number: 110g
    text: |-
      Onze Minister stelt regels op grond waarvan telkens voor een bepaalde periode, al naar gelang de geluidproductie
      van motorvoertuigen in de betrokken periode hoger ligt dan voor de toekomst redelijkerwijs is te verwachten, bij
      de berekening en meting van de geluidsbelasting van de gevel van woningen of van andere geluidsgevoelige gebouwen
      of aan de grens van geluidsgevoelige terreinen op het resultaat een door hem bepaalde aftrek van niet meer dan 5 dB
      wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel110g
  - number: 110h
    text: |-
      Indien voorafgaand aan 1 januari 2007 een hogere waarde voor de ten hoogste toelaatbare geluidsbelasting vanwege
      een weg of een spoorweg in dB(A) is vastgesteld en die waarde ook na 1 januari 2007 geldt, wordt die waarde
      omgerekend tot de waarde voor de geluidsbelasting L overeenkomstig een bij ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel110h
  - number: 110i
    text: |-
      1 Een bestuursorgaan doet een door hem genomen onherroepelijk geworden besluit, houdende een beslissing tot het
      vaststellen van een hogere waarde dan de bij of krachtens deze wet genoemde waarden, zo spoedig mogelijk inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van dat wetboek][ref2] is niet van toepassing.

      2 Het eerste lid is van overeenkomstige toepassing als een besluit als bedoeld in het eerste lid, ingevolge
      een besluit of uitspraak in rechte waarbij dat besluit is ingetrokken of gewijzigd, of anderszins zijn waarde
      heeft verloren, in die zin dat op grond van de betrokken mededeling van het bestuursorgaan de vermelding van de
      desbetreffende korte aanduiding in de basisregistratie kadaster wordt verwijderd bij de betrokken percelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel110i
