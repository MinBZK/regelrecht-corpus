  - number: '105'
    text: |-
      In het belang van het voorkomen of beperken van geluid- of trillinghinder, veroorzaakt door het gebruik van een
      spoorweg, kunnen bij of krachtens algemene maatregel van bestuur eisen worden gesteld met betrekking tot aard,
      samenstelling, wijze van aanleg of gebruik van de spoorweginfrastructuur.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel105
  - number: '106'
    text: |-
      1 Deze afdeling is van toepassing op:

      a. de aanleg en wijziging van spoorwegen die daartoe zijn aangegeven op een kaart;

      b. de sanering van bij algemene maatregel van bestuur aangegeven woningen, andere geluidsgevoelige gebouwen en
      geluidsgevoelige terreinen vanwege de ondervonden geluidsbelasting van spoorwegen die zijn aangegeven op de kaart;

      c. de projectie van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van
      spoorwegen die zijn aangegeven op de kaart, bedoeld in het eerste lid, of op de geluidplafondkaart.

      2 De kaart, bedoeld in het eerste lid, wordt door Onze Minister vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel106
  - number: '107'
    text: |-
      In het belang van het voorkomen of beperken van geluidhinder vanwege spoorwegen kunnen bij of krachtens algemene
      maatregel van bestuur, omtrent de onderwerpen die ter beperking van de geluidsbelasting vanwege wegen geregeld zijn
      in de [hoofdstukken VI][ref1] of [VIIIA][ref2], regels worden gesteld. Daarbij kunnen bepalingen van dat hoofdstuk
      van overeenkomstige toepassing worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVIIIa
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel107
