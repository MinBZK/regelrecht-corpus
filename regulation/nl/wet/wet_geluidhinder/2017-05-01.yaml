  - number: '79'
    text: |-
      Tot aanleg van een weg anders dan op grondslag van een overeenkomstig de [artikelen 76][ref1] en [77][ref2]
      vastgesteld of herzien bestemmingsplan wordt, indien binnen de aanwezige of toekomstige zone woningen, dan wel
      andere geluidsgevoelige gebouwen of geluidsgevoelige terreinen aanwezig, in aanbouw of geprojecteerd zijn, niet
      overgegaan dan in overeenstemming met een besluit van burgemeester en wethouders, krachtens [artikel 81][ref3]
      genomen naar aanleiding van een door de wegaanlegger aan burgemeester en wethouders gedane mededeling van zijn
      voornemen en na een overeenkomstig [artikel 80][ref4] ingesteld onderzoek.


