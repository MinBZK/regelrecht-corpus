  - number: '67'
    text: |-
      1 Indien de geluidbelasting buiten een bestaande zone vanwege een industrieterrein de waarde van 50 dB(A)
      overschrijdt of op een of meer plaatsen binnen de zone of op de zonegrens de geluidsbelasting hoger is dan de ten
      hoogste toegestane geluidsbelasting, stellen burgemeester en wethouders voor het betreffende industrieterrein een
      geluidreductieplan vast.

      2 Een geluidreductieplan bevat ten minste een beschrijving van:

      a. het te voeren beleid om de geluidbelasting binnen en buiten de bestaande zone te beperken;

      b. de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om de geluidbelasting binnen die periode
      voor het hele industrieterrein te verminderen tot beneden de bedoelde grenswaarden;

      c. de wijze waarop de vermindering van de geluidsbelasting van het betreffende industrieterrein zal worden
      gerealiseerd indien de geluidsbelasting binnen de onder b genoemde periode niet is verminderd tot beneden de
      grenswaarden.

      3 Een geluidreductieplan wordt voorbereid met overeenkomstige toepassing van de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure, met dien verstande dat in afwijking van
      [artikel 3:15 van de Algemene wet bestuursrecht][ref2], een ieder zienswijzen naar voren kan brengen.

      4 Burgemeester en wethouders stellen een geluidreductieplan niet vast dan nadat de gemeenteraad een ontwerp van
      het geluidreductieplan is toegezonden en deze in de gelegenheid is gesteld zijn wensen en zienswijze ter kennis van
      burgemeester en wethouders te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel315
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel67
