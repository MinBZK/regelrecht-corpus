  - number: '126'
    text: |-
      1 Voor zover in de kosten van maatregelen die met het oog op de beperking van de geluidsbelasting van woningen
      binnen zones langs wegen als bedoeld in [artikel 74][ref1] krachtens [Afdeling 3 van hoofdstuk VI][ref2] zijn
      vastgesteld, niet op andere wijze wordt voorzien, komen deze kosten in gevallen waarin op 1 maart 1986 de woningen
      aanwezig of in aanbouw waren, terwijl de weg aanwezig was: ten laste van het Rijk.

      2 Indien door een reconstructie de geluidsbelasting, vanwege de gereconstrueerde weg, van de gevel van woningen
      binnen een zone met meer dan 5 dB is toegenomen en voor die woningen nog niet eerder toepassing is gegeven aan
      [artikel 90, vierde lid][ref3], komen de kosten, bedoeld in het eerste lid, ten laste van de wegbeheerder.

      3 Met betrekking tot andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen zijn het eerste en het tweede
      lid van overeenkomstige toepassing.

      4 In afwijking van het eerste lid komen de kosten van maatregelen in gevallen waarin op 1 maart 1986 de woningen
      aanwezig of in aanbouw waren, terwijl de weg aanwezig was, maar de woningen niet tijdig overeenkomstig artikel 88
      zijn gemeld, ten laste van de gemeente waarin de woningen zijn gelegen.

      5 Indien toepassing wordt gegeven aan [artikel 98][ref4] komt het gedeelte van de kosten van de maatregelen dat
      verband houdt met de reconstructie van de weg voor rekening van de wegaanlegger.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukVI
