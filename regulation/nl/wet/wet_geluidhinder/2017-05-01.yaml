        artikel: '59'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '2'
  - number: '61'
    text: |-
      Bij toepassing van [artikel 59][ref1] met betrekking tot nieuw te bouwen woningen, die dienen ter vervanging
      van bestaande woningen of van andere geluidsgevoelige gebouwen waarvoor een hogere waarde dan de ten hoogste
      toelaatbare waarde is vastgesteld, kan een waarde worden vastgesteld van ten hoogste 65 dB(A), met dien verstande
      dat de vervanging niet zal leiden tot:

      a. een ingrijpende wijziging van de bestaande stedenbouwkundige functie of structuur;

      b. een wezenlijke toename van het aantal geluidgehinderden bij toetsing op bouwplanniveau voor ten hoogste 100
      woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel59
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003227
        artikel: '59'
        hoofdstuk: V
        paragraaf: '4'
        afdeling: '2'
  - number: '62'
    text: |-
      1 Gedeputeerde staten stellen uitsluitend ten aanzien van de woningen die op grond van artikel 62, eerste
      lid, zoals dat luidde voor 1 januari 2007 aan gedeputeerde staten zijn gemeld, met inachtneming van de regels,
      gegeven krachtens het tweede lid, en gelet op de maatregelen, in verband met andere woningen binnen de zone
      voortvloeiend uit de zonevaststelling, bedoeld in [afdeling 2, §§ 2][ref1] en [3, van hoofdstuk V][ref2] van
      de Wet geluidhinder zoals deze luidden op 1 januari 2007, een programma op van maatregelen die naar hun oordeel
      in aanmerking komen om de geluidsbelasting, vanwege het industrieterrein, van de gevels van de in het eerste
      lid bedoelde woningen te beperken tot 55 dB(A) en te voldoen aan [artikel 111b, eerste lid, onder a][ref3]. Bij
      algemene maatregel van bestuur kan worden bepaald dat tevens één of meer overeenkomstige programma's dienen te
      worden opgesteld, gericht op een beperking van de geluidsbelasting van de gevels van de bedoelde woningen tot bij
      de maatregel aangegeven hogere waarden.

      2 Bij algemene maatregel van bestuur worden regels gegeven omtrent de aard van de maatregelen die in aanmerking
      komen en omstandigheden waaronder dit het geval is, alsmede met betrekking tot de opzet van een programma als
      bedoeld in het tweede lid en het tijdstip van uitvoering daarvan. Hierbij kan tevens worden aangegeven dat
      gedeputeerde staten in aangegeven categorieën van gevallen bij het opstellen van een programma kunnen uitgaan van
      een geluidsbelasting die het gevolg is van te verwachten ontwikkelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel111b
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel62
