  - number: '66'
    text: |-
      Onverminderd [artikel 65][ref1] kan het bevoegd gezag bij de toepassing van
      [artikel 2.14, eerste lid, onder c, van de Wet algemene bepalingen omgevingsrecht][ref2] besluiten
      tot afwijking van de [artikelen 40][ref3], [44 tot en met 47][ref4], [50][ref5], [51][ref6],
      [53 tot en met 56][ref7], [59 tot en met 61][ref8], [63, tweede lid][ref9], of [64][ref10]. De
