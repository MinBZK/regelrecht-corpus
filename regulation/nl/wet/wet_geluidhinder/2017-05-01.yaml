  - number: '40'
    text: |-
      Indien bij de vaststelling van een bestemmingsplan aan gronden een zodanige bestemming wordt gegeven dat daardoor
      een industrieterrein ontstaat, wordt daarbij tevens een rond het betrokken terrein gelegen zone vastgesteld,
      waarbuiten de geluidsbelasting vanwege dat terrein de waarde van 50 dB(A) niet te boven mag gaan.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel40
  - number: '41'
    text: |-
      1 Een krachtens [artikel 40][ref1] vastgestelde zone kan uitsluitend worden gewijzigd of opgeheven bij vaststelling
      of wijziging van een bestemmingsplan, met dien verstande dat opheffing alleen kan plaatsvinden wanneer de
      bestemming van het betrokken terrein zodanig is gewijzigd dat het geen industrieterrein meer is.

      2 Een wijziging van een zone kan er niet toe strekken dat enig gebied waarbinnen met inachtneming van
      de al verleende omgevingsvergunningen voor activiteiten met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen][ref2] omgevingsrecht en de daaraan verbonden
      voorschriften een hogere geluidsbelasting, vanwege het industrieterrein, optreedt dan 50 dB(A), ophoudt van de zone
      deel uit te maken.

      3 Een opgeheven zone bestaat voort zolang zich op het terrein een of meer inrichtingen bevinden, behorende tot een
      bij algemene maatregel van bestuur aan te wijzen categorie van inrichtingen die in belangrijke mate geluidhinder
      kunnen veroorzaken.

      4 Onverminderd het eerste lid kan de gemeenteraad bij besluit de begrenzing van een industrieterrein, waarop de
      vastgestelde zone is gebaseerd, vastleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel41
