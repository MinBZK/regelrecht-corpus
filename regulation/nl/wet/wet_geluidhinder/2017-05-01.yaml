  - number: 110b
    text: |-
      1 Wanneer de in [artikel 110a, eerste lid][ref1], genoemde activiteit tot gevolg heeft dat voor een woning, een
      ander geluidsgevoelig gebouw of geluidsgevoelig terrein gelegen buiten de grenzen van de gemeente binnen wier
      grenzen de activiteit wordt uitgevoerd een hogere waarde dan de bij of krachtens deze wet genoemde ten hoogste
      toelaatbare waarde dient te worden vastgesteld, kunnen burgemeester en wethouders hiertoe slechts overgaan na
      overleg met burgemeester en wethouders van de gemeente binnen wier grenzen de woning, het andere geluidsgevoelige
      gebouw of geluidsgevoelige terrein is gelegen.

      2 Wanneer de in [artikel 110a, zevende lid][ref2], genoemde activiteit tot gevolg heeft dat voor een woning, een
      ander geluidsgevoelig gebouw of geluidsgevoelig terrein gelegen buiten de grenzen van de provincie binnen wier
      grenzen de activiteit wordt uitgevoerd een hogere waarde dan de bij of krachtens deze wet genoemde ten hoogste
      toelaatbare waarde dient te worden vastgesteld, kunnen gedeputeerde staten hiertoe slechts overgaan na overleg
      met gedeputeerde staten van de provincie binnen wier grenzen de woning, het andere geluidsgevoelige gebouw of
      geluidsgevoelige terrein is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110a
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel110b
