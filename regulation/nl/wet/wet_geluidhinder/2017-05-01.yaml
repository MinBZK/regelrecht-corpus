  - number: 110a
    text: |-
      1 Burgemeester en wethouders zijn binnen de grenzen van de gemeente bevoegd tot het vaststellen van een hogere
      waarde voor de ten hoogste toelaatbare geluidsbelasting.

      2 In afwijking van het eerste lid zijn indien ten behoeve van een activiteit in meer dan één gemeente een
      hogere waarde voor de bij of krachtens de wet genoemde ten hoogste toelaatbare geluidsbelasting dient te worden
      vastgesteld, burgemeester en wethouders van de gemeente binnen wier grenzen deze activiteit zal worden uitgevoerd
      bevoegd een hogere waarde vast te stellen.

      3 De in het eerste en tweede lid bedoelde waarde kan ambtshalve of op verzoek van degenen die daartoe bij algemene
      maatregel van bestuur zijn aangewezen, worden vastgesteld.

      4 De vaststelling van de in het eerste en tweede lid bedoelde waarde vindt plaats volgens bij algemene maatregel
      van bestuur gestelde regels.

      5 Het eerste en tweede lid vinden slechts toepassing indien toepassing van maatregelen, gericht op het terugbrengen
      van de geluidsbelasting vanwege het industrieterrein, de weg of spoorweg, van de gevel van de betrokken woningen of
      andere geluidsgevoelige gebouwen onderscheidenlijk aan de grens van de betrokken geluidsgevoelige terreinen tot de
      ten hoogste toelaatbare geluidsbelasting onvoldoende doeltreffend zal zijn dan wel overwegende bezwaren ontmoet van
      stedenbouwkundige, verkeerskundige, vervoerskundige, landschappelijke of financiële aard. Bij algemene maatregel
      van bestuur kan worden bepaald dat de in dit lid bedoelde bevoegdheid enkel in bij die maatregel aan te geven
      gevallen kan worden toegepast.

      6 Indien [artikel 110f][ref1] van toepassing is geven burgemeester en wethouders slechts toepassing
      aan het derde en vierde lid voorzover de gecumuleerde geluidsbelastingen na de correctie op grond van
      [artikel 110f, derde lid][ref2], niet leiden tot een naar hun oordeel onaanvaardbare geluidsbelasting.

      7 Wanneer het besluit, bedoeld in het eerste lid, benodigd is in verband met de aanleg of wijziging van een
      hoofdspoorweg of de aanleg of reconstructie van een weg in beheer bij het Rijk of een provincie of de vaststelling
      of wijziging van een zone rond een industrieterrein dat als industrieterrein van regionaal belang is aangewezen
      bij provinciale verordening krachtens de [Wet milieubeheer][ref3] of de [Wet ruimtelijke ordening][ref4], zijn
      gedeputeerde staten van de provincie waarbinnen de weg of spoorweg dan wel het industrieterrein van regionaal
      belang is gelegen bevoegd tot vaststelling van de hogere waarde. Het tweede tot en met zesde lid is van
      overeenkomstige toepassing, met dien verstande dat in het tweede en zesde lid in plaats van «burgemeester en
      wethouders» moet worden gelezen «gedeputeerde staten» en in het tweede lid in plaats van «gemeente» telkens moet
      worden gelezen: provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel110f
      [ref3]: https://wetten.overheid.nl/BWBR0003245
      [ref4]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel110a
