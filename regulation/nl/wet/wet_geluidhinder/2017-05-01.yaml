      1 Indien het besluit in de zin van [artikel 110a, eerste lid][ref1], wordt genomen door burgemeester
      en wethouders en gepaard gaat met de vaststelling van een bestemmingsplan vangt, in afwijking van
      [artikel 6:8 van de Algemene wet bestuursrecht][ref2], de termijn voor het indienen van een beroepschrift tegen
      dat besluit aan met ingang van de dag waarop beroep kan worden ingesteld tegen het besluit tot vaststelling van het
      bestemmingsplan. Indien niet binnen die termijn is beslist, vangt de beroepstermijn aan met ingang van de dag na
      die waarop de termijn is verstreken.

      2 Indien het besluit in de zin van [artikel 110a, eerste lid][ref3], wordt genomen door burgemeester
      en wethouders en gepaard gaat met een besluit overeenkomstig [artikel 81][ref4], vangt in afwijking van
      [artikel 6:8 van de Algemene wet bestuursrecht][ref5], de termijn voor het indienen van een beroepschrift
      tegen dat besluit aan met ingang van de dag waarop beroep kan worden ingesteld tegen het besluit overeenkomstig
      [artikel 81][ref6].


