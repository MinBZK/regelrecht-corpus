  - number: '125'
    text: |-
      1 Voor zover in de kosten van de maatregelen die in verband met de vaststelling van een bij een industrieterrein
      behorende zone krachtens of met overeenkomstige toepassing van [artikel 53][ref1] zoals dat luidde op 1 januari
      2007 dan wel in verband met het toepassing geven aan [artikel 46][ref2] of [55, eerste lid][ref3], met het oog op
      de beperking van de geluidsbelasting van woningen binnen die zone krachtens [Afdeling 2, van hoofdstuk V][ref4]
      zijn vastgesteld, niet op andere wijze wordt voorzien, komen deze kosten:

      a. voor zover het maatregelen betreft ten behoeve van op het tijdstip van de vaststelling van de zone al aanwezige
      of in aanbouw zijnde woningen ten aanzien waarvan [Afdeling 2, § 5, van hoofdstuk V][ref5], van toepassing is: ten
      laste van het Rijk;

      b. voor zover het maatregelen betreft ten behoeve van op het tijdstip van de vaststelling van de zone
      geprojecteerde woningen: ten laste van de exploitanten van de op het industrieterrein op dat tijdstip al
      gevestigde inrichtingen en de betrokken gemeente, ieder voor de helft, met dien verstande dat het ten laste van
      de exploitanten van bedoelde inrichtingen komende gedeelte der kosten over hen verdeeld wordt zoveel mogelijk naar
      evenredigheid van het aandeel der onderscheidene inrichtingen in de geluidproduktie van het industrieterrein op
      bedoeld tijdstip;

      c. voor zover het maatregelen betreft ten behoeve van woningen binnen de zone ingeval toepassing wordt gegeven aan
      [artikel 46][ref6] of [55, eerste lid][ref7]: ten laste van degene ten behoeve van wie de ten hoogste toelaatbare
      geluidsbelasting wordt verhoogd.

      2 Tot de kosten, bedoeld in het eerste lid, worden mede gerekend de kosten, voortvloeiende uit het treffen van de
      krachtens de [Woningwet][ref8] of [hoofdstuk VIII B][ref9] vereiste maatregelen met betrekking tot de geluidwering
      van de gevels van de in dat lid bedoelde woningen.

      3 Met betrekking tot andere geluidsgevoelige gebouwen is het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
      [ref5]: https://wetten.overheid.nl/BWBR0003227#HoofdstukV
