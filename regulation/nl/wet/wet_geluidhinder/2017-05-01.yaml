  - number: '85'
    text: |-
      1 Voor de ter plaatse ten hoogste toelaatbare geluidsbelasting als bedoeld in [artikel 82, tweede lid][ref1],
      kunnen hogere dan de krachtens dat lid bepaalde waarden worden vastgesteld, met dien verstande dat deze waarden bij
      algemene maatregel van bestuur te stellen grenzen niet te boven mogen gaan.

      2 Bij de maatregel, bedoeld in het eerste lid, kan worden bepaald dat de bevoegdheid, bedoeld in het eerste lid,
      enkel in bij die maatregel aan te geven gevallen kan worden toegepast.


