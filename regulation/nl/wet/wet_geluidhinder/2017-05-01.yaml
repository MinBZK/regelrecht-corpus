  - number: '60'
    text: |-
      Bij toepassing van [artikel 59][ref1] met betrekking tot nieuw te bouwen woningen in een gebied gelegen binnen
      een bestaande zone van een industrieterrein met activiteiten die zeehavengebonden zijn en die noodzakelijkerwijs
      in de open lucht plaatsvinden, kan voor woningen waarvan de geluidsbelasting in hoofdzaak wordt bepaald door die
      activiteiten, een waarde worden vastgesteld van ten hoogste 60 dB(A), indien deze woningen worden gebouwd in het
      kader van een herstructurering, of planmatige verdichting van een bestaand woongebied, of wanneer de woningen
      worden gebouwd aansluitend aan het bestaande woongebied en slechts sprake is van een beperkte uitbreiding van het
      bestaande woongebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel59
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel60
