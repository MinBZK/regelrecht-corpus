  - number: '52'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder: bestaande zone: een zone rond een op 1
      januari 2007 bestaand industrieterrein.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel52
  - number: '53'
    text: |-
      1 Buiten een bestaande zone mag de geluidbelasting vanwege het industrieterrein de waarde van 50 dB(A) niet te
      boven gaan.

      2 De op 1 januari 2007 geldende ten hoogste toelaatbare geluidsbelastingen voor woningen, andere geluidsgevoelige
      gebouwen en geluidsgevoelige terreinen blijven gelden.
    url: https://wetten.overheid.nl/BWBR0003227/2017-05-01#Artikel53
  - number: '54'
    text: |-
      De [artikelen 41 tot en met 43][ref1] en [47][ref2] zijn van overeenkomstige toepassing op het wijzigen of opheffen
      van een bestaande zone.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel47
