    text: |-
      1 [Afdeling 1 van hoofdstuk VIIIA][ref1] is niet van toepassing op deze afdeling.

      2 Op de voorbereiding van een saneringsprogramma is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van
