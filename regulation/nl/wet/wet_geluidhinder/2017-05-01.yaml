  - number: '89'
    text: |-
      1 Burgemeester en wethouders of indien toepassing wordt gegeven aan [artikel 98][ref1] burgemeester en wethouders
      of de wegaanlegger stellen uitsluitend ten aanzien van de woningen die op grond van [artikel 88, eerste lid][ref2],
      zoals dat luidde voor 1 januari 2007 aan Onze Minister zijn gemeld, met inachtneming van de regels, gegeven
      krachtens het tweede lid, een programma op van maatregelen die naar hun oordeel in aanmerking komen om de
      geluidsbelasting, vanwege de weg, van de gevels van de op grond van [artikel 88][ref3], zoals dat luidde
      voor 1 januari 2007 gemelde woningen zoveel mogelijk te beperken tot 48 dB en om zo nodig te voldoen aan
      [artikel 111b, derde lid][ref4].

      2 Met betrekking tot gevallen als bedoeld in het eerste lid worden bij of krachtens algemene maatregel van bestuur
      regels gegeven omtrent de aard van de maatregelen die in aanmerking komen, en de omstandigheden waaronder dit het
      geval is, alsmede omtrent de opzet en het tijdstip van vaststelling van een programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel88
