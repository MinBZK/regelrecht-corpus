  - number: '98'
    text: |-
      1 Ten behoeve van een reconstructie van een weg met betrekking waartoe ingevolge [artikel 88][ref1],
      zoals dat luidde voor 1 januari 2007 aan Onze Minister uiterlijk twee jaar na 1 januari 2007
      melding is gedaan, is deze afdeling niet van toepassing en geeft Onze Minister toepassing aan
      [artikel 90, tweede tot en met vijfde lid][ref2].

      2 In afwijking van het eerste lid, indien toepassing wordt gegeven aan [artikel 104a, eerste lid][ref3]:

      a. zijn de [artikelen 89][ref4] en [90, eerste lid][ref5], niet van toepassing, en

      b. worden in afwijking van [artikel 90, tweede en vijfde lid][ref6], de in die leden bedoelde maatregelen en ten
      hoogste toelaatbare waarden vastgesteld als onderdeel van een tracébesluit, en blijft in het tweede lid de zinsnede
      «na ontvangst van zodanig programma» buiten toepassing.

      3 In afwijking van het eerste lid, indien toepassing wordt gegeven aan [artikel 104a, tweede of derde lid][ref7]:

      a. zijn de [artikelen 89][ref8] en [90][ref9], eerste lid, niet van toepassing, en

      b. worden in afwijking van [artikel 90, tweede en vijfde lid][ref10], de in die leden bedoelde
      maatregelen en ten hoogste toelaatbare waarden vastgesteld als onderdeel van een wegaanpassingsbesluit
      als bedoeld in [artikel 5 van de Spoedwet wegverbreding][ref11], of geluidplan als bedoeld in
      [artikel 6, vijfde lid, van de Spoedwet wegverbreding][ref12], en blijft in het tweede lid de zinsnede «na
      ontvangst van zodanig programma» buiten toepassing.


