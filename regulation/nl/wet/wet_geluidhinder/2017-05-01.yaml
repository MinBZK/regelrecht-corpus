  - number: '104'
    text: |-
      Bij algemene maatregel van bestuur kunnen voor andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen
      met betrekking tot de in de [artikelen 88 tot en met 90][ref1], [98][ref2] en [99][ref3] geregelde onderwerpen
      overeenkomstige regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
