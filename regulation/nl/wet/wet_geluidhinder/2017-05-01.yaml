  - number: '57'
    text: |-
      1 Bij de vaststelling van een bestemmingsplan of van een wijzigings- of uitwerkingsplan als bedoeld in
      [artikel 3.6, eerste lid, onder a of b, van de Wet ruimtelijke ordening][ref1] dat geheel of gedeeltelijk
      betrekking heeft op gronden die krachtens die vaststelling gaan of blijven behoren tot een bestaande zone worden
      ter zake van de geluidsbelasting, vanwege het industrieterrein

      a. van de gevel van woningen, binnen de bestaande zone de waarden in acht genomen die op het tijdstip van de
      vaststelling van de bestaande zone golden. Voor ten tijde van de vaststelling van de bestaande zone binnen
      de zone aanwezige, in aanbouw of geprojecteerde woningen is dit de waarde 55 dB(A), tenzij op dat tijdstip de
      geluidsbelasting van bedoelde woningen lager of gelijk was aan 50 dB(A), in welke geval de ten hoogste toelaatbare
      geluidsbelasting 50 dB(A) is. De vorige volzin geldt niet met betrekking tot ten tijde van de vaststelling van de
      bestaande zone binnen de zone aanwezige of in aanbouw zijnde woningen die op het bedoelde tijdstip reeds een hogere
      geluidsbelasting, vanwege het industrieterrein, ondervinden dan 55 dB(A).

      b. van de gevel van andere geluidsgevoelige gebouwen en aan de grens van geluidsgevoelige terreinen binnen de zone
      de waarden in acht genomen die op het tijdstip van de vaststelling van de bestaande zone bij algemene maatregel van
      bestuur als de ten hoogste toelaatbare geluidsbelasting werden aangemerkt.

      2 In afwijking van het eerste lid worden bij de vaststelling van een bestemmingsplan of van een wijzigings- of
      uitwerkingsplan als in dat lid bedoeld hogere waarden in acht genomen, voor zover:

      a. deze gelden of zijn vastgesteld;

      b. zodanige waarden noodzakelijk zijn als gevolg van een vaststelling van het plan in afwijking van het ontwerp,
      zoals dit ter inzage heeft gelegen, welke waarden door gedeputeerde staten redelijkerwijs met toepassing van
      [artikel 55, eerste en tweede lid][ref2], zullen worden vastgesteld.

      3 De [artikelen 42][ref3] en [43][ref4] zijn van overeenkomstige toepassing in geval van vaststelling van een
      bestemmingsplan of van een wijzigings- of uitwerkingsplan dat geheel of gedeeltelijk betrekking heeft op gronden,
      reeds behorende tot een bestaande zone.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.6
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0003227#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0003227#Artikel43
