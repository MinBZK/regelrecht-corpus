  - number: '73'
    text: |-
      Dit hoofdstuk is van toepassing op:

      a. de aanleg en reconstructie van wegen die niet zijn aangegeven op de geluidplafondkaart;

      b. de sanering van de op grond van [artikel 88, eerste lid][ref1], zoals dat luidde voor 1 januari 2007, aan Onze
      Minister gemelde aanwezige woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen, voor zover die
      niet zijn gemeld vanwege de ondervonden geluidsbelasting van wegen die zijn aangegeven op de geluidplafondkaart;

      c. de projectie van woningen, andere geluidsgevoelige gebouwen en geluidsgevoelige terreinen binnen de zones van
      wegen, bedoeld in [artikel 74][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003227#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003227#Artikel74
