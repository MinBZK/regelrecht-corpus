  - number: 110c
    text: |-
      1 Op de voorbereiding van een besluit als bedoeld in [artikel 110a][ref1] is de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] geregelde procedure van toepassing, met dien verstande dat
      indien burgemeester en wethouders bevoegd zijn de hogere waarde vast te stellen en het besluit ten behoeve van de
      vaststelling of herziening van een bestemmingsplan wordt genomen, het ontwerp van het besluit tegelijkertijd met
      het ontwerp van het bestemmingsplan ter inzage wordt gelegd.

      2 Het eerste lid is niet van toepassing, indien het besluit, bedoeld in [artikel 110a][ref3],
      wordt genomen ten behoeve van de verlening van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref4] van het
      bestemmingsplan wordt afgeweken.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent:

      a. de bij een verzoek als bedoeld in [artikel 110a][ref5] over te leggen gegevens;

      b. de voorbereiding van een besluit als bedoeld in [artikel 110a][ref6].


