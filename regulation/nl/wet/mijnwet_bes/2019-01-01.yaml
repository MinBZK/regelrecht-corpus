url: https://wetten.overheid.nl/BWBR0028161/2019-01-01
articles:
  - number: '1'
    text: |-
      In de artikelen van deze wet en de daarop berustende bepalingen wordt verstaan onder Rijk: Nederland en Bonaire,
      Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1
  - number: 1a.1
    text: |-
      Onder delfstoffen worden voor de toepassing dezer wettelijke regeling verstaan alle uit de bodem gedolven of op
      andere wijze uit de bodem gewonnen natuurlijke zelfstandigheden, met uitzondering van die zelfstandigheden die
      algemeen in Bonaire, Sint Eustatius en Saba voorkomen en uitsluitend dienen voor de aanleg van wegen, voor toeslag
      voor beton, en voor huizenbouw en kunstwerken in Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.2
    text: Voor zover uit deze wettelijke regeling niet anders voortvloeit, zijn alle delfstoffen eigendom van het Rijk.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Het recht om delfstoffen op te sporen of te ontginnen wordt verkregen, het eerste krachtens een vergunning, het
      tweede krachtens een concessie, beide te verlenen door Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.4
    text: |-
      Vergunning tot opsporing wordt verleend voor een bepaalde tijd, drie achtereenvolgende jaren niet te boven
      gaande. Zij kan vóór het verstrijken van de vergunningstermijn tot tweemaal telkens voor de tijd van een jaar
      worden verlengd. De vroeger ingediende aanvrage om een vergunning tot opsporing heeft de voorkeur boven de later
      ingediende.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.5
    text: Concessie tot ontginning wordt verleend voor een bepaalde tijd, vijfenzeventig jaren niet te boven gaande.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.6
    text: |-
      De wijze waarop, de uitgestrektheid waarvoor, en de voorwaarden waaronder de genoemde vergunningen en concessies
      zullen kunnen worden verkregen, alsook de rechten en verplichtingen, uit die vergunningen en concessies
      voortvloeiende en de rechten en verplichtingen van de rechthebbende, voor het geval ten behoeve van opsporingen of
      ontginningen over de grond moet worden beschikt worden bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: 1a.7
    text: |-
      Bij de in het zesde lid bedoelde algemene maatregel van bestuur kunnen andere stoffen onder de werking daarvan
      worden gebracht, dan wel bepaalde delfstoffen aan de werking daarvan worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel1a
  - number: '2.1'
    text: |-
      De ontdekking van eene in deze wet genoemde delfstof geeft den ontdekker die òf is houder van eene vergunning
      tot opsporing òf concessionaris op het veld, binnen welks grenzen de delfstof is ontdekt, recht op concessie tot
      ontginning van de ontdekte delfstof, zoodra hij zijne aanspraken doet gelden, met dien verstande evenwel dat de
      ontdekker, die houder is van eene vergunning tot opsporing, zijne aanspraken behoort geldend te maken vóór het
      verstrijken van den termijn waarvoor de vergunning verleend of verlengd is en dat het vroeger ingediende verzoek de
      voorkeur heeft boven het later ingediende.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het hier bedoelde recht op concessie kan, mits in zijn geheel, aan anderen, voldoende aan de vereischten in
      [artikel 5][ref1] gesteld, worden overgedragen, behoudens goedkeuring van Onze Minister van Economische Zaken en
      Klimaat.


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel5
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: '5'
  - number: '3.1'
    text: |-
      Het op grond van de concessie verworven recht behoort tot de onroerende zaken; het is voor hypotheek vatbaar en kan
      door den concessionaris worden vervreemd.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel3
  - number: '3.2'
    text: |-
      De titel van aankomst van dat recht wordt openbaar gemaakt door publicatie in de Staatscourant. Eerst door die
      openbaarmaking wordt het recht als bestaande aangemerkt.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onder rechthebbende op den grond wordt verstaan degene, die een zakelijk recht daarop heeft. Onder derde
      belanghebbende wordt verstaan degene, wiens uit een persoonlijk recht voortvloeiende belangen door eene opsporing
      of ontginning kunnen worden geschaad.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Onder opsporing wordt verstaan het opzettelijk ingesteld onderzoek naar de in [artikel 1a][ref1] genoemde
      delfstoffen met het oogmerk om recht tot mijnontginning te verwerven en onder ontginning of mijnontginning de
      opzettelijke winning van deze delfstoffen, onverschillig of die winning geschiedt door onderaardsche mijnwerken,
      open groeven, grondboringen of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: 1a
  - number: '5.1'
    text: 'Geen anderen kunnen houders van vergunningen tot opsporing of van concessiën zijn dan:'
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: 5.1.a
    text: Nederlanders,
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: 5.1.b
    text: ingezetenen van Nederland of van Bonaire, Sint Eustatius en Saba,
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: 5.1.c
    text: |-
      vennootschappen, gevestigd in Nederland of van Bonaire, Sint Eustatius en Saba, waarvan wat de naamlooze
      vennootschappen en de besloten vennootschappen betreft, de eenige bestuurder of commissaris, dan wel, als er twee
      zijn, beide, of, als er meer bestuurders zijn, de meerderheid der commissarissen, en, wat vennootschappen onder
      eene firma en die bij wijze van geldschieting betreft, de eenige beheerende vennoot, dan wel, als er twee zijn,
      beide, of als er meer beheerende vennooten zijn de meerderheid, Nederlanders dan wel ingezetenen van Bonaire, Sint
      Eustatius en Saba zijn;
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: '5.2'
    text: |-
      Als ingezetenen van Bonaire, Sint Eustatius en Saba worden aangemerkt zij, die hunne woonplaats op Bonaire, Sint
      Eustatius en Saba hebben. Het ingezetenschap houdt op door vestiging der woonplaats buiten Bonaire, Sint Eustatius
      en Saba. Een minderjarige in den zin der wet, wiens vader of voogd ingezetene is, wordt als ingezetene aangemerkt.
      Meerderjarig geworden, behoudt hij de hoedanigheid van ingezetene, indien hij zijne woonplaats in Bonaire, Sint
      Eustatius en Saba vestigt.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: '5.3'
    text: |-
      De rechten en verplichtingen, uit eene vergunning tot opsporing en uit eene concessie voortvloeiende, gaan bij
      overlijden van den wettigen houder over op diens rechtverkrijgenden, voor zoover zij reeds dadelijk, dan wel binnen
      den tijd van één jaar na het openvallen der erfenis, voldoen aan de vereischten van dit artikel. Zij kunnen binnen
      dat jaar worden overgedragen aan personen of vennootschappen, die voldoen aan de vereischten van dit artikel,
      behoudens goedkeuring van Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: '5.4'
    text: Geschillen nopens het voldoen aan de vereischten van dit artikel worden beslist door den rechter.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel5
  - number: '6'
    text: 'De vergunning tot opsporing, het recht op concessie en de concessie vervallen van rechtswege:'
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel6
  - number: 6.a
    text: |-
      wanneer de houder der vergunning, die van het recht op concessie of de concessionaris ophoudt aan de in
      [artikel 5][ref1] gestelde vereischten te voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel5
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: '5'
  - number: 6.b
    text: |-
      bij overlijden van den houder der vergunning, van dien van het recht op concessie of van den concessionaris, ten
      aanzien van zijnen rechtverkrijgende, die niet binnen den in [artikel 5][ref1] genoemden termijn aan de in dat
      artikel gestelde vereischten heeft voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel5
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: '5'
  - number: '7.1'
    text: |-
      De concessionaris kan van de hem bij de concessie verleende rechten door Onze Minister van Economische Zaken en
      Klimaat worden vervallen verklaard:
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel7
  - number: 7.1.a
    text: |-
      ingeval hij, op bekomen last om de ontginning wegens, naar het oordeel van Onze Minister van Economische Zaken
      en Klimaat, overwegende redenen van algemeen belang aan te vangen of na staking weder op te vatten, in gebreke
      blijft binnen den hem gestelden tijd aan dien last ten genoegen van Onze Minister van Economische Zaken en Klimaat
      te voldoen;
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel7
  - number: 7.1.b
    text: |-
      ingeval hij achterlijk of nalatig is in de nakoming van verplichtingen, hem ter zake der ontginning bij wettelijke
      voorschriften of bij de akte van concessie opgelegd, dan wel ingeval hij weigert of in gebreke blijft gevolg te
      geven aan de in het algemeen belang of in het belang der veiligheid van personen en goederen door eene daartoe
      bevoegde autoriteit omtrent zijne werken gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel7
  - number: '7.2'
    text: |-
      Tot de vervallenverklaring wordt niet overgegaan dan nadat de concessionaris of zijn gemachtigde door of
      vanwege Onze Minister van Economische Zaken en Klimaat met het voornemen tot vervallenverklaring bij eene bij
      deurwaardersexploit beteekende akte is in wetenschap gesteld, hem de gelegenheid is gegeven voor zijne belangen op
      te komen en hij tevens een hem te verleenen, met den datum van beteekening van het exploit ingaanden termijn van
      ten minste één jaar om zijne verplichtingen volledig na te komen of om aan de gestelde eischen te voldoen, onbenut
      heeft laten voorbijgaan. Voor zoover die verplichting strekt tot betaling van eene geldsom, zal de termijn ten
      minste drie maanden zijn.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel7
  - number: '8'
    text: |-
      De concessionaris, die bij beschikking van Onze Minister van Economische Zaken en Klimaat van zijne rechten is
      vervallen verklaard, kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet, behoudens het [eerste en tweede lid van artikel 1a][ref1], benevens de daarop gegronde algemene maatregel
      van bestuur – voor zoover het tegendeel daarin niet is uitgedrukt – zijn niet van toepassing op van rijkswege
      ondernomen opsporingen en ontginningen, blijvende de bevoegdheid de rijksoverheid onverkort om opsporingen en
      ontginningen te bewerkstelligen, wanneer zij niet in strijd komen met aan bijzondere personen of gemeenschappen
      verleende mijnrechtelijke bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: 1a
  - number: '10'
    text: |-
      Deze wet is niet toepasselijk op de delfstof, ten aanzien waarvan de eigenaar van den grond als zoodanig vóór
      1 Juli 1906 eenige daad van beschikking heeft verricht. Aan dien eigenaar en zijne rechtverkrijgenden wordt de
      beschikking over die delfstof gelaten, behoudens de bevoegdheid de rijksoverheid om, wanneer zij oordeelt dat het
      algemeen belang het vordert, de beschikking over die delfstof aan zich te trekken door onteigening van den grond.
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel10
  - number: '11'
    text: |-
      Op concessiën, verleend vóór het tijdstip waarop deze wet in werking treedt, zijn hare voorschriften, met
      uitzondering van [artikel 7, eerste lid, sub a][ref1], zoomede die van de op haar gegronde Koninklijke besluiten en
      koloniale verordeningen van toepassing, voor zoover zij niet strijden met den bepaaldelijk uitgedrukten inhoud dier
      concessiën, en met dien verstande, dat de [artikelen 5][ref2] en [6][ref3] niet gelden voor hare houders, die op
      genoemd tijdstip aan de vereischten van artikel 5 niet voldeden, noch voor hunne rechtverkrijgenden.


      [ref1]: https://wetten.overheid.nl/BWBR0028161#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028161#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0028161#Artikel6
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028161
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028161
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0028161
        artikel: '6'
  - number: '12'
    text: 'Deze wet wordt aangehaald als: Mijnwet BES.'
    url: https://wetten.overheid.nl/BWBR0028161/2019-01-01#Artikel12
