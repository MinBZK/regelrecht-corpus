  text: |-
    Gelet op de artikelen 78b van de Algemene bijstandswet, 25b van de Wet inkomensvoorziening oudere en
    gedeeltelijk arbeidsongeschikte werkloze werknemers, 25b Wet inkomensvoorziening oudere en gedeeltelijk
    arbeidsongeschikte gewezen zelfstandigen, 36 van de Werkloosheidswet, 33 van de Ziektewet, 57 van de Wet op
    de arbeidsongeschiktheidsverzekering, 48 van de Algemene Arbeidsongeschiktheidswet, 20 van de Toeslagenwet,
    24 van de Algemene Ouderdomswet, 24 van de Algemene kinderbijslagwet, 53 van de Algemene nabestaandenwet, 63
