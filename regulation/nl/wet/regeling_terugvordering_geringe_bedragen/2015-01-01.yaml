articles:
  - number: '1'
    text: |-
      Het bedrag als bedoeld in de [artikelen 36 van de Werkloosheidswet][ref1],
      [35 van de Wet inkomensvoorziening oudere werklozen][ref2], [33 van de Ziektewet][ref3],
      [57 van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [artikel 77 van de Wet werk en inkomen naar arbeidsvermogen][ref5], 48 van de Algemene
      Arbeidsongeschiktheidswet, [20 van de Toeslagenwet][ref6], [24 van de Algemene Ouderdomswet][ref7],
      [24 van de Algemene kinderbijslagwet][ref8], [53 van de Algemen nabestaandenwet][ref9],
      [63 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10], [2:59][ref11]
      of [3:56 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12] en
      [35 van de Wet op de (re)integratie arbeidsgehandicapten][ref13] is € 113 op jaarbasis.


