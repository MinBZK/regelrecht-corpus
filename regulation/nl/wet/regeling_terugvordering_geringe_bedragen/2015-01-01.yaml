  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 35, vierde lid, van de Wet inkomensvoorziening oudere werklozen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel35
    url: https://wetten.overheid.nl/BWBR0009254/2015-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '35'
  - number: '2'
    text: |-
      Indien het bij koninklijke boodschap van 29 september 1997 ingediende voorstel van wet houdende Nadere
      wijziging van een aantal sociale zekerheidswetten en enige andere wetten, houdende wijziging/intrekking van de
      [Wet Werkloosheidsvoorziening][ref1], eenvormige definiëring van de term gezamenlijke huishouding en technische
      alsmede enige andere wijzigingen (Veegwet SWZ 1997) (kamerstukken II 1997/98, 25 641) tot wet wordt verheven en in
      werking treedt, treedt deze regeling op hetzelfde tijdstip in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0002470
    url: https://wetten.overheid.nl/BWBR0009254/2015-01-01#Artikel2
