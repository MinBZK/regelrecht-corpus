---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_consignatie_van_gelden
regulatory_layer: WET
publication_date: '2001-11-01'
valid_from: '2002-01-01'
bwb_id: BWBR0003338
url: https://wetten.overheid.nl/BWBR0003338/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regeling betreffende de consignatie van gelden aan
    te passen aan de behoeften van de praktijk;

    Zo is het dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Deze wet verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      consignatie: het overmaken van gelden aan de Staat onder de in deze wet voorgeschreven vormen, ter beschikking van
      degene die van zijn recht op uitkering doet blijken.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Er is een consignatiekas waarin gelden worden opgenomen waarvan de consignatie wordt bevolen of toegelaten bij
      wettelijk voorschrift of een beschikking van Onze Minister dan wel een beslissing van de rechter.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel2
  - number: '2.2'
    text: Het beheer van de consignatiekas is opgedragen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      Consignatie geschiedt in Nederlandse wettige betaalmiddelen of door storting of overschrijving op door Onze
      Minister aan te wijzen bankrekeningen.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel3
  - number: '3.2'
    text: Een volmacht tot consignatie moet schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister stelt nadere regels omtrent de wijze waarop de consignatie kan plaatsvinden en uitkeringen uit de
      consignatiekas kunnen worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij de consignatie worden aan Onze Minister de bescheiden overgelegd of toegezonden waaruit blijkt op grond van
      welk wettelijk voorschrift, besluit, beschikking of beslissing, de consignatie plaatsvindt. Blijkt niet wie de
      rechthebbende op de gelden is dan verzoekt Onze Minister aan degene die de consignatie verlangt om aanvullende
      gegevens. Kunnen deze niet worden overgelegd of toegezonden dan vermeldt Onze Minister de reden daarvan in het
      bewijs van consignatie, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel6
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '6'
  - number: '5.2'
    text: |-
      Onze Minister vervaardigt een afschrift van elk der bescheiden, bedoeld in het vorige lid, en waarmerkt elk
      afschrift.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel5
  - number: '5.3'
    text: Ingeval de consignatie door een gemachtigde geschiedt, wordt tevens de akte van volmacht overgelegd of toegezonden.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister maakt van de consignatie een door hem ondertekend bewijs van consignatie in tweevoud op. Een
      exemplaar van het bewijs doet hij toekomen aan degene die de consignatie heeft verlangd. Het andere exemplaar
      zomede de gewaarmerkte afschriften van de overgelegde of toegezonden bescheiden worden bewaard tot de
      rechtsvordering tot uitkering is verjaard. De overgelegde of toegezonden bescheiden worden, bij aangetekend
      schrijven met bericht van ontvangst, teruggezonden aan degene die de consignatie heeft verlangd of aan diens
      gemachtigde.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel6
  - number: '6.2'
    text: Het model van het bewijs van consignatie wordt vastgesteld door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister deelt overeenkomstig door hem te stellen regelen jaarlijks in de *Staatscourant* mede, welke gelden
      in de loop van het vijfde aan die mededeling voorafgaande jaar in de consignatiekas zijn opgenomen en welke nog
      niet zijn uitgekeerd bij de aanvang van het jaar waarin die mededeling plaatsvindt. Ten aanzien van consignaties
      van gelden ten belope van minder dan € 45,38 vindt geen mededeling plaats. Dit bedrag kan door Onze Minister worden
      bijgesteld, indien de ontwikkeling van prijsindexcijfers hem daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister stelt regelen vast ten einde nadere bekendheid te geven aan de in het vorige lid bedoelde mededeling
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel7
  - number: '8.1'
    text: De in de consignatiekas gestorte gelden behoren aan de Staat toe.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel8
  - number: '8.2'
    text: Van de opnemingen in en de uitkeringen uit de consignatiekas wordt een afzonderlijke boekhouding gevoerd.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Uitkering uit de consignatiekas vindt plaats op schriftelijk verzoek van degene die van zijn recht op uitkering
      doet blijken.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij de uitkering wordt, over geconsigneerde gelden, de rente vergoed, bedoeld in het volgende lid. De rente wordt
      niet vergoed ten aanzien van consignaties ten belope van minder dan € 45,38. Dit bedrag kan door Onze Minister
      worden bijgesteld, indien de ontwikkeling van prijsindexcijfers hem daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het percentage van de rente wordt door Onze Minister jaarlijks in de maand januari voor het alsdan ingetreden
      kalenderjaar vastgesteld. Bij de vaststelling van dat percentage wordt rekening gehouden met de ten tijde van
      die vaststelling geldende rente op direct opvraagbare spaarrekeningen bij grote bankinstellingen, de Postgiro en
      de Rijkspostspaarbank.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De rente begint te lopen op de eerste dag van de maand volgende op die waarin de gelden door Onze Minister zijn
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.5'
    text: |-
      De rente wordt berekend tot en met de laatste dag van de maand, voorafgaande aan die waarin de uitkering geschiedt
      dan wel tot en met de laatste dag van de maand, voorafgaande aan die waarin de rechtsvordering tot uitkering is
      verjaard.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.6'
    text: |-
      De rente wordt berekend over het aantal gehele euro’s waaruit de geconsigneerde som bestaat, met verwaarlozing van
      onderdelen van euro’s.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '9.7'
    text: |-
      Onze Minister stelt, in overeenstemming met Onze Minister van Justitie, regelen vast met betrekking tot de
      voorwaarden, waaronder tot uitkering wordt overgegaan, zomede met betrekking tot uitkeringen in geval van derden-
      beslag onder de consignatiekas.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De rechtsvordering tot uitkering van geconsigneerde gelden verjaart door verloop van twintig jaren na de
      consignatie.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Na de verjaring van de rechtsvordering tot uitkering van geconsigneerde gelden, worden deze onder 's Rijks middelen
      verantwoord.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister deelt overeenkomstig door hem nader te stellen regelen in het jaar, voorafgaande aan dat van
      de verjaring, in de *Staatscourant* mede voor welke gelden de rechtsvordering tot uitkering in het jaar,
      volgende op die mededeling, verjaart. Ten aanzien van consignaties van gelden ten belope van minder dan € 45,38
      vindt geen mededeling plaats. Dit bedrag kan door Onze Minister worden bijgesteld, indien de ontwikkeling van
      prijsindexcijfers hem daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Ten aanzien van gelden welke vóór de aanvang van een periode van vijf jaar, voorafgaande aan het tijdstip van
      inwerkingtreding van deze wet, in de consignatiekas zijn opgenomen en ten aanzien waarvan het recht op uitkering
      niet ingevolge artikel 10 van de Wet van 11 juli 1908 (*Stb.* 226) is vervallen, vindt de mededeling, bedoeld in
      [artikel 7][ref1], plaats binnen twee jaar na dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel7
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '7'
  - number: '11.2'
    text: |-
      De rechtsvordering tot uitkering van de in het vorige lid bedoelde gelden verjaart op het tijdstip waarop het recht
      op uitkering ingevolge artikel 10 van de Wet van 11 juli 1908 (*Stb.* 226) zou vervallen, doch uiterlijk tien jaren
      na de dagtekening van de in het eerste lid bedoelde Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      [Artikel 10, tweede en derde lid][ref1], vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel10
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '10'
  - number: '12.1'
    text: |-
      In afwijking van het bepaalde in het vorige artikel vindt ten aanzien van consignaties van gelden ten belope van
      minder dan honderd gulden, welke vóór de aanvang van een periode van vijf jaar, voorafgaande aan het tijdstip van
      inwerkingtreding van deze wet in de consignatiekas zijn opgenomen, geen mededeling plaats. De rechtsvordering tot
      uitkering van die gelden verjaart op de dag waarop het recht op uitkering ingevolge artikel 10, tweede lid, eerste
      zin, van de Wet van 11 juli 1908 (*Stb.* 226) zou zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 10, tweede lid][ref1], vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel10
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '10'
  - number: '13.1'
    text: |-
      Gelden welke zijn geconsigneerd voor het tijdstip van het in werking treden van deze wet dragen
      rente overeenkomstig de Wet van 11 juli 1908 (*Stb.* 226). De rente wordt uitbetaald bij de in
      [artikel 9, eerste lid][ref1], bedoelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel9
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '9'
  - number: '13.2'
    text: |-
      Over gelden waarover ingevolge de Wet van 11 juli 1908 (*Stb.* 226) geen rente was verschuldigd, wordt na het in
      werking treden van deze wet rente berekend op de voet van [artikel 9][ref1], met dien verstande dat de rente begint
      te lopen met ingang van de eerste dag van de maand welke volgt op de dag van die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0003338#Artikel9
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003338
        artikel: '9'
  - number: '14'
    text: De Wet van 11 juli 1908 (*Stb.* 226) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Deze wet treedt in werking met ingang van 31 december van het jaar van uitgifte van het *Staatsblad* waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel15
  - number: '15.2'
    text: 'Deze wet kan worden aangehaald als: Wet op de consignatie van gelden.'
    url: https://wetten.overheid.nl/BWBR0003338/2002-01-01#Artikel15
