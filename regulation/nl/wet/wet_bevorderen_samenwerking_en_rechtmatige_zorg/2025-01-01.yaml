  - number: '2.9'
    text: |-
      1 Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet
      over natuurlijke personen dan wel rechtspersonen blijkt of wordt meegedeeld, verder bekend te maken dan voor de
      uitvoering van deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.

      2 Het eerste lid is niet van toepassing indien:

      a. enig wettelijk voorschrift tot de bekendmaking verplicht;

      b. de gegevens niet herleidbaar zijn tot individuele natuurlijke personen of rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#Artikel2.9
  - number: '4.1'
    text: |-
      De voordracht voor een krachtens deze wet vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet en vervolgens telkens na vijf jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#Artikel4.3
  - number: '4.4'
    text: 'Deze wet wordt aangehaald als: Wet bevorderen samenwerking en rechtmatige zorg.'
    url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#Artikel4.4
