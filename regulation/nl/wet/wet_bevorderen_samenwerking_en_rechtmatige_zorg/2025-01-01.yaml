  - number: '2.2'
    text: |-
      1 De verstrekking door het college, bedoeld in [artikel 2.1, eerste lid][ref1], kan niet
      eerder plaatsvinden dan nadat het onderzoek waardoor het college tot de gerechtvaardigde
      overtuiging is gekomen, is voorgelegd aan de toezichthouder die is aangewezen op grond van
      [artikel 6.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref2] of, indien deze betrokken was bij
      het onderzoek, aan een toezichthouder die op grond van een gemeentelijke verordening is belast met het houden van
      toezicht, en die tot dezelfde gerechtvaardigde overtuiging is gekomen. De toezichthouder doet onverwijld melding
      van de verstrekking door het college aan de Inspectie gezondheidszorg en jeugd.

      2 De verstrekking door de ziektekostenverzekeraar, bedoeld in [artikel 2.1, eerste lid][ref3], kan niet eerder
      plaatsvinden dan nadat het onderzoek, waardoor de ziektekostenverzekeraar tot de gerechtvaardigde overtuiging
      is gekomen, is voorgelegd aan de Nederlandse Zorgautoriteit en die tot dezelfde gerechtvaardigde overtuiging is
      gekomen. De Nederlandse Zorgautoriteit doet onverwijld melding van de verstrekking door de ziektekostenverzekeraar
      aan de Inspectie gezondheidszorg en jeugd.

      3 De gegevens in het onderzoek worden geanonimiseerd voordat ze worden overlegd aan de toezichthouder
      respectievelijk aan de Nederlandse Zorgautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0048601#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel6.1
      [ref3]: https://wetten.overheid.nl/BWBR0048601#Artikel2.1
