  - number: '2.8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het bepaalde in de
      [artikelen 2.4][ref1], [2.5][ref2] en [2.7][ref3]. Deze regels hebben betrekking op:

      a. de wijze waarop de gegevens, bedoeld in [artikel 2.4, eerste en tweede lid][ref4], worden verstrekt;

      b. de benodigde aanleiding voor verstrekking van de gegevens, bedoeld in [artikel 2.4, eerste lid][ref5], door de
      in dit lid genoemde instanties aan het Informatieknooppunt zorgfraude;

      c. de gevallen waarin en de voorwaarden waaronder de gegevens, bedoeld in [artikel 2.4, eerste lid][ref6], worden
      verstrekt, alsmede op de aard van die gegevens;

      d. de inrichting en de vormgeving van de werkprocessen van het Informatieknooppunt zorgfraude, waarbij met
      betrekking tot de verwerking van de gegevens, bedoeld in [artikel 2.4, derde lid][ref7], aandacht wordt besteed
      aan:

      1°. de aard en herkomst van de te verwerken gegevens;

      2°. de wijze van verwerking; en

      3°. de beoordelingscriteria voor de verschillende fasen van verwerking;

      e. de wijze waarop, de gevallen waarin en de voorwaarden waaronder de gegevens, bedoeld in
      [artikel 2.4, derde lid][ref8], worden verstrekt, alsmede op de aard van die gegevens;

      f. de beveiliging van gegevens, waaronder persoonsgegevens, gegevens over gezondheid en persoonsgegevens van
      strafrechtelijke aard;

      g. de inrichting, het beheer en de beveiliging van de in [artikel 2.7][ref9] bedoelde elektronische voorzieningen;

      h. de inrichting en het beheer van en de verantwoording door het Informatieknooppunt zorgfraude, waaronder begrepen
      regels ten aanzien van het vaststellen van het jaarplan en het verzoek van Onze Minister tot verstrekking van
      inlichtingen, en de daaraan verbonden bevoegdheid van Onze Minister tot het geven van aanwijzingen;

      i. de financiering van en de financiële verslaglegging door het Informatieknooppunt zorgfraude; en

      j. de aanwijzing van het Informatieknooppunt zorgfraude en de daaraan verbonden voorschriften;

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het bepaalde in de
      [artikelen 2.4][ref10], [2.5][ref11] en [2.7][ref12]. Deze regels hebben betrekking op

      a. de bewaartermijnen; en

      b. de uitoefening van de rechten van betrokkenen.


