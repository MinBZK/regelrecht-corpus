  - number: '1.2'
    text: |-
      Op grond van deze wet worden geen gegevens:

      a. over gezondheid verstrekt indien op deze gegevens een geheimhoudingsplicht
      rust als bedoeld in [artikel 457 van Boek 7 van het Burgerlijk Wetboek][ref1] of
      [artikel 88 van de Wet op de beroepen in de individuele gezondheidszorg][ref2];

      b. verstrekt over zorg verleend door zowel civiele zorgverleners, als de militair geneeskundige dienst als bedoeld
      in [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref3] aan een militair ambtenaar in
      werkelijke dienst als bedoeld in artikel 1, eerste lid, onderdeel a, onder 1, in verbinding met onderdeel b van
      de Wet ambtenaren defensie, alsmede de militair aan wie buitengewoon verlof met behoud van militaire inkomsten
      is verleend;

      c. verstrekt over zorg verleend door de militair geneeskundige dienst als bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref4] aan civiele patiënten.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel457
