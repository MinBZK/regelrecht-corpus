  - number: '2.5'
    text: |-
      1 Het Informatieknooppunt zorgfraude heeft voorts tot taak het signaleren van trends en ontwikkelingen en
      het ontwikkelen van beleidsinformatie en statistische informatie met betrekking tot fraude in de zorg. Indien
      noodzakelijk worden hiervoor de in [artikel 2.4, eerste tot en met het vierde lid][ref1] bedoelde gegevens,
      waaronder persoonsgegevens, gegevens over gezondheid en persoonsgegevens van strafrechtelijke aard, verwerkt.

      2 Het Informatieknooppunt zorgfraude verstrekt de in het eerste lid bedoelde signalering van trends en
      ontwikkelingen en ontwikkelde beleidsinformatie en statistische informatie uit eigen beweging en op verzoek,
      kosteloos, aan Onze Minister en de in [artikel 2.4, eerste lid][ref2], genoemde instanties. Bij ministeriële
      regeling kunnen regels worden gesteld over de termijn waarbinnen en de wijze waarop de verstrekking aan Onze
      Minister plaatsvindt.

      3 De in het tweede lid bedoelde verstrekking van gegevens bevat geen persoonsgegevens en gegevens over individuele
      rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0048601#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0048601#Artikel2.4
