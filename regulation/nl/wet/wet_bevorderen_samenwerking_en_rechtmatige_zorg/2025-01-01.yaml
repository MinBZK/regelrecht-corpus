  - number: '2.4'
    text: |-
      1 Het CIZ, de colleges, de Inspectie gezondheidszorg en jeugd, de Nederlandse Arbeidsinspectie, de
      rijksbelastingdienst, waaronder de FIOD, de Sociale verzekeringsbank, ziektekostenverzekeraars en de zorgautoriteit
      verstrekken het Informatieknooppunt zorgfraude, al dan niet op verzoek, kosteloos de bij algemene maatregel
      van bestuur aangewezen gegevens, waaronder persoonsgegevens en gegevens over gezondheid en persoonsgegevens van
      strafrechtelijke aard, die noodzakelijk zijn voor een of meerdere van de in dit lid genoemde instanties voor
      de bestrijding van fraude in de zorg in het kader van de aan die instanties opgedragen wettelijke taken. De
      verstrekking van politiegegevens door de FIOD en de Nederlandse Arbeidsinspectie aan het Informatieknooppunt
      zorgfraude geschiedt op grond van en met inachtneming van de [Wet politiegegevens][ref1].

      2 Het Informatieknooppunt zorgfraude kan voor het in het eerste lid omschreven doel, naast de in dat lid bedoelde
      gegevens, uitsluitend gegevens verwerken die bij of krachtens enige andere wet zijn verkregen of die bij algemene
      maatregel van bestuur zijn aangewezen en afkomstig zijn uit:

      a. een openbare jaarverantwoording als bedoeld in [artikel 40b van de Wet marktordening gezondheidszorg][ref2];

      b. stukken die krachtens [paragraaf 8.3 van de Jeugdwet][ref3] openbaar zijn gemaakt; en

      c. het handelsregister, bedoeld in [artikel 1, eerste lid, onderdeel h, van de Handelsregisterwet 2007][ref4].

      3 Het Informatieknooppunt zorgfraude heeft tot taak de in het eerste en tweede lid bedoelde gegevens te verwerken
      en het resultaat van de verwerking kosteloos te verstrekken aan een of meerdere van de in het eerste lid genoemde
      instanties, voor zover die gegevens voor hen noodzakelijk zijn voor de in dat lid bedoelde fraudebestrijding in
      het kader van de aan die instanties opgedragen wettelijke taken. De in de eerste zin bedoelde verstrekking heeft
      geen betrekking op gegevens die zijn verstrekt door de rijksbelastingdienst, waaronder de FIOD voor zover zij taken
      uitoefent op grond van de [Algemene wet inzake rijksbelastingen][ref5], aan het Informatieknooppunt zorgfraude voor
      zover het een verstrekking aan ziektekostenverzekeraars betreft, tenzij wordt voldaan aan bij algemene maatregel
      van bestuur te stellen regels.

      4 Ten behoeve van een gerichte verstrekking van de in het derde lid bedoelde gegevens, wisselen het
      Informatieknooppunt zorgfraude en de in het eerste lid genoemde instanties voor wie verstrekking van de gegevens
      noodzakelijk is voor de in het eerste lid bedoelde fraudebestrijding in het kader van de aan die instanties
      opgedragen wettelijke taken, de bij algemene maatregel van bestuur aangewezen noodzakelijke gegevens uit, waaronder
      persoonsgegevens, gegevens over gezondheid en persoonsgegevens van strafrechtelijke aard.

      5 De in het eerste lid genoemde instanties zijn bevoegd om de in het derde lid bedoelde ontvangen gegevens,
      waaronder persoonsgegevens, gegevens over gezondheid, persoonsgegevens van strafrechtelijke aard, enkel te
      verwerken voor de in het eerste lid bedoelde fraudebestrijding in het kader van de aan die instanties opgedragen
      wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Paragraaf8.3
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel1
