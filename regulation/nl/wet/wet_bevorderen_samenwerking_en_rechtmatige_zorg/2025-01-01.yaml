preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo, Wij in overweging hebben genomen, dat het wenselijk is regels te stellen over de gegevensuitwisseling ter
    bevordering van samenwerking binnen het zorgdomein met het oog op doelmatige en rechtmatige zorg, maatschappelijke
    ondersteuning en jeugdhulp;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0048601/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *CIZ:* CIZ als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1];
        - *college:* college van burgemeester en wethouders als bedoeld in
      [artikel 5, onderdeel c, van de Gemeentewet][ref2];
        - *FIOD:* bijzondere opsporingsdienst als bedoeld in
      [artikel 2, onderdeel a, van de Wet op de bijzondere opsporingsdiensten][ref3];
        - *fraude in de zorg:* opzettelijk misleidend handelen binnen het domein van de [Zorgverzekeringswet][ref4],
      [Wet langdurige zorg][ref5], [Wet maatschappelijke ondersteuning 2015][ref6], [Jeugdwet][ref7] of de door een
      ziektekostenverzekeraar te vergoeden zorg, die niet behoort tot het verzekerde pakket van de Zorgverzekeringswet
      of Wet langdurige zorg, met het oog op eigen of andermans gewin, voor zover het in de wet strafbaar gestelde feiten
      betreft;
        - *gegevens over gezondheid:* gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene
      verordening gegevensbescherming;
        - *Informatieknooppunt zorgfraude:* als zodanig door Onze Minister aangewezen instelling die is belast met
      de verwerking van gegevens waaronder persoonsgegevens, gegevens over gezondheid en persoonsgegevens van
      strafrechtelijke aard, ten behoeve van de bestrijding van fraude in de zorg;
        - *Inlichtingenbureau:* als zodanig door Onze Minister aangewezen instelling die is belast met de
      coördinatie en dienstverlening ten behoeve van de colleges bij de verwerking van gegevens, voor zover
      dit noodzakelijk is voor de uitvoering van taken van de colleges op het gebied van de [Jeugdwet][ref8] en
      [Wet maatschappelijke ondersteuning 2015][ref9];
        - *Nederlandse Arbeidsinspectie:* bijzondere opsporingsdienst als bedoeld in
      [artikel 2, onderdeel d, van de Wet op de bijzondere opsporingsdiensten][ref10];
        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *persoonsgegevens van strafrechtelijke aard:* persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref11];
        - *Sociale verzekeringsbank:* Sociale verzekeringsbank als bedoeld in
      [artikel 1, eerste lid, onderdeel d, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12];
        - *Wlz-uitvoerder:* Wlz-uitvoerder als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref13];
        - *zorgautoriteit:* zorgautoriteit als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van de Wet marktordening gezondheidszorg][ref14];
        - *ziektekostenverzekeraar:* 1°. zorgverzekeraar; 2°. Wlz-uitvoerder; 3°. particuliere ziektekostenverzekeraar,
      zijnde een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref15] in Nederland het bedrijf
      van verzekeraar mag uitoefenen; en
        - *zorgverzekeraar:* zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref16].


