  - number: '2.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het bepaalde in
      [artikel 2.1][ref1]. Deze regels hebben betrekking op:

      a. de voorwaarden om tot een gerechtvaardigde overtuiging als bedoeld in [artikel 2.1][ref2], tweede lid, te
      komen;

      b. de eisen aan het in het tweede lid genoemde protocol; en

      c. de beveiliging van gegevens, bedoeld in [artikel 2.1, eerste lid][ref3].

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot het bepaalde in [artikel 2.1][ref4].
      Deze regels hebben betrekking op:

      a. de bewaartermijnen, waaronder begrepen de periode waarin de gegevens op grond van [artikel 2.1][ref5] verstrekt
      kunnen worden; en

      b. de uitoefening van de rechten van betrokkenen.


