  - number: '2.1'
    text: |-
      1 De colleges en ziektekostenverzekeraars verstrekken elkaar kosteloos de bij algemene maatregel van
      bestuur aangewezen gegevens, waaronder persoonsgegevens, gegevens over gezondheid en persoonsgegevens van
      strafrechtelijke aard, die noodzakelijk zijn voor de bestrijding van fraude in de zorg. Deze gegevens hebben
      betrekking op natuurlijke personen of rechtspersonen ten aanzien van wie de gerechtvaardigde overtuiging bestaat
      dat zij fraude hebben gepleegd met zorg of overige diensten als bedoeld in de [Zorgverzekeringswet][ref1],
      zorg als bedoeld in de [Wet langdurige zorg][ref2], maatschappelijke ondersteuning als bedoeld in de
      [Wet maatschappelijke ondersteuning 2015][ref3], jeugdhulp en de uitvoering van een kinderbeschermingsmaatregel of
      jeugdreclassering als bedoeld in de [Jeugdwet][ref4] of de door een ziektekostenverzekeraar te vergoeden zorg, die
      niet behoort tot het verzekerde pakket van de Zorgverzekeringswet of Wet langdurige zorg.

      2 De in het eerste lid genoemde instanties verstrekken elkaar de in dat lid bedoelde gegevens niet eerder dan nadat
      zij, overeenkomstig een bij ministeriële regeling vast te stellen protocol, voor de verwerking van deze gegevens de
      gerechtvaardigde overtuiging hebben dat er sprake is van fraude in de zorg.

      3 De in het eerste lid genoemde instanties zijn bevoegd tot het verwerken van de in dat lid bedoelde gegevens enkel
      voor de bestrijding van de in dat lid bedoelde fraude.

      4 De colleges en ziektekostenverzekeraars dragen zorg dat na toepassing van het tweede lid de verwerking van deze
      gegevens wordt beëindigd indien niet langer de gerechtvaardigde overtuiging bestaat dat er sprake is van fraude in
      de zorg.

      5 De ministeriële regeling wordt niet eerder vastgesteld dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0020031
      [ref4]: https://wetten.overheid.nl/BWBR0034925
