  - number: '2.7'
    text: |-
      Het Informatieknooppunt zorgfraude draagt zorg voor de instandhouding van elektronische voorzieningen
      voor de verwerking van de gegevens, bedoeld in de [artikelen 2.4, eerste tot en met vierde lid][ref1], en
      [2.5, eerste lid][ref2].


