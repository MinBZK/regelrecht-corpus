preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat Richtlijn (EU) 2019/771 van het Europees Parlement en de Raad van 20 mei
    2019 betreffende bepaalde aspecten van overeenkomsten voor de verkoop van goederen, tot wijziging van Verordening
    (EU) 2017/2394 en Richtlijn 2009/22/EG, en tot intrekking van Richtlijn 1999/44/EG, en Richtlijn (EU) 2019/770 van
    het Europees Parlement en de Raad van 20 mei 2019 betreffende bepaalde aspecten van overeenkomsten voor de levering
    van digitale inhoud en digitale diensten (PbEU 2019, L 136) moeten worden omgezet in bepalingen van nationaal recht
    en dat daartoe Boek 7 van het Burgerlijk Wetboek, de Wet handhaving consumentenbescherming en enige andere wetten
    moeten worden gewijzigd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046592/2022-04-27#ArtikelAanhef
articles:
  - number: V
    text: |-
      De [Wet handhaving consumentenbescherming][ref1] zoals die luidde tot de inwerkingtreding van deze wet blijft
      van toepassing op overeenkomsten die voor het inwerkingtreden van deze wet zijn gesloten, met uitzondering van
      overeenkomsten als bedoeld in [artikel 5a lid 2 van Boek 7 van het Burgerlijk Wetboek](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0020586
    url: https://wetten.overheid.nl/BWBR0046592/2022-04-27#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0020586
  - number: VI
    text: |-
      Deze wet treedt in werking op 1 januari 2022. Wordt het Staatsblad waarin deze wet wordt geplaatst later uitgegeven
      dan 31 december 2021, dan treedt zij in werking op de dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0046592/2022-04-27#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Implementatiewet richtlijnen verkoop goederen en levering digitale inhoud.'
    url: https://wetten.overheid.nl/BWBR0046592/2022-04-27#ArtikelVII
