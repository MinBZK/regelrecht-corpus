        hoofdstuk: II
  - number: '15'
    text: |-
      De verzekerde die verblijft in een instelling als bedoeld in [artikel 9 van het Besluit][ref1] in verband met
      een psychiatrische aandoening dan wel in een instelling als bedoeld in [artikel 13 van het Besluit][ref2],
      behoudt aanspraak op dat verblijf gedurende vier weken nadat een indicatiebesluit als bedoeld in
      [artikel 9b, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref3] is vastgesteld waaruit blijkt dat hij
      geïndiceerd is voor verblijf in een instelling als bedoeld in [artikel 9 van het Besluit][ref4] in verband met
      een somatische of psychogeriatrische aandoening, mits dat voortgezette verblijf verband houdt met een tekort aan
      plaatsingsmogelijkheden.


