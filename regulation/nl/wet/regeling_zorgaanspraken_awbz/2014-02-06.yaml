  - number: '16'
    text: |-
      1 In afwijking van [artikel 6, eerste lid][ref1], wordt het hepatitis B-vaccin voor het eerst toegediend bij
      verzekerden die op of na 1 augustus 2011 zijn geboren.

      2 Het eerste lid is niet van toepassing op:

      a. verzekerden met een moeder die HbsAg-positief is;

      b. verzekerden met een ouder die afkomstig is uit een ander land dan een land, genoemd in [bijlage 1][ref2];

      c. verzekerden met het Downsyndroom.

      2 In afwijking van [artikel 6, tweede lid, onderdeel c][ref3], wordt het hepatitis B-vaccin voor het eerst
      toegediend bij verzekerden die op of na 1 januari 2008 geboren zijn.


