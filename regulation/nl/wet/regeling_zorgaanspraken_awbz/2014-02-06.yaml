  - number: '9'
    text: |-
      De verzekerde heeft slechts aanspraak op tandheelkundige zorg die nodig is met het oog op een ernstige aangeboren
      of verworven tandheelkundige aandoening of een lichamelijke of geestelijke aandoening, indien de zorgverzekeraar
      vooraf toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel9
  - number: '10'
    text: |-
      1 De verzekerde heeft slechts aanspraak op een rolstoel als bedoeld in [artikel 3][ref1], indien de zorgverzekeraar
      daartoe vooraf toestemming heeft verleend.

      2 Voorafgaande toestemming is niet vereist voor zover het aanpassingen of herstel van een rolstoel betreft waarvan
      de kosten minder bedragen dan:

      a. € 1 000, indien het een elektrisch aangedreven rolstoel betreft; en

      b. € 500, indien het een niet-elektrisch aangedreven rolstoel betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014855#Artikel3
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel10
