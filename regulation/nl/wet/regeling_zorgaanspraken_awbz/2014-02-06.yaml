        artikel: '12'
  - number: '5'
    text: |-
      1 Het onderzoek, bedoeld in [artikel 17, eerste lid, van het Besluit][ref1], omvat onderzoek naar het voorkomen
      van Adrenogenitaal syndroom, Biotinidase deficiëntie, Congenitale hypothyreoïdie, Galactosemie, Cystic Fibrosis,
      Glutaar acidurie type I, G-CoA-lyase deficiëntie, Holocarboxylase synthase deficiëntie, Homocystinurie,
      Isovaleriaan acidemie, Long-chain hydroxyacyl-CoA dehydrogenase deficiëntie, Maple syrup urine disease,
      Medium-chain acylCoA dehydrogenase deficiëntie, 3-methylcrotonyl-CoAcarboxylase deficiëntie, Phenylketonurie,
      Sikkelcelziekte, Thalassemie, Tyrosinemie type I en Very long-chain acylCoA dehydrogenase deficiëntie en wordt
      uitgevoerd door een laboratorium dat daartoe door het Rijksinstituut voor volksgezondheid en milieu is aangewezen.

      2 Aanspraak op het onderzoek, bedoeld in het eerste lid, bestaat voor de zuigeling die de leeftijd van twee maanden
      nog niet heeft bereikt, en in zeer bijzondere gevallen voor oudere zuigelingen.

      3 Het onderzoek, bedoeld in het eerste lid, vindt in de regel plaats op de leeftijd van vier tot en met zeven dagen
      van betrokkene.

      4 Het laboratoriumonderzoek, bedoeld in het eerste lid, wordt uitgevoerd volgens de onderzoekmethoden, vastgesteld
      door het Rijksinstituut voor volksgezondheid en milieu, dat tevens voor dit laboratoriumonderzoek wordt aangewezen
      als referentie-instituut.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel17
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel5
