        artikel: '17'
  - number: '6'
    text: |-
      1 Het vaccinatieprogramma van het [Besluit][ref1] omvat toediening van de hierna aangegeven vaccins, afgeleverd
      door of vanwege het Rijksinstituut voor Volksgezondheid en Milieu, aan de daartoe opgeroepen verzekerden:

      a. in de leeftijd tot 1 maand het hepatitis B-vaccin indien de moeder van de verzekerde HbsAg-positief is;

      b. in de leeftijd van 2–15 maanden: gecombineerd Difterie-, Kinkhoest-, Tetanus-, Poliomyelitis-vaccin gemengd met
      Haemophilus influenzae type b-vaccin en hepatitis B-vaccin alsmede geconjugeerd pneumokokkenvaccin;

      c. in de leeftijd van 3–16 maanden: gecombineerd Difterie-, Kinkhoest-, Tetanus-, Poliomyelitis-vaccin gemengd met
      Haemophilus influenzae type b-vaccin en hepatitis B-vaccin;

      d. in de leeftijd van 4–17 maanden: gecombineerd Difterie-, Kinkhoest-, Tetanus-, Poliomyelitis-vaccin gemengd met
      Haemophilus influenzae type b-vaccin en hepatitis B-vaccin alsmede geconjugeerd pneumokokkenvaccin;

      e. in de leeftijd van 11–23 maanden: gecombineerd Difterie-, Kinkhoest-, Tetanus-, Poliomyelitis-vaccin gemengd met
      Haemophilus influenzae type b-vaccin en hepatitis B-vaccin alsmede geconjugeerd pneumokokkenvaccin;

      f. in de leeftijd van 14–23 maanden: gecombineerd Bof-, Mazelen-, Rubella-vaccin alsmede geconjugeerd meningokokken
      C-vaccin;

      g. geboren in het vierde kalenderjaar, voorafgaande aan het lopende kalenderjaar: gecombineerd Difterie-, Tetanus-,
      Polio-vaccin alsmede Kinkhoest-vaccin;

      h. geboren in het negende kalenderjaar, voorafgaande aan het lopende kalenderjaar: gecombineerd Difterie-,
      Tetanus-, Polio-vaccin alsmede gecombineerd Bof-, Mazelen-, Rubella-vaccin.

      2 In bijzondere gevallen kan de toediening van de vaccins, genoemd in het eerste lid, aan een niet of niet volledig
      gevaccineerde verzekerde tot de leeftijd van negentien jaar worden aangemerkt als te geschieden in het kader van de
      uitvoering van het vaccinatieprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0014149
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel6
