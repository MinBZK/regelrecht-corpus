        artikel: '13'
  - number: '2'
    text: |-
      1 Indien het verblijf van de verzekerde in een instelling wordt beëindigd in verband met verblijf als bedoeld in
      [artikel 2.10 van het Besluit zorgverzekering][ref1], bestaat nog gedurende een periode van ten hoogste acht dagen
      aanspraak op tandheelkundige zorg.

      2 Tot negen weken na beëindiging van het verblijf in een instelling bestaat aanspraak op de levering en het
      aanbrengen van een nieuwe of overgezette tandheelkundige prothese, zijnde een plaat-, overkappings-, opbouw- of
      frameprothese, alsmede van kronen of bruggen, indien deze tandheelkundige hulp voor het beëindigen van het verblijf
      was aangevangen. De zorgverzekeraar kan, gehoord de adviserend tandarts, een langere termijn van ten hoogste
      tweeënvijftig weken vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2.10'
  - number: '3'
    text: |-
      1 Het individueel gebruik van een rolstoel omvat mede de voor de verzekerde noodzakelijke aanpassing en vervanging
      alsmede het noodzakelijke onderhoud en herstel van de hem in gebruik gegeven rolstoel. Indien de verzekerde daarop
      is aangewezen, kan een tweede exemplaar in een andere uitvoering worden verstrekt.

      2 De aanspraak op het individueel gebruik van een rolstoel bestaat indien dat gebruik is aangewezen in verband met
      het ontbreken van de loopfunctie dan wel in verband met blijvende of langdurige loopfunctiestoornissen.

      3 Indien het verblijf in een instelling eindigt, wordt de verzekerde in de gelegenheid gesteld de bij hem in
      gebruik zijnde rolstoel in eigendom te verwerven tegen betaling van een bedrag dat gelijk is aan de aanschafprijs,
      met inbegrip van de prijs van de daaraan naderhand aangebrachte wijzigingen, een en ander verminderd met de kosten
      van afschrijving.

      4 Bij de toepassing van het derde lid geldt een afschrijvingstermijn van drie jaren voor elektrisch aangedreven
      rolstoelen en van vijf jaren voor niet-elektrisch aangedreven rolstoelen.
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel3
  - number: '4'
    text: |-
      1 Bij doventolkzorg als bedoeld in [artikel 12 van het Besluit][ref1], bestaat aanspraak op maximaal 30 uren zorg
      door een doventolk, dan wel indien de verzekerde doofblind is, aanspraak op maximaal 168 uren per kalenderjaar.

      2 In afwijking van het eerste lid bestaat aanspraak op meer uren, indien het niet verlenen van meer uren voor de
      verzekerde zal leiden tot een onbillijkheid van overwegende aard.

      3 Aanspraak op zorg door een doventolk bestaat slechts indien de zorg minimaal 30 minuten duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel12
    url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#Artikel4
    references:
