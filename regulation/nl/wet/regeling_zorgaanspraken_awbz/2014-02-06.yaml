preamble:
  text: |-
    Gelet op artikel 2, derde lid, van de Wet voorzieningen gehandicapten, artikel 1p van de Ziekenfondswet, de
    artikelen 2, vierde lid, 13, eerste lid, 17 en 18 van het Besluit zorgaanspraken AWBZ en artikel 16 van het
    Verstrekkingenbesluit ziekenfondsverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014855/2014-02-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. het Besluit: het [Besluit zorgaanspraken AWBZ][ref1];

      b. intramurale zorg: zorg waarbij sprake is van opneming of verblijf in een instelling gedurende tenminste één
      nacht;

      c. extramurale zorg: zorg die niet behoort tot de intramurale zorg;

      d. lidstaat: een lidstaat van de Europese Unie, een andere staat die partij is bij de overeenkomst betreffende de
      Europese Economische Ruimte, alsmede Zwitserland;

      e. cliëntprofiel: een profiel als omschreven in [bijlage 2][ref2] van deze regeling, van zorgvragers met een
      vergelijkbare behoefte aan met verblijf samenhangende zorg en met vergelijkbare beperkingen op dezelfde terreinen,
      bij wie de verzorgings-, verplegings-, begeleidings- of behandelingsdoelen naar aard en inhoud overeenkomen;

      f. zorgzwaartepakket: naar aard, inhoud en omvang bij een cliëntprofiel passende samenhangende zorg als omschreven
      in [bijlage 2][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0014149
      [ref2]: https://wetten.overheid.nl/BWBR0014855
      [ref3]: https://wetten.overheid.nl/BWBR0014855
