  - number: '7'
    text: |-
      1 De verzekerde heeft slechts aanspraak op de zorg, bedoeld in de [artikelen 4][ref1], [5][ref2], [6][ref3],
      [8][ref4], [9][ref5], [9a][ref6] en [13, eerste en tweede lid, van het Besluit][ref7], indien binnen twee weken
      na de aanvang van de zorg door of namens hem aan het uitvoeringsorgaan is gemeld met ingang van welke datum de zorg
      is aangevangen, welke zorg wordt geleverd en wie die zorg levert.

      2 De verzekerde heeft slechts aanspraak op de zorg, bedoeld in [artikel 12 van het Besluit][ref8], indien hij aan
      de zorgverzekeraar een verklaring van de huisarts of behandelend keel-, neus en oorarts heeft overgelegd waaruit
      blijkt dat hij op die zorg is aangewezen.

      3 Het vierde lid is niet van toepassing indien de verzekerde:

      a. dovenonderwijs volgt of heeft gevolgd,

      b. ingevolge de [Wet op de (re)integratie arbeidsgehandicapten][ref9] voor zorg door een doventolk in de werk- en
      onderwijssituatie vergoeding ontvangt, of

      c. op grond van [artikel 1p van de Ziekenfondswet][ref10] zoals die bepaling op 31 december 2005 luidde, zorg door
      een doventolk heeft ontvangen.


