preamble:
  text: |-
    Gelet op artikel 10 van de Welzijnswet 1994 en artikel 3, tweede lid, van de Kaderwet volksgezondheidssubsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. BOS-project: een in samenwerking tussen buurt, onderwijs en sport gecreëerd arrangement gericht op het
      verkleinen van achterstanden in een projectgebied;

      b. arrangement: samenhangend geheel van activiteiten, aansluitend bij de leefwereld en leefsituatie van jeugdigen,
      waarvan sport en bewegen in elk geval onderdeel uitmaakt;

      c. projectgebied: een door de gemeente of samenwerkende gemeenten aangegeven aaneengesloten gebied;

      d. achterstand: een bestaande achterstandssituatie van jeugdigen op het terrein van gezondheid, welzijn, onderwijs,
      opvoeding, sport of bewegen, of een achterstandssituatie in de buurt ontstaan door het gedrag van jeugdigen dat
      door de bewoners van een projectgebied als overlast wordt ervaren;

      e. jeugdige: persoon in de leeftijd van 4 tot 19 jaar.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel1
  - number: '2'
    text: |-
      1 De minister kan in de periode tot en met 2011 aan een gemeente een meerjarige uitkering verstrekken ten behoeve
      van de uitvoering van een BOS-project dat van start gaat in de jaren 2005 tot en met 2009, met dien verstande dat
      aan een gemeente niet meer dan één uitkering voor de bestrijding van dezelfde achterstanden bij dezelfde jeugdigen
      kan worden verstrekt.

      2 Indien een BOS-project uitgaat van samenwerkende gemeenten, wijzen deze gemeenten één van hen aan als aanvrager
      van de uitkering.

      3 De uitkering voor een BOS-project wordt voor minimaal twee en ten hoogste vier jaar verleend.

      4 Een aanvraag voor een uitkering wordt gedaan door het indienen van een BOS-projectplan en de daarbij behorende
      begroting per projectgebied, met gebruikmaking van het format dat is opgenomen in de bij deze regeling behorende
      [bijlagen 1][ref1] en [2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017272
      [ref2]: https://wetten.overheid.nl/BWBR0017272
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017272
      - id: ref2
        bwb_id: BWBR0017272
  - number: '3'
    text: |-
      1 Een BOS-project:

      a. heeft een looptijd van tenminste twee jaar;

      b. is onderdeel van geïntegreerd gemeentelijk beleid op de terreinen gezondheid, welzijn, onderwijs, sport en
      jeugd;

      c. komt tot stand met en wordt uitgevoerd door lokale instellingen en organisaties op het gebied van buurt,
      onderwijs en sport;

      d. bevat in ieder geval sport- of beweegactiviteiten.

      2 Een BOS-projectplan bevat:

      a. een analyse van de achterstanden in het projectgebied;

      b. een beschrijving van het arrangement en van de bijdrage die het arrangement zal leveren aan het verminderen van
      de achterstanden;

      c. een beschrijving van de wijze waarop het arrangement aansluit bij de leefwereld en leefsituatie van jeugdigen;

      d. een beschrijving van de wijze waarop het BOS-project wordt geëvalueerd, zowel gedurende als na afloop van het
      project.

      3 Een aanvraag wordt getoetst op:

      a. de beoogde effecten en de begrote kosten;

      b. de concreetheid en meetbaarheid van de te verwachten resultaten.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel3
  - number: 3a
    text: |-
      1 Het beschikbare budget voor het verstrekken van meerjarige uitkeringen ten behoeve van de uitvoering van BOS-
      projecten die aanvangen in 2006 en waarvoor in 2005 een uitkering wordt verleend bedraagt € 30 000 000.

      2 Het beschikbare budget voor het verstrekken van meerjarige uitkeringen ten behoeve van de uitvoering van BOS-
      projecten die aanvangen na 31 juli 2006 en waarvoor in 2006 een uitkering wordt verleend, bedraagt € 47 000 000.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel3a
  - number: '4'
    text: |-
      1 Bij de verdeling van het beschikbare budget geeft de minister voorrang aan die aanvragen voor BOS-projecten
      in een projectgebied waarvoor nog niet eerder een uitkering, als bedoeld in [artikel 2, eerste lid][ref1], is
      toegekend.

      2 Indien dit, ondanks de toepassing van het eerste lid, voor de verdeling van het beschikbare budget noodzakelijk
      is, geeft de minister bij de beoordeling van de aanvragen voorrang aan de BOS-projecten die in vergelijking met
      andere BOS-projecten meer zullen bijdragen aan het verwezenlijken van het doel van deze regeling, waarbij in ieder
      geval de volgende criteria worden gehanteerd:

      a. de mate van betrokkenheid van buurt-, onderwijs-, sport- en naschoolse opvangorganisaties bij de totstandkoming
      en de uitvoering van het BOS-project;

      b. de mate waarin de uitvoering van de activiteiten in het kader van het BOS-project wat betreft tijdstip
      en locatie aansluiten op de activiteiten en voorzieningen van buurt-, onderwijs-, sport- en naschoolse
      opvangorganisaties;

      c. de duurzaamheid van de activiteiten die in het kader van het BOS-project worden gerealiseerd;

      d. de mate waarin de verschillende terreinen waarop sprake is van een achterstand geïntegreerd zijn betrokken in de
      analyse en bij de aanpak van de achterstanden;

      e. de mate van betrokkenheid van de bewoners van het projectgebied bij het ontwikkelen en uitvoeren van het
      project;

      f. de mate van participatie van jeugdigen bij het ontwikkelen en uitvoeren van het project;

      g. de mate van participatie van sportverenigingen bij het ontwikkelen en uitvoeren van het project;

      h. de mate van participatie van jeugdorganisaties bij het ontwikkelen en uitvoeren van het project;

      i. de mate van participatie van vrijwilligers bij het ontwikkelen en uitvoeren van het project;

      j. de mate van concreetheid en meetbaarheid van de te verwachten resultaten;

      k. de verhouding tussen de beoogde effecten en de begrote kosten.

      3 Indien dit, ondanks de toepassing van het tweede lid, voor de verdeling van het beschikbare budget noodzakelijk
      is, houdt de minister bij de beoordeling van de aanvragen rekening met:

      a. een evenwichtige spreiding van BOS-projecten naar inwonerstal van gemeenten;

      b. een evenwichtige spreiding van BOS-projecten over het land.


      [ref1]: https://wetten.overheid.nl/BWBR0017272#Artikel2
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017272
        artikel: '2'
  - number: '5'
    text: |-
      1 Een aanvraag voor een uitkering voor een BOS-project dat na 1 maart 2005 start, wordt uiterlijk 15 december 2004
      bij de minister ingediend.

      2 Een aanvraag voor een uitkering voor een BOS-project dat aanvangt in 2006 en waarvoor in 2005 een uitkering wordt
      verleend, wordt uiterlijk 1 april 2005 bij de minister ingediend.

      3 Een aanvraag voor een uitkering voor een BOS-project dat aanvangt na 31 juli 2006 en waarvoor in 2006 een
      uitkering wordt verleend, wordt uiterlijk 1 april 2006 bij de minister ingediend.

      4 De minister neemt een beslissing op de aanvraag binnen dertien weken na de uiterste datum voor indiening van
      de aanvraag.

      5 Indien de beslissing een verlening inhoudt, wordt het bedrag van de te verlenen uitkering vermeld.

      6 De [artikelen 4:48][ref1] en [4:50 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel448
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel450
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:48
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:50
  - number: '6'
    text: |-
      1 De uitkering voor een BOS-project bedraagt maximaal 50% van de in de door de minister goedgekeurde begroting
      opgenomen kosten van de uitvoering van het project met een maximum van € 100.000 voor een project van twee jaar,
      € 150.000 voor een project van drie jaar en € 200.000 voor een project van vier jaar.

      2 De kosten van investeringen in accommodaties of materialen bedragen niet meer dan 10% van de begrote kosten van
      het project.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel6
  - number: '7'
    text: |-
      In een beschikking waarbij een meerjarige uitkering wordt verleend, wordt vermeld welk bedrag elk kalenderjaar van
      de betrokken periode als voorschot zal worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel7
  - number: '8'
    text: |-
      Het college van burgemeester en wethouders doet zo spoedig mogelijk schriftelijk mededeling aan de minister van
      omstandigheden die van belang kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van een
      uitkering. Daarbij worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel8
  - number: '9'
    text: |-
      1 Het college van burgemeester en wethouders verstrekt de minister binnen dertien weken na afloop van ieder
      kalenderjaar waarover de uitkering is verleend, met uitzondering van het laatste kalenderjaar, een verslag. Dit
      verslag geeft inzicht in het verloop van het project en de behaalde resultaten.

      2 In afwijking van het eerste lid wordt het verslag over 2005 uiterlijk 1 juni 2006 ingediend.

      3 De minister kan een formulier vaststellen voor het verslag.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel9
  - number: '10'
    text: |-
      1 Binnen zes maanden na afloop van de periode waarvoor een uitkering is verstrekt, zendt het college van
      burgemeester en wethouders een schriftelijk verslag aan de minister over de activiteiten waarvoor de uitkering is
      verstrekt. Dit verslag geeft inzicht in het verloop van het project en de behaalde resultaten.

      2 De minister kan een formulier vaststellen voor het verslag.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel10
  - number: '11'
    text: |-
      Ten behoeve van de vaststelling van de uitkering gaat het verslag, bedoeld in [artikel 10, eerste lid][ref1],
      vergezeld van een verklaring van het college van burgemeester en wethouders waaruit blijkt dat de activiteiten
      waarvoor de uitkering is verstrekt, zijn uitgevoerd. De verklaring wordt ingericht overeenkomstig het format dat is
      opgenomen in de bij deze regeling behorende [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017272#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017272
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017272
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0017272
  - number: '12'
    text: |-
      1 Het college van burgemeester en wethouders verstrekt aan de door de minister aangewezen ambtenaren of andere
      personen op diens verzoek alle bescheiden en inlichtingen die noodzakelijk zijn voor een juiste vervulling van
      hun taak. De bescheiden worden op één adres getoond en de inlichtingen, op verzoek, schriftelijk verstrekt. Indien
      het college van burgemeester en wethouders slechts kan voldoen aan deze verplichting door inbreuk te maken op het
      recht van enig persoon op bescherming van zijn persoonlijke levenssfeer, verstrekt het college van burgemeester en
      wethouders de verlangde gegevens op zodanige wijze dat deze niet tot personen herleidbaar zijn.

      2 Ook anderszins wordt zoveel mogelijk medewerking verleend teneinde de door de minister aangewezen ambtenaren of
      andere personen in staat te stellen hun taak op een juiste wijze te vervullen.
    url: https://wetten.overheid.nl/BWBR0017272/2006-06-09#Artikel12
  - number: '13'
    text: |-
      Binnen zes maanden na ontvangst van het verslag, bedoeld in [artikel 10, eerste lid][ref1], en de verklaring
      van het college van burgemeester en wethouders, bedoeld in [artikel 11][ref2], geeft de minister een beschikking
      tot vaststelling van de uitkering. De [artikelen 4:46][ref3], [4:49][ref4], [4:52][ref5], [4:56][ref6] en
      [4:57 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


