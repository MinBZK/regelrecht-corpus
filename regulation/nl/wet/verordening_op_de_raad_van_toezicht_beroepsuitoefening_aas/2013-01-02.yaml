valid_to: '2013-01-16'
bwb_id: BWBR0014164
url: https://wetten.overheid.nl/BWBR0014164/2013-01-02
preamble:
  text: |-
    Overwegende dat een goede beroepsuitoefening wordt bevorderd door het houden van toezicht daarop;

    Gelet op artikel 24, eerste lid, van de Wet op de Accountants-Administratieconsulenten;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

        - NOvAA: de Nederlandse Orde van Accountants-Administratieconsulenten;
        - Raad: de Raad van Toezicht Beroepsuitoefening AA's;
        - Lid/leden: lid/leden van de Raad van Toezicht Beroepsuitoefening AA's;
        - Accountant: de openbaar accountant zoals gedefinieerd in de Verordening Gedragscode;
        - Accountantspraktijk: de accountantspraktijk zoals gedefinieerd in de Verordening Gedragscode;
        - Accountantskamer: de accountantskamer, bedoeld in [hoofdstuk III van de Wet tuchtrechtspraak accountants][ref1];
        - Dossier: verzameling van schriftelijk, elektronisch of op andere wijze vastgelegde informatie betreffende een
      accountantspraktijk of een cliënt van een accountantspraktijk;
        - AA: Accountant-Administratieconsulent.


      [ref1]: https://wetten.overheid.nl/BWBR0024238#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024238
        hoofdstuk: III
  - number: '2'
    text: |-
      1 Er is een Raad van Toezicht Beroepsuitoefening AA’s.

      2 De Raad heeft tot taak het bij wege van mandaat of uit hoofde van volmacht namens het bestuur van de NOvAA houden
      van toezicht op de beroepsuitoefening door Accountants-Administratieconsulenten.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel2
  - number: '3'
    text: |-
      1 De Raad bestaat uit vijf leden. De leden worden benoemd door het bestuur van de NOvAA.

      2 De zittingsduur van de leden bedraagt vier jaar met eenmaal de mogelijkheid van herbenoeming voor wederom vier
      jaar.

      3 De meerderheid van de leden is geen AA.

      4 De leden beschikken over competenties die relevant geacht kunnen worden in het licht van de taak van de Raad.

      5 Het bestuur van de NOvAA benoemt uit de leden een voorzitter en een plaatsvervangend voorzitter die rechter zijn
      danwel rechter zijn geweest en geen AA zijn.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel3
  - number: '4'
    text: |-
      1 De leden treden af volgens een door de Raad vast te stellen rooster.

      Het rooster wordt zodanig ingericht, dat voor zover mogelijk telkenmale hetzelfde aantal leden aftreedt.

      2 Het bestuur van de NOvAA kan een lid slechts ontslaan op voordracht van de Raad wegens ongeschiktheid.

      3 Het lidmaatschap van de Raad eindigt bij het onherroepelijk worden van een veroordeling door de accountantskamer.

      4 Hij, die benoemd is ter vervulling van een tussentijds opengevallen plaats in de Raad, treedt af op het tijdstip,
      waarop degene, in wiens plaats hij is benoemd, had moeten aftreden. Hij kan éénmaal worden herbenoemd.

      6 In het belang van de continuïteit van de Raad, kan het bestuur afwijken van het vorige lid.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel4
  - number: '5'
    text: |-
      1 De leden zijn onpartijdig.

      2 De leden stemmen zonder last of ruggespraak.

      3 De leden zijn verplicht tot geheimhouding, behalve voor zover de uitvoering van de in deze verordening vervatte
      taak verdere bekendmaking vereist of bij wet anders is bepaald.

      4 De leden die geen AA zijn, mogen niet in relatie staan tot een accountantspraktijk, anders dan een cliëntrelatie.

      5 De leden die AA zijn, onthouden zich van een oordeel, daaronder begrepen het uitbrengen van een stem, inzake
      aangelegenheden waarbij sprake kan zijn van belangenverstrengeling.

      6 Het lidmaatschap van de Raad is onverenigbaar met het lidmaatschap van het bestuur van de NOvAA. Tevens is het
      lidmaatschap van de Raad onverenigbaar met een dienstbetrekking bij de NOvAA.

      7 De leden ontvangen een vergoeding van reis- en verblijfkosten en een vergoeding voor bestede tijd volgens door de
      ledenvergadering vastgestelde verordeningen.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel5
  - number: '6'
    text: |-
      1 De Raad vergadert zo dikwijls hij zulks nodig oordeelt.

      2 Voor het nemen van besluiten is de aanwezigheid van de meerderheid van het aantal leden vereist.

      3 Ieder lid brengt slechts één stem uit.

      4 Voor het nemen van een besluit bij stemming is de meerderheid van de uitgebrachte stemmen vereist.

      Blanco stemmen worden geacht niet te zijn uitgebracht.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel6
  - number: '10'
    text: |-
      Jaarlijks voor 1 maart brengt de Raad een geanonimiseerd verslag uit omtrent zijn werkzaamheden in het afgelopen
      kalenderjaar en maakt dit openbaar.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel10
  - number: '11'
    text: |-
      1 De Raad kan voor zijn onderzoek externe deskundigen, waaronder accountants, inschakelen.

      2 De Raad zal externe deskundigen verplichten tot geheimhouding ter zake van al hetgeen hun bij de vervulling van
      hun taak ter kennis komt behalve voor zover bij wet anders is bepaald.

      3 De Raad zal externe deskundigen van de in het tweede lid genoemde verplichting ontheffen indien dat noodzakelijk
      is voor het toezicht op de stelsels van kwaliteitsbeheersing of voor het verkrijgen dan wel behouden van de in
      [artikel 25, eerste lid, van de Verordening op de kwaliteitstoetsing NOvAA][ref1] bedoelde accreditatie.


      [ref1]: https://wetten.overheid.nl/BWBR0031878#Artikel25
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031878
        artikel: '25'
  - number: '12'
    text: |-
      1 De door de Raad gemaakte kosten komen ten laste van de NOvAA.

      2 Deze kosten worden door het bestuur van de NOvAA afzonderlijk inde begroting en financiële verantwoording van de
      NOvAA vermeld.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel12
  - number: '14'
    text: |-
      1 Deze verordening treedt in werking op de tweede dag na publicatie in de Staatscourant.

      2 Het toezicht ziet op de naleving vanaf 1 januari 2003 van de voor accountants geldende regelgeving en algemeen
      aanvaarde normen voor de beroepsuitoefening.

      3 Deze verordening kan worden aangehaald als: Verordening op de Raad van Toezicht Beroepsuitoefening AA's.
    url: https://wetten.overheid.nl/BWBR0014164/2013-01-02#Artikel14
