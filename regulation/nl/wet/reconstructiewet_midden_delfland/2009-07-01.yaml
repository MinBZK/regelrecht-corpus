preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot de reconstructie
    van Midden-Delfland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet verstaat onder: "provinciale staten": provinciale staten van Zuid-Holland; "gedeputeerde staten":
      gedeputeerde staten van Zuid-Holland; "Centrale Cultuurtechnische Commissie": de commissie, bedoeld in artikel
      3 van de Ruilverkavelingswet 1954; "Natuurwetenschappelijke Commissie": de Natuurwetenschappelijke Commissie van
      de Natuurbeschermingsraad, ingesteld bij besluit van 25 oktober 1968 *(Stcrt.* 1968, 227); "Coördinatiecommissie
      Openluchtrecreatie": de commissie ingesteld bij beschikking van 9 januari 1975, Directie Natuurbehoud en
      Openluchtrecreatie, nr. 40805 *(Stcrt.* 1975, 22); "reconstructie-commissie": de commissie, genoemd in
      [artikel 3][ref1]; "rechtbank": de arrondissements-rechtbank te Rotterdam; "eigenaar": hij, die eigenaar is van
      in Midden-Delfland gelegen onroerende zaken, en hij aan wie een recht van opstal, erfpacht, vruchtgebruik, gebruik
      of bewoning toebehoort, waaraan een in Midden-Delfland gelegen onroerende zaak is onderworpen, met dien verstande,
      dat onder het recht van opstal niet wordt begrepen dat recht voor zover het betreft het leggen en houden van
      leidingen in, op of boven de onroerende zaak van een ander; "rechthebbende": eigenaar en hij aan wie een niet onder
      de omschrijving van eigenaar genoemd beperkt recht toebehoort, waaraan een in Midden-Delfland gelegen onroerende
      zaak is onderworpen, hij aan wie met betrekking tot zulk een zaak een recht van huur toebehoort of hij aan wie met
      betrekking tot zulk een zaak een recht als bedoeld in [artikel 252 van Boek 6 van het Burgerlijk Wetboek][ref2]
      toebehoort; "Midden-Delfland": het gebied Midden-Delfland zoals dit in hoofdlijnen is aangegeven op de
      bij deze wet behorende kaart en door Ons nader zal worden vastgesteld; "landbouw": akkerbouw, weidegrond,
      veehouderij, pluimveehouderij, tuinbouw en bosbouw; "openbare registers": de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '3'
        hoofdstuk: I
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005289
        artikel: '252'
      - id: ref3
        bwb_id: BWBR0005291
        afdeling: '2'
  - number: '2'
    text: |-
      Ter bevordering van een goede ruimtelijke ordening en in verband daarmede ter behartiging van de belangen van de
      landbouw, van natuur en landschap en van de openluchtrecreatie in Midden-Delfland, vindt aldaar een reconstructie
      plaats op de voet van het bepaalde in deze wet.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      Er is een reconstructie-commissie, die belast is met de leiding en de uitvoering van de reconstructie van Midden-
      Delfland.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      De commissie bestaat uit ten hoogste vijftien leden. Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer benoemt in overeenstemming met Onze Ministers van Landbouw, Natuurbeheer en Visserij, van Verkeer
      en Waterstaat en van Financiën de voorzitter en de overige leden en, zo nodig, plaatsvervangende leden van de
      commissie. Alvorens tot benoeming wordt overgegaan, worden gedeputeerde staten gehoord.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      De reconstructiecommissie stelt, al dan niet uit haar midden, subcommissies in met betrekking tot de drie
      hoofdsectoren landbouw, natuur en landschap en recreatie; met betrekking tot andere aspecten is zij bevoegd
      zodanige subcommissies in te stellen. Een hiertoe strekkend besluit behoeft de goedkeuring van Onze in het tweede
      lid genoemde Ministers.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel3
  - number: '3.4'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kan in overeenstemming met Onze in het
      tweede lid genoemde Ministers adviserende leden van de commissie benoemen. Het bestuur van de Dienst voor het
      kadaster en de openbare registers wijst in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij
      een ingenieur van het kadaster en een of meer plaatsvervangers aan, die de commissie bijstaan. In overeenstemming
      met Onze in het tweede lid genoemde Ministers benoemt Onze Minister van Landbouw, Natuurbeheer en Visserij de
      secretaris en zonodig deskundigen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer stelt in overeenstemming met Onze in het
      tweede lid genoemde Ministers een instructie voor de commissie vast.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer zendt bericht van de benoeming van de
      reconstructie-commissie aan gedeputeerde staten en aan de rechtbank.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      De rechtbank benoemt binnen dertig dagen na ontvangst van dit bericht een rechter-commissaris en doet hiervan
      mededeling aan gedeputeerde staten en aan de reconstructie-commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel4
  - number: '5'
    text: |-
      Het algemeen nut vordert de onteigening ten name van de Staat van onroerende zaken en rechten als bedoeld in
      [artikel 4, eerste lid, van de onteigeningswet][ref1] in het gedeelte van Midden-Delfland, dat op de bij deze wet
      behorende kaart met een gele kleur in hoofdlijnen is aangegeven, zulks ten behoeve van de reconstructie van genoemd
      gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel4
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '4'
  - number: '6'
    text: |-
      De vordering tot onteigening van hetgeen niet in der minne is verkregen, moet worden ingesteld binnen twee jaar
      na de dagtekening van de *Staatscourant*, waarin Ons besluit, bedoeld in [artikel 14 der Onteigeningswet][ref1],
      is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel14
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '14'
  - number: '7.1'
    text: |-
      [Artikel 12, laatste lid, van de Onteigeningswet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel12
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '12'
  - number: '7.2'
    text: 'Voor de toepassing van deze wet:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel7
  - number: 7.2.a
    text: |-
      wordt in [artikel 12, onder 1e, van de Onteigeningswet][ref1] in plaats van de woorden "een uitgewerkt plan met
      uitvoerige kaarten van het werk" gelezen: een globaal plan met een of meer kaarten, aangevende de aard, de omvang
      en de strekking van de noodzakelijk geachte werkzaamheden of ontwikkelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel12
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '12'
  - number: 7.2.b
    text: |-
      wordt [artikel 23, onder 3e, van de Onteigeningswet][ref1] als volgt gelezen: een mede door de burgemeester
      afgegeven bewijs, dat het globale plan met de daarbij behorende kaarten en de grondtekeningen overeenkomstig
      [artikel 12][ref2] op de secretarie der gemeenten ter inzage hebben gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel12
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: 7.2.c
    text: |-
      wordt [artikel 25, onder 4e, van de Onteigeningswet][ref1] als volgt gelezen: wanneer het globale plan met de
      daarbij behorende kaarten en de grondtekeningen niet overeenkomstig [artikel 12][ref2] op de secretarieën der
      gemeenten ter inzage hebben gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001842#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel12
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001842
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '8'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij is belast met de uitvoering van de bepalingen van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel8
  - number: '9.1'
    text: |-
      Nadat het plan van voorzieningen of een gedeelte daarvan overeenkomstig het bepaalde in [artikel 44][ref1] is
      vastgesteld mogen eigenaren en gebruiksgerechtigden van de in dat plan of gedeelte daarvan begrepen onroerende
      zaken geen handelingen verrichten, noch die handelingen, welke door een normale bedrijfsvoering worden geëist,
      achterwege laten, indien daardoor de waarde van die onroerende zaken zou veranderen, tenzij hun daartoe door de
      reconstructie-commissie toestemming is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel44
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '44'
        hoofdstuk: III
        afdeling: '6'
  - number: '9.2'
    text: Overtreding van het bepaalde in het vorige lid wordt gestraft met een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel9
  - number: '9.3'
    text: Het strafbaar feit wordt als een overtreding beschouwd.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel9
  - number: '10'
    text: |-
      Waardevermeerdering, ontstaan, nadat het plan van voorzieningen of een gedeelte hiervan is vastgesteld, behoeft
      niet te worden vergoed, tenzij deze waardevermeerdering het gevolg is van handelingen, waarvoor de reconstructie-
      commissie toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel10
  - number: '11'
    text: |-
      Indien en voor zover voor de doeleinden van de reconstructie beperkingen aan de uitoefening van de landbouw worden
      gesteld, kan op voorstel van de reconstructie-commissie Onze Minister van Landbouw, Natuurbeheer en Visserij
      volgens door hem in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer te
      stellen regelen subsidie verlenen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel11
  - number: '12.1'
    text: |-
      Wanneer de reconstructie-commissie het ten behoeve van de reconstructie nodig acht, dat iemands grond wordt
      betreden of daarop gravingen of opmetingen worden verricht of tekens gesteld, moeten zowel de eigenaren als de
      gebruiksgerechtigden van die grond dit gedogen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel12
  - number: '12.2'
    text: |-
      De burgemeester is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de in het eerste lid
      bedoelde gedoogplicht.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      De schade, welke uit de toepassing van het eerste lid mocht voortvloeien, wordt uit ’s Rijks kas betaald. Bij
      geschil over het bedrag der schade wordt dit op verzoek van de meest gerede partij en nadat de wederpartij de
      gelegenheid heeft gehad haar belangen te verdedigen, door de kantonrechter bepaald zonder hoger beroep.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel12
  - number: '13'
    text: |-
      Aan een werknemer wordt door de reconstructie-commissie uit ’s Rijks kas een geldelijke bijdrage verleend in door
      Onze Minister van Landbouw, Natuurbeheer en Visserij te bepalen gevallen en volgens door hem te stellen regelen,
      indien het bedrijf waarin de werknemer werkzaam is, ten gevolge van de toepassing van [hoofdstuk II][ref1] of
      [artikel 18][ref2] wordt beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel18
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003094
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '14.1'
    text: 'Geen wijziging wordt gebracht in het recht van de eigenaar en in de gebruikstoestand ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: 14.1.a
    text: |-
      begraafplaatsen, crematoria en bewaarplaatsen als bedoeld in onderscheidenlijk de [artikelen 23][ref1], [49][ref2]
      en [60, eerste lid, onder c, van de Wet op de lijkbezorging][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005009#Artikel60
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '49'
      - id: ref3
        bwb_id: BWBR0005009
        artikel: '60'
  - number: 14.1.b
    text: |-
      gesloten begraafplaatsen dan wel graven of grafkelders als bedoeld in
      [artikel 85 van de Wet op de lijkbezorging][ref1], binnen de termijnen en anders dan op de wijze, omschreven in
      [artikel 46, tweede lid en derde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0005009#Artikel46
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0005009
        artikel: '46'
  - number: '14.2'
    text: |-
      Zonder toestemming van Onze Minister van Defensie wordt geen wijziging gebracht in de rechten en de
      gebruikstoestand ten aanzien van onroerende zaken, welke een militaire bestemming hebben.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: '14.3'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] wordt zonder toestemming van de eigenaar geen
      wijziging gebracht in diens recht ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003094#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003094
        hoofdstuk: II
  - number: 14.3.a
    text: gebouwen,
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: 14.3.b
    text: parken,
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: 14.3.c
    text: gedenktekenen met bijbehorende terreinen,
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: 14.3.d
    text: |-
      onroerende zaken van rechtspersonen, die bevordering van natuurschoon ten doel hebben of die deze zaken in stand
      houden om hun natuurwetenschappelijke waarde, indien en zolang zij als zodanig door Ons zijn erkend ingevolge
      artikel 9, derde lid, onder *e*, van de Ruilverkavelingswet 1954.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: '14.4'
    text: |-
      De reconstructie-commissie kan onder goedkeuring van gedeputeerde staten afwijken van het bepaalde in het derde lid
      in het belang van de totstandkoming van een doelmatige reconstructie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] heeft iedere eigenaar aanspraak op het
      verkrijgen van een recht van dezelfde aard, als hij had op in Midden-Delfland gelegen onroerende zaken, op de voet
      van het in de volgende leden bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003094
        hoofdstuk: II
  - number: '15.2'
    text: |-
      De totale waarde van alle in Midden-Delfland gelegen onroerende zaken wordt tot een maximum van vijf procent
      verminderd met de waarde der onroerende zaken, opgenomen in het plan van wegen en waterlopen en in het
      landschapsplan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel15
  - number: '15.3'
    text: |-
      De aan een eigenaar toe te delen waarde in kavels staat tot de na toepassing van het tweede lid verkregen totale
      waarde, als de waarde van zijn in Midden-Delfland gelegen onroerende zaken tot de waarde van alle in Midden-
      Delfland gelegen onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel15
  - number: '15.4'
    text: |-
      Van de bepaling van het derde lid mag worden afgeweken, indien zij de totstandkoming van een behoorlijke
      reconstructie in de weg zou staan. Deze afwijking mag, tegen de wil van de eigenaar of van degene, die op de
      onroerende zaak een recht van hypotheek of van grondrente heeft, niet meer bedragen dan vijf ten honderd van de
      waarde, waarop de eigenaar ingevolge het derde lid aanspraak heeft.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel15
  - number: '16'
    text: |-
      Onder waarde wordt in [artikel 15][ref1] verstaan, de waarde bedoeld in [artikel 49, eerste lid][ref2], zoals deze
      op grond van de schatting is komen vast te staan. Indien evenwel ten gevolge van de in [artikel 46][ref3] genoemde
      werkzaamheden een waardeverandering ontstaat, kan de reconstructie-commissie hiermede bij de toedeling rekening
      houden. Op verzoek van de eigenaar vindt echter verrekening in geld plaats op grondslag van die waarde-verandering,
      voor zover het belang van de reconstructie zich hiertegen niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel46
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '49'
        hoofdstuk: III
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '46'
        hoofdstuk: III
        afdeling: '6'
  - number: '17'
    text: |-
      Het verschil tussen de waarde der van de eigenaar in Midden-Delfland gelegen onroerende zaken en de waarde van
      de hem toegedeelde onroerende zaken, zoals deze overeenkomstig [artikel 92][ref1] is vastgesteld, wordt in geld
      verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel92
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '92'
        hoofdstuk: III
        afdeling: '11'
  - number: '18.1'
    text: |-
      De eigenaar, die zulks vóór een door Onze Minister van Landbouw, Natuurbeheer en Visserij te bepalen
      tijdstip schriftelijk aan de reconstructie-commissie verzoekt, ontvangt, in afwijking van het bepaalde in
      [artikel 15][ref1], algehele vergoeding in geld.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel15
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '18.2'
    text: |-
      De reconstructie-commissie maakt het in het eerste lid bedoelde tijdstip bekend in de *Staatscourant*, in ten
      minste twee nieuwsbladen, die in de streek worden verspreid, en in de gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel18
  - number: '18.3'
    text: |-
      Zodra de lijst van rechthebbenden te zijnen aanzien vaststaat ontvangt de in het eerste lid bedoelde eigenaar,
      die schriftelijk afstand heeft gedaan van het gebruik van de hem toebehorende onroerende zaak, op zijn verzoek een
      voorschot op de algehele vergoeding in geld.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel18
  - number: '18.4'
    text: |-
      Het bedrag van het voorschot wordt op verzoek van de eigenaar door de rechter-commissaris vastgesteld, gehoord de
      reconstructie-commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel18
  - number: '18.5'
    text: |-
      De reconstructie-commissie is bevoegd te bepalen, dat een eigenaar, in afwijking van het bepaalde in
      [artikel 15][ref1] algehele vergoeding in geld zal ontvangen, wanneer de waarde van de hem in Midden-Delfland
      gelegen onroerende zaken zo gering is, dat de toepassing van [artikel 15][ref2] zou leiden tot de vorming van een
      niet behoorlijk te exploiteren kavel en hij geen redelijk belang heeft bij het verkrijgen van een zodanige kavel.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel15
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '19'
    text: 'Elke kavel moet zó worden gevormd, dat hij:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel19
  - number: '19.1'
    text: uitweg heeft op een openbare land- of waterweg en zo mogelijk daaraan belendt;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel19
  - number: '19.2'
    text: zo nodig en mogelijk de gelegenheid tot behoorlijke afwatering en watervoorziening heeft.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel19
  - number: '20.1'
    text: |-
      Behoudens de toepassing van de bepalingen van [hoofdstuk II][ref1] van deze wet heeft iedere pachter van in
      Midden-Delfland gelegen onroerende zaken recht op het in pacht verkrijgen van een waarde in kavels naar dezelfde
      maatstaven als in [artikel 15][ref2] voor de toedeling in eigendom bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel15
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003094
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
  - number: '20.2'
    text: |-
      De reconstructie-commissie kan een bestaande pachtverhouding opheffen en een nieuwe pachtverhouding vestigen in
      dier voege, dat aan een verpachter een pachter uit de in het eerste lid bedoelde pachters kan worden toegewezen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel20
  - number: '20.3'
    text: |-
      De reconstructie-commissie bepaalt tot welk tijdstip de uit een nieuw gevestigde pachtverhouding voortvloeiende
      pachtovereenkomst zal gelden en of deze overeenkomst, indien zij voor kortere dan de wettelijke duur zal gelden,
      voor verlenging vatbaar zal zijn. Zij draagt daarbij zorg, dat de pachter en de verpachter, wat het einde en de
      verlengbaarheid der overeenkomst betreft, zoveel mogelijk dezelfde aanspraken behouden als zij aan de opgeheven
      pachtverhouding konden ontlenen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel20
  - number: '20.4'
    text: |-
      Het bepaalde in [artikel 18][ref1] is ten aanzien van de pachter van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel18
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '21.1'
    text: |-
      Op het recht, als bedoeld in het eerste lid van [artikel 20][ref1], kan de pachter slechts aanspraak maken, indien
      de pachtovereenkomst aan de reconstructie-commissie ter registratie is ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '21.2'
    text: |-
      De inzending ter registratie dient plaats te vinden binnen dertig dagen na een door de reconstructie-commissie te
      bepalen tijdstip, of, indien de pachtovereenkomst na deze dag is aangegaan, binnen dertig dagen na het aangaan van
      de overeenkomst, doch uiterlijk tot een door de reconstructie-commissie vast te stellen tijdstip. Deze tijdstippen
      worden ter openbare kennis gebracht in ten minste twee nieuwsbladen, die in de streek verspreid worden, en in de
      gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel21
  - number: '21.3'
    text: Van de registratie wordt door de reconstructie-commissie een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel21
  - number: '22.1'
    text: |-
      De reconstructie-commissie zendt aan de wederpartij van degene, die een pachtovereenkomst ter registratie heeft
      ingezonden, bij aangetekende brief bericht van de inzending ter registratie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel22
  - number: '22.2'
    text: |-
      De wederpartij kan zijn bezwaren tegen de registratie binnen veertien dagen na de dagtekening van de in het vorige
      lid bedoelde brief schriftelijk aan de reconstructie-commissie kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel22
  - number: '23.1'
    text: |-
      Indien overeenkomstig het bepaalde in het tweede lid van [artikel 22][ref1] bezwaren zijn kenbaar gemaakt, stelt
      de reconstructie-commissie onder vastlegging van die bezwaren bij aangetekende brief partijen ervan in kennis, dat
      binnen dertig dagen na de dagtekening van deze brief bij de reconstructie-commissie dient te worden ingezonden,
      hetzij een door beide partijen ondertekende akte, waaruit blijkt, dat overeenstemming is verkregen, hetzij een
      gewaarmerkt afschrift van het verzoekschrift, waarbij de meest gerede partij de beslissing van de pachtkamer van de
      rechtbank heeft ingeroepen. De waarmerking van het afschrift geschiedt door de griffier van de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel22
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '22'
        hoofdstuk: III
        afdeling: '3'
  - number: '23.2'
    text: |-
      Indien de reconstructie-commissie bevindt, dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      [artikel 318, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht is genomen draagt zij voor
      zover nodig partijen bij aangetekende brief op de beslissing van de grondkamer in te roepen en binnen dertig
      dagen na de dagtekening van deze brief een door de secretaris van de grondkamer gewaarmerkt afschrift van het
      verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel318
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '318'
  - number: '23.3'
    text: |-
      Indien de reconstructie-commissie bevindt, dat met betrekking tot de ter registratie ingezonden pachtovereenkomst
      [artikel 317, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] niet in acht genomen is, draagt zij voor
      zover nodig partijen bij aangetekende brief op de beslissing van de pachtkamer van de rechtbank in te roepen en
      binnen dertig dagen na de dagtekening van deze brief een door de griffier van de rechtbank gewaarmerkt afschrift
      van het verzoekschrift in te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel317
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '317'
  - number: '23.4'
    text: |-
      Indien aan het bepaalde in de vorige leden geen gevolg is gegeven, is de reconstructie-commissie bevoegd met het
      bestaan der pachtovereenkomst geen rekening te houden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel23
  - number: '23.5'
    text: |-
      De grondkamer en de pachtkamer van de rechtbank en in beroep de Centrale Grondkamer en de pachtkamer van het
      Gerechtshof te Arnhem behandelen de verzoeken en vorderingen bedoeld in deze wet vóór alle andere zaken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel23
  - number: '24'
    text: |-
      De reconstructie-commissie deelt binnen veertien dagen, nadat het plan van toedeling is komen vast te staan, aan
      de grondkamer mede, welke pachtverhoudingen gehandhaafd, welke opgeheven en welke opnieuw gevestigd zijn, onder
      vermelding van de namen en woonplaatsen van partijen in de pachtverhoudingen, de onroerende zaken, waarop deze
      betrekking hebben, en de bepalingen op grond van [artikel 20][ref1] inzake de duur en de verlengbaarheid der uit de
      gevestigde pachtverhoudingen voorvloeiende pachtovereenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '25.1'
    text: |-
      De grondkamer ontwerpt de pachtovereenkomsten, welke uit de gevestigde pachtverhoudingen voortvloeien en neemt
      daarin op de in het [derde lid van artikel 20][ref1] bedoelde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '25.2'
    text: |-
      Indien ingevolge het bepaalde in [artikel 20][ref1] een overeenkomst, geldende voor kortere dan de wettelijke duur,
      verlengbaar zal zijn, doet de grondkamer daarvan blijken door een op de ontwerp-overeenkomst gestelde en door haar
      ondertekende verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '25.3'
    text: |-
      De grondkamer zendt de ontwerp-pachtovereenkomsten aan hen, die daarbij partij zullen zijn en stelt hen in de
      gelegenheid binnen dertig dagen na de toezending de ondertekende overeenkomst aan de grondkamer te doen toekomen.
      Betrokkenen kunnen de door hen overeengekomen pachtprijs alsmede bijzondere bepalingen in de overeenkomst opnemen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel25
  - number: '25.4'
    text: |-
      Op de in het vorige lid bedoelde pachtovereenkomsten vinden de bepalingen van de
      [titel 7.5 van het Burgerlijk Wetboek][ref1] toepassing, met dien verstande, dat de grondkamer niet treedt in de
      beoordeling van de bepalingen der overeenkomst, welke voortvloeien uit de pachtverhouding, zoals deze door het plan
      van toedeling is komen vast te staan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: '26'
    text: |-
      Indien partijen niet binnen de in het [derde lid van artikel 25][ref1] gestelde termijn tot inzending van de
      getekende pachtovereenkomst bij de grondkamer zijn overgegaan, maakt de grondkamer een akte in drievoud op,
      gelijkluidend aan de aan partijen gezonden ontwerp-pachtovereenkomst, en bepaalt daarin de pachtprijs. De
      grondkamer ondertekent de akte en zendt een exemplaar daarvan bij aangetekende brief aan ieder der partijen toe.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel25
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '25'
        hoofdstuk: III
        afdeling: '3'
  - number: '27.1'
    text: De akte heeft dezelfde kracht als een tussen partijen gesloten, door de grondkamer goedgekeurde pachtovereenkomst.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel27
  - number: '27.2'
    text: |-
      Het opmaken en ondertekenen van de akte is een beschikking van de grondkamer, waartegen partijen beroep kunnen
      instellen. Het beroep moet worden ingesteld binnen dertig dagen na de verzending van de in [artikel 26][ref1]
      bedoelde aangetekende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel26
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '26'
        hoofdstuk: III
        afdeling: '3'
  - number: '27.3'
    text: |-
      De Centrale Grondkamer, beslissende op een beroep als bedoeld in het tweede lid, kan de akte wijzigen, met
      uitzondering van bepalingen, welke voortvloeien uit de pachtverhouding, zoals deze door het plan van toedeling is
      komen vast te staan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel27
  - number: '28.1'
    text: |-
      Partijen in een gehandhaafde pachtverhouding, zenden, indien de pachtovereenkomst ten gevolge van de reconstructie
      gewijzigd of door een nieuwe vervangen moet worden, binnen dertig dagen, nadat het plan van toedeling is komen vast
      te staan, een desbetreffende overeenkomst ter goedkeuring bij de grondkamer in.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel28
  - number: '28.2'
    text: |-
      De nieuwe overeenkomst eindigt op hetzelfde tijdstip als waarop de overeenkomst, waarvoor zij in de plaats treedt,
      zou zijn geëindigd. Indien laatstbedoelde overeenkomst voor de wettelijke duur gold, tekent de grondkamer op de
      nieuwe overeenkomst aan, dat deze verlengbaar zal zijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel28
  - number: '28.3'
    text: |-
      Indien aan het bepaalde, in het eerste lid niet is voldaan, vinden op verzoek van de meest gerede partij de
      [artikelen 26][ref1] en [27][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel27
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '26'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '27'
        hoofdstuk: III
        afdeling: '3'
  - number: '29.1'
    text: |-
      Alle pachtovereenkomsten, welke ingevolge de bepalingen van deze afdeling tot stand komen, treden van rechtswege in
      werking op het tijdstip, waarop de in [artikel 89][ref1] bedoelde akte in de openbare registers wordt ingeschreven.
      Op hetzelfde tijdstip eindigen de pachtovereenkomsten, voor welke de eerstgenoemde pachtovereenkomsten in de plaats
      treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
        hoofdstuk: III
        afdeling: '10'
  - number: '29.2'
    text: |-
      Het bepaalde in het eerste lid is van overeenkomstige toepassing ten aanzien van de rechtsverhoudingen, geregeld
      bij een akte als bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel26
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '26'
        hoofdstuk: III
        afdeling: '3'
  - number: '30.1'
    text: |-
      De beperkte rechten, het recht van huur en de lasten welke met betrekking tot de onroerende zaken, gelegen in
      Midden-Delfland, bestaan, worden geregeld of opgeheven onder regeling van de geldelijke gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel30
  - number: '30.2'
    text: In het belang der reconstructie kunnen beperkte rechten worden gevestigd.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel30
  - number: '30.3'
    text: |-
      De hypotheken gaan met behoud van haar rang over op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij rusten, worden toegedeeld. In de gevallen, voorzien in [artikel 18][ref1], oefenen de
      hypotheekhouder en degene, die op de zaak een recht van grondrente had, hun rechten uit op de wijze, als omschreven
      in [artikel 43 van de Onteigeningswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001842#Artikel43
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001842
        artikel: '43'
  - number: '30.4'
    text: |-
      Conservatoire en executoriale beslagen gaan over de op de kavels of gedeelten van kavels, welke in de plaats van de
      onroerende zaak, waarop zij gelegd zijn, worden toegedeeld, alsmede op de geldsommen, welke in de plaats van kavels
      of ter zake van onderbedeling worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel30
  - number: '31'
    text: |-
      Voor Midden-Delfland wordt een reconstructieprogramma vastgesteld, inhoudende de uitgangspunten voor de
      reconstructie, bedoeld in [artikel 2][ref1], een omschrijving van de voor de verwezenlijking van die reconstructie
      aan te wenden middelen, alsmede de uitgangspunten voor een verdeling van de kosten van de reconstructie.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel2
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '2'
        hoofdstuk: I
        afdeling: '2'
  - number: '32.1'
    text: |-
      De reconstructie-commissie stelt een voorontwerp voor het reconstructieprogramma voorlopig vast en maakt dit alom
      in Midden-Delfland bekend onder vermelding van het adres, alwaar ter zake inlichtingen kunnen worden ingewonnen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel32
  - number: '32.2'
    text: |-
      De reconstructie-commissie verschaft gedurende ten minste drie maanden nadien gelegenheid zienswijzen en
      denkbeelden over het voorontwerp naar voren te brengen en daarover zowel onderling als met vertegenwoordigers van
      de reconstructie-commissie van gedachten te wisselen. Van dit overleg en de uitkomsten daarvan wordt een rapport
      opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel32
  - number: '32.3'
    text: |-
      Het rapport wordt uiterlijk negen maanden na de bekendmaking, bedoeld in het eerste lid, afgesloten. Het bevat
      onder meer een overzicht van de naar voren gebrachte zienswijzen en denkbeelden en een uiteenzetting, in hoeverre
      daarmede al dan niet rekening is gehouden bij de vaststelling van het in het volgende lid bedoelde voorontwerp van
      het reconstructieprogramma.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel32
  - number: '32.4'
    text: |-
      De reconstructie-commissie stelt het voorontwerp voor het reconstructieprogramma vast en zendt het met het in het
      vorige lid bedoelde rapport aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel32
  - number: '33.1'
    text: |-
      Gedeputeerde staten leggen het voorontwerp van het reconstructieprogramma met het rapport gedurende een maand ter
      kosteloze inzage van een ieder neder ter provinciale griffie en ter secretarie van de gemeenten in Midden-Delfland.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel33
  - number: '33.2'
    text: |-
      Gedeputeerde staten doen van de tervisielegging tevoren openbare kennisgeving in de *Nederlandse Staatscourant*, in
      tenminste twee nieuwsbladen die in de streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel33
  - number: '34.1'
    text: |-
      Binnen veertien dagen na de laatste dag waarop de in [artikel 33, eerste lid][ref1], bedoelde stukken ter inzage
      hebben gelegen, kan een ieder schriftelijk bedenkingen naar voren brengen bij provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel33
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '33'
        hoofdstuk: III
        afdeling: '5'
  - number: '34.2'
    text: |-
      Deze bevoegdheid wordt in de kennisgeving, bedoeld in [artikel 33, tweede lid][ref1], vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel33
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '33'
        hoofdstuk: III
        afdeling: '5'
  - number: '35.1'
    text: |-
      Provinciale staten stellen binnen vier maanden na het verstrijken van de in het eerste lid van het vorige artikel
      bedoelde termijn het reconstructieprogramma in ontwerp vast, waarbij zij zodanig acht slaan op de naar voren
      gebrachte bedenkingen als zij menen te moeten doen. Indien provinciale staten voornemens zijn af te wijken van
      het voorontwerp, winnen zij advies in van de reconstructie-commissie. Provinciale staten leggen hun standpunt ten
      aanzien van de naar voren gebrachte bedenkingen in een rapport vast.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel35
  - number: '35.2'
    text: |-
      Gedeputeerde staten zenden het door provinciale staten in ontwerp vastgestelde reconstructieprogramma met het
      in [artikel 32, derde lid][ref1], bedoelde rapport en de in [artikel 34, eerste lid][ref2], bedoelde bedenkingen
      alsmede het in het vorige lid bedoelde rapport onverwijld aan Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel34
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '32'
        hoofdstuk: III
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '34'
        hoofdstuk: III
        afdeling: '5'
  - number: '36.1'
    text: |-
      Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuurbeheer en
      Visserij stellen, gehoord in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Financiën het
      reconstructieprogramma vast binnen zes maanden nadat Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer het vastgestelde ontwerp met de bijlagen heeft ontvangen. Voor zover Onze Ministers bij de
      vaststelling afwijken van het ontwerp zoals dit door provinciale staten is vastgesteld, vermeldt de motivering
      van hun besluit in ieder geval de redenen daarvoor. Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer doet hiervan schriftelijk mededeling aan gedeputeerde staten uiterlijk veertien dagen nadat het in dit
      lid bedoelde besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel36
  - number: '36.2'
    text: |-
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer deelt het standpunt van Onze, in het
      vorige lid bedoelde, Ministers naar aanleiding van de naar voren gebrachte bedenkingen en het in het eerste lid
      van artikel 35 bedoelde rapport schriftelijk aan degenen die bedenkingen naar voren hebben gebracht mede uiterlijk
      veertien dagen nadat het in dat lid bedoelde besluit is genomen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel36
  - number: '36.3'
    text: |-
      Het reconstructieprogramma ligt ter provinciale griffie en ter secretarie van de gemeenten in Midden-Delfland,
      voor een ieder ter kosteloze inzage. Gedeputeerde staten doen van de terinzagelegging tevoren openbare kennisgeving
      in de *Nederlandse Staatscourant*, in ten minste twee nieuwsbladen die in de streek worden verspreid en in de
      gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel36
  - number: '37'
    text: |-
      Het reconstructieprogramma kan worden gewijzigd. De [artikelen 32-36][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel32
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '32'
        hoofdstuk: III
        afdeling: '5'
  - number: '38'
    text: |-
      Het reconstructieprogramma dient als grondslag voor het plan van voorzieningen. Een overeenkomstig de
      [artikelen 32-36][ref1] in gang gezette procedure tot wijziging van het reconstructieprogramma ontneemt aan het tot
      dan toe geldende programma, voorzover niet tot voorwerp van wijziging gemaakt, niet de betekenis van grondslag voor
      het plan van voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel32
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '32'
        hoofdstuk: III
        afdeling: '5'
  - number: '39.1'
    text: Voor Midden-Delfland wordt een plan van voorzieningen vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: '39.2'
    text: 'Het plan van voorzieningen bevat de te treffen voorzieningen, die kunnen bestaan in:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: 39.2.a
    text: wijzigingen in het stelsel van wegen, waterlopen, dijken en kaden met de daartoe behorende kunstwerken;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: 39.2.b
    text: de landschappelijke verzorging en de veiligstelling en ontwikkeling van natuurgebieden;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: 39.2.c
    text: de aanleg van utiliteitswerken;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: 39.2.d
    text: de uitvoering van werken ten behoeve van de recreatie en van andere werken in het belang van de reconstructie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
  - number: '39.3'
    text: |-
      Door of namens Onze in [artikel 3, tweede lid][ref1], genoemde Ministers kan worden bepaald, dat door of namens hen
      aangewezen voorzieningen van openbaar belang slechts in het plan van voorzieningen worden opgenomen, indien tussen
      de reconstructie-commissie en het betreffende openbaar lichaam overeenstemming is verkregen over de geldelijke
      bijdrage van het lichaam in de kosten van de uitvoering van het plan van voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel3
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '3'
        hoofdstuk: I
        afdeling: '3'
  - number: '40'
    text: |-
      De reconstructie-commissie stelt een ontwerp voor het plan van voorzieningen of een gedeelte hiervan vast
      en onderwerpt dit, vergezeld door een kaart, waarop de te treffen voorzieningen zo nauwkeurig mogelijk zijn
      aangegeven, aan de instemming van Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel40
  - number: '41.1'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij beslist binnen zes maanden omtrent zijn instemming met het
      ontwerp.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij brengt de beslissing ter kennis van de reconstructie-
      commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel41
  - number: '41.3'
    text: De reconstructie-commissie zendt het ontwerp waarmee is ingestemd met de kaart aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel41
  - number: '42.1'
    text: |-
      Gedeputeerde staten leggen het goedgekeurde ontwerp, bedoeld in het derde lid van het vorige artikel, en de kaart
      gedurende een maand ter kosteloze inzage van een ieder neder ter provinciale griffie en ter secretarie van de
      gemeenten in Midden-Delfland.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel42
  - number: '42.2'
    text: |-
      Gedeputeerde staten doen van de tervisielegging tevoren openbare kennisgeving in de *Staatscourant*, in ten minste
      twee nieuwsbladen, die in de streek worden verspreid, en in de gemeenten op de aldaar gebruikelijke wijze, alsmede
      bijzondere kennisgeving bij aangetekende brief aan de bekende belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel42
  - number: '42.3'
    text: Op het niet ontvangen van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel42
  - number: '43.1'
    text: |-
      Binnen veertien dagen na de laatste dag, waarop de in [artikel 42, eerste lid][ref1], bedoelde stukken ter inzage
      hebben gelegen, kan een ieder zijn bedenkingen schriftelijk bij gedeputeerde staten naar voren brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel42
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '42'
        hoofdstuk: III
        afdeling: '6'
  - number: '43.2'
    text: |-
      Deze bevoegdheid wordt in de kennisgeving bedoeld in [artikel 42][ref1] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel42
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '42'
        hoofdstuk: III
        afdeling: '6'
  - number: '44.1'
    text: |-
      Gedeputeerde staten stellen het plan van voorzieningen of een gedeelte hiervan binnen drie maanden vast,
      waarbij zij zodanig acht slaan op de naar voren gebrachte bedenkingen als zij menen te moeten doen. Indien
      gedeputeerde staten voornemens zijn af te wijken van het ontwerp, bedoeld in het [derde lid van artikel 41][ref1],
      winnen zij advies in bij de Centrale Cultuurtechnische Commissie, de Natuurwetenschappelijke Commissie en de
      Coördinatiecommissie Openluchtrecreatie. Vaststelling in afwijking van dit advies geschiedt niet dan nadat Onze
      Minister van Landbouw, Natuurbeheer en Visserij daarin heeft toegestemd. De toestemming kan worden onthouden wegens
      strijd met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel41
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '41'
        hoofdstuk: III
        afdeling: '6'
  - number: '44.2'
    text: |-
      Het plan van voorzieningen of een gedeelte hiervan ligt, vergezeld door de kaart, ter provinciale griffie en
      ter secretarie van de gemeenten in Midden-Delfland, voor een ieder ter kosteloze inzage. Gedeputeerde staten
      doen van de terinzagelegging tevoren openbare kennisgeving in de *Nederlandse Staatscourant*, in ten minste twee
      nieuwsbladen die in de streek worden verspreid en in de gemeenten op de aldaar gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel44
  - number: '45'
    text: |-
      Het plan van voorzieningen of een gedeelte hiervan kan worden gewijzigd. De [artikelen 40-44][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel40
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '40'
        hoofdstuk: III
        afdeling: '6'
  - number: '46.1'
    text: |-
      Zodra gedeputeerde staten het plan van voorzieningen of een gedeelte hiervan hebben vastgesteld, kan de
      reconstructie-commissie de uitvoering hiervan ter hand nemen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.2'
    text: |-
      Gedeputeerde staten kunnen, in overeenstemming met de reconstructie-commissie bepalen, dat met name genoemde werken
      worden uitgevoerd door de door hen aan te wijzen openbare lichamen of andere rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.3'
    text: |-
      Op de terreinen kunnen tekens worden gesteld en kan houtgewas worden gekapt; zoden, aarde, grind en andere specie
      kunnen aan de terreinen worden onttrokken of daarop worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.4'
    text: |-
      Gronden kunnen worden drooggelegd, ontgonnen, herontgonnen, begreppeld of gedraineerd, tijdelijk geëxploiteerd
      en tijdelijk in gebruik gegeven, in welk laatste geval de ter zake van pacht geldende wettelijke bepalingen niet
      toepasselijk zijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.5'
    text: |-
      De bepalingen van de [Ontgrondingenwet][ref1] zijn niet van toepassing op de uitvoering van het plan van
      voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002505
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0002505
  - number: '46.6'
    text: |-
      Opstallen kunnen worden afgebroken, verbouwd, verplaatst, gebouwd of herbouwd, indien naar het oordeel der
      reconstructie-commissie het belang der reconstructie zulks vordert.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.7'
    text: |-
      De schade, welke een rechtstreeks gevolg is van het in het eerste tot en met het vierde lid en het in het zesde
      lid bepaalde, wordt door het Rijk vergoed. Aan de belanghebbende wordt op zijn verzoek een voorschot op de
      schadevergoeding toegekend. Het bedrag van het voorschot wordt op verzoek van de belanghebbende door de rechter-
      commissaris vastgesteld, gehoord de reconstructie-commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.8'
    text: |-
      De eigenaren en gebruikers zijn verplicht te gedogen, dat het in het eerste tot en met het vierde lid en het in het
      zesde lid bepaalde wordt uitgevoerd en dat daartoe hun terreinen worden betreden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '46.9'
    text: |-
      Indien nodig, wordt de tussenkomst ingeroepen van de burgemeester of van de kantonrechter op wiens bevel de
      uitvoering en het betreden van de terreinen, als bedoeld in het vorig lid, desnoods met behulp van de sterke arm,
      worden mogelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel46
  - number: '47'
    text: |-
      De reconstructie-commissie stelt een zo volledig mogelijke lijst samen van de rechthebbenden met de vermelding van
      de aard en de omvang van ieders recht.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel47
  - number: '48.1'
    text: |-
      De reconstructie-commissie benoemt de schatters, die onder haar leiding de in Midden-Delfland gelegen onroerende
      zaken zullen schatten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel48
  - number: '48.2'
    text: De reconstructie-commissie verdeelt het werk der schatters; dezen treden steeds in oneven getale op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel48
  - number: '49.1'
    text: |-
      De Centrale Cultuurtechnische Commissie ontwerpt een stelsel van classificatie van de grond en bepaalt van elke
      klasse de waarde per hectare, welke als grondslag voor de toedeling zal dienen. Zij bepaalt tevens de grondslagen
      voor de bepaling van de verandering in waarde als gevolg van de reconstructie. Andere dan agrarische factoren
      blijven bij de schatting buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel49
  - number: '49.2'
    text: De Centrale Cultuurtechnische Commissie maakt van deze verrichtingen een proces-verbaal van classificatie op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel49
  - number: '49.3'
    text: De schatters delen de grond aan de hand van het proces-verbaal van classificatie in klassen in.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel49
  - number: '50.1'
    text: |-
      De door de reconstructie-commissie samengestelde lijst van rechthebbenden, het in [artikel 49, tweede lid][ref1],
      bedoelde proces-verbaal, een register van uitkomsten der schattingen en een kaart, waarop de klassegrenzen staan
      aangegeven, worden, na instemming daarmee door de Centrale Cultuurtechnische Commissie, door de reconstructie-
      commissie gedurende een maand ter kosteloze inzage van een ieder neergelegd op een door de reconstructie-commissie
      te bepalen plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel49
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '49'
        hoofdstuk: III
        afdeling: '7'
  - number: '50.2'
    text: |-
      Van de nederlegging geschiedt openbare kennisgeving op de wijze in [artikel 42][ref1] voorgeschreven, alsmede
      bijzondere kennisgeving bij aangetekende brief aan de bekende belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel42
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '42'
        hoofdstuk: III
        afdeling: '6'
  - number: '50.3'
    text: Op het niet-ontvangen van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel50
  - number: '50.4'
    text: De lijst van rechthebbenden wordt in haar geheel of in uittreksel tegen betaling der kosten verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel50
  - number: '51.1'
    text: |-
      Binnen veertien dagen na de laatste dag, waarop de in [artikel 50][ref1] bedoelde stukken ter inzage hebben
      gelegen, kan iedere belanghebbende zijn bezwaren tegen de toekenning en omschrijving van rechten op de lijst van
      rechthebbenden en tegen de schatting schriftelijk bij de reconstructie-commissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel50
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '50'
        hoofdstuk: III
        afdeling: '7'
  - number: '51.2'
    text: |-
      Deze bevoegdheid wordt in de kennisgevingen bedoeld in [artikel 50][ref1] vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel50
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '50'
        hoofdstuk: III
        afdeling: '7'
  - number: '51.3'
    text: |-
      Na verloop van de in het eerste lid bepaalde termijn kunnen slechts zij als rechthebbenden worden erkend die
      voorkomen op de lijst van rechthebbenden of die tegen de daarop voorkomende toekenning of omschrijving van rechten
      bezwaren hebben ingediend of hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel51
  - number: '52.1'
    text: |-
      Voor zover daartegen binnen de termijn en op de wijze in het vorig artikel bepaald, geen bezwaren zijn ingediend,
      staan de rechten, zoals zij op de lijst van rechthebbenden zijn omschreven en toegekend, en de uitkomsten van de
      schattingen vast. Daarvan maakt de reconstructie-commissie proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel52
  - number: '52.2'
    text: |-
      Afschrift van de aldus vastgestelde lijst van rechthebbenden zendt zij aan het desbetreffende kantoor van de Dienst
      voor het kadaster en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel52
  - number: '53.1'
    text: |-
      De reconstructie-commissie onderzoekt de tijdig ingediende bezwaren en tracht daaromtrent overeenstemming te
      bereiken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel53
  - number: '53.2'
    text: Voor zover overeenstemming wordt verkregen, vinden de bepalingen van het vorige artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel53
  - number: '54'
    text: |-
      Voor zover geen overeenstemming wordt verkregen, of voor zover de reconstructie-commissie van oordeel is, dat de
      bezwaren niet tijdig zijn ingediend maakt zij omtrent die bezwaren en het daaromtrent verhandelde proces-verbaal
      op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel54
  - number: '55'
    text: |-
      De reconstructie-commissie zendt zo spoedig mogelijk een afschrift van de lijst van rechthebbenden en van
      de krachtens de [artikelen 52][ref1], [53][ref2] en [54][ref3] opgemaakte processen-verbaal aan de rechter-
      commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel54
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '52'
        hoofdstuk: III
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '53'
        hoofdstuk: III
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '54'
        hoofdstuk: III
        afdeling: '7'
  - number: '56.1'
    text: |-
      Indien de rechter-commissaris een proces-verbaal als bedoeld in [artikel 55][ref1] ontvangt, bepaalt hij terstond
      tijd en plaats der bijeenkomst, waarop de belanghebbenden bij de in het proces-verbaal vermelde bezwaren voor
      hem kunnen verschijnen. Hij doet hiervan mededeling aan de Centrale Cultuurtechnische Commissie en aan de
      reconstructie-commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel55
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '55'
        hoofdstuk: III
        afdeling: '7'
  - number: '56.2'
    text: |-
      Zij die de bezwaren hebben ingediend en de op de lijst van rechthebbenden voorkomende, bekende belanghebbenden bij
      die bezwaren worden door de rechter-commissaris bij aangetekende brief opgeroepen om in persoon of bij schriftelijk
      gemachtigde de bijeenkomst bij te wonen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel56
  - number: '56.3'
    text: |-
      In de oproeping wordt opmerkzaam gemaakt op het rechtsgevolg door de wet aan het niet bijwonen der bijeenkomst en
      aan het vaststellen van de lijst van rechthebbenden verbonden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel56
  - number: '56.4'
    text: |-
      De bijeenkomst wordt niet gehouden dan nadat ten minste veertien dagen na het verzenden der oproepingen zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel56
  - number: '56.5'
    text: Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel56
  - number: '57.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de griffier der rechtbank.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '57.2'
    text: |-
      De bijeenkomst wordt bijgewoond door een vertegenwoordiger van de Centrale Cultuurtechnische Commissie, één of meer
      vertegenwoordigers van de reconstructie-commissie, door de aan deze toegevoegde ingenieur van het kadaster of diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '57.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen, verdaagt de rechter-commissaris de bijeenkomst zonder dat
      een nadere oproeping zal worden gezonden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '57.4'
    text: |-
      Tijdens de bijeenkomst worden eerst de toekenningen en de vaststelling van de rechten en daarna de schattingen
      behandeld. Van het verhandelde omtrent elk van beide onderwerpen maakt de rechter-commissaris een afzonderlijk
      proces-verbaal op, waarvan hij afschrift zendt aan de Centrale Cultuurtechnische Commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '57.5'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde op de bijeenkomst aanwezig zijn, wanneer hun bezwaren
      worden behandeld, worden geacht hun bezwaren te hebben ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '57.6'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet-verschijnen op de bijeenkomst verklaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel57
  - number: '58.1'
    text: |-
      Voor zover omtrent de toekenning, de aard en de omvang der rechten overeenstemming is verkregen, dan wel het in het
      vijfde lid van het vorige artikel bedoelde geval zich voordoet, staan de rechten vast. De rechter-commissaris zendt
      een afschrift van de aldus vastgestelde lijst van rechthebbenden aan het desbetreffende kantoor van de Dienst voor
      het kadaster en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel58
  - number: '58.2'
    text: |-
      Partijen, tussen wie geen overeenstemming is verkregen, worden voor zover haar geschil niet reeds aanhangig
      is, door de rechter-commissaris naar een door hem te bepalen zitting van de rechtbank verwezen. Deze verwijzing
      vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel58
  - number: '59.1'
    text: Voor zover overeenstemming wordt verkregen omtrent de schattingen, staan deze vast.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel59
  - number: '59.2'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een nader te bepalen zitting
      van de rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel59
  - number: '59.3'
    text: |-
      De rechtbank behandelt de zaken betreffende de toekenning en de vaststelling van de rechten en de schattingen vóór
      elke andere met uitzondering van die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel59
  - number: '60.1'
    text: |-
      Ten dage dienende geven zij, wier zaken ingevolge het bepaalde in [artikel 58, tweede lid][ref1], verwezen zijn,
      de gronden hunner beweringen en de middelen tot staving daarvan op bij conclusie, door een advocaat getekend.
      Afschrift der conclusie wordt ter terechtzitting aan de advocaat der wederpartij gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel58
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '58'
        hoofdstuk: III
        afdeling: '7'
  - number: '60.2'
    text: |-
      Op een uiterlijk veertien dagen hierna te stellen, door de rechtbank te bepalen dag kunnen partijen haar conclusies
      bij pleidooi door een advocaat doen toelichten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel60
  - number: '61.1'
    text: |-
      Uiterlijk dertig dagen na de dienende dag of, indien één dag voor pleidooi wordt vastgesteld, na de daarvoor
      bepaalde dag doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel61
  - number: '61.2'
    text: Tegen de uitspraak is geen verzet noch enige andere voorziening dan die in cassatie toegelaten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel61
  - number: '62.1'
    text: De cassatie wordt ingesteld binnen dertig dagen te rekenen van de dag, waarop het vonnis is uitgesproken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.2'
    text: Zij geschiedt door een verklaring ter griffie van de rechtbank, die het vonnis heeft gewezen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.3'
    text: |-
      Deze verklaring wordt binnen veertien dagen met een ontwikkeling van de gronden der cassatie aan de tegenpartij
      betekend en gaat vergezeld van dagvaarding tegen de eerstvolgende, voor de behandeling van burgerlijke zaken
      bestemde, terechtzitting na de in het volgende lid bepaalde termijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.4'
    text: De tegenpartij is bevoegd te antwoorden binnen veertien dagen na de betekening ingevolge het vorige lid.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.5'
    text: |-
      In de genoemde terechtzitting nemen de partijen haar conclusies, desverkiezende bij pleidooi, mits in dezelfde
      terechtzitting, nader te ontwikkelen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.6'
    text: Het Openbaar Ministerie neemt zijn conclusie uiterlijk veertien dagen na de terechtzitting.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '62.7'
    text: Uiterlijk zes weken na de terechtzitting doet de Hoge Raad uitspraak.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel62
  - number: '63'
    text: |-
      Zodra omtrent alle geschillen over de rechten betreffende de in Midden-Delfland gelegen onroerende zaken
      onherroepelijk is beslist, wordt de lijst van rechthebbenden door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel63
  - number: '64'
    text: |-
      Nadat alle rechten betreffende de bij de reconstructie betrokken onroerende zaken vaststaan, worden zij met wie
      geen overeenstemming omtrent de schattingen is verkregen, alsmede de Centrale Cultuurtechnische Commissie, de
      reconstructie-commissie en de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger opgeroepen
      om te verschijnen op een door de rechtbank bepaalde zitting.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel64
  - number: '65.1'
    text: |-
      Ten dage dienende lichten zij, met wie geen overeenstemming is verkregen, hun standpunt hetzij in persoon, hetzij
      bij schriftelijk gemachtigde, mondeling toe.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel65
  - number: '65.2'
    text: |-
      De rechtbank hoort de vertegenwoordigers der Centrale Cultuurtechnische Commissie en der reconstructie-commissie en
      de aan deze toegevoegde ingenieur van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel65
  - number: '65.3'
    text: Uiterlijk dertig dagen na het in het tweede lid genoemde verhoor doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel65
  - number: '65.4'
    text: |-
      Indien deze uitspraak van invloed is op de uitkomsten van andere schattingen, is de rechtbank bevoegd die
      uitkomsten te wijzigen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel65
  - number: '65.5'
    text: Het register van de uitkomsten der schattingen wordt door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel65
  - number: '66'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet noch enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hoge Raad om zich, in het belang der wet, in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel66
  - number: '67.1'
    text: |-
      Voor een geding, voortvloeiende uit een verwijzing door de rechter-commissaris, als bedoeld in
      [artikel 58, tweede lid][ref1], en in [artikel 59, tweede lid][ref2], is alleen door de belanghebbende, met
      wie geen overeenstemming is verkregen, vast recht als bedoeld in de [Wet tarieven in burgerlijke zaken][ref3]
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0001852
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '58'
        hoofdstuk: III
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '59'
        hoofdstuk: III
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0001852
  - number: '67.2'
    text: |-
      De kosten van het geding als bedoeld in het eerste lid, komen ten laste van de belanghebbende, met wie geen
      overeenstemming is verkregen, indien deze in het ongelijk is gesteld; ten laste van het Rijk indien hij in het
      gelijk wordt gesteld. Indien de rechter daartoe termen vindt in de omstandigheden van het geding, kan hij de kosten
      geheel of voor een deel compenseren.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel67
  - number: '68'
    text: |-
      Zodra de lijst van rechthebbenden en het register van de uitkomsten der schattingen zijn gesloten, geeft de
      rechter-commissaris hiervan kennis aan de Centrale Cultuurtechnische Commissie en aan de reconstructie-commissie;
      hij zendt een afschrift van de lijst van rechthebbenden aan de reconstructie-commissie en aan het desbetreffende
      kantoor van de Dienst voor het kadaster en de openbare registers.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel68
  - number: '69.1'
    text: De reconstructie-commissie brengt het plan van wegen en waterlopen en het landschapsplan in kaart.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel69
  - number: '69.2'
    text: |-
      Het plan van wegen en waterlopen bevat het stelsel van wegen, waterlopen, dijken en kaden met de daartoe behorende
      kunstwerken zoals dat na uitvoering van het plan van voorzieningen en overeenkomstig de door de reconstructie-
      commissie vastgestelde afmetingen in Midden-Delfland aanwezig zal zijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel69
  - number: '69.3'
    text: Het landschapsplan bevat de kavels die voor de landschappelijke verzorging van belang zijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel69
  - number: '69.4'
    text: |-
      De reconstructie-commissie doet de plannen aan de Centrale Cultuurtechnische Commissie toekomen, die deze in hun
      geheel of bij gedeelten zendt aan gedeputeerde staten, vergezeld door haar advies en door een voorstel over de
      toewijzing in eigendom, beheer en onderhoud.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel69
  - number: '70'
    text: |-
      Gedeputeerde staten stellen het plan van wegen en waterlopen en het landschapsplan geheel of bij gedeelten
      vast en zenden aan de belanghebbende openbare lichamen, aan de Centrale Cultuurtechnische Commissie en aan de
      reconstructie-commissie een afschrift van hun besluiten met de daarbij behorende kaarten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel70
  - number: '71'
    text: |-
      Wegen met de daartoe behorende kunstwerken welke voorheen voor het openbaar verkeer waren opengesteld
      en niet in het plan van wegen en waterlopen worden opgenomen, worden in afwijking van het bepaalde in de
      [artikelen 8 en 9 van de Wegenwet][ref1] door het enkele feit van de niet-opneming aan het openbaar verkeer
      onttrokken. Aan wegen met de daartoe behorende kunstwerken, welke in het plan van wegen en waterlopen worden
      opgenomen maar die voorheen niet voor het openbaar verkeer waren opengesteld, wordt in afwijking van het bepaalde
      in de [artikelen 4 en 5 van de Wegenwet][ref2] door het enkele feit van de opneming de bestemming van openbare
      weg gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel4
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: '4'
  - number: '72.1'
    text: |-
      Gedeputeerde staten wijzen de eigendom van de in het plan van wegen en waterlopen opgenomen wegen en waterlopen met
      de daartoe behorende kunstwerken en het beheer en het onderhoud van de in het plan opgenomen wegen toe aan de naar
      hun oordeel daarvoor in aanmerking komende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '72.2'
    text: |-
      Gedeputeerde staten regelen het beheer en het onderhoud van de in het plan opgenomen waterlopen, dijken en kaden
      met de daartoe behorende kunstwerken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '72.3'
    text: |-
      Gedeputeerde staten wijzen de eigendom van de in het landschapsplan opgenomen onroerende zaken toe aan de naar hun
      oordeel daarvoor in aanmerking komende openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '72.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid kunnen gedeputeerde staten de eigendom, het beheer en het onderhoud
      toewijzen aan een rechtspersoon, niet zijnde een openbaar lichaam, voor zover deze ook vóór het in werking treden
      van deze wet, de eigendom, het beheer en het onderhoud had.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '72.5'
    text: |-
      Alvorens te besluiten horen gedeputeerde staten de in het eerste en derde lid bedoelde openbare lichamen en de in
      het vierde lid bedoelde rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '72.6'
    text: |-
      De eigendom, het beheer en het onderhoud kunnen niet aan het Rijk worden toegewezen of onttrokken dan nadat Onze
      betrokken Minister daarin heeft toegestemd. De toestemming kan worden onthouden wegens strijd met het recht of het
      algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel72
  - number: '73.1'
    text: |-
      Gedeputeerde staten doen van een besluit als bedoeld in [artikel 72, eerste, tweede of derde lid][ref1], mededeling
      door toezending van een afschrift ervan aan de Centrale Landinrichtings-Commissie en aan de reconstructiecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel72
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '72'
        hoofdstuk: III
        afdeling: '8'
  - number: '73.2'
    text: |-
      Tegen een besluit als bedoeld in [artikel 72, eerste, tweede of derde lid][ref1], kunnen uitsluitend belanghebbende
      openbare lichamen beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel72
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '72'
        hoofdstuk: III
        afdeling: '8'
  - number: '73.3'
    text: |-
      Gedeputeerde staten doen van de uitspraak in beroep mededeling door toezending van een afschrift ervan aan de
      Centrale Landinrichtings-commissie en aan de reconstructie-commissie en, indien de in [artikel 89][ref1] bedoelde
      akte van toedeling is ingeschreven in de openbare registers en door de uitspraak in beroep de eigendom aan een
      ander openbaar lichaam of rechtspersoon wordt toegewezen dan in die akte is vermeld, ter inschrijving in de
      openbare registers aan het desbetreffende kantoor van de Dienst voor het kadaster en de openbare registers. Door
      inschrijving van de uitspraak in beroep in de openbare registers wordt de in die uitspraak omschreven eigendom
      verkregen door de in die uitspraak genoemde openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
        hoofdstuk: III
        afdeling: '10'
  - number: '74'
    text: |-
      Voor zover het openbaar lichaam voorheen niet was belast met het beheer en het onderhoud van wegen,
      waterlopen en kaden met de daartoe behorende kunstwerken gaan in afwijking van het bepaalde in
      de [artikelen 1 en 2 van de Waterstaatswet 1900][ref1] en de [artikelen 18][ref2], [19][ref3] en
      [20 van de Wegenwet][ref4] het beheer en het onderhoud over door het enkele feit van de aanwijzing in beheer en
      onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0001948#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0001948#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001948
        artikel: 18a
      - id: ref3
        bwb_id: BWBR0001948
        artikel: '19'
      - id: ref4
        bwb_id: BWBR0001948
        artikel: '20'
  - number: '75.1'
    text: |-
      Wegen, waterlopen en kaden met de daartoe behorende kunstwerken, die zijn opgenomen in het plan van wegen en
      waterlopen, worden met ingang van de datum van het in [artikel 70][ref1] bedoelde besluit beschouwd als in
      eigendom, beheer en onderhoud aan de provincie Zuid-Holland toe te komen, zolang gedeputeerde staten nog geen
      besluit hebben genomen betreffende de eigendom, het beheer en het onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel70
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '70'
        hoofdstuk: III
        afdeling: '8'
  - number: '75.2'
    text: |-
      Het beheer en het onderhoud der nieuw aangelegde of verbeterde openbare wegen, waterlopen en kaden met de
      daartoe behorende kunstwerken gaan over op de provincie Zuid-Holland of op de door haar aangewezen beheerders of
      onderhoudsplichtigen op de tijdstippen waarop de reconstructiecommissie aan de provincie Zuid-Holland of de op
      grond van [artikel 72, eerste lid][ref1], aangewezen beheerders of onderhoudsplichtigen heeft verklaard dat de
      werken zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel72
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '72'
        hoofdstuk: III
        afdeling: '8'
  - number: '76.1'
    text: 'Zodra:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel76
  - number: 76.1.a
    text: |-
      de processen-verbaal, bedoeld in de [artikelen 52][ref1], [53][ref2] en [54][ref3] zijn opgemaakt, en


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel54
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '52'
        hoofdstuk: III
        afdeling: '7'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '53'
        hoofdstuk: III
        afdeling: '7'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '54'
        hoofdstuk: III
        afdeling: '7'
  - number: 76.1.b
    text: het plan van wegen en waterlopen en het landschapsplan geheel zijn vastgesteld, en
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel76
  - number: 76.1.c
    text: |-
      het in het [tweede lid van artikel 21][ref1] laatstbedoelde tijdstip is verstreken,


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel21
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '21'
        hoofdstuk: III
        afdeling: '3'
  - number: '76.2'
    text: |-
      De reconstructie-commissie stelt op de door haar bepaalde plaats en tijd de bekende belanghebbenden in de
      gelegenheid hun wensen ten aanzien van het plan van toedeling kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel76
  - number: '77'
    text: 'Het plan van toedeling houdt in:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
  - number: '77.1'
    text: de kavelindeling;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
  - number: '77.2'
    text: de toedeling der kavels;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
  - number: '77.3'
    text: |-
      de ingevolge [artikel 20][ref1] gehandhaafde, opgeheven en gevestigde pachtverhoudingen, onder vermelding
      van de in het [derde lid van artikel 20][ref2] bedoelde bepalingen inzake de duur en de verlengbaarheid der
      pachtovereenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '77.4'
    text: |-
      de in [artikel 30][ref1] bedoelde regeling, opheffing of vestiging van beperkte rechten, het recht van huur en de
      lasten, welke met betrekking tot de onroerende zaken bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel30
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '30'
        hoofdstuk: III
        afdeling: '4'
  - number: '77.5'
    text: bepalingen omtrent de ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel77
  - number: '78'
    text: |-
      In het plan van toedeling kunnen met toestemming van hen, die bevoegd zijn te beschikken, ten aanzien van niet
      in Midden-Delfland gelegen onroerende zaken regelingen worden opgenomen betreffende grenswijziging, burenrechten
      en erfdienstbaarheden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel78
  - number: '79.1'
    text: De reconstructiecommissie zet overeenkomstig het plan van toedeling de grenzen der kavels uit op het terrein.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel79
  - number: '79.2'
    text: |-
      De reconstructiecommissie legt het plan van toedeling gedurende een maand voor een ieder ter kosteloze inzage op
      een door de reconstructiecommissie te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel79
  - number: '79.3'
    text: |-
      De reconstructie-commissie doet van de terinzagelegging tevoren openbare kennisgeving op de wijze in
      [artikel 42][ref1] van deze wet voorgeschreven, alsmede bijzondere kennisgeving bij aangetekende brief aan de
      bekende belanghebbenden.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel42
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '42'
        hoofdstuk: III
        afdeling: '6'
  - number: '79.4'
    text: De kennisgeving houdt mededeling in van de bevoegdheid tot indienen van bezwaren.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel79
  - number: '79.5'
    text: Op het niet ontvangen van de bijzondere kennisgeving kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel79
  - number: '80'
    text: |-
      Binnen veertien dagen na de laatste dag, waarop het in [artikel 79][ref1] bedoelde plan van toedeling ter inzage
      heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren bij de reconstructie-commissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel79
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '79'
        hoofdstuk: III
        afdeling: '9'
  - number: '81.1'
    text: |-
      Indien binnen de termijn en op de wijze, in het vorige artikel bepaald, geen bezwaren zijn ingediend staat het plan
      van toedeling vast. Hiervan wordt door de reconstructie-commissie proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel81
  - number: '81.2'
    text: |-
      Indien binnen de termijn en op de wijze, in het vorig artikel bepaald, bezwaren zijn ingediend, onderzoekt de
      reconstructie-commissie de bezwaren en tracht zij overeenstemming te verkrijgen; voor zover overeenstemming wordt
      verkregen vinden de bepalingen van het vorige lid overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel81
  - number: '81.3'
    text: |-
      De reconstructie-commissie zendt zo spoedig mogelijk afschriften van de processen-verbaal en van de ingediende
      bezwaarschriften aan de rechter-commissaris en aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel81
  - number: '82.1'
    text: |-
      Indien geen overeenstemming is verkregen, bepaalt de rechter-commissaris de tijd en plaats der bijeenkomst,
      waarop de belanghebbenden bij de in het proces-verbaal vermelde bezwaren voor hem kunnen verschijnen. De rechter-
      commissaris doet tevoren mededeling aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit en aan de
      reconstructie-commissie en openbare kennisgeving in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel82
  - number: '82.2'
    text: |-
      Zij, die bezwaren hebben ingediend en de bekende belanghebbenden bij die bezwaren worden door de rechter-
      commissaris bij aangetekende brief opgeroepen om in persoon of bij schriftelijk gemachtigde de bijeenkomst bij
      te wonen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel82
  - number: '82.3'
    text: |-
      In de oproepingen wordt opmerkzaam gemaakt op het rechtsgevolg, door de wet aan het niet bijwonen der bijeenkomst
      verbonden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel82
  - number: '82.4'
    text: |-
      De bijeenkomst wordt niet gehouden dan nadat ten minste veertien dagen na het verzenden der oproepingen zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel82
  - number: '82.5'
    text: Op het niet ontvangen van de oproeping kan geen beroep worden gedaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel82
  - number: '83.1'
    text: |-
      Op de bepaalde tijd wordt de bijeenkomst gehouden onder voorzitterschap van de rechter-commissaris, bijgestaan door
      de griffier der rechtbank.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '83.2'
    text: |-
      De bijeenkomst wordt bijgewoond door een vertegenwoordiger van Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit, een of meer vertegenwoordigers der reconstructie-commissie en de aan deze toegevoegde ingenieur
      van het kadaster of diens plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '83.3'
    text: |-
      Indien de werkzaamheden niet op één dag kunnen aflopen verdaagt de rechter-commissaris de bijeenkomst zonder dat
      een nadere oproeping zal worden gezonden.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '83.4'
    text: |-
      Zij, die niet in persoon noch bij schriftelijk gemachtigde ter zitting aanwezig zijn, wanneer hun bezwaren worden
      behandeld, worden geacht die bezwaren te hebben ingetrokken. Daarvan wordt proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '83.5'
    text: |-
      Het vorige lid is niet van toepassing ten aanzien van hen, die binnen een week na de dag der bijeenkomst bij
      aangetekende brief, gericht aan de rechter-commissaris, het niet-verschijnen op de bijeenkomst verklaren met een
      beroep op overmacht en de gegrondheid van deze bewering binnen een door de rechter-commissaris te bepalen termijn
      aan deze aannemelijk maken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '83.6'
    text: |-
      Van het verhandelde maakt de rechter-commissaris proces-verbaal op waarvan hij afschrift zendt aan Onze Minister
      van Landbouw, Natuur en Voedselkwaliteit.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel83
  - number: '84.1'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris de zaak naar een door hem te bepalen zitting
      van de rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel84
  - number: '84.2'
    text: |-
      De rechtbank behandelt de zaken, betreffende het plan van toedeling vóór elke andere, met uitzondering van die
      betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel84
  - number: '85.1'
    text: |-
      Ten dage dienende lichten zij, wier zaken verwezen zijn, hun standpunt, hetzij in persoon, hetzij bij schriftelijk
      gemachtigde mondeling toe.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel85
  - number: '85.2'
    text: |-
      De rechtbank hoort de vertegenwoordiger van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, een of meer
      vertegenwoordigers van de reconstructie-commissie en de aan deze toegevoegde ingenieur van het kadaster of diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel85
  - number: '85.3'
    text: Uiterlijk dertig dagen na het verhoor doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel85
  - number: '85.4'
    text: |-
      Indien deze uitspraak van invloed is op het plan van toedeling, is de rechtbank bevoegd dit plan te wijzigen na de
      bij de wijziging betrokken belanghebbenden daarover te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel85
  - number: '85.5'
    text: |-
      Ten aanzien van de kosten van het geding vindt het in [artikel 67][ref1] bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel67
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '67'
        hoofdstuk: III
        afdeling: '7'
  - number: '86'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet noch enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hoge Raad om zich in het belang der wet in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel86
  - number: '87'
    text: |-
      Wanneer ten gevolge van de behandeling van de bezwaren tegen de lijst van rechthebbenden door de rechter
      wijzigingen in die lijst worden aangebracht, alsmede, wanneer ingevolge het bepaalde in [artikel 23][ref1]
      wijzigingen worden aangebracht in de registratie, bedoeld in [artikel 21][ref2], brengt de rechter de daardoor
      noodzakelijk geworden wijzigingen in het plan van toedeling aan.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel21
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '23'
        hoofdstuk: III
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '21'
        hoofdstuk: III
        afdeling: '3'
  - number: '88'
    text: |-
      Indien de reconstructiecommissie zulks verzoekt, wordt degene, aan wie krachtens het plan van toedeling enige
      onroerende zaak in eigendom of in gebruik toekomt, op bevelschrift van de rechter-commissaris desnoods door middel
      van de sterke arm bij voorraad in de macht daarvan gesteld.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel88
  - number: '89.1'
    text: |-
      Zodra het plan van toedeling vaststaat en de lijst van rechthebbenden door de rechtbank is gesloten, maakt een door
      de reconstructie-commissie aangewezen notaris de akte van toedeling op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
  - number: '89.2'
    text: In de akte wordt opgenomen een kaart van Midden-Delfland met aanwijzing van de kavels en de wegen en waterlopen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
  - number: '89.3'
    text: |-
      In de akte worden voorts opgenomen de in [artikel 30][ref1] bedoelde regeling, opheffing of vestiging van beperkte
      rechten en van de lasten welke met betrekking tot de onroerende zaken bestaan, met uitzondering van de bepalingen
      betreffende geldelijke verrekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel30
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '30'
        hoofdstuk: III
        afdeling: '4'
  - number: '89.4'
    text: |-
      De omschrijving van de kavels, de wegen en de waterlopen, die op de in het tweede lid bedoelde kaart zijn afgebeeld
      en die daarop voorzien zijn van een nummer, geschiedt door vermelding van het nummer waarmee zij op die kaart
      voorkomen. [Artikel 20, eerste lid, van de Kadasterwet][ref1] is niet van toepassing voor zover het betreft het
      vermelden van de aard en de plaatselijke aanduiding, zo deze er is, van onroerende zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '20'
  - number: '89.5'
    text: |-
      In de akte van toedeling worden tevens vermeld de hypotheken en de beslagen die door de inschrijving van de akte
      van toedeling niet meer blijven bestaan.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
  - number: '89.6'
    text: |-
      Het bepaalde in de [artikelen 18, eerste en vijfde lid][ref1], en [24, tweede lid onder ][ref2], is van
      overeenkomstige toepassing op de akte van toedeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel24
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '24'
  - number: '90.1'
    text: |-
      De akte van toedeling wordt ondertekend door de rechter-commissaris en de voorzitter en de secretaris van de
      reconstructie-commissie.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel90
  - number: '90.2'
    text: |-
      Zij geldt als titel voor de daarin omschreven rechten. Door de inschrijving van de akte in de openbare registers
      worden de daarin omschreven onroerende zaken en beperkte rechten verkregen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel90
  - number: '90.3'
    text: |-
      De bewaarder van het kadaster en de openbare registers tekent op grond van de akte bij elke hypothecaire
      inschrijving, onderscheidenlijk bij elke inschrijving van een beslag aan, dat de hypotheek onderscheidenlijk het
      beslag in het vervolg zal rusten op de in de akte aangewezen kavels, of gedeelten daarvan, dan wel op de rechten
      waaraan die kavels of gedeelten daarvan zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel90
  - number: '90.4'
    text: |-
      De bewaarder van het kadaster en de openbare registers haalt ambtshalve door de door de inschrijving van de akte
      van toedeling niet meer bestaande inschrijvingen van de in [artikel 89, vijfde lid][ref1], bedoelde hypotheken
      en beslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
        hoofdstuk: III
        afdeling: '10'
  - number: '90.5'
    text: |-
      De bewaarder van het kadaster en de openbare registers zendt zo spoedig mogelijk per brief aan elke eigenaar van,
      alsmede aan elke beperkt gerechtigde met betrekking tot de onroerende zaak een kennisgeving van het resultaat van
      de bijhouding van de basisregistratie kadaster die op grond van de inschrijving van de akte plaatsvindt. De brief
      vermeldt de dag van de verzending alsmede de in de basisregistratie kadaster vermeld staande gegevens omtrent
      de rechten, de rechthebbenden, als bedoeld in de [Kadasterwet][ref1], de grootte en de kadastrale aanduiding van
      de onroerende zaak, waarop de kennisgeving betrekking heeft. [Artikel 56b van de Kadasterwet][ref2] is niet van
      toepassing op de in de eerste zin bedoelde bijhouding.


      [ref1]: https://wetten.overheid.nl/BWBR0004541
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel56b
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0004541
      - id: ref2
        bwb_id: BWBR0004541
        artikel: 56b
  - number: '91'
    text: |-
      Na de inschrijving van de in [artikel 89][ref1] bedoelde akte wordt hij, aan wie daarbij enige onroerende zaak in
      eigendom of gebruik is toegedeeld, desnoods op bevelschrift van de rechter-commissaris door middel van de sterke
      arm, in de macht daarvan gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel89
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '89'
        hoofdstuk: III
        afdeling: '10'
  - number: '92.1'
    text: |-
      De reconstructie-commissie geeft, op een tijdstip door haar te bepalen, aan de schatters, bedoeld in
      [artikel 48][ref1], opdracht tot het schatten van:


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel48
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '48'
        hoofdstuk: III
        afdeling: '7'
  - number: 92.1.a
    text: |-
      de waardeveranderingen, bedoeld in de [artikelen 9][ref1] en [10][ref2] voor zover deze voor verrekening in
      aanmerking komen en daarmede bij de schatting, bedoeld in [artikel 49][ref3] nog geen rekening is gehouden;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel49
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '9'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '10'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '49'
        hoofdstuk: III
        afdeling: '7'
  - number: 92.1.b
    text: |-
      de verandering van de ingevolge [artikel 49][ref1] vastgestelde waarde van iedere kavel als gevolg van de
      reconstructie;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel49
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '49'
        hoofdstuk: III
        afdeling: '7'
  - number: 92.1.c
    text: zo nodig de gebouwen, werken en beplantingen;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
  - number: 92.1.d
    text: zo nodig de waarde, voor zover deze bepaald wordt door andere dan agrarische factoren.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
  - number: '92.2'
    text: |-
      Bij regeling van Onze Minister van Landbouw, Natuur en Voedselkwaliteit worden nadere regels gesteld over de wijze
      waarop de schatting wordt verricht.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel92
  - number: '93'
    text: |-
      De reconstructie-commissie gaat daarna zo spoedig mogelijk over tot het opmaken van de lijst der geldelijke
      regelingen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel93
  - number: '94'
    text: 'De lijst der geldelijke regelingen houdt in:'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
  - number: '94.1'
    text: |-
      de uitkomsten der schatting volgens [artikel 92][ref1], alsmede de daaruit voortvloeiende geldelijke verrekeningen
      ten aanzien van de daarbij betrokken eigenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel92
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '92'
        hoofdstuk: III
        afdeling: '11'
  - number: '94.2'
    text: |-
      de geldelijke verrekeningen, voortvloeiende uit de toepassing van de [artikelen 15][ref1], [16][ref2], [17][ref3]
      en [18][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0003094#Artikel18
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '15'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0003094
        artikel: '18'
        hoofdstuk: III
        afdeling: '2'
  - number: '94.3'
    text: |-
      de geldelijke verrekeningen, voortvloeiende uit de toepassing van [artikel 20][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel20
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '20'
        hoofdstuk: III
        afdeling: '3'
  - number: '94.4'
    text: |-
      de bepalingen der geldelijke gevolgen, bedoeld in [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel30
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '30'
        hoofdstuk: III
        afdeling: '4'
  - number: '94.5'
    text: |-
      de krachtens [artikel 46, zevende lid][ref1], uit te keren schadevergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel46
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '46'
        hoofdstuk: III
        afdeling: '6'
  - number: '94.6'
    text: andere toe te kennen schadevergoedingen;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
  - number: '94.7'
    text: de vergoedingen voor zaken welke in verband met de overgang der onroerende zaken moeten worden verrekend.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel94
  - number: '95.1'
    text: |-
      De lijst der geldelijke regelingen wordt door de reconstructie-commissie gedurende een maand voor een ieder ter
      kosteloze inzage gelegd op een door de reconstructie-commissie te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel95
  - number: '95.2'
    text: |-
      Het [derde tot en met het vijfde lid van artikel 79][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel79
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '79'
        hoofdstuk: III
        afdeling: '9'
  - number: '96'
    text: |-
      Binnen dertig dagen na de laatste dag, waarop de in [artikel 95][ref1] bedoelde lijst van geldelijke regelingen ter
      inzage heeft gelegen, kan iedere belanghebbende schriftelijk zijn bezwaren bij de reconstructie-commissie indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel95
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '95'
        hoofdstuk: III
        afdeling: '11'
  - number: '97'
    text: |-
      Voor zover binnen de termijn en op de wijze in het vorige artikel bepaald geen bezwaren zijn ingediend, staat de
      lijst der geldelijke regelingen vast. Daarvan maakt de reconstructie-commissie een proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel97
  - number: '98.1'
    text: |-
      De reconstructie-commissie onderzoekt de tijdig ingediende bezwaren en tracht daaromtrent overeenstemming te
      bereiken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel98
  - number: '98.2'
    text: Voor zover overeenstemming is verkregen vinden de bepalingen van het vorige artikel overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel98
  - number: '99'
    text: |-
      Voor zover geen overeenstemming wordt verkregen, maakt de reconstructie-commissie van het omtrent die bezwaren
      verhandelde proces-verbaal op.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel99
  - number: '100'
    text: |-
      De reconstructie-commissie zendt zo spoedig mogelijk een afschrift van de lijst der geldelijke regelingen en van de
      in de [artikelen 97][ref1], [98][ref2] en [99][ref3] bedoelde processen-verbaal aan de rechter-commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel99
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '97'
        hoofdstuk: III
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '98'
        hoofdstuk: III
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '99'
        hoofdstuk: III
        afdeling: '11'
  - number: '101.1'
    text: |-
      Indien de rechter-commissaris een proces-verbaal, als bedoeld in [artikel 99][ref1], ontvangt, bepaalt hij
      terstond tijd en plaats van de bijeenkomst, waarop de in het proces-verbaal vermelde bezwaren voor hem zullen
      worden behandeld. Hij doet hiervan mededeling aan Onze Minister van Landbouw, Natuur en Voedselkwaliteit en aan de
      reconstructie-commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel99
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '99'
        hoofdstuk: III
        afdeling: '11'
  - number: '101.2'
    text: |-
      [Artikel 82, tweede, derde, vierde en vijfde lid][ref1], en [artikel 83][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel83
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '82'
        hoofdstuk: III
        afdeling: '9'
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '83'
        hoofdstuk: III
        afdeling: '9'
  - number: '102.1'
    text: |-
      Voor zover overeenstemming wordt verkregen omtrent de lijst der geldelijke regelingen dan wel het overeenkomstig
      het [vierde lid van artikel 83][ref1] bepaalde zich voordoet, staat de lijst vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel83
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '83'
        hoofdstuk: III
        afdeling: '9'
  - number: '102.2'
    text: |-
      Voor zover geschillen blijven bestaan, verwijst de rechter-commissaris deze naar een door hem te bepalen zitting
      van de rechtbank. Deze verwijzing vervangt de dagvaarding.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel102
  - number: '102.3'
    text: |-
      De rechtbank behandelt zaken, betreffende de lijst der geldelijke regelingen voor elke andere, met uitzondering van
      die betreffende onteigening.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel102
  - number: '103.1'
    text: |-
      Ten dage dienende lichten zij, wier zaken verwezen zijn hun standpunten hetzij in persoon, hetzij bij schriftelijk
      gemachtigde mondeling toe.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
  - number: '103.2'
    text: |-
      De rechtbank hoort de vertegenwoordiger van Onze Minister van Landbouw, Natuur en Voedselkwaliteit, een of meer
      vertegenwoordigers van de reconstructie-commissie en de aan deze toegevoegde ingenieur van het kadaster of diens
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
  - number: '103.3'
    text: Uiterlijk dertig dagen na het in het tweede lid genoemde verhoor doet de rechtbank uitspraak.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
  - number: '103.4'
    text: |-
      Indien de uitspraak van invloed is op de lijst van geldelijke regelingen is de rechtbank bevoegd deze lijst te
      wijzigen na de bij wijziging betrokken belanghebbenden daarover te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
  - number: '103.5'
    text: De lijst der geldelijke regelingen wordt door de rechtbank gesloten.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
  - number: '103.6'
    text: |-
      Ten aanzien van de kosten van het geding vindt het in [artikel 67][ref1] bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel67
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '67'
        hoofdstuk: III
        afdeling: '7'
  - number: '104'
    text: |-
      Tegen de uitspraak van de rechtbank is geen verzet noch enige andere voorziening toegelaten, onverminderd de
      bevoegdheid van de procureur-generaal bij de Hoge Raad, om zich, in het belang der wet, in cassatie te voorzien.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel104
  - number: '105'
    text: |-
      De lijst der geldelijke regelingen, zoals zij door de rechter is gesloten, geldt als titel voor de daarin
      omschreven vorderingen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel105
  - number: 105a
    text: |-
      De [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing ten aanzien van
      de bezwaren, bedoeld in de [artikelen 22, tweede lid][ref3], [51, eerste lid][ref4], [80][ref5] en [96][ref6], noch
      ten aanzien van het beroep, bedoeld in [artikel 27, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0003094#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0003094#Artikel51
      [ref5]: https://wetten.overheid.nl/BWBR0003094#Artikel80
      [ref6]: https://wetten.overheid.nl/BWBR0003094#Artikel96
      [ref7]: https://wetten.overheid.nl/BWBR0003094#Artikel27
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel105a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0003094
        artikel: '22'
        hoofdstuk: III
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0003094
        artikel: '51'
        hoofdstuk: III
        afdeling: '7'
      - id: ref5
        bwb_id: BWBR0003094
        artikel: '80'
        hoofdstuk: III
        afdeling: '9'
      - id: ref6
        bwb_id: BWBR0003094
        artikel: '96'
        hoofdstuk: III
        afdeling: '11'
      - id: ref7
        bwb_id: BWBR0003094
        artikel: '27'
        hoofdstuk: III
        afdeling: '3'
  - number: '106'
    text: |-
      Ten laste van het Rijk komen alle kosten der reconstructie, voor zover deze niet ingevolge de bepalingen van deze
      wet of krachtens overeenkomst door anderen worden gedragen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel106
  - number: '107.1'
    text: |-
      Ter zake van de op grond van [artikel 17][ref1] door de eigenaren verschuldigde bedragen rust op de hun toegedeelde
      kavels onder de naam van "reconstructierente" een schuldplichtigheid ten behoeve van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel17
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '17'
        hoofdstuk: III
        afdeling: '2'
  - number: '107.2'
    text: |-
      De overige door de eigenaren verschuldigde bedragen kunnen, ter keuze van de eigenaren, ineens worden voldaan dan
      wel in de reconstructierente worden begrepen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel107
  - number: '108'
    text: |-
      De rente bedraagt zes ten honderd van het volgens [artikel 107][ref1] verschuldigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel107
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '107'
        hoofdstuk: III
        afdeling: '12'
  - number: '110'
    text: |-
      De rente is verschuldigd over zesentwintig achtereenvolgende jaren, te beginnen met het jaar volgende op dat,
      waarin de reconstructie in de basisregistratie kadaster is opgenomen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel110
  - number: '111.1'
    text: |-
      Bij splitsing van een perceel wordt de rente van de nog niet ingetreden jaren verdeeld naar verhouding van de
      grootte van die percelen volgens de basisregistratie kadaster.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel111
  - number: '111.2'
    text: |-
      Wordt een perceel of een gedeelte van een perceel met andere grond samengevoegd dan gaat de rente of het
      betreffende gedeelte van de rente voor de nog niet ingetreden jaren op het door die samenvoeging gevormde perceel
      over.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel111
  - number: '112.1'
    text: |-
      De rente is verschuldigd door hem, die het genot heeft van het perceel als bezitter, eigenaar of beperkt
      gerechtigde.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel112
  - number: '112.2'
    text: |-
      In geval van vruchtgebruik is de eigenaar verplicht de vruchtgebruiker bij het eindigen van zijn vruchtgebruik
      te vergoeden hetgeen deze, in verband met de vermindering van de waarde van de rente, berekend volgens
      [artikel 115][ref1], geacht moet worden voor aflossing te hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003094#Artikel115
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0003094
        artikel: '115'
        hoofdstuk: III
        afdeling: '12'
  - number: '112.3'
    text: |-
      In geval van het recht van opstal is de rente slechts verschuldigd, voor zover zodanig recht niet betreft het
      leggen en houden van leidingen in, op of boven de onroerende zaak van een ander.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel112
  - number: '113'
    text: |-
      Het bedrag van de rente wordt door de zorg van het bestuur van de Dienst voor het kadaster en de openbare registers
      bij ieder daaraan onderworpen perceel in de basisregistratie kadaster opgenomen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel113
  - number: '114.1'
    text: De rente wordt geheven en ingevorderd door of vanwege Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: '114.2'
    text: |-
      De heffing en de invordering van de rente geschieden met toepassing van de
      [Algemene wet inzake rijksbelastingen][ref1] (*Stb.* 1959, 301) en de [Invorderingswet 1990][ref2] ( *Stb.* 221)
      als ware die rente een rijksbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0004770
  - number: '114.3'
    text: |-
      De rente wordt geheven bij wege van aanslag. Indien met betrekking tot een zelfde perceel twee of meer personen
      renteplichtig zijn kan de rente bij wege van één aanslag worden geheven ten name van één van hen.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: '114.4'
    text: |-
      Bezwaar en beroep bedoeld in [Hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] kunnen niet zijn
      gegrond op de stelling dat het op grond van [artikel 107][ref2] verschuldigde bedrag ten onrechte of te hoog is
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003094#Artikel107
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003094
        artikel: '107'
        hoofdstuk: III
        afdeling: '12'
  - number: '114.5'
    text: |-
      Indien met toepassing van de tweede volzin van het derde lid de aanslag ten name van één renteplichtige is gesteld
      kan:
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: 114.5.a
    text: |-
      de ontvanger de aanslag op het gehele perceel verhalen ten name van degene te wiens name de aanslag is gesteld,
      zonder rekening te houden met de rechten van de overige renteplichtigen;
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: 114.5.b
    text: |-
      de renteplichtige die de aanslag heeft voldaan hetgeen hij meer heeft voldaan dan overeenkomt met zijn renteplicht
      verhalen op de overige renteplichtigen naar evenredigheid van ieders renteplicht.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: '114.6'
    text: Van het vijfde lid, aanhef en onderdeel *b*, kan bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel114
  - number: '115.1'
    text: |-
      Vóór of op 1 juli van elk jaar kan de rente over de nog niet ingetreden jaren worden afgekocht voor haar waarde op
      genoemde dag.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel115
  - number: '115.2'
    text: |-
      Ter berekening van die waarde wordt het over een jaar verschuldigde bedrag geacht op de eerste juli van dat jaar te
      verschijnen. De berekening geschiedt voorts naar de rentevoet van 35/8 ten honderd.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel115
  - number: '115.3'
    text: De verdere bepalingen omtrent de afkoop worden door Onze Minister van Financiën vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel115
  - number: '116'
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij is belast met de uitvoering van de bepalingen van dit
      hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel116
  - number: '117'
    text: |-
      De medewerking van de bewaarder van het kadaster en de openbare registers bij de uitvoering van deze wet geschiedt
      kosteloos.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel117
  - number: '118'
    text: |-
      Na beëindiging der werkzaamheden draagt de rechtercommissaris alle stukken, op de reconstructie betrekking
      hebbende, over aan Onze Minister van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel118
  - number: '121.1'
    text: 'Deze wet kan worden aangehaald onder de titel: Reconstructiewet Midden-Delfland.'
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel121
  - number: '121.2'
    text: |-
      Zij treedt in werking op een door Ons nader te bepalen tijdstip, dat voor verschillende onderdelen van deze wet
      verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0003094/2009-07-01#Artikel121
