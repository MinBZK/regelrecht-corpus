preamble:
  text: |-
    Gelet op artikel 4, eerste lid, van het Vaststellingsbesluit Binnenvaartpolitiereglement en artikel 19, zesde lid,
    onder c, van het Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010991/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het diploma, bedoeld in [artikel 4A.02, eerste lid, onder b, van het Binnenvaartpolitiereglement][ref1] en
      [artikel 19, zesde lid, onder c, van het Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen][ref2], is
      het radarpatent, bedoeld in [artikel 6.04, tweede lid, van het Rsp](onbekend), of een krachtens [artikel 6.03,
      eerste lid, van het Rsp](onbekend) hieraan gelijkgesteld radarpatent.


      [ref1]: https://wetten.overheid.nl/BWBR0003628#Artikel4A.02
      [ref2]: https://wetten.overheid.nl/BWBR0005315#Artikel19
