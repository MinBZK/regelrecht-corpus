        artikel: '19'
  - number: '2'
    text: De Regeling radardiploma binnenvaart wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010991/2011-07-01#Artikel2
  - number: '3'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 27 oktober 1992, nr. DGSM/J 31530/92, houdende de van
      toepassing verklaring van de Regeling radardiploma binnenvaart op het Kanaal van Gent naar Terneuzen (Stcrt. 219),
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010991/2011-07-01#Artikel3
  - number: '4'
    text: Deze regeling treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010991/2011-07-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling radarpatent binnenvaart.'
    url: https://wetten.overheid.nl/BWBR0010991/2011-07-01#Artikel5
