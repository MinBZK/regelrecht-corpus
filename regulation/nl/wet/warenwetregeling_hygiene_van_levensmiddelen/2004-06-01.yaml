  - number: '35'
    text: |-
      In vervoermiddelen of recipiënten die worden gebruikt voor het gelijktijdige vervoer van eet- of drinkwaren en
      andere waren of van verschillende eet- of drinkwaren, worden de eet- of drinkwaren en andere waren voor zover
      noodzakelijk afdoende van elkaar gescheiden, teneinde besmetting van eet- of drinkwaren tegen te gaan.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel35
  - number: '36'
    text: |-
      Vervoermiddelen en recipiënten die zijn gebruikt voor het vervoer van andere waren dan eet- of drinkwaren of voor
      het vervoer van verschillende eet- of drinkwaren, worden tussen de verschillende vrachten zodanig schoongemaakt dat
      ieder gevaar voor besmetting van eet- of drinkwaren wordt voorkómen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel36
  - number: '37'
    text: |-
      1 Eet- of drinkwaren worden tijdens het vervoer zodanig geplaatst en beschermd in vervoermiddelen of recipiënten,
      dat het risico van besmetting daarvan zoveel mogelijk wordt beperkt. Adequate maatregelen zijn getroffen teneinde
      ongedierte tijdens het vervoer onder controle te houden.

      2 Vervoermiddelen en recipiënten die worden gebruikt voor het vervoer van eet- of drinkwaren, zijn zodanig
      ontworpen dat de temperatuur waarbij die eet- of drinkwaren ten hoogste onderscheidenlijk ten minste vervoerd
      moeten worden, kan worden gehandhaafd en bewaakt.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel37
  - number: '38'
    text: |-
      Het bereiden, behandelen, verpakken en bewaren van eet- of drinkwaren en grondstoffen geschiedt niet in
      bedrijfsruimten voor zover die zich bevinden in percelen waarin gevallen van tyfus, paratyfus, dysenterie of
      cholera, dan wel andere, in hun effect vergelijkbare besmettelijke ziekten voorkomen, en ter zake in overleg met de
      GGD geen toereikende maatregelen zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel38
  - number: '39'
    text: |-
      1 Het bereiden, behandelen, verpakken en bewaren van eet- of drinkwaren en grondstoffen geschiedt op zindelijke
      wijze.

      2 Het bereiden, behandelen, verpakken en bewaren van eet- of drinkwaren en grondstoffen geschiedt uitsluitend door
      personen wier hoofd, handen en armen schoon zijn.

      3 Personen die werkzaam zijn in een bedrijfsruimte, betrachten een zeer goede persoonlijke hygiëne en dragen
      passende, schone en, waar nodig met het oog op de veiligheid en deugdelijkheid van eet- of drinkwaren, beschermende
      kleding.

      4 Personen met diarree, ontstekingen, open wonden of huidziekten aan hoofd, hals, armen of handen, houden zich niet
      bezig met het bereiden, behandelen of verpakken van eet- of drinkwaren en grondstoffen, voor zover de waar daardoor
      verontreinigd kan worden.

      5 Personen die lijden aan een van de in [artikel 38][ref1] bedoelde besmettelijke ziekten, salmonellosen of andere
      ziekten waarvoor een aangifteplicht bestaat, houden zich niet bezig met het bereiden, behandelen of verpakken van
      eet- of drinkwaren, en grondstoffen daarvoor, tenzij ter zake in overleg met de GGD toereikende maatregelen zijn
      getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel38
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel39
