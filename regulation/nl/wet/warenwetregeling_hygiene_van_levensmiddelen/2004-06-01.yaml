  - number: 34b
    text: |-
      1 In afwijking van [artikel 34, tweede en derde lid][ref1], mag het bulkvervoer over zee van ruwe suiker die
      zonder dat deze een volledig en effectief raffinageproces heeft ondergaan niet bestemd is voor gebruik als eetwaar
      of als ingrediënt van een eet- of drinkwaar, plaatsvinden in ruimten, containers of tanks die niet uitsluitend
      worden gebruikt voor het vervoer van levensmiddelen. Deze bepaling is niet van toepassing indien de lading die
      onmiddellijk aan de ruwe suiker vooraf is gegaan, een in bulk vervoerde vloeistof is geweest.

      2 De in het eerste lid bedoelde ruimten, containers of tanks worden voordat de ruwe suiker wordt geladen
      doeltreffend schoongemaakt om residuen van de vorige lading en andere verontreinigingen te verwijderen. Het
      levensmiddelenbedrijf dat de ruwe suiker overeenkomstig het eerste lid vervoert, controleert of deze residuen na
      het schoonmaken daadwerkelijk verwijderd zijn.

      3 Het in het tweede lid bedoelde schoonmaakproces is een kritisch punt zoals bedoeld in
      [artikel 30, tweede lid, onder c][ref2], waarbij rekening wordt gehouden met de aard van de vorige lading die in de
      ruimte, container of tank vervoerd is.

      4 Het levensmiddelenbedrijf dat verantwoordelijk is voor het in het eerste lid bedoelde vervoer over zee van ruwe
      suiker, houdt bewijsstukken bij waarin een nauwkeurige en gedetailleerde beschrijving is opgenomen van de vorige
      lading die in de desbetreffende ruimte, container of tank is vervoerd, en van het type en de doeltreffendheid van
      het schoonmaakproces dat onmiddellijk voorafgaand aan het vervoer van de ruwe suiker is toegepast.

      5 De in het vierde lid bedoelde bewijsstukken vergezellen de zending ruwe suiker tijdens alle fases van het vervoer
      naar de raffinaderij. Op deze bewijsstukken staat in één of meer talen van de Europese Unie de vermelding ‘Dit
      product moet worden geraffineerd vóór gebruik voor menselijke consumptie’. De raffinaderij bewaart een kopie van
      deze bewijsstukken voor een periode van ten minste vijf jaar na het uitvoeren van de raffinage.

      6 Het levensmiddelenbedrijf dat verantwoordelijk is voor het vervoer van de ruwe suiker of voor het
      raffinageproces, stelt desgevraagd de in het vierde lid bedoelde bewijsstukken ter beschikking van de met het
      toezicht op de naleving van deze voorschriften belaste ambtenaren.

      7 Ruwe suiker die over zee is vervoerd in ruimten, containers of tanks die niet uitsluitend worden gebruikt voor
      het vervoer van levensmiddelen, wordt pas na een volledig en effectief raffinageproces gebruikt als eetwaar of als
      ingrediënt van een eet- of drinkwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007080#Artikel30
