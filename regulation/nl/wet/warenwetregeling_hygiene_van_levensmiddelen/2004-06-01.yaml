$id: warenwetregeling_hygiene_van_levensmiddelen
regulatory_layer: WET
publication_date: '2005-10-27'
valid_from: '2004-06-01'
bwb_id: BWBR0007080
url: https://wetten.overheid.nl/BWBR0007080/2004-06-01
preamble:
  text: |-
    handelende in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 3, derde en vierde lid, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen;

    Gezien het advies van de Adviescommissie Warenwet van 18 juli 1994 met nummer 14779/(4/6)5;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            primaire produktie:

              handelingen als melken, oogsten en slachten;



            b
            hygiëne:

              alle maatregelen die, na de primaire produktie, noodzakelijk zijn om de veiligheid en deugdelijkheid van
      eet- en drinkwaren te waarborgen tijdens bereiding, verwerking, behandeling, verpakking, vervoer, distributie en
      verhandeling daarvan;



            c
            levensmiddelenbedrijf:

              elke onderneming die eet- of drinkwaren bereidt, verwerkt, behandelt, verpakt, vervoert, distribueert of
      verhandelt.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel1
  - number: '2'
    text: |-
      1 Een levensmiddelenbedrijf accepteert geen grondstoffen of eet- en drinkwaren waarvan redelijkerwijze mag worden
      aangenomen dat zij zodanig besmet zijn met parasieten, pathogene micro-organismen of toxische, in ontbinding
      verkerende of vreemde substanties, dat de daarmee op een hygiënische wijze bereide en behandelde eet- en drinkwaren
      ongeschikt zouden zijn voor menselijke consumptie.

      2 Gevaarlijke of oneetbare waren, met inbegrip van diervoeders, worden op passende wijze geëtiketteerd, en bewaard
      in deugdelijk afgesloten veilige recipiënten.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel2
  - number: '3'
    text: |-
      Eet- of drinkwaren, welke gekoeld moeten worden bewaard teneinde microbiologisch bederf
      of de uitgroei van pathogene bacteriën tegen te gaan, worden zo snel mogelijk na de
      laatste warmtebehandeling of de laatste bereidingsfase daarvan, afgekoeld tot de in
      [artikel 15, eerste lid, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref1] bedoelde
      temperatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005758#Artikel15
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005758
        artikel: '15'
  - number: '4'
    text: |-
      Exploitanten van levensmiddelenbedrijven bewerkstelligen dat personen die eet- en drinkwaren bereiden en
      behandelen:

      a. worden onderworpen aan toezicht ter zake; en

      b. een op hun werkzaamheden afgestemde instructie of opleiding ontvangen inzake de hygiëne van eet- en drinkwaren.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel4
  - number: '5'
    text: |-
      Deze paragraaf heeft geen betrekking op:

      a. mobiele of tijdelijke bedrijfsruimten zoals tenten, marktkramen en winkelwagens;

      b. ruimten die af en toe voor catering worden gebruikt; en

      c. automaten die eet- of drinkwaren verstrekken.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel5
  - number: '6'
    text: |-
      1 Bedrijfsruimten zijn schoon, goed onderhouden en voldoende verlicht door dag- of kunstlicht.

      2 In bedrijfsruimten zijn adequate maatregelen getroffen teneinde ongedierte uit deze ruimten te weren.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel6
  - number: '7'
    text: |-
      Bedrijfsruimten zijn zodanig gebouwd en ingericht dat:

      a. zij goed kunnen worden schoongemaakt en, indien noodzakelijk, gedesinfecteerd;

      b. voorkómen worden:

      1º ophoping van vuil;

      2º contact met toxische materialen;

      3º verontreiniging van eet- en drinkwaren met ongewenste deeltjes; en

      4º vorming van condens of ongewenste schimmel op oppervlakten;

      c. een hygiënische bereiding en behandeling van eet- en drinkwaren mogelijk is, onder andere door bescherming tegen
      wederzijdse besmetting tussen en tijdens processtappen door eet- of drinkwaren, uitrusting, materialen, water,
      luchttoevoer of personeel en externe bronnen van verontreiniging zoals ongedierte;

      d. eet- en drinkwaren kunnen worden bereid, behandeld en bewaard bij de ter zake voorgeschreven temperaturen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel7
  - number: '8'
    text: |-
      1 In bedrijfsruimten zijn voor het wassen van de handen voldoende wastafels aanwezig met:

      a. warm en koud stromend water; en

      b. materiaal voor het wassen en hygiënisch drogen van de handen.

      2 De in het eerste lid bedoelde wastafels zijn afgescheiden van de voorzieningen voor het wassen van voedsel,
      indien zulks noodzakelijk is voor de veiligheid van eet- en drinkwaren.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel8
  - number: '9'
    text: |-
      1 In bedrijfsruimten zijn voldoende toiletten met spoeling aanwezig die zijn aangesloten op een adequaat
      afvoersysteem. Deze toiletten verkeren in zindelijke en goed onderhouden staat.

      2 Toiletten komen niet rechtstreeks uit in bereidplaatsen. Voor zover toiletten, waaronder begrepen urinoirs,
      vanuit de bereidplaats bereikbaar zijn, zijn zij eerst na het passeren van twee deuren voor de gebruikers ervan
      toegankelijk. In de ruimte tussen beide deuren, dan wel op het toilet zelve, is aanwezig een in [artikel 8][ref1]
      bedoelde handenwasgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel8
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007080
        artikel: '8'
        paragraaf: '2'
  - number: '10'
    text: |-
      1 Een bedrijfsruimte, en sanitaire installaties daarin, zijn voldoende geventileerd. Geforceerde luchtstromen van
      besmette naar schone ruimten worden voorkómen.

      2 De ventilatiesystemen zijn zodanig geconstrueerd dat filters en andere onderdelen die regelmatig schoongemaakt of
      vervangen moeten worden, gemakkelijk toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel10
  - number: '11'
    text: |-
      Afvoervoorzieningen in de bedrijfsruimte zijn geschikt voor het beoogde doel en zijn zodanig ontworpen en
      geconstrueerd dat ieder risico van besmetting van de eet- en drinkwaren wordt voorkómen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel11
  - number: '12'
    text: |-
      Indien het personeel van een levensmiddelenbedrijf zich met het oog op de veiligheid of de deugdelijkheid van een
      eet- of drinkwaar dient om te kleden, zijn daartoe geschikte kleedruimtes aanwezig bij de bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel12
  - number: '13'
    text: |-
      Deze paragraaf heeft geen betrekking op:

      a. mobiele of tijdelijke bedrijfsruimten zoals tenten, marktkramen en winkelwagens;

      b. ruimten die af en toe voor catering worden gebruikt;

      c. automaten die eet- of drinkwaren verstrekken; en

      d. bedrijfsruimten die behoren tot een restauratie-ruimte.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel13
  - number: '14'
    text: |-
      Vloeroppervlakten in bedrijfsruimten:

      a. verkeren in deugdelijke en goed onderhouden staat;

      b. zijn eenvoudig schoon te maken en, indien noodzakelijk met het oog op de veiligheid of de deugdelijkheid van
      eet- en drinkwaren, te desinfecteren; en

      c. zijn, waar passend, voorzien van een goede waterafvoer via het vloeroppervlak.

      Zij zijn daartoe vervaardigd van ondoordringbaar, niet-absorberend, afwasbaar en niet-toxisch materiaal, tenzij
      de exploitant van het desbetreffende levensmiddelenbedrijf ten genoegen van de met het toezicht ter zake belaste
      ambtenaar aantoont dat het door hem gebruikte andere materiaal voldoet aan b.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel14
  - number: '15'
    text: |-
      Muuroppervlakten in bedrijfsruimten:

      a. verkeren in deugdelijke en goed onderhouden staat; en

      b. zijn eenvoudig schoon te maken en, indien noodzakelijk met het oog op de veiligheid of de deugdelijkheid van
      eet- en drinkwaren, te desinfecteren.

      Zij zijn daartoe vervaardigd van ondoordringbaar, niet-absorberend, afwasbaar en niet-toxisch materiaal, met een
      glad oppervlak tot op een aan de werkzaamheden aangepaste hoogte, tenzij de exploitant van het desbetreffende
      levensmiddelenbedrijf ten genoegen van de met het toezicht ter zake belaste ambtenaar aantoont dat het door hem
      gebruikte andere materiaal voldoet aan b.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel15
  - number: '16'
    text: |-
      In bedrijfsruimten zijn plafonds en voorzieningen aan het plafond zodanig ontworpen, geconstrueerd en afgewerkt dat
      zich geen vuil kan ophopen en dat condens, ongewenste schimmelvorming en het loskomen van deeltjes worden beperkt.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel16
  - number: '17'
    text: |-
      1 In bedrijfsruimten zijn ramen en andere openingen zodanig ontworpen, geconstrueerd en afgewerkt dat zich geen
      vuil kan ophopen.

      2 Ramen die bij opening leiden tot direct contact van de bedrijfsruimte met de buitenomgeving, zijn voorzien van
      horren die op eenvoudige wijze kunnen worden verwijderd voor schoonmaak. Deze ramen worden niet geopend, indien
      zulks zou kunnen leiden tot besmetting van eet- of drinkwaren.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel17
  - number: '18'
    text: |-
      In bedrijfsruimten kunnen deuren op eenvoudige wijze worden schoongemaakt en, voor zover noodzakelijk met het oog
      op de veiligheid of de deugdelijkheid van eet- en drinkwaren, gedesinfecteerd. Deze deuren bevatten daartoe gladde
      en niet-absorberende oppervlakten, tenzij de exploitant van het desbetreffende levensmiddelenbedrijf ten genoegen
      van de met het toezicht ter zake belaste ambtenaar aantoont dat de door hem gebruikte andere oppervlakten voldoen
      aan de eerste volzin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel18
  - number: '19'
    text: |-
      Oppervlakten in bedrijfsruimten, waaronder oppervlakten van apparatuur, die in aanraking kunnen komen met eet-
      en drinkwaren:

      a. verkeren in deugdelijke en goed onderhouden staat; en

      b. zijn op eenvoudige wijze schoon te maken en, indien noodzakelijk met het oog op de veiligheid of de
      deugdelijkheid van eet- en drinkwaren, te desinfecteren.

      Zij zijn daartoe vervaardigd van glad, afwasbaar en niet-toxisch materiaal, tenzij de exploitant van het
      desbetreffende levensmiddelenbedrijf ten genoegen van de met het toezicht ter zake belaste ambtenaar aantoont dat
      het door hem gebruikte andere materiaal voldoet aan de eerste volzin van dit artikel.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel19
  - number: '20'
    text: |-
      Een bedrijfsruimte bevat doeltreffend voorzieningen voor het schoonmaken en desinfecteren van gereedschap en
      apparatuur. Deze voorzieningen zijn vervaardigd van roestvrij materiaal, zijn op eenvoudige wijze schoon te maken
      en zijn voorzien van een voldoende ononderbroken aanvoer van warm en koud water van drinkwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel20
  - number: '21'
    text: |-
      In een bedrijfsruimte zijn, waar nodig met het oog op de veiligheid of de deugdelijkheid van eet- en drinkwaren,
      doeltreffende voorzieningen aanwezig voor het wassen van eet- en drinkwaren. Deze voorzieningen zijn voorzien van
      een voldoende ononderbroken aanvoer van warm of koud water van drinkwaterkwaliteit.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel21
  - number: '22'
    text: |-
      1 Mobiele en tijdelijke bedrijfsruimten, ruimten die af en toe worden gebruikt voor catering, en automaten die eet-
      of drinkwaren verstrekken:

      a. zijn zodanig geplaatst, ontworpen en geconstrueerd; en

      b. worden op zodanige wijze schoongemaakt en onderhouden, dat het risico van besmetting van eet- en drinkwaren en
      de aanwezigheid van ongedierte, voor zover redelijkerwijze mogelijk wordt uitgesloten.

      2 Marktkramen zijn, met uitzondering van de voorkant, afgesloten met schoon winddicht zeildoek.

      3 In mobiele of tijdelijke bedrijfsruimten mogen slechts eenvoudige handelingen verricht worden inzake het
      bereiden, behandelen, verpakken of bewaren van eet- of drinkwaren, gericht op de onmiddellijke verkoop van de waar.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel22
  - number: '23'
    text: |-
      Voor zover noodzakelijk met het oog op de veiligheid of de deugdelijkheid van eet- en drinkwaren, voldoen de in
      [artikel 22][ref1] bedoelde ruimten aan de volgende eisen:

      a. met het oog op een goede persoonlijke hygiëne van het personeel zijn ten minste aanwezig:

      1º voorzieningen voor het hygiënisch wassen en drogen van de handen;

      2º schone sanitaire voorzieningen; en

      3º voorzieningen voor het personeel om zich om te kleden;

      b. oppervlakten die in contact kunnen komen met eet- en drinkwaren:

      1º verkeren in deugdelijke en goed onderhouden staat; en

      2º zijn op eenvoudige wijze schoon te maken en, indien noodzakelijk met het oog op de veiligheid of de
      deugdelijkheid van eet- en drinkwaren, te desinfecteren;

      en zijn vervaardigd van glad, afwasbaar, niet-toxisch materiaal, tenzij de exploitant van een desbetreffend
      levensmiddelenbedrijf ten genoegen van de met het toezicht ter zake belaste ambtenaar aantoont dat het door hem
      gebruikte andere materiaal eveneens geschikt is voor het beoogde gebruik;

      c. passende voorzieningen zijn aanwezig voor:

      1º het reinigen en, waar nodig met het oog op de veiligheid of de deugdelijkheid van eet- en drinkwaren,
      desinfecteren van de gereedschappen en materialen;

      2º het schoonmaken van de eet- en drinkwaren;

      3º een hygiënische opslag en verwijdering van gevaarlijke of oneetbare waren en al dan niet vloeibaar afval; en

      4º het handhaven en bewaken van gewenste temperaturen van eet- en drinkwaren; en

      d. voldoende warm of koud water van drinkwaterkwaliteit is beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel22
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007080
        artikel: '22'
        paragraaf: '4'
  - number: '24'
    text: |-
      1 In winkels aanwezige bereidplaatsen zijn vanuit de verkoopruimte niet vrij toegankelijk voor het publiek.

      2 In bereidplaatsen zijn geen huisdieren aanwezig.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel24
  - number: '25'
    text: |-
      Materiaal en apparatuur die met levensmiddelen in aanraking kunnen komen:

      a. worden schoongehouden; en

      b. zijn zodanig geïnstalleerd dat de omringende ruimten goed kunnen worden schoongemaakt;

      en zijn van een zodanige samenstelling en constructie en worden zodanig onderhouden en gerepareerd dat:

      c. het risico van besmetting van levensmiddelen zoveel mogelijk wordt beperkt; en

      d. zij grondig schoon kunnen worden gehouden en, voor zover noodzakelijk met het oog op de veiligheid of de
      deugdelijkheid van eet- en drinkwaren, gedesinfecteerd, rekening houdende met het beoogde gebruik ervan.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel25
  - number: '26'
    text: |-
      1 Indien noodzakelijk met het oog op de veiligheid of de deugdelijkheid van eet- en
      drinkwaren, worden staaf-, scherf- of blokjes ijs gemaakt van water dat voldoet aan
      [artikel 5, eerste lid, van het Warenwetbesluit Bereiding en behandeling van levensmiddelen][ref1]. Dit ijs wordt
      op hygiënische wijze bereid, behandeld en opgeslagen.

      2 Stoom die rechtstreeks in aanraking kan komen met eet- en drinkwaren, bevat geen stoffen die schadelijk kunnen
      zijn voor de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005758#Artikel5
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005758
        artikel: '5'
  - number: '27'
    text: |-
      Niet voor menselijke consumptie geschikt water dat wordt gebruikt voor stoomopwekking, koeling, brandbestrijding
      en andere soortgelijke toepassingen waarbij het niet in aanraking kan komen met eet- en drinkwaren, wordt
      getransporteerd in aparte, op duidelijke wijze te herkennen leidingen die:

      a. op duidelijke wijze geïdentificeerd kunnen worden;

      b. niet verbonden zijn met de drinkwaterleiding; en

      c. zo zijn geconstrueerd dat water uit die leiding niet in het drinkwatersysteem terecht kan komen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel27
  - number: '28'
    text: |-
      Voedsel- en ander afval:

      a. hoopt zich niet op in ruimten waarin eveneens levensmiddelen aanwezig zijn, behalve voorzover zulks
      onvermijdelijk is voor het goede functioneren van het levensmiddelenbedrijf; en

      b. wordt gedeponeerd in deugdelijk afsluitbare recipiënten waardoor zij geen onaangename geuren kunnen verspreiden,
      tenzij de exploitant van het desbetreffende levensmiddelenbedrijf ten genoegen van de met het toezicht ter zake
      belaste ambtenaar heeft aangetoond dat het door hem gebruikte andere type recipiënt eveneens geschikt is voor dit
      gebruik.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel28
  - number: '29'
    text: |-
      1 Opslagplaatsen van afval worden zodanig ontworpen en beheerd dat:

      a. zij kunnen worden schoongehouden en ongedierte kan worden geweerd; en

      b. besmetting kan worden voorkómen van eet- en drinkwaren, materiaal en bedrijfsruimten.

      2 De exploitant van een levensmiddelenbedrijf treft passende voorzieningen voor de verwijdering en opslag van
      voedsel- en ander afval. Opslagplaatsen van afval worden schoongehouden en ongedierte wordt daar geweerd.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel29
  - number: '30'
    text: |-
      1 De exploitant van een levensmiddelenbedrijf identificeert ieder aspect van zijn werkzaamheden dat bepalend
      is voor de veiligheid van de eet- en drinkwaren die in dat bedrijf worden bereid, verwerkt, behandeld, verpakt,
      vervoerd, gedistribueerd of verhandeld.

      2 Teneinde de in het eerste lid bedoelde veiligheid van eet- en drinkwaren te realiseren, verricht de exploitant
      van een levensmiddelenbedrijf de volgende werkzaamheden die zijn gehanteerd voor de ontwikkeling van het HACCP-
      systeem:

      a. het analyseren van de potentiële risico's voor eet- en drinkwaren bij bereiding, verwerking, behandeling,
      verpakking, vervoer, distributie of verhandeling in zijn levensmiddelenbedrijf;

      b. het nagaan op welke punten tijdens bereiding, verwerking, behandeling, verpakking, vervoer, distributie of
      verhandeling van eet- en drinkwaren zich risico's voor eet- en drinkwaren voor kunnen doen;

      c. het aanwijzen van de kritische punten, zijnde de onder b bedoelde punten die kritisch zijn voor de veiligheid
      van eet- en drinkwaren;

      d. het omschrijven en ten uitvoer leggen van doeltreffende controle- en bewakingsprocedures op die kritische
      punten; en

      e. het op gezette tijden, en telkens wanneer het proces van bereiden, verwerken, behandelen, verpakken, vervoeren,
      distribueren of verhandelen van een eet- of drinkwaar wordt gewijzigd, herhalen van de onder a tot en met d
      bedoelde werkzaamheden. Deze werkzaamheden worden vastgelegd in een schriftelijke rapportage die desgevraagd ter
      beschikking wordt gesteld van de met het toezicht ter zake belaste ambtenaren.

      3 Door de exploitant van een levensmiddelenbedrijf worden, met inachtneming van het tweede lid, passende
      veiligheidsprocedures vastgesteld, toegepast, gehandhaafd en herzien, teneinde de veiligheid van de eet- en
      drinkwaren die in dat bedrijf worden bereid, verwerkt, behandeld, verpakt, vervoerd, gedistribueerd of verhandeld
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel30
  - number: '31'
    text: |-
      1 Vertegenwoordigers van daarvoor in aanmerking komende sectoren van de levensmiddelenindustrie kunnen hygiënecodes
      opstellen waarin beschreven is op welke wijze bepaalde eet- of drinkwaren op zodanig hygiënische wijze bereid,
      verwerkt, behandeld, verpakt, vervoerd, gedistribueerd of verhandeld kunnen worden dat ter zake voldaan kan worden
      aan:

      a. [artikel 2][ref1] tot en met [artikel 4][ref2];

      b. [artikel 6][ref3] tot en met [artikel 12][ref4];

      c. [artikel 14][ref5] tot en met [artikel 30][ref6];

      d. [artikel 33][ref7];

      e. [artikel 34][ref8];

      f. [artikel 34b, tweede lid][ref9];

      g. [artikel 35][ref10] tot en met [artikel 37][ref11]; of

      h. [artikel 39][ref12];

      van deze regeling.

      2 De in het eerste lid bedoelde hygiënecodes kunnen worden opgesteld met inachtneming van de Aanbevolen
      Internationale Richtlijnen voor de Praktijk – Grondbeginselen van de levensmiddelenhygiëne, van de Codex
      Alimentarius.

      3 De in het eerste lid bedoelde hygiënecodes worden op initiatief van de opstellers ervan:

      a. besproken in een overleg tussen vertegenwoordigers van:

        - organisaties van ondernemers (industrie en handel);
        - organisaties van consumenten;
        - de Ministeries van Volksgezondheid, Welzijn en Sport, van Landbouw, Natuurbeheer en Visserij, en van Economische
      Zaken;
        - de Voedsel en Waren Autoriteit; en
        - het relevante bedrijfschap of productschap; en

      b. vervolgens ter goedkeuring voorgelegd aan de Minister van Volksgezondheid, Welzijn en Sport.

      4 De exploitant van een levensmiddelenbedrijf wordt bij controle door een met het toezicht op de naleving van deze
      regeling belaste ambtenaar, vóóraf door die ambtenaar in de gelegenheid gesteld te kennen te geven of door dat
      bedrijf gebruik wordt gemaakt van de voor zijn sector van de levensmiddelenindustrie vastgestelde en goedgekeurde
      hygiënecode, bedoeld in het derde lid.

      5 De exploitant van een levensmiddelenbedrijf dat gebruik maakt van de hygiënecode, bedoeld in het vierde lid:

      a. voldoet aan de desbetreffende bepaling(en) in het eerste lid indien hij handelt volgens de voorschriften in die
      hygiënecode die daarop betrekking hebben;

      b. voldoet niet aan de desbetreffende bepaling(en) in het eerste lid indien hij niet handelt volgens de
      voorschriften in die hygiënecode die daarop betrekking hebben.

      6 Een in dit artikel bedoelde goedkeuring kan, voor zover die goedkeuring betrekking heeft op een in
      [artikel 30][ref13] omschreven onderwerp, door de Minister van Volksgezondheid, Welzijn en Sport worden ingetrokken
      indien:

      a. de desbetreffende hygiënecode niet waar mogelijk en zinvol is voorzien van microbiologische richtwaarden,
      bedoeld in paragraaf III van de Mededeling van de Minister van Volksgezondheid, Welzijn en Sport van 16 februari
      1999/GZB/VVB/99551, Stcrt. 35; of

      b. de desbetreffende hygiënecode herzien dient te worden overeenkomstig [artikel 30, derde lid][ref14].

      De Minister van Volksgezondheid, Welzijn en Sport neemt een besluit, gehoord het schriftelijk advies van de Voedsel
      en Waren Autoriteit.


