  - number: '32'
    text: |-
      De met het toezicht op de naleving van deze regeling belaste ambtenaren houden naar behoren rekening met,
      voor zover vastgesteld, Europese gidsen voor goede hygiënische praktijken, bedoeld in artikel 5, zesde
      lid, van [richtlijn nr. 93/43/EEG](31993L0043) van de Raad van de Europese Unie van 14 juni 1993 inzake
      levensmiddelenhygiëne (PbEG L 175).
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel32
  - number: '33'
    text: |-
      Vervoermiddelen en recipiënten die worden gebruikt voor het vervoer van eet- of drinkwaren zijn:

      a. zodanig ontworpen en geconstrueerd dat zij goed kunnen worden schoongemaakt en, voor zover noodzakelijk met het
      oog op de veiligheid of de deugdelijkheid van eet- of drinkwaren, gedesinfecteerd; en

      b. schoon en worden in goede staat van onderhoud gehouden;

      zodat de vervoerde eet- of drinkwaren worden beschermd tegen besmetting.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel33
  - number: '34'
    text: |-
      1 Ruimten en recipiënten waarin eet- of drinkwaren vervoerd worden, worden niet gebruikt voor het vervoer van
      andere waren indien zulks kan leiden tot besmetting van de eet- of drinkwaren.

      2 Eet- of drinkwaren in bulk in vloeibare, gegranuleerde of poedervormige staat worden vervoerd in ruimten,
      containers of tanks die voorbehouden zijn aan het vervoer van eet- of drinkwaren.

      3 Op een in het tweede lid bedoelde container wordt in één of meer talen van de Europese Unie de vermelding
      gebezigd: ‘uitsluitend voor levensmiddelen’, of woorden van gelijke strekking.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel34
  - number: 34a
    text: |-
      1 In afwijking van [artikel 34, tweede en derde lid][ref1], kan het bulkvervoer van vloeibare oliën of vetten
      die zullen worden bewerkt en zijn bestemd of waarschijnlijk zullen worden gebruikt voor menselijke consumptie,
      plaatsvinden in zeeschepen in tanks die niet uitsluitend zijn voorbehouden aan het vervoer van eet- of drinkwaren,
      op de voorwaarden dat:

      a. de oliën of vetten in een roestvrij stalen tank of een met epoxyhars of een technisch equivalent beklede tank
      worden vervoerd en de laatste lading die in de tank is vervoerd, een eet- of drinkwaar is dan wel op de in de
      bijlage bij deze regeling opgenomen lijst van aanvaardbare vorige ladingen voorkomt; of

      b. de oliën of vetten worden vervoerd in een andere tank dan in onderdeel a van dit lid is bedoeld en de drie
      laatste ladingen die in de tank zijn vervoerd, eet- of drinkwaren zijn of voorkomen op de in de bijlage opgenomen
      lijst van aanvaardbare vorige ladingen.

      2 In afwijking van [artikel 34, tweede en derde lid][ref2], kan het bulkvervoer van vloeibare oliën of vetten
      die niet verder zullen worden bewerkt en bestemd zijn of waarschijnlijk zullen worden gebruikt voor menselijke
      consumptie, plaatsvinden in zeeschepen in tanks die niet uitsluitend zijn voorbehouden aan het vervoer van eet- of
      drinkwaren, op de voorwaarden dat:

      a. de tank van roestvrij staal is vervaardigd of met epoxyhars of een technisch equivalent is bekleed; en

      b. de drie laatste ladingen die in de tank zijn vervoerd, eet- of drinkwaren zijn geweest.

      3 De kapitein van het zeeschip dat in bulktanks vloeibare oliën of vetten als bedoeld in het eerste en tweede lid
      van dit artikel vervoert, beschikt over nauwkeurige schriftelijke bewijzen betreffende de doeltreffendheid van het
      tussen deze ladingen uitgevoerde schoonmaakproces.

      4 In het geval dat de lading is overgeslagen, beschikt de kapitein van het ontvangende schip naast de in het
      derde lid van dit artikel bedoelde bewijzen over nauwkeurige schriftelijke bewijzen dat het bulkvervoer van de
      vloeibare oliën of vetten tijdens het vorige vervoer aan de in het eerste en tweede lid van dit artikel vermelde
      bepalingen voldeed en betreffende de doeltreffendheid van het tussen deze ladingen op het andere schip uitgevoerde
      schoonmaakproces.


      [ref1]: https://wetten.overheid.nl/BWBR0007080#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007080#Artikel34
