  - number: '40'
    text: De Warenwetregeling Levensmiddelenhygiëne wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel40
  - number: '41'
    text: Deze regeling treedt in werking met ingang van 14 december 1995.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel41
  - number: '42'
    text: |-
      Deze regeling wordt aangehaald als: Warenwetregeling Hygiëne van levensmiddelen.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007080/2004-06-01#Artikel42
