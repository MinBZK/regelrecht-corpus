---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_beleggingsinstellingen
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2002-07-19'
bwb_id: BWBR0004809
url: https://wetten.overheid.nl/BWBR0004809/2002-07-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven voor beleggingsinstellingen met het
    oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, en dat het
    noodzakelijk is uitvoering te geven aan de Richtlijn van de Raad van de Europese Gemeenschappen van 20 december
    1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor
    collectieve belegging in effecten (icbe's) (85/611/EEG);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.a
    text: |-
      *beleggingsmaatschappij:* de rechtspersoon die gelden of andere goederen ter collectieve belegging vraagt of heeft
      verkregen teneinde de deelnemers in de opbrengst van de beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.b
    text: |-
      *beleggingsfonds:* een niet in een rechtspersoon ondergebracht vermogen waarin ter collectieve belegging gevraagde
      of verkregen gelden of andere goederen zijn of worden opgenomen teneinde de deelnemers in de opbrengst van de
      beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.c
    text: '*beleggingsinstelling:* beleggingsmaatschappij of beleggingsfonds;'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.d
    text: |-
      *deelnemer:* de aandeelhouder in een beleggingsmaatschappij danwel de deelgerechtigde in een ter collectieve
      belegging bijeengebracht vermogen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.e
    text: |-
      *beheerder:* de beleggingsmaatschappij respectievelijk degene die geheel of ten dele belast is met het beheer van
      het beleggingsfonds;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.f
    text: '*bewaarder:* degene die belast is met de bewaring van de activa van de beleggingsinstelling;'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.g
    text: 'effecten:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.g.1
    text: |-
      aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, optiebewijzen, warrants, en soortgelijke
      waardepapieren;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.g.2
    text: |-
      rechten van deelgenootschap, opties, rechten op overdracht op termijn van zaken, inschrijvingen in aandelen- en
      schuldregisters, en soortgelijke, al dan niet voorwaardelijke, rechten;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.g.3
    text: certificaten van waarden als hiervoor bedoeld;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.g.4
    text: recepissen van waarden als hiervoor bedoeld;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.h
    text: '*Onze minister:* Onze minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.i
    text: |-
      *richtlijn:* de Richtlijn van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie van
      de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging in
      effecten (85/611/EEG, *Pb.*L375);
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: 1.j
    text: |-
      Lid-Staat: een lid-staat van de Europese Unie alsmede een staat, niet zijnde een lid-staat van de Europese Unie,
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel1
  - number: '2'
    text: 'Geen effecten in de zin van deze wet zijn:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel2
  - number: 2.a
    text: waarden welke uitsluitend het karakter van betaalmiddel dragen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel2
  - number: 2.b
    text: appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel2
  - number: '3'
    text: |-
      De bepalingen van deze wet en de daarop berustende bepalingen ten aanzien van een beleggingsinstelling die een
      beleggingsfonds is, zijn gericht tot de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden in of vanuit Nederland buiten een besloten kring gelden of andere goederen ter deelneming in een
      beleggingsinstelling waaraan geen vergunning is verleend, te vragen of te verkrijgen dan wel rechten van deelneming
      in een dergelijke beleggingsinstelling aan te bieden.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel4
  - number: '4.2'
    text: 'Het verbod in het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel4
  - number: 4.2.a
    text: |-
      de beleggingsinstelling als bedoeld in [artikel 17, eerste lid][ref1], indien de Lid-Staat waar de zetel is gelegen
      uitvoering aan de richtlijn heeft gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: 4.2.b
    text: |-
      de aanbieding van rechten van deelneming door natuurlijke personen anders dan in de uitoefening van hun beroep
      of bedrijf.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel4
  - number: '5.1'
    text: |-
      Onze minister verleent een beleggingsinstelling, op verzoek en met inachtneming van [artikel 6][ref1],
      een vergunning indien de aanvrager aantoont dat de beleggingsinstelling en de bewaarder, indien aan de
      beleggingsinstelling verbonden, voldoen aan de bij of krachtens algemene maatregel van bestuur te stellen eisen met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 5.1.a
    text: deskundigheid en betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.1.b
    text: financiële waarborgen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.1.c
    text: bedrijfsvoering; en
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.1.d
    text: aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: '5.2'
    text: 'Indien een vergunning voor een beleggingsfonds wordt gevraagd, dient de aanvrager bovendien aan te tonen dat:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.2.a
    text: de beheerder een rechtspersoon met volledige rechtsbevoegdheid is;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.2.b
    text: de activa van het beleggingsfonds in bewaring worden gegeven bij een van de beheerder onafhankelijke bewaarder; en
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: 5.2.c
    text: |-
      de activa van het beleggingsfonds worden afgescheiden van het vermogen van de beheerder, van de bewaarder alsmede
      van elke natuurlijke persoon of andere rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: '5.3'
    text: |-
      Onze minister kan op verzoek aan een aanvrager een vergunning verlenen indien de aanvrager aantoont dat
      redelijkerwijs niet volledig kan worden voldaan aan eisen gesteld bij of krachtens het eerste en tweede lid, en hij
      tevens aantoont dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende bereikt zijn.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel5
  - number: '6.1'
    text: 'De aanvrager van een vergunning voor een beleggingsinstelling:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: 6.1.a
    text: |-
      waarvan het statutaire of reglementaire doel uitsluitend is het beleggen in effecten met toepassing van het
      beginsel van risicospreiding;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: 6.1.b
    text: |-
      waarvan de rechten van deelneming op verzoek van de deelnemer ten laste van de activa rechtstreeks of middellijk
      worden ingekocht of terugbetaald; en
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: 6.1.c
    text: waarvan de zetel of, wanneer het een beleggingsfonds betreft, die van de beheerder, in Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.2'
    text: |-
      Het hoofdkantoor van de beleggingsmaatschappij dan wel van de beheerder van het beleggingsfonds is in Nederland
      gelegen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.3'
    text: De werkzaamheden van de beheerder van het beleggingsfonds zijn beperkt tot het beheer van beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.4'
    text: De beleggingsinstelling vervult geen andere werkzaamheden dan die bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.5'
    text: |-
      De activa van de beleggingsmaatschappij worden in bewaring gegeven bij een van haar onafhankelijke bewaarder. Bij
      of krachtens algemene maatregel van bestuur kan voor beleggingsmaatschappijen van dit vereiste worden afgeweken
      overeenkomstig de bij of krachtens die maatregel te stellen regels.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.6'
    text: De bewaarder van de beleggingsinstelling heeft zijn zetel in een Lid-Staat en heeft een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
  - number: '6.7'
    text: |-
      [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7'
    text: |-
      [Artikel 6][ref1] is niet van toepassing op een in dat artikel omschreven beleggingsinstelling die:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 7.a
    text: geen gelden of andere goederen van het publiek van de Lid-Staten ter belegging vraagt of verkrijgt;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel7
  - number: 7.b
    text: |-
      krachtens haar statuten of reglementen, haar rechten van deelneming slechts bij het publiek in landen buiten de
      Lid-Staten mag plaatsen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel7
  - number: 7.c
    text: |-
      behoort tot één van de door Onze minister aangewezen soorten beleggingsinstellingen waarvoor de bij en krachtens
      [artikel 12, tweede lid][ref1], gestelde regels met betrekking tot het beleggen, gelet op hun beleid inzake
      beleggingen of het aangaan van leningen, niet geschikt zijn; of


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 7.d
    text: haar activa via dochtermaatschappijen voornamelijk belegt in andere objecten dan effecten.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel7
  - number: '8'
    text: |-
      Aan een vergunning kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een adequate
      werking van de financiële markten en de positie van de beleggers op die markten, indien feiten en omstandigheden
      die betrekking hebben op degene voor wie de vergunning zal gelden dit vereisen. De beperkingen kunnen uitsluitend
      worden gesteld ten aanzien van de reikwijdte en de tijdsduur van de vergunning.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel8
  - number: '9'
    text: |-
      Als bewaarder mag slechts optreden een rechtspersoon die in belangrijke mate zijn bedrijf maakt van het bewaren en
      administreren van beleggingsobjecten ten behoeve van derden.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel9
  - number: '10'
    text: |-
      Indien Onze minister van oordeel is dat van de in Nederland gevoerde of te voeren naam van de beleggingsinstelling
      gevaar voor verwarring is te duchten, verlangt hij van de beleggingsinstelling een verklarende vermelding aan de
      naam toe te voegen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel10
  - number: '11.1'
    text: |-
      Het is de beleggingsinstelling waaraan op grond van [artikel 6][ref1] een vergunning is verleend, verboden haar
      statuten of reglementen zodanig te wijzigen dat zij niet meer onder de toepassing van [artikel 6][ref2] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Een wijziging van de statuten of reglementen, als bedoeld in het eerste lid, is nietig. Op verzoek van het openbaar
      ministerie benoemt de rechter een bewindvoerder met de macht om de gevolgen van de nietige handeling ongedaan te
      maken.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel11
  - number: '11.3'
    text: |-
      Bij het ongedaan maken van de nietige handeling dient de bewindvoerder mede te handelen in het belang van de
      deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel11
  - number: '12.1'
    text: |-
      Een beleggingsinstelling waaraan een vergunning is verleend en de bewaarder, indien aan de instelling verbonden,
      zijn verplicht zich te houden aan de bij of krachtens algemene maatregel van bestuur te stellen regels met
      betrekking tot deskundigheid en betrouwbaarheid, financiële waarborgen, bedrijfsvoering en informatieverschaffing.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: '12.2'
    text: |-
      Een beleggingsinstelling, waaraan op grond van [artikel 6][ref1] een vergunning is verleend, en de bewaarder,
      indien aan de instelling verbonden, zijn bovendien verplicht zich te houden aan de bij of krachtens algemene
      maatregel van bestuur te stellen aanvullende regels met betrekking tot financiële waarborgen, het beleggen en
      informatieverschaffing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.3'
    text: |-
      Onze minister kan op verzoek van de beleggingsinstelling bepalen, dat zij of de bewaarder, indien aan de instelling
      verbonden, niet behoeft te voldoen aan alle in het eerste of het tweede lid bedoelde regels indien zij aantoont
      dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt te bereiken
      anderszins voldoende bereikt zijn. Onze minister kan een beschikking als hiervoor bedoeld wijzigen of intrekken
      indien naar zijn oordeel de omstandigheden waaronder de beschikking is gegeven zodanig zijn gewijzigd dat de
      doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: '12.4'
    text: |-
      De accountant, bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1], die op grond van
      de regels, bedoeld in het eerste of tweede lid, de jaarrekening van een beleggingsinstelling van een verklaring
      moet voorzien, meldt Onze minister zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van zijn
      desbetreffende werkzaamheden kennis heeft gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 12.4.a
    text: in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: 12.4.b
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: 12.4.c
    text: het voortbestaan van de beleggingsinstelling bedreigt; of
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: 12.4.d
    text: leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: '12.5'
    text: |-
      Op de accountant, bedoeld in het vierde lid, die naast zijn werkzaamheden voor de beleggingsinstelling ook
      werkzaamheden uitvoert voor een andere onderneming of instelling, is de meldingsplicht, bedoeld in het vierde lid,
      van overeenkomstige toepassing indien de beleggingsinstelling dochtermaatschappij is van de andere onderneming of
      instelling, dan wel indien de andere onderneming of instelling dochtermaatschappij is van de beleggingsinstelling.
      Voor de toepassing van de eerste volzin wordt onder dochtermaatschappij verstaan een dochtermaatschappij als
      bedoeld in artikel 24*a* van Boek 2 van het Burgerlijk Wetboek, met dien verstande dat een beleggingsinstelling
      tevens dochtermaatschappij kan zijn van een natuurlijk persoon of vennootschap.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: '12.6'
    text: |-
      De accountant die op grond van het vierde of vijfde lid tot een melding aan Onze minister is overgegaan, is niet
      aansprakelijk voor schade die een derde dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle
      feiten en omstandigheden, in redelijkheid niet tot melding had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel12
  - number: '13.1'
    text: |-
      Een beleggingsinstelling waaraan op grond van [artikel 6][ref1] een vergunning is verleend en die voornemens is
      haar rechten van deelneming in een andere Lid-Staat te verhandelen, dient, alvorens daartoe over te gaan, Onze
      minister alsmede het bevoegde gezag in die andere Lid-Staat van haar voornemen in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Onze minister verstrekt, op verzoek, aan de beleggingsinstelling waaraan op grond van [artikel 6][ref1] een
      vergunning is verleend en die voldoet aan de in [artikel 12][ref2] bedoelde regels, een verklaring dat zij voldoet
      aan de voorwaarden van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '14.1'
    text: |-
      Onze minister kan vrijstelling verlenen van het in [artikel 4][ref1] vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Aan een vrijstelling als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die
      markten. De beperkingen kunnen uitsluitend worden gesteld ten aanzien van de reikwijdte van de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel14
  - number: '15'
    text: 'Onze minister kan een vergunning slechts intrekken:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
  - number: 15.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
  - number: 15.b
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning zodanig onjuist of onvolledig
      blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
  - number: 15.c
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan, of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
  - number: 15.d
    text: |-
      indien de vergunninghouder of de aan de beleggingsinstelling verbonden bewaarder kennelijk de in [artikel 5][ref1],
      [artikel 6][ref2] of [artikel 9][ref3] bedoelde werkzaamheden niet meer uitvoert;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel9
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
  - number: 15.e
    text: |-
      indien de beleggingsinstelling of de daaraan verbonden bewaarder niet meer voldoet aan de bij of krachtens deze wet
      gestelde eisen, regels of beperkingen of gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
  - number: 15.f
    text: |-
      indien de beleggingsinstelling of de daaraan verbonden bewaarder niet of niet genoegzaam uitvoering heeft
      gegeven aan een aanwijzing of een aanzegging van Onze minister als bedoeld in [artikel 21][ref1] respectievelijk
      [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel22
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '21'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '22'
        hoofdstuk: V
  - number: '16.1'
    text: |-
      Onze minister deelt de intrekking van een op grond van [artikel 6][ref1] verleende vergunning tegelijk mede aan de
      beleggingsinstelling, de bewaarder indien aan de beleggingsinstelling verbonden en het bevoegde gezag in de overige
      Lid-Staten.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Een beleggingsmaatschappij waarvan de vergunning is ingetrokken wordt op verzoek van Onze minister door de
      rechtbank ontbonden.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel16
  - number: '16.3'
    text: |-
      Het vermogen van een beleggingsfonds waarvan de vergunning is ingetrokken moet worden vereffend binnen een door
      Onze minister te bepalen termijn. Hij kan deze termijn verlengen. Hij kan een of meer vereffenaars aanwijzen die
      aan hem verantwoording schuldig zijn.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel16
  - number: '16.4'
    text: |-
      Onze minister kan ten aanzien van het beleggingsfonds waaraan op grond van [artikel 5][ref1] een vergunning is
      verleend ontheffing verlenen van het bepaalde in het derde lid, indien de werkzaamheden van het fonds worden
      voortgezet in een besloten kring. Aan een ontheffing kunnen in het belang van de deelnemers beperkingen worden
      gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De beleggingsinstelling die haar zetel of een beheerder met zetel in een andere Lid-Staat heeft en overigens
      voldoet aan de in [artikel 6, eerste lid, onderdelen ][ref1], gegeven omschrijving, is verplicht aan Onze minister
      mededeling te doen van haar voornemen haar rechten van deelneming in Nederland buiten een besloten kring aan te
      bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.2'
    text: 'Bij de mededeling legt de beleggingsinstelling over:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.2.a
    text: |-
      een verklaring van het bevoegde gezag van de Lid-Staat waar haar zetel of die van haar beheerder is gevestigd, dat
      de instelling voldoet aan de voorwaarden van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.2.b
    text: haar statuten of reglementen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.2.c
    text: haar prospectus;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.2.d
    text: |-
      gegevens over de beoogde wijze van informatieverschaffing, van verhandeling van, uitkeringen op alsmede inkoop van
      of terugbetaling op rechten van deelneming in Nederland;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.2.e
    text: in voorkomend geval haar laatste jaarrekening en halfjaarcijfers.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '17.3'
    text: |-
      Een beleggingsinstelling als bedoeld in het eerste lid moet in ten minste de Nederlandse taal de gegevens en
      bescheiden verschaffen, die zij openbaar dient te maken overeenkomstig de regels gesteld door de Lid-Staat waar
      haar zetel of die van haar beheerder is gevestigd.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '17.4'
    text: |-
      Twee maanden na de mededeling overeenkomstig het bepaalde in het eerste, tweede en derde lid, kan de
      beleggingsinstelling overgaan tot de verhandeling van haar rechten van deelneming, tenzij Onze minister voordien
      heeft bekendgemaakt:
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.4.a
    text: |-
      dat de voornemens als bedoeld in onderdeel *d* van het tweede lid niet in overeenstemming zijn met toepasselijke
      Nederlandse wettelijke bepalingen; of
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: 17.4.b
    text: |-
      dat de beoogde wijze van verhandeling in strijd is met wettelijke voorschriften die betrekking hebben op het niet
      door de richtlijn bestreken gebied.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '17.5'
    text: |-
      [Artikel 10][ref1] is op de in het eerste lid bedoelde beleggingsinstelling van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel10
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.6'
    text: |-
      De beleggingsinstelling als bedoeld in het eerste lid dient, met inachtneming van toepasselijke Nederlandse
      wettelijke bepalingen, de nodige maatregelen te treffen opdat wordt zorggedragen voor de uitkeringen op, de inkoop
      van of terugbetaling op de rechten van deelneming in Nederland alsmede voor de verschaffing van de informatie die
      de beleggingsinstelling in Nederland moet verstrekken.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '17.7'
    text: |-
      Indien een beleggingsinstelling als bedoeld in het eerste lid in strijd handelt met een voorschrift als bedoeld
      in het eerste tot en met het zesde lid, kan Onze minister deze beleggingsinstelling verbieden in Nederland haar
      rechten van deelneming aan te bieden of voorschriften geven met betrekking tot het aanbieden van deze rechten.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '17.8'
    text: |-
      Van een besluit op grond van het zevende lid doet Onze minister onverwijld mededeling aan het bevoegde gezag in de
      Lid-Staat waar de zetel van de beleggingsinstelling of die van haar beheerder is gevestigd alsmede aan het bevoegde
      gezag in de overige Lid-Staten waar, voor zover hem bekend is, de rechten van deelneming worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel17
  - number: '18.1'
    text: 'Onze minister houdt een register, waarin worden ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: 18.1.a
    text: |-
      beleggingsinstellingen waaraan een vergunning is verleend, met inbegrip van de aan de vergunning gestelde
      beperkingen of verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: 18.1.b
    text: |-
      beleggingsinstellingen die op grond van [artikel 17][ref1] tot de verhandeling van hun rechten van deelneming mogen
      overgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: 18.1.c
    text: |-
      beleggingsinstellingen als bedoeld in [artikel 41, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel41
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '41'
        hoofdstuk: IX
  - number: '18.2'
    text: |-
      De inschrijving van een beleggingsinstelling waarvan de vergunning is ingetrokken wordt doorgehaald, evenals
      de inschrijving van de beleggingsinstelling als bedoeld in [artikel 17][ref1] die niet langer in Nederland haar
      rechten van deelneming aanbiedt of waaraan ingevolge [artikel 17, zevende lid][ref2], is verboden in Nederland haar
      deelnemingsrechten aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: '18.3'
    text: |-
      De inschrijving van een beleggingsinstelling, en de aan haar vergunning gestelde beperkingen en verbonden
      voorschriften, alsmede de doorhaling worden binnen twee weken na de dag, waarop zij heeft plaatsgehad, medegedeeld
      in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: '18.4'
    text: |-
      Onze minister kan bepalen dat de in het derde lid bedoelde mededeling van een doorhaling tot een nader door hem
      te bepalen tijdstip wordt aangehouden indien openbaarmaking ernstige schade aan de belangen van de deelnemers zou
      kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: '18.5'
    text: |-
      In de maand januari van elk jaar wordt een lijst van de ingeschreven beleggingsinstellingen naar de stand per 31
      december van het voorafgaande jaar in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: '18.6'
    text: Onze minister houdt een afschrift van het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel18
  - number: '19.1'
    text: |-
      Onze minister kan bij een aanvrager van een vergunning voor een beleggingsinstelling, bij een beleggingsinstelling
      en haar bewaarder, indien aan de beleggingsinstelling verbonden, alsmede bij organisaties waarbij
      beleggingsinstellingen zijn aangesloten waarop wegens die aansluiting een vrijstelling als bedoeld in
      [artikel 14][ref1] van toepassing is, inlichtingen vragen of een onderzoek instellen of doen instellen ten einde
      na te gaan of kan worden voldaan dan wel wordt voldaan aan de bij of krachtens deze wet gestelde eisen, regels,
      beperkingen of gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel14
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
  - number: '19.2'
    text: |-
      Degene aan wie inlichtingen als bedoeld in dit artikel worden gevraagd, is verplicht deze inlichtingen binnen een
      door Onze minister te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel19
  - number: '19.3'
    text: |-
      Degene bij wie een onderzoek wordt ingesteld als bedoeld in dit artikel dient aan de personen die het onderzoek
      verrichten inzage te verlenen in alle zakelijke gegevens en bescheiden die op de beleggingsinstelling of, indien
      van toepassing, op de bewaarder betrekking hebben, en overigens alle medewerking te verlenen die nodig is voor een
      goede uitvoering van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel19
  - number: '19.4'
    text: |-
      Een derde, die de in het derde lid bedoelde zakelijke gegevens en bescheiden onder zich heeft, is verplicht deze op
      vordering van Onze minister over te leggen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel19
  - number: '19.5'
    text: |-
      Inlichtingen omtrent afzonderlijke ondernemingen, instellingen en bewaarders, ingevolge dit artikel verkregen,
      worden niet gepubliceerd en zijn geheim.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel19
  - number: '20'
    text: |-
      [Artikel 19][ref1] is van overeenkomstige toepassing ten aanzien van de beleggingsinstelling als bedoeld in
      [artikel 17][ref2], voor zover het betreft het toezicht op de naleving van het bij en krachtens [artikel 17][ref3]
      bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: '21'
    text: |-
      Indien de beleggingsinstelling waaraan een vergunning is verleend of de bewaarder, indien aan de
      beleggingsinstelling verbonden, niet blijkt te voldoen aan de bij en krachtens deze wet gestelde eisen, regels,
      beperkingen of gegeven voorschriften, kan Onze minister aan de instelling of de bewaarder een aanwijzing geven om
      binnen een door hem te stellen termijn daaraan alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel21
  - number: 21a
    text: |-
      Indien een accountant naar het oordeel van Onze Minister niet of niet meer de nodige waarborgen biedt dat deze
      de toevertrouwde taak met betrekking tot de beleggingsinstelling naar behoren zal vervullen, kan Onze Minister
      bepalen dat hij niet bevoegd is de in deze wet en daaruit voortvloeiende besluiten bedoelde verklaringen omtrent de
      getrouwheid met betrekking tot die beleggingsinstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel21a
  - number: '22.1'
    text: |-
      Indien bijzondere gebeurtenissen een adequate functionering van de beleggingsinstelling of de bewaarder in
      gevaar brengen en naar het oordeel van Onze minister versterking van de organen van de beleggingsinstelling of de
      bewaarder wenselijk maken, kan Onze minister schriftelijk aanzeggen dat vanaf een bepaald tijdstip alle of bepaalde
      organen van de beleggingsinstelling of van de bewaarder hun bevoegdheden slechts mogen uitoefenen na goedkeuring
      door een of meer door Onze minister aangewezen personen en met inachtneming van de opdrachten van deze personen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: '22.2'
    text: 'Met betrekking tot de in het eerste lid bedoelde aanzegging is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: 22.2.a
    text: |-
      de in dat lid bedoelde organen zijn verplicht de door Onze minister aangewezen personen alle medewerking te
      verlenen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: 22.2.b
    text: Onze minister kan de organen toestaan bepaalde handelingen zonder toestemming te verrichten;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: 22.2.c
    text: Onze minister kan de aangewezen personen te allen tijde door andere vervangen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: 22.2.d
    text: |-
      voor schade ten gevolge van handelingen welke zijn verricht in strijd met een aanzegging als bedoeld in het
      eerste lid zijn degenen, die deze handelingen als orgaan van de beleggingsinstelling of van de bewaarder
      verrichten, persoonlijk aansprakelijk tegenover de beleggingsinstelling of de bewaarder. De beleggingsinstelling
      of de bewaarder kan de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist, dat de vereiste
      goedkeuring ontbrak of daarvan niet onkundig kon zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: 22.2.e
    text: |-
      de aanzegging blijft van kracht totdat de in het eerste lid bedoelde omstandigheden niet langer aanwezig zijn, doch
      voor ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel22
  - number: '23'
    text: |-
      Indien een beleggingsinstelling de inkoop van haar rechten van deelneming opschort, stelt zij Onze minister en,
      indien zij een beleggingsinstelling is als bedoeld in [artikel 6, eerste lid][ref1], het bevoegde gezag van de
      Lid-Staten waar de rechten van deelneming van de beleggingsinstelling worden verhandeld onverwijld daarvan op de
      hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie
      als bedoeld in [artikel 26a, eerste lid][ref1], of [artikel 27, eerste lid][ref2], ontvangen, of van gegevens
      of inlichtingen, bij het onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te
      maken of daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt
      geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 26a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: '24.2'
    text: |-
      Het eerste lid en [artikel 19, vijfde lid][ref1], laten, ten aanzien van degene op wie het eerste lid van
      toepassing is, onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref2] die
      betrekking hebben op het als getuige of deskundige in strafzaken afleggen van een verklaring omtrent gegevens of
      inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001903
  - number: '24.3'
    text: |-
      Het eerste lid en [artikel 19, vijfde lid][ref1], laten evenzo, ten aanzien van degene op
      wie het eerste lid van toepassing is, onverlet de toepasselijkheid van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] en van [artikel 66 van de Faillissementswet][ref3] die betrekking
      hebben op het als getuige of als partij in een comparitie van partijen dan wel als deskundige in burgerlijke zaken
      afleggen van een verklaring omtrent gegevens of inlichtingen verkregen bij de vervulling van zijn ingevolge deze
      wet opgedragen taak, voor zover het gaat om gegevens of inlichtingen omtrent een beleggingsinstelling die in staat
      van faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet
      van toepassing op gegevens of inlichtingen die betrekking hebben op ondernemingen of instellingen die betrokken
      zijn of zijn geweest bij een poging de desbetreffende beleggingsinstelling in staat te stellen haar bedrijf voort
      te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001827
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '66'
  - number: '24.4'
    text: |-
      In afwijking van het eerste lid en [artikel 19, vijfde lid][ref1], kan Onze minister met gebruikmaking van gegevens
      of inlichtingen verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, mededelingen doen mits
      deze niet kunnen worden herleid tot afzonderlijke ondernemingen of instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
  - number: '25'
    text: |-
      Met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten,
      kan Onze minister, voor zover nodig in afwijking van [artikel 19, vijfde lid][ref1], en [artikel 24][ref2], ter
      openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 25.a
    text: |-
      zijn weigering om een aangevraagde vergunning te verlenen wanneer deze weigering niet meer in beroep kan worden
      getroffen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel25
  - number: 25.b
    text: |-
      zijn mededeling, als bedoeld in [artikel 17, vierde lid][ref1], wanneer deze mededeling niet meer in beroep kan
      worden getroffen; of


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: 25.c
    text: |-
      het feit dat een beleggingsinstelling die naar zijn oordeel onder het verbod van [artikel 4][ref1] valt, niet over
      een vergunning beschikt dan wel geen mededeling heeft gedaan als bedoeld in [artikel 17, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: '26'
    text: |-
      Onze minister kan, voor zover nodig in afwijking van [artikel 24][ref1], periodiek in de *Staatscourant* mededeling
      doen van de voornaamste gegevens, voortkomende uit de informatieverschaffing als bedoeld in [artikel 12][ref2].
      Zonder schriftelijke toestemming van de beleggingsinstelling die het aangaat, worden gegevens met betrekking tot
      afzonderlijke beleggingsinstellingen niet gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 26a.1
    text: |-
      Onze minister is, in afwijking van [artikel 19, vijfde lid][ref1], en [artikel 24, eerste lid][ref2],
      bevoegd om gegevens of inlichtingen verkregen bij de vervulling van de hem ingevolge deze wet opgedragen
      taak, te verstrekken aan een rechter-commissaris voor zover die belast is met het toezicht uit hoofde van
      [artikel 64 van de Faillissementswet][ref3] op de curator die betrokken is bij het beheer en de vereffening van de
      failliete boedel van een beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel64
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0001860
        artikel: '64'
  - number: 26a.2
    text: 'Onze minister verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26a
  - number: 26a.2.a
    text: |-
      indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26a
  - number: 26a.2.b
    text: |-
      indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van
      Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële
      markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze instanties niet
      instemmen met het verstrekken van de gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26a
  - number: 26a.3
    text: |-
      [Artikel 19, vijfde lid][ref1], en [artikel 24, eerste tot en met derde lid][ref2], zijn van overeenkomstige
      toepassing met betrekking tot de op grond van het eerste lid verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: '27.1'
    text: |-
      Onze Minister is, in afwijking van [artikel 19, vijfde lid][ref1], en [artikel 24][ref2], bevoegd om gegevens
      of inlichtingen verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, te verstrekken
      aan Nederlandse of buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege
      aangewezen instanties die belast zijn met het toezicht op financiële markten of op natuurlijke personen en
      rechtspersonen die op die markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 27.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: '27.2'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die de gegevens of inlichtingen op grond
      van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.2.a
    text: voor zover het beoogde gebruik niet in strijd is met het eerste lid; dan wel
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.2.b
    text: |-
      voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27.2.c
    text: |-
      pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27
  - number: 27a.1
    text: |-
      Onze minister werkt samen met de autoriteiten die ingevolge de [Wet toezicht effectenverkeer 1995][ref1],
      de [Wet toezicht kredietwezen 1992][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3]
      onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref4], belast zijn met het toezicht op
      effecteninstellingen, kredietinstellingen, natura-uitvaartverzekeraars onderscheidenlijk verzekeraars, met het oog
      op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake van bij ministeriële regeling aan te
      wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht ingevolge een van de eerdergenoemde
      wetten betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
      [ref2]: https://wetten.overheid.nl/BWBR0005792
      [ref3]: https://wetten.overheid.nl/BWBR0007477
      [ref4]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007657
      - id: ref2
        bwb_id: BWBR0005792
      - id: ref3
        bwb_id: BWBR0007477
      - id: ref4
        bwb_id: BWBR0006509
  - number: 27a.2
    text: |-
      Onze minister voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de onderwerpen, bedoeld in
      het eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde autoriteiten te sluiten
      overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van regelgeving en beleid,
      en in voorkomende gevallen over uitvoering van toezicht. Indien ingevolge [artikel 29][ref1] taken en bevoegdheden
      die Onze minister op grond van deze wet heeft zijn overgedragen aan een rechtspersoon, draagt deze rechtspersoon
      er zorg voor dat hij of een van de overige in het eerste lid bedoelde autoriteiten een afschrift van de gesloten
      overeenkomsten zendt aan Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 27a.3
    text: |-
      Binnen zes maanden na afloop van elk kalenderjaar draagt Onze minister in samenwerking met de overige in het eerste
      lid bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en waarin melding wordt
      gemaakt van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27a
  - number: 27b.1
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden
      zijn overgedragen werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op
      beleggingsinstellingen die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht kredietwezen 1992][ref2] (*Stb.* 1992, 722), de [Wet toezicht verzekeringsbedrijf 1993][ref3],
      de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref4] onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref5] belast zijn met het toezicht op kredietinstellingen, verzekeraars
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005792
      [ref3]: https://wetten.overheid.nl/BWBR0006509
      [ref4]: https://wetten.overheid.nl/BWBR0007477
      [ref5]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005792
      - id: ref3
        bwb_id: BWBR0006509
      - id: ref4
        bwb_id: BWBR0007477
      - id: ref5
        bwb_id: BWBR0007657
  - number: 27b.2
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden zijn
      overgedragen pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 27b.3
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden zijn
      overgedragen werkt, in de gevallen bedoeld in het eerste lid, waar nodig samen op basis van een of meer daartoe met
      een autoriteit als bedoeld in het eerste lid overeen te komen regelingen. Deze regelingen betreffen in elk geval
      afspraken over het stellen van gemeenschappelijke eisen, het coördineren van werkzaamheden uit hoofde van ieders
      uitoefening van het toezicht en het uitwisselen van gegevens en inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 27b.4
    text: |-
      Onze Minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden zijn
      overgedragen, verstrekt aan een autoriteit als bedoeld in het eerste lid danwel de autoriteit die belast is met
      de uitvoering van de [Wet inzake de geldtransactiekantoren][ref2] de gegevens of inlichtingen die hij verkregen
      heeft bij de vervulling van de hem bij of krachtens deze wet opgedragen taak en die betrekking hebben op de
      deskundigheid en betrouwbaarheid van personen als bedoeld in de algemene maatregel van bestuur tot uitvoering van
      [artikel 5, eerste lid, onder ][ref3], voor zover Onze Minister dan wel de rechtspersoon als bovenbedoeld, van
      oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die
      andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0013816
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0013816
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 27b.5
    text: |-
      De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: 27c.1
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, is Onze Minister bevoegd ten behoeve
      van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met Nederland
      valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat belast is met de
      uitvoering van wettelijke regelingen inzake het toezicht op beleggingsinstellingen, inlichtingen te vragen aan of
      een onderzoek in te stellen of te doen instellen bij een ieder die ingevolge deze wet onder zijn toezicht valt dan
      wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen beschikt die van
      belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27c
  - number: 27c.2
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door Onze Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27c
  - number: 27c.3
    text: |-
      Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, verleent aan de persoon die het
      onderzoek verricht alle medewerking die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      zakelijke gegevens en bescheiden voor zover deze op de uitoefening van zijn beroep of bedrijf betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27c
  - number: 27d.1
    text: |-
      Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in [artikel 27][ref1],
      deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 27b
        hoofdstuk: V
  - number: 27d.2
    text: |-
      De verplichting, omschreven in [het derde lid van artikel 27][ref1], geldt eveneens jegens de in het eerste lid
      bedoelde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 27b
        hoofdstuk: V
  - number: 27d.3
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel27d
  - number: '28'
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29, eerste lid][ref1], taken en bevoegdheden
      zijn overgedragen, is bevoegd de kosten die gemaakt worden voor de uitvoering van die taken en de uitoefening van
      die bevoegdheden aan beleggingsinstellingen in rekening te brengen volgens door Onze minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: '29.1'
    text: |-
      Taken en bevoegdheden die Onze minister op grond van deze wet heeft, kunnen, met uitzondering van de taken en
      bevoegdheden bedoeld in [de artikelen 7, onder c,][ref1][14][ref2], [28][ref3], voor zover het daarbij de door Onze
      Minister te stellen regels betreft, 30, 32, 33b, derde lid, 33c, derde lid en 33m, tweede lid en 33a, bij algemene
      maatregel van bestuur worden overgedragen aan een of meer rechtspersonen die deze als eigen taken uitvoeren en
      als eigen bevoegdheden uitoefenen. De verplichtingen jegens Onze minister op grond van deze wet gelden alsdan als
      verplichtingen jegens de desbetreffende rechtspersoon of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel28
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '28'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      Een overdracht als bedoeld in het eerste lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
  - number: 29.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
  - number: 29.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken en bevoegdheden zoveel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
  - number: '29.3'
    text: |-
      Aan de overdracht als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
  - number: '29.4'
    text: |-
      Indien bij algemene maatregel van bestuur taken en bevoegdheden als bedoeld in het eerste lid zijn overgedragen aan
      De Nederlandsche Bank N.V., is de Bank bevoegd deze taken uit te voeren en deze bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
  - number: '29.5'
    text: |-
      Voor de totstandkoming, wijziging of intrekking van algemene maatregelen van bestuur als bedoeld in
      [artikel 5, eerste lid][ref1], [artikel 6, vijfde lid][ref2], en [artikel 12, eerste en tweede lid][ref3],
      een aanwijzing als bedoeld in [artikel 7, onder c][ref4], een vrijstelling als bedoeld in
      [artikel 14, eerste lid][ref5], de door Onze minister te stellen regels als bedoeld in [artikel 28][ref6] en een
      maatregel als bedoeld in [artikel 30][ref7], kan het advies van de in het eerste lid bedoelde rechtspersoon of
      rechtspersonen worden ingewonnen. De rechtspersoon aan wie advies wordt gevraagd is verplicht dit advies uit te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel28
      [ref7]: https://wetten.overheid.nl/BWBR0004809#Artikel30
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004809
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004809
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0004809
        artikel: '28'
        hoofdstuk: V
      - id: ref7
        bwb_id: BWBR0004809
        artikel: '30'
        hoofdstuk: VI
  - number: '29.6'
    text: |-
      Een in het eerste lid bedoelde rechtspersoon brengt eenmaal per jaar, uiterlijk op 1 mei, aan Onze minister
      verslag uit over de uitoefening van de overgedragen taken en bevoegdheden op grond van deze wet. Dit verslag
      wordt door de zorg van Onze minister gepubliceerd, behoudens het gedeelte handelende over de uitvoering van
      [artikel 5, derde lid][ref1], [artikel 6, zevende lid][ref2], [artikel 12, derde lid][ref3], [artikel 21][ref4] en
      [artikel 22][ref5], met dien verstande dat, zonder schriftelijke toestemming van de bij het te publiceren gedeelte
      van het verslag betrokkenen, gegevens met betrekking tot afzonderlijke beleggingsinstellingen en bewaarders niet
      gepubliceerd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel22
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0004809
        artikel: '21'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0004809
        artikel: '22'
        hoofdstuk: V
  - number: '30'
    text: |-
      Onze minister kan bepalen dat een vergunning op grond van deze wet wordt geweigerd of ingetrokken, of dat aan de
      vergunning beperkingen worden gesteld en voorschriften worden verbonden, dan wel dat de eerder gestelde beperkingen
      en gegeven voorschriften worden gewijzigd, indien:
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel30
  - number: 30.a
    text: |-
      de beleggingsinstelling haar zetel heeft of haar beheerder zijn zetel heeft in een Staat, niet zijnde een Lid-
      Staat, waar Nederlandse financiële instellingen niet worden toegelaten of aan onredelijke beperkingen worden
      onderworpen; of
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel30
  - number: 30.b
    text: |-
      een natuurlijke persoon of rechtspersoon met de nationaliteit van een onder *a* bedoelde Staat rechtstreeks of
      middellijk overwegende zeggenschap kan uitoefenen in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel30
  - number: '31'
    text: |-
      Onze minister kan ten aanzien van de beleggingsinstelling die onder de omschrijving in
      [artikel 6, eerste lid, onderdelen ][ref1], valt en die niet in een Lid-Staat is gevestigd dan wel in een Lid-
      Staat is gevestigd die nog geen uitvoering aan de richtlijn heeft gegeven, het bepaalde bij of krachtens
      [artikel 6, derde tot en met zevende lid][ref2], alsmede [artikel 12, tweede lid][ref3], van overeenkomstige
      toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '32'
    text: |-
      Onze minister kan een organisatie van beleggingsinstellingen of bewaarders, de rechtspersoon of rechtspersonen als
      bedoeld in [artikel 29, eerste lid][ref1], gehoord, aanwijzen als representatieve organisatie met betrekking tot de
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: '33.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '33.2'
    text: |-
      Ingeval beroep wordt ingesteld tegen een besluit als bedoeld in [artikel 33a, eerste lid][ref1], zal de
      terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt alsdan niet in het openbaar uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33a
        hoofdstuk: VIIA
  - number: 33a.1
    text: |-
      Onze minister is bevoegd aan een rechtspersoon waaraan ingevolge [artikel 29, eerste lid][ref1], taken en
      bevoegdheden zijn overgedragen de gegevens of inlichtingen te vragen die naar zijn oordeel nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de rechtspersoon deze wet uitvoert of heeft
      uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 33a.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, is verplicht aan Onze minister de in het eerste lid bedoelde gegevens
      of inlichtingen te verstrekken. Indien Onze minister de rechtspersoon vraagt bepaalde gegevens of inlichtingen
      te verstrekken die onder [de artikelen 19, vijfde lid][ref1], of [24][ref2], vallen, is de rechtspersoon niet
      verplicht deze gegevens of inlichtingen te verstrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33a.2.a
    text: |-
      deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke beleggingsinstelling waaraan een vergunning als bedoeld in [artikel 4][ref1] is verleend of waarvan
      die vergunning is ingetrokken of vervallen, en waaraan surséance van betaling is verleend of die in staat van
      faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33a.2.b
    text: |-
      deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      beleggingsinstelling in staat te stellen haar bedrijf voort te zetten; of
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
  - number: 33a.2.c
    text: |-
      deze zijn ontvangen van een instantie als bedoeld in [artikel 27, eerste lid][ref1], tenzij de uitdrukkelijke
      instemming is verkregen van die instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: 33a.3
    text: |-
      Onze minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
  - number: 33a.4
    text: |-
      Onze minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen uitsluitend
      gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de rechtspersoon,
      bedoeld in het eerste lid, deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
  - number: 33a.5
    text: |-
      Onze minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van
      het tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. De artikelen 19, vijfde lid, en 24 zijn van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
  - number: 33a.6
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
  - number: 33a.7
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze minister of de in zijn opdracht
      werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: 33b.1
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften gesteld, bij
      of krachtens [de artikelen 4, eerste lid][ref1], [5, eerste lid][ref2], [6, vijfde lid, tweede volzin][ref3],
      [8][ref4], [10][ref5], [11, eerste lid][ref6], [12, eerste en tweede lid][ref7], [14, tweede lid][ref8],
      [16, derde en vierde lid][ref9], [17][ref10], eerste tot en met derde en vijfde tot en met zevende lid, 19, tweede
      tot en met vierde lid, 20, 21, 22, tweede lid, 23, 27b, tweede en derde lid, en 27c, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref9]: https://wetten.overheid.nl/BWBR0004809#Artikel16
      [ref10]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0004809
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0004809
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0004809
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0004809
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref9
        bwb_id: BWBR0004809
        artikel: '16'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref10
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: 33b.2
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 33b.3
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2002-07-19#Artikel33b
  - number: 33c.1
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften gesteld, bij of
      krachtens [de artikelen 4, eerste lid][ref1], [5, eerste lid][ref2], [6, vijfde lid, tweede volzin][ref3],
      [8][ref4], [10][ref5], [11, eerste lid][ref6], [12, eerste, tweede, vierde en vijfde lid][ref7],
      [13, eerste lid][ref8], [14, tweede lid][ref9], [16, derde en vierde lid][ref10], [17][ref11], eerste tot en
      met derde en vijfde tot en met zevende lid, [19, tweede tot en met vierde lid][ref12], [20][ref13], [21][ref14],
      [22, tweede lid][ref15], [23][ref16], [27b, tweede en derde lid][ref17], en [27c, tweede lid][ref18].


