    text: degene die deel uitmaakt van een groep waartoe een beleggingsinstelling behoort;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
  - number: 19.1.h
    text: |-
      een onderneming of instelling waarvan redelijkerwijs kan worden vermoed dat deze handelt in strijd met de bij of
      krachtens deze wet gestelde regels,
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
  - number: '19.2'
    text: |-
      Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door Onze
      Minister te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
  - number: '19.3'
    text: |-
      Ten aanzien van de personen die door Onze Minister zijn belast met het inwinnen van inlichtingen of met de
      uitoefening van andere taken en bevoegdheden die Onze Minister heeft op grond van het bij of krachtens deze
      wet bepaalde, zijn de [artikelen 5:12][ref1], [5:13][ref2],[ 5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing, met dien verstande dat indien een
      onderzoek als bedoeld in [artikel 27b][ref7], eerste lid, wordt ingesteld, degene bij wie het onderzoek wordt
      ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in
      zakelijke gegevens en bescheiden.


