        hoofdstuk: IIIa
  - number: '21.1'
    text: |-
      Indien Onze Minister vaststelt dat een beheerder, een beleggingsinstelling of een beheerder als bedoeld in
      [artikel 17a][ref1] in strijd handelt met deze wet, deelt hij dat mee aan de beheerder, de beleggingsinstelling
      en, indien van toepassing, het bevoegde gezag van de lidstaat van herkomst van de beheerder bedoeld in
      [artikel 17a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
  - number: '21.2'
    text: |-
      Zo nodig doet Onze Minister de mededeling, bedoeld in het eerste lid, vergezeld gaan van dan wel volgen door een
      aanwijzing om ten aanzien van met name aan te geven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.3'
    text: |-
      De beheerder en de beleggingsinstelling volgen de in het tweede lid bedoelde aanwijzing op binnen een door Onze
      Minister te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.4'
    text: |-
      Indien Onze Minister niet binnen de in het derde lid bepaalde termijn een bevredigend antwoord van de beheerder of
      de beleggingsinstelling heeft ontvangen, of indien naar zijn oordeel niet of onvoldoende aan zijn aanwijzing gevolg
      is gegeven, kan Onze Minister, indien hij dit met het oog op een adequate functionering van de financiële markten
      of de positie van de beleggers op die markten noodzakelijk acht:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.4.a
    text: |-
      de beheerder of de beleggingsinstelling schriftelijk aanzeggen dat vanaf een bepaald tijdstip alle of bepaalde
      organen van de beheerder of de beleggingsinstelling hun bevoegdheden slechts mogen uitoefenen na goedkeuring door
      een of meer door Onze Minister aangewezen personen en met inachtneming van de opdrachten van deze personen, welke
      aanzegging terstond van kracht wordt;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.4.b
    text: |-
      de beheerder of de beleggingsinstelling schriftelijk aanzeggen, dat Onze Minister zal overgaan tot openbaarmaking
      van de aanwijzing, bedoeld in het tweede lid, bij welke publicatie, wanneer de beheerder of de beleggingsinstelling
      dit verlangt, tevens de correspondentie openbaar wordt gemaakt, die naar aanleiding van de aanwijzing tussen Onze
      Minister en de beheerder of de beleggingsinstelling is gevoerd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.4.c
    text: |-
      de beheerder of de beleggingsinstelling schriftelijk aanzeggen, dat Onze Minister zal overgaan tot openbaarmaking
      van de uitvoering van onderdeel a.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.5'
    text: |-
      Indien Onze Minister van oordeel is dat ten aanzien van de beheerder of de beleggingsinstelling onverwijld
      maatregelen noodzakelijk zijn, kan hij zonder toepassing van de eerste twee leden onmiddellijk uitvoering geven aan
      onderdeel a van het vierde lid, nadat hij de beheerder of de beleggingsinstelling in de gelegenheid heeft gesteld
      hun zienswijze over de onmiddellijke uitvoering te geven.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.6'
    text: 'Met betrekking tot een aanzegging als bedoeld in het vierde lid, onder a, is het volgende van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.6.a
    text: |-
      de organen van de beheerder of de beleggingsinstelling verlenen de door Onze Minister aangewezen personen alle
      medewerking;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.6.b
    text: Onze Minister kan de organen toestaan bepaalde handelingen zonder toestemming te verrichten;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.6.c
    text: Onze Minister kan de aangewezen personen te allen tijde door anderen vervangen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.6.d
    text: |-
      voor schade ten gevolge van handelingen welke zijn verricht in strijd met een aanzegging als bedoeld in het vierde
      lid, onder a, zijn degenen, die deze handelingen als orgaan van de beheerder of de beleggingsinstelling hebben
      verricht persoonlijk aansprakelijk tegenover de beheerder of de beleggingsinstelling, en kunnen de beheerder of
      de beleggingsinstelling de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist, dat de vereiste
      goedkeuring ontbrak of daarvan niet onkundig kon zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21.6.e
    text: |-
      de aanzegging blijft van kracht totdat de in het eerste lid bedoelde omstandigheden niet langer aanwezig zijn, doch
      voor ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.7'
    text: |-
      Onze Minister stelt het bevoegde gezag van de lidstaat van herkomst van de beheerder en de Europese Commissie zo
      spoedig mogelijk in kennis van de genomen maatregelen, bedoeld in het vierde en zesde lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.8'
    text: |-
      Het besluit tot publicatie van een aanwijzing als bedoeld in het vierde lid, onder b, wordt eerst van kracht,
      wanneer het onherroepelijk is geworden. Indien de beheerder of de beleggingsinstelling na de publicatie alsnog
      voldoet aan de aanwijzing dan wel indien Onze Minister de aanwijzing intrekt, zal Onze Minister hiervan op dezelfde
      wijze als bij de voorafgaande publicatie kennis geven.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: '21.9'
    text: Dit artikel is van overeenkomstige toepassing ten aanzien van een bewaarder.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21
  - number: 21a
    text: |-
      Indien een accountant naar het oordeel van Onze Minister niet of niet meer de nodige waarborgen biedt dat deze
      de toevertrouwde taak met betrekking tot de beleggingsinstelling naar behoren zal vervullen, kan Onze Minister
      bepalen dat hij niet bevoegd is de in deze wet en daaruit voortvloeiende besluiten bedoelde verklaringen omtrent de
      getrouwheid met betrekking tot die beleggingsinstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel21a
  - number: '22'
    text: |-
      Indien het bevoegde gezag van de lidstaat van ontvangst van een beheerder als bedoeld in [artikel 6][ref1] Onze
      Minister ervan in kennis stelt dat de aldaar gestelde wettelijke voorschriften niet worden nageleefd, en dat de
      beheerder, na daarop te zijn gewezen, hieraan geen einde maakt, treft Onze Minister de noodzakelijke maatregelen
      om de niet-naleving te beëindigen. Van deze maatregelen wordt het bevoegde gezag van de lidstaat van ontvangst in
      kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 22a.1
    text: |-
      Indien tot de personen, die middellijk of onmiddellijk bevoegd zijn bestuurders van een beheerder,
      beleggingsinstelling of de bewaarder, indien aan de instelling verbonden, te benoemen of te ontslaan, iemand
      behoort, die niet voldoet aan de op grond van [artikel 12, tweede lid][ref1], gestelde regels met betrekking tot
      zijn betrouwbaarheid, kan Onze Minister die personen de aanwijzing geven dat degene, wiens betrouwbaarheid niet aan
      deze regels voldoet, deze bevoegdheid niet meer mag uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 22a.2
    text: De personen tot wie de aanwijzing is gericht, volgen deze binnen een door Onze Minister te stellen termijn op.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel22a
  - number: 22a.3
    text: |-
      De personen tot wie de aanwijzing is gericht, informeren Onze Minister binnen de gestelde termijn over de
      maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel22a
  - number: 22a.4
    text: |-
      De beheerder, de beleggingsinstelling of de bewaarder geeft geen gevolg aan algemene of bijzondere instructies van
      degene, op wie een aanwijzing van Onze Minister als bedoeld in het eerste lid betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel22a
  - number: '23'
    text: |-
      Indien een beheerder de inkoop van rechten van deelneming in een door hem beheerde beleggingsinstelling opschort,
      stelt hij Onze Minister en, indien het een beheerder betreft als bedoeld in [artikel 6, eerste lid][ref1], tevens
      het bevoegde gezag van elke lidstaat waar de rechten van deelneming van de beleggingsinstelling worden verhandeld,
      onverwijld daarvan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '24.1'
    text: |-
      Gegevens en inlichtingen die ingevolge het bij of krachtens deze wet bepaalde omtrent afzonderlijke ondernemingen,
      instellingen en bewaarders zijn verstrekt of zijn verkregen en gegevens en inlichtingen die van een instantie
      als bedoeld in de [artikelen 26a, eerste lid][ref1], of [27, eerste lid][ref2], zijn ontvangen, worden niet
      gepubliceerd en zijn geheim.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 26a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: '24.2'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of van een instantie
      als bedoeld in [artikelen 26a, eerste lid][ref1], of [27, eerste lid][ref2], ontvangen, of van gegevens of
      inlichtingen, bij het onderzoek van zakelijke gegevens en bescheiden verkregen, verder of anders gebruik te maken
      of daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze wet wordt
      geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 26a
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: '24.3'
    text: |-
      Het eerste en tweede lid laten, ten aanzien van degene op wie het tweede lid van toepassing is, onverlet de
      toepasselijkheid van de bepalingen van het [Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '24.4'
    text: |-
      Het eerste en tweede lid laten evenzo, ten aanzien van degene op wie het tweede lid van toepassing is,
      onverlet de toepasselijkheid van de bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] en
      van [artikel 66 van de Faillissementswet][ref2] die betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voor zover het gaat om
      gegevens of inlichtingen omtrent een beleggingsinstelling die in staat van faillissement is verklaard of op grond
      van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing op gegevens of inlichtingen
      die betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging de
      desbetreffende beleggingsinstelling in staat te stellen haar bedrijf voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel66
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '66'
  - number: '24.5'
    text: |-
      In afwijking van het eerste en tweede lid kan Onze Minister met gebruikmaking van gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, mededelingen doen mits deze niet kunnen
      worden herleid tot afzonderlijke ondernemingen of instellingen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel24
  - number: '26'
    text: |-
      Onze Minister kan, voor zover nodig in afwijking van [artikel 24][ref1], periodiek in de *Staatscourant* mededeling
      doen van de voornaamste gegevens, voortkomende uit de informatieverschaffing als bedoeld in [artikel 12][ref2].
      Zonder schriftelijke toestemming van de beheerder die het aangaat, worden gegevens met betrekking tot de beheerder
      en de door hem beheerde beleggingsinstellingen niet openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 26a.1
    text: |-
      Onze Minister is, in afwijking van [artikel 24, eerste en tweede lid][ref1], bevoegd om gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, te verstrekken aan een rechter-
      commissaris voor zover die belast is met het toezicht uit hoofde van [artikel 64 van de Faillissementswet][ref2]
      op de curator die betrokken is bij het beheer en de vereffening van de failliete boedel van een beheerder,
      beleggingsinstelling of bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel64
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '64'
  - number: 26a.2
    text: 'Onze Minister verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26a
  - number: 26a.2.a
    text: |-
      indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26a
  - number: 26a.2.b
    text: |-
      indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan wel van
      Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht op financiële
      markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze instanties niet
      instemmen met het verstrekken van de gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26a
  - number: 26a.3
    text: |-
      [Artikel 24, eerste tot en met vierde lid][ref1], zijn van overeenkomstige toepassing met betrekking tot de op
      grond van het eerste lid verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: '27.1'
    text: |-
      Onze Minister is, in afwijking van [artikel 24, eerste en tweede lid][ref1], bevoegd om gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, te verstrekken aan Nederlandse of
      buitenlandse overheidsinstanties dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties
      die belast zijn met het toezicht op financiële markten of op natuurlijke personen en rechtspersonen die op die
      markten werkzaam zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 27.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: '27.2'
    text: |-
      Voor zover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een buitenlandse
      overheidsinstantie dan wel van een buitenlandse van overheidswege aangewezen instantie, die is belast met het
      toezicht op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn,
      verstrekt Onze Minister deze niet aan een Nederlandse of buitenlandse instantie als bedoeld in het eerste lid,
      tenzij de buitenlandse instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk heeft ingestemd
      met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het gebruik voor een
      ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: '27.3'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die de gegevens of inlichtingen op grond
      van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.3.a
    text: voor zover het beoogde gebruik niet in strijd is met het eerste of tweede lid; dan wel
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.3.b
    text: |-
      voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27.3.c
    text: |-
      pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27
  - number: 27a.1
    text: |-
      Onze Minister werkt samen met de autoriteiten die ingevolge de [Wet toezicht effectenverkeer 1995][ref1],
      de [Wet toezicht kredietwezen 1992][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3]
      onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref4], belast zijn met het toezicht op
      effecteninstellingen, kredietinstellingen, natura-uitvaartverzekeraars onderscheidenlijk verzekeraars, met het oog
      op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake van bij ministeriële regeling aan te
      wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht ingevolge een van de eerdergenoemde
      wetten betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
      [ref2]: https://wetten.overheid.nl/BWBR0005792
      [ref3]: https://wetten.overheid.nl/BWBR0007477
      [ref4]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007657
      - id: ref2
        bwb_id: BWBR0005792
      - id: ref3
        bwb_id: BWBR0007477
      - id: ref4
        bwb_id: BWBR0006509
  - number: 27a.2
    text: |-
      Onze Minister voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de onderwerpen, bedoeld in
      het eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde autoriteiten te sluiten
      overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van regelgeving en beleid,
      en in voorkomende gevallen over uitvoering van toezicht. Indien ingevolge [artikel 29][ref1] taken en bevoegdheden
      die Onze Minister op grond van deze wet heeft zijn overgedragen aan een rechtspersoon, draagt deze rechtspersoon
      er zorg voor dat hij of een van de overige in het eerste lid bedoelde autoriteiten een afschrift van de gesloten
      overeenkomsten zendt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 27a.3
    text: |-
      Binnen zes maanden na afloop van elk kalenderjaar draagt Onze Minister in samenwerking met de overige in het eerste
      lid bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en waarin melding wordt
      gemaakt van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27a
  - number: 27b.1
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden
      zijn overgedragen werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op
      beleggingsinstellingen die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht kredietwezen 1992][ref2] (*Stb.* 1992, 722), de [Wet toezicht verzekeringsbedrijf 1993][ref3],
      de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref4] onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref5] belast zijn met het toezicht op kredietinstellingen, verzekeraars
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0005792
      [ref3]: https://wetten.overheid.nl/BWBR0006509
      [ref4]: https://wetten.overheid.nl/BWBR0007477
      [ref5]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005792
      - id: ref3
        bwb_id: BWBR0006509
      - id: ref4
        bwb_id: BWBR0007477
      - id: ref5
        bwb_id: BWBR0007657
  - number: 27b.2
    text: |-
      Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden zijn
      overgedragen pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 27b.4
    text: |-
      Onze Minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden zijn
      overgedragen, verstrekt aan een autoriteit als bedoeld in het eerste lid danwel de autoriteit die belast is met de
      uitvoering van de [Wet inzake de geldtransactiekantoren][ref2] of de [Wet toezicht trustkantoren][ref3] de gegevens
      of inlichtingen die hij verkregen heeft bij de vervulling van de hem bij of krachtens deze wet opgedragen taak en
      die betrekking hebben op de deskundigheid en betrouwbaarheid van personen als bedoeld in de algemene maatregel van
      bestuur tot uitvoering van [artikel 5, eerste lid, onder ][ref4], voor zover Onze Minister dan wel de rechtspersoon
      als bovenbedoeld, van oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het
      toezicht dat door die andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0013816
      [ref3]: https://wetten.overheid.nl/BWBR0016189
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0013816
      - id: ref3
        bwb_id: BWBR0016189
      - id: ref4
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 27b.5
    text: |-
      De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 27, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: 27c.1
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, is Onze Minister bevoegd ten behoeve
      van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met Nederland
      valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat belast is met de
      uitvoering van wettelijke regelingen inzake het toezicht op beleggingsinstellingen, inlichtingen te vragen aan of
      een onderzoek in te stellen of te doen instellen bij een ieder die ingevolge deze wet onder zijn toezicht valt dan
      wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen beschikt die van
      belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27c
  - number: 27c.2
    text: |-
      Degene bij wie een onderzoek als bedoeld in [artikel 27b, eerste lid][ref1], wordt ingesteld, verleent aan de in
      het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27c
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 27b
        hoofdstuk: V
  - number: 27c.3
    text: |-
      Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, verleent aan de persoon die het
      onderzoek verricht alle medewerking die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      zakelijke gegevens en bescheiden voor zover deze op de uitoefening van zijn beroep of bedrijf betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27c
  - number: 27d.1
    text: |-
      Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in [artikel 27][ref1],
      deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 27b
        hoofdstuk: V
  - number: 27d.2
    text: |-
      De verplichting, omschreven in [het derde lid van artikel 27][ref1], geldt eveneens jegens de in het eerste lid
      bedoelde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27d
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 27b
        hoofdstuk: V
  - number: 27d.3
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27d
  - number: 27e
    text: |-
      Onze Minister werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op beheerders die
      in meerdere lidstaten bijkantoren hebben gevestigd of hun diensten aanbieden, samen met het bevoegde gezag van de
      betrokken lidstaten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel27e
  - number: '28'
    text: |-
      Onze Minister dan wel een rechtspersoon aan wie ingevolge [artikel 29, eerste lid][ref1], taken en bevoegdheden
      zijn overgedragen, is bevoegd de kosten die gemaakt worden voor de uitvoering van die taken en de uitoefening van
      die bevoegdheden aan beheerders in rekening te brengen volgens door Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: '29.1'
    text: |-
      Taken en bevoegdheden die Onze Minister op grond van deze wet heeft, kunnen, met uitzondering van de taken en
      bevoegdheden bedoeld in de [artikelen 7, onder c,][ref1][14][ref2], [17c, eerste lid][ref3], [28][ref4], voor
      zover het daarbij de door Onze Minister te stellen regels betreft, [30][ref5], [32][ref6], [33b, derde lid][ref7],
      [33c, derde lid][ref8], en [33m, tweede lid][ref9] en [33a][ref10], bij algemene maatregel van bestuur worden
      overgedragen aan een of meer rechtspersonen die deze als eigen taken uitvoeren en als eigen bevoegdheden
      uitoefenen. De verplichtingen jegens Onze Minister op grond van deze wet gelden alsdan als verplichtingen jegens de
      desbetreffende rechtspersoon of rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0004809#Artikel33b
      [ref8]: https://wetten.overheid.nl/BWBR0004809#Artikel33c
      [ref9]: https://wetten.overheid.nl/BWBR0004809#Artikel33m
      [ref10]: https://wetten.overheid.nl/BWBR0004809#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
