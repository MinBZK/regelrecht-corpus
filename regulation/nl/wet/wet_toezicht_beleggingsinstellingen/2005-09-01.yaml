  - number: 33c.2
    text: |-
      De bestuurlijke boete komt toe aan de staat. Voor zover Onze Minister met toepassing van
      [artikel 29, eerste lid][ref1], de bevoegdheid tot het opleggen van een bestuurlijke boete overdraagt aan een
      rechtspersoon, komt de boete toe aan die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33c
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 33c.3
    text: |-
      Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33c
  - number: 33d.1
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de
      boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt. Voor overtreding van voorschriften,
      gesteld bij of krachtens een algemene maatregel van bestuur op grond van de [artikelen 5, eerste lid][ref1],
      [6, vijfde en zesde lid, tweede volzin][ref2], of [12, eerste, tweede, derde en zevende lid][ref3], wordt het
      bedrag van de boete bepaald op de wijze als voorzien in de bijlage behorend bij die algemene maatregel van bestuur,
      met dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33d
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 33d.2
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33d
  - number: 33d.3
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33d
  - number: 33d.4
    text: |-
      Onze Minister kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33d
  - number: 33e
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33e
  - number: 33f.1
    text: |-
      Indien Onze Minister voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder vermelding
      van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33f
  - number: 33f.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt Onze Minister de betrokkene in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 33d][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel33d
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33f
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 33d
        hoofdstuk: VII_B
  - number: 33g.1
    text: Onze Minister legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33g
  - number: 33g.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33g
  - number: 33g.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33g
  - number: 33g.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33g
  - number: 33g.2.c
    text: |-
      de termijn, bedoeld in [artikel 33i, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33i
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33g
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33i
        hoofdstuk: VII_B
  - number: 33h.1
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33h
  - number: 33h.2
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 33f, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33f
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33h
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33f
        hoofdstuk: VII_B
  - number: 33i.1
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33i.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 33f, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33f
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33f
        hoofdstuk: VII_B
  - number: 33i.3
    text: |-
      Indien de boete niet tijdig is betaald, stuurt Onze Minister schriftelijk een aanmaning om binnen twee weken
      de boete, verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de
      boete, voor zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het vierde lid zal worden
      ingevorderd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33i.4
    text: |-
      Bij gebreke van tijdige betaling kan Onze Minister de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33i.5
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 33i.6
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon die de boete heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33i.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33i.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33i
  - number: 33j.1
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33j
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 33j.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 33c][ref1] vervalt, indien
      Onze Minister ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33c
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33j
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33c
        hoofdstuk: VII_B
  - number: 33k.1
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33k
  - number: 33k.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33k
  - number: 33l
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33l
  - number: 33m.1
    text: |-
      Met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, kan
      Onze Minister, onverminderd [artikel 19, vijfde lid][ref1], en [artikel 24][ref2], het feit ter zake waarvan de
      last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en
      de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33m
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33m.2
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33m
  - number: 33n
    text: |-
      Onze Minister kan, in afwijking van [artikel 24][ref1], teneinde de naleving van deze wet te bevorderen ter
      openbare kennis brengen:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33n
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33n.a
    text: |-
      het feit dat aan een beleggingsinstelling waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 4, eerste lid][ref1], van toepassing is, een aangevraagde vergunning of ontheffing is geweigerd, wanneer
      deze weigering niet meer in beroep kan worden getroffen en de aanvrager handelt als was hem een vergunning of
      ontheffing verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33n
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33n.b
    text: |-
      het feit dat een beleggingsinstelling waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 4, eerste lid][ref1], van toepassing is, niet over een vergunning beschikt dan wel geen mededeling heeft
      gedaan als bedoeld in [artikel 17, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33n
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: 33n.c
    text: |-
      het feit dat degene op wie een vrijstelling als bedoeld in [artikel 14][ref1] van toepassing is, zich niet houdt
      aan de voorschriften die aan die vrijstelling zijn verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel14
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33n
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '14'
        hoofdstuk: II
        paragraaf: '4'
  - number: 33n.d
    text: |-
      zijn bekendmaking, bedoeld in [artikel 17, vierde lid][ref1], wanneer deze bekendmaking niet meer in beroep kan
      worden getroffen en de beleggingsinstelling haar rechten van deelneming in Nederland ondanks deze bekendmaking in
      stijd met het verbod van [artikel 4][ref2] heeft aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33n
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33o
    text: |-
      Degene jegens wie door Onze Minister een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat Onze Minister zijn handelen of nalaten op grond van [artikel 33n][ref1] ter openbare kennis zal
      brengen, is niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld
      alvorens hem mondeling om informatie wordt gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33o
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33p.1
    text: |-
      Onze Minister geeft, indien hij voornemens is op grond van [artikel 33n][ref1] een feit ter openbare kennis te
      brengen, de betrokkene daarvan kennis onder vermelding van de gronden waarop het voornemen berust.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33p
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33p.2
    text: |-
      In aanvulling op [artikel 4:8 van de Algemene wet bestuursrecht][ref1] is Onze Minister niet gehouden de betrokkene
      in de gelegenheid te stellen om zijn zienswijze naar voren te brengen, indien van de betrokkene geen adres bekend
      is en het adres ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33p
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 33q
    text: |-
      De beschikking om op grond van [artikel 33n][ref1] een feit ter openbare kennis te brengen vermeldt in ieder geval:
        - het feit dat ter openbare kennis wordt gebracht;
        - de wijze waarop het feit ter openbare kennis wordt gebracht; en
        - de termijn waarna het feit ter openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33q
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33r
    text: |-
      Tenzij de bevordering van de naleving van deze wet geen uitstel toelaat, wordt de werking van de beschikking om
      op grond van [artikel 33n][ref1] een feit ter openbare kennis te brengen opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33r
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33s
    text: |-
      In afwijking van [artikel 3:40 van de Algemene wet bestuursrecht][ref1] treedt de beschikking in werking op de dag
      waarop het feit ter openbare kennis is gebracht zonder dat de werking voor de duur van de beroepstermijn of, indien
      beroep is ingesteld, van het beroep wordt opgeschort, indien van de betrokkene geen adres bekend is en het adres
      ook niet met een redelijke inspanning kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33s
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 33t.1
    text: |-
      De bevoegdheid om op grond van [artikel 33n][ref1] een feit ter openbare kennis te brengen vervalt indien ter zake
      van het feit een strafvervolging is ingesteld en het onderzoek ter terechtzitting een aanvang heeft genomen, dan
      wel het recht tot strafvordering is vervallen ingevolge [artikel 74 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33t
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 33t.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een feit als bedoeld in [artikel 33n][ref1] vervalt, indien Onze
      Minister het feit reeds ter openbare kennis heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33t
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33u.1
    text: |-
      De bevoegdheid om op grond van [artikel 33n][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na de
      dag waarop het feit heeft plaats gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33u
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33u.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33u
  - number: 33v
    text: |-
      De werkzaamheden in verband met het op grond van artikel 33n ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33v
  - number: '42'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel42
  - number: '43'
    text: 'Deze wet kan worden aangehaald als: Wet toezicht beleggingsinstellingen.'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel43
