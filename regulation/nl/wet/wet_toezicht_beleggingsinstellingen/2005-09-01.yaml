        artikel: 17c
        hoofdstuk: IIIa
  - number: '18.3'
    text: |-
      Van de inschrijving dan wel de doorhaling van een inschrijving van een beheerder of beleggingsinstelling in het
      register wordt binnen twee weken na de dag, waarop zij heeft plaatsgehad, mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: '18.4'
    text: |-
      Onze Minister kan bepalen dat de in het derde lid bedoelde mededeling van een doorhaling tot een ander door hem
      te bepalen tijdstip wordt aangehouden indien openbaarmaking ernstige schade aan de belangen van de deelnemers zou
      kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: '18.5'
    text: Onze Minister houdt een afschrift van het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: '19.1'
    text: 'Onze Minister kan bij:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
  - number: 19.1.a
    text: een aanvrager van een vergunning;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
  - number: 19.1.b
    text: |-
      een aanvrager van een ontheffing als bedoeld in [artikel 14a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel19
