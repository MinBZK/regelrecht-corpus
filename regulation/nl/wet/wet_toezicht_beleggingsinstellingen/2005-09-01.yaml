  - number: '29.2'
    text: |-
      Een overdracht als bedoeld in het eerste lid vindt slechts plaats indien de betrokken rechtspersoon aan de volgende
      eisen voldoet:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
  - number: 29.2.a
    text: hij dient in staat te zijn de in het eerste lid bedoelde taken en bevoegdheden naar behoren te vervullen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
  - number: 29.2.b
    text: |-
      de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken en bevoegdheden zoveel mogelijk is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
  - number: '29.3'
    text: |-
      Aan de overdracht als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
  - number: '29.4'
    text: |-
      Indien bij algemene maatregel van bestuur taken en bevoegdheden als bedoeld in het eerste lid zijn overgedragen aan
      De Nederlandsche Bank N.V., is de Bank bevoegd deze taken uit te voeren en deze bevoegdheden uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
  - number: '29.5'
    text: |-
      Voor de totstandkoming, wijziging of intrekking van algemene maatregelen van bestuur als bedoeld in
      [artikel 5, eerste lid][ref1], [artikel 6, vijfde lid][ref2], en [artikel 12, eerste en tweede lid][ref3],
      een aanwijzing als bedoeld in [artikel 7, onder c][ref4], een vrijstelling als bedoeld in
      [artikel 14, eerste lid][ref5], de door Onze Minister te stellen regels als bedoeld in [artikel 28][ref6] en een
      maatregel als bedoeld in [artikel 30][ref7], kan het advies van de in het eerste lid bedoelde rechtspersoon of
      rechtspersonen worden ingewonnen. De rechtspersoon aan wie advies wordt gevraagd is verplicht dit advies uit te
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel28
      [ref7]: https://wetten.overheid.nl/BWBR0004809#Artikel30
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
    references:
