  - number: 33b.3
    text: Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33b
  - number: 33c.1
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van
      voorschriften gesteld bij of krachtens de [artikelen 4, eerste en tweede lid][ref1],
      [5, eerste lid][ref2][6, derde, vijfde en zesde lid, eerste volzin][ref3], [8][ref4], [10][ref5],
      [11, eerste lid][ref6], [12, eerste tot en met derde en vijfde tot en met zevende lid][ref7], [12a][ref8],
      [13, eerste en derde lid][ref9], [13b, eerste en vijfde lid][ref10], [14, tweede lid][ref11], 4a, tweede lid,
      [16, derde tot en met vijfde lid][ref12], [17a, eerste tot en met vierde en zesde tot en met achtste lid][ref13],
      [17b, tweede lid][ref14], [17c, tweede en derde lid][ref15], [19, tweede en derde lid][ref16], voor
      zo ver het betreft het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref17] en het
      voorschrift inzage te verlenen in zakelijke gegevens en bescheiden, [20, eerste en tweede lid][ref18],
      [21, derde en zesde lid, onder a][ref19], [22][ref20], [22a, tweede tot en met vierde lid][ref21], [23][ref22],
      [27c, tweede en derde lid][ref23].


