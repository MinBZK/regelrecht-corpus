  - number: '20.1'
    text: |-
      [Artikel 19][ref1] is van overeenkomstige toepassing ten aanzien van de beleggingsinstelling bedoeld in
      [artikel 17a][ref2] of [17c][ref3], voor zover het betreft het toezicht op de naleving van het bij en krachtens
      [artikel 17a][ref4] of [17c][ref5] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
