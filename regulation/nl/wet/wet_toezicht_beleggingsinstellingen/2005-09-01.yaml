  - number: '20.2'
    text: |-
      De [artikelen 19][ref1] en [21][ref2] zijn van overeenkomstige toepassing ten aanzien van beleggingsinstellingen
      als bedoeld in [artikel 17a][ref3] of [17c][ref4], voor zover het betreft het toezicht op de naleving van het bij
      of krachtens [artikel 17a][ref5] of [17c][ref6] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
