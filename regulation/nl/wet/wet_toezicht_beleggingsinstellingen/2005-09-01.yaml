        hoofdstuk: V
      - id: ref7
        bwb_id: BWBR0004809
        artikel: '30'
        hoofdstuk: VI
  - number: '29.6'
    text: |-
      Een in het eerste lid bedoelde rechtspersoon brengt eenmaal per jaar, uiterlijk op 1 mei, aan Onze Minister
      verslag uit over de uitoefening van de overgedragen taken en bevoegdheden op grond van deze wet. Dit verslag
      wordt door de zorg van Onze Minister gepubliceerd, behoudens het gedeelte handelende over de uitvoering van
      [artikel 5, derde lid][ref1], [artikel 6, zevende lid][ref2], [artikel 12, derde lid][ref3], [artikel 21][ref4] en
      [artikel 22][ref5], met dien verstande dat, zonder schriftelijke toestemming van de bij het te publiceren gedeelte
      van het verslag betrokkenen, gegevens met betrekking tot afzonderlijke beheerders, beleggingsinstellingen en
      bewaarders niet gepubliceerd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel22
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
