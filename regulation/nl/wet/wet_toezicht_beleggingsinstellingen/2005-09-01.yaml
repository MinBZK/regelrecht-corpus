---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_beleggingsinstellingen
regulatory_layer: WET
publication_date: '2006-12-07'
valid_from: '2005-09-01'
bwb_id: BWBR0004809
url: https://wetten.overheid.nl/BWBR0004809/2005-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven voor beleggingsinstellingen met het
    oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, en dat het
    noodzakelijk is uitvoering te geven aan de Richtlijn van de Raad van de Europese Gemeenschappen van 20 december
    1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor
    collectieve belegging in effecten (icbe's) (85/611/EEG);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.a
    text: |-
      *beleggingsmaatschappij:* de rechtspersoon die gelden of andere goederen ter collectieve belegging vraagt of heeft
      verkregen teneinde de deelnemers in de opbrengst van de beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.b
    text: |-
      *beleggingsfonds:* een niet in een rechtspersoon als bedoeld onder a ondergebracht vermogen waarin ter collectieve
      belegging gevraagde of verkregen gelden of andere goederen zijn of worden opgenomen teneinde de deelnemers in de
      opbrengst van de beleggingen te doen delen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.c
    text: '*beleggingsinstelling:* beleggingsmaatschappij of beleggingsfonds;'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.d
    text: |-
      *deelnemer:* de aandeelhouder in een beleggingsmaatschappij danwel de deelgerechtigde in een ter collectieve
      belegging bijeengebracht vermogen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.e
    text: '*beheerder:* de rechtspersoon die het beheer voert over één of meer beleggingsinstellingen;'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.f
    text: '*bewaarder:* degene die belast is met de bewaring van de activa van de beleggingsinstelling;'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.g
    text: '*effecten:*'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.g.1
    text: |-
      aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, optiebewijzen, warrants, en soortgelijke
      waardepapieren;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.g.2
    text: |-
      rechten van deelgenootschap, opties, rechten op overdracht op termijn van zaken, inschrijvingen in aandelen- en
      schuldregisters, en soortgelijke, al dan niet voorwaardelijke, rechten;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.g.3
    text: certificaten van waarden als hiervoor bedoeld;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.g.4
    text: recepissen van waarden als hiervoor bedoeld;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.h
    text: |-
      *deposito's:* tegoeden bij kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1], die onmiddellijk
      kunnen worden opgevraagd en waarvan de rentetermijn ten hoogste twaalf maanden bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1.i
    text: '*Onze Minister:* Onze minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.j
    text: |-
      *richtlijn:* [richtlijn nr. 85/611/EEG](31985L0611) van de Raad van de Europese Gemeenschappen van 20 december
      1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor
      collectieve belegging in effecten (icbe's) (PbEG L 375) zoals deze is gewijzigd bij [richtlijn nr. 2001/107/EG]
      (32001L0107) van de Raad van de Europese Unie van 21 januari 2002 (PbEG L41/20) en bij [richtlijn nr. 2001/108/EG]
      (32001L0108) van de Raad van de Europese Unie van 21 januari 2002 (PbEG L41/35);
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.k
    text: |-
      *lidstaat:* een lidstaat van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.l
    text: |-
      *groep:* een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande dat
      indien een natuurlijk persoon, rechtspersoon of vennootschap:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.l.1°
    text: |-
      via een formele of feitelijke zeggenschapsstructuur invloed kan uitoefenen op een of meer andere natuurlijke
      personen, rechtspersonen of vennootschappen; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.l.2°
    text: |-
      in een of meer andere rechtspersonen of vennootschappen een deelneming heeft als bedoeld in
      [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref1], dan wel, voor zover het natuurlijke personen betreft,
      een met een deelneming overeenkomende positie, die natuurlijke persoon, rechtspersoon of vennootschap tezamen met
      die andere natuurlijke personen, rechtspersonen of vennootschappen wordt aangemerkt als groep;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 1.m
    text: |-
      *lidstaat van herkomst:* de lidstaat waar de statutaire zetel van de beheerder, of van de beleggingsmaatschappij
      zonder beheerder, is gevestigd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.n
    text: |-
      *lidstaat van ontvangst:* de lidstaat, die niet de lidstaat van herkomst is van een beleggingsinstelling of van een
      beheerder, en waar de rechten van deelneming in die beleggingsinstelling worden verhandeld;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.o
    text: |-
      *bijkantoor:* een of meer onderdelen zonder rechtspersoonlijkheid van een beheerder of een beleggingsmaatschappij
      die in een andere lidstaat is onderscheidenlijk zijn gevestigd dan die waar de beheerder is gevestigd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: 1.p
    text: |-
      *effecteninstelling:* een effecteninstelling als bedoeld in
      [artikel 7, tweede lid, onder i, van de Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '7'
  - number: 1.q
    text: |-
      *kredietinstelling:* een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1.r
    text: |-
      *verzekeraar:* een verzekeraar met zetel in een andere lidstaat dan Nederland, die in het bezit is van een
      vergunning die overeenkomt met de in [artikel 24, eerste lid van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      bedoelde vergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 1.s
    text: |-
      *reclame-uitingen:* iedere vorm van informatieverstrekking door, namens of mede namens een beheerder, gericht
      op consumenten, die dient ter aanprijzing of een wervend karakter kent ter zake van gelden of andere goederen
      ter deelneming in een beleggingsinstelling dan wel ter zake van rechten van deelneming in een dergelijke
      beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel1
  - number: '2'
    text: 'Geen effecten in de zin van deze wet zijn:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel2
  - number: 2.a
    text: waarden welke uitsluitend het karakter van betaalmiddel dragen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel2
  - number: 2.b
    text: appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel2
  - number: '3.1'
    text: |-
      De bepalingen van deze wet en de daarop berustende bepalingen ten aanzien van een beleggingsinstelling die een
      beleggingsfonds is, zijn gericht tot de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel3
  - number: '3.2'
    text: |-
      De bepalingen van deze wet en de daarop berustende bepalingen met betrekking tot de beheerder zijn van
      overeenkomstige toepassing op de beleggingsmaatschappij die geen aparte beheerder heeft, met uitzondering van de
      [artikelen 6, tweede en vierde lid][ref1], [13b][ref2] en [17b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel13b
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 13b
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: 17b
        hoofdstuk: III
  - number: '4.1'
    text: |-
      Het is verboden rechtstreeks of middellijk in of vanuit Nederland gelden of andere goederen ter deelneming
      in een beleggingsinstelling te vragen of te verkrijgen dan wel rechten van deelneming in een dergelijke
      beleggingsinstelling aan te bieden, indien die beleggingsinstelling niet wordt beheerd door een beheerder waaraan
      een vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel4
  - number: '4.2'
    text: |-
      Het is verboden rechtstreeks of middellijk in of vanuit Nederland gelden of andere goederen ter deelneming in
      een beleggingsmaatschappij als bedoeld in [artikel 6][ref1] waaraan geen vergunning is verleend, te vragen of te
      verkrijgen dan wel rechten van deelneming in een dergelijke beleggingsmaatschappij aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '4.3'
    text: 'Het verbod in het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel4
  - number: 4.3.a
    text: |-
      op het vragen, verkrijgen of aanbieden van rechten van deelneming in een beleggingsinstelling waarvan die rechten
      ingevolge [artikel 17a, vierde lid][ref1], in Nederland mogen worden verhandeld;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
  - number: 4.3.b
    text: |-
      op de aanbieding van eigen rechten van deelneming door natuurlijke personen anders dan in de uitoefening van hun
      beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister verleent een beheerder, op verzoek en met inachtneming van [artikel 6][ref1], een vergunning indien
      de aanvrager aantoont dat de beheerder een rechtspersoon met volledige rechtsbevoegdheid is en de beheerder, de
      beleggingsinstelling waarover hij het beheer voert en, indien aan de beleggingsinstelling verbonden, de bewaarder,
      voldoen aan bij of krachtens algemene maatregel van bestuur te stellen eisen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 5.1.a
    text: deskundigheid en betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.1.b
    text: financiële waarborgen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.1.c
    text: bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.1.d
    text: aan Onze Minister, aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.1.e
    text: waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: '5.2'
    text: 'Indien de beheerder een beleggingsfonds beheert, dient de aanvrager bovendien aan te tonen dat:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.2.a
    text: |-
      het vermogen van het beleggingsfonds ten behoeve van de deelnemers wordt verkregen door een van de beheerder
      onafhankelijke bewaarder;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: 5.2.b
    text: |-
      de bewaarder slechts met medewerking van de beheerder over de vermogensbestanddelen van het beleggingsfonds kan
      beschikken.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister kan op verzoek aan een aanvrager een vergunning verlenen indien de aanvrager aantoont dat
      redelijkerwijs niet volledig kan worden voldaan aan eisen gesteld bij of krachtens het eerste en tweede lid, en hij
      tevens aantoont dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende zijn bereikt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel5
  - number: '6.1'
    text: |-
      Indien de in [artikel 5][ref1] bedoelde aanvrager een beleggingsmaatschappij of een beheerder is die rechten van
      deelneming in een beleggingsinstelling aanbiedt:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 6.1.a
    text: |-
      waarvan het statutaire of reglementaire doel uitsluitend is het beleggen in effecten of deposito's met toepassing
      van het beginsel van risicospreiding;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: 6.1.b
    text: |-
      waarvan de rechten van deelneming zonder beperkingen in Nederland kunnen worden aangeboden en op verzoek van de
      deelnemer ten laste van het vermogen van de beleggingsinstelling rechtstreeks of middellijk worden ingekocht of
      terugbetaald; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: 6.1.c
    text: |-
      waarvan de zetel en het hoofdkantoor, of wanneer het een beleggingsfonds betreft, die van de beheerder, in
      Nederland is gelegen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.2'
    text: 'Indien de beheerder bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: 6.2.a
    text: |-
      een dochteronderneming is van een andere beheerder, van een effecteninstelling, van een kredietinstelling of van
      een verzekeraar waaraan in een andere lidstaat een vergunning is verleend; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: 6.2.b
    text: |-
      een dochteronderneming is van de moederonderneming van een andere beheerder, van een effecteninstelling, van een
      kredietinstelling of een verzekeraar waaraan in een andere lidstaat een vergunning is verleend; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: 6.2.c
    text: |-
      onder de zeggenschap staat van dezelfde natuurlijke of rechtspersonen die de zeggenschap hebben over een andere
      beheerder, over een effecteninstelling, over een kredietinstelling of over een verzekeraar waaraan in een andere
      lidstaat een vergunning is verleend, verleent Onze Minister geen vergunning alvorens het bevoegde gezag van de
      andere betrokken lidstaat of lidstaten te hebben geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.3'
    text: |-
      De werkzaamheden van de beheerder, bedoeld in het eerste lid, zijn beperkt tot het beheer van
      beleggingsinstellingen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.4'
    text: |-
      In afwijking van het derde lid is het een beheerder toegestaan om als vermogensbeheerder als bedoeld in
      [artikel 1, onder c, van de Wet toezicht effectenverkeer 1995][ref1] diensten aan te bieden of te verrichten
      indien de beheerder aantoont dat voldaan wordt aan de op grond van [artikel 7, vierde lid][ref2] en
      [artikel 11, eerste tot en met derde lid, van de Wet toezicht effectenverkeer 1995][ref3] bij of krachtens algemene
      maatregel van bestuur te stellen regels. Het is een beheerder die een vergunning heeft tevens toegestaan om
      diensten te verrichten als bedoeld onder 1 en 6 van deel C van de bijlage bij [richtlijn 93/22/EEG](31993L0022)
      van de Raad van de Europese Gemeenschappen van 10 mei 1993 betreffende het verrichten van diensten op het gebied
      van beleggingen in effecten (PbEG L 141), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 2000/64/EG]
      (32000L0064) van het Europees Parlement en de Raad van de Europese Unie van 17 november 2000 (PbEG L 290).


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel11
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007657
        artikel: '11'
  - number: '6.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het aanbieden of
      verrichten van diensten als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.6'
    text: |-
      De activa van de beleggingsinstelling worden bewaard door een van haar onafhankelijke bewaarder. Volgens bij of
      krachtens algemene maatregel van bestuur te stellen regels kan van dit vereiste worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.7'
    text: De bewaarder van de beleggingsinstelling heeft zijn zetel in een lidstaat en heeft een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
  - number: '6.8'
    text: |-
      [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7'
    text: |-
      [Artikel 6][ref1] is niet van toepassing op een in [dat artikel][ref2] omschreven beheerder die het beheer voert
      over een beleggingsinstelling die:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 7.a
    text: geen gelden of andere goederen van het publiek van de lidstaten ter belegging vraagt of verkrijgt;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel7
  - number: 7.b
    text: |-
      krachtens haar statuten of reglementen, haar rechten van deelneming slechts bij het publiek in landen buiten de
      lidstaten mag plaatsen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel7
  - number: 7.c
    text: |-
      behoort tot één van de door Onze Minister aangewezen soorten beleggingsinstellingen waarvoor de bij of krachtens
      [artikel 12, tweede lid][ref1], gestelde regels met betrekking tot het beleggen, gelet op hun beleid inzake
      beleggingen of het aangaan van leningen, niet geschikt zijn; of


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 7.d
    text: via dochtermaatschappijen voornamelijk belegt in andere objecten dan effecten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel7
  - number: '8'
    text: |-
      Aan een vergunning kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een adequate
      werking van de financiële markten en de positie van de beleggers op die markten, indien feiten en omstandigheden
      die betrekking hebben op degene voor wie de vergunning zal gelden dit vereisen. De beperkingen kunnen uitsluitend
      worden gesteld ten aanzien van de reikwijdte en de tijdsduur van de vergunning.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel8
  - number: '9.1'
    text: |-
      Als bewaarder mag slechts optreden een rechtspersoon met als enig statutaire doel het bewaren van activa en het
      administreren van beleggingsobjecten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel9
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bewaarder, bedoeld in het eerste lid, slechts mag
      bewaren ten behoeve van één beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel9
  - number: '10'
    text: |-
      Indien Onze Minister van oordeel is dat van de in Nederland gevoerde of te voeren naam van de beheerder of de
      beleggingsinstelling gevaar voor verwarring of misleiding is te duchten, kan Onze Minister verlangen dat de
      beheerder of de beleggingsinstelling
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel10
  - number: 10.a
    text: de naam wijzigt, dan wel
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel10
  - number: 10.b
    text: een verklarende vermelding aan de naam toevoegt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel10
  - number: '11.1'
    text: |-
      Het is een beleggingsmaatschappij of een beheerder als bedoeld in [artikel 6][ref1] waaraan op grond van
      [artikel 5][ref2] een vergunning is verleend, verboden haar statuten of reglementen zodanig te wijzigen dat zij
      niet meer onder de toepassing van [artikel 6][ref3] valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Een wijziging van de statuten of reglementen, als bedoeld in het eerste lid, is nietig. Op verzoek van het openbaar
      ministerie benoemt de rechter een bewindvoerder met de macht om de gevolgen van de nietige handeling ongedaan te
      maken.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel11
  - number: '11.3'
    text: |-
      Bij het ongedaan maken van de nietige handeling dient de bewindvoerder mede te handelen in het belang van de
      deelnemers in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel11
  - number: '12.1'
    text: |-
      De beheerder waaraan een vergunning is verleend, de beleggingsinstelling waarover hij het beheer voert en de
      bewaarder, indien aan de instelling verbonden, houden zich aan bij of krachtens algemene maatregel van bestuur te
      stellen regels met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.1.a
    text: deskundigheid en betrouwbaarheid;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.1.b
    text: financiële waarborgen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.1.c
    text: bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.1.d
    text: aan Onze Minister, aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.1.e
    text: waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.2'
    text: |-
      Degenen, die onmiddellijk bevoegd zijn bestuurders van de beheerder, de beleggingsinstelling of van de bewaarder
      te benoemen of te ontslaan, houden zich aan bij of krachtens algemene maatregel van bestuur te stellen regels
      ten aanzien van betrouwbaarheid. Onder bestuurder wordt begrepen ieder die de beheerder, beleggingsinstelling of
      bewaarder krachtens statuten of reglementen vertegenwoordigt dan wel binnen de beheerder, beleggingsinstelling of
      bewaarder het beleid bepaalt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.3'
    text: |-
      De beheerder, de beleggingsinstelling als bedoeld in [artikel 6][ref1], en de bewaarder houden zich bovendien aan
      bij of krachtens algemene maatregel van bestuur te stellen aanvullende eisen met betrekking tot deskundigheid en
      betrouwbaarheid, bedrijfsvoering, financiële waarborgen, het beleggen en informatieverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.4'
    text: |-
      Onze Minister kan op verzoek van de beheerder bepalen dat de beheerder, de beleggingsinstelling of de bewaarder,
      niet behoeft te voldoen aan alle in het eerste, tweede of derde lid bedoelde regels indien zij aantoont dat daaraan
      redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt te bereiken anderszins
      voldoende bereikt zijn. Onze Minister kan een beschikking als hiervoor bedoeld wijzigen of intrekken indien naar
      zijn oordeel de omstandigheden waaronder de beschikking is gegeven zodanig zijn gewijzigd dat de doeleinden die
      deze wet beoogt te bereiken niet langer worden bereikt.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.5'
    text: |-
      De accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die op grond
      van de regels, bedoeld in het eerste of tweede lid, de jaarrekening van de beheerder, of de beleggingsinstelling
      van een verklaring moet voorzien, meldt Onze Minister zo spoedig mogelijk elke omstandigheid waarvan hij bij de
      uitvoering van zijn desbetreffende werkzaamheden kennis heeft gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 12.5.a
    text: in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.5.b
    text: in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.5.c
    text: het voortbestaan van de beheerder, of de beleggingsinstelling bedreigt; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: 12.5.d
    text: leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.6'
    text: |-
      Op de accountant, bedoeld in het vijfde lid, die naast zijn werkzaamheden voor de beheerder of de
      beleggingsinstelling ook werkzaamheden uitvoert voor een andere onderneming of instelling, is de meldingsplicht,
      bedoeld in het vijfde lid, van overeenkomstige toepassing indien de beheerder of de beleggingsinstelling
      dochtermaatschappij is van de andere onderneming of instelling, dan wel indien de andere onderneming
      of instelling dochtermaatschappij is van de beheerder of de beleggingsinstelling. Voor de toepassing
      van de eerste volzin wordt onder dochtermaatschappij verstaan een dochtermaatschappij als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1], met dien verstande dat een beleggingsinstelling tevens
      dochtermaatschappij kan zijn van een natuurlijk persoon of vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: '12.7'
    text: |-
      Onverminderd het bepaalde in het vijfde en het zesde lid verstrekt de accountant, bedoeld in het vijfde lid, aan
      Onze Minister zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig zijn ten behoeve van het toezicht op
      de naleving van deze wet met betrekking tot bij algemene maatregel van bestuur aan te wijzen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.8'
    text: |-
      De accountant die op grond van het vijfde of zesde lid tot een melding of op grond van het zevende lid tot
      het geven van inlichtingen aan Onze Minister is overgegaan, is niet aansprakelijk voor schade die een derde
      dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid
      niet tot melding of tot het geven van inlichtingen had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
  - number: '12.9'
    text: |-
      [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing op een beheerder waaraan een vergunning is
      verleend en op een bewaarder.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.10'
    text: |-
      [Artikel 16 van de Wet toezicht effectenverkeer 1995][ref1] is van overeenkomstige toepassing op het houden,
      verwerven of vergroten van een gekwalificeerde deelneming, dan wel het uitoefenen van enige zeggenschap verbonden
      aan een gekwalificeerde deelneming, in een beheerder als bedoeld in [artikel 6][ref2] waaraan een vergunning is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 12a
    text: |-
      Aan een vergunning kunnen ten aanzien van de reikwijdte en de tijdsduur beperkingen worden gesteld en voorschriften
      worden verbonden met het oog op een adequate functionering van de financiële markten en de positie van de beleggers
      op die markten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel12a
  - number: '13.1'
    text: |-
      De beheerder waaraan een vergunning is verleend en die het beheer voert over een beleggingsinstelling als bedoeld
      in [artikel 6][ref1] die voor de eerste maal, direct of indirect, zijn werkzaamheden op het grondgebied van
      een andere lidstaat wil uitoefenen, stelt Onze Minister hiervan schriftelijk in kennis. De beheerder doet de
      kennisgeving vergezeld gaan van een opgave van de voorgenomen activiteiten en diensten van de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Binnen een maand na ontvangst van de in het eerste lid bedoelde kennisgeving doet Onze Minister mededeling daarvan
      aan het bevoegde gezag van de lidstaat van ontvangst.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de voorgenomen activiteiten en diensten van de beheerder wijzigen, stelt de beheerder Onze Minister en het
      bevoegde gezag van de lidstaat van ontvangst schriftelijk van deze wijzigingen in kennis voordat de wijzigingen
      worden doorgevoerd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13
  - number: 13a
    text: |-
      Onze Minister verstrekt, op verzoek, aan de beheerder waaraan een vergunning is verleend en die het beheer voert
      over een beleggingsinstelling als bedoeld in [artikel 6][ref1] en die voornemens is rechten van deelneming in die
      beleggingsinstelling in een andere lidstaat te verhandelen een verklaring dat de beheerder en de door hem beheerde
      beleggingsinstelling aan de voorwaarden van de richtlijn voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 13b.1
    text: |-
      De beheerder waaraan een vergunning is verleend en die het beheer voert over een beleggingsinstelling als bedoeld
      in [artikel 6][ref1], stelt Onze Minister vooraf in kennis van zijn voornemen de rechten van deelneming in die
      beleggingsinstelling door het vestigen van een bijkantoor in een andere lidstaat aan te bieden. De kennisgeving
      gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 13b.1.a
    text: |-
      een opgave van de voorgenomen activiteiten en diensten van de beheerder en de organisatiestructuur van het
      bijkantoor;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.1.b
    text: het adres in de lidstaat van ontvangst waar documenten kunnen worden opgevraagd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.1.c
    text: de identiteit van de bestuurders van het bijkantoor.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.2
    text: |-
      Indien Onze Minister, gelet op het voornemen van de beheerder, geen redenen heeft om te twijfelen aan de
      bedrijfsvoering en de financiële waarborgen van de beheerder, doet Onze Minister binnen drie maanden na ontvangst
      van de in het eerste lid bedoelde kennisgeving, mededeling van de voornemens van de beheerder aan het bevoegde
      gezag van de lidstaat van ontvangst.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.3
    text: Onze Minister stelt de beheerder in kennis van de mededeling bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.4
    text: |-
      Indien Onze Minister op grond van het tweede lid weigert de in het eerste lid bedoelde voornemens van de beheerder
      mede te delen aan het bevoegde gezag van de lidstaat van ontvangst, doet Onze Minister hiervan binnen twee maanden
      na ontvangst van de in het eerste lid bedoelde kennisgeving mededeling aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: 13b.5
    text: |-
      Indien de in het eerste lid bedoelde voornemens of de gegevens, bedoeld in het eerste lid onder a tot en met c,
      wijzigen, stelt de beheerder Onze Minister schriftelijk van de wijziging in kennis, ten minste één maand voordat de
      wijziging van toepassing wordt. Het tweede tot en met vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel13b
  - number: '14.1'
    text: |-
      Onze Minister kan vrijstelling verlenen van het in [artikel 4][ref1] vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Aan een vrijstelling als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die
      markten. De beperkingen kunnen uitsluitend worden gesteld ten aanzien van de reikwijdte van de vrijstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel14
  - number: 14a.1
    text: |-
      Onze Minister kan, op verzoek, ontheffing verlenen van het in [artikel 4][ref1] vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 14a.2
    text: |-
      Aan een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een adequate
      werking van de financiële markten en de positie van de beleggers op die markten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel14a
  - number: '15.1'
    text: 'Onze Minister kan een vergunning of een ontheffing slechts intrekken:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.b
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning of ontheffing zodanig onjuist
      of onvolledig blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het
      verzoek de juiste gegevens of bescheiden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.c
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan, zo zij zich voor het tijdstip waarop
      de vergunning of ontheffing werd verleend, hadden voorgedaan, of bekend waren geweest, de vergunning of ontheffing
      zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.d
    text: 'Indien de houder van de vergunning of de ontheffing:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.d.1°
    text: binnen een termijn van twaalf maanden na de verlening daarvan geen gebruik heeft gemaakt;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.d.2°
    text: uitdrukkelijk te kennen heeft gegeven daarvan geen of niet langer gebruik te zullen maken;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.d.3°
    text: |-
      het verrichten van werkzaamheden waarop zij betrekking heeft gedurende een termijn van meer dan zes maanden heeft
      gestaakt; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.d.4°
    text: kennelijk opgehouden heeft beheerder te zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.e
    text: |-
      indien de beheerder, de beleggingsinstelling of de bewaarder niet voldoet aan het bij of krachtens deze wet
      gestelde; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
  - number: 15.1.f
    text: |-
      indien de beheerder, de beleggingsinstelling of de bewaarder niet of niet genoegzaam uitvoering heeft gegeven aan
      een aanwijzing of een aanzegging als bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel21
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '21'
        hoofdstuk: V
  - number: '15.2'
    text: |-
      Gedurende de ontbinding, bedoeld in [artikel 16, tweede lid][ref1], en de vereffening, bedoeld in
      [artikel 16, derde lid][ref2], wordt de beheerder voor de toepassing van deze wet gelijkgesteld met een beheerder
      die beschikt over een vergunning als bedoeld in [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '16'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '16'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.1'
    text: 'Onze Minister deelt de intrekking of wijziging van een vergunning of ontheffing gelijktijdig mee aan:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.1.a
    text: de beheerder;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.1.b
    text: de bewaarder van iedere beleggingsinstelling waarover de beheerder het beheer voert; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.1.c
    text: |-
      het bevoegde gezag in de overige lidstaten, indien de beheerder het beheer voert over een beleggingsinstelling als
      bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.2'
    text: |-
      Een beleggingsmaatschappij die beheerd wordt door een beheerder waarvan de vergunning is ingetrokken wordt op
      verzoek van Onze Minister door de rechtbank ontbonden.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: '16.3'
    text: |-
      Het vermogen van een beleggingsfonds dat beheerd wordt door een beheerder waarvan de vergunning als bedoeld in
      [artikel 5][ref1] is ingetrokken, wordt op verzoek van Onze Minister door een of meer door de rechtbank aan te
      wijzen vereffenaars vereffend.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.4'
    text: |-
      Een beleggingsmaatschappij of het vermogen van een beleggingsfonds wordt tevens op verzoek van Onze Minister door
      de rechtbank ontbonden respectievelijk door een of meer door de rechtbank aan te wijzen vereffenaars binnen een
      door de rechtbank te bepalen termijn vereffend, indien:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.a
    text: |-
      de gegevens of bescheiden die zijn verstrekt over de beleggingsinstelling zodanig onjuist zijn of onvolledig
      blijken, of wanneer omstandigheden zich voordoen of feiten bekend worden, op grond waarvan, zo zij zich voor het
      tijdstip waarop de vergunning werd verleend, hadden voorgedaan, of bekend waren geweest, de beleggingsinstelling
      niet zou zijn toegestaan haar activiteiten te verrichten;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b
    text: 'de beleggingsinstelling dan wel de beheerder:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.1°
    text: binnen een termijn van twaalf maanden na de oprichting geen activiteiten heeft verricht;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.2°
    text: uitdrukkelijk te kennen heeft gegeven dat de beleggingsinstelling geen activiteiten zal verrichten;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.3°
    text: haar activiteiten gedurende een termijn van meer dan zes maanden heeft gestaakt, of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.4°
    text: kennelijk heeft opgehouden beleggingsinstelling te zijn;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.5°
    text: niet voldoet aan het bij of krachtens deze wet gestelde; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16.4.b.6°
    text: |-
      niet of niet genoegzaam uitvoering heeft gegeven aan een aanwijzing of een aanzegging als bedoeld in
      [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel21
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '21'
        hoofdstuk: V
  - number: '16.5'
    text: |-
      De ontbinding, bedoeld in het tweede en vierde lid, en de vereffening, bedoeld in het derde of vierde lid, vindt
      niet eerder plaats dan nadat het besluit tot intrekking of wijziging van de vergunning onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16
  - number: 16a.1
    text: 'Het vermogen van een beleggingsfonds dient uitsluitend tot voldoening van de vorderingen die voortvloeien uit:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: 16a.1.a
    text: schulden die verband houden met het beheer en het bewaren van het fonds; en
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: 16a.1.b
    text: rechten van deelneming.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: 16a.2
    text: |-
      Indien het vermogen van het beleggingsfonds bij vereffening ontoereikend is voor voldoening van de vorderingen,
      dient het vermogen van het beleggingsfonds ter voldoening van de vorderingen in de volgorde zoals aangegeven in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: 16a.3
    text: |-
      Op het vermogen van een beleggingsfonds zijn geen andere vorderingen verhaalbaar dan bedoeld in het eerste lid,
      tenzij vaststaat dat de in het eerste lid, onder a of b, bedoelde vorderingen zullen kunnen worden voldaan en dat
      in de toekomst dergelijke vorderingen niet meer zullen ontstaan.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: 16a.4
    text: |-
      Indien de in het eerste lid bedoelde vorderingen niet volledig uit het vermogen van het beleggingsfonds kunnen
      worden voldaan, dient het vermogen van de bewaarder eerst ter voldoening van de vorderingen in de volgorde als
      bedoeld in het eerste lid en vervolgens van de overige vorderingen, behoudens de door de wet erkende andere redenen
      van voorrang.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel16a
  - number: '17.1'
    text: |-
      Onze Minister doet aan de beheerder die zijn zetel in een andere lidstaat heeft en die voor de eerste maal, direct
      of indirect, zijn werkzaamheden in Nederland wil uitoefenen, zodra Onze Minister hiervan in kennis is gesteld door
      het bevoegde gezag van de lidstaat van herkomst en de opgave van de voorgenomen activiteiten en diensten van de
      beheerder heeft ontvangen, mededeling van de voorwaarden waaraan de beheerder met het oog op een adequate werking
      van de financiële markten en de positie van de belegger op die markten moet voldoen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17
  - number: '17.2'
    text: |-
      Indien Onze Minister door het bevoegde gezag van de lidstaat van herkomst in kennis wordt gesteld van wijziging van
      het in het eerste lid bedoelde voorgenomen activiteiten en diensten deelt hij, indien van toepassing, wijzigingen
      of aanvullingen van de in het eerste lid bedoelde voorwaarden mede aan de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17
  - number: 17a.1
    text: |-
      Een beheerder die zijn zetel in een andere lidstaat heeft en overigens voldoet aan
      [artikel 6, eerste lid, aanhef en onderdelen a en b][ref1], doet aan Onze Minister en het bevoegde gezag van de
      lidstaat van herkomst mededeling van zijn voornemen zijn rechten van deelneming in Nederland aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 17a.2
    text: 'Bij de mededeling legt de beheerder over:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.a
    text: |-
      een verklaring van het bevoegde gezag van de lidstaat waar zijn zetel is gevestigd dat de beheerder voldoet aan de
      voorwaarden van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.b
    text: zijn statuten of reglementen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.c
    text: zijn prospectus;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.d
    text: zijn vereenvoudigde prospectus;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.e
    text: |-
      gegevens over de beoogde wijze van informatieverschaffing, van verhandeling van, uitkeringen op alsmede inkoop van
      of terugbetaling op rechten van deelneming in Nederland;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.2.f
    text: in voorkomend geval zijn laatste jaarrekening en halfjaarcijfers.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.3
    text: |-
      De beheerder, bedoeld in het eerste lid, stelt in de Nederlandse of een andere door Onze Minister goedgekeurde taal
      de gegevens en bescheiden beschikbaar, die hij openbaar dient te maken overeenkomstig de regels, gesteld door de
      lidstaat van herkomst.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.4
    text: |-
      Twee maanden na de mededeling bedoeld in het eerste lid, kan de beheerder overgaan tot verhandeling van zijn
      rechten van deelneming, tenzij Onze Minister voordien heeft bekendgemaakt:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.4.a
    text: |-
      dat de voornemens, bedoeld in onderdeel d van het tweede lid, niet in overeenstemming zijn met toepasselijke
      Nederlandse wettelijke bepalingen; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.4.b
    text: |-
      dat de beoogde wijze van verhandeling in strijd is met wettelijke voorschriften die betrekking hebben op het niet
      door de richtlijn bestreken gebied.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.5
    text: |-
      [Artikel 10, onder b][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel10
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 17a.6
    text: |-
      De beheerder, bedoeld in het eerste lid, dient, met inachtneming van toepasselijke Nederlandse wettelijke
      bepalingen, zorg te dragen voor de uitkeringen op, de inkoop van of terugbetaling op de rechten van deelneming in
      Nederland alsmede voor de verschaffing van de informatie die de beheerder in Nederland moet verstrekken.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.7
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van reclame-uitingen.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.8
    text: |-
      Onze Minister kan een beleggingsmaatschappij die niet wordt beheerd door een beheerder en die in strijd handelt
      met een voorschrift als bedoeld in het eerste tot en met zevende lid, verbieden in Nederland zijn rechten van
      deelneming aan te bieden of regels stellen aan het aanbieden van deze rechten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17a.9
    text: |-
      Van een besluit op grond van het achtste lid doet Onze Minister onverwijld mededeling aan het bevoegde gezag in de
      lidstaat van herkomst alsmede aan het bevoegde gezag in de overige lidstaten waar, zover hem bekend is, de rechten
      van deelneming worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17a
  - number: 17b.1
    text: |-
      Onze Minister deelt de beheerder die voornemens is de rechten van deelneming in een beleggingsinstelling door het
      vestigen van een bijkantoor in Nederland aan te bieden, binnen twee maanden nadat Onze Minister door het bevoegde
      gezag van de lidstaat van herkomst in kennis is gesteld van de vestiging van het bijkantoor en de voorgenomen
      activiteiten en diensten van de beheerder en de organisatiestructuur van het bijkantoor, het adres waar documenten
      kunnen worden opgevraagd en de namen van de bestuurders van het bijkantoor zijn ontvangen, de voorwaarden mee
      waaronder de werkzaamheden met het oog op een adequate werking van de financiële markten en de positie van de
      beleggers op die markten kunnen worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17b
  - number: 17b.2
    text: |-
      De beheerder, bedoeld in het eerste lid, kan het bijkantoor in Nederland vestigen zodra hij daartoe een mededeling
      van Onze Minister heeft ontvangen of indien de in het eerste lid bedoelde termijn is verstreken, tenzij Onze
      Minister voordien heeft bekend gemaakt:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17b
  - number: 17b.2.a
    text: |-
      dat het voornemen als bedoeld in het eerste lid niet in overeenstemming is met de toepasselijke Nederlandse
      wettelijke bepalingen; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17b
  - number: 17b.2.b
    text: |-
      dat de beoogde wijze van verhandeling in strijd is met wettelijke voorschriften die betrekking hebben op het niet
      door de richtlijn bestreken gebied.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17b
  - number: 17c.1
    text: |-
      [Artikel 4, eerste lid][ref1], is onder bij algemene maatregel van bestuur te stellen regels niet van toepassing
      op het rechtstreeks of middellijk in of vanuit Nederland vragen of verkrijgen van gelden of goederen ter deelneming
      dan wel het aanbieden van rechten van deelneming in een beleggingsinstelling, niet zijnde een beleggingsinstelling
      als bedoeld in [artikel 6][ref2], met zetel in een, onder bij of krachtens algemene maatregel van bestuur te
      stellen regels, door Onze Minister aan te wijzen staat waar toezicht op beleggingsinstellingen wordt uitgeoefend
      dat in voldoende mate waarborgen biedt ten aanzien van de belangen die deze wet beoogt te beschermen en waar de
      desbetreffende beleggingsinstelling ook daadwerkelijk onder toezicht staat. Een besluit tot aanwijzing van een
      staat, alsmede de intrekking daarvan, wordt bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: 17c.2
    text: |-
      De beleggingsinstelling doet aan Onze Minister mededeling van haar voornemen rechten van deelneming in
      Nederland aan te bieden en legt daarbij een verklaring van ondertoezichtstelling van de staat, bedoeld
      in het eerste lid, over. De beleggingsinstelling houdt zich aan de bepalingen, gesteld bij of krachtens
      [artikel 5, eerste lid, onder d][ref1], en [artikel 12, eerste lid, onder d][ref2]. Twee maanden na de mededeling
      kan de beleggingsinstelling overgaan tot de verhandeling van haar rechten van deelneming tenzij Onze Minister
      voordien bekend heeft gemaakt dat de voornemens of de beoogde wijze van verhandeling in strijd zijn met
      toepasselijke Nederlandse wettelijke bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: 17c.3
    text: |-
      Indien een beleggingsinstelling in strijd handelt met een bij of krachtens deze wet gesteld voorschrift, kan Onze
      Minister deze beleggingsinstelling verbieden in Nederland rechten van deelneming aan te bieden of voorschriften
      geven met betrekking tot het aanbieden van deze rechten.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17c
  - number: 17c.4
    text: |-
      Van een besluit als bedoeld in het derde lid doet Onze Minister onverwijld mededeling aan het bevoegde gezag in de
      staat waar de zetel van de beleggingsinstelling is gevestigd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17c
  - number: 17c.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van reclame-uitingen van
      de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel17c
  - number: '18.1'
    text: 'Onze Minister houdt een register, waarin worden ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.1.a
    text: |-
      beheerders waaraan een vergunning is verleend, met inbegrip van de aan de vergunning gestelde beperkingen of
      verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.1.b
    text: |-
      beleggingsinstellingen, beheerd door beheerders waaraan een vergunning is verleend. Deze beleggingsinstellingen
      worden in het register opgenomen bij de beheerder die over hen het beheer voert;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.1.c
    text: |-
      beheerders die op grond van [artikel 17a][ref1] tot de verhandeling van rechten van deelneming mogen overgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
  - number: 18.1.d
    text: |-
      bijkantoren die op grond van [artikel 17b][ref1] tot de verhandeling van rechten van deelneming mogen overgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17b
        hoofdstuk: III
  - number: 18.1.e
    text: |-
      beleggingsinstellingen die op grond van [artikel 17c][ref1] tot de verhandeling van rechten van deelneming in
      Nederland mogen overgaan;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17c
        hoofdstuk: IIIa
  - number: 18.1.f
    text: |-
      beheerders en beleggingsinstellingen waaraan een ontheffing op grond van [artikel 14a][ref1] is verleend, met
      inbegrip van de aan de ontheffing gestelde beperkingen of verbonden voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel14a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 14a
        hoofdstuk: II
        paragraaf: '4'
  - number: 18.1.g
    text: beleggingsinstellingen die zich hebben gemeld als beleggingsmaatschappijen met veranderlijk kapitaal.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: '18.2'
    text: 'De inschrijving wordt doorgehaald van:'
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.2.a
    text: beheerders waarvan de vergunning is ingetrokken of verlopen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.2.b
    text: beheerders en beleggingsinstellingen waarvan de ontheffing is ingetrokken of verlopen;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.2.c
    text: beleggingsinstellingen die kennelijk zijn opgehouden te bestaan;
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
  - number: 18.2.d
    text: |-
      beheerders als bedoeld in [artikel 17a][ref1], die niet langer in Nederland rechten van deelneming aanbieden of
      waaraan het ingevolge [artikel 17a, achtste lid][ref2], is verboden in Nederland rechten van deelneming aan te
      bieden;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004809
        artikel: 17a
        hoofdstuk: III
  - number: 18.2.e
    text: |-
      bijkantoren als bedoeld in [artikel 17b][ref1], die niet langer rechten van deelneming aanbieden;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17b
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 17b
        hoofdstuk: III
  - number: 18.2.f
    text: |-
      beleggingsinstellingen als bedoeld in [artikel 17c, eerste lid][ref1], die niet langer rechten van deelneming in
      Nederland aanbieden of mogen aanbieden of waaraan het ingevolge [artikel 17c, derde lid][ref2], is verboden in
      Nederland rechten van deelneming aan te bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel17c
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel18
    references:
