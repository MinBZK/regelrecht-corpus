        artikel: '21'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0004809
        artikel: '22'
        hoofdstuk: V
  - number: '30'
    text: |-
      Onze Minister kan bepalen dat een vergunning op grond van deze wet wordt geweigerd of ingetrokken, of dat aan de
      vergunning beperkingen worden gesteld en voorschriften worden verbonden, dan wel dat de eerder gestelde beperkingen
      en gegeven voorschriften worden gewijzigd, indien:
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel30
  - number: 30.a
    text: |-
      de beheerder zijn zetel heeft in een staat, niet zijnde een lidstaat, waar Nederlandse financiële instellingen niet
      worden toegelaten of aan onredelijke beperkingen worden onderworpen; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel30
  - number: 30.b
    text: |-
      een natuurlijke persoon of rechtspersoon met de nationaliteit van een onder *a* bedoelde Staat rechtstreeks of
      middellijk overwegende zeggenschap kan uitoefenen in de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel30
  - number: '31'
    text: |-
      Onze Minister kan ten aanzien van een beheerder die een beleggingsinstelling als bedoeld in
      [artikel 6, eerste lid, onderdelen a of b][ref1] beheert en die niet in een lidstaat is gevestigd dan wel in
      een lidstaat is gevestigd die nog geen uitvoering aan de richtlijn heeft gegeven, het bepaalde bij of krachtens
      [artikel 6, derde tot en met zevende lid][ref2], alsmede [artikel 12, tweede lid][ref3], van overeenkomstige
      toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: '12'
        hoofdstuk: II
        paragraaf: '3'
  - number: '32'
    text: |-
      Onze Minister kan een organisatie van beleggingsinstellingen, bewaarders of beheerders, de rechtspersoon of
      rechtspersonen als bedoeld in [artikel 29, eerste lid][ref1], gehoord, aanwijzen als representatieve organisatie
      met betrekking tot de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: '33.1'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '33.2'
    text: |-
      Ingeval beroep wordt ingesteld tegen een besluit als bedoeld in [artikel 33a, eerste lid][ref1], zal de
      terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt alsdan niet in het openbaar uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: 33a
        hoofdstuk: VIIA
  - number: 33a.1
    text: |-
      Onze Minister is bevoegd aan een rechtspersoon waaraan ingevolge [artikel 29, eerste lid][ref1], taken en
      bevoegdheden zijn overgedragen de gegevens of inlichtingen te vragen die naar zijn oordeel nodig zijn voor een
      onderzoek naar de toereikendheid van deze wet of de wijze waarop de rechtspersoon deze wet uitvoert of heeft
      uitgevoerd, indien dat ter wille van het toezicht nodig blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '29'
        hoofdstuk: V
  - number: 33a.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, is verplicht aan Onze Minister de in het eerste lid bedoelde gegevens
      of inlichtingen te verstrekken. Indien Onze Minister de rechtspersoon vraagt bepaalde gegevens of inlichtingen te
      verstrekken die onder [artikel 24][ref1] vallen, is de rechtspersoon niet verplicht deze gegevens of inlichtingen
      te verstrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33a.2.a
    text: |-
      deze betrekking hebben op of herleidbaar zijn tot een afzonderlijke rechtspersoon, vennootschap of natuurlijke
      persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een
      afzonderlijke beleggingsinstelling waaraan een vergunning als bedoeld in [artikel 4][ref1] is verleend of waarvan
      die vergunning is ingetrokken of vervallen, en waaraan surséance van betaling is verleend of die in staat van
      faillissement is verklaard of op grond van een rechterlijke uitspraak is ontbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: 33a.2.b
    text: |-
      deze betrekking hebben op ondernemingen of instellingen die betrokken zijn of zijn geweest bij een poging een
      beleggingsinstelling in staat te stellen haar bedrijf voort te zetten; of
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
  - number: 33a.2.c
    text: |-
      deze zijn ontvangen van een instantie als bedoeld in [artikel 27, eerste lid][ref1], tenzij de uitdrukkelijke
      instemming is verkregen van die instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '27'
        hoofdstuk: V
  - number: 33a.3
    text: |-
      Onze Minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn
      verstrekt te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
  - number: 33a.4
    text: |-
      Onze Minister mag de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen uitsluitend
      gebruiken voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de rechtspersoon,
      bedoeld in het eerste lid, deze wet uitvoert of heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
  - number: 33a.5
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen. [Artikel 24][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33a.6
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
  - number: 33a.7
    text: |-
      De [Wet openbaarheid van bestuur][ref1], de [Wet Nationale ombudsman][ref2] en
      [titel 9.2 van de Algemene wet bestuursrecht][ref3] zijn niet van toepassing met betrekking tot de in dit artikel
      bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0004809/2005-09-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
      - id: ref3
        bwb_id: BWBR0005537
  - number: 33b.1
    text: |-
      Onze Minister kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften
      gesteld bij of krachtens de [artikelen 4, eerste en tweede lid][ref1], [5, eerste lid][ref2],
      [6, derde, vijfde en zesde lid, eerste volzin][ref3], [8][ref4], [10][ref5], [11, eerste lid][ref6],
      [12, eerste tot en met derde en zevende lid][ref7], [12a][ref8], [14, tweede lid][ref9], [14a, tweede lid][ref10],
      [16, derde tot en met vijfde lid][ref11], [17a, eerste tot en met vierde en zesde tot en met achtste lid][ref12],
      [17b, tweede lid][ref13], [17c, tweede en derde lid][ref14], [19, tweede en derde lid][ref15], voor
      zo ver het betreft het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref16] en het
      voorschrift inzage te verlenen in zakelijke gegevens en bescheiden, [20, eerste en tweede lid][ref17],
      [21, derde en zesde lid, onder a][ref18], [22][ref19], [22a, tweede tot en met vierde lid][ref20],
      [27c, tweede en derde lid][ref21].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
