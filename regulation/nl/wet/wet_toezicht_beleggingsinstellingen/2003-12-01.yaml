preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te geven voor beleggingsinstellingen met het
    oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, en dat het
    noodzakelijk is uitvoering te geven aan de Richtlijn van de Raad van de Europese Gemeenschappen van 20 december
    1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor
    collectieve belegging in effecten (icbe's) (85/611/EEG);


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:


      a. *beleggingsmaatschappij:* de rechtspersoon die gelden of andere goederen ter collectieve belegging vraagt of
      heeft verkregen teneinde de deelnemers in de opbrengst van de beleggingen te doen delen;


      b. *beleggingsfonds:* een niet in een rechtspersoon ondergebracht vermogen waarin ter collectieve belegging
      gevraagde of verkregen gelden of andere goederen zijn of worden opgenomen teneinde de deelnemers in de opbrengst
      van de beleggingen te doen delen;


      c. *beleggingsinstelling:* beleggingsmaatschappij of beleggingsfonds;


      d. *deelnemer:* de aandeelhouder in een beleggingsmaatschappij danwel de deelgerechtigde in een ter collectieve
      belegging bijeengebracht vermogen;


      e. *beheerder:* de beleggingsmaatschappij respectievelijk degene die geheel of ten dele belast is met het beheer
      van het beleggingsfonds;


      f. *bewaarder:* degene die belast is met de bewaring van de activa van de beleggingsinstelling;


      g. effecten:


      1. aandeelbewijzen, schuldbrieven, winst- en oprichtersbewijzen, optiebewijzen, warrants, en soortgelijke
      waardepapieren;


      2. rechten van deelgenootschap, opties, rechten op overdracht op termijn van zaken, inschrijvingen in aandelen- en
      schuldregisters, en soortgelijke, al dan niet voorwaardelijke, rechten;


      3. certificaten van waarden als hiervoor bedoeld;


      4. recepissen van waarden als hiervoor bedoeld;


      h. *Onze Minister:* Onze minister van Financiën;


      i. *richtlijn:* de Richtlijn van de Raad van de Europese Gemeenschappen van 20 december 1985 tot coördinatie van
      de wettelijke en bestuursrechtelijke bepalingen betreffende bepaalde instellingen voor collectieve belegging in
      effecten (85/611/EEG, *Pb.*L375);


      j. Lid-Staat: een lid-staat van de Europese Unie alsmede een staat, niet zijnde een lid-staat van de Europese Unie,
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel1
  - number: '2'
    text: >-
      Geen effecten in de zin van deze wet zijn:


      a. waarden welke uitsluitend het karakter van betaalmiddel dragen;


      b. appartementsrechten.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel2
  - number: '3'
    text: >-
      De bepalingen van deze wet en de daarop berustende bepalingen ten aanzien van een beleggingsinstelling die een
      beleggingsfonds is, zijn gericht tot de beheerder.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden in of vanuit Nederland buiten een besloten kring gelden of andere goederen ter deelneming in een
      beleggingsinstelling waaraan geen vergunning is verleend, te vragen of te verkrijgen dan wel rechten van deelneming
      in een dergelijke beleggingsinstelling aan te bieden.

      2 Het verbod in het eerste lid is niet van toepassing op:

      a. de beleggingsinstelling als bedoeld in [artikel 17, eerste lid][ref1], indien de Lid-Staat waar de zetel is
      gelegen uitvoering aan de richtlijn heeft gegeven;

      b. de aanbieding van rechten van deelneming door natuurlijke personen anders dan in de uitoefening van hun beroep
      of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '17'
        hoofdstuk: III
  - number: '5'
    text: |-
      1 Onze Minister verleent een beleggingsinstelling, op verzoek en met inachtneming van [artikel 6][ref1],
      een vergunning indien de aanvrager aantoont dat de beleggingsinstelling en de bewaarder, indien aan de
      beleggingsinstelling verbonden, voldoen aan de bij of krachtens algemene maatregel van bestuur te stellen eisen met
      betrekking tot:

      a. deskundigheid en betrouwbaarheid;

      b. financiële waarborgen;

      c. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;

      d. aan Onze Minister, aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie; en

      e. waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels.

      Tot de regels, bedoeld in onderdeel c, behoren niet de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref2].

      2 Indien een vergunning voor een beleggingsfonds wordt gevraagd, dient de aanvrager bovendien aan te tonen dat:

      a. de beheerder een rechtspersoon met volledige rechtsbevoegdheid is;

      b. de activa van het beleggingsfonds in bewaring worden gegeven bij een van de beheerder onafhankelijke bewaarder;
      en

      c. de activa van het beleggingsfonds worden afgescheiden van het vermogen van de beheerder, van de bewaarder
      alsmede van elke natuurlijke persoon of andere rechtspersoon.

      3 Onze Minister kan op verzoek aan een aanvrager een vergunning verlenen indien de aanvrager aantoont dat
      redelijkerwijs niet volledig kan worden voldaan aan eisen gesteld bij of krachtens het eerste en tweede lid, en hij
      tevens aantoont dat de doeleinden die deze wet beoogt te bereiken anderszins voldoende bereikt zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel5
    references:
      - id: ref1
