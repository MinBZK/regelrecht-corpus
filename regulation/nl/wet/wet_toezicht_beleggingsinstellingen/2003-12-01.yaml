      1 In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.

      2 Ingeval beroep wordt ingesteld tegen een besluit als bedoeld in [artikel 33a, eerste lid][ref2], zal de
      terechtzitting worden gehouden met gesloten deuren. De uitspraak wordt alsdan niet in het openbaar uitgesproken.


