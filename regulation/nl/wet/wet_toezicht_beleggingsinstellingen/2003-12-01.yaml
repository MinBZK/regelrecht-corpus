  - number: '41'
    text: |-
      1 Op het tijdstip van inwerkingtreding van deze wet worden vergunningen en ontheffingen die op grond van
      respectievelijk [artikel 9, tweede lid][ref1], en [artikel 11, eerste lid][ref2], van de Wet effectenhandel aan een
      beleggingsfonds zijn verleend, gelijkgesteld met een vergunning als bedoeld in [artikel 5][ref3] van deze wet.

      2 Op een in het eerste lid bedoeld beleggingsfonds dat op het tijdstip van inwerkingtreding van deze wet niet
      voldoet aan de bij of krachtens [de artikelen 5][ref4] en [12, eerste lid][ref5], gestelde eisen en regels, wordt
      het bepaalde bij of krachtens die artikelen alsmede [artikel 15, onderdeel ][ref6], van toepassing een jaar na
      dat tijdstip.

      3 Het eerste lid geldt niet ten aanzien van een daarin bedoeld beleggingsfonds dat onder de omschrijving van
      [artikel 6, eerste lid][ref7], van deze wet valt.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel9
