        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33v
    text: >-
      De werkzaamheden in verband met het op grond van artikel 33n ter openbare kennis brengen van een feit worden
      verricht door personen die niet betrokken zijn geweest bij het vaststellen van het feit en het daaraan voorafgaande
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33v
  - number: '40'
    text: |-
      1 Het verbod in [artikel 4][ref1] blijft buiten toepassing tot zes maanden na het tijdstip van inwerkingtreding van
      deze wet.

      2 Ten aanzien van de beleggingsinstelling die binnen zes maanden na het tijdstip van inwerkingtreding van deze wet
      een aanvraag voor een vergunning bij Onze Minister heeft ingediend, blijft het verbod in [artikel 4][ref2] buiten
      toepassing tot de tweede dag nadat Onze Minister zijn beslissing op de aanvraag heeft verzonden.

      3 Onverminderd het bepaalde in [artikel 41][ref3], zijn het eerste en het tweede lid niet van toepassing met
      betrekking tot beleggingsfondsen die, indien de artikelen 9, 10 en 11 van de Wet effectenhandel nog van kracht
      zouden zijn geweest, ingevolge die artikelen verplicht zouden zijn geweest over een vergunning of ontheffing te
      beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel41
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel40
