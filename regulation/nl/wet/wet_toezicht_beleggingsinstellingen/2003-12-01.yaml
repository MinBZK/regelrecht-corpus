  - number: 27d
    text: |-
      1 Onze Minister kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in [artikel 27][ref1],
      deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.

      2 De verplichting, omschreven in [het derde lid van artikel 27][ref2], geldt eveneens jegens de in het eerste lid
      bedoelde functionaris.

      3 De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.


