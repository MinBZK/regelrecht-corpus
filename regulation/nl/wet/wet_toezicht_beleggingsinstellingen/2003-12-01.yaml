  - number: '14'
    text: |-
      1 Onze Minister kan vrijstelling verlenen van het in [artikel 4][ref1] vervatte verbod.

      2 Aan een vrijstelling als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die
      markten. De beperkingen kunnen uitsluitend worden gesteld ten aanzien van de reikwijdte van de vrijstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel4
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel14
