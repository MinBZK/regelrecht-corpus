  - number: '28'
    text: |-
      Onze Minister dan wel een rechtspersoon aan wie ingevolge [artikel 29, eerste lid][ref1], taken en bevoegdheden
      zijn overgedragen, is bevoegd de kosten die gemaakt worden voor de uitvoering van die taken en de uitoefening van
      die bevoegdheden aan beleggingsinstellingen in rekening te brengen volgens door Onze Minister te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel29
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel28
