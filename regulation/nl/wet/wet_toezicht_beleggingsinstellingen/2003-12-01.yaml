  - number: 27b
    text: |-
      1 Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref1] taken en bevoegdheden
      zijn overgedragen werkt, voor zover noodzakelijk ten behoeve van de uitoefening van het toezicht op
      beleggingsinstellingen die deel uitmaken van een groep, samen met de autoriteiten die ingevolge de
      [Wet toezicht kredietwezen 1992][ref2] (*Stb.* 1992, 722), de [Wet toezicht verzekeringsbedrijf 1993][ref3],
      de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref4] onderscheidenlijk de
      [Wet toezicht effectenverkeer 1995][ref5] belast zijn met het toezicht op kredietinstellingen, verzekeraars
      onderscheidenlijk effectenbemiddelaars en vermogensbeheerders die tot diezelfde groep behoren.

      2 Onze minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref6] taken en bevoegdheden zijn
      overgedragen pleegt, in de gevallen bedoeld in het eerste lid, waar nodig overleg met een autoriteit als bedoeld in
      het eerste lid.

      3

      4 Onze Minister dan wel een rechtspersoon aan wie ingevolge [artikel 29][ref7] taken en bevoegdheden zijn
      overgedragen, verstrekt aan een autoriteit als bedoeld in het eerste lid danwel de autoriteit die belast is met
      de uitvoering van de [Wet inzake de geldtransactiekantoren][ref8] de gegevens of inlichtingen die hij verkregen
      heeft bij de vervulling van de hem bij of krachtens deze wet opgedragen taak en die betrekking hebben op de
      deskundigheid en betrouwbaarheid van personen als bedoeld in de algemene maatregel van bestuur tot uitvoering van
      [artikel 5, eerste lid, onder ][ref9], voor zover Onze Minister dan wel de rechtspersoon als bovenbedoeld, van
      oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die
      andere autoriteit wordt uitgeoefend.

      5 De verplichting als bedoeld in het vierde lid geldt niet in het geval de gegevens of inlichtingen zijn verkregen
      van een buitenlandse instantie als bedoeld in [artikel 27, eerste lid][ref10].


