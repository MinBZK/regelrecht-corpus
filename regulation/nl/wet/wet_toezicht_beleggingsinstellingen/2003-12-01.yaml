  - number: '19'
    text: |-
      1 Onze Minister kan bij:

      a. een aanvrager van een vergunning;

      b. een beleggingsinstelling;

      c. een bewaarder;

      d. degene op wie een vrijstelling als bedoeld in [artikel 14][ref1] van toepassing is;

      e. degene die deel uitmaakt van een groep waartoe een beleggingsinstelling behoort;

      f. een onderneming of instelling waarvan redelijkerwijs kan worden vermoed dat deze handelt in strijd met de bij of
      krachtens deze wet gestelde regels,

      alle inlichtingen inwinnen of doen inwinnen, die redelijkerwijs nodig zijn voor de uitoefening van de taken en
      bevoegdheden die Onze Minister op grond van deze wet heeft en teneinde na te gaan of de bij of krachtens deze wet
      gestelde bepalingen worden nageleefd.

      2 Degene van wie de inlichtingen, bedoeld in het eerste lid, worden verlangd, verstrekt deze binnen de door Onze
      Minister te stellen termijn.

      3 Ten aanzien van de personen die door Onze Minister zijn belast met het inwinnen van inlichtingen of met
      de uitoefening van andere taken en bevoegdheden die Onze Minister heeft op grond van het bij of krachtens
      deze wet bepaalde, zijn de [artikelen 5:12][ref2], [5:13][ref3],[ 5:15][ref4], [5:16][ref5], [5:17][ref6] en
      [5:20 van de Algemene wet bestuursrecht][ref7] van overeenkomstige toepassing, met dien verstande dat indien een
      onderzoek als bedoeld in [artikel 27b][ref8], eerste lid, wordt ingesteld, degene bij wie het onderzoek wordt
      ingesteld en die niet ingevolge deze wet onder toezicht staat, slechts is gehouden tot het verlenen van inzage in
      zakelijke gegevens en bescheiden.


