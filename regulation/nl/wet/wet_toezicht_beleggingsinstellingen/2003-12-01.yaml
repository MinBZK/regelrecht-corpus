  - number: '12'
    text: |-
      1 Een beleggingsinstelling waaraan een vergunning is verleend en de bewaarder, indien aan de instelling verbonden,
      houden zich aan bij of krachtens algemene maatregel van bestuur te stellen regels ten aanzien van:

      a. deskundigheid en betrouwbaarheid;

      b. financiële waarborgen;

      c. bedrijfsvoering, waaronder maatregelen gericht op het bevorderen en handhaven van een integere bedrijfsvoering;

      d. aan Onze Minister, aan de deelnemers in de beleggingsinstelling en aan het publiek te verstrekken informatie; en

      e. waarborgen voor een adequaat toezicht op de naleving van de bij of krachtens deze wet gestelde regels.

      Tot de regels, bedoeld in onderdeel c, behoren niet de effectentypische gedragsregels, bedoeld in
      [artikel 18a van de Wet toezicht effectenverkeer 1995][ref1].

      2 Degenen, die middellijk of onmiddellijk bevoegd zijn bestuurders van een beleggingsinstelling respectievelijk
      van de bewaarder, indien aan de instelling verbonden, te benoemen of te ontslaan, houden zich aan bij of krachtens
      algemene maatregel van bestuur te stellen regels ten aanzien van betrouwbaarheid. Onder bestuurder wordt begrepen
      een ieder die de beleggingsinstelling of bewaarder krachtens wet, statuten of reglementen vertegenwoordigt dan wel
      binnen de beleggingsinstelling respectievelijk binnen de bewaarder het beleid bepaalt.

      3 Een beleggingsinstelling waaraan op grond van [artikel 6][ref2] een vergunning is verleend en de bewaarder,
      indien aan de instelling verbonden, houden zich bovendien aan de bij of krachtens algemene maatregel van bestuur te
      stellen aanvullende regels met betrekking tot financiële waarborgen, het beleggen en informatieverschaffing.

      4 Onze Minister kan op verzoek van de beleggingsinstelling bepalen, dat zij of de bewaarder, indien aan de
      instelling verbonden, niet behoeft te voldoen aan alle in het eerste, tweede of derde lid bedoelde regels indien
      zij aantoont dat daaraan redelijkerwijs niet volledig kan worden voldaan en dat de doeleinden die deze wet beoogt
      te bereiken anderszins voldoende bereikt zijn. Onze Minister kan een beschikking als hiervoor bedoeld wijzigen of
      intrekken indien naar zijn oordeel de omstandigheden waaronder de beschikking is gegeven zodanig zijn gewijzigd dat
      de doeleinden die deze wet beoogt te bereiken niet langer worden bereikt.

      5 De accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3], die op grond
      van de regels, bedoeld in het eerste of tweede lid, de jaarrekening van een beleggingsinstelling van een verklaring
      moet voorzien, meldt Onze Minister zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van zijn
      desbetreffende werkzaamheden kennis heeft gekregen en die:

      a. in strijd is met de eisen die voor het verkrijgen van de vergunning zijn gesteld;

      b. in strijd is met de bij of krachtens deze wet opgelegde verplichtingen;

      c. het voortbestaan van de beleggingsinstelling bedreigt; of

      d. leidt tot weigering van het afgeven van een verklaring omtrent de getrouwheid of tot het maken van voorbehouden.

      6 Op de accountant, bedoeld in het vijfde lid, die naast zijn werkzaamheden voor de beleggingsinstelling
      ook werkzaamheden uitvoert voor een andere onderneming of instelling, is de meldingsplicht, bedoeld in het
      vijfde lid, van overeenkomstige toepassing indien de beleggingsinstelling dochtermaatschappij is van de andere
      onderneming of instelling, dan wel indien de andere onderneming of instelling dochtermaatschappij is van de
      beleggingsinstelling. Voor de toepassing van de eerste volzin wordt onder dochtermaatschappij verstaan een
      dochtermaatschappij als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref4], met dien verstande
      dat een beleggingsinstelling tevens dochtermaatschappij kan zijn van een natuurlijk persoon of vennootschap.

      7 Onverminderd het bepaalde in het vijfde en het zesde lid verstrekt de accountant, bedoeld in het vijfde lid, aan
      Onze Minister zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig zijn ten behoeve van het toezicht op
      de naleving van deze wet met betrekking tot bij algemene maatregel van bestuur aan te wijzen onderwerpen.

      8 De accountant die op grond van het vijfde of zesde lid tot een melding of op grond van het zevende lid tot
      het geven van inlichtingen aan Onze Minister is overgegaan, is niet aansprakelijk voor schade die een derde
      dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid
      niet tot melding of tot het geven van inlichtingen had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
