  - number: 27c
    text: |-
      1 Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, is Onze Minister bevoegd ten behoeve
      van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met Nederland
      valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat belast is met de
      uitvoering van wettelijke regelingen inzake het toezicht op beleggingsinstellingen, inlichtingen te vragen aan of
      een onderzoek in te stellen of te doen instellen bij een ieder die ingevolge deze wet onder zijn toezicht valt dan
      wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij over gegevens of inlichtingen beschikt die van
      belang kunnen zijn voor de uitvoering van de wettelijke regelingen als hiervoor bedoeld.

      2 Degene bij wie een onderzoek als bedoeld in [artikel 27b, eerste lid][ref1], wordt ingesteld, verleent aan de
      in het eerste lid bedoelde functionaris alle medewerking die nodig is voor een goede uitvoering van dat onderzoek,
      met dien verstande dat degene bij wie het onderzoek wordt ingesteld en die niet ingevolge deze wet onder toezicht
      staat, slechts is gehouden tot het verlenen van inzage in zakelijke gegevens en bescheiden.

      3 Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, verleent aan de persoon die het
      onderzoek verricht alle medewerking die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      zakelijke gegevens en bescheiden voor zover deze op de uitoefening van zijn beroep of bedrijf betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel27b
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel27c
