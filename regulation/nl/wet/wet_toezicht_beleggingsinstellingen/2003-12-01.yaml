  - number: '6'
    text: |-
      1 De aanvrager van een vergunning voor een beleggingsinstelling:

      a. waarvan het statutaire of reglementaire doel uitsluitend is het beleggen in effecten met toepassing van het
      beginsel van risicospreiding;

      b. waarvan de rechten van deelneming op verzoek van de deelnemer ten laste van de activa rechtstreeks of middellijk
      worden ingekocht of terugbetaald; en

      c. waarvan de zetel of, wanneer het een beleggingsfonds betreft, die van de beheerder, in Nederland is gelegen;

      moet bovendien aantonen dat de beleggingsinstelling en de bewaarder, indien aan de beleggingsinstelling verbonden,
      voldoen aan het tweede tot en met het zesde lid.

      2 Het hoofdkantoor van de beleggingsmaatschappij dan wel van de beheerder van het beleggingsfonds is in Nederland
      gelegen.

      3 De werkzaamheden van de beheerder van het beleggingsfonds zijn beperkt tot het beheer van beleggingsinstellingen.

      4 De beleggingsinstelling vervult geen andere werkzaamheden dan die bedoeld in het eerste lid.

      5 De activa van de beleggingsmaatschappij worden in bewaring gegeven bij een van haar onafhankelijke bewaarder.
      Bij of krachtens algemene maatregel van bestuur kan voor beleggingsmaatschappijen van dit vereiste worden afgeweken
      overeenkomstig de bij of krachtens die maatregel te stellen regels.

      6 De bewaarder van de beleggingsinstelling heeft zijn zetel in een Lid-Staat en heeft een vestiging in Nederland.

      7 [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel6
    references:
      - id: ref1
