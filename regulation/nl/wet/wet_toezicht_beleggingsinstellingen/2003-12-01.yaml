  - number: '21'
    text: >-
      Indien de beleggingsinstelling waaraan een vergunning is verleend of de bewaarder, indien aan de
      beleggingsinstelling verbonden, niet blijkt te voldoen aan de bij en krachtens deze wet gestelde eisen, regels,
      beperkingen of gegeven voorschriften, kan Onze Minister aan de instelling of de bewaarder een aanwijzing geven om
      binnen een door hem te stellen termijn daaraan alsnog te voldoen.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel21
  - number: 21a
    text: >-
      Indien een accountant naar het oordeel van Onze Minister niet of niet meer de nodige waarborgen biedt dat deze
      de toevertrouwde taak met betrekking tot de beleggingsinstelling naar behoren zal vervullen, kan Onze Minister
      bepalen dat hij niet bevoegd is de in deze wet en daaruit voortvloeiende besluiten bedoelde verklaringen omtrent de
      getrouwheid met betrekking tot die beleggingsinstelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel21a
  - number: '22'
    text: >-
      1 Indien bijzondere gebeurtenissen een adequate functionering van de beleggingsinstelling of de bewaarder in
      gevaar brengen en naar het oordeel van Onze Minister versterking van de organen van de beleggingsinstelling of de
      bewaarder wenselijk maken, kan Onze Minister schriftelijk aanzeggen dat vanaf een bepaald tijdstip alle of bepaalde
      organen van de beleggingsinstelling of van de bewaarder hun bevoegdheden slechts mogen uitoefenen na goedkeuring
      door een of meer door Onze Minister aangewezen personen en met inachtneming van de opdrachten van deze personen.


      2 Met betrekking tot de in het eerste lid bedoelde aanzegging is het volgende van toepassing:


      a. de in dat lid bedoelde organen zijn verplicht de door Onze Minister aangewezen personen alle medewerking te
      verlenen;


      b. Onze Minister kan de organen toestaan bepaalde handelingen zonder toestemming te verrichten;


      c. Onze Minister kan de aangewezen personen te allen tijde door andere vervangen;


      d. voor schade ten gevolge van handelingen welke zijn verricht in strijd met een aanzegging als bedoeld in
      het eerste lid zijn degenen, die deze handelingen als orgaan van de beleggingsinstelling of van de bewaarder
      verrichten, persoonlijk aansprakelijk tegenover de beleggingsinstelling of de bewaarder. De beleggingsinstelling
      of de bewaarder kan de ongeldigheid van deze handelingen inroepen, indien de wederpartij wist, dat de vereiste
      goedkeuring ontbrak of daarvan niet onkundig kon zijn;


      e. de aanzegging blijft van kracht totdat de in het eerste lid bedoelde omstandigheden niet langer aanwezig zijn,
      doch voor ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel22
  - number: 22a
    text: >-
      1 Indien tot de personen, die middellijk of onmiddellijk bevoegd zijn bestuurders van een beleggingsinstelling
      respectievelijk van de bewaarder, indien aan de instelling verbonden, te benoemen of te ontslaan, iemand
      behoort, die niet voldoet aan de op grond van artikel 12, tweede lid, gestelde regels met betrekking tot zijn
      betrouwbaarheid, kan Onze Minister die personen de aanwijzing geven dat degene, wiens betrouwbaarheid niet aan deze
      regels voldoet, deze bevoegdheid niet meer mag uitoefenen.


      2 De personen tot wie de aanwijzing is gericht, volgen deze binnen een door Onze Minister te stellen termijn op.


      3 De personen tot wie de aanwijzing is gericht, informeren Onze Minister binnen de gestelde termijn over de
      maatregelen die zijn getroffen om aan de aanwijzing gevolg te geven.


      4 De beleggingsinstelling of de bewaarder geeft geen gevolg aan algemene of bijzondere instructies van degene, op
      wie een aanwijzing van Onze Minister als bedoeld in het eerste lid betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel22a
  - number: '23'
    text: |-
      Indien een beleggingsinstelling de inkoop van haar rechten van deelneming opschort, stelt zij Onze Minister en,
      indien zij een beleggingsinstelling is als bedoeld in [artikel 6, eerste lid][ref1], het bevoegde gezag van de
      Lid-Staten waar de rechten van deelneming van de beleggingsinstelling worden verhandeld onverwijld daarvan op de
      hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
