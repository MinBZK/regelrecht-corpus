        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: '7'
    text: |-
      [Artikel 6][ref1] is niet van toepassing op een in dat artikel omschreven beleggingsinstelling die:

      a. geen gelden of andere goederen van het publiek van de Lid-Staten ter belegging vraagt of verkrijgt;

      b. krachtens haar statuten of reglementen, haar rechten van deelneming slechts bij het publiek in landen buiten de
      Lid-Staten mag plaatsen;

      c. behoort tot één van de door Onze Minister aangewezen soorten beleggingsinstellingen waarvoor de bij en krachtens
      [artikel 12, tweede lid][ref2], gestelde regels met betrekking tot het beleggen, gelet op hun beleid inzake
      beleggingen of het aangaan van leningen, niet geschikt zijn; of

      d. haar activa via dochtermaatschappijen voornamelijk belegt in andere objecten dan effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel7
    references:
