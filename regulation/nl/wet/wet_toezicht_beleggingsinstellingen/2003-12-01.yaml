  - number: 33d
    text: |-
      1 Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de
      boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt. Voor overtreding van voorschriften,
      gesteld bij of krachtens een algemene maatregel van bestuur op grond van [de artikelen 5, eerste lid][ref1],
      [6, vijfde lid, tweede volzin][ref2], of [12, eerste, tweede, derde en zevende lid][ref3], wordt het bedrag van
      de boete bepaald op de wijze als voorzien in de bijlage behorend bij die algemene maatregel van bestuur, met dien
      verstande dat de boete voor een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.

      2 De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.

      3 De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.

      4 Onze Minister kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel12
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33d
