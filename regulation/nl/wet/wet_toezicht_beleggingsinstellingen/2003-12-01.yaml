  - number: '18'
    text: |-
      1 Onze Minister houdt een register, waarin worden ingeschreven:

      a. beleggingsinstellingen waaraan een vergunning is verleend, met inbegrip van de aan de vergunning gestelde
      beperkingen of verbonden voorschriften;

      b. beleggingsinstellingen die op grond van [artikel 17][ref1] tot de verhandeling van hun rechten van deelneming
      mogen overgaan;

      c. beleggingsinstellingen als bedoeld in [artikel 41, eerste lid][ref2].

      2 De inschrijving van een beleggingsinstelling waarvan de vergunning is ingetrokken wordt doorgehaald, evenals
      de inschrijving van de beleggingsinstelling als bedoeld in [artikel 17][ref3] die niet langer in Nederland haar
      rechten van deelneming aanbiedt of waaraan ingevolge [artikel 17, zevende lid][ref4], is verboden in Nederland haar
      deelnemingsrechten aan te bieden.

      3 De inschrijving van een beleggingsinstelling, en de aan haar vergunning gestelde beperkingen en verbonden
      voorschriften, alsmede de doorhaling worden binnen twee weken na de dag, waarop zij heeft plaatsgehad, medegedeeld
      in de *Staatscourant*.

      4 Onze Minister kan bepalen dat de in het derde lid bedoelde mededeling van een doorhaling tot een nader door hem
      te bepalen tijdstip wordt aangehouden indien openbaarmaking ernstige schade aan de belangen van de deelnemers zou
      kunnen toebrengen.

      5 In de maand januari van elk jaar wordt een lijst van de ingeschreven beleggingsinstellingen naar de stand per 31
      december van het voorafgaande jaar in de *Staatscourant* geplaatst.

      6 Onze Minister houdt een afschrift van het register voor een ieder kosteloos ter inzage.


