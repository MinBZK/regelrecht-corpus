  - number: 26a
    text: |-
      1 Onze Minister is, in afwijking van [artikel 24, eerste en tweede lid][ref1], bevoegd om gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, te verstrekken aan een rechter-
      commissaris voor zover die belast is met het toezicht uit hoofde van [artikel 64 van de Faillissementswet][ref2] op
      de curator die betrokken is bij het beheer en de vereffening van de failliete boedel van een beleggingsinstelling.

      2 Onze Minister verstrekt geen gegevens of inlichtingen als bedoeld in het eerste lid:

      a. indien de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de
      belangen die deze wet beoogt te beschermen;

      b. indien de gegevens of inlichtingen zijn verkregen van Nederlandse of buitenlandse overheidsinstanties dan
      wel van Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht
      op financiële markten of op natuurlijke personen en rechtspersonen die op die markten werkzaam zijn, en deze
      instanties niet instemmen met het verstrekken van de gegevens of inlichtingen.

      3 [Artikel 24, eerste tot en met vierde lid][ref3], zijn van overeenkomstige toepassing met betrekking tot de op
      grond van het eerste lid verstrekte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel64
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel24
