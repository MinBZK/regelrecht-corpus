        artikel: 33n
        hoofdstuk: VIIC
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '74'
      - id: ref3
        bwb_id: BWBR0004809
        artikel: 33n
        hoofdstuk: VIIC
  - number: 33u
    text: |-
      1 De bevoegdheid om op grond van [artikel 33n][ref1] een feit ter openbare kennis te brengen vervalt drie jaren na
      de dag waarop het feit heeft plaats gehad.

      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij het feit ter
      openbare kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel33n
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33u
    references:
