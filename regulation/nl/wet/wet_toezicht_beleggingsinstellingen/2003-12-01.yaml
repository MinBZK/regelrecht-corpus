        hoofdstuk: II
        paragraaf: '3'
  - number: '8'
    text: >-
      Aan een vergunning kunnen beperkingen worden gesteld en voorschriften worden verbonden met het oog op een adequate
      werking van de financiële markten en de positie van de beleggers op die markten, indien feiten en omstandigheden
      die betrekking hebben op degene voor wie de vergunning zal gelden dit vereisen. De beperkingen kunnen uitsluitend
      worden gesteld ten aanzien van de reikwijdte en de tijdsduur van de vergunning.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel8
  - number: '9'
    text: >-
      Als bewaarder mag slechts optreden een rechtspersoon die in belangrijke mate zijn bedrijf maakt van het bewaren en
      administreren van beleggingsobjecten ten behoeve van derden.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel9
  - number: '10'
    text: >-
      Indien Onze Minister van oordeel is dat van de in Nederland gevoerde of te voeren naam van de beleggingsinstelling
      gevaar voor verwarring is te duchten, verlangt hij van de beleggingsinstelling een verklarende vermelding aan de
      naam toe te voegen.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel10
  - number: '11'
    text: |-
      1 Het is de beleggingsinstelling waaraan op grond van [artikel 6][ref1] een vergunning is verleend, verboden haar
      statuten of reglementen zodanig te wijzigen dat zij niet meer onder de toepassing van [artikel 6][ref2] valt.

      2 Een wijziging van de statuten of reglementen, als bedoeld in het eerste lid, is nietig. Op verzoek van het
      openbaar ministerie benoemt de rechter een bewindvoerder met de macht om de gevolgen van de nietige handeling
      ongedaan te maken.

      3 Bij het ongedaan maken van de nietige handeling dient de bewindvoerder mede te handelen in het belang van de
      deelnemers in de beleggingsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel11
