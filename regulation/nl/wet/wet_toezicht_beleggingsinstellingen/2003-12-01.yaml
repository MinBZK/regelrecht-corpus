    text: |-
      Onze Minister kan een organisatie van beleggingsinstellingen of bewaarders, de rechtspersoon of rechtspersonen als
      bedoeld in [artikel 29, eerste lid][ref1], gehoord, aanwijzen als representatieve organisatie met betrekking tot de
      uitvoering van deze wet.


