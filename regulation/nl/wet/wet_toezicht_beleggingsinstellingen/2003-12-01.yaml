        artikel: '29'
        hoofdstuk: V
  - number: '29'
    text: |-
      1 Taken en bevoegdheden die Onze Minister op grond van deze wet heeft, kunnen, met uitzondering van de taken en
      bevoegdheden bedoeld in [de artikelen 7, onder c,][ref1][14][ref2], [28][ref3], voor zover het daarbij de door
      Onze Minister te stellen regels betreft, [30][ref4], [32][ref5], [33b, derde lid][ref6], [33c, derde lid][ref7]
      en [33m, tweede lid][ref8] en [33a][ref9], bij algemene maatregel van bestuur worden overgedragen aan een of meer
      rechtspersonen die deze als eigen taken uitvoeren en als eigen bevoegdheden uitoefenen. De verplichtingen jegens
      Onze Minister op grond van deze wet gelden alsdan als verplichtingen jegens de desbetreffende rechtspersoon of
      rechtspersonen.

      2 Een overdracht als bedoeld in het eerste lid vindt slechts plaats indien de betrokken rechtspersoon aan de
      volgende eisen voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taken en bevoegdheden naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de betrokken rechtspersoon
      dat een onafhankelijke vervulling van de in het eerste lid bedoelde taken en bevoegdheden zoveel mogelijk is
      gewaarborgd.

      3 Aan de overdracht als bedoeld in het eerste lid kunnen beperkingen worden gesteld en voorschriften worden
      verbonden.

      4 Indien bij algemene maatregel van bestuur taken en bevoegdheden als bedoeld in het eerste lid zijn overgedragen
      aan De Nederlandsche Bank N.V., is de Bank bevoegd deze taken uit te voeren en deze bevoegdheden uit te oefenen.

      5 Voor de totstandkoming, wijziging of intrekking van algemene maatregelen van bestuur als bedoeld in
      [artikel 5, eerste lid][ref10], [artikel 6, vijfde lid][ref11], en [artikel 12, eerste en tweede lid][ref12],
      een aanwijzing als bedoeld in [artikel 7, onder c][ref13], een vrijstelling als bedoeld in
      [artikel 14, eerste lid][ref14], de door Onze Minister te stellen regels als bedoeld in [artikel 28][ref15] en
      een maatregel als bedoeld in [artikel 30][ref16], kan het advies van de in het eerste lid bedoelde rechtspersoon
      of rechtspersonen worden ingewonnen. De rechtspersoon aan wie advies wordt gevraagd is verplicht dit advies uit
      te brengen.

      6 Een in het eerste lid bedoelde rechtspersoon brengt eenmaal per jaar, uiterlijk op 1 mei, aan Onze Minister
      verslag uit over de uitoefening van de overgedragen taken en bevoegdheden op grond van deze wet. Dit verslag
      wordt door de zorg van Onze Minister gepubliceerd, behoudens het gedeelte handelende over de uitvoering van
      [artikel 5, derde lid][ref17], [artikel 6, zevende lid][ref18], [artikel 12, derde lid][ref19], [artikel 21][ref20]
      en [artikel 22][ref21], met dien verstande dat, zonder schriftelijke toestemming van de bij het te publiceren
      gedeelte van het verslag betrokkenen, gegevens met betrekking tot afzonderlijke beleggingsinstellingen en
      bewaarders niet gepubliceerd worden.


