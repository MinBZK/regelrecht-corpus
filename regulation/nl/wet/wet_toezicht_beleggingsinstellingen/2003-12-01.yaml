        paragraaf: '1'
  - number: '15'
    text: |-
      Onze Minister kan een vergunning slechts intrekken:

      a. op verzoek van de houder;

      b. indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning zodanig onjuist of
      onvolledig blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek
      de juiste omstandigheden volledig bekend waren geweest;

      c. indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij voor het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan, of bekend waren geweest, de vergunning zou zijn geweigerd;

      d. indien de vergunninghouder of de aan de beleggingsinstelling verbonden bewaarder kennelijk de in
      [artikel 5][ref1], [artikel 6][ref2] of [artikel 9][ref3] bedoelde werkzaamheden niet meer uitvoert;

      e. indien de beleggingsinstelling of de daaraan verbonden bewaarder niet meer voldoet aan de bij of krachtens deze
      wet gestelde eisen, regels of beperkingen of gegeven voorschriften;

      f. indien de beleggingsinstelling of de daaraan verbonden bewaarder niet of niet genoegzaam uitvoering heeft
      gegeven aan een aanwijzing of een aanzegging van Onze Minister als bedoeld in [artikel 21][ref4] respectievelijk
      [artikel 22][ref5].


