  - number: '13'
    text: |-
      1 Een beleggingsinstelling waaraan op grond van [artikel 6][ref1] een vergunning is verleend en die voornemens
      is haar rechten van deelneming in een andere Lid-Staat te verhandelen, dient, alvorens daartoe over te gaan, Onze
      Minister alsmede het bevoegde gezag in die andere Lid-Staat van haar voornemen in kennis te stellen.

      2 Onze Minister verstrekt, op verzoek, aan de beleggingsinstelling waaraan op grond van [artikel 6][ref2] een
      vergunning is verleend en die voldoet aan de in [artikel 12][ref3] bedoelde regels, een verklaring dat zij voldoet
      aan de voorwaarden van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel6
