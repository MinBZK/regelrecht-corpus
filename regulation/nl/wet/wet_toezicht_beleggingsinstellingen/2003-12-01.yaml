  - number: '17'
    text: |-
      1 De beleggingsinstelling die haar zetel of een beheerder met zetel in een andere Lid-Staat heeft en overigens
      voldoet aan de in [artikel 6, eerste lid, onderdelen ][ref1], gegeven omschrijving, is verplicht aan Onze minister
      mededeling te doen van haar voornemen haar rechten van deelneming in Nederland buiten een besloten kring aan te
      bieden.

      2 Bij de mededeling legt de beleggingsinstelling over:

      a. een verklaring van het bevoegde gezag van de Lid-Staat waar haar zetel of die van haar beheerder is gevestigd,
      dat de instelling voldoet aan de voorwaarden van de richtlijn;

      b. haar statuten of reglementen;

      c. haar prospectus;

      d. gegevens over de beoogde wijze van informatieverschaffing, van verhandeling van, uitkeringen op alsmede inkoop
      van of terugbetaling op rechten van deelneming in Nederland;

      e. in voorkomend geval haar laatste jaarrekening en halfjaarcijfers.

      3 Een beleggingsinstelling als bedoeld in het eerste lid moet in ten minste de Nederlandse taal de gegevens en
      bescheiden verschaffen, die zij openbaar dient te maken overeenkomstig de regels gesteld door de Lid-Staat waar
      haar zetel of die van haar beheerder is gevestigd.

      4 Twee maanden na de mededeling overeenkomstig het bepaalde in het eerste, tweede en derde lid, kan de
      beleggingsinstelling overgaan tot de verhandeling van haar rechten van deelneming, tenzij Onze minister voordien
      heeft bekendgemaakt:

      a. dat de voornemens als bedoeld in onderdeel *d* van het tweede lid niet in overeenstemming zijn met toepasselijke
      Nederlandse wettelijke bepalingen; of

      b. dat de beoogde wijze van verhandeling in strijd is met wettelijke voorschriften die betrekking hebben op het
      niet door de richtlijn bestreken gebied.

      5 [Artikel 10][ref2] is op de in het eerste lid bedoelde beleggingsinstelling van toepassing.

      6 De beleggingsinstelling als bedoeld in het eerste lid dient, met inachtneming van toepasselijke Nederlandse
      wettelijke bepalingen, de nodige maatregelen te treffen opdat wordt zorggedragen voor de uitkeringen op, de inkoop
      van of terugbetaling op de rechten van deelneming in Nederland alsmede voor de verschaffing van de informatie die
      de beleggingsinstelling in Nederland moet verstrekken.

      7 Indien een beleggingsinstelling als bedoeld in het eerste lid in strijd handelt met een voorschrift als bedoeld
      in het eerste tot en met het zesde lid, kan Onze minister deze beleggingsinstelling verbieden in Nederland haar
      rechten van deelneming aan te bieden of voorschriften geven met betrekking tot het aanbieden van deze rechten.

      8 Van een besluit op grond van het zevende lid doet Onze minister onverwijld mededeling aan het bevoegde gezag
      in de Lid-Staat waar de zetel van de beleggingsinstelling of die van haar beheerder is gevestigd alsmede aan
      het bevoegde gezag in de overige Lid-Staten waar, voor zover hem bekend is, de rechten van deelneming worden
      verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel10
