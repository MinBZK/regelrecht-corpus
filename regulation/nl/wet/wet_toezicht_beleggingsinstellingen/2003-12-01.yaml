        bwb_id: BWBR0004809
        artikel: 33c
        hoofdstuk: VII_B
  - number: 33k
    text: >-
      1 De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.


      2 De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete
      wordt opgelegd.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33k
  - number: 33l
    text: >-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33l
  - number: 33m
    text: |-
      1 Met het oog op een adequate werking van de financiële markten en de positie van de beleggers op die markten, kan
      Onze Minister, onverminderd [artikel 19, vijfde lid][ref1], en [artikel 24][ref2], het feit ter zake waarvan de
      last onder dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en
      de woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis
      brengen.

      2 Onze Minister kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel24
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33m
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '19'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '24'
        hoofdstuk: V
  - number: 33n
    text: |-
      Onze Minister kan, in afwijking van [artikel 24][ref1], teneinde de naleving van deze wet te bevorderen ter
      openbare kennis brengen:

      a. het feit dat aan een beleggingsinstelling waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 4, eerste lid][ref2], van toepassing is, een aangevraagde vergunning is geweigerd, wanneer deze weigering
      niet meer in beroep kan worden getroffen en de aanvrager handelt als was hem de vergunning verleend;

      b. het feit dat een beleggingsinstelling waarop naar zijn oordeel het verbod, bedoeld in
      [artikel 4, eerste lid][ref3], van toepassing is, niet over een vergunning beschikt dan wel geen mededeling heeft
      gedaan als bedoeld in [artikel 17, eerste lid][ref4];

      c. het feit dat degene op wie een vrijstelling als bedoeld in [artikel 14][ref5] van toepassing is, zich niet houdt
      aan de voorschriften die aan die vrijstelling zijn verbonden;

      d. zijn bekendmaking, bedoeld in [artikel 17, vierde lid][ref6], wanneer deze bekendmaking niet meer in beroep
      kan worden getroffen en de beleggingsinstelling haar rechten van deelneming in Nederland ondanks deze bekendmaking
      buiten een besloten kring heeft aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004809#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004809#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0004809#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0004809#Artikel17
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel33n
