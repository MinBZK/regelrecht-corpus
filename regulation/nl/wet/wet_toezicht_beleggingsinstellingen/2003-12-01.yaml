  - number: '30'
    text: >-
      Onze Minister kan bepalen dat een vergunning op grond van deze wet wordt geweigerd of ingetrokken, of dat aan de
      vergunning beperkingen worden gesteld en voorschriften worden verbonden, dan wel dat de eerder gestelde beperkingen
      en gegeven voorschriften worden gewijzigd, indien:


      a. de beleggingsinstelling haar zetel heeft of haar beheerder zijn zetel heeft in een Staat, niet zijnde een Lid-
      Staat, waar Nederlandse financiële instellingen niet worden toegelaten of aan onredelijke beperkingen worden
      onderworpen; of


      b. een natuurlijke persoon of rechtspersoon met de nationaliteit van een onder *a* bedoelde Staat rechtstreeks of
      middellijk overwegende zeggenschap kan uitoefenen in de beleggingsinstelling.
    url: https://wetten.overheid.nl/BWBR0004809/2003-12-01#Artikel30
  - number: '31'
    text: |-
      Onze Minister kan ten aanzien van de beleggingsinstelling die onder de omschrijving in
      [artikel 6, eerste lid, onderdelen ][ref1], valt en die niet in een Lid-Staat is gevestigd dan wel in een Lid-
      Staat is gevestigd die nog geen uitvoering aan de richtlijn heeft gegeven, het bepaalde bij of krachtens
      [artikel 6, derde tot en met zevende lid][ref2], alsmede [artikel 12, tweede lid][ref3], van overeenkomstige
      toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
