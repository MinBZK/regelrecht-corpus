  - number: 33c
    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften gesteld, bij
      of krachtens [de artikelen 4, eerste lid][ref1], [5, eerste lid][ref2], [6, vijfde lid, tweede volzin][ref3],
      [8][ref4], [10][ref5], [11, eerste lid][ref6], [12, eerste, tweede, derde, vijfde, zesde en zevende lid][ref7],
      [13, eerste lid][ref8], [14, tweede lid][ref9], [16, derde en vierde lid][ref10],
      [17, eerste tot en met derde en vijfde tot en met zevende lid][ref11],[ 19, tweede en derde lid][ref12], voor
      zover het betreft het voorschrift van [artikel 5:20 van de Algemene wet bestuursrecht][ref13] en het voorschrift
      inzage te verlenen in zakelijke gegevens en bescheiden, [20][ref14], [21][ref15], [22, tweede lid][ref16],
      [22a, tweede tot en met het vierde lid][ref17], [23][ref18], [27b, tweede lid][ref19], en [27c, tweede lid][ref20].

      2 De bestuurlijke boete komt toe aan de staat. Voor zover Onze Minister met toepassing van
      [artikel 29, eerste lid][ref21], de bevoegdheid tot het opleggen van een bestuurlijke boete overdraagt aan een
      rechtspersoon, komt de boete toe aan die rechtspersoon.

      3 Onze Minister, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de uitoefening
      van de bevoegdheid bedoeld in het eerste lid.


