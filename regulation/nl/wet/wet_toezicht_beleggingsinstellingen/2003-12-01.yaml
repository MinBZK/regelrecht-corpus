  - number: '16'
    text: |-
      1 Onze Minister deelt de intrekking van een op grond van [artikel 6][ref1] verleende vergunning tegelijk mede aan
      de beleggingsinstelling, de bewaarder indien aan de beleggingsinstelling verbonden en het bevoegde gezag in de
      overige Lid-Staten.

      2 Een beleggingsmaatschappij waarvan de vergunning is ingetrokken wordt op verzoek van Onze Minister door de
      rechtbank ontbonden.

      3 Het vermogen van een beleggingsfonds waarvan de vergunning is ingetrokken moet worden vereffend binnen een door
      Onze Minister te bepalen termijn. Hij kan deze termijn verlengen. Hij kan een of meer vereffenaars aanwijzen die
      aan hem verantwoording schuldig zijn.

      4 Onze Minister kan ten aanzien van het beleggingsfonds waaraan op grond van [artikel 5][ref2] een vergunning
      is verleend ontheffing verlenen van het bepaalde in het derde lid, indien de werkzaamheden van het fonds worden
      voortgezet in een besloten kring. Aan een ontheffing kunnen in het belang van de deelnemers beperkingen worden
      gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel5
