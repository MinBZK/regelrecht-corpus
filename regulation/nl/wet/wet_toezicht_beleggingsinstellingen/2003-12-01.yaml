  - number: 27a
    text: |-
      1 Onze Minister werkt samen met de autoriteiten die ingevolge de [Wet toezicht effectenverkeer 1995][ref1],
      de [Wet toezicht kredietwezen 1992][ref2], de [Wet toezicht natura-uitvaartverzekeringsbedrijf][ref3]
      onderscheidenlijk de [Wet toezicht verzekeringsbedrijf 1993][ref4], belast zijn met het toezicht op
      effecteninstellingen, kredietinstellingen, natura-uitvaartverzekeraars onderscheidenlijk verzekeraars, met het oog
      op het tot stand brengen van gelijkgerichte regelgeving en beleid ter zake van bij ministeriële regeling aan te
      wijzen onderwerpen die zowel het toezicht ingevolge deze wet als het toezicht ingevolge een van de eerdergenoemde
      wetten betreffen.

      2 Onze Minister voert het toezicht ingevolge deze wet, voor zover het betrekking heeft op de onderwerpen, bedoeld
      in het eerste lid, uit met inachtneming van daartoe met de overige in het eerste lid bedoelde autoriteiten te
      sluiten overeenkomsten. Deze overeenkomsten bevatten afspraken over coördinatie en afstemming van regelgeving
      en beleid, en in voorkomende gevallen over uitvoering van toezicht. Indien ingevolge [artikel 29][ref5] taken en
      bevoegdheden die Onze Minister op grond van deze wet heeft zijn overgedragen aan een rechtspersoon, draagt deze
      rechtspersoon er zorg voor dat hij of een van de overige in het eerste lid bedoelde autoriteiten een afschrift van
      de gesloten overeenkomsten zendt aan Onze Minister.

      3 Binnen zes maanden na afloop van elk kalenderjaar draagt Onze Minister in samenwerking met de overige in het
      eerste lid bedoelde autoriteiten zorg voor een gezamenlijk verslag dat openbaar wordt gemaakt en waarin melding
      wordt gemaakt van de wijze waarop uitvoering is gegeven aan het eerste en tweede lid.


