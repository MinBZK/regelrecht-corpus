        artikel: '2'
  - number: '12.1'
    text: |-
      Voor het onderzoek aan boord en de verdere werkzaamheden nodig voor een tussentijdse aanpassing van een certificaat
      of verklaring, is een tarief verschuldigd van € 366.
    url: https://wetten.overheid.nl/BWBR0016090/2004-11-01#Artikel12
  - number: '12.2'
    text: |-
      Voor de werkzaamheden nodig voor het verstrekken van een extra exemplaar, een tussentijdse vervanging of de
      afgifte van een certificaat of verklaring, zonder dat daarvoor een onderzoek aan boord plaatsvindt, is een tarief
      verschuldigd van € 183.
    url: https://wetten.overheid.nl/BWBR0016090/2004-11-01#Artikel12
  - number: '12.3'
    text: |-
      Indien ten behoeve van een schip tegelijkertijd meerdere documenten als bedoeld in het tweede lid worden verstrekt,
      zonder dat hiervoor een onderzoek aan boord plaatsvindt, is voor elk volgend document een tarief verschuldigd van €
      118. Voor de vervanging van certificaten of verklaringen die door een scheepsongeval verloren zijn gegaan, is geen
      vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0016090/2004-11-01#Artikel12
  - number: '13'
    text: |-
      De [artikelen 46][ref1] en [47 van de Regeling Nederlandse tarieven Schepenwet 2004][ref2] zijn van toepassing.


