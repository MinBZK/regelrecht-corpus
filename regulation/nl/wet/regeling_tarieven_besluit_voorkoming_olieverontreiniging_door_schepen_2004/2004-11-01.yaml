  - number: '11'
    text: |-
      Indien een scheepstype niet is opgenomen in de [artikelen 2 tot en met 10][ref1], wordt voor de afgifte van een
      certificaat of een verklaring door het Hoofd van de Scheepvaartinspectie het tarief gebaseerd op het tarief van het
      scheepstype dat hiermee het meest overeenkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0016090#Artikel2
    url: https://wetten.overheid.nl/BWBR0016090/2004-11-01#Artikel11
