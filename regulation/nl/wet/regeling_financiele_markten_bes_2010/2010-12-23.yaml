        artikel: '3.1'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028553
  - number: '4.1'
    text: |-
      Alserkende effectenbeurzen, bedoeld in
      [artikel 1, onderdeel d, van de Wet zeggenschap in ter beurze genoteerde vennootschappen BES][ref1], worden
      aangewezen de beurzen te:

      a. Amsterdam, New York en Parijs, gehouden door NYSE Euronext;

      b. Frankfurt, gehouden door de Deutsche Börse;

      c. Londen, gehouden door de London Stock Exchange; en

      d. Tokio, gehouden door de Tokio Stock Exchange.


      [ref1]: https://wetten.overheid.nl/BWBR0028364#Artikel1
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0028364
        artikel: '1'
  - number: '5.1'
    text: |-
      1 De modellen van de staten, bedoeld in [artikel 26, zesde lid, van de Wet toezicht verzekeringsbedrijf BES][ref1],
      worden vastgesteld voor:

      a. het levensverzekeringsbedrijf: zoals opgenomen in [bijlage 5][ref2] bij deze regeling; en

      b. het schadeverzekeringsbedrijf: zoals opgenomen in [bijlage 6][ref3] bij deze regeling.

      2 De staten die een verzekeraar bij De Nederlandsche Bank indient, zijn overeenkomstig de vastgestelde modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0028495#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028592
      [ref3]: https://wetten.overheid.nl/BWBR0028592
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel5.1
    references:
