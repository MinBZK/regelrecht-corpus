  - number: '3.1'
    text: |-
      1 Een in de openbare lichamen werkzame beleggingsinstelling houdt zich aan paragraaf 2 en paragraaf 3 van de
      Voorschriften Toezicht op Beleggingsinstellingen en Administrateurs van de Bank van de Nederlandse Antillen, zoals
      opgenomen in [bijlage 4][ref1] bij deze regeling.

      2 Een aan een in de openbare lichamen werkzame beleggingsinstelling verbonden bewaarder houdt zich aan paragraaf 2
      van de voorschriften, bedoeld in het eerste lid.

      3 Een in de openbare lichamen werkzame administrateur houdt zich aan paragraaf 4 en paragraaf 5 van de
      voorschriften, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028592
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0028592
  - number: '3.2'
    text: |-
      Voor de toepassing van [artikel 3.1][ref1] dient in de voorschriften, bedoeld dat artikel, te worden gelezen:

      a. voor ‘landsverordening’: [Wet toezicht beleggingsinstellingen en administrateurs BES][ref2];

      b. voor ‘Bank’: Autoriteit Financiële Markten;

      c. voor ‘NAf. 500.000,–’: USD 280.000;

      d. voor ‘NAf. 250.000,–’: USD 140.000;

      e. voor ‘Nederlandse Antillen’: openbare lichamen.

      f. voor ‘Nederlands Antilliaans recht’: het recht in de openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0028592#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0028553
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel3.2
