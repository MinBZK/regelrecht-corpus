    text: |-
      1 Erkende diploma’s als bedoeld in [artikel 6, tweede lid, van de Wet Assurantiebemiddelingsbedrijf BES][ref1], ter
      zake van de inschrijving in het Register, Afdeling Leven, zijn:

      a. het diploma, op grond waarvan de bezitter in het Verenigd Koninkrijk de bevoegdheid heeft verkregen de titel
      Fellow Chartered Insurance Institute (FCII) te voeren;

      b. het diploma op grond waarvan de bezitter in het Verenigd Koninkrijk de bevoegdheid heeft verkregen de titel
      Advanced Chartered Insurance Institute (ACII) te voeren;

      c. het diploma Gevolmachtigd Agent, namens de Minister van Financiën afgegeven door de Stichting Examens
      Assurantiebedrijf;

      d. het diploma Assurantiebezorger, namens de Minister van Financiën afgegeven door de Stichting Examens
      Assurantiebedrijf;

      e. het diploma Erkend Assurantieagent, namens de Minister van Financiën afgegeven door de Stichting Examens
      Assurantiebedrijf;

      f. het diploma Erkend Assurantieagent (B), afgegeven door de Stichting Examens Assurantiebedrijf Nederlandse
      Antillen en Aruba;

      g. het diploma Assurantiebezorger (A), afgegeven door de Stichting Examens Assurantiebedrijf Nederlandse Antillen
      en Aruba;

      h. het diploma op grond waarvan de bezitter in de Verenigde Staten en Canada de bevoegdheid heeft verkregen de
      titel Chartered Life Insurance Underwriter (CLU) te voeren;

      i. een diploma afgegeven door een exameninstituut dat is erkend door de Minister van Financiën ingevolge
      [artikel 4:9, derde lid, van de Wet op het financieel toezicht][ref2], voor zover dit diploma is toegelaten door de
      Autoriteit Financiële Markten voor bemiddeling in levensverzekeringen in de openbare lichamen.

      2 Erkende diploma’s als bedoeld in [artikel 6, tweede lid, van de Wet assurantiebemiddelingsbedrijf BES][ref3], ter
      zake van de inschrijving in het Register, Afdeling Schade, zijn:

      a. de diploma’s, bedoeld in het eerste lid, onderdelen a tot en met g, alsmede het diploma op grond waarvan de
      bezitter in de Verenigde Staten en Canada de bevoegdheid heeft verkregen de titel Chartered Property Casualty
      Underwriter (CPCU) te voeren;

      b. een diploma afgegeven door een exameninstituut dat is erkend door de Minister van Financiën ingevolge
      [artikel 4:9, derde lid, van de Wet op het financieel toezicht][ref4], voor zover dit diploma is toegelaten door de
      Autoriteit Financiële Markten voor bemiddeling in schadeverzekeringen in de openbare lichamen.


