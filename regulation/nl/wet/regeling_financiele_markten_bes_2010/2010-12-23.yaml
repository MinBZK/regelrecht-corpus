  - number: '2.6'
    text: |-
      In deze paragraaf wordt verstaan onder:

        - *concern:* de economische gezamenlijkheid van een moedermaatschappij, haar directe of indirecte
      dochtermaatschappijen en de ondernemingen of instellingen waarin de moedermaatschappij of een dochtermaatschappij
      direct of indirect overwegende zeggenschap heeft;
        - *concernmaatschappij:* een onderneming of instelling die behoort tot een concern;
        - *concernfinancieringsmaatschappij:* een concernmaatschappij die tevens internationale kredietinstelling is;
        - 1°. kredietinstellingen, verzekeraars, pensioenfondsen, effectenbedrijven en beleggingsinstellingen, voor zover
      zij onder adequaat toezicht staan; 2°. nationale overheden en internationale en supranationale publiekrechtelijke
      organisaties; 3°. ondernemingen waarvan de effecten genoteerd zijn aan een erkende effectenbeurs als bedoeld
      in [hoofdstuk 4][ref1]; 4°. ondernemingen met een balanstotaal groter dan of gelijk aan USD 1,1 miljard; 5°.
      financieringsmaatschappijen van vorenbedoelde ondernemingen, die op professionele basis uit eigen hoofde regelmatig
      actief zijn op de financiële markten.


      [ref1]: https://wetten.overheid.nl/BWBR0028592#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0028592
        hoofdstuk: '4'
  - number: '2.7'
    text: |-
      Een concernfinancieringsmaatschappij of internationale kredietinstelling die 90% of meer van haar gelden ter
      beschikking verkrijgt van concernmaatschappijen of professionele marktpartijen, wordt niet aangemerkt als een
      kredietinstelling in de zin van de [Wet toezicht bank- en kredietwezen 1994 BES][ref1] mits de door haar ten
      behoeve van het aantrekken van gelden uitgegeven toonderstukken met een nominale waarde van minder dan USD 56.000
      per coupure, een clausule bevatten die de uitgifte en verhandeling ervan beperkt tot concernmaatschappijen of
      professionele marktpartijen.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0028547
  - number: '2.8'
    text: |-
      Een concernfinancieringsmaatschappij die minder dan 90% van haar gelden ter beschikking verkrijgt van
      concernmaatschappijen of professionele marktpartijen, wordt niet aangemerkt als een kredietinstelling in de zin van
      de [Wet toezicht bank- en kredietwezen 1994 BES][ref1] indien:

      a. die maatschappij kredietuitzettingen uitsluitend verricht bij andere concernmaatschappijen; en

      b. de moedermaatschappij van het concern waartoe de concernfinancieringsmaatschappij behoort, een
      onherroepelijke garantie of contragarantie heeft verstrekt voor de nakoming van de verplichtingen van de
      concernfinancieringsmaatschappij uit hoofde van bedoelde ter beschikking verkregen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0028547
  - number: '2.9'
    text: |-
      De voorwaarden, bedoeld in [artikel 2.7][ref1] en [artikel 2.8, onderdeel b][ref2], zijn niet van toepassing op de
      reeds op 23 december 1995 bestaande verplichtingen uit hoofde van ter beschikking verkregen gelden als bedoeld in
      die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0028592#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0028592#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.9
