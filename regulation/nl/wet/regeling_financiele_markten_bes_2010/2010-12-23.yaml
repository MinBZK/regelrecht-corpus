        artikel: '4'
  - number: '2.2'
    text: |-
      Een kredietinstelling met zetel in een openbaar lichaam berekent haar solvabiliteit en liquiditeit conform de
      regels ter zake in de rapportagestaten, bedoeld in [artikel 2.5, eerste lid, onderdelen a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028592#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0028592
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '2.3'
    text: |-
      1 Een kredietinstelling met zetel in een openbaar lichaam houdt zich aan de navolgende voorschriften van de Bank
      van de Nederlandse Antillen zoals opgenomen in [bijlage 1][ref1] bij deze regeling:

      a. Supervisory regulations for credit institutions I, inzake het verlenen van krediet door een kredietinstelling
      aan de leden van haar bestuur en de raad van toezicht, haar aandeelhouders en werknemers;

      b. Supervisory regulations for credit institutions II, inzake transacties met, en leningen aan ondernemingen die
      aan de kredietinstelling zijn gelieerd;

      c. Supervisory regulations for credit institutions III, inzake limieten op het verstrekken van leningen aan één
      debiteur of een groep onderling gelieerde debiteuren;

      d. Supervisory regulations for credit institutions IV, inzake landenrisico’s;

      e. Supervisory regulations for credit institutions V, inzake algemene en specifieke voorzieningen voor
      afschrijvingen op uitstaande leningen.

      2 Voor de toepassing van het eerste lid dient in de voorschriften te worden gelezen:

      a. voor ‘the National Ordinance on the Supervision of Banking and Credit Institutions 1994’:
      [Wet toezicht bank- en kredietwezen 1994 BES][ref2];

      b. voor ‘the Bank’: De Nederlandsche Bank;

      c. voor ‘the Netherlands Antilles’: de openbare lichamen;

      d. voor de geldbedragen in Supervisory regulations for credit institutions I:

      1°. ‘NAf. 100.000’: USD 56.000;

      2°. ‘NAf. 50.000’: USD 28.000.

      3 De paragraaf ‘Grandfathering provision’ in Supervisory regulations for credit institutions I, Supervisory
      regulations for credit instituitions II en Supervisory regulations for credit institutions III is niet van
      toepassing op kredietinstellingen met zetel in een openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0028592
      [ref2]: https://wetten.overheid.nl/BWBR0028547
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.3
    references:
