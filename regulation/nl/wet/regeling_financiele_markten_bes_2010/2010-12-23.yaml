  - number: '2.10'
    text: |-
      Ingevolge [artikel 13, eerste lid, van de Wet geldstelsel BES][ref1] aangewezen kantoren voor de verwisseling van
      Nederlands-Antilliaanse guldens voor US dollars worden niet aangemerkt als geldtransactiekantoren in de zin van de
      [Wet toezicht bank- en kredietwezen 1994 BES][ref2]


      [ref1]: https://wetten.overheid.nl/BWBR0028551#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028547
