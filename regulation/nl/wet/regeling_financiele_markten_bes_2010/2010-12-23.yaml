        artikel: '26'
      - id: ref2
        bwb_id: BWBR0028592
      - id: ref3
        bwb_id: BWBR0028592
  - number: '5.2'
    text: |-
      De door een verzekeraar met zetel in een openbaar lichaam in te dienen staten worden ondertekend door de dagelijks
      beleidsbepalers.
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel5.2
  - number: '5.3'
    text: |-
      De staten, in te dienen door een verzekeraar met zetel in een openbaar lichaam die in het buitenland een bijkantoor
      heeft, bevatten zowel de gegevens die betrekking hebben op het in de openbare lichamen uitgeoefende bedrijf, als de
      gegevens die betrekking hebben op het door middel van het bijkantoor in het buitenland uitgeoefende bedrijf.
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel5.3
  - number: '5.4'
    text: |-
      1 Het levensverzekeringsbedrijf maakt de staten openbaar die zijn opgenomen in [bijlage 5][ref1], File 101, File
      102, File 104, File 128, File S01, File S02 en File S04, bij deze regeling.

      2 Het schadeverzekeringsbedrijf maakt de staten openbaar die zijn opgenomen in [bijlage 6][ref2], File 201, File
      202, File 204 en File 234, bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028592
      [ref2]: https://wetten.overheid.nl/BWBR0028592
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel5.4
