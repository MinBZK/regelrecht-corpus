  - number: '2.4'
    text: |-
      1 Een kredietinstelling met zetel in een openbaar lichaam verstrekt binnen 6 maanden na afloop van het boekjaar
      aan De Nederlandsche Bank een jaarrekening over het afgelopen boekjaar, ten minste bevattende een balans en
      een winst- en verliesrekening met bijbehorende toelichting, een jaarverslag en de overige gegevens, bedoeld in
      [artikel 120, tweede lid, van Boek 2 van het Burgerlijk Wetboek BES][ref1].

      2 De jaarrekening en het jaarverslag dienen te voldoen aan de eisen gesteld in
      [titel 5, afdeling IV, van Boek 2 van het Burgerlijk Wetboek BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028744#Artikel120
