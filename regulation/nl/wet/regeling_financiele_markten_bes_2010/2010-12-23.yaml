  - number: '2.1'
    text: |-
      1 Het minimumbedrag aan eigen vermogen, bedoeld in
      [artikel 4, eerste lid, onderdeel c, van de Wet toezicht bank- en kredietwezen 1994 BES][ref1], bedraagt USD
      2.750.000 voor een kredietinstelling met zetel in een openbaar lichaam.

      2 In afwijking van het eerste lid bedraagt het daar bedoelde minimumbedrag aan eigen vermogen voor een
      kredietinstelling met zetel in een openbaar lichaam, die overeenkomstig het door de Bank van de Nederlandse
      Antillen gehouden register is aan te merken als een:

      a. gespecialiseerde kredietinstelling die uitsluitend hypotheken verstrekt, USD 1.650.000;

      b. gespecialiseerde kredietinstelling, niet zijnde een kredietinstelling als bedoeld in onderdeel a, of als een
      spaarbank, USD 558.000.


      [ref1]: https://wetten.overheid.nl/BWBR0028547#Artikel4
    url: https://wetten.overheid.nl/BWBR0028592/2010-12-23#Artikel2.1
    references:
