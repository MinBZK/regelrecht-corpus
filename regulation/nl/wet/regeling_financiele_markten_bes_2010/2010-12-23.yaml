  - number: '2.5'
    text: |-
      1 Een kredietinstelling met zetel in een openbaar lichaam dient bij De Nederlandsche Bank de volgende staten in:

      a. ‘Chart of accounts for Financial institutions’ van de Bank van de Nederlandse Antillen, zoals opgenomen in
      [bijlage 2][ref1] bij deze regeling; of

      b. ‘Chart of accounts manual for International institutions’ van de Bank van de Nederlandse Antillen, zoals
      opgenomen in [bijlage 3][ref2] bij deze regeling.

      2 De frequentie waarmee en de termijnen waarbinnen de staten, bedoeld in het eerste lid, worden ingediend, zijn de
      frequentie en termijnen zoals vermeld in de in het eerste lid genoemde charts of accounts.

      3 Voor de toepassing van het eerste lid dient in de charts of accounts, bedoeld in dat lid, te worden gelezen:

      a. voor ‘the National Ordinance on the Supervision of Banking and Credit Institutions 1994’: de
      [Wet toezicht bank- en kredietwezen 1994 BES][ref3];

      b. voor ‘the Bank’: De Nederlandsche Bank;

      c. voor ‘the Netherlands Antilles’: de openbare lichamen;

      d. voor ‘ANG’: USD;

      e. voor ‘guilders’: dollars.


      [ref1]: https://wetten.overheid.nl/BWBR0028592
      [ref2]: https://wetten.overheid.nl/BWBR0028592
      [ref3]: https://wetten.overheid.nl/BWBR0028547
