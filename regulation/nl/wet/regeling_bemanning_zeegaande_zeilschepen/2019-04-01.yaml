    text: |-
      1 In plaats van het bepaalde in
      [artikel 8, eerste tot en met vijfde en zevende lid, van het Besluit zeevarenden][ref1], is op de afgifte van een
      vaarbevoegdheidsbewijs voor het dienstdoen op zeilschepen van minder dan 500 GT het bepaalde in dit artikel van
      toepassing.

      2 Een vaarbevoegdheidsbewijs wordt afgegeven indien de aanvrager aantoont te voldoen aan de bij of krachtens het
      in het eerste lid bedoelde besluit vereiste kennis en ervaring, mits het bekwaamheidsbewijs voor de zeilvaart ten
      hoogste 4 jaar voor het indienen van de aanvraag is afgegeven.

      3 Een geldig vaarbevoegdheidsbewijs of een aanvulling daarop kan worden vernieuwd indien de houder heeft
      dienstgedaan in een naar het oordeel van Onze Minister relevante functie waarvoor een vaarbevoegdheid is vereist en
      die door de houder op grond van de aan hem toegekende vaarbevoegdheden mocht worden vervuld of in een andere, bij
      regeling van Onze Minister vastgestelde, daarmee vergelijkbare functie, gedurende ten minste:

      a. 1 seizoen in de periode van 5 jaar voorafgaand aan de datum van de aanvraag tot vernieuwing; of

      b. ½ seizoen in de periode van 6 maanden voorafgaand aan de datum van de aanvraag tot vernieuwing.

      4 Een vaarbevoegdheidsbewijs of een aanvulling daarop waarvan de geldigheid niet langer dan 5 jaar is verstreken
      wordt op verzoek vernieuwd indien de houder voorafgaand aan de aanvraag:

      a. een opleiding heeft gevolgd als bedoeld in de [artikelen 8.16][ref2] of [8.17 van de Regeling zeevarenden][ref3]
      en deze met succes heeft afgesloten;

      b. gedurende ten minste ½ seizoen in de periode van 6 maanden voorafgaand aan de datum van de aanvraag tot
      vernieuwing in een naar het oordeel van Onze Minister relevante functie boven de sterkte heeft dienstgedaan; of

      c. gedurende ten minste ½ seizoen in de periode van 6 maanden voorafgaand aan de datum van de aanvraag tot
      vernieuwing in een naar het oordeel van Onze Minister relevante maar lagere functie heeft dienstgedaan dan waarvoor
      zijn ongeldig geworden vaarbevoegdheidsbewijs gold.

      5 Onze Minister geeft op verzoek een vaarbevoegdheidsbewijs af met een geldigheidsduur van ten hoogste 6 maanden
      voor de vervulling van een functie als bedoeld in het vierde lid, onderdeel c.

      6 Een vaarbevoegdheidsbewijs waarvan de geldigheid langer dan 5 jaar is verstreken wordt op verzoek vernieuwd
      indien de houder voorafgaand aan de aanvraag een opleiding heeft gevolgd als bedoeld in de [artikelen 8.16][ref4]
      of [8.17 van de Regeling zeevarenden][ref5] en deze met succes heeft afgesloten.

      7 Indien de aanvrager van een duplicaat vaarbevoegdheidsbewijs aanspraak kan maken op vernieuwing van het
      vaarbevoegdheidsbewijs, wordt hem desgevraagd met inachtneming van het derde lid een vaarbevoegdheidsbewijs
      afgegeven.


