  text: |-
    Gelet op de artikelen 36, tweede lid, en 57, eerste lid, onderdeel c, en tweede lid, van het Besluit
    zeevaartbemanning handelsvaart en zeilvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *wet:*


              [Wet zeevarenden][ref1];



            b

              *ervaring:*


              de diensttijd uitgedrukt in seizoenen, in een bepaalde functie aan boord van in de vaart zijnde
      zeilschepen;



            c

              *binnenwateren:*


              de binnenwateren van het communautaire net, behorende tot zone 2, bedoeld in bijlage 1 bij richtlijn
      nr. 2006/87/EG van het Europees parlement en de Raad van 12 december 2006 tot vaststelling van de technische
      voorschriften voor binnenschepen en tot intrekking van richtlijn nr. 82/714/EEG van de Raad (PbEU L 389);



            d

              *seizoen:*


              een, al dan niet aaneengesloten, periode van 180 kalenderdagen;



            e

              *vaargebied I:*


              het gebied dat zich uitstrekt van de monding van de Eems over de Duitse Wadden, begrensd door de
      laagwaterlijn op het Noordzeestrand van de Duitse Waddeneilanden tot de oostpunt van Spiekeroog, en vervolgens
      van de lijn van de oostpunt van Spiekeroog - Harleboei - vuurschip Weser - vuurschip Elbe I en de Elbemonding
      tot Brunsbüttel, begrensd door de rode boeienlijn, tevens omvattend het Noord-Oostzeekanaal, het Kielerfjord, de
      westelijke Oostzee, Belten en Sont, begrensd door de lijn Grenaa - Kullen in het Noorden en in het Oosten door de
      lijn Falster Bo - Cap Arkona, inclusief het bodden- en haffengebied ten zuiden van Rügen;



            f

              *vaargebied II:*


              een strook kustwater van 25 mijl uit de kust te beginnen dwars van Nieuwpoort tot de monding van de Elbe
      (Elbe I) en de Eider (Toenning), tevens omvattend het Noord-Oostzeekanaal en de westelijke Oostzee, Belten en Sont
      en het Kattegat in het Noorden begrensd door de lijn Skagen - Göteborg en in het Oosten door de lijn Simrishamn
        - oostkust Bornholm -Stettin, met dien verstande dat Bornholm in het Oosten op maximaal 25 mijl gepasseerd mag
      worden;



            g

              *vaargebied III:*


              de gehele Oostzee, de Noordzee, in het Noorden begrensd door de lijn van 63 graden 30 minuten
      Noorderbreedte (tot maximaal 25 mijl uit de Noorse kust) - 61 graden Noorderbreedte, 1 graad Westerlengte -
      Strathie Head verbonden met de lijn van Barony Point - Mull - oostkust Colonsay -Islay (Ardmore Point) - Inishowen
      Head (Noord-Ierland) en vervolgens in het Zuidwesten van Old Head of Kinsale (Zuid-Ierland nabij Cork Harbour)
      naar 48 graden Noorderbreedte, 6 graden Westerlengte (ca. 25 mijl west van Pointe du Raz) tot de zuidoever van de
      Gironde (45 graden Noorderbreedte, 2 graden 35 minuten Westerlengte); tot vaargebied III behoort tevens de gehele
      Middellandse Zee vanaf de Straat van Gibraltar;



            h

              *vaargebied IIIA:*


              de zuidelijke Noordzee, in het noorden begrensd door de parallel van 53 graden Noorderbreedte en in
      het zuiden begrensd door de lijn Calais-Dover, alsmede de wateren tot 30 mijl uit de Europese kusten binnen het
      vaargebied III;



            i

              *vaargebied IV:*


              onbeperkt vaargebied.


