  - number: '3'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs voor de functie kapitein zeilvaart met de beperking tot zeilschepen
      van minder dan 500 GT op reizen in de vaargebieden III en IV is

      ten minste vereist:

      a. het bekwaamheidsbewijs stuurman grote zeilvaart;

      b. het certificaat basisveiligheid;

      c. het certificaat medische eerste hulp aan boord;

      d. het certificaat medische zorg aan boord;

      e. het algemeen certificaat maritieme radiocommunicatie; en

      f. een diensttijd van 2 seizoenen als wachtstuurman zeilvaart.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel3
  - number: '4'
    text: |-
      1 Voor de afgifte van een vaarbevoegdheidsbewijs voor de functie kapitein zeilvaart met de beperking tot
      zeilschepen van minder dan 500 GT op reizen in de vaargebieden I, II en IIIA, is ten minste vereist:

      a. het bekwaamheidsbewijs stuurman kleine zeilvaart;

      b. het certificaat basisveiligheid;

      c. het certificaat medische eerste hulp aan boord;

      d. het beperkt certificaat maritieme radiocommunicatie; en

      e. een diensttijd van 2 seizoenen als wachtstuurman zeilvaart aan boord van zeilschepen, waarbij ten hoogste 1
      seizoen op binnenwateren mag zijn behaald.

      2 Voor de afgifte van een vaarbevoegdheidsbewijs als kapitein zeilvaart met de beperking tot zeilschepen van
      minder dan 500 GT op reizen in de vaargebieden I en II volstaat, in afwijking van het eerste lid, onderdeel e, een
      diensttijd van 2 seizoenen als wachtstuurman zeilvaart aan boord van zeilschepen op binnenwateren.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel4
  - number: '5'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als wachtstuurman zeilvaart met de beperking tot zeilschepen van
      minder dan 500 GT op reizen in de vaargebieden III en IV, is ten minste vereist:

      a. het bekwaamheidsbewijs stuurman kleine zeilvaart;

      b. het certificaat basisveiligheid;

      c. het certificaat medische eerste hulp aan boord;

      d. het algemeen certificaat maritieme radiocommunicatie; en

      e. de leeftijd van 18 jaar.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel5
  - number: '6'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als wachtstuurman zeilvaart met de beperking tot zeilschepen van
      minder dan 500 GT op reizen in de vaargebieden I, II en IIIA is ten minste vereist:

      a. het bekwaamheidsbewijs stuurman kleine zeilvaart;

      b. het certificaat basisveiligheid;

      c. het certificaat medische eerste hulp aan boord;

      d. het beperkt certificaat maritieme radiocommunicatie; en

      e. de leeftijd van 18 jaar.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel6
  - number: '7'
    text: |-
      Voor de afgifte van een vaarbevoegdheidsbewijs als gezel zeilvaart met de beperking tot zeilschepen van minder dan
      500 GT is ten minste vereist:

      a. een schriftelijke verklaring van de kapitein van een Nederlands zeilschip dat de aanvrager heeft aangetoond te
      voldoen aan de eisen van bekwaamheid, bedoeld in sectie A-II/4 van de STCW-Code;

      b. het certificaat basisveiligheid;

      c. een diensttijd van 1 seizoen als aankomend gezel zeilvaart, die op binnenwateren mag zijn behaald; en

      d. de leeftijd van 16 jaar.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel7
  - number: '12'
    text: |-
      1 Een diploma stuurman grote zeilvaart of stuurman kleine zeilvaart, alsmede een certificaat grote zeilvaart of
      kleine zeilvaart, wordt afgegeven door het Landelijke Examenbureau voor de Beroepszeilvaart.

      2 Het Landelijk Examenbureau, bedoeld in het eerste lid, voldoet aan de volgende eisen:

      a. het heeft rechtspersoonlijkheid;

      b. aan het Landelijk Examenbureau zijn verbonden een Examencommissie, een College van Gecommitteerden en een
      College van Toezicht;

      c. de Examencommissie bestaat uit deskundigen uit het vakgebied en is belast met het opstellen van examens en de
      uitvoering daarvan;

      d. het College van Gecommitteerden bestaat tenminste uit een vertegenwoordiger van de bedrijfstak, een
      vertegenwoordiger van de werknemers in de bedrijfstak, een vertegenwoordiger van de diploma- en certificaathouders
      en een vertegenwoordiger van het onderwijs voor de beroepszeilvaart.

      3 Het College van Gecommitteerden heeft tot taak:

      a. het opzetten en bewaken van beroepsprofielen;

      b. het vaststellen van de eindtermen documenten;

      c. het goedkeuren van het door het bestuur van het Examenbureau opgestelde examenreglement, en

      d. het bewaken van het kwaliteitsniveau van de schriftelijke en mondelinge examens.

      4 Het College van Gecommitteerden kan worden aangevuld met deskundigen uit de Handelsvaart of de Koninklijke
      Marine.

      5 Het College van Toezicht is tenminste samengesteld uit een vertegenwoordiger van de bedrijfstak, een
      vertegenwoordiger van het onderwijs voor de beroepszeilvaart en een onafhankelijke jurist. Het College kiest uit
      zijn midden een voorzitter.

      6 Teneinde het kwaliteitsniveau te garanderen, wordt het Landelijk Examenbureau voor de Beroepszeilvaart jaarlijks
      onderworpen aan een interne kwaliteitskontrole die wordt uitgevoerd door het Bureau zelf. Eens in de vijf jaar
      wordt een kwaliteitskontrole uitgevoerd door onafhankelijke externe deskundigen. Alle kwaliteitsrapporten bevatten
      tenminste de geconstateerde tekortkomingen en de daaruit voortvloeiende acties voor verbetering.

      7 De kwaliteitsrapportages, bedoeld in het zesde lid, worden ter beschikking gesteld van de Minister.

      8 De bevoegdheid van het Landelijke Examenbureau tot het afgeven van de diploma's, alsmede het certificaat, bedoeld
      in het eerste lid, kan worden ingetrokken, indien naar de mening van de Minister van Verkeer en Waterstaat uit de
      jaarlijkse of vijfjaarlijkse kwaliteitscontroles blijkt dat er ernstige tekortkomingen zijn geconstateerd, dan wel
      dat onvoldoende uitvoering wordt gegeven aan het implementeren van acties ter verbetering, waardoor de kwaliteit
      van de examinering onvoldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0014117/2019-04-01#Artikel12
