      [ref1]: https://wetten.overheid.nl/BWBR0049842
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0049842
  - number: 2.3.6.2
    text: 'Onverminderd het eerste lid is de subsidiehoogte:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.2.a
    text: bij AC laadstations gebaseerd op het vermogen aan het laadpunt;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.2.b
    text: bij DC laadstations gebaseerd op het totale vermogen van het laadstation.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.3
    text: |-
      Onverminderd het tweede lid is de subsidiehoogte bij een modulair systeem, waarbij sprake is van een fysieke
      scheiding tussen laadstations en vermogenskast, gebaseerd op de som van het geïnstalleerd vermogen dat parallel
      maximaal geleverd kan worden door de vermogenskast.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.4
    text: |-
      De subsidie bedraagt voor de activiteit, bedoeld in [artikel 2.3.3, derde lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.6.4.a
