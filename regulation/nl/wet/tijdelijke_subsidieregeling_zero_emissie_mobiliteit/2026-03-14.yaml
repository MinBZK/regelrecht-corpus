  - number: '1.2'
    text: |-
      Deze regeling heeft als doel het stimuleren van activiteiten gericht op investeringen in oplaad- en
      tankinfrastructuur en emissievrije voer- en werktuigen ten behoeve van de overstap naar emissievrije voer- en
      werktuigen, teneinde de emissie van CO en luchtverontreinigende stoffen te verminderen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.2
  - number: '1.3'
    text: |-
      In aanvulling op de [artikelen 11][ref1] en [12 van het Kaderbesluit][ref2] wordt een subsidieaanvraag afgewezen
      als de algemene groepsvrijstellingsverordening van toepassing is en:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel12
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '12'
  - number: 1.3.a
    text: |-
      voor zover er sprake is van ongeoorloofde cumulatie van steun als bedoeld in artikel 8 van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.3
  - number: 1.3.b
    text: |-
      er sprake is van een onderneming in moeilijkheden als bedoeld in artikel 2, punt achttien, van de algemene
      groepsvrijstellingsverordening;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.3
  - number: 1.3.c
    text: de werkzaamheden aan het project reeds zijn aangevangen voordat de aanvraag voor dat project is ingediend; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.3
  - number: 1.3.d
    text: |-
      de subsidieverstrekking niet in overeenstemming is met enige andere bepaling van de algemene
      groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.3
  - number: '1.4'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel1.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 2.1.1
    text: |-
        - *basisafname:* gemiddelde afname door nieuwe emissievrije waterstofvoertuigen of emissievrije logistieke
      waterstofwerktuigen van deelnemers aan het samenwerkingsverband;
        - *dagcapaciteit:* aantal kilogram waterstof dat een waterstoftankstation per dag kan laten tanken;
        - *directe loonkosten:* het totaal van het bruto loon volgens de loonstaat, de vakantie-uitkering, de niet van
      winst afhankelijke eindejaarsuitkering of dertiende maand, de werkgeverslasten bestaande uit werkgeversdeel
      pensioenpremie, WW-premie, WIA/WAO-premie en bijdrage [Zorgverzekeringswet][ref1], en de overige werkgeverspremies
      voor werkloosheids- en ziektekostenuitkeringen;
        - *emissievrij licht waterstofvoertuig:* een emissievrij vervoermiddel als bedoeld in artikel 2, punt 102 octies,
      onderdeel b, van de algemene groepsvrijstellingsverordening, dat zich als waterstofvoertuig kwalificeert;
        - *emissievrij logistiek waterstofwerktuig:* emissievrij waterstofwerktuig als genoemd in [bijlage 3][ref2], dat
      voor het gebruik uitsluitend waterstof gebruikt als energiedrager;
        - *emissievrij zwaar waterstofvoertuig:* een emissievrij vervoermiddel als bedoeld in artikel 2, punt 102 octies,
      onderdeel c, van de algemene groepsvrijstellingsverordening, dat zich als waterstofvoertuig kwalificeert;
        - *hernieuwbare waterstof:* waterstof als bedoeld in artikel 2, punt 102 quater, van de algemene
      groepsvrijstellingsverordening;
        - *locatie:* de postcode van de locatie waar het waterstoftankstation is of wordt aangelegd;
        - *maximummassa:* de technisch toelaatbare maximummassa van een vrachtwagen in beladen toestand;
        - *maximummassa van de combinatie:* de maximummassa die, voor zover het N3-voertuig, bedoeld in [bijlage 3][ref3]
      betreft, mag worden uitgerust met een of meer aanhangwagens of opleggers, wordt vermeerderd met de technisch
      toelaatbare maximummassa van de aanhangwagens of opleggers in beladen toestand die het voertuig maximaal mag
      trekken;
        - *mobiele waterstofopslag:* een aanhangwagen van categorie O2 of O3 volgens [verordening (EU) 2018/858]
      (32018R0858), met daarop een reservoir waarin waterstof onder druk gasvormig of vloeibaar wordt opgeslagen, zoals
      bijvoorbeeld een tubetrailer of een multiple energy gas container (MEGC);
        - *multimodaal waterstoftankstation:* waterstoftankstation dat geschikt is voor het leveren van waterstof aan
      vrachtvervoer over de weg en aan ten minste één van de volgende vervoersmodaliteiten: i. spoorvervoer; ii. vervoer
      over de binnenwateren; iii. zeevervoer;
        - *nieuw emissievrij waterstofvoertuig:* emissievrij licht of zwaar waterstofvoertuig waarvan, blijkens vermelding
      in het kentekenregister, de datum eerste toelating, de datum eerste inschrijving in Nederland en de datum
      tenaamstelling gelijk zijn;
        - *nieuw emissievrij logistiek waterstofwerktuig:* emissievrij logistiek waterstofwerktuig waarvan uit de offerte
      op basis waarvan het werktuig wordt aangeschaft, blijkt dat dit niet eerder is gebruikt;
        - *offerte:* formeel, schriftelijk, aanbod tot het sluiten van een overeenkomst voor de aanschaf van een nieuw
      emissievrij waterstofvoertuig of nieuw emissievrij logistiek waterstofwerktuig, opgesteld op verzoek van de
      aanvrager;
        - *retrofitting:* het aanpassen van vervoermiddelen of werktuigen waardoor deze als emissievrije vervoermiddelen of
      emissievrije werktuigen zijn te kwalificeren;
        - *stedelijk knooppunt:* stedelijk knooppunt als bedoeld artikel 2, punt 72 van [Verordening (EU) 2023/1804]
      (32023R1804);
        - *tankpunt:* een tankfaciliteit voor de levering van een vloeibare of gasvormige alternatieve brandstof via een
      vaste installatie, waaraan slechts één voertuig tegelijk kan worden bijgetankt;
        - *verordening (EU) 2018/858:* [Verordening (EU) 2018/858](32018R0858) van het Europees Parlement en de Raad
      van 30 mei 2018 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan
      en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van
      [Verordeningen (EG) nr. 715/2007](32007R0715) en [(EG) nr. 595/2009](32009R0595) en tot intrekking van [Richtlijn
      2007/46/EG](32007L0046) (PbEU 2018, L151);
        - *verordening 2023/1804:* [Verordening (EU) 2023/1804](32023R1804) van het Europese Parlement en de Raad van
      13 september 2023 betreffende de uitrol van infrastructuur voor alternatieve brandstoffen en tot intrekking van
      [Richtlijn 2014/94/EU](32014L0094) van het Europese Parlement en de raad (PbEU 2023, L234);
        - *waterstoftankstation:* een vaste installatie, bestaande uit een of meer tankpunten, om vervoermiddelen van
      waterstof te voorzien;
        - *waterstofvoertuig:* een voertuig dat voor de voortbeweging waterstof gebruikt als energiedrager;
        - *zero-emissiezone:* nul-emissiezone voor bedrijfs- en vrachtauto’s die het bevoegd gezag heeft ingesteld door
      middel van een verkeersbesluit en het plaatsen van het bijbehorende verkeersbord C22c en onderbord C22c1;
        - *zwaar wegvervoer:* wegvervoer door voertuigen van categorie M3, N2 of N3 volgens [verordening (EU) 2018/858]
      (32018R0858).


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0049842
      [ref3]: https://wetten.overheid.nl/BWBR0049842
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0049842
      - id: ref3
        bwb_id: BWBR0049842
  - number: 2.1.2
    text: |-
      Deze paragraaf heeft tot doel het stimuleren van investeringen in waterstoftankstations, emissievrije
      waterstofvoertuigen voor wegvervoer, en emissievrije logistieke waterstofwerktuigen teneinde een bijdrage
      te leveren aan de ambitie uit het Klimaatakkoord van 50 waterstoftankstations in 2025, aan de behoefte aan
      waterstofvoertuigen in de transportmarkt en aan het verminderen van de emissie van CO en luchtverontreinigende
      stoffen door vervoer.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.2
  - number: 2.1.3.1
    text: |-
      De Minister kan, overeenkomstig het bepaalde bij deze paragraaf, aan een aanvrager subsidie verstrekken voor
      projecten gericht op de investering in de aanleg of opwaardering van een waterstoftankstation dat geschikt is of
      wordt voor zwaar wegvervoer, waaronder in dit hoofdstuk ook een multimodaal waterstoftankstation wordt begrepen,
      in combinatie met de aanschaf van één of meerdere nieuwe emissievrije lichte of zware waterstofvoertuigen
      of retrofitting van één of meerdere vervoermiddelen, waardoor deze als emissievrije lichte of zware
      waterstofvoertuigen kwalificeren.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.3.2
    text: |-
      In aanvulling op de in het eerste lid bedoelde combinatie kan ook subsidie worden verstrekt voor de aanschaf van
      één of meerdere nieuwe emissievrije logistieke waterstofwerktuigen of retrofitting van één of meerdere werktuigen,
      waardoor deze als emissievrije logistieke waterstofwerktuigen kwalificeren.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.3.3
    text: |-
      In afwijking van het eerste en tweede lid kan subsidie worden verstrekt voor uitsluitend de aanschaf van één
      of meerdere waterstofvoertuigen of waterstofwerktuigen of retrofitting van één of meerdere vervoermiddelen of
      werktuigen, bedoeld in het eerste en tweede lid, indien de exploitant die deelneemt aan het samenwerkingsverband,
      bedoeld in [artikel 2.1.4][ref1], reeds een waterstoftankstation exploiteert, dat voldoet aan de eisen bedoeld in
      [artikel 2.1.10a, eerste lid, onderdeel e][ref2] en, voor zover het een openbaar toegankelijk waterstoftankstation
      betreft, onderdeel f, of daartoe met de werkzaamheden is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.3.4
    text: |-
      Voor de toepassing van het eerste tot en met derde lid geldt een basisafname van ten minste 300 kilogram waterstof
      per dag, waarvan minimaal de helft wordt behaald door de aanschaf van nieuwe emissievrije zware waterstofvoertuigen
      of retrofitting van zware vervoermiddelen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.3.5
    text: |-
      De aanleg of opwaardering van een waterstoftankstation als bedoeld in het eerste lid kan over de looptijd van de
      regeling de investering van ten hoogste drie mobiele waterstofopslagen omvatten die:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.3.5.a
    text: |-
      worden gebruikt voor het leveren van waterstof aan het waterstoftankstation waarop de aanvraag van het
      samenwerkingsverband betrekking heeft; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.3.5.b
    text: dienen als voorraadvat van het waterstoftankstation.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.3
  - number: 2.1.4.1
    text: |-
      Subsidie op grond van deze paragraaf kan worden aangevraagd door de penvoerder van een samenwerkingsverband van
      ondernemingen die elk afzonderlijk:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.4
  - number: 2.1.4.1.a
    text: zijn ingeschreven bij de Kamer van Koophandel, en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.4
  - number: 2.1.4.1.b
    text: een vestiging in Nederland hebben.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.4
  - number: 2.1.4.2
    text: |-
      Tot het samenwerkingsverband behoren ten minste een exploitant van een waterstoftankstation en een onderneming die
      actief is in transport of logistiek.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.4
  - number: 2.1.4.3
    text: |-
      Een publiekrechtelijk zelfstandig bestuursorgaan met rechtspersoonlijkheid, provincie, gemeente, waterschap
      of openbaar lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] kan geen deel uitmaken van het
      samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.4
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 2.1.5.1
    text: |-
      Voor de subsidiabele activiteit bedoeld in [artikel 2.1.3, eerste lid][ref1], voor zover het betreft de investering
      in de aanleg of opwaardering van een waterstoftankstation, zijn subsidiabel de kosten die op grond van artikel
      36bis, 56ter of 56quater van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.5.2
    text: |-
      Indien loonkosten op grond van het eerste lid voor subsidie in aanmerking komen, worden de kosten van de gewerkte
      uren berekend op basis van een uurtarief voor directe loonkosten.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
  - number: 2.1.5.3
    text: |-
      Het uurtarief voor de directe loonkosten wordt bepaald door de directe loonkosten per jaar te delen door het aantal
      contracturen per jaar.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
  - number: 2.1.5.4
    text: |-
      Voor de subsidiabele activiteit bedoeld in [artikel 2.1.3, tweede of derde lid][ref1], voor zover het betreft de
      aanschaf van één of meerdere nieuwe emissievrije waterstofvoertuigen, of voor retrofitting van één of meerdere
      vervoermiddelen, waardoor deze als emissievrij lichte of zware waterstofvoertuigen kwalificeren, zijn subsidiabel
      de kosten die op grond van artikel 36ter van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.5.5
    text: |-
      In afwijking van het vierde lid zijn de kosten voor de aanschaf of retrofitting van een emissievrij licht
      waterstofvoertuig van categorie M1 slechts subsidiabel indien het een voor rolstoelen toegankelijk voertuig betreft
      als bedoeld in [artikel 86c van het Reglement verkeersregels en verkeerstekens 1990][ref1] en het voertuig over
      meer dan vier zitplaatsen beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel86c
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: 86c
  - number: 2.1.5.6
    text: |-
      Voor de subsidiabele activiteit bedoeld in [artikel 2.1.3, tweede en derde lid][ref1], voor zover het
      waterstofwerktuigen betreft, zijn subsidiabel de kosten die op grond van artikel 36, vierde lid, onderdeel a, van
      de algemene groepsvrijstellingsverordening voor subsidie in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.5
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.6
    text: 'De subsidie bedraagt:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.6
  - number: 2.1.6.a
    text: |-
      voor de investering in de aanleg of opwaardering van een waterstoftankstation dat geschikt is of wordt voor zwaar
      wegvervoer: maximaal 40% van de in aanmerking komende kosten, tot een maximum van € 3.000.000 per aanvraag;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.6
  - number: 2.1.6.b
    text: |-
      voor de investering in de aanleg of opwaardering van een multimodaal waterstoftankstation: maximaal 40% van de in
