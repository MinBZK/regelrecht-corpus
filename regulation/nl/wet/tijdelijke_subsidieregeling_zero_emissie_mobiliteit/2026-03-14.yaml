  - number: 2.3.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *AC laadstation:* laadstation als bedoel in artikel 2, punt 52, van
      [verordening 2023/1804](33704R2023) zonder ingebouwde converter;
        - *OV-concessiehouder:* vergunninghoudende vervoerder als bedoeld in
      [artikel 1 van de Wet personenvervoer 2000][ref1] van een concessie voor openbaar busvervoer;
        - *DC laadstation:* laadstation als bedoel in artikel 2, punt 52, van [verordening 2023/1804](33704R2023) met
      ingebouwde converter;
        - *duopaal:* AC laadstation met twee laadpunten die gelijktijdig een vermogen vanaf 11 kW per laadpunt kunnen
      leveren;
        - *exploitant van laadinfrastructuur:* onderneming waarvan de activiteiten op de locatie in hoofdzaak bestaan uit
      het via laadinfrastructuur of tankstations aanbieden van elektriciteit of brandstoffen aan derden;
        - *hernieuwbare elektriciteit:* elektriciteit als bedoeld in artikel 2, punt 102 quinquies, van de algemene
      groepsvrijstellingsverordening;
        - *laadinfrastructuur:* oplaadinfrastructuur als bedoeld in artikel 2, punt 102bis, van de algemene
      groepsvrijstellingsverordening;
        - *laadlocatie:* locatie met een of meer laadstations met daarbij behorende laadplekken of laadparkeervakken;
        - *laadpunt:* laadpunt als bedoeld in artikel 2, punt 48, van [verordening 2023/1804](33704R2023);
        - *laadstation:* laadstation als bedoeld in artikel 2, punt 52, van [verordening 2023/1804](33704R2023);
        - *MIA:* Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-investeringen 2009;
        - *stationaire batterij:* systeem voor het opslaan en op een later tijdstip leveren van elektriciteit, dat zich
      niet bevindt in een elektrisch voertuig, maar wel communiceert met het laadstation.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: 2.3.2
    text: |-
      Deze paragraaf heeft tot doel het stimuleren van investeringen gericht op versnelling van de uitrol van private
      laadinfrastructuur voor elektrische voertuigen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.2
  - number: 2.3.3.1
    text: |-
      De Minister kan op grond van deze paragraaf subsidie verstrekken voor investeringen in de aanleg van in Nederland
      gelegen nieuwe private laadinfrastructuur voor elektrische voertuigen die niet te allen tijde voor het publiek
      toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.2
    text: 'De laadinfrastructuur, bedoeld in het eerste lid, bestaat uit een of meer laadstations en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.2.a
    text: een of meer DC laadstations met een vermogen vanaf 20 kW bestaande uit ten minste een laadpunt; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.2.b
    text: |-
      een of meer AC laadstations met een vermogen van minimaal 11 kW, mogelijk in combinatie met de
      basislaadinfrastructuur, bestaande uit het totaal van de infrastructuur behorende bij het laadpunt, waaronder
      de hoofdaansluiting en de bekabeling, waarop laadpunten die voldoen aan mode 3 of mode 4 als bedoeld in NEN 1010
      kunnen worden aangesloten.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.3
    text: |-
      De Minister kan in combinatie met de subsidie, bedoeld in het eerste lid, subsidie verstrekken voor een investering
      in een in Nederland geplaatste stationaire batterij tot een maximum van 1.000 kWh per laadlocatie indien de
      subsidie voor de activiteiten in totaal ten minste € 25.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.4
    text: In afwijking van het derde lid geldt het maximum van 1.000 kWh niet indien de aanvrager OV-concessiehouder is.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.5
    text: 'De stationaire batterij, bedoeld in het derde lid, heeft een maximale hardwarematige C-waarde van 0,50, tenzij:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.5.a
    text: deze is geïntegreerd in het DC laadstation; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.3.5.b
    text: de aanvrager OV-concessiehouder is.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.3
  - number: 2.3.4.1
    text: |-
      Subsidie op grond van deze paragraaf kan worden aangevraagd door een onderneming die staat ingeschreven bij de
      Kamer van Koophandel, met een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.4
  - number: 2.3.4.2
    text: 'In afwijking van het eerste lid kan geen subsidie worden aangevraagd door:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.4
  - number: 2.3.4.2.a
    text: |-
      een publiekrechtelijk zelfstandig bestuursorgaan met rechtspersoonlijkheid, provincie, gemeente, waterschap of
      openbaar lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 2.3.4.2.b
    text: een exploitant van laadinfrastructuur.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.4
  - number: 2.3.4.3
    text: |-
      In afwijking van het tweede lid, onderdeel b, kan een exploitant van laadinfrastructuur subsidie aanvragen indien
      de aanvraag realisatie van laadinfrastructuur voor eigen voertuigen of voertuigen van de eigen werknemers betreft.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.4
  - number: 2.3.5.1
    text: |-
      Voor de subsidiabele activiteit bedoeld in [artikel 2.3.3, eerste of derde lid][ref1], zijn subsidiabel de kosten
      die op grond van artikel 36bis van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking kunnen
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.5
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2
    text: |-
      In afwijking van het eerste lid komen investeringskosten als bedoeld in artikel 36bis van de algemene
      groepsvrijstellingsverordening voor on-site productie van hernieuwbare elektriciteit niet voor subsidie in
      aanmerking.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.5
