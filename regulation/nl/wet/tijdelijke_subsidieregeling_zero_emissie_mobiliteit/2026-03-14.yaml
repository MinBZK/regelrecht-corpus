        artikel: '24'
  - number: 2.1.15.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 2.1.12, derde of zevende lid][ref1], kan de Minister de
      vaststelling van de subsidie wijzigen en het onverschuldigd betaalde deel van de subsidie terugvorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.15
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.15.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e deel van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichting, bedoeld
      in [artikel 2.1.12, derde of zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.15
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *afrit:* het punt waar uitwisseling kan plaatsvinden tussen een A- of N-
      weg en het onderliggend wegennet;
        - *hernieuwbare elektriciteit:* elektriciteit als bedoeld in artikel 2, punt 102 quinquies, van de algemene
      groepsvrijstellingsverordening;
        - *ingang:* het punt waarop de toegangsweg overgaat in het terrein waarop de laadinfrastructuur staat of komt te
      staan;
        - *laadinfrastructuur:* oplaadinfrastructuur als bedoeld in artikel 2, punt 102bis, van de algemene
      groepsvrijstellingsverordening;
        - *laadlocatie:* locatie met een of meer laadstations met daarbij behorende laadplekken of laadparkeervakken;
        - *laadpunt:* laadpunt als bedoeld in artikel 2, punt 48, van [verordening 2023/1804](33704R2023);
        - *laadstation:* laadstation als bedoeld in artikel 2, punt 52, van [verordening 2023/1804](33704R2023);
        - *stationaire batterij:* systeem voor het opslaan en op een later tijdstip leveren van elektriciteit, dat zich
      niet bevindt in een elektrisch voertuig, maar wel communiceert met het laadstation;
        - *zwaar elektrisch wegvervoer:* wegvervoer door elektrische voertuigen van categorie M3, N2 of N3 volgens
      [verordening 2018/858](32758R2018).
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.1
  - number: 2.2.2
    text: |-
      Deze paragraaf heeft tot doel het stimuleren van investeringen gericht op versnelling van de uitrol van publiek
      toegankelijke laadinfrastructuur voor zwaar elektrisch wegvervoer.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      De Minister kan op grond van deze paragraaf subsidie verstrekken voor investeringen in de aanleg of uitbreiding
      van een publiek toegankelijke elektrische laadlocatie in Nederland die geschikt is of wordt voor zwaar elektrisch
      wegvervoer tot een maximum van 3.600 kW en die:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.a
    text: over minimaal 1.400 kW aan laadstations van 200 kW of meer beschikt die geschikt zijn voor zware voertuigen;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.b
    text: over minimaal twee laadstations beschikt met een vermogen van ten minste 350 kW;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.c
    text: voor alle laadpunten beschikt over een CCS- of MCS-connector;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.d
    text: voor alle laadpunten is voorzien van funderingen die geschikt zijn voor voertuigen van ten minste 50 ton;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.e
    text: voor alle laadpunten doorrijhoogtes heeft van minimaal 4,2 meter;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.f
    text: |-
      voor alle laadpunten beschikt over fysieke ruimtes voor het laden van een trekker met oplegger combinatie van 16,5
      meter;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.g
    text: |-
      te allen tijde publiek toegankelijk is, ongeacht of de laadlocatie zich op openbaar dan wel op privéterrein
      bevindt; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.1.h
    text: minimaal 40 uur per week is geopend in de periode tussen 9 uur en 21 uur.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      Indien de aanvrager aangeeft dat ter plaatse van de laadlocatie waarvoor subsidie als bedoeld in het eerste lid
      wordt aangevraagd, binnen twee jaar na indiening van de aanvraag onvoldoende netcapaciteit beschikbaar is of zal
      komen, kan de Minister subsidie verstrekken voor een investering in een stationaire batterij tot een maximum van
      1.400 kWh per laadlocatie.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.3
  - number: 2.2.4.1
    text: |-
      Subsidie op grond van deze paragraaf kan worden aangevraagd door een onderneming die is ingeschreven bij de Kamer
      van Koophandel, met een vestiging in Nederland.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.4
  - number: 2.2.4.2
    text: 'In afwijking van het eerste lid kan geen aanvraag worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.4
  - number: 2.2.4.2.a
    text: |-
      een OV-concessiehouder, te weten een vergunninghoudende vervoerder bedoeld in
      [artikel 1 van de Wet personenvervoer 2000][ref1], van een concessie voor openbaar busvervoer; of


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: 2.2.4.2.b
    text: |-
      een publiekrechtelijk zelfstandig bestuursorgaan met rechtspersoonlijkheid, een provincie, gemeente, waterschap of
      openbaar lichaam als bedoeld in de [Wet gemeenschappelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 2.2.5.1
    text: |-
      Voor de subsidiabele activiteiten, bedoeld in [artikel 2.2.3][ref1], zijn subsidiabel de kosten die op grond van
      artikel 36bis van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.5.2
    text: |-
      In afwijking van het eerste lid komen investeringskosten voor on-site productie van hernieuwbare elektriciteit niet
      voor subsidie in aanmerking.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.5
  - number: 2.2.6.1
    text: |-
      De subsidie bedraagt voor de activiteit, bedoeld in [artikel 2.2.3, eerste lid][ref1], per laadstation:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.6.1.a
    text: € 19.000 voor een laadstation met een vermogen vanaf 200 kW tot 350 kW;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
  - number: 2.2.6.1.b
    text: € 43.000 voor een laadstation met een vermogen vanaf 350 kW tot 550 kW;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
  - number: 2.2.6.1.c
    text: € 80.000 voor een laadstation met een vermogen vanaf 550 kW.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
  - number: 2.2.6.2
    text: |-
      Onverminderd het eerste lid is de subsidiehoogte bij een modulair systeem, waarbij sprake is van een fysieke
      scheiding tussen laadstations en vermogenskast, gebaseerd op de som van het geïnstalleerd vermogen dat parallel
      maximaal geleverd kan worden door de vermogenskast.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
  - number: 2.2.6.3
    text: |-
      De subsidie bedraagt voor de activiteit, bedoeld in [artikel 2.2.3, tweede lid][ref1], € 80 per kWh opslag.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.6.4
    text: In aanvulling op het eerste en derde lid bedraagt de subsidie ten hoogste 20% van de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.6
  - number: 2.2.7.1
    text: 'Het subsidieplafond bedraagt:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.1.a
    text: voor het jaar 2024 € 15.000.000;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.1.b
    text: voor het jaar 2025 € 15.000.000;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.1.c
    text: voor het jaar 2026 € 14.500.000.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.2
    text: De Minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.3
    text: 'De Minister stelt de onderlinge rangschikking van aanvragen vast door middel van loting indien hij:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.3.a
    text: |-
      op dezelfde dag aanvragen ontvangt voor meerdere laadlocaties per tweecijferig postcodegebied als bedoeld in
      [bijlage 4][ref1] van deze regeling; en


      [ref1]: https://wetten.overheid.nl/BWBR0049842
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
    references:
      - id: ref1
        bwb_id: BWBR0049842
  - number: 2.2.7.3.b
    text: |-
      toekenning van deze aanvragen ertoe leidt dat gedurende de looptijd van de regeling subsidie wordt verleend voor
      meer dan vijf laadlocaties.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.7.4
    text: |-
      In afwijking van het tweede lid vindt, indien een gevraagde subsidie niet geheel doch voor ten minste 70 procent
      kan worden verstrekt omdat het subsidieplafond, bedoeld in het eerste lid, bijna is bereikt, overleg plaats met
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.7
  - number: 2.2.8
    text: 'Een aanvraag tot subsidieverstrekking op grond van deze paragraaf kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.8
  - number: 2.2.8.a
    text: van 1 oktober 2024, 9.00 uur tot en met 31 december 2024, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.8
  - number: 2.2.8.b
    text: van 13 mei 2025, 9.00 uur tot en met 19 december 2025, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.8
  - number: 2.2.8.c
    text: van dinsdag 3 februari 2026, 9.00 uur tot en met vrijdag 18 december 2026, 12.00 uur.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.8
  - number: 2.2.9.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag om subsidie indienen door middel van een daartoe vastgesteld
      formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.2
    text: Een aanvrager kan per week twee aanvragen indienen voor de aanleg of uitbreiding van een laadlocatie.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.3
    text: |-
      Indien een aanvrager per week meer dan twee aanvragen indient, of indien eenzelfde groep waartoe meerdere
      aanvragers behoren per week meer dan twee aanvragen indient, neemt de Minister uitsluitend de eerste twee
      ingediende aanvragen in behandeling.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4
    text: |-
      Een aanvraag tot subsidieverlening bevat naast de in [artikel 10 van het Kaderbesluit][ref1] genoemde gegevens
      ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 2.2.9.4.a
    text: |-
      gegevens over de aanvrager, waaronder het nummer waarmee de onderneming is geregistreerd bij de Kamer van
      Koophandel en het post- en bezoekadres;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.b
    text: gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.c
    text: de volledige postcode met het huisnummer of dichtstbijzijnde huisnummer van de laadlocatie;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.d
    text: de coördinaten van de ingang;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.e
    text: |-
      hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen subsidies van een bestuursorgaan of de
      Commissie van de Europese Unie voor dezelfde laadlocatie;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.f
    text: |-
      offerte met merk, type en specificaties van de laadstations en van de installatiekosten waaruit het vermogen van
      elk laadstation blijkt en waaruit blijkt dat de laadinfrastructuur permanent met het internet is verbonden en
      waarbij de communicatie volgens het Open Charge Point Protocol versie 1.6 of hoger verloopt teneinde sturing van
      het laden mogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.g
    text: |-
      indien van toepassing bevat de aanvraag een overzicht van de overige subsidiabele kosten ten behoeve van de aanleg
      van laadinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.h
    text: |-
      de meest recente factuur van de netbeheerder waaruit blijkt wat het huidige aansluitvermogen en gecontracteerde
      transportvermogen is op de laadlocatie of een schriftelijke bevestiging van de netbeheerder die maximaal 3 maanden
      oud is, waaruit blijkt dat er binnen twee jaar na verlening van subsidie een netaansluiting van ten minste 100 kVA
      aanwezig is;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.i
    text: |-
      een onderbouwing waaruit blijkt dat de laadlocatie bereikbaar is via een verharde toegangsweg die vanaf de afrit
      over de gehele lengte minstens zes meter breed is, waarbij de berm niet meetelt als onderdeel van de toegangsweg,
      en:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.i.i
    text: |-
      ligt op een bedrijventerrein, te weten een cluster aaneengesloten percelen met overwegend bedrijfsbestemmingen,
      binnen een in een bestemmingsplan als bedrijventerrein aangewezen gebied; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.i.ii
    text: |-
      ligt op maximaal een kilometer rijafstand van een A- of N-weg, waarbij deze afstand met een algemeen aanvaarde
      routeplanner wordt gemeten vanaf het einde van de dichtstbijzijnde afrit tot aan de ingang;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.j
    text: |-
      documenten waaruit blijkt dat alle laadstations binnen twee jaar na de subsidieverlening volledig
      beschikbaar zijn voor gebruik door zwaar elektrisch wegvervoer, waarbij de laadlocatie voldoet aan
      [artikel 2.2.3, eerste lid, onderdelen a tot en met h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.9.4.k
    text: |-
      documenten waaruit blijkt dat de aanvrager aantoonbaar toestemming heeft van de eigenaar van de locatie voor het
      plaatsen en exploiteren van publiek toegankelijke elektrische laadstations die geschikt zijn voor zware voertuigen;
      en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.4.l
    text: |-
      toestemming de laadlocatie, het aantal laadstations, het aantal laadpunten, het totale vermogen op de laadlocatie
      en indien van toepassing de opslagcapaciteit van de stationaire batterij van de aanvraag anoniem te publiceren.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.5
    text: |-
      In afwijking van het vierde lid, onderdeel j, hoeft de aanvrager niet te onderbouwen dat de laadlocatie voldoet aan
      [artikel 2.2.3, eerste lid, onderdeel d][ref1], indien de laadlocatie:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.9.5.a
    text: op een bedrijventerrein ligt; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.5.b
    text: een bestaand tankstation of laadstation betreft dat geschikt is voor zware voertuigen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
  - number: 2.2.9.6
    text: |-
      In aanvulling op het vierde lid bevat de aanvraag voor de subsidiabele activiteit, bedoeld in
      [artikel 2.2.3, tweede lid][ref1], een offerte met opslagcapaciteit en vermogen van de stationaire batterij waaruit
      blijkt dat de batterij communiceert met het laadstation waarvoor subsidie wordt aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.9
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.10.1
    text: |-
      Onverminderd [artikel 1.3][ref1] beslist de Minister afwijzend op een aanvraag om subsidie indien de aanvraag niet
      voldoet aan het bepaalde in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel1
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.10
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.2.10.2
    text: 'In aanvulling op het eerste lid beslist de Minister afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.10
  - number: 2.2.10.2.a
    text: de te verstrekken subsidie lager is dan € 25.000, of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.10
  - number: 2.2.10.2.b
    text: |-
      gedurende enig moment tijdens de looptijd van deze regeling door toekenning subsidie zou worden verleend voor meer
      dan vijf laadlocaties per tweecijferig postcodegebied als bedoeld in [bijlage 4][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0049842
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.10
    references:
      - id: ref1
        bwb_id: BWBR0049842
  - number: 2.2.11
    text: |-
      Op grond van [artikel 16 van het Kaderbesluit][ref1] zijn de regels inzake een subsidie van € 25.000 tot € 125.000
      van toepassing op subsidies van € 125.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel16
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '16'
  - number: 2.2.12.1
    text: |-
      In aanvulling op [artikel 17 van het Kaderbesluit][ref1] is de subsidieontvanger verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
  - number: 2.2.12.1.a
    text: |-
      alle laadpunten binnen twee jaar na de subsidieverlening volledig beschikbaar te hebben
      voor gebruik door zware elektrische wegvoertuigen, waarbij de laadlocatie voldoet aan
      [artikel 2.2.3, eerste lid, onderdelen a tot en met h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.12.1.b
    text: |-
      uiterlijk ten tijde van de aanvraag tot subsidievaststelling uitsluitend hernieuwbare elektriciteit te laten
      leveren voor de laadstations; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.12.1.c
    text: |-
      een laadsysteem te gebruiken dat permanent met het internet is verbonden waarbij de communicatie volgens het Open
      Charge Point Protocol versie 1.6 of hoger verloopt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.12.2
    text: |-
      In aanvulling op het eerste lid is de subsidieontvanger van een subsidie als bedoeld in
      [artikel 2.2.3, eerste lid][ref1], verplicht gedurende 36 aaneengesloten maanden na vaststelling van de subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.12.2.a
    text: |-
      de laadinfrastructuur in te zetten als laadinfrastructuur voor elektrische voertuigen die te allen tijde voor het
      publiek toegankelijk is; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.12.2.b
    text: de laadinfrastructuur als publiek toegankelijk laadstation op te laten nemen in het publieke register.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.12.3
    text: |-
      In aanvulling op het eerste lid is de subsidieontvanger van een subsidie als bedoeld in
      [artikel 2.2.3, tweede lid][ref1], verplicht gedurende 36 aaneengesloten maanden na vaststelling van de subsidie:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.12.3.a
    text: de stationaire batterij, zonder overdracht aan derden, in eigendom te hebben; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.12.3.b
    text: |-
      ervoor zorg te dragen dat ten minste 70% van het aantal kWh dat uit de stationaire batterij wordt ontladen, wordt
      geleverd aan laadstations.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.12
  - number: 2.2.13
    text: |-
      De Minister verstrekt ambtshalve, gelijktijdig met de beschikking tot subsidieverlening, een voorschot van 80
      procent van het totaal verleende bedrag.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.13
  - number: 2.2.14.1
    text: |-
      Binnen dertien weken nadat de activiteit is afgerond wordt door de subsidieontvanger een aanvraag tot
      subsidievaststelling ingediend met gebruikmaking van een door de Minister beschikbaar gesteld digitaal formulier
      dat wordt geplaatst op de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.2.14
  - number: 2.2.14.2
    text: |-
      In aanvulling op [artikel 24 van het Kaderbesluit][ref1] bevat de aanvraag tot vaststelling van de subsidie voor de
      subsidiabele activiteit, bedoeld in [artikel 2.2.3, eerste lid][ref2], in elk geval:


