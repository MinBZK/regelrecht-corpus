        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.9.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag om subsidie indienen door middel van een daartoe vastgesteld
      formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.9
  - number: 2.3.9.2
    text: |-
      Een aanvrager kan voor de subsidiabele activiteit bedoeld in [artikel 2.3.3, eerste of derde lid][ref1], per
      laadlocatie een aanvraag per kalenderjaar indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.9
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.11.1
    text: |-
      Indien de aangevraagde subsidie minder dan € 25.000 bedraagt, wordt de aanvraag voor de subsidiabele activiteit,
      bedoeld in [artikel 2.3.3, eerste lid][ref1], ingediend in hetzelfde kalenderjaar of binnen 13 weken na de datum
      waarop de installatiewerkzaamheden zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.11.2
    text: |-
      De aanvraag bevat, naast de in [artikel 10 van het Kaderbesluit][ref1] genoemde gegevens, ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 2.3.11.2.a
    text: |-
      gegevens over de aanvrager, waaronder het inschrijfnummer bij de Kamer van Koophandel, het post- en bezoekadres en
      het bankrekeningnummer;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.b
    text: een mkb-verklaring indien de aanvrager een mkb-onderneming is;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.c
    text: gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.d
    text: de doelgroep waartoe de gebruikers van de laadinfrastructuur behoren;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.e
    text: de postcode van de locatie waar de laadinfrastructuur is aangelegd;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.f
    text: |-
      een factuur voor de aanleg van de laadstations, voorzien van merk, type en specificaties van de laadstations,
      waaruit het aantal laadpunten, het vermogen aan het laadpunt en het vermogen van elk laadstation blijkt en waaruit
      blijkt op welke datum de installatiewerkzaamheden zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.g
    text: de-minimisverklaring; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.11.2.h
    text: |-
      een document waaruit blijkt dat de laadinfrastructuur permanent met het internet is verbonden en waarbij de
      communicatie volgens het Open Charge Point Protocol versie 1.6 of hoger verloopt teneinde sturing van het laden
      mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.11
  - number: 2.3.12.1
    text: |-
      Indien de aangevraagde subsidie ten minste € 25.000 bedraagt, bevat een aanvraag tot subsidieverlening
      voor de subsidiabele activiteit bedoeld in [artikel 2.3.3, eerste lid][ref1], naast de in
      [artikel 10 van het Kaderbesluit][ref2] genoemde gegevens ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 2.3.12.1.a
    text: |-
      gegevens over de aanvrager, waaronder het inschrijfnummer bij de Kamer van Koophandel, het post- en bezoekadres en
      het bankrekeningnummer;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.b
    text: een mkb-verklaring indien de aanvrager een mkb-onderneming is;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.c
    text: gegevens over de contactpersoon bij de aanvrager, waaronder de naam, het telefoonnummer en het e-mailadres;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.d
    text: de doelgroep waartoe de gebruikers van de laadinfrastructuur behoren;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.e
    text: de postcode van de locatie waar de laadinfrastructuur wordt aangelegd;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.f
    text: een contract met de netbeheerder dat de voorziene netcapaciteit dekt;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.g
    text: |-
      een offerte met merk, type en specificaties van de laadstations en met de installatiekosten waaruit het aantal
      laadpunten, het vermogen aan het laadpunt en het vermogen van elk laadstation blijkt en waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.g.i
    text: |-
      het laadsysteem permanent met het internet is verbonden en waarbij de communicatie volgens het Open Charge Point
      Protocol versie 1.6 of hoger verloopt teneinde sturing van het laden mogelijk te maken; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.g.ii
    text: het project gelet op de realisatiedatum uiterlijk 24 maanden na de verlening kan worden afgerond;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.1.h
    text: |-
      hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen subsidies van een bestuursorgaan of de
      Commissie van de Europese Unie voor de aanleg van laadinfrastructuur op dezelfde locatie.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.2
    text: |-
      In afwijking van eerste lid, onderdeel f, overlegt de aanvrager een capaciteitsberekening waarin wordt aangetoond
      dat de benodigde netcapaciteit binnen 24 maanden na de verlening gerealiseerd wordt, indien de benodigde
      netcapaciteit meer dan 50% is van het maximaal beschikbare vermogen op de huidige aansluiting, zoals blijkt uit het
      contract bedoeld in het eerste lid, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.3
    text: |-
      In aanvulling op eerste lid bevat de aanvraag voor de subsidiabele activiteit, bedoeld in
      [artikel 2.3.3, derde lid][ref1]: - een offerte met opslagcapaciteit, vermogen en C-waarde van de stationaire
      batterij, waaruit tevens blijkt dat de batterij communiceert met het laadstation waarvoor subsidie wordt
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.12.4
    text: 'Een OV-concessiehouder:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.4.a
    text: overlegt niet de gegevens, bedoeld in het eerste lid, onderdelen e en f, en het tweede lid;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.12.4.b
    text: vermeldt de datum van de gunning van de concessie waaruit blijkt dat hij batterij-elektrische bussen inzet.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.12
  - number: 2.3.13.1
    text: |-
      Onverminderd [artikel 1.3][ref1] beslist de Minister afwijzend op een aanvraag om subsidie indien de aanvraag niet
      voldoet aan het bepaalde in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel1
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.13
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.3.13.2
    text: |-
      In aanvulling op het eerste lid beslist de Minister afwijzend op een aanvraag om subsidie voor activiteiten bedoeld
      in [artikel 2.3.3, eerste lid][ref1], indien de te verstrekken subsidie lager is dan € 2.500.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.13
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.14.1
    text: De subsidie wordt direct vastgesteld indien de subsidieverlening minder dan € 25.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.14
  - number: 2.3.14.2
    text: |-
      Op grond van [artikel 16 van het Kaderbesluit][ref1] zijn de regels inzake een subsidie van € 25.000 tot € 125.000
      van toepassing op subsidies van € 125.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel16
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.14
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '16'
  - number: 2.3.15.1
    text: |-
      In aanvulling op [artikel 17 van het Kaderbesluit][ref1] is de subsidieontvanger verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
  - number: 2.3.15.1.a
    text: binnen 24 maanden na de subsidieverlening het project af te ronden en de laadinfrastructuur in gebruik te nemen;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
  - number: 2.3.15.1.b
    text: |-
      gedurende ten minste 24 maanden na vaststelling van de subsidie de laadinfrastructuur in te zetten als private
      laadinfrastructuur voor elektrische voertuigen die niet te allen tijde voor het publiek toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
  - number: 2.3.15.2
    text: |-
      De subsidieontvanger van een subsidie als bedoeld in [artikel 2.3.3, derde lid][ref1], is verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.15.2.a
    text: |-
      gedurende ten minste 24 aaneengesloten maanden na vaststelling van de subsidie de stationaire batterij, zonder
      overdracht aan derden, in eigendom te hebben en deze in te zetten ten behoeve van de laadinfrastructuur, bedoeld in
      het eerste lid;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
  - number: 2.3.15.2.b
    text: |-
      ervoor zorg te dragen dat ten minste 70% van het aantal kWh dat uit de stationaire batterij wordt ontladen, wordt
      geleverd aan laadstations.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.15
  - number: 2.3.16
    text: |-
      Indien de subsidieverlening € 25.000 of meer bedraagt, verstrekt de Minister gelijktijdig met de beschikking tot
      subsidieverlening een voorschot van 50 procent van het totaal verleende bedrag.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.16
  - number: 2.3.17.1
    text: |-
      Een subsidieontvanger kan bij de Minister een aanvraag tot vaststelling van de subsidie indienen door middel van
      een daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.17
  - number: 2.3.17.2
    text: |-
      De subsidieontvanger kan bij de Minister een eenmalig verzoek doen tot uitstel van ten hoogste 12 maanden van
      de indiening van de aanvraag, bedoeld in het eerste lid, indien hij kan aantonen dat de benodigde tijd voor de
      realisatie van de laadinfrastructuur langer is dan de periode, genoemd in [artikel 2.3.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.17
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.17.3
    text: |-
      In aanvulling op [artikel 24, derde lid, van het Kaderbesluit][ref1] bevat de aanvraag tot vaststelling van de
      subsidie voor de subsidiabele activiteit bedoeld in [artikel 2.3.3, eerste lid][ref2], in elk geval de postcode van
      de locatie waar de laadinfrastructuur op het elektriciteitsnet is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.17
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.17a.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 2.3.15, eerste lid, onderdeel b, of tweede lid][ref1],
      kan de Minister de vaststelling van de subsidie wijzigen en het onverschuldigd betaalde deel van de subsidie
      terugvorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.17a
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.17a.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/24e deel van het verstrekte
      subsidiebedrag, vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichting,
      bedoeld in [artikel 2.3.15, eerste lid, onderdeel b, of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.17a
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.18
    text: |-
      Subsidie voor de activiteiten, bedoeld in [artikel 2.3.3, eerste of derde lid][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.18
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.18.a
    text: verleend op basis van de de-minimisverordening indien de aangevraagde subsidie minder dan € 25.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.18
  - number: 2.3.18.b
    text: in andere gevallen verleend op basis van artikel 36bis van de algemene groepsvrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.18
  - number: 2.4.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *concessiehouder:* vergunninghoudende vervoerder als bedoeld in
      [artikel 1 van de Wet personenvervoer 2000][ref1], van een concessie voor openbaar busvervoer;
        - *emissieloos:* emissieloos als bedoeld in
      [artikel 86c van het Reglement verkeersregels en verkeerstekens 1990][ref2];
        - *emissieloze touringcar:* emissieloos batterij-elektrisch motorvoertuig dat blijkens het kentekenregister of een
      aantekening op het kentekenbewijs is goedgekeurd voor een maximumsnelheid van 100 kilometer per uur;
        - *groep:* groep als bedoeld in [artikel 2:24b van het Burgerlijk Wetboek][ref3];
        - *kleine onderneming:* kleine onderneming als bedoeld in artikel 2, tweede of derde lid, van bijlage I bij de
      algemene groepsvrijstellingsverordening;
        - *middelgrote onderneming:* mkb-onderneming die niet kwalificeert als kleine onderneming;
        - *nieuwe emissieloze touringcar:* emissieloze touringcar waarvan, blijkens vermelding in het kentekenregister, de
      datum eerste toelating, de datum eerste inschrijving in Nederland en de datum tenaamstelling, gelijk zijn;
        - *offerte:* formeel, schriftelijk, aanbod tot het sluiten van een overeenkomst voor de aanschaf van een nieuwe
      emissieloze touringcar, opgesteld op verzoek van de aanvrager;
        - *openbaar busvervoer:* voor een ieder openstaand personenvervoer met een bus volgens een dienstregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel86c
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: 86c
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 2.4.2
    text: |-
      Deze paragraaf heeft tot doel het stimuleren van de aanschaf van nieuwe emissieloze touringcars door ondernemingen
      teneinde de emissie van CO en luchtverontreinigende stoffen te verminderen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.2
  - number: 2.4.3
    text: |-
      De minister kan aan een aanvrager subsidie verstrekken voor de aanschaf van één of meerdere nieuwe emissieloze
      touringcars van categorie M3.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.3
  - number: 2.4.4
    text: 'Subsidie kan worden aangevraagd door:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.4
  - number: 2.4.4.a
    text: een concessiehouder;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.4
  - number: 2.4.4.b
    text: een andere onderneming die is ingeschreven bij de Kamer van Koophandel en die een vestiging in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.4
  - number: 2.4.5
    text: |-
      De kosten die op grond van artikel 36ter van de algemene groepsvrijstellingsverordening voor subsidie in aanmerking
      komen, zijn subsidiabel.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.5
  - number: 2.4.6.1
    text: |-
      De subsidie bedraagt ten hoogste 30% van de op grond van artikel 36ter van de algemene
      groepsvrijstellingsverordening in aanmerking komende kosten, tot een maximum van € 90.000 per emissieloze
      touringcar.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.6
  - number: 2.4.6.2
    text: 'De steunintensiteit bedoeld in het eerste lid wordt:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.6
  - number: 2.4.6.2.a
    text: |-
      met 20 procentpunten verhoogd voor subsidie aan een middelgrote onderneming, tot een maximum van € 150.000 per
      emissieloze touringcar;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.6
  - number: 2.4.6.2.b
    text: |-
      met 30 procentpunten verhoogd voor subsidie aan een kleine onderneming, tot een maximum van € 180.000 per
      emissieloze touringcar.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.6
  - number: 2.4.6.3
    text: |-
      Onverminderd [artikel 5 van het Kaderbesluit][ref1] wordt de overschrijding in mindering gebracht op het
      subsidiebedrag wanneer het subsidiebedrag, bedoeld in het eerste of tweede lid, de maximale steunruimte van de
      algemene groepsvrijstellingsverordening overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel5
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '5'
  - number: 2.4.7.1
    text: |-
      Het subsidieplafond voor aanvragers als bedoeld in [artikel 2.4.4, onderdeel a][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.7.1.a
    text: 'voor het jaar 2025: € 3.500.000;'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.1.b
    text: 'voor het jaar 2026: € 2.290.000.'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.2
    text: |-
      Het subsidieplafond voor aanvragers als bedoeld in [artikel 2.4.4, onderdeel b][ref1], bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.7.2.a
    text: 'voor het jaar 2025: € 3.500.000;'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.2.b
    text: 'voor het jaar 2026: € 10.000.000.'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.3
    text: |-
      Indien een subsidieplafond als bedoeld in het eerste lid voor dat jaar ontoereikend is om alle daarvoor in
      aanmerking komende aanvragen te kunnen toewijzen, worden de bedragen aangevuld met de voor dat jaar onaangesproken
      middelen gereserveerd op grond van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.4
    text: |-
      Indien een subsidieplafond als bedoeld in het tweede lid voor dat jaar ontoereikend is om alle daarvoor in
      aanmerking komende aanvragen te kunnen toewijzen, worden de bedragen aangevuld met de voor dat jaar onaangesproken
      middelen gereserveerd op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.5
    text: |-
      De minister stelt het subsidieplafond vast voor de jaren na 2025 en geeft hiervan kennis in de Staatscourant voor
      aanvang van het kalenderjaar waarvoor het betreffende subsidieplafond wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.7.6
    text: |-
      De minister verdeelt de in de betreffende subsidieperiode beschikbare gelden op volgorde van binnenkomst van de
      aanvragen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.7
  - number: 2.4.8
    text: 'Een aanvraag tot subsidieverlening op grond van deze paragraaf kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.8
  - number: 2.4.8.a
    text: in 2025 van 11 februari 2025, 9.00 uur tot en met 30 mei 2025, 12.00 uur;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.8
  - number: 2.4.8.b
    text: in 2026 van 10 februari 2026, 9.00 uur tot en met 30 november 2026, 17.00 uur.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.8
  - number: 2.4.9.1
    text: |-
      Een aanvrager kan bij de minister een aanvraag om subsidie indienen door middel van een daartoe vastgesteld
      formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2
    text: |-
      Een aanvraag tot subsidieverlening bevat naast de in [artikel 10 van het Kaderbesluit][ref1] genoemde gegevens
      ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel10
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '10'
  - number: 2.4.9.2.a
    text: naam en adres van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2.b
    text: contactgegevens van de contactpersoon van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2.c
    text: merk, type en handelsbenaming van de nieuwe emissieloze touringcar waarvoor subsidie wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2.d
    text: |-
      hoogte van het bedrag van eventuele reeds aangevraagde of ontvangen subsidies van een bestuursorgaan of de
      Commissie van de Europese Unie voor de aanschaf van een of meerdere nieuwe emissieloze touringcars;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2.e
    text: |-
      kopie van de offerte, met inbegrip van de offerteprijs, voor de voorgenomen aanschaf van de nieuwe emissieloze
      touringcar;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.9.2.f
    text: een bewijs van minder dan zes maanden oud waaruit blijkt wat de prijs van het referentievoertuig is.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.9
  - number: 2.4.10.1
    text: |-
      Onverminderd [artikel 1.3][ref1] beslist de minister afwijzend op een aanvraag om subsidie indien de aanvraag niet
      voldoet aan het bepaalde in deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel1
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.4.10.2
    text: 'In aanvulling op het eerste lid beslist de minister afwijzend op een aanvraag om subsidie indien:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
  - number: 2.4.10.2.a
    text: een emissieloze touringcar ten tijde van de aanvraag om subsidieverlening al is tenaamgesteld;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
  - number: 2.4.10.2.b
    text: |-
      aan de aanvrager, dan wel aan aanvragers die tot eenzelfde groep behoren, op grond van deze regeling reeds voor de
      aanschaf van:
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
  - number: 2.4.10.2.b.1°
    text: |-
      15 emissieloze touringcars subsidie is verstrekt onder een subsidieplafond als bedoeld in
      [artikel 2.4.7, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.10.2.b.2°
    text: |-
      12 emissieloze touringcars subsidie is verstrekt onder een subsidieplafond als bedoeld in
      [artikel 2.4.7, tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.10.2.c
    text: de te verstrekken subsidie lager is dan € 25.000.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.10
  - number: 2.4.11
    text: |-
      Op grond van [artikel 16 van het Kaderbesluit][ref1] zijn de regels inzake een subsidie van € 25.000 tot € 125.000
      van toepassing op subsidies van € 125.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel16
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.11
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '16'
  - number: 2.4.12.1
    text: |-
      Onverminderd [artikel 17][ref1] en [18 van het Kaderbesluit][ref2] is de subsidieontvanger verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0036381#Artikel18
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0036381
        artikel: '18'
  - number: 2.4.12.1.a
    text: |-
      onverwijld schriftelijk mededeling te doen aan de minister van gewijzigde omstandigheden of wijziging van gegevens
      die van belang zijn in verband met de subsidieverstrekking op grond van deze regeling;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
  - number: 2.4.12.1.b
    text: |-
      medewerking te verlenen aan de controle op de uitvoering van de verplichtingen die zijn gesteld in deze regeling en
      de beschikking;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
  - number: 2.4.12.1.c
    text: |-
      de nieuwe emissieloze touringcar waarvoor subsidie is verleend op zijn naam te stellen of een
      verstrekkingsvoorbehoud als bedoeld in [artikel 25 van het Kentekenreglement][ref1] op zijn naam te registreren in
      het kentekenregister; en


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '25'
  - number: 2.4.12.1.d
    text: |-
      er zorg voor te dragen dat de nieuwe emissieloze touringcar gedurende vier jaar vanaf de datum van
      de eerste inschrijving en tenaamstelling, of registratie van het verstrekkingsvoorbehoud bedoeld in
      [artikel 25 van het Kentekenreglement][ref1], ononderbroken op zijn naam is gesteld of een verstrekkingsvoorbehoud
      op zijn naam is geregistreerd in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '25'
  - number: 2.4.12.2
    text: |-
      De verplichting, bedoeld in het eerste lid, onderdeel d, geldt niet indien de subsidieontvanger de nieuwe
      emissieloze touringcar vervangt door een andere nieuwe emissieloze touringcar die ook in aanmerking zou zijn
      gekomen voor subsidie op grond van deze regeling en dit andere voertuig gedurende de nog resterende termijn van de
      periode, genoemd in het eerste lid, onderdeel d, op zijn naam is gesteld of middels een verstrekkingsvoorbehoud op
      zijn naam is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
  - number: 2.4.12.3
    text: |-
      De uitzondering van het tweede lid geldt niet wanneer de subsidieontvanger voor de vervangende nieuwe emissieloze
      touringcar subsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
  - number: 2.4.12.4
    text: |-
      Indien de nieuwe emissieloze touringcar wordt vervangen door een andere nieuwe emissieloze touringcar als bedoeld
      in het tweede lid, is de subsidieontvanger verplicht om gedurende de in dat lid bedoelde resterende termijn te
      beschikken over de overeenkomst tot aanschaf van de vervangende nieuwe emissieloze touringcar.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.12
  - number: 2.4.13
    text: Gelijktijdig met de beschikking tot subsidieverlening wordt 70% van het subsidiebedrag als voorschot verstrekt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.13
  - number: 2.4.14.1
    text: |-
      Een aanvrager kan bij de minister een aanvraag tot vaststelling van de subsidie indienen door middel van een
      daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
  - number: 2.4.14.2
    text: |-
      De aanvraag tot subsidievaststelling kan worden ingediend tot uiterlijk 12 maanden na de datum van verlening van
      de subsidie.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
  - number: 2.4.14.3
    text: |-
      De aanvrager kan bij RVO een verzoek doen tot uitstel van maximaal 12 maanden van de indiening van de aanvraag,
      bedoeld in het tweede lid, indien hij kan aantonen dat de levertijd van de nieuwe emissieloze touringcar langer is
      dan de periode, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
  - number: 2.4.14.4
    text: |-
      Onverminderd [artikel 24 van het Kaderbesluit][ref1] bevat de aanvraag tot vaststelling van de subsidie voor de
      subsidiabele activiteit, bedoeld in [artikel 2.4.3][ref2], in elk geval de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.14.4.a
    text: het kenteken van de nieuwe emissieloze touringcar dat is vermeld in de overeenkomst; en
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
  - number: 2.4.14.4.b
    text: de gespecificeerde factuur tot betaling.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.14
  - number: 2.4.15.1
    text: |-
      Indien niet is voldaan aan het bepaalde in [artikel 2.4.12, eerste lid, onderdeel d][ref1], kan de minister de
      vaststelling van de subsidie wijzigen en het onverschuldigd betaalde deel van de subsidie terugvorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.15
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.15.2
    text: |-
      Het terug te vorderen bedrag wordt bepaald door de subsidie te verminderen met 1/48e van het verstrekte
      subsidiebedrag vermenigvuldigd met het aantal volledige maanden waarin niet is voldaan aan de verplichting, bedoeld
      in [artikel 2.4.12, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.4.15
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '3.1'
    text: |-
      Deze regeling treedt in werking met ingang van 1 juli 2024 en vervalt met ingang van 1 juli 2029, met dien
      verstande dat zij van toepassing blijft op subsidies die voor de laatstgenoemde datum zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel3.1
  - number: '3.2'
    text: |-
      De subsidieontvanger verleent gedurende vijf jaar na de datum van de beschikking tot subsidievaststelling
      medewerking aan een evaluatie van de effecten van de door hem op grond van deze regeling uitgevoerde activiteiten,
      voor zover deze medewerking redelijkerwijs van hem kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel3.2
  - number: '3.3'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling zero-emissie mobiliteit.'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel3.3
