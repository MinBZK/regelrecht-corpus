  - number: 2.3.7b.5
    text: |-
      In afwijking van het derde lid vindt, indien een gevraagde subsidie niet geheel doch voor ten minste 70 procent kan
      worden verstrekt omdat een subsidieplafond bijna is bereikt, overleg plaats met de aanvrager.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.7b
  - number: 2.3.8.1
    text: |-
      Een aanvraag tot subsidievestrekking op grond van deze paragraaf kan worden ingediend van 24 september 2024, 9.00
      uur tot en met 31 december 2024, 12.00 uur voor het subsidieplafond bedoeld in [artikel 2.3.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.8
    references:
