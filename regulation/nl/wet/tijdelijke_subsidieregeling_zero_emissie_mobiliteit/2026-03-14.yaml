  - number: 2.1.12.1
    text: |-
      In aanvulling op [artikel 17 van het Kaderbesluit][ref1] is de subsidieontvanger verplicht het project binnen 36
      maanden na de subsidieverlening af te ronden.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel17
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '17'
  - number: 2.1.12.2
    text: |-
      In aanvulling op het eerste lid is de exploitant van het waterstoftankstation bij de subsidiabele activiteit
      bedoeld in [artikel 2.1.3, eerste lid][ref1], verplicht een van de volgende soorten waterstof te leveren:


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.12.2.a
    text: |-
      blauwe waterstof, te weten waterstof geproduceerd uit fossiele brandstoffen, waarbij gebruikt wordt gemaakt van CO-
      afvang en opslag;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.2.b
    text: waterstof als bijproduct uit chlor-alkali-proces op basis van gecertificeerde hernieuwbare elektriciteit;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.2.c
    text: waterstof verkregen uit steam methane reforming op basis van gecertificeerd groen gas; of
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.2.d
    text: hernieuwbare waterstof.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.3
    text: |-
      In aanvulling op het eerste lid is de subsidieontvanger bij de subsidiabele activiteit bedoeld in
      [artikel 2.1.3, eerste lid][ref1], voor zover het de aanschaf van één of meerdere nieuwe emissievrije lichte of
      zware waterstofvoertuigen betreft, verplicht er zorg voor te dragen dat het nieuwe emissievrije waterstofvoertuig
      gedurende 48 maanden vanaf de datum van de eerste inschrijving en tenaamstelling, of registratie van het
      verstrekkingsvoorbehoud bedoeld in [artikel 25 van het Kentekenreglement][ref2], ononderbroken op zijn naam is
      gesteld of een verstrekkingsvoorbehoud op zijn naam is geregistreerd in het kentekenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006951#Artikel25
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0006951
        artikel: '25'
  - number: 2.1.12.4
    text: |-
      De verplichting bedoeld in het derde lid geldt niet indien de subsidieontvanger het nieuwe emissievrije
      waterstofvoertuig vervangt door een ander nieuw emissievrij waterstofvoertuig dat ook in aanmerking zou zijn
      gekomen voor subsidie op grond van deze paragraaf en dit andere voertuig gedurende de nog resterende termijn van
      de periode, genoemd in het tweede lid, op zijn naam is gesteld of middels een verstrekkingsvoorbehoud op zijn naam
      is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.5
    text: |-
      De uitzondering van het vierde lid geldt niet wanneer de subsidieontvanger voor het vervangende nieuwe emissievrije
      waterstofvoertuig subsidie aanvraagt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.6
    text: |-
      Indien het nieuwe emissievrije waterstofvoertuig wordt vervangen door een ander nieuw emissievrij waterstofvoertuig
      als bedoeld in het vierde lid, is de subsidieontvanger verplicht om gedurende de in dat lid bedoelde resterende
      termijn te beschikken over het vervangende nieuwe emissievrije waterstofvoertuig.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.7
    text: |-
      In aanvulling op het eerste lid is de subsidieontvanger bij de subsidiabele activiteit bedoeld in
      [artikel 2.1.3][ref1], eerste lid, voor zover het betreft retrofitting van één of meerdere vervoermiddelen,
      verplicht gedurende 48 maanden na het sluiten van de overeenkomst op basis waarvan de retrofitting heeft
      plaatsgevonden het emissievrije waterstofvoertuig, zonder overdracht aan derden, in eigendom te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
    references:
      - id: ref1
        bwb_id: BWBR0049842
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.12.8
    text: |-
      In aanvulling op het eerste lid is de subsidieontvanger bij de subsidiabele activiteit bedoeld in
      [artikel 2.1.3, tweede en derde lid][ref1], verplicht er zorg voor te dragen het emissievrije logistieke
      waterstofwerktuig gedurende 48 maanden na het sluiten van de overeenkomst op basis waarvan de aanschaf of
      retrofitting heeft plaatsgevonden, zonder overdracht aan derden, in eigendom te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
    references:
