    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.7
  - number: 2.3.7.4
    text: De Minister verdeelt het beschikbare bedrag op volgorde van binnenkomst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.7
  - number: 2.3.7.5
    text: |-
      In afwijking van het vierde lid geldt voor een volledige aanvraag voor een subsidie van minder dan € 25.000 die
      is ingediend op de dag dat of nadat het subsidieplafond voor het betreffende jaar is bereikt, en die na de loting
      bedoeld in [artikel 8, derde lid, onderdeel b van het Kaderbesluit][ref1] geen subsidie ontvangt, als datum van
      indiening de eerste dag waarop in het daaropvolgende jaar een aanvraag kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel8
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.7
    references:
      - id: ref1
        bwb_id: BWBR0036381
        artikel: '8'
