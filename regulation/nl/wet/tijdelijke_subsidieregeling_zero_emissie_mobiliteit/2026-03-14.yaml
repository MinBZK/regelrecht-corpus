      indien de aanvraag voor het onderdeel dat ziet op het vervoer over de binnenwateren meer dan € 2,2 miljoen subsidie
      betreft een onderbouwing waaruit blijkt de subsidie niet hoger is dan het verschil tussen de in aanmerking komende
      kosten en de exploitatiewinst van de investering, waarbij de exploitatiewinst vooraf op basis van redelijke
      prognoses op de in aanmerking komende kosten in mindering wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.10a
