      een onderbouwing waaruit blijkt dat het multimodale waterstoftankstation op gelijke en niet-discriminerende wijze
      tegen marktvoorwaarden aan belangstellende gebruikers beschikbaar wordt gesteld, en,
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.10a
