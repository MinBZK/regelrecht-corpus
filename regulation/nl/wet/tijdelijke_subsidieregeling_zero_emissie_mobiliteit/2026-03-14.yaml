      voor een openbaar toegankelijk waterstoftankstation in een gemeente die is opgenomen in [bijlage 1][ref2], plus
      maximaal 10 rijkilometers vanaf de gemeentegrens, heeft deze aanvraag, in afwijking van het bepaalde in het zesde
      lid, voorrang op aanvragen van een samenwerkingsverband waarvoor geldt dat het waterstoftankstation is of wordt
      gevestigd in een gemeente die niet in bijlage 1 is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0049842
