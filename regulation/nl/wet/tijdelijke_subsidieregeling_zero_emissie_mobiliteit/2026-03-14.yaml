      [artikel 2.3.3, eerste en derde lid][ref1], voor het jaar 2026 € 9.000.000.


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.7b
