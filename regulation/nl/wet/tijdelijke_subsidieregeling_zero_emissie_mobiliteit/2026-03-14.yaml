        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.8.2
    text: |-
      Een aanvraag tot subsidievestrekking op grond van deze paragraaf kan worden ingediend van 25 maart 2025, 9.00 uur
      tot en met 19 december 2025, 12.00 uur voor het subsidieplafond bedoeld in [artikel 2.3.7a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.8
