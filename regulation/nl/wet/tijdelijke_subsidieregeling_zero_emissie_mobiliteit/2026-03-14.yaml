    text: |-
      de mate waarin de financiële middelen effectiever en efficiënter worden ingezet, blijkend uit de hoogte
      van de gevraagde subsidie afgezet tegen de dagcapaciteit vermenigvuldigd met het aantal tankpunten van het
      waterstoftankstation, te waarderen met maximaal 70 punten;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.8
  - number: 2.1.8.1.b
    text: |-
