  - number: 2.3.8.3
    text: |-
      Een aanvraag tot subsidieverstrekking op grond van deze paragraaf kan worden ingediend van 20 januari 2026,
      9.00 uur tot en met 18 december 2026, 12.00 uur voor het subsidieplafond bedoeld in [artikel 2.3.7b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.8
    references:
