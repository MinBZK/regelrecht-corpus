articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *aanschaf:* verkrijging van de eigendom, bedoeld in
      [artikel 84, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1], krachtens koop of financial leasing als
      bedoeld in [paragraaf 3.2 van het Besluit heffing omzetbelasting bij leasing](onbekend);
        - *categorie:* voertuigcategorie als bedoeld in artikel 4 van [verordening (EU) 2018/858](32018R0858);
        - *groep:* groep als bedoeld in [artikel 2:24b van het Burgerlijk Wetboek][ref2];
        - *grote onderneming:* onderneming als bedoeld in artikel 2, onderdeel 24, van de algemene
      groepsvrijstellingsverordening;
        - *Kaderbesluit:* [Kaderbesluit subsidies I en M][ref3];
        - *Minister:* Minister van Infrastructuur en Waterstaat;
        - *mkb-onderneming:* onderneming in de zin van artikel 2, onderdeel 2, van de algemene
      groepsvrijstellingsverordening;
        - *offerteprijs:* prijs inclusief af fabriek opties zoals vermeld in de offerte, verminderd met de daarin begrepen
      omzetbelasting;
        - *overeenkomst:* schriftelijke overeenkomst tot koop als bedoeld in
      [artikel 1 van Boek 7 van het Burgerlijk Wetboek][ref4] of een schriftelijke overeenkomst tot financial leasing
      als bedoeld in [paragraaf 3.2 van het Besluit heffing omzetbelasting bij leasing](onbekend);
        - *referentievoertuig:* vervoermiddel van dezelfde categorie, of zelfde soort logistiek werktuig als genoemd in
      [bijlage 3][ref5], dat aan reeds van kracht zijnde toepasselijke Unienormen voldoet en dat zonder de steun zou
      zijn aangeschaft;
        - *RVO:* Rijksdienst voor Ondernemend Nederland;
        - *verordening (EU) 2018/858:* [verordening (EU) 2018/858](32018R0858) van het Europees Parlement en de Raad
      van 30 mei 2018 betreffende de goedkeuring van en het markttoezicht op motorvoertuigen en aanhangwagens daarvan
      en systemen, onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd, tot wijziging van
      [Verordeningen (EG) nr. 715/2007](32007R0715) en [(EG) nr. 595/2009](32009R0595) en tot intrekking van [Richtlijn
      2007/46/EG](32007L0046) (PbEU 2018, L151);
        - *verordening 2023/1804:* [verordening (EU) 2023/1804](32023R1804) van het Europese Parlement en de Raad van
      13 september 2023 betreffende de uitrol van infrastructuur voor alternatieve brandstoffen en tot intrekking van
      [Richtlijn 2014/94/EU](32014L0094) van het Europese Parlement en de raad (PbEU 2023, L234).


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
      [ref3]: https://wetten.overheid.nl/BWBR0036381
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0049842
