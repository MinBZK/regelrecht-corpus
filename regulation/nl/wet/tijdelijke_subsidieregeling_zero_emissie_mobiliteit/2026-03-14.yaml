      indiening van de aanvraag, bedoeld in het eerste lid, indien hij kan aantonen dat de benodigde tijd voor de
      realisatie van de laadinfrastructuur langer is dan de periode, genoemd in [artikel 2.2.12, onderdeel a][ref1].


