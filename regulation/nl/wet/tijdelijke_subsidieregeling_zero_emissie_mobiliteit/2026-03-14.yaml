    text: |-
      Voor een volledige aanvraag als bedoeld in [artikel 2.3.11][ref1] die in 2026 is ingediend
      op de dag dat of nadat het subsidieplafond is bereikt, en die na de loting bedoeld in
      [artikel 8, derde lid, onderdeel b van het Kaderbesluit][ref2] geen subsidie ontvangt, geldt als datum van
