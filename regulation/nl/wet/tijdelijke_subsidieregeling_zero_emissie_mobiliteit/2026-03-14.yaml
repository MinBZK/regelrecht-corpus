    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.4.b
    text: voor een mkb-onderneming € 85 per kWh opslag.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.5
    text: 'Onverminderd het eerste en vierde lid bedraagt de subsidie ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.5.a
    text: 40% van de subsidiabele kosten voor een mkb-onderneming;
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.6.5.b
    text: 20% van de subsidiabele kosten voor een grote onderneming.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.3.6
  - number: 2.3.7.1
    text: |-
