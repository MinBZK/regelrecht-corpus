        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.12.9
    text: |-
      De Minister kan op verzoek van de subsidieontvanger uitstel verlenen van de verplichting, bedoeld in het eerste
      lid, indien de subsidieontvanger kan aantonen dat de benodigde tijd voor de realisatie van het project langer is
      dan 36 maanden.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.10
    text: |-
      Het project eindigt na het verlenen van uitstel als bedoeld in het negende lid uiterlijk 48 maanden na de
      subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.12.11
    text: De Minister kan in de beschikking tot subsidieverlening nadere verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.12
  - number: 2.1.13.1
    text: Met de beschikking tot subsidieverlening wordt 50% van het verleende subsidiebedrag als voorschot verstrekt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.13
  - number: 2.1.13.2
    text: |-
      Als minimaal 75% van de zware waterstofvoertuigen van categorie M3, N2 of N3 is aangeschaft, kan op verzoek van de
      aanvrager een aanvullend voorschot van 25% van het verleende subsidiebedrag worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.13
  - number: 2.1.13.3
    text: |-
      Het aanvullend voorschot, bedoeld in het tweede lid, wordt verstrekt na het overleggen van de kentekens van de
      reeds aangeschafte zware waterstofvoertuigen.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.13
  - number: 2.1.14.1
    text: |-
      Een aanvrager kan bij de Minister een aanvraag tot vaststelling van de subsidie indienen door middel van een
      daartoe vastgesteld formulier dat beschikbaar is via de website van RVO.
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.14
  - number: 2.1.14.2
    text: |-
      In aanvulling op [artikel 24 van het Kaderbesluit][ref1] bevat de aanvraag tot vaststelling van de subsidie voor de
      subsidiabele activiteit bedoeld in [artikel 2.1.3, eerste lid][ref2], voor zover het betreft de investering in de
      aanleg of opwaardering van een waterstoftankstation dat geschikt is of wordt voor zwaar wegvervoer, in elk geval de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0036381#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0049842#Artikel2
    url: https://wetten.overheid.nl/BWBR0049842/2026-03-14#Artikel2.1.14
