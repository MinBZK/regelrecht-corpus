preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is met het oog op terugdringing van het
    arbeidsongeschiktheidsvolume het arbeidsongeschiktheidscriterium in de Wet op de arbeidsongeschiktheidsverzekering,
    de Algemene Arbeidsongeschiktheidswet en de overheidspensioenwetten te herzien en het recht op uitkering
    ingevolge die wetten aan een termijn te binden, in de Wet op de arbeidsongeschiktheidsverzekering en de
    overheidspensioenwetten de hoogte van de arbeidsongeschiktheidsuitkering in verband te brengen met de leeftijd,
    waarop de uitkering wordt toegekend en een stimuleringsmaatregel te treffen voor arbeidsongeschikten die
    herintreden op de arbeidsmarkt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006072/2009-10-01#ArtikelAanhef
articles:
  - number: VIII
    text: |-
      Voor de toepassing van dit hoofdstuk wordt als arbeidsongeschikte aangemerkt de persoon:

      a. die op 31 januari 1992 recht heeft op uitkering op grond van de Algemene Arbeidsongeschiktheidswet dan
      wel de [Wet op de arbeidsongeschiktheidsverzekering][ref1], waaronder begrepen een uitkering op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref2] (*Stb.* 1972, 313), en op wie voor
      genoemde dag [artikel 52 van de Invoeringswet stelselherziening sociale zekerheid][ref3] (*Stb.* 1987, 94) van
      toepassing was;

      b. die sinds 1 januari 1990 onafgebroken recht heeft op uitkering op grond van de Algemene
      Arbeidsongeschiktheidswet dan wel de [Wet op de arbeidsongeschiktheidsverzekering][ref4], waaronder begrepen een
      uitkering op grond van [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref5], en op de dag
      waarop deze wet in werking treedt de leeftijd van 50 jaar heeft bereikt;

      c. op wie de bepalingen van de artikelen[ XX][ref6] en[ XXIII][ref7] van deze wet van toepassing zijn en die op 31
      januari 1992 en sinds 1 januari 1990 onafgebroken recht heeft op een aanvulling als bedoeld in deze artikelen.


