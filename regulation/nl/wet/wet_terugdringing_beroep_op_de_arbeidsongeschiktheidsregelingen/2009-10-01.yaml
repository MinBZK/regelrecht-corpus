  - number: XXVIIA
    text: |-
      1 In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken gerekend vanaf de dag na die waarop de termijn
      voor het indienen van het bezwaarschrift is verstreken.

      2 Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of indien zij advies vraagt
      aan een deskundige die niet onder haar verantwoordelijkheid werkzaam is binnen eenentwintig weken, gerekend vanaf
      de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
    url: https://wetten.overheid.nl/BWBR0006072/2009-10-01#ArtikelXXVIIA
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 7:10
  - number: XXVIIB
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de behandeling van
      bezwaarschriften tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0006072/2009-10-01#ArtikelXXVIIB
  - number: XXVIII
    text: |-
      In [artikel 52, derde lid, van de Invoeringswet stelselherziening sociale zekerheid][ref1], zoals deze luidt op
      de dag waarop deze wet in werking treedt, wordt na "arbeidsongeschiktheidsregelingen" op de gebruikelijke wijze
      ingevoegd de jaargang en het nummer van het *Staatsblad* waarin deze wet is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel52
    url: https://wetten.overheid.nl/BWBR0006072/2009-10-01#ArtikelXXVIII
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '52'
  - number: XXIX
    text: |-
      1 Deze wet, met uitzondering van [artikel II, onderdeel L][ref1], treedt in werking op een bij koninklijk besluit
      te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.

      2 Bij koninklijk besluit kan de datum van 1 februari 1994, genoemd in [artikel IX, eerste lid][ref2], later worden
      gesteld.

      3 [Artikel II, onderdeel L][ref3], treedt in werking met ingang van 1 maart 1993. Indien het *Staatsblad* waarin
      deze wet wordt geplaatst, wordt uitgegeven na 28 februari 1993, treedt dit artikel in werking met ingang van de dag
      na de datum van uitgifte van het *Staatsblad*, waarin deze wet wordt geplaatst, en werkt terug tot en met 1 maart
      1993.


