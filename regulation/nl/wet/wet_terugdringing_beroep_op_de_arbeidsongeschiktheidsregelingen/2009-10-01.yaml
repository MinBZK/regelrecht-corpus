  - number: XII
    text: |-
      De stimuleringsuitkering is geen inkomen in de zin van de artikelen 6 en
      10 van de Algemene Arbeidsongeschiktheidswet, de [Toeslagenwet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] (*Stb.* 1987, 92),
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] (*Stb.* 1987,
      281) en de [Wet werk en bijstand][ref4] en geen inkomen uit of in verband met arbeid in de zin van de Algemene
      burgerlijke pensioenwet, de Spoorwegpensioenwet en de Algemene militaire pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0015703
