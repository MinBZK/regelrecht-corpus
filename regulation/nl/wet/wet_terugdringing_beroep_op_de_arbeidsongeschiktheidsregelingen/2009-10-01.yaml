  - number: XVII
    text: |-
      1 De [artikelen 21][ref1], [22][ref2], [40][ref3], [48][ref4], [53][ref5] en [59][ref6], zoals die artikelen
      luidden op de dag, voorafgaande aan die waarop [artikel I][ref7] van deze wet in werking treedt, blijven van
      toepassing op de persoon die:

      a. op de dag, voorafgaande aan die waarop [artikel I][ref8] van deze wet in werking treedt, recht had op uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref9], waaronder begrepen een uitkering op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref10]; of

      b. op 25 januari 1993 ongeschikt is tot werken wegens ziekte dan wel wiens ongeschiktheid tot werken
      wegens ziekte intreedt na deze datum en tevens binnen een maand nadat een vóór die datum gelegen
      periode van ongeschiktheid door herstel is geëindigd, en die nadat deze ongeschiktheid 52 weken
      heeft geduurd, recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref11] of een arbeidsongeschiktheidsuitkering op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref12].

      De [artikelen 21][ref13] en [21][ref14] zijn op de onder *a* en *b* bedoelde personen niet van toepassing.

      2 In afwijking van het eerste lid is
      [artikel 21, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref15], zoals dat artikel luidt na
      inwerkingtreding van deze wet, van toepassing op de in het eerste lid bedoelde personen.

      3 In afwijking van het eerste lid wordt voor de toepassing van:

      a. [artikel 53, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref16] voor de zinsnede «tot en met
      de laatste dag der tweede maand, volgende op die waarin het overlijden plaatsvond» gelezen: tot en met één maand na
      de dag van het overlijden; en

      b. voor de toepassing van [artikel 53, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref17]
      slechts als echtgenoot aangemerkt niet gehuwde personen van verschillend of gelijk geslacht, die duurzaam een
      gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste graad
      bestaat.


