  - number: XIX
    text: |-
      1 Indien vanaf de datum van inwerkingtreding van deze wet artikel 33 van de Algemene Arbeidsongeschiktheidswet
      dan wel [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt toegepast ten aanzien van
      een persoon op wie onmiddellijk voorafgaande aan de inwerkingtreding van deze wet artikel 34 van de Algemene
      Arbeidsongeschiktheidswet dan wel [artikel 45 van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      werd toegepast, dient er voor de toepassing van het genoemde artikel 33, tweede lid, dan wel
      [artikel 44, tweede lid][ref3], van worden uitgegaan dat de in die artikelen genoemde termijn van 3 jaren is
      aangevangen op de datum van inwerkingtreding van deze wet.

      2 Indien op of na de datum van inwerkingtreding van deze wet artikel 33 van de Algemene Arbeidsongeschiktheidswet
      dan wel [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref4] wordt toegepast ten aanzien van de
      persoon:

      a. als bedoeld in het eerste lid;

      b. op wie onmiddellijk voorafgaande aan de inwerkingtreding van deze wet artikel 33 van de Algemene
      Arbeidsongeschiktheidswet dan wel [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref5] werd
      toegepast;

      c. als bedoeld in [artikel XVI, derde lid][ref6];

      d. als bedoeld in [artikel XVI, eerste lid][ref7],

      wordt ten aanzien van deze persoon onder de in artikel 5, vijfde lid, bedoelde arbeid en onder de in artikel
      18, vijfde lid, bedoelde arbeid in het eerste en tweede lid van respectievelijk genoemd artikel 33 en 44
      verstaan, de arbeid in genoemde artikelen 18 en 5, zoals deze artikelen luidden op de dag, voorafgaande aan die
      waarop deze wet in werking treedt, met dien verstande dat ten aanzien van de persoon, bedoeld in de onderdelen
      *a* tot en met *c* laatstbedoelde arbeid in aanmerking wordt genomen tot aan de latere datum, bedoeld in
      [artikel XVI, derde lid][ref8].


