        bwb_id: BWBR0004043
  - number: XI
    text: |-
      1 Op aanvraag wordt vastgesteld of recht op een stimuleringsuitkering bestaat.

      2 De stimuleringsuitkering wordt per jaar berekend en betaald in drie jaarlijkse termijnen.

      3 Uitbetaling van een termijn vindt plaats, nadat daartoe een aanvraag is ingediend.

      4 Na het overlijden van degene, aan wie een stimuleringsuitkering is toegekend wordt, mits daartoe
      een aanvraag is ingediend, de uitkering, voor zover niet reeds uitbetaald, tot en met de dag van
      overlijden uitbetaald, aan een persoon als bedoeld [artikel 53, eerste lid, onderdeel ][ref1].
      [Artikel 53, tweede en derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] is met betrekking tot
      de eerste volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006072/2009-10-01#ArtikelXI
