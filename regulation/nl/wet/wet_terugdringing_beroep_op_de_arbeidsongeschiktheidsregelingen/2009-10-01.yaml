    text: |-
      1 De [artikelen 2][ref1], [50][ref2], tweede tot en met zevende lid, [54][ref3], [55][ref4], [56][ref5],
      [57][ref6], [58][ref7], [59][ref8], en [88 van de Wet op de arbeidsongeschiktheidsverzekering][ref9],
      [artikel 3][ref10] (*Stb.* 1987, 552) en de artikelen 4*a* , 41, tweede tot en met zesde
      lid, 41*a* , 45, 46, 47, 48, 50, 51, 79 en 80 van de Algemene Arbeidsongeschiktheidswet en
      [artikel 6 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref11] zijn van overeenkomstige
      toepassing op de stimuleringsuitkering die is ontleend aan een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref12] of de Algemene Arbeidsongeschiktheidswet.

      2 De artikelen I 1, I 2, I 3, I 4, O 1, eerste lid, O 2, eerste lid, R 1, R 2, R 3 en Hoofdstuk S van de Algemene
      burgerlijke pensioenwet en de artikelen I 1, I 2, I 3, I 4, O 1, eerste lid, R 1, R 2, R 3, en Hoofdstuk S van
      de Spoorwegpensioenwet, alsmede de artikelen I 1 , I 4, eerste lid, I 5, eerste lid onder *a*, tweede lid, I
      6, S 1, V 1, tweede lid, V 2, V 3, tweede lid, V 12 en W 1, W 4, W 5, W 6, eerste lid en W 7 van de Algemene
      militaire pensioenwet zijn van overeenkomstige toepassing op de stimuleringsuitkering die is ontleend aan een
      invaliditeitspensioen op grond van onderscheidenlijk de Algemene burgerlijke pensioenwet, de Spoorwegpensioenwet,
      of een pensioen uit hoofde van ziekten of gebreken op grond van de Algemene militaire pensioenwet.


