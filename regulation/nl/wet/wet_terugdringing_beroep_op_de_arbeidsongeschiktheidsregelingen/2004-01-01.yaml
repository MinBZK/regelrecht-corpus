        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: VIII.c
    text: |-
      op wie de bepalingen van de artikelen[ XX][ref1] en[ XXIII][ref2] van deze wet van toepassing zijn en die op 31
      januari 1992 en sinds 1 januari 1990 onafgebroken recht heeft op een aanvulling als bedoeld in deze artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelXX
      [ref2]: https://wetten.overheid.nl/BWBR0006072#ArtikelXXIII
