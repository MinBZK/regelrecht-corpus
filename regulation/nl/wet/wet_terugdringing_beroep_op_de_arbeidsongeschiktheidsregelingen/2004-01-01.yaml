      op de dag, voorafgaande aan die waarop [artikel I][ref1] van deze wet in werking treedt, recht had op uitkering
      op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref2], waaronder begrepen een uitkering op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref3]; of


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
