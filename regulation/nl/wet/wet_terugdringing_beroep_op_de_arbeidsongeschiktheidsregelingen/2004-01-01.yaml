  - number: XIV.2
    text: |-
      De artikelen I 1, I 2, I 3, I 4, O 1, eerste lid, O 2, eerste lid, R 1, R 2, R 3 en Hoofdstuk S van de Algemene
      burgerlijke pensioenwet en de artikelen I 1, I 2, I 3, I 4, O 1, eerste lid, R 1, R 2, R 3, en Hoofdstuk S van
      de Spoorwegpensioenwet, alsmede de artikelen I 1 , I 4, eerste lid, I 5, eerste lid onder *a*, tweede lid, I
      6, S 1, V 1, tweede lid, V 2, V 3, tweede lid, V 12 en W 1, W 4, W 5, W 6, eerste lid en W 7 van de Algemene
      militaire pensioenwet zijn van overeenkomstige toepassing op de stimuleringsuitkering die is ontleend aan een
      invaliditeitspensioen op grond van onderscheidenlijk de Algemene burgerlijke pensioenwet, de Spoorwegpensioenwet,
      of een pensioen uit hoofde van ziekten of gebreken op grond van de Algemene militaire pensioenwet.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXIV
  - number: XV
    text: |-
      Bij ministeriële regeling kan Onze Minister van Sociale Zaken en Werkgelegenheid, voor zover het hen aangaat in
      overeenstemming met Onze Ministers van Binnenlandse Zaken, Verkeer en Waterstaat en van Defensie, met betrekking
      tot dit hoofdstuk nadere regels stellen. In deze regels kan onder meer worden bepaald, dat perioden waarin geen
      arbeid is verricht worden gelijkgesteld met perioden waarin arbeid is verricht.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXV
  - number: XVI.1
    text: |-
      De artikelen 5 van de Algemene Arbeidsongeschiktheidswet en 18 van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals die artikelen luidden op de dag, voorafgaande aan
      die waarop deze wet in werking treedt, blijven van toepassing op een persoon die op die dag recht had op een
      arbeidsongeschiktheidsuitkering, en die op de dag van inwerkingtreding van deze wet de leeftijd van 45 jaar heeft
      bereikt, alsmede op een persoon die op die dag recht had op een arbeidsongeschiktheidsuitkering op grond van
      artikel 6, eerste lid, onderdeel *b*, van de Algemene Arbeidsongeschiktheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: XVI.2
    text: |-
      De artikelen 24 en 26 van de Algemene Arbeidsongeschiktheidswet en de [artikelen 34][ref1] en
      [36 van de Wet op de arbeidsongeschiktheidsverzekering][ref2], zoals deze luiden na de inwerkingtreding van
      deze wet, vinden geen toepassing ten aanzien van de in het eerste lid bedoelde personen die op de dag van
      inwerkingtreding van deze wet de leeftijd van 50 jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel36
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '36'
  - number: XVI.3
    text: |-
      De artikelen 5 en 24 van de Algemene Arbeidsongeschiktheidswet en 18 en 34 van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals die artikelen luidden op de dag, voorafgaande aan
      die waarop deze wet in werking treedt, blijven tot een latere datum dan de datum van inwerkingtreding van
      deze wet van toepassing op een persoon die op de dag voorafgaande aan die waarop deze wet in werking treedt,
      recht had op een arbeidsongeschiktheidsuitkering, en die op de dag van inwerkingtreding van de wet de leeftijd
      van 45 jaar niet heeft bereikt. De artikelen 24 van de Algemene Arbeidsongeschiktheidswet en 34 van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], zoals die artikelen luidden op de dag, voorafgaande aan die
      waarop deze wet in werking treedt, blijven tot een bij ministeriële regeling te bepalen latere datum dan de datum
      van inwerkingtreding van deze wet van toepassing op een persoon die op de dag voorafgaande aan die waarop deze
      wet in werking treedt, recht had op een arbeidsongeschiktheidsuitkering, en die op de dag van inwerkingtreding van
      deze wet de leeftijd van 45 jaar heeft bereikt maar niet die van 50. Ten aanzien van de in de tweede zin bedoelde
      persoon beziet het Uitvoeringsinstituut werknemersverzekeringen op de aldaar bedoelde latere datum of er gronden
      aanwezig zijn voor herziening of intrekking van de arbeidsongeschiktheidsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: XVI.4
    text: |-
      De in de eerste zin van het derde lid bedoelde latere datum wordt bij ministeriële regeling per groep van personen,
      rekening houdend met hun leeftijd, vastgesteld. Deze datum wordt in ieder geval niet later gesteld dan 5 jaar na de
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
  - number: XVI.5
    text: |-
      Voor de toepassing van artikel 24 van de Algemene Arbeidsongeschiktheidswet en
      [artikel 34 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals deze artikelen luiden na de
      inwerkingtreding van deze wet, wordt de arbeidsongeschiktheidsuitkering van de persoon, bedoeld in het derde lid,
      geacht te zijn toegekend op de dag, waarop de in dat lid genoemde artikelen op hem van toepassing worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
  - number: XVI.6
    text: |-
      Artikel 24, tweede lid, van de Algemene Arbeidsongeschiktheidswet en
      [artikel 34, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1], zoals die artikelen luidden
      op de dag, voorafgaande aan die waarop deze wet in werking treedt, blijven tot zes maanden na de dag waarop
      deze wet in werking treedt van toepassing op een persoon, wiens arbeidsongeschiktheid in de zin van de Algemene
      Arbeidsongeschiktheidswet en de [Wet op de arbeidsongeschiktheidsverzekering][ref2] is aangevangen uiterlijk zes
      maanden voor de inwerkingtreding van deze wet en terzake van die arbeidsongeschiktheid recht op uitkering heeft op
      grond van de [Ziektewet][ref3] (*Stb.* 1987, 88).


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
    references:
