      - id: ref2
        bwb_id: BWBR0002822
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '44'
  - number: IX.2
    text: |-
      Voor de toepassing van dit hoofdstuk wordt niet onder arbeid verstaan arbeid in een dienstbetrekking krachtens de
      Wet Sociale Werkvoorziening.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelIX
  - number: X.1
    text: |-
      De stimuleringsuitkering bedraagt 60% van het totaal aan arbeidsongeschiktheidsuitkering en en de daarmee
      verband houdende vakantie-uitkeringen, daaronder begrepen de aanvulling van invaliditeitspensioen op grond van
      [artikel F 9 van de Algemene burgerlijke pensioenwet](onbekend), alsmede de verhoging op grond van [artikel F
      9](onbekend) van die wet, dan wel de aanvulling van het invaliditeitspensioen op grond van artikel F 7 van de
      Spoorwegpensioenwet, alsmede de verhoging op grond van artikel F 7*b* van die wet, dan wel de aanvulling van het
      invaliditeitspensioen op grond van pensioen uit hoofde van ziekten of gebreken op grond van artikel E 6 van de
      Algemene militaire pensioenwet, alsmede de verhoging op grond van artikel F 6*a* van die wet en toeslag op grond
      van de [Toeslagenwet][ref1] (*Stb.* 1987, 91) dat wegens het verrichten van de arbeid vanaf de aanvang van die
      arbeid in een periode van drie jaar niet wordt uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelX
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: X.2
    text: |-
      Voor de berekening van de niet betaalde toeslag, bedoeld in het eerste lid, wordt in afwijking van dat lid in
      aanmerking genomen het naar een bedrag per jaar herleide bedrag aan toeslag
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelX
  - number: X.2.a
    text: waarop de betrokkene recht had onmiddellijk voorafgaande aan het verrichten van die werkzaamheden; of
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelX
  - number: X.2.b
    text: |-
      waarop, indien het een volgende betalingstermijn betreft, de betrokkene recht zou hebben gehad op de eerste dag van
      die termijn indien hij die werkzaamheden niet was gaan verrichten.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelX
  - number: XI.1
    text: Op aanvraag wordt vastgesteld of recht op een stimuleringsuitkering bestaat.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXI
  - number: XI.2
    text: De stimuleringsuitkering wordt per jaar berekend en betaald in drie jaarlijkse termijnen.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXI
  - number: XI.3
    text: Uitbetaling van een termijn vindt plaats, nadat daartoe een aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXI
  - number: XI.4
    text: |-
      Na het overlijden van degene, aan wie een stimuleringsuitkering is toegekend wordt, mits daartoe
      een aanvraag is ingediend, de uitkering, voor zover niet reeds uitbetaald, tot en met de dag van
      overlijden uitbetaald, aan een persoon als bedoeld [artikel 53, eerste lid, onderdeel ][ref1].
      [Artikel 53, tweede en derde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref2] is met betrekking tot
      de eerste volzin van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: XII
    text: |-
      De stimuleringsuitkering is geen inkomen in de zin van de artikelen 6 en
      10 van de Algemene Arbeidsongeschiktheidswet, de [Toeslagenwet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] (*Stb.* 1987, 92), de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] (*Stb.* 1987, 281)
      en de [Wet werk en bijstand][ref4], geen loon in de zin van de [Ziekenfondswet][ref5] (*Stb.* 1964, 392) en geen
      inkomen uit of in verband met arbeid in de zin van de Algemene burgerlijke pensioenwet, de Spoorwegpensioenwet en
      de Algemene militaire pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0015703
      [ref5]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0004043
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0015703
      - id: ref5
        bwb_id: BWBR0002460
  - number: XIII.1
    text: |-
      Indien het recht op stimuleringsuitkering wordt ontleend aan een arbeidsongeschiktheidsuitkering op grond
      van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] of de Algemene Arbeidsongeschiktheidswet,
      wordt de stimuleringsuitkering betaald door het Uitvoeringsinstituut werknemersverzekeringen die
      de arbeidsongeschiktheidsuitkering heeft toegekend en komt zij in verhouding van de niet betaalde
      uitkeringen en toeslagen, bedoeld in [artikel X][ref2], ten laste van het Arbeidsongeschiktheidsfonds,
      het Algemeen Arbeidsongeschiktheidsfonds, het Rijk, indien het een uitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref3] betreft, en het Toeslagenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0006072#ArtikelX
      [ref3]: https://wetten.overheid.nl/BWBR0002822
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0006072
        artikel: X
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002822
  - number: XIII.2
    text: |-
      Indien het recht op stimuleringsuitkering wordt ontleend aan de aanvulling van het invaliditeitspensioen op grond
      van de [Algemene burgerlijke pensioenwet](onbekend), alsmede de verhoging op grond van [artikel F 9](onbekend)
      van die wet, of aan de aanvulling van het invaliditeitspensioen op grond van de Spoorwegpensioenwet, alsmede de
      verhoging op grond van artikel F 7 *b* van die wet, dan wel van het pensioen uit hoofde van ziekten of gebreken op
      grond van de Algemene militaire pensioenwet, alsmede de verhoging op grond van artikel F 9*a* van die wet, wordt
      de stimuleringsuitkering betaald en komt zij ten laste van onderscheidenlijk het Algemeen burgerlijk pensioenfonds,
      het Spoorwegpensioenfonds of het Rijk.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXIII
  - number: XIV.1
    text: |-
      De [artikelen 2][ref1], [50][ref2], tweede tot en met zevende lid, [54][ref3], [55][ref4], [56][ref5],
      [57][ref6], [58][ref7], [59][ref8], en [88 van de Wet op de arbeidsongeschiktheidsverzekering][ref9],
      [artikel 3][ref10] (*Stb.* 1987, 552) en de artikelen 4*a* , 41, tweede tot en met zesde
      lid, 41*a* , 45, 46, 47, 48, 50, 51, 79 en 80 van de Algemene Arbeidsongeschiktheidswet en
      [artikel 6 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref11] zijn van overeenkomstige
      toepassing op de stimuleringsuitkering die is ontleend aan een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref12] of de Algemene Arbeidsongeschiktheidswet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0002524#Artikel56
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel57
      [ref7]: https://wetten.overheid.nl/BWBR0002524#Artikel58
