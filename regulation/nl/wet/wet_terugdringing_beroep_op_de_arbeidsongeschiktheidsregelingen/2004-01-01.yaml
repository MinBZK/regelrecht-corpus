  - number: IX.1
    text: |-
      Recht op een stimuleringsuitkering heeft de arbeidsongeschikte die in de periode van 1 februari 1992 tot 1 februari
      1994 arbeid gaat verrichten in verband waarmee de uitkering op grond van de Algemene Arbeidsongeschiktheidswet, de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] of de [Wet arbeidsongeschiktheidsvoorziening militairen][ref2],
      dan wel de aanvulling van het invaliditeitspensioen op grond van de Algemene burgerlijke pensioenwet, alsmede
      de verhoging op grond van [artikel F 9](onbekend) van die wet, of de aanvulling van het invaliditeitspensioen
      op grond van de Spoorwegpensioenwet, alsmede de verhoging op grond van artikel F 7*b* van die wet, of de
      aanvulling van het pensioen uit hoofde van ziekten of gebreken op grond van de Algemene militaire pensioenwet,
      alsmede de verhoging op grond van artikel F 9*a* van die wet wordt verlaagd of ingetrokken, dan wel niet of
      gedeeltelijk wordt uitbetaald onder toepassing van artikel 33 van de Algemene Arbeidsongeschiktheidswet of
      [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref3], dan wel onder toepassing van [artikel J 20]
      (onbekend) van de Algemene burgerlijke pensioenwet, artikel J 20 van de Spoorwegpensioenwet of artikel V 4 van de
      Algemene militaire pensioenwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002822
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelIX
    references:
