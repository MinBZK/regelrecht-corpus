        artikel: '21'
  - number: XVII.3
    text: 'In afwijking van het eerste lid wordt voor de toepassing van:'
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVII
  - number: XVII.3.a
    text: |-
      [artikel 53, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] voor de zinsnede «tot en met de
      laatste dag der tweede maand, volgende op die waarin het overlijden plaatsvond» gelezen: tot en met één maand na de
      dag van het overlijden; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
  - number: XVII.3.b
    text: |-
      voor de toepassing van [artikel 53, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] slechts
      als echtgenoot aangemerkt niet gehuwde personen van verschillend of gelijk geslacht, die duurzaam een gezamenlijke
      huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste graad bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVII
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
  - number: XVIII.1
    text: |-
      De periode van toekenning van een arbeidsongeschiktheidsuitkering, bedoeld in de
      [artikelen 34, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en artikel 24, eerste lid,
      van de Algemene Arbeidsongeschiktheidswet wordt in afwijking van het in die artikelen bepaalde, tot een nader bij
      algemene maatregel van bestuur te bepalen tijdstip gesteld op 5 jaar. Bij algemene maatregel van bestuur kan voorts
      worden bepaald, dat na het in de eerste volzin bedoelde tijdstip, tot nog een later tijdstip, een termijn van 4
      jaar in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel34
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVIII
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '34'
  - number: XVIII.2
    text: |-
      De wijziging van de termijn, bedoeld in het eerste lid, brengt geen wijziging in de termijnen, zoals die gelden
      terzake van arbeidsongeschiktheidsuitkeringen, die zijn toegekend of voortgezet op een tijdstip gelegen voor het
      tijdstip van wijziging van de termijn.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVIII
  - number: XIX.1
    text: |-
      Indien vanaf de datum van inwerkingtreding van deze wet artikel 33 van de Algemene Arbeidsongeschiktheidswet
      dan wel [artikel 44 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt toegepast ten aanzien van
      een persoon op wie onmiddellijk voorafgaande aan de inwerkingtreding van deze wet artikel 34 van de Algemene
      Arbeidsongeschiktheidswet dan wel [artikel 45 van de Wet op de arbeidsongeschiktheidsverzekering][ref2]
      werd toegepast, dient er voor de toepassing van het genoemde artikel 33, tweede lid, dan wel
      [artikel 44, tweede lid][ref3], van worden uitgegaan dat de in die artikelen genoemde termijn van 3 jaren is
      aangevangen op de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel44
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXIX
    references:
