        bwb_id: BWBR0002822
        hoofdstuk: III
  - number: XVII.1.b
    text: |-
      op 25 januari 1993 ongeschikt is tot werken wegens ziekte dan wel wiens ongeschiktheid tot werken
      wegens ziekte intreedt na deze datum en tevens binnen een maand nadat een vóór die datum gelegen
      periode van ongeschiktheid door herstel is geëindigd, en die nadat deze ongeschiktheid 52 weken
      heeft geduurd, recht heeft op toekenning van een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] of een arbeidsongeschiktheidsuitkering op grond van
      [hoofdstuk III van de Wet arbeidsongeschiktheidsvoorziening militairen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002822#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVII
    references:
