  - number: XVII.2
    text: |-
      In afwijking van het eerste lid is [artikel 21, vierde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1],
      zoals dat artikel luidt na inwerkingtreding van deze wet, van toepassing op de in het eerste lid bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel21
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVII
    references:
