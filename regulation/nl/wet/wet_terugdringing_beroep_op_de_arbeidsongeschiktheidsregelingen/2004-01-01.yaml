        bwb_id: BWBR0002524
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0001888
  - number: XVI.7
    text: |-
      De wijzigingen van [artikel 36 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] en 26 van de Algemene
      Arbeidsongeschiktheidswet, zoals vervat in [artikel I, onderdeel I][ref2] en [artikel II, onderdeel F][ref3],
      vinden geen toepassing ten aanzien van de persoon, wiens arbeidsongeschiktheidsuitkering is ingegaan op een dag
      gelegen voor de inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006072#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0006072#ArtikelII
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXVI
