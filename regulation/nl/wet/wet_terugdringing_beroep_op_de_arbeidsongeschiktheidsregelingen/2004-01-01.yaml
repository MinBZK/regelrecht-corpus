  - number: XXVIIA.1
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het
      Uitvoeringsinstituut werknemersverzekeringen binnen dertien weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXVIIA
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: XXVIIA.2
    text: |-
      Indien bezwaar wordt gemaakt tegen een besluit waaraan een medische of arbeidskundige beoordeling ten grondslag
      ligt, beslist het Uitvoeringsinstituut werknemersverzekeringen binnen zeventien weken of indien zij advies vraagt
      aan een deskundige die niet onder haar verantwoordelijkheid werkzaam is binnen eenentwintig weken, na ontvangst van
      het bezwaarschrift.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXVIIA
  - number: XXVIIB
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de behandeling van
      bezwaarschriften tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXVIIB
  - number: XXVIII
    text: |-
      In [artikel 52, derde lid, van de Invoeringswet stelselherziening sociale zekerheid][ref1], zoals deze luidt op
      de dag waarop deze wet in werking treedt, wordt na "arbeidsongeschiktheidsregelingen" op de gebruikelijke wijze
      ingevoegd de jaargang en het nummer van het *Staatsblad* waarin deze wet is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004046#Artikel52
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXVIII
    references:
      - id: ref1
        bwb_id: BWBR0004046
        artikel: '52'
  - number: XXIX.1
    text: |-
      Deze wet, met uitzondering van [artikel II, onderdeel L][ref1], treedt in werking op een bij koninklijk besluit te
      bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelII
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXIX
    references:
      - id: ref1
        bwb_id: BWBR0006072
        artikel: II
        hoofdstuk: I
  - number: XXIX.2
    text: |-
      Bij koninklijk besluit kan de datum van 1 februari 1994, genoemd in [artikel IX, eerste lid][ref1], later worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelIX
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXIX
    references:
      - id: ref1
        bwb_id: BWBR0006072
        artikel: IX
        hoofdstuk: II
  - number: XXIX.3
    text: |-
      [Artikel II, onderdeel L][ref1], treedt in werking met ingang van 1 maart 1993. Indien het *Staatsblad* waarin
      deze wet wordt geplaatst, wordt uitgegeven na 28 februari 1993, treedt dit artikel in werking met ingang van de dag
      na de datum van uitgifte van het *Staatsblad*, waarin deze wet wordt geplaatst, en werkt terug tot en met 1 maart
      1993.


      [ref1]: https://wetten.overheid.nl/BWBR0006072#ArtikelII
    url: https://wetten.overheid.nl/BWBR0006072/2004-01-01#ArtikelXXIX
    references:
