  text: |-
    Gelet op artikel 43, vijfde lid, van het Besluit rijkssubsidiëring instandhouding monumenten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Besluit:* [Besluit rijkssubsidiëring instandhouding monumenten][ref1];
        - *industrieel erfgoed:* Gebouwen vanaf 1850 die tastbaar getuigen van voorbije fasen in de ontwikkeling van
      bedrijf en techniek;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *religieus erfgoed:* gebouwen die in oorsprong uitsluitend ten behoeve van de eredienst of het belijden van de
      geloofsovertuiging zijn opgericht of die in oorsprong met dit gebruik direct verband hielden;
        - *restauratie:* het verrichten van die werkzaamheden, de normale instandhouding te boven gaand, die voor het
      herstel van een beschermd monument noodzakelijk zijn;
        - *restauratieplan:* plan als bedoeld in [artikel 9, tweede lid][ref2];
        - *subsidie:* subsidie als bedoeld in [artikel 43 van het Besluit][ref3].


