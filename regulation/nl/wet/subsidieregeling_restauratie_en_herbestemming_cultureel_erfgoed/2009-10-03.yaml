  - number: '3'
    text: |-
      1 De minister kan aan de eigenaar van een beschermd monument op aanvraag subsidie verlenen voor de restauratie van
      het desbetreffende beschermde monument.

      2 Subsidie als bedoeld in het eerste lid kan slechts worden verleend ten behoeve van:

      a. beschermd religieus erfgoed met een (gedeeltelijke) herbestemming tot wonen; of

      b. beschermd industrieel erfgoed met een (gedeeltelijke) herbestemming tot wonen .

      3 Onverminderd het bepaalde in [artikel 5, tweede lid][ref1], verstrekt de minister per gemeente slechts ten
      behoeve van één beschermd monument subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0026468#Artikel5
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel3
