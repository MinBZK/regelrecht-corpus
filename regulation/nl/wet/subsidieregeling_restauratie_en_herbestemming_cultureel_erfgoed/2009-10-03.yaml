        paragraaf: '1'
  - number: '4'
    text: Een restauratie waarvoor subsidie wordt verleend vangt aan in 2010 en is uiterlijk op 31 december 2011 afgerond.
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel4
  - number: '5'
    text: |-
      1 Voor subsidieverlening is een bedrag van € 15 miljoen beschikbaar.

      2 Indien het bedrag, bedoeld in het eerste lid, niet volledig is verleend, kan de minister
      [artikel 3, derde lid][ref1], buiten toepassing laten en subsidie verlenen ten behoeve van meerdere beschermde
      monumenten per gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0026468#Artikel3
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026468
        artikel: '3'
        paragraaf: '1'
  - number: '6'
    text: |-
      1 Voor subsidie komen in aanmerking de kosten voor werkzaamheden, maatregelen en voorzieningen als bedoeld in
      de Leidraad Brim subsidiabele instandhoudingskosten, opgenomen als [bijlage bij de Regeling rijkssubsidiëring
      instandhouding monumenten](onbekend), met dien verstande dat kosten uitsluitend voor subsidie in aanmerking komen
      voor zover de werkzaamheden naar het oordeel van de minister:

      a. strekken tot restauratie van het monument en zijn monumentale waarden;

      b. sober en doelmatig zijn;

      c. technisch noodzakelijk zijn; en

      d. gericht zijn op maximaal behoud van aanwezige monumentale waarden, in het bijzonder historische materialen en
      constructies.

      2 Tevens komen voor subsidie in aanmerking de kosten voor werkzaamheden die:

      a. gericht zijn op het voorkomen van verval of het voorkomen van vervolgschade; of

      b. bestaan uit het vervangen van materialen die hun functie niet meer kunnen vervullen.

      3 Niet voor subsidie komen in aanmerking de kosten voor werkzaamheden die:

      a. voortvloeien uit veranderd gebruik;

      b. gericht zijn op comfortverbetering; of

      c. gericht zijn op reconstructie, tenzij ze in uitzonderlijke gevallen naar het oordeel van de minister ter
      versterking van de monumentale waarden gewenst zijn.

      4 Het totaal van de kosten die voor subsidie in aanmerking komen, bedraagt ten minste € 300.000 en ten hoogste
      € 3.000.000.
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel6
  - number: '7'
    text: |-
      1 De subsidie voor eigenaren die geen recht hebben op fiscale aftrek van onderhoudskosten als bedoeld in
      [artikel 1, tweede lid, van het Besluit][ref1] bedraagt 70% van de subsidiabele kosten.

      2 De subsidie voor eigenaren die recht hebben op fiscale aftrek van onderhoudskosten bedraagt 60% van de
      subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel1
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel7
