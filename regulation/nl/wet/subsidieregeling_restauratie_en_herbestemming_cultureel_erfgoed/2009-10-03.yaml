  - number: '8'
    text: Een aanvraag voor subsidie wordt voor 15 november 2009 ingediend.
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel8
  - number: '9'
    text: |-
      1 De aanvraag omvat in ieder geval:

      a. een restauratieplan;

      b. een bouwkundig inspectierapport per beschermd monument dat niet ouder is dan twee jaar;

      d. een financieel dekkingsplan waaruit blijkt dat de financiering van het gedeelte van de kosten van het
      restauratieplan dat niet door subsidie wordt gedekt, zeker is gesteld; en

      d. een afschrift van de voor de restauratie verleende vergunning, bedoeld in [artikel 11 van de wet][ref1].

      2 Het restauratieplan, bedoeld in het eerste lid, onder a, bestaat uit:

      a. overzichts- en detailfoto’s die een duidelijke indruk geven van het beschermde monument en zijn gebreken;

      b. tekeningen van de bestaande toestand van het beschermde monument en tekeningen waarop de voorgenomen
      herstelwerkzaamheden of wijzigingen staan aangegeven;

      c. een bestek of werkomschrijving per onderdeel van de toe te passen constructies, materialen, afwerkingen en
      kleuren alsmede van de wijze van verwerking daarvan;

      d. een begroting die niet ouder is dan twee jaar en die is gespecificeerd in hoeveelheden uren en materialen,
      stelposten en onderaannemers; en

      e. in voorkomende gevallen rapporten inzake bouwfysische, bouwhistorische, constructieve, decoratieve,
      materiaaltechnische of preventieve aspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
  - number: '10'
    text: |-
      Onverminderd [artikel 9 van het Besluit][ref1] wordt geen subsidie verstrekt indien:

      a. voor de voorgenomen restauratie geen vergunning als bedoeld in [artikel 11 van de wet][ref2] is verleend;

      b. naar het oordeel van de minister niet is gewaarborgd, dat het beschermde monument na uitvoering van het
      restauratieplan zonder aanvullende restauratiewerkzaamheden in een goede staat kan worden gehouden; of

      c. de toekomstige bestemming van het te restaureren beschermde monument naar het oordeel van de minister een
      belemmering vormt voor de instandhouding van het monument.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0004471
        artikel: '11'
  - number: '11'
    text: |-
      1 De minister behandelt de aanvragen in volgorde van ontvangst, met dien verstande dat wanneer de aanvrager
      krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de subsidieaanvraag
      aan te vullen, de dag waarop de aanvullende informatie is ontvangen met betrekking tot de verdeling als datum van
      ontvangst geldt.

      2 Het eerste lid is tevens van toepassing in het geval dat de minister toepassing geeft aan
      [artikel 5, tweede lid][ref2].

      3 Indien meerdere aanvragen die voldoen aan de regeling op een bepaalde dag worden ingediend, en verlening van
      subsidie op deze aanvragen tot overschrijding van het subsidieplafond leidt, wordt op deze aanvragen in volgorde
      van subsidiabele kosten beslist, waarbij een aanvraag met lagere subsidiabele kosten voorrang heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0026468#Artikel5
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
      - id: ref2
        bwb_id: BWBR0026468
        artikel: '5'
        paragraaf: '1'
  - number: '12'
    text: |-
      1 De minister kan aan de subsidieontvanger voorschotten verstrekken op basis van door de subsidieontvanger
      ingediende overzichten van gemaakte kosten die vergezeld gaan van de desbetreffende originele rekeningen.

      2 Indien rekeningen betrekking hebben op kosten van personeel dat in loondienst is bij de eigenaar, gaan de
      overzichten, bedoeld in het eerste lid, tevens vergezeld van een verklaring van een registeraccountant of een
      accountant-administratieconsulent waaruit blijkt hoeveel uren door dat personeel is besteed aan de restauratie,
      waarvoor subsidie is verleend.

      3 De minister keert de voorschotten uit voor zover de rekeningen werkzaamheden betreffen die in overeenstemming
      zijn met het restauratieplan.
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel12
  - number: '13'
    text: |-
      De subsidieontvanger draagt er zorg voor dat de restauratie waarvoor subsidie is verleend, voor 31 december 2011
      is afgerond.
    url: https://wetten.overheid.nl/BWBR0026468/2009-10-03#Artikel13
  - number: '14'
    text: |-
      1 Voor de vaststelling van een verleende subsidie is [artikel 32 van het Besluit][ref1] van overeenkomstige
      toepassing met dien verstande dat een aanvraag tot vaststelling door de subsidieontvanger binnen drie maanden nadat
      de restauratie is afgerond, bij de minister wordt ingediend.

      2 Indien het verleende subsidiebedrag € 1 miljoen of meer bedraagt, gaan de rekeningen en betalingsbewijzen
      vergezeld van een mededeling dat de subsidie rechtmatig is besteed, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
