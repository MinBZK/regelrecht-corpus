  - number: '2'
    text: |-
      De [artikelen 8][ref1], [9][ref2], [14][ref3], [16, tweede lid][ref4], [17][ref5], [23 tot en met 31][ref6],
      [34][ref7] en [35 van het Besluit][ref8] zijn van overeenkomstige toepassing met dien verstande dat instandhouding
      en instandhoudingsplan telkens worden gelezen als restauratie, onderscheidenlijk restauratieplan en dat in
      [artikel 14][ref9] ’subsidiabele kosten’ wordt gelezen als: totale kosten.


