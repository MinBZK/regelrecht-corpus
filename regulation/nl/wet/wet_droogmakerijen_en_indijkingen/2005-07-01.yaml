preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is bepalingen vast te stellen omtrent het ondernemen
    van droogmakerijen en indijkingen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Droogmakerijen en indijkingen, die niet door het Rijk worden tot stand gebracht, mogen niet worden ondernomen
      dan nadat daartoe door Ons, Gedeputeerde Staten van de provincie of de provinciën, waarin de gronden zijn gelegen
      gehoord, concessie is verleend.

      2 Op droogmakerijen is dit voorschrift niet van toepassing, wanneer het plan tot droogmaking reeds bij eene
      vergunning tot vervening is vastgesteld of wanneer zij krachtens het reglement van een waterschap of van een
      veenpolder worden ondernomen.

      3 Op indijkingen is het eerste lid niet van toepassing, wanneer zij krachtens het reglement van een waterschap
      worden ondernomen.

      4 Droogmakerijen en indijkingen worden, behoudens voorziening bij bijzondere wetten, door het Rijk niet
      ondernomen, dan nadat de Gedeputeerde Staten, in het eerste lid vermeld, zijn gehoord, aan de voorschriften,
      in [artikel 3][ref1] , 4 en 5 opgenomen, is gevolg gegeven en de voorzieningen worden genomen, in het
      waterstaatsbelang door Onzen met de zaken van waterstaat belasten Minister noodzakelijk geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001871#Artikel3
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001871
        artikel: '3'
  - number: '2'
    text: |-
      Bij eene aanvrage om concessie moeten in tweevoud worden overgelegd kaarten van de voorgenomen droogmakerij
      of indijking, waarop zijn aangeduid de dijk, de openbare wegen, de waterleidingen, de uitwateringssluizen of
      bemalingswerktuigen en waaruit de ligging van het werk ten opzichte van de omgeving blijkt, toegelicht door eene
      omschrijving met de noodige teekeningen en vergezeld van eene begrooting van kosten.
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel2
  - number: '3'
    text: |-
      1 Gedeputeerde staten brengen advies uit over de aanvraag en geven daarbij toepassing aan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1].

      2 De terinzagelegging geschiedt tevens bij de secretarie van een der gemeenten, waarin de gronden zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5'
    text: |-
      Gedeputeerde staten onderzoeken het ontwerp en de naar voren gebrachte zienswijzen en brengen daaromtrent een
      verslag uit aan Onze Minister van Verkeer en Waterstaat, dat tevens hun advies behelst.
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel5
  - number: '6'
    text: |-
      1 Bij de concessie worden de noodige voorwaarden gesteld ter bescherming van de belangen, die door de onderneming
      kunnen worden geschaad, en kan het storten van een waarborgkapitaal worden bevolen om daarop te verhalen de kosten
      der voorzieningen in de nadeelen, die uit eene gebrekkige uitvoering der concessie kunnen ontstaan.

      2 Die waarborgsom zal, zoodra en voor zoover zij voor dat verhaal niet meer noodig is, worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel6
  - number: '7'
    text: |-
      De concessie kan door Ons vervallen worden verklaard, indien het werk of bepaalde gedeelten daarvan niet zijn
      voltooid binnen de in de concessie gestelde of later door Ons verlengde termijnen.
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel7
  - number: '8'
    text: |-
      1 Gedeputeerde Staten bevelen de staking van werken tot droogmaking of indijking, zonder de in [artikel 1][ref1]
      voorgeschreven concessie ondernomen.

      2 Zij zien toe, dat de droogmakerij of indijking geschiedt met inachtneming van het plan en de verdere voorwaarden,
      waarop door Ons concessie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001871#Artikel1
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001871
        artikel: '1'
  - number: '9'
    text: |-
      De wet van den 16den September 1807, relative au dessèchement des marais et autres travaux publics, en het
      Keizerlijk decreet van 11 Januari 1811, contenant règlement sur l'administration et l'entretien des polders, zijn
      afgeschaft.
    url: https://wetten.overheid.nl/BWBR0001871/2005-07-01#Artikel9
