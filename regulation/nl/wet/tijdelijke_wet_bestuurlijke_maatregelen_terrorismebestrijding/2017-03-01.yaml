---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_wet_bestuurlijke_maatregelen_terrorismebestrijding
regulatory_layer: WET
publication_date: '2017-02-22'
valid_from: '2017-03-01'
bwb_id: BWBR0039210
url: https://wetten.overheid.nl/BWBR0039210/2017-03-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is vrijheidsbeperkende maatregelen op te leggen aan
    personen die een gevaar vormen voor de nationale veiligheid of die voornemens zijn zich aan te sluiten bij
    terroristische strijdgroepen en beschikkingen te weigeren en in te trekken bij ernstig gevaar voor gebruik ervan
    voor terroristische activiteiten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder: - *Onze Minister:* Onze Minister van Veiligheid en Justitie;
        - *Schengengebied:* het grondgebied van de staten waarop de Schengengrenscode en de Schengen
      Uitvoeringsovereenkomst van toepassing zijn;
        - *Schengengrenscode:* [Verordening (EG) nr. 562/2006](32006R0562) van het Europees Parlement en de Raad van 15
      maart 2006 tot vaststelling van een communautaire code betreffende de overschrijding van de grenzen door personen
      (Schengengrenscode) (PbEU L 105);
        - *Schengen Uitvoeringsovereenkomst:* de op 19 juni 1990 tot stand gekomen Overeenkomst ter uitvoering van het
      tussen de regeringen van de staten van de Benelux Economische Unie, de bondsrepubliek Duitsland en de Franse
      republiek op 14 juni 1985 gesloten akkoord betreffende de geleidelijke afschaffing van de controles aan de
      gemeenschappelijke grenzen (Trb. 1990, 145), alsmede de daarop gebaseerde Protocollen.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan, indien dat noodzakelijk is met het oog op de bescherming van de nationale veiligheid, aan een
      persoon die op grond van zijn gedragingen in verband kan worden gebracht met terroristische activiteiten of de
      ondersteuning daarvan, een maatregel opleggen, strekkende tot beperking van de vrijheid van beweging.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2
  - number: '2.2'
    text: 'Een maatregel kan bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2
  - number: 2.2.a
    text: |-
      een verplichting om zich op door Onze Minister vast te stellen tijdstippen te melden bij een door Onze Minister
      aangewezen politiechef of organisatie;
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2
  - number: 2.2.b
    text: |-
      een verbod om zich te bevinden in of in de omgeving van een of meer bepaalde objecten dan wel in een bepaald
      gedeelte of bepaalde delen van Nederland, dat niet groter is of die niet groter zijn dan strikt noodzakelijk voor
      de bescherming van de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2
  - number: 2.2.c
    text: een verbod om zich te bevinden in de nabijheid van een of meer bepaalde personen.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2
  - number: 2a.1
    text: |-
      Indien dat noodzakelijk is met het oog op de naleving van een verbod als bedoeld in
      [artikel 2, tweede lid, onderdeel b][ref1], kan Onze Minister besluiten tot het toepassen van een technische
      voorziening waarmee toezicht wordt gehouden op de naleving van dat verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
  - number: 2a.2
    text: |-
      Het in het eerste lid bedoelde besluit wordt ingetrokken zodra het niet meer noodzakelijk is met het oog op de
      naleving van een verbod als bedoeld in [artikel 2, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
  - number: 2a.3
    text: |-
      [Artikel 4, vijfde lid][ref1], is van overeenkomstige toepassing op de bekendmaking van een besluit op grond van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel4
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '4'
        paragraaf: '2'
  - number: 2a.4
    text: |-
      Voor de toepassing van de in het eerste lid bedoelde technische voorziening kan Onze Minister een krachtens
      algemene maatregel van bestuur aangewezen reclasseringsinstelling aanwijzen.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2a
  - number: 2a.5
    text: |-
      Onze Minister kan algemene en bijzondere aanwijzingen geven ter zake van de toepassing van de in het eerste lid
      bedoelde technische voorziening.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel2a
  - number: '3'
    text: |-
      Onze Minister kan, indien dat noodzakelijk is met het oog op de bescherming van de nationale veiligheid,
      aan een persoon een verbod opleggen het Schengengebied te verlaten, indien ten aanzien van deze
      persoon het gegronde vermoeden bestaat dat deze zich buiten dit grondgebied zal begeven met als doel
      zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '4.1'
    text: |-
      Een maatregel als bedoeld in de [artikelen 2][ref1] en [3][ref2] wordt opgelegd voor een periode van ten hoogste
      zes maanden, maar niet langer dan strikt noodzakelijk is voor de bescherming van de nationale veiligheid. De
      maatregel kan worden verlengd met een telkens door Onze Minister vast te stellen periode van ten hoogste zes
      maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel3
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039210
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      Indien dat aanvaardbaar is met het oog op de bescherming van de nationale veiligheid kan Onze Minister op aanvraag
      tijdelijk ontheffing verlenen van een of meer verplichtingen die voortvloeien uit een opgelegde maatregel. Onze
      Minister kan aan de ontheffing voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister wijzigt een opgelegde maatregel ten gunste van de betrokkene of trekt hem in, indien nieuwe feiten
      of omstandigheden daartoe aanleiding geven. Onze Minister kan op grond van nieuwe feiten of omstandigheden een
      maatregel wijzigen ten nadele van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel4
  - number: '4.4'
    text: |-
      Een maatregel wordt in ieder geval ingetrokken zodra deze niet langer noodzakelijk is met het oog op de bescherming
      van de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel4
  - number: '4.5'
    text: |-
      Indien de situatie dermate spoedeisend is dat Onze Minister de beslissing tot het opleggen, wijzigen of verlengen
      van een maatregel niet tevoren op schrift kan stellen, maakt Onze Minister de beslissing op een door hem te bepalen
      wijze aan de betrokkene bekend. In dat geval zorgt hij alsnog onverwijld voor de opschriftstelling en voor de
      bekendmaking aan belanghebbende overeenkomstig [artikel 3:41 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '5.1'
    text: |-
      De rechtbank behandelt het beroep tegen een besluit omtrent het opleggen, wijzigen, verlengen of
      intrekken van een maatregel als bedoeld in de [artikelen 2][ref1] en [3][ref2], een besluit omtrent het
      toepassen van een technische voorziening als bedoeld in [artikel 2a, eerste lid][ref3], en een besluit
      omtrent het verlenen van een ontheffing als bedoeld in [artikel 4, tweede lid][ref4], met toepassing van
      [artikel 8:52 van de Algemene wet bestuursrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0039210#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0039210#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039210
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039210
        artikel: 2a
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0039210
        artikel: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '5.2'
    text: |-
      De rechtbank houdt bij de beoordeling van het beroep rekening met feiten en omstandigheden die na het nemen van
      het bestreden besluit zijn opgekomen, tenzij de goede procesorde zich daartegen verzet of de afdoening van de zaak
      daardoor ontoelaatbaar wordt vertraagd. De rechtbank verzoekt Onze Minister om zo spoedig mogelijk schriftelijk
      aan de wederpartij en de rechtbank te laten weten of de ingeroepen feiten en omstandigheden aanleiding zijn voor
      handhaving, wijziging of intrekking van het bestreden besluit.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel5
  - number: '6'
    text: |-
      Een bestuursorgaan kan een aanvraag voor een subsidie, vergunning, ontheffing of erkenning afwijzen dan wel een
      beschikking ter zake van een subsidie, vergunning, ontheffing of erkenning intrekken, indien:
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel6
  - number: 6.a
    text: |-
      de aanvrager, subsidieontvanger of houder van een vergunning, ontheffing of erkenning op grond van zijn gedragingen
      in verband kan worden gebracht met terroristische activiteiten of de ondersteuning daarvan; en
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel6
  - number: 6.b
    text: |-
      ernstig gevaar bestaat dat de subsidie, vergunning, ontheffing of erkenning mede zal worden gebruikt ten behoeve
      van terroristische activiteiten of de ondersteuning daarvan.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel6
  - number: '7.1'
    text: |-
      Alvorens een besluit te nemen omtrent het opleggen, wijzigen, verlengen of intrekken van een maatregel als
      bedoeld in de [artikelen 2][ref1] en [3][ref2] of omtrent het verlenen van een ontheffing als bedoeld in
      [artikel 4, tweede lid][ref3], overlegt Onze Minister met de burgemeester van de gemeente waar degene tot wie het
      voorgenomen besluit zich richt woon- of verblijfplaats heeft alsmede andere bij het voorgenomen besluit betrokken
      burgemeesters, tenzij de spoedeisendheid van de situatie daaraan in de weg staat. In dat geval informeert Onze
      Minister deze burgemeesters hierover onverwijld.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0039210#Artikel4
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039210
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039210
        artikel: '4'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      Alvorens een besluit te nemen op grond van [artikel 6][ref1], dan wel het ontwerp van het te nemen besluit
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref2] ter inzage te leggen, overlegt
      een bestuursorgaan met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '7.3'
    text: |-
      Aan de [artikelen 4:7][ref1] en [4:8 van de Algemene wet bestuursrecht][ref2] wordt niet eerder toepassing gegeven
      dan nadat het in het eerste en tweede lid bedoelde overleg heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.1'
    text: |-
      Opzettelijk handelen in strijd met een verplichting of verbod, opgelegd krachtens [artikel 2, eerste lid][ref1],
      [artikel 3][ref2], of de voorschriften, verbonden aan een ontheffing als bedoeld in [artikel 4, tweede lid][ref3],
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0039210#Artikel4
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039210
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039210
        artikel: '4'
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Opzettelijk onttrekken aan controle middels een technische voorziening als bedoeld in
      [artikel 2a, eerste lid][ref1], wordt gestraft met een gevangenisstraf van ten hoogste een jaar of geldboete van de
      derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2a
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0039210
        artikel: 2a
        paragraaf: '2'
  - number: '8.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel8
  - number: '12'
    text: |-
      Onze Minister zendt binnen drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel12
  - number: '13.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig toepassing gegeven aan
      [artikel 12 van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0036443
        artikel: '12'
  - number: '13.2'
    text: Deze wet vervalt vijf jaar na de inwerkingtreding ervan.
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel13
  - number: '16'
    text: 'Deze wet wordt aangehaald als: Tijdelijke wet bestuurlijke maatregelen terrorismebestrijding.'
    url: https://wetten.overheid.nl/BWBR0039210/2017-03-01#Artikel16
