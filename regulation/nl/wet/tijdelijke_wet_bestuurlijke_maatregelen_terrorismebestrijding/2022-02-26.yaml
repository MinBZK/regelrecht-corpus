  - number: '8'
    text: |-
      1 Opzettelijk handelen in strijd met een verplichting of verbod, opgelegd krachtens [artikel 2, eerste lid][ref1],
      [artikel 3][ref2], of de voorschriften, verbonden aan een ontheffing als bedoeld in [artikel 4, tweede lid][ref3],
      wordt gestraft met gevangenisstraf van ten hoogste een jaar of geldboete van de derde categorie.

      2 Opzettelijk onttrekken aan controle middels een technische voorziening als bedoeld in
      [artikel 2a, eerste lid][ref4], wordt gestraft met een gevangenisstraf van ten hoogste een jaar of geldboete van de
      derde categorie.

      3 De in het eerste en tweede lid strafbaar gestelde feiten zijn misdrijven.


