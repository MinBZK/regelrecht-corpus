  - number: '6'
    text: |-
      Een bestuursorgaan kan een aanvraag voor een subsidie, vergunning, ontheffing of erkenning afwijzen dan wel een
      beschikking ter zake van een subsidie, vergunning, ontheffing of erkenning intrekken, indien:

      a. de aanvrager, subsidieontvanger of houder van een vergunning, ontheffing of erkenning op grond van zijn
      gedragingen in verband kan worden gebracht met terroristische activiteiten of de ondersteuning daarvan; en

      b. ernstig gevaar bestaat dat de subsidie, vergunning, ontheffing of erkenning mede zal worden gebruikt ten behoeve
      van terroristische activiteiten of de ondersteuning daarvan.
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel6
  - number: '7'
    text: |-
      1 Alvorens een besluit te nemen omtrent het opleggen, wijzigen, verlengen of intrekken van een maatregel als
      bedoeld in de [artikelen 2][ref1] en [3][ref2] of omtrent het verlenen van een ontheffing als bedoeld in
      [artikel 4, tweede lid][ref3], overlegt Onze Minister met de burgemeester van de gemeente waar degene tot wie het
      voorgenomen besluit zich richt woon- of verblijfplaats heeft alsmede andere bij het voorgenomen besluit betrokken
      burgemeesters, tenzij de spoedeisendheid van de situatie daaraan in de weg staat. In dat geval informeert Onze
      Minister deze burgemeesters hierover onverwijld.

      2 Alvorens een besluit te nemen op grond van [artikel 6][ref4], dan wel het ontwerp van het te nemen besluit
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref5] ter inzage te leggen, overlegt
      een bestuursorgaan met Onze Minister.

      3 Aan de [artikelen 4:7][ref6] en [4:8 van de Algemene wet bestuursrecht][ref7] wordt niet eerder toepassing
      gegeven dan nadat het in het eerste en tweede lid bedoelde overleg heeft plaatsgevonden.


