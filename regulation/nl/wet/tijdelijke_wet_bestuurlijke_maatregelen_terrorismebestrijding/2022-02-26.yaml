  - number: '3'
    text: |-
      Onze Minister kan, indien dat noodzakelijk is met het oog op de bescherming van de nationale veiligheid,
      aan een persoon een verbod opleggen het Schengengebied te verlaten, indien ten aanzien van deze
      persoon het gegronde vermoeden bestaat dat deze zich buiten dit grondgebied zal begeven met als doel
      zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel14
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '14'
  - number: '4'
    text: |-
      1 Een maatregel als bedoeld in de [artikelen 2][ref1] en [3][ref2] wordt opgelegd voor een periode van ten
      hoogste zes maanden, maar niet langer dan strikt noodzakelijk is voor de bescherming van de nationale veiligheid.
      De maatregel kan worden verlengd met een telkens door Onze Minister vast te stellen periode van ten hoogste zes
      maanden.

      2 Indien dat aanvaardbaar is met het oog op de bescherming van de nationale veiligheid kan Onze Minister op
      aanvraag tijdelijk ontheffing verlenen van een of meer verplichtingen die voortvloeien uit een opgelegde maatregel.
      Onze Minister kan aan de ontheffing voorschriften verbinden.

      3 Onze Minister wijzigt een opgelegde maatregel ten gunste van de betrokkene of trekt hem in, indien nieuwe feiten
      of omstandigheden daartoe aanleiding geven. Onze Minister kan op grond van nieuwe feiten of omstandigheden een
      maatregel wijzigen ten nadele van de betrokkene.

      4 Een maatregel wordt in ieder geval ingetrokken zodra deze niet langer noodzakelijk is met het oog op de
      bescherming van de nationale veiligheid.

      5 Indien de situatie dermate spoedeisend is dat Onze Minister de beslissing tot het opleggen, wijzigen of verlengen
      van een maatregel niet tevoren op schrift kan stellen, maakt Onze Minister de beslissing op een door hem te bepalen
      wijze aan de betrokkene bekend. In dat geval zorgt hij alsnog onverwijld voor de opschriftstelling en voor de
      bekendmaking aan belanghebbende overeenkomstig [artikel 3:41 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel341
