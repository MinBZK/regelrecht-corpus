preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is vrijheidsbeperkende maatregelen op te leggen aan
    personen die een gevaar vormen voor de nationale veiligheid of die voornemens zijn zich aan te sluiten bij
    terroristische strijdgroepen en beschikkingen te weigeren en in te trekken bij ernstig gevaar voor gebruik ervan
    voor terroristische activiteiten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *Schengengebied:* het grondgebied van de staten waarop de Schengengrenscode van toepassing is;
        - *Schengengrenscode:* [Verordening (EU) 2016/399](32299R2016) van het Europees Parlement en de Raad van 9 maart
      2016 betreffende een Uniecode voor de overschrijding van de grenzen door personen (Schengengrenscode) (PbEU 2016,
      L77).
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan, indien dat noodzakelijk is met het oog op de bescherming van de nationale veiligheid, aan
      een persoon die op grond van zijn gedragingen in verband kan worden gebracht met terroristische activiteiten of de
      ondersteuning daarvan, een maatregel opleggen, strekkende tot beperking van de vrijheid van beweging.

      2 Een maatregel kan bestaan uit:

      a. een verplichting om zich op door Onze Minister vast te stellen tijdstippen te melden bij een door Onze Minister
      aangewezen politiechef of organisatie;

      b. een verbod om zich te bevinden in of in de omgeving van een of meer bepaalde objecten dan wel in een bepaald
      gedeelte of bepaalde delen van Nederland, dat niet groter is of die niet groter zijn dan strikt noodzakelijk voor
      de bescherming van de nationale veiligheid;

      c. een verbod om zich te bevinden in de nabijheid van een of meer bepaalde personen.
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel2
  - number: 2a
    text: |-
      1 Indien dat noodzakelijk is met het oog op de naleving van een verbod als bedoeld in
      [artikel 2, tweede lid, onderdeel b][ref1], kan Onze Minister besluiten tot het toepassen van een technische
      voorziening waarmee toezicht wordt gehouden op de naleving van dat verbod.

      2 Het in het eerste lid bedoelde besluit wordt ingetrokken zodra het niet meer noodzakelijk is met het oog op de
      naleving van een verbod als bedoeld in [artikel 2, tweede lid, onderdeel b][ref2].

      3 [Artikel 4, vijfde lid][ref3], is van overeenkomstige toepassing op de bekendmaking van een besluit op grond van
      het eerste lid.

      4 Voor de toepassing van de in het eerste lid bedoelde technische voorziening kan Onze Minister een krachtens
      algemene maatregel van bestuur aangewezen reclasseringsinstelling aanwijzen.

      5 Onze Minister kan algemene en bijzondere aanwijzingen geven ter zake van de toepassing van de in het eerste lid
      bedoelde technische voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039210#Artikel2
