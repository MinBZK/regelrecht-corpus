  - number: 7a
    text: |-
      1 Gelet op artikel 9, tweede lid, onderdeel g, van de Algemene verordening gegevensbescherming,
      is het verbod om gegevens waaruit ras of etnische afkomst, politieke, religieuze of
      levensbeschouwelijke overtuigingen blijken en verwerking van gegevens over gezondheid als bedoeld in
      [paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1] te verwerken niet
      van toepassing indien de verwerking geschiedt door Onze Minister voor zover de verwerking van deze gegevens
      noodzakelijk is voor de uitoefening van zijn bevoegdheden op grond van deze wet.

      2 Gelet op artikel 10 van de Algemene verordening gegevensbescherming mag
      Onze Minister persoonsgegevens van strafrechtelijke aard als bedoeld in
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] verwerken, indien de
      verwerking noodzakelijk is voor de uitoefening van zijn bevoegdheden op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 7b
    text: |-
      De in [artikel 7a][ref1] bedoelde persoonsgegevens worden vernietigd zodra zij niet langer noodzakelijk zijn voor
      de uitoefening van de bevoegdheden op grond van deze wet, in ieder geval uiterlijk 5 jaar na de laatste verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0039210#Artikel7a
    url: https://wetten.overheid.nl/BWBR0039210/2022-02-26#Artikel7b
