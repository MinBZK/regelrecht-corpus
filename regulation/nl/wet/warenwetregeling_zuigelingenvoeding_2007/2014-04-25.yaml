preamble:
  text: |-
    Handelende in overeenstemming met de Ministers van Landbouw, Natuur en Voedselkwaliteit, en van Economische Zaken;

    Gelet op richtlijn nr. 2006/141/EG van de Commissie van de Europese Gemeenschappen van 22 december 2006 (PbEU
    L 401) inzake volledige zuigelingenvoeding en opvolgzuigelingenvoeding en tot wijziging van richtlijn 1999/21/EG,
    alsmede op artikel 10, eerste lid, van het Warenwetbesluit Producten voor bijzondere voeding;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. [richtlijn 2006/141/EG](32006L0141): richtlijn nr. 2006/141/EG van de Commissie van de Europese Gemeenschappen
      van 22 december 2006 (PbEU L 401) inzake volledige zuigelingenvoeding en opvolgzuigelingenvoeding en tot wijziging
      van [richtlijn 1999/21/EG](31999L0021);

      b. zuigelingen: kinderen jonger dan twaalf maanden;

      c. peuters: kinderen tussen één en drie jaar;

      d. volledige zuigelingenvoeding: levensmiddelen die:

      1°. speciaal bedoeld zijn om als voeding voor zuigelingen in de eerste levensmaanden te worden gebruikt; en

      2°. zolang nog geen passende aanvullende voeding wordt gegeven, volledig aan de voedingsbehoeften van deze
      zuigelingen voldoen;

      e. opvolgzuigelingenvoeding: levensmiddelen die:

      1°. speciaal bedoeld zijn om als voeding voor zuigelingen te worden gebruikt wanneer passende aanvullende voeding
      wordt gegeven; en

      2°. het belangrijkste vloeibare bestanddeel vormen van de steeds gevarieerder worden voeding van deze zuigelingen.
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel1
  - number: '2'
    text: |-
      Het bereiden en verhandelen van:

      a. volledige zuigelingenvoeding; en

      b. opvolgzuigelingenvoeding

      geschiedt met inachtneming van de artikelen 2, 3, en 5 tot en met 14, van [richtlijn 2006/141/EG](32006L0141).
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel2
  - number: '3'
    text: |-
      1 Voorlichting over de voeding van zuigelingen en peuters voldoet aan artikel 15, eerste lid, van [richtlijn
      2006/141/EG](32006L0141).

      2 Voorlichtingsmateriaal en educatief materiaal over zuigelingenvoeding, bestemd voor zwangere vrouwen en moeders
      van zuigelingen en peuters, voldoen aan artikel 15, tweede lid, van [richtlijn 2006/141/EG](32006L0141).
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel3
  - number: '4'
    text: |-
      1 Schenkingen van voorlichtingsmateriaal of educatief materiaal en de daarvoor benodigde apparatuur, voldoen aan
      artikel 15, derde lid, van [richtlijn 2006/141/EG](32006L0141).

      2 Schenkingen of leveringen van volledige zuigelingenvoeding tegen lage prijzen, voldoen aan artikel 15, vierde
      lid, van [richtlijn 2006/141/EG](32006L0141).
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel4
  - number: '5'
    text: |-
      1 De Nederlandse Voedsel- en Warenautoriteit is de bevoegde autoriteit, bedoeld in artikel 9 van [richtlijn
      2006/141/EG](32006L0141).

      2 Onze Minister is de nationale instantie, bedoeld in artikel 15, derde lid, van [richtlijn 2006/141/EG]
      (32006L0141).
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel5
  - number: '6'
    text: |-
      1 Handelen in strijd met de [artikelen 2][ref1], [3][ref2] of [4][ref3], van deze regeling, is
      toegestaan tot 31 december 2009, voor zover ter zake de voorschriften in acht zijn genomen, gesteld bij de
      [Warenwetregeling Zuigelingenvoeding][ref4] zoals die luidde onmiddellijk vóór de inwerkingtreding van deze
      regeling.

      2 In afwijking van [artikel 2][ref5] mag tot 1 januari 2012 dieetvoeding voor medisch gebruik, speciaal bestemd voor
      zuigelingen, bedoeld in [artikel 5, tweede lid, van de Warenwetregeling Dieetvoeding voor medisch gebruik][ref6],
      bereid en verhandeld worden zonder daarbij artikel 7, eerste en tweede lid, van [richtlijn 2006/141/EG]
      (32006L0141), in acht te nemen.


