  - number: '7'
    text: |-
      Een wijziging van de artikelen 2, 3, en 5 tot en met 15, van [richtlijn 2006/141/EG](32006L0141), gaat voor de
      toepassing van deze regeling gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt medegedeeld, een ander tijdstip
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0021907/2014-04-25#Artikel7
  - number: '9'
    text: |-
      De[ Warenwetregeling Zuigelingenvoeding][ref1] wordt ingetrokken.


