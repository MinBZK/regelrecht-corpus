---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zuivelverordening_2010_grondslag_uitbetaling_geitenmelk
regulatory_layer: WET
publication_date: '2014-12-24'
valid_from: '2011-04-02'
bwb_id: BWBR0029878
url: https://wetten.overheid.nl/BWBR0029878/2011-04-02
preamble:
  text: |-
    Gelet op de artikelen 93, 95, 102 en 104 van de Wet op de bedrijfsorganisatie alsmede op de artikelen 5 en 6 van
    het Instellingsbesluit Productschap Zuivel;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:







                  a.


                  rauwe geitenmelk:


                  melk afgescheiden door de melkklier van één of meer geiten, die niet is verhit tot meer dan 400ºC en
      dat evenmin een behandeling met een gelijkwaardig effect heeft ondergaan;




                  b.


                  boerderijmelk:


                  rauwe geitenmelk die door een melkgeitenhouder kennelijk bestemd is voor aflevering anders dan aan
      consumenten;




                  c.


                  ontvanger van boerderijmelk:


                  natuurlijke of rechtspersoon die op jaarbasis 500.000 kg of meer boerderijmelk bedrijfsmatig
      ontvangt van één of meer in Nederland gevestigde melkgeitenhouders en terzake betalingen aan de desbetreffende
      melkgeitenhouders verricht, met uitzondering van boerderijzuivelbereiders;




                  d.


                  melkkoeltank:


                  tank die voldoet aan norm NEN-ISO 5708 en die is voorzien van een installatie waarmee melk tot 4°C of
      lager kan worden gekoeld, alsmede van een automatisch werkend roerapparaat;




                  e.


                  tankmelk:


                  boerderijmelk die door melkgeitenhouders wordt bewaard in een melkkoeltank;




                  f.


                  leverantie van boerderijmelk:


                  transactie waarbij een melkgeitenhouder boerderijmelk ter beschikking van de ontvanger van
      boerderijmelk stelt en deze de betreffende melk in ontvangst neemt met het kennelijke doel deze te bewerken, te
      verwerken of te verhandelen;




                  g.


                  rijdende melkontvangst:


                  mobiele installatie die wordt gebruikt voor het ophalen van boerderijmelk;




                  h.


                  kwaliteitsonderzoek:


                  onderzoek naar de kwaliteit van boerderijmelk ten behoeve van de uitbetaling naar gelang van de
      kwaliteit van deze melk;




                  i.


                  samenstellingsonderzoek:


                  onderzoek naar de samenstelling van boerderijmelk ten behoeve van de uitbetaling van deze melk;




                  j.


                  melkcontrolestation:


                  laboratorium dat onderzoek uitvoert met betrekking tot de kwaliteit en samenstelling van boerderijmelk;




                  k.


                  COKZ:


                  Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;




                  l.


                  productschap:


                  Productschap Zuivel;




                  m.


                  bestuur:


                  bestuur van het productschap;




                  n.


                  voorzitter:


                  voorzitter van het productschap;




                  o.


                  melkgeitenhouder:


                  ondernemer die bedrijfsmatig melkgeiten houdt;




                  p.


                  wet:


                  [Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
  - number: '2.1'
    text: |-
      Indien de ontvanger van boerderijmelk de aan hem geleverde boerderijmelk betaalt op basis van de hoeveelheid, de
      samenstelling en/of de kwaliteit, dan worden de bij of krachtens deze verordening van toepassing zijnde bepalingen
      in acht genomen.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel2
  - number: '2.2'
    text: De ontvanger van boerderijmelk meldt zich ter registratie aan bij het productschap.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel2
  - number: '3'
    text: De ontvanger van boerderijmelk ontvangt alleen boerderijmelk die in een melkkoeltank is bewaard.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel3
  - number: '4.1'
    text: |-
      De ontvanger van boerderijmelk zorgt ervoor dat van elke leverantie boerderijmelk een representatief monster wordt
      genomen met inachtneming van het bepaalde bij of krachtens deze verordening.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel4
  - number: '4.2'
    text: |-
      De ontvanger van boerderijmelk zorgt ervoor dat de chauffeur-monsternemer die wordt belast met de bemonstering van
      boerderijmelk ter zake kundig is.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel4
  - number: '5'
    text: De melkgeitenhouder verleent alle medewerking aan de bemonstering van de boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel5
  - number: '6.1'
    text: |-
      Ten aanzien van het nemen, transporteren en bewaren van monsters boerderijmelk is het bepaalde in
      [Zuivelverordening 2000, Handmatig nemen, transporteren en bewaren van monsters boerderijmelk][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010869
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010869
  - number: '6.2'
    text: |-
      De ontvanger van boerderijmelk beschikt over een kwaliteitssysteem waarmee hij aantoonbaar het gestelde in lid 1
      realiseert, beheerst en borgt. Dit kwaliteitssysteem is door de ontvanger van boerderijmelk op een overzichtelijke
      wijze beschreven en vastgelegd.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel6
  - number: '6.3'
    text: |-
      De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1. Aan deze ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel6
  - number: '7.1'
    text: |-
      De hoeveelheid geleverde boerderijmelk wordt vastgesteld overeenkomstig het bepaalde in
      __REF000___________________________________________________________________________________________________________
      _________________ en
      __REF001___________________________________________________________________________________________________________
      ___________.


      [ref1]: https://wetten.overheid.nl/BWBR0025401
      [ref2]: https://wetten.overheid.nl/BWBR0025378
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0025401
      - id: ref2
        bwb_id: BWBR0025378
  - number: '7.2'
    text: |-
      De voorzitter kan, gehoord het COKZ, ontheffing verlenen van het bepaalde in lid 1, mits tot zijn genoegen wordt
      aangetoond dat de vaststelling van de hoeveelheid op andere wijze nauwkeurig plaatsvindt. Aan de ontheffing kunnen
      voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel7
  - number: '8.1'
    text: 'Indien de uitbetaling van boerderijmelk plaatsvindt op basis van één of meer van de hiernavolgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.a
    text: het vetgehalte;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.b
    text: het eiwitgehalte;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.c
    text: de aanwezigheid van melkvreemde bacteriegroeiremmende stoffen;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.d
    text: het kiemgetal;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.e
    text: de verontreinigingsgraad;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.f
    text: het celgetal;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.g
    text: de aanwezigheid van sporen van boterzuurbacteriën;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.h
    text: het vriespunt;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.i
    text: het chloroformgehalte;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: 8.1.j
    text: de aanwezigheid van koemelk;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: '8.2'
    text: |-
      Indien de uitbetaling van boerderijmelk plaatsvindt op basis van het vetgehalte of het eiwitgehalte, dan worden
      deze per leverantie bepaald.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: '8.3'
    text: |-
      De ontvanger van boerderijmelk legt het systeem van uitbetaling zoals bedoeld in deze verordening vast. Dit systeem
      van uitbetaling wordt aan de betrokken melkgeitenhouders bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel8
  - number: '9'
    text: |-
      De onderzoeken worden verricht met inachtneming van de bepalingen van Verordening (EG) nr. 853/2004 van het
      Europees Parlement en de Raad van 29 april 2004 houdende vaststelling van specifieke hygiënevoorschriften voor
      levensmiddelen van dierlijke oorsprong (PbEG l226).
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel9
  - number: '10'
    text: |-
      De hoeveelheid, de samenstelling en de kwaliteit van de ontvangen boerderijmelk worden, voor zover van belang voor
      de uitbetaling, aan de melkgeitenhouder bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel10
  - number: '11.1'
    text: |-
      De ontvanger van boerderijmelk voert een administratie of laat deze voeren waaruit per melkgeitenhouder de volgende
      gegevens worden vastgelegd voor zover deze relevant zijn voor de uitbetaling van boerderijmelk:
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel11
  - number: 11.1.a
    text: de hoeveelheid ontvangen boerderijmelk,
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel11
  - number: 11.1.b
    text: de samenstelling en/of de kwaliteit van de ontvangen boerderijmelk.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel11
  - number: '11.2'
    text: |-
      De in lid 1 bedoelde gegevens worden op overzichtelijke wijze geadministreerd en worden gedurende ten minste één
      jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel11
  - number: '12'
    text: |-
      Indien de uitbetaling van boerderijmelk plaatsvindt op grond van samenstelling en/of kwaliteit, dan draagt de
      ontvanger van boerderijmelk er zorg voor dat de betrokken onderzoeken worden verricht door een melkcontrolestation
      dat beschikt over een terzake deskundige leiding, over een voor het te verrichten onderzoek voldoende outillage,
      alsmede over een gedocumenteerd en adequaat functionerend kwaliteitssysteem en dat voor alle in dit kader relevante
      onderzoekmethoden geaccrediteerd is volgens NEN-EN-ISO/IEC 17025. Het bestuur kan nadere eisen stellen aan een
      melkcontrolestation.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel12
  - number: '13'
    text: |-
      De uitslagen van het onderzoek worden vastgelegd op een toegankelijke en overzichtelijke wijze. De uitslagen worden
      gedurende ten minste een jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel13
  - number: '14'
    text: |-
      Het bij of krachtens deze verordening bepaalde is bindend voor de in [artikel 102, lid 1, van de wet][ref1]
      bedoelde natuurlijke en rechtspersonen alsmede voor de in artikel 102, lid 2 van de wet bedoelde natuurlijke
      en rechtspersonen, voor zover deze handelingen verrichten die bedrijfsmatig plegen te worden verricht in de
      ondernemingen, bedoeld in artikel 102, lid 1, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel102
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '102'
  - number: '15.1'
    text: Op overtreding van het bepaalde bij of krachtens deze verordening worden tuchtrechtelijke maatregelen gesteld.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: '15.2'
    text: 'De tuchtrechtelijke maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: 15.2.a
    text: een berisping;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: 15.2.b
    text: een geldboete van ten hoogste € 4.500;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: 15.2.c
    text: openbaarmaking van de uitspraak op kosten van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: 15.2.d
    text: |-
      het onder verscherpte controle stellen van het bedrijf van de betrokkene op zijn kosten voor ten hoogste twee
      jaren.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel15
  - number: '16.1'
    text: Het bestuur van het productschap kan ontheffing verlenen van het in deze verordening bepaalde.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel16
  - number: '16.2'
    text: Het bestuur kan aan een ontheffing als bedoeld in lid 1 voorwaarden binden.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel16
  - number: '17'
    text: |-
      Deze verordening treedt inwerking met ingang van van de dag na publicatie in het Verordeningen blad
      Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel17
  - number: '18'
    text: Deze verordening wordt aangehaald als Zuivelverordening 2010, Grondslag uitbetaling geitenmelk.
    url: https://wetten.overheid.nl/BWBR0029878/2011-04-02#Artikel18
