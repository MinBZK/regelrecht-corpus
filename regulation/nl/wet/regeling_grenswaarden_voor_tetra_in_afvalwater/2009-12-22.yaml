$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_grenswaarden_voor_tetra_in_afvalwater
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2009-12-22'
bwb_id: BWBR0005477
url: https://wetten.overheid.nl/BWBR0005477/2009-12-22
preamble:
  text: |-
    Overwegende, dat het noodzakelijk is grenswaarden vast te stellen voor TETRA voorkomend in afvalwater dat in
    oppervlaktewateren wordt gebracht ter uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van
    12 juni 1986 betreffende grenswaarden en kwaliteitsdoelstellingen voor lozingen van bepaalde onder lijst I van de
    bijlage van Richtlijn 76/464/EEG vallende gevaarlijke stoffen, 86/280/EEG (PbEG L 181);

    Gelet op artikel 1a, derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            TETRA:

              tetrachloorkoolstof (Cas nr. 56-23-5);



            b
            verwerken van TETRA:

              elk industrieel proces waarbij TETRA of TETRA bevattende stoffen worden geproduceerd, omgezet of gebruikt,
      of waarbij TETRA of TETRA bevattende stoffen vrijkomen;



            c
            bestaand bedrijf:

              bedrijf dat TETRA verwerkt, dat op 16 juni 1987 in werking is en waarvan de capaciteit voor het verwerken
      van TETRA na 16 juni 1987 niet aanzienlijk is uitgebreid;



            d
            nieuw bedrijf:

              bedrijf dat TETRA verwerkt en geen bestaand bedrijf is;



            e
            bijlage I:

              bij deze regeling behorende [bijlage I][ref1];



            f
            bijlage II:

              bij deze regeling behorende [bijlage II][ref2];



            g
            lozen:

              brengen van:
              stoffen in een oppervlaktewaterlichaam;
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.


      [ref1]: https://wetten.overheid.nl/BWBR0005477
      [ref2]: https://wetten.overheid.nl/BWBR0005477
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005477
      - id: ref2
        bwb_id: BWBR0005477
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6.3
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.40
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21.6
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8.40'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21.6'
  - number: '2'
    text: |-
      Voor een nieuw bedrijf gelden, als de hoogst toelaatbare gewichtshoeveelheid en concentratie TETRA voorkomend in
      afvalwater dat wordt geloosd, de grenswaarden die overeenkomen met de waarden die het resultaat zijn van toepassing
      van de beste bestaande technieken, met dien verstande dat voor een nieuw bedrijf behorende tot een van de in
      [bijlage I][ref1] genoemde bedrijfstakken, die gewichtshoeveelheid en concentratie in ieder geval niet hoger is dan
      de in die bijlage opgenomen grenswaarde die op de betrokken bedrijfstak van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005477
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005477
  - number: '3'
    text: |-
      Voor een bestaand bedrijf gelden als de hoogst toelaatbare gewichtshoeveelheid en concentratie TETRA voorkomend in
      afvalwater dat wordt geloosd:

      a. indien dat bedrijf behoort tot een van de in [bijlage I][ref1] genoemde bedrijfstakken: de in die bijlage voor
      die bedrijfstak opgenomen grenswaarde;

      b. indien dat bedrijf niet behoort tot een in [bijlage I][ref2] genoemde bedrijfstak: de grenswaarden die op
      31 december 1987 overeenkomen met de waarden die het resultaat zijn van de toepassing van de beste bestaande
      technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0005477
      [ref2]: https://wetten.overheid.nl/BWBR0005477
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005477
      - id: ref2
        bwb_id: BWBR0005477
  - number: '4'
    text: |-
      De wijze van meting van de gewichtshoeveelheid en concentratie TETRA, bedoeld in de artikelen 2 en 3, dient ten
      minste te voldoen aan de in bijlage II daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel4
  - number: '5'
    text: |-
      De Regeling van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 14 december 1987,
      houdende regelen met betrekking tot grenswaarden voor tetrachloorkoolstof (Stb. 587) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel5
  - number: '6'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling grenswaarden voor TETRA in afvalwater.'
    url: https://wetten.overheid.nl/BWBR0005477/2009-12-22#Artikel7
