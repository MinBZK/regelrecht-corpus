preamble:
  text: |-
    Gelet op artikel 11 van het Reglement voor de binnenvisserij 1985 (Stb. 283);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004024/2005-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van het bepaalde in artikel 7, eerste lid, van het Reglement voor de binnenvisserij 1985 (Stb. 283) wordt
      vrijstelling verleend voor zover het betreft het vissen met de hengel tussen twee uur na zonsondergang en één
      uur voor zonsopgang in de wateren die zijn vermeld in de bij deze regeling behorende bijlage in de periode van 1
      september tot en met 31 mei.
    url: https://wetten.overheid.nl/BWBR0004024/2005-12-22#Artikel1
  - number: '2.1'
    text: |-
      De [Regeling vrijstelling verbod nachtvisserij][ref1] 1985/1986 (Stcrt. 1985, 236) wordt ingetrokken.


