articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Onderwijs, Cultuur en Wetenschap;

      b. *besluit:* [Besluit rijkssubsidiëring instandhouding monumenten][ref1];

      c. *subsidie:* subsidie als bedoeld in [artikel 43 van het besluit][ref2];

      d. *restauratieplan:* plan als bedoeld in [artikel 4, derde lid][ref3]; en

      e. *subsidiabele kosten:* kosten als bedoeld in [artikel 7][ref4], voorzover die naar het oordeel van de minister
      noodzakelijk zijn om een monument te restaureren.


