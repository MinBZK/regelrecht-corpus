  - number: '4'
    text: |-
      1 Per monument als bedoeld in [artikel 3][ref1] wordt één aanvraag voor subsidie op grond van deze regeling
      ingediend.

      2 Voor zover deze bescheiden niet reeds in het bezit zijn van de Rijksdienst voor Archeologie, Cultuurlandschap en
      Monumenten, gaat een aanvraag voor subsidie vergezeld van:

      a. een restauratieplan;

      b. een bouwkundig inspectierapport per monument dat niet ouder is dan twee jaar; en

      c. een financieel dekkingsplan waaruit blijkt dat de financiering van het gedeelte van de subsidiabele kosten van
      het restauratieplan dat niet door subsidie wordt gedekt, naar het oordeel van de minister voldoende is gewaarborgd.

      3 Het restauratieplan, bedoeld in het tweede lid, onder a, bestaat uit:

      a. een beschrijving van de technische staat van het monument, waarbij de gebreken van het monument nauwkeurig staan
      vermeld;

      b. overzichts- en detailfoto’s die een duidelijke indruk geven van het monument en zijn gebreken;

      c. tekeningen van de bestaande toestand van het monument en tekeningen waarop de voorgenomen herstelwerkzaamheden
      of wijzigingen staan aangegeven;

      d. een op de onder a bedoelde beschrijving gebaseerd bestek of werkomschrijving per onderdeel van de toe te passen
      constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan;

      e. een begroting die niet ouder is dan twee jaar en is gespecificeerd in hoeveelheden uren, materialen, stelposten
      en onderaannemers; en

      f. in voorkomende gevallen rapporten inzake bouwfysische, bouwhistorische, constructieve, decoratieve,
      materiaaltechnische of preventieve aspecten.

      4 De minister stelt voor het indienen van aanvragen een formulier vast.


