  - number: '11'
    text: De subsidieontvanger is verplicht de restauratie uiterlijk 31 december 2012 te hebben afgerond.
    url: https://wetten.overheid.nl/BWBR0025595/2009-04-03#Artikel11
  - number: '12'
    text: |-
      1 Voordat subsidie is verleend, maar nadat de minister toestemming heeft verleend om met de werkzaamheden
      te beginnen, kan de minister aan de eigenaar van een monument als bedoeld in [artikel 3][ref1] voorschotten
      verstrekken op basis van door de eigenaar ingediende overzichten van gemaakte kosten die vergezeld gaan van de
      desbetreffende originele rekeningen en in voorkomend geval betalingsbewijzen. Geen voorschotten worden verstrekt
      indien voor de voorgenomen restauratie geen vergunning als bedoeld in [artikel 11, tweede lid, van de wet][ref2]
      is verleend.

      2 Nadat subsidie is verleend, kan de minister aan de subsidieontvanger voorschotten verstrekken op basis van door
      de subsidieontvanger ingediende overzichten van gemaakte kosten die vergezeld gaan van de desbetreffende originele
      rekeningen en in voorkomend geval betalingsbewijzen.

      3 Indien rekeningen en betalingsbewijzen betrekking hebben op kosten van personeel dat in loondienst is bij de
      eigenaar, gaan de overzichten, bedoeld in het eerste en tweede lid, tevens vergezeld van een verklaring van een
      registeraccountant of een accountant-administratieconsulent waaruit blijkt hoeveel uren door dat personeel is
      besteed aan de restauratie, waarvoor subsidie wordt aangevraagd onderscheidenlijk is verleend.

      4 De minister keert de voorschotten uit voorzover de rekeningen werkzaamheden betreffen die in overeenstemming zijn
      met het restauratieplan.


      [ref1]: https://wetten.overheid.nl/BWBR0025595#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004471#Artikel11
