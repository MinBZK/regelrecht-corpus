        bwb_id: BWBR0019439
        artikel: '1'
  - number: '9'
    text: |-
      Subsidie wordt niet verstrekt, indien:

      a. voor de voorgenomen restauratie geen vergunning als bedoeld in [artikel 11 van de wet][ref1] is verleend; of

      b. de toekomstige bestemming van het te restaureren monument naar het oordeel van de minister een belemmering vormt
      voor de instandhouding van het monument.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel11
    url: https://wetten.overheid.nl/BWBR0025595/2009-04-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '11'
  - number: '10'
    text: |-
      Indien één of meer van de subsidieplafonds, bedoeld in [artikel 6][ref1] na toepassing van de [artikelen 8][ref2]
      en [9][ref3] niet worden bereikt, wendt de minister het resterende bedrag aan voor de verhoging van één of meer
      van de overige subsidieplafonds.


