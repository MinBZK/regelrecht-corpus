  - number: '2'
    text: |-
      De [artikelen 3, tweede lid][ref1], [8][ref2], [9][ref3], [14][ref4], [16][ref5], tweede lid, [17][ref6],
      [23 tot en met 31][ref7], [32][ref8], [34][ref9] en [35 van het besluit][ref10] zijn van overeenkomstige toepassing
      met dien verstande dat:

      a. instandhouding en instandhoudingsplan telkens worden gelezen als restauratie, onderscheidenlijk restauratieplan;

      b. in [artikel 9, eerste lid, onder c][ref11], ‘de subsidie heeft verleend’ wordt gelezen als: daartoe schriftelijk
      toestemming heeft verleend; en

      c. in [artikel 32, eerste lid][ref12], ‘op 31 maart na afloop van het laatste kalenderjaar waarover de subsidie
      wordt verleend,’ wordt gelezen als: drie maanden na afloop van de restauratie.


