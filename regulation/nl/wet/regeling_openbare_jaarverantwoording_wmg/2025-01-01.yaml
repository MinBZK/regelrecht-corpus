  - number: 13b
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 40b, vijfde lid, van de wet][ref1] overlegt het niet openbaar gemaakte
      deel van de jaarverantwoording, bedoeld in [artikel 13a][ref2], aan het CIBG, waarbij de [artikelen 12a][ref3] en
      [13][ref4], van overeenkomstige toepassing zijn.


