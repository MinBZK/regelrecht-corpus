  - number: '2.3'
    text: |-
      Een zorgaanbieder maakt als financiële verantwoording een balans en een staat van baten en lasten met toelichting
      openbaar die is ingericht overeenkomstig [bijlage 2][ref1] bij deze regeling, indien hij is aan te merken als een:


      [ref1]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0045649
  - number: 2.3.a
    text: |-
      personenvennootschap, met uitzondering van een commanditaire vennootschap of een vennootschap onder firma waarvan
      alle vennoten die volledig jegens schuldeisers aansprakelijk zijn voor de schulden, kapitaalvennootschappen naar
      buitenlands recht zijn;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel2
  - number: 2.3.b
    text: |-
      onderdeel van de militair geneeskundige dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref1], dat collectief verzekerde zorg
      verleent; of


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel2
