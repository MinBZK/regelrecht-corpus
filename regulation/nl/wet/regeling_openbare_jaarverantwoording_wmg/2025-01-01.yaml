  - number: '3.1'
    text: |-
      De toelichting op de financiële verantwoording van een zorgaanbieder die financiële derivaten heeft aangetrokken,
      bevat, naast hetgeen overigens voortvloeit uit deze regeling:
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
