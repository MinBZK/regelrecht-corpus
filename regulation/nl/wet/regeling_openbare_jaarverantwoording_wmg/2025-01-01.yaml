  - number: '7'
    text: |-
      1 Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], openbaar moet maken en
      die alleen of samen met een andere groepsmaatschappij, aan het hoofd staat van zijn groep, maakt als financiële
      verantwoording naast de eigen jaarrekening, bedoeld in artikel 2, eerste lid, voor deze groep een geconsolideerde
      jaarrekening openbaar, waarin zijn opgenomen de eigen financiële gegevens met die van zijn dochtermaatschappijen
      in de groep, andere groepsmaatschappijen en andere rechtspersonen waarop hij een overheersende zeggenschap kan
      uitoefenen of waarover hij de centrale leiding heeft.

      2 Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref2], openbaar moet maken en
      waarop het eerste lid niet van toepassing is, maar die in zijn groep een of meer dochtermaatschappijen heeft
      of andere rechtspersonen waarop hij een overheersende zeggenschap kan uitoefenen of waarover hij de centrale
      leiding heeft, maakt als financiële verantwoording naast de eigen jaarrekening, bedoeld in artikel 2, eerste lid,
      een geconsolideerde jaarrekening openbaar, waarin zijn opgenomen de eigen financiële gegevens met die van zijn
      dochtermaatschappijen in het groepsdeel, andere groepsmaatschappijen in het groepsdeel en andere rechtspersonen in
      het groepsdeel waarop hij een overheersende zeggenschap kan uitoefenen of waarover hij de centrale leiding heeft.

      3 Consolidatie mag achterwege blijven, indien:

      a. bij consolidatie wordt voldaan aan de vereisten, bedoeld in [artikel 4][ref3]; of

      b. de financiële gegevens die de zorgaanbieder zou moeten consolideren zijn opgenomen in een geconsolideerde
      jaarrekening van een andere rechtspersoon of vennootschap welke jaarrekening voldoet aan het vijfde en zesde
      lid, dan wel, indien die rechtspersoon of vennootschap geen zorgaanbieder is, aan het vijfde en zesde lid of
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref4], mits die geconsolideerde jaarrekening openbaar is gemaakt op
      de in [artikel 13][ref5] voorgeschreven manier door de zorgaanbieder die de consolidatie achterwege laat, tenzij de
      openbaarmaking door een andere zorgaanbieder van de desbetreffende groep heeft plaatsgevonden.

      4 Indien een zorgaanbieder consolidatie achterwege laat op grond van het derde lid, onderdeel b, vermeldt hij in de
      toelichting van de eigen jaarrekening de toepassing van het derde lid, onderdeel b, en neemt een verwijzing op naar
      de geconsolideerde jaarrekening waarin de eigen gegevens zijn opgenomen.

      5 Op de geconsolideerde jaarrekening, bedoeld in het eerste en tweede lid, is
      [afdeling 13 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref6], uitgezonderd de [artikelen 406][ref7],
      [407, tweede en derde lid][ref8], [408][ref9] en [414, vierde en vijfde lid][ref10], van overeenkomstige
      toepassing.

      6 De zorgaanbieder die een geconsolideerde jaarrekening opstelt, richt deze in overeenkomstig
      [artikel 2, eerste lid][ref11], met dien verstande dat:

      a. de benamingen mogen worden aangepast om het groepskarakter aan te geven;

      b. in de geconsolideerde balans het aandeel van derden in groepsmaatschappijen afzonderlijk als onderdeel van het
      groepsvermogen wordt opgenomen;

      c. indien in een geconsolideerde winst- en verliesrekening het aandeel van derden in het geconsolideerde resultaat
      na belastingen afzonderlijk wordt gegeven, dit geschiedt na het resultaat na belastingen.


