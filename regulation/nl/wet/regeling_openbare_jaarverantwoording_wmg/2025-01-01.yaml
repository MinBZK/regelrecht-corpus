  - number: '8'
    text: |-
      1 Een zorgaanbieder als bedoeld in [artikel 2][ref1], eerste lid, voegt aan de financiële verantwoording de
      volgende informatie toe:

      a. een controleverklaring die voldoet aan [artikel 11][ref2], indien de zorgaanbieder niet voldoet aan het bepaalde
      in [artikel 4, eerste lid][ref3];

      b. overige gegevens als omschreven in
      [artikel 392, eerste lid, onderdelen b tot en met f, van Boek 2 van het Burgerlijk Wetboek][ref4], waarbij artikel
      392, derde lid, van Boek 2 van het Burgerlijk Wetboek van overeenkomstige toepassing is, indien de zorgaanbieder
      niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref5];

      c. een bestuursverslag, indien de zorgaanbieder niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref6];

      d. een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref7], of [artikel 14 van de Wet ambulancezorgvoorzieningen][ref8]
      moet beschikken over een interne toezichthouder;

      e. afzonderlijke jaarlijkse verslagen en verklaringen, indien de zorgaanbieder voldoet aan het bepaalde bij of
      krachtens [artikel 391a, tweede en vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref9].

      2 Een zorgaanbieder als bedoeld in [artikel 2, derde lid, onderdeel a][ref10], voegt aan de financiële
      verantwoording de volgende informatie toe:

      a. een controleverklaring die voldoet aan [artikel 11][ref11], indien de zorgaanbieder niet voldoet aan het
      bepaalde in [artikel 4, eerste lid][ref12], waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’;

      b. een bestuursverslag, indien de zorgaanbieder niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref13],
      waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’;

      c. een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref14] moet beschikken over een interne toezichthouder.

      3 Een zorgaanbieder als bedoeld in [artikel 2, vierde lid][ref15], voegt aan de financiële
      verantwoording een verslag van de interne toezichthouder toe, indien hij op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref16] moet beschikken over een interne toezichthouder.

      4 Een zorgaanbieder als bedoeld in [artikel 2, vijfde lid][ref17], voegt aan de financiële verantwoording de
      volgende informatie toe:

      a. een controleverklaring die voldoet aan de eisen van de [Subsidieregeling abortusklinieken][ref18], indien aan de
      zorgaanbieder ingevolge die subsidieregeling € 125.000 of meer subsidie is verleend;

      b. een bestuursverslag;

      c. een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref19] moet beschikken over een interne toezichthouder.

      5 Een zorgaanbieder als bedoeld in [artikel 2, zesde lid][ref20], voegt aan de financiële verantwoording toe:

      a. de bij de jaarstukken, bedoeld in
      [artikel 24 van het Besluit begroting en verantwoording provincies en gemeenten][ref21], behorende
      accountantsverklaring die voldoet aan de krachtens de [Provinciewet][ref22], onderscheidenlijk de
      [Gemeentewet][ref23], gestelde eisen;

      b. een jaarverslag dat voldoet aan de krachtens de [Provinciewet][ref24], onderscheidenlijk de
      [Gemeentewet][ref25], gestelde eisen.


