  - number: '4.1'
    text: |-
      Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], openbaar maakt en die op twee
      opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan minimaal
      twee van de in het tweede lid omschreven vereisten kan zijn jaarrekening overeenkomstig [bijlage 1][ref2], Modellen
      C en D, inrichten en [artikel 5][ref3] toepassen.


