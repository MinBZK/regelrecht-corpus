        hoofdstuk: '2'
  - number: '4.2'
    text: 'De vereisten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
  - number: 4.2.a
    text: |-
      de waarde van de activa volgens de balans met toelichting bedraagt, op de grondslag van verkrijgings- en
      vervaardigingsprijs, niet meer dan € 7.500.000;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
  - number: 4.2.b
    text: de netto-omzet over het boekjaar bedraagt niet meer dan € 15.000.000;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
  - number: 4.2.c
    text: het gemiddeld aantal werknemers over het boekjaar bedraagt minder dan 50.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
  - number: '4.3'
    text: |-
      Voor de toepassing van het tweede lid worden meegeteld de waarde van de activa, de netto-omzet en het gemiddeld
      aantal werknemers van groepsmaatschappijen, die in de consolidatie zouden moeten worden betrokken als de
      zorgaanbieder een geconsolideerde jaarrekening zou moeten opstellen. Dit geldt niet, indien de zorgaanbieder
      [artikel 7, derde lid, onderdeel b][ref1], toepast.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel7
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '7'
        hoofdstuk: '2'
  - number: '4.4'
    text: |-
      Voor het eerste en tweede boekjaar geldt het eerste lid eveneens voor een zorgaanbieder die op de balansdatum van
      het eerste boekjaar aan de desbetreffende vereisten heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel4
  - number: '5'
    text: |-
      In het geval, bedoeld in [artikel 4, eerste lid][ref1], mogen de volgende bepalingen van
      [Boek 2 van het Burgerlijk Wetboek][ref2] overeenkomstig worden toegepast:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003045
  - number: 5.a
    text: |-
      op de balans en de toelichting hierop: [artikel 396, derde lid][ref1], met dien verstande dat de opgave, bedoeld in
      [artikel 373, vijfde lid, eerste volzin, van Boek 2 van het Burgerlijk Wetboek][ref2], niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel373
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '373'
  - number: 5.b
    text: |-
      op de toelichtingen op de balans en de winst- en verliesrekening: [artikel 396, vijfde lid][ref1], met dien
      verstande dat in aanvulling op de tweede volzin van dat artikellid ook de [artikelen 380c][ref2], [380d][ref3] en
      [383b tot en met 383e, van Boek 2 van het Burgerlijk Wetboek][ref4] niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel380c
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel380d
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel383b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 380c
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 380d
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 383b
  - number: '6.1'
    text: |-
      Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], opstelt en die op twee
      opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan minimaal
      twee van de in het tweede lid omschreven vereisten kan voor de jaarrekening de vrijstelling, bedoeld in het derde
      lid, toepassen op Model E in [bijlage 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0045649
  - number: '6.2'
    text: 'De vereisten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
  - number: 6.2.a
    text: |-
      de waarde van de activa volgens de balans met toelichting bedraagt, op grondslag van verkrijgings- en
      vervaardigingsprijs, niet meer dan € 25.000.000;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
  - number: 6.2.b
    text: de netto-omzet over het boekjaar bedraagt niet meer dan € 50.000.000;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
  - number: 6.2.c
    text: het gemiddeld aantal werknemers over het boekjaar bedraagt minder dan 250,
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
  - number: '6.3'
    text: |-
      Op de toelichting op de balans is [artikel 397, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '397'
  - number: '7.1'
    text: |-
      Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], openbaar moet maken en
      die alleen of samen met een andere groepsmaatschappij, aan het hoofd staat van zijn groep, maakt als financiële
      verantwoording naast de eigen jaarrekening, bedoeld in artikel 2, eerste lid, voor deze groep een geconsolideerde
      jaarrekening openbaar, waarin zijn opgenomen de eigen financiële gegevens met die van zijn dochtermaatschappijen
      in de groep, andere groepsmaatschappijen en andere rechtspersonen waarop hij een overheersende zeggenschap kan
      uitoefenen of waarover hij de centrale leiding heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], openbaar moet maken en
      waarop het eerste lid niet van toepassing is, maar die in zijn groep een of meer dochtermaatschappijen heeft
      of andere rechtspersonen waarop hij een overheersende zeggenschap kan uitoefenen of waarover hij de centrale
      leiding heeft, maakt als financiële verantwoording naast de eigen jaarrekening, bedoeld in artikel 2, eerste lid,
      een geconsolideerde jaarrekening openbaar, waarin zijn opgenomen de eigen financiële gegevens met die van zijn
      dochtermaatschappijen in het groepsdeel, andere groepsmaatschappijen in het groepsdeel en andere rechtspersonen in
      het groepsdeel waarop hij een overheersende zeggenschap kan uitoefenen of waarover hij de centrale leiding heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.3'
    text: 'Consolidatie mag achterwege blijven, indien:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
  - number: 7.3.a
    text: |-
      bij consolidatie wordt voldaan aan de vereisten, bedoeld in [artikel 4][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 7.3.b
    text: |-
      de financiële gegevens die de zorgaanbieder zou moeten consolideren zijn opgenomen in een geconsolideerde
      jaarrekening van een andere rechtspersoon of vennootschap welke jaarrekening voldoet aan het vijfde en zesde
      lid, dan wel, indien die rechtspersoon of vennootschap geen zorgaanbieder is, aan het vijfde en zesde lid of
      [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], mits die geconsolideerde jaarrekening openbaar is gemaakt op
      de in [artikel 13][ref2] voorgeschreven manier door de zorgaanbieder die de consolidatie achterwege laat, tenzij de
      openbaarmaking door een andere zorgaanbieder van de desbetreffende groep heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel13
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '13'
        hoofdstuk: '5'
  - number: '7.4'
    text: |-
      Indien een zorgaanbieder consolidatie achterwege laat op grond van het derde lid, onderdeel b, vermeldt hij in de
      toelichting van de eigen jaarrekening de toepassing van het derde lid, onderdeel b, en neemt een verwijzing op naar
      de geconsolideerde jaarrekening waarin de eigen gegevens zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
  - number: '7.5'
    text: |-
      Op de geconsolideerde jaarrekening, bedoeld in het eerste en tweede lid, is
      [afdeling 13 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1], uitgezonderd de [artikelen 406][ref2],
      [407, tweede en derde lid][ref3], [408][ref4] en [414, vierde en vijfde lid][ref5], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling13
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel406
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel407
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel408
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel414
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '13'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '406'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '407'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '408'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '414'
  - number: '7.6'
    text: |-
      De zorgaanbieder die een geconsolideerde jaarrekening opstelt, richt deze in overeenkomstig
      [artikel 2, eerste lid][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.6.a
    text: de benamingen mogen worden aangepast om het groepskarakter aan te geven;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
  - number: 7.6.b
    text: |-
      in de geconsolideerde balans het aandeel van derden in groepsmaatschappijen afzonderlijk als onderdeel van het
      groepsvermogen wordt opgenomen;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
  - number: 7.6.c
    text: |-
      indien in een geconsolideerde winst- en verliesrekening het aandeel van derden in het geconsolideerde resultaat na
      belastingen afzonderlijk wordt gegeven, dit geschiedt na het resultaat na belastingen.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 2][ref1], eerste lid, voegt aan de financiële verantwoording de volgende
      informatie toe:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.1.a
    text: |-
      een controleverklaring die voldoet aan [artikel 11][ref1], indien de zorgaanbieder niet voldoet aan het bepaalde in
      [artikel 4, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.1.b
    text: |-
      overige gegevens als omschreven in
      [artikel 392, eerste lid, onderdelen b tot en met f, van Boek 2 van het Burgerlijk Wetboek][ref1], waarbij artikel
      392, derde lid, van Boek 2 van het Burgerlijk Wetboek van overeenkomstige toepassing is, indien de zorgaanbieder
      niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.1.c
    text: |-
      een bestuursverslag, indien de zorgaanbieder niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.1.d
    text: |-
      een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref1], of [artikel 14 van de Wet ambulancezorgvoorzieningen][ref2]
      moet beschikken over een interne toezichthouder;


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel14
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043797
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '14'
  - number: 8.1.e
    text: |-
      afzonderlijke jaarlijkse verslagen en verklaringen, indien de zorgaanbieder voldoet aan het bepaalde bij of
      krachtens [artikel 391a, tweede en vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391a
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 391a
  - number: '8.2'
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 2, derde lid, onderdeel a][ref1], voegt aan de financiële verantwoording
      de volgende informatie toe:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.2.a
    text: |-
      een controleverklaring die voldoet aan [artikel 11][ref1], indien de zorgaanbieder niet voldoet aan het bepaalde in
      [artikel 4, eerste lid][ref2], waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’;


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.2.b
    text: |-
      een bestuursverslag, indien de zorgaanbieder niet voldoet aan het bepaalde in [artikel 4, eerste lid][ref1],
      waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’;


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel4
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.2.c
    text: |-
      een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref1] moet beschikken over een interne toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel3
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043797
        artikel: '3'
  - number: '8.3'
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 2, vierde lid][ref1], voegt aan de financiële verantwoording een verslag
      van de interne toezichthouder toe, indien hij op grond van [artikel 3 van de Wet toetreding zorgaanbieders][ref2]
      moet beschikken over een interne toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043797#Artikel3
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0043797
        artikel: '3'
  - number: '8.4'
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 2, vijfde lid][ref1], voegt aan de financiële verantwoording de volgende
      informatie toe:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.4.a
    text: |-
      een controleverklaring die voldoet aan de eisen van de [Subsidieregeling abortusklinieken][ref1], indien aan de
      zorgaanbieder ingevolge die subsidieregeling € 125.000 of meer subsidie is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0035433
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035433
  - number: 8.4.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
  - number: 8.4.c
    text: |-
      een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3 van de Wet toetreding zorgaanbieders][ref1] moet beschikken over een interne toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel3
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0043797
        artikel: '3'
  - number: '8.5'
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 2, zesde lid][ref1], voegt aan de financiële verantwoording toe:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 8.5.a
    text: |-
      de bij de jaarstukken, bedoeld in
      [artikel 24 van het Besluit begroting en verantwoording provincies en gemeenten][ref1], behorende
      accountantsverklaring die voldoet aan de krachtens de [Provinciewet][ref2], onderscheidenlijk de
      [Gemeentewet][ref3], gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0014606#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0005645
      [ref3]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
