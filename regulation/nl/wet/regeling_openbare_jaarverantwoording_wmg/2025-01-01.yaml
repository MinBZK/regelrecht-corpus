  - number: '15'
    text: |-
      1 In afwijking van deze regeling is de [Regeling jaarverslaggeving onderwijs][ref1] van overeenkomstige toepassing
      op de jaarverantwoording van een zorgaanbieder, indien:

      a. de zorgaanbieder tevens een bekostigde onderwijsinstelling is; en

      b. de netto-omzet van de zorgaanbieder gedurende twee opeenvolgende balansdata, zonder onderbreking nadien
      gedurende twee opeenvolgende balansdata, voor een groter aandeel bestaat uit onderwijs dan uit zorg.

      2 In afwijking van deze regeling is de [Regeling jaarverslaggeving onderwijs][ref2] van overeenkomstige toepassing
      op het eerste en tweede boekjaar van een zorgaanbieder waarvan op de balansdatum van het eerste boekjaar een groter
      aandeel van de netto-omzet bestaat uit onderwijs dan uit zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
      [ref2]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel15
