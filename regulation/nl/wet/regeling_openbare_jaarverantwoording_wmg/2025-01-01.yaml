  - number: '5'
    text: |-
      In het geval, bedoeld in [artikel 4, eerste lid][ref1], mogen de volgende bepalingen van
      [Boek 2 van het Burgerlijk Wetboek][ref2] overeenkomstig worden toegepast:

      a. op de balans en de toelichting hierop: [artikel 396, derde lid][ref3], met dien verstande dat de opgave, bedoeld
      in [artikel 373, vijfde lid, eerste volzin, van Boek 2 van het Burgerlijk Wetboek][ref4], niet van toepassing is;

      b. op de toelichtingen op de balans en de winst- en verliesrekening: [artikel 396, vijfde lid][ref5], met dien
      verstande dat in aanvulling op de tweede volzin van dat artikellid ook de [artikelen 380c][ref6], [380d][ref7] en
      [383b tot en met 383e, van Boek 2 van het Burgerlijk Wetboek][ref8] niet van toepassing zijn.


