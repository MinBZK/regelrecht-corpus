        artikel: 5a
  - number: '15.1'
    text: |-
      In afwijking van deze regeling is de [Regeling jaarverslaggeving onderwijs][ref1] van overeenkomstige toepassing op
      de jaarverantwoording van een zorgaanbieder, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: 15.1.a
    text: de zorgaanbieder tevens een bekostigde onderwijsinstelling is; en
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel15
  - number: 15.1.b
    text: |-
      de netto-omzet van de zorgaanbieder gedurende twee opeenvolgende balansdata, zonder onderbreking nadien gedurende
      twee opeenvolgende balansdata, voor een groter aandeel bestaat uit onderwijs dan uit zorg.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van deze regeling is de [Regeling jaarverslaggeving onderwijs][ref1] van overeenkomstige toepassing
      op het eerste en tweede boekjaar van een zorgaanbieder waarvan op de balansdatum van het eerste boekjaar een groter
      aandeel van de netto-omzet bestaat uit onderwijs dan uit zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023132
  - number: '16'
    text: |-
      In afwijking van het bepaalde in de [artikelen 1 tot en met 12][ref1] wordt de verantwoording over het boekjaar
      2021 opgesteld overeenkomstig de bepalingen van de [Regeling verslaggeving WTZi][ref2], zoals die regeling luidde
      op 31 december 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019252
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel16
    references:
