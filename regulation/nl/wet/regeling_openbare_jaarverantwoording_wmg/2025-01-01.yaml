    text: |-
      1 De zorgaanbieder vermeldt de andere informatie betreffende de bedrijfsvoering, bedoeld in
      [artikel 40b, tweede lid, onderdeel c, van de wet][ref1], overeenkomstig [bijlage 4][ref2] bij deze regeling.

      2 De zorgaanbieder die ingevolge [artikel 7][ref3] een geconsolideerde jaarrekening opstelt, mag de andere
      informatie betreffende de bedrijfsvoering, bedoeld in [artikel 40b, tweede lid, onderdeel c, van de wet][ref4]
      overeenkomstig [bijlage 4][ref5] bij deze regeling geconsolideerd vermelden.

      3 De zorgaanbieder die behoort tot een groep waarvoor overeenkomstig het tweede lid andere informatie betreffende
      de bedrijfsvoering als bedoeld in [artikel 40b, tweede lid, onderdeel c, van de wet][ref6] overeenkomstig
      [bijlage 4][ref7] bij deze regeling geconsolideerd is vermeld, hoeft niet te voldoen aan het eerste lid.


