  - number: 12a
    text: |-
      1 Een zorgaanbieder maakt vóór 1 juni van het kalenderjaar volgend op het boekjaar de jaarverantwoording openbaar.

      2 In afwijking van het eerste lid maakt een zorgaanbieder als bedoeld in [artikel 2, zesde lid][ref1], vóór
      15 juli van het kalenderjaar volgend op het boekjaar de jaarverantwoording openbaar.

      3 De zorgautoriteit kan op aanvraag van een zorgaanbieder tot 31 december van het kalenderjaar volgend op het
      boekjaar uitstel verlenen voor het tijdstip van openbaarmaking op grond van bijzondere omstandigheden.

      4 Een aanvraag tot uitstel wordt langs elektronische weg door de zorgaanbieder vóór 1 april van het kalenderjaar
      volgend op het boekjaar bij de zorgautoriteit ingediend via het door de zorgautoriteit daartoe beschikbaar gestelde
      formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: '13'
    text: |-
      1 De openbaarmaking geschiedt langs elektronische weg door deponering van de volledig in de Nederlandse taal en
      euro gestelde jaarverantwoording bij het CIBG via het platform DigiMV.

      2 Bij het deponeren van de financiële verantwoording en de daarbij te voegen stukken, mag de handtekening door de
      accountant, interne toezichthouder, eigenaar, bestuurder of vennoot achterwege blijven, onder vermelding van de
      voor- en achternaam van diegene waarvan de ondertekening bij deponering achterwege is gelaten.

      3 De vastgestelde jaarverantwoording wordt openbaar gemaakt met inachtneming van hetgeen omtrent de financiële
      toestand tussen 31 december van het boekjaar en de datum van vaststelling is gebleken.

      4 Indien blijkt dat de openbaar gemaakte jaarverantwoording in ernstige mate tekortschiet, dan meldt de
      zorgaanbieder dit onverwijld bij het CIBG via het elektronische platform DigiMV overeenkomstig [bijlage 5][ref1]
      bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045649
  - number: 13a
    text: |-
      1 In afwijking van de [artikelen 2, eerste en tweede lid][ref1], en [7 ][ref2]maakt een zorgaanbieder als bedoeld
      in artikel 2, eerste lid, onderdeel a, een beperkte balans, een bestuursverklaring en indien van toepassing
      de melding dat de jaarverantwoording in ernstige mate tekortschiet, openbaar en wordt het overige deel van de
      jaarverantwoording niet-openbaar gemaakt en aan het CIBG overgelegd.

      2 In afwijking van [artikel 2, derde en vierde lid][ref3], wordt een bestuursverklaring en indien van toepassing
      de melding dat de jaarverantwoording in ernstige mate tekortschiet, openbaar gemaakt en wordt het overige deel van
      de jaarverantwoording niet-openbaar gemaakt en aan het CIBG overgelegd, indien het een zorgaanbieder betreft als
      bedoeld in:

      a. [artikel 2, derde lid, onder a][ref4], die voldoet aan het bepaalde in
      [artikel 40b, vijfde lid, van de wet][ref5], waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’; en

      b. [artikel 2, vierde lid][ref6], die voldoet aan het bepaalde in [artikel 40b, vijfde lid, van de wet][ref7],
      waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’.


