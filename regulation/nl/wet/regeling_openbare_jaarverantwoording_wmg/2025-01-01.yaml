articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *boekjaar:* kalenderjaar waarop de jaarverantwoording betrekking heeft;
        - *dochtermaatschappij:* rechtspersoon of vennootschap als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *collectief verzekerde zorg:* zorg en overige diensten die behoren tot het op grond van de
      [Wet langdurige zorg][ref2] verzekerde pakket, bedoeld in [artikel 3.1.1 van die wet][ref3] of onderdeel uitmaken
      van de zorgplicht van de zorgverzekeraar, bedoeld in [artikel 11, eerste lid, van de Zorgverzekeringswet][ref4], of
      waarvoor de Minister subsidie verleent;
        - *eenmanszaak:* natuurlijke persoon die zorg doet verlenen, anders dan in het kader van een maatschap of
      vennootschap waarvan hij vennoot is;
        - *financiële verantwoording:* in [artikel 40b, tweede lid, onderdeel a, van de wet][ref5] voorgeschreven document
      dat per boekjaar openbaar wordt gemaakt;
        - *formeel buitenlandse vennootschap:* vennootschap als bedoeld in
      [artikel 1, eerste lid, van de Wet op de formeel buitenlandse vennootschappen][ref6] waarop het recht van een
      der lidstaten van de Europese Unie of van een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte van 2 mei 1992 niet van toepassing is;
        - *groep:* economische eenheid waarin rechtspersonen en vennootschappen organisatorisch zijn verbonden als bedoeld
      in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref7];
        - *groepsmaatschappij:* rechtspersoon of vennootschap die met een of meer andere rechtspersonen en vennootschappen
      is verbonden in een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref8];
        - *jaarverantwoording:* jaarverantwoording als bedoeld in [artikel 40b, tweede lid, van de wet][ref9];
        - *personenvennootschap:* maatschap als bedoeld in [artikel 1655 van Boek 7A van het Burgerlijk Wetboek][ref10],
      vennootschap onder firma als bedoeld in [artikel 16 van het Wetboek van Koophandel][ref11] of commanditaire
      vennootschap als bedoeld in [artikel 19 van het Wetboek van Koophandel][ref12];
        - *verslag van de interne toezichthouder:* verslag waarin de interne toezichthouder verantwoording aflegt over zijn
      handelen en de resultaten die dat handelen heeft opgeleverd;
        - *wet:* [Wet marktordening gezondheidszorg][ref13].


