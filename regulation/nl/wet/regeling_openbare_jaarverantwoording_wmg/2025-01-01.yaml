  - number: 3a
    text: |-
      1 In het geval, bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], mogen de volgende bepalingen van
      [Boek 2 van het Burgerlijk Wetboek][ref2] overeenkomstig worden toegepast:

      a. op de beperkte balans en de toelichting hierop: [artikel 395a, derde en vierde lid][ref3];

      b. op de beperkte winst- en verliesrekening en de toelichting hierop: [artikel 395a, vijfde lid][ref4];

      c. op de toelichting: [artikel 395a, zesde lid][ref5].

      2 Waardering van activa en passiva tegen marktwaarde is niet toegestaan.


