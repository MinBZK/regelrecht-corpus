  - number: '6'
    text: |-
      1 Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], opstelt en die op twee
      opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan minimaal
      twee van de in het tweede lid omschreven vereisten kan voor de jaarrekening de vrijstelling, bedoeld in het derde
      lid, toepassen op Model E in [bijlage 1][ref2].

      2 De vereisten, bedoeld in het eerste lid, zijn:

      a. de waarde van de activa volgens de balans met toelichting bedraagt, op grondslag van verkrijgings- en
      vervaardigingsprijs, niet meer dan € 25.000.000;

      b. de netto-omzet over het boekjaar bedraagt niet meer dan € 50.000.000;

      c. het gemiddeld aantal werknemers over het boekjaar bedraagt minder dan 250,

      waarbij [artikel 4, derde en vierde lid][ref3], van overeenkomstige toepassing is.

      3 Op de toelichting op de balans is [artikel 397, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref4] van
      overeenkomstige toepassing.


