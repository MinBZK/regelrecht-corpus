    text: |-
      1 De toelichting op de financiële verantwoording van een zorgaanbieder die financiële derivaten heeft aangetrokken,
      bevat, naast hetgeen overigens voortvloeit uit deze regeling:

      a. een weergave van het beleid ten aanzien van financiële derivaten en de uitvoering daarvan in het boekjaar; en

      b. per aangetrokken financieel derivaat een weergave van:

      1°. het type derivaat;

      2°. de ingangsdatum en de einddatum;

      3°. de nominale waarde en de balanswaarde aan het einde van het boekjaar; en

      4°. indien van toepassing, het gegeven dat bij een renteswap, de looptijd of de nominale waarde lager of hoger is
      dan die van de onderliggende lening of de groep van leningen, waaraan het derivaat kan worden toegerekend.

      2 Het eerste lid is niet van toepassing op een zorgaanbieder als bedoeld in:

      a. [artikel 2, eerste lid, onderdeel b][ref1];

      b. [artikel 2, derde lid, onderdeel a][ref2], die voldoet aan het bepaalde in [artikel 4, eerste lid][ref3],
      waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’;

      c. [artikel 2, derde lid, onderdelen b en c][ref4];

      d. [artikel 2, vierde lid][ref5];

      e. [artikel 2, zesde lid][ref6];

      f. [artikel 40b, vijfde lid, van de wet][ref7].


