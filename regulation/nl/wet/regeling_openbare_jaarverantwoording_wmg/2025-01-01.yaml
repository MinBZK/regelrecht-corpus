      - id: ref2
        bwb_id: BWBR0005645
      - id: ref3
        bwb_id: BWBR0005416
  - number: 8.5.b
    text: |-
      een jaarverslag dat voldoet aan de krachtens de [Provinciewet][ref1], onderscheidenlijk de [Gemeentewet][ref2],
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0005416
  - number: '9'
    text: |-
      In afwijking van [artikel 8][ref1] voegt de zorgaanbieder die een formeel buitenlandse vennootschap is de volgende
      informatie toe aan de financiële verantwoording:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel8
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '8'
        hoofdstuk: '3'
  - number: 9.a
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel9
  - number: 9.b
    text: |-
      een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3, eerste lid, van de Wet toetreding zorgaanbieders][ref1] moet beschikken over een interne
      toezichthouder; en


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel3
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0043797
        artikel: '3'
  - number: 9.c
    text: |-
      overige gegevens als bedoeld in [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] die de vennootschap ingevolge
      [artikel 5, tweede lid, van de Wet op de formeel buitenlandse vennootschappen][ref2] moet deponeren bij het
      handelsregister;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0009191#Artikel5
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0009191
        artikel: '5'
  - number: 9.d
    text: |-
      afzonderlijke jaarlijkse verslagen en verklaringen, indien de zorgaanbieder voldoet aan het bepaalde bij of
      krachtens [artikel 391a, tweede en vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel391a
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 391a
  - number: '10.1'
    text: |-
      Op het bestuursverslag, bedoeld in de [artikelen 8][ref1] en [9][ref2], is
      __REF002___________________________________________________________________________________________________________
      ____________ van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel391
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '391'
  - number: '10.2'
    text: |-
      De zorgaanbieder die ingevolge [artikel 7][ref1] een geconsolideerde jaarrekening opstelt, mag het bestuursverslag
      geconsolideerd toevoegen aan de geconsolideerde jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel7
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '7'
        hoofdstuk: '2'
  - number: '10.3'
    text: |-
      De zorgaanbieder die behoort tot een groep waarvoor overeenkomstig het tweede lid het bestuursverslag
      geconsolideerd is toegevoegd, hoeft niet het bestuursverslag, bedoeld in het tweede lid, onderdeel c, toe te voegen
      aan de eigen financiële verantwoording.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel10
  - number: '10.4'
    text: |-
      De aan de financiële verantwoording toe te voegen informatie mag niet onderling in strijd zijn of in strijd zijn
      met de financiële verantwoording.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel10
  - number: '11.1'
    text: |-
      De controleverklaring, bedoeld in [artikel 8, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1], bevat de
      uitslag van het onderzoek omtrent de getrouwheid van de financiële verantwoording, waarbij door de accountant die
      behoort tot één van de in [artikel 40b, derde lid, onderdeel b, van de wet][ref2] bedoelde categorieën, in ieder
      geval is onderzocht of:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '8'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 11.1.a
    text: |-
      de financiële verantwoording het inzicht geeft, bedoeld in
      [artikel 362, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel362
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '362'
  - number: 11.1.b
    text: de financiële verantwoording overeenkomstig deze regeling is opgesteld;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.1.c
    text: |-
      de in [artikel 8, eerste lid, respectievelijk tweede lid][ref1], vereiste informatie is toegevoegd aan de
      financiële verantwoording;


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel8
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '8'
        hoofdstuk: '3'
  - number: 11.1.d
    text: 'het bestuursverslag:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.1.d.1
    text: |-
      voldoet aan [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel10
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '10'
        hoofdstuk: '3'
  - number: 11.1.d.2
    text: verenigbaar is met de financiële verantwoording;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.1.d.3
    text: |-
      in het licht van de tijdens het onderzoek van de financiële verantwoording verkregen kennis en begrip omtrent de
      zorgaanbieder en zijn omgeving, materiële onjuistheden bevat.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: '11.2'
    text: 'De controleverklaring omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.a
    text: |-
      een vermelding op welke financiële verantwoording het onderzoek betrekking heeft en dat de voorschriften van de
      Regeling openbare jaarverantwoording WMG hierop van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.b
    text: |-
      een beschrijving van de reikwijdte van het onderzoek, waarin ten minste wordt vermeld welke richtlijnen voor de
      accountantscontrole in acht zijn genomen;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.c
    text: |-
      een oordeel of de financiële verantwoording het inzicht, bedoeld in
      [artikel 362, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], geeft en aan de vereisten bij en krachtens
      [artikel 40b van de wet][ref2] voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel362
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '362'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 11.2.d
    text: |-
      een verwijzing naar bepaalde zaken waarop de accountant in het bijzonder de aandacht vestigt, zonder een verklaring
      als bedoeld in het derde lid, onderdeel b, af te geven;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.e
    text: een vermelding van de gebleken tekortkomingen naar aanleiding van het onderzoek, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.f
    text: |-
      een oordeel over de verenigbaarheid van het bestuursverslag met de financiële verantwoording, als een
      bestuursverslag aan de financiële verantwoording moet worden toegevoegd;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.g
    text: |-
      een oordeel of er, in het licht van tijdens het onderzoek van de financiële verantwoording verkregen kennis en
      begrip omtrent de zorgaanbieder en zijn omgeving, materiële onjuistheden in het bestuursverslag zijn gebleken
      onder opgave van de aard van die onjuistheden, indien een bestuursverslag aan de financiële verantwoording wordt
      toegevoegd;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.h
    text: |-
      een verklaring betreffende materiële onzekerheden die verband houden met gebeurtenissen of omstandigheden die
      gerede twijfel kunnen doen rijzen of de zorgaanbieder zijn werkzaamheden voort kan zetten;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.i
    text: een vermelding van de vestigingsplaats van de accountantsorganisatie; en
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.2.j
    text: een ondertekening en een dagtekening door de accountant.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: '11.3'
    text: 'De controleverklaring heeft de vorm van:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.3.a
    text: een goedkeurende verklaring;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.3.b
    text: een verklaring met beperking;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.3.c
    text: een afkeurende verklaring; of
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: 11.3.d
    text: een verklaring van oordeelonthouding.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel11
  - number: '12.1'
    text: |-
      De zorgaanbieder vermeldt de andere informatie betreffende de bedrijfsvoering, bedoeld in
      [artikel 40b, tweede lid, onderdeel c, van de wet][ref1], overeenkomstig [bijlage 4][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0045649
  - number: '12.2'
    text: |-
      De zorgaanbieder die ingevolge [artikel 7][ref1] een geconsolideerde jaarrekening opstelt, mag de andere informatie
      betreffende de bedrijfsvoering, bedoeld in [artikel 40b, tweede lid, onderdeel c, van de wet][ref2] overeenkomstig
      [bijlage 4][ref3] bij deze regeling geconsolideerd vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
      [ref3]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
      - id: ref3
        bwb_id: BWBR0045649
  - number: '12.3'
    text: |-
      De zorgaanbieder die behoort tot een groep waarvoor overeenkomstig het tweede lid andere informatie betreffende
      de bedrijfsvoering als bedoeld in [artikel 40b, tweede lid, onderdeel c, van de wet][ref1] overeenkomstig
      [bijlage 4][ref2] bij deze regeling geconsolideerd is vermeld, hoeft niet te voldoen aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0045649
  - number: 12a.1
    text: Een zorgaanbieder maakt vóór 1 juni van het kalenderjaar volgend op het boekjaar de jaarverantwoording openbaar.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12a
  - number: 12a.2
    text: |-
      In afwijking van het eerste lid maakt een zorgaanbieder als bedoeld in [artikel 2, zesde lid][ref1], vóór 15 juli
      van het kalenderjaar volgend op het boekjaar de jaarverantwoording openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 12a.3
    text: |-
      De zorgautoriteit kan op aanvraag van een zorgaanbieder tot 31 december van het kalenderjaar volgend op het
      boekjaar uitstel verlenen voor het tijdstip van openbaarmaking op grond van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12a
  - number: 12a.4
    text: |-
      Een aanvraag tot uitstel wordt langs elektronische weg door de zorgaanbieder vóór 1 april van het kalenderjaar
      volgend op het boekjaar bij de zorgautoriteit ingediend via het door de zorgautoriteit daartoe beschikbaar gestelde
      formulier.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel12a
  - number: '13.1'
    text: |-
      De openbaarmaking geschiedt langs elektronische weg door deponering van de volledig in de Nederlandse taal en euro
      gestelde jaarverantwoording bij het CIBG via het platform DigiMV.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13
  - number: '13.2'
    text: |-
      Bij het deponeren van de financiële verantwoording en de daarbij te voegen stukken, mag de handtekening door de
      accountant, interne toezichthouder, eigenaar, bestuurder of vennoot achterwege blijven, onder vermelding van de
      voor- en achternaam van diegene waarvan de ondertekening bij deponering achterwege is gelaten.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13
  - number: '13.3'
    text: |-
      De vastgestelde jaarverantwoording wordt openbaar gemaakt met inachtneming van hetgeen omtrent de financiële
      toestand tussen 31 december van het boekjaar en de datum van vaststelling is gebleken.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien blijkt dat de openbaar gemaakte jaarverantwoording in ernstige mate tekortschiet, dan meldt de zorgaanbieder
      dit onverwijld bij het CIBG via het elektronische platform DigiMV overeenkomstig [bijlage 5][ref1] bij deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0045649
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0045649
  - number: 13a.1
    text: |-
      In afwijking van de [artikelen 2, eerste en tweede lid][ref1], en [7 ][ref2]maakt een zorgaanbieder als bedoeld
      in artikel 2, eerste lid, onderdeel a, een beperkte balans, een bestuursverklaring en indien van toepassing
      de melding dat de jaarverantwoording in ernstige mate tekortschiet, openbaar en wordt het overige deel van de
      jaarverantwoording niet-openbaar gemaakt en aan het CIBG overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel7
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: '7'
        hoofdstuk: '2'
  - number: 13a.2
    text: |-
      In afwijking van [artikel 2, derde en vierde lid][ref1], wordt een bestuursverklaring en indien van toepassing
      de melding dat de jaarverantwoording in ernstige mate tekortschiet, openbaar gemaakt en wordt het overige deel van
      de jaarverantwoording niet-openbaar gemaakt en aan het CIBG overgelegd, indien het een zorgaanbieder betreft als
      bedoeld in:


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
  - number: 13a.2.a
    text: |-
      [artikel 2, derde lid, onder a][ref1], die voldoet aan het bepaalde in
      [artikel 40b, vijfde lid, van de wet][ref2], waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’; en


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 13a.2.b
    text: |-
      [artikel 2, vierde lid][ref1], die voldoet aan het bepaalde in [artikel 40b, vijfde lid, van de wet][ref2],
      waarbij voor ‘netto-omzet’ wordt gelezen ‘som der bedrijfsbaten’.


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0020078
        artikel: 40b
  - number: 13b
    text: |-
      Een zorgaanbieder als bedoeld in [artikel 40b, vijfde lid, van de wet][ref1] overlegt het niet openbaar gemaakte
      deel van de jaarverantwoording, bedoeld in [artikel 13a][ref2], aan het CIBG, waarbij de [artikelen 12a][ref3] en
      [13][ref4], van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel40b
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel13a
      [ref3]: https://wetten.overheid.nl/BWBR0045649#Artikel12a
      [ref4]: https://wetten.overheid.nl/BWBR0045649#Artikel13
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: 40b
      - id: ref2
        bwb_id: BWBR0045649
        artikel: 13a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0045649
        artikel: 12a
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0045649
        artikel: '13'
        hoofdstuk: '5'
  - number: 13c
    text: |-
