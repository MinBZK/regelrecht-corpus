    text: |-
      1 Onverminderd [artikel 7][ref1], maakt de zorgaanbieder, anders dan bedoeld in het derde tot en met zesde lid,
      als financiële verantwoording een jaarrekening openbaar die is ingericht overeenkomstig [bijlage 1][ref2] bij deze
      regeling, met dien verstande dat:

      a. indien aan [artikel 40b, vijfde lid, van de wet][ref3], is voldaan: de Modellen A en B mogen worden gehanteerd
      en de vrijstellingen, bedoeld in [artikel 3a][ref4], mogen worden toegepast;

      b. indien aan [artikel 4][ref5] is voldaan: de Modellen C en D mogen worden gehanteerd en de vrijstellingen,
      bedoeld in [artikel 5][ref6], mogen worden toegepast; en

      c. indien aan [artikel 6, eerste en tweede lid][ref7], is voldaan: de vrijstelling, bedoeld in artikel 6, derde
      lid, mag worden toegepast op Model E.

      2 Op de jaarrekening, bedoeld in het eerste lid, zijn de
      [afdelingen 2 tot en met 6 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref8] van overeenkomstige toepassing,
      met uitzondering van de volgende artikelen:

      a. [361, tweede lid][ref9];

      b. [362, zesde en zevende lid][ref10];

      c. [363, eerste lid, tweede zin, en zesde lid][ref11];

      d. [373, vijfde lid][ref12];

      e. [377, vierde lid][ref13];

      f. [379, vierde en vijfde lid][ref14];

      g. [380, derde lid][ref15]; en

      h. [389, vierde en vijfde lid][ref16].

      3 Een zorgaanbieder maakt als financiële verantwoording een balans en een staat van baten en lasten met toelichting
      openbaar die is ingericht overeenkomstig [bijlage 2][ref17] bij deze regeling, indien hij is aan te merken als een:

      a. personenvennootschap, met uitzondering van een commanditaire vennootschap of een vennootschap onder firma
      waarvan alle vennoten die volledig jegens schuldeisers aansprakelijk zijn voor de schulden, kapitaalvennootschappen
      naar buitenlands recht zijn;

      b. onderdeel van de militair geneeskundige dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref18], dat collectief verzekerde zorg
      verleent; of

      c. rijksinstelling voor de verpleging van ter beschikking gestelden als bedoeld in
      [artikel 1.1., eerste lid, onderdeel j, van de Wet forensische zorg][ref19], die collectief verzekerde zorg
      verleent.

      4 Een zorgaanbieder die is aan te merken als eenmanszaak, maakt een financiële verantwoording openbaar die is
      ingericht overeenkomstig [bijlage 3][ref20].

      5 Een zorgaanbieder die ingevolge de [Subsidieregeling abortusklinieken][ref21] een jaarrekening indient, maakt als
      financiële verantwoording die jaarrekening openbaar.

      6 Een zorgaanbieder die ingevolge de [artikelen 190 van de Provinciewet][ref22] of [186 van de Gemeentewet][ref23]
      een jaarrekening opstelt, maakt als financiële verantwoording die jaarrekening openbaar.


