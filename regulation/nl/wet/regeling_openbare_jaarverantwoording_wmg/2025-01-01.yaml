  - number: '4'
    text: |-
      1 Een zorgaanbieder die een jaarrekening als bedoeld in [artikel 2, eerste lid][ref1], openbaar maakt en die op
      twee opeenvolgende balansdata, zonder onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan
      minimaal twee van de in het tweede lid omschreven vereisten kan zijn jaarrekening overeenkomstig [bijlage 1][ref2],
      Modellen C en D, inrichten en [artikel 5][ref3] toepassen.

      2 De vereisten, bedoeld in het eerste lid, zijn:

      a. de waarde van de activa volgens de balans met toelichting bedraagt, op de grondslag van verkrijgings- en
      vervaardigingsprijs, niet meer dan € 7.500.000;

      b. de netto-omzet over het boekjaar bedraagt niet meer dan € 15.000.000;

      c. het gemiddeld aantal werknemers over het boekjaar bedraagt minder dan 50.

      3 Voor de toepassing van het tweede lid worden meegeteld de waarde van de activa, de netto-omzet en het gemiddeld
      aantal werknemers van groepsmaatschappijen, die in de consolidatie zouden moeten worden betrokken als de
      zorgaanbieder een geconsolideerde jaarrekening zou moeten opstellen. Dit geldt niet, indien de zorgaanbieder
      [artikel 7, derde lid, onderdeel b][ref4], toepast.

      4 Voor het eerste en tweede boekjaar geldt het eerste lid eveneens voor een zorgaanbieder die op de balansdatum van
      het eerste boekjaar aan de desbetreffende vereisten heeft voldaan.


