  - number: '14.1'
    text: |-
      Indien een zorgaanbieder in het boekjaar partij was bij een rechtshandeling die ertoe leidde dat één of meer
      zorgaanbieders ophielden zorgaanbieder te zijn, betrekt hij in zijn jaarverantwoording over het boekjaar tevens de
      gegevens en andere informatie van die één of meer gewezen zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel14
  - number: '14.2'
    text: |-
      Een zorgaanbieder geeft in het geval van waarderingsverschillen van activa en passiva in vergelijking met de
      laatste financiële verantwoording van de betrokken gewezen zorgaanbieder, een toelichting op die verschillen in de
      financiële verantwoording over het boekjaar.
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel14
  - number: '14.3'
    text: 'Het eerste en tweede lid gelden niet voor gegevens en andere informatie die:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel14
  - number: 14.3.a
    text: |-
      zijn betrokken in de jaarverantwoording over het boekjaar van een andere zorgaanbieder die op de in
      [artikel 13][ref1] voorgeschreven wijze openbaar is gemaakt of op de in [artikel 13b][ref2] voorgeschreven wijze
      is overlegd; of


      [ref1]: https://wetten.overheid.nl/BWBR0045649#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0045649#Artikel13b
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0045649
        artikel: '13'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0045649
        artikel: 13b
        hoofdstuk: 5a
  - number: 14.3.b
    text: |-
      betrekking hebben op een zorgaanbieder als bedoeld in
      [artikel 5a van het Besluit uitbreiding en beperking werkingssfeer WMG][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020326#Artikel5a
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel14
    references:
      - id: ref1
