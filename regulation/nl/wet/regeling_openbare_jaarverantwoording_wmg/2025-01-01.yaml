    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
  - number: 3.1.b
    text: 'per aangetrokken financieel derivaat een weergave van:'
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
  - number: 3.1.b.1°
    text: het type derivaat;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
  - number: 3.1.b.2°
    text: de ingangsdatum en de einddatum;
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
  - number: 3.1.b.3°
    text: de nominale waarde en de balanswaarde aan het einde van het boekjaar; en
    url: https://wetten.overheid.nl/BWBR0045649/2025-01-01#Artikel3
  - number: 3.1.b.4°
