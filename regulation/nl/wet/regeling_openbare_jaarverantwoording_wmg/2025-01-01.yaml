    text: |-
      In afwijking van [artikel 8][ref1] voegt de zorgaanbieder die een formeel buitenlandse vennootschap is de volgende
      informatie toe aan de financiële verantwoording:

      a. een bestuursverslag;

      b. een verslag van de interne toezichthouder, indien de zorgaanbieder op grond van
      [artikel 3, eerste lid, van de Wet toetreding zorgaanbieders][ref2] moet beschikken over een interne
      toezichthouder; en

      c. overige gegevens als bedoeld in [titel 9 van Boek 2 van het Burgerlijk Wetboek][ref3] die de vennootschap
      ingevolge [artikel 5, tweede lid, van de Wet op de formeel buitenlandse vennootschappen][ref4] moet deponeren bij
      het handelsregister;

      d. afzonderlijke jaarlijkse verslagen en verklaringen, indien de zorgaanbieder voldoet aan het bepaalde bij of
      krachtens [artikel 391a, tweede en vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref5].


