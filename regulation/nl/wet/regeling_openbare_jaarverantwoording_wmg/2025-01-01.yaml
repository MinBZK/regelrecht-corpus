  - number: '11'
    text: |-
      1 De controleverklaring, bedoeld in [artikel 8, eerste lid, onderdeel a, en tweede lid, onderdeel a][ref1], bevat
      de uitslag van het onderzoek omtrent de getrouwheid van de financiële verantwoording, waarbij door de accountant
      die behoort tot één van de in [artikel 40b, derde lid, onderdeel b, van de wet][ref2] bedoelde categorieën, in
      ieder geval is onderzocht of:

      a. de financiële verantwoording het inzicht geeft, bedoeld in
      [artikel 362, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3];

      b. de financiële verantwoording overeenkomstig deze regeling is opgesteld;

      c. de in [artikel 8, eerste lid, respectievelijk tweede lid][ref4], vereiste informatie is toegevoegd aan de
      financiële verantwoording;

      d. het bestuursverslag:

      1° voldoet aan [artikel 10][ref5];

      2° verenigbaar is met de financiële verantwoording;

      3° in het licht van de tijdens het onderzoek van de financiële verantwoording verkregen kennis en begrip omtrent de
      zorgaanbieder en zijn omgeving, materiële onjuistheden bevat.

      2 De controleverklaring omvat ten minste:

      a. een vermelding op welke financiële verantwoording het onderzoek betrekking heeft en dat de voorschriften van de
      Regeling openbare jaarverantwoording WMG hierop van toepassing zijn;

      b. een beschrijving van de reikwijdte van het onderzoek, waarin ten minste wordt vermeld welke richtlijnen voor de
      accountantscontrole in acht zijn genomen;

      c. een oordeel of de financiële verantwoording het inzicht, bedoeld in
      [artikel 362, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref6], geeft en aan de vereisten bij en krachtens
      [artikel 40b van de wet][ref7] voldoet;

      d. een verwijzing naar bepaalde zaken waarop de accountant in het bijzonder de aandacht vestigt, zonder een
      verklaring als bedoeld in het derde lid, onderdeel b, af te geven;

      e. een vermelding van de gebleken tekortkomingen naar aanleiding van het onderzoek, bedoeld in het eerste lid;

      f. een oordeel over de verenigbaarheid van het bestuursverslag met de financiële verantwoording, als een
      bestuursverslag aan de financiële verantwoording moet worden toegevoegd;

      g. een oordeel of er, in het licht van tijdens het onderzoek van de financiële verantwoording verkregen kennis
      en begrip omtrent de zorgaanbieder en zijn omgeving, materiële onjuistheden in het bestuursverslag zijn gebleken
      onder opgave van de aard van die onjuistheden, indien een bestuursverslag aan de financiële verantwoording wordt
      toegevoegd;

      h. een verklaring betreffende materiële onzekerheden die verband houden met gebeurtenissen of omstandigheden die
      gerede twijfel kunnen doen rijzen of de zorgaanbieder zijn werkzaamheden voort kan zetten;

      i. een vermelding van de vestigingsplaats van de accountantsorganisatie; en

      j. een ondertekening en een dagtekening door de accountant.

      3 De controleverklaring heeft de vorm van:

      a. een goedkeurende verklaring;

      b. een verklaring met beperking;

      c. een afkeurende verklaring; of

      d. een verklaring van oordeelonthouding.


