  - number: 13c
    text: |-
      Het niet openbaar gemaakte deel van de jaarverantwoording van een zorgaanbieder als bedoeld in
      [artikel 40b, vijfde lid, van de wet][ref1], bedoeld in [artikel 13a][ref2], wordt door het CIBG verstrekt aan:

      a. het Centraal Bureau voor de Statistiek, bedoeld in
      [artikel 1, onderdeel b, van de Wet op het Centraal bureau voor de statistiek][ref3];

      b. het CIZ, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref4];

      c. het college van burgemeester en wethouders, bedoeld in [artikel 5, onderdeel c, van de Gemeentewet][ref5];

      d. het informatieknooppunt zorgfraude, bedoeld in
      [artikel 1.1 van de Wet bevorderen samenwerking en rechtmatige zorg][ref6];

      e. de Minister van Justitie en Veiligheid;

      f. de Minister van Onderwijs, Cultuur en Wetenschap;

      g. de bijzondere opsporingsdienst, bedoeld in
      [artikel 2, onderdeel d, van de Wet op de bijzondere opsporingsdiensten][ref7];

      h. de Minister van Volksgezondheid, Welzijn en Sport;

      i. de Inspectie gezondheidszorg en jeugd;

      j. het Rijksinstituut voor volksgezondheid en milieu;

      k. de FIOD-ECD;

      l. een ziektekostenverzekeraar;

      m. de zorgautoriteit.


