        artikel: '8'
        paragraaf: III
      - id: ref6
        bwb_id: BWBR0004318
        artikel: '9'
        paragraaf: IV
  - number: '11.2'
    text: De feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel11
  - number: '12'
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met dien verstande dat
      telkens wordt gelezen voor:
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel12
  - number: 12.a
    text: 'gemeenteraad: eilandraad;'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel12
  - number: 12.b
    text: 'burgemeester: gezaghebber.'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel12
  - number: IV
    text: |-
      De Wet van 10 september 1853, *Stb.* 102, tot regeling van het toezigt op de onderscheidene kerkgenootschappen
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelIV
  - number: V
    text: |-
      De Wet van 22 april 1855, *Stb.* 32, tot regeling en beperking der uitoefening van het regt van vereeniging en
      vergadering wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelV
  - number: VI
    text: |-
      Tot de inwerkingtreding van de door de gemeenteraad vast te stellen regels bedoeld in de [artikelen 3][ref1]
      en [4 van artikel I][ref2] van deze wet, doch uiterlijk tot drie maanden na de inwerkingtreding van deze wet,
      gelden met betrekking tot de voorafgaande kennisgeving van samenkomsten tot het belijden van godsdienst of
      levensovertuiging, vergaderingen en betogingen, de volgende bepalingen:


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004318#Artikel4
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '3'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004318
        artikel: '4'
        paragraaf: II
  - number: VI.a
    text: |-
      Degene die het voornemen heeft op een openbare plaats een samenkomst tot het belijden van godsdienst of
      levensovertuiging, een vergadering of een betoging te houden, geeft daarvan ten minste 48 uur voor de aanvang
      schriftelijk kennis aan de burgemeester.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.b
    text: |-
      Voor op vooraf bepaalbare tijdstippen regelmatig terugkerende samenkomsten als bedoeld in onderdeel *a*, uitgaande
      van een kerkgenootschap, een zelfstandig onderdeel daarvan of een genootschap op geestelijke grondslag, is een
      eenmalige kennisgeving voldoende.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.c
    text: |-
      De burgemeester kan in bijzondere omstandigheden de termijn van 48 uur verkorten en een mondelinge kennisgeving
      voldoende verklaren.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d
    text: 'Bij de kennisgeving kan de burgemeester een opgave verlangen van:'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.1°
    text: naam en adres van degene die de samenkomst, vergadering of betoging houdt;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.2°
    text: het doel van de samenkomst, vergadering of betoging;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.3°
    text: |-
      de datum waarop de samenkomst, vergadering of betoging wordt gehouden en het tijdstip van aanvang en van
      beëindiging;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.4°
    text: de plaats en, voor zover van toepassing, de route en de plaats van beëindiging;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.5°
    text: de wijze van samenstelling;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.d.6°
    text: |-
      maatregelen die degene die de samenkomst, vergadering of betoging houdt zal treffen om een regelmatig verloop te
      bevorderen.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VI.e
    text: Degene die de kennisgeving doet ontvangt daarvan een bewijs waarin het tijdstip van de kennisgeving is vermeld.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVI
  - number: VII
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVII
  - number: VIII
    text: 'Deze wet kan worden aangehaald als: Wet openbare manifestaties.'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelVIII
