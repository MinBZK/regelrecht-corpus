---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_openbare_manifestaties
regulatory_layer: WET
publication_date: '2010-09-01'
valid_from: '2010-10-10'
bwb_id: BWBR0004318
url: https://wetten.overheid.nl/BWBR0004318/2010-10-10
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gelet op de artikelen 6 en 9 en de additionele artikelen III en V
    van de Grondwet nodig is, wettelijke bepalingen vast te stellen betreffende de uitoefening van het recht tot vrije
    belijdenis van godsdienst en levensovertuiging en betreffende de uitoefening van het recht tot vergadering en
    betoging, alsmede een aantal wetten te wijzigen, onderscheidenlijk in te trekken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet wordt verstaan onder openbare plaats: plaats die krachtens bestemming of vast gebruik openstaat voor
      het publiek.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Onder openbare plaats wordt niet begrepen een gebouw of besloten plaats als bedoeld in
      [artikel 6, tweede lid, van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel6
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '6'
  - number: '2'
    text: |-
      De bij of krachtens de bepalingen uit deze paragraaf aan overheidsorganen gegeven bevoegdheden tot beperking van
      het recht tot het belijden van godsdienst of levensovertuiging en het recht tot vergadering en betoging, kunnen
      slechts worden aangewend ter bescherming van de gezondheid, in het belang van het verkeer en ter bestrijding of
      voorkoming van wanordelijkheden.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De gemeenteraad stelt bij verordening regels vast met betrekking tot de gevallen waarin voor samenkomsten tot het
      belijden van godsdienst of levensovertuiging op openbare plaatsen een voorafgaande kennisgeving vereist is.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Voor op vooraf bepaalbare tijdstippen regelmatig terugkerende samenkomsten als bedoeld in het eerste lid, uitgaande
      van een kerkgenootschap, een zelfstandig onderdeel daarvan of een genootschap op geestelijke grondslag, is een
      eenmalige kennisgeving voldoende.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: '3.3'
    text: 'De verordening voorziet ten minste in:'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: 3.3.a
    text: |-
      regels betreffende de gevallen waarin een schriftelijke kennisgeving wordt vereist van degene die voornemens is een
      samenkomst te houden;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: 3.3.b
    text: |-
      regels betreffende het tijdstip waarop de kennisgeving moet zijn gedaan, de bij de kennisgeving te verstrekken
      gegevens, en het verstrekken van een bewijs van ontvangst aan degene die de kennisgeving doet.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: '3.4'
    text: Over de inhoud van hetgeen wordt beleden worden geen gegevens verlangd.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De gemeenteraad stelt bij verordening regels vast met betrekking tot de gevallen waarin voor vergaderingen en
      betogingen op openbare plaatsen een voorafgaande kennisgeving vereist is.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel4
  - number: '4.2'
    text: 'De verordening voorziet ten minste in:'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel4
  - number: 4.2.a
    text: |-
      regels betreffende de gevallen waarin een schriftelijke kennisgeving wordt vereist van degene die voornemens is een
      vergadering of betoging te houden;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel4
  - number: 4.2.b
    text: |-
      regels betreffende het tijdstip waarop de kennisgeving moet zijn gedaan, de bij de kennisgeving te verstrekken
      gegevens, en het verstrekken van een bewijs van ontvangst aan degene die de kennisgeving doet.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel4
  - number: '4.3'
    text: Over de inhoud van de te openbaren gedachten of gevoelens worden geen gegevens verlangd.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel4
  - number: '5.1'
    text: De burgemeester kan naar aanleiding van een kennisgeving voorschriften en beperkingen stellen of een verbod geven.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: '5.2'
    text: 'Een verbod kan slechts worden gegeven indien:'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: 5.2.a
    text: de vereiste kennisgeving niet tijdig is gedaan;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: 5.2.b
    text: de vereiste gegevens niet tijdig zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: 5.2.c
    text: |-
      een van de in [artikel 2 ][ref1]genoemde belangen dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel2
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '2'
        paragraaf: II
  - number: '5.3'
    text: |-
      Een voorschrift, beperking of verbod kan geen betrekking hebben op de inhoud van hetgeen wordt beleden,
      onderscheidenlijk van de te openbaren gedachten of gevoelens.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      Beschikkingen als bedoeld in het eerste lid worden zo spoedig mogelijk bekendgemaakt aan degene die de kennisgeving
      heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel5
  - number: '6'
    text: |-
      De burgemeester kan tijdens een samenkomst tot het belijden van godsdienst of levensovertuiging, vergadering of
      betoging aanwijzingen geven, die degenen die deze houden of daaraan deelnemen in acht moeten nemen.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De burgemeester kan aan degenen die een samenkomst tot het belijden van godsdienst of levensovertuiging,
      vergadering of betoging houden of daaraan deelnemen opdracht geven deze terstond te beëindigen en uiteen te gaan,
      indien:
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel7
  - number: 7.a
    text: de vereiste kennisgeving niet is gedaan, of een verbod is gegeven;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel7
  - number: 7.b
    text: in strijd wordt gehandeld met een voorschrift, beperking of aanwijzing;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel7
  - number: 7.c
    text: |-
      een van de in [artikel 2][ref1] genoemde belangen dat vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel2
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '2'
        paragraaf: II
  - number: '8.1'
    text: |-
      De burgemeester kan aan degenen die een voor publiek toegankelijke vergadering of betoging op een andere dan
      openbare plaats houden of daaraan deelnemen opdracht geven deze terstond te beëindigen en uiteen te gaan, indien de
      bescherming van de gezondheid of de bestrijding of voorkoming van wanordelijkheden dat vordert.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De burgemeester en door hem aan te wijzen personen hebben toegang tot de in het eerste lid bedoelde vergaderingen
      en betogingen. Zonodig verschaffen zij zich de toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Degenen die in de nabijheid van een gebouw in gebruik bij het Internationaal Gerechtshof, een diplomatieke
      vertegenwoordiging of een consulaire vertegenwoordiging een samenkomst tot het belijden van godsdienst of
      levensovertuiging, vergadering of betoging houden of daaraan deelnemen, onthouden zich van gedragingen die het
      functioneren van de desbetreffende instelling aantasten.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Ter bestrijding van gedragingen als bedoeld in het eerste lid kan de burgemeester tijdens een samenkomst tot het
      belijden van godsdienst of levensovertuiging, vergadering of betoging aanwijzingen geven, die degenen die deze
      houden of daaraan deelnemen in acht moeten nemen.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      Indien in strijd wordt gehandeld met een aanwijzing als bedoeld in het tweede lid en de omstandigheden het
      vorderen, kan de burgemeester aan degenen die een samenkomst tot het belijden van godsdienst of levensovertuiging,
      vergadering of betoging houden of daaraan deelnemen opdracht geven deze terstond te beëindigen en uiteen te gaan.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      Het bepaalde in het eerste tot en met derde lid is van overeenkomstige toepassing ten aanzien van gebouwen in
      gebruik bij volkenrechtelijke organisaties, voor zover Nederland een overeenkomstige verplichting tot bescherming
      op zich heeft genomen als ten opzichte van de in het eerste lid genoemde instellingen.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel9
  - number: '9.5'
    text: |-
      De in het vierde lid bedoelde gebouwen worden door Onze Ministers van Binnenlandse Zaken en van Buitenlandse Zaken
      in de *Nederlandse Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Klokgelui ter gelegenheid van godsdienstige en levensbeschouwelijke plechtigheden en lijkplechtigheden, alsmede
      oproepen tot het belijden van godsdienst of levensovertuiging, zijn toegestaan. De gemeenteraad is bevoegd ter zake
      regels te stellen met betrekking tot duur en geluidsniveau.
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel10
  - number: '11.1'
    text: 'Met hechtenis van ten hoogste twee maanden of geldboete van de tweede categorie wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel11
  - number: 11.1.a
    text: |-
      het houden van of deelnemen aan een samenkomst tot het belijden van godsdienst of levensovertuiging, vergadering of
      betoging waarvoor de vereiste kennisgeving niet is gedaan of waarvoor een verbod is gegeven;
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel11
  - number: 11.1.b
    text: |-
      handelen in strijd met een voorschrift of beperking als bedoeld in [artikel 5, eerste lid][ref1], met een
      aanwijzing als bedoeld in [artikel 6][ref2] en [artikel 9, tweede lid][ref3], of met een opdracht als bedoeld in
      [artikel 7][ref4], [artikel 8, eerste lid][ref5], en [artikel 9, derde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004318#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004318#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0004318#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0004318#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0004318#Artikel9
    url: https://wetten.overheid.nl/BWBR0004318/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '5'
        paragraaf: II
      - id: ref2
        bwb_id: BWBR0004318
        artikel: '6'
        paragraaf: II
      - id: ref3
        bwb_id: BWBR0004318
        artikel: '9'
