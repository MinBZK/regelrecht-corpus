---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: bekendmakingswet
regulatory_layer: WET
publication_date: '2023-10-27'
valid_from: '1995-05-17'
bwb_id: BWBR0004287
url: https://wetten.overheid.nl/BWBR0004287/1995-05-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge de artikelen 88 en 89 van de Grondwet de wet de bekendmaking
    en de inwerkingtreding van wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of
    algemene maatregel van bestuur vastgestelde algemeen verbindende voorschriften dient te regelen, en dat het in
    verband daarmee tevens gewenst is enkele andere voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Vanwege de regering wordt voorzien in de uitgifte van het *Staatsblad* van het Koninkrijk der Nederlanden en in de
      uitgifte van de *Nederlandse Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel1
  - number: '2.1'
    text: De zorg voor de uitgifte van het *Staatsblad* berust bij Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel2
  - number: '2.2'
    text: De zorg voor de uitgifte van de *Staatscourant* berust bij Onze Minister van Binnenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel2
  - number: '3'
    text: 'De bekendmaking van:'
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel3
  - number: 3.a
    text: wetten,
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel3
  - number: 3.b
    text: algemene maatregelen van bestuur en
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel3
  - number: 3.c
    text: andere koninklijke besluiten waarbij algemeen verbindende voorschriften worden vastgesteld,
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel3
  - number: '4.1'
    text: 'De bekendmaking van:'
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel4
  - number: 4.1.a
    text: bij ministeriële regeling vastgestelde algemeen verbindende voorschriften en
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel4
  - number: 4.1.b
    text: |-
      de overige vanwege het Rijk vastgestelde algemeen verbindende voorschriften, voor zover deze niet in het
      *Staatsblad* geplaatst dienen te worden,
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel4
  - number: '4.2'
    text: |-
      Een voorschrift als in het eerste lid bedoeld, kan bepalen dat bekendmaking geheel of gedeeltelijk geschiedt
      door plaatsing in een bijlage bij de *Staatscourant*. Van zodanige bekendmaking wordt mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van [artikel 4][ref1] kan een voorschrift als daar bedoeld, bepalen:


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
  - number: 5.1.a
    text: |-
      dat het wordt bekendgemaakt door plaatsing in een ander vanwege de overheid algemeen verkrijgbaar gesteld
      publikatieblad, en
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel5
  - number: 5.1.b
    text: dat een bij het voorschrift behorende bijlage wordt bekendgemaakt door terinzagelegging.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel5
  - number: '5.2'
    text: Van een bekendmaking als in het eerste lid bedoeld, wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel5
  - number: '6'
    text: |-
      Een besluit tot vaststelling van het tijdstip waarop een wet, een algemene maatregel van bestuur of een vanwege het
      Rijk anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift in werking
      treedt, wordt bekendgemaakt op dezelfde wijze als waarop die regeling zelf is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel6
  - number: '7'
    text: |-
      Wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur
      vastgestelde algemeen verbindende voorschriften treden, indien een aanduiding daaromtrent ontbreekt, in werking met
      ingang van de eerste dag van de tweede kalendermaand na de datum van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel7
  - number: 7a.1
    text: |-
      Indien bij of krachtens de wet is bepaald dat na de bekendmaking van een algemene maatregel van bestuur of een
      vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift
      een bepaalde periode dient te verstrijken alvorens de regeling in werking kan treden, kan in afwijking daarvan een
      eerder tijdstip van inwerkingtreding worden vastgesteld, indien de regeling uitsluitend strekt tot uitvoering van
      een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de
      Commissie van de Europese Gemeenschappen.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel7a
  - number: 7a.2
    text: |-
      [Artikel 1:8, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de plaatsing van wetten en
      besluiten in het *Staatsblad* en de *Staatscourant*, met betrekking tot de verdere inhoud van de *Staatscourant*
      en met betrekking tot de bewaring van oorspronkelijke exemplaren van wetten, koninklijke besluiten en daarbij
      behorende stukken.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel8
  - number: '9.1'
    text: |-
      Het souverein besluit van 18 december 1813 (*Stb.* 1814, 1), betrekkelijk de daarstelling van een *Staatsblad
      der Vereenigde Nederlanden*, het souverein besluit van 18 december 1813 (Bijvoegsel tot het *Staatsblad van het
      Koningrijk der Nederlanden* 1813-1814, bladzijde 29), houdende, dat er van gouvernementswege een *Nederlandsche-
      Staats-Courant* zal worden uitgegeven, de Wet van 26 april 1852 (*Stb.* 92), houdende regeling der afkondiging van
      algemeene maatregelen van inwendig bestuur van de Staat, en het koninklijk besluit van 22 december 1863 (*Stb.*
      149), ter nadere regeling van de wijze en de vorm van afkondiging van wetten en Koninklijke besluiten, worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel9
  - number: '9.2'
    text: |-
      De artikelen 1 en 2 van de Wet van 15 mei 1829 (Stb. 28), houdende algemeene bepalingen der wetgeving van het
      Koningrijk, vervallen.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel9
  - number: '10.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel10
  - number: '10.2'
    text: |-
      Op datzelfde tijdstip eindigt de termijn, bedoeld in additioneel artikel XX van de [Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '11'
    text: 'Deze wet kan worden aangehaald als: Bekendmakingswet.'
    url: https://wetten.overheid.nl/BWBR0004287/1995-05-17#Artikel11
