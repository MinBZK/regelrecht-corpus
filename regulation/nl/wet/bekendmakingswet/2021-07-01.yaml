---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: bekendmakingswet
regulatory_layer: WET
publication_date: '2023-10-27'
valid_from: '2021-07-01'
bwb_id: BWBR0004287
url: https://wetten.overheid.nl/BWBR0004287/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge de artikelen 88 en 89 van de Grondwet de wet de bekendmaking
    en de inwerkingtreding van wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of
    algemene maatregel van bestuur vastgestelde algemeen verbindende voorschriften dient te regelen, en dat het in
    verband daarmee tevens gewenst is enkele andere voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: De regering geeft het Staatsblad en de Staatscourant uit.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel1
  - number: '1.2'
    text: De uitgifte van het Staatsblad en de Staatscourant geschiedt elektronisch op een algemeen toegankelijke wijze.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel1
  - number: '1.3'
    text: De zorg voor de uitgifte van het Staatsblad berust bij Onze Minister van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel1
  - number: '1.4'
    text: |-
      De zorg voor de uitgifte van de Staatscourant berust bij Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel1
  - number: '2.1'
    text: Gedeputeerde staten van de provincie geven een provinciaal blad uit.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.2'
    text: Het college van burgemeester en wethouders van de gemeente geeft een gemeenteblad uit.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.3'
    text: Het dagelijks bestuur van het waterschap geeft een waterschapsblad uit.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het bestuurscollege van het openbaar lichaam, bedoeld in
      [artikel 1, onderdeel a, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1], geeft een
      afkondigingsblad uit.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel1
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '1'
  - number: '2.5'
    text: |-
      Het dagelijks bestuur van het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie en het
      gemeenschappelijk orgaan, bedoeld in de [Wet gemeenschappelijke regelingen][ref1], geven een publicatieblad uit.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '2.6'
    text: |-
      De zorg voor de uitgifte van de in het eerste tot en met vijfde lid genoemde publicatiebladen berust bij
      onderscheidenlijk gedeputeerde staten, het college van burgemeester en wethouders, het dagelijks bestuur van het
      waterschap, het bestuurscollege van het openbaar lichaam, bedoeld in het vierde lid, en het dagelijks bestuur van
      het openbaar lichaam, het bestuur van de bedrijfsvoeringsorganisatie of het gemeenschappelijk orgaan, bedoeld in
      het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.7'
    text: |-
      Een bestuursorgaan dat behoort tot een van de in het eerste tot en met vijfde lid genoemde openbare lichamen
      dan wel tot een bedrijfsvoeringsorganisatie als bedoeld in het vijfde lid, dan wel een gemeenschappelijk orgaan
      als bedoeld in het vijfde lid, maakt slechts gebruik van het publicatieblad van het openbaar lichaam waartoe het
      behoort, tenzij bij of krachtens de wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.8'
    text: |-
      De uitgifte van de in het eerste, tweede, derde en vijfde lid genoemde publicatiebladen geschiedt elektronisch
      op een algemeen toegankelijke wijze door middel van een door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties in stand gehouden digitale infrastructuur.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '2.9'
    text: Het afkondigingsblad, bedoeld in het vierde lid, kan elektronisch worden uitgegeven.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel2
  - number: '3.1'
    text: |-
      De in [artikelen 1][ref1] en [2][ref2] genoemde publicatiebladen die elektronisch worden uitgegeven, blijven na de
      uitgifte elektronisch op een algemeen toegankelijke wijze beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '3.2'
    text: Voor de toegang tot deze publicatiebladen worden geen kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel3
  - number: '4'
    text: |-
      De bekendmaking van wetten, algemene maatregelen van bestuur en andere koninklijke besluiten waarbij algemeen
      verbindende voorschriften worden vastgesteld, geschiedt door plaatsing in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel4
  - number: '5'
    text: 'De bekendmaking van de volgende besluiten geschiedt door plaatsing in de Staatscourant:'
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: 5.a
    text: bij ministeriële regeling vastgestelde algemeen verbindende voorschriften;
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: 5.b
    text: |-
      de overige vanwege het Rijk vastgestelde algemeen verbindende voorschriften, voor zover deze niet in het Staatsblad
      geplaatst dienen te worden;
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: 5.c
    text: |-
      algemeen verbindende voorschriften, vastgesteld door bestuursorganen van andere openbare lichamen dan genoemd in
      [artikel 2, eerste tot en met vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: 5.d
    text: algemeen verbindende voorschriften, vastgesteld door bestuursorganen die niet behoren tot een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: 5.e
    text: beleidsregels, vastgesteld vanwege het Rijk of door de in de onderdelen c en d bedoelde bestuursorganen; en
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: 5.f
    text: |-
      overige besluiten, vastgesteld vanwege het Rijk of door de in onderdeel c of d bedoelde bestuursorganen, die niet
      tot een of meer belanghebbenden zijn gericht.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel5
  - number: '6'
    text: |-
      Algemeen verbindende voorschriften, beleidsregels en andere besluiten die niet tot een of meer
      belanghebbenden zijn gericht, vastgesteld door een bestuursorgaan dat behoort tot een van de in
      [artikel 2, eerste tot en met vierde lid][ref1], genoemde openbare lichamen, of de in artikel 2, vijfde lid,
      genoemde openbare lichamen, bedrijfsvoeringsorganisaties en gemeenschappelijke organen, worden bekendgemaakt
      door plaatsing in het door dat openbaar lichaam, die bedrijfsvoeringsorganisatie of dat gemeenschappelijke orgaan
      uitgegeven publicatieblad.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '7.1'
    text: |-
      Een wet, een algemene maatregel van bestuur of een ander in [artikel 4][ref1], [5][ref2] of [6][ref3], genoemd
      besluit bestaat uit een tekst en kan tevens informatie bevatten die niet uit tekst bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel6
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '6'
  - number: '7.2'
    text: |-
      In afwijking van [artikel 4][ref1], [artikel 5][ref2] of [artikel 6][ref3], kan een wet, een algemene maatregel van
      bestuur of een ander in die artikelen genoemd besluit na voorafgaande instemming van Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties bepalen dat een bij die wet, die algemene maatregel van bestuur of dat besluit
      behorende bijlage wegens aard of omvang wordt bekendgemaakt door middel van een in die wet, die algemene maatregel
      van bestuur of dat besluit aangewezen ander algemeen toegankelijk elektronisch medium dan het in die artikelen
      bedoelde publicatieblad.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel6
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '6'
  - number: '7.3'
    text: |-
      In geval van een wijziging van informatie als bedoeld in het eerste lid of van een bijlage als bedoeld in het
      tweede lid wordt die informatie of die bijlage opnieuw vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel7
  - number: '8'
    text: Een algemeen verbindend voorschrift treedt niet in werking voordat het op de voorgeschreven wijze is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel8
  - number: '9'
    text: |-
      Een besluit tot vaststelling van het tijdstip waarop een wet, een algemene maatregel van bestuur of een anders
      dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift in werking treedt, wordt
      bekendgemaakt op dezelfde wijze als waarop die wet, die algemene maatregel van bestuur of dat algemeen verbindend
      voorschrift zelf is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel9
  - number: '10.1'
    text: |-
      Wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur
      vastgestelde algemeen verbindende voorschriften treden, indien een aanduiding daaromtrent ontbreekt, in werking met
      ingang van de eerste dag van de tweede kalendermaand na de datum van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      Andere algemeen verbindende voorschriften treden in werking met ingang van de achtste dag na de datum van
      bekendmaking, tenzij bij of krachtens de wet of in het besluit daarvoor een ander tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      Indien bij of krachtens de wet is bepaald dat na de bekendmaking van een algemene maatregel van bestuur of een
      vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift
      een bepaalde periode dient te verstrijken alvorens de algemene maatregel van bestuur of het algemeen verbindende
      voorschrift in werking kan treden, kan in afwijking daarvan een eerder tijdstip van inwerkingtreding worden
      vastgesteld, indien de algemene maatregel van bestuur of het algemeen verbindende voorschrift uitsluitend strekt
      tot uitvoering van een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad
      gezamenlijk of van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 1:8, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '12.1'
    text: |-
      Een bestuursorgaan dat behoort tot een van de in [artikel 2, eerste, tweede, derde en vijfde lid][ref1], genoemde
      openbare lichamen, bedrijfsvoeringsorganisaties of gemeenschappelijke organen, doet in het door dat openbaar
      lichaam, die bedrijfsvoeringsorganisatie of dat gemeenschappelijke orgaan uitgegeven publicatieblad in ieder geval
      zijn wettelijk voorgeschreven mededelingen in de vorm van een volledige publicatie en kennisgevingen in de vorm van
      een zakelijke weergave van de inhoud, met vermelding van de wijze waarop en de periode waarin de stukken waar de
      kennisgeving betrekking op heeft voor eenieder ter inzage liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '12.2'
    text: |-
      Een bestuursorgaan dat niet behoort tot een van de in [artikel 2, eerste tot en met vijfde lid][ref1], genoemde
      openbare lichamen doet in de Staatscourant in ieder geval zijn wettelijk voorgeschreven mededelingen in de vorm
      van een volledige publicatie en kennisgevingen in de vorm van een zakelijke weergave van de inhoud met vermelding
      van de wijze waarop en de periode waarin de stukken waar kennisgeving betrekking op heeft voor eenieder ter inzage
      liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '13.1'
    text: |-
      De terinzagelegging waarop een mededeling of kennisgeving als bedoeld in [artikel 12, eerste of tweede lid][ref1],
      betrekking heeft, geschiedt zowel op elektronische wijze als op een door het bestuursorgaan aan te wijzen locatie.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '13.2'
    text: Het bestuursorgaan houdt voor de wijze van terinzagelegging een vaste gedragslijn aan.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      De terinzagelegging vindt niet plaats in de Staatscourant of in een in
      [artikel 2, eerste tot en met vijfde lid][ref1], bedoeld publicatieblad.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '13.4'
    text: |-
      Indien de terinzagelegging betrekking heeft op stukken die niet door het bestuursorgaan zijn vervaardigd, kan
      degene die de stukken aan het bestuursorgaan heeft overgelegd, daarbij gemotiveerd verzoeken de terinzagelegging te
      beperken. Het bestuursorgaan kan degene die een document heeft overgelegd verzoeken om een versie van dat document
      aan te leveren waaruit de gegevens die niet ter inzage worden gelegd, zijn verwijderd, indien de verwijdering
      redelijkerwijs niet van het bestuursorgaan kan worden gevergd. Het bestuursorgaan laat terinzagelegging achterwege
      voor zover [artikel 10 van de Wet openbaarheid van bestuur][ref1] aan de terinzagelegging in de weg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '14'
    text: |-
      Een termijn die krachtens wettelijk voorschrift aanvangt met een mededeling of een kennisgeving als bedoeld
      in [artikel 12][ref1] of een terinzagelegging als bedoeld in [artikel 13][ref2], geldt niet als aangevangen,
      zolang met betrekking tot die mededeling, kennisgeving of terinzagelegging de wettelijke voorschriften niet zijn
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel13
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '13'
  - number: 14a.1
    text: |-
      Indien in een wet of een algemene maatregel van bestuur normen van niet-publiekrechtelijke aard van toepassing
      worden verklaard, wordt van deze normen mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel14a
  - number: 14a.2
    text: |-
      Indien in een ander algemeen verbindend voorschrift normen van niet-publiekrechtelijke aard van toepassing worden
      verklaard, wordt van deze normen mededeling gedaan in het publicatieblad waarin het algemeen verbindend voorschrift
      is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel14a
  - number: 14a.3
    text: |-
      Indien kosteloze beschikbaarheid van de in het eerste of tweede lid bedoelde normen voor alle betrokkenen voldoende
      verzekerd is, kan worden volstaan met mededeling van de vindplaats van de normen.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel14a
  - number: 14a.4
    text: |-
      Indien de mededeling van de in het eerste of tweede lid bedoelde normen niet is toegestaan en de kenbaarheid
      niet overeenkomstig het derde lid kan worden verzekerd, verleent Onze Minister die het aangaat dan wel het
      bestuursorgaan, ten minste zolang de in het eerste lid bedoelde wet of algemene maatregel van bestuur of het in het
      tweede lid bedoelde andere algemeen verbindende voorschrift niet is ingetrokken of vervallen, eenieder op verzoek
      kosteloos inzage in deze normen. Bij de bekendmaking van het algemeen verbindend voorschrift wordt medegedeeld waar
      inzage kan worden verkregen. De [artikelen 13][ref1] en [18][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel18
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '18'
  - number: '15'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de bewaring van oorspronkelijke exemplaren van
      wetten, koninklijke besluiten en daarbij behorende stukken.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel15
  - number: '16.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de plaatsing van de in
      de [artikelen 4][ref1], [5][ref2], [6][ref3] en [12][ref4] bedoelde publicaties, waaronder de vormgeving, de
      structuur en de toegankelijkheid.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de uitgifte en het
      beschikbaar blijven van de in de [artikelen 1][ref1] en [2][ref2] genoemde publicatiebladen, over de verdere
      inhoud van de Staatscourant en de in artikel 2 genoemde publicatiebladen en over het beschikbaar blijven van de
      bekendmakingen waarbij [artikel 7, tweede lid][ref3], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '16.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van terinzagelegging als
      bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel13
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '13'
  - number: '16.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de integriteit
      van de in de [artikelen 4][ref1], [5][ref2], [6][ref3], [7, tweede lid][ref4], en [12][ref5] bedoelde publicaties
      bij de voorbereiding, bij de vaststelling en bij en na publicatie wordt geborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0004287
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '16.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het in rekening brengen van
      publicatiekosten.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      Indien elektronische uitgifte van het Staatsblad onderscheidenlijk de Staatscourant op de krachtens
      [artikel 3, eerste lid][ref1], bepaalde wijze geheel of gedeeltelijk onmogelijk is, voorziet Onze Minister van
      Justitie en Veiligheid onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in een
      vervangende uitgave volgens bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel3
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '3'
  - number: '17.2'
    text: |-
      Indien elektronische uitgifte van een van de in [artikel 2, eerste tot en met vijfde lid][ref1], genoemde
      publicatiebladen op de krachtens [artikel 3, eerste lid][ref2], bepaalde wijze geheel of gedeeltelijk onmogelijk
      is, voorziet het voor publicatie verantwoordelijke bestuursorgaan in een vervangende uitgave volgens door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel3
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '3'
  - number: '17.3'
    text: |-
      Zodra de onmogelijkheid is opgeheven, wordt de vervangende uitgave alsnog op de krachtens
      [artikel 3, eerste lid][ref1], bepaalde wijze ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel3
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '3'
  - number: '18.1'
    text: |-
      Aan eenieder wordt op verzoek kosteloos inzage verleend in of een papieren afschrift verstrekt van een in
      [artikel 1][ref1] of [2][ref2] genoemd publicatieblad, een overeenkomstig [artikel 7][ref3] bekendgemaakte bijlage
      of de in [artikel 12][ref4] bedoelde ter inzage gelegde stukken, tenzij de aard daarvan zich daartegen verzet. Een
      papieren afschrift wordt verstrekt tegen ten hoogste de kosten van het maken van een zodanig afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004287
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '18.2'
    text: |-
      Onze Minister van Justitie en Veiligheid onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties wijst een uitgiftepunt aan waar de inzage of het afschrift van het Staatsblad en een
      afschrift van een overeenkomstig [artikel 7][ref1] bekendgemaakte bijlage bij het Staatsblad, onderscheidenlijk de
      Staatscourant verkregen kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '18.3'
    text: |-
      Het bestuursorgaan dat in de Staatscourant overeenkomstig [artikel 7][ref1] een bijlage heeft bekendgemaakt of
      overeenkomstig [artikel 12, eerste lid][ref2], kennis heeft gegeven van de terinzagelegging van stukken, verstrekt
      desgevraagd de in het eerste lid bedoelde inzage of afschriften van die bijlage en deze stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel12
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '12'
  - number: '18.4'
    text: |-
      Een in [artikel 2, eerste tot en met vierde lid][ref1], genoemd openbaar lichaam of een in artikel 2, vijfde lid,
      genoemd openbaar lichaam, bedrijfsvoeringsorganisatie of gemeenschappelijk orgaan, wijst een uitgiftepunt aan waar
      de in het eerste lid bedoelde inzage of het afschrift verkregen kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '19.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en de in [artikel 6][ref1] bedoelde bestuursorganen
      houden de teksten van bekendgemaakte wetten, algemene maatregelen van bestuur en anders dan bij of krachtens
      algemene maatregel van bestuur vastgestelde algemeen verbindende voorschriften, beleidsregels en gemeenschappelijke
      regelingen in geconsolideerde vorm voor eenieder kosteloos beschikbaar door middel van een bij of krachtens
      algemene maatregel van bestuur aangewezen algemeen toegankelijk elektronisch medium. Hierbij kan worden volstaan
      met een elektronische verwijzing naar de in [artikel 7, eerste lid][ref2], bedoelde informatie of de in artikel 7,
      tweede lid, bedoelde bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '19.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van wetten, algemene maatregelen van bestuur en andere in het
      eerste lid genoemde besluiten worden aangewezen, waarop het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      Een geconsolideerde tekst van een wet, een algemene maatregel van bestuur of een ander in het eerste lid genoemd
      besluit die op grond van het eerste lid beschikbaar is gesteld, blijft beschikbaar indien de wet, de algemene
      maatregel van bestuur of het andere in het eerste lid genoemd besluit na de beschikbaarstelling is gewijzigd of
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel19
  - number: '19.4'
    text: |-
      De teksten, bedoeld in het eerste lid, worden beschikbaar gesteld door middel van een door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties in stand gehouden digitale infrastructuur.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel19
  - number: '19.5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de wijze waarop de teksten,
      bedoeld in het eerste lid, beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan eenieder een elektronisch bericht zenden
      over de bekendmakingen, mededelingen en kennisgevingen in de in de [artikelen 1][ref1] en [2][ref2] genoemde
      publicatiebladen die betrekking hebben op de omgeving van het adres van inschrijving van de ontvanger in de
      basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '20.2'
    text: |-
      Het bericht wordt niet verzonden als de ontvanger heeft verzocht een dergelijk bericht niet te ontvangen. Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties kan de ontvanger die heeft verzocht een dergelijk bericht
      niet te ontvangen, in bij algemene maatregel van bestuur bepaalde gevallen uitnodigen zich alsnog voor deze
      berichten aan te melden.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel20
  - number: '20.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de wijze van verzenden van het bericht, het verzoek
      en de uitnodiging, bedoeld in het tweede lid, en de opslag en de verwerking van persoonsgegevens ten behoeve van
      de verzending van deze berichten. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan nadere regels
      stellen over vanaf welke leeftijd, met welke frequentie en van welk type bestuursorganen en publicaties personen
      elektronische berichten krijgen toegezonden, alsmede over de grootte van de omgeving van het adres, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel20
  - number: '20.4'
    text: |-
      In aanvulling op het eerste lid, kan eenieder verzoeken om een elektronisch bericht te ontvangen van
      bekendmakingen, mededelingen en kennisgevingen in de in de [artikelen 1][ref1] en [2][ref2] genoemde
      publicatiebladen die betrekking hebben op een bepaalde locatie of een bepaald onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
  - number: '20.5'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen over de wijze waarop om een
      elektronisch bericht kan worden verzocht, alsmede over de categorieën onderwerpen waarvoor een dergelijk verzoek
      kan worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel20
  - number: '21'
    text: |-
      Indien het bestuur van een waterschap niet of niet naar behoren uitvoering geeft aan deze wet, zijn de
      [artikelen 121 tot en met 121f van de Provinciewet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel121
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '121'
  - number: '22'
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel22
  - number: '23'
    text: |-
      In afwijking van [artikel 13, eerste lid][ref1], kan een bestuursorgaan de elektronische terinzagelegging
      achterwege laten voor zover de terinzagelegging voorafgaand aan de inwerkingtreding van artikel 13 niet
      elektronisch plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel13
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '13'
  - number: '24'
    text: |-
      De in [artikel 19, eerste lid][ref1], opgenomen verplichting om beleidsregels in geconsolideerde vorm voor eenieder
      kosteloos beschikbaar te houden, geldt voor de in [artikel 6][ref2] bedoelde bestuursorganen voor beleidsregels die
      zijn bekendgemaakt voorafgaand aan de inwerkingtreding van artikel 19 en niet na de inwerkingtreding van genoemd
      artikel zijn gewijzigd, vanaf een jaar na het tijdstip waarop genoemd artikel in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel6
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '6'
  - number: '25'
    text: |-
      De voorafgaand aan de inwerkingtreding van de [artikelen 3.1, onderdeel D][ref1],
      [3.2, onderdeel E][ref2], [3.3, onderdeel B][ref3], [3.4, onderdeel B][ref4], en
      [3.5, onderdeel C, van de Wet elektronische publicaties][ref5] elektronisch uitgegeven publicatiebladen, blijven
      elektronisch op een algemeen toegankelijke wijze beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0043961#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0043961#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0043961#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0043961#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0043961#Artikel3
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0043961
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0043961
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0043961
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0043961
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0043961
        artikel: '3'
  - number: 25a.1
    text: |-
      Waar in een algemeen verbindend voorschrift, niet zijnde een wet, met betrekking tot de bekendmaking van een
      besluit de term «een dag-, nieuws- of huis-aan-huisblad» dan wel een variant van die term wordt gebezigd, wordt
      in plaats van die term gelezen «het publicatieblad, genoemd in [artikel 1][ref1] of [artikel 2][ref2] van de
      Bekendmakingswet».


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel2
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '2'
  - number: 25a.2
    text: |-
      Het eerste lid is niet van toepassing op een algemeen verbindend voorschrift
      afkomstig van een bestuursorgaan van het openbaar lichaam, bedoeld in
      [artikel 1, onderdeel a, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel1
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '1'
  - number: '26'
    text: 'Deze wet wordt aangehaald als: Bekendmakingswet.'
    url: https://wetten.overheid.nl/BWBR0004287/2021-07-01#Artikel26
