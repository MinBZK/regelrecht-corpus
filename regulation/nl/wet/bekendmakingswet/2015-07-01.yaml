valid_from: '2015-07-01'
bwb_id: BWBR0004287
url: https://wetten.overheid.nl/BWBR0004287/2015-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ingevolge de artikelen 88 en 89 van de Grondwet de wet de bekendmaking
    en de inwerkingtreding van wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of
    algemene maatregel van bestuur vastgestelde algemeen verbindende voorschriften dient te regelen, en dat het in
    verband daarmee tevens gewenst is enkele andere voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De regering geeft het Staatsblad en de Staatscourant uit.

      2 De uitgifte van het Staatsblad en de Staatscourant geschiedt elektronisch op een algemeen toegankelijke wijze.

      3 Na de uitgifte blijven het Staatsblad en de Staatscourant elektronisch op een algemeen toegankelijke wijze
      beschikbaar.

      4 Voor het inzien van het Staatsblad en de Staatscourant worden geen kosten in rekening gebracht.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de uitgifte en het
      beschikbaar blijven van het Staatsblad en de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel1
  - number: '2'
    text: |-
      1 De zorg voor de uitgifte van het *Staatsblad* berust bij Onze Minister van Veiligheid en Justitie.

      2 De zorg voor de uitgifte van de *Staatscourant* berust bij Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel2
  - number: '3'
    text: |-
      De bekendmaking van:

      a. wetten,

      b. algemene maatregelen van bestuur en

      c. andere koninklijke besluiten waarbij algemeen verbindende voorschriften worden vastgesteld,

      geschiedt door plaatsing in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel3
  - number: '4'
    text: |-
      De bekendmaking van:

      a. bij ministeriële regeling vastgestelde algemeen verbindende voorschriften en

      b. de overige vanwege het Rijk vastgestelde algemeen verbindende voorschriften, voor zover deze niet in het
      *Staatsblad* geplaatst dienen te worden,

      geschiedt door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel4
  - number: '5'
    text: |-
      1 In afwijking van [artikel 3][ref1] of [4][ref2] kan een wet, algemene maatregel van bestuur of vanwege het Rijk
      anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift bepalen dat een
      bij het voorschrift behorende bijlage wordt bekendgemaakt door terinzagelegging.

      2 Van een bekendmaking als in het eerste lid bedoeld, wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel4
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '4'
  - number: '6'
    text: |-
      Een besluit tot vaststelling van het tijdstip waarop een wet, een algemene maatregel van bestuur of een vanwege het
      Rijk anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift in werking
      treedt, wordt bekendgemaakt op dezelfde wijze als waarop die regeling zelf is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel6
  - number: '7'
    text: |-
      Wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur
      vastgestelde algemeen verbindende voorschriften treden, indien een aanduiding daaromtrent ontbreekt, in werking met
      ingang van de eerste dag van de tweede kalendermaand na de datum van bekendmaking.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel7
  - number: 7a
    text: |-
      1 Indien bij of krachtens de wet is bepaald dat na de bekendmaking van een algemene maatregel van bestuur of een
      vanwege het Rijk anders dan bij wet of algemene maatregel van bestuur vastgesteld algemeen verbindend voorschrift
      een bepaalde periode dient te verstrijken alvorens de regeling in werking kan treden, kan in afwijking daarvan een
      eerder tijdstip van inwerkingtreding worden vastgesteld, indien de regeling uitsluitend strekt tot uitvoering van
      een bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de
      Europese Commissie.

      2 [Artikel 1:8, tweede lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel18
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 1:8
  - number: '8'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de plaatsing van wetten en
      besluiten in het Staatsblad en de Staatscourant en met betrekking tot de bewaring van oorspronkelijke exemplaren
      van wetten, koninklijke besluiten en daarbij behorende stukken.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de verdere inhoud
      van de Staatscourant.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan regels stellen met betrekking tot het in rekening
      brengen van kosten voor plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel8
  - number: '9'
    text: |-
      Indien elektronische uitgifte van het Staatsblad onderscheidenlijk van de Staatscourant op de in [artikel 1][ref1]
      voorziene wijze geheel of gedeeltelijk onmogelijk is, voorziet Onze Minister van Veiligheid en Justitie
      onderscheidenlijk Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in een vervangende uitgave volgens
      bij ministeriële regeling te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel1
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '1'
  - number: '10'
    text: |-
      1 Aan een ieder wordt op verzoek een papieren afschrift van het Staatsblad onderscheidenlijk de Staatscourant
      verstrekt tegen ten hoogste de kosten van het maken van een zodanig afschrift.

      2 Onze Minister van Veiligheid en Justitie onderscheidenlijk Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties wijst een uitgiftepunt aan waar het in het eerste lid bedoelde afschrift van het Staatsblad
      onderscheidenlijk de Staatscourant verkregen kan worden.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel10
  - number: 10a
    text: |-
      1 De teksten van wetten, algemene maatregelen van bestuur en vanwege het Rijk anders dan bij wet of algemene
      maatregel van bestuur vastgestelde algemeen verbindende voorschriften zijn in geconsolideerde vorm voor een ieder
      beschikbaar door middel van een bij algemene maatregel van bestuur aangewezen algemeen toegankelijk elektronisch
      medium.

      2 Bij algemene maatregel van bestuur kunnen categorieën van algemeen verbindende voorschriften worden aangewezen,
      waarop het eerste lid niet van toepassing is.

      3 Een geconsolideerde tekst van een regeling die op grond van het eerste lid beschikbaar is gesteld, blijft
      beschikbaar indien de regeling na de beschikbaarstelling is gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel10a
  - number: 10b
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel10b
  - number: '11'
    text: 'Deze wet kan worden aangehaald als: Bekendmakingswet.'
    url: https://wetten.overheid.nl/BWBR0004287/2015-07-01#Artikel11
