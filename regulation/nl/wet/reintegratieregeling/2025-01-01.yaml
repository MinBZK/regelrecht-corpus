  - number: '4'
    text: |-
      Voor de toepassing van [artikel 5, eerste lid, van het Reïntegratiebesluit][ref1]
      wordt onder inkomen verstaan hetgeen onder inkomen wordt verstaan op grond van
      [artikel 3:2, eerste en tweede lid, van het Algemeen inkomensbesluit socialezekerheidswetten][ref2] vermeerderd
      met:

      a. uitkeringen op grond van een werknemersverzekering, al dan niet vermeerderd met een toeslag op grond van de
      [Toeslagenwet][ref3] en de aanvullingen daarop van degene tot wie de werknemer in dienstbetrekking staat;

      b. hetgeen wordt genoten op grond van [artikel 629 van Boek 7 van het Burgerlijk Wetboek][ref4], alsmede hetgeen
      door de werknemer met een publiekrechtelijke dienstbetrekking wordt genoten op grond van naar aard en strekking
      met artikel 629 van Boek 7 van het Burgerlijk Wetboek overeenkomstige regelingen, al dan niet vermeerderd met
      een toeslag op grond van de [Toeslagenwet][ref5] en de aanvullingen daarop van degene tot wie de werknemer in
      dienstbetrekking staat;

      c. een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6];

      d. een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7];

      e. een uitkering op grond van de [Wet inkomensvoorziening oudere werklozen][ref8];

      f. een algemene bijstandsuitkering op grond van de [Participatiewet][ref9].


