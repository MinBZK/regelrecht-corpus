  - number: '11'
    text: |-
      1 Indien de echtgenoot of een ander gezinslid van de persoon die een vervoersvoorziening aanvraagt of
      aan wie een vervoersvoorziening is toegekend, aanspraak heeft op een vervoersvoorziening of om een andere
      reden dan ziekte of gebrek is aangewezen op het gebruik van een vervoermiddel, wordt voor de verlening
      of beëindiging van de tweede in het gezin benodigde vervoersvoorziening het percentage, bedoeld in
      [artikel 5, eerste lid, van het Reïntegratiebesluit][ref1], vastgesteld op 105%.

      2 Het eerste lid is niet van toepassing indien één van de in het gezin benodigde vervoersvoorzieningen of het
      naast de vervoersvoorziening benodigde vervoermiddel niet voor ten minste driekwart wordt bekostigd uit het
      gezinsinkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019152#Artikel5
    url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#Artikel11
