preamble:
  text: |-
    Gelet op de artikelen 5, vierde lid, en 15, eerste lid, van het Reïntegratiebesluit, artikel 65h van de Wet op
    de arbeidsongeschiktheidsverzekering, artikel 65 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen,
    artikel 59i van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, en artikel 2.8 van de Wet Invoering en
    financiering Wet werk en inkomen naar arbeidsvermogen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in hoofdstuk 5 van de Wet structuur
      uitvoeringsorganisatie werknemersverzekeringen;

      b. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref1];

      c. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2];

      d. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref3];

      e. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref4].

      2 Voor de toepassing van deze regeling wordt gelijkgesteld met:

      a. echtgenoot: de geregistreerde partner alsmede de ongehuwde meerderjarige die met
      een andere ongehuwde meerderjarige een gezamenlijke huishouding voert als bedoeld in
      [artikel 1, vierde en vijfde lid, van de Toeslagenwet][ref5], tenzij het betreft een bloedverwant in de eerste
      graad;

      b. ongehuwd: de persoon die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.

      3 Onder bloedverwant in de eerste graad als bedoeld in het tweede lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.

      4 Onder voormalig pleegkind als bedoeld in het derde lid wordt verstaan een pleegkind waarvoor de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref6] of de
      [Jeugdwet][ref7] of kinderbijslag ontving op grond van de [Algemene Kinderbijslagwet][ref8].


