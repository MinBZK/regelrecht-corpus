        artikel: '5'
  - number: '12'
    text: |-
      1 [Artikel 5, eerste lid, van het Reïntegratiebesluit][ref1] is niet van toepassing bij de toekenning van een
      vervoersvoorziening die betreft:

      1°. een vergoeding van de kosten van aanpassing van een vervoermiddel of een vergoeding van een in een
      vervoermiddel aangebrachte faciliteit, voorzover de aanpassing of de faciliteit noodzakelijk is in verband met
      ziekte of gebrek;

      2°. een vergoeding voor de aanschaf, of een verstrekking, van een vervoermiddel voor het vervoer buitenshuis dat is
      bestemd voor het gebruik door een persoon met een ziekte of gebrek;

      3°. een vergoeding van de meerkosten van de aanschaf en het gebruik van een bijzonder type auto die samenhangt
      met ziekte of gebrek, voorzover deze meerkosten niet meer bedragen dan het verschil tussen de kosten van de
      aanschaf en het gebruik van een auto die door het UWV wordt beschouwd als een referentie-auto en de kosten van
      de aanschaf en het gebruik van een auto die door het UWV zou zijn toegekend indien er sprake zou zijn geweest van
      een bruikleensituatie;

      4°. de vergoeding van het gebruik van een rolstoeltaxi die strekt tot verbetering van de leefomstandigheden, en die
      vergoeding niet meer bedraagt dan het verschil tussen het door het UWV vastgestelde normbedrag voor de vergoeding
      van het gebruik van een rolstoeltaxi en het door het UWV vastgestelde normbedrag voor de vergoeding van het gebruik
      van een taxi;

      5°. de vergoeding van het gebruik van een taxi of rolstoeltaxi om de werkplek te kunnen bereiken en die vergoeding
      niet meer bedraagt dan het verschil tussen de kosten van het gebruik van een taxi of rolstoeltaxi en het door het
      UWV vastgestelde normbedrag voor het gebruik van een eigen auto;

      6°. een vergoeding van de kosten die iemand moet maken voor het kunnen volgen van rijlessen in een aangepaste auto
      en die vergoeding niet meer bedraagt dan het verschil tussen de kosten van het volgen van autorijlessen in een niet
      aangepaste auto en het volgen van autorijlessen in een aangepaste auto;

      7°. een vergoeding van vervoerskosten in verband met het volgen van scholing.

      2 Ten aanzien van de vervoersvoorzieningen, bedoeld in het eerste lid, onderdelen 4° en 5°, vindt verhoging van de
      eigen bijdrage wegens overschrijding van de inkomensgrens plaats met ingang van de datum gelegen zes maanden nadat
      de persoon aan wie de voorziening is verleend van de voorgenomen verhoging in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019152#Artikel5
