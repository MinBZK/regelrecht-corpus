  - number: '5'
    text: |-
      Bij de vaststelling van het inkomen van de persoon die de vervoersvoorziening aanvraagt of aan wie de
      vervoersvoorziening is toegekend, wordt mede in aanmerking genomen het inkomen van zijn echtgenoot.
    url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#Artikel5
  - number: '6'
    text: |-
      Op het inkomen worden in mindering gebracht kosten ter zake van ziekte of arbeidsongeschiktheid van de persoon die
      de vervoersvoorziening aanvraagt of aan wie de vervoersvoorziening is toegekend, alsmede van zijn echtgenoot of van
      zijn gezinsleden indien zij voor hun levensonderhoud mede afhankelijk zijn van zijn inkomen, voorzover die kosten
      niet uit andere hoofde kunnen worden vergoed en naar het oordeel van het UWV als buitengewone lasten zijn aan te
      merken.
    url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#Artikel6
  - number: '7'
    text: |-
      Bij het vaststellen van het inkomen blijft buiten beschouwing het bedrag waarmee de uitkering
      of inkomensvoorziening op grond van de [WAO][ref1], de [Wet WIA][ref2], de [WAZ][ref3] of de
      [Wajong][ref4], of een combinatie hiervan is verhoogd, op grond van [artikel 22 van de WAO][ref5], de
      [artikelen 53 ][ref6]of[ 63 van de Wet WIA][ref7], [artikel 10 van de WAZ][ref8], of [artikel 2:51][ref9] of
      [3:9 van de Wajong][ref10], of een combinatie van deze artikelen.


