  - number: '15'
    text: |-
      De ten laste van de werkloosheidsfondsen komende bijdrage aan het Reïntegratiefonds in een bepaald kalenderjaar,
      wordt voor elk van deze fondsen bepaald aan de hand van de volgende formule:

      Bf t = [ Uf t–2 : U t-2] × B t

      waarbij :

      1. Bf t het bedrag is van de bijdrage uit een werkloosheidsfonds, tot dekking van de uitgaven in een bepaald
      kalenderjaar ten laste van het Reïntegratiefonds;

      2. Uf t–2 het bedrag is van de uitkeringsuitgaven die in het tweede kalenderjaar voorafgaand aan genoemd bepaald
      kalenderjaar ten laste zijn gekomen van het desbetreffende werkloosheidsfonds;

      3. U t–2 het totaalbedrag is van de uitkeringsuitgaven die in het tweede kalenderjaar voorafgaand aan genoemd
      bepaald kalenderjaar ten laste zijn gekomen van de werkloosheidsfondsen gezamenlijk;

      4. B t 50 procent is van de benodigde middelen tot dekking van de uitgaven in genoemd bepaald kalenderjaar ten
      laste van het Reïntegratiefonds.
