      1 Een aanvraag voor loonsuppletie als bedoeld in [artikel 65c van de WAO][ref1], [artikel 67a van de WAZ ][ref2]en
      [artikel 2:25][ref3] of [3:67 van de Wajong][ref4] wordt ingediend binnen twee maanden na aanvang van het
      werk in dienstbetrekking, dan wel bij aanvang van de werkzaamheden voordat een besluit over de mate van
      arbeidsongeschiktheid is genomen, binnen twee maanden nadat dat besluit is genomen.

      2 Een aanvraag voor inkomenssuppletie als bedoeld in [artikel 65d van de WAO][ref5], [artikel 67b van de WAZ][ref6]
      en [artikel 2:26][ref7] of [3:68 van de Wajong][ref8] wordt ingediend binnen zes maanden na afloop van het
      boekjaar waarin de uitoefening van het bedrijf of beroep is voortgezet of waarin de persoon, die recht heeft op een
      uitkering op grond van een van de hiervoor genoemde wetten, werkzaamheden als zelfstandige is gaan verrichten.

      3 Bij overschrijding van de termijnen, bedoeld in het eerste of tweede lid, wordt geen loonsuppletie verstrekt over
      een periode die gelegen is meer dan twee maanden voor de aanvraag, respectievelijk geen inkomenssuppletie verstrekt
      over het boekjaar of de boekjaren gelegen voor de aanvraag.


