  - number: '8'
    text: |-
      1 Bij de vaststelling van het inkomen van de persoon die de vervoersvoorziening aanvraagt of aan wie de
      vervoersvoorziening is toegekend en die de leeftijd van 18 jaar nog niet heeft bereikt wordt in aanmerking genomen
      het gezamenlijk inkomen van de ouders van die persoon dan wel, indien het een pleegkind betreft, het gezamenlijk
      inkomen van de pleegouders indien laatstgenoemden het pleegkind als eigen kind opvoeden en onderhouden.

      2 Indien de ouders respectievelijk pleegouders van de in het eerste lid bedoelde persoon geen echtgenoten zijn van
      elkaar en hij:

      a. bij een van beide ouders verblijft, wordt bij de toepassing van het eerste lid als inkomen van de ouder
      respectievelijk pleegouder die krachtens overeenkomst of rechterlijke uitspraak een bijdrage is verschuldigd voor
      het levensonderhoud ten behoeve van die persoon, slechts die bijdrage in aanmerking genomen;

      b. afwisselend bij een van beide ouders respectievelijk pleegouders verblijft, wordt alvorens het gezamenlijk
      inkomen als bedoeld in het eerste lid wordt vastgesteld, het inkomen van de ouder respectievelijk pleegouder met
      het hoogste inkomen verminderd met 30 procent.
    url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#Artikel8
  - number: '9'
    text: |-
      Indien een persoon in het kalenderjaar waarin hij een vervoersvoorziening heeft of aanvraagt, de leeftijd van 18
      jaar bereikt, wordt:

      a. tot de datum waarop hij 18 jaar wordt, het inkomen in aanmerking genomen dat in aanmerking zou zijn genomen
      indien hij gedurende het gehele kalenderjaar nog niet de leeftijd van 18 jaar had bereikt;

      b. vanaf de datum waarop hij 18 jaar wordt, het inkomen in aanmerking genomen dat in aanmerking zou zijn genomen
      indien hij gedurende het gehele kalenderjaar reeds de leeftijd van 18 jaar had bereikt.
    url: https://wetten.overheid.nl/BWBR0019297/2025-01-01#Artikel9
  - number: '10'
    text: |-
      1 Indien een persoon aan wie een vervoersvoorziening is toegekend de pensioengerechtigde leeftijd, bedoeld
      in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1] bereikt, wordt voor de toepassing van
      [artikel 5, eerste lid, van het Reïntegratiebesluit][ref2] onder inkomen verstaan het inkomen dat deze persoon
      over dat kalenderjaar zou hebben genoten indien hij in dat jaar niet de pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet had bereikt.

      2 Indien de echtgenoot van de persoon, bedoeld in het eerste lid, in hetzelfde jaar als het jaar, bedoeld in het
      eerste lid, de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3]
      bereikt, wordt voor de toepassing van artikel 3 van deze regeling onder inkomen van zijn echtgenoot verstaan,
      het inkomen dat de echtgenoot over dat kalenderjaar zou hebben genoten indien de echtgenoot in dat jaar niet de
      pensioengerechtigde leeftijd, bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet had bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
