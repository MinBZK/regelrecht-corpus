---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: zaaizaad_en_plantgoedwet_2005
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2006-02-01'
bwb_id: BWBR0018040
url: https://wetten.overheid.nl/BWBR0018040/2006-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling voor het toelaten van
    plantenrassen, het in de handel brengen van teeltmateriaal en het verlenen van kwekersrecht vast te stellen,
    mede gelet op het op 2 december 1961 te Parijs tot stand gekomen Internationaal Verdrag tot bescherming van
    kweekprodukten (Trb. 1962, 117), zoals dit laatstelijk is herzien bij Akte van 19 maart 1991 (Trb. 1992, 52),
    alsmede gelet op diverse Europese richtlijnen met betrekking tot het in de handel brengen van teeltmateriaal van
    verschillende soorten gewassen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Landbouw, Natuur en Voedselkwaliteit;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.b
    text: |-
      de Raad: de Raad voor plantenrassen, genoemd in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel2
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      ras: plantengroep binnen één botanisch taxon van de laagst bekende rang, welke groep, ongeacht of volledig wordt
      voldaan aan de voorwaarden die deze wet stelt voor de verlening van een kwekersrecht, kan worden - gedefinieerd
      aan de hand van de expressie van de eigenschappen die het resultaat is van een bepaald genotype of een combinatie
      van genotypen,
        - onderscheiden van elke andere plantengroep op grond van de expressie van ten minste één van die eigenschappen, en
        - beschouwd als een eenheid, gezien zijn geschiktheid om onveranderd te worden vermeerderd;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.d
    text: |-
      het rassenregister: het Nederlands rassenregister, genoemd in [artikel 25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel25
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '25'
        hoofdstuk: '4'
  - number: 1.e
    text: 'opstand: afgebakende, wat samenstelling betreft voldoende uniforme populatie bomen;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.f
    text: |-
      teeltmateriaal: planten en plantendelen, die bestemd zijn om voor de teelt van gewassen of ter vermeerdering te
      dienen dan wel daartoe gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.g
    text: |-
      in de handel brengen: bedrijfsmatig ter beschikking of in voorraad houden, uitstallen of te koop aanbieden,
      verkopen, bezitten met het oog op de verkoop, alsmede tegen of zonder vergoeding aan derden beschikbaar stellen,
      leveren of overdragen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.h
    text: 'instandhouder: degene die ervoor zorgdraagt dat een toegelaten ras in stand wordt gehouden;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.i
    text: |-
      leverancier: elke natuurlijke of rechtspersoon die, anders dan voor gebruik in het eigen bedrijf, beroepshalve
      teeltmateriaal vermeerdert, produceert, bewaart, be- of verwerkt, importeert of in de handel brengt;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.j
    text: |-
      kweker: degene die een ras door eigen arbeid heeft gekweekt of die het ras heeft ontdekt en ontwikkeld, of diens
      rechtverkrijgende;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.k
    text: |-
      Unie: Unie tot bescherming van kweekprodukten, gevormd door de staten die partij zijn bij het op 2 december 1961
      te Parijs tot stand gekomen Internationaal Verdrag tot bescherming van kweekprodukten (Trb. 1962, 117), zoals dit
      laatstelijk is herzien bij Akte van 19 maart 1991 (Trb. 1992, 52);
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.l
    text: 'Unie-staat: staat die deel uitmaakt van de Unie;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.m
    text: |-
      handelsrichtlijn of -verordening: richtlijn, onderscheidenlijk verordening, van de Raad van de Europese Unie of
      van het Europees Parlement en de Raad van de Europese Unie gezamenlijk die geheel of gedeeltelijk berust op de
      artikelen 37, 52, 95, 152 of 175 van het EG-Verdrag, betrekking heeft op de plantaardige sector en regels stelt
      over de economische activiteiten in die sector, de belangen van afnemers, de interne markt, de kwaliteit, de
      productie met het oog op het in de handel brengen en het in de handel brengen van teeltmateriaal, het milieu, de
      volksgezondheid, technische eisen of het verschaffen van informatie;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: 1.n
    text: |-
      gedelegeerde richtlijn, verordening of beschikking: richtlijn, verordening, onderscheidenlijk beschikking, van de
      Commissie van de Europese Gemeenschappen die berust op een handelsrichtlijn of -verordening.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel1
  - number: '2'
    text: 'Er is een Raad voor plantenrassen, die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
  - number: 2.a
    text: |-
      het inschrijven van rassen en opstanden in het rassenregister overeenkomstig [hoofdstuk 4][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '4'
  - number: 2.b
    text: |-
      het toelaten van rassen en opstanden overeenkomstig [hoofdstuk 5][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '5'
  - number: 2.c
    text: |-
      het verlenen van kwekersrecht overeenkomstig [hoofdstuk 7][ref1] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '7'
  - number: 2.d
    text: |-
      het op grond van [artikel 26][ref1] opstellen en bekend maken van nationale lijsten van toegelaten rassen en
      opstanden, en


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel26
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '26'
        hoofdstuk: '4'
  - number: 2.e
    text: |-
      het toelaten en in het rassenregister inschrijven van plantengroepen als bedoeld in [artikel 85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel85
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '85'
        hoofdstuk: '8'
  - number: '3.1'
    text: |-
      De Raad bestaat uit ten minste zeven en ten hoogste elf leden, de voorzitter daaronder begrepen, die door Onze
      Minister worden benoemd en ontslagen. De benoeming vindt plaats op grond van deskundigheid op het gebied van de
      taken waarmee de Raad is belast. Geen benoeming vindt plaats van aan Onze Minister ondergeschikte personen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel3
  - number: '3.2'
    text: De Raad kan uit zijn midden één of meer plaatsvervangend voorzitters aanwijzen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel3
  - number: '3.3'
    text: |-
      Aan de Raad worden een secretaris en één of meer adjunct-secretarissen toegevoegd, die door Onze Minister worden
      benoemd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel3
  - number: '3.4'
    text: |-
      Aan de Raad is ter ondersteuning van zijn werkzaamheden een bureau verbonden, aan het hoofd waarvan de in het derde
      lid bedoelde secretaris is gesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel3
  - number: '3.5'
    text: Bij algemene maatregel van bestuur kunnen één of meer afdelingen van de Raad worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel3
  - number: '4.1'
    text: De benoeming van de voorzitter en de overige leden vindt plaats voor een periode van vijf jaar.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde personen zijn na hun aftreden terstond herbenoembaar. Zij kunnen ten hoogste twee
      maal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: '4.3'
    text: |-
      De in het eerste lid bedoelde personen kunnen wegens ongeschiktheid of onbekwaamheid voor de vervulde functie
      dan wel wegens andere zwaarwichtige in de persoon van de betrokkenen gelegen redenen door Onze Minister worden
      geschorst of tussentijds worden ontslagen. Ontslag vindt voorts plaats op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: '4.4'
    text: |-
      Schorsing of ontslag wegens zwaarwegende in de persoon van de betrokkenen gelegen gronden als bedoeld in het derde
      lid wordt verleend:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: 4.4.a
    text: |-
      wanneer de betrokkene bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel
      bij een dergelijke uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: 4.4.b
    text: |-
      wanneer de betrokkene bij onherroepelijk geworden rechterlijke uitspraak onder curatele is gesteld, in staat
      van faillissement is verklaard, ten aanzien van hem of haar de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard, hij of zij surséance van betaling heeft verkregen of wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: 4.4.c
    text: |-
      wegens handelen of nalaten dat ernstig nadeel toebrengt aan de goede gang van zaken bij de Raad of aan het in de
      Raad te stellen vertrouwen of
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: 4.4.d
    text: |-
      bij handelen in strijd met de geheimhoudingsplicht, bedoeld in
      [artikel 2:5 van de Algemene wet bestuursrecht][ref1], of bij handelen in strijd met [artikel 5][ref2] van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '5'
        hoofdstuk: '2'
  - number: '4.5'
    text: |-
      Degene die is benoemd ter vervanging van een tussentijds opengevallen plaats, treedt af op het tijdstip waarop
      degene in wiens plaats hij is benoemd, zou moeten aftreden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: '4.6'
    text: Onze Minister kent de leden van de Raad een vergoeding toe.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel4
  - number: '5.1'
    text: |-
      De voorzitter en de overige leden, de secretaris en de adjunct-secretarissen nemen niet deel aan de behandeling van
      zaken, waarbij zij in enig opzicht persoonlijk betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel5
  - number: '5.2'
    text: |-
      De voorzitter en de overige leden vervullen geen nevenfuncties die ongewenst zijn met het oog op een goede
      vervulling van hun functie of de handhaving van hun onafhankelijkheid of van het vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel5
  - number: '5.3'
    text: |-
      De in het tweede lid bedoelde personen melden het voornemen tot het aanvaarden van een nevenfunctie aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel5
  - number: '5.4'
    text: |-
      Nevenfuncties anders dan uit hoofde van de functie worden openbaar gemaakt. Openbaarmaking geschiedt door het ter
      inzage leggen van een opgave van deze nevenfuncties bij de Raad en bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel5
  - number: '6.1'
    text: De kosten van de Raad komen ten laste van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: '6.2'
    text: 'Onze Minister stelt tarieven vast voor:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.a
    text: het in behandeling nemen van verzoeken om inschrijvingen en aantekeningen in het rassenregister;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.b
    text: het in behandeling nemen van aanvragen voor de toelating van rassen en opstanden;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.c
    text: het in behandeling nemen van aanvragen voor kwekersrecht;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.d
    text: |-
      het uitvoeren van het technisch onderzoek dat noodzakelijk is om aanvragen als bedoeld in onderdeel b en c te
      kunnen beoordelen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.e
    text: het verstrekken van afschriften en uittreksels uit het rassenregister;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.f
    text: |-
      elk jaar dat een ras of opstand in verband met de toelating of in verband met de verlening van kwekersrecht in het
      rassenregister staat ingeschreven;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.2.g
    text: |-
      het verstrekken van adviezen als bedoeld in [artikel 58, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel58
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 6.2.h
    text: |-
      het in behandeling nemen van aanvragen voor de toelating van plantengroepen als bedoeld in [artikel 85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel85
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '85'
        hoofdstuk: '8'
  - number: '6.3'
    text: 'De tarieven, bedoeld in het tweede lid:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.3.a
    text: hebben een rechtstreeks verband met de activiteiten, bedoeld in het tweede lid, onderdelen a tot en met h,
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.3.b
    text: |-
      belopen niet meer dan nodig is ter dekking van de gemaakte kosten die zijn toe te rekenen aan die onderscheiden
      activiteiten, en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: 6.3.c
    text: |-
      worden per gewas of per categorie van gewassen waarop de activiteiten van de Raad betrekking hebben, afzonderlijk
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de oplegging en inning van de tarieven
      alsmede met betrekking tot het periodiek aanpassen van de tarieven aan de ontwikkelingen van de lonen en prijzen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: '6.5'
    text: |-
      Bij gebreke van betaling binnen de door de Raad gestelde termijn kan de Raad het verschuldigde bedrag, verhoogd
      met de wettelijke rente en de op de invordering vallende kosten, invorderen bij dwangbevel. Het dwangbevel
      wordt op kosten van degene die het bedrag is verschuldigd bij deurwaardersexploot betekend overeenkomstig
      [artikel 45 en volgende van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      en levert een executoriale titel op in de zin
      [artikel 430 van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel430
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '430'
  - number: '6.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      staat. Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: '6.7'
    text: |-
      De Raad neemt geen stukken in behandeling en verstrekt geen afschriften en uittreksels uit het rassenregister,
      zolang niet het ingevolge dit artikel verschuldigde bedrag wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel6
  - number: '7.1'
    text: |-
      De Raad kan getuigen en deskundigen horen in verband met het toelaten van rassen en opstanden en het verlenen van
      kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
  - number: '7.2'
    text: Ieder, die als getuige is opgeroepen, is verplicht aan deze oproep gehoor te geven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
  - number: '7.3'
    text: |-
      De [artikelen 191][ref1] en [203, tweede en derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      vinden ten aanzien van de getuige overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel191
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel203
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '191'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '203'
  - number: '7.4'
    text: |-
      De Raad kan bevelen, dat getuigen, die hoewel behoorlijk opgeroepen niet zijn verschenen, door de openbare macht
      worden voorgeleid.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
  - number: '7.5'
    text: |-
      De [artikelen 197 tot en met 199][ref1], [203][ref2] en [205 van het Wetboek van Burgerlijke Rechtsvordering][ref3]
      zijn ten aanzien van het getuigenverhoor van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel197
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel203
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel205
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '197'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '203'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '205'
  - number: '7.6'
    text: De deskundigen zijn verplicht hun taak onpartijdig en naar beste weten te verrichten.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel7
  - number: '8.1'
    text: 'De Raad stelt een bestuursreglement vast, waarin in ieder geval wordt geregeld:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: 8.1.a
    text: de werkwijze van de Raad en de taakverdeling tussen de leden;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: 8.1.b
    text: de oproeping van aanvragers, verzoekers en andere belanghebbenden alsmede van getuigen en deskundigen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: 8.1.c
    text: de aan getuigen en deskundigen toe te kennen geldelijke vergoedingen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: '8.2'
    text: |-
      De Raad kan bij het in het eerste lid bedoelde bestuursreglement de vertegenwoordiging in en buiten rechte opdragen
      aan een of meer leden van de Raad of aan de secretaris. De Raad kan bepalen dat deze vertegenwoordiging uitsluitend
      betrekking heeft op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: '8.3'
    text: |-
      De Raad kan bij het in het eerst lid bedoelde reglement de uitoefening van daarbij aan te wijzen taken en
      bevoegdheden opdragen aan een of meer leden of aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: '8.4'
    text: |-
      Het bestuursreglement behoeft de goedkeuring van Onze Minister. De goedkeuring kan worden onthouden wegens strijd
      met het recht of op de grond dat het bestuursreglement naar het oordeel van Onze Minister een goede taakuitoefening
      door de Raad kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel8
  - number: '9.1'
    text: |-
      De Raad stelt jaarlijks voor 1 juli een verslag op van de werkzaamheden, het gevoerde beleid in het algemeen
      en de doelmatigheid en doeltreffendheid van zijn werkzaamheden en werkwijze in het bijzonder in het afgelopen
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel9
  - number: '9.2'
    text: |-
      Het jaarverslag wordt aan Onze Minister en aan beide kamers der Staten-Generaal toegezonden en algemeen
      verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel9
  - number: '10.1'
    text: 'De Raad ziet met betrekking tot de uitoefening van zijn taken en bevoegdheden toe op:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: 10.1.a
    text: een tijdige voorbereiding en uitvoering;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: 10.1.b
    text: de kwaliteit van de daarbij gebruikte procedures;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: 10.1.c
    text: de zorgvuldige behandeling van personen en instellingen die met hem in aanraking komen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: 10.1.d
    text: de zorgvuldige behandeling van bezwaarschriften en klachten die worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: '10.2'
    text: |-
      De Raad treft voorzieningen, waardoor personen en instellingen die met hem in aanraking komen, in de gelegenheid
      zijn voorstellen tot verbeteringen van werkwijzen en procedures te doen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
  - number: '10.3'
    text: |-
      In het jaarverslag, bedoeld in [artikel 9][ref1], doet de Raad verslag van hetgeen tot uitvoering van het eerste en
      tweede lid is verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel9
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '9'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      De Raad verstrekt desgevraagd aan Onze Minister de voor de uitoefening van diens taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel11
  - number: '11.2'
    text: |-
      De Raad geeft bij het verstrekken van de in het eerste lid bedoelde inlichtingen waar nodig aan welke gegevens een
      vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van de gegevens, dan wel
      uit het feit dat natuurlijke of rechtspersonen deze aan het orgaan hebben verstrekt onder het beding dat zij als
      vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel11
  - number: '12.1'
    text: Onze Minister kan richtlijnen vaststellen met betrekking tot de taakuitoefening door de Raad.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel12
  - number: '12.2'
    text: De richtlijnen worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel12
  - number: '13.1'
    text: Onze Minister kan een besluit van de Raad vernietigen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel13
  - number: '13.2'
    text: Van het vernietigingsbesluit wordt mededeling in de Staatscourant gedaan.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel13
  - number: '14.1'
    text: |-
      Indien de Raad naar het oordeel van Onze Minister zijn taak ernstig verwaarloost, kan Onze Minister de
      noodzakelijke voorzieningen treffen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel14
  - number: '14.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat de Raad in de
      gelegenheid is gesteld om binnen een door Onze Minister te stellen termijn alsnog zijn taak naar behoren uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel14
  - number: '14.3'
    text: |-
      Onze Minister stelt beide kamers der Staten-Generaal onverwijld in kennis van door hem getroffen voorzieningen als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel14
  - number: '15'
    text: De Raad zendt jaarlijks voor 1 april aan Onze Minister een ontwerp-begroting voor het daaropvolgende jaar.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel15
  - number: '16'
    text: |-
      Indien gedurende het jaar aanmerkelijke verschillen ontstaan of dreigen te ontstaan tussen de werkelijke en de
      begrote baten en lasten dan wel inkomsten en uitgaven, doet de Raad daarvan onverwijld mededeling aan Onze Minister
      onder vermelding van de oorzaak van de verschillen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel16
  - number: '17'
    text: |-
      De Raad draagt op de voet van de ter zake voor de Rijksdienst geldende voorschriften zorg voor de nodige technische
      en organisatorische voorzieningen ter beveiliging van zijn gegevens tegen verlies of aantasting en tegen onbevoegde
      kennisneming, wijziging en verstrekking van die gegevens.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel17
  - number: '18'
    text: |-
      Onze Minister zendt binnen vier jaar na inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan beide
      kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van de Raad.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel18
  - number: '19.1'
    text: |-
      Bij algemene maatregel van bestuur worden een of meer privaatrechtelijke rechtspersonen met volledige
      rechtsbevoegdheid belast met de keuring van teeltmateriaal en het uitreiken van bewijsstukken of kentekenen ter
      uitvoering van het bepaalde bij of krachtens [hoofdstuk 6][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '6'
  - number: '19.2'
    text: |-
      De in het eerste lid bedoelde keuring strekt ertoe vast te stellen of teeltmateriaal voldoet aan de bij of
      krachtens [hoofdstuk 6][ref1] van deze wet gestelde regels, onder meer door middel van onderzoek van het
      teeltmateriaal of de herkomst daarvan, door middel van bemonstering en door middel van het uitvoeren van tests.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '6'
  - number: '19.3'
    text: |-
      Bij een maatregel als bedoeld in het eerste lid kan een ingevolge dat lid aangewezen keuringsinstelling tevens
      worden belast met de erkenning of registratie van leveranciers, bedoeld in [artikel 42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '42'
        hoofdstuk: '6'
  - number: '20.1'
    text: |-
      Een krachtens [artikel 19][ref1] aangewezen keuringsinstelling is niet werkzaam met het oogmerk om winst te
      behalen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: '20.2'
    text: |-
      De keuringsinstelling stelt een reglement vast waarin wordt geregeld de wijze waarop de keuring wordt uitgevoerd
      en de wijze waarop het uitreiken van bewijsstukken en kentekenen plaatsvindt. Het reglement behoeft de goedkeuring
      van Onze Minister. De goedkeuring kan worden onthouden wegens strijd met het recht of op de grond dat het reglement
      naar het oordeel van Onze Minister een goede taakuitoefening door de keuringsinstelling kan belemmeren.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel20
  - number: '21.1'
    text: |-
      Voor zover de kosten van een keuringsinstelling betrekking hebben op de in [artikel 19][ref1] bedoelde wettelijke
      taken, worden zij gedekt uit de door de keuringsinstelling vast te stellen en in rekening te brengen tarieven voor:


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: 21.1.a
    text: |-
      het verlenen van de toestemming, bedoeld in [artikel 39, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel39
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '39'
        hoofdstuk: '6'
  - number: 21.1.b
    text: |-
      het verrichten van de in [artikel 40][ref1] bedoelde keuring ;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel40
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '40'
        hoofdstuk: '6'
  - number: 21.1.c
    text: |-
      het uitreiken van bewijsstukken en kentekenen, bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel41
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '41'
        hoofdstuk: '6'
  - number: 21.1.d
    text: |-
      de behandeling van een aanvraag tot erkenning of registratie van leveranciers, bedoeld in [artikel 42][ref1], dan
      wel van een aanvraag tot verlenging of wijziging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '42'
        hoofdstuk: '6'
  - number: 21.1.e
    text: de instandhouding van een erkenning of registratie als bedoeld in onderdeel d en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: 21.1.f
    text: |-
      het verstrekken van gegevens als bedoeld in [artikel 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel64
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '64'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '21.2'
    text: |-
      De tarieven, bedoeld in het eerste lid, behoeven voorafgaande goedkeuring van Onze Minister. De goedkeuring kan
      worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: '21.3'
    text: 'De tarieven, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: 21.3.a
    text: hebben een rechtstreeks verband met de in dat lid bedoelde activiteiten,
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: 21.3.b
    text: |-
      belopen niet meer dan nodig is ter dekking van de gemaakte kosten die zijn toe te rekenen aan die onderscheiden
      activiteiten, en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: 21.3.c
    text: |-
      worden per gewas of per categorie van gewassen waarop de activiteiten van de keuringsinstelling betrekking hebben,
      afzonderlijk vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: '21.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de oplegging en inning van de tarieven
      alsmede met betrekking tot het periodiek aanpassen van de tarieven aan de ontwikkelingen van de lonen en prijzen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: '21.5'
    text: |-
      Bij gebreke van betaling binnen de door de keuringsinstelling gestelde termijn kan de
      keuringsinstelling het verschuldigde bedrag, verhoogd met de wettelijke rente en de op
      de invordering vallende kosten, invorderen bij dwangbevel. Het dwangbevel wordt op kosten
      van degene die het bedrag is verschuldigd bij deurwaardersexploot betekend overeenkomstig
      [artikel 45 en volgende van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      en levert een executoriale titel op in de zin van
      [artikel 430 van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel430
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '430'
  - number: '21.6'
    text: |-
      Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de
      rechtspersoon waartoe de keuringsinstelling behoort. Het verzet schorst de tenuitvoerlegging. Op verzoek van de
      rechtspersoon kan de rechter de schorsing van de tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: '21.7'
    text: |-
      De keuringsinstelling verricht geen activiteiten als bedoeld in het eerste lid of staakt deze, indien niet het
      ingevolge dit artikel verschuldigde bedrag wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel21
  - number: '22.1'
    text: |-
      Wijzigingen van de statuten van een krachtens [artikel 19][ref1] aangewezen keuringsinstelling behoeven, alvorens
      zij van kracht zijn, de instemming van Onze Minister. Onze Minister draagt zorg voor de publicatie van de statuten
      in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: '22.2'
    text: |-
      De benoeming en het ontslag van de voorzitter van een keuringsinstelling behoeft voorafgaande goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel22
  - number: '23'
    text: |-
      De keuringsinstelling houdt een afzonderlijke boekhouding bij ter zake van de bij of krachtens deze wet opgedragen
      taken en daaruit onmiddellijk voortvloeiende werkzaamheden en verantwoordt die taken en werkzaamheden afzonderlijk
      in haar jaarrekening.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel23
  - number: '24'
    text: |-
      De [artikelen 9 tot en met 14][ref1] alsmede de [artikelen 17][ref2] en [18][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0018040#Artikel18
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '17'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018040
        artikel: '18'
        hoofdstuk: '2'
  - number: '25.1'
    text: |-
      Er is een Nederlands rassenregister dat bestemd is voor de inschrijving van rassen en opstanden. Het register is
      openbaar.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: '25.2'
    text: 'In het rassenregister worden ingeschreven:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: 25.2.a
    text: |-
      rassen en opstanden, die ingevolge [hoofdstuk 5][ref1] van deze wet zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '5'
  - number: 25.2.b
    text: |-
      rassen, waarvoor ingevolge [hoofdstuk 7][ref1] van deze wet kwekersrecht is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '7'
  - number: 25.2.c
    text: |-
      plantengroepen als bedoeld in [artikel 85][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel85
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '85'
        hoofdstuk: '8'
  - number: '25.3'
    text: |-
      De inschrijving geschiedt door de Raad door vermelding van de door de Raad vastgestelde karakteriserende
      beschrijving en, voor zover het rassen betreft, van de door de Raad vastgestelde benaming.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: '25.4'
    text: De ingeschreven benaming wordt aangemerkt als soortaanduiding.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: '25.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de inrichting van het rassenregister
      en de gegevens die bij de inschrijving van rassen, opstanden en plantengroepen, bedoeld in het tweede lid, worden
      vermeld. De in de eerste volzin bedoelde gegevens betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: 25.5.a
    text: |-
      een vermelding van het uitgevoerde technisch onderzoek voor de toelating van een ras of een opstand,
      onderscheidenlijk de verlening van kwekersrecht, bedoeld in [artikel 35, eerste lid, onderdelen a, b en c][ref1],
      onderscheidenlijk [artikel 49, zevende lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 25.5.b
    text: 'voor zover het toegelaten rassen betreft: een vermelding van de instandhouder of instandhouders;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: 25.5.c
    text: 'voor zover het opstanden betreft: een vermelding van de eigenaar of beheerder en de groeiplaats van de opstand.'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel25
  - number: '26.1'
    text: |-
      Ter uitvoering van bindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad van
      de Europese Unie gezamenlijk of van de Commissie van de Europese Gemeenschappen stelt de Raad nationale lijsten
      samen van de in Nederland van een gewas toegelaten rassen en opstanden, op basis van de in het rassenregister
      opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel26
  - number: '26.2'
    text: |-
      Van de vaststelling van een nationale lijst als bedoeld in het eerste lid wordt mededeling gedaan in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel26
  - number: '27.1'
    text: |-
      De in [artikel 25, derde lid][ref1], bedoelde benaming is geschikt om het ras waarvoor zij wordt gebezigd, te
      identificeren.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel25
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '25'
        hoofdstuk: '4'
  - number: '27.2'
    text: 'De benaming verschilt in het bijzonder:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: 27.2.a
    text: |-
      voor zover het een ras betreft waarvoor kwekersrecht is verleend: van iedere benaming die in enige Unie-Staat een
      reeds bestaand ras van hetzelfde of van een verwant gewas aanduidt;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: 27.2.b
    text: |-
      voor zover het andere rassen betreft: van iedere benaming die in enige lidstaat van de Europese Unie of een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte een reeds bestaand ras van
      hetzelfde of een verwant gewas aanduidt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: '27.3'
    text: De benaming is niet in strijd met de openbare orde of de goede zeden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: '27.4'
    text: |-
      De benaming is gelijk aan de benaming die reeds in enige Unie-Staat, onderscheidenlijk in enige lidstaat of
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, voor het ras is
      ingeschreven, mits deze voor gebruik hier te lande geschikt is.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: '27.5'
    text: |-
      Geen benaming wordt vastgesteld die zodanig met een handelsnaam of merk overeenstemt, dat het gebruik daarvan
      aanleiding kan geven tot verwarring omtrent de aard of herkomst van waren.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: '27.6'
    text: |-
      Bij ministeriële regeling worden, ter uitvoering van een bindend besluit van de Raad van de Europese Unie, van het
      Europees Parlement en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen nadere regels gesteld
      omtrent de benaming. Bij het stellen van regels als bedoeld in de eerste volzin wordt tevens rekening gehouden met
      de door de Raad van de Europese Unie vastgestelde aanbevelingen met betrekking tot de benaming van rassen waarvoor
      kwekersrecht is verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel27
  - number: '28.1'
    text: Alvorens een benaming vast te stellen, doet de Raad van het voornemen daartoe mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel28
  - number: '28.2'
    text: |-
      Een belanghebbende kan gedurende acht weken na de in het eerste lid bedoelde mededeling bij de Raad bedenkingen op
      grond van [artikel 27, vijfde lid][ref1], tegen de benaming inbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel27
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '27'
        hoofdstuk: '4'
  - number: '28.3'
    text: De Raad stelt geen benaming vast alvorens zij over de in het tweede lid bedoelde bedenkingen heeft beslist.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel28
  - number: '28.4'
    text: |-
      Het Bureau voor de Industriële Eigendom verstrekt aan de Raad desgevraagd inlichtingen omtrent bij hem ingeschreven
      merken.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel28
  - number: '29.1'
    text: |-
      Bij de aanvraag tot verlening van kwekersrecht en bij de aanvraag voor de toelating van een ras, doet de aanvrager
      een voorstel voor de benaming van het ras.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel29
  - number: '29.2'
    text: |-
      De aanvrager kan ook volstaan met een voorlopige benaming. In dat geval is hij verplicht op een nader door de Raad
      te bepalen tijdstip een voorstel voor een definitieve benaming te doen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel29
  - number: '29.3'
    text: |-
      Het voorstel voor de benaming gaat vergezeld van een akte, inhoudende, dat de aanvrager, ingeval de voorgestelde
      benaming wordt ingeschreven, afstand doet van de rechten, die hem in enige Unie-Staat, respectievelijk in enige
      lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte, met betrekking tot deze benaming voor gelijke of gelijksoortige waren mochten toekomen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel29
  - number: '29.4'
    text: |-
      De Raad stelt de voorgestelde benaming of de in [artikel 27, vierde lid][ref1], bedoelde benaming vast, tenzij de
      Raad van oordeel is dat [artikel 27][ref2] zich daartegen verzet. In dat geval stelt de Raad de aanvrager in de
      gelegenheid een andere benaming voor te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel27
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '27'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '27'
        hoofdstuk: '4'
  - number: '29.5'
    text: |-
      De Raad verstrekt desgevraagd aan het Bureau voor de Industriële Eigendom en het Bureau van de Unie inlichtingen
      over de bij hem ingeschreven benamingen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel29
  - number: '30.1'
    text: |-
      Indien het gebruik van een ingeschreven benaming voor teeltmateriaal van het ras, waarvoor deze is ingeschreven,
      op grond van een aan een ander met betrekking tot deze benaming toekomend recht bij rechterlijke uitspraak wordt
      verboden, haalt de Raad op verzoek van de meest gerede partij de ingeschreven benaming door en schrijft hij een
      voorlopige benaming in, in overleg met degene die belang heeft bij de toelating van een ras of met de houder van
      het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel30
  - number: '30.2'
    text: |-
      De Raad stelt een gewijzigde benaming vast, na degene die belang heeft bij de toelating van een ras of de houder
      van het kwekersrecht in de gelegenheid te hebben gesteld binnen een daarbij te bepalen termijn een andere benaming
      voor te stellen en schrijft de gewijzigde benaming in. [Artikel 28][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel28
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '28'
        hoofdstuk: '4'
  - number: '30.3'
    text: |-
      Indien komt vast te staan dat een ras niet onder de ingeschreven benaming kan worden opgenomen op een door de
      Commissie van de Europese Gemeenschappen voor het gewas, waartoe het ras behoort, vastgestelde gemeenschappelijke
      rassenlijst, kan de Raad op een daartoe strekkend verzoek van de houder van het kwekersrecht, of van degene
      die om de toelating van een ras heeft verzocht, een ingeschreven benaming doorhalen en een voorlopige benaming
      inschrijven. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel30
  - number: '31.1'
    text: De Raad kan een voorlopige karakteriserende beschrijving vaststellen en inschrijven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel31
  - number: '31.2'
    text: 'De Raad kan de in het eerste lid bedoelde beschrijving aanvullen en schrijft deze aanvulling in:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel31
  - number: 31.2.a
    text: op verzoek van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel31
  - number: 31.2.b
    text: |-
      ambtshalve, indien dit in verband met de beschrijving van een ander ras noodzakelijk is, in welk geval degene
      die belang heeft bij de toelating van een ras dan wel de houder van het kwekersrecht wordt gehoord, of om andere
      redenen, maar dan alleen in overeenstemming met de hiervoor bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel31
  - number: '32'
    text: |-
      Onverminderd [artikel 3:41 van de Algemene wet bestuursrecht][ref1] worden de beslissingen van de Raad ingevolge
      dit hoofdstuk bekendgemaakt aan de in [artikel 28][ref2] bedoelde belanghebbende, degene die ingevolge de
      [artikelen 30][ref3] en [31][ref4] belang heeft bij de toelating van een ras en de in de [artikelen 30][ref5] en
      [31][ref6] bedoelde houder van het kwekersrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0018040#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0018040#Artikel31
      [ref5]: https://wetten.overheid.nl/BWBR0018040#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0018040#Artikel31
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '28'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0018040
        artikel: '30'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0018040
        artikel: '31'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0018040
        artikel: '30'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0018040
        artikel: '31'
        hoofdstuk: '4'
  - number: '33'
    text: |-
      Van de in dit hoofdstuk en de [hoofdstukken 5][ref1] en [7][ref2] bedoelde aanvragen en verzoeken en van de
      intrekking en afwijzing van de aanvragen en verzoeken wordt aantekening gedaan in het rassenregister en mededeling
      gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018040
        hoofdstuk: '7'
  - number: '34'
    text: |-
      De in dit hoofdstuk en de [hoofdstukken 5][ref1] en [7][ref2] bedoelde inschrijvingen en aantekeningen krachtens
      beslissingen, waartegen beroep openstaat, geschieden, zodra op het beroep is beslist of de beroepstermijn
      verstreken is, zonder dat beroep is ingesteld, dan wel zodra van het beroep afstand is gedaan door een
      schriftelijke daartoe strekkende kennisgeving aan de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018040
        hoofdstuk: '7'
  - number: '35.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de toelating van rassen en opstanden,
      die per gewas verschillend kunnen zijn. Deze regels kunnen in ieder geval betreffen:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: 35.1.a
    text: |-
      de eis dat op basis van een technisch onderzoek wordt vastgesteld of een ras onderscheidbaar, homogeen en bestendig
      is;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: 35.1.b
    text: |-
      de eis dat op basis van een technisch onderzoek wordt vastgesteld of een ras voldoende cultuur- en gebruikswaarde
      bezit;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: 35.1.c
    text: |-
      de eis dat op basis van een technisch onderzoek wordt vastgesteld of een opstand voor bosbouwkundige doeleinden
      voldoet aan bij of krachtens de in de aanhef bedoelde maatregel vast te stellen voorwaarden ten behoeve van de
      productie van bij die maatregel aan te wijzen categorieën van teeltmateriaal;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: 35.1.d
    text: |-
      de kenmerken waartoe het in de onderdelen a, b en c bedoelde technisch onderzoek zich uitstrekt alsmede de voor dit
      onderzoek geldende eisen en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: 35.1.e
    text: |-
      nadere eisen aan de toelating alsmede de voorwaarden waaronder en de gevallen waarin de toelating door de Raad
      wordt gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '35.2'
    text: |-
      Een ras wordt als onderscheidbaar aangemerkt indien het duidelijk te onderscheiden is van elk ander ras waarvan
      het bestaan op het tijdstip van indiening van de aanvraag algemeen bekend is. Een ras wordt als algemeen
      bekend beschouwd indien het ras op het ogenblik waarop de aanvraag tot toelating van een te beoordelen ras
      wordt ingediend, hetzij voorkomt op een vanwege de Commissie van de Europese Gemeenschappen vastgestelde
      gemeenschappelijke lijst van rassen, hetzij is toegelaten dan wel het onderwerp is van een aanvraag tot toelating
      in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '35.3'
    text: |-
      Een ras wordt als homogeen aangemerkt, indien het, behoudens de variatie die mag worden verwacht van de
      bijzonderheden die eigen zijn aan de vermeerdering ervan, voldoende eenvormig is wat zijn van belang zijnde
      eigenschappen betreft.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '35.4'
    text: |-
      Een ras wordt als bestendig aangemerkt indien zijn van belang zijnde eigenschappen onveranderd blijven na
      achtereenvolgende vermeerderingen of, in het geval van een bijzondere vermeerderingscyclus, aan het einde van
      iedere cyclus.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '35.5'
    text: |-
      Een ras bezit voldoende cultuur- en gebruikswaarde wanneer het ten opzichte van andere in Nederland toegelaten
      rassen door het geheel van zijn hoedanigheden, ten minste voor de productie in een bepaald gebied, een duidelijke
      verbetering betekent voor hetzij de teelt, hetzij de valorisatie van de oogst of van de daaruit verkregen
      producten. Een lager niveau van bepaalde eigenschappen kan door andere gunstige eigenschappen gecompenseerd worden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '35.6'
    text: |-
      Het in het eerste lid, onderdeel a, b en c, bedoelde technisch onderzoek wordt uitgevoerd onder
      verantwoordelijkheid van de Raad. Bij of krachtens de in het eerste lid bedoelde maatregel kunnen regels worden
      gesteld over de gevallen waarin en de voorwaarden waaronder de Raad ten behoeve van het technisch onderzoek van een
      ras gebruik kan maken van reeds met betrekking tot dat ras bestaande onderzoeksrapporten of van de resultaten van
      door de aanvrager zelf verrichte onderzoeken en bij de teelt opgedane praktische ervaringen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel35
  - number: '36.1'
    text: De Raad beslist op aanvraag omtrent de toelating van een ras of van een opstand.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
  - number: '36.2'
    text: 'De aanvraag voor de toelating van een ras bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
  - number: 36.2.a
    text: |-
      een voorstel voor de benaming van het ras, bedoeld in [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel29
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '29'
        hoofdstuk: '4'
  - number: 36.2.b
    text: een karakteriserende beschrijving van het ras en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
  - number: 36.2.c
    text: |-
      een nauwkeurige aanduiding van de eigenschappen, waardoor het ras zich van andere rassen van hetzelfde gewas
      onderscheidt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
  - number: '36.3'
    text: |-
      Een voor het technisch onderzoek, bedoeld in [artikel 35, eerste lid, onderdelen a en b][ref1], voldoende
      hoeveelheid van het materiaal van het ras, waarop de aanvraag betrekking heeft, wordt op vordering van de Raad en
      overeenkomstig nader door de Raad te stellen eisen aan de Raad ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
  - number: '36.4'
    text: |-
      De aanvraag voor de toelating van een opstand bevat een vermelding van de eigenaar of beheerder van de opstand, een
      vermelding van de locatie van de opstand alsmede een karakteriserende beschrijving van de opstand.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel36
  - number: '37.1'
    text: |-
      Een toegelaten ras, onderscheidenlijk een toegelaten opstand, wordt ingeschreven in het rassenregister, waarbij
      gelijktijdig met de inschrijving van het ras, onderscheidenlijk van de opstand, aantekening wordt gedaan van
      de toelating en van de krachtens [artikel 39, derde lid][ref1], aangewezen instandhouder of instandhouders,
      onderscheidenlijk van de eigenaar of beheerder van de opstand.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel39
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '39'
        hoofdstuk: '6'
  - number: '37.2'
    text: |-
      De toelating verkrijgt als dagtekening en begint te werken de dag, onmiddellijk volgend op die waarop de in het
      vorige lid bedoelde inschrijving en aantekening in het rassenregister zijn gedaan.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
  - number: '37.3'
    text: 'De Raad draagt er zorg voor dat een toegelaten ras, dat zich niet duidelijk onderscheidt van:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
  - number: 37.3.a
    text: een ras dat voorheen in Nederland of een andere lidstaat was toegelaten, of
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
  - number: 37.3.b
    text: |-
      een ander ras dat is beoordeeld op onderscheidbaarheid, homogeniteit en bestendigheid volgens regels die
      overeenkomen met de op grond van [artikel 35][ref1] gestelde regels zonder evenwel een algemeen bekend ras als
      bedoeld in [artikel 35, tweede lid][ref2], te zijn,


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel35
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
  - number: '37.4'
    text: |-
      Het vorige lid is niet van toepassing indien de in dat lid bedoelde benaming misleidend is of verwarrend kan werken
      voor wat het ras betreft, of indien andere feiten het gebruik ervan beletten, of indien een recht van een derde het
      vrije gebruik van deze benaming voor het betrokken ras in de weg staat.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel37
  - number: '38.1'
    text: |-
      De toelating van een ras of opstand vervalt van rechtswege, zodra zes maanden zijn verstreken sinds de vergoeding,
      bedoeld in [artikel 6, tweede lid, onderdeel f][ref1], verschuldigd is geworden, zonder dat betaling daarvan heeft
      plaats gehad. Van dit vervallen wordt in het rassenregister aantekening gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel6
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '6'
        hoofdstuk: '2'
  - number: '38.2'
    text: |-
      Indien binnen veertien dagen na de vervaldag niet is betaald wordt degene, die volgens het rassenregister
      instandhouder van het ras is, dan wel de aanvrager van de toelating van een opstand, door de Raad bij aangetekende
      brief aan zijn verplichting tot betaling herinnerd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel38
  - number: '39.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van bij die maatregel aan te wijzen gewassen
      regels gesteld over het in de handel brengen van teeltmateriaal van tot die gewassen behorende rassen of opstanden.
      Deze regels kunnen onder meer inhouden:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: 39.1.a
    text: |-
      de voorwaarde dat uitsluitend teeltmateriaal in de handel wordt gebracht, indien het afkomstig is van een ras dat
      of een opstand die is toegelaten en is ingeschreven in het rassenregister, dan wel is opgenomen op een vanwege de
      Commissie van de Europese Gemeenschappen vastgestelde gemeenschappelijke lijst van rassen of opstanden;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: 39.1.b
    text: de voorwaarde dat slechts bepaalde categorieën van teeltmateriaal in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: 39.1.c
    text: |-
      de voorwaarde dat bepaalde categorieën van teeltmateriaal uitsluitend in de handel worden gebracht door de houder
      van het kwekersrecht van het desbetreffende ras, of, indien voor het ras geen kwekersrecht bestaat, door de voor
      het ras bij de Raad geregistreerde instandhouders.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.2'
    text: 'Bij of krachtens de in het eerste lid bedoelde maatregel kunnen tevens regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: 39.2.a
    text: |-
      het toezicht op de instandhouding en het in de handel brengen van teeltmateriaal van een ras dat niet langer in
      stand gehouden wordt;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: 39.2.b
    text: |-
      het in de handel brengen met het oog op uitvoer buiten het grondgebied van de Europese Unie van teeltmateriaal van
      rassen en opstanden die niet voldoen aan de in het eerste lid, onder a gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.3'
    text: |-
      De registratie van instandhouders, bedoeld in het eerste lid, onderdeel c, geschiedt door de Raad op aanwijzing
      van de keuringsinstelling. Indien dit om kweektechnische redenen noodzakelijk is, wijst de Raad één instandhouder
      aan. Deze laatste is verplicht onder daartoe door de Raad te stellen voorwaarden aan anderen, die daartoe de wens
      kenbaar hebben gemaakt, voor de voortbrenging van teeltmateriaal geschikt materiaal te verstrekken.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.4'
    text: |-
      Ten aanzien van gewassen, waarvoor bij bindend besluit van de Raad van de Europese Unie, van het Europees Parlement
      en de Raad gezamenlijk of van de Commissie van de Europese Gemeenschappen regels zijn gesteld omtrent het in de
      handel brengen, die ingevolge de Overeenkomst betreffende de Europese Economische Ruimte van toepassing zijn op
      het gehele grondgebied van de Europese Economische Ruimte, zijn het eerste lid, onderdeel a, en het tweede lid,
      onderdeel b, van overeenkomstige toepassing op het grondgebied van de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.5'
    text: |-
      In afwijking van de krachtens het eerste lid gestelde regels is het toegestaan kleine hoeveelheden teeltmateriaal
      in de handel te brengen voor wetenschappelijke of kweekdoeleinden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.6'
    text: |-
      In afwijking van de krachtens het eerste lid gestelde regels kan een keuringsinstelling op verzoek toestemming
      verlenen, hetzij om voor een bepaalde tijd teeltmateriaal in de handel te brengen, hetzij voor het in de
      handel brengen van passende hoeveelheden teeltmateriaal voor onderzoeks- en beproevingsdoeleinden of voor de
      instandhouding van de genetische diversiteit, voor zover het gaat om teeltmateriaal van een ras of opstand waarvoor
      in tenminste één lidstaat van de Europese Unie een aanvraag tot toelating is ingediend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '39.7'
    text: |-
      De voorwaarden waaronder de in het zesde lid bedoelde toestemming kan worden gegeven alsmede de in dat lid bedoelde
      hoeveelheden worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel39
  - number: '40.1'
    text: |-
      Het is verboden teeltmateriaal in de handel te brengen waarvan niet op basis van een keuring is vastgesteld dat
      het voldoet aan de bij of krachtens algemene maatregel van bestuur gestelde regels inzake de kwaliteit van het
      teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: '40.2'
    text: 'De in het eerste lid bedoelde regels kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: 40.2.a
    text: de rasechtheid, de gezondheid, de groeikracht, de afmetingen en de zuiverheid van het teeltmateriaal;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: 40.2.b
    text: |-
      de sortering, de classificatie, de verzorging, de verpakking, de verlading en de aanduiding of etikettering van het
      teeltmateriaal, voor zover verband houdende met de in onderdeel a genoemde onderwerpen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: 40.2.c
    text: de technische inrichting en administratie van het bedrijf alsmede de technische bedrijfsvoering en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: 40.2.d
    text: de wijze van keuring van het teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel40
  - number: '41.1'
    text: |-
      Indien bij of krachtens een algemene maatregel van bestuur als bedoeld in [artikel 40][ref1] regels zijn
      gesteld omtrent de keuring van teeltmateriaal, kunnen daarbij bewijsstukken en kentekenen worden vastgesteld
      als uitsluitend bestemd om door of vanwege de daartoe gerechtigde op teeltmateriaal of de verpakking te worden
      aangebracht, dan wel bij het teeltmateriaal te worden gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel40
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '40'
        hoofdstuk: '6'
  - number: '41.2'
    text: |-
      Bij of krachtens een maatregel als bedoeld in [artikel 40][ref1] kunnen voorts regels worden gesteld betreffende
      het uitreiken, vervaardigen, voorhanden en in voorraad hebben, alsmede het afleveren en gebruiken van bewijsstukken
      en kentekenen en van cliché’s, stempels en andere werktuigen tot het vervaardigen of aanbrengen van die
      bewijsstukken en kentekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel40
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '40'
        hoofdstuk: '6'
  - number: '42.1'
    text: |-
      Het is leveranciers verboden teeltmateriaal van door Onze Minister aangewezen gewassen in de handel te brengen
      zonder daartoe strekkende erkenning of registratie door een keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel42
  - number: '42.2'
    text: |-
      Een erkenning of registratie is slechts geldig voor een daarbij genoemde periode voor de daarbij genoemde
      handelingen met betrekking tot teeltmateriaal van daarbij genoemde gewassen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel42
  - number: '42.3'
    text: |-
      Aan een erkenning of registratie kunnen door de keuringsinstelling voorwaarden of voorschriften worden verbonden.
      Een erkenning of registratie kan onder beperkingen worden verleend, onderscheidenlijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel42
  - number: '42.4'
    text: |-
      Het eerste lid is niet van toepassing op leveranciers die alleen verkopen of leveren aan personen die zich niet
      beroepshalve bezighouden met de productie van gewassen of het in de handel brengen van teeltmateriaal.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel42
  - number: '43.1'
    text: |-
      Een erkenning of registratie als bedoeld in [artikel 42][ref1] wordt op verzoek verleend, onderscheidenlijk vindt
      op verzoek plaats indien is voldaan aan de bij of krachtens algemene maatregel van bestuur gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '42'
        hoofdstuk: '6'
  - number: '43.2'
    text: 'De in het eerste lid bedoelde eisen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
  - number: 43.2.a
    text: de technische inrichting van het bedrijf;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
  - number: 43.2.b
    text: het productieproces en de opslag;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
  - number: 43.2.c
    text: documentatie met betrekking tot het productieproces, de opslag of de aflevering en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
  - number: 43.2.d
    text: voorzieningen ten behoeve van het toezicht op de naleving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel43
  - number: '44'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het indienen van een aanvraag tot erkenning of registratie
      dan wel tot verlenging of wijziging daarvan alsmede omtrent de wijze van behandeling. Daarbij kan onder meer worden
      bepaald:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel44
  - number: 44.a
    text: welke gegevens en bescheiden worden overgelegd alvorens een aanvraag in behandeling wordt genomen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel44
  - number: 44.b
    text: |-
      binnen welke termijn na wijziging van de in onderdeel a bedoelde gegevens een wijziging van de erkenning of
      registratie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel44
  - number: '45'
    text: |-
      Een erkenning of registratie als bedoeld in [artikel 42][ref1] kan door de keuringsinstelling worden geschorst,
      ingetrokken dan wel doorgehaald, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel42
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '42'
        hoofdstuk: '6'
  - number: 45.a
    text: de handelingen waarvoor de erkenning is verleend of registratie heeft plaatsgevonden, niet meer worden verricht, of
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel45
  - number: 45.b
    text: |-
      niet meer aan de in [artikel 43][ref1] bedoelde eisen wordt voldaan, nadat de houder van de erkenning of de
      registratie een redelijke termijn tot aanpassing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel43
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '43'
        hoofdstuk: '6'
  - number: '46.1'
    text: |-
      Onverminderd het recht tot het voeren van een handelsnaam en een merk wordt teeltmateriaal van een ingevolge
      het bepaalde bij of krachtens deze wet in het rassenregister ingeschreven ras uitsluitend onder de ingeschreven
      benaming in de handel gebracht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: '46.2'
    text: |-
      Indien in enig land voor een ras een andere benaming is voorgeschreven dan de hier te lande ingeschreven benaming,
      wordt teeltmateriaal van dat ras slechts naar dat land uitgevoerd onder de aldaar voorgeschreven benaming.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: '46.3'
    text: |-
      In afwijking van het eerste lid wordt teeltmateriaal van een ingeschreven ras uitgevoerd onder een in het land van
      invoer gebruikelijke benaming:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: 46.3.a
    text: naar andere dan Unie-staten, voor zover het een ras betreft waarvoor kwekersrecht is verleend, dan wel
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: 46.3.b
    text: |-
      naar andere staten dan één der lidstaten van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, voor zover het een ras betreft waarvoor geen kwekersrecht is verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: '46.4'
    text: |-
      De ingeschreven benaming of een daarmee overeenstemmend woord wordt niet gebruikt voor ander teeltmateriaal van
      hetzelfde of een verwant gewas.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel46
  - number: '47.1'
    text: |-
      De keuringsinstelling draagt er zorg voor dat teeltmateriaal, dat niet aan de bij of krachtens dit hoofdstuk
      gestelde regels voldoet, uit de handel wordt genomen. Hiertoe verplicht de keuringsinstelling de overtreder
      schriftelijk om binnen een door haar te bepalen termijn ondeugdelijk teeltmateriaal uit de handel te nemen, op te
      slaan of te vernietigen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel47
  - number: '47.2'
    text: |-
      Indien een overtreder niet binnen de in het eerste lid bedoelde termijn maatregelen als bedoeld in dat lid treft,
      is de keuringsinstelling bevoegd op kosten van de overtreder zelf zodanige maatregelen te treffen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel47
  - number: '47.3'
    text: |-
      De keuringsinstelling kan van de overtreder bij dwangbevel de ingevolge het tweede lid verschuldigde
      kosten, verhoogd met de wettelijke rente en de op de invordering vallende kosten, invorderen.
      [Artikel 21, vijfde lid, tweede volzin, en zesde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel21
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '21'
        hoofdstuk: '3'
  - number: '48.1'
    text: Onze Minister kan vrijstelling of ontheffing verlenen van het bepaalde bij of krachtens dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel48
  - number: '48.2'
    text: 'Vrijstellingen en ontheffingen worden slechts verleend:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel48
  - number: 48.2.a
    text: om de markt te kunnen voorzien van voldoende teeltmateriaal van gewassen waarvan de teelt van belang is, of
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel48
  - number: 48.2.b
    text: ten behoeve van het uitvoeren van tijdelijke experimenten.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel48
  - number: '48.3'
    text: Aan vrijstellingen en ontheffingen kunnen voorwaarden en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel48
  - number: '49.1'
    text: |-
      Kwekersrecht kan worden verleend voor rassen van alle tot het plantenrijk behorende gewassen, voor zover het rassen
      betreft die nieuw, onderscheidbaar, homogeen en bestendig zijn.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: '49.2'
    text: |-
      Een ras wordt als nieuw aangemerkt indien op het tijdstip van indiening van de aanvraag tot verlening van
      kwekersrecht geen teeltmateriaal of geoogst materiaal van het ras is verkocht of anderszins ter beschikking is
      gesteld aan derden, door of met toestemming van de kweker, met het oog op de exploitatie van het ras, voor een
      periode:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: 49.2.a
    text: 'in Nederland: niet langer geleden dan een jaar voorafgaande aan het in de aanhef bedoelde tijdstip;'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: 49.2.b
    text: |-
      buiten Nederland: hetzij niet langer geleden dan vier jaar, hetzij, ingeval van bomen of wijnstokken, niet langer
      geleden dan zes jaar, voorafgaande aan het in de aanhef bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: '49.3'
    text: |-
      Voor de toepassing van het tweede lid wordt het feit, dat materiaal van een ras reeds aan anderen ter beproeving is
      verstrekt, niet aan de kweker van dat ras of zijn rechtverkrijgende tegengeworpen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: '49.4'
    text: |-
      Een ras wordt als onderscheidbaar aangemerkt indien het duidelijk te onderscheiden is van elk ander ras waarvan het
      bestaan op het tijdstip van indiening van de aanvraag algemeen bekend is. In ieder geval worden als algemeen bekend
      beschouwd rassen waarvoor in enig land een aanvraag tot verlening van kwekersrecht of tot inschrijving van dat
      ras in een officieel rassenregister is ingediend, vanaf de datum van de aanvraag, mits de aanvraag leidt of heeft
      geleid tot verlening van kwekersrecht of inschrijving in het rassenregister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: '49.5'
    text: |-
      Een ras wordt als homogeen aangemerkt, indien wordt voldaan aan [artikel 35, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
  - number: '49.6'
    text: |-
      Een ras wordt als bestendig aangemerkt indien wordt voldaan aan [artikel 35, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
  - number: '49.7'
    text: |-
      Om te bepalen of een ras voldoet aan de in het vierde tot en met het zesde lid bedoelde voorwaarden, wordt onder
      verantwoordelijkheid van de Raad een technisch onderzoek uitgevoerd. De kenmerken waartoe het onderzoek zich
      uitstrekt en de eisen waaraan het onderzoek voldoet, worden bij ministeriële regeling vastgesteld. Hierbij kunnen
      regels worden gesteld over de gevallen waarin en de voorwaarden waaronder de Raad ten behoeve van het technisch
      onderzoek van een ras gebruik kan maken van reeds met betrekking tot dat ras bestaande onderzoeksrapporten of van
      de resultaten van door de aanvrager zelf verrichte onderzoeken en bij de teelt opgedane praktische ervaringen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel49
  - number: '50.1'
    text: De aanspraak op verlening van kwekersrecht komt uitsluitend toe aan de kweker.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel50
  - number: '50.2'
    text: |-
      Indien het ras buiten Nederland hetzij door een natuurlijke persoon, die niet de Nederlandse nationaliteit bezit,
      hetzij door een rechtspersoon zonder zetel in Nederland, is gekweekt of ontdekt en ontwikkeld, bestaat gelijke
      aanspraak op verlening van kwekersrecht voor zover Nederland krachtens een internationale overeenkomst gehouden is
      kwekersrecht te verlenen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel50
  - number: '50.3'
    text: |-
      Indien een ras buiten Nederland is gekweekt of ontdekt en ontwikkeld, terwijl de in het tweede lid bedoelde
      gehoudenheid niet bestaat, kan voor het ras kwekersrecht worden verleend, indien het een ras betreft waarvoor zowel
      in het land waar het ras is gekweekt als in Nederland kwekersrecht kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel50
  - number: '51.1'
    text: |-
      Indien de kweker een ras heeft gekweekt of heeft ontdekt en ontwikkeld in het kader van een dienstbetrekking of in
      het kader van een overeenkomst tot het verrichten van diensten ten behoeve van een ander, anders dan tegen loon,
      welke dienstbetrekking of overeenkomst met zich brengt, dat de kweker kweek- of ontwikkelingsarbeid verricht met
      betrekking tot het gewas, waartoe het ras behoort, komt de aanspraak op verlening van kwekersrecht in afwijking
      van [artikel 50][ref1] toe aan de werkgever dan wel de opdrachtgever dan wel de rechtverkrijgende van de werkgever
      of opdrachtgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel50
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '50'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '51.2'
    text: |-
      In het geval, bedoeld in het eerste lid, heeft de kweker aanspraak op een vergoeding naar billijkheid, tenzij een
      zodanige vergoeding reeds geacht kan worden begrepen te zijn in het door de kweker genoten loon of in de door deze
      genoten voordelen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel51
  - number: '51.3'
    text: Elk beding waarbij van het tweede lid wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel51
  - number: '52'
    text: |-
      Indien twee of meer personen, anders dan in het geval bedoeld in [artikel 53][ref1], in samenwerking een nieuw ras
      hebben gekweekt dan wel ontdekt en ontwikkeld, hebben zij gezamenlijk aanspraak op verlening van kwekersrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel53
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '53'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '53'
    text: |-
      Indien ingevolge [artikel 52][ref1] twee of meer personen onafhankelijk van elkaar aanspraak op verlening van
      kwekersrecht voor hetzelfde nieuw ras zouden kunnen maken, komt de aanspraak op verlening van kwekersrecht toe aan
      degene, die het eerst een aanvraag daartoe heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel52
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '52'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '54.1'
    text: |-
      Een kweker die in een andere Unie-staat overeenkomstig de geldende voorschriften een aanvraag tot verlening van
      kwekersrecht heeft ingediend, geniet ter verkrijging van kwekersrecht in Nederland voor hetzelfde ras een recht van
      voorrang, mits:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel54
  - number: 54.1.a
    text: |-
      binnen twaalf maanden na het indienen van de aanvraag in de desbetreffende Unie-staat, de dag van de aanvraag niet
      meegerekend, in Nederland een voorlopige aanvraag wordt ingediend waarbij een schriftelijk beroep wordt gedaan op
      het recht van voorrang;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel54
  - number: 54.1.b
    text: |-
      binnen drie maanden na de indiening van de voorlopige aanvraag een door de bevoegde autoriteit van de
      desbetreffende Unie-staat gewaarmerkt afschrift van de aldaar ingediende stukken wordt overgelegd; en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel54
  - number: 54.1.c
    text: |-
      binnen twee jaren na afloop van de onder a genoemde termijn een volledige aanvraag als bedoeld in
      [artikel 55][ref1] wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel55
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '55'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '54.2'
    text: |-
      De voorrang houdt in, dat in afwijking in zoverre van de [artikelen 49 tot en met 53][ref1], op een overeenkomstig
      het tweede lid, onderdeel c, in Nederland ingediende aanvraag niet van invloed is wat in de tijd gelegen tussen
      de indiening van de aanvraag in het andere land en de voorlopige aanvraag is geschied, en in het bijzonder niet de
      indiening van een aanvraag door een ander of het in de handel brengen van teeltmateriaal van het ras.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '55.1'
    text: De aanvraag tot verlening van kwekersrecht wordt ingediend bij de Raad.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
  - number: '55.2'
    text: 'De aanvraag bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
  - number: 55.2.a
    text: |-
      een voorstel voor de benaming van het ras, overeenkomstig de daarvoor in [hoofdstuk 4][ref1] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '4'
  - number: 55.2.b
    text: een karakteriserende beschrijving van het ras; en
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
  - number: 55.2.c
    text: |-
      een nauwkeurige aanduiding van de eigenschappen, waardoor het ras zich van andere rassen van hetzelfde gewas
      onderscheidt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
  - number: '55.3'
    text: |-
      Een voor het onderzoek, bedoeld in [artikel 49, zevende lid][ref1], voldoende hoeveelheid materiaal van het ras,
      waarop de aanvraag betrekking heeft, wordt op vordering van de Raad en overeenkomstig nader door de Raad te stellen
      eisen aan de Raad ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '55.4'
    text: |-
      Indien een aanvrager geen woonplaats of zetel binnen het grondgebied van de Europese Unie heeft, is deze verplicht
      binnen Nederland domicilie te kiezen bij een gemachtigde, welke keuze voor de toepassing van deze wet geacht wordt
      van kracht te blijven totdat schriftelijk aan de Raad is kennis gegeven van de wijziging van het gekozen domicilie.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel55
  - number: '56.1'
    text: |-
      De Raad beslist op een aanvraag tot verlening van kwekersrecht en stelt overeenkomstig [hoofdstuk 4][ref1] de
      karakteriserende beschrijving en de benaming van het ras vast.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '4'
  - number: '56.2'
    text: |-
      Bij de inschrijving van het ras in het rassenregister wordt gelijktijdig aantekening gedaan van de verlening van
      het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel56
  - number: '56.3'
    text: |-
      Het kwekersrecht verkrijgt als dagtekening en begint te werken de dag, onmiddellijk volgend op die waarop de in het
      vorige lid bedoelde inschrijving en aantekening in het rassenregister is gedaan.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel56
  - number: '57.1'
    text: |-
      De houder van een kwekersrecht op een ras heeft het uitsluitend recht teeltmateriaal van dat ras voort te brengen
      of verder te vermeerderen, ten behoeve van de vermeerdering te behandelen, in de handel te brengen, uit te voeren,
      in te voeren, voor een van deze doeleinden in voorraad te hebben alsmede deze handelingen te doen verrichten.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: '57.2'
    text: |-
      Het is aan anderen dan de houder van het kwekersrecht verboden de in het eerste lid genoemde handelingen te
      verrichten. Dit verbod geldt niet indien bij of krachtens deze wet of door de houder van het kwekersrecht daarvoor
      toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: '57.3'
    text: 'Het verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: 57.3.a
    text: handelingen die in de privé-sfeer en niet bedrijfsmatig worden verricht;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: 57.3.b
    text: handelingen die uitsluitend worden verricht ten behoeve van wetenschappelijk onderzoek;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: 57.3.c
    text: handelingen die worden verricht voor het kweken van nieuwe rassen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: '57.4'
    text: |-
      Het uitsluitend recht is tevens van toepassing op handelingen met betrekking tot geoogst materiaal van het
      ras, planten en plantendelen daaronder begrepen, dat is verkregen door gebruik van teeltmateriaal waarvoor geen
      toestemming is verleend, tenzij de houder van het kwekersrecht redelijkerwijs zijn recht met betrekking tot het
      teeltmateriaal had kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: '57.5'
    text: |-
      Het uitsluitend recht is tevens van toepassing op handelingen met betrekking tot producten die rechtstreeks zijn
      vervaardigd met gebruikmaking van geoogst materiaal van het ras waarvoor geen toestemming is verleend, tenzij
      de houder van het kwekersrecht redelijkerwijs zijn recht met betrekking tot het geoogste materiaal had kunnen
      uitoefenen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel57
  - number: '58.1'
    text: |-
      Het in [artikel 57, eerste lid][ref1], bedoelde uitsluitend recht is tevens van toepassing op de in dat lid
      bedoelde handelingen met betrekking tot materiaal van:


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 58.1.a
    text: |-
      rassen, die zijn afgeleid van het in [artikel 57, eerste lid][ref1], bedoelde beschermde ras, tenzij het beschermde
      ras zelf is afgeleid van een ander ras;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 58.1.b
    text: |-
      rassen die ingevolge [artikel 49, vierde lid][ref1], niet duidelijk onderscheidbaar zijn van het beschermde ras;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 58.1.c
    text: rassen waarvan voor de voortbrenging telkens gebruik wordt gemaakt van het beschermde ras.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: '58.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt een ras beschouwd als afgeleid van een ander ras indien
      het eerstbedoelde ras:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: 58.2.a
    text: |-
      hoofdzakelijk is afgeleid van het oorspronkelijke ras dan wel van een ras dat zelf hoofdzakelijk is afgeleid van
      het oorspronkelijke ras,
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: 58.2.b
    text: |-
      op grond van [artikel 49, vierde lid][ref1], duidelijk onderscheidbaar is van het oorspronkelijke ras, en


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 58.2.c
    text: |-
      overeenkomt met het oorspronkelijke ras voor wat betreft de expressie van de wezenlijke eigenschappen, die
      voortvloeit uit het genotype of de combinatie van genotypen van het oorspronkelijke ras, zulks met uitzondering van
      afwijkingen die voortvloeien uit de afleidingshandeling.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: '58.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op rassen waarvan het bestaan op het tijdstip van
      inwerkingtreding van de [Uitvoeringswet UPOV 1991][ref1] algemeen bekend was. [Artikel 49, derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008141
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0008141
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '58.4'
    text: |-
      De Raad kan op verzoek adviseren omtrent de vraag of een bij het verzoek aan te wijzen ras is afgeleid van een ras
      waarvoor door de Raad kwekersrecht is verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: '58.5'
    text: Het in het vierde lid bedoelde advies van de Raad bevat de gronden waarop het rust.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel58
  - number: '59.1'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ten aanzien van een ras, behorende tot bij die algemene
      maatregel van bestuur aan te wijzen gewassen, het in [artikel 57, eerste lid][ref1], bedoelde uitsluitend recht
      niet van toepassing is op het gebruik voor vermeerderingsdoeleinden binnen het eigen bedrijf van een teler van door
      die teler geoogst materiaal van dat ras of een ras als bedoeld in [artikel 58, eerste lid, onderdeel a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel58
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '59.2'
    text: |-
      Aan het gebruik van geoogst materiaal voor vermeerderingsdoeleinden binnen het eigen bedrijf, kunnen bij of
      krachtens de in het eerste lid bedoelde algemene maatregel van bestuur beperkingen of voorwaarden worden gesteld,
      die onder meer betrekking kunnen hebben op de maximale hoeveelheid te vermeerderen geoogst materiaal, de door de
      teler aan de houder van het kwekersrecht te verstrekken inlichtingen en bewijsstukken en de aan de houder van een
      kwekersrecht toekomende vergoedingen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel59
  - number: '60'
    text: |-
      Het in [artikel 57, eerste lid][ref1], bedoelde uitsluitend recht is niet van toepassing op handelingen met
      materiaal van het beschermde ras of van een ras als bedoeld in [artikel 58, eerste lid][ref2], dat door of met
      toestemming van de houder van het kwekersrecht, in Nederland of in één der lidstaten van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het verkeer is
      gebracht of dat van zodanig materiaal is afgeleid, met uitzondering van handelingen:


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel58
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '58'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 60.a
    text: die een verdere vermeerdering van het ras, waartoe het materiaal behoort, inhouden;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel60
  - number: 60.b
    text: |-
      die uitvoer, anders dan voor verbruiksdoeleinden, van het materiaal inhouden naar een land, waar voor rassen van
      het gewas, waartoe het ras behoort, geen bescherming openstaat die vergelijkbaar is met de bescherming die op basis
      van het bepaalde in deze wet kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel60
  - number: '61.1'
    text: De houder van een kwekersrecht is verplicht de licenties te verlenen die in het algemeen belang noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel61
  - number: '61.2'
    text: |-
      De in het vorige lid bedoelde verplichting houdt mede in, dat de houder van het kwekersrecht het voor de
      uitoefening van de licentie noodzakelijke teeltmateriaal tegen een redelijke vergoeding verstrekt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel61
  - number: '61.3'
    text: |-
      De houder van een kwekersrecht is verplicht aan een octrooihouder een licentie te verlenen tegen een redelijke
      vergoeding, indien de octrooihouder een octrooi voor een biotechnologische uitvinding niet kan exploiteren
      zonder inbreuk te maken op het kwekersrecht van eerdere datum en de biotechnologische uitvinding een belangrijke
      technische vooruitgang van aanzienlijk economisch belang vertegenwoordigt ten opzichte van het beschermde ras.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel61
  - number: '61.4'
    text: |-
      Indien aan de houder van een kwekersrecht een licentie is verleend op grond van
      [artikel 57, vijfde lid, van de Rijksoctrooiwet 1995][ref1], is de houder van het kwekersrecht verplicht aan de
      octrooihouder op diens verzoek onder redelijke voorwaarden een wederkerige licentie te verlenen om het beschermde
      ras te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
  - number: '62.1'
    text: |-
      Indien de houder van het kwekersrecht zijn verplichtingen, bedoeld in [artikel 61][ref1], niet nakomt, wordt de
      licentie op verzoek van de belanghebbende door de Raad verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel61
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '62.2'
    text: |-
      Alvorens te beslissen stelt de Raad partijen in de gelegenheid binnen een door hem te bepalen termijn alsnog tot
      overeenstemming te komen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel62
  - number: '62.3'
    text: |-
      Bij gebreke van overeenstemming beslist de Raad, na partijen te hebben gehoord. In de beslissing worden de
      omvang van de licentie, het bedrag van de aan de houder van het kwekersrecht te betalen vergoeding, alsmede de
      te verstrekken hoeveelheid teeltmateriaal en de daarvoor te betalen vergoeding vastgesteld. De Raad kan bij de
      beslissing aan de verkrijger van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel62
  - number: '62.4'
    text: |-
      Nadat de licentie door de Raad is verleend en aan de verplichting tot het stellen van zekerheid, indien deze
      is opgelegd, is voldaan, wordt de licentie in het rassenregister ingeschreven. De licentie werkt eerst na die
      inschrijving, ook tegenover hen, die na de inschrijving van het in het eerste lid bedoelde verzoek rechten op het
      kwekersrecht hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel62
  - number: '63.1'
    text: |-
      Door een licentie wordt de bevoegdheid verkregen de daarin omschreven handelingen te verrichten, die krachtens
      [artikel 57, eerste lid][ref1], aan anderen dan de houder van het kwekersrecht niet vrijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '63.2'
    text: |-
      Bij gebreke van andere bepalingen geldt een licentie voor de gehele duur van het kwekersrecht en heeft zij
      betrekking op alle handelingen die ingevolge deze wet aan de toestemming van de houder van het kwekersrecht
      onderworpen zijn.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel63
  - number: '63.3'
    text: |-
      Een licentie, verleend anders dan ingevolge de [artikelen 61][ref1] en [62][ref2], wordt op verzoek van de
      licentiehouder in het rassenregister ingeschreven. Zij is tegenover derden geldig na die inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel62
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '61'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '62'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '64'
    text: |-
      Een krachtens [artikel 19][ref1] aangewezen keuringsinstelling alsmede een krachtens
      [artikel 8 van de Landbouwkwaliteitswet][ref2] aangewezen controle-instelling, voor zover deze bij of krachtens
      [die wet][ref3] is belast met de keuring van teeltmateriaal, verstrekt op verzoek aan de houder van een in
      Nederland geldend kwekersrecht met betrekking tot het door de keuringsinstelling, onderscheidenlijk controle-
      instelling, gekeurde teeltmateriaal, een overzicht van de personen of ondernemingen die teeltmateriaal van het ras,
      waarvoor het kwekersrecht is verleend, hebben voortgebracht en, voor zover mogelijk, van de hoeveelheden die zij
      daarvan hebben voortgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002755#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0002755
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002755
  - number: '65.1'
    text: |-
      Een kwekersrecht en een aanspraak op verlening van kwekersrecht zijn, zowel ten aanzien van het volle recht als
      voor een aandeel daarin, vatbaar voor overdracht of andere overgang.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel65
  - number: '65.2'
    text: |-
      De levering vereist voor de overdracht van een kwekersrecht of het recht, voortvloeiende uit een aanvraag tot
      verlening van kwekersrecht, geschiedt bij een akte.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel65
  - number: '65.3'
    text: |-
      Elk voorbehoud de overdracht betreffende wordt in de akte omschreven; bij gebreke daarvan geldt de overdracht voor
      onbeperkt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel65
  - number: '65.4'
    text: De overdracht werkt tegenover derden eerst, wanneer de akte in het rassenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel65
  - number: '65.5'
    text: Tot het doen verrichten van deze inschrijving door de Raad zijn beide partijen gelijkelijk bevoegd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel65
  - number: '66.1'
    text: |-
      Indien een kwekersrecht aan meer personen gezamenlijk toekomt, wordt hun verhouding tegenover elkaar en tegenover
      derden beheerst door hetgeen tussen hen bij overeenkomst is bepaald, wat hun verhouding tegenover derden betreft
      echter slechts, voor zover deze blijkt uit het rassenregister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel66
  - number: '66.2'
    text: |-
      Indien er geen overeenkomst bestaat, of, indien in de overeenkomst niet anders is bepaald, heeft elke
      medegerechtigde de bevoegdheid het kwekersrecht uit te oefenen en tegen handelingen in strijd daarmee verricht op
      te treden, maar kan een licentie of de toestemming, bedoeld in de [artikelen 57, tweede lid][ref1], en [60][ref2],
      door de medegerechtigden slechts met gemeen goedvinden verleend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel60
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '60'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '66.3'
    text: |-
      Iedere medegerechtigde is verplicht, vóór de vervreemding van zijn rechten aan een derde, deze aan zijn
      medegerechtigden tegen een redelijke prijs te koop aan te bieden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel66
  - number: '67.1'
    text: |-
      Pandrecht op een kwekersrecht wordt gevestigd bij een akte en werkt tegenover derden eerst wanneer de akte in het
      rassenregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel67
  - number: '67.2'
    text: |-
      De pandhouder is verplicht in een door hem ondertekende verklaring, bij de Raad in te zenden, woonplaats te kiezen
      te ’s-Gravenhage. Indien die keuze niet is gedaan, geldt de zetel van de Raad als gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel67
  - number: '67.3'
    text: |-
      Bedingen in de akte waarbij het pandrecht is gevestigd, betreffende na inschrijving te verlenen licenties, gelden
      van het ogenblik af, dat zij in het rassenregister zijn aangetekend, ook tegenover derden. Bedingen als bedoeld
      in de eerste volzin, betreffende vergoedingen voor licenties, die op het ogenblik der inschrijving reeds waren
      verleend, gelden tegenover de houder der licentie na aanzegging aan deze bij deurwaardersexploot.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel67
  - number: '67.4'
    text: |-
      Akten, waaruit blijkt, dat het pandrecht heeft opgehouden te bestaan of krachteloos is geworden, worden in het
      rassenregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel67
  - number: '68.1'
    text: |-
      Het beslag op een kwekersrecht wordt gelegd en het proces-verbaal van inbeslagneming wordt
      in het rassenregister ingeschreven met overeenkomstige toepassing van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende executoriaal en conservatoir beslag op onroerende
      zaken, met dien verstande dat in het proces-verbaal van inbeslagneming in plaats van de aard en de ligging van de
      onroerende zaak een aanduiding van het kwekersrecht wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '68.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling of verlening van een licentie, tot stand gekomen na de
      inschrijving van het proces-verbaal, kan tegen de beslaglegger niet worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
  - number: '68.3'
    text: |-
      De vóór de inschrijving van het proces-verbaal nog niet betaalde licentievergoedingen vallen mede onder een op het
      kwekersrecht gelegd beslag, nadat het ingeschreven beslag aan de houder der licentie is betekend. Deze vergoedingen
      worden betaald aan de notaris voor wie de executie zal plaatsvinden, mits dit bij de betekening uitdrukkelijk aan
      de licentiehouder is medegedeeld, en behoudens de rechten van derden die de executant moet eerbiedigen. Hetgeen
      aan de notaris wordt betaald, wordt tot de in [artikel 69, tweede lid][ref1], bedoelde opbrengst gerekend. De
      [artikelen 475c][ref2], [476][ref3] en [478 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '476'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '478'
  - number: '68.4'
    text: 'De inschrijving van het proces-verbaal van inbeslagneming kan worden doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
  - number: 68.4.a
    text: |-
      krachtens een schriftelijke ter inschrijving aangeboden verklaring van de deurwaarder dat hij in opdracht van de
      beslaglegger het beslag opheft of dat het beslag is vervallen;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
  - number: 68.4.b
    text: |-
      krachtens een ter inschrijving aangeboden rechterlijke uitspraak die tot opheffing van het beslag strekt of het
      verval van het beslag vaststelt of meebrengt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
  - number: '68.5'
    text: |-
      De [artikelen 504a][ref1], [538-541][ref2], [726, tweede lid][ref3], en
      [727 van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn in geval van beslag op een kwekersrecht van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel504a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel538
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel726
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel727
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 504a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '538'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '726'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '727'
  - number: '69.1'
    text: |-
      De verkoop van een kwekersrecht door een pandhouder of een beslaglegger tot verhaal van een
      vordering geschiedt in het openbaar ten overstaan van een bevoegde notaris. De [artikelen 508][ref1],
      [509][ref2], [513, eerste lid][ref3], [514, tweede en derde lid][ref4], [515-519][ref5] en
      [521-529 van het Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige toepassing met dien
      verstande dat hetgeen daar ten aanzien van hypotheken en hypotheekhouders is voorgeschreven geldt voor de op het
      kwekersrecht rustende pandrechten en de pandhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel509
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel513
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel514
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel521
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '509'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '513'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '514'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '515'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '521'
  - number: '69.2'
    text: |-
      De verdeling van de opbrengst geschiedt met overeenkomstige toepassing van de
      [artikelen 551-552 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
  - number: '70.1'
    text: |-
      De houder van een kwekersrecht kan zijn recht handhaven jegens een ieder die, zonder daartoe gerechtigd te zijn,
      een van de in [artikel 57][ref1] bedoelde handelingen verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '70.2'
    text: |-
      Schadevergoeding kan slechts worden gevorderd van degene die de handelingen bewust verricht. Van bewust handelen is
      in elk geval sprake, indien de inbreuk is gepleegd nadat de betrokkene bij deurwaardersexploot op de strijd tussen
      de handelingen en het kwekersrecht is gewezen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
  - number: '70.3'
    text: |-
      In plaats van schadevergoeding kan worden gevorderd, dat de gedaagde veroordeeld wordt de door de inbreuk genoten
      winst af te dragen en dienaangaande rekening en verantwoording af te leggen; indien de rechter echter van oordeel
      is dat de omstandigheden van het geval geen aanleiding geven tot een dergelijke veroordeling, zal de rechter de
      gedaagde tot schadevergoeding kunnen veroordelen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
  - number: '70.4'
    text: |-
      De houder van een kwekersrecht kan de vorderingen tot schadevergoeding of het afdragen van winst ook namens of
      mede namens licentiehouders of pandhouders instellen, onverminderd de bevoegdheid van pandhouders in een al of
      niet namens hen door de houder van het kwekersrecht ingestelde vordering tussen te komen om rechtstreeks de door
      hen geleden schade vergoed te krijgen of zich een evenredig deel van de door de gedaagde af te dragen winst te
      doen toewijzen. Licentiehouders en pandhouders kunnen slechts een zelfstandige vordering instellen en exploot als
      bedoeld in het tweede lid met het oog daarop doen uitbrengen, als zij de bevoegdheid daartoe van de houder van het
      kwekersrecht hebben bedongen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
  - number: '70.5'
    text: |-
      De houder van het kwekersrecht heeft de bevoegdheid onttrekking aan het verkeer, vernietiging of onbruikbaarmaking
      te vorderen van roerende zaken waarmee een inbreuk op zijn recht wordt gemaakt, en onttrekking aan het verkeer te
      vorderen van materialen en werktuigen die voornamelijk zijn gebruikt bij de voortbrenging van die zaken. Bij de
      beoordeling van de vordering wordt een afweging gemaakt tussen de ernst van de inbreuk en de gevorderde maatregelen
      alsmede de belangen van derden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
  - number: '70.6'
    text: |-
      De rechter kan op vordering van de houder van het kwekersrecht degene die inbreuk op diens recht heeft gemaakt,
      bevelen al hetgeen aan laatstgenoemde bekend is omtrent de herkomst van de zaken, waarmee de inbreuk is
      gepleegd, aan de houder van het kwekersrecht mee te delen en alle daarop betrekking hebbende gegevens aan deze
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel70
  - number: '71.1'
    text: |-
      De houder van een kwekersrecht kan een redelijke vergoeding vorderen van degene die in de periode gelegen tussen
      de aanvraag van een kwekersrecht en de verlening van het kwekersrecht handelingen als bedoeld in [artikel 57][ref1]
      heeft verricht met betrekking tot het ras, waarvoor kwekersrecht is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel57
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '57'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '71.2'
    text: |-
      De vergoeding is alleen verschuldigd voor handelingen die zijn verricht na afloop van dertig dagen, nadat de
      betrokkene bij deurwaardersexploot is gewezen op de krachtens dit artikel aan de houder van een kwekersrecht
      toekomende aanspraak.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel71
  - number: '71.3'
    text: |-
      Bij het deurwaardersexploot wordt een door de Raad gewaarmerkt afschrift gevoegd van de ter zake van de aanvraag
      ingediende bescheiden dan wel van passages daaruit, voor zover zij uitsluitend betrekking hebben op de kenmerken
      van het ras waarvoor de aanvraag is ingediend en op de aanduiding van de eigenschappen waardoor het zich van
      andere rassen onderscheidt. Daartoe wordt niet gerekend de weergave van de totstandkoming van het ras of van de
      genealogische bestanddelen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel71
  - number: '71.4'
    text: |-
      Het eerste lid is niet van toepassing op de handelingen verricht door degene die daartoe is gerechtigd krachtens
      een overeenkomst met degene aan wie overeenkomstig [artikel 50][ref1] of [51][ref2] de aanspraak op verlening van
      het kwekersrecht toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel51
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '50'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '51'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '72'
    text: |-
      De duur van het kwekersrecht bedraagt vanaf de datum van dagtekening van het kwekersrecht 25 jaar, met uitzondering
      van rassen van door Onze Minister aan te wijzen gewassen, waarvoor de duur van het kwekersrecht 30 jaar bedraagt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel72
  - number: '73.1'
    text: De houder van het kwekersrecht kan daarvan afstand doen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel73
  - number: '73.2'
    text: Afstand kan slechts geschieden bij een akte, die in het rassenregister wordt ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel73
  - number: '73.3'
    text: |-
      De inschrijving geschiedt niet, zolang er personen zijn, die blijkens in dat register ingeschreven stukken
      rechten op het kwekersrecht of licenties hebben verkregen of rechtsvorderingen het kwekersrecht betreffende hebben
      ingesteld, en deze personen tot de afstand geen toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel73
  - number: '73.4'
    text: Het kwekersrecht vervalt met ingang van het tijdstip van de inschrijving van de akte in het rassenregister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel73
  - number: '74.1'
    text: |-
      Een kwekersrecht vervalt van rechtswege, zodra zes maanden zijn verstreken sinds de vergoeding, bedoeld
      [artikel 6, tweede lid, onderdeel f,][ref1] verschuldigd is geworden, zonder dat betaling daarvan heeft plaats
      gehad. Van dit vervallen wordt in het rassenregister aantekening gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel6
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '6'
        hoofdstuk: '2'
  - number: '74.2'
    text: |-
      Indien binnen veertien dagen na de vervaldag niet is betaald wordt degene, die volgens het rassenregister houder
      van het kwekersrecht is, door de Raad bij aangetekende brief aan zijn verplichting tot betaling herinnerd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel74
  - number: '74.3'
    text: |-
      Indien een maand na de vervaldag nog niet is betaald, wordt hiervan binnen veertien dagen schriftelijk mededeling
      gedaan aan allen, die blijkens in het rassenregister ingeschreven stukken rechten op het kwekersrecht of licenties
      hebben verkregen of rechtsvorderingen het kwekersrecht betreffende hebben ingesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel74
  - number: '75.1'
    text: 'Een kwekersrecht wordt door de rechter vernietigd:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: 75.1.a
    text: indien blijkt, dat het ras op het tijdstip van verlening van het kwekersrecht niet nieuw was;
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: 75.1.b
    text: |-
      indien blijkt dat het ras op het tijdstip van verlening van het kwekersrecht niet onderscheidbaar was als bedoeld
      in [artikel 49, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 75.1.c
    text: |-
      indien – in het geval dat de verlening van het kwekersrecht in hoofdzaak is gebaseerd op door de kweker verstrekte
      inlichtingen en bescheiden – blijkt dat op het tijdstip van die verlening het ras niet homogeen dan wel niet
      bestendig was als bedoeld in [artikel 49, vijfde en zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel49
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '49'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 75.1.d
    text: |-
      indien het kwekersrecht is verleend aan een persoon die daartoe ingevolge het bepaalde bij of krachtens deze wet
      niet gerechtigd is, tenzij het kwekersrecht wordt overgedragen aan de persoon die daartoe wel gerechtigd is.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: '75.2'
    text: De vernietiging kan te allen tijde door iedere belanghebbende en door of namens Onze Minister worden gevorderd.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: '75.3'
    text: De dagvaarding wordt op verzoek van de eiser in het rassenregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: '75.4'
    text: |-
      Vernietiging van een kwekersrecht ontneemt aan het kwekersrecht en aan de rechten, die daaruit zijn afgeleid, alle
      verdere rechtsgevolgen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel75
  - number: '76.1'
    text: |-
      Een kwekersrecht kan geheel of voor wat betreft een aandeel daarin worden opgeëist, voor zover het is verleend aan
      iemand, die krachtens de [artikelen 50][ref1], [51][ref2] of [52][ref3] daarop geen of niet uitsluitend aanspraak
      had.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0018040#Artikel52
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '50'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '51'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018040
        artikel: '52'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '76.2'
    text: De dagvaarding wordt op verzoek van de eiser in het rassenregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel76
  - number: '76.3'
    text: |-
      Het recht tot opeising komt toe aan hem, die krachtens voormelde artikelen aanspraak of medeaanspraak heeft op de
      verlening van het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel76
  - number: '76.4'
    text: Het recht op opeising verjaart na afloop van vijf jaren na de dagtekening van het kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel76
  - number: '76.5'
    text: |-
      Te goeder trouw voor de aantekening, bedoeld in [artikel 77, eerste lid][ref1], verkregen licenties blijven
      geldig tegenover de nieuwe houder van het kwekersrecht, die recht verkrijgt op de voor de licenties verschuldigde
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel77
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '6'
  - number: '77.1'
    text: |-
      Van de toewijzing of afwijzing van een vordering tot opeising of vernietiging van een kwekersrecht wordt
      aantekening gedaan in het rassenregister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel77
  - number: '77.2'
    text: |-
      De vernietiging en toewijzing van een opeising werken terug tot de dagtekening van de in het eerste lid bedoelde
      aantekening in het rassenregister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel77
  - number: '78.1'
    text: |-
      De rechtbank te ’s-Gravenhage is in eerste aanleg bij uitsluiting bevoegd voor vorderingen tot vernietiging en
      opeising van het kwekersrecht als bedoeld in de [artikelen 75][ref1] en [76][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel76
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '75'
        hoofdstuk: '7'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '6'
  - number: '78.2'
    text: |-
      De rechtbank te ’s-Gravenhage en de voorzieningenrechter van die rechtbank zijn in eerste aanleg bij uitsluiting
      bevoegd voor:
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel78
  - number: 78.2.a
    text: |-
      vorderingen als bedoeld in de [artikelen 70][ref1] en [71][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel71
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '70'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '5'
  - number: 78.2.b
    text: |-
      vorderingen, die worden ingesteld door een ander dan de houder van een kwekersrecht om te doen vaststellen dat
      bepaalde verrichte handelingen niet strijdig zijn met een kwekersrecht.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel78
  - number: '78.3'
    text: Van de vonnissen en beschikkingen van de rechtbank staat beroep open bij het gerechtshof te ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel78
  - number: '79.1'
    text: |-
      De deskundige leden, bedoeld in de [artikelen 55a, tweede lid][ref1], en
      [70, tweede lid, van de Wet op de rechterlijke organisatie][ref2], worden bij koninklijk besluit benoemd. Zij
      worden genoemd lid, onderscheidenlijk plaatsvervangend lid, in de rechtbank te ’s-Gravenhage dan wel raad,
      onderscheidenlijk plaatsvervangend raad, in het gerechtshof ’s-Gravenhage, al naar gelang het geval.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel55a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel70
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 55a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '70'
  - number: '79.2'
    text: |-
      De leden en de plaatsvervangende leden, onderscheidenlijk de raden en de plaatsvervangende raden, worden voor de
      tijd van vijf jaren benoemd. Zij zijn bij aftreden terstond opnieuw benoembaar. Op eigen verzoek kunnen zij bij
      koninklijk besluit worden ontslagen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel79
  - number: '79.3'
    text: |-
      Aan de leden en de plaatsvervangende leden, onderscheidenlijk de raden en de plaatsvervangende raden, wordt bij
      koninklijk besluit ontslag verleend met ingang van de eerste dag van de maand volgend op die waarin zij de leeftijd
      van zeventig jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel79
  - number: '80'
    text: |-
      Ten aanzien van de leden en plaatsvervangende leden, onderscheidenlijk de raden en
      de plaatsvervangende raden, zijn de [artikelen 46c][ref1], [46d][ref2], [46f][ref3],
      [46g, eerste en tweede lid][ref4], [46i met uitzondering van het eerste lid, onderdeel c][ref5],
      [46j][ref6], [46l, eerste en derde lid][ref7], [46m][ref8], [46o][ref9], en
      [46p, eerste tot en met vijfde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref10] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46p
  - number: '81'
    text: |-
      Onze Minister stelt regels vast over de toekenning van een vergoeding voor reis- en verblijfkosten en verdere
      vergoeding aan de leden en plaatsvervangende leden, onderscheidenlijk de raden en de plaatsvervangende raden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel81
  - number: '82'
    text: |-
      Bij de behandeling ter terechtzitting van geschillen als bedoeld in [artikel 78][ref1] mogen gemachtigden van de
      houder van een kwekersrecht het woord voeren, onverminderd de verantwoordelijkheid van de procureur.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel78
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '78'
        hoofdstuk: '7'
        paragraaf: '7'
  - number: '83'
    text: |-
      Van alle rechterlijke uitspraken betreffende een kwekersrecht wordt door de griffier binnen één maand kosteloos een
      afschrift aan de Raad gezonden.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel83
  - number: '84'
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel84
  - number: 84.a
    text: |-
      aanvragen en verzoeken die op grond van de [hoofdstukken 4 tot en met 7][ref1] bij de Raad worden ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '4'
  - number: 84.b
    text: |-
      de bepaling van het tijdstip, waarop de overeenkomstig de [hoofdstukken 4 tot en met 7][ref1] gedane aanvragen en
      verzoeken geacht worden bij de Raad te zijn ingediend en


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018040
        hoofdstuk: '4'
  - number: 84.c
    text: het horen van belanghebbenden door de Raad.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel84
  - number: '85'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van een besluit van de Raad van de
      Europese Unie, van het Europees Parlement en de Raad van de Europese Unie gezamenlijk of van de Commissie van de
      Europese Gemeenschappen, regels worden gesteld over de toelating van plantengroepen, die niet aan de vereisten
      van [artikel 35][ref1] voldoen, alsmede over het in de handel brengen van teeltmateriaal, afkomstig van die
      plantengroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel35
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '35'
        hoofdstuk: '5'
  - number: '86'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel86
  - number: '87.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: '87.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van handelsrichtlijnen regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: '87.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter implementatie van een bindende
      overeenkomst tussen de Europese Gemeenschap en een derde land of een internationale organisatie die betrekking
      heeft op een onderwerp dat wordt bestreken door een handelsrichtlijn of -verordening.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: '87.4'
    text: Bij ministeriële regeling kunnen voor een goede uitvoering van handelsverordeningen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: '87.5'
    text: |-
      Bij ministeriële regeling kunnen ter implementatie van gedelegeerde richtlijnen en gedelegeerde beschikkingen
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: '87.6'
    text: 'Bij de regels, bedoeld in het tweede tot en met vijfde lid, kunnen:'
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
  - number: 87.6.a
    text: |-
      taken worden opgedragen en bevoegdheden worden verleend aan Onze Minister, de Raad of een krachtens
      [artikel 19][ref1] aangewezen keuringsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: 87.6.b
    text: |-
      voorschriften uit een handelsverordening worden aangewezen waarop door Onze Minister aangewezen ambtenaren
      of personen toezicht houden of die Onze Minister, de Raad of een krachtens [artikel 19][ref1] aangewezen
      keuringsinstelling kunnen toepassen door besluiten te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: '88.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan medewerking worden gevorderd van het bestuur van een
      productschap of bedrijfschap als bedoeld in [artikel 66 van de Wet op de bedrijfsorganisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '88.2'
    text: |-
      Indien de van het bestuur van een bedrijfslichaam gevorderde medewerking bestaat uit het stellen van regels
      of nadere regels bij verordening, behoeft zodanige verordening de goedkeuring van Onze Minister. Krachtens de
      verordening genomen besluiten behoeven, voor zover zulks bij of krachtens algemene maatregel van bestuur is
      bepaald, de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel88
  - number: '89.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren en de bij besluit van Onze Minister aangewezen personen, werkzaam bij een krachtens
      [artikel 19][ref1] aangewezen keuringsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: '89.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel89
  - number: '90.1'
    text: |-
      Indien in enig burgerlijk- of strafgeding de beslissing afhangt van de vaststelling, als welk ras een groep van
      planten moet worden aangemerkt, wordt de Raad hierover gehoord. Het advies van de Raad bevat de gronden, waarop
      het rust.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel90
  - number: '90.2'
    text: De Raad behandelt zaken, bedoeld in het eerste lid, bij voorrang boven alle andere zaken.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel90
  - number: '93'
    text: |-
      Onze Minister is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel93
  - number: '94.1'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet in het rassenregister ingeschreven rassen worden door de Raad
      opnieuw gerangschikt overeenkomstig de bij of krachtens [artikel 25][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018040#Artikel25
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0018040
        artikel: '25'
        hoofdstuk: '4'
  - number: '94.2'
    text: |-
      De Raad draagt zorg voor de inschrijving in het rassenregister van rassen die op de dag voorafgaande aan het in het
      eerste lid bedoelde tijdstip op grond van [artikel 82 van de Zaaizaad- en Plantgoedwet][ref1] waren toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel82
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '82'
  - number: '94.3'
    text: |-
      De Raad draagt zorg voor een aantekening in het rassenregister van de toelating van rassen van
      landbouwgewassen, onderscheidenlijk bosbouwgewassen, die op de dag voorafgaande aan het in eerste
      lid bedoelde tijdstip vermeld stonden op de op grond van [artikel 73][ref1] in samenhang met de
      [artikelen 79][ref2] en [83, eerste lid, van de Zaaizaad- en Plantgoedwet][ref3] vastgestelde rassenlijst
      voor landbouwgewassen, onderscheidenlijk op de op grond van [artikel 73][ref4] in samenhang met
      [artikel 79 van de Zaaizaad- en Plantgoedwet][ref5] vastgestelde rassenlijst voor bosbouwgewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel83
      [ref4]: https://wetten.overheid.nl/BWBR0002541#Artikel73
      [ref5]: https://wetten.overheid.nl/BWBR0002541#Artikel79
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '79'
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '83'
      - id: ref4
        bwb_id: BWBR0002541
        artikel: '73'
      - id: ref5
        bwb_id: BWBR0002541
        artikel: '79'
  - number: '94.4'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij de Raad voor het Kwekersrecht aanhangige aanvragen
      en verzoeken zijn met ingang van dat tijdstip van rechtswege aanhangig bij de Raad in de staat, waarin zij
      zich op dat moment bevinden, met dien verstande dat aanvragen, die betrekking hebben op een ras als bedoeld in
      [artikel 18, eerste lid, onderdeel b, en tweede lid, van de Zaaizaad- en Plantgoedwet][ref1], worden beschouwd als
      een aanvraag voor de toelating van een ras overeenkomstig [hoofdstuk 5][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0018040
        hoofdstuk: '5'
  - number: '94.5'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet aanhangige verzoeken tot aanwijzing van groepen van planten
      als bedoeld in [artikel 82 van de Zaaizaad- en Plantgoedwet][ref1], zijn met ingang van dat tijdstip van rechtswege
      aanhangig bij de Raad en worden vanaf dat moment beschouwd als een aanvraag voor de toelating van een ras
      overeenkomstig [hoofdstuk 5][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0018040
        hoofdstuk: '5'
  - number: '94.6'
    text: |-
      Zaken die op het tijdstip van inwerkingtreding van deze wet aanhangig zijn bij de Afdeling van Beroep van de Raad
      voor het Kwekersrecht, bedoeld in [artikel 5, eerste lid, onderdeel d, van de Zaaizaad- en Plantgoedwet][ref1],
      zijn van rechtswege met ingang van dat tijdstip aanhangig bij de Raad en worden vanaf dat moment behandeld als
      een bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel5
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '5'
  - number: '94.7'
    text: |-
      Zaken die op het tijdstip van inwerkingtreding van deze wet aanhangig zijn bij de Raad van Beroep,
      onderscheidenlijk de Commissie van Beroep inzake Keuringen, van een keuringsinstelling als bedoeld in
      [artikel 88, onder 2°, onderdeel e, onderscheidenlijk g, van de Zaaizaad- en Plantgoedwet][ref1], zijn van
      rechtswege met ingang van dat tijdstip aanhangig bij de desbetreffende, overeenkomstig [artikel 19][ref2] van deze
      wet aangewezen, keuringsinstelling en worden vanaf dat moment behandeld als een bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0018040#Artikel19
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0018040
        artikel: '19'
        hoofdstuk: '3'
  - number: '94.8'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet bij de Raad voor het Kwekersrecht aanhangige
      verzoeken tot vernietiging en opeising van het kwekersrecht als bedoeld in de [artikelen 54][ref1] en
      [55 van de Zaaizaad- en Plantgoedwet][ref2], worden behandeld en beslist overeenkomstig de bepalingen van de
      Zaaizaad- en Plantgoedwet.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel55
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '54'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '55'
  - number: '94.9'
    text: |-
      De op het tijdstip van inwerkingtreding van deze wet ingevolge de [artikelen 25, tweede lid][ref1], [60][ref2] en
      [69 van de Zaaizaad- en Plantgoedwet][ref3] bij het Gerechtshof ’s- Gravenhage of de Hoge Raad aanhangige zaken
      worden behandeld en beslist overeenkomstig de bepalingen van de [Zaaizaad- en Plantgoedwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002541#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0002541#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0002541
        artikel: '60'
      - id: ref3
        bwb_id: BWBR0002541
        artikel: '69'
      - id: ref4
        bwb_id: BWBR0002541
  - number: '95'
    text: |-
      De [Zaaizaad- en Plantgoedwet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002541
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002541
  - number: '96.1'
    text: |-
      Deze wet wordt aangehaald als: Zaaizaad- en plantgoedwet, met vermelding van het jaartal van het Staatsblad waarin
      zij zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel96
  - number: '96.2'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0018040/2006-02-01#Artikel96
