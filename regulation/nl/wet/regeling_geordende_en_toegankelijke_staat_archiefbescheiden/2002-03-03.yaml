  - number: '9'
    text: |-
      1 De zorgdrager zorgt voor het vastleggen en het bewaren van tenminste de volgende gegevens:

      a. de benaming van de toepassingsprogrammatuur waarmee de digitale archiefbescheiden zijn ontvangen en opgemaakt,
      inclusief het versienummer;

      b. de beschrijving van het platform, met naam en versie van de besturingsprogrammatuur en met naam en type van
      de apparatuur;

      c. de documentatie die aangeeft hoe de toepassingsprogrammatuur heeft gewerkt met inbegrip van de nieuwere versies;

      d. een beschrijving van de opgeslagen bestanden, omvattende ten minste de volgende gegevens:

      1º. de naam van het overheidsorgaan dat de digitale archiefbescheiden heeft ontvangen en opgemaakt en de benaming
      van het werkproces waarbinnen de digitale archiefbescheiden zijn ontvangen en opgemaakt;

      2º. de benaming en omvang van elk opgeslagen bestand;

      3º. een specificatie van de digitale archiefbescheiden met begin- en einddatum;

      4º. de relatie met andere bestanden;

      5º. het opslagformaat;

      6º. in voorkomende gevallen de toegepaste compressiemethode;

      7º. de datum en het tijdstip van de opslag van het bestand op de gegevensdrager;

      8º. in geval van een database: de documentatie over de structuur, tenminste omvattende een compleet logisch
      datamodel met beschrijving van de entiteiten.

      2 Op de in het eerste lid bedoelde gegevens zijn deze regeling en de Regeling duurzaamheid archiefbescheiden van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel9
  - number: '10'
    text: |-
      1 De [artikelen 2][ref1], [4][ref2], [5][ref3], [6][ref4] en [8][ref5] zijn niet van toepassing op digitale
      archiefbescheiden in bestanden waaraan sedert 1 januari 1996 geen gegevens zijn toegevoegd of waarin sedert 1
      januari 1996 geen gegevens zijn gewijzigd.

      2 Indien een gerede kans bestaat dat als gevolg van wijziging van besturingsprogrammatuur, toepassingsapparatuur
      of apparatuur de in het eerste lid bedoelde archiefbescheiden niet binnen een redelijke termijn leesbaar of
      waarneembaar te maken zijn, zorgt de zorgdrager ervoor dat conversie dan wel migratie van die archiefbescheiden
      plaatsvindt met inachtneming van de standaarden, genoemd in [artikel 6][ref6].

      3 De zorgdrager maakt van de conversie dan wel de migratie, bedoeld in het tweede lid, een verklaring op, die
      ten minste een specificatie van de geconverteerde dan wel gemigreerde archiefbescheiden bevat en waarin tevens
      is aangegeven op welke wijze en met welk resultaat getoetst is of na de conversie of migratie de leesbaarheid of
      waarneembaarheid is gewaarborgd.

      4 Na verkregen instemming van de Minister van Onderwijs, Cultuur en Wetenschappen dan wel, indien het
      archiefbescheiden betreft voor de bewaring waarvan een andere dan een rijksarchiefbewaarplaats is aangewezen, na
      verkregen instemming van gedeputeerde staten, kunnen de [artikelen 2][ref7], [4][ref8], [5][ref9], [6][ref10]
      en [8][ref11] buiten toepassing blijven ten aanzien van sedert 1 januari 1996 ontvangen en opgemaakte digitale
      archiefbescheiden in bestanden waaraan sedert de datum van inwerkingtreding van deze regeling geen gegevens zijn
      toegevoegd of waarin sedert die datum geen gegevens zijn gewijzigd.

      5 Ten aanzien van archiefbescheiden als bedoeld in het vierde lid waarop de [artikelen 2][ref12], [4][ref13],
      [5][ref14], [6][ref15] en [8][ref16] met instemming van de Minister van Onderwijs, Cultuur en Wetenschappen dan wel
      van gedeputeerde staten niet van toepassing zijn, zijn het tweede en het derde lid van overeenkomstige toepassing.

      6 Aan de instemming, bedoeld in het vierde lid, kunnen voorwaarden worden verbonden.


