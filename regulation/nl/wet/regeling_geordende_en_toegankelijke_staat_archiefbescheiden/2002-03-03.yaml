        artikel: '13'
  - number: '7'
    text: |-
      De ordening en toegankelijkheid van digitale archiefbescheiden, zoals gerealiseerd door middel van
      toepassingsprogrammatuur, maken onverbrekelijk onderdeel uit van de archiefbescheiden waarop ze betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel7
  - number: '8'
    text: |-
      1 De zorgdrager zorgt ervoor, dat de functionele eisen ten aanzien van de inhoud, structuur en vorm, bedoeld in
      [artikel 2][ref1], worden vastgelegd.

      2 De zorgdrager zorgt voor de bewaring van de toepassingsprogrammatuur, met inbegrip van de nieuwere versies,
      voorzover dat nodig is om aan de [artikelen 2][ref2], [3][ref3] of [4][ref4] te voldoen.

      3 In voorkomende gevallen zorgt de zorgdrager ervoor dat hij beschikt over de noodzakelijke licenties met
      betrekking tot de in het tweede lid genoemde toepassingsprogrammatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0013439#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013439#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013439#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013439#Artikel4
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel8
