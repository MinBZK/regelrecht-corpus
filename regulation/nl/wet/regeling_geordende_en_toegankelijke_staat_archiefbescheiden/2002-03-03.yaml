  - number: '11'
    text: |-
      1 Op andere dan de in [artikel 10][ref1] bedoelde, bij de inwerkingtreding van dit besluit bestaande, digitale
      archiefbescheiden zijn de [artikelen 2][ref2], [4][ref3], [5][ref4] en [8, eerste lid][ref5], tot [1][ref6]
      januari 2004 niet van toepassing.

      2 Indien een gerede kans bestaat dat als gevolg van wijziging van besturingsapparatuur, toepassingsapparatuur
      of andere apparatuur, de in het eerste lid bedoelde archiefbescheiden niet binnen een redelijke termijn leesbaar
      of waarneembaar zijn, of niet langer voldaan wordt aan [artikel 3][ref7], zorgt de zorgdrager ervoor dat
      conversie dan wel migratie van de archiefbescheiden plaatsvindt met inachtneming van de standaarden, genoemd in
      [artikel 6][ref8].

      3 [Artikel 10, derde lid][ref9], is van overeenkomstige toepassing.


