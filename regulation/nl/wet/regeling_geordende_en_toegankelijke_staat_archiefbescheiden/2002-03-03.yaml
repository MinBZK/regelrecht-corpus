  - number: '6'
    text: |-
      Digitale archiefbescheiden dienen, uiterlijk op het tijdstip van overbrenging, als bedoeld in de
      [artikelen 12][ref1] en [13 van de Archiefwet 1995][ref2], te worden opgeslagen volgens de volgende standaarden:

      a. voor character sets: ASCII (ISO/IEC 8859-1) of Unicode (ISO/IEC 10646-1);

      b. voor tekstbestanden: Portable document format (PDF) of SGML dan wel XML vergezeld van een stylesheet (XSL, CSS)
      dan wel TIFF of PDF met de metadata in een XML-wrapper;

      c. voor CAD/CAM bestanden; Portable document format (PDF) en STEP (Standard for the exchange of product data) als
      metadata standaard (ISO 10303);

      d. voor images/beelden (bitmapped): Portable document format (PDF) en, indien gebruik gemaakt wordt van compressie:
      ITU T4 of ITU T6;

      e. voor databases: het oorspronkelijke opslagformaat of ASCII (flatfile, met veldscheidingstekens), vergezeld van
      documentatie bij voorkeur in XML-DTD over de structuur van de database, tenminste omvattende een compleet logisch
      datamodel met beschrijving van de entiteiten; queries dienen in de vraagtaal SQL (SQL2) te worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel13
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel6
