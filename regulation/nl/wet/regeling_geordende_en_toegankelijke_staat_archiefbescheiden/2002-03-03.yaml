  text: |-
    Gelet op artikel 12 van het Archiefbesluit 1995,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a
              archiefbeheerssysteem:

                een geheel van mensen, methoden, procedures, gegevensverzamelingen, opslag-, verwerkings- en
      communicatieapparatuur en andere middelen, bestemd tot het beheer van archiefbescheiden;



              b
               archiefbescheiden:

                archiefbescheiden als bedoeld in [artikel 12 van het Archiefbesluit 1995][ref1];



              c
              bestand:

                een geheel van gegevens in een zelfde opslagformaat;



              d
               besturingsprogrammatuur:

                de programmatuur die bestemd is ter besturing van een informatiesysteem;



              e
              conversie:

                het omzetten in of het overzetten van gegevens in een ander opslagformaat;



              f
              digitale archiefbescheiden:

                archiefbescheiden die uitsluitend met behulp van besturings- of toepassingsprogrammatuur geraadpleegd
      kunnen worden;



              g
              documentair structuurplan:

                een plan waarin is vastgelegd de wijze waarop de toegankelijkheid van archiefbescheiden is georganiseerd
      en de wijze waarop archiefbescheiden zijn ingedeeld en gerangschikt;



              h
              handeling:

                een complex van activiteiten ter vervulling van een taak of op grond van een bevoegdheid;



              i
               migratie:

                het overzetten van gegevens en toepassingsprogrammatuur naar een ander platform;



              j
              ontstaan:

                het moment dat archiefbescheiden door een overheidsorgaan worden ontvangen of opgemaakt als naar hun aard
      bestemd om daaronder te berusten;



              k
               opslagformaat:

                de code volgens welke gegevens op een gegevensdrager zijn opgeslagen;



              l
               platform:

                geheel van apparatuur en besturingsprogrammatuur waarop de toepassingsprogrammatuur werkt;



              m
              structuur:

                het logische verband tussen de elementen van een document of van een archief;



              n
               toepassingsprogrammatuur:

                de programmatuur die bestemd is voor de ondersteuning van de uitvoering van een werkproces;



              o
               vorm:

                de uiterlijke verschijning waarin de structuur en opmaak zichtbaar zijn;



              p
              werkproces:

                de uitvoering van de taak of handeling uit hoofde waarvan archiefbescheiden door een overheidsorgaan
      worden ontvangen of opgemaakt als naar hun aard bestemd om daaronder te berusten.




      2 Met de in deze regeling genoemde technische producteisen worden gelijkgesteld technische producteisen die worden
      gesteld in een andere lidstaat van de Europese Unie dan wel in een staat die partij is bij de overeenkomst inzake
      de Europese Economische Ruimte, en die ten minste een gelijkwaardige productkwaliteit waarborgen, mits daarbij een
      geldig rapport wordt overgelegd, waaruit blijkt dat de producten aan die eisen voldoen en dat rapport is opgemaakt
      door een beproevingslaboratorium dat voldoet aan NEN-EN-ISO/IEC17025.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel12
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007748
        artikel: '12'
  - number: '2'
    text: |-
      De zorgdrager zorgt ervoor dat van elk van de archiefbescheiden te allen tijde kan worden vastgesteld:

      a. de inhoud, structuur en vorm bij het ontstaan, één en ander voor zover de inhoud, structuur en vorm kenbaar
      moesten zijn voor de uitvoering van het betreffende werkproces;

      b. op welk tijdstip en uit hoofde van welke taak of handeling het door het overheidsorgaan werd ontvangen of
      opgemaakt; en

      c. de samenhang met de andere door het overheidsorgaan ontvangen en opgemaakte archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel2
  - number: '3'
    text: |-
      De zorgdrager zorgt ervoor dat de onder hem ressorterende overheidsorganen beschikken over een actueel, compleet
      en logisch samenhangend overzicht, geordend overeenkomstig het ten tijde van de vorming van het archief daarvoor
      geldende documentaire structuurplan, van:

      a. de bij dat overheidsorgaan berustende archiefbescheiden; en

      b. de bestanden waarin deze bewaard worden, met daarin tenminste de in [artikel 9][ref1] bedoelde gegevens, alsmede
      de verblijfplaats van de archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0013439#Artikel9
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013439
        artikel: '9'
        paragraaf: '3'
  - number: '4'
    text: |-
      De zorgdrager zorgt ervoor dat het archiefbeheerssysteem de toegankelijke staat van archiefbescheiden waarborgt,
      zodanig dat:

      a. elk van de archiefbescheiden binnen een redelijke termijn kan worden gevonden, hetzij aan de hand van een
      onderwerp dat in het stuk is behandeld, hetzij aan de hand van het werkproces uit hoofde waarvan het stuk is
      ontvangen of opgemaakt, hetzij aan de hand van de afzender, dan wel de datum en het nummer dat door de afzender aan
      het stuk is gegeven, hetzij aan de hand van het nummer waaronder het stuk bij het ontstaan is geregistreerd; en

      b. elk van de archiefbescheiden binnen een redelijke termijn leesbaar of waarneembaar te maken is.
    url: https://wetten.overheid.nl/BWBR0013439/2002-03-03#Artikel4
  - number: '5'
    text: |-
      1 Indien een gerede kans bestaat dat, als gevolg van wijziging van besturingsprogrammatuur,
      toepassingsprogrammatuur of andere apparatuur, niet langer voldaan kan worden aan de [artikelen 2][ref1],
      [3][ref2] en [4][ref3], zorgt de zorgdrager ervoor dat conversie dan wel migratie van digitale archiefbescheiden
      plaatsvindt.

      2 Iedere conversie of migratie van digitale archiefbescheiden die niet geschiedt met inachtneming
      van de [artikelen 2][ref4], [3][ref5] en [4][ref6], is een vervanging in de zin van
      [artikel 7 van de Archiefwet 1995][ref7].

      3 De zorgdrager maakt van de conversie of de migratie een verklaring op, die ten minste een specificatie van de
      geconverteerde of gemigreerde digitale archiefbescheiden bevat en waarin tevens is aangegeven op welke wijze en met
      welk resultaat getoetst is of na de conversie of migratie aan de [artikelen 2][ref8], [3][ref9] en [4][ref10] is
      of kan worden voldaan.


