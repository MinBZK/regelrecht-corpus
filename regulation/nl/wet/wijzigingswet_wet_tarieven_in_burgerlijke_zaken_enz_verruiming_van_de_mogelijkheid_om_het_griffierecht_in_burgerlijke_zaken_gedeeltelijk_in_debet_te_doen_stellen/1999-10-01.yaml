preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat minder draagkrachtigen in burgerlijke zaken ook na
    het verschuldigd worden van het griffierecht in bepaalde gevallen nog in aanmerking kunnen komen voor gedeeltelijke
    verlaging van het griffierecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010574/1999-10-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      [Artikel I][ref1] is niet van toepassing op verzoeken om indebetstelling van vast recht, verschuldigd voor zaken
      die op de dag waarop deze wet in werking treedt reeds twee jaar of langer geleden geëindigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010574#ArtikelI
    url: https://wetten.overheid.nl/BWBR0010574/1999-10-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0010574
        artikel: I
  - number: IV
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0010574/1999-10-01#ArtikelIV
