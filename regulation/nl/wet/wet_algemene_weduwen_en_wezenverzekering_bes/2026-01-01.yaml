        artikel: '48'
        hoofdstuk: VIII
  - number: '51'
    text: |-
      De in de [artikelen 44][ref1], [45][ref2] en [50][ref3] bedoelde strafbare feiten worden als misdrijven, de in de
      [artikelen 43, eerste en tweede lid][ref4], en [46][ref5] bedoelde strafbare feiten als overtredingen beschouwd.


