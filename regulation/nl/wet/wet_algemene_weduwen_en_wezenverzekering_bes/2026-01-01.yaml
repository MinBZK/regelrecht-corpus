  - number: '38'
    text: |-
      1 De bekendmaking van een beschikking die verband houdt met het recht op en de uitbetaling van pensioen of
      uitkering geschiedt door toezending of uitreiking aan de belanghebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid,
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede, behalve in het
      geval van een beslissing op grond van [artikel 21][ref1], waar beroep kan worden ingesteld en de termijn voor het
      instellen van beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel21
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel38
