  - number: '13'
    text: |-
      Waar in deze paragraaf wordt gesproken van pensioen wordt daaronder verstaan het weduwenpensioen en het
      wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel13
  - number: '14'
    text: |-
      1 Het pensioen wordt op aanvraag toegekend door Onze Minister door middel van een door Onze Minister beschikbaar
      gesteld aanvraagformulier.

      2 In afwijking van het bepaalde in het voorgaande lid is Onze Minister bevoegd het pensioen ambtshalve toe te
      kennen.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel14
  - number: 14a
    text: |-
      Voor de toepassing van [artikel 9, vijfde lid][ref1], [11, vierde lid][ref2], en [12, derde lid][ref3], onderwerpt
      de betrokken persoon zich op verzoek van Onze Minister aan een geneeskundig onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel9
