      - id: ref1
        bwb_id: BWBR0028387
        artikel: '19'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23'
    text: |-
      1 Het pensioen is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zover dit dient tot verhaal van onderhoud, waartoe de gerechtigde op grond van enige wettelijke
      bepaling is gehouden, niet vatbaar voor executoriaal of conservatoir beslag, noch voor faillissementsbeslag.

      2 Voor zover op grond van het eerste lid, onderdeel c, beslag wordt gelegd, mag dit niet meer bedragen dan een
      derde gedeelte van het bedrag van het pensioen.

      3 Volmacht tot ontvangst van het pensioen onder welke vorm of benaming ook, door de gerechtigde verleend is steeds
      herroepelijk.

      4 Elk beding strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel23
  - number: 23a
    text: |-
      Degene die gehouden is tot vergoeding van de schade door de weduwe, weduwnaar of wezen geleden als gevolg van het
      overlijden van de verzekerde man of vrouw, is voor het pensioen van de weduwe, weduwnaar of wezen toegekend op
      grond van deze wet aansprakelijk jegens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel23a
  - number: 23b
    text: |-
      1 Onze Minister kan een beschikking herzien dan wel intrekken indien:

      a. het niet of niet behoorlijk nakomen van een verplichting op grond van de [artikelen 35, eerste lid][ref1] en
      [37a][ref2], heeft geleid tot een te hoog of ten onrechte toegekend pensioen;

      b. ten onrechte pensioen is toegekend;

      c. het niet of niet behoorlijk nakomen van een verplichting op grond van de [artikelen 35, eerste lid][ref3] en
      [37a][ref4], ertoe leidt dat niet kan worden vastgesteld of nog recht op pensioen bestaat; of

      d. degene aan wie pensioen is toegekend, ingevolge het op grond van deze wet bepaalde, daarvoor niet of niet of
      niet meer in aanmerking komt, dan wel voor een hoger of lager pensioen in aanmerking komt.

      2 De herziening van het pensioen, die voortvloeit uit een wijziging van de omstandigheden en die een verhoging van
      dit pensioen tot gevolg heeft, gaat in op de eerste dag van de maand, volgende op de maand waarin de wijziging van
      die omstandigheden heeft plaats gevonden. Het bepaalde in [artikel 15][ref5], is van overeenkomstige toepassing.

      3 De intrekking van het pensioen of de herziening daarvan, die een verlaging van dit pensioen tot gevolg heeft,
      gaat, behoudens in bij algemene maatregel van bestuur aan te wijzen gevallen, in op de eerste dag van de maand,
      volgende op die, waarin de dag van de dagtekening van de beschikking is gelegen.

      4 De herziening van het pensioen in verband met [artikel 12a, eerste en tweede lid][ref6], gaat, in afwijking
      van het bepaalde in het tweede en derde lid, in op de dag, met ingang waarvan op grond van artikel 12a, eerste en
      tweede lid, de in de [artikelen 11, eerste en derde lid][ref7], en [12, eerste, tweede en derde lid][ref8] genoemde
      bedragen van het pensioen zijn herzien.

      5 Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister geheel of gedeeltelijk van herziening of
      intrekking afzien.

      6 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven ter uitvoering van dit artikel.


