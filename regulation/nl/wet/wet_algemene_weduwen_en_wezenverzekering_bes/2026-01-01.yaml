      1 De premie ten behoeve van deze wet wordt geheven over het inkomen, met overeenkomstige toepassing van
      de [hoofdstukken V][ref1], [VI][ref2], [VII][ref3] en [IX van de Wet inkomstenbelasting BES][ref4], de
      [hoofdstukken II][ref5], [IV][ref6] en [V van de Wet loonbelasting BES][ref7] en de [hoofdstukken I][ref8],
      [VII][ref9] en [VIII van de Belastingwet BES][ref10].

      2 Onder inkomen wordt verstaan: de belastbare som, bedoeld in
      [artikel 24, eerste lid, van de Wet inkomstenbelasting BES][ref11].

      3 Indien het inkomen meer bedraagt dan het in [artikel 24A, zevende lid, van de Wet inkomstenbelasting BES][ref12]
      genoemde bedrag, wordt over dat meerdere geen premie geheven.


