  - number: '43'
    text: |-
      Hij, die niet voldoet aan een van de verplichtingen opgelegd in de [artikelen 35][ref1] en [36][ref2] wordt
      gestraft met hechtenis van ten hoogste zes maanden of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel36
