        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '39'
    text: |-
      1 De belanghebbende kan tegen een beschikking op grond van deze wet beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1], behalve in het geval van
      een beslissing op grond van [artikel 21][ref2].

      2 Bij een beroep tegen een beschikking op grond van de [artikelen 8, eerste lid, onderdeel d][ref3], en [10a][ref4]
      is [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref5] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond van
      de [artikelen 8, eerste lid, onderdeel d][ref6], en [10a][ref7] is
      [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref8] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van [artikelen 8, eerste lid, onderdeel d][ref9], en [10a][ref10],
      kan het Gerecht, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref11],
      indien het bestuursorgaan niet voldoet aan de verplichting, bedoeld in
      [artikel 23 van de Wet administratieve rechtspraak BES][ref12], daaruit de gevolgtrekking maken die hem geraden
      voorkomt.


