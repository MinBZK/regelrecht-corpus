        bwb_id: BWBR0028459
  - number: '12'
    text: |-
      1 Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde ouderloos is geworden,
      USD 134

      per maand, indien het jonger is dan tien jaar en USD 146

      per maand indien het tien jaar of ouder, doch nog geen 15 jaar is.

      2 Het wezenpensioen bedraagt voor een kind, dat door het overlijden van de verzekerde vaderloos onderscheidenlijk
      moederloos is geworden, USD 132

      per maand, indien het jonger is dan tien jaar en USD 134

      per maand indien het tien jaar of ouder, doch nog geen 15 jaar is.

      3 Het wezenpensioen bedraagt voor een kind, bedoeld in [artikel 9, vijfde lid][ref1], USD 146

      per maand, voor zover het voldoet aan artikel 9, eerste lid, onderdelen a of b, en USD 169

      per maand, voor zover het voldoet aan [artikel 9, eerste lid, onderdelen c of d][ref2].

      [Artikel 11, vijfde en zesde lid][ref3], is van overeenkomstige toepassing op een wezenpensioen terzake van
      invaliditeit.

      4 Indien op grond van meer dan één overlijden aanspraak op wezenpensioen kan worden gemaakt, wordt het hoogste
      wezenpensioen toegekend.


