  - number: '40'
    text: |-
      1 Voor zover bij of op grond van deze wet niet anders is bepaald en in afwijking van [artikel 39][ref1] zijn ten
      aanzien van het bepaalde in [hoofdstuk 4][ref2] de voor de heffing van de inkomstenbelasting geldende bepalingen
      betreffende de rechtsmiddelen van overeenkomstige toepassing.

      2 De inspecteur beslist pas op een bezwaarschrift nadat is komen vast te staan dat geen feiten en omstandigheden
      aanwezig zijn, die tevens van belang zijn voor de heffing van inkomstenbelasting, dan wel voor zover dat wel het
      geval is, de beslissing over de heffing van de inkomstenbelasting onherroepelijk is geworden.

      3 Met betrekking tot een naheffingsaanslag, die geheel of gedeeltelijk berust op feiten, die mede tot het opleggen
      van een naheffingsaanslag in de inkomstenbelasting ten laste van belanghebbende aanleiding hebben gegeven, neemt
      de termijn voor het instellen van beroep eerst een aanvang op de datum, waarop laatstbedoelde naheffingsaanslag
      onherroepelijk is komen vast te staan.

      4 Tegen hetgeen omtrent de toepassing van [artikel 2][ref3] dezer wet, alsmede omtrent het zuiver inkomen in de zin
      van de [Wet op de inkomstenbelasting BES][ref4] voor de heffing van die belasting onherroepelijk is komen vast te
      staan, is beroep niet toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0028387#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0028387#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0028387#Artikel2
