        bwb_id: BWBR0028387
        artikel: '17'
        hoofdstuk: III
        paragraaf: '3'
  - number: '36'
    text: |-
      1 Een ieder is verplicht aan Onze Minister of aan enige vanwege Onze Minister aangewezen persoon de voor de
      uitvoering van deze wet van hem gevraagde inlichtingen te verstrekken. De door Onze Minister verlangde inlichtingen
      omvatten ten minste de naam en de voornamen van de persoon van wie de inlichtingen worden gevraagd en het
      identificatienummer dat hem op grond van [artikel 8.86, negende lid, van de Belastingwet BES][ref1] is toegekend
      dan wel van hem bekend is.

      2 De inlichtingen moeten desgevraagd schriftelijk worden verstrekt binnen een schriftelijk te stellen termijn.

      3 Een ieder is verplicht aan Onze Minister of aan enig door of vanwege Onze Minister aangewezen persoon desgevraagd
      inzage te verlenen van boeken, bescheiden, andere stukken en informatiedragers, voor zover dat nodig is ten behoeve
      van de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8.86
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel36
