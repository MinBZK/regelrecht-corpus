  - number: '53'
    text: |-
      1 Op de weduwen- en wezenpensioenen of uitkeringen waarop op grond van een pensioenregeling van een pensioenfonds
      of van een werkgever aanspraak bestaat, mogen de pensioenen, waarop op grond van deze wet aanspraak bestaat, niet
      in mindering worden gebracht.

      2 Onze Minister kan ontheffing verlenen van het in het voorgaande lid bepaalde met dien verstande, dat geen hoger
      percentage van de op grond van deze wet toegekende pensioenen in mindering mag worden gebracht dan de helft van het
      percentage, dat de bijdrage of premie van de werkgever uitmaakt van de totale premie of bijdrage voor de op grond
      van de in het eerste lid bedoelde pensioenregeling te genieten weduwen- en wezenpensioen.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel53
  - number: '55'
    text: Hetgeen overigens ter uitvoering van deze wet nodig is, wordt bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel55
  - number: '57'
    text: |-
      Alle op grond van deze wet opgemaakte of overgelegde stukken, verzoekschriften en beschikkingen zijn vrij van het
      recht van zegel en van de formaliteit van registratie.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel57
  - number: '58'
    text: 'Deze wet wordt aangehaald als: Wet algemene weduwen- en wezenverzekering BES.'
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel58
