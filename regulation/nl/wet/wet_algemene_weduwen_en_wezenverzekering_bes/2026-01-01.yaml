  - number: '15'
    text: |-
      Het pensioen gaat in op de eerste dag van de maand volgende op de maand, waarin het recht op pensioen is ontstaan,
      met dien verstande, dat het pensioen niet vroeger kan ingaan dan 12 maanden vóór de eerste dag van de maand
      volgende op de maand, waarin de aanvraag is ingediend of waarin ambtshalve toekenning heeft plaatsgevonden. Onze
      Minister kan voor bijzondere gevallen van het bepaalde in de vorige zin afwijken.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel15
  - number: '16'
    text: |-
      1 Het pensioen wordt door Onze Minister betaalbaar gesteld. De betaling geschiedt maandelijks.

      2 Onze Minister kan het aan een kind toegekende wezenpensioen betaalbaar stellen aan een ander dan degene, die het
      kind wettelijk vertegenwoordigt.

      3 In geval het pensioen in het buitenland wordt uitbetaald, kunnen de daaraan verbonden kosten van overmaking op
      het pensioen in mindering worden gebracht.

      4 Wanneer een weduwe een ander machtigt om het pensioen in ontvangst te nemen, dan wel een verleende machtiging
      intrekt, wordt daaraan gevolg gegeven met ingang van een betalingstermijn, aanvangend na de dag, waarop de
      machtiging wordt ingediend, dan wel waarop van haar intrekking mededeling wordt gedaan, doch niet later dan de
      eerste dag van de tweede maand na de dag van indiening, dan wel intrekking van de machtiging.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de betaalbaarstelling van het
      pensioen door organen, die belast zijn met de uitbetaling van pensioen uit andere hoofde dan op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel16
  - number: '17'
    text: |-
      1 Indien een op grond van deze wet gepensioneerde in een inrichting voor verpleging van geesteszieken
      en zwakzinnigen of in een instelling waar intramurale zorg wordt verleend als bedoeld in
      [artikel 2, onderdeel b tot en met g, van het Besluit zorg BES][ref1] wordt verzorgd of verpleegd en de kosten
      van verzorging of verpleging geheel of gedeeltelijk ten laste komen van dat openbare lichaam of de eerdergenoemde
      instelling, kan op verzoek van het desbetreffende orgaan het pensioen over volle kalendermaanden, gelegen binnen de
      duur van de verzorging of verpleging, voorzover het over die maanden nog niet is uitbetaald, aan het desbetreffende
      orgaan worden uitbetaald, met dien verstande dat aan dat orgaan niet meer wordt uitbetaald dan de te zijnen laste
      komende kosten van verzorging of verpleging bedragen en dat een bij ministeriële regeling in overeenstemming met de
      Minister van Volksgezondheid, Welzijn en Sport te bepalen bedrag bij de betaling aan dat orgaan buiten beschouwing
      wordt gelaten ter voorziening in de voor rekening van de gepensioneerde blijvende kosten van bestaan.

      2 Voorzover in verband met het bepaalde in het voorgaande lid het pensioen niet werd uitbetaald aan de
      gepensioneerde of diens wettelijke vertegenwoordiger, wordt het na het overlijden van de gepensioneerde voorzover
      nodig in afwijking van het in [artikel 21][ref2] bepaalde, tot en met de laatste dag van de maand, waarin het
      overlijden heeft plaats gehad, uitbetaald aan het in het voorgaande lid bedoelde orgaan.

      3 Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen Bonaire, Sint Eustatius en Saba blijkt, dat het prijsindexcijfer voor het derde kwartaal van het
      lopende jaar, vergeleken met het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen
      of gedaald, stelt Onze Minister een bedrag vast, dat met ingang van 1 januari van het komende jaar in de plaats
      treedt van het in het eerste lid bedoelde bedrag. Onze Minister bepaalt welke consumentenprijsindexcijfers voor de
      toepassing van de eerste zin worden gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden openbare
      lichamen en voor belanghebbenden die woonachtig zijn buiten de openbare lichamen, verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028387#Artikel21
