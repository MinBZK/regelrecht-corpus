        artikel: '14'
  - number: '11'
    text: |-
      1 Het weduwenpensioen per maand bedraagt voor de weduwe:

      a. jonger dan 40 jaar: USD 163

      b. van 40 tot en met 48 jaar: USD 222

      c. van 49 tot en met 57 jaar: USD 278

      d. van 58 tot de leeftijd waarop recht op ouderdomspensioen ontstaat op grond van de
      [Wet algemene ouderdomsverzekering BES][ref1]: USD 365

      2 Verhoging van het pensioenbedrag gaat in op de eerste dag van de maand volgende op die, waarin het recht op
      verhoging is ontstaan.

      3 In afwijking van het bepaalde in het eerste lid bedraagt het weduwenpensioen voor een weduwe die invalide is of
      die een of meer kinderen heeft die tot haar last komen en recht hebben op wezenpensioen, USD 365

      per maand.

      4 Een weduwe is invalide, indien zij door een ziekte of gebrek blijvend buiten staat geacht moet worden om
      met arbeid, die voor haar krachten en bekwaamheid is berekend de helft te verdienen van hetgeen lichamelijk en
      geestelijk gezonde vrouwen van soortgelijke bekwaamheid met arbeid gewoonlijk verdienen.

      5 Onze Minister trekt een weduwenpensioen, toegekend terzake van invaliditeit in met ingang van de eerste dag van
      de maand volgend op de maand, waarin de weduwe geacht wordt niet langer invalide te zijn.

      6 Onze Minister is bevoegd uitkering van weduwenpensioen voor invaliditeit te weigeren, indien de weduwe, die een
      dergelijk pensioen geniet, zonder deugdelijke grond weigert zich aan een door Onze Minister gewenst geneeskundig
      onderzoek te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0028459
    url: https://wetten.overheid.nl/BWBR0028387/2026-01-01#Artikel11
    references:
