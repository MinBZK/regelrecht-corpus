  - number: 42a
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn de daartoe bij ministeriële
      regeling aangewezen functionarissen belast.

      2 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de wijze van
      taakuitoefening van de op grond van het eerste lid aangewezen functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
